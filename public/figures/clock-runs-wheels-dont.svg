<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上排十四格全滿代表時鐘在走，下排末端三格空缺代表找車位沒有收入">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .h{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:700;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
    .k{fill:var(--card);stroke:var(--dim);stroke-width:2}
    .f{fill:var(--accent);fill-opacity:0.85;stroke:var(--accent);stroke-width:2}
    .e{fill:none;stroke:var(--warn);stroke-width:2.5;stroke-dasharray:7 5}
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="h" x="60" y="56">時鐘在走，收入沒有</text>
  <text class="b" x="514" y="126" text-anchor="middle">一天 14 小時</text>

  <text class="g" x="60" y="190">時鐘</text>
  <rect class="k" x="150" y="150" width="48" height="64" rx="6"/><rect class="k" x="202" y="150" width="48" height="64" rx="6"/><rect class="k" x="254" y="150" width="48" height="64" rx="6"/><rect class="k" x="306" y="150" width="48" height="64" rx="6"/><rect class="k" x="358" y="150" width="48" height="64" rx="6"/><rect class="k" x="410" y="150" width="48" height="64" rx="6"/><rect class="k" x="462" y="150" width="48" height="64" rx="6"/><rect class="k" x="514" y="150" width="48" height="64" rx="6"/><rect class="k" x="566" y="150" width="48" height="64" rx="6"/><rect class="k" x="618" y="150" width="48" height="64" rx="6"/><rect class="k" x="670" y="150" width="48" height="64" rx="6"/><rect class="k" x="722" y="150" width="48" height="64" rx="6"/><rect class="k" x="774" y="150" width="48" height="64" rx="6"/><rect class="k" x="826" y="150" width="48" height="64" rx="6"/>

  <text class="g" x="60" y="320">收入</text>
  <rect class="f" x="150" y="280" width="48" height="64" rx="6"/><rect class="f" x="202" y="280" width="48" height="64" rx="6"/><rect class="f" x="254" y="280" width="48" height="64" rx="6"/><rect class="f" x="306" y="280" width="48" height="64" rx="6"/><rect class="f" x="358" y="280" width="48" height="64" rx="6"/><rect class="f" x="410" y="280" width="48" height="64" rx="6"/><rect class="f" x="462" y="280" width="48" height="64" rx="6"/><rect class="f" x="514" y="280" width="48" height="64" rx="6"/><rect class="f" x="566" y="280" width="48" height="64" rx="6"/><rect class="f" x="618" y="280" width="48" height="64" rx="6"/><rect class="f" x="670" y="280" width="48" height="64" rx="6"/>
  <rect class="e" x="722" y="280" width="48" height="64" rx="6"/><rect class="e" x="774" y="280" width="48" height="64" rx="6"/><rect class="e" x="826" y="280" width="48" height="64" rx="6"/>

  <path d="M150 362 H718" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="434" y="390" text-anchor="middle">輪子在轉</text>
  <path d="M722 362 H874" stroke="var(--warn)" stroke-width="2"/>
  <text class="b" x="798" y="390" text-anchor="middle" fill="var(--warn)">找車位</text>

  <text class="c" x="480" y="464" text-anchor="middle">時鐘走，輪子沒轉</text>
</svg>
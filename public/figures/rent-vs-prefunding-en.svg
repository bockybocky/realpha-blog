<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two panels contrasting cash direction: money flows in from customers on the left, and out first to bid on the right">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; font-weight:700; }
    .box { font-size:16px; fill:var(--ink); }
    .cap { font-size:15px; fill:var(--dim); }
    .cc  { font-size:22px; fill:var(--accent); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="ttl" x="60" y="72">Who pays first</text>
<text class="cap" x="60" y="102">Both sold out, cash flows opposite ways</text>

<rect x="60" y="128" width="400" height="360" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="grp" x="88" y="168" fill="var(--accent)">Collecting rent</text>
<rect x="160" y="196" width="200" height="60" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="box" x="260" y="233" text-anchor="middle">Customer</text>
<line x1="260" y1="256" x2="260" y2="340" stroke="var(--accent)" stroke-width="3"/>
<polygon points="260,356 250,334 270,334" fill="var(--accent)"/>
<text class="cap" x="280" y="306">Prepayment · long contract</text>
<rect x="160" y="360" width="200" height="60" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="box" x="260" y="397" text-anchor="middle">Capacity</text>
<text class="cap" x="88" y="458">Money in, then build</text>

<rect x="500" y="128" width="400" height="360" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="grp" x="528" y="168" fill="var(--warn)">Fronting cash</text>
<rect x="600" y="182" width="200" height="52" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text class="box" x="700" y="215" text-anchor="middle">Own equity raise</text>
<line x1="700" y1="234" x2="700" y2="272" stroke="var(--warn)" stroke-width="3"/>
<polygon points="700,288 690,266 710,266" fill="var(--warn)"/>
<rect x="600" y="292" width="200" height="52" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text class="box" x="700" y="325" text-anchor="middle">Build first</text>
<line x1="700" y1="344" x2="700" y2="382" stroke="var(--warn)" stroke-width="3"/>
<polygon points="700,398 690,376 710,376" fill="var(--warn)"/>
<rect x="600" y="402" width="200" height="52" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text class="box" x="700" y="435" text-anchor="middle">Then you can bid</text>
<text class="cap" x="528" y="478">Money out, then queue</text>

<text class="cc" x="60" y="540">Sold out is not earning</text>
</svg>
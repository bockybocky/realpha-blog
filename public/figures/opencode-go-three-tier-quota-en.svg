<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three bars grow from short to long at 20%, 50% and 100% of the monthly allowance, standing for the 5-hour, 1-week and 1-month caps.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="80" y="76" font-size="27" font-weight="700" fill="var(--ink)">One monthly allowance, a cap in each time window</text>

<rect x="300" y="120" width="580" height="320" fill="var(--card)" stroke="var(--line)"/>
<text x="880" y="108" font-size="15" fill="var(--dim)" text-anchor="end">Grey = the whole month's allowance</text>

<text x="280" y="186" font-size="20" fill="var(--ink)" text-anchor="end">5 hours</text>
<rect x="300" y="160" width="116" height="48" fill="var(--accent)"/>
<text x="432" y="190" font-size="19" fill="var(--dim)">20%</text>

<text x="280" y="296" font-size="20" fill="var(--ink)" text-anchor="end">1 week</text>
<rect x="300" y="270" width="290" height="48" fill="var(--accent)"/>
<text x="606" y="300" font-size="19" fill="var(--dim)">50%</text>

<text x="280" y="406" font-size="20" fill="var(--ink)" text-anchor="end">1 month</text>
<rect x="300" y="380" width="580" height="48" fill="var(--accent)"/>
<text x="590" y="462" font-size="19" fill="var(--dim)" text-anchor="end">100%</text>

<text x="80" y="492" font-size="22" font-weight="700" fill="var(--ink)">Burn too fast too soon and the quota shuts the door</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The smallest slice of the bill doubles in height over a decade, with the growth coming from replacing aging equipment.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">Small slice</text>
<text class="b" x="60" y="92">CT transmission charge</text>

<line x1="140" y1="440" x2="820" y2="440" stroke="var(--line)"/>

<rect x="200" y="330" width="150" height="110" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="275" y="475" text-anchor="middle">2015</text>

<rect x="560" y="220" width="150" height="220" fill="var(--card)" stroke="var(--line)"/>
<rect x="560" y="220" width="150" height="120" fill="var(--warn)"/>
<text class="g" x="635" y="475" text-anchor="middle">Now</text>
<text class="b" x="730" y="286" fill="var(--warn)">Old swaps</text>
<text class="b" x="730" y="400" fill="var(--dim)">Other Tx</text>

<path d="M380 300 L530 240" stroke="var(--grey)" stroke-width="2" fill="none"/>
<text class="g" x="400" y="272" fill="var(--ink)">~2x</text>

<text class="c" x="60" y="528">Least, fastest</text>
</svg>
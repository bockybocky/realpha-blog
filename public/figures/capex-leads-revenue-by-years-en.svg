<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two curves over time with capital spending turning up first and revenue turning up later and more steeply, with the gap marked as eighteen months to three years.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">Orders happen first, the statements admit it later</text>

  <line x1="120" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
  <text x="900" y="446" font-size="15" fill="var(--dim)" text-anchor="end">Time</text>
  <line x1="120" y1="120" x2="120" y2="420" stroke="var(--line)" stroke-width="2"/>
  <text x="106" y="128" font-size="15" fill="var(--dim)" text-anchor="end">Size</text>

  <polyline points="140,404 240,398 300,390 380,300 460,204 540,164 640,152" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text x="652" y="150" font-size="19" fill="var(--accent)">Capex</text>

  <polyline points="140,412 300,410 440,406 520,398 620,318 740,208 880,126" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <text x="878" y="106" font-size="19" fill="var(--dim)" text-anchor="end">Revenue booked</text>

  <line x1="300" y1="464" x2="520" y2="464" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="300,464 314,457 314,471" fill="var(--warn)"/>
  <polygon points="520,464 506,457 506,471" fill="var(--warn)"/>
  <text x="410" y="494" font-size="16" fill="var(--warn)" text-anchor="middle">18 months to 3 years</text>
  <line x1="300" y1="386" x2="300" y2="456" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="520" y1="394" x2="520" y2="456" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>

  <text x="60" y="536" font-size="22" fill="var(--ink)">Observable, recordable, checkable afterwards</text>
</svg>
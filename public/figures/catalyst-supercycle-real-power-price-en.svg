<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A two-line chart in which the nominal power price climbs steadily while the real power price has hugged the flat inflation baseline for the past five years, then turns into a dashed line that bends upward in the future segment on the right.">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Years when real prices didn't move</text>

  <rect x="660" y="120" width="240" height="320" fill="var(--card)"/>
  <line x1="120" y1="440" x2="900" y2="440" stroke="var(--ink)" stroke-width="2"/>
  <line x1="120" y1="120" x2="120" y2="440" stroke="var(--ink)" stroke-width="2"/>
  <text x="96" y="132" font-size="16" fill="var(--dim)" text-anchor="end">High</text>
  <text x="96" y="436" font-size="16" fill="var(--dim)" text-anchor="end">Low</text>

  <line x1="120" y1="330" x2="900" y2="330" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="140" y="356" font-size="16" fill="var(--dim)">Inflation line</text>

  <path d="M 120 400 L 250 362 L 380 318 L 510 270 L 660 214" fill="none" stroke="var(--dim)" stroke-width="4"/>
  <text x="672" y="208" font-size="19" fill="var(--dim)">Nominal power price</text>

  <path d="M 120 342 L 250 336 L 380 334 L 510 330 L 660 328" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <path d="M 660 328 L 760 282 L 860 206" fill="none" stroke="var(--warn)" stroke-width="5" stroke-dasharray="12 10"/>
  <text x="300" y="312" font-size="19" fill="var(--accent)">Real power price</text>

  <line x1="660" y1="120" x2="660" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text x="672" y="146" font-size="19" font-weight="700" fill="var(--warn)">Worst is yet to come</text>
  <text x="672" y="174" font-size="16" fill="var(--dim)">2-3x gear cost flows to prices</text>
  <g font-size="16" fill="var(--dim)">
    <text x="300" y="470">Past 5 yrs: nominal up, real tracks inflation</text>
    <text x="672" y="470">Next</text>
  </g>
  <text x="60" y="528" font-size="22" font-weight="700" fill="var(--ink)">Once real outruns inflation, switching to electric gets delayed</text>
</svg>
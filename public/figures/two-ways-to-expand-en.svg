<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Ten equally short bars on the left represent a rising unit count, and five double-height bars on the right represent an unchanged unit count with double capacity per unit.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .n { font-size:34px; font-weight:700; fill:var(--ink); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">More units, or more per unit</text>
  <text class="b" x="60" y="94">Capacity sold, not units</text>
  <text class="g" x="60" y="148">Normal ramp</text>
  <text class="g" x="520" y="148">This time</text>
  <rect x="60" y="340" width="28" height="60" fill="var(--grey)"/>
  <rect x="96" y="340" width="28" height="60" fill="var(--grey)"/>
  <rect x="132" y="340" width="28" height="60" fill="var(--grey)"/>
  <rect x="168" y="340" width="28" height="60" fill="var(--grey)"/>
  <rect x="204" y="340" width="28" height="60" fill="var(--grey)"/>
  <rect x="240" y="340" width="28" height="60" fill="var(--grey)"/>
  <rect x="276" y="340" width="28" height="60" fill="var(--grey)"/>
  <rect x="312" y="340" width="28" height="60" fill="var(--grey)"/>
  <rect x="348" y="340" width="28" height="60" fill="var(--grey)"/>
  <rect x="384" y="340" width="28" height="60" fill="var(--grey)"/>
  <text class="b" x="60" y="325">10</text>
  <text class="b" x="60" y="428">New fabs, lines</text>
  <rect x="520" y="260" width="28" height="140" fill="var(--accent)"/>
  <rect x="556" y="260" width="28" height="140" fill="var(--accent)"/>
  <rect x="592" y="260" width="28" height="140" fill="var(--accent)"/>
  <rect x="628" y="260" width="28" height="140" fill="var(--accent)"/>
  <rect x="664" y="260" width="28" height="140" fill="var(--accent)"/>
  <text class="b" x="520" y="245">5</text>
  <text class="b" x="520" y="428">Process upgrade</text>
  <path d="M60 400 L420 400" stroke="var(--line)" stroke-width="2"/>
  <path d="M520 400 L700 400" stroke="var(--line)" stroke-width="2"/>
  <text class="c" x="60" y="500">More capacity, less space</text>
</svg>
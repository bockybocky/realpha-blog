<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一疊方塊底下有一塊顏色不同的方塊被箭頭指著">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">卡的那一格，掉到了整疊的最底下</text>
<text x="48" y="96" font-size="19" fill="var(--dim)">算力 ≈ 容量 × 頻寬</text>

<rect x="340" y="150" width="280" height="36" rx="5" fill="var(--card)" stroke="var(--line)"/>
<rect x="340" y="194" width="280" height="36" rx="5" fill="var(--card)" stroke="var(--line)"/>
<rect x="340" y="238" width="280" height="36" rx="5" fill="var(--card)" stroke="var(--line)"/>
<rect x="340" y="282" width="280" height="36" rx="5" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="216" font-size="16" fill="var(--dim)" text-anchor="middle">記憶體堆疊</text>

<rect x="340" y="336" width="280" height="52" rx="6" fill="var(--accent)" opacity="0.24"/>
<rect x="340" y="336" width="280" height="52" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="480" y="368" font-size="16" fill="var(--ink)" text-anchor="middle">邏輯基底晶片</text>

<rect x="300" y="404" width="360" height="24" rx="4" fill="var(--grey)" opacity="0.35"/>

<line x1="300" y1="150" x2="286" y2="150" stroke="var(--line)" stroke-width="2"/>
<line x1="286" y1="150" x2="286" y2="318" stroke="var(--line)" stroke-width="2"/>
<line x1="286" y1="318" x2="300" y2="318" stroke="var(--line)" stroke-width="2"/>
<text x="268" y="240" font-size="19" fill="var(--dim)" text-anchor="end">HBM</text>

<line x1="800" y1="362" x2="660" y2="362" stroke="var(--accent)" stroke-width="3"/>
<polygon points="648,362 664,355 664,369" fill="var(--accent)"/>
<text x="812" y="348" font-size="16" fill="var(--ink)">製程不同，得分開做</text>
<text x="812" y="376" font-size="16" fill="var(--accent)">速度由它決定</text>

<text x="480" y="504" font-size="22" fill="var(--ink)" text-anchor="middle">客製化 HBM 就從這一層長出來</text>
</svg>
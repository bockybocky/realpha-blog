<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The logic and memory circles overlap at the advanced base die, and an arrow pushes from the memory side toward the logic side.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">The line is melting, so this is a defensive question</text>

  <circle cx="400" cy="280" r="160" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="620" cy="280" r="160" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="192" y="200" font-size="20" fill="var(--accent)">Logic</text>
  <text x="760" y="200" font-size="20" fill="var(--warn)">Memory</text>
  <text x="208" y="290" font-size="16" fill="var(--dim)">TSMC's castle</text>
  <text x="760" y="290" font-size="16" fill="var(--dim)">Korea's turf</text>

  <text x="452" y="256" font-size="16" fill="var(--ink)">HBM4</text>
  <text x="432" y="286" font-size="16" fill="var(--ink)">Base die</text>
  <text x="440" y="316" font-size="16" fill="var(--ink)">Compute in memory</text>

  <path d="M700 420 L430 420" stroke="var(--warn)" stroke-width="4" fill="none"/>
  <path d="M430 420 l16 -10 M430 420 l16 10" stroke="var(--warn)" stroke-width="4" fill="none"/>
  <text x="700" y="464" font-size="16" fill="var(--warn)">Learning logic on base dies</text>

  <text x="48" y="512" font-size="22" fill="var(--ink)">Not whether to attack, but whether to plug this hole.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A message and three options go into Jev, which outputs three probability bars: shipping is the longest at about 90%, and the other two are very short.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<defs><marker id="f1ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker></defs>
<text x="40" y="58" font-size="27" font-weight="700">Options in, odds out</text>
<rect x="40" y="110" width="300" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="64" y="150" font-size="19" style="fill:var(--dim)">Message</text>
<rect x="64" y="168" width="252" height="56" rx="10" fill="var(--page)" stroke="var(--line)"/>
<text x="84" y="203" font-size="16">Parcel ETA?</text>
<text x="64" y="268" font-size="19" style="fill:var(--dim)">Options</text>
<rect x="64" y="286" width="110" height="40" rx="20" fill="var(--page)" stroke="var(--line)"/>
<text x="119" y="312" font-size="16" text-anchor="middle">Billing</text>
<rect x="190" y="286" width="110" height="40" rx="20" fill="var(--page)" stroke="var(--line)"/>
<text x="245" y="312" font-size="16" text-anchor="middle">Tech</text>
<rect x="64" y="340" width="110" height="40" rx="20" fill="var(--page)" stroke="var(--line)"/>
<text x="119" y="366" font-size="16" text-anchor="middle">Shipping</text>
<line x1="344" y1="270" x2="384" y2="270" stroke="var(--dim)" stroke-width="2" marker-end="url(#f1ah)"/>
<rect x="390" y="225" width="120" height="90" rx="14" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="450" y="280" font-size="26" font-weight="700" text-anchor="middle" style="fill:var(--accent)">Jev</text>
<line x1="514" y1="270" x2="560" y2="270" stroke="var(--dim)" stroke-width="2" marker-end="url(#f1ah)"/>
<text x="580" y="160" font-size="19">Shipping</text>
<rect x="580" y="172" width="320" height="36" rx="6" fill="var(--card)"/>
<rect x="580" y="172" width="294" height="36" rx="6" fill="var(--accent)"/>
<text x="884" y="198" font-size="20" font-weight="700" style="fill:var(--accent)">92%</text>
<text x="580" y="250" font-size="19">Billing</text>
<rect x="580" y="262" width="320" height="36" rx="6" fill="var(--card)"/>
<rect x="580" y="262" width="16" height="36" rx="4" fill="var(--grey)"/>
<text x="606" y="288" font-size="16" style="fill:var(--dim)">5%</text>
<text x="580" y="340" font-size="19">Tech</text>
<rect x="580" y="352" width="320" height="36" rx="6" fill="var(--card)"/>
<rect x="580" y="352" width="10" height="36" rx="4" fill="var(--grey)"/>
<text x="600" y="378" font-size="16" style="fill:var(--dim)">3%</text>
<text x="900" y="420" font-size="15" text-anchor="end" style="fill:var(--dim)">Billing, tech illustrative</text>
<text x="480" y="495" font-size="22" font-weight="700" text-anchor="middle">No text, just odds</text>
</svg>
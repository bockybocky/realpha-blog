<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three bars compared: the planned industry buildout nearly fills the width, pre-AI cloud capacity is a short stub, and next year's inference need is almost invisible.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="80" font-size="27" fill="var(--ink)">Same ruler, 3 sizes</text>
  <line x1="300" y1="150" x2="300" y2="430" stroke="var(--line)" stroke-width="2"/>
  <rect x="300" y="180" width="640" height="46" fill="var(--accent)" opacity="0.85"/>
  <text class="t" x="285" y="200" font-size="19" fill="var(--ink)" text-anchor="end">Build</text>
  <text class="t" x="285" y="222" font-size="16" fill="var(--dim)" text-anchor="end">2027–2030</text>
  <text class="t" x="300" y="167" font-size="16" fill="var(--dim)">100–110 GW</text>
  <rect x="300" y="268" width="29" height="46" fill="var(--grey)"/>
  <text class="t" x="285" y="288" font-size="19" fill="var(--ink)" text-anchor="end">Pre-AI big 3</text>
  <text class="t" x="345" y="298" font-size="16" fill="var(--dim)">5 GW</text>
  <rect x="300" y="356" width="9" height="46" fill="var(--warn)"/>
  <text class="t" x="285" y="376" font-size="19" fill="var(--ink)" text-anchor="end">All inference</text>
  <text class="t" x="285" y="398" font-size="16" fill="var(--dim)" text-anchor="end">Claim</text>
  <text class="t" x="325" y="386" font-size="16" fill="var(--warn)">1.5 GW</text>
  <text class="t" x="300" y="490" font-size="22" fill="var(--ink)">~70x gap</text>
</svg>
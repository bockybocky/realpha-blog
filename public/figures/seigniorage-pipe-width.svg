<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩支粗細懸殊的水管：瑞典鑄幣稅收入細且在縮，美元現鈔那支寬得多，下方承接同樣的虧損">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:20px;fill:var(--ink)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<marker id="sw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">吸收虧損的那條水管</text>

<text class="g" x="150" y="112">瑞典</text>
<text class="b" x="150" y="140">現鈔約 GDP 7–8%，還在縮</text>
<rect x="228" y="164" width="26" height="170" fill="var(--warn)" opacity="0.75"/>
<path d="M296 214 L266 214" stroke="var(--warn)" stroke-width="3" marker-end="url(#sw)"/>
<path d="M186 214 L216 214" stroke="var(--warn)" stroke-width="3" marker-end="url(#sw)"/>
<text class="b" x="306" y="220">開口還在往內縮</text>
<rect x="140" y="346" width="204" height="94" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="164" y="382">按市價計價虧損</text>
<text class="b" x="164" y="412">接不住，權益轉負</text>

<text class="g" x="616" y="112">美國</text>
<text class="b" x="616" y="140">美元現鈔在全世界流通</text>
<rect x="640" y="164" width="150" height="170" fill="var(--accent)" opacity="0.65"/>
<text class="b" x="806" y="220">會下金蛋的鵝</text>
<rect x="616" y="346" width="204" height="94" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="640" y="382">按市價計價虧損</text>
<text class="b" x="640" y="412">收入寬，接得住</text>

<text class="c" x="60" y="508">同樣的虧損，落進寬窄不同的水管</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two columns: the left, marked outside, has only two entries with a dashed threshold at the third; the right, marked inside, has all four filled">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.h { font-size:20px; font-weight:700; }
.b { font-size:16px; }
.c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="70" y="62">How many came from outside</text>
<rect x="140" y="110" width="300" height="52" rx="8" fill="var(--accent)"/>
<text class="h" x="165" y="145" fill="var(--page)">Outside: facts you can't move</text>
<rect x="560" y="110" width="300" height="52" rx="8" fill="var(--grey)"/>
<text class="h" x="585" y="145" fill="var(--ink)">Inside: your own</text>
<rect x="140" y="190" width="300" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="165" y="219" fill="var(--ink)">Volunteered by others</text>
<rect x="140" y="245" width="300" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="165" y="274" fill="var(--ink)">Numbers in writing</text>
<rect x="140" y="300" width="300" height="44" rx="6" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="140" y="355" width="300" height="44" rx="6" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="110" y1="352" x2="470" y2="352" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="b" x="110" y="342" fill="var(--warn)">Three</text>
<rect x="560" y="190" width="300" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="585" y="219" fill="var(--ink)">I think</text>
<rect x="560" y="245" width="300" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="585" y="274" fill="var(--ink)">What I did next</text>
<rect x="560" y="300" width="300" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="585" y="329" fill="var(--ink)">Taken as proof</text>
<rect x="560" y="355" width="300" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="585" y="384" fill="var(--ink)">Everyone says (one story)</text>
<text class="c" x="70" y="470">Under three outside: not conviction</text>
<text class="c" x="70" y="505" fill="var(--warn)">Just a smooth loop</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="往右上攀升的折線，外推虛線終點與實際落點之間有一段水平距離">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="480" y="54" text-anchor="middle" font-size="27" fill="var(--ink)">一年一個十倍</text>

<line x1="140" y1="470" x2="890" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="105" x2="140" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="118" y="290" text-anchor="middle" font-size="16" fill="var(--dim)" transform="rotate(-90 118 290)">一題要花多久</text>

<polyline points="200,430 320,360 440,290 560,220" fill="none" stroke="var(--accent)" stroke-width="3"/>
<line x1="560" y1="220" x2="800" y2="130" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 8"/>

<circle cx="200" cy="430" r="8" fill="var(--accent)"/>
<circle cx="320" cy="360" r="8" fill="var(--accent)"/>
<circle cx="440" cy="290" r="8" fill="var(--accent)"/>
<circle cx="560" cy="220" r="8" fill="var(--accent)"/>
<text x="200" y="458" text-anchor="middle" font-size="15" fill="var(--dim)">幾秒</text>
<text x="320" y="388" text-anchor="middle" font-size="15" fill="var(--dim)">一分鐘</text>
<text x="440" y="318" text-anchor="middle" font-size="15" fill="var(--dim)">十分鐘</text>
<text x="560" y="248" text-anchor="middle" font-size="15" fill="var(--dim)">一百分鐘</text>

<circle cx="800" cy="130" r="10" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="800" y="104" text-anchor="middle" font-size="16" fill="var(--accent)">原本估 2028</text>
<circle cx="660" cy="130" r="10" fill="var(--warn)"/>
<text x="660" y="104" text-anchor="middle" font-size="16" fill="var(--warn)">實際 2026</text>

<line x1="660" y1="168" x2="800" y2="168" stroke="var(--warn)" stroke-width="2"/>
<path d="M660 168 L672 162 L672 174 Z" fill="var(--warn)"/>
<path d="M800 168 L788 162 L788 174 Z" fill="var(--warn)"/>
<text x="730" y="192" text-anchor="middle" font-size="15" fill="var(--warn)">早了兩年</text>

<text x="440" y="500" text-anchor="middle" font-size="15" fill="var(--dim)">年</text>
<text x="480" y="548" text-anchor="middle" font-size="22" fill="var(--ink)">線畫對了，點還是早到</text>
</svg>
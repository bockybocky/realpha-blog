<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸上訴訟全部擠在最左邊的一小段，右邊長長一截幾乎沒有案件">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">訴訟什麼時候提出</text>

<rect x="80" y="200" width="100" height="120" fill="var(--accent)"/>
<rect x="180" y="300" width="60" height="20" fill="var(--grey)"/>
<rect x="240" y="312" width="600" height="8" fill="var(--grey)" opacity="0.5"/>
<line x1="80" y1="320" x2="880" y2="320" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="130" y="182" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">九成以上</text>
<line x1="80" y1="350" x2="180" y2="350" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="130" y="376" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">150 天</text>
<text class="t" x="130" y="400" font-size="16" fill="var(--dim)" text-anchor="middle">新法時效</text>

<line x1="180" y1="350" x2="880" y2="350" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>
<text class="t" x="530" y="376" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">剩下 5 年 7 個月</text>
<text class="t" x="530" y="400" font-size="16" fill="var(--dim)" text-anchor="middle">幾乎沒案件，但要付不確定性的錢</text>
<text class="t" x="880" y="300" font-size="16" fill="var(--dim)" text-anchor="end">舊法 6 年</text>
</svg>
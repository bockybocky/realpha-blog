<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊方框整面鋪滿灰點，右邊同樣大的方框只在目標附近聚了一小團點，其他地方空白">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">試很多次，和沒有方向感地試，不一樣</text>
<rect x="80" y="130" width="370" height="290" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="510" y="130" width="370" height="290" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--grey)">
<circle cx="120" cy="170" r="6"/><circle cx="165" cy="170" r="6"/><circle cx="210" cy="170" r="6"/><circle cx="255" cy="170" r="6"/><circle cx="300" cy="170" r="6"/><circle cx="345" cy="170" r="6"/><circle cx="390" cy="170" r="6"/>
<circle cx="120" cy="215" r="6"/><circle cx="165" cy="215" r="6"/><circle cx="210" cy="215" r="6"/><circle cx="255" cy="215" r="6"/><circle cx="300" cy="215" r="6"/><circle cx="345" cy="215" r="6"/><circle cx="390" cy="215" r="6"/>
<circle cx="120" cy="260" r="6"/><circle cx="165" cy="260" r="6"/><circle cx="210" cy="260" r="6"/><circle cx="255" cy="260" r="6"/><circle cx="300" cy="260" r="6"/><circle cx="345" cy="260" r="6"/><circle cx="390" cy="260" r="6"/>
<circle cx="120" cy="305" r="6"/><circle cx="165" cy="305" r="6"/><circle cx="210" cy="305" r="6"/><circle cx="255" cy="305" r="6"/><circle cx="345" cy="305" r="6"/><circle cx="390" cy="305" r="6"/>
<circle cx="120" cy="350" r="6"/><circle cx="165" cy="350" r="6"/><circle cx="210" cy="350" r="6"/><circle cx="255" cy="350" r="6"/><circle cx="300" cy="350" r="6"/><circle cx="345" cy="350" r="6"/><circle cx="390" cy="350" r="6"/>
<circle cx="120" cy="395" r="6"/><circle cx="165" cy="395" r="6"/><circle cx="210" cy="395" r="6"/><circle cx="255" cy="395" r="6"/><circle cx="300" cy="395" r="6"/><circle cx="345" cy="395" r="6"/><circle cx="390" cy="395" r="6"/>
</g>
<circle cx="300" cy="305" r="16" fill="none" stroke="var(--warn)" stroke-width="4"/>
<g fill="var(--accent)">
<circle cx="700" cy="265" r="6"/><circle cx="738" cy="278" r="6"/><circle cx="676" cy="296" r="6"/><circle cx="724" cy="320" r="6"/><circle cx="762" cy="302" r="6"/><circle cx="694" cy="336" r="6"/><circle cx="748" cy="352" r="6"/><circle cx="716" cy="248" r="6"/>
</g>
<circle cx="724" cy="300" r="16" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text x="265" y="454" font-size="20" fill="var(--ink)" text-anchor="middle">全部人名依序試</text>
<text x="265" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">園丁、路人也要問</text>
<text x="695" y="454" font-size="20" fill="var(--ink)" text-anchor="middle">落在有動機的那一區</text>
<text x="695" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">每次嘗試都靠近目標</text>
<text x="480" y="534" font-size="22" fill="var(--ink)" text-anchor="middle">四十幾天收口，意思是點都落在對的那一片</text>
</g>
</svg>
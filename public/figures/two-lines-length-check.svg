<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條長度差很多的橫條，下面那條明顯長，並以箭頭指向一個提示方塊">
<style>svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">哪一行寫得比較長</text>
<text x="70" y="186" font-size="20" fill="var(--ink)">它哪裡好</text>
<rect x="300" y="160" width="170" height="40" fill="var(--accent)"/>
<text x="70" y="298" font-size="20" fill="var(--ink)">其他選項更差</text>
<rect x="300" y="272" width="520" height="40" fill="var(--grey)"/>
<line x1="470" y1="146" x2="470" y2="332" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 6"/>
<text x="650" y="248" font-size="19" fill="var(--dim)" text-anchor="middle">差這麼多</text>
<line x1="820" y1="318" x2="744" y2="376" stroke="var(--grey)" stroke-width="3"/>
<polygon points="736,390 734,366 752,376" fill="var(--grey)"/>
<rect x="560" y="388" width="330" height="62" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="586" y="414" font-size="16" fill="var(--ink)">先別換</text>
<text x="586" y="438" font-size="16" fill="var(--dim)">去看第二名現在長什麼樣</text>
<text x="60" y="486" font-size="22" fill="var(--ink)">第二行長很多，先去看第二名</text>
</svg>
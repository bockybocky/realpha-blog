<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="十五米的浪高過三米的堤壩，水從牆頂漫過">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
 svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
       --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
 @media (prefers-color-scheme: dark) {
   svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
         --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
 }
 text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
 .h{font-size:27px;font-weight:700}
 .g{font-size:19px;fill:var(--dim)}
 .b{font-size:16px;fill:var(--dim)}
 .c{font-size:22px;font-weight:700}
</style>
<text class="h" x="60" y="56">堤壩按三米蓋，來的是十五米</text>
<line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="3"/>
<path d="M60,470 L60,120 Q200,60 360,130 Q480,186 560,330 L560,470 Z" fill="var(--accent)"/>
<text class="g" x="90" y="230" fill="var(--page)">順差 占 GDP 25%</text>
<text class="b" x="90" y="266" fill="var(--page)">十五米</text>
<rect x="620" y="386" width="100" height="84" fill="var(--grey)"/>
<text class="b" x="604" y="504">堤壩 三米</text>
<text class="b" x="604" y="530">沖銷與管制</text>
<path d="M560,330 Q620,340 700,372" fill="none" stroke="var(--warn)" stroke-width="5"/>
<polygon points="700,372 684,356 710,352" fill="var(--warn)"/>
<text class="b" x="740" y="340" fill="var(--warn)">漏出來的那一部分</text>
<text class="b" x="740" y="368" fill="var(--dim)">消費／公共投資／國防</text>
<text class="c" x="60" y="546">手段在小規模有用，在這個規模只決定漏去哪裡</text>
</svg>
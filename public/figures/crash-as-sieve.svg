<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="左側一群混色圓點穿過中間的篩子，右側只剩少數藍色好點子，灰色笨點子與橘色詐騙往下掉進底部。">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:600}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}.p{fill:var(--page)}
</style>
<defs>
<marker id="f4arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--dim)"/></marker>
</defs>
<text class="t" x="480" y="50" text-anchor="middle">每一次大跌，都是一次篩子</text>
<circle cx="330" cy="95" r="8" fill="var(--accent)"/><text class="d" x="346" y="101">好點子</text>
<circle cx="470" cy="95" r="8" fill="var(--grey)"/><text class="d" x="486" y="101">笨點子</text>
<circle cx="610" cy="95" r="8" fill="var(--warn)"/><text class="d" x="626" y="101">詐騙</text>
<text class="g" x="190" y="150" text-anchor="middle">過熱</text>
<circle cx="100" cy="200" r="13" fill="var(--accent)"/>
<circle cx="160" cy="185" r="13" fill="var(--grey)"/>
<circle cx="225" cy="200" r="13" fill="var(--accent)"/>
<circle cx="285" cy="190" r="13" fill="var(--grey)"/>
<circle cx="125" cy="250" r="13" fill="var(--warn)"/>
<circle cx="190" cy="245" r="13" fill="var(--grey)"/>
<circle cx="255" cy="255" r="13" fill="var(--warn)"/>
<circle cx="95" cy="305" r="13" fill="var(--grey)"/>
<circle cx="160" cy="300" r="13" fill="var(--accent)"/>
<circle cx="225" cy="310" r="13" fill="var(--grey)"/>
<circle cx="290" cy="315" r="13" fill="var(--warn)"/>
<circle cx="130" cy="360" r="13" fill="var(--warn)"/>
<circle cx="200" cy="365" r="13" fill="var(--accent)"/>
<circle cx="265" cy="365" r="13" fill="var(--grey)"/>
<line x1="320" y1="275" x2="440" y2="275" stroke="var(--dim)" stroke-width="3" marker-end="url(#f4arr)"/>
<text class="g" x="470" y="150" text-anchor="middle">大跌</text>
<rect x="452" y="170" width="36" height="210" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<line x1="456" y1="200" x2="484" y2="200" stroke="var(--dim)" stroke-width="2"/>
<line x1="456" y1="230" x2="484" y2="230" stroke="var(--dim)" stroke-width="2"/>
<line x1="456" y1="260" x2="484" y2="260" stroke="var(--dim)" stroke-width="2"/>
<line x1="456" y1="290" x2="484" y2="290" stroke="var(--dim)" stroke-width="2"/>
<line x1="456" y1="320" x2="484" y2="320" stroke="var(--dim)" stroke-width="2"/>
<line x1="456" y1="350" x2="484" y2="350" stroke="var(--dim)" stroke-width="2"/>
<line x1="500" y1="275" x2="640" y2="275" stroke="var(--accent)" stroke-width="3" marker-end="url(#f4arr)"/>
<line x1="470" y1="390" x2="470" y2="440" stroke="var(--warn)" stroke-width="3" marker-end="url(#f4arr)"/>
<text class="g" x="740" y="150" text-anchor="middle">活下來</text>
<circle cx="680" cy="200" r="13" fill="var(--accent)"/><text class="b" x="705" y="206">垃圾債</text>
<circle cx="680" cy="255" r="13" fill="var(--accent)"/><text class="b" x="705" y="261">證券化</text>
<circle cx="680" cy="310" r="13" fill="var(--accent)"/>
<circle cx="680" cy="365" r="13" fill="var(--accent)"/>
<circle cx="410" cy="480" r="13" fill="var(--warn)"/>
<circle cx="445" cy="470" r="13" fill="var(--grey)"/>
<circle cx="480" cy="482" r="13" fill="var(--warn)"/>
<circle cx="515" cy="470" r="13" fill="var(--grey)"/>
<circle cx="430" cy="510" r="13" fill="var(--grey)"/>
<circle cx="470" cy="512" r="13" fill="var(--warn)"/>
<circle cx="505" cy="508" r="13" fill="var(--grey)"/>
<text class="g" x="550" y="485">洗掉</text>
<text class="d" x="550" y="510">詐騙、笨點子</text>
<text class="c" x="480" y="578" text-anchor="middle">好點子修掉毛病，留了下來</text>
</svg>
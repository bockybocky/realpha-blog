<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="分數的分子被咬掉一口、分母被往上推，右邊結果是兩支疊加的向下箭頭">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">一件事，打在分數的兩頭</text>

<path d="M240 150 L470 150 L470 190 L430 212 L470 234 L470 250 L240 250 Z" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="330" y="212" font-size="20" fill="var(--ink)">明年獲利</text>
<path d="M520 200 L520 160" stroke="var(--warn)" stroke-width="4"/>
<path d="M508 192 L520 212 L532 192 Z" fill="var(--warn)"/>
<text x="546" y="194" font-size="19" fill="var(--warn)">被咬一口</text>

<rect x="240" y="286" width="420" height="5" fill="var(--ink)"/>

<rect x="240" y="320" width="230" height="86" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="330" y="372" font-size="20" fill="var(--ink)">折現率</text>
<path d="M520 390 L520 336" stroke="var(--warn)" stroke-width="4"/>
<path d="M508 352 L520 330 L532 352 Z" fill="var(--warn)"/>
<text x="546" y="384" font-size="19" fill="var(--warn)">被推高</text>

<path d="M700 288 L760 288" stroke="var(--line)" stroke-width="3"/>
<path d="M760 278 L782 288 L760 298 Z" fill="var(--grey)"/>
<text x="862" y="204" font-size="20" text-anchor="middle" fill="var(--ink)">估值</text>
<path d="M838 230 L838 330" stroke="var(--warn)" stroke-width="5"/>
<path d="M826 318 L838 348 L850 318 Z" fill="var(--warn)"/>
<path d="M886 230 L886 330" stroke="var(--warn)" stroke-width="5"/>
<path d="M874 318 L886 348 L898 318 Z" fill="var(--warn)"/>
<text x="862" y="388" font-size="19" text-anchor="middle" fill="var(--warn)">兩下疊在一週</text>

<text x="480" y="486" font-size="22" text-anchor="middle" fill="var(--ink)">所以跌幅大過你對單一壞消息的直覺</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩軸散點圖，橫軸廣告預算、縱軸對當地的意義，小教室在左上、連鎖在右下，生產性的尺只覆蓋右半邊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; fill:var(--ink); font-weight:700; }
    .g  { font-size:19px; fill:var(--dim); font-weight:700; }
    .b  { font-size:16px; fill:var(--ink); }
    .c  { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="40" y="54">那把尺量不到左上角</text>

  <rect x="150" y="100" width="740" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="520" y="100" width="370" height="330" fill="var(--accent)" opacity="0.08"/>
  <line x1="150" y1="430" x2="890" y2="430" stroke="var(--grey)" stroke-width="2"/>
  <line x1="150" y1="100" x2="150" y2="430" stroke="var(--grey)" stroke-width="2"/>
  <text class="g" x="150" y="464">廣告預算　小</text>
  <text class="g" x="890" y="464" text-anchor="end">大</text>
  <text class="g" x="134" y="118" text-anchor="end">高</text>
  <text class="g" x="134" y="424" text-anchor="end">低</text>
  <text class="g" x="40" y="270">對這一區</text>
  <text class="g" x="40" y="294">的意義</text>

  <circle cx="260" cy="170" r="12" fill="var(--warn)"/>
  <text class="b" x="286" y="166">陶藝教室</text>
  <text class="b" x="286" y="190">書法教室</text>
  <circle cx="760" cy="370" r="12" fill="var(--accent)"/>
  <text class="b" x="736" y="366" text-anchor="end">英語會話連鎖</text>
  <text class="g" x="700" y="134" fill="var(--accent)">生產性的尺</text>
  <text class="c" x="40" y="520">業務要跑的在右邊，雜誌該傳的在左上</text>
</svg>
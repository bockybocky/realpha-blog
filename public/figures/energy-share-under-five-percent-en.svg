<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Bar chart of frontier model spending: R&D and chips take up almost the whole bar, energy is only a narrow sliver at the far right, and that sliver is marked as the scarcest input.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="80" y="80">Where frontier model money goes</text>
<text class="b" x="80" y="112">Full bar = total spend</text>

<rect x="80" y="200" width="760" height="96" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="80" y="200" width="722" height="96" rx="6" fill="var(--accent)" opacity="0.85"/>
<rect x="802" y="200" width="38" height="96" fill="var(--warn)"/>

<text class="g" x="110" y="256" fill="var(--page)">R&amp;D staff   AI chips</text>
<line x1="821" y1="180" x2="821" y2="196" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="821" y="166" text-anchor="middle" fill="var(--warn)">Energy</text>
<text class="b" x="821" y="140" text-anchor="middle" fill="var(--warn)">Under 5%</text>

<text class="b" x="80" y="330">↑ Still within your control</text>
<text class="b" x="840" y="330" text-anchor="end" fill="var(--warn)">↑ The scarcest piece</text>

<line x1="80" y1="382" x2="880" y2="382" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="80" y="432">Can't get it, won't bid up</text>
<text class="b" x="80" y="466">Money detours to what bypasses it</text>
</svg>
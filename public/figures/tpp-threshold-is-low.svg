<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條橫條，管制門檻很短，訓練前沿模型所需穿出畫面">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t h" x="60" y="70">門檻開得低</text>
<line x1="150" y1="130" x2="150" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="150" y="190">管制門檻 1200 萬 TPP</text>
<rect x="150" y="210" width="190" height="44" fill="var(--accent)"/>
<text class="t b" x="356" y="240">約 760 顆 H100，或四櫃 GB200 NVL72</text>
<text class="t g" x="150" y="320">訓練現在這級的大模型</text>
<rect x="150" y="340" width="730" height="44" fill="var(--grey)"/>
<polygon points="880,330 940,362 880,394" fill="var(--grey)"/>
<text class="t c" x="60" y="480">低到只夠擋住先進模型，不擋日常算力</text>
</svg>
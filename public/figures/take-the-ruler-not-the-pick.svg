<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="分析往下的結論會過期，往右的四把尺可以分岔到其他產業繼續使用">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--dim); }
.b { font-size:16px; fill:var(--ink); }
.s { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="60">結論會過期，量尺可以帶走</text>

<rect x="60" y="150" width="200" height="80" rx="10" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
<text class="b" x="86" y="197">一份分析</text>

<line x1="160" y1="230" x2="160" y2="292" stroke="var(--warn)" stroke-width="2"/>
<path d="M160 300 l-6 -12 l12 0 z" fill="var(--warn)"/>
<rect x="60" y="300" width="200" height="72" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="b" x="86" y="343" fill="var(--warn)">結論</text>
<text class="s" x="86" y="404" fill="var(--warn)">會過期</text>

<line x1="266" y1="190" x2="322" y2="190" stroke="var(--accent)" stroke-width="2"/>
<path d="M330 190 l-12 -6 l0 12 z" fill="var(--accent)"/>

<rect x="330" y="140" width="250" height="230" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="356" y="180">四把尺</text>
<text class="b" x="356" y="224">投資部位</text>
<text class="b" x="356" y="264">供給截斷</text>
<text class="b" x="356" y="304">合約年份</text>
<text class="b" x="356" y="344">第三國進口</text>

<path d="M580 255 C 630 255, 630 150, 672 150" stroke="var(--accent)" stroke-width="2" fill="none"/>
<path d="M580 255 C 630 255, 630 215, 672 215" stroke="var(--accent)" stroke-width="2" fill="none"/>
<path d="M580 255 C 630 255, 630 280, 672 280" stroke="var(--accent)" stroke-width="2" fill="none"/>
<path d="M580 255 C 630 255, 630 345, 672 345" stroke="var(--accent)" stroke-width="2" fill="none"/>

<rect x="680" y="124" width="210" height="52" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="706" y="157">食品</text>
<rect x="680" y="189" width="210" height="52" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="706" y="222">營建</text>
<rect x="680" y="254" width="210" height="52" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="706" y="287">醫材</text>
<rect x="680" y="319" width="210" height="52" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="706" y="352">你的本業</text>

<text class="c" x="60" y="480">抄尺，不抄標的</text>
</svg>
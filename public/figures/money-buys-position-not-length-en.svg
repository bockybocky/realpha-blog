<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One slot jumps forward in the queue while the total length of the queue stays the same.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="h" x="60" y="58">What money buys is position</text>

  <g fill="var(--card)" stroke="var(--line)" stroke-width="2">
    <rect x="130" y="250" width="56" height="70" rx="6"/>
    <rect x="216" y="250" width="56" height="70" rx="6"/>
    <rect x="302" y="250" width="56" height="70" rx="6"/>
    <rect x="388" y="250" width="56" height="70" rx="6"/>
    <rect x="474" y="250" width="56" height="70" rx="6"/>
    <rect x="646" y="250" width="56" height="70" rx="6"/>
    <rect x="732" y="250" width="56" height="70" rx="6"/>
    <rect x="818" y="250" width="56" height="70" rx="6"/>
  </g>
  <rect x="560" y="250" width="56" height="70" rx="6" fill="var(--warn)"/>
  <rect x="216" y="250" width="56" height="70" rx="6" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="6 5"/>

  <path d="M588 244 C 520 160, 320 160, 248 240" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="244,250 236,232 256,234" fill="var(--warn)"/>
  <text class="g" x="418" y="166" text-anchor="middle" fill="var(--warn)">Pays more, cuts ahead</text>

  <text class="g" x="130" y="228">Delivery</text>
  <path d="M130 352 L130 366 L874 366 L874 352" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <text class="g" x="502" y="396" text-anchor="middle">The queue is still 18 months long</text>
  <text class="b" x="60" y="88">The schedule sits inside another company</text>
  <text class="c" x="60" y="476">Trading places buys supply, not speed</text>
</svg>
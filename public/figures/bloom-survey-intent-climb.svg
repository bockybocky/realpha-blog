<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三根遞增的柱子顯示自建電力意向從一成三升到五成，下方註明量到的是意向不是簽約">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">往上爬的那條線，量到的是意向</text>
<line x1="180" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="230" y="348" width="120" height="52" rx="4" fill="var(--grey)"/>
<text x="290" y="330" font-size="20" fill="var(--dim)" text-anchor="middle">13%</text>
<text x="290" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">2024 問</text>
<text x="290" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">2030 前</text>
<rect x="430" y="260" width="120" height="140" rx="4" fill="var(--accent)"/>
<text x="490" y="242" font-size="20" fill="var(--ink)" text-anchor="middle">35%</text>
<text x="490" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">2026 問</text>
<text x="490" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">2030 前</text>
<rect x="630" y="200" width="120" height="200" rx="4" fill="var(--accent)"/>
<text x="690" y="182" font-size="20" fill="var(--ink)" text-anchor="middle">50%</text>
<text x="690" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">2026 問</text>
<text x="690" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">2035 前</text>
<rect x="180" y="72" width="270" height="44" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="200" y="101" font-size="19" fill="var(--dim)">問卷：賣方問自己的客戶</text>
<text x="180" y="500" font-size="22" fill="var(--ink)">意向到動工，中間還隔著董事會、管線、錢</text>
</svg>
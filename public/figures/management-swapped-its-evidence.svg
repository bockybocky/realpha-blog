<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="毛利率下滑與營業利益率持平的兩條線，引用標記從下滑那條跳到持平那條">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t  { font-size:27px; font-weight:700; fill:var(--ink); }
.gd { font-size:19px; font-weight:600; fill:var(--dim); }
.ga { font-size:19px; font-weight:600; fill:var(--accent); }
.gw { font-size:19px; font-weight:600; fill:var(--warn); }
.b  { font-size:16px; fill:var(--dim); }
.c  { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="64">他換掉的是證據，不是說法</text>
<line x1="120" y1="140" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<polyline points="200,200 480,226 760,300" fill="none" stroke="var(--grey)" stroke-width="4"/>
<polyline points="200,330 480,328 760,322" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="gd" x="782" y="296">毛利率</text>
<text class="ga" x="782" y="330">營業利益率</text>
<circle cx="200" cy="200" r="9" fill="var(--warn)"/>
<circle cx="760" cy="322" r="9" fill="var(--warn)"/>
<path d="M480,238 C 560,300 660,330 744,326" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<polygon points="752,324 738,318 740,332" fill="var(--warn)"/>
<text class="gd" x="150" y="174">兩季前舉這個</text>
<text class="gw" x="520" y="392">這季改舉另一個</text>
<line x1="200" y1="430" x2="200" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="480" y1="430" x2="480" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="760" y1="430" x2="760" y2="450" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="176" y="476">兩季前</text>
<text class="b" x="464" y="476">上季</text>
<text class="b" x="744" y="476">這季</text>
<text class="c" x="60" y="524">注意他換掉的那個指標</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="A very short feedback timeline is contrasted with a very long one.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="80" y="62">AI gives options; who tells you which is right?</text>
<rect x="80" y="100" width="800" height="300" fill="var(--card)"/>
<text class="g" x="120" y="150">Write a research report</text>
<line x1="120" y1="190" x2="220" y2="190" stroke="var(--accent)" stroke-width="6"/>
<polygon points="228,190 208,181 208,199" fill="var(--accent)"/>
<text class="s" x="244" y="196">Know at once which one makes money</text>
<text class="g" x="120" y="270">Develop a drug</text>
<line x1="120" y1="310" x2="800" y2="310" stroke="var(--grey)" stroke-width="6"/>
<polygon points="808,310 788,301 788,319" fill="var(--grey)"/>
<line x1="290" y1="296" x2="290" y2="324" stroke="var(--page)" stroke-width="4"/>
<line x1="460" y1="296" x2="460" y2="324" stroke="var(--page)" stroke-width="4"/>
<line x1="630" y1="296" x2="630" y2="324" stroke="var(--page)" stroke-width="4"/>
<text class="s" x="150" y="294">Phase I</text>
<text class="s" x="320" y="294">Phase II</text>
<text class="s" x="490" y="294">Phase III</text>
<text class="s" x="660" y="294">Approval</text>
<text class="s" x="120" y="350">At least four or five years, several hundred million dollars invested, and only one ultimately succeeds</text>
<text class="c" x="80" y="452">The slower the feedback, the harder it is to prove it can truly select the winner</text>
</svg>
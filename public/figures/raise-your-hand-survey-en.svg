<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A horizontal proportion bar whose two small left segments are paying users and whose one large right segment is people who pay nothing.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">The people who raised a hand</text>
  <text class="t" x="60" y="105" font-size="16" fill="var(--dim)">Audience: senior finance managers with budget in hand</text>

  <rect x="130" y="250" width="56" height="90" fill="var(--accent)"/>
  <rect x="186" y="250" width="119" height="90" fill="var(--accent)" opacity="0.4"/>
  <rect x="305" y="250" width="525" height="90" fill="var(--grey)" opacity="0.5"/>
  <rect x="130" y="250" width="700" height="90" fill="none" stroke="var(--line)" stroke-width="2"/>

  <line x1="158" y1="250" x2="158" y2="190" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="158" y="175" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Under 10%</text>
  <text class="t" x="158" y="150" font-size="16" fill="var(--dim)" text-anchor="middle">Over NT$1,000/month</text>

  <line x1="245" y1="340" x2="245" y2="400" stroke="var(--dim)" stroke-width="2"/>
  <text class="t" x="245" y="425" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Another 10-20%</text>
  <text class="t" x="245" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">NT$500-600 plans</text>

  <text class="t" x="567" y="302" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">About 60%: pay nothing, free tier is enough</text>

  <text class="t" x="60" y="495" font-size="22" fill="var(--ink)">The power is built; no one will pay for the use case yet.</text>
</svg>
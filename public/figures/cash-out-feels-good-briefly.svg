<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一矮一高兩根柱子，右邊高出許多">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
    .big { font-size:44px; fill:var(--grey); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" class="t">換成現金，爽的只有那幾天</text>

<line x1="90" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="3"/>

<rect x="170" y="340" width="150" height="80" rx="8" fill="var(--warn)" fill-opacity="0.8"/>
<text x="170" y="320" class="g">避開的跌</text>
<text x="170" y="452" class="b">急殺那幾天</text>

<text x="440" y="400" class="big">&lt;</text>

<rect x="560" y="150" width="150" height="270" rx="8" fill="var(--accent)" fill-opacity="0.85"/>
<text x="560" y="130" class="g">錯過的漲</text>
<text x="560" y="452" class="b">沒及時把錢打回去的那一段</text>

<text x="60" y="510" class="c">少吃的那段，被錯過的那段吃掉還有找</text>
</svg>
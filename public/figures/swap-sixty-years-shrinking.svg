<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三個底部對齊的方塊由左至右明顯縮小">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="40" y="54" font-size="27" font-weight="700" fill="var(--ink)">卡了六十年的不是物理，是搬不搬得動</text>

  <line x1="40" y1="418" x2="920" y2="418" stroke="var(--line)" stroke-width="2"/>

  <rect x="60" y="128" width="300" height="290" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="80" y="176" font-size="19" font-weight="700" fill="var(--dim)">化學雷射</text>
  <text x="80" y="206" font-size="16" fill="var(--dim)">能量夠</text>
  <text x="80" y="230" font-size="16" fill="var(--dim)">整套設施像一棟樓</text>
  <text x="60" y="452" font-size="16" fill="var(--dim)">1960 年代起</text>

  <rect x="404" y="268" width="248" height="150" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="424" y="312" font-size="19" font-weight="700" fill="var(--dim)">機載雷射</text>
  <text x="424" y="342" font-size="16" fill="var(--dim)">裝上波音 747</text>
  <text x="424" y="366" font-size="16" fill="var(--dim)">後勤太重</text>
  <text x="404" y="452" font-size="16" fill="var(--dim)">2006 年收攤</text>

  <rect x="700" y="348" width="150" height="70" rx="8" fill="var(--accent)" opacity="0.18"/>
  <rect x="700" y="348" width="150" height="70" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text x="700" y="330" font-size="19" font-weight="700" fill="var(--accent)">電力雷射</text>
  <text x="700" y="390" font-size="16" fill="var(--ink)">掛在裝甲車上</text>
  <text x="700" y="452" font-size="16" fill="var(--dim)">現役</text>

  <text x="40" y="504" font-size="22" font-weight="700" fill="var(--ink)">尺寸下來了，它才走得上戰場</text>
</svg>
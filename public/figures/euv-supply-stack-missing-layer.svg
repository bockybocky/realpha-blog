<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="四層堆疊，上面兩層實線標為宣布內，最底層光罩基板是虛線，標為未出現且最先斷">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="480" y="60" text-anchor="middle">瓶頸在沒被點名的那一層</text>
<rect x="240" y="110" width="440" height="66" rx="6" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2.5"/>
<text class="g" x="460" y="151" text-anchor="middle">晶圓廠・台積電</text>
<rect x="240" y="192" width="440" height="66" rx="6" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2.5"/>
<text class="g" x="460" y="233" text-anchor="middle">曝光機・ASML</text>
<rect x="240" y="274" width="440" height="66" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="460" y="315" text-anchor="middle" style="fill:var(--dim)">光罩廠</text>
<rect x="240" y="356" width="440" height="66" rx="6" fill="var(--warn)" fill-opacity="0.1" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="9 6"/>
<text class="g" x="460" y="397" text-anchor="middle">光罩基板・日本</text>
<path d="M700 110 L716 110 L716 258 L700 258" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="730" y="191" style="fill:var(--accent)">宣布內</text>
<text class="g" x="700" y="384" style="fill:var(--warn)">未出現</text>
<text class="b" x="700" y="410" style="fill:var(--warn)">最先斷・零缺陷</text>
<text class="b" x="220" y="315" text-anchor="end">要跟著改</text>
<text class="b" x="480" y="470" text-anchor="middle">上游在下</text>
</svg>
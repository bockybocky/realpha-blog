<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Ten small bars of equal height sit above the zero line, and one deep bar below it is as long as those ten added together.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="80" y="62" font-size="27" fill="var(--ink)">What credit profits look like: like selling options</text>
<line x1="80" y1="240" x2="900" y2="240" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="212" width="40" height="28" fill="var(--accent)"/>
<rect x="160" y="212" width="40" height="28" fill="var(--accent)"/>
<rect x="210" y="212" width="40" height="28" fill="var(--accent)"/>
<rect x="260" y="212" width="40" height="28" fill="var(--accent)"/>
<rect x="310" y="212" width="40" height="28" fill="var(--accent)"/>
<rect x="360" y="212" width="40" height="28" fill="var(--accent)"/>
<rect x="410" y="212" width="40" height="28" fill="var(--accent)"/>
<rect x="460" y="212" width="40" height="28" fill="var(--accent)"/>
<rect x="510" y="212" width="40" height="28" fill="var(--accent)"/>
<rect x="560" y="212" width="40" height="28" fill="var(--accent)"/>
<rect x="700" y="240" width="140" height="280" fill="var(--warn)"/>
<text x="110" y="196" font-size="19" fill="var(--accent)">Years 1 to 10: collect premium</text>
<text x="770" y="548" font-size="19" fill="var(--warn)" text-anchor="middle">Year 11: give it all back</text>
<text x="80" y="588" font-size="22" fill="var(--ink)">Ten years of profit can be taken back in one</text>
</g>
</svg>
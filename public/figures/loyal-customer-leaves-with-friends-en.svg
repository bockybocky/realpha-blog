<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the left, the wine merchant is linked to a loyal customer and five friends; on the right, the link is cut, the customer and five friends fade into gray dashed outlines, and the merchant is left with zero people.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">Wrong one regular, lose a crowd</text>
<rect x="40" y="90" width="420" height="340" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="62" y="126" font-size="20" fill="var(--dim)">Before</text>
<rect x="70" y="250" width="100" height="56" rx="8" fill="var(--page)" stroke="var(--dim)" stroke-width="2"/>
<text x="120" y="285" text-anchor="middle" font-size="19" fill="var(--ink)">Merchant</text>
<line x1="170" y1="278" x2="266" y2="278" stroke="var(--accent)" stroke-width="3"/>
<line x1="290" y1="278" x2="370" y2="195" stroke="var(--accent)" stroke-width="1.5"/>
<line x1="290" y1="278" x2="415" y2="245" stroke="var(--accent)" stroke-width="1.5"/>
<line x1="290" y1="278" x2="420" y2="310" stroke="var(--accent)" stroke-width="1.5"/>
<line x1="290" y1="278" x2="380" y2="365" stroke="var(--accent)" stroke-width="1.5"/>
<line x1="290" y1="278" x2="325" y2="190" stroke="var(--accent)" stroke-width="1.5"/>
<circle cx="290" cy="278" r="24" fill="var(--accent)"/>
<circle cx="370" cy="195" r="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="415" cy="245" r="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="420" cy="310" r="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="380" cy="365" r="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="325" cy="190" r="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text x="290" y="328" text-anchor="middle" font-size="16" fill="var(--ink)">Regular</text>
<text x="396" y="182" font-size="15" fill="var(--dim)">Friends</text>
<text x="250" y="412" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)">1 + 5</text>
<rect x="500" y="90" width="420" height="340" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="522" y="126" font-size="20" fill="var(--dim)">After</text>
<rect x="530" y="250" width="100" height="56" rx="8" fill="var(--page)" stroke="var(--dim)" stroke-width="2"/>
<text x="580" y="285" text-anchor="middle" font-size="19" fill="var(--ink)">Merchant</text>
<line x1="630" y1="278" x2="678" y2="278" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 6"/>
<line x1="690" y1="268" x2="710" y2="288" stroke="var(--warn)" stroke-width="3"/>
<line x1="710" y1="268" x2="690" y2="288" stroke="var(--warn)" stroke-width="3"/>
<line x1="760" y1="278" x2="840" y2="195" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="760" y1="278" x2="885" y2="245" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="760" y1="278" x2="890" y2="310" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="760" y1="278" x2="850" y2="365" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="760" y1="278" x2="795" y2="190" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 5"/>
<circle cx="760" cy="278" r="24" fill="var(--card)" stroke="var(--grey)" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="840" cy="195" r="14" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="885" cy="245" r="14" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="890" cy="310" r="14" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="850" cy="365" r="14" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="795" cy="190" r="14" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 3"/>
<text x="760" y="328" text-anchor="middle" font-size="16" fill="var(--dim)">Regular</text>
<text x="866" y="182" font-size="15" fill="var(--dim)">Friends</text>
<text x="710" y="412" text-anchor="middle" font-size="20" font-weight="700" fill="var(--warn)">0 left</text>
<text x="480" y="482" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">Lose one, lose a group</text>
</svg>
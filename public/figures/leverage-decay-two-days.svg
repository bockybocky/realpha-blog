<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="震盪後兩條折線都低於起點，兩倍那條低更多">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); }
  .g { font-size:20px; fill:var(--ink); }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">漲回來，不等於回到原點</text>

<line x1="120" y1="250" x2="880" y2="250" stroke="var(--grey)" stroke-dasharray="5 5"/>
<text class="b" x="120" y="240">起點</text>

<polyline points="140,250 420,180 700,262 880,262" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="700" y="300" fill="var(--accent)">一倍 −0.25%</text>

<polyline points="140,250 420,110 700,300 880,300" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="g" x="700" y="345" fill="var(--warn)">兩倍 −1%</text>

<text class="b" x="380" y="400">漲時追買 · 跌時殺出</text>
<text class="b" x="140" y="440">一天漲</text>
<text class="b" x="420" y="440">一天跌</text>

<text class="c" x="60" y="490">損耗寫在算式裡，不在運氣裡</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條長度不同的橫條，最後一條以虛線延伸到問號">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--dim); }
    .v { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="h" x="480" y="54" text-anchor="middle">三種缺，三種長度</text>
<line x1="258" y1="110" x2="258" y2="410" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="240" y="180" text-anchor="end">缺晶片</text>
<rect x="258" y="152" width="660" height="46" fill="var(--accent)"/>
<text class="v" x="906" y="184" text-anchor="end" fill="var(--page)">以年計</text>
<text class="g" x="240" y="272" text-anchor="end">缺機台</text>
<rect x="258" y="244" width="430" height="46" fill="var(--grey)"/>
<text class="v" x="704" y="276">二十幾個月</text>
<text class="g" x="240" y="364" text-anchor="end">缺許可</text>
<rect x="258" y="336" width="150" height="46" fill="var(--warn)"/>
<path d="M408 359 L700 359" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 8"/>
<text class="v" x="716" y="368" fill="var(--warn)">幾個月，或卡到你放棄</text>
<text class="s" x="258" y="432">前兩種：等得到，排進時間就好</text>
<text class="s" x="258" y="458">第三種：再等也不會變，要改的是條件本身</text>
<text class="c" x="480" y="500" text-anchor="middle">同樣叫缺，解法差一個量級</text>
</svg>
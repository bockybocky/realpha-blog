<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two equally tall bars, both labeled 2%, are split differently inside, and one company records at retail price while the other records at cost.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
</style>
<text x="48" y="62" class="t">Same 2%, different mix</text>
<text x="912" y="62" class="d" text-anchor="end">Demo</text>
<text x="360" y="116" class="g" text-anchor="middle">2%</text>
<text x="600" y="116" class="g" text-anchor="middle">2%</text>
<rect x="300" y="130" width="120" height="150" fill="var(--accent)"/>
<rect x="300" y="280" width="120" height="150" fill="var(--grey)"/>
<rect x="540" y="130" width="120" height="225" fill="var(--accent)"/>
<rect x="540" y="355" width="120" height="75" fill="var(--grey)"/>
<line x1="300" y1="280" x2="420" y2="280" stroke="var(--page)" stroke-width="2"/>
<line x1="540" y1="355" x2="660" y2="355" stroke="var(--page)" stroke-width="2"/>
<text x="432" y="210" class="b">Theft 1</text>
<text x="432" y="360" class="b">Ops 1</text>
<text x="672" y="248" class="b">Theft 1.5</text>
<text x="672" y="398" class="b">Ops 0.5</text>
<text x="360" y="466" class="g" text-anchor="middle">Co. A</text>
<text x="600" y="466" class="g" text-anchor="middle">Co. B</text>
<text x="360" y="492" class="d" text-anchor="middle">At retail</text>
<text x="600" y="492" class="d" text-anchor="middle">At cost</text>
</svg>
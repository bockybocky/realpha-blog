cx="830" cy="452" r="11" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="3 3"/><text x="240" y="492" font-size="16px" fill="var(--dim)" text-anchor="middle" font-weight="normal">對面有人接</text><text x="720" y="492" font-size="16px" fill="var(--warn)" text-anchor="middle" font-weight="normal">接的人消失</text><text x="60" y="544" font-size="22px" fill="var(--ink)" text-anchor="start" font-weight="600">股權一樣大，兩筆帳不一樣</text></g></svg>
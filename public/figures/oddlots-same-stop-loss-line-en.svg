<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Bars of different depths are cut by the same horizontal line, and the bars that touch it change colour.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="66" font-size="27" fill="var(--ink)">Many calls, one line</text>
<line x1="280" y1="130" x2="900" y2="130" stroke="var(--line)" stroke-width="3"/>
<text x="60" y="136" font-size="16" fill="var(--dim)">Own books</text>
<rect x="300" y="130" width="24" height="44" fill="var(--grey)"/>
<rect x="336" y="130" width="24" height="96" fill="var(--grey)"/>
<rect x="372" y="130" width="24" height="28" fill="var(--grey)"/>
<rect x="408" y="130" width="24" height="200" fill="var(--warn)"/>
<rect x="444" y="130" width="24" height="72" fill="var(--grey)"/>
<rect x="480" y="130" width="24" height="150" fill="var(--grey)"/>
<rect x="516" y="130" width="24" height="36" fill="var(--grey)"/>
<rect x="552" y="130" width="24" height="188" fill="var(--warn)"/>
<rect x="588" y="130" width="24" height="112" fill="var(--grey)"/>
<rect x="624" y="130" width="24" height="60" fill="var(--grey)"/>
<rect x="660" y="130" width="24" height="206" fill="var(--warn)"/>
<rect x="696" y="130" width="24" height="86" fill="var(--grey)"/>
<rect x="732" y="130" width="24" height="134" fill="var(--grey)"/>
<rect x="768" y="130" width="24" height="182" fill="var(--warn)"/>
<rect x="804" y="130" width="24" height="52" fill="var(--grey)"/>
<rect x="840" y="130" width="24" height="104" fill="var(--grey)"/>
<line x1="280" y1="250" x2="900" y2="250" stroke="var(--dim)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="60" y="240" font-size="16" fill="var(--dim)">Down $5</text>
<text x="60" y="264" font-size="16" fill="var(--dim)">Cut 50%</text>
<line x1="280" y1="310" x2="900" y2="310" stroke="var(--warn)" stroke-width="3"/>
<text x="60" y="300" font-size="16" fill="var(--warn)">-7.5% total</text>
<text x="60" y="324" font-size="16" fill="var(--warn)">Flat and out</text>
<text x="60" y="480" font-size="22" fill="var(--ink)">Separate calls, same trigger</text>
</svg>
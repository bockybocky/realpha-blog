<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two panels compared: a line from the same starting point falls in the left panel and rises in the right">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<marker id="f2w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker>
<marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="60" font-size="27" font-weight="700" fill="var(--ink)">Same move, opposite verdict</text>

<rect x="48" y="110" width="396" height="310" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="246" y="152" font-size="19" font-weight="700" text-anchor="middle" fill="var(--dim)">Premise: growth lasts</text>
<circle cx="120" cy="220" r="8" fill="var(--ink)"/>
<text x="120" y="200" font-size="16" text-anchor="middle" fill="var(--ink)">Stop first</text>
<path d="M132 228 L390 366" fill="none" stroke="var(--warn)" stroke-width="4" marker-end="url(#f2w)"/>
<text x="246" y="398" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">Punished</text>

<line x1="480" y1="120" x2="480" y2="410" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="480" y="92" font-size="19" font-weight="700" text-anchor="middle" fill="var(--dim)">Premise flips</text>

<rect x="516" y="110" width="396" height="310" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="714" y="152" font-size="19" font-weight="700" text-anchor="middle" fill="var(--dim)">Premise: doubt payoff</text>
<circle cx="588" cy="366" r="8" fill="var(--ink)"/>
<text x="588" y="392" font-size="16" text-anchor="middle" fill="var(--ink)">Stop first</text>
<path d="M600 358 L858 220" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#f2a)"/>
<text x="740" y="200" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">Rewarded</text>

<text x="480" y="478" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">Belief decides punish or reward</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three falling lines split from the same starting point; the highly leveraged line has a vertical drop and falls the deepest.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="68">Same selloff</text>
  <circle cx="130" cy="150" r="9" fill="var(--ink)"/>
  <text class="b" x="100" y="128">Same day</text>
  <polyline points="130,150 300,190 480,225 660,250 860,270" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <text class="g" x="690" y="250" fill="var(--accent)">Stable positioning</text>
  <polyline points="130,150 300,215 480,275 660,320 860,350" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <text class="g" x="690" y="335" fill="var(--grey)">Index</text>
  <polyline points="130,150 300,250 420,310 430,430 660,455 860,470" fill="none" stroke="var(--warn)" stroke-width="5"/>
  <text class="g" x="690" y="452" fill="var(--warn)">Highly leveraged</text>
  <text class="b" x="440" y="385">Forced selling</text>
  <text class="c" x="60" y="518">First see who is forced to sell</text>
</svg>
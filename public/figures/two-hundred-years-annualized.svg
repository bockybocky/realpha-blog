<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三段年化區塊高度相近且都不高，橫跨很長的時間軸，末端得到極大的結果">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="64" font-size="27" fill="var(--ink)">兩百億的背後，是一個很慢的數字</text>

  <text class="t" x="700" y="118" font-size="22" fill="var(--accent)">$200 億</text>

  <rect x="80" y="232" width="352" height="68" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="432" y="187" width="353" height="113" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="785" y="227" width="95" height="73" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="256" y="275" font-size="19" fill="var(--ink)" text-anchor="middle">6.8%</text>
  <text class="t" x="608" y="275" font-size="19" fill="var(--ink)" text-anchor="middle">11.3%</text>
  <text class="t" x="832" y="275" font-size="19" fill="var(--ink)" text-anchor="middle">7.3%</text>

  <line x1="80" y1="212" x2="880" y2="212" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="t" x="880" y="200" font-size="16" fill="var(--accent)" text-anchor="end">平均 8.8%</text>

  <line x1="60" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="80" y="330" font-size="15" fill="var(--dim)">1799</text>
  <text class="t" x="432" y="330" font-size="15" fill="var(--dim)">1899</text>
  <text class="t" x="785" y="330" font-size="15" fill="var(--dim)">1999</text>
  <text class="t" x="880" y="330" font-size="15" fill="var(--dim)" text-anchor="end">今天</text>
  <text class="t" x="80" y="358" font-size="16" fill="var(--dim)">$100 起步</text>

  <text class="t" x="60" y="470" font-size="22" fill="var(--ink)">稀缺的是 227 年沒被打斷</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Five dots spread at different heights on the left and five dots sitting almost on one horizontal line on the right">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">The gap collapsed</text>
<line x1="140" y1="140" x2="140" y2="410" stroke="var(--line)" stroke-width="2"/>
<line x1="240" y1="170" x2="700" y2="272" stroke="var(--line)" stroke-width="2"/>
<line x1="240" y1="222" x2="700" y2="284" stroke="var(--line)" stroke-width="2"/>
<line x1="240" y1="284" x2="700" y2="296" stroke="var(--line)" stroke-width="2"/>
<line x1="240" y1="342" x2="700" y2="308" stroke="var(--line)" stroke-width="2"/>
<line x1="240" y1="396" x2="700" y2="320" stroke="var(--line)" stroke-width="2"/>
<circle cx="240" cy="170" r="10" fill="var(--grey)"/>
<circle cx="240" cy="222" r="10" fill="var(--grey)"/>
<circle cx="240" cy="284" r="10" fill="var(--grey)"/>
<circle cx="240" cy="342" r="10" fill="var(--grey)"/>
<circle cx="240" cy="396" r="10" fill="var(--grey)"/>
<circle cx="700" cy="272" r="10" fill="var(--accent)"/>
<circle cx="700" cy="284" r="10" fill="var(--accent)"/>
<circle cx="700" cy="296" r="10" fill="var(--accent)"/>
<circle cx="700" cy="308" r="10" fill="var(--accent)"/>
<circle cx="700" cy="320" r="10" fill="var(--accent)"/>
<text x="240" y="446" font-size="19" fill="var(--dim)" text-anchor="middle">Before: 10 to 12%</text>
<text x="700" y="446" font-size="19" fill="var(--accent)" text-anchor="middle">Now: one or two points</text>
<text x="480" y="496" font-size="22" fill="var(--ink)" text-anchor="middle">Nobody can tell them apart, and everybody thinks they can</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊三根高柱、右邊十幾根矮柱鋪滿，兩邊總面積相當，中間有箭頭連接">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">風險沒有消失，它換了形狀</text>
<rect x="140" y="180" width="50" height="220" fill="var(--warn)"/>
<rect x="212" y="212" width="50" height="188" fill="var(--warn)"/>
<rect x="284" y="160" width="50" height="240" fill="var(--warn)"/>
<line x1="70" y1="400" x2="440" y2="400" stroke="var(--line)" stroke-width="3"/>
<text x="255" y="442" font-size="19" fill="var(--dim)" text-anchor="middle">少數人賠很多</text>
<line x1="452" y1="330" x2="508" y2="330" stroke="var(--dim)" stroke-width="3"/>
<polygon points="520,330 504,323 504,337" fill="var(--dim)"/>
<text x="486" y="310" font-size="16" fill="var(--dim)" text-anchor="middle">分散</text>
<rect x="545" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="567" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="589" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="611" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="633" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="655" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="677" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="699" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="721" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="743" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="765" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="787" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="809" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="831" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="853" y="355" width="14" height="45" fill="var(--accent)"/>
<rect x="875" y="355" width="14" height="45" fill="var(--accent)"/>
<line x1="530" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="3"/>
<text x="715" y="442" font-size="19" fill="var(--dim)" text-anchor="middle">所有人賠一點</text>
<text x="480" y="500" font-size="22" fill="var(--ink)" text-anchor="middle">分散換掉的是形狀，不是總量</text>
</svg>
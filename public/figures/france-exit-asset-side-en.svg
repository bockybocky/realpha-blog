<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A normal bar on the left, and on the right two groups of bars shrunk to about half and under three tenths.">
<style>svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Exit bill sits on assets</text>
<rect x="60" y="100" width="290" height="380" fill="var(--card)"/>
<text x="86" y="140" font-size="20" fill="var(--ink)">Liability</text>
<text x="86" y="166" font-size="16" fill="var(--dim)">Tough</text>
<rect x="86" y="230" width="230" height="46" fill="var(--grey)"/>
<text x="86" y="306" font-size="16" fill="var(--dim)">Redenominate</text>
<rect x="390" y="100" width="510" height="380" fill="var(--card)"/>
<text x="416" y="140" font-size="20" fill="var(--ink)">Assets</text>
<text x="416" y="166" font-size="16" fill="var(--warn)">Can't</text>
<text x="416" y="226" font-size="16" fill="var(--dim)">Bonds</text>
<rect x="500" y="206" width="330" height="30" fill="var(--grey)"/>
<rect x="500" y="248" width="165" height="30" fill="var(--accent)"/>
<text x="676" y="271" font-size="16" fill="var(--accent)">Worth 50</text>
<text x="416" y="358" font-size="16" fill="var(--dim)">Funds</text>
<rect x="500" y="338" width="330" height="30" fill="var(--grey)"/>
<rect x="500" y="380" width="80" height="30" fill="var(--warn)"/>
<text x="592" y="403" font-size="16" fill="var(--warn)">20–30%</text>
<text x="876" y="446" font-size="16" fill="var(--dim)" text-anchor="end">And overnight</text>
<text x="60" y="560" font-size="22" fill="var(--ink)">Lost slice = pension and bank money</text>
</svg>
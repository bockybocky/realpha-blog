<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三段式橫向時間軸，位置標記停在第一段的尾端">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="80" y="60" font-size="27" fill="var(--ink)">邊疆走到第幾段</text>

  <rect x="80" y="240" width="266" height="70" rx="8" fill="var(--accent)" opacity="0.18"/>
  <rect x="348" y="240" width="266" height="70" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <rect x="616" y="240" width="266" height="70" rx="8" fill="var(--card)" stroke="var(--line)"/>

  <text x="213" y="283" font-size="20" fill="var(--accent)" text-anchor="middle">探險</text>
  <text x="481" y="283" font-size="20" fill="var(--dim)" text-anchor="middle">常駐</text>
  <text x="749" y="283" font-size="20" fill="var(--dim)" text-anchor="middle">新產業</text>

  <text x="213" y="212" font-size="16" fill="var(--dim)" text-anchor="middle">單一高價值理由</text>
  <text x="481" y="212" font-size="16" fill="var(--dim)" text-anchor="middle">到達成本降下來</text>
  <text x="749" y="212" font-size="16" fill="var(--dim)" text-anchor="middle">本來不存在的工作</text>

  <text x="213" y="356" font-size="16" fill="var(--dim)" text-anchor="middle">毛皮｜偵察衛星</text>
  <text x="481" y="356" font-size="16" fill="var(--dim)" text-anchor="middle">鐵路｜可重複使用火箭</text>
  <text x="749" y="356" font-size="16" fill="var(--dim)" text-anchor="middle">每天去看一次電纜</text>

  <line x1="80" y1="400" x2="882" y2="400" stroke="var(--line)" stroke-width="2"/>
  <circle cx="330" cy="400" r="11" fill="var(--accent)"/>
  <text x="330" y="438" font-size="19" fill="var(--accent)" text-anchor="middle">海軍｜離岸風電在付錢</text>

  <text x="80" y="486" font-size="22" fill="var(--ink)">看補給，不看願景</text>
</svg>
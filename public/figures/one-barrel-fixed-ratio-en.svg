<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A barrel-shaped block is cut into two parts: the smaller part on top is diesel and jet fuel, the larger part below is the bulk of the barrel that is not earning the money you want, and an arrow on the right points to run rates coming down.">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px}
    .b{font-size:15px;fill:var(--dim)}
    .c{font-size:22px}
  </style>
  <text class="t" x="40" y="58">One barrel in, the ratios are fixed</text>
  <rect x="140" y="130" width="220" height="330" rx="18" fill="var(--card)" stroke="var(--line)"/>
  <rect x="140" y="130" width="220" height="95" fill="var(--warn)" fill-opacity="0.9"/>
  <rect x="140" y="225" width="220" height="235" fill="var(--grey)" fill-opacity="0.5"/>
  <line x1="140" y1="225" x2="360" y2="225" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="162" y="178" fill="var(--page)">Diesel / jet fuel</text>
  <text class="b" x="162" y="204" fill="var(--page)">Cracks above $160</text>
  <text class="g" x="162" y="286">The bulk of the barrel</text>
  <text class="b" x="162" y="312">Not earning what you want now</text>
  <line x1="380" y1="300" x2="430" y2="300" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="430,292 430,308 444,300" fill="var(--dim)"/>
  <text class="g" x="464" y="292">Run rates down</text>
  <text class="b" x="464" y="320">Even with strong diesel cracks</text>
  <text class="g" x="464" y="382">Maintenance keeps slipping</text>
  <text class="b" x="464" y="410">Harder to add output later</text>
  <text class="b" x="140" y="502">Gasoline cracks back to pre-war levels (off-season)</text>
  <text class="c" x="40" y="538">Fixed ratios bind the whole barrel's economics</text>
</svg>
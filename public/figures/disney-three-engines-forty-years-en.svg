<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three equal-length bars show the profit mix in 1984, 2010 and 2026: almost all parks and consumer products, then nearly half cable channels, then nearly sixty percent parks and cruises.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .y { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .i { font-size:16px; fill:var(--page); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">Forty years, three engines</text>
  <text class="b" x="60" y="92">Each bar = that year's entire operating profit</text>

  <text class="y" x="200" y="168" text-anchor="end">1984</text>
  <rect x="220" y="140" width="614" height="52" fill="var(--accent)"/>
  <rect x="834" y="140" width="6" height="52" fill="var(--grey)"/>
  <text class="i" x="240" y="173">Parks and consumer products</text>
  <text class="b" x="220" y="216">Film and TV: just $2 million</text>

  <text class="y" x="200" y="288" text-anchor="end">2010</text>
  <rect x="220" y="260" width="310" height="52" fill="var(--accent)" opacity="0.5"/>
  <rect x="530" y="260" width="310" height="52" fill="var(--grey)" opacity="0.45"/>
  <text class="i" x="240" y="293">Cable channels</text>
  <text class="b" x="550" y="293">Everything else</text>
  <text class="b" x="220" y="336">ESPN came with ABC, unforeseen</text>

  <text class="y" x="200" y="408" text-anchor="end">2026</text>
  <rect x="220" y="380" width="372" height="52" fill="var(--accent)"/>
  <rect x="592" y="380" width="248" height="52" fill="var(--grey)" opacity="0.45"/>
  <text class="i" x="240" y="413">Parks and cruises</text>
  <text class="b" x="612" y="413">Everything else</text>
  <text class="b" x="220" y="456">Theatrical is 3% of the company</text>

  <text class="c" x="60" y="516">Same ticker, different business</text>
</svg>
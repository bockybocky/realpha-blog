<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一根柱子被一條水平線攔腰切開，線以下是實心的可交付部分，線以上是虛線框住的交付不了的部分，另一條更低的虛線標著原本的市場共識">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--ink); }
.d { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">從需求故事，變成產能故事</text>
<rect x="280" y="110" width="200" height="120" fill="none" stroke="var(--grey)" stroke-width="2.5" stroke-dasharray="8 6"/>
<rect x="280" y="230" width="200" height="210" fill="var(--accent)"/>
<line x1="180" y1="440" x2="800" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="180" y1="230" x2="800" y2="230" stroke="var(--accent)" stroke-width="3"/>
<line x1="180" y1="310" x2="800" y2="310" stroke="var(--dim)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="g" x="812" y="224" fill="var(--accent)">可交付 70%</text>
<text class="d" x="812" y="316">原本共識 44%</text>
<text class="g" x="512" y="176">需求遠不只如此</text>
<line x1="500" y1="160" x2="500" y2="120" stroke="var(--grey)" stroke-width="2"/>
<polygon points="500,110 493,126 507,126" fill="var(--grey)"/>
<text class="d" x="380" y="468" text-anchor="middle">下一年營收成長</text>
<text class="c" x="60" y="510">受益的人，比說故事的人更靠上游</text>
</svg>
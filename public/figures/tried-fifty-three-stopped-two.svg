<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="二十三格與五十三格的點陣對照，後者只有兩格被標成停掉">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="68">試得起，所以試得多</text>

  <text class="g" x="60" y="128">十年前</text>
  <g fill="var(--grey)">
    <rect x="60" y="150" width="34" height="34" rx="4"/><rect x="104" y="150" width="34" height="34" rx="4"/><rect x="148" y="150" width="34" height="34" rx="4"/><rect x="192" y="150" width="34" height="34" rx="4"/><rect x="236" y="150" width="34" height="34" rx="4"/><rect x="280" y="150" width="34" height="34" rx="4"/><rect x="324" y="150" width="34" height="34" rx="4"/><rect x="368" y="150" width="34" height="34" rx="4"/>
    <rect x="60" y="194" width="34" height="34" rx="4"/><rect x="104" y="194" width="34" height="34" rx="4"/><rect x="148" y="194" width="34" height="34" rx="4"/><rect x="192" y="194" width="34" height="34" rx="4"/><rect x="236" y="194" width="34" height="34" rx="4"/><rect x="280" y="194" width="34" height="34" rx="4"/><rect x="324" y="194" width="34" height="34" rx="4"/><rect x="368" y="194" width="34" height="34" rx="4"/>
    <rect x="60" y="238" width="34" height="34" rx="4"/><rect x="104" y="238" width="34" height="34" rx="4"/><rect x="148" y="238" width="34" height="34" rx="4"/><rect x="192" y="238" width="34" height="34" rx="4"/><rect x="236" y="238" width="34" height="34" rx="4"/><rect x="280" y="238" width="34" height="34" rx="4"/><rect x="324" y="238" width="34" height="34" rx="4"/>
  </g>
  <text class="d" x="60" y="310">23 個目的地</text>

  <text class="g" x="520" y="128">明年夏天</text>
  <g fill="var(--accent)">
    <rect x="520" y="150" width="34" height="34" rx="4"/><rect x="564" y="150" width="34" height="34" rx="4"/><rect x="608" y="150" width="34" height="34" rx="4"/><rect x="652" y="150" width="34" height="34" rx="4"/><rect x="696" y="150" width="34" height="34" rx="4"/><rect x="740" y="150" width="34" height="34" rx="4"/><rect x="784" y="150" width="34" height="34" rx="4"/><rect x="828" y="150" width="34" height="34" rx="4"/><rect x="872" y="150" width="34" height="34" rx="4"/>
    <rect x="520" y="194" width="34" height="34" rx="4"/><rect x="564" y="194" width="34" height="34" rx="4"/><rect x="608" y="194" width="34" height="34" rx="4"/><rect x="652" y="194" width="34" height="34" rx="4"/><rect x="696" y="194" width="34" height="34" rx="4"/><rect x="740" y="194" width="34" height="34" rx="4"/><rect x="784" y="194" width="34" height="34" rx="4"/><rect x="828" y="194" width="34" height="34" rx="4"/><rect x="872" y="194" width="34" height="34" rx="4"/>
    <rect x="520" y="238" width="34" height="34" rx="4"/><rect x="564" y="238" width="34" height="34" rx="4"/><rect x="608" y="238" width="34" height="34" rx="4"/><rect x="652" y="238" width="34" height="34" rx="4"/><rect x="696" y="238" width="34" height="34" rx="4"/><rect x="740" y="238" width="34" height="34" rx="4"/><rect x="784" y="238" width="34" height="34" rx="4"/><rect x="828" y="238" width="34" height="34" rx="4"/><rect x="872" y="238" width="34" height="34" rx="4"/>
    <rect x="520" y="282" width="34" height="34" rx="4"/><rect x="564" y="282" width="34" height="34" rx="4"/><rect x="608" y="282" width="34" height="34" rx="4"/><rect x="652" y="282" width="34" height="34" rx="4"/><rect x="696" y="282" width="34" height="34" rx="4"/><rect x="740" y="282" width="34" height="34" rx="4"/><rect x="784" y="282" width="34" height="34" rx="4"/><rect x="828" y="282" width="34" height="34" rx="4"/><rect x="872" y="282" width="34" height="34" rx="4"/>
    <rect x="520" y="326" width="34" height="34" rx="4"/><rect x="564" y="326" width="34" height="34" rx="4"/><rect x="608" y="326" width="34" height="34" rx="4"/><rect x="652" y="326" width="34" height="34" rx="4"/><rect x="696" y="326" width="34" height="34" rx="4"/><rect x="740" y="326" width="34" height="34" rx="4"/><rect x="784" y="326" width="34" height="34" rx="4"/><rect x="828" y="326" width="34" height="34" rx="4"/><rect x="872" y="326" width="34" height="34" rx="4"/>
    <rect x="520" y="370" width="34" height="34" rx="4"/><rect x="564" y="370" width="34" height="34" rx="4"/>
  </g>
  <rect x="608" y="370" width="34" height="34" rx="4" fill="var(--warn)"/>
  <rect x="652" y="370" width="34" height="34" rx="4" fill="var(--warn)"/>
  <text class="d" x="520" y="438">53 個目的地</text>
  <text class="d" x="700" y="396" fill="var(--warn)">兩個沒做起來，停了</text>

  <text class="c" x="60" y="500">飛機挪得走，所以停損只有兩格</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two price range bars side by side; the cleanroom floor range overlaps the prime Taipei apartment range, showing comparable prices">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl{font-size:27px;fill:var(--ink);font-weight:700}
    .grp{font-size:20px;fill:var(--ink);font-weight:600}
    .bd{font-size:16px;fill:var(--dim)}
    .val{font-size:16px;fill:var(--ink)}
    .cc{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="ttl" x="60" y="62">Cleanroom floor costs more than prime Taipei</text>
<line x1="140" y1="150" x2="140" y2="400" stroke="var(--line)" stroke-dasharray="4 5"/>
<line x1="387" y1="150" x2="387" y2="400" stroke="var(--line)" stroke-dasharray="4 5"/>
<line x1="633" y1="150" x2="633" y2="400" stroke="var(--line)" stroke-dasharray="4 5"/>
<line x1="880" y1="150" x2="880" y2="400" stroke="var(--line)" stroke-dasharray="4 5"/>
<text class="grp" x="140" y="160">Leading-edge cleanroom floor</text>
<rect x="359" y="170" width="435" height="54" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="val" x="373" y="203">89,000 to 265,000</text>
<text class="grp" x="140" y="260">Prime Taipei apartments</text>
<rect x="510" y="270" width="370" height="54" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="val" x="524" y="303">150,000 to 300,000</text>
<line x1="140" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<text class="bd" x="140" y="428" text-anchor="middle">0</text>
<text class="bd" x="387" y="428" text-anchor="middle">100K</text>
<text class="bd" x="633" y="428" text-anchor="middle">200K</text>
<text class="bd" x="880" y="428" text-anchor="middle">300K</text>
<text class="bd" x="880" y="456" text-anchor="end">USD per ping</text>
<text class="cc" x="60" y="492">Every ping of floor burns money, so transport goes to the ceiling.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四個填滿的橫條堆疊之後，最後一格是空的虛線框，箭頭從空框指向右側三個問號方塊">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">理由列滿，結論留白</text>

<text x="60" y="106" font-size="20" fill="var(--dim)">演說裡寫了的</text>
<rect x="60" y="126" width="300" height="48" rx="8" fill="var(--accent)" opacity="0.85"/>
<text x="80" y="157" font-size="16" fill="var(--page)">理由 一</text>
<rect x="60" y="184" width="300" height="48" rx="8" fill="var(--accent)" opacity="0.85"/>
<text x="80" y="215" font-size="16" fill="var(--page)">理由 二</text>
<rect x="60" y="242" width="300" height="48" rx="8" fill="var(--accent)" opacity="0.85"/>
<text x="80" y="273" font-size="16" fill="var(--page)">理由 三</text>
<rect x="60" y="300" width="300" height="48" rx="8" fill="var(--accent)" opacity="0.85"/>
<text x="80" y="331" font-size="16" fill="var(--page)">理由 四</text>

<rect x="60" y="368" width="300" height="60" rx="8" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="80" y="405" font-size="19" fill="var(--warn)">結論</text>
<text x="60" y="460" font-size="16" fill="var(--dim)">沒有寫進去的那一句</text>

<path d="M370 398 L520 398" stroke="var(--warn)" stroke-width="2.5" fill="none"/>
<path d="M520 398 L506 391 L506 405 Z" fill="var(--warn)"/>
<text x="396" y="382" font-size="16" fill="var(--dim)">別人替你填</text>

<rect x="540" y="192" width="330" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="562" y="230" font-size="16" fill="var(--ink)">政治壓力？</text>
<rect x="540" y="268" width="330" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="562" y="306" font-size="16" fill="var(--ink)">主席跑到委員會前面？</text>
<rect x="540" y="344" width="330" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="562" y="382" font-size="16" fill="var(--ink)">還沒決定？</text>
<path d="M540 222 L520 222 L520 374 L540 374" stroke="var(--line)" stroke-width="2" fill="none"/>

<text x="60" y="516" font-size="22" fill="var(--ink)">懸念不會空著，市場自己會填</text>
</svg>
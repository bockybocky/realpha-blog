<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two timelines show the old approach adding a long, continuously billed tail after generation, while the new approach nearly eliminates it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">The retrieval tail keeps billing</text>

  <text class="t" x="60" y="150" font-size="19" font-weight="700" fill="var(--warn)">Old: print to logs</text>
  <rect x="300" y="128" width="260" height="46" fill="var(--grey)"/>
  <text class="t" x="430" y="158" font-size="16" fill="var(--ink)" text-anchor="middle">Generate 3 clips</text>
  <rect x="560" y="128" width="320" height="46" fill="var(--warn)" opacity="0.5"/>
  <text class="t" x="720" y="158" font-size="16" fill="var(--ink)" text-anchor="middle">About 30 min extra</text>

  <text class="t" x="60" y="288" font-size="19" font-weight="700" fill="var(--accent)">New: upload to Drive</text>
  <rect x="300" y="266" width="260" height="46" fill="var(--grey)"/>
  <text class="t" x="430" y="296" font-size="16" fill="var(--ink)" text-anchor="middle">Generate 3 clips</text>
  <rect x="560" y="266" width="40" height="46" fill="var(--accent)"/>

  <line x1="300" y1="370" x2="880" y2="370" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="300" y="400" font-size="16" fill="var(--dim)">Running</text>
  <text class="t" x="880" y="400" font-size="16" fill="var(--dim)" text-anchor="end">Still held</text>
  <text class="t" x="60" y="400" font-size="16" fill="var(--dim)">Time</text>

  <text class="t" x="300" y="464" font-size="22" font-weight="700" fill="var(--ink)">The tail is billed, so cut it short</text>
</svg>
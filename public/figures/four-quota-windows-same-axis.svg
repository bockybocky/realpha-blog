<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一條三十天時間軸上排四列重置刻度，agy 密到連成一片，週窗四個刻度，月窗只有最右端一個">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<defs>
  <pattern id="tick5h" width="4.79" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="40" stroke="var(--accent)" stroke-width="1"/>
  </pattern>
</defs>
<text class="t" x="40" y="56">四種重置節奏，放在同一條三十天的軸上</text>

<rect x="210" y="132" width="690" height="40" fill="url(#tick5h)"/>
<text class="g" x="40" y="158">agy</text>
<text class="s" x="40" y="180">每 5 小時</text>

<line x1="210" y1="242" x2="900" y2="242" stroke="var(--line)" stroke-width="2"/>
<line x1="371" y1="222" x2="371" y2="262" stroke="var(--accent)" stroke-width="4"/>
<line x1="532" y1="222" x2="532" y2="262" stroke="var(--accent)" stroke-width="4"/>
<line x1="693" y1="222" x2="693" y2="262" stroke="var(--accent)" stroke-width="4"/>
<line x1="854" y1="222" x2="854" y2="262" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="40" y="240">Claude</text>
<text class="s" x="40" y="262">週窗</text>

<line x1="210" y1="322" x2="900" y2="322" stroke="var(--line)" stroke-width="2"/>
<line x1="371" y1="302" x2="371" y2="342" stroke="var(--accent)" stroke-width="4"/>
<line x1="532" y1="302" x2="532" y2="342" stroke="var(--accent)" stroke-width="4"/>
<line x1="693" y1="302" x2="693" y2="342" stroke="var(--accent)" stroke-width="4"/>
<line x1="854" y1="302" x2="854" y2="342" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="40" y="320">Codex</text>
<text class="s" x="40" y="342">週窗</text>

<line x1="210" y1="402" x2="900" y2="402" stroke="var(--line)" stroke-width="2"/>
<line x1="898" y1="382" x2="898" y2="422" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="40" y="400">Grok</text>
<text class="s" x="40" y="422">月窗</text>

<line x1="210" y1="450" x2="900" y2="450" stroke="var(--grey)" stroke-width="1"/>
<text class="s" x="210" y="472">現在</text>
<text class="s" x="371" y="472" text-anchor="middle">7 天</text>
<text class="s" x="532" y="472" text-anchor="middle">14 天</text>
<text class="s" x="693" y="472" text-anchor="middle">21 天</text>
<text class="s" x="900" y="472" text-anchor="end">30 天</text>

<text class="c" x="40" y="522">同樣剩三成，等回來的距離差這麼多</text>
</svg>
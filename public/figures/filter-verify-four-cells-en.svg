<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A two-by-two comparison of original and kids sources against titles that should and should not be blocked">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Same ruler twice, fill all four cells</text>

  <text class="t" x="480" y="126" font-size="20" fill="var(--dim)" text-anchor="middle">Original source</text>
  <text class="t" x="760" y="126" font-size="20" fill="var(--accent)" text-anchor="middle">Kids source</text>

  <text class="t" x="60" y="212" font-size="19" fill="var(--ink)">Should block</text>
  <text class="t" x="60" y="238" font-size="15" fill="var(--dim)">Adult keyword</text>
  <text class="t" x="60" y="352" font-size="19" fill="var(--ink)">Should pass</text>
  <text class="t" x="60" y="378" font-size="15" fill="var(--dim)">Frieren</text>

  <rect x="340" y="160" width="280" height="130" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="222" font-size="28" font-weight="700" fill="var(--ink)" text-anchor="middle">Full page</text>
  <text class="t" x="480" y="256" font-size="15" fill="var(--dim)" text-anchor="middle">Prove it's findable</text>

  <rect x="620" y="160" width="280" height="130" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="760" y="222" font-size="28" font-weight="700" fill="var(--accent)" text-anchor="middle">0 titles</text>
  <text class="t" x="760" y="256" font-size="15" fill="var(--dim)" text-anchor="middle">Blocked</text>

  <rect x="340" y="300" width="280" height="130" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="362" font-size="28" font-weight="700" fill="var(--ink)" text-anchor="middle">147 ch.</text>
  <text class="t" x="480" y="396" font-size="15" fill="var(--dim)" text-anchor="middle">Baseline</text>

  <rect x="620" y="300" width="280" height="130" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="760" y="362" font-size="28" font-weight="700" fill="var(--accent)" text-anchor="middle">147 ch.</text>
  <text class="t" x="760" y="396" font-size="15" fill="var(--dim)" text-anchor="middle">Not caught</text>

  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">One cell alone can't tell "blocked" from "never there"</text>
</svg>
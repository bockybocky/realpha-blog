<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Of four gates only the first is open, and the three behind it are still closed.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .g { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="62" font-size="27" font-weight="700">One gate open, three to go</text>

  <rect x="48" y="150" width="864" height="150" rx="10" fill="var(--card)" stroke="var(--line)"/>

  <rect x="238" y="150" width="14" height="40" fill="var(--accent)"/>
  <rect x="238" y="260" width="14" height="40" fill="var(--accent)"/>
  <text class="t" x="150" y="338" font-size="19" font-weight="700" fill="var(--accent)">Getting indoors</text>
  <text class="g" x="150" y="364" font-size="15">Unlocked Oct 8</text>

  <rect x="446" y="150" width="14" height="150" fill="var(--grey)"/>
  <text class="t" x="372" y="338" font-size="19" font-weight="700">Distance loss</text>

  <rect x="654" y="150" width="14" height="150" fill="var(--grey)"/>
  <text class="t" x="580" y="338" font-size="19" font-weight="700">Beam capacity</text>

  <rect x="862" y="150" width="14" height="150" fill="var(--grey)"/>
  <text class="t" x="788" y="338" font-size="19" font-weight="700">Total spectrum</text>

  <path d="M90 225 L420 225" stroke="var(--accent)" stroke-width="6"/>
  <path d="M404 211 L428 225 L404 239 Z" fill="var(--accent)"/>

  <text class="t" x="48" y="440" font-size="22" font-weight="700">The market read gate one as the whole road</text>
</svg>
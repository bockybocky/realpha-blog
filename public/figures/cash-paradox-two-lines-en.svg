<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two lines run opposite ways: cash's share of transactions falls while banknotes in circulation rise, crossing in the middle.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="h" x="60" y="62">The banknote paradox</text>
<text class="b" x="60" y="94">Same years, two directions</text>
<line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="130" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
<polyline points="150,400 280,362 410,315 540,258 670,198 810,148" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="150,180 280,218 410,258 540,302 670,348 810,398" fill="none" stroke="var(--grey)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="810" cy="148" r="7" fill="var(--accent)"/>
<circle cx="810" cy="398" r="7" fill="var(--grey)"/>
<text class="g" x="600" y="128" fill="var(--accent)">In circulation</text>
<text class="g" x="600" y="430" fill="var(--dim)">Cash share of payments</text>
<text class="b" x="150" y="470">2009</text>
<text class="b" x="800" y="470">Today</text>
<text class="c" x="60" y="512">Fewer people use it, yet more gets printed</text>
</svg>
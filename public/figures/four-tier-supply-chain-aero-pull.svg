<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="四層供應鏈由下往上堆疊，右側航太業用兩條箭頭抽走最底兩層的原料與鍛造產能">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">四層裡，下面兩層不只服務你</text>

  <g>
    <rect x="80" y="110" width="470" height="78" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text class="t" x="104" y="146" font-size="20" font-weight="700" fill="var(--ink)">第三層　現場</text>
    <text class="t" x="104" y="172" font-size="16" fill="var(--dim)">運輸、安裝、試車、維護</text>
  </g>
  <g>
    <rect x="80" y="200" width="470" height="78" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text class="t" x="104" y="236" font-size="20" font-weight="700" fill="var(--ink)">第二層　三大廠組裝</text>
    <text class="t" x="104" y="262" font-size="16" fill="var(--dim)">整台燃氣輪機</text>
  </g>
  <g>
    <rect x="80" y="290" width="470" height="78" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
    <text class="t" x="104" y="326" font-size="20" font-weight="700" fill="var(--ink)">第一層　鍛造與鑄造</text>
    <text class="t" x="104" y="352" font-size="16" fill="var(--dim)">葉片、導流片毛胚</text>
  </g>
  <g>
    <rect x="80" y="380" width="470" height="78" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
    <text class="t" x="104" y="416" font-size="20" font-weight="700" fill="var(--ink)">第零層　原料</text>
    <text class="t" x="104" y="442" font-size="16" fill="var(--dim)">鎳基合金、鉻、鈦</text>
  </g>

  <g>
    <rect x="700" y="290" width="200" height="168" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
    <text class="t" x="800" y="338" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">航太業</text>
    <text class="t" x="800" y="372" font-size="16" fill="var(--dim)" text-anchor="middle">在手 4 萬架</text>
    <text class="t" x="800" y="398" font-size="16" fill="var(--dim)" text-anchor="middle">≈ 8 萬具渦輪</text>
    <text class="t" x="800" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">同一批供應商</text>
  </g>

  <path d="M694 328 L562 328" fill="none" stroke="var(--warn)" stroke-width="4" marker-end="url(#ar)"/>
  <path d="M694 420 L562 420" fill="none" stroke="var(--warn)" stroke-width="4" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/>
    </marker>
  </defs>

  <text class="t" x="60" y="540" font-size="22" font-weight="700" fill="var(--ink)">瓶頸不在組裝廠，在它下面兩層的排隊順序</text>
</svg>
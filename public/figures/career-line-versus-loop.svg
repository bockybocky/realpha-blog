<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊是一條單向直線依序穿過四個職位再通向創業，右邊同樣四個職位圍成一圈、箭頭全部指回中央同一個問題">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; fill:var(--ink); font-weight:700; }
    .g  { font-size:20px; fill:var(--dim); font-weight:700; }
    .b  { font-size:16px; fill:var(--ink); }
    .c  { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="40" y="54">同樣四段經歷，兩種讀法</text>

  <rect x="40" y="86" width="400" height="430" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="64" y="124">我讀的版本</text>
  <line x1="110" y1="160" x2="110" y2="470" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="110,484 103,466 117,466" fill="var(--grey)"/>
  <circle cx="110" cy="170" r="8" fill="var(--grey)"/><text class="b" x="134" y="176">業務</text>
  <circle cx="110" cy="245" r="8" fill="var(--grey)"/><text class="b" x="134" y="251">網路投放</text>
  <circle cx="110" cy="320" r="8" fill="var(--grey)"/><text class="b" x="134" y="326">商品開發</text>
  <circle cx="110" cy="395" r="8" fill="var(--grey)"/><text class="b" x="134" y="401">編輯長</text>
  <text class="b" x="134" y="476">創業</text>

  <rect x="480" y="86" width="440" height="430" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="504" y="124">他自己的版本</text>
  <circle cx="700" cy="320" r="76" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text class="b" x="700" y="314" text-anchor="middle" fill="var(--accent)">誰出錢</text>
  <text class="b" x="700" y="338" text-anchor="middle" fill="var(--accent)">誰被看見</text>
  <circle cx="700" cy="190" r="7" fill="var(--ink)"/><text class="b" x="700" y="172" text-anchor="middle">業務</text>
  <circle cx="850" cy="320" r="7" fill="var(--ink)"/><text class="b" x="866" y="326">投放</text>
  <circle cx="700" cy="450" r="7" fill="var(--ink)"/><text class="b" x="700" y="478" text-anchor="middle">商品開發</text>
  <circle cx="550" cy="320" r="7" fill="var(--ink)"/><text class="b" x="534" y="326" text-anchor="end">編輯長</text>
  <line x1="700" y1="200" x2="700" y2="236" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="700,244 694,228 706,228" fill="var(--accent)"/>
  <line x1="840" y1="320" x2="788" y2="320" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="780,320 796,314 796,326" fill="var(--accent)"/>
  <line x1="700" y1="440" x2="700" y2="404" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="700,396 694,412 706,412" fill="var(--accent)"/>
  <line x1="560" y1="320" x2="612" y2="320" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="620,320 604,314 604,326" fill="var(--accent)"/>
</svg>
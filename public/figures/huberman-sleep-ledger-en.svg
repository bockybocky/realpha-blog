<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A bar chart of three descending bars: seven hours tallest, six hours middle, and two straight nights under four hours dropping sharply to a very short bar drawn in a warning color.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">His own sleep ledger</text>
<rect x="60" y="100" width="840" height="340" rx="14" fill="var(--card)"/>
<line x1="120" y1="400" x2="860" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="170" width="110" height="230" rx="6" fill="var(--accent)"/>
<rect x="420" y="220" width="110" height="180" rx="6" fill="var(--accent)" opacity="0.65"/>
<rect x="660" y="330" width="110" height="70" rx="6" fill="var(--warn)"/>
<text class="t" x="235" y="150" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">7 hours</text>
<text class="t" x="475" y="200" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">6 hours</text>
<text class="t" x="715" y="310" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">4 hours, 2 nights</text>
<text class="t" x="235" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">Best shape</text>
<text class="t" x="475" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">Manageable</text>
<text class="t" x="715" y="432" font-size="16" fill="var(--warn)" text-anchor="middle">Collapse</text>
<text class="t" x="60" y="486" font-size="22" font-weight="700" fill="var(--ink)">Not a slope, a cliff</text>
</svg>
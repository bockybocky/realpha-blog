<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three panels where the opening in the oversight bar widens each time and what passes through grows with it.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="58" font-size="27" font-weight="600" fill="var(--ink)">The same exception, three eras</text>

<rect x="48" y="110" width="224" height="270" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="160" y="150" font-size="19" font-weight="600" fill="var(--ink)" text-anchor="middle">Back then</text>
<rect x="152" y="190" width="16" height="150" fill="var(--accent)" opacity="0.22"/>
<polygon points="152,340 168,340 160,356" fill="var(--accent)"/>
<rect x="72" y="290" width="76" height="22" fill="var(--grey)"/>
<rect x="172" y="290" width="76" height="22" fill="var(--grey)"/>
<text x="160" y="376" font-size="16" font-weight="600" fill="var(--ink)" text-anchor="middle">Wheelchairs</text>

<rect x="368" y="110" width="224" height="270" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="150" font-size="19" font-weight="600" fill="var(--ink)" text-anchor="middle">Later</text>
<rect x="446" y="190" width="68" height="150" fill="var(--accent)" opacity="0.22"/>
<polygon points="464,340 496,340 480,358" fill="var(--accent)"/>
<rect x="392" y="290" width="50" height="22" fill="var(--grey)"/>
<rect x="518" y="290" width="50" height="22" fill="var(--grey)"/>
<text x="480" y="376" font-size="16" font-weight="600" fill="var(--ink)" text-anchor="middle">Unchecked imports</text>

<rect x="688" y="110" width="224" height="270" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="800" y="150" font-size="19" font-weight="600" fill="var(--ink)" text-anchor="middle">Today</text>
<rect x="724" y="190" width="152" height="150" fill="var(--warn)" opacity="0.22"/>
<polygon points="780,340 820,340 800,360" fill="var(--warn)"/>
<rect x="712" y="290" width="8" height="22" fill="var(--grey)"/>
<rect x="880" y="290" width="8" height="22" fill="var(--grey)"/>
<text x="800" y="376" font-size="16" font-weight="600" fill="var(--warn)" text-anchor="middle">An invisible port</text>

<text x="480" y="416" font-size="15" fill="var(--dim)" text-anchor="middle">Grey = government oversight</text>
<text x="480" y="470" font-size="22" font-weight="600" fill="var(--ink)" text-anchor="middle">An opening never stays with the purpose that made it</text>
</svg>
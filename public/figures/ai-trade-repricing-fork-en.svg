<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One line splits into an upper and a lower branch, one rising and one falling, each leading to two groups.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" fill="var(--ink)">One trade, two directions</text>
<rect x="60" y="250" width="170" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="145" y="287" font-size="19" fill="var(--ink)" text-anchor="middle">AI trade</text>
<path d="M230 270 C 360 270, 380 170, 520 170" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polygon points="548,170 518,158 518,182" fill="var(--accent)"/>
<path d="M230 290 C 360 290, 380 400, 520 400" fill="none" stroke="var(--warn)" stroke-width="4"/>
<polygon points="548,400 518,388 518,412" fill="var(--warn)"/>
<text x="360" y="150" font-size="20" fill="var(--accent)" text-anchor="middle">Up</text>
<text x="360" y="440" font-size="20" fill="var(--warn)" text-anchor="middle">Down</text>
<rect x="560" y="110" width="340" height="120" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="586" y="156" font-size="19" fill="var(--ink)">Hyperscalers</text>
<text x="586" y="196" font-size="19" fill="var(--ink)">GPU rents</text>
<rect x="560" y="340" width="340" height="120" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="586" y="386" font-size="19" fill="var(--ink)">Neoclouds</text>
<text x="586" y="426" font-size="19" fill="var(--ink)">Semi</text>
<text x="60" y="534" font-size="22" fill="var(--ink)">Supply repriced, not demand</text>
</svg>
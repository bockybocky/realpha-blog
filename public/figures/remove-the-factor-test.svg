<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左塔抽走上塊仍站立，右塔抽走底塊後整個倒下">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="480" y="54" text-anchor="middle" font-size="27" fill="var(--ink)">抽掉一塊，塔還在嗎</text>

<text x="280" y="132" text-anchor="middle" font-size="20" fill="var(--ink)">拿掉多代理</text>
<line x1="150" y1="430" x2="410" y2="430" stroke="var(--line)" stroke-width="3"/>
<rect x="200" y="330" width="160" height="100" rx="6" fill="var(--accent)"/>
<rect x="200" y="248" width="160" height="72" rx="6" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 7"/>
<line x1="372" y1="284" x2="424" y2="284" stroke="var(--dim)" stroke-width="2"/>
<path d="M432 284 L420 278 L420 290 Z" fill="var(--dim)"/>
<text x="398" y="268" text-anchor="middle" font-size="15" fill="var(--dim)">抽走</text>
<text x="280" y="472" text-anchor="middle" font-size="18" fill="var(--dim)">塔還站著</text>

<text x="680" y="132" text-anchor="middle" font-size="20" fill="var(--ink)">拿掉底層模型</text>
<line x1="550" y1="430" x2="810" y2="430" stroke="var(--line)" stroke-width="3"/>
<rect x="600" y="330" width="160" height="100" rx="6" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
<rect x="612" y="358" width="160" height="72" rx="6" fill="var(--warn)" transform="rotate(16 692 394)"/>
<text x="680" y="472" text-anchor="middle" font-size="18" fill="var(--warn)">整座垮了</text>

<text x="480" y="512" text-anchor="middle" font-size="22" fill="var(--ink)">拿掉它，結果還在嗎</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三角形的三個頂點是主權動員、安撫國內、健全貨幣；前兩者實線鎖死，健全貨幣那一角是灰色虛線且邊線斷開">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .gd { font-size:20px; fill:var(--grey); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .bd { font-size:16px; fill:var(--grey); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="68">三件事湊在一起，撐不住的是哪一條</text>

<line x1="480" y1="178" x2="250" y2="420" stroke="var(--accent)" stroke-width="5"/>
<line x1="480" y1="178" x2="710" y2="420" stroke="var(--grey)" stroke-width="4" stroke-dasharray="10 10"/>
<line x1="250" y1="420" x2="710" y2="420" stroke="var(--grey)" stroke-width="4" stroke-dasharray="10 10"/>

<rect x="352" y="128" width="256" height="62" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="480" y="158" text-anchor="middle">主權動員</text>
<text class="b" x="480" y="182" text-anchor="middle">國家安全的敘事</text>
<text class="b" x="480" y="116" text-anchor="middle">鎖死</text>

<rect x="122" y="392" width="256" height="62" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="250" y="422" text-anchor="middle">安撫國內</text>
<text class="b" x="250" y="446" text-anchor="middle">選票</text>
<text class="b" x="250" y="380" text-anchor="middle">鎖死</text>

<rect x="582" y="392" width="256" height="62" rx="10" fill="var(--page)" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 9"/>
<text class="gd" x="710" y="422" text-anchor="middle">健全貨幣</text>
<text class="bd" x="710" y="446" text-anchor="middle">沒有人會打電話來</text>
<text class="bd" x="710" y="380" text-anchor="middle">讓位</text>

<text class="c" x="480" y="512" text-anchor="middle">讓位的不是道理最小的那條，是背後沒有人抗議的那條</text>
</svg>
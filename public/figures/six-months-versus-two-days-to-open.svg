<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條長條與一條極短的條並排，長度相差懸殊">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">從想開一家餅乾店到開門</text>
<text x="60" y="90" font-size="15" fill="var(--dim)">同一條路，兩種長度</text>

<text x="60" y="150" font-size="20" font-weight="700" fill="var(--ink)">自己找場地</text>
<rect x="60" y="170" width="260" height="58" fill="var(--grey)"/>
<rect x="322" y="170" width="260" height="58" fill="var(--grey)" opacity="0.75"/>
<rect x="584" y="170" width="256" height="58" fill="var(--grey)" opacity="0.5"/>
<text x="76" y="206" font-size="16" fill="var(--page)">合法執照場地</text>
<text x="338" y="206" font-size="16" fill="var(--ink)">三到五年租約＋押金</text>
<text x="600" y="206" font-size="16" fill="var(--ink)">發照流程</text>
<text x="840" y="254" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="end">六個月起跳</text>

<text x="60" y="340" font-size="20" font-weight="700" fill="var(--ink)">走共享廚房</text>
<rect x="60" y="360" width="56" height="58" fill="var(--accent)"/>
<rect x="118" y="360" width="56" height="58" fill="var(--accent)" opacity="0.6"/>
<text x="192" y="384" font-size="16" fill="var(--dim)">週一領使用者執照</text>
<text x="192" y="408" font-size="16" fill="var(--dim)">週二開門</text>
<text x="192" y="440" font-size="19" font-weight="700" fill="var(--accent)">兩天</text>

<text x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">他賺的，就是你繞不過的那六個月</text>
</g>
</svg>
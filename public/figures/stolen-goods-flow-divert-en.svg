<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A thick band flows from theft to fencing and then forks; the thin pipe to major e-commerce platforms is blocked by law, most of the flow goes to peer-to-peer marketplaces, and money travels up a dashed line to the upper tier.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .gd { font-size:20px; font-weight:600; fill:var(--dim); }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .w { fill:var(--warn); }
</style>
<defs>
  <marker id="ar-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker>
</defs>
<text x="48" y="62" class="t">Loot → lax rules</text>
<path d="M100 300 L420 300" fill="none" stroke="var(--accent)" stroke-opacity="0.35" stroke-width="40" stroke-linecap="round"/>
<path d="M420 300 C500 300 500 190 580 190 L640 190" fill="none" stroke="var(--grey)" stroke-width="14"/>
<rect x="640" y="160" width="14" height="60" fill="var(--warn)"/>
<text x="647" y="146" class="b w" text-anchor="middle">INFORM Act 2023</text>
<text x="672" y="197" class="gd">Big e-com</text>
<path d="M420 300 C500 300 500 410 580 410 L840 410" fill="none" stroke="var(--accent)" stroke-opacity="0.6" stroke-width="40" stroke-linecap="round"/>
<text x="110" y="264" class="g">Steal</text>
<text x="110" y="352" class="d">Homeless/addict</text>
<text x="380" y="264" class="g" text-anchor="middle">Fence</text>
<text x="380" y="352" class="d" text-anchor="middle">De-tag</text>
<text x="700" y="470" class="g" text-anchor="middle">P2P markets</text>
<text x="700" y="496" class="d" text-anchor="middle">FB Marketplace · Craigslist</text>
<path d="M890 388 L890 150" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-flow)"/>
<text x="890" y="128" class="g" text-anchor="middle">Top</text>
<text x="876" y="272" class="d" text-anchor="end">Money up</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一道牆的四個階段：完整、裂開、被打出兩個缺口、缺口旁邊加上一座儲槽">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="66">禁令不會停在第一版</text>
<rect x="60" y="120" width="170" height="300" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="295" y="120" width="170" height="300" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="530" y="120" width="170" height="300" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="765" y="120" width="170" height="300" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="120" y="180" width="50" height="180" fill="var(--accent)"/>
<rect x="355" y="180" width="50" height="180" fill="var(--accent)"/>
<polyline points="380,180 366,228 392,268 372,318 384,360" fill="none" stroke="var(--warn)" stroke-width="4"/>
<rect x="590" y="180" width="50" height="180" fill="var(--accent)"/>
<rect x="590" y="210" width="50" height="32" fill="var(--card)"/>
<rect x="590" y="290" width="50" height="32" fill="var(--card)"/>
<line x1="565" y1="226" x2="655" y2="226" stroke="var(--dim)" stroke-width="2"/>
<polygon points="655,220 668,226 655,232" fill="var(--dim)"/>
<line x1="565" y1="306" x2="655" y2="306" stroke="var(--dim)" stroke-width="2"/>
<polygon points="655,300 668,306 655,312" fill="var(--dim)"/>
<rect x="825" y="180" width="50" height="180" fill="var(--accent)"/>
<rect x="825" y="210" width="50" height="32" fill="var(--card)"/>
<rect x="825" y="290" width="50" height="32" fill="var(--card)"/>
<rect x="888" y="255" width="38" height="90" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<ellipse cx="907" cy="255" rx="19" ry="9" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<polygon points="252,265 272,275 252,285" fill="var(--grey)"/>
<polygon points="487,265 507,275 487,285" fill="var(--grey)"/>
<polygon points="722,265 742,275 722,285" fill="var(--grey)"/>
<text class="g" x="145" y="396" text-anchor="middle">全面禁</text>
<text class="g" x="380" y="396" text-anchor="middle">某處崩</text>
<text class="g" x="615" y="396" text-anchor="middle">開例外</text>
<text class="g" x="850" y="396" text-anchor="middle">補儲槽</text>
<text class="c" x="60" y="480">真正的結構在名單與儲槽上</text>
<text class="b" x="60" y="516">喊話那天的價格，只是報一個開盤</text>
</svg>
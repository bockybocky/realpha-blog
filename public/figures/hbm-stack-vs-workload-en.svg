<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two twelve-layer stacks, one fully used and one using only the bottom five layers.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style></defs>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t h" x="70" y="70">Stacking higher needs a workload that eats it</text>
<text class="t g" x="200" y="140">Training workload</text>
<rect x="200" y="160" width="220" height="24" fill="var(--accent)"/>
<rect x="200" y="188" width="220" height="24" fill="var(--accent)"/>
<rect x="200" y="216" width="220" height="24" fill="var(--accent)"/>
<rect x="200" y="244" width="220" height="24" fill="var(--accent)"/>
<rect x="200" y="272" width="220" height="24" fill="var(--accent)"/>
<rect x="200" y="300" width="220" height="24" fill="var(--accent)"/>
<rect x="200" y="328" width="220" height="24" fill="var(--accent)"/>
<rect x="200" y="356" width="220" height="24" fill="var(--accent)"/>
<rect x="200" y="384" width="220" height="24" fill="var(--accent)"/>
<rect x="200" y="412" width="220" height="24" fill="var(--accent)"/>
<rect x="200" y="440" width="220" height="24" fill="var(--accent)"/>
<rect x="200" y="468" width="220" height="24" fill="var(--accent)"/>
<text class="t b" x="200" y="520">All twelve layers used</text>
<text class="t g" x="560" y="140">Light inference</text>
<rect x="560" y="160" width="220" height="24" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="560" y="188" width="220" height="24" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="560" y="216" width="220" height="24" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="560" y="244" width="220" height="24" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="560" y="272" width="220" height="24" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="560" y="300" width="220" height="24" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="560" y="328" width="220" height="24" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="560" y="356" width="220" height="24" fill="var(--accent)"/>
<rect x="560" y="384" width="220" height="24" fill="var(--accent)"/>
<rect x="560" y="412" width="220" height="24" fill="var(--accent)"/>
<rect x="560" y="440" width="220" height="24" fill="var(--accent)"/>
<rect x="560" y="468" width="220" height="24" fill="var(--accent)"/>
<text class="t b" x="810" y="265">Top unused</text>
<text class="t b" x="560" y="520">Only five layers used</text>
<text class="t c" x="70" y="560">Software decides whether to stack higher</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The price line drops out of the range band, and four arrows fan down from the break point to four mechanical sellers.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="66" font-size="27" fill="var(--ink)">One break, four sellers</text>
<rect x="60" y="120" width="840" height="76" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="78" y="150" font-size="16" fill="var(--dim)">Months-long range</text>
<polyline points="70,172 220,166 380,180 520,170 620,196 740,248 880,288" fill="none" stroke="var(--warn)" stroke-width="4"/>
<circle cx="620" cy="196" r="9" fill="var(--warn)"/>
<text x="648" y="236" font-size="16" fill="var(--warn)">Out</text>
<line x1="620" y1="212" x2="155" y2="326" stroke="var(--accent)" stroke-width="2"/>
<line x1="620" y1="212" x2="365" y2="326" stroke="var(--accent)" stroke-width="2"/>
<line x1="620" y1="212" x2="575" y2="326" stroke="var(--accent)" stroke-width="2"/>
<line x1="620" y1="212" x2="785" y2="326" stroke="var(--accent)" stroke-width="2"/>
<polygon points="145,318 165,318 155,336" fill="var(--accent)"/>
<polygon points="355,318 375,318 365,336" fill="var(--accent)"/>
<polygon points="565,318 585,318 575,336" fill="var(--accent)"/>
<polygon points="775,318 795,318 785,336" fill="var(--accent)"/>
<rect x="60" y="340" width="190" height="110" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="155" y="388" font-size="19" fill="var(--ink)" text-anchor="middle">Dealers</text>
<text x="155" y="418" font-size="15" fill="var(--dim)" text-anchor="middle">Sells</text>
<rect x="270" y="340" width="190" height="110" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="365" y="388" font-size="19" fill="var(--ink)" text-anchor="middle">Levered ETFs</text>
<text x="365" y="418" font-size="15" fill="var(--dim)" text-anchor="middle">Rebalance</text>
<rect x="480" y="340" width="190" height="110" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="575" y="388" font-size="19" fill="var(--ink)" text-anchor="middle">Vol ctrl</text>
<text x="575" y="418" font-size="15" fill="var(--dim)" text-anchor="middle">Cut on vol up</text>
<rect x="690" y="340" width="190" height="110" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="785" y="388" font-size="19" fill="var(--ink)" text-anchor="middle">Trend CTAs</text>
<text x="785" y="418" font-size="15" fill="var(--dim)" text-anchor="middle">Flips</text>
<text x="60" y="520" font-size="22" fill="var(--ink)">Strangers, called by one price</text>
</svg>
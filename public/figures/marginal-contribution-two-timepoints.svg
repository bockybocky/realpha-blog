<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩格，左格圓點多且橫條長，右格圓點少且橫條短">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); font-weight:700; }
    .bdy { font-size:16px; fill:var(--dim); }
    .num { font-size:16px; fill:var(--ink); }
    .cnc { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ttl" x="60" y="62">同一個人，兩個時點</text>

<rect x="60" y="120" width="390" height="350" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="grp" x="88" y="164">兩年前</text>
<text class="bdy" x="88" y="194">路線未定</text>
<circle cx="100" cy="240" r="10" fill="var(--accent)"/>
<circle cx="144" cy="240" r="10" fill="var(--accent)"/>
<circle cx="188" cy="240" r="10" fill="var(--accent)"/>
<circle cx="232" cy="240" r="10" fill="var(--accent)"/>
<circle cx="276" cy="240" r="10" fill="var(--accent)"/>
<circle cx="320" cy="240" r="10" fill="var(--accent)"/>
<circle cx="364" cy="240" r="10" fill="var(--accent)"/>
<circle cx="100" cy="278" r="10" fill="var(--accent)"/>
<circle cx="144" cy="278" r="10" fill="var(--accent)"/>
<circle cx="188" cy="278" r="10" fill="var(--accent)"/>
<circle cx="232" cy="278" r="10" fill="var(--accent)"/>
<circle cx="276" cy="278" r="10" fill="var(--accent)"/>
<circle cx="320" cy="278" r="10" fill="var(--accent)"/>
<circle cx="364" cy="278" r="10" fill="var(--accent)"/>
<text class="bdy" x="88" y="322">未解決的難題</text>
<line x1="88" y1="346" x2="422" y2="346" stroke="var(--line)" stroke-width="2"/>
<text class="bdy" x="88" y="382">邊際貢獻</text>
<rect x="88" y="398" width="290" height="36" rx="4" fill="var(--accent)"/>
<text class="num" x="394" y="424">高</text>

<rect x="510" y="120" width="390" height="350" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="grp" x="538" y="164">現在</text>
<text class="bdy" x="538" y="194">路線已定</text>
<circle cx="550" cy="240" r="10" fill="var(--accent)"/>
<circle cx="594" cy="240" r="10" fill="var(--accent)"/>
<circle cx="638" cy="240" r="10" fill="var(--accent)"/>
<text class="bdy" x="538" y="322">未解決的難題</text>
<line x1="538" y1="346" x2="872" y2="346" stroke="var(--line)" stroke-width="2"/>
<text class="bdy" x="538" y="382">邊際貢獻</text>
<rect x="538" y="398" width="62" height="36" rx="4" fill="var(--grey)"/>
<text class="num" x="616" y="424">低</text>

<text class="cnc" x="60" y="522">能力沒變，剩下的難題變少了</text>
</svg>
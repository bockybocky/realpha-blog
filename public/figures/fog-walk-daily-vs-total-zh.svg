<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊是三十根幾乎看不出高度的小柱子，代表每天的進度；右邊是一根很高的柱子，代表三十天疊起來的總量">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">在霧裡走，不覺得濕</text>

  <rect x="60" y="92" width="560" height="330" rx="14" fill="var(--card)"/>
  <text class="t" x="84" y="126" font-size="20" font-weight="700" fill="var(--dim)">每天</text>
  <line x1="84" y1="390" x2="596" y2="390" stroke="var(--line)" stroke-width="2"/>
  <g fill="var(--grey)">
    <rect x="92" y="382" width="10" height="8"/><rect x="109" y="382" width="10" height="8"/>
    <rect x="126" y="382" width="10" height="8"/><rect x="143" y="382" width="10" height="8"/>
    <rect x="160" y="382" width="10" height="8"/><rect x="177" y="382" width="10" height="8"/>
    <rect x="194" y="382" width="10" height="8"/><rect x="211" y="382" width="10" height="8"/>
    <rect x="228" y="382" width="10" height="8"/><rect x="245" y="382" width="10" height="8"/>
    <rect x="262" y="382" width="10" height="8"/><rect x="279" y="382" width="10" height="8"/>
    <rect x="296" y="382" width="10" height="8"/><rect x="313" y="382" width="10" height="8"/>
    <rect x="330" y="382" width="10" height="8"/><rect x="347" y="382" width="10" height="8"/>
    <rect x="364" y="382" width="10" height="8"/><rect x="381" y="382" width="10" height="8"/>
    <rect x="398" y="382" width="10" height="8"/><rect x="415" y="382" width="10" height="8"/>
    <rect x="432" y="382" width="10" height="8"/><rect x="449" y="382" width="10" height="8"/>
    <rect x="466" y="382" width="10" height="8"/><rect x="483" y="382" width="10" height="8"/>
    <rect x="500" y="382" width="10" height="8"/><rect x="517" y="382" width="10" height="8"/>
    <rect x="534" y="382" width="10" height="8"/><rect x="551" y="382" width="10" height="8"/>
    <rect x="568" y="382" width="10" height="8"/><rect x="585" y="382" width="10" height="8"/>
  </g>
  <text class="t" x="340" y="420" font-size="16" fill="var(--dim)" text-anchor="middle">三十天，每天三十分鐘</text>

  <rect x="660" y="92" width="240" height="330" rx="14" fill="var(--card)"/>
  <text class="t" x="684" y="126" font-size="20" font-weight="700" fill="var(--accent)">疊起來</text>
  <line x1="684" y1="390" x2="876" y2="390" stroke="var(--line)" stroke-width="2"/>
  <rect x="742" y="150" width="76" height="240" fill="var(--accent)"/>
  <text class="t" x="780" y="420" font-size="16" fill="var(--dim)" text-anchor="middle">同樣的三十天</text>

  <text class="t" x="480" y="488" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">每天看不出來，走久了衣服全濕</text>
</svg>
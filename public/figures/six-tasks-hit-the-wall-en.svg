<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two quota bars of the same length: the upper filled with six blocks up to the wall, the lower with only one block and a long stretch left">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Six at once empties the clock</text>

<text x="60" y="186" font-size="20" fill="var(--ink)">Six tasks</text>
<rect x="230" y="150" width="590" height="56" fill="var(--card)" stroke="var(--line)"/>
<rect x="232" y="152" width="94" height="52" fill="var(--warn)"/>
<rect x="330" y="152" width="94" height="52" fill="var(--warn)"/>
<rect x="428" y="152" width="94" height="52" fill="var(--warn)"/>
<rect x="526" y="152" width="94" height="52" fill="var(--warn)"/>
<rect x="624" y="152" width="94" height="52" fill="var(--warn)"/>
<rect x="722" y="152" width="96" height="52" fill="var(--warn)"/>
<rect x="824" y="136" width="12" height="84" fill="var(--warn)"/>
<text x="700" y="248" font-size="16" fill="var(--warn)">Quota gone, no cover art</text>

<text x="60" y="366" font-size="20" fill="var(--ink)">One task</text>
<rect x="230" y="330" width="590" height="56" fill="var(--card)" stroke="var(--line)"/>
<rect x="232" y="332" width="94" height="52" fill="var(--accent)"/>
<rect x="824" y="316" width="12" height="84" fill="var(--line)"/>
<text x="340" y="428" font-size="16" fill="var(--dim)">Rest still usable</text>

<text x="60" y="500" font-size="22" fill="var(--ink)">Cash is affordable; the clock isn't</text>
</svg>
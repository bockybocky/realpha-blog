<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three arrows labeled loan-to-value ratio, no contract transfer and handover date press in from three sides, squeezing the original exit into a narrow slit that leaves only cancellation or a loss-making sale.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">Each rule is fair alone; stacked they force selling</text>

  <rect x="330" y="230" width="300" height="140" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="390" y="276">The unit you hold</text>
  <text class="b" x="390" y="306">A 100Ks contract</text>
  <text class="b" x="390" y="332">Meant to wait for handover</text>

  <path d="M480 130 L480 212" stroke="var(--grey)" stroke-width="5"/>
  <path d="M480 212 l-9 -16 l18 0 z" fill="var(--grey)"/>
  <text class="g" x="400" y="118">LTV cap locked</text>
  <text class="b" x="366" y="96">2nd home, nationwide</text>

  <path d="M150 300 L312 300" stroke="var(--grey)" stroke-width="5"/>
  <path d="M312 300 l-16 -9 l0 18 z" fill="var(--grey)"/>
  <text class="g" x="60" y="268">No contract transfer</text>
  <text class="b" x="60" y="292">Presale slips unsellable</text>

  <path d="M860 300 L648 300" stroke="var(--warn)" stroke-width="5"/>
  <path d="M648 300 l16 -9 l0 18 z" fill="var(--warn)"/>
  <text class="g" x="690" y="268" fill="var(--warn)">Handover moved up</text>
  <text class="b" x="690" y="292" fill="var(--warn)">2028 → 2027</text>

  <path d="M430 388 L430 450 L300 450" stroke="var(--warn)" stroke-width="3" fill="none"/>
  <path d="M300 450 l16 -9 l0 18 z" fill="var(--warn)"/>
  <text class="b" x="160" y="444" fill="var(--warn)">No loan means default on the deal</text>

  <path d="M530 388 L530 450 L660 450" stroke="var(--warn)" stroke-width="3" fill="none"/>
  <path d="M660 450 l-16 -9 l0 18 z" fill="var(--warn)"/>
  <text class="b" x="680" y="444" fill="var(--warn)">Sell at a loss post-handover</text>

  <text class="c" x="60" y="524">Story intact, cash flow timing off</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="全部選票的長條上只有一絲被標示，放大後就是這場選舉的勝負來源">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="50" y="58" font-size="27" font-weight="700" fill="var(--ink)">翻盤的那一絲</text>

<text x="60" y="108" font-size="20" font-weight="700" fill="var(--dim)">全部選票</text>
<rect x="60" y="124" width="840" height="64" rx="6" fill="var(--grey)" opacity="0.45"/>
<rect x="60" y="124" width="26" height="64" rx="4" fill="var(--accent)"/>
<line x1="60" y1="200" x2="200" y2="268" stroke="var(--grey)" stroke-width="1.5"/>
<line x1="86" y1="200" x2="860" y2="268" stroke="var(--grey)" stroke-width="1.5"/>

<rect x="200" y="268" width="660" height="150" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="228" y="302" font-size="19" font-weight="700" fill="var(--dim)">放大這一絲</text>
<rect x="228" y="320" width="252" height="52" rx="6" fill="var(--accent)"/>
<text x="354" y="354" font-size="16" fill="var(--page)" text-anchor="middle">投票率變動 &lt; 2%</text>
<rect x="492" y="320" width="196" height="52" rx="6" fill="var(--accent)" opacity="0.6"/>
<text x="590" y="354" font-size="16" fill="var(--ink)" text-anchor="middle">廢票轉向 1–2%</text>
<text x="228" y="400" font-size="15" fill="var(--dim)">合計約三個百分點</text>

<polygon points="700,346 740,346 740,336 772,346 740,356 740,346" fill="var(--warn)"/>
<rect x="780" y="312" width="70" height="68" rx="8" fill="var(--warn)"/>
<text x="815" y="402" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">四百萬票</text>

<text x="480" y="490" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">這麼窄的縫，什麼故事都塞得進去</text>
</svg>
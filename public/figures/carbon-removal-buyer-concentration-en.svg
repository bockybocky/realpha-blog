<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Nine tenths of a bar belongs to a single buyer and the remaining tenth to all other buyers.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t h" x="60" y="70">Carbon removal buyers (estimate)</text>

  <rect x="60" y="190" width="756" height="110" rx="8" fill="var(--accent)" opacity="0.85"/>
  <rect x="816" y="190" width="84" height="110" rx="8" fill="var(--grey)"/>
  <rect x="60" y="190" width="840" height="110" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>

  <text class="t g" x="438" y="252" text-anchor="middle" fill="var(--page)">Microsoft alone</text>
  <text class="t b" x="438" y="340" text-anchor="middle">About 90%, some 45 million tonnes</text>
  <text class="t g" x="858" y="165" text-anchor="middle">All others</text>
  <text class="t b" x="858" y="340" text-anchor="middle">About 10%</text>

  <text class="t c" x="60" y="430">One buyer steps in or out, and that is the price</text>
  <text class="t b" x="60" y="465">Gautam's estimate; until buyers spread out, this market keeps its shape</text>
</svg>
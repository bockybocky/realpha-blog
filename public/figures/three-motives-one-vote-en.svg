<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three boxes with different motives converge by arrows on the same sentence at right, with a note that it counts as only one vote.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="66">Three mouths, one cake</text>

<rect x="60" y="110" width="290" height="88" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="82" y="148">Leader A</text>
<text class="s" x="82" y="176">Wants to keep the ones behind out</text>

<rect x="60" y="238" width="290" height="88" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="82" y="276">Leader B</text>
<text class="s" x="82" y="304">Wants to keep the ones behind out</text>

<rect x="60" y="366" width="290" height="88" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="82" y="404">Chaser</text>
<text class="s" x="82" y="432">Wants the one ahead to brake</text>

<path d="M350 154 C 460 154, 480 262, 560 272" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M350 282 C 460 282, 480 282, 560 282" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M350 410 C 460 410, 480 302, 560 292" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M566 282 l-14 -7 v14 z" fill="var(--grey)"/>

<rect x="580" y="212" width="320" height="140" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="606" y="262" fill="var(--accent)">Same sentence</text>
<text class="s" x="606" y="296">Let us all slow down</text>
<text class="s" x="606" y="326">Eating the same cake</text>

<text class="c" x="580" y="416">Counts as one vote</text>
<text class="s" x="580" y="446">Not three</text>
</svg>
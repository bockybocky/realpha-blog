<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three same-sized blocks sit side by side and one small block stands alone on the right, with an obvious size gap.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="58">The non-AI bills were already waiting</text>
  <rect x="70" y="140" width="180" height="240" rx="10" fill="var(--accent)" opacity="0.85"/>
  <rect x="270" y="140" width="180" height="240" rx="10" fill="var(--accent)" opacity="0.85"/>
  <rect x="470" y="140" width="180" height="240" rx="10" fill="var(--accent)" opacity="0.85"/>
  <text class="g" x="104" y="268">Wildfire defense</text>
  <text class="g" x="284" y="256">Extreme weather</text>
  <text class="g" x="304" y="286">Recovery</text>
  <text class="g" x="484" y="256">Aging grid</text>
  <text class="g" x="524" y="286">Renewal</text>
  <rect x="790" y="330" width="90" height="50" rx="8" fill="var(--grey)" opacity="0.6"/>
  <text class="n" x="770" y="412">Data centers</text>
  <text class="n" x="770" y="436">on home rates</text>
  <text class="n" x="770" y="460">small effect</text>
  <line x1="70" y1="400" x2="650" y2="400" stroke="var(--line)" stroke-width="2"/>
  <text class="n" x="70" y="436">Just to hold today's reliability and affordability</text>
</svg>
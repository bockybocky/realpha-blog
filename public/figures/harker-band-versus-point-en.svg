<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A wide band on the top row means it cannot be known in advance, and a lone point on the bottom row is the number of seconds that can be stated.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="480" y="60" font-size="27" fill="var(--ink)" text-anchor="middle">One man, two kinds of certainty</text>

  <text x="100" y="150" font-size="20" fill="var(--ink)">Level of reserves</text>
  <line x1="100" y1="230" x2="860" y2="230" stroke="var(--line)" stroke-width="3"/>
  <rect x="240" y="200" width="440" height="60" fill="var(--grey)" opacity="0.55"/>
  <line x1="240" y1="190" x2="240" y2="270" stroke="var(--dim)" stroke-width="3"/>
  <line x1="680" y1="190" x2="680" y2="270" stroke="var(--dim)" stroke-width="3"/>
  <text x="240" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">$500 billion</text>
  <text x="680" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">$1.5 trillion</text>
  <text x="460" y="238" font-size="19" fill="var(--ink)" text-anchor="middle">Unknowable in advance</text>

  <text x="100" y="380" font-size="20" fill="var(--ink)">Payment delay</text>
  <line x1="100" y1="440" x2="860" y2="440" stroke="var(--line)" stroke-width="3"/>
  <circle cx="400" cy="440" r="11" fill="var(--accent)"/>
  <text x="400" y="412" font-size="20" fill="var(--accent)" text-anchor="middle">16 seconds</text>
  <text x="400" y="478" font-size="16" fill="var(--warn)" text-anchor="middle">The base rate under it has never been measured</text>

  <text x="480" y="528" font-size="22" fill="var(--ink)" text-anchor="middle">Saying it cannot be known, then naming a single point</text>
</svg>
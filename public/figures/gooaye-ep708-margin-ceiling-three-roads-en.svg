<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The gross margin curve climbs high and stalls, and three roads fork ahead of it: one step up with a question mark, one flat, one down.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">Once margin opens high, only three roads remain</text>
<line x1="130" y1="110" x2="130" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="130" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="62" y="124" font-size="16" fill="var(--dim)">Gross margin</text>
<text x="860" y="500" font-size="16" fill="var(--dim)">Time</text>
<path d="M160 440 C 280 425 380 330 470 250 C 530 210 570 200 600 198" fill="none" stroke="var(--accent)" stroke-width="3"/>
<circle cx="600" cy="198" r="7" fill="var(--accent)"/>
<path d="M600 198 L870 130" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="770" y="116" font-size="20" fill="var(--accent)">Higher?</text>
<path d="M600 198 L870 198" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="800" y="188" font-size="20" fill="var(--dim)">Flat</text>
<path d="M600 198 C 700 240 780 310 870 370" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="800" y="400" font-size="20" fill="var(--dim)">Down</text>
<text x="300" y="300" font-size="16" fill="var(--dim)">Gains already explained</text>
<text x="130" y="525" font-size="22" fill="var(--ink)">Someone must explain the step up</text>
</svg>
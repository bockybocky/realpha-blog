<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根堆疊長條，右邊整體高出許多；自己的那一段佔比從八成降到一半，但實際高度反而比左邊高">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.w{font-size:16px;fill:var(--page)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">份額被吃掉，賺的不一定變少</text>
<line x1="120" y1="400" x2="890" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="230" y="288" width="160" height="112" fill="var(--accent)"/>
<rect x="230" y="260" width="160" height="28" fill="var(--grey)"/>
<text class="w" x="310" y="350" text-anchor="middle">自己</text>
<text class="g" x="310" y="238" text-anchor="middle">八成</text>
<text class="b" x="310" y="428" text-anchor="middle">去年</text>
<rect x="600" y="250" width="160" height="150" fill="var(--accent)"/>
<rect x="600" y="100" width="160" height="150" fill="var(--grey)"/>
<text class="w" x="680" y="332" text-anchor="middle">自己</text>
<text class="b" x="680" y="182" text-anchor="middle">別人</text>
<text class="g" x="680" y="86" text-anchor="middle">一半</text>
<text class="b" x="680" y="428" text-anchor="middle">今年</text>
<line x1="790" y1="100" x2="790" y2="400" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="806" y="244">整個盤子變大</text>
<text class="c" x="60" y="482">份額縮水，絕對值反而變大</text>
</svg>
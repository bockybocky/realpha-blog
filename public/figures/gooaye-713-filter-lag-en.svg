<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the timeline, the decision point comes first and the filter reading later, with a long blank interval between them.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">The filter reads too late to help</text>
<rect x="240" y="252" width="470" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 6"/>
<text class="t" x="475" y="288" font-size="19" fill="var(--dim)" text-anchor="middle">Blank</text>
<line x1="90" y1="280" x2="890" y2="280" stroke="var(--grey)" stroke-width="3"/>
<polygon points="890,280 872,271 872,289" fill="var(--grey)"/>
<circle cx="240" cy="280" r="10" fill="var(--warn)"/>
<line x1="240" y1="252" x2="240" y2="170" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="240" y="152" font-size="20" fill="var(--ink)" text-anchor="middle">Time to act</text>
<circle cx="710" cy="280" r="10" fill="var(--accent)"/>
<line x1="710" y1="308" x2="710" y2="380" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="710" y="408" font-size="20" fill="var(--ink)" text-anchor="middle">Reading forms</text>
<text class="t" x="430" y="360" font-size="16" fill="var(--dim)" text-anchor="middle">Low forms</text>
<line x1="430" y1="308" x2="430" y2="340" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="575" y="360" font-size="16" fill="var(--dim)" text-anchor="middle">Rebound unfolds</text>
<line x1="575" y1="308" x2="575" y2="340" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="90" y="470" font-size="22" fill="var(--ink)">Time runs right: decide left, answer right</text>
</svg>
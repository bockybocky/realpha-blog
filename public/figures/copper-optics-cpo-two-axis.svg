<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="速度與可靠度把握度兩軸上，銅、光、CPO 由左下往右上排列">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style></defs>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t h" x="70" y="70">越快的那端，你越沒有維修經驗</text>
<line x1="180" y1="470" x2="890" y2="470" stroke="var(--line)" stroke-width="3"/>
<line x1="180" y1="470" x2="180" y2="130" stroke="var(--line)" stroke-width="3"/>
<text class="t b" x="800" y="500">更快</text>
<text class="t b" x="120" y="150">沒把握</text>
<text class="t b" x="120" y="460">修得好</text>
<circle cx="320" cy="415" r="12" fill="var(--grey)"/>
<text class="t g" x="345" y="408">銅</text>
<text class="t b" x="345" y="436">零件到處有</text>
<circle cx="600" cy="265" r="12" fill="var(--accent)"/>
<text class="t g" x="625" y="258">光</text>
<text class="t b" x="625" y="286">可靠度未知</text>
<circle cx="800" cy="180" r="12" fill="var(--accent)"/>
<text class="t g" x="700" y="160">共同封裝光學</text>
<text class="t b" x="700" y="130">只在一則貼文上看過</text>
<path d="M340 405 C470 370, 520 310, 586 275" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
<path d="M614 255 C680 230, 730 205, 786 186" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
<text class="t c" x="70" y="545">選的不只是速度，是壞掉那天有沒有人會修</text>
</svg>
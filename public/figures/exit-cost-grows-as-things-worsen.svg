<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三根堆疊長條由矮到高，三個分段同時變厚，最矮那根被圈出">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="40" y="52" font-size="27" font-weight="700">離開的代價，越等越重</text>
<line x1="110" y1="480" x2="820" y2="480" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="460" width="140" height="20" fill="var(--dim)"/>
<rect x="150" y="445" width="140" height="15" fill="var(--grey)"/>
<rect x="150" y="430" width="140" height="15" fill="var(--warn)"/>
<rect x="410" y="420" width="140" height="60" fill="var(--dim)"/>
<rect x="410" y="375" width="140" height="45" fill="var(--grey)"/>
<rect x="410" y="335" width="140" height="40" fill="var(--warn)"/>
<rect x="670" y="360" width="140" height="120" fill="var(--dim)"/>
<rect x="670" y="270" width="140" height="90" fill="var(--grey)"/>
<rect x="670" y="190" width="140" height="80" fill="var(--warn)"/>
<text x="828" y="425" font-size="16">捨不得成本</text>
<text x="828" y="320" font-size="16">稅費</text>
<text x="828" y="236" font-size="16">賣在低點</text>
<rect x="136" y="380" width="168" height="110" rx="10" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="220" y="362" font-size="20" font-weight="700" text-anchor="middle" style="fill:var(--accent)">代價還便宜</text>
<text x="220" y="515" font-size="16" text-anchor="middle" style="fill:var(--dim)">剛出事</text>
<text x="480" y="515" font-size="16" text-anchor="middle" style="fill:var(--dim)">惡化</text>
<text x="740" y="515" font-size="16" text-anchor="middle" style="fill:var(--dim)">很壞</text>
<text x="480" y="555" font-size="19" text-anchor="middle" style="fill:var(--dim)">情勢　壞 → 更壞</text>
</svg>
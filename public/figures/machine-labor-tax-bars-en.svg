<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Now, the human's cost plus tax is two units higher than the machine's; after a machine labor tax, the two bars are the same height.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="54" font-size="27" font-weight="700" fill="var(--ink)">Human tax = robot discount</text>
<text x="48" y="86" font-size="15" fill="var(--dim)">Total cost per job (illus)</text>
<text x="270" y="130" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">Now</text>
<text x="690" y="130" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">Bot-taxed</text>
<line x1="480" y1="110" x2="480" y2="500" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="460" x2="440" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="540" y1="460" x2="860" y2="460" stroke="var(--line)" stroke-width="2"/>
<rect x="155" y="260" width="90" height="200" fill="var(--grey)"/>
<rect x="155" y="210" width="90" height="50" fill="var(--accent)"/>
<text x="200" y="366" font-size="18" text-anchor="middle" fill="var(--ink)">8</text>
<text x="200" y="242" font-size="18" font-weight="700" text-anchor="middle" fill="var(--page)">2</text>
<text x="200" y="198" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">10</text>
<rect x="295" y="260" width="90" height="200" fill="var(--grey)"/>
<text x="340" y="366" font-size="18" text-anchor="middle" fill="var(--ink)">8</text>
<text x="340" y="248" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">8</text>
<line x1="245" y1="210" x2="398" y2="210" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="400" y1="210" x2="400" y2="260" stroke="var(--warn)" stroke-width="3"/>
<text x="410" y="242" font-size="16" font-weight="700" fill="var(--warn)">+2</text>
<text x="200" y="490" font-size="18" text-anchor="middle" fill="var(--ink)">Human</text>
<text x="340" y="490" font-size="18" text-anchor="middle" fill="var(--ink)">Bot</text>
<rect x="575" y="260" width="90" height="200" fill="var(--grey)"/>
<rect x="575" y="210" width="90" height="50" fill="var(--accent)"/>
<text x="620" y="366" font-size="18" text-anchor="middle" fill="var(--ink)">8</text>
<text x="620" y="242" font-size="18" font-weight="700" text-anchor="middle" fill="var(--page)">2</text>
<text x="620" y="198" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">10</text>
<rect x="715" y="260" width="90" height="200" fill="var(--grey)"/>
<rect x="715" y="210" width="90" height="50" fill="var(--accent)"/>
<text x="760" y="366" font-size="18" text-anchor="middle" fill="var(--ink)">8</text>
<text x="760" y="242" font-size="18" font-weight="700" text-anchor="middle" fill="var(--page)">2</text>
<text x="760" y="198" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">10</text>
<text x="690" y="170" font-size="18" font-weight="700" text-anchor="middle" fill="var(--accent)">Tie</text>
<text x="620" y="490" font-size="18" text-anchor="middle" fill="var(--ink)">Human</text>
<text x="760" y="490" font-size="18" text-anchor="middle" fill="var(--ink)">Bot</text>
<rect x="330" y="530" width="16" height="16" rx="3" fill="var(--grey)"/>
<text x="354" y="544" font-size="16" fill="var(--dim)">Cost</text>
<rect x="480" y="530" width="16" height="16" rx="3" fill="var(--accent)"/>
<text x="504" y="544" font-size="16" fill="var(--dim)">Labor tax</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩欄表格，左欄格子都填滿，右欄格子全是空的虛線框" style="font-family:&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="80" y="66" font-size="27" fill="var(--ink)">同一件事往壞的方向走</text>

<rect x="80" y="100" width="800" height="360" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="480" y1="100" x2="480" y2="460" stroke="var(--line)" stroke-width="2"/>

<text x="280" y="142" font-size="20" fill="var(--ink)" text-anchor="middle">哪些東西會變差</text>
<text x="680" y="142" font-size="20" fill="var(--ink)" text-anchor="middle">哪些東西會變好</text>

<rect x="120" y="170" width="320" height="42" rx="6" fill="var(--accent)" opacity="0.85"/>
<rect x="120" y="226" width="320" height="42" rx="6" fill="var(--accent)" opacity="0.85"/>
<rect x="120" y="282" width="320" height="42" rx="6" fill="var(--accent)" opacity="0.85"/>
<rect x="120" y="338" width="320" height="42" rx="6" fill="var(--accent)" opacity="0.85"/>
<rect x="120" y="394" width="320" height="42" rx="6" fill="var(--accent)" opacity="0.85"/>

<rect x="520" y="170" width="320" height="42" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="520" y="226" width="320" height="42" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="520" y="282" width="320" height="42" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="520" y="338" width="320" height="42" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="520" y="394" width="320" height="42" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>

<text x="680" y="490" font-size="19" fill="var(--warn)" text-anchor="middle">空白＝還沒想到</text>

<text x="80" y="536" font-size="22" fill="var(--ink)">右欄是空的，你就是單邊曝險</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="新增人數從 935 降到 334，省下的錢拿去抵變多的雲端費；毛利率往下、營業利益率往上，兩條線反方向。">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .bb { font-size:16px; font-weight:700; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="40" y="52">錢從人事搬到雲端</text>
<text class="g" x="60" y="100">新增人數（本年度至今）</text>
<line x1="70" y1="320" x2="330" y2="320" stroke="var(--line)" stroke-width="2"/>
<rect x="90" y="130" width="80" height="190" fill="var(--grey)"/>
<text class="bb" x="130" y="120" text-anchor="middle">935</text>
<text class="d" x="130" y="346" text-anchor="middle">去年同期</text>
<rect x="220" y="252" width="80" height="33" fill="var(--accent)"/>
<rect x="220" y="285" width="80" height="35" fill="var(--accent)" fill-opacity="0.35"/>
<text class="bb" x="260" y="242" text-anchor="middle">334</text>
<text class="d" x="260" y="346" text-anchor="middle">今年</text>
<text class="d" x="310" y="308">含併購 173</text>
<line x1="430" y1="225" x2="560" y2="225" stroke="var(--dim)" stroke-width="3"/>
<polygon points="560,213 584,225 560,237" fill="var(--dim)"/>
<text class="b" x="505" y="208" text-anchor="middle">拿來抵</text>
<text class="g" x="610" y="100">雲端運算費</text>
<polygon points="690,320 730,320 730,190 760,190 710,135 660,190 690,190" fill="var(--warn)" fill-opacity="0.85"/>
<text class="bb" x="780" y="240">變多</text>
<line x1="40" y1="380" x2="920" y2="380" stroke="var(--line)" stroke-width="1.5"/>
<text class="g" x="60" y="420">產品毛利率</text>
<line x1="140" y1="460" x2="400" y2="505" stroke="var(--warn)" stroke-width="3"/>
<circle cx="140" cy="460" r="7" fill="var(--grey)"/>
<circle cx="400" cy="505" r="7" fill="var(--warn)"/>
<text class="bb" x="124" y="466" text-anchor="end">75%</text>
<text class="d" x="140" y="490" text-anchor="middle">上季</text>
<text class="bb" x="416" y="511">74%</text>
<text class="d" x="400" y="533" text-anchor="middle">這季</text>
<text class="g" x="520" y="420">營業利益率目標</text>
<line x1="600" y1="505" x2="860" y2="460" stroke="var(--accent)" stroke-width="3"/>
<circle cx="600" cy="505" r="7" fill="var(--grey)"/>
<circle cx="860" cy="460" r="7" fill="var(--accent)"/>
<text class="bb" x="584" y="511" text-anchor="end">13.5%</text>
<text class="d" x="600" y="533" text-anchor="middle">上季</text>
<text class="bb" x="876" y="466">14.5%</text>
<text class="d" x="860" y="490" text-anchor="middle">這季</text>
<text class="c" x="480" y="580" text-anchor="middle">一降一升，並排看</text>
</svg>
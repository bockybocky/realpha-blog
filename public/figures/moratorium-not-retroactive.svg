<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="閘門立在時間軸中間，先動工的那條箭頭已經在閘門之後繼續往完工走，新申請的箭頭撞上閘門停下">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="64">暫緩令立在哪一格</text>
<rect x="60" y="100" width="840" height="310" rx="14" fill="var(--card)"/>
<rect x="470" y="130" width="12" height="250" fill="var(--warn)"/>
<text class="g" x="430" y="404" fill="var(--warn)">暫緩令</text>
<path d="M130 200 L820 200" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
<path d="M820 200 l-18 -10 v20 z" fill="var(--accent)"/>
<text class="g" x="130" y="178" fill="var(--accent)">已動工</text>
<text class="b" x="700" y="178">照原定完工</text>
<path d="M560 310 L820 310" stroke="var(--grey)" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 10"/>
<text class="g" x="560" y="288" fill="var(--dim)">新申請</text>
<path d="M560 310 l18 -10 v20 z" fill="var(--grey)"/>
<text class="b" x="520" y="352">撞在這裡</text>
<text class="c" x="60" y="470">它管的是門後面排隊的，不是門前面蓋好的</text>
</svg>
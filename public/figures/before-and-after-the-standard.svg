<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="五條路線在垂直虛線前並行，虛線之後只剩一條加粗延伸，其餘停在線上">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--dim); }
.n { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" class="t">標準定案前後</text>
<path d="M140 300 C 300 300, 380 160, 520 160" stroke="var(--grey)" stroke-width="3" fill="none"/>
<path d="M140 300 C 300 300, 380 230, 520 230" stroke="var(--grey)" stroke-width="3" fill="none"/>
<path d="M140 300 H520" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M140 300 C 300 300, 380 370, 520 370" stroke="var(--grey)" stroke-width="3" fill="none"/>
<path d="M140 300 C 300 300, 380 440, 520 440" stroke="var(--grey)" stroke-width="3" fill="none"/>
<circle cx="140" cy="300" r="7" fill="var(--ink)"/>
<path d="M520 120 V470" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="520" y="106" class="g" text-anchor="middle" fill="var(--warn)">標準定案</text>
<path d="M520 300 H870" stroke="var(--accent)" stroke-width="9" fill="none"/>
<text x="880" y="294" class="n" fill="var(--accent)">放量</text>
<text x="880" y="166" class="n" fill="var(--grey)">歸零</text>
<text x="880" y="236" class="n" fill="var(--grey)">歸零</text>
<text x="880" y="376" class="n" fill="var(--grey)">歸零</text>
<text x="880" y="446" class="n" fill="var(--grey)">歸零</text>
<text x="300" y="500" class="n" text-anchor="middle">題材最多的一段</text>
<text x="60" y="524" class="c">題材多，不等於營收多</text>
</svg>
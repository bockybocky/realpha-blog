<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three rentals each repeat a gray setup period at the start, while a dedicated machine performs setup only once at the beginning.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">The gray part repeats with every rental</text>

  <text class="t" x="60" y="152" font-size="19" font-weight="700" fill="var(--ink)">Rental</text>
  <rect x="200" y="126" width="80" height="48" fill="var(--grey)"/>
  <rect x="280" y="126" width="140" height="48" fill="var(--accent)" opacity="0.8"/>
  <rect x="440" y="126" width="80" height="48" fill="var(--grey)"/>
  <rect x="520" y="126" width="140" height="48" fill="var(--accent)" opacity="0.8"/>
  <rect x="680" y="126" width="80" height="48" fill="var(--grey)"/>
  <rect x="760" y="126" width="140" height="48" fill="var(--accent)" opacity="0.8"/>
  <text class="t" x="240" y="206" font-size="16" fill="var(--dim)" text-anchor="middle">Setup</text>
  <text class="t" x="480" y="206" font-size="16" fill="var(--dim)" text-anchor="middle">Setup</text>
  <text class="t" x="720" y="206" font-size="16" fill="var(--dim)" text-anchor="middle">Setup</text>
  <text class="t" x="350" y="206" font-size="16" fill="var(--ink)" text-anchor="middle">Generate</text>
  <text class="t" x="590" y="206" font-size="16" fill="var(--ink)" text-anchor="middle">Generate</text>
  <text class="t" x="830" y="206" font-size="16" fill="var(--ink)" text-anchor="middle">Generate</text>

  <text class="t" x="60" y="322" font-size="19" font-weight="700" fill="var(--ink)">Dedicated</text>
  <rect x="200" y="296" width="80" height="48" fill="var(--grey)"/>
  <rect x="280" y="296" width="140" height="48" fill="var(--accent)" opacity="0.8"/>
  <rect x="440" y="296" width="140" height="48" fill="var(--accent)" opacity="0.8"/>
  <rect x="600" y="296" width="140" height="48" fill="var(--accent)" opacity="0.8"/>
  <text class="t" x="240" y="376" font-size="16" fill="var(--dim)" text-anchor="middle">Setup once</text>
  <text class="t" x="350" y="376" font-size="16" fill="var(--ink)" text-anchor="middle">Generate</text>
  <text class="t" x="510" y="376" font-size="16" fill="var(--ink)" text-anchor="middle">Generate</text>
  <text class="t" x="670" y="376" font-size="16" fill="var(--ink)" text-anchor="middle">Generate</text>

  <text class="t" x="60" y="470" font-size="22" font-weight="700" fill="var(--ink)">Repeated setup hurts most while iterating</text>
</svg>
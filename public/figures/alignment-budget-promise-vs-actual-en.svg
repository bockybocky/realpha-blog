<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two containers of equal height: the left is filled to one fifth, the right holds only a thin line at the bottom.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66">The share announced, and the share actually funded</text>

<rect x="160" y="140" width="240" height="260" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="160" y="348" width="240" height="52" fill="var(--accent)" opacity="0.75"/>
<text class="g" x="160" y="122">Promise</text>
<text class="s" x="412" y="380">20% of compute</text>

<rect x="560" y="140" width="240" height="260" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="560" y="393" width="240" height="7" fill="var(--warn)"/>
<text class="g" x="560" y="122">Actual</text>
<text class="s" x="812" y="399">One to two points</text>
<text class="s" x="812" y="425">On the oldest chips</text>

<text class="s" x="160" y="430">The same total pool of compute</text>

<text class="c" x="60" y="500">The budget is more honest than the press release.</text>
</svg>
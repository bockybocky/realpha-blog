<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three fab cross sections compared; the transport vehicle moves from the floor up to the ceiling, the first two taking floor space and the third leaving the floor clear">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl{font-size:27px;fill:var(--ink);font-weight:700}
    .grp{font-size:20px;fill:var(--ink);font-weight:600}
    .bd{font-size:16px;fill:var(--dim)}
    .cc{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ttl" x="50" y="62">Why transport moved to the ceiling</text>

<text class="grp" x="50" y="108">Floor AGV</text>
<text class="bd" x="310" y="108" text-anchor="end">1980s</text>
<rect x="50" y="120" width="260" height="280" rx="10" fill="var(--card)" stroke="var(--line)"/>
<line x1="70" y1="150" x2="290" y2="150" stroke="var(--line)" stroke-dasharray="6 6"/>
<rect x="70" y="336" width="220" height="24" fill="var(--warn)" opacity="0.18"/>
<line x1="70" y1="360" x2="290" y2="360" stroke="var(--grey)" stroke-width="2"/>
<rect x="80" y="300" width="60" height="60" fill="var(--page)" stroke="var(--line)"/>
<rect x="200" y="300" width="60" height="60" fill="var(--page)" stroke="var(--line)"/>
<rect x="150" y="332" width="42" height="26" rx="4" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="270" cy="326" r="8" fill="var(--dim)"/>
<line x1="270" y1="334" x2="270" y2="358" stroke="var(--dim)" stroke-width="3"/>
<text class="bd" x="50" y="430">Shares aisles with people</text>
<text class="bd" x="50" y="456">1 foot per second</text>

<text class="grp" x="350" y="108">Rail vehicle</text>
<text class="bd" x="610" y="108" text-anchor="end">Later</text>
<rect x="350" y="120" width="260" height="280" rx="10" fill="var(--card)" stroke="var(--line)"/>
<line x1="370" y1="150" x2="590" y2="150" stroke="var(--line)" stroke-dasharray="6 6"/>
<rect x="450" y="250" width="80" height="110" fill="var(--warn)" opacity="0.18"/>
<line x1="450" y1="250" x2="450" y2="360" stroke="var(--warn)" stroke-width="2"/>
<line x1="530" y1="250" x2="530" y2="360" stroke="var(--warn)" stroke-width="2"/>
<line x1="370" y1="360" x2="590" y2="360" stroke="var(--grey)" stroke-width="2"/>
<rect x="380" y="300" width="60" height="60" fill="var(--page)" stroke="var(--line)"/>
<rect x="540" y="300" width="60" height="60" fill="var(--page)" stroke="var(--line)"/>
<rect x="469" y="330" width="42" height="26" rx="4" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="bd" x="350" y="430">Own lane and barriers</text>
<text class="bd" x="350" y="456">Eats floor space</text>

<text class="grp" x="650" y="108">OHT</text>
<text class="bd" x="910" y="108" text-anchor="end">300 mm era</text>
<rect x="650" y="120" width="260" height="280" rx="10" fill="var(--card)" stroke="var(--line)"/>
<line x1="670" y1="152" x2="890" y2="152" stroke="var(--accent)" stroke-width="3"/>
<rect x="758" y="156" width="44" height="24" rx="4" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<line x1="780" y1="180" x2="780" y2="292" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="768" y="288" width="24" height="12" rx="3" fill="var(--accent)"/>
<line x1="670" y1="360" x2="890" y2="360" stroke="var(--grey)" stroke-width="2"/>
<rect x="700" y="300" width="60" height="60" fill="var(--page)" stroke="var(--line)"/>
<rect x="800" y="300" width="60" height="60" fill="var(--page)" stroke="var(--line)"/>
<text class="bd" x="650" y="430">Hangs from ceiling</text>
<text class="bd" x="650" y="456">60 meters per minute</text>

<text class="cc" x="50" y="516">Floor is dear, so the one using none of it won.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩條完全相同的緩慢上升曲線，左邊起點前有一個實心標記，右邊起點前只有一個空心問號">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.a{font-size:16px;fill:var(--accent);font-weight:700}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56">一樣的曲線，兩種意思</text>
<line x1="480" y1="96" x2="480" y2="430" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

<text class="g" x="60" y="130">計畫中的慢</text>
<line x1="130" y1="380" x2="440" y2="380" stroke="var(--line)" stroke-width="2"/>
<line x1="130" y1="380" x2="130" y2="180" stroke="var(--line)" stroke-width="2"/>
<path d="M130 372 C 220 368, 300 350, 440 300" fill="none" stroke="var(--accent)" stroke-width="3"/>
<circle cx="130" cy="380" r="9" fill="var(--accent)"/>
<line x1="130" y1="380" x2="130" y2="430" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>
<text class="a" x="60" y="454">事前寫下：油門與剎車的條件</text>
<text class="s" x="352" y="284">出貨量</text>

<text class="g" x="520" y="130">意外的慢</text>
<line x1="590" y1="380" x2="900" y2="380" stroke="var(--line)" stroke-width="2"/>
<line x1="590" y1="380" x2="590" y2="180" stroke="var(--line)" stroke-width="2"/>
<path d="M590 372 C 680 368, 760 350, 900 300" fill="none" stroke="var(--grey)" stroke-width="3"/>
<circle cx="590" cy="380" r="9" fill="none" stroke="var(--grey)" stroke-width="2.5"/>
<line x1="590" y1="380" x2="590" y2="430" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<text class="s" x="520" y="454">事後才補上的理由</text>
<text class="s" x="812" y="284">出貨量</text>

<text class="c" x="480" y="506" text-anchor="middle">差別不在曲線，在起點前有沒有人講過</text>
</svg>
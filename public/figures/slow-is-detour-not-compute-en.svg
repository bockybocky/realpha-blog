<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two time bars of very different length, the short one with almost no dark segment and the long one half taken by verification." font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">The same job, and where the slowness sits</text>

<text x="240" y="208" font-size="20" fill="var(--dim)" text-anchor="end">Comparison</text>
<rect x="260" y="170" width="24" height="60" fill="var(--warn)"/>
<rect x="284" y="170" width="104" height="60" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="406" y="208" font-size="16" fill="var(--dim)">16 minutes, finished</text>

<text x="240" y="338" font-size="20" fill="var(--accent)" text-anchor="end">This one</text>
<rect x="260" y="300" width="320" height="60" fill="var(--warn)"/>
<rect x="580" y="300" width="320" height="60" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="580" y="392" font-size="16" fill="var(--dim)">80 minutes, unfinished</text>

<rect x="260" y="436" width="22" height="22" fill="var(--warn)"/>
<text x="292" y="454" font-size="16" fill="var(--dim)">Checking and detours</text>
<rect x="440" y="436" width="22" height="22" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="472" y="454" font-size="16" fill="var(--dim)">The rest</text>

<text x="480" y="516" font-size="22" fill="var(--ink)" text-anchor="middle">Most of the extra time went on detours</text>
</svg>
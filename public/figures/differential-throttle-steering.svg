<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="環狀排列的二十四個推力室，一半亮一半暗，中央箭頭指出載具因此傾斜的方向">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">沒有萬向節，靠兩邊推力差轉向</text>
<circle cx="480" cy="320" r="150" fill="none" stroke="var(--line)" stroke-width="2"/>
<circle cx="480" cy="320" r="86" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="480" cy="170" r="15" fill="var(--grey)" transform="rotate(0 480 320)"/>
<circle cx="480" cy="170" r="15" fill="var(--grey)" transform="rotate(15 480 320)"/>
<circle cx="480" cy="170" r="15" fill="var(--grey)" transform="rotate(30 480 320)"/>
<circle cx="480" cy="170" r="15" fill="var(--grey)" transform="rotate(45 480 320)"/>
<circle cx="480" cy="170" r="15" fill="var(--grey)" transform="rotate(60 480 320)"/>
<circle cx="480" cy="170" r="15" fill="var(--grey)" transform="rotate(75 480 320)"/>
<circle cx="480" cy="170" r="15" fill="var(--grey)" transform="rotate(90 480 320)"/>
<circle cx="480" cy="170" r="15" fill="var(--grey)" transform="rotate(105 480 320)"/>
<circle cx="480" cy="170" r="15" fill="var(--grey)" transform="rotate(120 480 320)"/>
<circle cx="480" cy="170" r="15" fill="var(--grey)" transform="rotate(135 480 320)"/>
<circle cx="480" cy="170" r="15" fill="var(--grey)" transform="rotate(150 480 320)"/>
<circle cx="480" cy="170" r="15" fill="var(--grey)" transform="rotate(165 480 320)"/>
<circle cx="480" cy="170" r="19" fill="var(--accent)" transform="rotate(180 480 320)"/>
<circle cx="480" cy="170" r="19" fill="var(--accent)" transform="rotate(195 480 320)"/>
<circle cx="480" cy="170" r="19" fill="var(--accent)" transform="rotate(210 480 320)"/>
<circle cx="480" cy="170" r="19" fill="var(--accent)" transform="rotate(225 480 320)"/>
<circle cx="480" cy="170" r="19" fill="var(--accent)" transform="rotate(240 480 320)"/>
<circle cx="480" cy="170" r="19" fill="var(--accent)" transform="rotate(255 480 320)"/>
<circle cx="480" cy="170" r="19" fill="var(--accent)" transform="rotate(270 480 320)"/>
<circle cx="480" cy="170" r="19" fill="var(--accent)" transform="rotate(285 480 320)"/>
<circle cx="480" cy="170" r="19" fill="var(--accent)" transform="rotate(300 480 320)"/>
<circle cx="480" cy="170" r="19" fill="var(--accent)" transform="rotate(315 480 320)"/>
<circle cx="480" cy="170" r="19" fill="var(--accent)" transform="rotate(330 480 320)"/>
<circle cx="480" cy="170" r="19" fill="var(--accent)" transform="rotate(345 480 320)"/>
<text x="700" y="240" font-size="19" font-weight="700" fill="var(--accent)">推力調高</text>
<text x="700" y="266" font-size="15" fill="var(--dim)">這半圈</text>
<text x="170" y="240" font-size="19" font-weight="700" fill="var(--dim)">推力調低</text>
<text x="170" y="266" font-size="15" fill="var(--dim)">那半圈</text>
<path d="M 560 320 L 400 320" stroke="var(--warn)" stroke-width="4"/>
<path d="M 400 320 L 424 306 L 424 334 Z" fill="var(--warn)"/>
<text x="480" y="356" font-size="16" fill="var(--warn)" text-anchor="middle">載具往這邊傾</text>
<text x="480" y="512" font-size="15" fill="var(--dim)" text-anchor="middle">外圈 24 具推力室</text>
<text x="60" y="566" font-size="22" font-weight="700" fill="var(--ink)">轉向不靠擺動引擎，靠兩邊出力不一樣</text>
</svg>
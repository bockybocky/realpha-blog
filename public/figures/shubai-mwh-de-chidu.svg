<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="一條從 MWh 到 GWh 到 TWh 的刻度線，水下載具電池市場是靠最左端的一個小方塊，電動車電池是靠右的一個大很多的方塊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
  <text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">故事很大，市場很小</text>

  <rect x="160" y="300" width="26" height="26" rx="3" fill="var(--accent)"/>
  <text x="173" y="280" font-size="20" text-anchor="middle" fill="var(--ink)">水下載具</text>
  <text x="173" y="252" font-size="16" text-anchor="middle" fill="var(--dim)">數百 MWh</text>

  <rect x="620" y="170" width="200" height="156" rx="6" fill="var(--grey)"/>
  <text x="720" y="150" font-size="20" text-anchor="middle" fill="var(--ink)">電動車</text>

  <line x1="100" y1="358" x2="900" y2="358" stroke="var(--line)" stroke-width="3"/>
  <line x1="173" y1="350" x2="173" y2="366" stroke="var(--dim)" stroke-width="3"/>
  <line x1="450" y1="350" x2="450" y2="366" stroke="var(--dim)" stroke-width="3"/>
  <line x1="720" y1="350" x2="720" y2="366" stroke="var(--dim)" stroke-width="3"/>
  <text x="173" y="394" font-size="16" text-anchor="middle" fill="var(--dim)">MWh</text>
  <text x="450" y="394" font-size="16" text-anchor="middle" fill="var(--dim)">GWh</text>
  <text x="720" y="394" font-size="16" text-anchor="middle" fill="var(--dim)">TWh</text>

  <text x="60" y="456" font-size="22" font-weight="700" fill="var(--ink)">題材的宏大，不決定可定址市場的大小</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩格各四個選項方塊，右格最後一個被打叉劃掉">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="48" y="56" font-size="27" font-weight="700" fill="var(--ink)">靠部位過生活，會少掉一個選項</text>

  <rect x="48" y="96" width="416" height="344" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="78" y="140" font-size="20" font-weight="700" fill="var(--ink)">另有收入</text>
  <rect x="84" y="170" width="344" height="48" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text x="106" y="201" font-size="16" fill="var(--dim)">買進</text>
  <rect x="84" y="230" width="344" height="48" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text x="106" y="261" font-size="16" fill="var(--dim)">加碼</text>
  <rect x="84" y="290" width="344" height="48" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text x="106" y="321" font-size="16" fill="var(--dim)">減碼</text>
  <rect x="84" y="350" width="344" height="48" rx="8" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text x="106" y="381" font-size="16" font-weight="700" fill="var(--accent)">什麼都不做</text>

  <rect x="496" y="96" width="416" height="344" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="526" y="140" font-size="20" font-weight="700" fill="var(--ink)">靠部位過活</text>
  <rect x="532" y="170" width="344" height="48" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text x="554" y="201" font-size="16" fill="var(--dim)">買進</text>
  <rect x="532" y="230" width="344" height="48" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text x="554" y="261" font-size="16" fill="var(--dim)">加碼</text>
  <rect x="532" y="290" width="344" height="48" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text x="554" y="321" font-size="16" fill="var(--dim)">減碼</text>
  <rect x="532" y="350" width="344" height="48" rx="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text x="554" y="381" font-size="16" fill="var(--grey)">什麼都不做</text>
  <line x1="532" y1="350" x2="876" y2="398" stroke="var(--warn)" stroke-width="3"/>
  <line x1="876" y1="350" x2="532" y2="398" stroke="var(--warn)" stroke-width="3"/>
  <text x="876" y="428" font-size="15" text-anchor="end" fill="var(--warn)">被迫要動</text>

  <text x="480" y="500" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">被拿掉的那個，剛好是報酬的來源</text>
</svg>
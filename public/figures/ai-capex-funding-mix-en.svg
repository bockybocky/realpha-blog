<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The bar's left segment is 45% equity and its right segment is just over 55% debt of various kinds, with an arrow from the debt side to a bond fund.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:600; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">Over half this capex wave isn't equity</text>
<text class="n" x="60" y="88">Funding sources, 2026-2028</text>

<rect x="60" y="120" width="840" height="110" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="120" width="378" height="110" rx="8" fill="var(--grey)"/>
<rect x="438" y="120" width="462" height="110" rx="8" fill="var(--warn)"/>
<text class="g" x="92" y="168">Equity 45%</text>
<text class="n" x="92" y="198">About $1.5 trillion</text>
<text class="g" x="470" y="168">Debt 55%</text>
<text class="n" x="470" y="198">Priv credit　IG　ABS　HY　Bank loans</text>

<path d="M 668 240 L 668 300" stroke="var(--warn)" stroke-width="3" fill="none"/>
<polygon points="668,312 660,296 676,296" fill="var(--warn)"/>

<rect x="500" y="318" width="336" height="88" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="528" y="356">An ordinary-looking bond fund</text>
<text class="n" x="528" y="386">Quietly holds more AI risk</text>

<text class="c" x="60" y="472">Risk you thought was only in stocks sits on both sides</text>
</svg>
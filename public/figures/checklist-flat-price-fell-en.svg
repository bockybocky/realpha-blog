<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Three horizontal lines stay flat while another line plunges on the right, opening a gap between them.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">The line that fell moved; the three checks didn't</text>
<line x1="160" y1="190" x2="700" y2="190" stroke="var(--grey)" stroke-width="3"/>
<line x1="160" y1="240" x2="700" y2="240" stroke="var(--grey)" stroke-width="3"/>
<line x1="160" y1="290" x2="700" y2="290" stroke="var(--grey)" stroke-width="3"/>
<text x="716" y="196" font-size="16" fill="var(--dim)">Capex guide</text>
<text x="716" y="246" font-size="16" fill="var(--dim)">Order book</text>
<text x="716" y="296" font-size="16" fill="var(--dim)">Supply talk</text>
<path d="M160,165 L420,176 L560,206 L700,424" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text x="716" y="430" font-size="16" fill="var(--warn)">Price</text>
<line x1="700" y1="300" x2="700" y2="414" stroke="var(--dim)" stroke-dasharray="5 5"/>
<text x="640" y="470" text-anchor="middle" font-size="16" fill="var(--dim)">Gap = sentiment</text>
<text x="480" y="536" text-anchor="middle" font-size="22" fill="var(--ink)">Write the checklist while things are calm</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two grids of twenty squares, where the left has only one square lit for a chip in your own computer used just five percent of the time, and the right has nearly every square lit for the high utilization of the cloud.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:700; fill:var(--ink); }
    .body { font-size:15px; fill:var(--dim); }
    .concl { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t title" x="60" y="56">Same chip, two utilization rates</text>
  <rect x="90" y="130" width="46" height="46" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <rect x="148" y="130" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="206" y="130" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="264" y="130" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <rect x="322" y="304" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t grp" x="90" y="408">Sitting in your own computer</text>
  <text class="t body" x="90" y="432">One square of twenty lit, 5% utilization</text>
  <rect x="560" y="130" width="46" height="46" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <rect x="618" y="130" width="46" height="46" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <rect x="676" y="130" width="46" height="46" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>

  <rect x="560" y="246" width="46" height="46" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <rect x="618" y="246" width="46" height="46" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <rect x="676" y="246" width="46" height="46" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <rect x="734" y="246" width="46" height="46" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <rect x="792" y="246" width="46" height="46" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <rect x="560" y="304" width="46" height="46" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <rect x="618" y="304" width="46" height="46" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <rect x="676" y="304" width="46" height="46" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <rect x="734" y="304" width="46" height="46" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <rect x="792" y="304" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t grp" x="560" y="408">Sitting in the cloud</text>
  <text class="t body" x="560" y="432">Every square lit, with a queue waiting</text>
  <text class="t concl" x="90" y="92">Supply is this tight, so idle time is waste</text>

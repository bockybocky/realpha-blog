  <rect x="206" y="188" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="264" y="188" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="322" y="188" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="90" y="246" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="148" y="246" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="206" y="246" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="264" y="246" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="322" y="246" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="90" y="304" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="148" y="304" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="206" y="304" width="46" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A thick arrow runs from Earth to an orbital port, which then branches into four thin lines to low orbit, medium orbit, high orbit, and the Moon: Starship hauls cargo in bulk to the port, and Impulse delivers it onward.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:700}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700;fill:var(--accent)}
.w{fill:var(--page)}.a{fill:var(--accent)}.wa{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="40" y="56" class="t">Bulk to port, Impulse fans out</text>
<circle cx="140" cy="300" r="70" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="140" y="306" text-anchor="middle" class="g">Earth</text>
<polygon points="215,280 430,280 430,262 466,300 430,338 430,320 215,320" fill="var(--accent)"/>
<text x="320" y="248" text-anchor="middle" class="g">Bulk haul</text>
<circle cx="500" cy="300" r="34" fill="var(--page)" stroke="var(--accent)" stroke-width="4"/>
<text x="500" y="362" text-anchor="middle" class="b">Depot</text>
<line x1="530" y1="285" x2="786" y2="120" stroke="var(--dim)" stroke-width="3"/>
<line x1="534" y1="295" x2="786" y2="240" stroke="var(--dim)" stroke-width="3"/>
<line x1="534" y1="305" x2="786" y2="360" stroke="var(--dim)" stroke-width="3"/>
<line x1="530" y1="315" x2="786" y2="480" stroke="var(--dim)" stroke-width="3"/>
<circle cx="800" cy="120" r="14" fill="var(--accent)"/>
<circle cx="800" cy="240" r="14" fill="var(--accent)"/>
<circle cx="800" cy="360" r="14" fill="var(--accent)"/>
<circle cx="800" cy="480" r="14" fill="var(--accent)"/>
<text x="828" y="126" class="b">Moon</text>
<text x="828" y="246" class="b">GEO</text>
<text x="828" y="366" class="b">MEO</text>
<text x="828" y="486" class="b">LEO</text>
<text x="560" y="160" class="g">Impulse: route</text>
</svg>
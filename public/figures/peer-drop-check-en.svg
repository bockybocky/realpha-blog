<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="In the left group, all five bars go down together; in the right group, only the first bar drops deeply and the other four barely move.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="480" y="56" text-anchor="middle" class="t">Macro hits peers too</text>
<text x="112" y="138" text-anchor="middle" class="b">Me</text>
<text x="282" y="138" text-anchor="middle" class="s">Peers</text>
<text x="572" y="138" text-anchor="middle" class="b">Me</text>
<text x="742" y="138" text-anchor="middle" class="s">Peers</text>
<rect x="90" y="150" width="44" height="150" fill="var(--grey)"/>
<rect x="158" y="150" width="44" height="140" fill="var(--grey)"/>
<rect x="226" y="150" width="44" height="160" fill="var(--grey)"/>
<rect x="294" y="150" width="44" height="130" fill="var(--grey)"/>
<rect x="362" y="150" width="44" height="150" fill="var(--grey)"/>
<rect x="550" y="150" width="44" height="150" fill="var(--warn)"/>
<rect x="618" y="150" width="44" height="15" fill="var(--grey)"/>
<rect x="686" y="150" width="44" height="10" fill="var(--grey)"/>
<rect x="754" y="150" width="44" height="20" fill="var(--grey)"/>
<rect x="822" y="150" width="44" height="6" fill="var(--grey)"/>
<line x1="70" y1="150" x2="430" y2="150" stroke="var(--dim)" stroke-width="2"/>
<line x1="530" y1="150" x2="890" y2="150" stroke="var(--dim)" stroke-width="2"/>
<text x="250" y="372" text-anchor="middle" class="g">All drop</text>
<text x="250" y="400" text-anchor="middle" class="b">Macro</text>
<text x="710" y="372" text-anchor="middle" class="g w">Only me</text>
<text x="710" y="400" text-anchor="middle" class="b a">Recheck</text>
<text x="480" y="472" text-anchor="middle" class="c">Peers first</text>
</svg>
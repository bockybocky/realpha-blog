<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條殖利率曲線，灰色那條明顯往右上斜，藍色那條短端被拉高後幾乎水平，呈現由陡轉平">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="52" font-size="27" font-weight="700" fill="var(--ink)">由陡轉平</text>

  <rect x="90" y="100" width="810" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <line x1="130" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
  <text x="180" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">兩年</text>
  <text x="400" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">十年</text>
  <text x="640" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">二十年</text>
  <text x="860" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">三十年</text>

  <polyline points="180,340 400,296 640,248 860,226" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <polyline points="180,238 400,222 640,228 860,220" fill="none" stroke="var(--accent)" stroke-width="5"/>

  <line x1="132" y1="332" x2="132" y2="252" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="132,238 122,262 142,262" fill="var(--warn)"/>
  <text x="150" y="196" font-size="16" fill="var(--warn)">短端衝上來</text>
  <text x="790" y="290" font-size="16" fill="var(--dim)" text-anchor="middle">長端沒跟上</text>

  <line x1="640" y1="140" x2="676" y2="140" stroke="var(--grey)" stroke-width="4"/>
  <text x="688" y="146" font-size="15" fill="var(--dim)">之前</text>
  <line x1="752" y1="140" x2="788" y2="140" stroke="var(--accent)" stroke-width="5"/>
  <text x="800" y="146" font-size="15" fill="var(--dim)">現在</text>

  <text x="480" y="500" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">借短支長變容易了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左柱高、右柱矮，差距被括號標成缺口">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="70">2026 至 2030 年　美國新增電力</text>
<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="170" y="100" width="140" height="340" rx="4" fill="var(--accent)"/>
<text class="g" x="240" y="470" text-anchor="middle">需求</text>
<text class="n" x="240" y="494" text-anchor="middle">125 吉瓦</text>
<rect x="600" y="372" width="140" height="68" rx="4" fill="var(--grey)"/>
<text class="g" x="670" y="470" text-anchor="middle">端得出來</text>
<text class="n" x="670" y="494" text-anchor="middle">25 吉瓦</text>
<path d="M420 100 L450 100 L450 372 L420 372" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="c" x="466" y="228">缺口</text>
<text class="g" x="466" y="258">100 吉瓦</text>
<text class="n" x="466" y="286">約一億戶家庭</text>
</svg>
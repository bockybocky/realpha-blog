<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Funding always lands one or two months before the valuation step rises.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="40" y="52" font-size="27" fill="var(--ink)">The money always beats the paper by a month or two</text>

  <text x="40" y="112" font-size="19" fill="var(--dim)">Valuation step</text>
  <path d="M100 380 L380 380 L380 288 L660 288 L660 196 L900 196" fill="none" stroke="var(--accent)" stroke-width="6"/>

  <line x1="100" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="3"/>

  <g>
    <circle cx="380" cy="380" r="8" fill="var(--accent)"/>
    <text x="330" y="262" font-size="16" fill="var(--accent)">In writing</text>
    <circle cx="660" cy="288" r="8" fill="var(--accent)"/>
    <text x="610" y="170" font-size="16" fill="var(--accent)">In writing</text>
  </g>

  <g>
    <path d="M280 460 L280 404" stroke="var(--warn)" stroke-width="5"/>
    <path d="M270 414 L280 392 L290 414 Z" fill="var(--warn)"/>
    <text x="226" y="492" font-size="16" fill="var(--warn)">Raise</text>
    <path d="M560 460 L560 404" stroke="var(--warn)" stroke-width="5"/>
    <path d="M550 414 L560 392 L570 414 Z" fill="var(--warn)"/>
    <text x="506" y="492" font-size="16" fill="var(--warn)">Raise</text>
  </g>

  <line x1="280" y1="348" x2="380" y2="348" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="286" y="334" font-size="15" fill="var(--warn)">One or two months</text>
  <line x1="560" y1="256" x2="660" y2="256" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="566" y="242" font-size="15" fill="var(--warn)">One or two months</text>

  <text x="40" y="150" font-size="16" fill="var(--dim)">About $7M raised in total · pre-seed about $1.5M</text>
</svg>
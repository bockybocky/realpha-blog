<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="上半兩條線，上面那條始終高於下面那條；下半一條線由左上往右下傾斜">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:19px;fill:var(--ink)}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="58">利率高不高不是重點，跑得贏才是</text>
<line x1="120" y1="330" x2="780" y2="330" stroke="var(--line)" stroke-width="2"/>
<path d="M120,240 C 260,208 400,196 540,176 S 700,146 780,132" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M120,292 C 260,286 400,278 540,272 S 700,262 780,258" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text class="g" x="795" y="138">G　成長</text>
<text class="g" x="795" y="264">R　利率</text>
<text class="s" x="120" y="356">1990 年代初</text>
<text class="s" x="780" y="356" text-anchor="end">1990 年代末</text>
<line x1="120" y1="530" x2="780" y2="530" stroke="var(--line)" stroke-width="2"/>
<path d="M120,412 C 300,432 500,470 780,502" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="10 6"/>
<text class="g" x="795" y="508">債務比例</text>
<text class="s" x="120" y="392">利率停在 5% 到 6%，比例照樣往下</text>
<text class="c" x="60" y="574">G 跑贏 R，債務自己被稀釋</text>
</svg>
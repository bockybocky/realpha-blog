<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="四個並排的想法各拉一條線往下收斂，全部匯進底部同一個節點，形成扇形收口">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="70" font-size="27" fill="var(--ink)">幾個想法，同一個前提</text>

  <rect x="60" y="150" width="190" height="56" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="98" y="185" font-size="16" fill="var(--ink)">記憶體廠</text>
  <rect x="290" y="150" width="190" height="56" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="328" y="185" font-size="16" fill="var(--ink)">伺服器廠</text>
  <rect x="520" y="150" width="190" height="56" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="558" y="185" font-size="16" fill="var(--ink)">雲端成本</text>
  <rect x="750" y="150" width="190" height="56" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="788" y="185" font-size="16" fill="var(--ink)">繞道方案</text>

  <line x1="155" y1="206" x2="420" y2="376" stroke="var(--grey)" stroke-width="2"/>
  <line x1="385" y1="206" x2="455" y2="376" stroke="var(--grey)" stroke-width="2"/>
  <line x1="615" y1="206" x2="505" y2="376" stroke="var(--grey)" stroke-width="2"/>
  <line x1="845" y1="206" x2="540" y2="376" stroke="var(--grey)" stroke-width="2"/>

  <rect x="340" y="380" width="280" height="70" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text x="378" y="423" font-size="20" fill="var(--accent)">記憶體會緊多久</text>

  <text x="60" y="510" font-size="22" fill="var(--accent)">同一個賭注，下了好幾次</text>
</svg>
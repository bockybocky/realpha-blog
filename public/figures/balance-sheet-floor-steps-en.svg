<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A staircase of four descending steps whose final step is a crossed-out dashed box, standing for the old world that cannot be reached again.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型：思源黑體優先 */
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">How far it shrinks depends on the cost you accept</text>

<line x1="70" y1="472" x2="900" y2="472" stroke="var(--line)" stroke-width="2"/>

<rect x="90" y="140" width="190" height="332" fill="var(--card)" stroke="var(--line)"/>
<rect x="300" y="250" width="190" height="222" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)"/>
<rect x="510" y="340" width="190" height="132" fill="var(--accent)" fill-opacity="0.3" stroke="var(--accent)"/>
<rect x="720" y="432" width="190" height="40" fill="none" stroke="var(--grey)" stroke-dasharray="6 5"/>
<line x1="740" y1="440" x2="890" y2="464" stroke="var(--grey)" stroke-width="2"/>
<line x1="890" y1="440" x2="740" y2="464" stroke="var(--grey)" stroke-width="2"/>

<text x="185" y="123" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">Today</text>
<text x="185" y="290" font-size="16" fill="var(--dim)" text-anchor="middle">Far above real needs</text>

<text x="395" y="233" font-size="20" font-weight="600" fill="var(--accent)" text-anchor="middle">Within the ample framework</text>
<text x="395" y="345" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">One to two trillion</text>
<text x="395" y="372" font-size="15" fill="var(--dim)" text-anchor="middle">No rule changes needed</text>

<text x="605" y="323" font-size="20" font-weight="600" fill="var(--accent)" text-anchor="middle">Scarce reserves</text>
<text x="605" y="400" font-size="15" fill="var(--dim)" text-anchor="middle">Cost = short-end swings</text>

<text x="815" y="415" font-size="20" font-weight="600" fill="var(--grey)" text-anchor="middle">Before 2008</text>
<text x="815" y="503" font-size="15" fill="var(--dim)" text-anchor="middle">Out of reach</text>

<text x="60" y="537" font-size="22" font-weight="600" fill="var(--ink)">The floor is drawn by law, not by the Fed</text>
</svg>
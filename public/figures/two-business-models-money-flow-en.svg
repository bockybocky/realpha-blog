<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left, money flows from merchants to the Agent and the user pays nothing; on the right, money flows directly from users to the Agent.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:20px; fill:var(--ink); font-weight:600; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<defs>
<marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
<marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/></marker>
</defs>
<text class="t" x="48" y="58">Who pays decides who you serve</text>
<text class="g" x="48" y="112">Transaction fee</text>
<rect x="48" y="140" width="150" height="62" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="98" y="178">Merchants</text>
<rect x="48" y="258" width="150" height="62" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="98" y="296">Users</text>
<rect x="300" y="198" width="140" height="62" rx="10" fill="var(--accent)"/>
<text class="b" x="334" y="236" fill="var(--page)">Agent</text>
<line x1="198" y1="171" x2="296" y2="212" stroke="var(--accent)" stroke-width="5" marker-end="url(#c1)"/>
<text class="b" x="206" y="156">Fee</text>
<line x1="198" y1="289" x2="296" y2="248" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#c2)"/>
<text class="b" x="206" y="326">Free</text>
<text class="b" x="300" y="306">Aimed at consumers</text>
<line x1="480" y1="100" x2="480" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="524" y="112">Sub + usage</text>
<rect x="524" y="258" width="150" height="62" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="574" y="296">Users</text>
<rect x="776" y="198" width="140" height="62" rx="10" fill="var(--accent)"/>
<text class="b" x="810" y="236" fill="var(--page)">Agent</text>
<line x1="674" y1="289" x2="772" y2="248" stroke="var(--accent)" stroke-width="5" marker-end="url(#c1)"/>
<text class="b" x="658" y="326">Sub + overage</text>
<text class="b" x="776" y="306">Heavy + biz</text>
<text class="c" x="48" y="500">Not how they charge, but who they serve</text>
</svg>
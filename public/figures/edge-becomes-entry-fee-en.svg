<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A rising line and a falling line cross, and after the crossing the advantage approaches zero">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">An edge becomes the fee</text>

<line x1="100" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<path d="M120 424 C 300 404 400 220 560 150 L 860 118" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M120 140 C 300 152 400 336 560 404 L 860 430" fill="none" stroke="var(--accent)" stroke-width="3"/>

<text x="122" y="126" font-size="15" fill="var(--accent)">Edge peaks</text>
<text x="858" y="106" font-size="15" fill="var(--dim)" text-anchor="end">Everyone has it</text>
<text x="858" y="452" font-size="15" fill="var(--accent)" text-anchor="end">Edge gone</text>
<text x="122" y="446" font-size="15" fill="var(--dim)">Only a few</text>

<line x1="466" y1="272" x2="466" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="466" cy="272" r="7" fill="var(--warn)"/>
<text x="484" y="262" font-size="19" fill="var(--warn)">Entry fee</text>

<line x1="220" y1="464" x2="220" y2="478" stroke="var(--line)" stroke-width="2"/>
<line x1="480" y1="464" x2="480" y2="478" stroke="var(--line)" stroke-width="2"/>
<line x1="740" y1="464" x2="740" y2="478" stroke="var(--line)" stroke-width="2"/>
<text x="220" y="500" font-size="15" fill="var(--dim)" text-anchor="middle">Live quotes</text>
<text x="480" y="500" font-size="15" fill="var(--dim)" text-anchor="middle">Financial data</text>
<text x="740" y="500" font-size="15" fill="var(--dim)" text-anchor="middle">AI tools</text>

<text x="480" y="548" font-size="22" fill="var(--ink)" text-anchor="middle">Not if you have it, but what's left</text>
</svg>
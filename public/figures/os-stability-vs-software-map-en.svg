<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two-axis chart with Ubuntu top left, Windows 11 bottom right, Mac alone top right">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="480" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">Three systems, as he sees them</text>
<rect x="510" y="90" width="350" height="185" fill="var(--card)"/>
<rect x="160" y="90" width="700" height="370" fill="none" stroke="var(--line)" stroke-width="2"/>
<line x1="510" y1="90" x2="510" y2="460" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="160" y1="275" x2="860" y2="275" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="150" y="104" text-anchor="end" font-size="16" fill="var(--dim)">Stable</text>
<text x="150" y="460" text-anchor="end" font-size="16" fill="var(--dim)">Buggy</text>
<text x="160" y="490" font-size="16" fill="var(--dim)">Few apps</text>
<text x="860" y="490" text-anchor="end" font-size="16" fill="var(--dim)">Full apps</text>
<circle cx="290" cy="150" r="16" fill="var(--grey)"/>
<text x="316" y="157" font-size="20" font-weight="700" fill="var(--ink)">Ubuntu</text>
<circle cx="720" cy="400" r="16" fill="var(--grey)"/>
<text x="694" y="407" text-anchor="end" font-size="20" font-weight="700" fill="var(--ink)">Windows 11</text>
<circle cx="760" cy="150" r="20" fill="var(--accent)"/>
<text x="734" y="157" text-anchor="end" font-size="20" font-weight="700" fill="var(--accent)">Mac</text>
<text x="480" y="540" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">Mac takes the top right: stable + apps</text>
</svg>
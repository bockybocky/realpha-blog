<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The line rises steeply by 100, falls back to where it began, then drops another 100, ending below its starting level.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); }
.g { font-size:20px; fill:var(--ink); }
.s { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="68">A round trip that ends lower</text>

<line x1="150" y1="140" x2="880" y2="140" stroke="var(--line)" stroke-dasharray="4 6"/>
<line x1="150" y1="260" x2="880" y2="260" stroke="var(--line)" stroke-dasharray="4 6"/>
<line x1="150" y1="380" x2="880" y2="380" stroke="var(--line)" stroke-dasharray="4 6"/>
<text class="s" x="92" y="146">330</text>
<text class="s" x="92" y="266">230</text>
<text class="s" x="92" y="386">130</text>

<polyline points="200,260 400,140 620,260 840,380" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="200" cy="260" r="8" fill="var(--accent)"/>
<circle cx="400" cy="140" r="8" fill="var(--accent)"/>
<circle cx="620" cy="260" r="8" fill="var(--accent)"/>
<circle cx="840" cy="380" r="8" fill="var(--accent)"/>

<text class="g" x="160" y="306">Pre-earnings</text>
<text class="g" x="352" y="118">Two days later</text>
<text class="g" x="572" y="306">After the report</text>
<text class="g" x="792" y="426">Now</text>
<text class="s" x="330" y="470">$400B backlog</text>
<text class="s" x="560" y="470">$300B from one firm</text>

<line x1="60" y1="500" x2="900" y2="500" stroke="var(--line)"/>
<text class="c" x="60" y="538">Same denominator, repriced twice</text>
</svg>
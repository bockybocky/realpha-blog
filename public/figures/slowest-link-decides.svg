<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三根高低不同的柱子，一條虛線停在最矮那根的高度橫貫全圖">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="56" y="56" font-size="27" font-weight="700" fill="var(--ink)">產出由最矮的那根決定</text>
<rect x="140" y="160" width="120" height="280" fill="var(--accent)"/>
<rect x="420" y="290" width="120" height="150" fill="var(--accent)"/>
<rect x="700" y="350" width="120" height="90" fill="var(--warn)"/>
<line x1="100" y1="350" x2="900" y2="350" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text x="900" y="334" font-size="16" fill="var(--warn)" text-anchor="end">實際水位</text>
<line x1="56" y1="440" x2="904" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="200" y="474" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">容量</text>
<text x="480" y="474" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">每 GB 頻寬</text>
<text x="760" y="474" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">每秒 token</text>
<text x="200" y="502" font-size="16" fill="var(--dim)" text-anchor="middle">十四倍</text>
<text x="480" y="502" font-size="16" fill="var(--dim)" text-anchor="middle">掉下來</text>
<text x="760" y="502" font-size="16" fill="var(--dim)" text-anchor="middle">沒變好</text>
<text x="56" y="548" font-size="22" font-weight="700" fill="var(--ink)">最亮的數字不決定結果，最慢的那段才決定</text>
</svg>
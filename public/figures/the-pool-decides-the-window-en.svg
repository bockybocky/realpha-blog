<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The top common window is squeezed into a small block at the far right by one late-starting line, while the bottom common window covers the whole timeline.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">Same question, different stock pool</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">The latest starter sets the common window</text>

<rect x="686" y="136" width="196" height="152" fill="var(--warn)" opacity="0.14"/>
<text x="60" y="158" font-size="19" fill="var(--ink)">Eleven names</text>
<line x1="200" y1="146" x2="880" y2="146" stroke="var(--grey)" stroke-width="5"/>
<line x1="200" y1="160" x2="880" y2="160" stroke="var(--grey)" stroke-width="5"/>
<line x1="200" y1="174" x2="880" y2="174" stroke="var(--grey)" stroke-width="5"/>
<line x1="200" y1="188" x2="880" y2="188" stroke="var(--grey)" stroke-width="5"/>
<line x1="200" y1="202" x2="880" y2="202" stroke="var(--grey)" stroke-width="5"/>
<line x1="200" y1="216" x2="880" y2="216" stroke="var(--grey)" stroke-width="5"/>
<line x1="200" y1="230" x2="880" y2="230" stroke="var(--grey)" stroke-width="5"/>
<line x1="200" y1="244" x2="880" y2="244" stroke="var(--grey)" stroke-width="5"/>
<line x1="200" y1="258" x2="880" y2="258" stroke="var(--grey)" stroke-width="5"/>
<line x1="200" y1="272" x2="880" y2="272" stroke="var(--grey)" stroke-width="5"/>
<line x1="686" y1="286" x2="880" y2="286" stroke="var(--warn)" stroke-width="5"/>
<text x="60" y="292" font-size="15" fill="var(--warn)">Twenty years late</text>
<text x="784" y="322" font-size="19" fill="var(--warn)" text-anchor="middle">0 events</text>

<rect x="200" y="384" width="682" height="126" fill="var(--accent)" opacity="0.14"/>
<text x="60" y="406" font-size="19" fill="var(--ink)">Nine names</text>
<line x1="200" y1="394" x2="880" y2="394" stroke="var(--accent)" stroke-width="5"/>
<line x1="200" y1="408" x2="880" y2="408" stroke="var(--accent)" stroke-width="5"/>
<line x1="200" y1="422" x2="880" y2="422" stroke="var(--accent)" stroke-width="5"/>
<line x1="200" y1="436" x2="880" y2="436" stroke="var(--accent)" stroke-width="5"/>
<line x1="200" y1="450" x2="880" y2="450" stroke="var(--accent)" stroke-width="5"/>
<line x1="200" y1="464" x2="880" y2="464" stroke="var(--accent)" stroke-width="5"/>
<line x1="200" y1="478" x2="880" y2="478" stroke="var(--accent)" stroke-width="5"/>
<line x1="200" y1="492" x2="880" y2="492" stroke="var(--accent)" stroke-width="5"/>
<line x1="200" y1="506" x2="880" y2="506" stroke="var(--accent)" stroke-width="5"/>
<text x="541" y="540" font-size="19" fill="var(--accent)" text-anchor="middle">33 events</text>

<text x="200" y="360" font-size="15" fill="var(--dim)" text-anchor="middle">1998</text>
<text x="686" y="360" font-size="15" fill="var(--dim)" text-anchor="middle">2018</text>
<text x="880" y="360" font-size="15" fill="var(--dim)" text-anchor="middle">2026</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Five paths fan out from the same start, three are crossed out, and one thick arrow points to the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <defs>
    <marker id="ar7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="58">Failure rules out, success points the way</text>

  <circle cx="150" cy="290" r="10" fill="var(--accent)"/>
  <text class="g" x="104" y="336">You are here</text>

  <line x1="160" y1="290" x2="470" y2="150" stroke="var(--grey)" stroke-width="3"/>
  <text class="b" x="486" y="150">Not known yet</text>

  <line x1="160" y1="290" x2="500" y2="222" stroke="var(--grey)" stroke-width="3"/>
  <line x1="486" y1="208" x2="514" y2="236" stroke="var(--warn)" stroke-width="4"/>
  <line x1="514" y1="208" x2="486" y2="236" stroke="var(--warn)" stroke-width="4"/>

  <line x1="160" y1="290" x2="490" y2="374" stroke="var(--grey)" stroke-width="3"/>
  <line x1="476" y1="360" x2="504" y2="388" stroke="var(--warn)" stroke-width="4"/>
  <line x1="504" y1="360" x2="476" y2="388" stroke="var(--warn)" stroke-width="4"/>

  <line x1="160" y1="290" x2="450" y2="442" stroke="var(--grey)" stroke-width="3"/>
  <line x1="436" y1="428" x2="464" y2="456" stroke="var(--warn)" stroke-width="4"/>
  <line x1="464" y1="428" x2="436" y2="456" stroke="var(--warn)" stroke-width="4"/>
  <text class="b" x="534" y="380">Dead end</text>

  <line x1="160" y1="290" x2="690" y2="290" stroke="var(--accent)" stroke-width="6" marker-end="url(#ar7)"/>
  <text class="g" x="712" y="296" fill="var(--accent)">This way</text>

  <text class="c" x="120" y="480">Ruling out saves you a few paths; pointing tells you which one</text>
</svg>
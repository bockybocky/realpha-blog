<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="零到一百的分數軸上，所有模型的點擠在七十附近一小段">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
  <text x="90" y="58" font-size="27" font-weight="700" fill="var(--ink)">前段模型全擠在同一小段</text>

  <line x1="100" y1="300" x2="860" y2="300" stroke="var(--line)" stroke-width="3"/>
  <line x1="100" y1="292" x2="100" y2="316" stroke="var(--dim)" stroke-width="2"/>
  <line x1="480" y1="292" x2="480" y2="316" stroke="var(--dim)" stroke-width="2"/>
  <line x1="860" y1="292" x2="860" y2="316" stroke="var(--dim)" stroke-width="2"/>
  <text x="100" y="344" font-size="16" fill="var(--dim)" text-anchor="middle">0</text>
  <text x="480" y="344" font-size="16" fill="var(--dim)" text-anchor="middle">50</text>
  <text x="860" y="344" font-size="16" fill="var(--dim)" text-anchor="middle">100</text>

  <rect x="592" y="262" width="88" height="76" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>

  <circle cx="602" cy="300" r="9" fill="var(--grey)"/>
  <circle cx="632" cy="300" r="9" fill="var(--grey)"/>
  <circle cx="640" cy="300" r="9" fill="var(--grey)"/>
  <circle cx="647" cy="300" r="9" fill="var(--grey)"/>
  <circle cx="655" cy="300" r="9" fill="var(--grey)"/>
  <circle cx="670" cy="300" r="9" fill="var(--grey)"/>
  <circle cx="662" cy="300" r="10" fill="var(--accent)"/>

  <line x1="602" y1="250" x2="602" y2="222" stroke="var(--dim)" stroke-width="1.5"/>
  <text x="560" y="210" font-size="16" fill="var(--dim)" text-anchor="middle">五個月前的 5.5</text>

  <line x1="680" y1="352" x2="720" y2="392" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="726" y="398" font-size="19" font-weight="600" fill="var(--accent)">Astra 74</text>

  <text x="90" y="452" font-size="22" font-weight="600" fill="var(--ink)">一分的差距，換不到你手上任何不同。</text>
</svg>
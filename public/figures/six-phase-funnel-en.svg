<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A horizontal funnel in six narrowing segments: a mass of command records enters on the left and narrows to a single sentence on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="40" y="56" font-size="27" fill="var(--ink)">Six stages, narrowing all the way</text>

  <text x="40" y="286" font-size="16" fill="var(--dim)">6,139 commands</text>
  <text x="40" y="312" font-size="16" fill="var(--dim)">829 files</text>
  <line x1="150" y1="300" x2="196" y2="300" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="206,300 192,294 192,306" fill="var(--dim)"/>

  <polygon points="210,150 325,170 325,430 210,450" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <polygon points="325,170 440,190 440,410 325,430" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <polygon points="440,190 555,210 555,390 440,410" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <polygon points="555,210 670,230 670,370 555,390" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <polygon points="670,230 785,250 785,350 670,370" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <polygon points="785,250 900,270 900,330 785,350" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>

  <g font-size="19" fill="var(--ink)" text-anchor="middle">
    <text x="267.5" y="146">Excavate</text>
    <text x="382.5" y="166">Distill</text>
    <text x="497.5" y="186">Interview</text>
    <text x="612.5" y="206">Mirror</text>
    <text x="727.5" y="226">Leverage</text>
    <text x="842.5" y="246">Residue</text>
  </g>
  <g font-size="16" fill="var(--dim)" text-anchor="middle">
    <text x="267.5" y="306">1</text>
    <text x="382.5" y="306">2</text>
    <text x="497.5" y="306">3</text>
    <text x="612.5" y="306">4</text>
    <text x="727.5" y="306">5</text>
    <text x="842.5" y="306">6</text>
  </g>

  <text x="842.5" y="382" font-size="22" fill="var(--accent)" text-anchor="middle">One sentence</text>
</svg>
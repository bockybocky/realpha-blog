<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四階上升的階梯代表產業、就業、公共設施、人口依序到位，價格的箭頭卻在第一階就衝到頂，兩者之間空出時間缺口">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">人還沒到，價格先到了</text>

  <rect x="140" y="370" width="170" height="60" fill="var(--card)" stroke="var(--line)"/>
  <text class="b" x="166" y="406">產業到</text>
  <rect x="310" y="310" width="170" height="120" fill="var(--card)" stroke="var(--line)"/>
  <text class="b" x="336" y="346">就業人口到</text>
  <rect x="480" y="250" width="170" height="180" fill="var(--card)" stroke="var(--line)"/>
  <text class="b" x="506" y="286">公共設施到</text>
  <rect x="650" y="190" width="170" height="240" fill="var(--card)" stroke="var(--line)"/>
  <text class="b" x="676" y="226">人口到</text>

  <path d="M140 430 L880 430" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="140" y="462">2022 宣布投資</text>
  <text class="b" x="760" y="462">之後很多年</text>

  <path d="M170 350 C260 150, 300 140, 380 140" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <path d="M380 140 l-16 -9 l0 18 z" fill="var(--accent)"/>
  <text class="g" x="200" y="124" fill="var(--accent)">價格</text>
  <text class="b" x="262" y="124" fill="var(--accent)">預售屋當年就開賣・翻過兩次</text>

  <path d="M520 150 L520 246" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 5"/>
  <text class="g" x="540" y="166" fill="var(--warn)">交屋日</text>
  <text class="b" x="540" y="190" fill="var(--warn)">人正要進去</text>

  <text class="c" x="60" y="518">房價走完的路，人口還在第一階</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一個人說的 CPU 與 GPU 比例在一年內整個倒過來">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">同一個人，一年，比例倒過來</text>
  <text class="b" x="60" y="94">藍＝CPU　灰＝GPU</text>

  <text class="g" x="60" y="152">去年說</text>
  <rect x="200" y="130" width="28" height="28" fill="var(--accent)" rx="3"/>
  <text class="b" x="248" y="152">配</text>
  <rect x="290" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="326" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="362" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="398" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="434" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="470" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="506" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="542" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="578" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="614" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="650" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="686" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="722" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="758" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="794" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>
  <rect x="830" y="130" width="28" height="28" fill="var(--grey)" rx="3"/>

  <path d="M480 200 L480 260" stroke="var(--line)" stroke-width="4"/>
  <text class="b" x="500" y="238">中間沒有交代</text>

  <text class="g" x="60" y="320">今年說</text>
  <rect x="200" y="298" width="28" height="28" fill="var(--grey)" rx="3"/>
  <text class="b" x="248" y="320">配</text>
  <g fill="var(--accent)">
    <rect x="290" y="298" width="28" height="28" rx="3"/>
    <rect x="326" y="298" width="28" height="28" rx="3"/>
    <rect x="362" y="298" width="28" height="28" rx="3"/>
    <rect x="398" y="298" width="28" height="28" rx="3"/>
    <rect x="434" y="298" width="28" height="28" rx="3"/>
    <rect x="470" y="298" width="28" height="28" rx="3"/>
    <rect x="506" y="298" width="28" height="28" rx="3"/>
    <rect x="542" y="298" width="28" height="28" rx="3"/>
    <rect x="578" y="298" width="28" height="28" rx="3"/>
    <rect x="614" y="298" width="28" height="28" rx="3"/>
    <rect x="650" y="298" width="28" height="28" rx="3"/>
    <rect x="686" y="298" width="28" height="28" rx="3"/>
    <rect x="722" y="298" width="28" height="28" rx="3"/>
    <rect x="758" y="298" width="28" height="28" rx="3"/>
    <rect x="794" y="298" width="28" height="28" rx="3"/>
    <rect x="290" y="334" width="28" height="28" rx="3"/>
    <rect x="326" y="334" width="28" height="28" rx="3"/>
    <rect x="362" y="334" width="28" height="28" rx="3"/>
    <rect x="398" y="334" width="28" height="28" rx="3"/>
    <rect x="434" y="334" width="28" height="28" rx="3"/>
    <rect x="470" y="334" width="28" height="28" rx="3"/>
    <rect x="506" y="334" width="28" height="28" rx="3"/>
    <rect x="542" y="334" width="28" height="28" rx="3"/>
    <rect x="578" y="334" width="28" height="28" rx="3"/>
    <rect x="614" y="334" width="28" height="28" rx="3"/>
    <rect x="650" y="334" width="28" height="28" rx="3"/>
    <rect x="686" y="334" width="28" height="28" rx="3"/>
    <rect x="722" y="334" width="28" height="28" rx="3"/>
    <rect x="758" y="334" width="28" height="28" rx="3"/>
    <rect x="794" y="334" width="28" height="28" rx="3"/>
  </g>

  <text class="c" x="60" y="460">可以對答案的＝結構</text>
  <text class="c" x="60" y="500">對不了答案的＝雜音，先擱著</text>
</svg>
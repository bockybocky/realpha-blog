<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A full tiled floor on the left contrasts with only a few scattered tiles on the right, where a dashed circle much larger than one tile has nowhere to land.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="60" font-size="27" fill="var(--ink)">The floor drops away tile by tile</text>

<text x="78" y="128" font-size="20" fill="var(--dim)">Early bull market</text>
<g fill="var(--card)" stroke="var(--line)" stroke-width="2">
<rect x="78" y="150" width="44" height="44"/><rect x="130" y="150" width="44" height="44"/><rect x="182" y="150" width="44" height="44"/><rect x="234" y="150" width="44" height="44"/><rect x="286" y="150" width="44" height="44"/><rect x="338" y="150" width="44" height="44"/>
<rect x="78" y="202" width="44" height="44"/><rect x="130" y="202" width="44" height="44"/><rect x="182" y="202" width="44" height="44"/><rect x="234" y="202" width="44" height="44"/><rect x="286" y="202" width="44" height="44"/><rect x="338" y="202" width="44" height="44"/>
<rect x="78" y="254" width="44" height="44"/><rect x="130" y="254" width="44" height="44"/><rect x="182" y="254" width="44" height="44"/><rect x="234" y="254" width="44" height="44"/><rect x="286" y="254" width="44" height="44"/><rect x="338" y="254" width="44" height="44"/>
<rect x="78" y="306" width="44" height="44"/><rect x="130" y="306" width="44" height="44"/><rect x="182" y="306" width="44" height="44"/><rect x="234" y="306" width="44" height="44"/><rect x="286" y="306" width="44" height="44"/><rect x="338" y="306" width="44" height="44"/>
</g>
<circle cx="230" cy="420" r="52" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="196" y="500" font-size="19" fill="var(--accent)">Big money</text>

<text x="578" y="128" font-size="20" fill="var(--warn)">Later stage</text>
<g fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 6">
<rect x="578" y="150" width="44" height="44"/><rect x="630" y="150" width="44" height="44"/><rect x="682" y="150" width="44" height="44"/><rect x="734" y="150" width="44" height="44"/><rect x="786" y="150" width="44" height="44"/><rect x="838" y="150" width="44" height="44"/>
<rect x="578" y="202" width="44" height="44"/><rect x="630" y="202" width="44" height="44"/><rect x="682" y="202" width="44" height="44"/><rect x="734" y="202" width="44" height="44"/><rect x="786" y="202" width="44" height="44"/><rect x="838" y="202" width="44" height="44"/>
<rect x="578" y="254" width="44" height="44"/><rect x="630" y="254" width="44" height="44"/><rect x="682" y="254" width="44" height="44"/><rect x="734" y="254" width="44" height="44"/><rect x="786" y="254" width="44" height="44"/><rect x="838" y="254" width="44" height="44"/>
<rect x="578" y="306" width="44" height="44"/><rect x="630" y="306" width="44" height="44"/><rect x="682" y="306" width="44" height="44"/><rect x="786" y="306" width="44" height="44"/><rect x="838" y="306" width="44" height="44"/>
</g>
<g fill="var(--card)" stroke="var(--line)" stroke-width="2">
<rect x="630" y="150" width="44" height="44"/><rect x="786" y="202" width="44" height="44"/><rect x="578" y="254" width="44" height="44"/><rect x="734" y="254" width="44" height="44"/><rect x="838" y="306" width="44" height="44"/>
</g>
<circle cx="652" cy="172" r="13" fill="var(--accent)"/>
<circle cx="808" cy="224" r="13" fill="var(--accent)"/>
<circle cx="756" cy="276" r="13" fill="var(--accent)"/>
<text x="578" y="382" font-size="16" fill="var(--dim)">Small money still fits</text>
<circle cx="730" cy="440" r="52" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 7"/>
<text x="664" y="520" font-size="19" fill="var(--warn)">Big money has nowhere to go</text>
</g>
</svg>
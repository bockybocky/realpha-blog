<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two hypotheses with two links each, the first ticked and the second crossed, showing the path fails partway through.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:19px; fill:var(--ink); font-weight:700; }
.b { font-size:16px; fill:var(--dim); }
.k { font-size:16px; fill:var(--ink); font-weight:700; }
.m { font-size:22px; font-weight:700; }
.c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="h" x="60" y="72">Both fail at link two</text>
<text class="g" x="60" y="160">Sell USTs for CNY</text>
<rect x="360" y="132" width="230" height="84" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="650" y="132" width="250" height="84" fill="var(--page)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="k" x="378" y="168">UST cuts</text>
<text class="m" x="378" y="198" fill="var(--accent)">✓</text>
<text class="k" x="668" y="168">Reserves down</text>
<text class="m" x="668" y="198" fill="var(--warn)">✕ they rose</text>
<line x1="590" y1="174" x2="650" y2="174" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 7"/>
<text class="g" x="60" y="330">Gold buying</text>
<rect x="360" y="302" width="230" height="84" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="650" y="302" width="250" height="84" fill="var(--page)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="k" x="378" y="338">PBoC buying</text>
<text class="m" x="378" y="368" fill="var(--accent)">✓</text>
<text class="k" x="668" y="338">Gold share</text>
<text class="m" x="668" y="368" fill="var(--warn)">✕ only 1–2 pts</text>
<line x1="590" y1="344" x2="650" y2="344" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 7"/>
<text class="c" x="60" y="480">One link ≠ whole path</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars sit side by side, one long and one short: the long one is the five-year roadmap, the short one a single day's quote.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<text x="60" y="72" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="27" fill="var(--ink)">Two rulers on one screen</text>

<text x="60" y="150" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">Tech roadmap</text>
<rect x="60" y="170" width="840" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<line x1="228" y1="170" x2="228" y2="204" stroke="var(--line)"/>
<line x1="396" y1="170" x2="396" y2="204" stroke="var(--line)"/>
<line x1="564" y1="170" x2="564" y2="204" stroke="var(--line)"/>
<line x1="732" y1="170" x2="732" y2="204" stroke="var(--line)"/>
<text x="60" y="230" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">This year</text>
<text x="876" y="230" text-anchor="end" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">In five years</text>

<text x="60" y="320" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">Today's quote</text>
<rect x="60" y="340" width="14" height="34" rx="3" fill="var(--accent)"/>
<text x="90" y="364" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">One day</text>

<text x="60" y="450" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="22" fill="var(--ink)">They clash because the rulers differ in length</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三層下檔防護並列，但全部站在同一塊地基上">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .w { font-size:19px; font-weight:700; fill:var(--warn); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="58">三層防護，一塊地基</text>

  <rect x="80" y="110" width="240" height="210" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="104" y="150">第一層</text>
  <text class="b" x="104" y="182">要賠錢</text>
  <text class="b" x="104" y="208">得整個 AI 失敗</text>
  <text class="b" x="104" y="252">巨觀事件</text>

  <rect x="360" y="110" width="240" height="210" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="384" y="150">第二層</text>
  <text class="b" x="384" y="182">算力有別的買家</text>
  <text class="b" x="384" y="208">排著隊</text>

  <rect x="640" y="110" width="240" height="210" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="664" y="150">第三層</text>
  <text class="b" x="664" y="182">卡的殘值走高</text>
  <text class="b" x="664" y="208">攤提優勢</text>

  <line x1="200" y1="320" x2="200" y2="396" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="480" y1="320" x2="480" y2="396" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="760" y1="320" x2="760" y2="396" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>

  <rect x="80" y="398" width="800" height="78" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
  <text class="c" x="104" y="432">同一個前提：算力長期緊缺</text>
  <text class="w" x="104" y="462">地基鬆掉，三層一起鬆</text>
</svg>
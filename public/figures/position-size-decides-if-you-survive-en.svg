<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The path dips and then climbs, piercing the large position's tolerance line while never touching the small position's line.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Right call, still shaken out</text>

<path d="M110 240 C 220 250 300 400 420 410 C 580 420 720 260 900 150" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text x="120" y="212" font-size="19" fill="var(--dim)">Today</text>
<text x="896" y="130" font-size="19" text-anchor="end" fill="var(--accent)">Still true long term</text>
<text x="420" y="458" font-size="19" text-anchor="middle" fill="var(--dim)">The delay stretch</text>

<path d="M110 322 L900 322" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 6"/>
<text x="900" y="310" font-size="19" text-anchor="end" fill="var(--warn)">Big position's floor</text>
<circle cx="268" cy="322" r="10" fill="var(--page)" stroke="var(--warn)" stroke-width="4"/>
<path d="M258 312 L278 332 M278 312 L258 332" stroke="var(--warn)" stroke-width="3"/>
<text x="268" y="288" font-size="19" text-anchor="middle" fill="var(--warn)">Shaken out</text>

<path d="M110 476 L900 476" stroke="var(--accent)" stroke-width="3" stroke-dasharray="9 6"/>
<text x="900" y="464" font-size="19" text-anchor="end" fill="var(--accent)">Small position's floor</text>
<text x="620" y="500" font-size="19" fill="var(--accent)">Untouched, so still in</text>

<text x="60" y="110" font-size="19" fill="var(--dim)">Size first, then direction</text>
</svg>
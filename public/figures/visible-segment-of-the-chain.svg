<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="長鏈中間三格高亮，最靠近自然的兩端節點灰暗地落在框外">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:700;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .s{font-size:15px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
    .n{font-size:16px;font-weight:700;fill:var(--ink)}
    .m{font-size:16px;font-weight:700;fill:var(--grey)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="56" y="56">看得見的只有中間一段</text>
<rect x="316" y="196" width="330" height="128" rx="12" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="316" y="180">你看得見的範圍</text>
<rect x="40" y="236" width="112" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="172" y="236" width="112" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="336" y="236" width="112" height="60" rx="8" fill="var(--accent)" opacity="0.25" stroke="var(--accent)"/>
<rect x="468" y="236" width="112" height="60" rx="8" fill="var(--accent)" opacity="0.25" stroke="var(--accent)"/>
<rect x="676" y="236" width="112" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="808" y="236" width="112" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="m" x="72" y="272">開採</text>
<text class="m" x="196" y="272">冶煉精煉</text>
<text class="n" x="356" y="272">供應商</text>
<text class="n" x="484" y="272">你的公司</text>
<text class="m" x="700" y="272">出貨使用</text>
<text class="m" x="836" y="272">報廢拆解</text>
<path d="M152 266 L172 266 M284 266 L336 266 M448 266 L468 266 M580 266 L676 266 M788 266 L808 266" stroke="var(--grey)" stroke-width="2"/>
<path d="M112 316 L112 372" stroke="var(--warn)" stroke-width="2"/>
<path d="M844 316 L844 372" stroke="var(--warn)" stroke-width="2"/>
<text class="s" x="40" y="398">棲地・水・土地</text>
<text class="s" x="756" y="398">電子廢棄物・健康代價</text>
<text class="c" x="56" y="472">自然的代價都在框外那兩端</text>
<text class="b" x="56" y="504">不是看它離山離海多遠，是看料從哪來、最後去哪</text>
</svg>
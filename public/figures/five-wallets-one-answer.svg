<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊付出五份，右邊只留下一份答案">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">付五份，留一份</text>

  <text class="t" x="48" y="116" font-size="19" font-weight="700" fill="var(--dim)">付出去</text>

  <rect x="48" y="150" width="96" height="260" rx="12" fill="var(--warn)" opacity="0.9"/>
  <rect x="160" y="150" width="96" height="260" rx="12" fill="var(--warn)" opacity="0.9"/>
  <rect x="272" y="150" width="96" height="260" rx="12" fill="var(--warn)" opacity="0.9"/>
  <rect x="384" y="150" width="96" height="260" rx="12" fill="var(--warn)" opacity="0.9"/>
  <rect x="496" y="150" width="96" height="260" rx="12" fill="var(--warn)" opacity="0.9"/>

  <text class="t" x="96" y="292" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">$2</text>
  <text class="t" x="208" y="292" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">$2</text>
  <text class="t" x="320" y="292" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">$2</text>
  <text class="t" x="432" y="292" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">$2</text>
  <text class="t" x="544" y="292" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">$2</text>

  <text class="t" x="320" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">五席各吃一份訂閱額度</text>

  <path d="M616 280 L690 280" stroke="var(--grey)" stroke-width="3" fill="none"/>
  <path d="M690 280 l-14 -9 v18 z" fill="var(--grey)"/>

  <text class="t" x="716" y="116" font-size="19" font-weight="700" fill="var(--dim)">留下來</text>
  <rect x="716" y="332" width="96" height="78" rx="12" fill="var(--accent)"/>
  <text class="t" x="764" y="380" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">1</text>
  <text class="t" x="764" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">一個採用的答案</text>
</svg>
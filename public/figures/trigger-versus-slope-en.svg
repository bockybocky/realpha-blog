<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Several arrows strike the same point on the left, while a ball rolls down a slope on the right.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">Each side answers a different question</text>
<rect x="80" y="100" width="380" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="100" y="142">Why did Weil fail in 2026?</text>
<line x1="110" y1="186" x2="300" y2="266" stroke="var(--warn)" stroke-width="3"/>
<polygon points="300,266 312,274 302,256" fill="var(--warn)"/>
<text class="b" x="112" y="176">Rules changed</text>
<line x1="110" y1="236" x2="300" y2="272" stroke="var(--warn)" stroke-width="3"/>
<polygon points="300,272 314,276 302,262" fill="var(--warn)"/>
<text class="b" x="112" y="226">Strategy held too long</text>
<line x1="110" y1="300" x2="300" y2="288" stroke="var(--warn)" stroke-width="3"/>
<polygon points="300,288 314,286 302,298" fill="var(--warn)"/>
<text class="b" x="112" y="290">Governance lost trust</text>
<line x1="110" y1="352" x2="300" y2="296" stroke="var(--warn)" stroke-width="3"/>
<polygon points="300,296 314,292 304,306" fill="var(--warn)"/>
<text class="b" x="112" y="342">That person left in September</text>
<circle cx="326" cy="282" r="11" fill="var(--warn)"/>
<line x1="344" y1="258" x2="356" y2="246" stroke="var(--warn)" stroke-width="3"/>
<line x1="348" y1="282" x2="364" y2="282" stroke="var(--warn)" stroke-width="3"/>
<line x1="344" y1="306" x2="356" y2="318" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="100" y="400">One-time push</text>
<rect x="500" y="100" width="380" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="520" y="142">Why can't it stop once it starts?</text>
<line x1="540" y1="196" x2="850" y2="344" stroke="var(--warn)" stroke-width="4"/>
<circle cx="640" cy="232" r="15" fill="var(--warn)"/>
<line x1="688" y1="268" x2="762" y2="304" stroke="var(--warn)" stroke-width="3"/>
<polygon points="762,304 776,310 764,292" fill="var(--warn)"/>
<text class="b" x="520" y="400">One condition: can you pull your share?</text>
<text class="c" x="60" y="500">One explains the start; one explains why it won't stop</text>
</svg>
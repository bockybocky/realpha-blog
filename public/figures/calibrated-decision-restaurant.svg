<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="十個圓圈八個罵兩個誇，對照兩條橫條，一條全負面，一條八比二與人群比例相符">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="40" y="58" font-size="27" font-weight="700">「這間餐廳很扯」</text>
<text x="60" y="124" font-size="19" style="fill:var(--dim)">寫這句的 10 個人</text>
<g font-size="17" font-weight="700" text-anchor="middle">
<circle cx="90" cy="190" r="28" fill="var(--warn)"/><text x="90" y="196" style="fill:var(--page)">罵</text>
<circle cx="160" cy="190" r="28" fill="var(--warn)"/><text x="160" y="196" style="fill:var(--page)">罵</text>
<circle cx="230" cy="190" r="28" fill="var(--warn)"/><text x="230" y="196" style="fill:var(--page)">罵</text>
<circle cx="300" cy="190" r="28" fill="var(--warn)"/><text x="300" y="196" style="fill:var(--page)">罵</text>
<circle cx="370" cy="190" r="28" fill="var(--warn)"/><text x="370" y="196" style="fill:var(--page)">罵</text>
<circle cx="90" cy="270" r="28" fill="var(--warn)"/><text x="90" y="276" style="fill:var(--page)">罵</text>
<circle cx="160" cy="270" r="28" fill="var(--warn)"/><text x="160" y="276" style="fill:var(--page)">罵</text>
<circle cx="230" cy="270" r="28" fill="var(--warn)"/><text x="230" y="276" style="fill:var(--page)">罵</text>
<circle cx="300" cy="270" r="28" fill="var(--accent)"/><text x="300" y="276" style="fill:var(--page)">誇</text>
<circle cx="370" cy="270" r="28" fill="var(--accent)"/><text x="370" y="276" style="fill:var(--page)">誇</text>
</g>
<line x1="450" y1="120" x2="450" y2="400" stroke="var(--line)" stroke-width="2"/>
<text x="500" y="165" font-size="19">只挑一個</text>
<rect x="500" y="180" width="400" height="44" rx="6" fill="var(--warn)"/>
<text x="520" y="209" font-size="16" font-weight="700" style="fill:var(--page)">負面 100%</text>
<text x="500" y="285" font-size="19" font-weight="700" style="fill:var(--accent)">校準決策</text>
<rect x="500" y="300" width="320" height="44" fill="var(--warn)"/>
<rect x="820" y="300" width="80" height="44" fill="var(--accent)"/>
<text x="520" y="329" font-size="16" font-weight="700" style="fill:var(--page)">負面 80%</text>
<text x="860" y="329" font-size="16" font-weight="700" text-anchor="middle" style="fill:var(--page)">20%</text>
<text x="500" y="378" font-size="16" style="fill:var(--accent)">比例＝人群</text>
<text x="480" y="480" font-size="22" font-weight="700" text-anchor="middle">選對，機率也要對</text>
</svg>
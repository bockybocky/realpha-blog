<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Early quotes sit above the timeline and later numbers sit below it, with dashed lines slanting down and to the right from each quote to the answer that arrived years later.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700} .g{font-size:20px;font-weight:700}
    .b{font-size:16px} .bb{font-size:16px;font-weight:700} .d{font-size:15px;fill:var(--dim)} .c{font-size:22px;font-weight:700}
</style>
<text x="480" y="50" class="t" text-anchor="middle">Hype 1st, data later</text>
<text x="30" y="165" class="g" style="fill:var(--dim)">Said</text>
<text x="30" y="360" class="g">Data</text>
<line x1="110" y1="270" x2="920" y2="270" stroke="var(--dim)" stroke-width="2"/>
<text x="130" y="294" class="d" text-anchor="middle">2016</text>
<text x="380" y="294" class="d" text-anchor="middle">2018</text>
<text x="630" y="294" class="d" text-anchor="middle">2020</text>
<text x="755" y="294" class="d" text-anchor="middle">2021</text>
<text x="880" y="294" class="d" text-anchor="middle">2022</text>
<line x1="130" y1="185" x2="130" y2="262" stroke="var(--grey)" stroke-width="2"/>
<circle cx="130" cy="270" r="7" fill="var(--grey)"/>
<text x="130" y="150" class="bb" text-anchor="middle">Boom</text>
<text x="130" y="172" class="d" text-anchor="middle">Sold 2y</text>
<line x1="630" y1="185" x2="630" y2="262" stroke="var(--grey)" stroke-width="2"/>
<circle cx="630" cy="262" r="6" fill="var(--grey)"/>
<text x="630" y="150" class="bb" text-anchor="middle">582 PoCs</text>
<text x="630" y="172" class="d" text-anchor="middle">Sounds big</text>
<line x1="380" y1="278" x2="380" y2="320" stroke="var(--accent)" stroke-width="2"/>
<circle cx="380" cy="270" r="7" fill="var(--accent)"/>
<text x="380" y="347" class="g" text-anchor="middle" style="fill:var(--warn)">0 shipped</text>
<line x1="630" y1="278" x2="630" y2="320" stroke="var(--accent)" stroke-width="2"/>
<circle cx="630" cy="278" r="6" fill="var(--accent)"/>
<text x="630" y="347" class="bb" text-anchor="middle">AppD 40%</text>
<line x1="755" y1="278" x2="755" y2="320" stroke="var(--accent)" stroke-width="2"/>
<circle cx="755" cy="270" r="7" fill="var(--accent)"/>
<text x="755" y="347" class="bb" text-anchor="middle">Idle fab</text>
<text x="755" y="369" class="d" text-anchor="middle">$400M/yr</text>
<line x1="880" y1="278" x2="880" y2="320" stroke="var(--accent)" stroke-width="2"/>
<circle cx="880" cy="270" r="7" fill="var(--accent)"/>
<text x="880" y="347" class="bb" text-anchor="middle">End</text>
<path d="M175,180 C260,200 330,300 370,322" fill="none" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="480" y="470" class="c" text-anchor="middle">Late, but honest</text>
</svg>
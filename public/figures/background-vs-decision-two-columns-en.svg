<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-label="Two sheets with two columns each: the left sheet's right column is blank, while the right sheet's right column holds two blue tags.">
<rect x="0" y="0" width="960" height="530" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700">In a week, look right</text>
<rect x="90" y="100" width="360" height="340" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="270" y1="120" x2="270" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="110" y1="155" x2="430" y2="155" stroke="var(--line)" stroke-width="2"/>
<text x="180" y="143" text-anchor="middle" font-size="19" font-weight="700">Mood</text>
<text x="360" y="143" text-anchor="middle" font-size="19" font-weight="700">Acts</text>
<rect x="120" y="175" width="120" height="34" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="1.5"/><text x="180" y="198" text-anchor="middle" font-size="16" style="fill:var(--dim)">Fear</text>
<rect x="120" y="220" width="120" height="34" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="1.5"/><text x="180" y="243" text-anchor="middle" font-size="16" style="fill:var(--dim)">Grudge</text>
<rect x="120" y="265" width="120" height="34" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="1.5"/><text x="180" y="288" text-anchor="middle" font-size="16" style="fill:var(--dim)">Words</text>
<rect x="120" y="310" width="120" height="34" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="1.5"/><text x="180" y="333" text-anchor="middle" font-size="16" style="fill:var(--dim)">Polls</text>
<rect x="300" y="175" width="120" height="169" rx="8" fill="none" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="360" y="268" text-anchor="middle" font-size="22" style="fill:var(--grey)">Empty</text>
<text x="270" y="480" text-anchor="middle" font-size="20" style="fill:var(--dim)">Mood only</text>
<rect x="510" y="100" width="360" height="340" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="690" y1="120" x2="690" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="530" y1="155" x2="850" y2="155" stroke="var(--line)" stroke-width="2"/>
<text x="600" y="143" text-anchor="middle" font-size="19" font-weight="700">Mood</text>
<text x="780" y="143" text-anchor="middle" font-size="19" font-weight="700">Acts</text>
<rect x="540" y="175" width="120" height="34" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="1.5"/><text x="600" y="198" text-anchor="middle" font-size="16" style="fill:var(--dim)">Words</text>
<rect x="540" y="220" width="120" height="34" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="1.5"/><text x="600" y="243" text-anchor="middle" font-size="16" style="fill:var(--dim)">Polls</text>
<rect x="720" y="175" width="120" height="34" rx="8" fill="var(--accent)"/><text x="780" y="198" text-anchor="middle" font-size="16" font-weight="700" style="fill:var(--page)">Deadline</text>
<rect x="720" y="220" width="120" height="34" rx="8" fill="var(--accent)"/><text x="780" y="243" text-anchor="middle" font-size="16" font-weight="700" style="fill:var(--page)">Mobilize</text>
<text x="690" y="480" text-anchor="middle" font-size="20" font-weight="700" style="fill:var(--accent)">Alarming</text>
</svg>
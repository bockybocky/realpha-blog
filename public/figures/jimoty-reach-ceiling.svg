<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="大圈內一小塊實心區被一條水平天花板壓住，天花板外另有一塊區域，一條新路徑繞過天花板連進那塊區域">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; font-weight:700; }
    .bd  { font-size:16px; fill:var(--dim); }
    .cc  { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t ttl" x="60" y="62">天花板不在成長率，在見不見面</text>

  <rect x="60" y="95" width="840" height="355" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <circle cx="480" cy="275" r="160" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <text class="t bd" x="396" y="105">成人人口</text>

  <path d="M480,355 A160,160 0 0,1 342,196 L618,196 A160,160 0 0,1 480,355 Z" fill="none"/>
  <rect x="352" y="300" width="256" height="100" fill="none"/>
  <path d="M345,315 A160,160 0 0,0 615,315 Z" fill="var(--accent)" opacity="0.35"/>
  <line x1="320" y1="315" x2="640" y2="315" stroke="var(--warn)" stroke-width="5"/>
  <text class="t grp" x="648" y="320" fill="var(--warn)">天花板</text>
  <text class="t bd"  x="420" y="372">一千萬人在用</text>
  <text class="t bd"  x="398" y="250">不想見陌生人</text>
  <text class="t bd"  x="398" y="200">沒聽過的人</text>

  <path d="M200,420 C200,350 236,300 300,282 L420,270" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <path d="M420,270 L402,262 L404,280 Z" fill="var(--accent)"/>
  <text class="t grp" x="120" y="440" fill="var(--accent)">實體據點</text>

  <text class="t cc" x="60" y="505">往上長不動的時候，要開的是另一條路</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="遠處看兩支手機夾角幾乎為零，近處看夾角張得很開">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .g { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="48" y="62" font-size="27" font-weight="700">分不分得出是兩個人</text>

  <rect x="48" y="92" width="420" height="380" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <circle cx="258" cy="140" r="14" fill="var(--grey)"/>
  <text class="g" x="196" y="128" font-size="16">衛星 300 公里</text>
  <path d="M258 154 L246 400" stroke="var(--grey)" stroke-width="3"/>
  <path d="M258 154 L270 400" stroke="var(--grey)" stroke-width="3"/>
  <rect x="228" y="400" width="22" height="38" rx="4" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <rect x="266" y="400" width="22" height="38" rx="4" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <text class="t" x="148" y="462" font-size="20" font-weight="700" fill="var(--warn)">看起來是同一個點</text>

  <rect x="492" y="92" width="420" height="380" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <circle cx="702" cy="300" r="14" fill="var(--accent)"/>
  <text class="g" x="636" y="288" font-size="16">基地台 幾百公尺</text>
  <path d="M702 314 L672 400" stroke="var(--accent)" stroke-width="3"/>
  <path d="M702 314 L744 400" stroke="var(--accent)" stroke-width="3"/>
  <rect x="654" y="400" width="22" height="38" rx="4" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <rect x="736" y="400" width="22" height="38" rx="4" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <text class="t" x="604" y="462" font-size="20" font-weight="700" fill="var(--accent)">角度分得開</text>

  <text class="t" x="48" y="524" font-size="22" font-weight="700">兩支手機的距離一樣，差的是看的人站多遠</text>
</svg>
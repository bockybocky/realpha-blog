<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two dividing lines cross and are redrawn, so former traditional names move to the with-AI side and former tech names fall to the without-AI side.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <defs>
    <marker id="ar7" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">The dividing line changed</text>

  <text class="t" x="60" y="130" font-size="19" font-weight="700" fill="var(--dim)">Old line</text>
  <rect x="60" y="150" width="390" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="510" y="150" width="390" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="80" y="182" font-size="20" font-weight="700" fill="var(--dim)">Traditional</text>
  <text class="t" x="80" y="215" font-size="16" fill="var(--ink)">Fiberglass cloth · specialty chemicals · steel structures</text>
  <text class="t" x="530" y="182" font-size="20" font-weight="700" fill="var(--dim)">Tech</text>
  <text class="t" x="530" y="215" font-size="16" fill="var(--ink)">Phones · laptops</text>

  <line x1="200" y1="265" x2="700" y2="395" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar7)"/>
  <line x1="700" y1="265" x2="200" y2="395" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar7)"/>

  <text class="t" x="60" y="440" font-size="19" font-weight="700" fill="var(--accent)">New line</text>
  <rect x="60" y="455" width="390" height="110" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="510" y="455" width="390" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="80" y="487" font-size="20" font-weight="700" fill="var(--accent)">With AI</text>
  <text class="t" x="80" y="520" font-size="16" fill="var(--ink)">Phones · laptops</text>
  <text class="t" x="530" y="487" font-size="20" font-weight="700" fill="var(--dim)">Without AI</text>
  <text class="t" x="530" y="520" font-size="16" fill="var(--ink)">Fiberglass cloth · specialty chemicals · steel structures</text>
</svg>
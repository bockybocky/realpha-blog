<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The rate is pulled from its weakest point back to the top of the target band and slowly slides out again, with a thick floor along the band's lower edge.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); font-weight:700; }
    .bdy { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="ttl" x="60" y="62">Intervention lays a floor; it does not turn the trend</text>
  <line x1="110" y1="120" x2="110" y2="460" stroke="var(--line)" stroke-width="2"/>
  <text class="bdy" x="100" y="132" text-anchor="end">Yen strong</text>
  <text class="bdy" x="100" y="456" text-anchor="end">Yen weak</text>
  <rect x="140" y="176" width="760" height="91" fill="var(--card)" stroke="var(--line)" stroke-width="1"/>
  <text class="grp" x="162" y="212">Target band</text>
  <text class="bdy" x="162" y="238">150 to 154</text>
  <line x1="140" y1="267" x2="900" y2="267" stroke="var(--accent)" stroke-width="4"/>
  <text class="grp" x="898" y="296" text-anchor="end">Floor</text>
  <polyline points="170,404 430,221 860,290" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="170" cy="404" r="7" fill="var(--warn)"/>
  <circle cx="430" cy="221" r="7" fill="var(--warn)"/>
  <circle cx="860" cy="290" r="7" fill="var(--warn)"/>
  <text class="bdy" x="170" y="432" text-anchor="middle">160</text>
  <text class="bdy" x="430" y="205" text-anchor="middle">152</text>
  <text class="bdy" x="860" y="322" text-anchor="middle">155</text>
  <text class="grp" x="252" y="352">Intervention</text>
  <text class="end" x="60" y="546">It holds for a while; the direction is unchanged</text>
</svg>
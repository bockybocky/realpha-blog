<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left, a tall column is stacked from three segments representing compute, human capital, and institutional experience; on the right, only the short bottom compute segment remains, with the rest left blank.">
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">Why he argues for stopping now, not later</text>
  <line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
  <rect x="150" y="330" width="240" height="90" fill="var(--accent)"/>
  <rect x="150" y="240" width="240" height="90" fill="var(--accent)" opacity="0.6"/>
  <rect x="150" y="150" width="240" height="90" fill="var(--accent)" opacity="0.35"/>
  <text x="270" y="383" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">Compute</text>
  <text x="270" y="293" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Human capital</text>
  <text x="270" y="203" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Institutional experience</text>
  <text x="270" y="456" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Now</text>
  <text x="270" y="484" font-size="15" text-anchor="middle" fill="var(--dim)">U.S. labs are strong in all three</text>
  <rect x="610" y="330" width="240" height="90" fill="var(--accent)"/>
  <rect x="610" y="150" width="240" height="180" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="730" y="383" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">Compute</text>
  <text x="730" y="248" font-size="17" text-anchor="middle" fill="var(--dim)">No longer counts</text>
  <text x="730" y="456" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Further ahead</text>
  <text x="730" y="484" font-size="15" text-anchor="middle" fill="var(--dim)">The race becomes pure scale</text>
  <line x1="420" y1="300" x2="580" y2="300" stroke="var(--dim)" stroke-width="3"/>
  <polygon points="596,300 576,292 576,308" fill="var(--dim)"/>
  <text x="60" y="516" font-size="22" font-weight="700" fill="var(--ink)">The earlier you stop, the more your bet rests on factors where you still lead</text>
</svg>
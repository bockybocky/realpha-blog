<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bars of different heights, where a segment at the top of the taller bar is enclosed in a dashed outline marking the part that comes from a change in what is counted.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">The line rose, partly on a new ruler</text>
  <line x1="150" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
  <rect x="230" y="252" width="150" height="218" fill="var(--grey)"/>
  <text x="230" y="500" font-size="19" fill="var(--dim)">Last yr</text>
  <text x="230" y="526" font-size="16" fill="var(--dim)">~2.4%</text>
  <rect x="560" y="230" width="150" height="240" fill="var(--accent)"/>
  <rect x="560" y="160" width="150" height="70" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="566" y1="228" x2="620" y2="166" stroke="var(--warn)" stroke-width="1.5"/>
  <line x1="606" y1="228" x2="660" y2="166" stroke="var(--warn)" stroke-width="1.5"/>
  <line x1="646" y1="228" x2="700" y2="166" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="560" y="500" font-size="19" fill="var(--ink)">This yr</text>
  <text x="560" y="526" font-size="16" fill="var(--dim)">~3.3%</text>
  <text x="730" y="188" font-size="19" fill="var(--warn)">~$10B</text>
  <text x="730" y="214" font-size="16" fill="var(--dim)">Pensions, CG in</text>
  <text x="730" y="258" font-size="16" fill="var(--dim)">Already in</text>
  <text x="60" y="110" font-size="16" fill="var(--dim)">Dashed band not to scale: amount only in source</text>
  <text x="60" y="552" font-size="22" fill="var(--ink)">Line up; scope changed too.</text>
</svg>
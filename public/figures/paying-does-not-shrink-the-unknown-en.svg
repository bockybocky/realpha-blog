<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The uncertainty circles are the same size before and after payment; paying only adds a bill.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="60" font-size="27" font-weight="700" fill="var(--ink)">What does topping up buy?</text>

  <text class="t" x="250" y="118" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">Free</text>
  <text class="t" x="710" y="118" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">Paid</text>

  <circle cx="250" cy="280" r="100" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
  <text class="t" x="250" y="274" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Uncertainty</text>
  <text class="t" x="250" y="302" font-size="15" fill="var(--dim)" text-anchor="middle">Vendor claims</text>

  <line x1="400" y1="280" x2="520" y2="280" stroke="var(--accent)" stroke-width="3"/>
  <path d="M516 272 L 536 280 L 516 288 Z" fill="var(--accent)"/>

  <circle cx="710" cy="280" r="100" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
  <text class="t" x="710" y="274" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Uncertainty</text>
  <text class="t" x="710" y="302" font-size="15" fill="var(--dim)" text-anchor="middle">New vendor</text>

  <rect x="788" y="364" width="130" height="62" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="853" y="402" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Bill</text>

  <line x1="150" y1="412" x2="350" y2="412" stroke="var(--line)" stroke-width="2"/>
  <line x1="610" y1="412" x2="810" y2="412" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="470" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Same circle, one more expense</text>
</svg>
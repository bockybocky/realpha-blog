<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars of equal width sit one above the other, the lower one with its left part shrunk and its right part widened, and both are labeled as undersupplied at the right end.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">One fab, capacity moved from one line to another</text>
<text x="80" y="156" font-size="19" fill="var(--dim)">Before</text>
<rect x="180" y="130" width="330" height="70" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="510" y="130" width="330" height="70" fill="var(--accent)" opacity="0.75" stroke="var(--line)" stroke-width="3"/>
<text x="345" y="172" font-size="19" fill="var(--ink)" text-anchor="middle">Driver IC</text>
<text x="675" y="172" font-size="19" fill="var(--page)" text-anchor="middle">Power IC</text>
<text x="80" y="326" font-size="19" fill="var(--dim)">After</text>
<rect x="180" y="300" width="120" height="70" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="300" y="300" width="540" height="70" fill="var(--accent)" opacity="0.75" stroke="var(--line)" stroke-width="3"/>
<text x="240" y="342" font-size="16" fill="var(--ink)" text-anchor="middle">Driver</text>
<text x="570" y="342" font-size="19" fill="var(--page)" text-anchor="middle">Power IC</text>
<line x1="420" y1="212" x2="330" y2="288" stroke="var(--accent)" stroke-width="4"/>
<polygon points="330,288 346,282 344,298" fill="var(--accent)"/>
<text x="860" y="172" font-size="16" fill="var(--warn)">Short</text>
<text x="860" y="342" font-size="16" fill="var(--warn)">Still short</text>
<text x="60" y="462" font-size="22" fill="var(--ink)">The same cut that moved it also shortened the way back</text>
</svg>
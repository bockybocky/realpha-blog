<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊的牆把不可信程式碼擋在外面，右邊同一面牆破洞，代理反而把外來套件直接拉進來執行">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">三十年的控制被倒過來做</text>
<text x="60" y="116" font-size="19" fill="var(--dim)">以前的規則</text>
<text x="540" y="116" font-size="19" fill="var(--warn)">現在的做法</text>
<rect x="60" y="150" width="400" height="300" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="244" y="150" width="20" height="300" fill="var(--accent)"/>
<path d="M90 230 L 226 230" stroke="var(--grey)" stroke-width="4"/>
<path d="M90 300 L 226 300" stroke="var(--grey)" stroke-width="4"/>
<path d="M90 370 L 226 370" stroke="var(--grey)" stroke-width="4"/>
<path d="M216 218 L 236 230 L 216 242" fill="var(--grey)"/>
<path d="M216 288 L 236 300 L 216 312" fill="var(--grey)"/>
<path d="M216 358 L 236 370 L 216 382" fill="var(--grey)"/>
<text x="150" y="196" font-size="16" fill="var(--dim)" text-anchor="middle">外來程式碼</text>
<text x="360" y="284" font-size="19" fill="var(--ink)" text-anchor="middle">不可信就不執行</text>
<text x="360" y="316" font-size="16" fill="var(--dim)" text-anchor="middle">全部擋在外面</text>
<rect x="500" y="150" width="400" height="300" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<rect x="684" y="150" width="20" height="120" fill="var(--warn)"/>
<rect x="684" y="366" width="20" height="84" fill="var(--warn)"/>
<path d="M530 300 L 790 300" stroke="var(--warn)" stroke-width="5"/>
<polygon points="790,290 814,300 790,310" fill="var(--warn)"/>
<text x="590" y="196" font-size="16" fill="var(--dim)" text-anchor="middle">被下毒的套件</text>
<text x="694" y="344" font-size="16" fill="var(--warn)" text-anchor="middle">不檢查</text>
<text x="834" y="256" font-size="19" fill="var(--ink)" text-anchor="middle">代理</text>
<text x="834" y="284" font-size="16" fill="var(--dim)" text-anchor="middle">高權限</text>
<text x="834" y="340" font-size="16" fill="var(--dim)" text-anchor="middle">照跑</text>
<text x="60" y="500" font-size="22" fill="var(--ink)">牆沒拆，是我們自己在牆上開了門</text>
</g>
</svg>
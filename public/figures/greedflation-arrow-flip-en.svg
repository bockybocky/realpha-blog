<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two arrow comparisons: in the past, rising costs squeezed margins; this time, rising costs lift margins as well.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="58">The direction of margins is the signal</text>
<rect x="60" y="96" width="400" height="368" rx="12" fill="var(--card)"/>
<rect x="500" y="96" width="400" height="368" rx="12" fill="var(--card)"/>
<text class="g" x="84" y="134">Every past cycle</text>
<text class="g" x="524" y="134">This time</text>
<line x1="170" y1="400" x2="170" y2="210" stroke="var(--grey)" stroke-width="14"/>
<polygon points="170,186 152,218 188,218" fill="var(--grey)"/>
<text class="b" x="170" y="430" text-anchor="middle">Costs</text>
<line x1="350" y1="210" x2="350" y2="400" stroke="var(--grey)" stroke-width="14"/>
<polygon points="350,424 332,392 368,392" fill="var(--grey)"/>
<text class="b" x="350" y="190" text-anchor="middle">Gross margin</text>
<line x1="610" y1="400" x2="610" y2="210" stroke="var(--grey)" stroke-width="14"/>
<polygon points="610,186 592,218 628,218" fill="var(--grey)"/>
<text class="b" x="610" y="430" text-anchor="middle">Costs</text>
<line x1="790" y1="400" x2="790" y2="190" stroke="var(--warn)" stroke-width="18"/>
<polygon points="790,162 768,198 812,198" fill="var(--warn)"/>
<text class="b" x="790" y="430" text-anchor="middle" fill="var(--warn)">Gross margin</text>
<text class="b" x="84" y="458">The standard starting point for a turn</text>
<text class="b" x="524" y="458">Price increases exceed what is needed to protect margins</text>
<text class="c" x="60" y="512">Costs rise, margins rise too: both lines point up</text>
</svg>
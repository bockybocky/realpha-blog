<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="成交量柱狀圖從高一路縮到幾乎看不見，右邊孤零零一根特別高的柱子，標示他在等的那一次爆量"><rect x="0" y="0" width="960" height="560" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style><g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'><text x="60" y="58" font-size="27px" fill="var(--ink)" text-anchor="start" font-weight="600">流動性乾掉的樣子：量一路縮，等一根爆量</text><text x="60" y="120" font-size="19px" fill="var(--dim)" text-anchor="start" font-weight="normal">單日成交量</text><line x1="60" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/><rect x="110" y="200" width="28" height="250" fill="var(--grey)"/><rect x="150" y="228" width="28" height="222" fill="var(--grey)"/><rect x="190" y="254" width="28" height="196" fill="var(--grey)"/><rect x="230" y="284" width="28" height="166" fill="var(--grey)"/><rect x="270" y="314" width="28" height="136" fill="var(--grey)"/><rect x="310" y="342" width="28" height="108" fill="var(--grey)"/><rect x="350" y="366" width="28" height="84" fill="var(--grey)"/><rect x="390" y="388" width="28" height="62" fill="var(--grey)"/><rect x="430" y="406" width="28" height="44" fill="var(--grey)"/><rect x="470" y="420" width="28" height="30" fill="var(--warn)"/><rect x="510" y="430" width="28" height="20" fill="var(--warn)"/><rect x="550" y="436" width="28" height="14" fill="var(--warn)"/><rect x="590" y="440" width="28" height="10" fill="var(--warn)"/><line x1="460" y1="470" x2="630" y2="470" stroke="var(--warn)" stroke-width="2"/><text x="545" y="496" font-size="16px" fill="var(--warn)" text-anchor="middle" font-weight="normal">兩小時二十張</text><text x="300" y="170" font-size="16px" fill="var(--dim)" text-anchor="middle" font-weight="normal">一千億以下</text><line x1="300" y1="186" x2="300" y2="300" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="800" y="120" width="56" height="330" fill="var(--accent)"/><text x="828" y="104" font-size="20px" fill="var(--accent)" text-anchor="middle" font-weight="600">爆量</text><text x="700" y="220" font-size="19px" fill="var(--accent)" text-anchor="end" font-weight="normal">他在等這根</text><line x1="712" y1="214" x2="790" y2="200" stroke="var(--accent)" stroke-width="2"/><text x="828" y="486" font-size="16px" fill="var(--dim)" text-anchor="middle" font-weight="normal">出得掉</text><text x="60" y="520" font-size="22px" fill="var(--ink)" text-anchor="start" font-weight="600">量縮到這裡，被追繳的人沒有對手盤</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條橫條被切成左邊三分之一與右邊三分之二，左段上色標示一年內出現超智慧，右段留白標示不會這麼快；下方一個條件方塊用箭頭指向左段">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">他給的機率，長成什麼形狀</text>
  <rect x="60" y="120" width="840" height="130" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="120" width="280" height="130" rx="10" fill="var(--accent)"/>
  <text x="200" y="175" font-size="20" font-weight="700" text-anchor="middle" fill="var(--page)">約三分之一</text>
  <text x="200" y="208" font-size="16" text-anchor="middle" fill="var(--page)">一年內</text>
  <text x="620" y="175" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">約三分之二</text>
  <text x="620" y="208" font-size="16" text-anchor="middle" fill="var(--dim)">不會這麼快</text>
  <line x1="200" y1="330" x2="200" y2="268" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="200,254 192,274 208,274" fill="var(--accent)"/>
  <rect x="60" y="334" width="420" height="78" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="84" y="366" font-size="19" font-weight="700" fill="var(--ink)">掛著的條件</text>
  <text x="84" y="396" font-size="16" fill="var(--dim)">遞迴自我改善接得上</text>
  <rect x="520" y="334" width="380" height="78" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="544" y="366" font-size="19" font-weight="700" fill="var(--dim)">條件不成立</text>
  <text x="544" y="396" font-size="16" fill="var(--dim)">左邊這一段整個縮掉</text>
  <text x="60" y="470" font-size="22" font-weight="700" fill="var(--ink)">數字本身不是結論，掛它的那個條件才是</text>
</svg>
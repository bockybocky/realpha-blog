<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條橫向的路上排著四道門，最前面一道被高亮框起，後面三道被一條灰色長括號涵蓋">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.d{font-size:19px;fill:var(--dim);font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.a{font-size:16px;fill:var(--accent);font-weight:700}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56">清關之後，還排著幾道門</text>

<line x1="60" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="6"/>
<path d="M900 300 L884 292 L884 308 Z" fill="var(--line)"/>

<rect x="133" y="255" width="16" height="90" rx="3" fill="var(--accent)"/>
<rect x="393" y="255" width="16" height="90" rx="3" fill="var(--grey)"/>
<rect x="613" y="255" width="16" height="90" rx="3" fill="var(--grey)"/>
<rect x="833" y="255" width="16" height="90" rx="3" fill="var(--grey)"/>

<text class="g" x="141" y="382" text-anchor="middle">法規清關</text>
<text class="d" x="401" y="382" text-anchor="middle">給付代碼</text>
<text class="d" x="621" y="382" text-anchor="middle">給付金額</text>
<text class="d" x="841" y="382" text-anchor="middle">一個一個病人</text>

<rect x="66" y="196" width="180" height="86" rx="8" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="a" x="80" y="182">頭條照到的範圍</text>

<path d="M270 428 L270 448 L900 448 L900 428" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text class="s" x="585" y="480" text-anchor="middle">沒有新聞稿的三年</text>

<text class="c" x="480" y="522" text-anchor="middle">有效，和有人付錢，中間還隔著兩道</text>
</svg>
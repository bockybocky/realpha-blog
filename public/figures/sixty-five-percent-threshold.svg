<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條橫條與一道門檻線：上條超過門檻、下條因為換自家料件而退到門檻以下">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">門檻畫在哪，擋住的就是誰</text>

<rect x="60" y="88" width="840" height="330" fill="var(--card)" rx="10"/>

<line x1="612" y1="118" x2="612" y2="392" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>
<text class="g" x="624" y="136" fill="var(--warn)">門檻</text>

<text class="g" x="100" y="196">現在</text>
<rect x="100" y="212" width="546" height="46" rx="6" fill="var(--accent)" opacity="0.75"/>
<rect x="646" y="212" width="214" height="46" rx="6" fill="var(--grey)" opacity="0.5"/>
<text class="b" x="118" y="241" fill="var(--page)">美國料件</text>
<text class="b" x="664" y="241">其他</text>
<text class="b" x="100" y="284">過得去，出貨照舊</text>

<text class="g" x="100" y="330">換自家料件以後</text>
<rect x="100" y="346" width="380" height="46" rx="6" fill="var(--accent)" opacity="0.4"/>
<rect x="480" y="346" width="380" height="46" rx="6" fill="var(--warn)" opacity="0.5"/>
<text class="b" x="118" y="375">美國料件</text>
<text class="b" x="500" y="375">自家料件變多、成本變低</text>
<polygon points="596,369 560,356 560,382" fill="var(--warn)"/>

<text class="c" x="60" y="470">這道線沒有改變現在的成本，</text>
<text class="c" x="60" y="500">改變的是以後還能不能把成本壓下來。</text>
</svg>
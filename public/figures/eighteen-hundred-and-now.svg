<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="1800 年與今天的三組平行對照">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">兩個時代，同一種形狀</text>

  <text class="t" x="260" y="112" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">1800 年</text>
  <text class="t" x="700" y="112" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">今天</text>

  <rect x="120" y="140" width="280" height="86" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="260" y="192" font-size="19" fill="var(--ink)" text-anchor="middle">工業革命</text>
  <rect x="560" y="140" width="280" height="86" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="700" y="192" font-size="19" fill="var(--ink)" text-anchor="middle">AI</text>

  <rect x="120" y="248" width="280" height="86" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="260" y="300" font-size="19" fill="var(--ink)" text-anchor="middle">革命與起義</text>
  <rect x="560" y="248" width="280" height="86" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="700" y="300" font-size="19" fill="var(--ink)" text-anchor="middle">民粹浪潮</text>

  <rect x="120" y="356" width="280" height="86" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="260" y="408" font-size="19" fill="var(--ink)" text-anchor="middle">分工重排</text>
  <rect x="560" y="356" width="280" height="86" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="700" y="408" font-size="19" fill="var(--ink)" text-anchor="middle">全球秩序重排</text>

  <path d="M410 183 H550" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M410 291 H550" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M410 399 H550" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>

  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">兩邊都需要一套新語言解釋自己</text>
</svg>
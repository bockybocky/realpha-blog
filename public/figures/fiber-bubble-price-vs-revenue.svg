<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一個巨大方形裡藏著一個幾乎看不見的小點，表示收購價與年營收之間約兩千五百倍的落差">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">光纖泡沫頂點的一樁併購</text>
<rect x="80" y="110" width="320" height="320" fill="var(--grey)"/>
<text class="g" x="80" y="96">收購價 400 億</text>
<text class="d" x="80" y="460">大部分用股票支付</text>
<rect x="232" y="262" width="7" height="7" fill="var(--warn)"/>
<line x1="239" y1="266" x2="470" y2="266" stroke="var(--warn)" stroke-width="2"/>
<text class="g" x="484" y="258">年營收 1,600 萬</text>
<text class="d" x="484" y="286">就是那個小點</text>
<text class="c" x="484" y="370">面積差 約 2,500 倍</text>
<text class="d" x="484" y="404">同期另有：市值 100 億、營收 1 億</text>
<text class="d" x="484" y="432">之後倒下的人，不在這張圖上</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三股細線絞成一條粗繩，接班者只握住其中一股，另外兩股鬆落在外">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700">綁成一條，所以分不開買</text>

  <text x="60" y="160" font-size="19" fill="var(--dim)">資本與產能話語權</text>
  <text x="60" y="258" font-size="19" fill="var(--dim)">開路的決心</text>
  <text x="60" y="356" font-size="19" fill="var(--dim)">扁平組織、無接班安排</text>

  <path d="M250 148 C360 148 390 230 470 248" fill="none" stroke="var(--accent)" stroke-width="7"/>
  <path d="M250 246 C360 246 390 248 470 250" fill="none" stroke="var(--accent)" stroke-width="7"/>
  <path d="M250 344 C360 344 390 268 470 252" fill="none" stroke="var(--accent)" stroke-width="7"/>

  <path d="M470 250 L640 250" fill="none" stroke="var(--accent)" stroke-width="22" stroke-linecap="round"/>
  <text x="555" y="214" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">他的位置</text>

  <rect x="672" y="214" width="76" height="76" rx="12" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>
  <text x="710" y="330" font-size="19" text-anchor="middle">接班者</text>

  <path d="M748 252 L880 252" fill="none" stroke="var(--ink)" stroke-width="7"/>
  <text x="790" y="226" font-size="16" fill="var(--dim)">握住一股</text>

  <path d="M660 236 C700 170 790 150 880 146" fill="none" stroke="var(--grey)" stroke-width="5" stroke-dasharray="9 8"/>
  <path d="M660 266 C700 340 790 362 880 368" fill="none" stroke="var(--grey)" stroke-width="5" stroke-dasharray="9 8"/>
  <text x="790" y="128" font-size="16" fill="var(--dim)">另兩股鬆落</text>

  <text x="60" y="516" font-size="22" font-weight="700">三股分開都買得到，絞在一起的那條買不到</text>
</svg>
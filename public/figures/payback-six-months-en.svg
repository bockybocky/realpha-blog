<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Within the same year, a twelve-month payback runs one cycle while a six-month payback runs two.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">Halve the payback, fit one more cycle in a year</text>

  <text x="60" y="150" font-size="20" fill="var(--dim)">Twelve months</text>
  <rect x="240" y="124" width="640" height="48" rx="6" fill="var(--grey)" opacity="0.6"/>
  <text x="560" y="155" font-size="16" fill="var(--ink)" text-anchor="middle">Spend → payback</text>

  <text x="60" y="262" font-size="20" fill="var(--accent)">Six months</text>
  <rect x="240" y="236" width="310" height="48" rx="6" fill="var(--accent)" opacity="0.85"/>
  <text x="395" y="267" font-size="16" fill="var(--page)" text-anchor="middle">Spend → payback</text>
  <rect x="570" y="236" width="310" height="48" rx="6" fill="var(--accent)" opacity="0.45"/>
  <text x="725" y="267" font-size="16" fill="var(--ink)" text-anchor="middle">One more round</text>

  <line x1="240" y1="320" x2="880" y2="320" stroke="var(--line)" stroke-width="2"/>
  <text x="240" y="350" font-size="16" fill="var(--dim)">Today</text>
  <text x="880" y="350" font-size="16" fill="var(--dim)" text-anchor="end">A year later</text>

  <text x="60" y="430" font-size="22" fill="var(--ink)">So the money never stops, it keeps going in</text>
  <text x="60" y="466" font-size="16" fill="var(--dim)">Only rates can stop it, not willingness</text>
</svg>
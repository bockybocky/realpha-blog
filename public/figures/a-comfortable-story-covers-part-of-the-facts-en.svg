<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Inside the box of facts, the familiar story fills only a small block on the left; the wide blank on the right is what nobody has looked at yet.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">How much it covers</text>

  <rect x="60" y="120" width="840" height="220" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="880" y="150" font-size="19" text-anchor="end" fill="var(--dim)">All the facts</text>

  <rect x="60" y="120" width="250" height="220" rx="14" fill="var(--accent)" opacity="0.85"/>
  <text class="t" x="185" y="222" font-size="20" text-anchor="middle" fill="var(--page)">Story</text>
  <text class="t" x="185" y="252" font-size="17" text-anchor="middle" fill="var(--page)">Foreigners</text>

  <rect x="330" y="150" width="550" height="160" rx="12" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
  <text class="t" x="605" y="222" font-size="20" text-anchor="middle" fill="var(--warn)">Unexplained</text>
  <text class="t" x="605" y="252" font-size="17" text-anchor="middle" fill="var(--dim)">Look here next</text>

  <text class="t" x="60" y="420" font-size="22" font-weight="700" fill="var(--ink)">It feels done, so you stop</text>
  <text class="t" x="60" y="456" font-size="16" fill="var(--dim)">Built on plausibility, not accuracy</text>
</svg>
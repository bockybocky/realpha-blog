<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="全球鎢供給長條中最小的一塊被放大，放大後這座礦佔六分之一">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t  { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1 { font-size:27px; fill:var(--ink); font-weight:700; }
    .g  { font-size:19px; fill:var(--ink); }
    .gp { font-size:19px; fill:var(--page); font-weight:600; }
    .m  { font-size:16px; fill:var(--ink); }
    .s  { font-size:15px; fill:var(--dim); }
    .c  { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t h1" x="60" y="62">同一座礦，兩個分母</text>
  <text class="t s" x="60" y="118">全球供給</text>

  <rect x="60" y="140" width="672" height="64" fill="var(--accent)"/>
  <rect x="732" y="140" width="42" height="64" fill="var(--grey)"/>
  <rect x="774" y="140" width="126" height="64" fill="var(--card)" stroke="var(--line)"/>
  <text class="t gp" x="396" y="180" text-anchor="middle">中國 80%</text>
  <text class="t s" x="753" y="130" text-anchor="middle">俄・朝 5%</text>
  <text class="t m" x="837" y="180" text-anchor="middle">其他 15%</text>

  <path d="M774,204 L900,204 L900,286 L60,286 Z" fill="var(--card)" stroke="var(--line)"/>
  <text class="t s" x="480" y="252" text-anchor="middle">放大</text>

  <rect x="60" y="286" width="840" height="64" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="286" width="140" height="64" fill="var(--accent)"/>
  <text class="t m" x="130" y="378" text-anchor="middle">這座礦</text>
  <text class="t m" x="550" y="326" text-anchor="middle">自由世界其餘供給</text>

  <text class="t c" x="60" y="450">全球的 2.5%，換個分母就是六分之一</text>
</svg>
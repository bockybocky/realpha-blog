<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A very long ten-year structural axis side by side with a very short three-month trading axis">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="72">Two rulers of very different length</text>

<text class="g" x="60" y="190">Structure</text>
<line x1="180" y1="220" x2="480" y2="220" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"/>
<line x1="480" y1="220" x2="880" y2="220" stroke="var(--grey)" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 18"/>
<text class="b" x="180" y="262">Conditions in place</text>
<text class="b" x="880" y="262" text-anchor="end">Timing unknown</text>
<text class="b" x="880" y="196" text-anchor="end">Ten years</text>

<text class="g" x="60" y="370">Trading</text>
<line x1="180" y1="400" x2="255" y2="400" stroke="var(--warn)" stroke-width="12" stroke-linecap="round"/>
<text class="b" x="275" y="406">Three months</text>

<text class="c" x="60" y="480">Using the lower ruler to answer the upper question</text>
</svg>
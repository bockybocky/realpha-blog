<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two side-by-side panels have the same approved base, with energy-storage cabinets above one and a data-center facility above the other.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="40" y="58" font-size="27" fill="var(--ink)">Same Land, Different Use</text>

<rect x="60" y="110" width="390" height="340" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="200" width="90" height="110" fill="var(--grey)" opacity="0.6"/>
<rect x="210" y="200" width="90" height="110" fill="var(--grey)" opacity="0.6"/>
<rect x="320" y="200" width="90" height="110" fill="var(--grey)" opacity="0.6"/>
<text x="255" y="178" font-size="20" fill="var(--dim)" text-anchor="middle">Storage</text>
<rect x="100" y="330" width="310" height="60" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="255" y="368" font-size="19" fill="var(--accent)" text-anchor="middle">Power・Grid・Permits</text>

<rect x="510" y="110" width="390" height="340" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--accent)">
<rect x="550" y="200" width="58" height="110"/>
<rect x="622" y="200" width="58" height="110"/>
<rect x="694" y="200" width="58" height="110"/>
<rect x="766" y="200" width="58" height="110"/>
</g>
<text x="705" y="178" font-size="20" fill="var(--accent)" text-anchor="middle">Data Center</text>
<rect x="550" y="330" width="310" height="60" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="705" y="368" font-size="19" fill="var(--accent)" text-anchor="middle">Power・Grid・Permits</text>

<text x="480" y="500" font-size="22" fill="var(--ink)" text-anchor="middle">The Value Lies in the Foundation</text>
</svg>
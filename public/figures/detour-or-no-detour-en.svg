<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left a bypass runs around you; on the right the only road goes through you, and it has two gaps left in it">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">If you're away next week, does this stop</text>
<rect x="60" y="110" width="390" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="88" y="152" font-size="19" fill="var(--dim)">A name comes to mind</text>
<circle cx="110" cy="300" r="10" fill="var(--grey)"/>
<circle cx="400" cy="300" r="10" fill="var(--grey)"/>
<path d="M120 300 H233" stroke="var(--grey)" stroke-width="3"/>
<path d="M281 300 H390" stroke="var(--grey)" stroke-width="3"/>
<rect x="233" y="278" width="48" height="44" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="257" y="308" font-size="16" fill="var(--ink)" text-anchor="middle">You</text>
<path d="M138 292 Q 257 196, 380 292" stroke="var(--grey)" stroke-width="3" fill="none"/>
<text x="257" y="404" font-size="16" fill="var(--dim)" text-anchor="middle">Can be routed around</text>
<rect x="510" y="110" width="390" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="538" y="152" font-size="19" fill="var(--accent)">No name comes</text>
<circle cx="560" cy="300" r="10" fill="var(--grey)"/>
<circle cx="850" cy="300" r="10" fill="var(--grey)"/>
<path d="M570 300 H668" stroke="var(--accent)" stroke-width="3"/>
<path d="M732 300 H840" stroke="var(--accent)" stroke-width="3"/>
<rect x="681" y="278" width="48" height="44" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5"/>
<text x="705" y="308" font-size="16" fill="var(--ink)" text-anchor="middle">You</text>
<path d="M668 288 V312" stroke="var(--warn)" stroke-width="3"/>
<path d="M732 288 V312" stroke="var(--warn)" stroke-width="3"/>
<text x="705" y="404" font-size="16" fill="var(--warn)" text-anchor="middle">Take you out and it breaks</text>
<text x="60" y="515" font-size="22" fill="var(--ink)">Being wired in is what a position means.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左側供給是一根矮柱，右側需求由三個因子相乘堆成一根遠高於左側的柱，兩者高度懸殊">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">一邊是加法，一邊是乘法</text>

<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>

<text x="90" y="128" font-size="20" fill="var(--dim)">供給　兩年</text>
<rect x="90" y="342" width="150" height="98" rx="6" fill="var(--grey)"/>
<text x="112" y="400" font-size="19" fill="var(--page)">×1.6</text>
<text x="90" y="474" font-size="16" fill="var(--dim)">晶圓產出</text>
<text x="90" y="500" font-size="16" fill="var(--dim)">撐死的成長</text>

<text x="400" y="128" font-size="20" fill="var(--dim)">需求　三個因子相乘</text>
<rect x="400" y="152" width="150" height="52" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="418" y="186" font-size="16" fill="var(--ink)">使用人口</text>
<text x="572" y="186" font-size="19" fill="var(--dim)">×</text>
<rect x="600" y="152" width="150" height="52" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="618" y="186" font-size="16" fill="var(--ink)">每天次數</text>
<text x="400" y="252" font-size="19" fill="var(--dim)">×</text>
<rect x="430" y="222" width="200" height="52" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="448" y="256" font-size="16" fill="var(--ink)">文字變影像動畫</text>

<line x1="530" y1="290" x2="530" y2="316" stroke="var(--accent)" stroke-width="3"/>
<path d="M530 316 L521 300 L539 300 Z" fill="var(--accent)"/>
<rect x="455" y="326" width="150" height="114" rx="6" fill="var(--accent)"/>
<text x="478" y="392" font-size="19" fill="var(--page)">相乘</text>
<text x="400" y="474" font-size="16" fill="var(--dim)">推論不斷產生 token</text>
<text x="400" y="500" font-size="16" fill="var(--dim)">存不下來就變不出獲利</text>

<text x="60" y="540" font-size="22" fill="var(--ink)">兩邊不是同一種成長，所以他懶得討論夠不夠</text>
</svg>
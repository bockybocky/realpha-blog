<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一根往上的高柱與三根往下的柱，方向相反地分在同一條基線兩側">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="56" y="56" font-size="27" font-weight="700" fill="var(--ink)">一個往上，三個往下</text>
<rect x="120" y="150" width="120" height="150" fill="var(--accent)"/>
<text x="120" y="134" font-size="19" font-weight="700" fill="var(--ink)">容量</text>
<text x="120" y="330" font-size="16" fill="var(--dim)">36GB 變 512GB</text>
<line x1="56" y1="300" x2="904" y2="300" stroke="var(--line)" stroke-width="2"/>
<rect x="320" y="300" width="120" height="130" fill="var(--warn)"/>
<text x="320" y="286" font-size="19" font-weight="700" fill="var(--ink)">速度</text>
<text x="320" y="456" font-size="16" fill="var(--dim)">慢兩個數量級</text>
<rect x="520" y="300" width="120" height="110" fill="var(--warn)"/>
<text x="520" y="286" font-size="19" font-weight="700" fill="var(--ink)">壽命</text>
<text x="520" y="456" font-size="16" fill="var(--dim)">寫幾千次</text>
<rect x="720" y="300" width="120" height="90" fill="var(--warn)"/>
<text x="720" y="286" font-size="19" font-weight="700" fill="var(--ink)">功耗與熱</text>
<text x="720" y="456" font-size="16" fill="var(--dim)">更多電，會降頻</text>
<text x="56" y="520" font-size="22" font-weight="700" fill="var(--ink)">好處只有一個，代價有三個</text>
</svg>
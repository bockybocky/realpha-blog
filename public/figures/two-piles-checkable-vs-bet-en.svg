<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The view splits into two columns, three checkable items stacked on the left and two bets not yet happened on the right">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Sort what he wants you to believe into two piles</text>

<rect x="60" y="106" width="400" height="330" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="88" y="150" font-size="20" fill="var(--accent)">Already happened, checkable</text>
<rect x="88" y="178" width="344" height="58" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="214" font-size="16" fill="var(--ink)">Capacity saved by six servers</text>
<rect x="88" y="252" width="344" height="58" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="288" font-size="16" fill="var(--ink)">A dozen banks already deployed</text>
<rect x="88" y="326" width="344" height="58" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="362" font-size="16" fill="var(--ink)">Enterprise is half of revenue</text>
<text x="88" y="416" font-size="16" fill="var(--dim)">You know where to check</text>

<line x1="480" y1="106" x2="480" y2="436" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

<rect x="500" y="106" width="400" height="330" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="528" y="150" font-size="20" fill="var(--warn)">Not yet, only a bet</text>
<rect x="528" y="178" width="344" height="58" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="550" y="214" font-size="16" fill="var(--dim)">SMEs running their own servers</text>
<rect x="528" y="252" width="344" height="58" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="550" y="288" font-size="16" fill="var(--dim)">Overseas joint ventures copying it</text>
<text x="528" y="416" font-size="16" fill="var(--dim)">No answer to check against</text>

<text x="60" y="500" font-size="22" fill="var(--ink)">All right and nothing left means you're believing his character</text>
</svg>
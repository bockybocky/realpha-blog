<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="金流圖：單片 3 美分乘以年 14 億片，匯成年 4200 萬美元的授權收入，前方分岔為順勢延伸到數位影碟與被司法部擋下兩條路">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">檯面下真正在爭的東西</text>

<circle cx="130" cy="250" r="46" fill="none" stroke="var(--dim)" stroke-width="3"/>
<circle cx="130" cy="250" r="10" fill="var(--page)" stroke="var(--dim)" stroke-width="3"/>
<text x="130" y="330" font-size="19" fill="var(--ink)" text-anchor="middle">每片 3 美分</text>
<text x="130" y="356" font-size="15" fill="var(--dim)" text-anchor="middle">CD</text>

<text x="232" y="242" font-size="19" fill="var(--dim)">×</text>
<text x="232" y="276" font-size="16" fill="var(--dim)">一年</text>
<text x="232" y="300" font-size="16" fill="var(--dim)">14 億片</text>

<path d="M310 238 L 560 200 L 560 300 L 310 262 Z" fill="var(--accent)" opacity="0.65"/>
<text x="618" y="238" font-size="22" fill="var(--ink)">一年 4200 萬美元</text>
<text x="618" y="268" font-size="15" fill="var(--dim)">授權收入</text>

<path d="M600 300 L 700 400 L 880 400" stroke="var(--accent)" stroke-width="3" fill="none"/>
<text x="700" y="434" font-size="19" fill="var(--accent)">順勢延到數位影碟</text>

<line x1="700" y1="360" x2="700" y2="440" stroke="var(--warn)" stroke-width="4"/>
<text x="700" y="346" font-size="16" fill="var(--warn)" text-anchor="middle">司法部</text>
<text x="60" y="504" font-size="22" fill="var(--ink)">嘴仗在畫質，帳算在每一片</text>
</svg>
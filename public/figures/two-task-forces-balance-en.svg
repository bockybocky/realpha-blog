<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One scale level with a weight on each side, and another fully tipped with all three weights on one side">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
</defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">The roster is the conclusion</text>
<rect x="60" y="90" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="90" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="86" y="130">Balance sheet task force</text>
<text class="g" x="526" y="130">Productivity task force</text>
<line x1="260" y1="230" x2="260" y2="350" stroke="var(--ink)" stroke-width="4"/>
<line x1="200" y1="350" x2="320" y2="350" stroke="var(--ink)" stroke-width="4"/>
<line x1="140" y1="230" x2="380" y2="230" stroke="var(--accent)" stroke-width="5"/>
<circle cx="150" cy="208" r="20" fill="var(--accent)" opacity="0.5"/>
<circle cx="370" cy="208" r="20" fill="var(--accent)" opacity="0.5"/>
<text class="s" x="112" y="182">Argues big</text>
<text class="s" x="330" y="182">Argues the opposite</text>
<line x1="700" y1="230" x2="700" y2="350" stroke="var(--ink)" stroke-width="4"/>
<line x1="640" y1="350" x2="760" y2="350" stroke="var(--ink)" stroke-width="4"/>
<line x1="586" y1="290" x2="818" y2="182" stroke="var(--warn)" stroke-width="5"/>
<circle cx="606" cy="264" r="20" fill="var(--warn)" opacity="0.55"/>
<circle cx="648" cy="244" r="20" fill="var(--warn)" opacity="0.55"/>
<circle cx="690" cy="224" r="20" fill="var(--warn)" opacity="0.55"/>
<text class="s" x="586" y="326">All three on one side</text>
<text class="c" x="60" y="482">One left a dissenting seat, the other didn't</text>
</svg>
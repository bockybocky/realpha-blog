<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A 100-unit energy flow from the generator forks partway along, burning 15 to 20 units in a fake load, so the flow entering the racks is narrower.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">To smooth the swings, burn some off first</text>
<rect x="90" y="180" width="330" height="120" fill="var(--accent)"/>
<text x="110" y="160" font-size="19" fill="var(--ink)">100 at the generator</text>
<path d="M420 180 L700 180 L700 276 L420 300 Z" fill="var(--accent)" opacity="0.85"/>
<path d="M420 300 L700 300 L700 324 L560 324 Z" fill="var(--warn)"/>
<text x="712" y="240" font-size="19" fill="var(--ink)">80 to racks</text>
<text x="712" y="330" font-size="19" fill="var(--warn)">Fake load 15-20</text>
<rect x="90" y="382" width="620" height="44" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="110" y="411" font-size="16" fill="var(--dim)">Rack firmware damps the swings — whose bill carries the cost</text>
<text x="90" y="484" font-size="22" fill="var(--ink)">Compare per watt into the racks, not per kWh at the generator</text>
</svg>
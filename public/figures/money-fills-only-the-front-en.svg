<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Of twelve identical cells, only the first three are filled and the rest are left empty.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="66" font-size="27" fill="var(--ink)">Good companies all round, money fills only the first few</text>
  <text x="120" y="130" font-size="19" fill="var(--dim)">Companies that pass on fundamentals</text>
  <rect x="120" y="150" width="120" height="86" rx="8" fill="var(--accent)" stroke="var(--accent)"/>
  <rect x="256" y="150" width="120" height="86" rx="8" fill="var(--accent)" stroke="var(--accent)"/>
  <rect x="392" y="150" width="120" height="86" rx="8" fill="var(--accent)" stroke="var(--accent)"/>
  <rect x="528" y="150" width="120" height="86" rx="8" fill="var(--card)" stroke="var(--grey)"/>
  <rect x="664" y="150" width="120" height="86" rx="8" fill="var(--card)" stroke="var(--grey)"/>
  <rect x="800" y="150" width="100" height="86" rx="8" fill="var(--card)" stroke="var(--grey)"/>
  <rect x="120" y="256" width="120" height="86" rx="8" fill="var(--card)" stroke="var(--grey)"/>
  <rect x="256" y="256" width="120" height="86" rx="8" fill="var(--card)" stroke="var(--grey)"/>
  <rect x="392" y="256" width="120" height="86" rx="8" fill="var(--card)" stroke="var(--grey)"/>
  <rect x="528" y="256" width="120" height="86" rx="8" fill="var(--card)" stroke="var(--grey)"/>
  <rect x="664" y="256" width="120" height="86" rx="8" fill="var(--card)" stroke="var(--grey)"/>
  <rect x="800" y="256" width="100" height="86" rx="8" fill="var(--card)" stroke="var(--grey)"/>
  <text x="600" y="380" font-size="19" fill="var(--dim)">Waiting for rotation</text>
  <rect x="120" y="440" width="80" height="70" rx="10" fill="var(--accent)"/>
  <path d="M200 475 L380 475" stroke="var(--accent)" stroke-width="10"/>
  <path d="M380 465 L404 475 L380 485 Z" fill="var(--accent)"/>
  <text x="128" y="530" font-size="19" fill="var(--accent)">Limited money</text>
</svg>
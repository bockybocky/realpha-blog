<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="溫度軸上產品有效區間從華氏六十度往右延伸，佛羅里達的標記在區間內，康乃狄克的標記在區間外的左側">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">沒被說出口的那個前提</text>

<rect x="408" y="196" width="440" height="56" rx="10" fill="var(--accent)" opacity="0.22"/>
<path d="M408 196 L408 252" stroke="var(--accent)" stroke-width="3"/>
<text x="418" y="180" font-size="19" fill="var(--accent)">產品有效範圍</text>

<path d="M120 300 L860 300" stroke="var(--line)" stroke-width="2.5"/>
<path d="M120 292 L120 308" stroke="var(--grey)" stroke-width="2"/>
<path d="M408 292 L408 308" stroke="var(--accent)" stroke-width="2"/>
<path d="M840 292 L840 308" stroke="var(--grey)" stroke-width="2"/>
<text x="104" y="332" font-size="16" fill="var(--dim)">40°F</text>
<text x="386" y="332" font-size="16" fill="var(--accent)">60°F</text>
<text x="820" y="332" font-size="16" fill="var(--dim)">90°F</text>

<circle cx="192" cy="300" r="9" fill="var(--warn)"/>
<path d="M192 300 L192 392" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="140" y="418" font-size="19" fill="var(--warn)">康乃狄克</text>

<circle cx="668" cy="300" r="9" fill="var(--accent)"/>
<path d="M668 300 L668 392" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="624" y="418" font-size="19" fill="var(--accent)">佛羅里達</text>

<text x="60" y="478" font-size="22" fill="var(--ink)">機器不知道你在哪，因為沒有人告訴它</text>
</svg>
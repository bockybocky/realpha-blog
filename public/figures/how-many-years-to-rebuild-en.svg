<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three horizontal bars run from short to very long, with a short bar underneath showing the time a rival needs to open a brand-new restaurant.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">How many years to rebuild each one</text>
<text x="60" y="90" font-size="15" fill="var(--dim)">Bar length = time, one cell = 5 yrs</text>

<line x1="300" y1="120" x2="300" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="400" y1="120" x2="400" y2="430" stroke="var(--line)" stroke-dasharray="4 7"/>
<line x1="500" y1="120" x2="500" y2="430" stroke="var(--line)" stroke-dasharray="4 7"/>
<line x1="600" y1="120" x2="600" y2="430" stroke="var(--line)" stroke-dasharray="4 7"/>
<line x1="700" y1="120" x2="700" y2="430" stroke="var(--line)" stroke-dasharray="4 7"/>
<line x1="800" y1="120" x2="800" y2="430" stroke="var(--line)" stroke-dasharray="4 7"/>
<text x="400" y="452" font-size="15" fill="var(--dim)" text-anchor="middle">5</text>
<text x="500" y="452" font-size="15" fill="var(--dim)" text-anchor="middle">10</text>
<text x="600" y="452" font-size="15" fill="var(--dim)" text-anchor="middle">15</text>
<text x="700" y="452" font-size="15" fill="var(--dim)" text-anchor="middle">20</text>
<text x="800" y="452" font-size="15" fill="var(--dim)" text-anchor="middle">25 yrs</text>

<text x="60" y="166" font-size="19" fill="var(--ink)">The house in the park</text>
<text x="60" y="190" font-size="15" fill="var(--dim)">2.5 yrs permits + 1 yr rebuild</text>
<rect x="300" y="146" width="70" height="46" rx="4" fill="var(--accent)"/>

<text x="60" y="256" font-size="19" fill="var(--ink)">First liquor license in the park</text>
<text x="60" y="280" font-size="15" fill="var(--dim)">No bar allowed; takeout window required</text>
<rect x="300" y="236" width="50" height="46" rx="4" fill="var(--accent)"/>

<text x="60" y="346" font-size="19" fill="var(--ink)">Nearly 100 small farms</text>
<text x="60" y="370" font-size="15" fill="var(--dim)">Built up one farm at a time</text>
<rect x="300" y="326" width="580" height="46" rx="4" fill="var(--accent)"/>
<text x="868" y="356" font-size="16" font-weight="700" fill="var(--page)" text-anchor="end">29 yrs</text>

<text x="60" y="506" font-size="22" font-weight="700" fill="var(--ink)">The chokepoint isn't the menu — it's what takes years to replace</text>
</g>
</svg>
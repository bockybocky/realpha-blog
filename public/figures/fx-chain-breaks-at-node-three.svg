<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="兩條四節鏈條並列，上排完整連通，下排在第三節斷開、第四節失色">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:19px; fill:var(--ink); font-weight:700; }
.b { font-size:16px; fill:var(--dim); }
.k { font-size:16px; fill:var(--ink); font-weight:700; }
.c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="h" x="60" y="68">同一條鏈，斷在不同的節</text>
<text class="g" x="60" y="126">人民幣</text>
<rect x="60" y="148" width="180" height="80" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="280" y="148" width="180" height="80" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="500" y="148" width="180" height="80" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="720" y="148" width="180" height="80" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="k" x="78" y="196">出口創高</text>
<text class="k" x="298" y="196">賺到美元</text>
<text class="k" x="518" y="188">換回本國貨幣</text>
<text class="b" x="518" y="212">資本管制，出不去</text>
<text class="k" x="738" y="196">匯價升值</text>
<line x1="240" y1="188" x2="280" y2="188" stroke="var(--accent)" stroke-width="4"/>
<line x1="460" y1="188" x2="500" y2="188" stroke="var(--accent)" stroke-width="4"/>
<line x1="680" y1="188" x2="720" y2="188" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="60" y="330">台幣與韓元</text>
<rect x="60" y="352" width="180" height="80" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="280" y="352" width="180" height="80" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="500" y="352" width="180" height="80" fill="var(--page)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<rect x="720" y="352" width="180" height="80" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
<text class="k" x="78" y="400">出口創高</text>
<text class="k" x="298" y="400">賺到美元</text>
<text class="k" x="518" y="400">換回本國貨幣</text>
<text class="k" x="738" y="400" fill="var(--grey)">匯價升值</text>
<line x1="240" y1="392" x2="280" y2="392" stroke="var(--accent)" stroke-width="4"/>
<line x1="460" y1="392" x2="500" y2="392" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 7"/>
<line x1="680" y1="392" x2="720" y2="392" stroke="var(--grey)" stroke-width="4" stroke-dasharray="9 7"/>
<text class="b" x="500" y="470">留在美元裡：4,000 億美元，年增 52%</text>
<text class="b" x="720" y="470">實際走到 32.6</text>
<text class="c" x="60" y="556">前面幾節都在跑，斷的是最後一步</text>
</svg>
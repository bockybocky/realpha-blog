<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars show that paying the same 6 a year in interest supports 200 of debt at a 3% rate but only 100 at a 6% rate, a twofold difference in length; the numbers are illustrative.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:600}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}.p{fill:var(--page)}
</style>
<text class="t" x="480" y="52" text-anchor="middle">Same interest, 2x the debt</text>
<text class="d" x="480" y="88" text-anchor="middle">Example: both pay 6 a year</text>
<line x1="210" y1="130" x2="210" y2="380" stroke="var(--dim)" stroke-width="2"/>
<text class="g" x="70" y="182">UK</text>
<text class="d" x="70" y="208">Rate 3%</text>
<rect x="210" y="150" width="600" height="64" fill="var(--accent)" rx="4"/>
<text class="b" x="825" y="188">Debt 200</text>
<text class="g" x="70" y="322">FR</text>
<text class="d" x="70" y="348">Rate 6%</text>
<rect x="210" y="290" width="300" height="64" fill="var(--grey)" rx="4"/>
<text class="b" x="525" y="328">Debt 100</text>
<line x1="510" y1="140" x2="510" y2="370" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text class="c" x="480" y="460" text-anchor="middle">Cheap debt lasts</text>
<text class="d" x="480" y="500" text-anchor="middle">Show gave no French rate; 6% assumed</text>
</svg>
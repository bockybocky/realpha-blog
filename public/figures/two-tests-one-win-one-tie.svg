<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="第一個測試兩根柱子有高低差，第二個測試兩根柱子等高">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="48" y="54">兩個測試</text>
<line x1="110" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="160" y="280" width="90" height="120" fill="var(--accent)"/>
<rect x="290" y="231" width="90" height="169" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="205" y="268" text-anchor="middle">8.17 秒</text>
<text class="b" x="335" y="219" text-anchor="middle">11.51 秒</text>
<rect x="580" y="231" width="90" height="169" fill="var(--accent)"/>
<rect x="710" y="231" width="90" height="169" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="625" y="219" text-anchor="middle">約 48 分</text>
<text class="b" x="755" y="219" text-anchor="middle">約 48 分</text>
<text class="b" x="205" y="428" text-anchor="middle">Mac Studio</text>
<text class="b" x="335" y="428" text-anchor="middle">工作站</text>
<text class="b" x="625" y="428" text-anchor="middle">Mac Studio</text>
<text class="b" x="755" y="428" text-anchor="middle">工作站</text>
<text class="g" x="270" y="466" text-anchor="middle">雜貨鋪場景</text>
<text class="g" x="690" y="466" text-anchor="middle">複雜運鏡</text>
<text class="c" x="480" y="502" text-anchor="middle">一場贏、一場打平</text>
</svg>
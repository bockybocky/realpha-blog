<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條價格預期線從同一點分開，一條往下一條往上，形成剪刀狀的分岔">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">同一張價格表，兩個方向</text>
<rect x="60" y="96" width="840" height="310" rx="10" fill="var(--card)"/>
<line x1="110" y1="380" x2="860" y2="380" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="110" y="414" font-size="16" fill="var(--dim)">現在</text>
<text class="t" x="800" y="414" font-size="16" fill="var(--dim)">2027</text>
<path d="M140 250 L820 160" stroke="var(--accent)" stroke-width="5" fill="none"/>
<path d="M140 250 L820 340" stroke="var(--dim)" stroke-width="5" stroke-dasharray="10 7" fill="none"/>
<circle cx="140" cy="250" r="8" fill="var(--ink)"/>
<text class="t" x="520" y="146" font-size="20" fill="var(--accent)">舊世代動態隨機存取記憶體</text>
<text class="t" x="660" y="368" font-size="20" fill="var(--dim)">快閃記憶體</text>
<text class="t" x="150" y="226" font-size="16" fill="var(--dim)">被混在一起談</text>
<text class="t" x="400" y="252" font-size="16" fill="var(--dim)">產能被挪去做 AI 規格</text>
<text class="t" x="60" y="476" font-size="22" fill="var(--ink)">下修的是其中一塊，不是記憶體</text>
</svg>
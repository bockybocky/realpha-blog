<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="六片同樣厚度的薄片往右上方階梯式上升，虛線門檻橫在上方，最後一片跨過門檻">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .n { font-size:15px; fill:var(--ink); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="66">一片一片削，每片都不觸發</text>
<line x1="80" y1="200" x2="900" y2="200" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="b" x="80" y="188" style="fill:var(--warn)">反應門檻</text>
<line x1="80" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="120" y="380" width="120" height="40" fill="var(--accent)" opacity="0.45"/>
<rect x="250" y="340" width="120" height="40" fill="var(--accent)" opacity="0.45"/>
<rect x="380" y="300" width="120" height="40" fill="var(--accent)" opacity="0.45"/>
<rect x="510" y="260" width="120" height="40" fill="var(--accent)" opacity="0.45"/>
<rect x="640" y="220" width="120" height="40" fill="var(--accent)" opacity="0.45"/>
<rect x="770" y="180" width="120" height="40" fill="var(--warn)" opacity="0.85"/>
<text class="n" x="180" y="406" text-anchor="middle">試射</text>
<text class="n" x="310" y="366" text-anchor="middle">演習</text>
<text class="n" x="440" y="326" text-anchor="middle">越界</text>
<text class="n" x="570" y="286" text-anchor="middle">墜機</text>
<text class="n" x="700" y="246" text-anchor="middle">封鎖</text>
<text class="n" x="830" y="206" text-anchor="middle">再一片</text>
<text class="c" x="60" y="462">每一片都不值得反擊，位置已經過線</text>
<text class="b" x="60" y="498">變的不是單片大小，是它疊到哪裡</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A block of energy starts full at the left and steps down in three stages to near zero, the stages labelled transit in, loiter and transit home, with a dashed line above marking that there is no resupply point along the way.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">Once it leaves shore</text>

  <line x1="60" y1="128" x2="900" y2="128" stroke="var(--grey)" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="60" y="118" font-size="16" fill="var(--dim)">No fuel stops out there</text>

  <polygon points="80,400 80,168 340,168 340,258 620,258 620,336 880,336 880,400"
           fill="var(--accent)" opacity="0.85"/>
  <line x1="80" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="3"/>

  <text x="80" y="158" font-size="16" fill="var(--dim)">All the energy it left with</text>
  <text x="140" y="436" font-size="20" fill="var(--ink)">Transit in</text>
  <text x="440" y="436" font-size="20" fill="var(--ink)">Loiter</text>
  <text x="720" y="436" font-size="20" fill="var(--ink)">Return</text>

  <text x="60" y="492" font-size="22" font-weight="700" fill="var(--ink)">All three draw from that one tank it left with</text>
</svg>
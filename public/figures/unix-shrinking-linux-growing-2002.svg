<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一個大方塊配向下箭頭，一個小方塊配向上箭頭">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">2002 年：規模與方向分開看</text>
<text class="b" x="60" y="92">方塊面積等比於硬體營收</text>

<rect x="110" y="130" width="286" height="286" rx="8" fill="var(--grey)"/>
<text class="n" x="253" y="268" text-anchor="middle" fill="var(--page)">UNIX　170 億美元</text>
<g>
<line x1="253" y1="440" x2="253" y2="476" stroke="var(--warn)" stroke-width="6"/>
<polygon points="253,496 237,468 269,468" fill="var(--warn)"/>
<text class="n" x="285" y="482" fill="var(--warn)">11%</text>
</g>

<rect x="600" y="318" width="98" height="98" rx="8" fill="var(--accent)"/>
<text class="g" x="600" y="448">Linux　20 億美元</text>
<g>
<line x1="760" y1="416" x2="760" y2="200" stroke="var(--accent)" stroke-width="6"/>
<polygon points="760,178 744,206 776,206" fill="var(--accent)"/>
<text class="n" x="788" y="196" fill="var(--accent)">63%</text>
</g>

<text class="c" x="60" y="506">大的在縮，小的在長</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The upper row overflows the narrow window with three tasks; the lower row places them before the window and leaves only execution inside.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .w { font-size:16px; fill:var(--warn); font-weight:600; }
    .a { font-size:16px; fill:var(--accent); font-weight:600; }
</style>
<text class="t" x="60" y="66">Research before the window, or inside it</text>
<rect x="700" y="110" width="60" height="180" fill="var(--warn)" opacity="0.12"/>
<line x1="200" y1="270" x2="900" y2="270" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="60" y="150">It falls</text>
<text class="g" x="60" y="176">then you start</text>
<rect x="662" y="150" width="120" height="46" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="w" x="694" y="179">Research</text>
<rect x="692" y="192" width="120" height="46" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="w" x="724" y="221">Emotion</text>
<rect x="722" y="234" width="120" height="46" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="w" x="754" y="263">Decide</text>
<text class="b" x="700" y="102">Window</text>
<line x1="120" y1="320" x2="900" y2="320" stroke="var(--line)" stroke-width="1"/>
<rect x="700" y="360" width="60" height="180" fill="var(--accent)" opacity="0.14"/>
<line x1="200" y1="520" x2="900" y2="520" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="60" y="400">Before it gets cheap</text>
<text class="g" x="60" y="426">already done</text>
<rect x="220" y="430" width="120" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="252" y="459">List</text>
<rect x="370" y="430" width="120" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="402" y="459">Price</text>
<rect x="520" y="430" width="120" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="552" y="459">Reason</text>
<rect x="702" y="430" width="56" height="46" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="a" x="714" y="459">Execute</text>
<text class="b" x="700" y="352">Window</text>
</svg>
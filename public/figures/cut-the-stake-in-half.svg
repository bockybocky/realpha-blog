<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三條長條中，答不能的那一條被從中剪斷只剩一半">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66">全錯的話，明天還過得去嗎</text>
<text class="g" x="80" y="140">決定一</text>
<rect x="220" y="118" width="520" height="34" rx="6" fill="var(--accent)" opacity="0.7"/>
<text class="g" x="768" y="144">能</text>
<text class="g" x="80" y="222">決定二</text>
<rect x="220" y="200" width="520" height="34" rx="6" fill="var(--accent)" opacity="0.7"/>
<text class="g" x="768" y="226">能</text>
<text class="g" x="80" y="304">決定三</text>
<rect x="220" y="282" width="260" height="34" rx="6" fill="var(--accent)" opacity="0.7"/>
<rect x="480" y="282" width="260" height="34" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 7"/>
<line x1="480" y1="262" x2="480" y2="336" stroke="var(--warn)" stroke-width="5"/>
<text class="g" x="768" y="308" fill="var(--warn)">不能</text>
<text class="b" x="240" y="368">砍一半</text>
<line x1="80" y1="408" x2="880" y2="408" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="80" y="452">額度不只有錢</text>
<text class="g" x="300" y="452">錢</text>
<text class="g" x="400" y="452">時間</text>
<text class="g" x="520" y="452">信用</text>
<text class="g" x="620" y="452">健康</text>
<text class="g" x="720" y="452">關係</text>
<text class="c" x="80" y="508">留下來的那一半，比較有機會活著</text>
</svg>
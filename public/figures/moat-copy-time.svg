<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三條橫條依抄走所需時間由短到長排列，最長那條衝出畫面右側被截斷">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); }
    .g  { font-size:19px; fill:var(--dim); }
    .s  { font-size:15px; fill:var(--dim); }
    .c  { font-size:22px; fill:var(--ink); }
</style>
<text class="ti" x="80" y="62">抄走需要多久</text>
<line x1="160" y1="150" x2="160" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="160" y="186">感測器規格</text>
<rect x="160" y="198" width="150" height="34" rx="4" fill="var(--grey)"/>
<text class="g" x="160" y="276">戴得出門的形狀</text>
<rect x="160" y="288" width="400" height="34" rx="4" fill="var(--accent)" fill-opacity="0.55"/>
<text class="g" x="160" y="366">幾萬人日資料</text>
<rect x="160" y="378" width="730" height="34" rx="4" fill="var(--accent)"/>
<path d="M890 378 l 24 8 l -24 9 l 24 9 l -24 8 Z" fill="var(--accent)"/>
<text class="s" x="700" y="368" fill="var(--accent)">要用時間換</text>
<line x1="160" y1="440" x2="880" y2="440" stroke="var(--dim)" stroke-width="2"/>
<path d="M880 440 l -12 -6 l 0 12 Z" fill="var(--dim)"/>
<text class="s" x="820" y="464">時間</text>
<text class="c" x="80" y="516">規格抄得快，時間抄不到</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two crossing lines, one rising from lower left for certainty and one falling from upper left for the room not yet priced in">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:600;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:600;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66">Waiting for the signal trades return for certainty</text>
<line x1="120" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="120" x2="120" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="420" x2="860" y2="170" stroke="var(--accent)" stroke-width="3"/>
<line x1="120" y1="170" x2="860" y2="425" stroke="var(--grey)" stroke-width="3"/>
<circle cx="486" cy="296" r="9" fill="var(--accent)"/>
<line x1="486" y1="296" x2="486" y2="450" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="486" y="478" text-anchor="middle">Rivals start copying</text>
<text class="g" x="712" y="200" text-anchor="middle" fill="var(--accent)">Certainty</text>
<text class="g" x="700" y="404" text-anchor="middle" fill="var(--dim)">Room not yet priced in</text>
<text class="b" x="876" y="500" text-anchor="end">Time</text>
<text class="c" x="480" y="516" text-anchor="middle">The signal is reliable, but it arrives late</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條橫條比較報價：恩傑薩二十二億是虛線空框代表沒簽成，通用動力三十一億是實心成交，箭頭從前者指向後者">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">兩個報價，只有一個簽成</text>

<text x="60" y="152" font-size="19" fill="var(--dim)">1989 年 8 月・巴西媒體</text>
<rect x="60" y="172" width="440" height="68" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 6"/>
<text x="84" y="214" font-size="19" fill="var(--dim)">恩傑薩　22 億美元　談判中</text>

<text x="60" y="326" font-size="19" fill="var(--warn)">1989 年 9 月・美國媒體</text>
<rect x="60" y="346" width="620" height="68" fill="var(--warn)"/>
<text x="84" y="388" font-size="19" fill="var(--page)">通用動力　31 億美元　315 輛 M1A2</text>

<path d="M510 206 C560 206 560 346 700 346" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="716" y="300" font-size="19" fill="var(--accent)">殺價用的</text>
<text x="716" y="328" font-size="19" fill="var(--accent)">那張牌</text>

<text x="60" y="478" font-size="22" fill="var(--ink)">報價被拿去談判，不等於報價被接受。</text>
</svg>
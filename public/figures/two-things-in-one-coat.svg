<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條線：一條隨補救措施增加而下降，一條完全水平不動">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; font-weight:700; fill:var(--ink); }
    .g  { font-size:20px; font-weight:600; }
    .b  { font-size:16px; fill:var(--dim); }
    .c  { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">同一件外套底下，其實是兩個東西</text>

<line x1="150" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="120" x2="150" y2="450" stroke="var(--line)" stroke-width="2"/>

<text class="b" x="150" y="486">補救措施：付變電所費用</text>
<text class="b" x="430" y="486">閉迴路冷卻</text>
<text class="b" x="620" y="486">壓低費率</text>
<text class="b" x="790" y="486">全部做完</text>

<text class="b" x="60" y="130">反對</text>
<text class="b" x="60" y="152">強度</text>

<path d="M160 170 C 380 200, 560 340, 860 415" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="160" cy="170" r="6" fill="var(--accent)"/>
<circle cx="860" cy="415" r="6" fill="var(--accent)"/>
<text class="g" x="196" y="163" fill="var(--accent)">具體的委屈</text>
<text class="b" x="196" y="187">誰付錢、抽多少水、費率案怎麼結</text>

<line x1="160" y1="248" x2="860" y2="248" stroke="var(--warn)" stroke-width="4"/>
<circle cx="160" cy="248" r="6" fill="var(--warn)"/>
<circle cx="860" cy="248" r="6" fill="var(--warn)"/>
<text class="g" x="196" y="288" fill="var(--warn)">對這件事本身的態度</text>
<text class="b" x="196" y="312">我就是不喜歡</text>

<text class="c" x="60" y="530">工具讓一條線往下走，另一條動都不動</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="兩條橫柱長度差十倍以上，短柱右端延伸的虛線中段放著一個大問號。">
<rect x="0" y="0" width="960" height="460" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">同一段影片，兩個差十倍的數字</text>
<path d="M150 110 L150 380" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="196" font-size="20" font-weight="700" fill="var(--ink)">半年營收</text>
<rect x="150" y="168" width="70" height="52" fill="var(--accent)"/>
<text x="238" y="200" font-size="16" fill="var(--dim)">1.4 億美元</text>
<path d="M232 240 L900 240" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 7" fill="none"/>
<text x="566" y="256" font-size="48" font-weight="700" fill="var(--warn)" text-anchor="middle">?</text>
<text x="60" y="326" font-size="20" font-weight="700" fill="var(--ink)">ARR</text>
<rect x="150" y="298" width="760" height="52" fill="var(--accent)"/>
<text x="166" y="332" font-size="16" fill="var(--page)">約 16 億美元</text>
<text x="60" y="428" font-size="22" font-weight="700" fill="var(--ink)">口徑沒交代前，兩個都只是記錄，不是結論</text>
</g>
</svg>
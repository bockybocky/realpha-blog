<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the scatter plot three decades of dots form a band sloping from upper left to lower right, and the 2026 dot sits in the upper right far from that band.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="66" font-size="27" font-weight="700" fill="var(--ink)">The old link broke</text>
<rect x="198" y="120" width="4" height="340" fill="var(--line)"/>
<rect x="198" y="456" width="620" height="4" fill="var(--line)"/>
<text x="188" y="140" font-size="16" fill="var(--dim)" text-anchor="end">More</text>
<text x="188" y="452" font-size="16" fill="var(--dim)" text-anchor="end">Less</text>
<text x="210" y="492" font-size="16" fill="var(--dim)">Low</text>
<text x="818" y="492" font-size="16" fill="var(--dim)" text-anchor="end">High</text>
<text x="170" y="290" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle" transform="rotate(-90 170 290)">Supply</text>
<text x="514" y="524" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">2-year yield</text>
<polyline points="250,170 790,420" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
<circle cx="262" cy="186" r="8" fill="var(--grey)"/>
<circle cx="300" cy="212" r="8" fill="var(--grey)"/>
<circle cx="336" cy="194" r="8" fill="var(--grey)"/>
<circle cx="378" cy="240" r="8" fill="var(--grey)"/>
<circle cx="414" cy="268" r="8" fill="var(--grey)"/>
<circle cx="452" cy="248" r="8" fill="var(--grey)"/>
<circle cx="490" cy="300" r="8" fill="var(--grey)"/>
<circle cx="528" cy="286" r="8" fill="var(--grey)"/>
<circle cx="566" cy="330" r="8" fill="var(--grey)"/>
<circle cx="604" cy="352" r="8" fill="var(--grey)"/>
<circle cx="642" cy="336" r="8" fill="var(--grey)"/>
<circle cx="680" cy="386" r="8" fill="var(--grey)"/>
<circle cx="718" cy="372" r="8" fill="var(--grey)"/>
<circle cx="756" cy="414" r="8" fill="var(--grey)"/>
<text x="330" y="400" font-size="19" font-weight="700" fill="var(--dim)">Since 1995</text>
<text x="330" y="428" font-size="16" fill="var(--dim)">Up = less</text>
<circle cx="790" cy="166" r="13" fill="var(--warn)"/>
<text x="770" y="140" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="end">2026</text>
<text x="770" y="196" font-size="16" fill="var(--dim)" text-anchor="end">Both high</text>
<text x="80" y="548" font-size="22" font-weight="700" fill="var(--ink)">AI borrows in a crowded market</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間線：長段自律期在前，法規期在後，崩盤落在兩段交界處">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t h" x="60" y="70">先有市場，後有規則</text>

  <rect x="80" y="210" width="480" height="40" rx="6" fill="var(--grey)"/>
  <rect x="560" y="210" width="340" height="40" rx="6" fill="var(--accent)" opacity="0.85"/>
  <text class="t g" x="320" y="190" text-anchor="middle">自律期</text>
  <text class="t g" x="730" y="190" text-anchor="middle">法規期</text>

  <circle cx="110" cy="230" r="9" fill="var(--ink)"/>
  <text class="t b" x="110" y="295" text-anchor="middle">1850 年代</text>
  <text class="t b" x="110" y="320" text-anchor="middle">自訂慣例</text>

  <circle cx="520" cy="230" r="9" fill="var(--warn)"/>
  <text class="t b" x="520" y="295" text-anchor="middle">1929</text>
  <text class="t b" x="520" y="320" text-anchor="middle">崩盤</text>

  <circle cx="620" cy="230" r="9" fill="var(--page)" stroke="var(--ink)" stroke-width="3"/>
  <text class="t b" x="620" y="295" text-anchor="middle">1922</text>
  <text class="t b" x="620" y="320" text-anchor="middle">穀物期貨法</text>

  <circle cx="750" cy="230" r="9" fill="var(--page)" stroke="var(--ink)" stroke-width="3"/>
  <text class="t b" x="750" y="295" text-anchor="middle">1934</text>
  <text class="t b" x="750" y="320" text-anchor="middle">證券交易法</text>

  <circle cx="870" cy="230" r="9" fill="var(--page)" stroke="var(--ink)" stroke-width="3"/>
  <text class="t b" x="870" y="295" text-anchor="middle">1936</text>
  <text class="t b" x="870" y="320" text-anchor="middle">商品交易法</text>

  <text class="t c" x="60" y="420">規則不是白紙寫起，是把既有慣例編成條文</text>
</svg>
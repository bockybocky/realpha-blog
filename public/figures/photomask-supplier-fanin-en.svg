<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Lines from eight supply-chain links converge on a single photomask at the right.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">One mask needs this whole list to say yes</text>

<line x1="310" y1="130" x2="690" y2="330" stroke="var(--grey)" stroke-width="1.5"/>
<line x1="310" y1="182" x2="690" y2="330" stroke="var(--grey)" stroke-width="1.5"/>
<line x1="310" y1="234" x2="690" y2="330" stroke="var(--grey)" stroke-width="1.5"/>
<line x1="310" y1="286" x2="690" y2="330" stroke="var(--grey)" stroke-width="1.5"/>
<line x1="310" y1="338" x2="690" y2="330" stroke="var(--grey)" stroke-width="1.5"/>
<line x1="310" y1="390" x2="690" y2="330" stroke="var(--grey)" stroke-width="1.5"/>
<line x1="310" y1="442" x2="690" y2="330" stroke="var(--grey)" stroke-width="1.5"/>
<line x1="310" y1="494" x2="690" y2="330" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 5"/>

<rect x="60" y="110" width="250" height="40" rx="20" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="136" font-size="16" fill="var(--dim)">Blanks　AGC · Hoya</text>
<rect x="60" y="162" width="250" height="40" rx="20" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="188" font-size="16" fill="var(--dim)">Pellicles　Mitsui · Canatu</text>
<rect x="60" y="214" width="250" height="40" rx="20" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="240" font-size="16" fill="var(--dim)">Pods　Entegris · Gudeng</text>
<rect x="60" y="266" width="250" height="40" rx="20" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="292" font-size="16" fill="var(--dim)">Writers　IMS · NuFlare</text>
<rect x="60" y="318" width="250" height="40" rx="20" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="344" font-size="16" fill="var(--dim)">Etch and clean　AMAT · Shibaura</text>
<rect x="60" y="370" width="250" height="40" rx="20" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="396" font-size="16" fill="var(--dim)">Inspection　KLA · Lasertec</text>
<rect x="60" y="422" width="250" height="40" rx="20" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="448" font-size="16" fill="var(--dim)">Repair and review　Zeiss</text>
<rect x="60" y="474" width="250" height="40" rx="20" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="80" y="500" font-size="16" fill="var(--grey)">One tier up　their suppliers</text>

<circle cx="760" cy="330" r="72" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="760" y="325" font-size="19" fill="var(--ink)" text-anchor="middle">One</text>
<text x="760" y="352" font-size="19" fill="var(--ink)" text-anchor="middle">6×12 mask</text>

<text x="60" y="565" font-size="22" fill="var(--ink)">Most links have a single source</text>
</svg>
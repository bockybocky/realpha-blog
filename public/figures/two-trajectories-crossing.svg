<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條方向相反的軌跡在中間交叉：一條從理想走向權力本身，一條從機會主義走向理想">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .ttl { font-size:27px; font-weight:700; }
    .grp { font-size:20px; font-weight:700; }
    .lbl { font-size:16px; fill:var(--dim); }
    .cc { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t ttl" x="60" y="58">同一本成功學，兩個相反的方向</text>

  <line x1="120" y1="120" x2="120" y2="400" stroke="var(--line)" stroke-width="3"/>
  <line x1="840" y1="120" x2="840" y2="400" stroke="var(--line)" stroke-width="3"/>
  <text class="t lbl" x="78" y="432">理想</text>
  <text class="t lbl" x="798" y="432">權力本身</text>

  <path d="M120 170 C 400 170, 600 220, 830 250" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <path d="M822 240 L848 250 L822 260 Z" fill="var(--accent)"/>
  <text class="t grp" x="140" y="152" fill="var(--accent)">摩西斯</text>
  <text class="t lbl" x="140" y="200">1910 年代的改革者 → 權力變成目的</text>

  <path d="M830 350 C 560 350, 380 320, 132 296" fill="none" stroke="var(--warn)" stroke-width="5"/>
  <path d="M140 286 L114 296 L140 306 Z" fill="var(--warn)"/>
  <text class="t grp" x="636" y="332" fill="var(--warn)">詹森</text>
  <text class="t lbl" x="330" y="378">捏成南方人的形狀 → 1964、1965 兩法</text>

  <line x1="60" y1="462" x2="900" y2="462" stroke="var(--line)" stroke-width="2"/>
  <text class="t cc" x="60" y="506">起點不決定終點，用權力的方式才決定</text>
</svg>
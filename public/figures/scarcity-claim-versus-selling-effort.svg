<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="傾斜的天秤，左盤只有一句宣稱而翹起，右盤堆著三個實際賣出動作而下沉">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="80" font-size="27" fill="var(--ink)">宣稱放一邊，動作放另一邊</text>
  <line x1="170" y1="230" x2="790" y2="330" stroke="var(--ink)" stroke-width="5"/>
  <polygon points="480,280 440,470 520,470" fill="var(--grey)" opacity="0.6"/>
  <line x1="170" y1="230" x2="170" y2="268" stroke="var(--dim)" stroke-width="2"/>
  <rect x="80" y="268" width="180" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="170" y="303" font-size="19" fill="var(--ink)" text-anchor="middle">說：很稀缺</text>
  <line x1="790" y1="330" x2="790" y2="368" stroke="var(--dim)" stroke-width="2"/>
  <rect x="640" y="368" width="300" height="46" fill="var(--warn)" opacity="0.8"/>
  <text class="t" x="790" y="399" font-size="18" fill="var(--page)" text-anchor="middle">銷進受管制市場</text>
  <rect x="640" y="420" width="300" height="46" fill="var(--warn)" opacity="0.7"/>
  <text class="t" x="790" y="451" font-size="18" fill="var(--page)" text-anchor="middle">出資給買家</text>
  <rect x="640" y="472" width="300" height="46" fill="var(--warn)" opacity="0.6"/>
  <text class="t" x="790" y="503" font-size="18" fill="var(--page)" text-anchor="middle">認股權證綁訂單</text>
  <text class="t" x="60" y="390" font-size="22" fill="var(--ink)">哪一邊比較重</text>
</svg>
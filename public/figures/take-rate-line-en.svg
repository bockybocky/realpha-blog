<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A line of take-rate percentages showing where each platform sits and a range marked as undecided.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">How much to charge merchants</text>
  <text class="t" x="60" y="104" font-size="16" fill="var(--dim)">The reference range that already exists</text>

  <line x1="90" y1="330" x2="880" y2="330" stroke="var(--line)" stroke-width="4"/>

  <circle cx="160" cy="330" r="9" fill="var(--grey)"/>
  <text class="t" x="160" y="375" font-size="19" fill="var(--ink)" text-anchor="middle">Shopify</text>
  <text class="t" x="160" y="400" font-size="16" fill="var(--dim)" text-anchor="middle">about 3%</text>

  <circle cx="345" cy="330" r="9" fill="var(--grey)"/>
  <text class="t" x="345" y="375" font-size="19" fill="var(--ink)" text-anchor="middle">Amazon</text>
  <text class="t" x="345" y="400" font-size="16" fill="var(--dim)" text-anchor="middle">up to 10%</text>

  <circle cx="820" cy="330" r="9" fill="var(--warn)"/>
  <text class="t" x="820" y="375" font-size="19" fill="var(--ink)" text-anchor="middle">Apple</text>
  <text class="t" x="820" y="400" font-size="16" fill="var(--dim)" text-anchor="middle">30%</text>
  <text class="t" x="820" y="268" font-size="16" fill="var(--dim)" text-anchor="middle">Boutique hotels will</text>
  <text class="t" x="820" y="292" font-size="16" fill="var(--dim)" text-anchor="middle">pay this much per booking</text>

  <rect x="150" y="312" width="620" height="36" rx="18" fill="var(--accent)" opacity="0.16"/>
  <text class="t" x="460" y="200" font-size="22" font-weight="700" fill="var(--accent)" text-anchor="middle">Instinct sits in this range, exact spot undecided</text>
  <path d="M460 214 L460 306" stroke="var(--accent)" stroke-width="3"/>
  <path d="M452 298 L460 314 L468 298 Z" fill="var(--accent)"/>

  <text class="t" x="90" y="470" font-size="16" fill="var(--dim)">One thing is settled: not 30%</text>
</svg>
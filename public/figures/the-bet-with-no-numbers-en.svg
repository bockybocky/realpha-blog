<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A level balance scale with one pan on each side and a question mark at the fulcrum, showing no sign of which side weighs more.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="48" y="62" font-size="27" fill="var(--ink)">Neither side has numbers</text>

  <line x1="200" y1="250" x2="760" y2="250" stroke="var(--ink)" stroke-width="5"/>
  <path d="M480 250 L 440 370 L 520 370 Z" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <text x="458" y="340" font-size="27" fill="var(--warn)">?</text>

  <line x1="230" y1="250" x2="230" y2="306" stroke="var(--grey)" stroke-width="2"/>
  <rect x="140" y="306" width="180" height="62" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="166" y="344" font-size="19" fill="var(--ink)">Units actually built</text>

  <line x1="730" y1="250" x2="730" y2="306" stroke="var(--grey)" stroke-width="2"/>
  <rect x="640" y="306" width="200" height="98" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="664" y="342" font-size="19" fill="var(--ink)">Priced by fiat</text>
  <text x="664" y="378" font-size="19" fill="var(--ink)">Extra red tape</text>

  <text x="48" y="470" font-size="22" fill="var(--ink)">He gave the direction, not the size</text>
</svg>
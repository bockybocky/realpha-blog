<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊三層漏斗由寬到窄，代表宣稱往下讀一段就縮水一次；右邊是一個邊界清楚不再縮水的方塊，代表可被驗證的具體場景">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.g { font-size:19px; font-weight:700; fill:var(--dim); }
.b { font-size:16px; }
.n { font-size:20px; font-weight:700; }
.c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="70" y="62">兩種效率宣稱</text>
<text class="g" x="80" y="120">新聞標題</text>
<polygon points="80,150 460,150 410,230 130,230" fill="var(--warn)" opacity="0.75"/>
<text class="b" x="270" y="197" text-anchor="middle" fill="var(--page)">省下 80–90%</text>
<polygon points="130,240 410,240 355,320 185,320" fill="var(--warn)" opacity="0.5"/>
<text class="b" x="270" y="287" text-anchor="middle" fill="var(--ink)">某些功能上</text>
<polygon points="185,330 355,330 305,410 235,410" fill="var(--warn)" opacity="0.28"/>
<text class="b" x="270" y="377" text-anchor="middle" fill="var(--ink)">上千個流程之一</text>
<text class="b" x="80" y="448" fill="var(--dim)">往下讀兩段，就越讀越窄</text>
<text class="g" x="530" y="120">有顆粒度的宣稱</text>
<rect x="530" y="150" width="370" height="260" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="n" x="560" y="205" fill="var(--accent)">客服電話 45%</text>
<text class="b" x="560" y="248" fill="var(--ink)">全程無人介入結案</text>
<text class="b" x="560" y="288" fill="var(--dim)">母數：上一季</text>
<text class="b" x="560" y="322" fill="var(--dim)">數字：執行長給的現金流與費用</text>
<text class="b" x="560" y="362" fill="var(--warn)">代價：搬去開源模型</text>
<text class="c" x="70" y="510">大到無法反駁，還是小到可以被驗證</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Insurance, debt, and equity form three interlocking links, but the new-technology link on the far left is broken, leaving the entire chain disconnected.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">Break one, all spin</text>

<ellipse cx="200" cy="270" rx="78" ry="52" fill="none" stroke="var(--warn)" stroke-width="12" stroke-dasharray="18 14"/>
<text class="t" x="200" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">Novel</text>
<text class="t" x="200" y="370" font-size="15" fill="var(--warn)" text-anchor="middle">Unproven</text>

<ellipse cx="380" cy="270" rx="78" ry="52" fill="none" stroke="var(--accent)" stroke-width="12"/>
<text class="t" x="380" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">Ins.</text>

<ellipse cx="530" cy="270" rx="78" ry="52" fill="none" stroke="var(--accent)" stroke-width="12"/>
<text class="t" x="530" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">Debt</text>

<ellipse cx="680" cy="270" rx="78" ry="52" fill="none" stroke="var(--accent)" stroke-width="12"/>
<text class="t" x="680" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">Equity</text>

<ellipse cx="860" cy="270" rx="70" ry="52" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text class="t" x="860" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">Dig</text>

<text class="t" x="380" y="370" font-size="15" fill="var(--dim)" text-anchor="middle">Known risks link</text>
<text class="t" x="860" y="370" font-size="15" fill="var(--dim)" text-anchor="middle">Only then</text>

<text class="t" x="60" y="470" font-size="22" fill="var(--ink)">Tech choice cuts, not adds</text>
</svg>
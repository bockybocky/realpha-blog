<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two panels: usually price and output rise together; this time price rises while output falls, and the two arrows diverge.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .ac { fill:var(--accent); }
    .wn { fill:var(--warn); }
    .inv { fill:var(--page); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="480" y="52" text-anchor="middle" class="t">Price up, output down</text>
<rect x="40" y="90" width="420" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="90" width="420" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="250" y="130" text-anchor="middle" class="g">Usually</text>
<text x="710" y="130" text-anchor="middle" class="g">This time</text>
<rect x="161" y="205" width="18" height="165" fill="var(--grey)"/>
<polygon points="142,210 170,160 198,210" fill="var(--grey)"/>
<rect x="321" y="205" width="18" height="165" fill="var(--grey)"/>
<polygon points="302,210 330,160 358,210" fill="var(--grey)"/>
<text x="170" y="410" text-anchor="middle" class="b">Price</text>
<text x="330" y="410" text-anchor="middle" class="b">Output</text>
<rect x="621" y="205" width="18" height="165" fill="var(--accent)"/>
<polygon points="602,210 630,160 658,210" fill="var(--accent)"/>
<rect x="781" y="165" width="18" height="165" fill="var(--warn)"/>
<polygon points="762,325 790,375 818,325" fill="var(--warn)"/>
<text x="630" y="410" text-anchor="middle" class="b ac">Price</text>
<text x="790" y="410" text-anchor="middle" class="b wn">Output</text>
<text x="630" y="434" text-anchor="middle" class="d">About $14,875/ton</text>
<text x="790" y="434" text-anchor="middle" class="d">First drop since 2017</text>
<text x="480" y="505" text-anchor="middle" class="c">Higher price, less mined</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="陡升的投稿曲線與幾乎水平的審查產能線，中間張開一大片空隙">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">投稿量十年翻幾十倍，看稿的人沒有</text>

<path d="M110 420 C 420 410, 640 330, 840 120 L 840 400 C 640 398, 420 404, 110 404 Z" fill="var(--warn)" opacity="0.18"/>
<path d="M110 420 C 420 410, 640 330, 840 120" stroke="var(--accent)" stroke-width="4" fill="none"/>
<line x1="110" y1="404" x2="840" y2="400" stroke="var(--grey)" stroke-width="4"/>

<line x1="110" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="110" y1="90" x2="110" y2="440" stroke="var(--line)" stroke-width="2"/>

<circle cx="110" cy="420" r="6" fill="var(--accent)"/>
<text x="130" y="408" font-size="16" fill="var(--dim)">一兩千篇</text>
<circle cx="840" cy="120" r="6" fill="var(--accent)"/>
<text x="828" y="104" font-size="19" fill="var(--accent)" text-anchor="end">六萬篇</text>
<text x="300" y="388" font-size="16" fill="var(--dim)">審查產能</text>
<text x="560" y="300" font-size="19" fill="var(--warn)">空隙＝審查變浮淺</text>

<text x="110" y="470" font-size="15" fill="var(--dim)">十年前</text>
<text x="880" y="470" font-size="15" fill="var(--dim)" text-anchor="end">現在</text>
<text x="480" y="525" font-size="22" fill="var(--ink)" text-anchor="middle">品質訊號撐不住的地方在空隙裡</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two five-year bar charts: in year 4, with no new process node, the left group keeps its integration segment while the right group's bar falls to zero.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="480" y="48" text-anchor="middle" class="h">Gain = 2 parts</text>
<rect x="300" y="68" width="20" height="20" rx="3" fill="var(--grey)"/>
<text x="328" y="84" class="b">Node</text>
<rect x="500" y="68" width="20" height="20" rx="3" fill="var(--accent)"/>
<text x="528" y="84" class="b">Design</text>
<rect x="40" y="104" width="420" height="370" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="104" width="420" height="370" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="250" y="140" text-anchor="middle" class="g">Both</text>
<text x="710" y="140" text-anchor="middle" class="g">Node</text>
<rect x="296" y="160" width="70" height="264" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="756" y="160" width="70" height="264" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="70" y1="410" x2="430" y2="410" stroke="var(--line)" stroke-width="2"/>
<g>
<rect x="85" y="250" width="50" height="100" fill="var(--grey)"/><rect x="85" y="350" width="50" height="60" fill="var(--accent)"/>
<rect x="155" y="250" width="50" height="100" fill="var(--grey)"/><rect x="155" y="350" width="50" height="60" fill="var(--accent)"/>
<rect x="225" y="250" width="50" height="100" fill="var(--grey)"/><rect x="225" y="350" width="50" height="60" fill="var(--accent)"/>
<rect x="306" y="350" width="50" height="60" fill="var(--accent)"/>
<rect x="375" y="250" width="50" height="100" fill="var(--grey)"/><rect x="375" y="350" width="50" height="60" fill="var(--accent)"/>
</g>
<line x1="530" y1="410" x2="890" y2="410" stroke="var(--line)" stroke-width="2"/>
<g>
<rect x="545" y="250" width="50" height="160" fill="var(--grey)"/>
<rect x="615" y="250" width="50" height="160" fill="var(--grey)"/>
<rect x="685" y="250" width="50" height="160" fill="var(--grey)"/>
<rect x="835" y="250" width="50" height="160" fill="var(--grey)"/>
</g>
<text x="791" y="400" text-anchor="middle" class="g" style="fill:var(--warn)">0</text>
<g class="b" text-anchor="middle">
<text x="110" y="446">1</text><text x="180" y="446">2</text><text x="250" y="446">3</text><text x="331" y="446">4</text><text x="400" y="446">5</text>
<text x="570" y="446">1</text><text x="640" y="446">2</text><text x="710" y="446">3</text><text x="791" y="446">4</text><text x="860" y="446">5</text>
</g>
<text x="480" y="182" text-anchor="middle" class="b" style="fill:var(--warn)">Y4</text>
<text x="480" y="202" text-anchor="middle" class="b" style="fill:var(--warn)">No node</text>
<text x="480" y="528" text-anchor="middle" class="c">No tailwind reveals it</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two double-track sets: Nardelli's set has unchanged tactics on top but a broken values track underneath; Blake's set has new tactics but a continuous values track">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .v { font-size:19px; font-weight:700; }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<defs>
<marker id="f10g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--grey)"/></marker>
</defs>
<text x="60" y="52" class="t">Which layer got swapped out</text>
<text x="200" y="104" class="b">At founding</text>
<line x1="270" y1="98" x2="800" y2="98" stroke="var(--grey)" stroke-width="2" marker-end="url(#f10g)"/>
<text x="880" y="104" class="b" text-anchor="end">Later</text>
<text x="40" y="196" class="g">Nardelli</text>
<text x="188" y="167" class="b" text-anchor="end">Tactics</text>
<rect x="200" y="140" width="220" height="40" fill="var(--grey)"/>
<rect x="430" y="140" width="220" height="40" fill="var(--grey)"/>
<rect x="660" y="140" width="220" height="40" fill="var(--grey)"/>
<text x="188" y="222" class="b" text-anchor="end">Values</text>
<rect x="200" y="195" width="320" height="40" fill="var(--accent)"/>
<rect x="532" y="195" width="348" height="40" fill="var(--warn)"/>
<line x1="40" y1="275" x2="920" y2="275" stroke="var(--line)" stroke-width="2"/>
<text x="40" y="366" class="g">Blake</text>
<text x="188" y="337" class="b" text-anchor="end">Tactics</text>
<rect x="200" y="310" width="220" height="40" fill="var(--grey)"/>
<rect x="430" y="310" width="220" height="40" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<rect x="660" y="310" width="220" height="40" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="540" y="337" class="b" text-anchor="middle">New tactic</text>
<text x="770" y="337" class="b" text-anchor="middle">New tactic</text>
<text x="188" y="392" class="b" text-anchor="end">Values</text>
<rect x="200" y="365" width="680" height="40" fill="var(--accent)"/>
<text x="480" y="480" class="c" text-anchor="middle">Keep values, swap tactics</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩個時間點之間有兩條交叉的線：中國從最高處往下走到百分之十九，台灣從下方往上走到百分之二十七點三，位置對調">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="56" font-size="27" fill="var(--ink)">新興市場的第一大成分換人了</text>

  <text x="240" y="112" font-size="19" fill="var(--dim)" text-anchor="middle">五年前</text>
  <text x="760" y="112" font-size="19" fill="var(--dim)" text-anchor="middle">現在</text>

  <line x1="240" y1="140" x2="240" y2="440" stroke="var(--line)" stroke-width="2"/>
  <line x1="760" y1="140" x2="760" y2="440" stroke="var(--line)" stroke-width="2"/>

  <text x="70" y="168" font-size="15" fill="var(--dim)">權重高</text>
  <text x="70" y="436" font-size="15" fill="var(--dim)">權重低</text>

  <line x1="240" y1="180" x2="760" y2="340" stroke="var(--grey)" stroke-width="3"/>
  <line x1="240" y1="400" x2="760" y2="190" stroke="var(--accent)" stroke-width="3"/>

  <circle cx="240" cy="180" r="6" fill="var(--grey)"/>
  <circle cx="760" cy="340" r="6" fill="var(--grey)"/>
  <circle cx="240" cy="400" r="6" fill="var(--accent)"/>
  <circle cx="760" cy="190" r="6" fill="var(--accent)"/>

  <text x="222" y="176" font-size="19" fill="var(--ink)" text-anchor="end">中國</text>
  <text x="222" y="200" font-size="15" fill="var(--dim)" text-anchor="end">第一大</text>
  <text x="222" y="406" font-size="19" fill="var(--ink)" text-anchor="end">台灣</text>

  <text x="782" y="196" font-size="20" fill="var(--accent)">台灣 27.3%</text>
  <text x="782" y="346" font-size="20" fill="var(--dim)">中國 19%</text>

  <text x="480" y="502" font-size="22" fill="var(--ink)" text-anchor="middle">名字沒改，買到的東西改了</text>
</svg>
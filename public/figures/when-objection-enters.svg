<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條時間軸，反對意見的箭頭分別插在末端與起點">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">反對什麼時候進來，決定它蓋不蓋得成</text>
<text x="60" y="176" font-size="19" font-weight="700" fill="var(--dim)">常見劇本</text>
<line x1="230" y1="230" x2="800" y2="230" stroke="var(--line)" stroke-width="3"/>
<circle cx="250" cy="230" r="9" fill="var(--dim)"/>
<circle cx="420" cy="230" r="9" fill="var(--dim)"/>
<circle cx="600" cy="230" r="9" fill="var(--warn)"/>
<circle cx="780" cy="230" r="9" fill="var(--warn)"/>
<text x="250" y="266" font-size="16" fill="var(--dim)" text-anchor="middle">決定</text>
<text x="420" y="266" font-size="16" fill="var(--dim)" text-anchor="middle">宣布</text>
<text x="600" y="266" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="middle">辯護</text>
<text x="780" y="266" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="middle">放棄</text>
<line x1="520" y1="150" x2="520" y2="212" stroke="var(--warn)" stroke-width="3"/>
<polygon points="520,224 512,204 528,204" fill="var(--warn)"/>
<text x="536" y="162" font-size="19" font-weight="700" fill="var(--warn)">反對聲音才進來</text>
<text x="60" y="376" font-size="19" font-weight="700" fill="var(--dim)">杭州重啟</text>
<line x1="230" y1="430" x2="800" y2="430" stroke="var(--line)" stroke-width="3"/>
<circle cx="250" cy="430" r="9" fill="var(--accent)"/>
<circle cx="420" cy="430" r="9" fill="var(--dim)"/>
<circle cx="600" cy="430" r="9" fill="var(--dim)"/>
<circle cx="780" cy="430" r="9" fill="var(--accent)"/>
<text x="250" y="466" font-size="16" font-weight="700" fill="var(--accent)" text-anchor="middle">設計</text>
<text x="420" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">改地點與補償</text>
<text x="600" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">宣布</text>
<text x="780" y="466" font-size="16" font-weight="700" fill="var(--accent)" text-anchor="middle">動工</text>
<line x1="250" y1="350" x2="250" y2="412" stroke="var(--accent)" stroke-width="3"/>
<polygon points="250,424 242,404 258,404" fill="var(--accent)"/>
<text x="266" y="362" font-size="19" font-weight="700" fill="var(--accent)">反對聲音先進來</text>
<text x="60" y="528" font-size="22" font-weight="700" fill="var(--ink)">同一座廠，差別只在那個箭頭插在哪裡</text>
</svg>
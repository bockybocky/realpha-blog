<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="一排三十條高低不一的分數長條中挑出 A 與 B 兩條，換算成一條加總百分之百的橫條">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<defs><marker id="f3ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker></defs>
<text x="40" y="58" font-size="27" font-weight="700">不必訓練：只讀兩個字的分數</text>
<text x="60" y="124" font-size="19" style="fill:var(--dim)">第一個字的分數</text>
<g fill="var(--grey)">
<rect x="64" y="360" width="10" height="40"/><rect x="79" y="310" width="10" height="90"/><rect x="94" y="375" width="10" height="25"/><rect x="109" y="340" width="10" height="60"/><rect x="124" y="270" width="10" height="130"/><rect x="139" y="365" width="10" height="35"/><rect x="154" y="330" width="10" height="70"/><rect x="169" y="380" width="10" height="20"/>
<rect x="199" y="355" width="10" height="45"/><rect x="214" y="315" width="10" height="85"/><rect x="229" y="370" width="10" height="30"/><rect x="244" y="250" width="10" height="150"/><rect x="259" y="345" width="10" height="55"/><rect x="274" y="375" width="10" height="25"/><rect x="289" y="305" width="10" height="95"/><rect x="304" y="360" width="10" height="40"/><rect x="319" y="280" width="10" height="120"/><rect x="334" y="335" width="10" height="65"/>
<rect x="364" y="320" width="10" height="80"/><rect x="379" y="350" width="10" height="50"/><rect x="394" y="260" width="10" height="140"/><rect x="409" y="365" width="10" height="35"/><rect x="424" y="340" width="10" height="60"/><rect x="439" y="375" width="10" height="25"/><rect x="454" y="300" width="10" height="100"/><rect x="469" y="355" width="10" height="45"/><rect x="484" y="325" width="10" height="75"/><rect x="499" y="370" width="10" height="30"/>
</g>
<rect x="184" y="290" width="10" height="110" fill="var(--accent)"/>
<text x="189" y="280" font-size="16" font-weight="700" text-anchor="middle" style="fill:var(--accent)">A</text>
<rect x="349" y="355" width="10" height="45" fill="var(--accent)"/>
<text x="354" y="345" font-size="16" font-weight="700" text-anchor="middle" style="fill:var(--accent)">B</text>
<line x1="60" y1="400" x2="520" y2="400" stroke="var(--line)" stroke-width="2"/>
<text x="290" y="430" font-size="16" text-anchor="middle" style="fill:var(--dim)">詞表：幾萬個字</text>
<text x="578" y="284" font-size="16" text-anchor="middle" style="fill:var(--dim)">只取 A、B</text>
<line x1="540" y1="300" x2="612" y2="300" stroke="var(--dim)" stroke-width="2" marker-end="url(#f3ah)"/>
<text x="775" y="238" font-size="19" text-anchor="middle">加總 100%</text>
<path d="M630,256 L630,248 L920,248 L920,256" fill="none" stroke="var(--dim)" stroke-width="1.5"/>
<rect x="630" y="270" width="203" height="56" fill="var(--accent)"/>
<rect x="833" y="270" width="87" height="56" fill="var(--grey)"/>
<text x="731" y="305" font-size="19" font-weight="700" text-anchor="middle" style="fill:var(--page)">A 70%</text>
<text x="876" y="305" font-size="16" text-anchor="middle">B 30%</text>
<text x="775" y="362" font-size="16" text-anchor="middle" style="fill:var(--dim)">softmax 換算</text>
<text x="920" y="430" font-size="15" text-anchor="end" style="fill:var(--dim)">分數與比例為示意</text>
<text x="480" y="515" font-size="22" font-weight="700" text-anchor="middle">接龍模型當場變成選擇題</text>
</svg>
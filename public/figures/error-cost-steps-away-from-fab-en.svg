<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A four-step staircase showing that the farther a mistake travels from the fab, the taller the cost step becomes.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">The farther from the floor, the bigger the jump in cost</text>

<rect x="120" y="430" width="150" height="40" rx="5" fill="var(--accent)"/>
<rect x="320" y="360" width="150" height="110" rx="5" fill="var(--grey)"/>
<rect x="520" y="250" width="150" height="220" rx="5" fill="var(--grey)"/>
<rect x="720" y="130" width="150" height="340" rx="5" fill="var(--warn)"/>

<text class="t" x="195" y="412" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">×1</text>
<text class="t" x="395" y="342" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">×10</text>
<text class="t" x="595" y="232" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">×100</text>
<text class="t" x="795" y="112" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">×1000</text>

<line x1="100" y1="470" x2="890" y2="470" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="195" y="498" font-size="16" fill="var(--ink)" text-anchor="middle">In the cleanroom</text>
<text class="t" x="395" y="498" font-size="16" fill="var(--ink)" text-anchor="middle">On the board</text>
<text class="t" x="595" y="498" font-size="16" fill="var(--ink)" text-anchor="middle">In the rack</text>
<text class="t" x="795" y="498" font-size="16" fill="var(--ink)" text-anchor="middle">In the server</text>

<text class="t" x="48" y="540" font-size="22" font-weight="700" fill="var(--ink)">Every cheap moment sits on the far left</text>
</svg>
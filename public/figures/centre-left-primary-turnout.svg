<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="初選投票人數的兩根柱，前一屆超過一百萬的高柱旁邊是只有十二萬的矮柱">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">中間蒸發的樣子</text>
<line x1="120" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="3"/>
<rect x="220" y="110" width="170" height="310" fill="var(--grey)"/>
<text x="220" y="94" font-size="19" fill="var(--ink)">超過一百萬</text>
<text x="220" y="452" font-size="16" fill="var(--dim)">上一屆初選</text>
<rect x="600" y="382" width="170" height="38" fill="var(--warn)"/>
<text x="600" y="364" font-size="19" fill="var(--warn)">12 萬</text>
<text x="600" y="452" font-size="16" fill="var(--dim)">這個週末</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩組柱狀對照，左組兩柱等高差距為零，右組你的下跌柱明顯比大盤淺，差距被標註" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="80" y="54" font-size="27" font-weight="700" fill="var(--ink)">賺的是市場的錢，還是自己的</text>

  <text x="300" y="112" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">多頭年</text>
  <text x="660" y="112" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">空頭年</text>

  <line x1="100" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="3"/>

  <rect x="200" y="170" width="80" height="130" fill="var(--grey)" rx="4"/>
  <rect x="320" y="170" width="80" height="130" fill="var(--accent)" rx="4"/>
  <text x="240" y="326" font-size="16" fill="var(--dim)" text-anchor="middle">大盤 +30</text>
  <text x="360" y="326" font-size="16" fill="var(--ink)" text-anchor="middle">你 +30</text>
  <line x1="200" y1="158" x2="400" y2="158" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="300" y="146" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">差 0</text>

  <rect x="560" y="300" width="80" height="100" fill="var(--grey)" rx="4"/>
  <rect x="680" y="300" width="80" height="25" fill="var(--accent)" rx="4"/>
  <text x="600" y="290" font-size="16" fill="var(--dim)" text-anchor="middle">大盤 −20</text>
  <text x="720" y="290" font-size="16" fill="var(--ink)" text-anchor="middle">你 −5</text>
  <line x1="655" y1="325" x2="655" y2="400" stroke="var(--accent)" stroke-width="3"/>
  <line x1="645" y1="325" x2="665" y2="325" stroke="var(--accent)" stroke-width="3"/>
  <line x1="645" y1="400" x2="665" y2="400" stroke="var(--accent)" stroke-width="3"/>
  <text x="676" y="368" font-size="19" font-weight="700" fill="var(--accent)">差 15</text>

  <text x="480" y="472" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">差額才是你做出來的</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三組不同順序的琴鍵輸入，箭頭全部匯聚到同一個行為方塊">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">三種按法，同一個動作</text>
<rect x="60" y="100" width="560" height="360" rx="14" fill="var(--card)"/>
<g>
<rect x="100" y="140" width="50" height="76" rx="4" fill="var(--accent)"/>
<rect x="154" y="140" width="50" height="76" rx="4" fill="var(--grey)" opacity="0.4"/>
<rect x="208" y="140" width="50" height="76" rx="4" fill="var(--accent)"/>
<rect x="262" y="140" width="50" height="76" rx="4" fill="var(--grey)" opacity="0.4"/>
<rect x="316" y="140" width="50" height="76" rx="4" fill="var(--accent)"/>
<text class="t" x="125" y="188" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">1</text>
<text class="t" x="233" y="188" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">2</text>
<text class="t" x="341" y="188" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">3</text>
<text class="t" x="400" y="186" font-size="19" fill="var(--ink)">照順序</text>
</g>
<g>
<rect x="100" y="250" width="50" height="76" rx="4" fill="var(--accent)"/>
<rect x="154" y="250" width="50" height="76" rx="4" fill="var(--grey)" opacity="0.4"/>
<rect x="208" y="250" width="50" height="76" rx="4" fill="var(--accent)"/>
<rect x="262" y="250" width="50" height="76" rx="4" fill="var(--grey)" opacity="0.4"/>
<rect x="316" y="250" width="50" height="76" rx="4" fill="var(--accent)"/>
<text class="t" x="125" y="298" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">3</text>
<text class="t" x="233" y="298" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">2</text>
<text class="t" x="341" y="298" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">1</text>
<text class="t" x="400" y="296" font-size="19" fill="var(--ink)">倒著按</text>
</g>
<g>
<rect x="100" y="360" width="50" height="76" rx="4" fill="var(--accent)"/>
<rect x="154" y="360" width="50" height="76" rx="4" fill="var(--grey)" opacity="0.4"/>
<rect x="208" y="360" width="50" height="76" rx="4" fill="var(--accent)"/>
<rect x="262" y="360" width="50" height="76" rx="4" fill="var(--grey)" opacity="0.4"/>
<rect x="316" y="360" width="50" height="76" rx="4" fill="var(--accent)"/>
<text class="t" x="233" y="406" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">同時</text>
<text class="t" x="400" y="406" font-size="19" fill="var(--ink)">全部砸下</text>
</g>
<path d="M620 186 L740 260" stroke="var(--line)" stroke-width="3" fill="none"/>
<path d="M620 296 L740 288" stroke="var(--line)" stroke-width="3" fill="none"/>
<path d="M620 406 L740 316" stroke="var(--line)" stroke-width="3" fill="none"/>
<rect x="740" y="238" width="160" height="100" rx="12" fill="var(--accent)"/>
<text class="t" x="820" y="282" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">同一個</text>
<text class="t" x="820" y="310" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">行為</text>
<text class="t" x="60" y="506" font-size="22" font-weight="700" fill="var(--ink)">聲音差很遠，動作一樣</text>
</svg>
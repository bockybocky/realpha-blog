<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根堆疊長條：業界燃油段約占四分之一，卡達燃油段接近一半" style="font-family:&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="80" y="72" font-size="27" fill="var(--ink)">燃油在費用裡占多大一塊</text>

<line x1="200" y1="470" x2="800" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="200" y1="295" x2="800" y2="295" stroke="var(--line)" stroke-width="1" stroke-dasharray="5 6"/>
<text x="810" y="301" font-size="15" fill="var(--dim)">一半</text>

<rect x="250" y="120" width="160" height="252" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="250" y="372" width="160" height="98" fill="var(--accent)"/>
<text x="330" y="112" font-size="19" fill="var(--ink)" text-anchor="middle">多數航空公司</text>
<text x="330" y="255" font-size="16" fill="var(--dim)" text-anchor="middle">人事與其他</text>
<text x="330" y="428" font-size="16" fill="var(--page)" text-anchor="middle">燃油</text>
<text x="330" y="500" font-size="19" fill="var(--dim)" text-anchor="middle">25–30%</text>

<rect x="560" y="120" width="160" height="196" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="560" y="316" width="160" height="154" fill="var(--accent)"/>
<text x="640" y="112" font-size="19" fill="var(--ink)" text-anchor="middle">卡達航空</text>
<text x="640" y="225" font-size="16" fill="var(--dim)" text-anchor="middle">人事壓低</text>
<text x="640" y="400" font-size="16" fill="var(--page)" text-anchor="middle">燃油</text>
<text x="640" y="500" font-size="19" fill="var(--dim)" text-anchor="middle">44%</text>

<text x="80" y="542" font-size="22" fill="var(--ink)">近一半的費用，綁在同一個價格上</text>
</svg>
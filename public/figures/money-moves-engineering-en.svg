<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two input-versus-output curves: adding people flattens quickly, while the current curve is lifted along its whole length.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .g { font-size:20px; font-weight:700; }
    .l { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">Money moves engineering now</text>
<text class="s" x="60" y="88">The Mythical Man-Month is the lower curve</text>
<line x1="150" y1="440" x2="890" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="140" x2="150" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="104" y="150">Output</text>
<text class="s" x="820" y="470">Input</text>
<path d="M150 440 C300 324 520 290 880 286" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M150 440 C320 260 560 200 880 170" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="700" y="316" fill="var(--dim)">Add people</text>
<text class="l" x="640" y="344">Slower each time</text>
<text class="g" x="700" y="156" fill="var(--accent)">20 people, $1B</text>
<line x1="880" y1="180" x2="880" y2="276" stroke="var(--ink)" stroke-width="2"/>
<text class="l" x="828" y="238">The gap</text>
<text class="c" x="150" y="506">What's new isn't more money, it's spendable</text>
</svg>
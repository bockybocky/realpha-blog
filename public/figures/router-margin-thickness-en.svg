<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars of equal height, a thick spread above the cost on the left and only a thin sliver on the right">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">Who picks, keeps the spread</text>
<text x="280" y="130" font-size="20" fill="var(--dim)" text-anchor="middle">Platform picks</text>
<rect x="220" y="200" width="120" height="200" fill="none" stroke="var(--accent)" stroke-width="2"/>
<rect x="220" y="300" width="120" height="100" fill="var(--accent)"/>
<text x="280" y="258" font-size="16" fill="var(--accent)" text-anchor="middle">Spread $5</text>
<text x="280" y="358" font-size="16" fill="var(--page)" text-anchor="middle">Cost $5</text>
<text x="280" y="188" font-size="16" fill="var(--dim)" text-anchor="middle">Price $10</text>
<text x="680" y="130" font-size="20" fill="var(--dim)" text-anchor="middle">Customer picks</text>
<rect x="620" y="200" width="120" height="200" fill="none" stroke="var(--accent)" stroke-width="2"/>
<rect x="620" y="220" width="120" height="180" fill="var(--accent)"/>
<text x="770" y="216" font-size="16" fill="var(--accent)">Spread $1</text>
<text x="680" y="320" font-size="16" fill="var(--page)" text-anchor="middle">Cost $9</text>
<text x="680" y="188" font-size="16" fill="var(--dim)" text-anchor="middle">Price $10</text>
<line x1="150" y1="400" x2="850" y2="400" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="480" font-size="22" fill="var(--ink)">Its thickness is the price of trust</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩格各有球隊與名人兩個方塊，左格箭頭由球隊指向名人，右格箭頭方向反過來由股東指向球隊，用箭頭反向顯示金流倒轉。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .n { font-size:22px; font-weight:700; fill:var(--accent); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">錢往哪個方向流</text>

  <rect x="60" y="100" width="400" height="400" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="100" width="400" height="400" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="260" y="142" text-anchor="middle">請名人代言</text>
  <text class="g" x="700" y="142" text-anchor="middle">讓名人當股東</text>

  <rect x="100" y="230" width="140" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="170" y="272" text-anchor="middle">球隊</text>
  <rect x="280" y="230" width="140" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="350" y="272" text-anchor="middle">名人</text>
  <path d="M244 265 L274 265" stroke="var(--grey)" stroke-width="4"/>
  <path d="M262 253 L278 265 L262 277" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <text class="g" x="260" y="200" text-anchor="middle">球隊付錢</text>
  <text class="b" x="260" y="360" text-anchor="middle">效果說不清</text>

  <rect x="540" y="230" width="140" height="70" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="b" x="610" y="272" text-anchor="middle">球隊</text>
  <rect x="720" y="230" width="140" height="70" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="b" x="790" y="272" text-anchor="middle">股東</text>
  <path d="M716 265 L686 265" stroke="var(--accent)" stroke-width="4"/>
  <path d="M698 253 L682 265 L698 277" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text class="g" x="700" y="200" text-anchor="middle">名人掏錢</text>
  <text class="b" x="700" y="360" text-anchor="middle">股東自己做行銷</text>
  <text class="b" x="700" y="392" text-anchor="middle">球隊不付錢</text>
</svg>
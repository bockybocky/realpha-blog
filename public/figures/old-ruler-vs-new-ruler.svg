<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="舊尺量電晶體高度被矮晶片互聯繞過，新尺改量註冊地與製程把那條路擋住">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="48">換了一把尺</text>

<rect x="60" y="80" width="820" height="210" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="118">舊尺：單顆電晶體數</text>
<path d="M84 170 L560 170" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 8"/>
<text class="s" x="572" y="176">上限紅線</text>
<rect x="110" y="190" width="60" height="70" fill="var(--page)" stroke="var(--accent)"/>
<rect x="200" y="215" width="40" height="45" fill="var(--page)" stroke="var(--accent)"/>
<rect x="256" y="215" width="40" height="45" fill="var(--page)" stroke="var(--accent)"/>
<rect x="312" y="215" width="40" height="45" fill="var(--page)" stroke="var(--accent)"/>
<rect x="368" y="215" width="40" height="45" fill="var(--page)" stroke="var(--accent)"/>
<path d="M240 238 L256 238 M296 238 L312 238 M352 238 L368 238" stroke="var(--accent)" stroke-width="3"/>
<text class="s" x="200" y="282">壓在線下，再用互聯綁起來訓練</text>

<rect x="60" y="316" width="820" height="200" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="84" y="354">新尺：註冊地　加　製程節點</text>
<rect x="84" y="382" width="190" height="56" rx="8" fill="var(--page)" stroke="var(--line)"/>
<text class="g" x="104" y="418">五國業者</text>
<text class="g" x="296" y="418">＋</text>
<rect x="330" y="382" width="230" height="56" rx="8" fill="var(--page)" stroke="var(--line)"/>
<text class="g" x="350" y="418">16／14 奈米以下</text>
<path d="M580 410 L660 410" stroke="var(--warn)" stroke-width="4"/>
<rect x="666" y="382" width="18" height="56" fill="var(--warn)"/>
<text class="s" x="700" y="404">台積電要先拿許可</text>
<text class="s" x="700" y="432">才能開工</text>
<text class="s" x="84" y="486">晶片做多大不再是重點</text>

<text class="c" x="60" y="562">尺一換，壓低電晶體數那條路就不算路了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條線交叉，原本較低的那條上穿另一條">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="76">同一家公司，兩個部門的季營收</text>

<line x1="200" y1="140" x2="200" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="200" y1="420" x2="860" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="200" y="452">去年同期</text>
<text class="b" x="790" y="452">這一季</text>

<path d="M 230 370 L 830 180" stroke="var(--grey)" stroke-width="3.5" fill="none"/>
<path d="M 230 392 L 830 172" stroke="var(--accent)" stroke-width="4" fill="none"/>

<circle cx="230" cy="392" r="7" fill="var(--accent)"/>
<circle cx="830" cy="172" r="7" fill="var(--accent)"/>
<circle cx="230" cy="370" r="7" fill="var(--grey)"/>
<circle cx="830" cy="180" r="7" fill="var(--grey)"/>

<text class="g" x="60" y="398" fill="var(--accent)">商業</text>
<text class="b" x="150" y="420">3.97 億</text>
<text class="g" x="856" y="166" fill="var(--accent)">9.84 億</text>
<text class="g" x="856" y="212">9.53 億</text>
<text class="g" x="60" y="364">政府</text>

<text class="c" x="60" y="512">描述過期，是因為線交叉了</text>
</svg>
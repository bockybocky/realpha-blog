<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two pipelines compared: the original routes through a cloud, the local build keeps everything on your machine">
    <defs><marker id="em1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888888"/></marker></defs>
    <text x="20" y="30" font-family="sans-serif" font-size="15" font-weight="600" fill="#333333">Original (cloud-direct)</text>
    <rect x="20" y="45" width="150" height="46" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="8"/><text x="95" y="73" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">Browser extension</text>
    <rect x="230" y="45" width="150" height="46" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="8"/><text x="305" y="73" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">Embedding model</text>
    <rect x="440" y="45" width="230" height="46" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/><text x="555" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">Cloud vector storage</text><text x="555" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">(your history leaves home)</text>
    <path d="M170,68 L228,68" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#em1)"/><path d="M380,68 L438,68" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#em1)"/>
    <text x="20" y="170" font-family="sans-serif" font-size="15" font-weight="600" fill="#333333">Local build (the missing piece)</text>
    <rect x="20" y="185" width="150" height="46" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="8"/><text x="95" y="213" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">Same extension</text>
    <rect x="230" y="185" width="180" height="46" fill="#eaf7ee" stroke="#27804a" stroke-width="1.5" rx="8"/><text x="320" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">A hand-written server</text><text x="320" y="224" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">(the fourth leg)</text>
    <rect x="470" y="185" width="200" height="46" fill="#eaf7ee" stroke="#27804a" stroke-width="1.5" rx="8"/><text x="570" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">Local model + local DB</text><text x="570" y="224" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">(nothing leaves)</text>
    <path d="M170,208 L228,208" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#em1)"/><path d="M410,208 L468,208" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#em1)"/>
  </svg>

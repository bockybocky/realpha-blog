<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="左側一根集中在單月的高柱，右側跨越九年的格子只有稀疏幾格亮起，對比集中一瞬與散在多年兩種計分方式">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">兩把尺量的東西不一樣</text>

<rect x="60" y="100" width="380" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="88" y="140">點擊數</text>
<text class="b" x="88" y="168">同一個月的每一次都算</text>
<rect x="196" y="200" width="108" height="180" rx="6" fill="var(--grey)"/>
<line x1="150" y1="380" x2="360" y2="380" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="214" y="408">一個月</text>

<rect x="520" y="100" width="380" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="548" y="140">月份數</text>
<text class="b" x="548" y="168">同月推 5 次也只亮 1 格</text>
<rect x="548" y="196" width="34" height="34" rx="5" fill="var(--accent)"/>
<rect x="590" y="196" width="34" height="34" rx="5" fill="var(--line)"/>
<rect x="632" y="196" width="34" height="34" rx="5" fill="var(--accent)"/>
<rect x="674" y="196" width="34" height="34" rx="5" fill="var(--line)"/>
<rect x="716" y="196" width="34" height="34" rx="5" fill="var(--line)"/>
<rect x="758" y="196" width="34" height="34" rx="5" fill="var(--accent)"/>
<rect x="800" y="196" width="34" height="34" rx="5" fill="var(--line)"/>
<rect x="842" y="196" width="34" height="34" rx="5" fill="var(--accent)"/>
<rect x="548" y="246" width="34" height="34" rx="5" fill="var(--line)"/>
<rect x="590" y="246" width="34" height="34" rx="5" fill="var(--accent)"/>
<rect x="632" y="246" width="34" height="34" rx="5" fill="var(--line)"/>
<rect x="674" y="246" width="34" height="34" rx="5" fill="var(--accent)"/>
<rect x="716" y="246" width="34" height="34" rx="5" fill="var(--line)"/>
<rect x="758" y="246" width="34" height="34" rx="5" fill="var(--line)"/>
<rect x="800" y="246" width="34" height="34" rx="5" fill="var(--accent)"/>
<rect x="842" y="246" width="34" height="34" rx="5" fill="var(--line)"/>
<line x1="548" y1="320" x2="876" y2="320" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="548" y="348">2018</text>
<text class="b" x="828" y="348">2026</text>
<text class="b" x="548" y="400">排第一的那支：17 人、25 分</text>

<text class="c" x="60" y="492">一瞬間的熱度，換不到跨年的記得</text>
</svg>
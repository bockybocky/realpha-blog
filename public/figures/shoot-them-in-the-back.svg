<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="亮燈後三個月的區塊中價格續漲，衝出尖頂後以警示色一路回落，最後貼回那條標著亮燈位置的水平虛線">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .gd { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .w { font-size:19px; fill:var(--warn); }
    .a { font-size:19px; fill:var(--accent); }
  </style>
  <text class="t" x="60" y="66">不在上漲途中開槍</text>
  <line x1="70" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
  <rect x="240" y="120" width="180" height="330" fill="var(--card)"/>
  <line x1="240" y1="120" x2="240" y2="450" stroke="var(--accent)" stroke-width="2"/>
  <line x1="240" y1="300" x2="900" y2="300" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="b" x="440" y="292">亮燈的位置</text>
  <path d="M100 340 L170 322 L240 300" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M240 300 L330 250 L420 206 L520 150" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M520 150 L600 214 L680 258 L790 292 L870 300" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="240" cy="300" r="7" fill="var(--accent)"/>
  <text class="a" x="196" y="480">亮燈</text>
  <text class="gd" x="252" y="110">三個月：八成更高</text>
  <text class="b" x="470" y="130">六個月：已經在翻頭</text>
  <circle cx="640" cy="236" r="7" fill="var(--warn)"/>
  <text class="w" x="656" y="226">從背後開槍</text>
  <text class="b" x="690" y="340">最後跌回那條線</text>
  <text class="c" x="60" y="518">亮燈之後，用的是借來的時間</text>
</svg>
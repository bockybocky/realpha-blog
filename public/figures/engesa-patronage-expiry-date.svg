<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="時間線上靠山的壽命條在一九八五到一九九○之間終止，公司的債務條繼續延伸到一九九三，末段懸空沒有支撐">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">優勢的到期日，寫在它的來源上</text>

<text x="60" y="162" font-size="19" fill="var(--accent)">靠山</text>
<rect x="367" y="180" width="323" height="56" fill="var(--accent)"/>
<rect x="690" y="180" width="95" height="56" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 5"/>
<text x="392" y="218" font-size="16" fill="var(--page)">陸軍交情與軍政府</text>

<text x="60" y="296" font-size="19" fill="var(--ink)">公司</text>
<rect x="177" y="314" width="608" height="56" fill="var(--grey)"/>
<rect x="785" y="314" width="57" height="56" fill="var(--warn)"/>
<text x="206" y="352" font-size="16" fill="var(--ink)">成本結構與債務照「有人會接住」設計</text>

<line x1="120" y1="420" x2="880" y2="420" stroke="var(--ink)" stroke-width="2"/>
<g font-size="15" fill="var(--dim)">
<line x1="177" y1="420" x2="177" y2="434" stroke="var(--line)" stroke-width="2"/><text x="157" y="458">1958</text>
<line x1="462" y1="420" x2="462" y2="434" stroke="var(--line)" stroke-width="2"/><text x="442" y="458">1973</text>
<line x1="690" y1="420" x2="690" y2="434" stroke="var(--line)" stroke-width="2"/><text x="670" y="458">1985</text>
<line x1="785" y1="420" x2="785" y2="434" stroke="var(--line)" stroke-width="2"/><text x="765" y="458">1990</text>
<line x1="842" y1="420" x2="842" y2="434" stroke="var(--line)" stroke-width="2"/><text x="822" y="458">1993</text>
</g>
<text x="636" y="494" font-size="16" fill="var(--accent)">回到民主</text>
<text x="742" y="494" font-size="16" fill="var(--warn)">沒有人接住</text>

<text x="60" y="524" font-size="22" fill="var(--ink)">寫不出到期日的，就當它明年會消失。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two stacks compared, and on the right the radar base is knocked out so the three stock layers above it all turn grey.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">Lose the base block and the pile above stops counting</text>
<rect x="70" y="92" width="380" height="308" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="510" y="92" width="380" height="308" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="260" y="130" text-anchor="middle" font-size="20" fill="var(--ink)">Radar intact</text>
<text x="700" y="130" text-anchor="middle" font-size="20" fill="var(--ink)">Radar knocked out</text>
<rect x="140" y="156" width="240" height="44" rx="6" fill="var(--accent)" opacity="0.25" stroke="var(--accent)"/>
<text x="260" y="185" text-anchor="middle" font-size="16" fill="var(--ink)">Shipborne interceptors</text>
<rect x="140" y="208" width="240" height="44" rx="6" fill="var(--accent)" opacity="0.25" stroke="var(--accent)"/>
<text x="260" y="237" text-anchor="middle" font-size="16" fill="var(--ink)">THAAD</text>
<rect x="140" y="260" width="240" height="44" rx="6" fill="var(--accent)" opacity="0.25" stroke="var(--accent)"/>
<text x="260" y="289" text-anchor="middle" font-size="16" fill="var(--ink)">Patriot</text>
<rect x="110" y="320" width="300" height="52" rx="6" fill="var(--accent)" opacity="0.55" stroke="var(--accent)"/>
<text x="260" y="353" text-anchor="middle" font-size="19" fill="var(--ink)">Radar</text>
<rect x="580" y="156" width="240" height="44" rx="6" fill="var(--grey)" opacity="0.3" stroke="var(--grey)"/>
<text x="700" y="185" text-anchor="middle" font-size="16" fill="var(--dim)">Shipborne interceptors</text>
<rect x="580" y="208" width="240" height="44" rx="6" fill="var(--grey)" opacity="0.3" stroke="var(--grey)"/>
<text x="700" y="237" text-anchor="middle" font-size="16" fill="var(--dim)">THAAD</text>
<rect x="580" y="260" width="240" height="44" rx="6" fill="var(--grey)" opacity="0.3" stroke="var(--grey)"/>
<text x="700" y="289" text-anchor="middle" font-size="16" fill="var(--dim)">Patriot</text>
<rect x="550" y="320" width="300" height="52" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="560" y1="328" x2="840" y2="364" stroke="var(--warn)" stroke-width="2.5"/>
<line x1="840" y1="328" x2="560" y2="364" stroke="var(--warn)" stroke-width="2.5"/>
<text x="480" y="470" text-anchor="middle" font-size="22" fill="var(--ink)">However high the stock, no eyes means zero</text>
</svg>
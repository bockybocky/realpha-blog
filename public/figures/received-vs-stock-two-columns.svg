<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左欄寫滿、右欄空白的兩欄紙，底部相加才是成績">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); }
  .g { font-size:20px; fill:var(--ink); }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">兩欄紙</text>

<rect x="60" y="96" width="838" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="479" y1="96" x2="479" y2="416" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="96" y="140">當下領到的</text>
<text class="g" x="516" y="140">存量的變化</text>

<rect x="96" y="168" width="330" height="22" rx="6" fill="var(--accent)" opacity="0.85"/>
<rect x="96" y="204" width="300" height="22" rx="6" fill="var(--accent)" opacity="0.85"/>
<rect x="96" y="240" width="340" height="22" rx="6" fill="var(--accent)" opacity="0.85"/>
<rect x="96" y="276" width="270" height="22" rx="6" fill="var(--accent)" opacity="0.85"/>
<rect x="96" y="312" width="320" height="22" rx="6" fill="var(--accent)" opacity="0.85"/>
<text class="b" x="96" y="368">稱讚 · 爽感 · 入帳 · 有人回訊息</text>

<rect x="516" y="168" width="340" height="22" rx="6" fill="none" stroke="var(--grey)" stroke-dasharray="5 5"/>
<rect x="516" y="204" width="340" height="22" rx="6" fill="none" stroke="var(--grey)" stroke-dasharray="5 5"/>
<rect x="516" y="240" width="340" height="22" rx="6" fill="none" stroke="var(--grey)" stroke-dasharray="5 5"/>
<text class="b" x="516" y="368">能力 · 關係 · 健康 · 信用</text>

<text class="c" x="60" y="478">真正的成績，是兩欄相加</text>
</svg>
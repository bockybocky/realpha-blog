<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A complete four-link chain on the top row, and the same chain on the bottom row broken open at the second link, leaving a gap.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">Remove one condition to find out</text>
  <text x="60" y="124" font-size="20" fill="var(--dim)">Normal</text>
  <rect x="150" y="150" width="140" height="60" rx="30" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text x="178" y="188" font-size="16" fill="var(--ink)">Blackout</text>
  <rect x="270" y="150" width="140" height="60" rx="30" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text x="298" y="188" font-size="16" fill="var(--ink)">Phone</text>
  <rect x="390" y="150" width="140" height="60" rx="30" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text x="418" y="188" font-size="16" fill="var(--ink)">Number</text>
  <rect x="510" y="150" width="140" height="60" rx="30" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text x="538" y="188" font-size="16" fill="var(--ink)">Reached</text>
  <text x="60" y="314" font-size="20" fill="var(--warn)">Test it</text>
  <rect x="150" y="340" width="140" height="60" rx="30" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <text x="178" y="378" font-size="16" fill="var(--ink)">Blackout</text>
  <rect x="300" y="340" width="140" height="60" rx="30" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 8"/>
  <text x="318" y="378" font-size="16" fill="var(--warn)">Phone dead</text>
  <rect x="450" y="340" width="140" height="60" rx="30" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <text x="478" y="378" font-size="16" fill="var(--dim)">Number</text>
  <rect x="600" y="340" width="140" height="60" rx="30" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <text x="628" y="378" font-size="16" fill="var(--dim)">Reached</text>
  <text x="620" y="442" font-size="16" fill="var(--warn)">Breaks here</text>
  <text x="60" y="490" font-size="22" fill="var(--ink)">Never tested failing, never proven.</text>
</svg>
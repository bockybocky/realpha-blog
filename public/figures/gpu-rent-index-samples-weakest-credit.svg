<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三層市場供給中只有中間一層被圈出並連到指數">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">指數取樣的那一層</text>

<rect x="60" y="110" width="560" height="84" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="90" y="146" font-size="20" fill="var(--grey)">超大規模雲端業者</text>
<text x="90" y="174" font-size="16" fill="var(--grey)">內部定價．排除</text>
<line x1="90" y1="128" x2="330" y2="128" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>

<rect x="60" y="218" width="560" height="84" rx="10" fill="var(--page)" stroke="var(--accent)" stroke-width="4"/>
<text x="90" y="254" font-size="20" fill="var(--ink)">中型算力商</text>
<text x="90" y="282" font-size="16" fill="var(--accent)">對外實際成交價</text>

<rect x="60" y="326" width="560" height="84" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="90" y="362" font-size="20" fill="var(--grey)">小型與不良業者</text>
<text x="90" y="390" font-size="16" fill="var(--grey)">急售量</text>

<line x1="620" y1="260" x2="748" y2="260" stroke="var(--accent)" stroke-width="3"/>
<polygon points="748,250 772,260 748,270" fill="var(--accent)"/>
<rect x="776" y="222" width="124" height="76" rx="10" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="800" y="256" font-size="19" fill="var(--accent)">租金</text>
<text x="800" y="282" font-size="19" fill="var(--accent)">指數</text>

<text x="60" y="470" font-size="22" fill="var(--ink)">量到的是信用最弱那一段</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="上面看起來分散的六檔持股，所有線往下收斂到同一個共用底座">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">上面分散，下面共用</text>

<text x="60" y="110" font-size="19" font-weight="700" fill="var(--dim)">看起來彼此獨立</text>
<g fill="var(--card)" stroke="var(--accent)" stroke-width="3">
<rect x="60" y="132" width="120" height="68" rx="10"/>
<rect x="212" y="132" width="120" height="68" rx="10"/>
<rect x="364" y="132" width="120" height="68" rx="10"/>
<rect x="516" y="132" width="120" height="68" rx="10"/>
<rect x="668" y="132" width="120" height="68" rx="10"/>
<rect x="820" y="132" width="80" height="68" rx="10"/>
</g>
<g font-size="16" fill="var(--dim)">
<text x="98" y="174">持股</text><text x="250" y="174">持股</text><text x="402" y="174">持股</text>
<text x="554" y="174">持股</text><text x="706" y="174">持股</text><text x="838" y="174">持股</text>
</g>

<g fill="none" stroke="var(--grey)" stroke-width="3">
<path d="M120 200 L440 320"/>
<path d="M272 200 L452 320"/>
<path d="M424 200 L470 320"/>
<path d="M576 200 L490 320"/>
<path d="M728 200 L508 320"/>
<path d="M860 200 L520 320"/>
</g>

<rect x="140" y="330" width="680" height="150" rx="14" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="172" y="372" font-size="20" font-weight="700" fill="var(--warn)">同一座地面站</text>
<text x="172" y="414" font-size="16" fill="var(--ink)">同一套基礎設施</text>
<text x="416" y="414" font-size="16" font-weight="700" fill="var(--warn)">同一筆錢（最容易漏）</text>
<text x="172" y="448" font-size="16" fill="var(--ink)">同一條法規</text>

<text x="60" y="536" font-size="22" font-weight="700" fill="var(--ink)">檔數擋得住的，和地面站擋不住的，不是同一件事。</text>
</svg>
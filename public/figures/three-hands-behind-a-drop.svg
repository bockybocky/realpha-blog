<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條下跌的股價線，三支箭頭從不同來源指向它">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="72" font-size="27" font-weight="700" fill="var(--ink)">同一根下跌，三隻不同的手</text>

  <rect x="90" y="130" width="230" height="78" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="205" y="166" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">生意變差</text>
  <text class="t" x="205" y="194" font-size="16" text-anchor="middle" fill="var(--dim)">分子</text>

  <rect x="365" y="130" width="230" height="78" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="166" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">折現率變了</text>
  <text class="t" x="480" y="194" font-size="16" text-anchor="middle" fill="var(--dim)">分母</text>

  <rect x="640" y="130" width="230" height="78" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="755" y="166" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">浮額被洗</text>
  <text class="t" x="755" y="194" font-size="16" text-anchor="middle" fill="var(--dim)">籌碼</text>

  <line x1="205" y1="214" x2="205" y2="282" stroke="var(--grey)" stroke-width="4"/>
  <polygon points="205,300 194,276 216,276" fill="var(--grey)"/>
  <line x1="480" y1="214" x2="480" y2="326" stroke="var(--grey)" stroke-width="4"/>
  <polygon points="480,344 469,320 491,320" fill="var(--grey)"/>
  <line x1="755" y1="214" x2="755" y2="366" stroke="var(--grey)" stroke-width="4"/>
  <polygon points="755,384 744,360 766,360" fill="var(--grey)"/>

  <polyline points="110,300 300,318 480,352 660,382 870,420" fill="none" stroke="var(--warn)" stroke-width="6" stroke-linejoin="round"/>
  <text class="t" x="110" y="452" font-size="16" fill="var(--dim)">股價</text>

  <text class="t" x="480" y="506" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">分不出是哪一隻，就只會跟著心情砍</text>
</svg>
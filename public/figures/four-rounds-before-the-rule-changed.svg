<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸上四個投資點依序排開，每點下方標示再看一次，法規修改的旗標出現在最後一個點之後">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .t{font-size:27px;fill:var(--ink);font-weight:700}
    .g{font-size:19px;fill:var(--ink);font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .s{font-size:15px;fill:var(--dim)}
    .c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">四輪之後，規則才改</text>
<text class="b" x="60" y="88">每一輪之間，他都又多看到一次「這群人還在」</text>
<line x1="100" y1="300" x2="890" y2="300" stroke="var(--line)" stroke-width="4"/>
<path d="M884 292 L900 300 L884 308 Z" fill="var(--line)"/>
<circle cx="180" cy="300" r="12" fill="var(--accent)"/>
<circle cx="340" cy="300" r="12" fill="var(--accent)"/>
<circle cx="500" cy="300" r="12" fill="var(--accent)"/>
<circle cx="660" cy="300" r="12" fill="var(--accent)"/>
<text class="g" x="180" y="346" text-anchor="middle">第一輪</text>
<text class="g" x="340" y="346" text-anchor="middle">第二輪</text>
<text class="g" x="500" y="346" text-anchor="middle">第三輪</text>
<text class="g" x="660" y="346" text-anchor="middle">第四輪</text>
<text class="s" x="180" y="378" text-anchor="middle">再看一次</text>
<text class="s" x="340" y="378" text-anchor="middle">再看一次</text>
<text class="s" x="500" y="378" text-anchor="middle">再看一次</text>
<text class="s" x="660" y="378" text-anchor="middle">再看一次</text>
<line x1="790" y1="300" x2="790" y2="186" stroke="var(--warn)" stroke-width="4"/>
<path d="M790 186 L878 202 L790 220 Z" fill="var(--warn)"/>
<text class="g" x="790" y="166" text-anchor="middle" fill="var(--warn)">法規修改</text>
<text class="b" x="100" y="240">他押的不是這支旗子</text>
<text class="c" x="60" y="460">分批不是為了買便宜，是為了多看幾次</text>
</svg>
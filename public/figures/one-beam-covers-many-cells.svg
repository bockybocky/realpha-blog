<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一道波束的大圓裡裝著數十座地面基地台的小圓">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .g { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="48" y="62" font-size="27" font-weight="700">一道波束，蓋住整座城市</text>

  <circle cx="420" cy="320" r="190" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <g fill="none" stroke="var(--grey)" stroke-width="2">
    <circle cx="340" cy="200" r="22"/><circle cx="400" cy="200" r="22"/><circle cx="460" cy="200" r="22"/>
    <circle cx="310" cy="250" r="22"/><circle cx="370" cy="250" r="22"/><circle cx="430" cy="250" r="22"/><circle cx="490" cy="250" r="22"/>
    <circle cx="280" cy="300" r="22"/><circle cx="340" cy="300" r="22"/><circle cx="400" cy="300" r="22"/><circle cx="460" cy="300" r="22"/><circle cx="520" cy="300" r="22"/>
    <circle cx="310" cy="350" r="22"/><circle cx="370" cy="350" r="22"/><circle cx="430" cy="350" r="22"/><circle cx="490" cy="350" r="22"/>
    <circle cx="340" cy="400" r="22"/><circle cx="400" cy="400" r="22"/><circle cx="460" cy="400" r="22"/>
    <circle cx="370" cy="450" r="22"/><circle cx="430" cy="450" r="22"/>
  </g>

  <line x1="230" y1="320" x2="610" y2="320" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="t" x="650" y="300" font-size="20" font-weight="700" fill="var(--accent)">一道波束</text>
  <text class="g" x="650" y="328" font-size="16">直徑幾十公里</text>

  <line x1="470" y1="450" x2="700" y2="470" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="710" y="462" font-size="20" font-weight="700">一座基地台</text>
  <text class="g" x="710" y="490" font-size="16">幾百公尺</text>

  <text class="t" x="48" y="534" font-size="22" font-weight="700">兩者在系統裡是同一個角色</text>
</svg>
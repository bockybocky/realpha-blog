<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="In this two-by-two crossover, the bars grow much taller along the data direction and barely change along the architecture direction.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .k { font-size:22px; font-weight:700; fill:var(--accent); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70">Data vs arch</text>
  <text class="b" x="60" y="102">Bars = perf, illustrative</text>

  <text class="g" x="60" y="200">Data</text>
  <text class="b" x="60" y="228">2026</text>
  <text class="b" x="60" y="368">2019</text>

  <rect x="170" y="140" width="300" height="170" rx="10" fill="var(--card)"/>
  <rect x="500" y="140" width="300" height="170" rx="10" fill="var(--card)"/>
  <rect x="170" y="330" width="300" height="170" rx="10" fill="var(--card)"/>
  <rect x="500" y="330" width="300" height="170" rx="10" fill="var(--card)"/>

  <rect x="300" y="180" width="46" height="110" rx="5" fill="var(--accent)" opacity="0.75"/>
  <rect x="630" y="170" width="46" height="120" rx="5" fill="var(--accent)"/>
  <rect x="300" y="450" width="46" height="30" rx="5" fill="var(--grey)"/>
  <rect x="630" y="440" width="46" height="40" rx="5" fill="var(--grey)"/>

  <text class="b" x="170" y="530">Arch 2019</text>
  <text class="b" x="500" y="530">Arch 2026</text>

  <path d="M 850 470 L 850 200" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <path d="M 850 188 L 842 206 L 858 206 Z" fill="var(--accent)"/>
  <text class="g" x="810" y="160">Swap</text>

  <path d="M 420 520 L 600 520" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <path d="M 612 520 L 594 512 L 594 528 Z" fill="var(--grey)"/>

  <text class="k" x="60" y="440">Gap on y</text>
  <text class="b" x="60" y="470">Two levers:</text>
  <text class="b" x="60" y="494">Filter+synth gains</text>
</svg>
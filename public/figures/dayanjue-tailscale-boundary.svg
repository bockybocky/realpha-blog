<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="封閉圈內含手機與兩台電腦，圈外公開網路的箭頭被牆擋住">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .d { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700">連得到的範圍</text>

  <text class="d" x="60" y="118" font-size="19">公開網路</text>
  <rect x="60" y="140" width="190" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="d" x="100" y="200" font-size="16">任何人</text>
  <text class="d" x="100" y="232" font-size="16">掃到的機器</text>
  <text class="d" x="100" y="264" font-size="16">爬蟲</text>

  <line x1="258" y1="290" x2="330" y2="290" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="330,290 318,283 318,297" fill="var(--warn)"/>
  <rect x="344" y="150" width="10" height="280" fill="var(--warn)" opacity="0.55"/>
  <text class="d" x="300" y="470" font-size="16" fill="var(--warn)">擋在門外</text>

  <rect x="400" y="120" width="500" height="340" rx="24" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="430" y="160" font-size="20" font-weight="700" fill="var(--accent)">Tailscale 私人網路</text>

  <rect x="440" y="196" width="150" height="86" rx="12" fill="var(--page)" stroke="var(--line)"/>
  <text class="t" x="470" y="246" font-size="16">手機</text>

  <rect x="700" y="196" width="160" height="86" rx="12" fill="var(--page)" stroke="var(--line)"/>
  <text class="t" x="732" y="236" font-size="16">筆電</text>
  <text class="d" x="732" y="262" font-size="15">背景工作</text>

  <rect x="700" y="328" width="160" height="86" rx="12" fill="var(--page)" stroke="var(--line)"/>
  <text class="t" x="732" y="368" font-size="16">桌機</text>
  <text class="d" x="732" y="394" font-size="15">背景工作</text>

  <line x1="592" y1="239" x2="696" y2="239" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="696,239 684,232 684,246" fill="var(--accent)"/>
  <line x1="592" y1="252" x2="660" y2="371" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="660,371 647,366 655,357" fill="var(--accent)"/>
  <line x1="660" y1="371" x2="696" y2="371" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="696,371 684,364 684,378" fill="var(--accent)"/>

  <text class="d" x="440" y="432" font-size="16">一支檔案</text>
  <text class="d" x="440" y="458" font-size="16">只要瀏覽器</text>
</svg>
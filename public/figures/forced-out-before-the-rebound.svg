<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條 V 形曲線，谷底附近有三個被迫離場的標記，右上方的回升終點沒有人抵達">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">你撐得住，你的錢不一定</text>
  <polyline points="90,160 220,300 340,400 440,430 560,400 700,290 860,150" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="860" cy="150" r="8" fill="var(--accent)"/>
  <text class="t" x="740" y="126" font-size="19" font-weight="700" fill="var(--accent)">反彈終點</text>
  <circle cx="300" cy="372" r="9" fill="var(--warn)"/>
  <line x1="300" y1="372" x2="300" y2="300" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
  <text class="t" x="232" y="286" font-size="16" fill="var(--warn)">融資追繳</text>
  <circle cx="420" cy="428" r="9" fill="var(--warn)"/>
  <line x1="420" y1="428" x2="420" y2="490" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
  <text class="t" x="360" y="512" font-size="16" fill="var(--warn)">要用錢的時間點</text>
  <circle cx="470" cy="427" r="9" fill="var(--warn)"/>
  <line x1="470" y1="427" x2="560" y2="470" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
  <text class="t" x="572" y="476" font-size="16" fill="var(--warn)">谷底認賠</text>
  <text class="t" x="60" y="548" font-size="22" font-weight="700" fill="var(--ink)">三個出口都在谷底，終點在右上角</text>
</svg>
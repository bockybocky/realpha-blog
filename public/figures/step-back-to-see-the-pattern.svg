<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="十張並列的筆記卡片，退一步後重疊處浮現一條橫貫的共同主線">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="80" y="62">十份筆記裡沒有的那個結論</text>
<rect x="80" y="100" width="800" height="330" fill="var(--card)"/>
<text class="g" x="120" y="146">一家一家談</text>
<rect x="120" y="170" width="54" height="190" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="186" y="170" width="54" height="190" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="252" y="170" width="54" height="190" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="318" y="170" width="54" height="190" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="384" y="170" width="54" height="190" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="450" y="170" width="54" height="190" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="516" y="170" width="54" height="190" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="582" y="170" width="54" height="190" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="648" y="170" width="54" height="190" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="714" y="170" width="54" height="190" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="120" y="386">每一家都只講自己下一季的 pipeline</text>
<rect x="120" y="258" width="648" height="34" fill="var(--accent)" opacity="0.18"/>
<line x1="120" y1="275" x2="768" y2="275" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="792" y="282">共同的</text>
<text class="s" x="792" y="306">那一句</text>
<text class="c" x="80" y="472">蒐集和歸納用的是兩種腦，第二種要排進行程</text>
<text class="s" x="80" y="504">找出現超過三次、每次都被當成背景帶過的那句話</text>
</svg>
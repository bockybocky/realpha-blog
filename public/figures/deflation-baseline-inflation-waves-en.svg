<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A gently declining long-term baseline with several externally driven waves on top, settling back onto the line once the waves stop.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">The backdrop is deflation; the waves are ours</text>

<rect x="60" y="110" width="840" height="320" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

<path d="M90 250 L890 330" fill="none" stroke="var(--grey)" stroke-width="4" stroke-dasharray="10 8"/>
<text class="t" x="700" y="366" font-size="19" font-weight="700" fill="var(--dim)">Tech deflation</text>

<path d="M90 248 L170 244 L215 160 L265 236 L330 232 L378 150 L430 226 L500 224 L548 132 L604 218 L680 216 L716 176 L760 300 L890 328" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round"/>

<line x1="215" y1="160" x2="215" y2="128" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="215" y="120" font-size="16" fill="var(--warn)" text-anchor="middle">Pandemic</text>
<line x1="378" y1="150" x2="378" y2="118" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="378" y="110" font-size="16" fill="var(--warn)" text-anchor="middle">War</text>
<line x1="548" y1="132" x2="548" y2="100" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="548" y="92" font-size="16" fill="var(--warn)" text-anchor="middle">Tariffs</text>
<line x1="716" y1="176" x2="716" y2="144" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="716" y="136" font-size="16" fill="var(--warn)" text-anchor="middle">Migration</text>

<line x1="760" y1="118" x2="760" y2="410" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="t" x="775" y="404" font-size="16" fill="var(--dim)">No new waves</text>

<text class="t" x="480" y="490" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Waves stop and the slope takes over</text>
</svg>
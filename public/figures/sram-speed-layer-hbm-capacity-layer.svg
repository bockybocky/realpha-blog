<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="窄小的 SRAM 在上先生出四個候選，寬大的 HBM 在下負責篩選，兩層各據一個位置" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="var(--accent)"/>
    </marker>
  </defs>

  <text x="480" y="54" text-anchor="middle" font-size="27" fill="var(--ink)">兩層站在不同位置，不互相取代</text>

  <text x="120" y="152" font-size="20" fill="var(--accent)">速度層</text>
  <rect x="380" y="112" width="200" height="72" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="480" y="146" text-anchor="middle" font-size="20" fill="var(--ink)">SRAM</text>
  <text x="480" y="172" text-anchor="middle" font-size="15" fill="var(--dim)">快 · 貴 · 小</text>

  <line x1="440" y1="184" x2="330" y2="252" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="465" y1="184" x2="425" y2="252" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="495" y1="184" x2="535" y2="252" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="520" y1="184" x2="630" y2="252" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar2)"/>

  <circle cx="320" cy="272" r="16" fill="var(--card)" stroke="var(--line)"/>
  <circle cx="418" cy="272" r="16" fill="var(--card)" stroke="var(--line)"/>
  <circle cx="542" cy="272" r="16" fill="var(--card)" stroke="var(--line)"/>
  <circle cx="640" cy="272" r="16" fill="var(--card)" stroke="var(--line)"/>
  <text x="480" y="322" text-anchor="middle" font-size="16" fill="var(--dim)">先猜出來的候選</text>

  <text x="120" y="404" font-size="20" fill="var(--dim)">容量層</text>
  <rect x="200" y="358" width="560" height="90" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="480" y="396" text-anchor="middle" font-size="20" fill="var(--ink)">HBM</text>
  <text x="480" y="424" text-anchor="middle" font-size="15" fill="var(--dim)">容量大 · 每單位便宜得多 · 負責挑</text>

  <text x="480" y="504" text-anchor="middle" font-size="22" fill="var(--ink)">快的先猜，大的來選</text>
</svg>
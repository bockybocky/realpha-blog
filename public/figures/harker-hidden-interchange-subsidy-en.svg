<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A thick arrow runs from the cash payer to the card payer, and the arrow in the same direction on the right is far thinner.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="480" y="58" font-size="27" fill="var(--ink)" text-anchor="middle">Who the invisible charge is billed to</text>

  <rect x="310" y="100" width="280" height="60" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="450" y="139" font-size="20" fill="var(--ink)" text-anchor="middle">Same $10 sticker price</text>
  <line x1="380" y1="160" x2="240" y2="248" stroke="var(--line)" stroke-width="3"/>
  <line x1="520" y1="160" x2="640" y2="248" stroke="var(--line)" stroke-width="3"/>

  <rect x="140" y="250" width="200" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="240" y="292" font-size="20" fill="var(--ink)" text-anchor="middle">Card</text>
  <text x="240" y="330" font-size="16" fill="var(--dim)" text-anchor="middle">Merchant gets $9.7</text>

  <rect x="540" y="250" width="200" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="640" y="292" font-size="20" fill="var(--ink)" text-anchor="middle">Cash</text>
  <text x="640" y="330" font-size="16" fill="var(--dim)" text-anchor="middle">Merchant gets $10</text>

  <line x1="536" y1="305" x2="368" y2="305" stroke="var(--warn)" stroke-width="14"/>
  <polygon points="368,288 368,322 342,305" fill="var(--warn)"/>
  <text x="452" y="268" font-size="19" fill="var(--warn)" text-anchor="middle">A $0.3 subsidy</text>

  <line x1="536" y1="420" x2="398" y2="420" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="398,414 398,426 384,420" fill="var(--accent)"/>
  <text x="640" y="426" font-size="16" fill="var(--dim)" text-anchor="start">Capped at 50 bps</text>
  <text x="452" y="398" font-size="16" fill="var(--accent)" text-anchor="middle">$0.05</text>

  <text x="480" y="508" font-size="22" fill="var(--ink)" text-anchor="middle">The ones paying cash are usually the lower earners</text>
</svg>
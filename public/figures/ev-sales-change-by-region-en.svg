<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three bars, two pointing up and one pointing down, and the one pointing down is the US.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="52" font-size="27" font-weight="700" fill="var(--ink)">EV sales YoY</text>
<rect x="190" y="100" width="130" height="280" fill="var(--accent)"/>
<text x="255" y="90" font-size="22" font-weight="700" fill="var(--accent)" text-anchor="middle">+100%</text>
<rect x="430" y="299" width="130" height="81" fill="var(--accent)"/>
<text x="495" y="287" font-size="22" font-weight="700" fill="var(--accent)" text-anchor="middle">+29%</text>
<text x="495" y="255" font-size="15" fill="var(--dim)" text-anchor="middle">On trend</text>
<rect x="670" y="380" width="130" height="59" fill="var(--warn)"/>
<text x="735" y="468" font-size="22" font-weight="700" fill="var(--warn)" text-anchor="middle">−21%</text>
<text x="815" y="416" font-size="15" fill="var(--dim)">Credit cut</text>
<line x1="140" y1="380" x2="900" y2="380" stroke="var(--dim)" stroke-width="2"/>
<text x="128" y="386" font-size="16" fill="var(--dim)" text-anchor="end">0</text>
<text x="255" y="510" font-size="20" fill="var(--ink)" text-anchor="middle">Others</text>
<text x="495" y="510" font-size="20" fill="var(--ink)" text-anchor="middle">EU</text>
<text x="735" y="510" font-size="20" fill="var(--ink)" text-anchor="middle">US</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="矮柱與高柱的高度差：上一季損益表很小，未來五年固定承諾高出數倍">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">兩份東西，兩種時間長度</text>
<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="352" width="210" height="68" fill="var(--grey)"/>
<text x="150" y="336" font-size="19" fill="var(--dim)">上一季</text>
<text x="150" y="450" font-size="16" fill="var(--ink)">損益表</text>
<text x="150" y="474" font-size="15" fill="var(--dim)">獲利、現金流正、毛利七到八成</text>
<rect x="600" y="118" width="210" height="302" fill="var(--accent)"/>
<text x="600" y="102" font-size="19" fill="var(--dim)">往後五年</text>
<text x="600" y="450" font-size="16" fill="var(--ink)">固定承諾</text>
<text x="600" y="474" font-size="15" fill="var(--dim)">運算採購 5,000 至 8,000 億美元</text>
<path d="M 380 386 L 580 300" stroke="var(--dim)" stroke-width="2" fill="none"/>
<path d="M 580 300 l -16 1 l 11 11 z" fill="var(--dim)"/>
<text x="60" y="516" font-size="22" fill="var(--ink)">看它的承諾往哪長，不是看它上一季多漂亮</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Eight bad-news items stack high on the left, while on the right the index bar sits just a sliver below its record high.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">A year of bad news, index up 2.6%</text>
<text class="t" x="60" y="110" font-size="19" fill="var(--dim)">Each a black swan</text>
<rect x="60" y="130" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="153" font-size="16" fill="var(--ink)">Hormuz</text>
<rect x="60" y="172" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="195" font-size="16" fill="var(--ink)">Oil spike</text>
<rect x="60" y="214" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="237" font-size="16" fill="var(--ink)">Tariffs</text>
<rect x="60" y="256" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="279" font-size="16" fill="var(--ink)">Sticky inflation</text>
<rect x="60" y="298" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="321" font-size="16" fill="var(--ink)">5% yields</text>
<rect x="60" y="340" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="363" font-size="16" fill="var(--ink)">Fed hikes</text>
<rect x="60" y="382" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="405" font-size="16" fill="var(--ink)">Housing frozen</text>
<rect x="60" y="424" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="447" font-size="16" fill="var(--ink)">Models slowing</text>
<text class="t" x="560" y="110" font-size="19" fill="var(--dim)">Index</text>
<line x1="560" y1="148" x2="900" y2="148" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="t" x="560" y="140" font-size="15" fill="var(--dim)">Record high</text>
<rect x="620" y="160" width="200" height="298" rx="4" fill="var(--accent)"/>
<line x1="850" y1="148" x2="850" y2="160" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="864" y="160" font-size="19" fill="var(--accent)">2.6%</text>
<text class="t" x="60" y="520" font-size="22" fill="var(--ink)">Long list, small gap</text>
</svg>
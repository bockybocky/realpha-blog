<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三根柱子：入冬庫存 80 僅略高於史上最高抽用 74，而最少抽用只有 37，緩衝薄而區間寬">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:20px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .u { font-size:15px; fill:var(--dim); }
</style>
<text class="t" x="60" y="56">入冬的庫存，只比史上最猛的一個冬天多一點</text>
<text class="u" x="60" y="84">單位：BCM（十億立方公尺）</text>
<line x1="100" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="170" y="130" width="130" height="340" fill="var(--accent)" rx="4"/>
<rect x="420" y="155" width="130" height="315" fill="var(--warn)" rx="4"/>
<rect x="670" y="313" width="130" height="157" fill="var(--grey)" rx="4"/>
<text class="g" x="235" y="112" text-anchor="middle">80</text>
<text class="g" x="485" y="137" text-anchor="middle">74</text>
<text class="g" x="735" y="295" text-anchor="middle">37</text>
<text class="n" x="235" y="502" text-anchor="middle">入冬庫存</text>
<text class="n" x="485" y="502" text-anchor="middle">抽用最猛</text>
<text class="n" x="735" y="502" text-anchor="middle">抽用最少</text>
<text class="u" x="235" y="526" text-anchor="middle">2026 預估</text>
<text class="u" x="485" y="526" text-anchor="middle">2018 紀錄</text>
<text class="u" x="735" y="526" text-anchor="middle">歷史低值</text>
<line x1="300" y1="130" x2="420" y2="130" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="300" y1="155" x2="420" y2="155" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="360" y1="130" x2="360" y2="155" stroke="var(--ink)" stroke-width="2"/>
<text class="c" x="372" y="150">餘裕 6</text>
</svg>
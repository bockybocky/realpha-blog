<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The left half is a steeply falling two-point line and the right half is a single very tall bar, so the drop on the left contrasts with the strength on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">The one that fell, the one that held</text>

<line x1="470" y1="96" x2="470" y2="470" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="60" y="132" font-size="19" font-weight="700" fill="var(--ink)">QoQ growth</text>
<text class="t" x="60" y="158" font-size="16" fill="var(--dim)">The number markets watch</text>
<line x1="120" y1="440" x2="420" y2="440" stroke="var(--line)" stroke-width="2"/>
<polyline points="160,206 370,382" fill="none" stroke="var(--warn)" stroke-width="5"/>
<circle cx="160" cy="206" r="8" fill="var(--warn)"/>
<circle cx="370" cy="382" r="8" fill="var(--warn)"/>
<text class="t" x="160" y="186" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">144%</text>
<text class="t" x="370" y="362" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">47%</text>
<text class="t" x="160" y="468" font-size="16" fill="var(--dim)" text-anchor="middle">Q2</text>
<text class="t" x="370" y="468" font-size="16" fill="var(--dim)" text-anchor="middle">Q3</text>

<text class="t" x="540" y="132" font-size="19" font-weight="700" fill="var(--ink)">NRR</text>
<text class="t" x="540" y="158" font-size="16" fill="var(--dim)">What old clients pay now</text>
<line x1="540" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="580" y="416" width="110" height="24" rx="4" fill="var(--grey)"/>
<text class="t" x="635" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">Last yr</text>
<rect x="740" y="190" width="110" height="250" rx="6" fill="var(--accent)"/>
<text class="t" x="795" y="172" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">900%</text>
<text class="t" x="795" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">This yr</text>

<text class="t" x="480" y="516" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Underselling is not no demand</text>
</svg>
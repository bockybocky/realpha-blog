<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三層緩衝由薄到厚，衝擊從左邊依序打穿最薄的那層">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="54" font-size="27" font-weight="700" fill="var(--ink)">誰先出血：看緩衝有多厚</text>
<rect x="60" y="100" width="840" height="340" fill="var(--card)"/>
<path d="M90 270 L150 270" stroke="var(--warn)" stroke-width="5"/>
<path d="M142 258 L162 270 L142 282 Z" fill="var(--warn)"/>
<text x="90" y="246" font-size="19" font-weight="700" fill="var(--warn)">衝擊</text>
<rect x="190" y="150" width="34" height="240" fill="var(--warn)"/>
<text x="238" y="182" font-size="20" font-weight="700" fill="var(--ink)">① 餐廳與小生意</text>
<text x="238" y="208" font-size="16" fill="var(--dim)">緩衝最薄，最先倒</text>
<rect x="470" y="150" width="86" height="240" fill="var(--grey)"/>
<text x="570" y="182" font-size="20" font-weight="700" fill="var(--ink)">② 現場工種</text>
<text x="570" y="208" font-size="16" fill="var(--dim)">髮妝・置景・燈光器材</text>
<rect x="760" y="150" width="140" height="240" fill="var(--accent)" opacity="0.35"/>
<text x="830" y="182" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">③ 編劇與片商</text>
<text x="830" y="208" font-size="16" fill="var(--dim)" text-anchor="middle">緩衝最厚</text>
<text x="190" y="424" font-size="16" fill="var(--dim)">薄</text>
<text x="900" y="424" font-size="16" fill="var(--dim)" text-anchor="end">厚</text>
<text x="60" y="496" font-size="22" font-weight="700" fill="var(--ink)">先出血的那一層，通常不在你的追蹤清單上。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三層往上追溯的樹狀圖，最底層的節點同時被兩條外來箭頭指向並被圈起">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">往上追三層，找那個共用的</text>

  <rect x="330" y="110" width="300" height="70" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="152" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">我要交出的那件事</text>

  <path d="M480 184 L480 224" stroke="var(--ink)" stroke-width="3" marker-end="url(#ar3)"/>
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink)"/>
    </marker>
  </defs>

  <rect x="330" y="232" width="300" height="70" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="274" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">它靠誰撥時間</text>

  <path d="M480 306 L480 346" stroke="var(--ink)" stroke-width="3" marker-end="url(#ar3)"/>

  <rect x="310" y="354" width="340" height="86" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="4"/>
  <text class="t" x="480" y="390" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">共用資源</text>
  <text class="t" x="480" y="418" font-size="16" fill="var(--dim)" text-anchor="middle">那個人的這個月</text>

  <path d="M140 397 L300 397" stroke="var(--warn)" stroke-width="4" marker-end="url(#ar4)"/>
  <path d="M820 397 L662 397" stroke="var(--warn)" stroke-width="4" marker-end="url(#ar4)"/>
  <defs>
    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/>
    </marker>
  </defs>
  <text class="t" x="140" y="370" font-size="16" fill="var(--dim)">別人也在排</text>
  <text class="t" x="820" y="370" font-size="16" fill="var(--dim)" text-anchor="end">別人也在排</text>

  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">排隊順序決定你的時程</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="An overlay chart: the successor's strength covers only the left half of the company's two holes, the right half empty, filled in by another role below">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="56" font-size="27" fill="var(--ink)">The half covered, the half unnamed</text>

<text x="120" y="140" font-size="20" fill="var(--dim)">The company's holes</text>
<rect x="120" y="156" width="400" height="72" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="520" y="156" width="360" height="72" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="320" y="200" font-size="19" fill="var(--ink)" text-anchor="middle">Product and software</text>
<text x="700" y="200" font-size="19" fill="var(--ink)" text-anchor="middle">Supply chain and ops</text>

<text x="120" y="290" font-size="20" fill="var(--dim)">Successor's strength</text>
<rect x="120" y="306" width="400" height="72" rx="8" fill="var(--accent)" opacity="0.22"/>
<rect x="120" y="306" width="400" height="72" rx="8" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="320" y="350" font-size="19" fill="var(--ink)" text-anchor="middle">Product background</text>
<rect x="520" y="306" width="360" height="72" rx="8" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="9 7"/>
<text x="700" y="350" font-size="19" fill="var(--warn)" text-anchor="middle">Not covered</text>

<line x1="700" y1="386" x2="700" y2="424" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<polygon points="700,432 693,420 707,420" fill="var(--warn)"/>
<rect x="520" y="436" width="360" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="700" y="475" font-size="19" fill="var(--ink)" text-anchor="middle">Longest-serving COO</text>
<text x="120" y="475" font-size="19" fill="var(--dim)">Who holds this?</text>

<text x="60" y="536" font-size="22" fill="var(--accent)">The unnamed box is the risk</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="需求拆成願意付與付得起兩塊，付得起那塊換成營收後整根變實心">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">需求的兩塊</text>

<rect x="170" y="150" width="190" height="130" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 7"/>
<text x="196" y="206" font-size="20" fill="var(--warn)">付得起</text>
<text x="196" y="238" font-size="16" fill="var(--warn)">創投股權</text>

<rect x="170" y="288" width="190" height="130" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="196" y="344" font-size="20" fill="var(--accent)">願意付</text>
<text x="196" y="376" font-size="16" fill="var(--dim)">目前沒出問題</text>
<text x="170" y="452" font-size="16" fill="var(--dim)">今天</text>

<line x1="404" y1="284" x2="492" y2="284" stroke="var(--dim)" stroke-width="3"/>
<polygon points="492,274 516,284 492,294" fill="var(--dim)"/>
<text x="398" y="256" font-size="16" fill="var(--dim)">換成營收</text>

<rect x="556" y="150" width="190" height="268" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="582" y="272" font-size="20" fill="var(--accent)">營收支付</text>
<text x="582" y="304" font-size="16" fill="var(--dim)">一整根</text>
<text x="556" y="452" font-size="16" fill="var(--dim)">失效之後</text>

<text x="60" y="508" font-size="22" fill="var(--ink)">虛線那塊換成實線，圖就回去代表需求</text>
</svg>
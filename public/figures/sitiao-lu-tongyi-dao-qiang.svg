<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四向逃生圖：中央方塊伸出四條箭頭，每條都抵在同一道虛線圍牆上無法穿出">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">四條路，同一道牆</text>

<rect x="60" y="86" width="840" height="400" rx="16" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<rect x="380" y="256" width="200" height="90" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="308" font-size="19" fill="var(--ink)" text-anchor="middle">補 1 兆缺口</text>

<path d="M380 280 L200 180" stroke="var(--accent)" stroke-width="8"/>
<path d="M210 162 L186 172 L196 196 Z" fill="var(--accent)"/>
<text x="92" y="146" font-size="16" fill="var(--ink)">停止放款</text>

<path d="M580 280 L760 180" stroke="var(--accent)" stroke-width="8"/>
<path d="M750 162 L774 172 L764 196 Z" fill="var(--accent)"/>
<text x="700" y="146" font-size="16" fill="var(--ink)">賣掉美債</text>

<path d="M380 322 L200 422" stroke="var(--accent)" stroke-width="8"/>
<path d="M196 406 L186 430 L210 440 Z" fill="var(--accent)"/>
<text x="92" y="464" font-size="16" fill="var(--ink)">發新股搶資本</text>

<path d="M580 322 L760 422" stroke="var(--accent)" stroke-width="8"/>
<path d="M764 406 L774 430 L750 440 Z" fill="var(--accent)"/>
<text x="700" y="464" font-size="16" fill="var(--ink)">讓經濟慢下來</text>

<text x="60" y="534" font-size="22" fill="var(--ink)">每條出口的另一頭，都是同一個麻煩</text>
</svg>
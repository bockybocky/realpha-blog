<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two pairs of bars set a long promised bar against a short delivered stub, differing in length by about thirty times.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">Said, done</text>
<text x="60" y="140" font-size="19" fill="var(--dim)">Houses (units)</text>
<rect x="60" y="155" width="700" height="36" fill="var(--card)" stroke="var(--line)"/>
<text x="774" y="181" font-size="19" fill="var(--dim)">Pledged 20,000</text>
<rect x="60" y="201" width="21" height="36" fill="var(--warn)"/>
<text x="95" y="227" font-size="19" fill="var(--ink)">10 months: 600</text>
<text x="60" y="300" font-size="19" fill="var(--dim)">Farm families</text>
<rect x="60" y="315" width="700" height="36" fill="var(--card)" stroke="var(--line)"/>
<text x="774" y="341" font-size="19" fill="var(--dim)">Plan 316,000</text>
<rect x="60" y="361" width="33" height="36" fill="var(--warn)"/>
<text x="107" y="387" font-size="19" fill="var(--ink)">Actual 15,000</text>
<text x="60" y="462" font-size="22" fill="var(--ink)">Dug fast, built slow</text>
</svg>
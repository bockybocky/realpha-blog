<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The previous generation's milestones spread across five years, while this one's cluster at the left and its dashed line reaches only about three.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .lab { font-size:15px; fill:var(--dim); }
    .num { font-size:16px; fill:var(--ink); }
    .cc { font-size:22px; fill:var(--accent); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="80" y="54">The same road, at twice the speed</text>

  <text class="g" x="80" y="150">Previous generation</text>
  <line x1="170" y1="200" x2="910" y2="200" stroke="var(--grey)" stroke-width="3"/>
  <circle cx="170" cy="200" r="7" fill="var(--grey)"/>
  <circle cx="355" cy="200" r="7" fill="var(--grey)"/>
  <circle cx="417" cy="200" r="7" fill="var(--grey)"/>
  <circle cx="528" cy="200" r="7" fill="var(--grey)"/>
  <circle cx="910" cy="200" r="9" fill="var(--grey)"/>
  <text class="lab" x="170" y="232" text-anchor="middle">Recover</text>
  <text class="lab" x="355" y="232" text-anchor="middle">Refly</text>
  <text class="lab" x="417" y="232" text-anchor="middle">Third flight</text>
  <text class="lab" x="528" y="232" text-anchor="middle">Tenth flight</text>
  <text class="lab" x="910" y="232" text-anchor="end">Rapid reflight</text>
  <text class="num" x="262" y="182" text-anchor="middle">15 months</text>

  <text class="g" x="80" y="330">Starship</text>
  <line x1="170" y1="370" x2="262" y2="370" stroke="var(--accent)" stroke-width="4"/>
  <line x1="262" y1="370" x2="614" y2="370" stroke="var(--accent)" stroke-width="3" stroke-dasharray="9 9"/>
  <circle cx="170" cy="370" r="7" fill="var(--accent)"/>
  <circle cx="262" cy="370" r="7" fill="var(--accent)"/>
  <circle cx="614" cy="370" r="9" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <text class="lab" x="170" y="402" text-anchor="middle">Recover</text>
  <text class="lab" x="262" y="402" text-anchor="middle">Refly</text>
  <text class="lab" x="614" y="402" text-anchor="middle">Estimated</text>
  <text class="num" x="216" y="352" text-anchor="middle">7.5 months</text>

  <line x1="170" y1="450" x2="910" y2="450" stroke="var(--line)" stroke-width="2"/>
  <text class="lab" x="170" y="474" text-anchor="middle">0</text>
  <text class="lab" x="318" y="474" text-anchor="middle">1 yr</text>
  <text class="lab" x="466" y="474" text-anchor="middle">2 yr</text>
  <text class="lab" x="614" y="474" text-anchor="middle">3 yr</text>
  <text class="lab" x="762" y="474" text-anchor="middle">4 yr</text>
  <text class="lab" x="910" y="474" text-anchor="middle">5 yr</text>

  <text class="cc" x="80" y="528">What repeats is the process, not the discovery</text>
</svg>
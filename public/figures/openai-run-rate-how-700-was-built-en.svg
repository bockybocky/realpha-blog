<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three bars show a $40 billion base multiplied by the growth rate to reach $68 billion, written as $70 billion, while the actual $50 billion bar is much shorter.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="64" font-size="27" fill="var(--ink)">How $70B Was Built</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">Unit: $B</text>

<line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>

<rect x="160" y="260" width="140" height="180" rx="4" fill="var(--grey)"/>
<text x="230" y="240" font-size="20" fill="var(--ink)" text-anchor="middle">400</text>
<text x="230" y="472" font-size="16" fill="var(--dim)" text-anchor="middle">Adjusted Base</text>

<rect x="410" y="134" width="140" height="306" rx="4" fill="var(--warn)"/>
<text x="480" y="114" font-size="20" fill="var(--ink)" text-anchor="middle">680</text>
<text x="480" y="472" font-size="16" fill="var(--dim)" text-anchor="middle">Estimate</text>
<text x="480" y="498" font-size="16" fill="var(--warn)" text-anchor="middle">Written as “700”</text>

<rect x="660" y="215" width="140" height="225" rx="4" fill="var(--accent)"/>
<text x="730" y="195" font-size="20" fill="var(--ink)" text-anchor="middle">500</text>
<text x="730" y="472" font-size="16" fill="var(--dim)" text-anchor="middle">Actual</text>

<path d="M310 300 L400 200" stroke="var(--dim)" stroke-width="2" fill="none"/>
<text x="356" y="268" font-size="16" fill="var(--dim)" text-anchor="middle">× 1.77</text>

<line x1="550" y1="134" x2="660" y2="134" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="660" y1="134" x2="660" y2="215" stroke="var(--warn)" stroke-width="2"/>
<text x="828" y="178" font-size="19" fill="var(--warn)">Gap</text>
<text x="828" y="204" font-size="19" fill="var(--warn)">180</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three left-right split bars show money preferring short maturities and investment grade, while the scale at the bottom shows the cash level sitting low.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:19px; fill:var(--ink); font-weight:700; }
.b { font-size:16px; fill:var(--dim); }
.s { font-size:15px; fill:var(--page); font-weight:700; }
.c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="h" x="60" y="72">Back in, picky</text>
<text class="b" x="300" y="128">Favored</text>
<text class="b" x="860" y="128" text-anchor="end">Sold</text>
<text class="g" x="60" y="178">Maturity</text>
<rect x="300" y="152" width="310" height="44" fill="var(--accent)"/>
<rect x="610" y="152" width="250" height="44" fill="var(--grey)"/>
<text class="s" x="320" y="181">Short</text>
<text class="s" x="630" y="181">Long</text>
<text class="g" x="60" y="258">Credit</text>
<rect x="300" y="232" width="360" height="44" fill="var(--accent)"/>
<rect x="660" y="232" width="200" height="44" fill="var(--grey)"/>
<text class="s" x="320" y="261">IG</text>
<text class="s" x="680" y="261">HY</text>
<text class="g" x="60" y="338">Bid cover</text>
<rect x="300" y="312" width="430" height="44" fill="var(--accent)" opacity="0.75"/>
<text class="s" x="320" y="341">2.77, highest since 2014</text>
<text class="g" x="60" y="438">Manager cash</text>
<line x1="300" y1="432" x2="860" y2="432" stroke="var(--line)" stroke-width="4"/>
<line x1="673" y1="408" x2="673" y2="456" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 6"/>
<text class="b" x="673" y="398" text-anchor="middle">4%</text>
<circle cx="626" cy="432" r="13" fill="var(--accent)"/>
<text class="b" x="626" y="482" text-anchor="middle">3.5%</text>
<text class="c" x="60" y="534">Parked in yield, waiting</text>
</svg>
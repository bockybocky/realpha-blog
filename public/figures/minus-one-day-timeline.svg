<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="時間線上攻擊方起跑點往前移，使用者緩衝被壓窄">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .a { font-size:16px; fill:var(--accent); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="68">起跑點往前移了</text>

  <text class="d" x="60" y="150">以前</text>
  <rect x="520" y="128" width="300" height="26" rx="4" fill="var(--grey)"/>
  <text class="d" x="534" y="148">攻擊方開工</text>
  <rect x="520" y="166" width="300" height="10" rx="4" fill="var(--line)"/>
  <text class="d" x="520" y="200">使用者緩衝</text>

  <line x1="100" y1="280" x2="900" y2="280" stroke="var(--ink)" stroke-width="3"/>
  <circle cx="260" cy="280" r="9" fill="var(--warn)"/>
  <circle cx="520" cy="280" r="9" fill="var(--ink)"/>
  <circle cx="820" cy="280" r="9" fill="var(--ink)"/>
  <text class="g" x="190" y="322">修補公開開發</text>
  <text class="g" x="470" y="322">修補發布</text>
  <text class="g" x="760" y="322">使用者升級</text>
  <text class="d" x="196" y="348">負一日</text>
  <text class="d" x="488" y="348">零日</text>
  <text class="d" x="786" y="348">N 日</text>

  <text class="a" x="60" y="422">現在</text>
  <rect x="260" y="400" width="80" height="26" rx="4" fill="var(--accent)"/>
  <text class="a" x="354" y="420">幾小時內做出攻擊程式</text>
  <rect x="340" y="438" width="100" height="10" rx="4" fill="var(--line)"/>
  <text class="d" x="340" y="472">緩衝收窄</text>

  <text class="c" x="60" y="542">公開開發的那一刻，資訊就出去了</text>
</svg>
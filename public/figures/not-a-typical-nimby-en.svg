<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two blocks with the same ratio, and two bars below of very different height">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Opposition doesn't change with distance</text>

<text x="280" y="118" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">Right next door</text>
<text x="680" y="118" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">Zip codes with no proposal</text>

<rect x="150" y="140" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="204" y="140" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="258" y="140" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="312" y="140" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="366" y="140" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="150" y="194" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="204" y="194" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="258" y="194" width="44" height="44" rx="6" fill="var(--grey)"/>
<rect x="312" y="194" width="44" height="44" rx="6" fill="var(--grey)"/>
<rect x="366" y="194" width="44" height="44" rx="6" fill="var(--grey)"/>

<rect x="550" y="140" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="604" y="140" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="658" y="140" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="712" y="140" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="766" y="140" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="550" y="194" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="604" y="194" width="44" height="44" rx="6" fill="var(--accent)"/>
<rect x="658" y="194" width="44" height="44" rx="6" fill="var(--grey)"/>
<rect x="712" y="194" width="44" height="44" rx="6" fill="var(--grey)"/>
<rect x="766" y="194" width="44" height="44" rx="6" fill="var(--grey)"/>

<text x="280" y="272" font-size="16" fill="var(--dim)" text-anchor="middle">Opposed 7 / 10</text>
<text x="680" y="272" font-size="16" fill="var(--dim)" text-anchor="middle">Opposed 7 / 10</text>

<line x1="60" y1="304" x2="900" y2="304" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="344" font-size="19" font-weight="600" fill="var(--dim)">What changes is urgency</text>

<rect x="240" y="366" width="80" height="104" rx="6" fill="var(--accent)"/>
<rect x="640" y="444" width="80" height="26" rx="6" fill="var(--grey)"/>
<line x1="150" y1="470" x2="810" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="280" y="496" font-size="16" fill="var(--ink)" text-anchor="middle">In the top five voting issues</text>
<text x="680" y="496" font-size="16" fill="var(--dim)" text-anchor="middle">Not in it</text>

<text x="480" y="538" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">The fight isn't over where, it's over whether</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A tall bar of fact with a higher dashed expectation line above it, the space between them marked as the gap.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="58" font-size="27" fill="var(--ink)">Good compared with what</text>
<line x1="110" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="470" font-size="16" fill="var(--dim)">Zero</text>
<rect x="300" y="240" width="200" height="200" fill="var(--accent)" opacity="0.85"/>
<text x="400" y="225" font-size="20" fill="var(--accent)" text-anchor="middle">US$16 bn</text>
<text x="400" y="350" font-size="16" fill="var(--page)" text-anchor="middle">The fact that landed</text>
<line x1="250" y1="160" x2="760" y2="160" stroke="var(--grey)" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="770" y="155" font-size="19" fill="var(--dim)">Expectation</text>
<text x="770" y="180" font-size="16" fill="var(--dim)">Not in the press release</text>
<polyline points="560,170 560,230" fill="none" stroke="var(--warn)" stroke-width="2.5"/>
<polygon points="560,160 552,176 568,176" fill="var(--warn)"/>
<polygon points="560,240 552,224 568,224" fill="var(--warn)"/>
<text x="580" y="205" font-size="20" fill="var(--warn)">Gap</text>
<text x="400" y="480" font-size="19" fill="var(--dim)" text-anchor="middle">Absolute: good</text>
<text x="660" y="480" font-size="19" fill="var(--warn)" text-anchor="middle">Versus expectation: short</text>
</g>
</svg>
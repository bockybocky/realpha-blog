<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bar groups jumping from short to tall bars, with the line above marking the RISC lead broken through.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">One generation to catch RISC</text>

<line x1="90" y1="420" x2="890" y2="420" stroke="var(--line)" stroke-width="3"/>

<text class="g" x="200" y="112">Transistors</text>
<rect x="140" y="319" width="90" height="101" rx="4" fill="var(--grey)"/>
<text class="b" x="185" y="305" text-anchor="middle">3.1M</text>
<text class="b" x="185" y="448" text-anchor="middle">Pentium</text>
<rect x="260" y="240" width="90" height="180" rx="4" fill="var(--accent)"/>
<text class="n" x="305" y="226" text-anchor="middle">5.5M</text>
<text class="b" x="305" y="448" text-anchor="middle">Pentium Pro</text>

<text class="g" x="630" y="112">Clock</text>
<rect x="570" y="366" width="90" height="54" rx="4" fill="var(--grey)"/>
<text class="b" x="615" y="352" text-anchor="middle">60MHz</text>
<text class="b" x="615" y="448" text-anchor="middle">Pentium</text>
<rect x="690" y="240" width="90" height="180" rx="4" fill="var(--accent)"/>
<rect x="690" y="240" width="90" height="45" rx="4" fill="var(--card)"/>
<text class="n" x="735" y="226" text-anchor="middle">150–200MHz</text>
<text class="b" x="735" y="448" text-anchor="middle">Pentium Pro</text>

<line x1="110" y1="250" x2="870" y2="250" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="b" x="110" y="238" fill="var(--warn)">Fastest RISC then</text>

<text class="c" x="60" y="505">Months of lead, structural shift</text>
</svg>
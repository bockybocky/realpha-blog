<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A century-long line peaks above 500 basis points in the 1940s and 1950s and falls to 160 to 170 basis points in the past thirty years, below the dashed century average of 350.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">Today sits at a century low</text>
<text class="b" x="60" y="94">Y axis: basis points dragged away each year</text>
<line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="340" x2="880" y2="340" stroke="var(--line)" stroke-width="1"/>
<line x1="120" y1="240" x2="880" y2="240" stroke="var(--line)" stroke-width="1"/>
<line x1="120" y1="140" x2="880" y2="140" stroke="var(--line)" stroke-width="1"/>
<text class="b" x="74" y="445">0</text>
<text class="b" x="60" y="345">200</text>
<text class="b" x="60" y="245">400</text>
<text class="b" x="60" y="145">600</text>
<line x1="120" y1="265" x2="880" y2="265" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
<text class="g" x="690" y="256" fill="var(--dim)">Century average 350</text>
<polyline points="130,290 250,180 320,185 420,230 520,250 620,340 720,355 845,358" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="250" cy="180" r="7" fill="var(--warn)"/>
<circle cx="845" cy="358" r="7" fill="var(--accent)"/>
<text class="g" x="196" y="152" fill="var(--warn)">Above 500</text>
<text class="b" x="196" y="174">1940s–50s</text>
<text class="g" x="690" y="398" fill="var(--accent)">Past 30 yrs 160–170</text>
<text class="b" x="122" y="472">1926</text>
<text class="b" x="828" y="472">2025</text>
<text class="c" x="60" y="518">The low is the anomaly, not the norm</text>
</svg>
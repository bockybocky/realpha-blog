<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The two timelines start at nearly the same point, and their end points differ by eleven years in length.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="h" x="60" y="58">How long lab to volume takes</text>

  <line x1="150" y1="420" x2="890" y2="420" stroke="var(--line)" stroke-width="2"/>
  <g class="b">
    <text x="150" y="448">1985</text>
    <text x="520" y="448" text-anchor="middle">2005</text>
    <text x="890" y="448" text-anchor="end">2025</text>
  </g>

  <text class="g" x="150" y="150">FinFET gate</text>
  <line x1="223" y1="190" x2="625" y2="190" stroke="var(--accent)" stroke-width="5"/>
  <circle cx="223" cy="190" r="7" fill="var(--accent)"/>
  <circle cx="625" cy="190" r="7" fill="var(--accent)"/>
  <text class="b" x="223" y="216">1989 in the lab</text>
  <text class="b" x="625" y="216" text-anchor="end">2011 in volume</text>
  <text class="g" x="424" y="178" text-anchor="middle">22 years apart</text>

  <text class="g" x="150" y="290">Gate-all-around</text>
  <line x1="205" y1="330" x2="825" y2="330" stroke="var(--warn)" stroke-width="5"/>
  <circle cx="205" cy="330" r="7" fill="var(--warn)"/>
  <circle cx="825" cy="330" r="7" fill="var(--warn)"/>
  <text class="b" x="205" y="356">1988 in the lab</text>
  <text class="b" x="825" y="356" text-anchor="end">2022 in volume</text>
  <text class="g" x="515" y="318" text-anchor="middle">34 years apart</text>

  <text class="c" x="60" y="490">The hard part was never the idea, it was making it</text>
</svg>
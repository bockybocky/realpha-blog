<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="十根柱子由極矮快速拔高，倒數第二根只有最後一根的一半，前面八根幾乎貼著地面">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">倍增的最後一天</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">池塘裡的藻類，每天翻一倍</text>
<line x1="80" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="438" width="52" height="2" fill="var(--grey)"/>
<rect x="178" y="438" width="52" height="2" fill="var(--grey)"/>
<rect x="256" y="437" width="52" height="3" fill="var(--grey)"/>
<rect x="334" y="435" width="52" height="5" fill="var(--grey)"/>
<rect x="412" y="431" width="52" height="9" fill="var(--grey)"/>
<rect x="490" y="421" width="52" height="19" fill="var(--grey)"/>
<rect x="568" y="402" width="52" height="38" fill="var(--grey)"/>
<rect x="646" y="365" width="52" height="75" fill="var(--grey)"/>
<rect x="724" y="290" width="52" height="150" fill="var(--warn)"/>
<rect x="802" y="140" width="52" height="300" fill="var(--accent)"/>
<text x="672" y="352" font-size="15" fill="var(--dim)" text-anchor="middle">四分之一</text>
<text x="750" y="277" font-size="19" fill="var(--warn)" text-anchor="middle">一半</text>
<text x="828" y="127" font-size="19" fill="var(--accent)" text-anchor="middle">滿了</text>
<text x="480" y="500" font-size="22" fill="var(--ink)" text-anchor="middle">看起來還很空的那天，其實是前一天</text>
</svg>
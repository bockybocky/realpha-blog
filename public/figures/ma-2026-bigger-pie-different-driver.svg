<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根堆疊柱：2026 總高遠大於 2021，私募股權段比例由 40% 降到 30%，產業自身需求段擴大">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600}
.b{font-size:16px}
.d{font-size:15px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">盤子更大，推的人換了</text>
<rect x="240" y="230" width="190" height="96" fill="var(--grey)"/>
<rect x="240" y="326" width="190" height="144" fill="var(--accent)"/>
<rect x="560" y="90" width="190" height="114" fill="var(--grey)"/>
<rect x="560" y="204" width="190" height="266" fill="var(--accent)"/>
<text class="b" x="335" y="284" text-anchor="middle">40%</text>
<text class="b" x="655" y="154" text-anchor="middle">30%</text>
<line x1="180" y1="470" x2="820" y2="470" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="335" y="502" text-anchor="middle">2021 高峰</text>
<text class="g" x="655" y="502" text-anchor="middle">2026 史上最大</text>
<rect x="792" y="138" width="16" height="16" fill="var(--grey)"/>
<text class="d" x="818" y="152">私募股權賣出</text>
<rect x="792" y="172" width="16" height="16" fill="var(--accent)"/>
<text class="d" x="818" y="186">產業自身需求</text>
<text class="c" x="60" y="538">退的不是賣方，是需求自己長出來了</text>
</svg>
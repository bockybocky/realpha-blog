<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-label="左右對比：油氣燒掉後散失，金屬用掉後回到起點；下方一條百分比軸上有一段很寬的估計帶">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="610" fill="var(--page)"/>
  <text x="48" y="54" font-size="27" fill="var(--ink)">用掉的金屬還在地面上</text>

  <rect x="48" y="96" width="412" height="216" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="72" y="134" font-size="19" fill="var(--dim)">油氣</text>
  <rect x="72" y="164" width="110" height="56" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="127" y="199" font-size="16" fill="var(--ink)" text-anchor="middle">燒掉</text>
  <polygon points="192,186 192,202 222,194" fill="var(--dim)"/>
  <circle cx="256" cy="170" r="5" fill="var(--grey)"/>
  <circle cx="292" cy="192" r="5" fill="var(--grey)"/>
  <circle cx="264" cy="216" r="5" fill="var(--grey)"/>
  <circle cx="322" cy="168" r="5" fill="var(--grey)"/>
  <circle cx="340" cy="206" r="5" fill="var(--grey)"/>
  <circle cx="388" cy="186" r="5" fill="var(--grey)"/>
  <text x="320" y="272" font-size="16" fill="var(--dim)" text-anchor="middle">就沒了</text>

  <rect x="500" y="96" width="412" height="216" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="524" y="134" font-size="19" fill="var(--accent)">金屬</text>
  <rect x="524" y="164" width="110" height="56" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="579" y="199" font-size="16" fill="var(--ink)" text-anchor="middle">用掉</text>
  <polygon points="644,186 644,202 674,194" fill="var(--dim)"/>
  <rect x="694" y="164" width="176" height="56" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text x="782" y="199" font-size="16" fill="var(--accent)" text-anchor="middle">還在地面上</text>
  <path d="M 782 226 C 782 286, 579 286, 579 232" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="573,242 585,242 579,226" fill="var(--accent)"/>

  <text x="48" y="368" font-size="17" fill="var(--ink)">回收能取代多少新礦需求</text>
  <rect x="176" y="396" width="304" height="40" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <line x1="100" y1="416" x2="860" y2="416" stroke="var(--line)" stroke-width="2"/>
  <line x1="176" y1="396" x2="176" y2="436" stroke="var(--accent)" stroke-width="2"/>
  <line x1="480" y1="396" x2="480" y2="436" stroke="var(--accent)" stroke-width="2"/>
  <text x="328" y="386" font-size="17" fill="var(--accent)" text-anchor="middle">一成 ～ 五成</text>
  <text x="100" y="464" font-size="15" fill="var(--dim)">0%</text>
  <text x="860" y="464" font-size="15" fill="var(--dim)" text-anchor="end">100%</text>

  <text x="48" y="514" font-size="15" fill="var(--dim)">黑粉現在還是送回中國處理</text>
  <text x="48" y="566" font-size="22" fill="var(--ink)">比開新礦快，但快多少沒有答案</text>
</svg>
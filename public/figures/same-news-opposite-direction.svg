<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左右兩格三層結構，毛利落在中間層的配向下箭頭，毛利落在兩端的配向上箭頭">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">同一則新聞，兩個方向</text>
<rect x="60" y="100" width="400" height="340" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="88" y="136" font-size="19" fill="var(--ink)">毛利來自中間</text>
<rect x="100" y="158" width="220" height="56" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="193" font-size="16" fill="var(--dim)">決定要做什麼</text>
<rect x="100" y="230" width="220" height="56" rx="8" fill="var(--warn)"/>
<text x="120" y="265" font-size="16" fill="var(--page)">手工執行</text>
<rect x="100" y="302" width="220" height="56" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="337" font-size="16" fill="var(--dim)">搬不動的資產</text>
<line x1="392" y1="170" x2="392" y2="374" stroke="var(--warn)" stroke-width="4"/>
<polygon points="392,396 382,372 402,372" fill="var(--warn)"/>
<text x="260" y="478" font-size="19" fill="var(--warn)" text-anchor="middle">利潤被剪</text>
<rect x="500" y="100" width="400" height="340" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="528" y="136" font-size="19" fill="var(--ink)">毛利來自兩端</text>
<rect x="540" y="158" width="220" height="56" rx="8" fill="var(--accent)"/>
<text x="560" y="193" font-size="16" fill="var(--page)">決定要做什麼</text>
<rect x="540" y="230" width="220" height="56" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="560" y="265" font-size="16" fill="var(--dim)">手工執行</text>
<rect x="540" y="302" width="220" height="56" rx="8" fill="var(--accent)"/>
<text x="560" y="337" font-size="16" fill="var(--page)">搬不動的資產</text>
<line x1="832" y1="374" x2="832" y2="192" stroke="var(--accent)" stroke-width="4"/>
<polygon points="832,170 822,194 842,194" fill="var(--accent)"/>
<text x="700" y="478" font-size="19" fill="var(--accent)" text-anchor="middle">成本下降</text>
<text x="60" y="512" font-size="16" fill="var(--dim)">填色＝毛利來源</text>
<text x="60" y="552" font-size="22" fill="var(--ink)">先問它靠哪一層賺錢</text>
</svg>
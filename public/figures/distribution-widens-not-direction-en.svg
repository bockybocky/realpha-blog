<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bell curves on one baseline, a narrow tall gray one and a low wide blue one with longer tails, their centers on the same vertical dashed line">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="62" font-size="27" fill="var(--ink)">The distribution widens, not the direction</text>

<line x1="620" y1="105" x2="662" y2="105" stroke="var(--grey)" stroke-width="3"/>
<text x="672" y="111" font-size="16" fill="var(--dim)">Normal times</text>
<line x1="742" y1="105" x2="784" y2="105" stroke="var(--accent)" stroke-width="3"/>
<text x="794" y="111" font-size="16" fill="var(--ink)">Fourth turning</text>

<line x1="100" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="490" y1="430" x2="490" y2="196" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 6"/>
<text x="490" y="182" font-size="15" fill="var(--dim)" text-anchor="middle">Center unmoved</text>

<path d="M310,430 C390,430 430,210 490,210 C550,210 590,430 670,430" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M120,430 C290,430 330,285 490,285 C650,285 690,430 860,430" fill="none" stroke="var(--accent)" stroke-width="3.5"/>

<line x1="150" y1="430" x2="150" y2="452" stroke="var(--line)" stroke-width="2"/>
<text x="150" y="476" font-size="16" fill="var(--dim)" text-anchor="middle">Lower low</text>
<line x1="830" y1="430" x2="830" y2="452" stroke="var(--line)" stroke-width="2"/>
<text x="830" y="476" font-size="16" fill="var(--dim)" text-anchor="middle">Higher high</text>

<text x="80" y="524" font-size="22" fill="var(--ink)">Wider means adjusting size and rules, not flipping direction</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="左右兩張供需圖，左邊只縮供給導致交點沿需求線爬高，右邊先左移需求再縮供給，交點高度不變">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型：思源黑體優先 */
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">縮表的順序決定短率會不會跳</text>

<text x="130" y="112" font-size="20" font-weight="600" fill="var(--warn)">先砍供給</text>
<text x="500" y="112" font-size="20" font-weight="600" fill="var(--accent)">先降需求</text>

<line x1="130" y1="150" x2="130" y2="500" stroke="var(--line)" stroke-width="2"/>
<line x1="130" y1="500" x2="450" y2="500" stroke="var(--line)" stroke-width="2"/>
<text x="88" y="160" font-size="15" fill="var(--dim)">短率</text>
<text x="450" y="524" font-size="15" fill="var(--dim)" text-anchor="end">準備金量</text>

<path d="M 150,175 C 220,420 260,458 430,464" fill="none" stroke="var(--dim)" stroke-width="2.5"/>
<line x1="342" y1="150" x2="342" y2="500" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="209" y1="150" x2="209" y2="500" stroke="var(--warn)" stroke-width="2.5"/>
<circle cx="342" cy="455" r="6" fill="var(--grey)"/>
<circle cx="209" cy="344" r="7" fill="var(--warn)"/>
<line x1="130" y1="344" x2="209" y2="344" stroke="var(--warn)" stroke-dasharray="4 4"/>
<line x1="130" y1="455" x2="342" y2="455" stroke="var(--grey)" stroke-dasharray="4 4"/>
<path d="M 320,205 L 232,205" stroke="var(--warn)" stroke-width="2" fill="none"/>
<path d="M 224,205 L 238,200 L 238,210 Z" fill="var(--warn)"/>
<text x="238" y="322" font-size="19" font-weight="600" fill="var(--warn)">短率跳高</text>
<text x="248" y="192" font-size="15" fill="var(--dim)">供給往左</text>
<text x="360" y="440" font-size="15" fill="var(--dim)">需求沒動</text>

<line x1="500" y1="150" x2="500" y2="500" stroke="var(--line)" stroke-width="2"/>
<line x1="500" y1="500" x2="910" y2="500" stroke="var(--line)" stroke-width="2"/>
<text x="910" y="524" font-size="15" fill="var(--dim)" text-anchor="end">準備金量</text>

<path d="M 620,175 C 690,420 730,458 900,464" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M 510,175 C 580,420 620,458 790,464" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="812" y1="150" x2="812" y2="500" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="702" y1="150" x2="702" y2="500" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="812" cy="455" r="6" fill="var(--grey)"/>
<circle cx="702" cy="455" r="7" fill="var(--accent)"/>
<line x1="500" y1="455" x2="812" y2="455" stroke="var(--accent)" stroke-dasharray="4 4"/>
<path d="M 800,215 L 700,215" stroke="var(--accent)" stroke-width="2" fill="none"/>
<path d="M 692,215 L 706,210 L 706,220 Z" fill="var(--accent)"/>
<text x="712" y="205" font-size="15" fill="var(--dim)">需求先往左</text>
<text x="600" y="440" font-size="19" font-weight="600" fill="var(--accent)">短率不動</text>

<text x="60" y="567" font-size="22" font-weight="600" fill="var(--ink)">需求先讓位，供給才收得動</text>
</svg>
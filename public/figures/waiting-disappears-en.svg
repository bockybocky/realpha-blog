<svg id="fig-iltb-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Two timelines compared: the live conversation is chopped into many small segments with the person present throughout, while the background agent is one long bar with the person gone; proportion bars below show the background share rising from half to ninety percent">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
#fig-iltb-1 text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-iltb-1 .t { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-iltb-1 .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-iltb-1 .b { font-size:16px; fill:var(--dim); }
#fig-iltb-1 .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<defs><marker id="ar1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="var(--accent)"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="52">No wait, speed is cheap</text>

<text class="g" x="60" y="138">Live</text>
<rect x="200" y="112" width="55" height="40" fill="var(--accent)"/>
<rect x="267" y="112" width="55" height="40" fill="var(--card)" stroke="var(--line)"/>
<rect x="335" y="112" width="55" height="40" fill="var(--accent)"/>
<rect x="402" y="112" width="55" height="40" fill="var(--card)" stroke="var(--line)"/>
<rect x="470" y="112" width="55" height="40" fill="var(--accent)"/>
<rect x="537" y="112" width="55" height="40" fill="var(--card)" stroke="var(--line)"/>
<rect x="605" y="112" width="55" height="40" fill="var(--accent)"/>
<rect x="672" y="112" width="55" height="40" fill="var(--card)" stroke="var(--line)"/>
<line x1="200" y1="172" x2="727" y2="172" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="463" y="196" text-anchor="middle">You wait here</text>

<text class="g" x="60" y="278">Background</text>
<rect x="200" y="252" width="527" height="40" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="463" y="279" text-anchor="middle">It runs for hours</text>
<text class="b" x="200" y="326">You sleep</text>
<text class="b" x="727" y="326" text-anchor="end">Done by morning</text>

<text class="g" x="60" y="402">Share</text>
<rect x="200" y="424" width="200" height="34" fill="var(--accent)"/>
<rect x="400" y="424" width="200" height="34" fill="var(--grey)"/>
<text class="b" x="620" y="447">Year-end</text>
<rect x="200" y="498" width="360" height="34" fill="var(--accent)"/>
<rect x="560" y="498" width="40" height="34" fill="var(--grey)"/>
<text class="b" x="620" y="521">Long run</text>
<line x1="770" y1="440" x2="770" y2="512" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar1)"/>
<text class="b" x="790" y="482">Background grows</text>

<text class="c" x="60" y="576">No one waits; cost rules</text>
</svg>
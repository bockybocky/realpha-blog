<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="起伏曲線的谷底被水平虛線標為你以為的終點，曲線實際上越過谷底繼續往右上走">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .t{font-size:27px;fill:var(--ink);font-weight:700}
    .g{font-size:19px;font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">最低點被當成終點</text>
<text class="b" x="60" y="88">在車上很難認出自己正坐在雲霄飛車上</text>
<line x1="480" y1="424" x2="900" y2="424" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 8"/>
<path d="M90 210 C 190 172 250 296 330 356 C 392 412 436 434 480 424 C 566 404 620 296 720 236 C 800 188 850 178 900 168" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
<circle cx="480" cy="424" r="8" fill="var(--warn)"/>
<text class="g" x="512" y="462" fill="var(--warn)">你以為的終點</text>
<text class="g" x="760" y="212" fill="var(--accent)">其實還在路上</text>
<text class="b" x="90" y="180">上車</text>
<text class="c" x="60" y="510">痛苦是真的，終點是你自己畫的</text>
</svg>
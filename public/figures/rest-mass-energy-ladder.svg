<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="長條代表全部靜止質量能量，化學與核反應只佔最左端一道細縫，下方放大後才看得出彼此的差距">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:15px; fill:var(--dim); }
    .a { font-size:16px; fill:var(--accent); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56">一塊物質裡的能量，誰動得到</text>

  <rect x="80" y="110" width="800" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <rect x="80" y="110" width="10" height="80" fill="var(--warn)"/>
  <text class="a" x="360" y="158">整條都是靜止質量能量</text>
  <text class="s" x="82" y="212">化學與核反應在這裡</text>
  <text class="s" x="700" y="212">重力構得到整條</text>

  <line x1="90" y1="222" x2="180" y2="290" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="90" y1="222" x2="860" y2="290" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>

  <rect x="180" y="290" width="680" height="86" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="180" y="278">放大最左端</text>

  <line x1="210" y1="360" x2="830" y2="360" stroke="var(--line)" stroke-width="2"/>
  <rect x="210" y="352" width="4" height="8" fill="var(--grey)"/>
  <rect x="420" y="330" width="10" height="30" fill="var(--accent)"/>
  <rect x="620" y="316" width="10" height="44" fill="var(--accent)"/>
  <text class="s" x="212" y="404">化學鍵</text>
  <text class="s" x="425" y="404" text-anchor="middle">核分裂</text>
  <text class="s" x="625" y="404" text-anchor="middle">核融合</text>
  <text class="s" x="212" y="424">十的負十次方</text>
  <text class="s" x="425" y="424" text-anchor="middle">千分之一</text>
  <text class="s" x="625" y="424" text-anchor="middle">百分之一</text>

  <text class="c" x="60" y="486">燒得再旺，也只是在那道細縫裡分高下</text>
</svg>
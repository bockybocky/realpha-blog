<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="In the top row a long preparation bar speaks up only at the end; in the bottom row a small block of current understanding is followed by a loop of arrows going back and forth in conversation.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t h" x="60" y="62">Finish it all, or speak up first</text>

  <text class="t g" x="60" y="128">Wait for perfect</text>
  <rect x="60" y="146" width="700" height="56" fill="var(--grey)" opacity="0.35" stroke="var(--line)"/>
  <line x1="235" y1="146" x2="235" y2="202" stroke="var(--line)" stroke-width="2"/>
  <line x1="410" y1="146" x2="410" y2="202" stroke="var(--line)" stroke-width="2"/>
  <line x1="585" y1="146" x2="585" y2="202" stroke="var(--line)" stroke-width="2"/>
  <text class="t b" x="76" y="182">Where we are</text>
  <text class="t b" x="251" y="182">Goal</text>
  <text class="t b" x="426" y="182">Capital allocation</text>
  <text class="t b" x="601" y="182">Actions</text>
  <circle cx="800" cy="174" r="14" fill="var(--warn)"/>
  <text class="t b" x="760" y="228">Speak up a lifetime later</text>

  <text class="t g" x="60" y="310">Share the read now</text>
  <rect x="60" y="328" width="175" height="56" fill="var(--accent)" opacity="0.45" stroke="var(--line)"/>
  <text class="t b" x="76" y="364">Where we are</text>

  <path d="M250 342 H520" stroke="var(--accent)" stroke-width="3"/>
  <path d="M520 342 l-16 -8 v16 z" fill="var(--accent)"/>
  <path d="M520 374 H250" stroke="var(--accent)" stroke-width="3"/>
  <path d="M250 374 l16 -8 v16 z" fill="var(--accent)"/>
  <text class="t b" x="290" y="330">Try it this way</text>
  <text class="t b" x="290" y="404">Revise</text>

  <rect x="560" y="328" width="200" height="56" fill="var(--card)" stroke="var(--line)"/>
  <text class="t g" x="576" y="364">Investors</text>

  <text class="t c" x="60" y="490">Like free advisers: the rest grows out of the dialogue</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一排機器，入口在最左，真正要攔的是中間那幾台之間的移動">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">真正要關的門不是第一道</text>

<rect x="236" y="196" width="520" height="150" rx="16" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="396" y="186" font-size="20" font-weight="700" fill="var(--warn)">要掐死這一段</text>

<rect x="60" y="236" width="120" height="72" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="92" y="278" font-size="16" font-weight="700" fill="var(--ink)">入口</text>
<polygon points="196,272 220,258 220,286" fill="var(--grey)"/>

<rect x="260" y="236" width="120" height="72" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="304" y="278" font-size="16" fill="var(--dim)">機器</text>
<polygon points="396,272 420,258 420,286" fill="var(--grey)"/>

<rect x="440" y="236" width="120" height="72" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="484" y="278" font-size="16" fill="var(--dim)">機器</text>
<polygon points="576,272 600,258 600,286" fill="var(--grey)"/>

<rect x="620" y="236" width="120" height="72" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="664" y="278" font-size="16" fill="var(--dim)">機器</text>
<polygon points="756,272 780,258 780,286" fill="var(--grey)"/>

<rect x="800" y="226" width="100" height="92" rx="10" fill="var(--accent)"/>
<text x="818" y="266" font-size="16" font-weight="700" fill="var(--page)">更有</text>
<text x="818" y="292" font-size="16" font-weight="700" fill="var(--page)">價值的</text>

<text x="396" y="382" font-size="16" fill="var(--dim)">尺度：幾小時到幾分鐘</text>
<text x="60" y="462" font-size="22" font-weight="700" fill="var(--ink)">進來擋不住，往旁邊爬要擋住。</text>
</svg>
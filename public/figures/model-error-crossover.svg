<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="新舊模型的誤差曲線交叉圖，新模型初期誤差較高，交叉點之前若被淘汰就再也看不到後面的下降">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">對的模型，初期可能比較不準</text>

<line x1="120" y1="110" x2="120" y2="430" stroke="var(--line)" stroke-width="3"/>
<line x1="120" y1="430" x2="890" y2="430" stroke="var(--line)" stroke-width="3"/>
<text x="100" y="130" font-size="16" fill="var(--dim)" text-anchor="end">誤差大</text>
<text x="100" y="420" font-size="16" fill="var(--dim)" text-anchor="end">小</text>
<text x="885" y="458" font-size="16" fill="var(--dim)" text-anchor="end">時間</text>

<path d="M 140 300 C 350 292, 560 296, 870 306" fill="none" stroke="var(--grey)" stroke-width="4"/>
<path d="M 140 175 C 330 210, 430 268, 520 300 C 640 342, 760 382, 870 398" fill="none" stroke="var(--accent)" stroke-width="4"/>

<text x="150" y="278" font-size="19" fill="var(--dim)">舊模型：正圓軌道</text>
<text x="150" y="158" font-size="19" fill="var(--accent)">新模型：日心</text>

<circle cx="520" cy="300" r="7" fill="var(--ink)"/>
<text x="540" y="292" font-size="16" fill="var(--ink)">克卜勒改成橢圓</text>

<line x1="330" y1="110" x2="330" y2="450" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="330" y="480" font-size="19" fill="var(--warn)" text-anchor="middle">在這裡看「最近幾次對不對」</text>

<text x="480" y="518" font-size="22" fill="var(--ink)" text-anchor="middle">用近期成績淘汰，砍掉的常是那條會贏的線</text>
</svg>
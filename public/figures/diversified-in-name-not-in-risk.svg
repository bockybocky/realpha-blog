<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="五檔並排的持股各拉出一條線，全部向下收束到同一個上游投入的方塊上。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); font-weight:700; }
    .bdy { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="62">名字上分散，風險上不分散</text>
  <rect x="90" y="130" width="130" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1"/>
  <rect x="250" y="130" width="130" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1"/>
  <rect x="410" y="130" width="130" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1"/>
  <rect x="570" y="130" width="130" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1"/>
  <rect x="730" y="130" width="130" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1"/>
  <text class="grp" x="155" y="169" text-anchor="middle">持股</text>
  <text class="grp" x="315" y="169" text-anchor="middle">持股</text>
  <text class="grp" x="475" y="169" text-anchor="middle">持股</text>
  <text class="grp" x="635" y="169" text-anchor="middle">持股</text>
  <text class="grp" x="795" y="169" text-anchor="middle">持股</text>
  <line x1="155" y1="194" x2="440" y2="380" stroke="var(--grey)" stroke-width="3"/>
  <line x1="315" y1="194" x2="465" y2="380" stroke="var(--grey)" stroke-width="3"/>
  <line x1="475" y1="194" x2="480" y2="380" stroke="var(--grey)" stroke-width="3"/>
  <line x1="635" y1="194" x2="495" y2="380" stroke="var(--grey)" stroke-width="3"/>
  <line x1="795" y1="194" x2="520" y2="380" stroke="var(--grey)" stroke-width="3"/>
  <rect x="330" y="380" width="300" height="96" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text class="grp" x="480" y="420" text-anchor="middle">同一個上游投入</text>
  <text class="bdy" x="480" y="452" text-anchor="middle">沒有第二來源</text>
  <text class="end" x="60" y="524">分散的是名字，不是風險</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The large square is M1, and a tiny square in the corner is stablecoins, covering less than 2% of the area.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .h { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .n { font-size:16px; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text x="60" y="62" class="h">How big?</text>
<rect x="300" y="100" width="400" height="400" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="500" y="292" class="g" text-anchor="middle">M1</text>
<text x="500" y="320" class="b" text-anchor="middle">~$19 trillion</text>
<rect x="650" y="450" width="50" height="50" fill="var(--accent)"/>
<line x1="700" y1="475" x2="732" y2="475" stroke="var(--accent)" stroke-width="2"/>
<text x="740" y="470" class="g" style="fill:var(--accent)">Coin</text>
<text x="740" y="496" class="b">~$300B</text>
<text x="500" y="552" class="c" text-anchor="middle">&lt;2% of M1</text>
</svg>
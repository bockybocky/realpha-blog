<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="分散的三個組裝節點以粗線收斂到單一滑塊廠，旁邊只有一條極細的第三方旁路，形成沙漏狀的單點">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">可以換的那一層，與不能換的那一層</text>
<text x="60" y="86" font-size="16" fill="var(--dim)">硬碟供應鏈的沙漏</text>

<rect x="90" y="140" width="200" height="64" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="330" y="140" width="200" height="64" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="570" y="140" width="200" height="64" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="190" y="178" font-size="16" text-anchor="middle" fill="var(--ink)">泰國組裝</text>
<text x="430" y="178" font-size="16" text-anchor="middle" fill="var(--ink)">馬來西亞組裝 40%</text>
<text x="670" y="178" font-size="16" text-anchor="middle" fill="var(--ink)">其他組裝據點</text>
<text x="60" y="122" font-size="20" font-weight="700" fill="var(--ink)">組裝：分散得開</text>

<path d="M190 204 L380 300" stroke="var(--accent)" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
<path d="M430 204 L430 300" stroke="var(--accent)" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
<path d="M670 204 L480 300" stroke="var(--accent)" stroke-width="20" stroke-linecap="round" opacity="0.85"/>

<rect x="290" y="308" width="290" height="84" fill="var(--accent)"/>
<text x="435" y="344" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">自家滑塊廠</text>
<text x="435" y="372" font-size="16" text-anchor="middle" fill="var(--page)">只有這一座</text>
<text x="60" y="292" font-size="20" font-weight="700" fill="var(--ink)">滑塊：只有一格</text>

<rect x="700" y="316" width="180" height="68" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="790" y="346" font-size="15" text-anchor="middle" fill="var(--dim)">菲律賓第三方</text>
<text x="790" y="368" font-size="15" text-anchor="middle" fill="var(--dim)">補得到一點點</text>
<path d="M790 384 L620 466" stroke="var(--dim)" stroke-width="4" stroke-linecap="round"/>

<path d="M435 392 L435 462" stroke="var(--accent)" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
<rect x="290" y="466" width="330" height="84" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="455" y="502" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">災前產量的 75%</text>
<text x="455" y="530" font-size="16" text-anchor="middle" fill="var(--warn)">受影響</text>

<text x="480" y="582" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">分散的那一層救不了你，收斂的那一層決定你</text>
</svg>
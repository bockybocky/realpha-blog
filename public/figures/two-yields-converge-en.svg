<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="In the left panel the equity yield sits high while the real yield sinks below the zero line; in the right panel the two bars converge to almost the same height.">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .gd { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .w { font-size:19px; fill:var(--warn); }
    .a { font-size:19px; fill:var(--accent); }
  </style>
  <text class="t" x="60" y="66">Two yields converge</text>
  <line x1="70" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="70" y="392">0</text>
  <line x1="480" y1="110" x2="480" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="gd" x="150" y="140">TINA begins</text>
  <rect x="150" y="184" width="96" height="216" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="150" y="174">4.5%</text>
  <text class="b" x="150" y="424">Eq.</text>
  <rect x="300" y="400" width="96" height="56" fill="var(--grey)"/>
  <text class="b" x="300" y="478">Real: neg.</text>
  <text class="gd" x="620" y="140">Now</text>
  <line x1="580" y1="270" x2="880" y2="270" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="610" y="268" width="96" height="132" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="610" y="256">2.75%</text>
  <text class="b" x="610" y="424">Eq.</text>
  <rect x="750" y="273" width="96" height="127" fill="var(--accent)"/>
  <text class="a" x="750" y="248">2.65%</text>
  <text class="b" x="750" y="424">Real</text>
  <text class="c" x="60" y="518">Real now vs real</text>
</svg>
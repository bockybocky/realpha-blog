<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="In the left panel margin spikes and returns to its starting level; in the right panel margin steps up and stays high.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">One falls back to start, one stays on the step</text>
<rect x="80" y="96" width="390" height="350" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="500" y="96" width="390" height="350" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="104" y="140" font-size="20" fill="var(--warn)">Shortage pricing</text>
<text x="524" y="140" font-size="20" fill="var(--accent)">Value step-up</text>
<line x1="104" y1="400" x2="450" y2="400" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="524" y1="400" x2="870" y2="400" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="104" y="424" font-size="15" fill="var(--dim)">Start</text>
<text x="524" y="424" font-size="15" fill="var(--dim)">Start</text>
<path d="M110 400 L180 398 L250 190 L300 200 L360 330 L440 398" fill="none" stroke="var(--warn)" stroke-width="3"/>
<path d="M530 400 L600 398 L670 250 L740 240 L870 244" fill="none" stroke="var(--accent)" stroke-width="3"/>
<line x1="320" y1="170" x2="320" y2="400" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 6"/>
<text x="258" y="166" font-size="15" fill="var(--dim)">Cycle turns</text>
<line x1="760" y1="220" x2="760" y2="400" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 6"/>
<text x="700" y="210" font-size="15" fill="var(--dim)">Cycle turns</text>
<text x="130" y="500" font-size="22" fill="var(--ink)">Which one you hold decides how a pullback feels</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="小方框與大方框對比，晶片都頂滿邊界，說明光罩上限放大">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="70" y="70">光罩放大，晶片才長得下</text>
<text class="t g" x="90" y="140">現在的上限</text>
<rect x="90" y="160" width="290" height="230" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="170" width="270" height="210" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="t b" x="90" y="425">晶片已經頂到框線</text>
<path d="M400 275 L495 275" stroke="var(--accent)" stroke-width="4"/>
<path d="M495 275 l-16 -9 v18 z" fill="var(--accent)"/>
<text class="t g" x="530" y="120">放大之後</text>
<rect x="530" y="140" width="370" height="290" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="542" y="152" width="346" height="266" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="t b" x="530" y="465">面積約兩倍</text>
<text class="t c" x="70" y="520">框放寬一點，底下是整批機台改裝</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The upper gap in the spending bar is filled by water drawn from the investment account pool, whose level falls.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
 svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
       --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
 @media (prefers-color-scheme: dark) {
   svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
         --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
 }
 text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
 .h{font-size:27px;font-weight:700}
 .g{font-size:19px;fill:var(--dim)}
 .b{font-size:16px;fill:var(--dim)}
 .c{font-size:22px;font-weight:700}
</style>
<text class="h" x="60" y="56">Spending holds up — but paid for how?</text>
<rect x="120" y="140" width="190" height="300" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<rect x="120" y="260" width="190" height="180" fill="var(--accent)"/>
<text class="g" x="120" y="124">Consumer spending</text>
<text class="b" x="134" y="360" fill="var(--page)">Real income</text>
<text class="b" x="134" y="200" fill="var(--warn)">The gap</text>
<rect x="600" y="180" width="250" height="260" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="600" y="330" width="250" height="110" rx="8" fill="var(--grey)"/>
<line x1="600" y1="230" x2="850" y2="230" stroke="var(--dim)" stroke-width="2" stroke-dasharray="8 6"/>
<text class="g" x="600" y="164">Brokerage and 401k</text>
<text class="b" x="612" y="220">Original level</text>
<line x1="590" y1="200" x2="340" y2="200" stroke="var(--warn)" stroke-width="4"/>
<polygon points="340,200 360,190 360,210" fill="var(--warn)"/>
<text class="b" x="390" y="182" fill="var(--warn)">Withdrawals</text>
<text class="c" x="60" y="512">Savings at a generational low: the bull case is the bull market</text>
</svg>
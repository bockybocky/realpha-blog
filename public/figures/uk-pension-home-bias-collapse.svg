<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="英國退休金配置本國股票的比重從五成的高柱掉到百分之五的矮柱">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
 svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
       --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
 @media (prefers-color-scheme: dark) {
   svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
         --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
 }
 text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
 .h{font-size:27px;font-weight:700}
 .g{font-size:19px;fill:var(--dim)}
 .b{font-size:16px;fill:var(--dim)}
 .c{font-size:22px;font-weight:700}
</style>
<text class="h" x="60" y="56">一個二十年沒停手的賣方</text>
<text class="g" x="60" y="100">英國確定給付退休金 放在本國股票的比重</text>
<line x1="60" y1="410" x2="900" y2="410" stroke="var(--line)" stroke-width="3"/>
<rect x="150" y="160" width="160" height="250" fill="var(--grey)"/>
<text class="g" x="150" y="146">50%</text>
<text class="b" x="150" y="446">二十年前</text>
<rect x="520" y="385" width="160" height="25" fill="var(--warn)"/>
<text class="g" x="520" y="370">5%</text>
<text class="b" x="520" y="446">現在</text>
<text class="b" x="520" y="476">賣法：留著國際股票，拿本國股票調比重</text>
<text class="c" x="60" y="506">結果：英國在全球市值裡只剩 2%</text>
</svg>
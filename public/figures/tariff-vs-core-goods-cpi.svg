<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條反向的線張成剪刀口：關稅稅率大幅往上，核心商品 CPI 年增率卻往下。">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .n { font-size:16px; font-weight:700; }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t h" x="60" y="66">已經試過的那一記</text>
<line x1="140" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="t b" x="140" y="470">一年前</text>
<text class="t b" x="840" y="470">現在</text>
<polyline points="170,405 430,372 640,252 830,172" fill="none" stroke="var(--warn)" stroke-width="5"/>
<circle cx="830" cy="172" r="7" fill="var(--warn)"/>
<text class="t g" x="600" y="140" fill="var(--warn)">有效關稅稅率</text>
<text class="t b" x="600" y="164">1930 年代以來最大升幅</text>
<polyline points="170,236 430,276 640,324 830,358" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="170" cy="236" r="7" fill="var(--accent)"/>
<circle cx="830" cy="358" r="7" fill="var(--accent)"/>
<text class="t g" x="170" y="208" fill="var(--accent)">核心商品 CPI 年增率</text>
<text class="t n" x="170" y="306" fill="var(--accent)">1.5%</text>
<text class="t n" x="700" y="396" fill="var(--accent)">0.7% 以下</text>
<text class="t c" x="60" y="512">最該漲價的那一格，反而減速</text>
</svg>
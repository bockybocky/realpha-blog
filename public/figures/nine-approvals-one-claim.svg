<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="九根等高的矮柱，上方一條遠高於柱頂的門檻虛線，中間留著明顯空白">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="70">數量一直加，高度沒動</text>
<line x1="80" y1="185" x2="900" y2="185" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8 6"/>
<text class="g" x="80" y="165" fill="var(--accent)">能改變醫生行為的宣稱強度</text>
<line x1="80" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="120" y="345" width="50" height="55" rx="4" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="190" y="345" width="50" height="55" rx="4" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="260" y="345" width="50" height="55" rx="4" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="330" y="345" width="50" height="55" rx="4" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="400" y="345" width="50" height="55" rx="4" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="470" y="345" width="50" height="55" rx="4" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="540" y="345" width="50" height="55" rx="4" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="610" y="345" width="50" height="55" rx="4" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="680" y="345" width="50" height="55" rx="4" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="425" y="430" text-anchor="middle">十年，九張核准</text>
<line x1="800" y1="340" x2="800" y2="195" stroke="var(--grey)" stroke-width="2"/>
<path d="M800 188 l-7 14 h14 z" fill="var(--grey)"/>
<text class="b" x="800" y="330" text-anchor="middle">空白</text>
<text class="c" x="60" y="498">里程碑會增加，曲線不會</text>
</svg>
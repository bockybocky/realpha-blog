<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three line panels: two step down as the lights worsen, the judgment one stays flat">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .n { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="40" y="56">When lights worsen, who steps down and who doesn't</text>

<rect x="40" y="110" width="280" height="330" rx="10" fill="var(--card)"/>
<rect x="340" y="110" width="280" height="330" rx="10" fill="var(--card)"/>
<rect x="640" y="110" width="280" height="330" rx="10" fill="var(--card)"/>

<text class="g" x="180" y="150" text-anchor="middle">Mechanical</text>
<text class="g" x="480" y="150" text-anchor="middle">Engineering</text>
<text class="g" x="780" y="150" text-anchor="middle">Judgment</text>

<polyline points="75,200 180,200 285,280" fill="none" stroke="var(--grey)" stroke-width="4"/>
<circle cx="75" cy="200" r="6" fill="var(--grey)"/>
<circle cx="180" cy="200" r="6" fill="var(--grey)"/>
<circle cx="285" cy="280" r="6" fill="var(--grey)"/>
<text class="n" x="75" y="188" text-anchor="middle">agy</text>
<text class="n" x="285" y="308" text-anchor="middle">Whoever has more left</text>

<polyline points="375,200 480,280 585,360" fill="none" stroke="var(--grey)" stroke-width="4"/>
<circle cx="375" cy="200" r="6" fill="var(--grey)"/>
<circle cx="480" cy="280" r="6" fill="var(--grey)"/>
<circle cx="585" cy="360" r="6" fill="var(--grey)"/>
<text class="n" x="375" y="188" text-anchor="middle">Codex</text>
<text class="n" x="480" y="308" text-anchor="middle">Grok</text>
<text class="n" x="585" y="388" text-anchor="middle">Opus subagent</text>

<polyline points="675,200 780,200 885,200" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="675" cy="200" r="6" fill="var(--accent)"/>
<circle cx="780" cy="200" r="6" fill="var(--accent)"/>
<circle cx="885" cy="200" r="6" fill="var(--accent)"/>
<text class="n" x="780" y="188" text-anchor="middle">Fable</text>
<text class="n" x="780" y="308" text-anchor="middle">Same hands, only what's necessary</text>

<text class="s" x="75" y="424" text-anchor="middle">Green</text>
<text class="s" x="180" y="424" text-anchor="middle">Yellow</text>
<text class="s" x="285" y="424" text-anchor="middle">Red</text>
<text class="s" x="375" y="424" text-anchor="middle">Green</text>
<text class="s" x="480" y="424" text-anchor="middle">Yellow</text>
<text class="s" x="585" y="424" text-anchor="middle">Red</text>
<text class="s" x="675" y="424" text-anchor="middle">Green</text>
<text class="s" x="780" y="424" text-anchor="middle">Yellow</text>
<text class="s" x="885" y="424" text-anchor="middle">Red</text>

<text class="c" x="40" y="500">When quota is tight, cut the one-off work first</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two venues of the same size, sparse on the left and crowded on the right, with people flowing toward the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">Same week, 50 miles apart — you can only pick one</text>

<rect x="48" y="120" width="330" height="250" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="582" y="120" width="330" height="250" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

<circle cx="110" cy="180" r="9" fill="var(--grey)"/>
<circle cx="200" cy="230" r="9" fill="var(--grey)"/>
<circle cx="305" cy="190" r="9" fill="var(--grey)"/>
<circle cx="150" cy="310" r="9" fill="var(--grey)"/>
<circle cx="280" cy="300" r="9" fill="var(--grey)"/>
<circle cx="225" cy="150" r="9" fill="var(--grey)"/>

<g fill="var(--accent)">
<circle cx="615" cy="150" r="9"/><circle cx="650" cy="150" r="9"/><circle cx="685" cy="150" r="9"/><circle cx="720" cy="150" r="9"/><circle cx="755" cy="150" r="9"/><circle cx="790" cy="150" r="9"/><circle cx="825" cy="150" r="9"/><circle cx="860" cy="150" r="9"/>
<circle cx="615" cy="190" r="9"/><circle cx="650" cy="190" r="9"/><circle cx="685" cy="190" r="9"/><circle cx="720" cy="190" r="9"/><circle cx="755" cy="190" r="9"/><circle cx="790" cy="190" r="9"/><circle cx="825" cy="190" r="9"/><circle cx="860" cy="190" r="9"/>
<circle cx="615" cy="230" r="9"/><circle cx="650" cy="230" r="9"/><circle cx="685" cy="230" r="9"/><circle cx="720" cy="230" r="9"/><circle cx="755" cy="230" r="9"/><circle cx="790" cy="230" r="9"/><circle cx="825" cy="230" r="9"/><circle cx="860" cy="230" r="9"/>
<circle cx="615" cy="270" r="9"/><circle cx="650" cy="270" r="9"/><circle cx="685" cy="270" r="9"/><circle cx="720" cy="270" r="9"/><circle cx="755" cy="270" r="9"/><circle cx="790" cy="270" r="9"/><circle cx="825" cy="270" r="9"/><circle cx="860" cy="270" r="9"/>
<circle cx="615" cy="310" r="9"/><circle cx="650" cy="310" r="9"/><circle cx="685" cy="310" r="9"/><circle cx="720" cy="310" r="9"/><circle cx="755" cy="310" r="9"/><circle cx="790" cy="310" r="9"/><circle cx="825" cy="310" r="9"/><circle cx="860" cy="310" r="9"/>
<circle cx="632" cy="345" r="9"/><circle cx="667" cy="345" r="9"/><circle cx="702" cy="345" r="9"/><circle cx="737" cy="345" r="9"/><circle cx="772" cy="345" r="9"/><circle cx="807" cy="345" r="9"/><circle cx="842" cy="345" r="9"/>
</g>

<text class="t" x="213" y="402" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Semicon West | San Francisco</text>
<text class="t" x="747" y="402" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">OCP | San Jose</text>

<line x1="398" y1="245" x2="552" y2="245" stroke="var(--dim)" stroke-width="2.5"/>
<path d="M 552 245 L 538 237 L 538 253 Z" fill="var(--dim)"/>
<text class="t" x="475" y="225" font-size="16" fill="var(--ink)" text-anchor="middle">50 miles</text>
<text class="t" x="475" y="278" font-size="16" fill="var(--dim)" text-anchor="middle">No bullet train</text>

<text class="t" x="48" y="498" font-size="22" font-weight="700" fill="var(--ink)">The quiet hall lost the date, not the topic</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four revenue growth bars run right, with downward arrows for the top three and an upward arrow for the one below.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="60" y="56" font-size="27" fill="var(--ink)">Four sets of results, two tempers</text>

  <text x="60" y="104" font-size="16" fill="var(--dim)">Company</text>
  <text x="200" y="104" font-size="16" fill="var(--dim)">Revenue growth</text>
  <text x="700" y="104" font-size="16" fill="var(--dim)">What the market paid</text>

  <text x="60" y="144" font-size="19" fill="var(--ink)">The cracked group</text>

  <text x="60" y="192" font-size="16" fill="var(--ink)">LDOS</text>
  <rect x="200" y="172" width="42" height="22" rx="3" fill="var(--accent)"/>
  <text x="254" y="190" font-size="16" fill="var(--dim)">+7%</text>
  <path d="M720 172 V194" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="712,192 728,192 720,206" fill="var(--warn)"/>
  <text x="748" y="192" font-size="16" fill="var(--dim)">-30% off the high</text>

  <text x="60" y="242" font-size="16" fill="var(--ink)">CDNS</text>
  <rect x="200" y="222" width="144" height="22" rx="3" fill="var(--accent)"/>
  <text x="356" y="240" font-size="16" fill="var(--dim)">+24%</text>
  <path d="M720 222 V244" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="712,242 728,242 720,256" fill="var(--warn)"/>
  <text x="748" y="242" font-size="16" fill="var(--dim)">Multiple compressed</text>

  <text x="60" y="292" font-size="16" fill="var(--ink)">ADBE</text>
  <rect x="200" y="272" width="76" height="22" rx="3" fill="var(--accent)"/>
  <text x="288" y="290" font-size="16" fill="var(--dim)">+13%</text>
  <path d="M720 272 V294" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="712,292 728,292 720,306" fill="var(--warn)"/>
  <text x="748" y="292" font-size="16" fill="var(--dim)">-30% in a year</text>

  <line x1="60" y1="336" x2="900" y2="336" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>

  <text x="60" y="376" font-size="19" fill="var(--ink)">The clear group</text>

  <text x="60" y="424" font-size="16" fill="var(--ink)">SE</text>
  <rect x="200" y="404" width="288" height="22" rx="3" fill="var(--accent)"/>
  <text x="500" y="422" font-size="16" fill="var(--dim)">+48%</text>
  <path d="M720 438 V416" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="712,418 728,418 720,404" fill="var(--accent)"/>
  <text x="748" y="424" font-size="16" fill="var(--dim)">Near a six-month high</text>

  <text x="60" y="514" font-size="22" fill="var(--ink)">Not ignoring numbers, just using a different ruler</text>
</svg>
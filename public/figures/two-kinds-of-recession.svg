<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="供給衝擊下股債同時下跌，需求衰退下股票跌而債券漲">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="40" y="58" font-size="27" font-weight="700" fill="var(--ink)">同一張債券，兩種世界兩種身分</text>

<rect x="40" y="96" width="420" height="340" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="96" width="420" height="340" rx="10" fill="var(--card)" stroke="var(--line)"/>

<text class="t" x="68" y="134" font-size="20" font-weight="700" fill="var(--warn)">供給衝擊・停滯性通膨</text>
<line x1="68" y1="200" x2="430" y2="200" stroke="var(--line)" stroke-width="2"/>
<rect x="130" y="200" width="60" height="120" fill="var(--grey)"/>
<rect x="290" y="200" width="60" height="120" fill="var(--warn)"/>
<text class="t" x="138" y="348" font-size="16" fill="var(--ink)">股票</text>
<text class="t" x="298" y="348" font-size="16" fill="var(--ink)">債券</text>
<text class="t" x="68" y="398" font-size="16" fill="var(--ink)">通膨啃掉本金・衰退打擊股票</text>
<text class="t" x="68" y="422" font-size="16" font-weight="700" fill="var(--warn)">公債＝風險資產</text>

<text class="t" x="528" y="134" font-size="20" font-weight="700" fill="var(--accent)">需求衰退・低通膨</text>
<line x1="528" y1="260" x2="890" y2="260" stroke="var(--line)" stroke-width="2"/>
<rect x="590" y="260" width="60" height="100" fill="var(--grey)"/>
<rect x="750" y="170" width="60" height="90" fill="var(--accent)"/>
<text class="t" x="598" y="388" font-size="16" fill="var(--ink)">股票</text>
<text class="t" x="758" y="388" font-size="16" fill="var(--ink)">債券</text>
<text class="t" x="528" y="414" font-size="16" font-weight="700" fill="var(--accent)">公債＝避險工具</text>

<text class="t" x="40" y="498" font-size="22" font-weight="700" fill="var(--ink)">決定身分的是衝擊的性質，不是那張紙</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一塊寬板平衡在一個非常窄的支點上，旁邊有幾個來自協議之外的箭頭在推它">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">很不穩定的穩定：板子很寬，支點很窄</text>
  <rect x="140" y="188" width="680" height="34" fill="var(--accent)"/>
  <text x="420" y="176" font-size="20" fill="var(--accent)">檯面上的穩定</text>
  <polygon points="480,230 440,320 520,320" fill="var(--grey)"/>
  <text x="396" y="352" font-size="16" fill="var(--dim)">稀土出口與許可</text>
  <text x="430" y="378" font-size="16" fill="var(--dim)">很窄的協議</text>
  <line x1="190" y1="330" x2="190" y2="246" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="182,246 190,224 198,246" fill="var(--warn)"/>
  <text x="104" y="362" font-size="16" fill="var(--warn)">硫酸出口限制</text>
  <line x1="780" y1="330" x2="780" y2="246" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="772,246 780,224 788,246" fill="var(--warn)"/>
  <text x="700" y="362" font-size="16" fill="var(--warn)">扣住人才護照</text>
  <text x="60" y="440" font-size="16" fill="var(--dim)">協議之外的動作，不會因為協議談成而停下來</text>
  <text x="60" y="492" font-size="22" fill="var(--ink)">在一個小點上談成，整個體系各自啟動。</text>
</svg>
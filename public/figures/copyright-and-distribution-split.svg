<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="版權在一邊、發行權在另一邊，金流必須繞出去再回到同一個人手上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="80" y="68">一刀切開：版權在這邊，發行權在那邊</text>
<rect x="80" y="120" width="330" height="110" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="108" y="164">版權本體</text>
<text class="b" x="108" y="198">擁有這齣戲</text>
<rect x="550" y="120" width="330" height="110" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="578" y="164" fill="var(--warn)">發行權</text>
<text class="b" x="578" y="198">誰能拿它去賣</text>
<path d="M410 175 L538 175" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 8"/>
<text class="b" x="416" y="158">分屬兩家</text>
<path d="M245 230 L245 300 L700 300 L700 380 L245 380 L245 262" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M245 262 l-12 18 l24 0 z" fill="var(--accent)"/>
<text class="b" x="300" y="290">每一輪都得先走出去</text>
<text class="g" x="300" y="412" fill="var(--accent)">向自己出價</text>
<text class="b" x="470" y="412">四年將近 2 億</text>
<text class="c" x="80" y="492">持有不等於能自己處分，中間還卡著一道權利</text>
</svg>
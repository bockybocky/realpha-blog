<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bumps on a timeline; the guardrail covers only the first, and the second rises up beside it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="80" y="78">The guardrail covers the last problem</text>

  <line x1="80" y1="340" x2="880" y2="340" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="80" y="372">Last summer</text>
  <text class="b" x="640" y="372">This summer</text>

  <path d="M200 340 C230 230 320 230 350 340 Z" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text class="g" x="275" y="300" text-anchor="middle">Old problem</text>
  <rect x="190" y="200" width="170" height="26" rx="6" fill="var(--accent)"/>
  <text class="b" x="275" y="186" text-anchor="middle" fill="var(--accent)">The guardrail added</text>

  <path d="M680 340 C710 190 800 190 830 340 Z" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text class="g" x="755" y="300" text-anchor="middle">New problem</text>
  <text class="b" x="755" y="176" text-anchor="middle" fill="var(--warn)">Nothing covers this part</text>

  <path d="M370 250 L660 250" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="b" x="515" y="232" text-anchor="middle">Shipped in between: our most aligned model</text>

  <text class="c" x="80" y="440">Everyone fights the last war</text>
  <text class="b" x="80" y="478">The patch fits precisely — the shape of the last hole</text>
</svg>
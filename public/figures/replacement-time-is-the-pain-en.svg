<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The axis runs from two weeks to years with three kinds of parts placed along it, and the pain bars below stretch in step with replacement time.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">How long it takes to replace him</text>
<text x="60" y="86" font-size="16" fill="var(--dim)">Replacement time is the length of the pain after the break</text>

<line x1="120" y1="150" x2="900" y2="150" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="132" font-size="15" fill="var(--dim)">Two weeks</text>
<text x="380" y="132" font-size="15" text-anchor="middle" fill="var(--dim)">Months</text>
<text x="900" y="132" font-size="15" text-anchor="end" fill="var(--dim)">Years</text>

<text x="120" y="212" font-size="16" fill="var(--ink)">Standard parts</text>
<rect x="120" y="226" width="110" height="44" fill="var(--grey)"/>
<text x="248" y="254" font-size="15" fill="var(--dim)">A break is only news</text>

<text x="120" y="312" font-size="16" fill="var(--ink)">Spindle motors</text>
<rect x="120" y="326" width="330" height="44" fill="var(--accent)" opacity="0.55"/>
<text x="468" y="354" font-size="15" fill="var(--dim)">Fast-tracking a new supplier still works</text>

<text x="120" y="412" font-size="16" fill="var(--ink)">Sliders</text>
<rect x="120" y="426" width="760" height="44" fill="var(--warn)"/>
<text x="500" y="454" font-size="16" font-weight="700" text-anchor="middle" fill="var(--page)">The line is your own, and almost nobody else makes them</text>

<text x="480" y="504" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">Find the part you cannot name a second maker for</text>
</svg>
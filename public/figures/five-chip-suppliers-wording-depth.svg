<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="四階遞降的台階，顯示申請書描述各家晶片供應商的用語深淺，Google 那階是空的">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">同一份文件，四種親疏</text>
<text x="60" y="94" font-size="15" fill="var(--dim)">台階越高，用語越深</text>

<rect x="60" y="130" width="560" height="74" fill="var(--accent)"/>
<text x="80" y="162" font-size="20" fill="var(--page)">Nvidia</text>
<text x="80" y="188" font-size="15" fill="var(--page)">設計與工程合作、最佳化未來硬體</text>

<rect x="60" y="214" width="470" height="74" fill="var(--accent)" opacity="0.72"/>
<text x="80" y="246" font-size="20" fill="var(--page)">AMD</text>
<text x="80" y="272" font-size="15" fill="var(--page)">多年期工程合作</text>

<rect x="60" y="298" width="380" height="74" fill="var(--accent)" opacity="0.45"/>
<text x="80" y="330" font-size="20" fill="var(--ink)">Trainium</text>
<text x="80" y="356" font-size="15" fill="var(--ink)">有能力影響未來世代</text>

<rect x="60" y="382" width="200" height="74" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="80" y="414" font-size="20" fill="var(--dim)">Google</text>
<text x="80" y="440" font-size="15" fill="var(--dim)">沒有寫</text>

<line x1="680" y1="130" x2="680" y2="456" stroke="var(--line)" stroke-width="2"/>
<text x="706" y="150" font-size="19" fill="var(--dim)">第五家</text>
<text x="706" y="180" font-size="16" fill="var(--ink)">Broadcom</text>
<text x="706" y="206" font-size="15" fill="var(--dim)">一起做自研晶片</text>
<text x="706" y="232" font-size="15" fill="var(--dim)">節目未引用語</text>

<text x="60" y="504" font-size="22" fill="var(--ink)">語言模糊，但愛給得不一樣看得出來</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A personal three-layer funnel: the thing you want more of traced up two layers, ending at the three quiet mornings a week, with only three of seven boxes lit beside it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="60">Trace your own work up three layers</text>

  <rect x="100" y="430" width="500" height="62" fill="var(--grey)"/>
  <text class="g" x="350" y="469" text-anchor="middle">The thing you'd double</text>

  <rect x="160" y="340" width="380" height="62" fill="var(--grey)"/>
  <text class="g" x="350" y="379" text-anchor="middle">The step it always needs</text>

  <rect x="230" y="250" width="240" height="62" fill="var(--warn)"/>
  <text class="g" x="350" y="289" text-anchor="middle">What won't change in a week</text>

  <path d="M 70 430 L 70 260" stroke="var(--dim)" stroke-width="3"/>
  <path d="M 70 260 L 62 280 L 78 280 Z" fill="var(--dim)"/>

  <text class="g" x="620" y="200">e.g. quiet mornings</text>
  <rect x="620" y="230" width="44" height="60" fill="var(--warn)"/>
  <rect x="672" y="230" width="44" height="60" fill="var(--warn)"/>
  <rect x="724" y="230" width="44" height="60" fill="var(--warn)"/>
  <rect x="776" y="230" width="44" height="60" fill="none" stroke="var(--line)" stroke-width="3"/>
  <rect x="828" y="230" width="44" height="60" fill="none" stroke="var(--line)" stroke-width="3"/>
  <rect x="620" y="300" width="44" height="60" fill="none" stroke="var(--line)" stroke-width="3"/>
  <rect x="672" y="300" width="44" height="60" fill="none" stroke="var(--line)" stroke-width="3"/>
  <text class="d" x="620" y="392">3 of 7 days a week</text>

  <text class="c" x="60" y="528">That last box is your ceiling</text>
</svg>
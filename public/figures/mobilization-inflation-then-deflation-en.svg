<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A humped curve runs above the zero line in its first half and below it in the second, labeled inflation early and deflation late.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="68">One mobilization, two price regimes</text>

<line x1="90" y1="300" x2="890" y2="300" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="90" y="286">Zero line</text>

<path d="M110 300 C 250 120, 400 110, 520 240 C 610 340, 700 420, 880 440" fill="none" stroke="var(--accent)" stroke-width="5"/>

<text class="g" x="250" y="188" text-anchor="middle">Inflation</text>
<text class="b" x="250" y="214" text-anchor="middle">Duplicate builds, bottlenecks everywhere</text>

<text class="g" x="730" y="392" text-anchor="middle">Deflation</text>
<text class="b" x="730" y="418" text-anchor="middle">Overbuilt, arms control lands</text>

<text class="b" x="152" y="336">Early mobilization</text>
<text class="b" x="800" y="336">Tail end</text>

<text class="c" x="480" y="500" text-anchor="middle">Today's heat and tomorrow's chill are one curve</text>
</svg>
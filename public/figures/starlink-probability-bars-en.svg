<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three probability bars of increasing length sit beside one full-length bar marking certainty.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .n { font-size:22px; fill:var(--ink); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="72">Flyers see odds</text>

  <text class="g" x="60" y="146">A type, now</text>
  <rect x="300" y="126" width="560" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="300" y="126" width="140" height="34" rx="6" fill="var(--accent)"/>
  <text class="n" x="456" y="152">25%</text>

  <text class="g" x="60" y="226">Christmas</text>
  <rect x="300" y="206" width="560" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="300" y="206" width="202" height="34" rx="6" fill="var(--accent)"/>
  <text class="n" x="518" y="232">36%</text>

  <text class="g" x="60" y="306">Fleet, today</text>
  <rect x="300" y="286" width="560" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="300" y="286" width="269" height="34" rx="6" fill="var(--accent)"/>
  <text class="n" x="585" y="312">48%</text>

  <line x1="300" y1="356" x2="860" y2="356" stroke="var(--line)" stroke-width="1"/>

  <text class="g" x="60" y="416">Tracked</text>
  <rect x="300" y="396" width="560" height="34" rx="6" fill="var(--warn)"/>
  <text class="n" x="580" y="421" text-anchor="middle" fill="var(--page)">Sure</text>

  <text class="d" x="300" y="470">Top three rebook; last picks time</text>
  <text class="c" x="60" y="506">Only full bars move us</text>
</svg>
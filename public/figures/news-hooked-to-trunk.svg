<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條粗主幹上掛著四則新聞，右側三個灰色虛線方塊沒有任何連線，浮在主幹之外">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="66">每一條新聞先掛回主幹</text>
<text class="b" x="82" y="148">掛得上＝結構</text>
<line x1="145" y1="234" x2="145" y2="300" stroke="var(--line)" stroke-width="2"/>
<line x1="289" y1="234" x2="289" y2="300" stroke="var(--line)" stroke-width="2"/>
<line x1="433" y1="234" x2="433" y2="300" stroke="var(--line)" stroke-width="2"/>
<line x1="577" y1="234" x2="577" y2="300" stroke="var(--line)" stroke-width="2"/>
<rect x="82" y="170" width="126" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="226" y="170" width="126" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="370" y="170" width="126" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="514" y="170" width="126" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="145" y="209" text-anchor="middle">伊朗期限</text>
<text class="g" x="289" y="209" text-anchor="middle">柴油禁令</text>
<text class="g" x="433" y="209" text-anchor="middle">北韓彈藥</text>
<text class="g" x="577" y="209" text-anchor="middle">門羅宣言</text>
<rect x="80" y="300" width="600" height="30" rx="15" fill="var(--accent)"/>
<text class="g" x="380" y="322" text-anchor="middle" style="fill:var(--page)">主幹：美中冷戰</text>
<text class="b" x="760" y="148">掛不上＝雜音</text>
<rect x="760" y="170" width="150" height="46" rx="10" fill="none" stroke="var(--grey)" stroke-dasharray="5 5"/>
<rect x="760" y="230" width="150" height="46" rx="10" fill="none" stroke="var(--grey)" stroke-dasharray="5 5"/>
<rect x="760" y="290" width="150" height="46" rx="10" fill="none" stroke="var(--grey)" stroke-dasharray="5 5"/>
<text class="b" x="835" y="199" text-anchor="middle">地名</text>
<text class="b" x="835" y="259" text-anchor="middle">標題</text>
<text class="b" x="835" y="319" text-anchor="middle">當天報價</text>
<text class="c" x="60" y="430">先問掛不掛得上，再問重不重要</text>
<text class="b" x="60" y="468">一直出現卻掛不上，該檢查的是主幹</text>
</svg>
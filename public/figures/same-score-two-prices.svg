<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩張完全相同的成績卡，下方價格柱左矮右高，中間以虛線分隔。">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">同一份成績，兩種價</text>
<path d="M480 100 L480 480" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6" fill="none"/>
<text x="480" y="90" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">ChatGPT 上線</text>

<text x="150" y="130" font-size="19" fill="var(--dim)">之前</text>
<rect x="150" y="146" width="200" height="96" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<path d="M170 176 L300 176 M170 198 L300 198 M170 220 L262 220" stroke="var(--grey)" stroke-width="4"/>
<path d="M322 166 L330 184 L349 186 L335 199 L339 218 L322 208 L305 218 L309 199 L295 186 L314 184 z" fill="var(--accent)"/>
<text x="150" y="268" font-size="16" fill="var(--dim)">同一份評測</text>
<rect x="215" y="400" width="70" height="70" fill="var(--grey)"/>
<text x="250" y="390" font-size="16" fill="var(--dim)" text-anchor="middle">估值砍半</text>

<text x="610" y="130" font-size="19" fill="var(--dim)">之後</text>
<rect x="610" y="146" width="200" height="96" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<path d="M630 176 L760 176 M630 198 L760 198 M630 220 L722 220" stroke="var(--grey)" stroke-width="4"/>
<path d="M782 166 L790 184 L809 186 L795 199 L799 218 L782 208 L765 218 L769 199 L755 186 L774 184 z" fill="var(--accent)"/>
<text x="610" y="268" font-size="16" fill="var(--dim)">同一份評測</text>
<rect x="675" y="250" width="70" height="220" fill="var(--accent)"/>
<text x="710" y="240" font-size="16" fill="var(--accent)" text-anchor="middle">爭著要</text>

<path d="M100 470 L880 470" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="516" font-size="22" font-weight="700" fill="var(--ink)">上面那張卡沒動，動的是下面那根柱子</text>
</g>
</svg>
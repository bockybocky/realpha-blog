<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一長一短兩條橫條並列，長的代表五年路線圖，短的代表單日報價">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<text x="60" y="72" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="27" fill="var(--ink)">同一個螢幕上的兩把尺</text>

<text x="60" y="150" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">技術路線圖</text>
<rect x="60" y="170" width="840" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<line x1="228" y1="170" x2="228" y2="204" stroke="var(--line)"/>
<line x1="396" y1="170" x2="396" y2="204" stroke="var(--line)"/>
<line x1="564" y1="170" x2="564" y2="204" stroke="var(--line)"/>
<line x1="732" y1="170" x2="732" y2="204" stroke="var(--line)"/>
<text x="60" y="230" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">今年</text>
<text x="876" y="230" text-anchor="end" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">五年後</text>

<text x="60" y="320" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">今天的報價</text>
<rect x="60" y="340" width="14" height="34" rx="3" fill="var(--accent)"/>
<text x="90" y="364" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">一天</text>

<text x="60" y="450" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="22" fill="var(--ink)">兩邊對不起來，是因為尺不一樣長</text>
</svg>
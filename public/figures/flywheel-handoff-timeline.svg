<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="時間線上市電斷點之後，極短的飛輪段緊接一段很長的柴油段，中間沒有空隙">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .k { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="460" fill="var(--page)"/>
<text class="t" x="60" y="62">接縫不能有空隙</text>

<rect x="80" y="180" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="104" y="218">市電</text>
<line x1="290" y1="150" x2="290" y2="280" stroke="var(--warn)" stroke-width="4"/>
<text class="g" x="256" y="140" fill="var(--warn)">斷電</text>

<rect x="300" y="180" width="80" height="60" rx="8" fill="var(--accent)" opacity="0.3" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="300" y="300" fill="var(--accent)">飛輪</text>
<text class="b" x="300" y="326">五到六秒</text>

<rect x="380" y="180" width="500" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="408" y="218">柴油引擎</text>
<text class="b" x="408" y="300">幾小時到幾天</text>

<text class="b" x="80" y="372">資料中心那端察覺不到</text>
<text class="k" x="80" y="416">停一毫秒，運算就要重來</text>
</svg>
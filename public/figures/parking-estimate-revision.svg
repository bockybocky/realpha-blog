<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="全市停車位長條上，可行性階段的估計段落明顯比實作階段的估計段落寬，箭頭指向縮小方向。">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" fill="var(--ink)">同一個單位，兩個階段的數字</text>
<text x="60" y="92" font-size="16" fill="var(--dim)">寬度按比例畫，底色長條為全市總量</text>

<rect x="60" y="230" width="840" height="60" fill="var(--card)" stroke="var(--line)"/>
<text x="900" y="316" font-size="15" fill="var(--dim)" text-anchor="end">全市總量</text>

<rect x="60" y="230" width="42" height="60" fill="var(--warn)" opacity="0.8"/>
<line x1="81" y1="230" x2="81" y2="176" stroke="var(--warn)" stroke-width="2"/>
<text x="92" y="170" font-size="20" fill="var(--warn)">十五萬</text>
<text x="92" y="146" font-size="15" fill="var(--dim)">可行性階段・上限</text>

<rect x="60" y="230" width="8" height="60" fill="var(--accent)"/>
<line x1="64" y1="290" x2="64" y2="376" stroke="var(--accent)" stroke-width="2"/>
<text x="76" y="382" font-size="20" fill="var(--accent)">三萬</text>
<text x="76" y="406" font-size="15" fill="var(--dim)">做下去之後・實作細節</text>

<path d="M120 260 L420 260" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M196 254 L170 260 L196 266 Z" fill="var(--dim)"/>
<text x="212" y="252" font-size="16" fill="var(--dim)">往小的方向修</text>

<text x="60" y="474" font-size="22" fill="var(--ink)">最早公布的衝擊，和落地時的衝擊是兩種東西</text>
</g>
</svg>
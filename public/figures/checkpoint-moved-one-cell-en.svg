<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two identical rows of three cells, with the lit cell shifting from the middle to the far left, meaning the checkpoint moved by one cell.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:19px; fill:var(--ink); font-weight:700; }
.b { font-size:16px; fill:var(--dim); }
.w { font-size:16px; fill:var(--page); font-weight:700; }
.c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="h" x="60" y="72">Checkpoint moved</text>
<text class="g" x="60" y="150">Past Qs</text>
<rect x="60" y="176" width="250" height="96" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="340" y="176" width="250" height="96" fill="var(--accent)"/>
<rect x="620" y="176" width="250" height="96" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="80" y="232">Core growth</text>
<text class="w" x="360" y="226">FCF</text>
<text class="w" x="360" y="252">Neg OK</text>
<text class="b" x="640" y="232">Capex</text>
<text class="g" x="60" y="358">This Q</text>
<rect x="60" y="384" width="250" height="96" fill="var(--accent)"/>
<rect x="340" y="384" width="250" height="96" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="620" y="384" width="250" height="96" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="w" x="80" y="434">Core growth</text>
<text class="w" x="80" y="460">Slip = hit</text>
<text class="b" x="360" y="440">FCF</text>
<text class="b" x="640" y="440">Capex</text>
<path d="M 465 282 L 200 374" stroke="var(--accent)" stroke-width="4" fill="none" stroke-dasharray="10 8"/>
<path d="M 200 374 L 220 356 L 228 378 Z" fill="var(--accent)"/>
<text class="c" x="60" y="518">Results fine, cell moved</text>
</svg>
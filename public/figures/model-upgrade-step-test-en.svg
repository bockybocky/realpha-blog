<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The model steps up at each of two upgrade points, one product line jumps along with it, and the other stays flat.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:20px;font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700}
    .a{fill:var(--accent)}
    .w{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="62">Model up, app jumps?</text>
<line x1="100" y1="470" x2="890" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="380" y1="110" x2="380" y2="470" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="660" y1="110" x2="660" y2="470" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="380" y="498" text-anchor="middle">o1 Pro</text>
<text class="b" x="660" y="498" text-anchor="middle">Opus 4.5</text>
<path d="M100,410 H380 V310 H660 V190 H890" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text class="b" x="890" y="178" text-anchor="end">LLM</text>
<path d="M100,435 H392 V335 H672 V218 H890" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linejoin="round"/>
<text class="g a" x="890" y="250" text-anchor="end">Jumps</text>
<path d="M100,452 H890" fill="none" stroke="var(--warn)" stroke-width="5"/>
<text class="g w" x="890" y="440" text-anchor="end">Stuck</text>
<text class="c" x="480" y="548" text-anchor="middle">Dated test</text>
</svg>
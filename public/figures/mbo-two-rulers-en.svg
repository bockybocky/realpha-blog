<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two rulers stand side by side; the same undertaking cannot be measured by stock price but can be measured by operating margin.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="58" font-size="27" fill="var(--ink)">Two Rulers</text>

  <rect x="150" y="120" width="86" height="330" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <line x1="150" y1="175" x2="236" y2="175" stroke="var(--line)"/>
  <line x1="150" y1="230" x2="236" y2="230" stroke="var(--line)"/>
  <line x1="150" y1="285" x2="236" y2="285" stroke="var(--line)"/>
  <line x1="150" y1="340" x2="236" y2="340" stroke="var(--line)"/>
  <line x1="150" y1="395" x2="236" y2="395" stroke="var(--line)"/>
  <text x="193" y="104" font-size="20" fill="var(--ink)" text-anchor="middle">Price</text>
  <text x="193" y="482" font-size="16" fill="var(--dim)" text-anchor="middle">Measures Buzz</text>

  <rect x="724" y="120" width="86" height="330" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <line x1="724" y1="175" x2="810" y2="175" stroke="var(--line)"/>
  <line x1="724" y1="230" x2="810" y2="230" stroke="var(--line)"/>
  <line x1="724" y1="285" x2="810" y2="285" stroke="var(--line)"/>
  <line x1="724" y1="340" x2="810" y2="340" stroke="var(--line)"/>
  <line x1="724" y1="395" x2="810" y2="395" stroke="var(--line)"/>
  <text x="767" y="104" font-size="20" fill="var(--ink)" text-anchor="middle">Op. Margin</text>
  <text x="767" y="482" font-size="16" fill="var(--dim)" text-anchor="middle">Measures Problems Solved</text>

  <rect x="372" y="258" width="216" height="54" rx="10" fill="var(--card)" stroke="var(--accent)"/>
  <text x="480" y="291" font-size="19" fill="var(--ink)" text-anchor="middle">What He Wants to Do</text>

  <line x1="372" y1="285" x2="128" y2="285" stroke="var(--grey)" stroke-dasharray="6 6"/>
  <line x1="112" y1="271" x2="140" y2="299" stroke="var(--warn)" stroke-width="3"/>
  <line x1="140" y1="271" x2="112" y2="299" stroke="var(--warn)" stroke-width="3"/>
  <text x="126" y="330" font-size="16" fill="var(--warn)" text-anchor="middle">Off Scale</text>

  <line x1="588" y1="285" x2="710" y2="230" stroke="var(--accent)" stroke-dasharray="6 6"/>
  <circle cx="724" cy="224" r="9" fill="var(--accent)"/>
  <text x="700" y="196" font-size="16" fill="var(--accent)" text-anchor="middle">Measurable</text>

  <text x="480" y="528" font-size="22" fill="var(--ink)" text-anchor="middle">What a ruler cannot measure does not cease to exist</text>
</svg>
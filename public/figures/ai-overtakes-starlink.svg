<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩根柱子，AI 部門高過 Starlink，成長箭頭長度差距更大">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">單季營收，第一大換人</text>

  <line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

  <rect x="140" y="252" width="150" height="168" rx="6" fill="var(--grey)"/>
  <text x="215" y="232" font-size="20" fill="var(--ink)" text-anchor="middle">52.5 億</text>
  <text x="215" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">Starlink</text>

  <rect x="400" y="178" width="150" height="242" rx="6" fill="var(--accent)"/>
  <text x="475" y="158" font-size="20" fill="var(--ink)" text-anchor="middle">75.6 億</text>
  <text x="475" y="452" font-size="19" fill="var(--accent)" text-anchor="middle">AI 部門</text>

  <text x="700" y="158" font-size="19" fill="var(--dim)">年增</text>
  <line x1="700" y1="300" x2="700" y2="256" stroke="var(--grey)" stroke-width="10"/>
  <text x="730" y="290" font-size="16" fill="var(--dim)">69%</text>
  <line x1="800" y1="300" x2="800" y2="180" stroke="var(--accent)" stroke-width="10"/>
  <text x="830" y="290" font-size="16" fill="var(--accent)">830%</text>
  <line x1="680" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="2"/>

  <text x="60" y="505" font-size="22" fill="var(--ink)">賣的不是晶片，是出租算力</text>
</svg>
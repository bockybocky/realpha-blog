<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two branches after the same point in time, one proving the bears right and one proving the bulls right.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>svg{--page:#ffffff;--card:#f6f8fc;--line:#dde3ee;--ink:#1a212b;--dim:#57616f;--grey:#b9c2d0;--accent:#1f6feb;--warn:#d97706;}@media (prefers-color-scheme: dark){svg{--page:#0d1117;--card:#161b22;--line:#272e39;--ink:#e6edf3;--dim:#8b949e;--grey:#4a5464;--accent:#58a6ff;--warn:#d29922;}}text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}</style>
<text x="60" y="58" font-size="27" font-weight="700">The day we get the answer is already set</text>
<line x1="90" y1="280" x2="420" y2="280" stroke="var(--grey)" stroke-width="5"/>
<circle cx="420" cy="280" r="12" fill="var(--ink)"/>
<text x="90" y="252" font-size="19" font-weight="700" fill="var(--dim)">Reach 1/4 to 3/4</text>
<text x="420" y="330" font-size="19" font-weight="700" text-anchor="middle">A year from now</text>
<path d="M432 274 C540 240 600 180 700 168" fill="none" stroke="var(--warn)" stroke-width="5"/>
<polygon points="710,166 694,158 696,176" fill="var(--warn)"/>
<text x="560" y="190" font-size="17" font-weight="700" fill="var(--warn)">Margin flat · price flat</text>
<rect x="716" y="130" width="180" height="70" rx="8" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text x="806" y="174" font-size="22" font-weight="700" text-anchor="middle" fill="var(--warn)">Bears win</text>
<path d="M432 288 C540 326 600 384 700 396" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polygon points="710,398 694,388 696,406" fill="var(--accent)"/>
<text x="560" y="404" font-size="17" font-weight="700" fill="var(--accent)">Renew at new price</text>
<rect x="716" y="362" width="180" height="70" rx="8" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="806" y="406" font-size="22" font-weight="700" text-anchor="middle" fill="var(--accent)">Bulls win</text>
<text x="60" y="484" font-size="22" font-weight="700">Treat it as a question you track, not a faith you hold</text>
</svg>
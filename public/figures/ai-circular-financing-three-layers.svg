<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三層方塊被左右兩條反向的粗線接成一個封閉的圈：錢從上層流到下層，再從下層流回上層">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">同一筆錢，在三層之間繞圈</text>

<rect x="290" y="96" width="380" height="104" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="480" y="140" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">晶片商</text>
<text class="t" x="480" y="172" font-size="16" fill="var(--dim)" text-anchor="middle">燃料</text>

<rect x="290" y="228" width="380" height="104" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="480" y="272" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">雲端業者</text>
<text class="t" x="480" y="304" font-size="16" fill="var(--dim)" text-anchor="middle">齒輪</text>

<rect x="290" y="360" width="380" height="104" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="480" y="404" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">模型公司</text>
<text class="t" x="480" y="436" font-size="16" fill="var(--dim)" text-anchor="middle">引擎</text>

<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--grey)"/>
  </marker>
</defs>

<path d="M670 148 L790 148 L790 412 L676 412" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#ar)"/>
<text class="t" x="806" y="272" font-size="19" font-weight="700" fill="var(--accent)">出錢</text>
<text class="t" x="806" y="298" font-size="16" fill="var(--dim)">借款・投資・擔保</text>

<path d="M290 412 L170 412 L170 148 L284 148" fill="none" stroke="var(--grey)" stroke-width="4" marker-end="url(#ag)"/>
<text class="t" x="60" y="272" font-size="19" font-weight="700" fill="var(--ink)">買回來</text>
<text class="t" x="60" y="298" font-size="16" fill="var(--dim)">晶片・算力</text>

<text class="t" x="480" y="524" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">錢沒離開這條鏈子</text>
</svg>
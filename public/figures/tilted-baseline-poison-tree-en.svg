<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A tilted baseline carries every later reading away from the horizontal true value, and the gap never closes.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">Fruit of the poison tree</text>
<rect x="60" y="100" width="230" height="330" fill="var(--card)"/>
<text class="g" x="82" y="140">Sources of error</text>
<text class="b" x="82" y="186">The cuff itself</text>
<text class="b" x="82" y="222">Wrong size</text>
<text class="b" x="82" y="258">Tubing turned the wrong way</text>
<text class="b" x="82" y="294">Arm hanging down</text>
<text class="b" x="82" y="330">Pulse oximeter on the other hand</text>
<text class="b" x="82" y="366">Talking while measuring</text>
<line x1="300" y1="266" x2="368" y2="266" stroke="var(--dim)" stroke-width="4"/>
<polygon points="368,258 388,266 368,274" fill="var(--dim)"/>
<line x1="400" y1="330" x2="900" y2="330" stroke="var(--dim)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="g" x="840" y="358">True value</text>
<line x1="400" y1="330" x2="900" y2="212" stroke="var(--warn)" stroke-width="5"/>
<text class="g" x="636" y="248">Skewed baseline</text>
<circle cx="520" cy="302" r="9" fill="var(--accent)"/>
<circle cx="620" cy="278" r="9" fill="var(--accent)"/>
<circle cx="720" cy="254" r="9" fill="var(--accent)"/>
<circle cx="820" cy="231" r="9" fill="var(--accent)"/>
<line x1="520" y1="302" x2="520" y2="330" stroke="var(--grey)" stroke-width="3"/>
<line x1="620" y1="278" x2="620" y2="330" stroke="var(--grey)" stroke-width="3"/>
<line x1="720" y1="254" x2="720" y2="330" stroke="var(--grey)" stroke-width="3"/>
<line x1="820" y1="231" x2="820" y2="330" stroke="var(--grey)" stroke-width="3"/>
<text class="b" x="470" y="414">Every later reading</text>
<text class="b" x="700" y="414">The gap stays</text>
<text class="c" x="60" y="500">Once the baseline tilts, later precision buys you nothing</text>
</svg>
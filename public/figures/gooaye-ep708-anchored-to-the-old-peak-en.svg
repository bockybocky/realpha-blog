<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="After the price drops from its high, a horizontal dashed line remains at the old peak, marking a level that borrowed three years ahead, and attention stays anchored to it.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">It fell, but your eyes stay where it once was</text>
<line x1="130" y1="110" x2="130" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="130" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="62" y="124" font-size="16" fill="var(--dim)">Price</text>
<text x="860" y="500" font-size="16" fill="var(--dim)">Time</text>
<line x1="130" y1="170" x2="880" y2="170" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="700" y="156" font-size="19" fill="var(--dim)">Old peak</text>
<path d="M160 430 C 260 400 330 260 420 190 L470 170" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M470 170 L540 260 L610 340 L700 360 L860 350" fill="none" stroke="var(--warn)" stroke-width="3"/>
<circle cx="470" cy="170" r="6" fill="var(--warn)"/>
<circle cx="700" cy="360" r="6" fill="var(--accent)"/>
<text x="716" y="366" font-size="19" fill="var(--accent)">Now</text>
<line x1="470" y1="170" x2="470" y2="118" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="400" y="108" font-size="19" fill="var(--warn)">3 years borrowed</text>
<line x1="700" y1="360" x2="700" y2="176" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 6"/>
<text x="716" y="270" font-size="16" fill="var(--dim)">Anchor</text>
<text x="130" y="525" font-size="22" fill="var(--ink)">That dashed line is memory, not value</text>
</svg>
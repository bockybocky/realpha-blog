<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="An outer box containing an inner one, beside a seventy-thirty bar with the longer part belonging to the outer layer.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56">Seven tenths of this gain came from outside the model</text>

  <rect x="70" y="120" width="330" height="280" rx="18" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="98" y="158">Tool layer</text>
  <rect x="140" y="196" width="190" height="140" rx="12" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
  <text class="g" x="235" y="274" text-anchor="middle">Model</text>
  <text class="s" x="98" y="382">Retrieval . chaining . page-by-page self-check</text>

  <line x1="460" y1="150" x2="460" y2="380" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

  <text class="s" x="520" y="196">Where the gain came from</text>
  <rect x="520" y="216" width="380" height="70" rx="8" fill="var(--accent)"/>
  <rect x="786" y="216" width="114" height="70" rx="8" fill="var(--grey)"/>
  <text class="g" x="600" y="260" fill="var(--page)">Tool layer 70%</text>
  <text class="s" x="520" y="318">Easy to copy</text>
  <text class="s" x="800" y="318">Hard to copy</text>
  <text class="s" x="800" y="196" text-anchor="middle">Model 30%</text>

  <text class="c" x="60" y="470">A lead in the copyable layer does not last</text>
</svg>
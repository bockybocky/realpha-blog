<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三層往下的階梯，每階除以十，最底階旁邊註明能力沒跟著降">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">一百倍的價差，能力沒跟著掉一百倍</text>

  <rect x="110" y="130" width="240" height="80" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="132" y="166" font-size="20" font-weight="700" fill="var(--ink)">前沿閉源</text>
  <text class="t" x="132" y="192" font-size="16" fill="var(--dim)">約 30 美元／百萬 token</text>

  <rect x="350" y="250" width="240" height="80" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="372" y="286" font-size="20" font-weight="700" fill="var(--ink)">中階閉源</text>
  <text class="t" x="372" y="312" font-size="16" fill="var(--dim)">約 3 美元</text>

  <rect x="590" y="370" width="300" height="80" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="t" x="612" y="406" font-size="20" font-weight="700" fill="var(--accent)">無審查開放權重</text>
  <text class="t" x="612" y="432" font-size="16" fill="var(--dim)">約 0.3 美元</text>

  <line x1="230" y1="210" x2="230" y2="250" stroke="var(--grey)" stroke-width="2"/>
  <line x1="230" y1="250" x2="350" y2="250" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="244" y="242" font-size="19" font-weight="700" fill="var(--dim)">÷10</text>
  <line x1="470" y1="330" x2="470" y2="370" stroke="var(--grey)" stroke-width="2"/>
  <line x1="470" y1="370" x2="590" y2="370" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="484" y="362" font-size="19" font-weight="700" fill="var(--dim)">÷10</text>

  <text class="t" x="610" y="488" font-size="19" font-weight="700" fill="var(--warn)">說「不」的那組神經元被關掉</text>

  <text class="t" x="60" y="516" font-size="22" font-weight="700" fill="var(--ink)">便宜到這一階，風險換了一種形狀</text>
</svg>
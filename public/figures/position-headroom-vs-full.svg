<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="滿格容器被意外擠掉一塊，留餘裕的容器裝得下意外">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">部位的大小，決定意外來的時候砍什麼</text>
<rect x="150" y="78" width="240" height="56" rx="8" fill="var(--warn)"/>
<text x="246" y="114" font-size="20" fill="var(--page)">意外</text>
<rect x="150" y="150" width="240" height="300" fill="var(--accent)"/>
<rect x="150" y="150" width="240" height="300" fill="none" stroke="var(--line)" stroke-width="3"/>
<rect x="150" y="390" width="240" height="60" fill="var(--warn)"/>
<text x="196" y="428" font-size="20" fill="var(--page)">臨時砍掉</text>
<text x="196" y="300" font-size="20" fill="var(--page)">滿格</text>
<text x="190" y="492" font-size="20" fill="var(--ink)">扛到上限</text>
<rect x="570" y="150" width="240" height="300" fill="none" stroke="var(--line)" stroke-width="3"/>
<rect x="570" y="250" width="240" height="200" fill="var(--accent)"/>
<rect x="570" y="186" width="240" height="56" rx="8" fill="var(--warn)"/>
<text x="666" y="222" font-size="20" fill="var(--page)">意外</text>
<text x="616" y="358" font-size="20" fill="var(--page)">本來的部位</text>
<text x="640" y="492" font-size="20" fill="var(--ink)">留餘裕</text>
<text x="60" y="548" font-size="22" fill="var(--ink)">餘裕不是閒置，是不必賤賣的權利</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三根柱子由高到低：第一根特別高，第二根不到一半，第三根再低一些，高處拉出一條虛線標示落差">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="66" font-size="27" fill="var(--ink)">台階往下的那一下</text>
<line x1="120" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="3"/>
<rect x="200" y="140" width="110" height="280" rx="6" fill="var(--grey)"/>
<text x="255" y="124" font-size="19" fill="var(--dim)" text-anchor="middle">140%</text>
<text x="255" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">去年同期</text>
<rect x="420" y="320" width="110" height="100" rx="6" fill="var(--accent)"/>
<text x="475" y="304" font-size="19" fill="var(--accent)" text-anchor="middle">50%</text>
<text x="475" y="452" font-size="16" fill="var(--ink)" text-anchor="middle">本季</text>
<rect x="640" y="340" width="110" height="80" rx="6" fill="var(--accent)"/>
<text x="695" y="324" font-size="19" fill="var(--accent)" text-anchor="middle">40%</text>
<text x="695" y="452" font-size="16" fill="var(--ink)" text-anchor="middle">下一季</text>
<line x1="310" y1="140" x2="790" y2="140" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="790" y1="140" x2="790" y2="340" stroke="var(--warn)" stroke-width="2"/>
<polygon points="782,340 798,340 790,360" fill="var(--warn)"/>
<text x="814" y="238" font-size="19" fill="var(--warn)">落差</text>
<text x="60" y="496" font-size="22" fill="var(--ink)">數字還漂亮，台階已經下了一層</text>
</svg>
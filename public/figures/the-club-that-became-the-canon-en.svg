<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Members inside the circle reach the canon; the one outside has no path.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">That circle later became a discipline</text>

  <circle cx="390" cy="260" r="150" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="340" cy="210" r="14" fill="var(--accent)"/>
  <circle cx="400" cy="195" r="14" fill="var(--accent)"/>
  <circle cx="455" cy="235" r="14" fill="var(--accent)"/>
  <circle cx="330" cy="285" r="14" fill="var(--accent)"/>
  <circle cx="395" cy="300" r="14" fill="var(--accent)"/>
  <circle cx="455" cy="320" r="14" fill="var(--accent)"/>
  <circle cx="300" cy="340" r="14" fill="var(--accent)"/>
  <text class="t" x="390" y="128" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">The club</text>

  <circle cx="750" cy="200" r="14" fill="var(--warn)"/>
  <text class="t" x="780" y="206" font-size="19" font-weight="700" fill="var(--warn)">Her</text>
  <text class="t" x="750" y="250" font-size="16" fill="var(--dim)">Outside</text>

  <path d="M390 412 V460" stroke="var(--accent)" stroke-width="4"/>
  <path d="M382 452 L390 476 L398 452 Z" fill="var(--accent)"/>
  <rect x="250" y="476" width="280" height="50" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="390" y="508" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">The canon</text>

  <path d="M750 230 C750 400 660 460 560 500" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7" fill="none"/>
  <text class="t" x="640" y="430" font-size="16" fill="var(--grey)">No path</text>
</svg>
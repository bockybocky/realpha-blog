<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="國產品與進口品的差距隨時間由寬變窄，三根垂直差距柱逐次縮短">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="80" y="62">進口替代：不看誰比較好，看差距</text>
<rect x="80" y="100" width="800" height="300" fill="var(--card)"/>
<line x1="120" y1="160" x2="860" y2="160" stroke="var(--grey)" stroke-width="3"/>
<text class="g" x="120" y="140">進口品　基準</text>
<line x1="120" y1="370" x2="860" y2="370" stroke="var(--line)" stroke-width="2"/>
<line x1="240" y1="330" x2="500" y2="258" stroke="var(--accent)" stroke-width="4"/>
<line x1="500" y1="258" x2="760" y2="196" stroke="var(--accent)" stroke-width="4"/>
<line x1="240" y1="160" x2="240" y2="330" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="500" y1="160" x2="500" y2="258" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="760" y1="160" x2="760" y2="196" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="240" cy="330" r="8" fill="var(--accent)"/>
<circle cx="500" cy="258" r="8" fill="var(--accent)"/>
<circle cx="760" cy="196" r="8" fill="var(--accent)"/>
<text class="s" x="258" y="252">差距</text>
<text class="s" x="518" y="215">差距</text>
<text class="s" x="778" y="184">差距</text>
<text class="g" x="200" y="398">第一次拜訪</text>
<text class="g" x="462" y="398">第二次</text>
<text class="g" x="722" y="398">第三次</text>
<text class="c" x="80" y="462">差距在縮小＝故事成立</text>
<text class="s" x="80" y="492">一樣好就夠，不必比較好</text>
</svg>
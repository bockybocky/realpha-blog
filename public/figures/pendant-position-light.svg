<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="人形示意圖，手腕手指被灰點佔滿，胸前空著掛一枚墜飾，斜光從左上打到臉和胸前">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); }
    .g  { font-size:19px; fill:var(--dim); }
    .s  { font-size:15px; fill:var(--dim); }
    .c  { font-size:22px; fill:var(--ink); }
</style>
<text class="ti" x="80" y="62">手腕手指住滿了，胸前還空著</text>
<path d="M150 120 L 330 210" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 7" fill="none"/>
<path d="M150 190 L 320 270" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 7" fill="none"/>
<path d="M150 260 L 318 330" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 7" fill="none"/>
<text class="g" x="140" y="108" fill="var(--accent)">斜光</text>
<circle cx="400" cy="196" r="46" fill="none" stroke="var(--ink)" stroke-width="3"/>
<path d="M340 282 L 460 282 L 476 474 L 324 474 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>
<path d="M462 292 C 520 330, 548 400, 556 452" fill="none" stroke="var(--ink)" stroke-width="3"/>
<circle cx="562" cy="476" r="19" fill="none" stroke="var(--grey)" stroke-width="3"/>
<circle cx="549" cy="438" r="7" fill="var(--grey)"/>
<circle cx="562" cy="444" r="7" fill="var(--grey)"/>
<circle cx="556" cy="430" r="7" fill="var(--grey)"/>
<circle cx="556" cy="472" r="6" fill="var(--grey)"/>
<circle cx="568" cy="480" r="6" fill="var(--grey)"/>
<path d="M362 284 C 380 320, 420 320, 438 284" fill="none" stroke="var(--accent)" stroke-width="2"/>
<circle cx="400" cy="326" r="15" fill="var(--accent)"/>
<text class="g" x="596" y="434">手腕 已住滿</text>
<text class="g" x="596" y="486">手指 已住滿</text>
<text class="g" x="430" y="334" fill="var(--accent)">胸前 正對光</text>
<text class="c" x="80" y="556">位置決定量得到什麼</text>
</svg>
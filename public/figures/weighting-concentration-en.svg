<svg xmlns="http://www.w3.org/2000/svg" id="fig-weighting" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two equal bars, the top filled nearly half, the bottom filled only a short stretch">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
#fig-weighting text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-weighting .h { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-weighting .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-weighting .b { font-size:16px; fill:var(--dim); }
#fig-weighting .s { font-size:15px; fill:var(--dim); }
#fig-weighting .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="h" x="60" y="54">Same firms, less leverage</text>
<text class="b" x="60" y="84">Tech weight in the index</text>
<text class="g" x="60" y="168">Cap-weighted</text>
<rect x="240" y="140" width="620" height="52" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="240" y="140" width="248" height="52" rx="6" fill="var(--accent)"/>
<text class="g" x="504" y="176">~40%</text>
<text class="g" x="60" y="308">Equal-weight</text>
<rect x="240" y="280" width="620" height="52" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="240" y="280" width="87" height="52" rx="6" fill="var(--accent)"/>
<text class="g" x="343" y="316">14%</text>
<text class="c" x="60" y="424">Diversification, or one assumption</text>
</svg>
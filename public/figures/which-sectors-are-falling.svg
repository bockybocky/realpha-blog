<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四根柱子從零升到六成六，房地產公用事業貼地，科技最高">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:600; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">同一個廣度數字，拆開是兩個世界</text>
<text class="n" x="60" y="88">站上 50 日均線的成分股比例</text>

<rect x="60" y="110" width="840" height="352" rx="10" fill="var(--card)" stroke="var(--line)"/>
<line x1="100" y1="420" x2="860" y2="420" stroke="var(--line)" stroke-width="2"/>

<rect x="140" y="418" width="110" height="2" fill="var(--warn)"/>
<text class="g" x="166" y="406">0%</text>
<text class="n" x="166" y="450">房地產</text>

<rect x="330" y="408" width="110" height="12" rx="3" fill="var(--warn)"/>
<text class="g" x="358" y="396">3%</text>
<text class="n" x="350" y="450">公用事業</text>

<rect x="520" y="312" width="110" height="108" rx="3" fill="var(--warn)"/>
<text class="g" x="544" y="300">27%</text>
<text class="n" x="540" y="450">必需消費</text>

<rect x="710" y="156" width="110" height="264" rx="3" fill="var(--accent)"/>
<text class="g" x="734" y="144">66%</text>
<text class="n" x="744" y="450">科技</text>

<text class="c" x="60" y="516">跌的是配息股，不是景氣股</text>
</svg>
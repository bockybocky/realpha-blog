<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同心圖，圓心是原則原本要解決的問題，虛線圈是適用邊界，兩個場合在圈內，一個場合落在圈外並標出代價">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">一條原則被延伸到它沒設計過的地方</text>

<circle cx="420" cy="320" r="190" fill="var(--accent)" opacity="0.12"/>
<circle cx="420" cy="320" r="190" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="12 10"/>
<text x="420" y="152" font-size="19" font-weight="700" text-anchor="middle" fill="var(--accent)">適用邊界</text>

<circle cx="420" cy="320" r="76" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="420" y="312" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">原本要解</text>
<text x="420" y="342" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">手癢亂換股</text>

<circle cx="300" cy="222" r="12" fill="var(--accent)"/>
<text x="286" y="202" font-size="16" text-anchor="end" fill="var(--ink)">短期回檔</text>
<circle cx="330" cy="436" r="12" fill="var(--accent)"/>
<text x="316" y="462" font-size="16" text-anchor="end" fill="var(--ink)">看到別人漲</text>

<circle cx="720" cy="250" r="14" fill="var(--warn)"/>
<text x="748" y="244" font-size="20" font-weight="700" fill="var(--warn)">論點已經壞掉</text>
<text x="748" y="274" font-size="16" fill="var(--dim)">代價：真金白銀</text>
<path d="M600 290 L696 258" stroke="var(--warn)" stroke-width="4" stroke-dasharray="8 8"/>

<text x="60" y="528" font-size="22" font-weight="700" fill="var(--ink)">問一句：這個場合，跟原始那件事像嗎</text>
</svg>
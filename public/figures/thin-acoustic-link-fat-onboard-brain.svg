<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條極細的連線接著一個很大的機上算力方塊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="80" y="60" font-size="27" fill="var(--ink)">線很細，所以腦要自己帶</text>

  <rect x="80" y="230" width="180" height="110" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="170" y="292" font-size="19" fill="var(--dim)" text-anchor="middle">岸上</text>

  <line x1="260" y1="285" x2="560" y2="285" stroke="var(--warn)" stroke-width="1"/>
  <text x="410" y="265" font-size="19" fill="var(--warn)" text-anchor="middle">聲學傳輸</text>
  <text x="410" y="315" font-size="16" fill="var(--dim)" text-anchor="middle">五公里｜每秒 10 KB</text>
  <text x="410" y="345" font-size="16" fill="var(--dim)" text-anchor="middle">撥接年代的粗細</text>

  <rect x="560" y="160" width="320" height="250" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="720" y="196" font-size="20" fill="var(--accent)" text-anchor="middle">機上算力</text>
  <rect x="600" y="220" width="240" height="150" rx="10" fill="var(--accent)"/>
  <text x="720" y="285" font-size="20" fill="var(--page)" text-anchor="middle">顯卡＋處理器</text>
  <text x="720" y="320" font-size="19" fill="var(--page)" text-anchor="middle">同類的 100×</text>

  <text x="80" y="470" font-size="22" fill="var(--ink)">判斷留在水裡，不回岸上</text>
</svg>
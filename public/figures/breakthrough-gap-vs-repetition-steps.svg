<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左：斷崖中間沒有中間狀態；右：一排可數的踏腳石，能看出走到第幾步">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56">缺一個新知識，還是缺做完二十次</text>

  <rect x="60" y="96" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="96" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="80" y="134" fill="var(--warn)">等突破</text>
  <text class="g" x="520" y="134" fill="var(--accent)">做很多次</text>

  <rect x="86" y="290" width="110" height="80" fill="var(--grey)"/>
  <rect x="330" y="230" width="110" height="140" fill="var(--grey)"/>
  <text class="s" x="141" y="392" text-anchor="middle">現在</text>
  <text class="s" x="385" y="392" text-anchor="middle">成了</text>
  <path d="M196,290 C240,240 290,250 330,230" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 8"/>
  <text class="b" x="263" y="196" text-anchor="middle">沒有中間狀態</text>
  <text class="b" x="263" y="224" text-anchor="middle">不知道多遠</text>

  <rect x="526" y="352" width="60" height="20" fill="var(--accent)"/>
  <rect x="596" y="322" width="60" height="20" fill="var(--accent)"/>
  <rect x="666" y="292" width="60" height="20" fill="var(--accent)"/>
  <rect x="736" y="262" width="60" height="20" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="806" y="232" width="60" height="20" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>
  <text class="s" x="556" y="392" text-anchor="middle">一</text>
  <text class="s" x="626" y="392" text-anchor="middle">二</text>
  <text class="s" x="696" y="392" text-anchor="middle">三</text>
  <text class="s" x="766" y="392" text-anchor="middle">四</text>
  <text class="s" x="836" y="392" text-anchor="middle">五</text>
  <text class="b" x="700" y="190" text-anchor="middle">走到第幾步看得出來</text>
  <text class="b" x="700" y="218" text-anchor="middle">卡住知道卡在哪一階</text>

  <text class="c" x="60" y="490">差別不在難度，在於你排不排得出下一步</text>
</svg>
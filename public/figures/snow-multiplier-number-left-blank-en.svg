<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A three-row table; the 'asked' column has a check or mention in every row, but the 'number given' column is a dashed empty box in all three.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="40" y="52">Multiplier? Blank both times</text>
<text class="g" x="520" y="120" text-anchor="middle">Asked</text>
<text class="g" x="770" y="120" text-anchor="middle">With number</text>
<rect x="60" y="140" width="840" height="90" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="85" y="193">5/27</text>
<text class="b" x="165" y="192">How much more CoCo spends</text>
<circle cx="520" cy="185" r="24" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M508 186 l9 9 l17 -19" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="700" y="160" width="140" height="50" rx="8" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<rect x="60" y="250" width="840" height="90" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="85" y="303">9/2</text>
<text class="b" x="165" y="302">How much more AI usage</text>
<circle cx="520" cy="295" r="24" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M508 296 l9 9 l17 -19" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="700" y="270" width="140" height="50" rx="8" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<rect x="60" y="360" width="840" height="90" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="85" y="413">9/2</text>
<text class="b" x="165" y="412">New: 80% used in 3 mo</text>
<text class="d" x="520" y="411" text-anchor="middle">Company's own claim</text>
<rect x="700" y="380" width="140" height="50" rx="8" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="d" x="770" y="411" text-anchor="middle">"Clearly"</text>
<text class="c" x="480" y="505" text-anchor="middle">Trust it, can't check it</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根柱子比高度，左邊一整塊是未上市小公司拿到的儲量，右邊由兩家上市公司分層堆疊並以虛線往上延伸超過左柱">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="60">同一週，儲量落在誰手上</text>
<text class="d" x="60" y="90">柱高＝簽下的油氣儲量規模</text>

<line x1="120" y1="446" x2="900" y2="446" stroke="var(--line)" stroke-width="2"/>

<rect x="180" y="126" width="200" height="320" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
<text class="b" x="280" y="290" text-anchor="middle">650 億桶</text>
<text class="g" x="280" y="478" text-anchor="middle">NABEP</text>
<text class="d" x="280" y="504" text-anchor="middle">未上市・無作業紀錄</text>
<text class="d" x="280" y="528" text-anchor="middle">一半是無基礎設施的綠地</text>

<rect x="600" y="195" width="200" height="172" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="b" x="700" y="288" text-anchor="middle">ENI　350 億桶</text>
<rect x="600" y="367" width="200" height="79" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="b" x="700" y="413" text-anchor="middle">GeoPark　160 億桶</text>
<rect x="600" y="112" width="200" height="70" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="d" x="700" y="141" text-anchor="middle">Chevron</text>
<text class="d" x="700" y="164" text-anchor="middle">70 億美元・產量翻倍</text>
<text class="g" x="700" y="478" text-anchor="middle">上市營運商</text>
<text class="d" x="700" y="504" text-anchor="middle">有資產負債表・有公開財報</text>
<text class="d" x="700" y="528" text-anchor="middle">有作業紀錄</text>

<line x1="380" y1="126" x2="590" y2="126" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>

<text class="c" x="60" y="560" opacity="0"> </text>
</svg>
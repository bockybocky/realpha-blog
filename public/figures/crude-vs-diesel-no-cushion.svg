<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="原油有兩層緩衝墊，柴油沒有墊子，衝擊直接撞底">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; } .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); } .c { font-size:22px; font-weight:700; }
</style>
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink)"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker>
</defs>
<text x="40" y="45" class="t">同一個衝擊，有沒有墊子</text>
<text x="270" y="95" class="g" text-anchor="middle">原油</text>
<line x1="270" y1="115" x2="270" y2="322" stroke="var(--ink)" stroke-width="4" marker-end="url(#ai)"/>
<rect x="150" y="330" width="240" height="45" fill="var(--accent)" fill-opacity="0.35"/>
<text x="270" y="359" class="b" text-anchor="middle" style="fill:var(--ink)">戰略儲備</text>
<rect x="150" y="375" width="240" height="45" fill="var(--accent)" fill-opacity="0.18"/>
<text x="270" y="404" class="b" text-anchor="middle" style="fill:var(--ink)">頁岩增產</text>
<line x1="120" y1="440" x2="420" y2="440" stroke="var(--ink)" stroke-width="3"/>
<text x="690" y="95" class="g" text-anchor="middle">柴油</text>
<rect x="570" y="330" width="240" height="90" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="600" y="365" class="b">無成品油儲備</text>
<text x="600" y="400" class="b">煉油 97–98% 滿</text>
<line x1="690" y1="115" x2="690" y2="432" stroke="var(--warn)" stroke-width="4" marker-end="url(#aw)"/>
<line x1="540" y1="440" x2="840" y2="440" stroke="var(--ink)" stroke-width="3"/>
<text x="712" y="470" class="g" style="fill:var(--warn)">先爆</text>
<text x="480" y="520" class="c" text-anchor="middle">瓶頸在沒有緩衝的那一層</text>
</svg>
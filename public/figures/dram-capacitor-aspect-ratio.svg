<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="邏輯是幾層扁平薄片，DRAM 電容是一根又深又細的垂直長洞">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">同樣叫製程節點，要的形狀不一樣</text>

  <text x="48" y="112" font-size="20" fill="var(--dim)">邏輯</text>
  <rect x="48" y="300" width="330" height="26" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="48" y="334" width="330" height="26" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="48" y="368" width="330" height="26" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="48" y="402" width="330" height="26" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="48" y="462" font-size="16" fill="var(--dim)">平鋪、堆層</text>
  <text x="48" y="490" font-size="16" fill="var(--dim)">現有的廠就能做</text>

  <text x="560" y="112" font-size="20" fill="var(--accent)">DRAM 電容</text>
  <rect x="560" y="140" width="330" height="300" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="716" y="140" width="18" height="300" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <line x1="690" y1="140" x2="690" y2="440" stroke="var(--accent)" stroke-width="2"/>
  <path d="M690 140 l-6 12 M690 140 l6 12 M690 440 l-6 -12 M690 440 l6 -12" stroke="var(--accent)" stroke-width="2" fill="none"/>
  <text x="586" y="296" font-size="16" fill="var(--accent)">深 1 到 3 微米</text>
  <line x1="716" y1="466" x2="734" y2="466" stroke="var(--accent)" stroke-width="2"/>
  <text x="748" y="472" font-size="16" fill="var(--accent)">寬 20 到 30 奈米</text>
  <text x="560" y="510" font-size="16" fill="var(--dim)">新蝕刻設備，也就是新廠</text>

  <text x="48" y="552" font-size="22" fill="var(--ink)">奈米數排得出一條線，排不出兩種結構。</text>
</svg>
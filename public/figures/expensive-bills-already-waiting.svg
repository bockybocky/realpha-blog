<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三個同樣大的方塊並排，右邊一個小方塊單獨站著，大小差距明顯">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="58">與 AI 無關的那幾張，本來就在那裡等著</text>
  <rect x="70" y="140" width="180" height="240" rx="10" fill="var(--accent)" opacity="0.85"/>
  <rect x="270" y="140" width="180" height="240" rx="10" fill="var(--accent)" opacity="0.85"/>
  <rect x="470" y="140" width="180" height="240" rx="10" fill="var(--accent)" opacity="0.85"/>
  <text class="g" x="104" y="268">防野火</text>
  <text class="g" x="284" y="256">極端氣候</text>
  <text class="g" x="304" y="286">復原</text>
  <text class="g" x="484" y="256">老化電網</text>
  <text class="g" x="524" y="286">更新</text>
  <rect x="790" y="330" width="90" height="50" rx="8" fill="var(--grey)" opacity="0.6"/>
  <text class="n" x="770" y="412">資料中心</text>
  <text class="n" x="770" y="436">對住宅電價</text>
  <text class="n" x="770" y="460">影響小</text>
  <line x1="70" y1="400" x2="650" y2="400" stroke="var(--line)" stroke-width="2"/>
  <text class="n" x="70" y="436">只為了維持今天這個水準的可靠與可負擔</text>
</svg>
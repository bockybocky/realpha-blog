<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條長度不同的橫條：上面一條代表財政部發債量，下面一條只有大約三分之一長，代表超大規模業者的借款規模">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="58">同一批錢，兩邊在搶</text>

  <text class="g" x="60" y="152">財政部發債</text>
  <rect x="60" y="172" width="840" height="76" fill="var(--grey)"/>

  <text class="g" x="60" y="312">超大規模業者借款</text>
  <rect x="60" y="332" width="280" height="76" fill="var(--accent)"/>
  <text class="b" x="356" y="362">7,500 億美元</text>
  <text class="b" x="356" y="388">接近發債量的三分之一</text>

  <line x1="340" y1="172" x2="340" y2="430" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <text class="c" x="60" y="484">利率 6%、8%、10%、12% 都借，因為停下來就沒有機會</text>
</svg>
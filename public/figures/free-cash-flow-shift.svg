<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="從現在到二零二七年，一條線由上往下滑到接近零的虛線，另一條線由下往上升並越揚越陡，兩條線在中間交叉">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="56" font-size="27" fill="var(--ink)">錢沒有消失，換到上游的口袋</text>
  <text x="60" y="98" font-size="19" fill="var(--dim)">自由現金流</text>

  <line x1="180" y1="410" x2="860" y2="410" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="170" y="415" font-size="15" fill="var(--dim)" text-anchor="end">零</text>

  <polyline points="220,200 500,310 780,398" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <polyline points="220,330 500,262 780,150" fill="none" stroke="var(--accent)" stroke-width="3"/>

  <circle cx="220" cy="200" r="5" fill="var(--warn)"/>
  <circle cx="780" cy="398" r="5" fill="var(--warn)"/>
  <circle cx="220" cy="330" r="5" fill="var(--accent)"/>
  <circle cx="780" cy="150" r="5" fill="var(--accent)"/>

  <text x="202" y="196" font-size="19" fill="var(--ink)" text-anchor="end">五大雲端</text>
  <text x="202" y="336" font-size="19" fill="var(--ink)" text-anchor="end">上游硬體</text>

  <text x="800" y="146" font-size="20" fill="var(--accent)">上升</text>
  <text x="800" y="404" font-size="20" fill="var(--warn)">趨近零</text>

  <text x="220" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">現在</text>
  <text x="780" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">2027</text>

  <text x="480" y="508" font-size="22" fill="var(--ink)" text-anchor="middle">同一筆 AI 支出，兩端相反</text>
</svg>
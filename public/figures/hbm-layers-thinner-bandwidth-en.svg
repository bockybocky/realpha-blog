<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two die stacks compared: with four layers each layer is thick, with sixteen layers each is thin, and the same total bandwidth is split more finely.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .w { font-size:20px; font-weight:700; fill:var(--warn); }
</style>
<text x="40" y="58" class="t">More layers, same pie</text>
<text x="40" y="96" class="b">Total = 8 (illustrative)</text>
<text x="275" y="150" class="g" text-anchor="middle">4 lyr</text>
<rect x="150" y="170" width="250" height="64" rx="6" fill="var(--accent)" fill-opacity="0.85"/>
<rect x="150" y="242" width="250" height="64" rx="6" fill="var(--accent)" fill-opacity="0.85"/>
<rect x="150" y="314" width="250" height="64" rx="6" fill="var(--accent)" fill-opacity="0.85"/>
<rect x="150" y="386" width="250" height="64" rx="6" fill="var(--accent)" fill-opacity="0.85"/>
<text x="275" y="490" class="g" text-anchor="middle">2 each</text>
<text x="685" y="150" class="g" text-anchor="middle">16 lyr</text>
<g fill="var(--accent)" fill-opacity="0.85">
<rect x="560" y="170" width="250" height="14" rx="3"/>
<rect x="560" y="187.5" width="250" height="14" rx="3"/>
<rect x="560" y="205" width="250" height="14" rx="3"/>
<rect x="560" y="222.5" width="250" height="14" rx="3"/>
<rect x="560" y="240" width="250" height="14" rx="3"/>
<rect x="560" y="257.5" width="250" height="14" rx="3"/>
<rect x="560" y="275" width="250" height="14" rx="3"/>
<rect x="560" y="292.5" width="250" height="14" rx="3"/>
<rect x="560" y="310" width="250" height="14" rx="3"/>
<rect x="560" y="327.5" width="250" height="14" rx="3"/>
<rect x="560" y="345" width="250" height="14" rx="3"/>
<rect x="560" y="362.5" width="250" height="14" rx="3"/>
<rect x="560" y="380" width="250" height="14" rx="3"/>
<rect x="560" y="397.5" width="250" height="14" rx="3"/>
<rect x="560" y="415" width="250" height="14" rx="3"/>
<rect x="560" y="432.5" width="250" height="14" rx="3"/>
</g>
<text x="685" y="490" class="w" text-anchor="middle">0.5 each</text>
<text x="40" y="548" class="c">2x layers, half each</text>
</svg>
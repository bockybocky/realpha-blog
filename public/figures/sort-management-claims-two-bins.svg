<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一堆句子分流進兩個桶，其中一桶往右連到一張表和兩季後的對帳時點">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">管理層講的話，分兩堆</text>
<rect x="60" y="210" width="150" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="78" y="246">法說會</text>
<text class="b" x="78" y="272">管理層發言</text>
<path d="M210 232 L300 160" stroke="var(--grey)" stroke-width="2.5"/>
<path d="M210 268 L300 340" stroke="var(--accent)" stroke-width="2.5"/>
<rect x="300" y="120" width="230" height="80" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-dasharray="6 6"/>
<text class="b" x="318" y="154">永遠不會錯</text>
<text class="b" x="318" y="180">樂觀、看好、長期</text>
<text class="b" x="552" y="166" fill="var(--grey)">丟掉</text>
<rect x="300" y="310" width="230" height="80" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="318" y="344" fill="var(--accent)">有數字、有日期</text>
<text class="b" x="318" y="370">誰、哪一天講的</text>
<path d="M530 350 L620 350" stroke="var(--accent)" stroke-width="2.5"/>
<rect x="620" y="310" width="120" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="648" y="356">一張表</text>
<path d="M740 350 L830 350" stroke="var(--accent)" stroke-width="2.5"/>
<text class="g" x="790" y="330" fill="var(--accent)">兩季後</text>
<text class="b" x="790" y="382">對答案</text>
<text class="c" x="60" y="476">能被推翻的句子才值得抄</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="矮的營收柱與高的支出柱之間有一段缺口，三個箭頭把錢補進那段缺口">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <defs>
    <marker id="ar3" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="var(--warn)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">錢從哪裡來</text>

  <line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

  <rect x="150" y="350" width="150" height="70" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="225" y="395" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">營收</text>

  <rect x="620" y="150" width="150" height="270" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
  <text class="t" x="695" y="295" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">設備支出</text>

  <line x1="300" y1="350" x2="620" y2="350" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="300" y1="150" x2="620" y2="150" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="t" x="460" y="245" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">缺口</text>

  <line x1="300" y1="520" x2="400" y2="300" stroke="var(--warn)" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="460" y1="520" x2="460" y2="300" stroke="var(--warn)" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="620" y1="520" x2="520" y2="300" stroke="var(--warn)" stroke-width="2" marker-end="url(#ar3)"/>

  <text class="t" x="270" y="552" font-size="16" fill="var(--dim)" text-anchor="middle">輝達這類投資</text>
  <text class="t" x="460" y="552" font-size="16" fill="var(--dim)" text-anchor="middle">高收益公司債</text>
  <text class="t" x="660" y="552" font-size="16" fill="var(--dim)" text-anchor="middle">竹科可轉債</text>

  <text class="t" x="60" y="115" font-size="16" fill="var(--dim)">一邊收不到錢，另一邊還在花錢</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four bars fall then rise, with the third and lowest one marked as the sweet spot.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="480" y="54" text-anchor="middle" font-size="27" fill="var(--ink)">More is not always faster</text>

<line x1="110" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="112" font-size="15" fill="var(--dim)">Time</text>

<rect x="187" y="180" width="86" height="260" rx="6" fill="var(--grey)"/>
<rect x="357" y="200" width="86" height="240" rx="6" fill="var(--grey)"/>
<rect x="527" y="300" width="86" height="140" rx="6" fill="var(--accent)"/>
<rect x="697" y="270" width="86" height="170" rx="6" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>

<text x="230" y="166" text-anchor="middle" font-size="16" fill="var(--ink)">130 s</text>
<text x="400" y="186" text-anchor="middle" font-size="16" fill="var(--ink)">120 s</text>
<text x="570" y="286" text-anchor="middle" font-size="16" fill="var(--accent)">70 s</text>
<text x="740" y="256" text-anchor="middle" font-size="16" fill="var(--dim)">Slower than C</text>

<text x="570" y="150" text-anchor="middle" font-size="20" fill="var(--accent)">Sweet spot</text>
<path d="M570,162 l0,110" stroke="var(--accent)" stroke-width="2"/>
<path d="M570,282 l-7,-14 l14,0 z" fill="var(--accent)"/>

<text x="230" y="470" text-anchor="middle" font-size="16" fill="var(--ink)">A</text>
<text x="400" y="470" text-anchor="middle" font-size="16" fill="var(--ink)">B</text>
<text x="570" y="470" text-anchor="middle" font-size="16" fill="var(--ink)">C</text>
<text x="740" y="470" text-anchor="middle" font-size="16" fill="var(--ink)">D</text>
<text x="230" y="494" text-anchor="middle" font-size="15" fill="var(--dim)">All GPU</text>
<text x="400" y="494" text-anchor="middle" font-size="15" fill="var(--dim)">Vision on ANE</text>
<text x="570" y="494" text-anchor="middle" font-size="15" fill="var(--dim)">Plus some language</text>
<text x="740" y="494" text-anchor="middle" font-size="15" fill="var(--dim)">Even more</text>

<text x="480" y="536" text-anchor="middle" font-size="22" fill="var(--ink)">More on the ANE　→</text>
</svg>
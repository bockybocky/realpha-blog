<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左欄宣稱的代價幾乎為零，右欄動作的代價疊成三塊高柱">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--page); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">看他付了什麼，不看他說了什麼</text>

  <line x1="90" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="s" x="60" y="120">付出的代價</text>
  <line x1="90" y1="140" x2="90" y2="440" stroke="var(--line)" stroke-width="2"/>

  <rect x="160" y="428" width="240" height="12" fill="var(--grey)" rx="2"/>
  <text class="g" x="280" y="480" text-anchor="middle">「我們 CP 值高」</text>
  <text class="s" x="280" y="506" text-anchor="middle">說了不用付出任何東西</text>

  <rect x="560" y="368" width="240" height="60" fill="var(--accent)" rx="4"/>
  <text class="b" x="680" y="405" text-anchor="middle">自由現金流轉負</text>
  <rect x="560" y="298" width="240" height="60" fill="var(--accent)" rx="4"/>
  <text class="b" x="680" y="335" text-anchor="middle">被市場質疑</text>
  <rect x="560" y="228" width="240" height="60" fill="var(--accent)" rx="4"/>
  <text class="b" x="680" y="265" text-anchor="middle">估值倍數掉下來</text>
  <text class="g" x="680" y="480" text-anchor="middle">把現金砸下去、不回購</text>
  <text class="s" x="680" y="506" text-anchor="middle">每一塊都要真的付</text>

  <text class="c" x="60" y="546">代價的高度，就是那句話的重量</text>
</svg>
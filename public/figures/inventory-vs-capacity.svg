<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊一堆小方塊經過中間往右收窄的漏斗細頸，流到右邊三條固定寬度的橫條，細頸的寬度限制住右邊的產出">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="62" font-size="27" fill="var(--ink)">它動的是庫存，還是產能</text>

<text x="195" y="146" font-size="19" fill="var(--dim)" text-anchor="middle">庫存　可以加</text>
<rect x="90" y="170" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="134" y="170" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="178" y="170" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="222" y="170" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="266" y="170" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="90" y="206" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="134" y="206" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="178" y="206" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="222" y="206" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="266" y="206" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="90" y="242" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="134" y="242" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="178" y="242" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="222" y="242" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>
<rect x="266" y="242" width="34" height="26" rx="3" fill="var(--card)" stroke="var(--line)"/>

<line x1="302" y1="219" x2="326" y2="219" stroke="var(--dim)" stroke-width="2"/>
<polygon points="326,212 340,219 326,226" fill="var(--dim)"/>

<polygon points="352,150 470,200 470,238 352,288" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<rect x="470" y="200" width="90" height="38" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text x="455" y="330" font-size="19" fill="var(--accent)" text-anchor="middle">煉油產能</text>
<text x="455" y="356" font-size="15" fill="var(--dim)" text-anchor="middle">沒有變寬</text>

<line x1="572" y1="219" x2="598" y2="219" stroke="var(--dim)" stroke-width="2"/>
<polygon points="598,212 612,219 598,226" fill="var(--dim)"/>

<text x="730" y="146" font-size="19" fill="var(--dim)" text-anchor="middle">產出　不變</text>
<rect x="620" y="166" width="220" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
<text x="636" y="186" font-size="15" fill="var(--dim)">汽油</text>
<rect x="620" y="206" width="220" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
<text x="636" y="226" font-size="15" fill="var(--dim)">柴油</text>
<rect x="620" y="246" width="220" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
<text x="636" y="266" font-size="15" fill="var(--dim)">航空燃油</text>

<text x="80" y="452" font-size="22" fill="var(--ink)">窄的那一段沒變寬，前面堆再多都一樣</text>
</svg>
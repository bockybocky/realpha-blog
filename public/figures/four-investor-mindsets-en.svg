<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three mindsets sit along one horizontal axis ordered by how much evidence they rest on, and a fourth drops below the line, detached from the asset.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .l { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">Where four standards sit</text>
<text class="s" x="60" y="88">The axis: can the reason be checked?</text>
<line x1="110" y1="250" x2="880" y2="250" stroke="var(--line)" stroke-width="3"/>
<text class="l" x="110" y="286">Checkable</text>
<text class="l" x="812" y="286">Not checkable</text>
<circle cx="200" cy="250" r="11" fill="var(--accent)"/>
<text class="g" x="160" y="214">Financial</text>
<text class="l" x="138" y="326">Market size and financials</text>
<circle cx="470" cy="250" r="11" fill="var(--accent)"/>
<text class="g" x="430" y="214">Production</text>
<text class="l" x="386" y="326">Tech path and pace</text>
<circle cx="760" cy="250" r="11" fill="var(--accent)"/>
<text class="g" x="720" y="214">Frontier</text>
<text class="l" x="700" y="326">Trusts the founder</text>
<line x1="760" y1="262" x2="760" y2="396" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="640" y="396" width="240" height="56" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="664" y="430">Hype</text>
<text class="l" x="744" y="430">Ignores asset</text>
<text class="c" x="60" y="490">Hold all four and any deal looks fine</text>
</svg>
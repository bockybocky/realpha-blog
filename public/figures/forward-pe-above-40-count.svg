<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上格指數線往上走到接近高點，下格高倍數檔數線往下掉到 27 檔，同一水位上次出現在兩個熊市低點">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型 */
</style></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">兩條線，走相反的方向</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">指數位置 ｜ 本益比 40 倍以上的成分股檔數</text>
<rect x="60" y="112" width="840" height="108" fill="var(--card)" rx="8"/>
<polyline points="120,196 260,206 420,168 560,182 720,142 840,122" fill="none" stroke="var(--grey)" stroke-width="4" stroke-linejoin="round"/>
<text x="620" y="150" font-size="19" fill="var(--dim)">指數　近歷史高點</text>
<rect x="60" y="244" width="840" height="236" fill="var(--card)" rx="8"/>
<text x="86" y="286" font-size="15" fill="var(--dim)">多</text>
<text x="86" y="462" font-size="15" fill="var(--dim)">少</text>
<line x1="260" y1="270" x2="260" y2="440" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="560" y1="270" x2="560" y2="440" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<polyline points="120,288 260,420 420,302 560,414 720,388 880,434" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round"/>
<circle cx="260" cy="420" r="7" fill="var(--accent)"/>
<circle cx="560" cy="414" r="7" fill="var(--accent)"/>
<circle cx="880" cy="434" r="8" fill="var(--accent)"/>
<text x="260" y="464" font-size="16" fill="var(--dim)" text-anchor="middle">2020／3　熊底</text>
<text x="560" y="464" font-size="16" fill="var(--dim)" text-anchor="middle">2022／10　熊底</text>
<text x="866" y="410" font-size="20" fill="var(--ink)" text-anchor="end" font-weight="700">今天　27 檔</text>
<text x="60" y="524" font-size="22" fill="var(--ink)">熊底才有的水位，出現在指數的高點旁邊</text>
</svg>
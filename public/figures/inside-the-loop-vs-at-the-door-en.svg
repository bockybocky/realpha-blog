<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A large circle on the left holds one supplier while three others queue outside on the right, their arrows reaching the boundary without crossing it">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
<marker id="f4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--grey)"/></marker>
</defs>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Both earn well, but the positions differ</text>
<circle cx="320" cy="300" r="152" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text x="320" y="216" font-size="16" fill="var(--accent)" text-anchor="middle">Customer's next-gen development program</text>
<rect x="272" y="268" width="96" height="60" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="320" y="306" font-size="20" fill="var(--ink)" text-anchor="middle">A</text>
<text x="320" y="368" font-size="16" fill="var(--dim)" text-anchor="middle">Written into the spec</text>
<text x="720" y="222" font-size="19" fill="var(--dim)" text-anchor="middle">Queuing at the door</text>
<rect x="600" y="268" width="80" height="60" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="700" y="268" width="80" height="60" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<rect x="800" y="268" width="80" height="60" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="740" y="306" font-size="20" fill="var(--ink)" text-anchor="middle">B</text>
<text x="740" y="368" font-size="16" fill="var(--dim)" text-anchor="middle">Two months faster delivery</text>
<path d="M592 298 H488" stroke="var(--grey)" stroke-width="2.5" fill="none" marker-end="url(#f4g)"/>
<text x="60" y="515" font-size="22" fill="var(--ink)">Watch how relationships change, not how numbers change.</text>
</svg>
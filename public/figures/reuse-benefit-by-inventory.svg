<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="一排長條圖，最左邊三根特別高、第四根中等、其餘全部貼近地面，呈現極不均的舊記憶體存量分布">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="70" font-size="27" fill="var(--ink)">紅利跟著舊庫存走</text>
  <text x="60" y="112" font-size="15" fill="var(--dim)">縱向＝可拆下的舊記憶體</text>

  <rect x="100" y="190" width="70" height="210" rx="5" fill="var(--accent)"/>
  <rect x="196" y="190" width="70" height="210" rx="5" fill="var(--accent)"/>
  <rect x="292" y="190" width="70" height="210" rx="5" fill="var(--accent)"/>
  <rect x="388" y="290" width="70" height="110" rx="5" fill="var(--accent)"/>
  <rect x="484" y="372" width="70" height="28" rx="5" fill="var(--grey)"/>
  <rect x="580" y="376" width="70" height="24" rx="5" fill="var(--grey)"/>
  <rect x="676" y="380" width="70" height="20" rx="5" fill="var(--grey)"/>
  <rect x="772" y="382" width="70" height="18" rx="5" fill="var(--grey)"/>
  <line x1="90" y1="400" x2="870" y2="400" stroke="var(--line)" stroke-width="2"/>

  <text x="104" y="430" font-size="15" fill="var(--dim)">超大規模三家</text>
  <text x="390" y="430" font-size="15" fill="var(--dim)">Oracle</text>
  <text x="560" y="430" font-size="15" fill="var(--dim)">其他所有人</text>

  <text x="60" y="480" font-size="22" fill="var(--accent)">別人吃不到</text>
</svg>
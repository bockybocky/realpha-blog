<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條長短不同的橫條，開頭各有一塊同樣大的成本方塊，短條被吃掉的比例明顯大得多">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="50" y="62" font-size="27" fill="var(--ink)">同一筆手續費，攤在不同長度上</text>

  <text x="70" y="168" font-size="20" fill="var(--ink)">持有 3 個月</text>
  <rect x="70" y="188" width="200" height="66" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <rect x="70" y="188" width="60" height="66" rx="8" fill="var(--warn)"/>
  <text x="286" y="230" font-size="17" fill="var(--dim)">被吃掉一大截</text>

  <text x="70" y="330" font-size="20" fill="var(--ink)">持有 3 年</text>
  <rect x="70" y="350" width="720" height="66" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <rect x="70" y="350" width="60" height="66" rx="8" fill="var(--warn)"/>
  <text x="806" y="392" font-size="17" fill="var(--dim)">薄薄一層</text>

  <line x1="100" y1="266" x2="100" y2="300" stroke="var(--warn)" stroke-width="2"/>
  <line x1="100" y1="300" x2="100" y2="338" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="118" y="304" font-size="16" fill="var(--warn)">手續費一樣大</text>

  <text x="50" y="478" font-size="22" fill="var(--ink)">支出是確定的，報酬不是</text>
</svg>
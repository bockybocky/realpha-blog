<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="按年數比例畫的時間軸，四個節點拉開整條畫面寬度">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="40" y="58">從收案到一顆口服藥</text>
<line x1="80" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="8"/>
<line x1="80" y1="300" x2="900" y2="300" stroke="var(--accent)" stroke-width="8"/>
<circle cx="80" cy="300" r="12" fill="var(--accent)"/>
<circle cx="268" cy="300" r="12" fill="var(--accent)"/>
<circle cx="552" cy="300" r="12" fill="var(--accent)"/>
<circle cx="900" cy="300" r="14" fill="var(--accent)"/>
<text class="g" x="60" y="256">2000</text>
<text class="b" x="60" y="230">收了約 3,500 人</text>
<text class="g" x="248" y="366">2006</text>
<text class="b" x="248" y="392">發現失能基因那群人</text>
<text class="g" x="532" y="256">2015</text>
<text class="b" x="470" y="230">兩週一針</text>
<text class="g" x="836" y="366">今年</text>
<text class="b" x="760" y="392">口服版核准</text>
<line x1="80" y1="446" x2="900" y2="446" stroke="var(--ink)" stroke-width="3"/>
<line x1="80" y1="436" x2="80" y2="456" stroke="var(--ink)" stroke-width="3"/>
<line x1="900" y1="436" x2="900" y2="456" stroke="var(--ink)" stroke-width="3"/>
<text class="c" x="356" y="490">四分之一個世紀</text>
</svg>
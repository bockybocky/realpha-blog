<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="升息後路徑中途凹陷，十二個月後仍高於起點">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); }
  .g { font-size:20px; fill:var(--ink); }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">升息之後那一年的形狀</text>

<line x1="140" y1="300" x2="890" y2="300" stroke="var(--grey)" stroke-dasharray="5 5"/>
<text class="b" x="140" y="290">首次升息</text>
<path d="M150 300 C 260 268, 300 250, 360 258 C 430 268, 470 392, 560 380 C 660 366, 740 260, 860 210" stroke="var(--accent)" stroke-width="4" fill="none"/>
<circle cx="150" cy="300" r="6" fill="var(--accent)"/>
<circle cx="860" cy="210" r="6" fill="var(--accent)"/>
<text class="g" x="770" y="186">12 個月後</text>
<text class="g" x="770" y="212" fill="var(--accent)">+8.9%</text>
<text class="g" x="470" y="424" fill="var(--warn)">中途 −10%</text>
<line x1="560" y1="300" x2="560" y2="380" stroke="var(--warn)" stroke-width="3"/>

<rect x="60" y="450" width="838" height="48" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="88" y="482">問法換成：這次升息有沒有把經濟弄壞</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上排十點八實心，下排十點只有五實心，實際比預期少三個">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="40" y="58" font-size="27" font-weight="700">寫 80% 的十筆</text>
<text x="170" y="199" font-size="19" text-anchor="end">該中</text>
<g>
<circle cx="210" cy="192" r="20" fill="var(--accent)"/><circle cx="272" cy="192" r="20" fill="var(--accent)"/><circle cx="334" cy="192" r="20" fill="var(--accent)"/><circle cx="396" cy="192" r="20" fill="var(--accent)"/><circle cx="458" cy="192" r="20" fill="var(--accent)"/><circle cx="520" cy="192" r="20" fill="var(--accent)"/><circle cx="582" cy="192" r="20" fill="var(--accent)"/><circle cx="644" cy="192" r="20" fill="var(--accent)"/>
<circle cx="706" cy="192" r="19" fill="none" stroke="var(--grey)" stroke-width="2"/><circle cx="768" cy="192" r="19" fill="none" stroke="var(--grey)" stroke-width="2"/>
</g>
<text x="812" y="200" font-size="20" font-weight="700" style="fill:var(--accent)">8 次</text>
<text x="170" y="309" font-size="19" text-anchor="end">實際</text>
<g>
<circle cx="210" cy="302" r="20" fill="var(--warn)"/><circle cx="272" cy="302" r="20" fill="var(--warn)"/><circle cx="334" cy="302" r="20" fill="var(--warn)"/><circle cx="396" cy="302" r="20" fill="var(--warn)"/><circle cx="458" cy="302" r="20" fill="var(--warn)"/>
<circle cx="520" cy="302" r="19" fill="none" stroke="var(--grey)" stroke-width="2"/><circle cx="582" cy="302" r="19" fill="none" stroke="var(--grey)" stroke-width="2"/><circle cx="644" cy="302" r="19" fill="none" stroke="var(--grey)" stroke-width="2"/><circle cx="706" cy="302" r="19" fill="none" stroke="var(--grey)" stroke-width="2"/><circle cx="768" cy="302" r="19" fill="none" stroke="var(--grey)" stroke-width="2"/>
</g>
<text x="812" y="310" font-size="20" font-weight="700" style="fill:var(--warn)">5 次</text>
<path d="M489,346 L489,356 L675,356 L675,346" fill="none" stroke="var(--warn)" stroke-width="1.5"/>
<text x="582" y="382" font-size="16" text-anchor="middle" style="fill:var(--warn)">差 3 次</text>
<text x="480" y="460" font-size="22" font-weight="700" text-anchor="middle">把握程度要對得上答案</text>
</svg>
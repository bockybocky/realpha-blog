<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="下跌的階梯上有兩個成本點，一個在高處距離現價很遠，一個就在底部">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="66" font-size="27" fill="var(--ink)">同一根跌停，兩個成本位置</text>
  <rect x="60" y="100" width="840" height="340" rx="16" fill="var(--card)" stroke="var(--line)"/>
  <path d="M140 170 L260 170 L260 240 L380 240 L380 310 L500 310 L500 380 L620 380 L620 420 L860 420" fill="none" stroke="var(--grey)" stroke-width="6"/>
  <line x1="140" y1="420" x2="860" y2="420" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="866" y="414" font-size="15" fill="var(--dim)">現價</text>
  <circle cx="160" cy="170" r="22" fill="var(--warn)"/>
  <line x1="160" y1="192" x2="160" y2="420" stroke="var(--warn)" stroke-width="3" stroke-dasharray="5 6"/>
  <text x="188" y="162" font-size="20" fill="var(--warn)">山頂大部位</text>
  <text x="188" y="190" font-size="15" fill="var(--dim)">距離現價很遠</text>
  <circle cx="700" cy="420" r="10" fill="var(--accent)"/>
  <text x="640" y="470" font-size="20" fill="var(--accent)">跌停那天進場</text>
  <text x="640" y="498" font-size="15" fill="var(--dim)">成本就在腳下</text>
</svg>
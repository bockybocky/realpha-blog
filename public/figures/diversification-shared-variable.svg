<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="四個不同產業的方框各自獨立，四條線往下收斂到同一根共用底座" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="56" font-size="27" fill="var(--ink)">產業欄位不同，底下同一根柱</text>

  <rect x="90" y="110" width="150" height="72" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="300" y="110" width="150" height="72" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="510" y="110" width="150" height="72" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="720" y="110" width="150" height="72" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="165" y="154" font-size="16" fill="var(--ink)" text-anchor="middle">半導體</text>
  <text x="375" y="154" font-size="16" fill="var(--ink)" text-anchor="middle">醫材</text>
  <text x="585" y="154" font-size="16" fill="var(--ink)" text-anchor="middle">軟體</text>
  <text x="795" y="154" font-size="16" fill="var(--ink)" text-anchor="middle">包材</text>

  <path d="M165,182 L480,300" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M375,182 L480,300" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M585,182 L480,300" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M795,182 L480,300" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="300" y="300" width="360" height="92" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="480" y="340" font-size="20" fill="var(--accent)" text-anchor="middle">同一個底層變數</text>
  <text x="480" y="368" font-size="15" fill="var(--dim)" text-anchor="middle">資本支出　航線　匯率　利率假設</text>

  <text x="60" y="452" font-size="22" fill="var(--ink)">它出事，四個一起壞</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Long-tail distribution: the top 1% usage bar is extremely tall, the rest are nearly flat, and the average sits on the flat side.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Broad but shallow</text>
<text x="60" y="94" font-size="16" fill="var(--dim)">Spend per employee per month · Source: Ramp (startup-skewed)</text>
<line x1="120" y1="420" x2="900" y2="420" stroke="var(--grey)" stroke-width="2"/>
<rect x="128" y="150" width="34" height="270" fill="var(--warn)"/>
<rect x="170" y="372" width="30" height="48" fill="var(--grey)"/>
<rect x="206" y="392" width="30" height="28" fill="var(--grey)"/>
<rect x="242" y="400" width="30" height="20" fill="var(--grey)"/>
<rect x="278" y="406" width="30" height="14" fill="var(--grey)"/>
<rect x="314" y="409" width="30" height="11" fill="var(--grey)"/>
<rect x="350" y="411" width="30" height="9" fill="var(--grey)"/>
<rect x="386" y="412" width="30" height="8" fill="var(--grey)"/>
<rect x="422" y="413" width="30" height="7" fill="var(--grey)"/>
<rect x="458" y="414" width="30" height="6" fill="var(--grey)"/>
<rect x="494" y="414" width="30" height="6" fill="var(--grey)"/>
<rect x="530" y="415" width="30" height="5" fill="var(--grey)"/>
<rect x="566" y="415" width="30" height="5" fill="var(--grey)"/>
<rect x="602" y="416" width="30" height="4" fill="var(--grey)"/>
<rect x="638" y="416" width="30" height="4" fill="var(--grey)"/>
<rect x="674" y="416" width="30" height="4" fill="var(--grey)"/>
<rect x="710" y="417" width="30" height="3" fill="var(--grey)"/>
<rect x="746" y="417" width="30" height="3" fill="var(--grey)"/>
<rect x="782" y="417" width="30" height="3" fill="var(--grey)"/>
<rect x="818" y="417" width="30" height="3" fill="var(--grey)"/>
<rect x="854" y="418" width="30" height="2" fill="var(--grey)"/>
<text x="128" y="138" font-size="19" fill="var(--warn)">$10k-15k</text>
<text x="128" y="446" font-size="16" fill="var(--dim)">Top 1%</text>
<line x1="120" y1="408" x2="900" y2="408" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="640" y="398" font-size="19" fill="var(--accent)">$15 avg</text>
<text x="60" y="500" font-size="22" fill="var(--ink)">Wide use, thin heavy use, mostly in software dev</text>
</svg>
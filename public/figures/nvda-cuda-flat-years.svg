<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="長年貼底的平線在右側陡升，陡升前那段標著被勸停的年份">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="70" font-size="27" fill="var(--ink)">護城河是在沒人在意的那幾年挖的</text>
<line x1="90" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="90" y1="140" x2="90" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="40" y="150" font-size="16" fill="var(--dim)">股價</text>
<rect x="110" y="420" width="400" height="50" fill="var(--card)"/>
<polyline points="110,442 180,436 250,448 320,432 390,446 460,434 510,440 600,400 700,320 800,220 890,150" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="120" y="400" font-size="19" fill="var(--ink)">10 到 20 美元，躺了好幾年</text>
<text x="120" y="500" font-size="16" fill="var(--dim)">換算成今天的股數，等於 25 到 50 美分</text>
<text x="120" y="528" font-size="16" fill="var(--warn)">同一段時間：大錢投進軟體生態，有人叫他停，他沒停</text>
<text x="660" y="190" font-size="20" fill="var(--ink)">後來的 CUDA</text>
<line x1="110" y1="412" x2="510" y2="412" stroke="var(--warn)" stroke-width="2"/>
</svg>
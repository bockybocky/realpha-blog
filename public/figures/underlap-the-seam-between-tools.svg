<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三塊各自獨立的工具之間有兩道縫隙讓交棒的資料掉下去，對照右邊一整塊沒有縫的平台">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">攻擊者打的是縫，不是磚</text>
<text x="60" y="118" font-size="19" fill="var(--dim)">一堆工具拼起來</text>
<rect x="60" y="150" width="128" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="228" y="150" width="128" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="396" y="150" width="128" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="124" y="200" font-size="16" fill="var(--dim)" text-anchor="middle">工具 A</text>
<text x="292" y="200" font-size="16" fill="var(--dim)" text-anchor="middle">工具 B</text>
<text x="460" y="200" font-size="16" fill="var(--dim)" text-anchor="middle">工具 C</text>
<path d="M90 193 L 184 193" stroke="var(--accent)" stroke-width="5"/>
<path d="M232 193 L 352 193" stroke="var(--accent)" stroke-width="5"/>
<path d="M400 193 L 494 193" stroke="var(--accent)" stroke-width="5"/>
<path d="M190 240 L 204 300" stroke="var(--warn)" stroke-width="4"/>
<path d="M358 240 L 372 300" stroke="var(--warn)" stroke-width="4"/>
<polygon points="198,300 212,300 205,318" fill="var(--warn)"/>
<polygon points="366,300 380,300 373,318" fill="var(--warn)"/>
<text x="292" y="352" font-size="20" fill="var(--warn)" text-anchor="middle">underlap</text>
<text x="292" y="380" font-size="16" fill="var(--dim)" text-anchor="middle">交棒那一刻</text>
<text x="560" y="118" font-size="19" fill="var(--accent)">收攏成一個平台</text>
<rect x="560" y="150" width="340" height="86" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<path d="M590 193 L 866 193" stroke="var(--accent)" stroke-width="5"/>
<text x="730" y="268" font-size="16" fill="var(--dim)" text-anchor="middle">一套代理、一套資料架構</text>
<text x="730" y="352" font-size="20" fill="var(--accent)" text-anchor="middle">沒有縫可掉</text>
<text x="60" y="500" font-size="22" fill="var(--ink)">併購拼出來的合作，縫還在</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩個街區俯視圖對比：左邊街區中間有巷弄，垃圾在巷弄裡；右邊街區沒有巷弄，垃圾被推到臨街人行道。">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" fill="var(--ink)">街區背面有沒有地方放</text>
<text x="60" y="92" font-size="16" fill="var(--dim)">俯視同樣密度的一個街區</text>

<text x="60" y="124" font-size="20" fill="var(--dim)">芝加哥</text>
<rect x="60" y="138" width="380" height="30" fill="var(--grey)" opacity="0.35"/>
<rect x="60" y="168" width="380" height="18" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="186" width="380" height="76" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="262" width="380" height="42" fill="var(--page)" stroke="var(--line)" stroke-dasharray="6 4"/>
<rect x="60" y="304" width="380" height="76" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="380" width="380" height="18" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="398" width="380" height="30" fill="var(--grey)" opacity="0.35"/>
<g fill="var(--accent)">
<rect x="96" y="272" width="26" height="22" rx="6"/>
<rect x="150" y="272" width="26" height="22" rx="6"/>
<rect x="232" y="272" width="26" height="22" rx="6"/>
<rect x="310" y="272" width="26" height="22" rx="6"/>
<rect x="378" y="272" width="26" height="22" rx="6"/>
</g>
<text x="70" y="210" font-size="15" fill="var(--dim)">建築</text>
<text x="70" y="328" font-size="15" fill="var(--dim)">建築</text>
<text x="252" y="252" font-size="16" fill="var(--accent)">巷弄</text>
<text x="70" y="420" font-size="15" fill="var(--dim)">街道</text>

<text x="520" y="124" font-size="20" fill="var(--dim)">紐約</text>
<rect x="520" y="138" width="380" height="30" fill="var(--grey)" opacity="0.35"/>
<rect x="520" y="168" width="380" height="34" fill="var(--card)" stroke="var(--line)"/>
<rect x="520" y="202" width="380" height="90" fill="var(--card)" stroke="var(--line)"/>
<line x1="520" y1="292" x2="900" y2="292" stroke="var(--ink)" stroke-width="2"/>
<rect x="520" y="292" width="380" height="90" fill="var(--card)" stroke="var(--line)"/>
<rect x="520" y="382" width="380" height="34" fill="var(--card)" stroke="var(--line)"/>
<rect x="520" y="416" width="380" height="30" fill="var(--grey)" opacity="0.35"/>
<g fill="var(--warn)">
<rect x="548" y="174" width="26" height="22" rx="6"/>
<rect x="594" y="174" width="26" height="22" rx="6"/>
<rect x="640" y="174" width="26" height="22" rx="6"/>
<rect x="700" y="174" width="26" height="22" rx="6"/>
<rect x="760" y="174" width="26" height="22" rx="6"/>
<rect x="820" y="174" width="26" height="22" rx="6"/>
<rect x="560" y="388" width="26" height="22" rx="6"/>
<rect x="620" y="388" width="26" height="22" rx="6"/>
<rect x="690" y="388" width="26" height="22" rx="6"/>
<rect x="770" y="388" width="26" height="22" rx="6"/>
<rect x="840" y="388" width="26" height="22" rx="6"/>
</g>
<text x="530" y="232" font-size="15" fill="var(--dim)">建築</text>
<text x="530" y="322" font-size="15" fill="var(--dim)">建築</text>
<text x="672" y="310" font-size="16" fill="var(--ink)">背對背・沒有巷弄</text>
<text x="530" y="438" font-size="15" fill="var(--dim)">街道</text>
<text x="604" y="166" font-size="16" fill="var(--warn)">人行道</text>

<text x="60" y="500" font-size="22" fill="var(--ink)">同樣的密度，差別只在背面那條縫</text>
<text x="60" y="530" font-size="16" fill="var(--dim)">沒有那條縫，垃圾往前面去</text>
</g>
</svg>
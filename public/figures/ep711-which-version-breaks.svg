<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左邊五級階梯越爬越高，第五級換成警示色並往上拉出一條線代表維護不了整個重來；右邊一條平整的長條配一個簽名圈，代表外包版本不隨版本升高而崩">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="56">自己做撐到第幾版</text>
  <text class="g" x="80" y="120">自己做</text>
  <rect x="80" y="380" width="56" height="40" fill="var(--accent)"/>
  <text class="b" x="92" y="446">v1</text>
  <rect x="146" y="370" width="56" height="50" fill="var(--accent)"/>
  <text class="b" x="158" y="446">v2</text>
  <rect x="212" y="356" width="56" height="64" fill="var(--accent)"/>
  <text class="b" x="224" y="446">v3</text>
  <rect x="278" y="334" width="56" height="86" fill="var(--accent)"/>
  <text class="b" x="290" y="446">v4</text>
  <rect x="344" y="300" width="56" height="120" fill="var(--warn)"/>
  <text class="b" x="356" y="446">v5</text>
  <path d="M374 296 L430 190" stroke="var(--warn)" stroke-width="3" fill="none"/>
  <text class="b" x="366" y="176">維護不了，整個重來</text>
  <line x1="60" y1="420" x2="490" y2="420" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="80" y="484">出事也是自己扛</text>
  <text class="g" x="600" y="120">外包</text>
  <rect x="600" y="300" width="280" height="120" fill="var(--accent)"/>
  <text class="b" x="612" y="446">v1 到 v5 同一條線</text>
  <line x1="560" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
  <circle cx="860" cy="270" r="18" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="b" x="760" y="276">可簽約、可歸責</text>
  <text class="c" x="60" y="546">第一版誰都做得出來，第五版才分得出差別</text>
</svg>
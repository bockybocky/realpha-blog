<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two stacked bars flipping from an even training and inference split to inference taking more than half.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--dim); }
.b { font-size:16px; fill:var(--ink); }
.s { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">The weight shifts from training to inference</text>

<text class="g" x="60" y="205">Eighteen months ago</text>
<rect x="240" y="170" width="300" height="56" fill="var(--card)" stroke="var(--line)"/>
<rect x="540" y="170" width="300" height="56" fill="var(--accent)"/>
<text class="b" x="264" y="205" fill="var(--dim)">Training</text>
<text class="b" x="564" y="205" fill="var(--page)">Inference</text>

<text class="g" x="60" y="315">Today</text>
<rect x="240" y="280" width="230" height="56" fill="var(--card)" stroke="var(--line)"/>
<rect x="470" y="280" width="370" height="56" fill="var(--accent)"/>
<text class="b" x="264" y="315" fill="var(--dim)">Training</text>
<text class="b" x="494" y="315" fill="var(--page)">Inference</text>

<rect x="240" y="392" width="20" height="20" fill="var(--card)" stroke="var(--line)"/>
<text class="s" x="270" y="408">Training　a one-off capital cost</text>
<rect x="560" y="392" width="20" height="20" fill="var(--accent)"/>
<text class="s" x="590" y="408">Inference　an operating cost that tracks usage</text>

<text class="c" x="60" y="470">Built once and done, now paid every day</text>
</svg>
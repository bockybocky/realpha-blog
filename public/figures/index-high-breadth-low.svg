<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="指數線往上到新高，下方長條七成灰色代表跌破兩百日均線">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
 svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
       --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
 @media (prefers-color-scheme: dark) {
   svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
         --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
 }
 text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
 .h{font-size:27px;font-weight:700}
 .g{font-size:19px;fill:var(--dim)}
 .b{font-size:16px;fill:var(--dim)}
 .c{font-size:22px;font-weight:700}
</style>
<text class="h" x="60" y="56">指數在上面，成分在下面</text>
<rect x="60" y="96" width="840" height="230" rx="10" fill="var(--card)" stroke="var(--line)"/>
<polyline points="100,290 180,252 260,266 340,206 420,196 500,150 580,160 660,124 740,112 820,86" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="820" cy="86" r="8" fill="var(--accent)"/>
<text class="g" x="100" y="134">指數</text>
<text class="b" x="700" y="72">新高</text>
<rect x="60" y="392" width="588" height="80" fill="var(--grey)"/>
<rect x="648" y="392" width="252" height="80" fill="var(--accent)"/>
<text class="g" x="80" y="440" fill="var(--page)">七成以上</text>
<text class="b" x="80" y="500">跌破兩百日均線</text>
<text class="b" x="668" y="500">不到三成 在均線上方</text>
<text class="c" x="60" y="542">同一天，兩個方向</text>
</svg>
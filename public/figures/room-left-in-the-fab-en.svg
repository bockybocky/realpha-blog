<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Two fab outlines of equal size, the left half filled with room to spare and the right nearly full, labelled below with expansion of forty percent and twenty-five percent.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .n { font-size:34px; font-weight:700; fill:var(--ink); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text class="t" x="60" y="62">Expansion needs empty floor</text>
  <text class="b" x="60" y="94">No new fabs-capacity raised in place</text>
  <text class="g" x="120" y="150">HDD fab</text>
  <text class="g" x="600" y="150">DRAM</text>
  <rect x="120" y="170" width="240" height="260" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
  <rect x="120" y="300" width="240" height="130" fill="var(--grey)"/>
  <rect x="600" y="170" width="240" height="260" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
  <rect x="600" y="196" width="240" height="234" fill="var(--grey)"/>
  <text class="b" x="144" y="236">Room</text>
  <text class="b" x="624" y="186">Full</text>
  <text class="n" x="120" y="486" fill="var(--accent)">+40%</text>
  <text class="n" x="600" y="486">+25%</text>
  <text class="b" x="120" y="516">Room and staff spare</text>
  <text class="b" x="600" y="516">Up next: new fab</text>
  <text class="c" x="60" y="566">Cheap to add, costly to exit</text>
</svg>
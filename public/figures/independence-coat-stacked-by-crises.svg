<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="危機一層層把央行職能疊高成階梯，一件越拉越寬的獨立性外衣罩住整疊，只有最底層有厚實根據">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">權力一層層疊，外衣跟著越拉越寬</text>

<path d="M150 440 L150 150 C 150 110, 820 110, 820 150 L820 440 Z" fill="var(--grey)" opacity="0.22"/>
<path d="M150 440 L150 150 C 150 110, 820 110, 820 150 L820 440" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="485" y="146" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">「獨立性」外衣：模糊而超載</text>

<rect x="180" y="386" width="300" height="54" rx="8" fill="var(--accent)" opacity="0.2"/>
<rect x="180" y="386" width="300" height="54" rx="8" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="200" y="420" font-size="19" font-weight="700" fill="var(--accent)">貨幣價值｜時間不一致</text>
<text x="500" y="420" font-size="16" fill="var(--dim)">原本的根據在這一層</text>

<rect x="180" y="322" width="420" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text x="200" y="356" font-size="19" fill="var(--ink)">2008｜緊急貸放</text>
<text x="620" y="356" font-size="16" fill="var(--dim)">快解</text>

<rect x="180" y="258" width="540" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text x="200" y="292" font-size="19" fill="var(--ink)">歐元區危機｜資產負債表政策</text>
<text x="740" y="292" font-size="16" fill="var(--dim)">快解</text>

<rect x="180" y="194" width="640" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text x="200" y="228" font-size="19" fill="var(--ink)">COVID｜量化寬鬆、信用工具</text>

<text x="60" y="520" font-size="22" font-weight="700" fill="var(--ink)">根據只蓋住最底層，外衣蓋住全部</text>
</svg>
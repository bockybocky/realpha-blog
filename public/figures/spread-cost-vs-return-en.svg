<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars of very different heights: the low one is the signed borrowing cost and the tall one is the estimated investment return, with the gap between them marked.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); font-weight:700; }
  .g { font-size:20px; fill:var(--ink); font-weight:700; }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="70" y="62">The gap: price of borrowing vs. a self-estimated return</text>
<line x1="70" y1="430" x2="890" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="190" y="340" width="150" height="90" fill="var(--grey)" rx="4"/>
<text class="g" x="190" y="322">6%</text>
<text class="b" x="190" y="454">Borrowing cost</text>
<text class="b" x="190" y="478">Signed, paid each period</text>
<rect x="600" y="175" width="150" height="255" fill="var(--accent)" rx="4"/>
<rect x="600" y="130" width="150" height="45" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5" rx="4"/>
<text class="g" x="600" y="112">15-20%</text>
<text class="b" x="600" y="462">Investment return</text>
<text class="b" x="600" y="486">Est., self-reported</text>
<line x1="430" y1="340" x2="430" y2="175" stroke="var(--ink)" stroke-width="2"/>
<path d="M430 175 l-7 14 h14 z" fill="var(--ink)"/>
<path d="M430 340 l-7 -14 h14 z" fill="var(--ink)"/>
<text class="g" x="446" y="252">spread</text>
<text class="b" x="446" y="278">All the weight of the bull case</text>
<text class="c" x="70" y="512">Wide gap, but two numbers of unequal hardness</text>
</svg>

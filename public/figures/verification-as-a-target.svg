<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="靶心清楚時腳印一步步收斂到中心，靶心模糊時腳印在外圍四散打轉">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" fill="var(--ink)">它要知道自己有沒有靠近</text>
<circle cx="280" cy="280" r="130" fill="none" stroke="var(--line)" stroke-width="3"/>
<circle cx="280" cy="280" r="85" fill="none" stroke="var(--line)" stroke-width="3"/>
<circle cx="280" cy="280" r="40" fill="var(--accent)"/>
<circle cx="90" cy="420" r="9" fill="var(--grey)"/>
<circle cx="146" cy="382" r="9" fill="var(--grey)"/>
<circle cx="196" cy="344" r="9" fill="var(--grey)"/>
<circle cx="240" cy="310" r="9" fill="var(--accent)"/>
<text x="150" y="476" font-size="20" fill="var(--ink)">驗證清楚</text>
<line x1="490" y1="110" x2="490" y2="440" stroke="var(--line)" stroke-width="2"/>
<circle cx="740" cy="280" r="130" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 14"/>
<circle cx="740" cy="280" r="60" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="4 18"/>
<circle cx="586" cy="200" r="9" fill="var(--warn)"/>
<circle cx="672" cy="146" r="9" fill="var(--warn)"/>
<circle cx="620" cy="396" r="9" fill="var(--warn)"/>
<circle cx="862" cy="356" r="9" fill="var(--warn)"/>
<circle cx="884" cy="190" r="9" fill="var(--warn)"/>
<text x="624" y="476" font-size="20" fill="var(--ink)">驗證模糊</text>
</svg>
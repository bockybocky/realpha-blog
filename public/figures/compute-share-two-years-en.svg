<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The top bar is almost entirely one company; the bottom bar is split into three parts plus a small slice.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">Announced compute deals, by share</text>
<text x="60" y="140" font-size="20" fill="var(--dim)">Two years ago</text>
<rect x="60" y="160" width="840" height="76" fill="var(--card)"/>
<rect x="60" y="160" width="714" height="76" fill="var(--accent)"/>
<rect x="714" y="160" width="84" height="76" fill="var(--accent)" opacity="0.45"/>
<text x="80" y="208" font-size="20" fill="var(--page)">NVIDIA 80-90%</text>
<text x="60" y="320" font-size="20" fill="var(--dim)">Now</text>
<rect x="60" y="340" width="840" height="76" fill="var(--card)"/>
<rect x="60" y="340" width="235" height="76" fill="var(--accent)"/>
<rect x="295" y="340" width="193" height="76" fill="var(--grey)"/>
<rect x="488" y="340" width="151" height="76" fill="var(--grey)" opacity="0.6"/>
<text x="80" y="388" font-size="20" fill="var(--page)">NVIDIA 28%</text>
<text x="315" y="388" font-size="19" fill="var(--ink)">Broadcom 23%</text>
<text x="508" y="388" font-size="19" fill="var(--ink)">AMD 18%</text>
<text x="659" y="388" font-size="19" fill="var(--dim)">Others</text>
<text x="60" y="486" font-size="22" fill="var(--ink)">Good numbers and pricing power left are two different things</text>
</svg>
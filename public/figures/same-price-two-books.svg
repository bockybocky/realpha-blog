<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="左格長條超過一條上限虛線，右格同一筆成本被切成五等份">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">同一個漲價，兩本帳</text>
<rect x="60" y="110" width="400" height="360" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="84" y="152" font-size="20" font-weight="700" fill="var(--ink)">手機／筆電</text>
<text x="84" y="180" font-size="15" fill="var(--dim)">記憶體佔成本</text>
<line x1="100" y1="430" x2="440" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="120" y="373" width="80" height="57" rx="4" fill="var(--grey)"/>
<rect x="280" y="232" width="80" height="198" rx="4" fill="var(--accent)"/>
<line x1="100" y1="342" x2="440" y2="342" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="440" y="334" font-size="15" text-anchor="end" fill="var(--warn)">毛利率上限 20%</text>
<text x="160" y="454" font-size="15" text-anchor="middle" fill="var(--ink)">之前 10～15%</text>
<text x="320" y="454" font-size="15" text-anchor="middle" fill="var(--ink)">現在 40～50%</text>
<rect x="500" y="110" width="400" height="360" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="524" y="152" font-size="20" font-weight="700" fill="var(--ink)">伺服器／資料中心</text>
<text x="524" y="180" font-size="15" fill="var(--dim)">毛利五成起跳</text>
<text x="524" y="234" font-size="16" fill="var(--ink)">同一筆成本 → 攤五年</text>
<rect x="524" y="256" width="64" height="64" rx="6" fill="var(--accent)"/>
<rect x="600" y="256" width="64" height="64" rx="6" fill="var(--accent)"/>
<rect x="676" y="256" width="64" height="64" rx="6" fill="var(--accent)"/>
<rect x="752" y="256" width="64" height="64" rx="6" fill="var(--accent)"/>
<rect x="828" y="256" width="52" height="64" rx="6" fill="var(--accent)"/>
<text x="556" y="344" font-size="15" text-anchor="middle" fill="var(--dim)">年1</text>
<text x="632" y="344" font-size="15" text-anchor="middle" fill="var(--dim)">年2</text>
<text x="708" y="344" font-size="15" text-anchor="middle" fill="var(--dim)">年3</text>
<text x="784" y="344" font-size="15" text-anchor="middle" fill="var(--dim)">年4</text>
<text x="854" y="344" font-size="15" text-anchor="middle" fill="var(--dim)">年5</text>
<text x="524" y="410" font-size="16" fill="var(--ink)">算 ROI，不算當期費用</text>
<rect x="60" y="500" width="840" height="72" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="545" font-size="22" text-anchor="middle" fill="var(--ink)">一邊吃掉利潤，一邊攤成資產</text>
</svg>
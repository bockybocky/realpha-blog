<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="中央資金池，右側一根粗管抽走大量資金，左側四根細管競爭剩下的，上方箭頭表示價格被推高。">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--ink); }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="h" x="60" y="60">同一個資金池，不同的抽水量</text>
<rect x="352" y="232" width="256" height="176" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="480" y="330" text-anchor="middle">同一個資金池</text>
<rect x="608" y="286" width="212" height="52" fill="var(--accent)"/>
<path d="M820,262 L880,312 L820,362 Z" fill="var(--accent)"/>
<text class="g" x="614" y="264">AI 資料中心</text>
<text class="b" x="614" y="392">願意付 8%</text>
<rect x="196" y="248" width="156" height="15" fill="var(--grey)"/>
<rect x="196" y="288" width="156" height="15" fill="var(--grey)"/>
<rect x="196" y="328" width="156" height="15" fill="var(--grey)"/>
<rect x="196" y="368" width="156" height="15" fill="var(--grey)"/>
<path d="M196,240 L166,255.5 L196,271 Z" fill="var(--grey)"/>
<path d="M196,280 L166,295.5 L196,311 Z" fill="var(--grey)"/>
<path d="M196,320 L166,335.5 L196,351 Z" fill="var(--grey)"/>
<path d="M196,360 L166,375.5 L196,391 Z" fill="var(--grey)"/>
<text class="b" x="156" y="261" text-anchor="end">政府</text>
<text class="b" x="156" y="301" text-anchor="end">消費者</text>
<text class="b" x="156" y="341" text-anchor="end">電信 · 銀行</text>
<text class="b" x="156" y="381" text-anchor="end">消費品</text>
<line x1="480" y1="212" x2="480" y2="140" stroke="var(--warn)" stroke-width="3"/>
<path d="M480,128 L470,150 L490,150 Z" fill="var(--warn)"/>
<text class="g" x="502" y="152" fill="var(--warn)">資金價格</text>
<text class="c" x="60" y="500">他們沒蓋機房，卻一起付更貴的利息</text>
</svg>
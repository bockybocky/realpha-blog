<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="The scarcity curve keeps rising with a flattening slope while the valuation curve peaks and turns down while scarcity is still high.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="600" fill="var(--ink)">Valuation trades the rate of change</text>

  <line x1="110" y1="140" x2="110" y2="470" stroke="var(--line)" stroke-width="2"/>
  <line x1="110" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>

  <path d="M120,450 C 260,440 340,330 460,270 C 580,215 760,190 890,182" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
  <path d="M120,432 C 250,414 350,322 470,286 C 540,266 580,272 640,316 C 730,378 800,412 890,438" fill="none" stroke="var(--warn)" stroke-width="3.5"/>

  <line x1="500" y1="150" x2="500" y2="470" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="500" y="136" font-size="19" text-anchor="middle" fill="var(--dim)">Nearly satisfied</text>

  <text x="700" y="200" font-size="19" fill="var(--accent)">Scarcity level</text>
  <text x="720" y="400" font-size="19" fill="var(--warn)">Valuation</text>
  <text x="890" y="500" font-size="16" text-anchor="end" fill="var(--dim)">Time</text>

  <text x="480" y="552" font-size="22" text-anchor="middle" fill="var(--ink)">The level is still high when valuation turns</text>
</svg>
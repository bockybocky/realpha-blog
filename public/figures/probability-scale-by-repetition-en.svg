<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="An axis of how often something happens, where one-off events on the left are not suited to probability, events repeated thousands of times on the right are, and a dashed divider sits between them.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">Probability is a ruler that only works on repeats</text>

<rect x="70" y="100" width="340" height="200" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="100" y="140" font-size="20" fill="var(--warn)">Once in a lifetime</text>
<text x="100" y="180" font-size="16" fill="var(--ink)">An industry disrupted</text>
<text x="100" y="210" font-size="16" fill="var(--ink)">Will the company survive</text>
<text x="100" y="240" font-size="16" fill="var(--ink)">Will policy turn around</text>
<text x="100" y="280" font-size="19" fill="var(--warn)">Ask: can you take the worst case</text>

<rect x="450" y="100" width="440" height="200" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="140" font-size="20" fill="var(--accent)">Thousands of repeats</text>
<text x="480" y="180" font-size="16" fill="var(--ink)">A dice roll</text>
<text x="480" y="210" font-size="16" fill="var(--ink)">Weekly settlement</text>
<text x="480" y="240" font-size="16" fill="var(--ink)">Insurance claims</text>
<text x="480" y="280" font-size="19" fill="var(--accent)">Use probability: find the history</text>

<line x1="430" y1="100" x2="430" y2="398" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>

<line x1="70" y1="380" x2="880" y2="380" stroke="var(--line)" stroke-width="3"/>
<polygon points="880,372 900,380 880,388" fill="var(--line)"/>
<text x="905" y="386" font-size="16" fill="var(--dim)" text-anchor="end"></text>

<circle cx="140" cy="380" r="8" fill="var(--warn)"/>
<circle cx="300" cy="380" r="8" fill="var(--warn)"/>
<circle cx="580" cy="380" r="8" fill="var(--accent)"/>
<circle cx="820" cy="380" r="8" fill="var(--accent)"/>

<text x="140" y="412" font-size="16" fill="var(--ink)" text-anchor="middle">Once</text>
<text x="140" y="434" font-size="15" fill="var(--dim)" text-anchor="middle">1 time</text>
<text x="300" y="412" font-size="16" fill="var(--ink)" text-anchor="middle">Disruption</text>
<text x="300" y="434" font-size="15" fill="var(--dim)" text-anchor="middle">9 times</text>
<text x="580" y="412" font-size="16" fill="var(--ink)" text-anchor="middle">My decision cards</text>
<text x="580" y="434" font-size="15" fill="var(--dim)" text-anchor="middle">113 times</text>
<text x="820" y="412" font-size="16" fill="var(--ink)" text-anchor="middle">TAIEX settlement</text>
<text x="820" y="434" font-size="15" fill="var(--dim)" text-anchor="middle">Hundreds</text>

<text x="480" y="490" font-size="22" fill="var(--ink)" text-anchor="middle">Dice</text>
</svg>
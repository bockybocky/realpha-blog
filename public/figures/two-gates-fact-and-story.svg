<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一支箭頭代表快訊，順利穿過第一道標著事實的閘門，卻在第二道標著故事的閘門前被擋下。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">一則快訊要過兩道閘</text>

  <text class="t" x="60" y="236" font-size="19" fill="var(--dim)">快訊</text>
  <line x1="60" y1="260" x2="420" y2="260" stroke="var(--accent)" stroke-width="5"/>
  <path d="M420 244 L452 260 L420 276 Z" fill="var(--accent)"/>

  <line x1="380" y1="140" x2="380" y2="212" stroke="var(--accent)" stroke-width="4"/>
  <line x1="380" y1="308" x2="380" y2="380" stroke="var(--accent)" stroke-width="4"/>
  <text class="t" x="380" y="120" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">第一層　事實</text>
  <text class="t" x="380" y="414" font-size="16" fill="var(--dim)" text-anchor="middle">數字對不對、出自哪份文件</text>

  <line x1="620" y1="140" x2="620" y2="380" stroke="var(--warn)" stroke-width="8"/>
  <text class="t" x="640" y="120" font-size="20" font-weight="700" fill="var(--warn)">第二層　故事</text>
  <text class="t" x="640" y="414" font-size="16" fill="var(--dim)">被挖出來的，還是公司自己講過的</text>
  <line x1="470" y1="236" x2="500" y2="284" stroke="var(--warn)" stroke-width="4"/>
  <line x1="500" y1="236" x2="470" y2="284" stroke="var(--warn)" stroke-width="4"/>

  <line x1="48" y1="452" x2="912" y2="452" stroke="var(--line)"/>
  <text class="t" x="48" y="494" font-size="22" font-weight="700" fill="var(--ink)">讓人緊張的，通常是第二層</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="晶片設計流程鏈前半段被模型覆蓋，中段被一道名為驗證的厚牆擋住">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>

<text x="70" y="62" font-size="27" font-weight="700" fill="var(--ink)">設計流程裡，模型走到哪一步停住</text>

<rect x="70" y="160" width="150" height="96" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="145" y="215" font-size="20" fill="var(--ink)" text-anchor="middle">規格</text>

<line x1="228" y1="208" x2="262" y2="208" stroke="var(--grey)" stroke-width="3"/>
<polygon points="262,202 276,208 262,214" fill="var(--grey)"/>

<rect x="284" y="160" width="150" height="96" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="359" y="205" font-size="20" fill="var(--ink)" text-anchor="middle">RTL</text>
<text x="359" y="232" font-size="15" fill="var(--dim)" text-anchor="middle">資料怎麼流</text>

<rect x="470" y="120" width="34" height="200" rx="4" fill="var(--warn)"/>
<text x="487" y="104" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">驗證</text>
<text x="487" y="350" font-size="16" fill="var(--warn)" text-anchor="middle">哪裡會壞</text>

<line x1="440" y1="208" x2="462" y2="208" stroke="var(--accent)" stroke-width="3"/>
<polygon points="462,202 476,208 462,214" fill="var(--accent)"/>

<rect x="560" y="160" width="150" height="96" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="635" y="215" font-size="20" fill="var(--grey)" text-anchor="middle">邏輯閘</text>

<line x1="718" y1="208" x2="752" y2="208" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 6"/>
<polygon points="752,202 766,208 752,214" fill="var(--grey)"/>

<rect x="774" y="160" width="130" height="96" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="839" y="215" font-size="20" fill="var(--grey)" text-anchor="middle">流片</text>

<path d="M70 288 L70 304 L434 304 L434 288" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="252" y="330" font-size="19" fill="var(--accent)" text-anchor="middle">模型已經寫得出來</text>

<text x="70" y="452" font-size="22" font-weight="700" fill="var(--ink)">產出，不等於判斷</text>
</svg>
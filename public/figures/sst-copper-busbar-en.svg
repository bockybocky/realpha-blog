<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="At the same power, the low-voltage busbar is very thick and the high-voltage one is a thin strip">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink) }
    .grp { font-size:20px; font-weight:600; fill:var(--ink) }
    .sml { font-size:15px; fill:var(--dim) }
    .box { font-size:16px; fill:var(--ink) }
    .cnc { font-size:22px; font-weight:600; fill:var(--accent) }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="ttl" x="60" y="64">Raise the voltage and the copper gets thin</text>
  <text class="sml" x="480" y="108" text-anchor="middle">Same rack, 1 MW</text>

  <text class="grp" x="280" y="178" text-anchor="middle">54 V</text>
  <rect x="110" y="200" width="340" height="110" rx="6" fill="var(--grey)"/>
  <text class="box" x="280" y="262" text-anchor="middle">High current</text>
  <text class="sml" x="280" y="352" text-anchor="middle">Busbar about 200 kg</text>

  <text class="grp" x="700" y="228" text-anchor="middle" fill="var(--accent)">800 V</text>
  <rect x="530" y="247" width="340" height="16" rx="4" fill="var(--accent)"/>
  <text class="sml" x="700" y="292" text-anchor="middle">Low current</text>
  <text class="sml" x="700" y="352" text-anchor="middle">Same power, far less copper</text>

  <text class="cnc" x="480" y="452" text-anchor="middle">Not "could be better" but physically out of road</text>
</svg>
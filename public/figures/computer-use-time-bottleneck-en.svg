<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A long time bar sits on top and a bar about three times shorter sits below, mostly filled by structure reading and text recognition, with the decision taking only a small slice at the end.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<defs><marker id="f6ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker></defs>
<text x="40" y="58" font-size="27" font-weight="700">Deciding is instant; reading pages is slow</text>
<text x="180" y="194" font-size="19" text-anchor="end">Claude Opus</text>
<rect x="200" y="165" width="720" height="44" rx="6" fill="var(--grey)"/>
<text x="560" y="194" font-size="16" text-anchor="middle">See screen + reason</text>
<text x="180" y="304" font-size="19" text-anchor="end">Jev system</text>
<rect x="200" y="275" width="96" height="44" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="248" y="304" font-size="16" text-anchor="middle">Read structure</text>
<rect x="296" y="275" width="124" height="44" fill="var(--grey)"/>
<text x="358" y="304" font-size="16" text-anchor="middle">OCR</text>
<rect x="420" y="275" width="16" height="44" fill="var(--accent)"/>
<line x1="428" y1="252" x2="428" y2="270" stroke="var(--accent)" stroke-width="2"/>
<text x="428" y="244" font-size="16" font-weight="700" text-anchor="middle" style="fill:var(--accent)">Jev decides</text>
<text x="462" y="305" font-size="20" font-weight="700" style="fill:var(--accent)">Only ~3x faster</text>
<line x1="200" y1="370" x2="916" y2="370" stroke="var(--dim)" stroke-width="1.5" marker-end="url(#f6ah)"/>
<text x="200" y="396" font-size="16" style="fill:var(--dim)">Time</text>
<text x="920" y="400" font-size="15" text-anchor="end" style="fill:var(--dim)">Lengths illustrative</text>
<text x="480" y="470" font-size="22" font-weight="700" text-anchor="middle">The slowest step sets the pace</text>
</svg>
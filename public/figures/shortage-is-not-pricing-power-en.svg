<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three gates stand between shortage and profit, and one of them is closed.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700">Three gates sit between shortage and profit</text>

<rect x="60" y="180" width="130" height="90" rx="10" fill="var(--accent)"/>
<text x="84" y="232" font-size="19" fill="var(--page)" font-weight="700">Shortage</text>

<line x1="190" y1="225" x2="300" y2="225" stroke="var(--accent)" stroke-width="6"/>
<rect x="300" y="150" width="20" height="150" fill="var(--grey)"/>
<text x="272" y="330" font-size="19" font-weight="700">Margin</text>

<line x1="320" y1="225" x2="470" y2="225" stroke="var(--accent)" stroke-width="6"/>
<rect x="470" y="150" width="20" height="150" fill="var(--warn)"/>
<rect x="470" y="150" width="20" height="150" fill="var(--warn)"/>
<text x="442" y="330" font-size="19" font-weight="700">Long contracts</text>
<text x="426" y="358" font-size="16" fill="var(--warn)">May lock it in</text>

<line x1="490" y1="225" x2="640" y2="225" stroke="var(--grey)" stroke-width="6" stroke-dasharray="10 10"/>
<rect x="640" y="150" width="20" height="150" fill="var(--grey)"/>
<text x="596" y="330" font-size="19" font-weight="700">Into your pocket</text>

<line x1="660" y1="225" x2="770" y2="225" stroke="var(--grey)" stroke-width="6" stroke-dasharray="10 10"/>
<rect x="770" y="180" width="130" height="90" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="794" y="232" font-size="19" font-weight="700">Profit</text>

<text x="60" y="440" font-size="22" font-weight="700">A tight market and pricing power are two different things</text>
</svg>
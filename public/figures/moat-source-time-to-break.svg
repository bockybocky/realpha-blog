<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="護城河來源依失效所需時間排在一條軸上，靠規定的那種落在最右端的兩秒處">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">這道護城河多久能被拿走</text>

<line x1="80" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="3"/>
<text class="t" x="80" y="345" font-size="16" fill="var(--dim)">好幾年</text>
<text class="t" x="860" y="345" font-size="16" fill="var(--warn)" text-anchor="end">兩秒</text>

<circle cx="150" cy="300" r="9" fill="var(--grey)"/>
<text class="t" x="150" y="265" font-size="19" fill="var(--ink)" text-anchor="middle">專利</text>
<circle cx="300" cy="300" r="9" fill="var(--grey)"/>
<text class="t" x="300" y="230" font-size="19" fill="var(--ink)" text-anchor="middle">轉換成本</text>
<line x1="300" y1="245" x2="300" y2="288" stroke="var(--line)" stroke-width="2"/>
<circle cx="430" cy="300" r="9" fill="var(--grey)"/>
<text class="t" x="430" y="265" font-size="19" fill="var(--ink)" text-anchor="middle">規模</text>
<circle cx="560" cy="300" r="9" fill="var(--grey)"/>
<text class="t" x="560" y="230" font-size="19" fill="var(--ink)" text-anchor="middle">網路效應</text>
<line x1="560" y1="245" x2="560" y2="288" stroke="var(--line)" stroke-width="2"/>

<circle cx="860" cy="300" r="13" fill="var(--warn)"/>
<text class="t" x="860" y="250" font-size="22" font-weight="700" fill="var(--warn)" text-anchor="middle">一份規定</text>
<line x1="860" y1="265" x2="860" y2="284" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="860" y="390" font-size="19" fill="var(--dim)" text-anchor="middle">一個人簽字</text>
<text class="t" x="860" y="418" font-size="16" fill="var(--dim)" text-anchor="middle">不會提前公告</text>

<text class="t" x="60" y="480" font-size="22" font-weight="700" fill="var(--ink)">持股的護城河那一欄，要寫清楚靠什麼維持</text>
</svg>
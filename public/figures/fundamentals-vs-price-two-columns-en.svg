<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two parallel timelines, the upper rising steadily, the lower chopping sideways, with an arrow on the right pointing at the upper track">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">Two columns, each with dates</text>
<text x="60" y="140" font-size="20" fill="var(--dim)">Fundamentals</text>
<line x1="60" y1="196" x2="860" y2="196" stroke="var(--line)" stroke-width="2"/>
<circle cx="250" cy="196" r="9" fill="var(--accent)"/>
<circle cx="500" cy="196" r="9" fill="var(--accent)"/>
<circle cx="750" cy="196" r="9" fill="var(--accent)"/>
<text x="250" y="172" font-size="16" fill="var(--ink)" text-anchor="middle">Revenue up</text>
<text x="500" y="172" font-size="16" fill="var(--ink)" text-anchor="middle">Margin flat</text>
<text x="750" y="172" font-size="16" fill="var(--ink)" text-anchor="middle">Guidance up</text>
<text x="250" y="224" font-size="15" fill="var(--dim)" text-anchor="middle">Q1</text>
<text x="500" y="224" font-size="15" fill="var(--dim)" text-anchor="middle">Q2</text>
<text x="750" y="224" font-size="15" fill="var(--dim)" text-anchor="middle">Q3</text>
<text x="60" y="300" font-size="20" fill="var(--dim)">Price</text>
<line x1="60" y1="356" x2="860" y2="356" stroke="var(--line)" stroke-width="2"/>
<polyline points="250,344 500,372 750,360" fill="none" stroke="var(--grey)" stroke-width="3"/>
<circle cx="250" cy="344" r="9" fill="var(--grey)"/>
<circle cx="500" cy="372" r="9" fill="var(--grey)"/>
<circle cx="750" cy="360" r="9" fill="var(--grey)"/>
<text x="250" y="400" font-size="15" fill="var(--dim)" text-anchor="middle">Q1</text>
<text x="500" y="400" font-size="15" fill="var(--dim)" text-anchor="middle">Q2</text>
<text x="750" y="400" font-size="15" fill="var(--dim)" text-anchor="middle">Q3</text>
<line x1="890" y1="300" x2="890" y2="210" stroke="var(--warn)" stroke-width="2"/>
<polygon points="890,196 883,214 897,214" fill="var(--warn)"/>
<text x="900" y="330" font-size="16" fill="var(--warn)" text-anchor="end">Act on this one</text>
<text x="60" y="472" font-size="22" fill="var(--ink)">Flat ≠ worse</text>
</svg>
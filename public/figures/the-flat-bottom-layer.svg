<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="堆疊面積圖，上層起伏劇烈，最底層是一條完全平直的帶">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="48" y="66" font-size="27" fill="var(--ink)">最底下那條平穩的層</text>
<polygon points="140,290 230,170 320,250 410,140 500,260 590,160 680,240 770,150 860,230 860,330 140,330" fill="var(--grey)" opacity="0.55"/>
<polygon points="140,330 230,300 320,345 410,295 500,350 590,300 680,340 770,298 860,336 860,420 140,420" fill="var(--dim)" opacity="0.45"/>
<rect x="140" y="420" width="720" height="70" fill="var(--accent)"/>
<line x1="140" y1="490" x2="860" y2="490" stroke="var(--line)"/>
<text x="600" y="206" font-size="19" fill="var(--dim)">太陽能與風</text>
<text x="600" y="382" font-size="19" fill="var(--dim)">天然氣頂上來</text>
<text x="152" y="464" font-size="19" fill="var(--page)">全天候的那一層</text>
<text x="140" y="520" font-size="16" fill="var(--dim)">白天</text>
<text x="820" y="520" font-size="16" fill="var(--dim)">夜裡</text>
<text x="48" y="552" font-size="22" fill="var(--ink)">它讓別人有彈性，自己沒被計價</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條路徑到同一終點，一條直線一條之字形折線">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
  <marker id="a10a" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto">
    <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--accent)"/>
  </marker>
  <marker id="a10w" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto">
    <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--warn)"/>
  </marker>
</defs>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">順風逆風，都到得了同一個地方</text>

<circle cx="120" cy="290" r="14" fill="var(--ink)"/>
<text x="120" y="336" font-size="16" fill="var(--dim)" text-anchor="middle">起點</text>

<path d="M150 250 L 800 190" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#a10a)"/>
<text x="440" y="196" font-size="19" font-weight="700" fill="var(--accent)">順風</text>

<path d="M150 330 L 280 400 L 380 330 L 500 400 L 600 330 L 720 396 L 800 350" fill="none" stroke="var(--warn)" stroke-width="4" marker-end="url(#a10w)"/>
<text x="420" y="446" font-size="19" font-weight="700" fill="var(--warn)">逆風：把帆索拉緊</text>

<circle cx="842" cy="270" r="18" fill="var(--page)" stroke="var(--ink)" stroke-width="4"/>
<text x="842" y="230" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">目的地</text>
<line x1="812" y1="196" x2="836" y2="252" stroke="var(--line)" stroke-width="2"/>
<line x1="812" y1="352" x2="836" y2="290" stroke="var(--line)" stroke-width="2"/>

<text x="480" y="496" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">環境變的是路線，不是能不能到</text>
</svg>
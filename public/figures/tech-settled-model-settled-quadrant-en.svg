<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A four-quadrant chart with one marked point in the lower left and one in the upper right, the other two quadrants holding only their names.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="60" y="64" font-size="27" fill="var(--ink)">Two questions before you enter</text>

  <rect x="200" y="120" width="660" height="360" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <line x1="530" y1="120" x2="530" y2="480" stroke="var(--line)" stroke-width="2"/>
  <line x1="200" y1="300" x2="860" y2="300" stroke="var(--line)" stroke-width="2"/>

  <text x="365" y="182" font-size="20" fill="var(--dim)" text-anchor="middle">Business, no tech</text>
  <text x="695" y="182" font-size="20" fill="var(--dim)" text-anchor="middle">Go ahead</text>
  <text x="365" y="440" font-size="20" fill="var(--dim)" text-anchor="middle">Research project</text>
  <text x="695" y="440" font-size="20" fill="var(--dim)" text-anchor="middle">Tech, no business</text>

  <circle cx="322" cy="366" r="9" fill="var(--warn)"/>
  <text x="340" y="372" font-size="15" fill="var(--ink)">Early 2010s . passed</text>
  <circle cx="768" cy="238" r="9" fill="var(--accent)"/>
  <text x="750" y="244" font-size="15" fill="var(--ink)" text-anchor="end">2016 . built it</text>

  <text x="530" y="516" font-size="19" fill="var(--ink)" text-anchor="middle">Is the tech settled?</text>
  <text x="212" y="504" font-size="15" fill="var(--dim)">No</text>
  <text x="848" y="504" font-size="15" fill="var(--dim)" text-anchor="end">Yes</text>
  <text x="168" y="300" font-size="19" fill="var(--ink)" text-anchor="middle" transform="rotate(-90 168 300)">Is the model settled?</text>
  <text x="184" y="474" font-size="15" fill="var(--dim)" text-anchor="end">No</text>
  <text x="184" y="136" font-size="15" fill="var(--dim)" text-anchor="end">Yes</text>

  <text x="480" y="558" font-size="22" fill="var(--ink)" text-anchor="middle">Neither settled means a research project, not a business.</text>
</svg>
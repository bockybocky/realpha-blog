<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The left panel shows a ring turning the right way, knock-out leading to a new note leading to day-one hedging being enough; in the right panel the ring is cut, the dealers' bar of volatility to offload stands tall while the bar for buyers willing to take it is very short.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">The loop turning, and the loop jammed</text>

<line x1="480" y1="100" x2="480" y2="470" stroke="var(--line)" stroke-width="2"/>

<text class="g" x="60" y="118">Early in the year</text>
<circle cx="250" cy="280" r="110" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polygon points="250,164 266,182 234,182" fill="var(--accent)"/>
<circle cx="250" cy="170" r="9" fill="var(--accent)"/>
<circle cx="345" cy="335" r="9" fill="var(--accent)"/>
<circle cx="155" cy="335" r="9" fill="var(--accent)"/>
<text class="b" x="250" y="146" text-anchor="middle">Knock-out</text>
<text class="b" x="378" y="352">New note issued</text>
<text class="b" x="138" y="352" text-anchor="end">Hedge ok</text>
<text class="b" x="250" y="288" text-anchor="middle">Virtuous loop</text>

<text class="g" x="530" y="118">By August</text>
<circle cx="618" cy="200" r="52" fill="none" stroke="var(--grey)" stroke-width="5" stroke-dasharray="14 12"/>
<line x1="586" y1="168" x2="650" y2="232" stroke="var(--warn)" stroke-width="5"/>
<text class="b" x="686" y="196">No knock-out</text>
<text class="b" x="686" y="222">Duration extends</text>

<rect x="560" y="300" width="88" height="150" rx="6" fill="var(--warn)" opacity="0.75"/>
<rect x="700" y="408" width="88" height="42" rx="6" fill="var(--grey)" opacity="0.75"/>
<line x1="540" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="604" y="482" text-anchor="middle">Vega to offload</text>
<text class="b" x="744" y="482" text-anchor="middle">Buyers willing to take it</text>
<text class="g" x="818" y="332">Supply piles</text>
<text class="b" x="818" y="358">Bids vanish</text>

<text class="c" x="60" y="528">Growth came from markets rising while positions stayed put</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On an S-shaped technology maturity curve, Android goes first at the bottom, the Vision Pro arrives too early halfway up, and the iPhone foldable comes only after crossing the mature-enough line.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">Timing beats being first</text>
<line x1="100" y1="120" x2="100" y2="480" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="480" x2="870" y2="480" stroke="var(--line)" stroke-width="2"/>
<text x="92" y="136" text-anchor="end" font-size="15" fill="var(--dim)">Maturity</text>
<text x="870" y="508" text-anchor="end" font-size="15" fill="var(--dim)">Time →</text>
<line x1="100" y1="240" x2="870" y2="240" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="108" y="230" font-size="15" fill="var(--dim)">Mature enough</text>
<path d="M100,440 C350,440 450,160 860,150" fill="none" stroke="var(--ink)" stroke-width="3"/>
<circle cx="236" cy="411" r="11" fill="var(--grey)"/>
<text x="236" y="450" text-anchor="middle" font-size="16" fill="var(--dim)">Android first</text>
<circle cx="327" cy="361" r="11" fill="var(--warn)"/>
<text x="312" y="332" text-anchor="end" font-size="16" font-weight="700" fill="var(--warn)">Vision Pro: early</text>
<circle cx="648" cy="184" r="13" fill="var(--accent)"/>
<text x="648" y="158" text-anchor="middle" font-size="19" font-weight="700" fill="var(--accent)">iPhone Fold</text>
<text x="480" y="540" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">Enter after the maturity line</text>
</svg>
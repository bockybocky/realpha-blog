<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三個光錐由窄到寬並排，數值孔徑越大，收光角越寬，頂端鏡子越長；最寬的一個是虛線，代表遙遠的未來">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="480" y="64" text-anchor="middle">NA 越大，收光角越寬，鏡子越大</text>
<rect x="119" y="286" width="102" height="12" rx="3" fill="var(--dim)"/>
<polygon points="125,300 215,300 170,430" fill="var(--dim)" fill-opacity="0.15" stroke="var(--dim)" stroke-width="2"/>
<line x1="70" y1="440" x2="270" y2="440" stroke="var(--grey)" stroke-width="4"/>
<text class="g" x="170" y="486" text-anchor="middle">NA 0.33</text>
<text class="b" x="170" y="514" text-anchor="middle">現在廠內</text>
<rect x="388" y="286" width="184" height="12" rx="3" fill="var(--accent)"/>
<polygon points="394,300 566,300 480,430" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<line x1="380" y1="440" x2="580" y2="440" stroke="var(--grey)" stroke-width="4"/>
<text class="g" x="480" y="486" text-anchor="middle">NA 0.55</text>
<text class="b" x="480" y="514" text-anchor="middle">High NA・2030 導入</text>
<rect x="637" y="286" width="306" height="12" rx="3" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="643,300 937,300 790,430" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="690" y1="440" x2="890" y2="440" stroke="var(--grey)" stroke-width="4"/>
<text class="g" x="790" y="486" text-anchor="middle" style="fill:var(--dim)">NA 0.75</text>
<text class="b" x="790" y="514" text-anchor="middle">Hyper NA・二十幾年後</text>
<text class="b" x="480" y="250" text-anchor="middle">鏡子</text>
<text class="b" x="170" y="250" text-anchor="middle">鏡子</text>
<text class="b" x="790" y="250" text-anchor="middle">鏡子</text>
</svg>
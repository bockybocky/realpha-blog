<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條政治光譜，代表參加韌性訓練的點密集堆在一端，另一端只有零星幾點">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">去上一堂防災訓練，變成在表態</text>
  <text x="60" y="116" font-size="16" fill="var(--dim)">一個點代表一位去參加訓練的人，位置是他的政治光譜</text>
  <circle cx="150" cy="200" r="9" fill="var(--accent)"/>
  <circle cx="186" cy="232" r="9" fill="var(--accent)"/>
  <circle cx="222" cy="196" r="9" fill="var(--accent)"/>
  <circle cx="168" cy="268" r="9" fill="var(--accent)"/>
  <circle cx="246" cy="248" r="9" fill="var(--accent)"/>
  <circle cx="206" cy="300" r="9" fill="var(--accent)"/>
  <circle cx="282" cy="214" r="9" fill="var(--accent)"/>
  <circle cx="262" cy="292" r="9" fill="var(--accent)"/>
  <circle cx="310" cy="262" r="9" fill="var(--accent)"/>
  <circle cx="336" cy="214" r="9" fill="var(--accent)"/>
  <circle cx="330" cy="300" r="9" fill="var(--accent)"/>
  <circle cx="376" cy="252" r="9" fill="var(--accent)"/>
  <circle cx="412" cy="292" r="9" fill="var(--accent)"/>
  <circle cx="440" cy="216" r="9" fill="var(--accent)"/>
  <circle cx="492" cy="268" r="9" fill="var(--grey)"/>
  <circle cx="586" cy="228" r="9" fill="var(--grey)"/>
  <circle cx="692" cy="286" r="9" fill="var(--grey)"/>
  <circle cx="800" cy="238" r="9" fill="var(--grey)"/>
  <line x1="150" y1="360" x2="880" y2="360" stroke="var(--line)" stroke-width="3"/>
  <text x="150" y="400" font-size="20" fill="var(--accent)">綠營支持者</text>
  <text x="742" y="400" font-size="20" fill="var(--dim)">藍營支持者</text>
  <text x="560" y="438" font-size="16" fill="var(--dim)">有人擔心這些事會激怒對岸</text>
  <text x="60" y="490" font-size="22" fill="var(--ink)">自救的能力，被當成一種身分。</text>
</svg>
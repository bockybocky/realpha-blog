<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="負債那一側被切成四塊，三塊上鎖，壓力全落在中間那一塊準備金上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink)}
.ga{font-size:19px;fill:var(--accent)}
.b{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">資產要縮，負債得跟著縮</text>
<rect x="150" y="140" width="180" height="300" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="240" y="290" text-anchor="middle">資產</text>
<path d="M100 200 L100 400" stroke="var(--accent)" stroke-width="3"/>
<path d="M100 412 L93 394 L107 394 Z" fill="var(--accent)"/>
<text class="b" x="70" y="180">想縮</text>
<path d="M350 290 L500 290" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M512 290 L496 283 L496 297 Z" fill="var(--line)"/>
<rect x="530" y="140" width="280" height="72" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="552" y="175">財政部帳戶</text>
<text class="b" x="552" y="199">叫不回</text>
<rect x="530" y="218" width="280" height="72" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="552" y="253">流通紙鈔</text>
<text class="b" x="552" y="277">收不回</text>
<rect x="530" y="296" width="280" height="106" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="ga" x="552" y="336">準備金</text>
<text class="b" x="552" y="362">付息 · 合規 · 支付</text>
<text class="b" x="552" y="386">銀行不想交</text>
<rect x="530" y="408" width="280" height="32" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="552" y="430">其他</text>
<text class="g" x="830" y="360">唯一能動</text>
<text class="c" x="60" y="510">壓力全落在同一塊上</text>
</svg>
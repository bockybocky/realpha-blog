<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="收進來的現金柱略低於花出去的柱，兩者相減在零線下方形成一塊缺口">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="64">進來的追不上出去的</text>
<rect x="60" y="100" width="840" height="340" rx="14" fill="var(--card)"/>
<line x1="110" y1="356" x2="880" y2="356" stroke="var(--line)" stroke-width="3"/>
<rect x="170" y="168" width="170" height="188" rx="6" fill="var(--accent)"/>
<text class="g" x="170" y="150" fill="var(--accent)">營運現金流</text>
<rect x="420" y="140" width="170" height="216" rx="6" fill="var(--grey)"/>
<text class="g" x="420" y="122" fill="var(--dim)">資本支出</text>
<rect x="690" y="356" width="130" height="58" rx="6" fill="var(--warn)"/>
<text class="g" x="662" y="344" fill="var(--warn)">自由現金流</text>
<text class="b" x="690" y="440">翻負</text>
<path d="M610 250 L676 250" stroke="var(--dim)" stroke-width="2"/>
<path d="M676 250 l-14 -7 v14 z" fill="var(--dim)"/>
<text class="c" x="60" y="500">獲利那一欄還在長，現金這一欄已經掉到線下</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="位置圖：左右兩陣營對峙，內容商被劈成兩半各站一邊，電腦廠完整地待在中間，兩陣營都有線指向它">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">誰喊得動，誰喊不動</text>

<line x1="480" y1="96" x2="480" y2="340" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>

<rect x="80" y="110" width="330" height="76" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="245" y="158" font-size="20" fill="var(--ink)" text-anchor="middle">MMCD 陣營</text>
<rect x="550" y="110" width="330" height="76" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="715" y="158" font-size="20" fill="var(--ink)" text-anchor="middle">SD 陣營</text>

<rect x="230" y="236" width="180" height="70" rx="8" fill="var(--grey)" opacity="0.5"/>
<rect x="550" y="236" width="180" height="70" rx="8" fill="var(--grey)" opacity="0.5"/>
<text x="320" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">內容商</text>
<text x="640" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">內容商</text>
<text x="480" y="336" font-size="15" fill="var(--warn)" text-anchor="middle">被劈成兩半</text>

<rect x="300" y="404" width="360" height="86" rx="8" fill="var(--accent)" opacity="0.85"/>
<text x="480" y="444" font-size="20" fill="var(--page)" text-anchor="middle">電腦廠</text>
<text x="480" y="472" font-size="15" fill="var(--page)" text-anchor="middle">兩邊都得賣給他</text>

<path d="M245 190 L 245 360 L 330 402" stroke="var(--dim)" stroke-width="2" fill="none"/>
<path d="M715 190 L 715 360 L 630 402" stroke="var(--dim)" stroke-width="2" fill="none"/>

<text x="60" y="534" font-size="22" fill="var(--ink)">讓步來自第三個人，不是來自對手</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="長期回收的現金與今天市場給的倍數，兩邊排序完全相反">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>svg{--page:#ffffff;--card:#f6f8fc;--line:#dde3ee;--ink:#1a212b;--dim:#57616f;--grey:#b9c2d0;--accent:#1f6feb;--warn:#d97706;}@media (prefers-color-scheme: dark){svg{--page:#0d1117;--card:#161b22;--line:#272e39;--ink:#e6edf3;--dim:#8b949e;--grey:#4a5464;--accent:#58a6ff;--warn:#d29922;}}text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}</style>
<text x="60" y="58" font-size="27" font-weight="700">兩件事要同時放在腦子裡</text>
<rect x="60" y="96" width="400" height="330" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="90" y="134" font-size="20" font-weight="700" fill="var(--dim)">長期回收的現金</text>
<line x1="96" y1="396" x2="440" y2="396" stroke="var(--line)" stroke-width="2"/>
<polyline points="110,384 190,350 270,290 350,224 424,172" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polyline points="110,356 190,308 270,276 350,262 424,256" fill="none" stroke="var(--grey)" stroke-width="5"/>
<text x="330" y="160" font-size="17" font-weight="700" fill="var(--accent)">成長 80 · 毛利 80</text>
<text x="300" y="300" font-size="17" font-weight="700" fill="var(--dim)">成長 160 · 毛利 30</text>
<rect x="500" y="96" width="400" height="330" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="530" y="134" font-size="20" font-weight="700" fill="var(--dim)">今天的倍數</text>
<line x1="530" y1="396" x2="880" y2="396" stroke="var(--line)" stroke-width="2"/>
<rect x="580" y="330" width="90" height="66" rx="5" fill="var(--accent)"/>
<text x="625" y="316" font-size="17" font-weight="700" text-anchor="middle" fill="var(--accent)">80 · 80</text>
<rect x="740" y="176" width="90" height="220" rx="5" fill="var(--grey)"/>
<text x="785" y="162" font-size="17" font-weight="700" text-anchor="middle" fill="var(--dim)">160 · 30</text>
<text x="700" y="248" font-size="19" font-weight="700" fill="var(--warn)">3 到 4 倍</text>
<text x="60" y="488" font-size="22" font-weight="700">市場不是在替今天的數字定價</text>
</svg>
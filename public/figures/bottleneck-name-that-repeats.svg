<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左欄五家持股連線到右欄的實體投入，其中三條線收斂在同一個節點上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--dim)}
.b{font-size:16px;fill:var(--ink)}
.s{font-size:15px;fill:var(--dim)}
.sa{font-size:15px;fill:var(--accent)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="h" x="60" y="54">把清單改寫成一張連連看</text>
<text class="g" x="90" y="112">我的持股</text>
<text class="g" x="640" y="112">斷掉就會停下來的東西</text>
<path d="M240,164 L640,178" fill="none" stroke="var(--grey)" stroke-width="1.5"/>
<path d="M240,164 L640,268" fill="none" stroke="var(--grey)" stroke-width="1.5"/>
<path d="M240,234 L640,358" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M240,304 L640,358" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M240,374 L640,358" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M240,444 L640,448" fill="none" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="90" y="140" width="150" height="48" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="114" y="170">持股一</text>
<rect x="90" y="210" width="150" height="48" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="114" y="240">持股二</text>
<rect x="90" y="280" width="150" height="48" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="114" y="310">持股三</text>
<rect x="90" y="350" width="150" height="48" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="114" y="380">持股四</text>
<rect x="90" y="420" width="150" height="48" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="114" y="450">持股五</text>
<rect x="640" y="150" width="230" height="56" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="666" y="185">電力</text>
<rect x="640" y="240" width="230" height="56" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="666" y="275">某一種特用材料</text>
<rect x="640" y="330" width="230" height="56" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="666" y="365">某一座封裝廠</text>
<text class="sa" x="666" y="408">三條線都指到它</text>
<rect x="640" y="420" width="230" height="56" rx="12" fill="var(--page)" stroke="var(--grey)" stroke-dasharray="6 5"/>
<text class="s" x="666" y="455">空的：瓶頸在需求端</text>
<text class="c" x="60" y="528">重複出現的那個名字，就是該追的</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Three lines turn at the same vertical divider, one falling, one surging up and one dipping, forming a simultaneous squeeze">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl{font-size:27px;fill:var(--ink);font-weight:700}
    .grp{font-size:20px;fill:var(--ink);font-weight:600}
    .bd{font-size:16px;fill:var(--dim)}
    .wn{font-size:20px;fill:var(--warn);font-weight:600}
    .cc{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="ttl" x="60" y="62">At the generation line, three things happen at once</text>
<line x1="490" y1="130" x2="490" y2="490" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="wn" x="490" y="114" text-anchor="middle">300 mm transition</text>

<text class="grp" x="100" y="146">Value of old patents</text>
<polyline points="100,165 470,165 560,220 880,220" fill="none" stroke="var(--warn)" stroke-width="3"/>

<text class="grp" x="100" y="271">New product R&amp;D spend</text>
<polyline points="100,345 430,345 560,285 880,285" fill="none" stroke="var(--accent)" stroke-width="3"/>

<text class="grp" x="100" y="396">Customer switching speed</text>
<polyline points="100,415 480,415 600,470 880,448" fill="none" stroke="var(--grey)" stroke-width="3"/>

<line x1="100" y1="490" x2="880" y2="490" stroke="var(--line)" stroke-width="2"/>
<text class="bd" x="260" y="514" text-anchor="middle">200 mm era</text>
<text class="bd" x="700" y="514" text-anchor="middle">300 mm era</text>
<text class="cc" x="60" y="556">Old-era patents don't carry over; you pay the entry fee again.</text>
</svg>
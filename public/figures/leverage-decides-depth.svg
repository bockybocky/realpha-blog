<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="無槓桿的深度柱剛好觸及跌四成的橫線，兩倍與四倍槓桿的柱明顯構不到。">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .w { font-size:19px; fill:var(--warn); font-weight:600; }
</style>
<text class="t" x="60" y="66">同樣看對，能不能撐到，槓桿先決定</text>
<text class="b" x="60" y="132">起跌點</text>
<line x1="60" y1="150" x2="900" y2="150" stroke="var(--line)" stroke-width="2"/>
<rect x="200" y="150" width="90" height="280" rx="6" fill="var(--accent)" opacity="0.85"/>
<rect x="430" y="150" width="90" height="140" rx="6" fill="var(--accent)" opacity="0.55"/>
<rect x="660" y="150" width="90" height="70" rx="6" fill="var(--accent)" opacity="0.32"/>
<line x1="120" y1="430" x2="900" y2="430" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 7"/>
<text class="w" x="120" y="462">跌四成</text>
<text class="g" x="204" y="474">無槓桿</text>
<text class="b" x="204" y="500">還撐得住</text>
<text class="g" x="434" y="318">兩倍</text>
<text class="b" x="434" y="344">半路出局</text>
<text class="g" x="664" y="248">四倍</text>
<text class="b" x="664" y="274">更早出局</text>
</svg>
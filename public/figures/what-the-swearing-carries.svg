<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一團虛線的大圓指向右邊兩張實心卡片，包裝大而空，貨只有兩樣">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">把那句罵拆開</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">髒話拿掉之後，剩下的內容只有兩條</text>

<ellipse cx="250" cy="300" rx="150" ry="112" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
<text x="250" y="292" font-size="20" fill="var(--dim)" text-anchor="middle">情緒外殼</text>
<text x="250" y="322" font-size="15" fill="var(--grey)" text-anchor="middle">音量、髒話</text>

<line x1="412" y1="300" x2="492" y2="300" stroke="var(--dim)" stroke-width="2"/>
<polygon points="504,300 490,293 490,307" fill="var(--dim)"/>

<rect x="524" y="188" width="376" height="102" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="524" y="188" width="7" height="102" rx="3" fill="var(--accent)"/>
<text x="558" y="228" font-size="20" fill="var(--ink)">決定權</text>
<text x="558" y="260" font-size="15" fill="var(--dim)">你決定，不要問我</text>

<rect x="524" y="318" width="376" height="102" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="524" y="318" width="7" height="102" rx="3" fill="var(--accent)"/>
<text x="558" y="358" font-size="20" fill="var(--ink)">驗收標準</text>
<text x="558" y="390" font-size="15" fill="var(--dim)">只看結果，過程不看</text>

<text x="60" y="474" font-size="22" fill="var(--ink)">情緒是包裝，貨是這兩樣。</text>
</svg>
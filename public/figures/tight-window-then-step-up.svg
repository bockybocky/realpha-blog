<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="時間線上先有一段窄的緊繃窗，二零二七年底後供給階梯式跳升一階">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">緊的期限，已經有日期了</text>

<rect x="100" y="120" width="420" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="310" y="147" font-size="16" fill="var(--dim)" text-anchor="middle">售罄到 2029</text>
<rect x="100" y="172" width="640" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="420" y="199" font-size="16" fill="var(--dim)" text-anchor="middle">買方口頭可見度 到 2031</text>

<rect x="100" y="300" width="340" height="70" rx="6" fill="var(--warn)" opacity="0.3"/>
<text class="t" x="270" y="344" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">最緊的窗</text>

<path d="M440 370 L440 262 L900 262" stroke="var(--accent)" stroke-width="4" fill="none"/>
<text class="t" x="620" y="244" font-size="20" font-weight="700" fill="var(--accent)">供給跳一階</text>

<path d="M100 400 L900 400" stroke="var(--grey)" stroke-width="2"/>
<circle cx="100" cy="400" r="6" fill="var(--grey)"/>
<circle cx="270" cy="400" r="6" fill="var(--grey)"/>
<circle cx="440" cy="400" r="8" fill="var(--accent)"/>
<circle cx="700" cy="400" r="6" fill="var(--grey)"/>
<text class="t" x="100" y="434" font-size="16" fill="var(--dim)" text-anchor="middle">2026</text>
<text class="t" x="270" y="434" font-size="16" fill="var(--dim)" text-anchor="middle">2027</text>
<text class="t" x="440" y="434" font-size="16" font-weight="700" fill="var(--accent)" text-anchor="middle">2027 年底</text>
<text class="t" x="700" y="434" font-size="16" fill="var(--dim)" text-anchor="middle">2029</text>
<text class="t" x="60" y="500" font-size="22" font-weight="600" fill="var(--ink)">收租有期限，問題只在幾季</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A money pipeline pinched in the middle, where before and after the pinch point are two different things.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Same money, different stage of the pipeline</text>

<path d="M60 200 L430 200 L488 254 L560 254 L620 200 L900 200 L900 320 L620 320 L560 266 L488 266 L430 320 L60 320 Z" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>

<text x="86" y="252" font-size="19" font-weight="700" fill="var(--ink)">Executive order</text>
<text x="86" y="282" font-size="16" fill="var(--dim)">Services　Program managers</text>

<rect x="488" y="150" width="76" height="56" rx="8" fill="var(--warn)"/>
<text x="500" y="186" font-size="16" font-weight="700" fill="var(--page)">Pinch point</text>
<text x="420" y="124" font-size="19" font-weight="700" fill="var(--warn)">Continuing resolution</text>
<text x="420" y="150" font-size="16" fill="var(--warn)">Deadline Dec 11</text>

<text x="672" y="252" font-size="19" font-weight="700" fill="var(--ink)">Written into a weapons system</text>
<text x="672" y="282" font-size="16" fill="var(--dim)">Patch program　Contracts can be let</text>

<text x="86" y="396" font-size="16" fill="var(--dim)">Before the pinch: studies still waiting on a budget</text>
<text x="86" y="424" font-size="16" fill="var(--accent)">After the pinch: patch programs already funded</text>

<text x="60" y="492" font-size="22" font-weight="700" fill="var(--ink)">The award headline won't tell you which stage it is.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="In the left panel two circles are almost separate with a tiny intersection; in the right panel the two circles overlap heavily and the intersection is large.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="58">How much of it you can direct</text>
  <rect x="60" y="88" width="400" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="88" width="400" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="88" y="126">A field you know nothing about</text>
  <text class="g" x="528" y="126">A field you have studied</text>
  <circle cx="190" cy="282" r="92" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <circle cx="340" cy="282" r="92" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M265 282 m -0 -53 a 92 92 0 0 1 0 106 a 92 92 0 0 1 0 -106" fill="var(--accent)" opacity="0.85"/>
  <text class="s" x="232" y="400">Crayons and a sponge toy</text>
  <circle cx="648" cy="282" r="92" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <circle cx="752" cy="282" r="92" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M700 282 m -0 -75 a 92 92 0 0 1 0 150 a 92 92 0 0 1 0 -150" fill="var(--accent)" opacity="0.85"/>
  <text class="s" x="648" y="400">Shared words</text>
  <text class="c" x="60" y="478">Bigger overlap, more you can ask for</text>
</svg>
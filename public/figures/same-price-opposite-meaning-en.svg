<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One price increase is revenue upstream and cost downstream, so the two arrows point opposite ways.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .a { font-size:19px; fill:var(--accent); font-weight:700; }
    .w { font-size:19px; fill:var(--warn); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">One price hike, two directions</text>

  <rect x="90" y="120" width="560" height="120" fill="var(--card)" stroke="var(--line)" rx="8"/>
  <text class="g" x="130" y="168">Memory maker</text>
  <text class="b" x="130" y="204">Sells the very thing going up</text>
  <path d="M740 230 L740 130" stroke="var(--accent)" stroke-width="6" fill="none"/>
  <path d="M715 158 L740 126 L765 158 Z" fill="var(--accent)"/>
  <text class="a" x="800" y="190">Revenue</text>

  <rect x="90" y="300" width="560" height="120" fill="var(--card)" stroke="var(--line)" rx="8"/>
  <text class="g" x="130" y="348">Box builder</text>
  <text class="b" x="130" y="384">Buys it, sells it inside a box</text>
  <path d="M740 310 L740 410" stroke="var(--warn)" stroke-width="6" fill="none"/>
  <path d="M715 382 L740 414 L765 382 Z" fill="var(--warn)"/>
  <text class="w" x="800" y="370">Profit</text>

  <text class="c" x="60" y="490">Lower shipments = costlier gear, not lost demand</text>
</svg>
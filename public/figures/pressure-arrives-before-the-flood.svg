<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條時間線右端標著上市日，代表現有贏家的曲線卻在那之前一大段就開始向下彎">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">壓力比洪水早到</text>
<rect x="380" y="150" width="420" height="280" fill="var(--card)"/>
<text x="396" y="182" font-size="19" fill="var(--dim)">先賣：最流動 · 最重疊 · 表現最好</text>
<line x1="100" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="800" y1="140" x2="800" y2="430" stroke="var(--warn)" stroke-width="3"/>
<text x="800" y="128" font-size="19" fill="var(--warn)" text-anchor="middle">上市日</text>
<path d="M110 240 L380 238 C520 240 640 330 760 366 L890 372" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="118" y="222" font-size="19" fill="var(--accent)">現有贏家</text>
<text x="480" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">要買新的，得先賣舊的——而且得提前幾個月</text>
<text x="480" y="512" font-size="22" fill="var(--ink)" text-anchor="middle">先跌的，往往是最好的那幾檔</text>
</svg>
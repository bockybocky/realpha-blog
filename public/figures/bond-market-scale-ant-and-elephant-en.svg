<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A length comparison of four bars: the global bond market bar spans almost the whole figure, US Treasuries are about a fifth of it, and private credit and crypto assets are so short they are barely visible.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">The ant and the elephant</text>
  <text class="t" x="60" y="102" font-size="16" fill="var(--dim)">Bar length = size, as of end-2025 (BIS)</text>

  <text class="t" x="290" y="170" font-size="20" text-anchor="end" fill="var(--ink)">Global bond market</text>
  <rect x="305" y="150" width="600" height="30" rx="4" fill="var(--accent)"/>
  <text class="t" x="320" y="171" font-size="16" font-weight="700" fill="var(--page)">$188 trillion</text>

  <text class="t" x="290" y="250" font-size="20" text-anchor="end" fill="var(--ink)">US Treasuries</text>
  <rect x="305" y="230" width="112" height="30" rx="4" fill="var(--accent)" opacity="0.65"/>
  <text class="t" x="432" y="251" font-size="16" fill="var(--dim)">$35tn</text>

  <text class="t" x="290" y="330" font-size="20" text-anchor="end" fill="var(--ink)">Private credit</text>
  <rect x="305" y="314" width="9" height="24" rx="2" fill="var(--grey)"/>
  <text class="t" x="330" y="332" font-size="16" fill="var(--dim)">~$3tn</text>

  <text class="t" x="290" y="392" font-size="20" text-anchor="end" fill="var(--ink)">Crypto assets</text>
  <rect x="305" y="376" width="9" height="24" rx="2" fill="var(--grey)"/>
  <text class="t" x="330" y="394" font-size="16" fill="var(--dim)">~$3tn</text>

  <line x1="305" y1="430" x2="905" y2="430" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="60" y="478" font-size="22" font-weight="700" fill="var(--ink)">The biggest one, the least watched</text>
</svg>
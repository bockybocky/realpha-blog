<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two identical capability cores: the left shell is a round disc and the right shell a square laptop, while the core stays exactly the same.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:700; fill:var(--ink); }
    .core { font-size:16px; fill:var(--page); }
    .lbl { font-size:15px; fill:var(--dim); }
    .end { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="58">The shell can change; the core is the same</text>

  <text class="grp" x="110" y="120">Round shell</text>
  <circle cx="240" cy="290" r="150" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <circle cx="240" cy="290" r="104" fill="var(--accent)"/>
  <text class="core" x="240" y="266" text-anchor="middle">Correct pronunciation</text>
  <text class="core" x="240" y="296" text-anchor="middle">Slowly</text>
  <text class="core" x="240" y="326" text-anchor="middle">Again and again</text>
  <text class="lbl" x="110" y="476">Lost once you can't find it</text>

  <text class="grp" x="130" y="296" text-anchor="middle" fill="var(--dim)"></text>

  <text class="grp" x="610" y="120">Laptop</text>
  <rect x="570" y="140" width="300" height="300" rx="16" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <circle cx="720" cy="290" r="104" fill="var(--accent)"/>
  <text class="core" x="720" y="266" text-anchor="middle">Square shell</text>
  <text class="core" x="720" y="296" text-anchor="middle">Correct pronunciation</text>
  <text class="core" x="720" y="326" text-anchor="middle">Slowly</text>
  <text class="lbl" x="570" y="476">Again and again</text>

  <line x1="400" y1="290" x2="548" y2="290" stroke="var(--line)" stroke-width="3"/>

  <text class="end" x="60" y="528">Right at hand</text>
</svg>
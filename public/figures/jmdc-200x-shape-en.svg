<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The bar for the first five years is almost flat while the bar for the next six shoots to the top, over similar spans of time.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="58" font-size="27" fill="var(--ink)">The shape of two hundred times</text>
  <line x1="90" y1="440" x2="890" y2="440" stroke="var(--line)" stroke-width="2"/>

  <rect x="160" y="436" width="90" height="4" fill="var(--grey)"/>
  <text x="205" y="424" font-size="19" fill="var(--dim)" text-anchor="middle">1x</text>
  <text x="205" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">Bought</text>

  <rect x="440" y="428" width="90" height="12" fill="var(--grey)"/>
  <text x="485" y="416" font-size="19" fill="var(--dim)" text-anchor="middle">4x</text>
  <text x="485" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">Five years on</text>
  <line x1="530" y1="410" x2="640" y2="352" stroke="var(--warn)" stroke-width="2"/>
  <text x="650" y="348" font-size="19" fill="var(--warn)">An ordinary fund exits here</text>

  <rect x="720" y="140" width="90" height="300" fill="var(--accent)"/>
  <text x="765" y="126" font-size="19" fill="var(--ink)" text-anchor="middle">200x</text>
  <text x="765" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">Twelve years on</text>

  <line x1="160" y1="498" x2="530" y2="498" stroke="var(--line)" stroke-width="3"/>
  <text x="345" y="522" font-size="16" fill="var(--dim)" text-anchor="middle">First five years</text>
  <line x1="530" y1="498" x2="810" y2="498" stroke="var(--line)" stroke-width="3"/>
  <text x="670" y="522" font-size="16" fill="var(--dim)" text-anchor="middle">Next six years</text>
</svg>
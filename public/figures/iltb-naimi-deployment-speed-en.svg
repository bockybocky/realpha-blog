<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="In the same window the plan is one long bar while the reality is three short bars plus three fundraising arrows.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="80" y="60" font-size="27" font-weight="700">Same window, three trips</text>
<line x1="200" y1="120" x2="200" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="880" y1="120" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<text x="420" y="110" font-size="16" fill="var(--dim)">18–24 months</text>
<rect x="200" y="160" width="680" height="54" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="400" y="195" font-size="19" fill="var(--dim)">Plan: 1 run</text>
<text x="90" y="195" font-size="19">Plan</text>
<rect x="200" y="290" width="212" height="54" fill="var(--accent)"/>
<rect x="434" y="290" width="212" height="54" fill="var(--accent)"/>
<rect x="668" y="290" width="212" height="54" fill="var(--accent)"/>
<text x="90" y="325" font-size="19">Real</text>
<polygon points="306,278 294,250 318,250" fill="var(--warn)"/>
<polygon points="540,278 528,250 552,250" fill="var(--warn)"/>
<polygon points="774,278 762,250 786,250" fill="var(--warn)"/>
<text x="258" y="240" font-size="16" fill="var(--warn)">Re-up</text>
<text x="492" y="240" font-size="16" fill="var(--warn)">Re-up</text>
<text x="726" y="240" font-size="16" fill="var(--warn)">Re-up</text>
<text x="80" y="420" font-size="22" font-weight="700" fill="var(--accent)">3×</text>
</svg>
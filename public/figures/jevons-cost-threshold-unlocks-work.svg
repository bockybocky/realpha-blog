<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="成本柱從高過門檻線降到門檻線以下，原本不做的案子因此成立">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="60" y="58" font-size="27" fill="var(--ink)">AI 砍掉的成本，變成原本不存在的案子</text>

  <rect x="60" y="90" width="840" height="380" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <line x1="100" y1="192" x2="860" y2="192" stroke="var(--dim)" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="856" y="180" font-size="16" fill="var(--dim)" text-anchor="end">客戶願意付的上限</text>

  <line x1="100" y1="390" x2="860" y2="390" stroke="var(--line)" stroke-width="2"/>

  <rect x="230" y="140" width="110" height="250" fill="var(--warn)"/>
  <text x="285" y="128" font-size="20" fill="var(--ink)" text-anchor="middle">約 1000 萬美元</text>
  <text x="285" y="422" font-size="19" fill="var(--ink)" text-anchor="middle">三年前</text>
  <text x="285" y="452" font-size="19" fill="var(--warn)" text-anchor="middle">案子沒發生</text>

  <rect x="570" y="318" width="110" height="72" fill="var(--accent)"/>
  <text x="625" y="306" font-size="20" fill="var(--ink)" text-anchor="middle">約 300 萬美元</text>
  <text x="625" y="422" font-size="19" fill="var(--ink)" text-anchor="middle">AI 導入後</text>
  <text x="625" y="452" font-size="19" fill="var(--accent)" text-anchor="middle">案子成立</text>

  <text x="480" y="520" font-size="22" fill="var(--ink)" text-anchor="middle">成本跌破那條線，需求才出現</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two stacked bars where the grey hours segment shrinks sharply, the blue signing segment becomes relatively thicker, and the whole bar also gets shorter.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">Which rent you collect</text>
<line x1="120" y1="420" x2="840" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="210" y="140" width="180" height="220" fill="var(--grey)"/>
<rect x="210" y="360" width="180" height="60" fill="var(--accent)"/>
<text x="300" y="258" text-anchor="middle" font-size="19" fill="var(--ink)">Programmer hours</text>
<text x="300" y="398" text-anchor="middle" font-size="16" fill="var(--page)">Signing</text>
<text x="300" y="458" text-anchor="middle" font-size="19" fill="var(--dim)">Before</text>
<rect x="580" y="260" width="180" height="70" fill="var(--grey)"/>
<rect x="580" y="330" width="180" height="90" fill="var(--accent)"/>
<text x="670" y="302" text-anchor="middle" font-size="16" fill="var(--ink)">Hours</text>
<text x="670" y="382" text-anchor="middle" font-size="19" fill="var(--page)">Signing for outcomes</text>
<text x="670" y="458" text-anchor="middle" font-size="19" fill="var(--dim)">Now</text>
<path d="M410 200 L560 258" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="485" y="195" text-anchor="middle" font-size="16" fill="var(--warn)">Eaten by tools</text>
<text x="480" y="508" text-anchor="middle" font-size="22" fill="var(--ink)">Scarcity moves, and pricing power follows</text>
</svg>
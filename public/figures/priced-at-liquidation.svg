<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三根幾乎等高的長條代表市值貼近淨現金與帳面價值；右側價格梯顯示現價遠低於融資價與履約價">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="56" y="66">市價貼到清算值</text>
<rect x="56" y="100" width="420" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="90" y1="390" x2="450" y2="390" stroke="var(--line)" stroke-width="2"/>
<rect x="120" y="188" width="70" height="202" fill="var(--accent)"/>
<rect x="240" y="196" width="70" height="194" fill="var(--grey)"/>
<rect x="360" y="182" width="70" height="208" fill="var(--grey)"/>
<text class="b" x="118" y="176">8.30</text>
<text class="b" x="238" y="184">7.88</text>
<text class="b" x="358" y="170">8.48</text>
<text class="g" x="112" y="420">市值</text>
<text class="g" x="232" y="420">淨現金</text>
<text class="g" x="340" y="420">帳面價值</text>
<text class="b" x="90" y="134">單位：億美元</text>
<rect x="520" y="100" width="384" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="600" y1="140" x2="600" y2="410" stroke="var(--line)" stroke-width="3"/>
<circle cx="600" cy="156" r="9" fill="var(--grey)"/>
<text class="g" x="626" y="162">履約價 26.25</text>
<circle cx="600" cy="208" r="9" fill="var(--grey)"/>
<text class="g" x="626" y="214">融資價 21</text>
<circle cx="600" cy="392" r="11" fill="var(--warn)"/>
<text class="g" x="626" y="398">現價 4.8</text>
<text class="b" x="626" y="300">之間是一整段空白</text>
<text class="c" x="56" y="508">怕錯過的對面，是怕被消滅</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three blocks converge into a solid bar on the left, while on the right one box is filled and the other is an empty dashed frame.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">What hurts you is usually not the thing staring at you</text>
  <rect x="60" y="110" width="400" height="300" rx="14" fill="var(--card)"/>
  <text x="84" y="152" font-size="20" font-weight="700" fill="var(--ink)">Out in the open</text>
  <rect x="84" y="176" width="110" height="48" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="139" y="206" font-size="16" fill="var(--ink)" text-anchor="middle">Dates</text>
  <rect x="206" y="176" width="110" height="48" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="261" y="206" font-size="16" fill="var(--ink)" text-anchor="middle">Amounts</text>
  <rect x="328" y="176" width="110" height="48" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="383" y="206" font-size="16" fill="var(--ink)" text-anchor="middle">Quotes</text>
  <line x1="139" y1="224" x2="200" y2="286" stroke="var(--grey)" stroke-width="2"/>
  <line x1="261" y1="224" x2="261" y2="286" stroke="var(--grey)" stroke-width="2"/>
  <line x1="383" y1="224" x2="322" y2="286" stroke="var(--grey)" stroke-width="2"/>
  <rect x="84" y="288" width="354" height="52" rx="10" fill="var(--accent)"/>
  <text x="261" y="322" font-size="17" font-weight="700" fill="var(--page)" text-anchor="middle">Already in the price</text>
  <text x="84" y="382" font-size="19" fill="var(--dim)">Known risk</text>
  <rect x="500" y="110" width="400" height="300" rx="14" fill="var(--card)"/>
  <text x="524" y="152" font-size="20" font-weight="700" fill="var(--ink)">The part with no precedent</text>
  <text x="524" y="208" font-size="17" fill="var(--ink)">Lease clauses</text>
  <rect x="700" y="180" width="176" height="44" rx="10" fill="var(--accent)"/>
  <text x="788" y="209" font-size="16" font-weight="700" fill="var(--page)" text-anchor="middle">Yes</text>
  <text x="524" y="282" font-size="17" fill="var(--ink)">Unwind precedent</text>
  <rect x="700" y="254" width="176" height="44" rx="10" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="788" y="283" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="middle">No</text>
  <text x="524" y="344" font-size="19" font-weight="700" fill="var(--warn)">Cannot be priced</text>
  <text x="524" y="382" font-size="19" fill="var(--dim)">Uncertainty</text>
  <text x="480" y="482" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Ask not how big the number is, but whether anyone has done it before</text>
</svg>
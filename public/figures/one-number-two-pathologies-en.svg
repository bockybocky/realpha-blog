<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One node splits into two branches, the upper leading to an outcome where things rise together and the lower leading to an outcome where both are pressed down at once.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="48" y="54" font-size="27" font-weight="700" fill="var(--ink)">One number, two pathologies</text>
<rect x="48" y="244" width="196" height="88" rx="10" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
<text x="76" y="296" font-size="20" font-weight="700" fill="var(--ink)">Yield at 5.3%</text>
<path d="M244 272 C 320 272, 340 180, 420 180" fill="none" stroke="var(--accent)" stroke-width="5"/>
<path d="M244 304 C 320 304, 340 396, 420 396" fill="none" stroke="var(--warn)" stroke-width="5"/>
<rect x="420" y="136" width="236" height="88" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="446" y="172" font-size="19" font-weight="700" fill="var(--accent)">Growth story</text>
<text x="446" y="202" font-size="16" fill="var(--dim)">Real rates ↑ · Infl. exp. steady</text>
<rect x="420" y="352" width="236" height="88" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="446" y="388" font-size="19" font-weight="700" fill="var(--warn)">Confidence story</text>
<text x="446" y="418" font-size="16" fill="var(--dim)">Term premium ↑</text>
<line x1="656" y1="180" x2="708" y2="180" stroke="var(--accent)" stroke-width="5"/>
<polygon points="730,180 704,166 704,194" fill="var(--accent)"/>
<line x1="656" y1="396" x2="708" y2="396" stroke="var(--warn)" stroke-width="5"/>
<polygon points="730,396 704,382 704,410" fill="var(--warn)"/>
<text x="740" y="174" font-size="19" font-weight="700" fill="var(--ink)">Cyclicals</text>
<text x="740" y="204" font-size="19" font-weight="700" fill="var(--ink)">Rise together</text>
<text x="740" y="390" font-size="19" font-weight="700" fill="var(--ink)">Value &amp; confid.</text>
<text x="740" y="420" font-size="19" font-weight="700" fill="var(--ink)">Both pressed</text>
<text x="48" y="512" font-size="22" font-weight="700" fill="var(--ink)">Treat the cause, not the symptom</text>
</g>
</svg>
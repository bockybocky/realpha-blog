<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The left box is blank and says it cannot tell, while on the right four bars rise in height, the most urgent one about half full, with a dashed outline marking the unfilled hundred percent.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="40" y="58" font-size="27" font-weight="700">Bill 1 day overdue: how urgent?</text>
<rect x="40" y="100" width="300" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="190" y="140" font-size="20" font-weight="700" text-anchor="middle">GPT-6</text>
<line x1="80" y1="400" x2="300" y2="400" stroke="var(--line)" stroke-width="2"/>
<text x="190" y="285" font-size="20" text-anchor="middle" style="fill:var(--dim)">Can't tell</text>
<text x="640" y="140" font-size="20" font-weight="700" text-anchor="middle">Jev</text>
<line x1="420" y1="180" x2="830" y2="180" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="840" y="186" font-size="15" style="fill:var(--dim)">100%</text>
<rect x="440" y="382" width="70" height="18" fill="var(--grey)"/>
<rect x="540" y="367" width="70" height="33" fill="var(--grey)"/>
<rect x="640" y="334" width="70" height="66" fill="var(--grey)"/>
<rect x="740" y="180" width="70" height="117" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="775" y="242" font-size="15" text-anchor="middle" style="fill:var(--accent)">Not full</text>
<rect x="740" y="297" width="70" height="103" fill="var(--accent)"/>
<text x="775" y="288" font-size="20" font-weight="700" text-anchor="middle" style="fill:var(--accent)">47%</text>
<line x1="420" y1="400" x2="830" y2="400" stroke="var(--line)" stroke-width="2"/>
<g font-size="16" text-anchor="middle">
<text x="475" y="428">Low</text><text x="575" y="428">Mid</text><text x="675" y="428">High</text><text x="775" y="428" font-weight="700" style="fill:var(--accent)">Urgent</text>
</g>
<text x="830" y="456" font-size="15" text-anchor="end" style="fill:var(--dim)">Other 3 levels illustrative</text>
<text x="480" y="500" font-size="22" font-weight="700" text-anchor="middle">Contested, so no fake certainty</text>
</svg>
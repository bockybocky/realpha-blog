<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩種上漲的個股分布：左邊多數股票一起漲、點都在指數線附近；右邊只有少數幾檔很高把指數拉上去，其餘都貼在零軸下方">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #9aa5b5;
      --accent: #1f6feb;
      --warn:   #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #6b7686;
        --accent: #58a6ff;
        --warn:   #d29922;
      }
    }
    .t     { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1    { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .cap   { font-size: 20px; font-weight: 700; fill: var(--ink); }
    .idx   { font-size: 15.5px; font-weight: 700; fill: var(--accent); }
    .zero  { font-size: 15px; fill: var(--dim); }
    .desc  { font-size: 15.5px; fill: var(--dim); }
    .kick  { font-size: 21px; font-weight: 700; fill: var(--ink); }
  </style>

  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <g class="t">
    <text x="480" y="44" class="h1" text-anchor="middle">同樣是「指數漲」，長相可以完全不同</text>

    <!-- ===== 左：雨露均霑 ===== -->
    <text x="255" y="90" class="cap" text-anchor="middle">多數股票一起漲</text>

    <line x1="100" y1="340" x2="410" y2="340" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="92" y="345" class="zero" text-anchor="end">0</text>
    <line x1="100" y1="250" x2="410" y2="250" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7,5"/>
    <text x="106" y="240" class="idx">指數報酬</text>

    <g fill="var(--grey)">
      <circle cx="122" cy="228" r="6"/><circle cx="140" cy="272" r="6"/><circle cx="158" cy="206" r="6"/>
      <circle cx="176" cy="290" r="6"/><circle cx="194" cy="244" r="6"/><circle cx="212" cy="214" r="6"/>
      <circle cx="230" cy="298" r="6"/><circle cx="248" cy="236" r="6"/><circle cx="266" cy="264" r="6"/>
      <circle cx="284" cy="198" r="6"/><circle cx="302" cy="282" r="6"/><circle cx="320" cy="222" r="6"/>
      <circle cx="338" cy="256" r="6"/><circle cx="356" cy="310" r="6"/><circle cx="374" cy="240" r="6"/>
      <circle cx="392" cy="276" r="6"/><circle cx="131" cy="318" r="6"/><circle cx="257" cy="326" r="6"/>
      <circle cx="347" cy="352" r="6"/><circle cx="203" cy="358" r="6"/>
    </g>
    <text x="255" y="410" class="desc" text-anchor="middle">你隨便選一把</text>
    <text x="255" y="434" class="desc" text-anchor="middle">大概都跟得上</text>

    <!-- ===== 右：少數幾檔扛 ===== -->
    <text x="705" y="90" class="cap" text-anchor="middle">少數幾檔扛著</text>

    <line x1="550" y1="340" x2="860" y2="340" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="542" y="345" class="zero" text-anchor="end">0</text>
    <line x1="550" y1="250" x2="860" y2="250" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7,5"/>
    <text x="556" y="240" class="idx">指數報酬（一樣高）</text>

    <g fill="var(--warn)">
      <circle cx="600" cy="122" r="7"/><circle cx="702" cy="106" r="7"/><circle cx="800" cy="134" r="7"/>
    </g>
    <g fill="var(--grey)">
      <circle cx="572" cy="352" r="6"/><circle cx="590" cy="368" r="6"/><circle cx="608" cy="344" r="6"/>
      <circle cx="626" cy="376" r="6"/><circle cx="644" cy="330" r="6"/><circle cx="662" cy="360" r="6"/>
      <circle cx="680" cy="382" r="6"/><circle cx="698" cy="338" r="6"/><circle cx="716" cy="366" r="6"/>
      <circle cx="734" cy="348" r="6"/><circle cx="752" cy="386" r="6"/><circle cx="770" cy="332" r="6"/>
      <circle cx="788" cy="370" r="6"/><circle cx="806" cy="354" r="6"/><circle cx="824" cy="378" r="6"/>
      <circle cx="842" cy="342" r="6"/><circle cx="614" cy="396" r="6"/>
    </g>
    <text x="705" y="430" class="desc" text-anchor="middle">你落後指數是結構造成的，</text>
    <text x="705" y="454" class="desc" text-anchor="middle">不是能力問題</text>

    <text x="480" y="512" class="kick" text-anchor="middle">指數是加權平均數，不是你的體感。</text>
    <text x="480" y="544" class="kick" text-anchor="middle">兩者背離很大時，先去查分散度，再檢討自己。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三兆美元的現金池，水位是六年前的兩倍；通往股市的兩道閘門都還關著，一道是利率降到百分之三以下，一道是股市跌三成以上">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #9aa5b5;
      --accent: #1f6feb;
      --warn:   #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #6b7686;
        --accent: #58a6ff;
        --warn:   #d29922;
      }
    }
    .t     { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1    { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .pool  { font-size: 30px; font-weight: 700; fill: var(--page); }
    .pools { font-size: 16px; fill: var(--page); }
    .mark  { font-size: 15px; font-weight: 700; fill: var(--ink); }
    .gate  { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .shut  { font-size: 15.5px; font-weight: 700; fill: var(--warn); }
    .note  { font-size: 15px; fill: var(--dim); }
    .kick  { font-size: 22px; font-weight: 700; fill: var(--ink); }
  </style>

  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <g class="t">
    <text x="480" y="44" class="h1" text-anchor="middle">三兆美元躺著不動，兩道閘門都還關著</text>

    <!-- 水池 -->
    <rect x="90" y="120" width="240" height="290" rx="4" fill="var(--accent)"/>
    <text x="210" y="196" class="pool" text-anchor="middle">3 兆</text>
    <text x="210" y="226" class="pools" text-anchor="middle">散戶貨幣基金</text>

    <!-- 六年前水位 -->
    <line x1="90" y1="265" x2="330" y2="265" stroke="var(--page)" stroke-width="2.5" stroke-dasharray="8,6"/>
    <text x="342" y="270" class="mark">六年前在這（1.5 兆）</text>

    <!-- 通道一 -->
    <rect x="330" y="150" width="230" height="40" fill="var(--accent)" opacity="0.28"/>
    <line x1="566" y1="138" x2="566" y2="202" stroke="var(--warn)" stroke-width="9" stroke-linecap="round"/>
    <text x="590" y="160" class="gate">利率降到 3% 以下</text>
    <text x="590" y="186" class="shut">還沒到</text>

    <!-- 通道二 -->
    <rect x="330" y="330" width="230" height="40" fill="var(--accent)" opacity="0.28"/>
    <line x1="566" y1="318" x2="566" y2="382" stroke="var(--warn)" stroke-width="9" stroke-linecap="round"/>
    <text x="590" y="340" class="gate">股市跌三成以上</text>
    <text x="590" y="366" class="shut">還沒到</text>
    <text x="590" y="396" class="note">⚠️ 這條很反直覺：大跌的時候錢反而</text>
    <text x="590" y="418" class="note">會從貨幣基金流進股市，</text>
    <text x="590" y="440" class="note">而那在歷史上幾乎沒發生過。</text>

    <text x="480" y="500" class="kick" text-anchor="middle">把「什麼時候該動」寫成條件，</text>
    <text x="480" y="532" class="kick" text-anchor="middle">而不是留成感覺。</text>
  </g>
</svg>

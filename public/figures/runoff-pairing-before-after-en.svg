<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the left the runoff is Le Pen against the centrist, and on the right the centrist shrinks away and is replaced by a far larger far-left block.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">A different opponent in the runoff</text>
<rect x="60" y="96" width="400" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="84" y="132" font-size="19" fill="var(--dim)">Before summer</text>
<rect x="96" y="190" width="150" height="130" rx="8" fill="var(--grey)"/>
<text x="118" y="262" font-size="19" fill="var(--page)">Le Pen</text>
<rect x="282" y="200" width="150" height="110" rx="8" fill="var(--grey)"/>
<text x="296" y="262" font-size="19" fill="var(--page)">Centrist</text>
<text x="96" y="372" font-size="16" fill="var(--dim)">Even</text>
<rect x="500" y="96" width="400" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="524" y="132" font-size="19" fill="var(--ink)">Now</text>
<rect x="536" y="190" width="150" height="130" rx="8" fill="var(--grey)"/>
<text x="558" y="262" font-size="19" fill="var(--page)">Le Pen</text>
<rect x="722" y="168" width="150" height="174" rx="8" fill="var(--warn)"/>
<text x="744" y="262" font-size="19" fill="var(--page)">Far left</text>
<rect x="690" y="286" width="22" height="56" rx="4" fill="var(--grey)" opacity="0.5"/>
<text x="536" y="372" font-size="16" fill="var(--dim)">Centrist down to a sliver</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上下對比：上排一條單向鏈在中間被切斷，下排一群神經元的順序箭頭被劃掉">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">順序有意義嗎：兩個答案</text>
<rect x="60" y="100" width="840" height="180" rx="14" fill="var(--card)"/>
<text class="t" x="90" y="138" font-size="20" font-weight="700" fill="var(--ink)">視覺</text>
<rect x="160" y="170" width="130" height="64" rx="10" fill="var(--accent)"/>
<text class="t" x="225" y="209" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">眼睛</text>
<line x1="290" y1="202" x2="380" y2="202" stroke="var(--line)" stroke-width="4"/>
<rect x="380" y="170" width="130" height="64" rx="10" fill="var(--accent)"/>
<text class="t" x="445" y="209" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">視丘</text>
<line x1="510" y1="202" x2="600" y2="202" stroke="var(--grey)" stroke-width="4"/>
<line x1="540" y1="180" x2="570" y2="224" stroke="var(--warn)" stroke-width="5"/>
<line x1="570" y1="180" x2="540" y2="224" stroke="var(--warn)" stroke-width="5"/>
<rect x="600" y="170" width="130" height="64" rx="10" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text class="t" x="665" y="209" font-size="19" fill="var(--dim)" text-anchor="middle">皮質</text>
<text class="t" x="760" y="209" font-size="16" fill="var(--warn)">切斷＝無知覺</text>
<rect x="60" y="300" width="840" height="180" rx="14" fill="var(--card)"/>
<text class="t" x="90" y="338" font-size="20" font-weight="700" fill="var(--ink)">記憶</text>
<g fill="var(--accent)">
<circle cx="220" cy="372" r="16"/><circle cx="290" cy="410" r="16"/><circle cx="360" cy="368" r="16"/>
<circle cx="430" cy="415" r="16"/><circle cx="500" cy="376" r="16"/>
</g>
<path d="M220 372 L290 410 L360 368 L430 415 L500 376" stroke="var(--grey)" stroke-width="3" fill="none" stroke-dasharray="7 7"/>
<line x1="300" y1="340" x2="430" y2="445" stroke="var(--warn)" stroke-width="5"/>
<text class="t" x="560" y="382" font-size="19" fill="var(--ink)">同時活化</text>
<text class="t" x="560" y="414" font-size="16" fill="var(--dim)">行為照樣出現</text>
<text class="t" x="60" y="524" font-size="22" font-weight="700" fill="var(--ink)">同一個假設，只在一邊成立</text>
</svg>
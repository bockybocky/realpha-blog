<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三個外觀相同的選項卡並排，下方彎曲多節點的舊路徑對照只有一個點的直線新路徑">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t  { font-size:27px; font-weight:700; fill:var(--ink); }
.g  { font-size:19px; font-weight:600; fill:var(--ink); }
.gd { font-size:19px; font-weight:600; fill:var(--dim); }
.gw { font-size:19px; font-weight:600; fill:var(--warn); }
.bi { font-size:16px; fill:var(--ink); }
.s  { font-size:15px; fill:var(--dim); }
.c  { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="64">省略被做成一顆按鈕</text>
<rect x="60" y="112" width="240" height="86" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="bi" x="116" y="163">照實列入</text>
<rect x="330" y="112" width="240" height="86" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="bi" x="386" y="163">另列他處</text>
<rect x="600" y="112" width="240" height="86" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="bi" x="656" y="163">跳過不提</text>
<text class="s" x="60" y="230">三個選項長得一樣</text>
<line x1="720" y1="204" x2="720" y2="222" stroke="var(--warn)" stroke-width="2"/>
<text class="gw" x="600" y="244">點下去就是造假</text>
<line x1="60" y1="284" x2="900" y2="284" stroke="var(--line)" stroke-width="2"/>
<text class="gd" x="60" y="344">以前</text>
<polyline points="200,336 300,312 400,360 500,312 600,360 700,336" fill="none" stroke="var(--grey)" stroke-width="4"/>
<circle cx="300" cy="312" r="7" fill="var(--grey)"/>
<circle cx="500" cy="312" r="7" fill="var(--grey)"/>
<circle cx="600" cy="360" r="7" fill="var(--grey)"/>
<text class="s" x="264" y="394">動手刪</text>
<text class="s" x="464" y="394">對帳</text>
<text class="s" x="564" y="394">再簽一次</text>
<text class="s" x="736" y="342">有摩擦</text>
<text class="gd" x="60" y="452">現在</text>
<line x1="200" y1="446" x2="690" y2="446" stroke="var(--accent)" stroke-width="4"/>
<polygon points="700,446 686,439 686,453" fill="var(--accent)"/>
<circle cx="450" cy="446" r="9" fill="var(--accent)"/>
<text class="s" x="414" y="482">按一下</text>
<text class="s" x="736" y="452">沒有摩擦</text>
<text class="c" x="60" y="548">摩擦不見了，多想的那一秒也不見了</text>
</svg>
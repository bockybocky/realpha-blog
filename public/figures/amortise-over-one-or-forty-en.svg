<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A very tall bar beside an almost flat bar, the same build cost amortised over one flight versus forty." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>

  <text x="80" y="70" font-size="27" font-weight="700" fill="var(--ink)">One rocket, spread over how many flights</text>
  <text x="80" y="104" font-size="16" fill="var(--dim)">Build cost $40 (illustrative)</text>

  <rect x="250" y="160" width="120" height="300" rx="4" fill="var(--grey)"/>
  <rect x="610" y="452" width="120" height="8" rx="3" fill="var(--accent)"/>

  <text x="310" y="140" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">$40 / flight</text>
  <text x="670" y="432" font-size="22" font-weight="700" fill="var(--accent)" text-anchor="middle">$1 / flight</text>

  <line x1="180" y1="460" x2="800" y2="460" stroke="var(--line)" stroke-width="2"/>

  <text x="310" y="498" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">1 flight</text>
  <text x="310" y="526" font-size="15" fill="var(--dim)" text-anchor="middle">The old rocket industry</text>
  <text x="670" y="498" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">40 flights</text>
  <text x="670" y="526" font-size="15" fill="var(--dim)" text-anchor="middle">Rapid reusability</text>

  <text x="80" y="572" font-size="22" font-weight="700" fill="var(--ink)">The line is not flying, it is flying again</text>
</svg>
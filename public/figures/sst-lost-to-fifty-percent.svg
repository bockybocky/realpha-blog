<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="左邊四塊疊起來仍然矮，右邊單獨一塊高出許多的高度對比">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink) }
    .grp { font-size:20px; font-weight:600; fill:var(--ink) }
    .box { font-size:16px; fill:var(--ink) }
    .cnc { font-size:22px; font-weight:600; fill:var(--accent) }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="ttl" x="60" y="64">技術指標全都贏了，輸在不上簡報的那一項</text>

  <text class="grp" x="240" y="232" text-anchor="middle">技術指標</text>
  <rect x="100" y="260" width="280" height="48" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="box" x="240" y="290" text-anchor="middle">三家龍頭</text>
  <rect x="100" y="314" width="280" height="48" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="box" x="240" y="344" text-anchor="middle">二十套原型</text>
  <rect x="100" y="368" width="280" height="48" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="box" x="240" y="398" text-anchor="middle">效率 96%</text>
  <rect x="100" y="422" width="280" height="48" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="box" x="240" y="452" text-anchor="middle">體積減半</text>

  <text class="grp" x="700" y="120" text-anchor="middle">採購桌上的一句話</text>
  <rect x="560" y="140" width="280" height="330" rx="10" fill="var(--warn)" fill-opacity="0.14" stroke="var(--warn)" stroke-width="3"/>
  <text class="grp" x="700" y="312" text-anchor="middle" fill="var(--warn)">貴 50%</text>

  <line x1="70" y1="470" x2="890" y2="470" stroke="var(--line)" stroke-width="3"/>
  <text class="cnc" x="480" y="530" text-anchor="middle">二十個原型抵不過一句「貴五成」</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩組柱子，右邊那組實際遠高於預期">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .a { font-size:16px; fill:var(--accent); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70">掀開來才知道有多少</text>
  <line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>

  <rect x="150" y="190" width="110" height="240" fill="var(--grey)"/>
  <text class="d" x="150" y="178">預期</text>
  <rect x="290" y="170" width="110" height="260" fill="var(--accent)"/>
  <text class="a" x="290" y="158">實際</text>
  <text class="g" x="150" y="470">不以安全著稱的專案</text>

  <rect x="560" y="390" width="110" height="40" fill="var(--grey)"/>
  <text class="d" x="560" y="378">預期</text>
  <rect x="700" y="150" width="110" height="280" fill="var(--accent)"/>
  <text class="a" x="700" y="138">實際</text>
  <text class="g" x="560" y="470">投了最多資源的瀏覽器</text>

  <text class="c" x="60" y="524">意外的不是髒的地方，是乾淨的地方</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上方一個被打叉的合併問句，往下分岔成兩條互相獨立的追蹤軌道">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">一個模糊的問題，拆成兩條追得動的</text>

<rect x="330" y="104" width="300" height="66" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="382" y="146" font-size="19" fill="var(--dim)">這波還有沒有</text>
<line x1="654" y1="118" x2="686" y2="156" stroke="var(--warn)" stroke-width="4"/>
<line x1="686" y1="118" x2="654" y2="156" stroke="var(--warn)" stroke-width="4"/>

<path d="M480 170 L480 202 L250 202 L250 232" fill="none" stroke="var(--line)" stroke-width="3"/>
<path d="M480 170 L480 202 L710 202 L710 232" fill="none" stroke="var(--line)" stroke-width="3"/>

<rect x="70" y="232" width="360" height="238" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="100" y="276" font-size="20" fill="var(--accent)">缺不缺</text>
<line x1="120" y1="316" x2="120" y2="436" stroke="var(--accent)" stroke-width="3"/>
<circle cx="120" cy="326" r="8" fill="var(--accent)"/>
<circle cx="120" cy="376" r="8" fill="var(--accent)"/>
<circle cx="120" cy="426" r="8" fill="var(--accent)"/>
<text x="146" y="332" font-size="16" fill="var(--ink)">產能擴充計畫</text>
<text x="146" y="382" font-size="16" fill="var(--ink)">製程節點</text>
<text x="146" y="432" font-size="16" fill="var(--ink)">良率</text>

<rect x="530" y="232" width="360" height="238" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="560" y="276" font-size="20" fill="var(--warn)">貴不貴</text>
<line x1="580" y1="316" x2="580" y2="436" stroke="var(--warn)" stroke-width="3"/>
<circle cx="580" cy="326" r="8" fill="var(--warn)"/>
<circle cx="580" cy="376" r="8" fill="var(--warn)"/>
<circle cx="580" cy="426" r="8" fill="var(--warn)"/>
<text x="606" y="332" font-size="16" fill="var(--ink)">買家賺不賺得回來</text>
<text x="606" y="382" font-size="16" fill="var(--ink)">終端願不願意買單</text>
<text x="606" y="432" font-size="16" fill="var(--dim)">不是看賣家毛利率</text>

<text x="60" y="524" font-size="22" fill="var(--ink)">兩條可以同時成立，而且指向相反的動作</text>
</svg>
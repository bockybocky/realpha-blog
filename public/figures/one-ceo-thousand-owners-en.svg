<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A lone square sits on the left and a dense grid of a thousand small dots fills the right, so the two areas differ enormously.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <defs>
    <pattern id="ownerdots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3.2" fill="var(--grey)"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70">One CEO, a thousand unseen owners</text>

  <rect x="70" y="196" width="44" height="44" fill="var(--accent)"/>
  <text class="g" x="60" y="282">1</text>
  <text class="s" x="60" y="308">CEO of a large public company</text>

  <text class="g" x="220" y="140">1,000</text>
  <text class="s" x="330" y="140">Private owners worth $25 million</text>
  <rect x="220" y="160" width="700" height="280" fill="url(#ownerdots)"/>

  <text class="c" x="60" y="490">The list shows one; the data holds a thousand</text>
</svg>
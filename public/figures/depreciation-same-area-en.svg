<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Five tall bars and ten short bars with the same total area, showing a longer depreciation life shrinking the yearly charge but not the total.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:20px; font-weight:700; fill:var(--accent); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">The same investment, spread over more years</text>

  <rect x="60" y="96" width="390" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="510" y="96" width="390" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <text class="g" x="84" y="140">Original life</text>
  <text class="g" x="534" y="140">Ten years longer</text>

  <rect x="104" y="240" width="46" height="120" fill="var(--accent)"/>
  <rect x="166" y="240" width="46" height="120" fill="var(--accent)"/>
  <rect x="228" y="240" width="46" height="120" fill="var(--accent)"/>
  <rect x="290" y="240" width="46" height="120" fill="var(--accent)"/>
  <rect x="352" y="240" width="46" height="120" fill="var(--accent)"/>

  <rect x="546" y="300" width="26" height="60" fill="var(--accent)"/>
  <rect x="580" y="300" width="26" height="60" fill="var(--accent)"/>
  <rect x="614" y="300" width="26" height="60" fill="var(--accent)"/>
  <rect x="648" y="300" width="26" height="60" fill="var(--accent)"/>
  <rect x="682" y="300" width="26" height="60" fill="var(--accent)"/>
  <rect x="716" y="300" width="26" height="60" fill="var(--accent)"/>
  <rect x="750" y="300" width="26" height="60" fill="var(--accent)"/>
  <rect x="784" y="300" width="26" height="60" fill="var(--accent)"/>
  <rect x="818" y="300" width="26" height="60" fill="var(--accent)"/>
  <rect x="852" y="300" width="26" height="60" fill="var(--accent)"/>

  <line x1="90" y1="360" x2="420" y2="360" stroke="var(--line)" stroke-width="2"/>
  <line x1="530" y1="360" x2="880" y2="360" stroke="var(--line)" stroke-width="2"/>

  <text class="b" x="255" y="390" text-anchor="middle">6 a year for 5 years</text>
  <text class="b" x="705" y="390" text-anchor="middle">3 a year for 10 years</text>

  <text class="s" x="255" y="418" text-anchor="middle">Total 30</text>
  <text class="s" x="705" y="418" text-anchor="middle">Total 30</text>

  <text class="c" x="480" y="486" text-anchor="middle">The books got shorter; the investment did not</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On one horizontal scale, three rows of markers show the US moving from the right side to the middle and then to the far left as the measure changes.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
    .u { font-size:19px; font-weight:700; fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="60">2024 snapshot: the US position moves with the measure</text>
<line x1="120" y1="462" x2="880" y2="462" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="120" y="492">Low</text>
<text class="b" x="690" y="492">Output per hour</text>
<text class="b" x="860" y="492">High</text>
<text class="g" x="60" y="140">Overall</text>
<line x1="120" y1="150" x2="880" y2="150" stroke="var(--line)" stroke-width="1"/>
<circle cx="520" cy="150" r="9" fill="var(--grey)"/>
<text class="b" x="470" y="186">Western Europe overall</text>
<circle cx="580" cy="150" r="10" fill="var(--accent)"/>
<text class="u" x="566" y="124">US</text>
<circle cx="770" cy="150" r="9" fill="var(--grey)"/>
<text class="b" x="690" y="186">Germany, Nordics, Low Countries</text>
<text class="g" x="60" y="268">Top 10% removed</text>
<line x1="120" y1="278" x2="880" y2="278" stroke="var(--line)" stroke-width="1"/>
<circle cx="520" cy="278" r="9" fill="var(--grey)"/>
<circle cx="522" cy="278" r="10" fill="var(--accent)" opacity="0.75"/>
<path d="M574 258 L532 258" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M532 258 l12 -6 l0 12 z" fill="var(--accent)"/>
<text class="b" x="556" y="246">Lead disappears</text>
<text class="g" x="60" y="386">Bottom half</text>
<line x1="120" y1="396" x2="880" y2="396" stroke="var(--line)" stroke-width="1"/>
<circle cx="250" cy="396" r="10" fill="var(--accent)"/>
<text class="u" x="236" y="370">US</text>
<circle cx="196" cy="396" r="9" fill="var(--grey)"/>
<text class="b" x="152" y="430">Portugal</text>
<circle cx="420" cy="396" r="9" fill="var(--grey)"/>
<circle cx="500" cy="396" r="9" fill="var(--grey)"/>
<circle cx="600" cy="396" r="9" fill="var(--grey)"/>
<circle cx="700" cy="396" r="9" fill="var(--grey)"/>
<text class="b" x="470" y="430">Rest of Europe</text>
<text class="c" x="60" y="528">One country, three spots</text>
<text class="b" x="330" y="528">Same year, same data, new measure, new spot</text>
</svg>
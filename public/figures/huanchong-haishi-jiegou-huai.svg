<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="分岔圖：一條線前行到一個節點後分成兩支，上支水平延伸，下支明顯向下離開">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">同一個不配合，兩個相反的動作</text>

<path d="M70 240 L420 240" stroke="var(--grey)" stroke-width="10"/>
<circle cx="440" cy="240" r="20" fill="var(--page)" stroke="var(--ink)" stroke-width="4"/>
<text x="440" y="200" font-size="19" fill="var(--ink)" text-anchor="middle">價格不配合</text>

<path d="M466 228 L860 160" stroke="var(--accent)" stroke-width="10"/>
<path d="M846 142 L884 156 L850 178 Z" fill="var(--accent)"/>
<text x="610" y="146" font-size="16" fill="var(--accent)">緩衝還在作用</text>
<text x="880" y="128" font-size="22" fill="var(--accent)" text-anchor="end">等</text>

<path d="M466 254 L860 370" stroke="var(--warn)" stroke-width="10"/>
<path d="M842 352 L884 376 L844 394 Z" fill="var(--warn)"/>
<text x="610" y="362" font-size="16" fill="var(--warn)">結構壞了</text>
<text x="880" y="426" font-size="22" fill="var(--warn)" text-anchor="end">走</text>

<text x="60" y="480" font-size="22" fill="var(--ink)">先分清是哪一種，再決定動不動</text>
</svg>
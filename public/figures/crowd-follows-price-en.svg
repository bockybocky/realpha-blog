<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The price line climbs to 5x first, and the bars for the crowd in the room only grow tall at the end.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="50" text-anchor="middle">The crowd trails the gains</text>
<line x1="140" y1="90" x2="180" y2="90" stroke="var(--accent)" stroke-width="4"/>
<text class="b" x="190" y="96">Price</text>
<rect x="260" y="81" width="18" height="18" rx="3" fill="var(--grey)"/>
<text class="b" x="286" y="96">People in room</text>
<g fill="var(--grey)">
<rect x="140" y="440" width="40" height="20"/><rect x="260" y="438" width="40" height="22"/><rect x="380" y="435" width="40" height="25"/><rect x="500" y="425" width="40" height="35"/><rect x="620" y="390" width="40" height="70"/><rect x="740" y="310" width="40" height="150"/><rect x="840" y="230" width="40" height="230"/>
</g>
<line x1="120" y1="460" x2="910" y2="460" stroke="var(--dim)" stroke-width="2"/>
<polyline points="140,420 260,400 380,340 500,250 620,170 740,130 860,125" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="b" x="130" y="426" text-anchor="end">×1</text>
<text class="g" x="872" y="122" fill="var(--accent)">×5</text>
<text x="470" y="236" text-anchor="end" style="font-size:16px;font-weight:700;fill:var(--accent)">Gain already made</text>
<text class="b" x="120" y="490">Time →</text>
<text class="g" x="860" y="492" text-anchor="middle">I see it packed</text>
</svg>
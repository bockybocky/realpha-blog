<svg id="fig-iltb-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A fixed-size pool of data points to two destinations: a verifiable environment that generates its own data in a loop, and an unverifiable zone handed to people">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
#fig-iltb-4 text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-iltb-4 .t { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-iltb-4 .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-iltb-4 .b { font-size:16px; fill:var(--dim); }
#fig-iltb-4 .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<defs><marker id="ar4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="var(--accent)"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="52">Free bucket, already scoured</text>

<text class="g" x="205" y="132" text-anchor="middle">One-off</text>
<rect x="80" y="150" width="250" height="210" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="96" y="166" width="34" height="34" fill="var(--grey)"/>
<rect x="138" y="166" width="34" height="34" fill="var(--grey)"/>
<rect x="180" y="166" width="34" height="34" fill="var(--grey)"/>
<rect x="222" y="166" width="34" height="34" fill="var(--grey)"/>
<rect x="264" y="166" width="34" height="34" fill="var(--grey)"/>
<rect x="96" y="208" width="34" height="34" fill="var(--grey)"/>
<rect x="138" y="208" width="34" height="34" fill="var(--grey)"/>
<rect x="180" y="208" width="34" height="34" fill="var(--grey)"/>
<rect x="222" y="208" width="34" height="34" fill="var(--grey)"/>
<rect x="264" y="208" width="34" height="34" fill="var(--grey)"/>
<rect x="96" y="250" width="34" height="34" fill="var(--grey)"/>
<rect x="138" y="250" width="34" height="34" fill="var(--grey)"/>
<rect x="180" y="250" width="34" height="34" fill="var(--grey)"/>
<rect x="222" y="250" width="34" height="34" fill="var(--grey)"/>
<rect x="264" y="250" width="34" height="34" fill="var(--grey)"/>
<rect x="96" y="292" width="34" height="34" fill="var(--grey)"/>
<rect x="138" y="292" width="34" height="34" fill="var(--grey)"/>
<rect x="180" y="292" width="34" height="34" fill="var(--grey)"/>
<rect x="222" y="292" width="34" height="34" fill="var(--grey)"/>
<rect x="264" y="292" width="34" height="34" fill="var(--grey)"/>
<text class="b" x="205" y="388" text-anchor="middle">Quality web text</text>
<text class="b" x="205" y="414" text-anchor="middle">Fixed size, scoured</text>

<line x1="352" y1="250" x2="412" y2="250" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar4)"/>

<rect x="430" y="140" width="300" height="140" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="580" y="186" text-anchor="middle">Verifiable env</text>
<text class="b" x="580" y="220" text-anchor="middle">Model makes data</text>
<path d="M760,190 a26,26 0 1,1 -12,-22" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar4)"/>

<rect x="430" y="320" width="300" height="140" fill="var(--card)" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="g" x="580" y="366" text-anchor="middle">Unverifiable half</text>
<text class="b" x="580" y="400" text-anchor="middle">Good, beauty, taste</text>
<text class="g" x="580" y="434" text-anchor="middle">To people</text>

<text class="c" x="60" y="522">Data now gets run, not collected</text>
</svg>
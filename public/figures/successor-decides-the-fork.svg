<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一個起點分出三條路徑，兩條下墜到不同深度，一條走平回到原高度">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="72" font-size="27" fill="var(--ink)">同樣的新聞，三種結局</text>
<line x1="120" y1="200" x2="300" y2="200" stroke="var(--grey)" stroke-width="4"/>
<circle cx="300" cy="200" r="11" fill="var(--warn)"/>
<text x="120" y="182" font-size="19" fill="var(--ink)">執行長走人</text>
<text x="300" y="166" font-size="16" fill="var(--warn)" text-anchor="middle">分岔點：誰來接</text>
<polyline points="300,200 520,205 760,200" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text x="775" y="206" font-size="19" fill="var(--ink)">麥當勞</text>
<text x="775" y="230" font-size="16" fill="var(--dim)">後來沒事</text>
<polyline points="300,200 520,300 760,370" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="775" y="376" font-size="19" fill="var(--ink)">惠普</text>
<text x="775" y="400" font-size="16" fill="var(--dim)">買下 Autonomy</text>
<text x="775" y="422" font-size="16" fill="var(--dim)">減記 90 億美元</text>
<polyline points="300,200 520,350 700,480" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text x="500" y="500" font-size="19" fill="var(--ink)">英特爾</text>
<text x="500" y="524" font-size="16" fill="var(--dim)">轉進晶圓代工，股價摔到五十年低點</text>
<text x="60" y="548" font-size="22" fill="var(--ink)">走的人一樣，決定不一樣</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條四段堆疊條對照，只有第一段縮短而總長幾乎不變">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700">降息之後，總長度沒有變</text>

<text x="60" y="150" font-size="20" font-weight="700">降息前</text>
<rect x="200" y="126" width="140" height="40" fill="var(--accent)"/>
<text x="216" y="153" font-size="15" fill="var(--page)">錢</text>
<rect x="344" y="126" width="200" height="40" fill="var(--grey)"/>
<text x="360" y="153" font-size="15" fill="var(--ink)">許可</text>
<rect x="548" y="126" width="170" height="40" fill="var(--grey)"/>
<text x="564" y="153" font-size="15" fill="var(--ink)">零件</text>
<rect x="722" y="126" width="140" height="40" fill="var(--grey)"/>
<text x="738" y="153" font-size="15" fill="var(--ink)">人</text>

<text x="60" y="266" font-size="20" font-weight="700">降息後</text>
<rect x="200" y="242" width="60" height="40" fill="var(--accent)"/>
<rect x="264" y="242" width="200" height="40" fill="var(--grey)"/>
<text x="280" y="269" font-size="15" fill="var(--ink)">許可</text>
<rect x="468" y="242" width="170" height="40" fill="var(--grey)"/>
<text x="484" y="269" font-size="15" fill="var(--ink)">零件</text>
<rect x="642" y="242" width="140" height="40" fill="var(--grey)"/>
<text x="658" y="269" font-size="15" fill="var(--ink)">人</text>

<line x1="862" y1="110" x2="862" y2="190" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="782" y1="226" x2="782" y2="306" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="600" y="340" font-size="16" fill="var(--dim)">只縮掉一格的寬度</text>

<text x="60" y="440" font-size="22" font-weight="700">資金成本鬆了，排隊點沒動</text>
</svg>
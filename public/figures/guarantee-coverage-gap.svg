<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條分布曲線，銀行的上限線落在最右邊覆蓋幾乎全部，壽險的上限線落在偏左，右側大片面積未被覆蓋">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs>
<clipPath id="clipDL"><rect x="80" y="180" width="310" height="200"/></clipPath>
<clipPath id="clipDLu"><rect x="390" y="180" width="50" height="200"/></clipPath>
<clipPath id="clipDR"><rect x="520" y="180" width="144" height="200"/></clipPath>
<clipPath id="clipDRu"><rect x="664" y="180" width="216" height="200"/></clipPath>
</defs>
<text x="48" y="58" font-size="27" fill="var(--ink)">上限差不多，接得住的比例差很多</text>

<text x="80" y="106" font-size="19" fill="var(--ink)">銀行存款</text>
<path d="M80,376 C130,374 155,268 195,262 C240,255 255,300 305,332 C350,360 400,374 440,378 L440,380 L80,380 Z" fill="var(--accent)" fill-opacity="0.25" clip-path="url(#clipDL)"/>
<path d="M80,376 C130,374 155,268 195,262 C240,255 255,300 305,332 C350,360 400,374 440,378 L440,380 L80,380 Z" fill="var(--grey)" fill-opacity="0.25" clip-path="url(#clipDLu)"/>
<path d="M80,376 C130,374 155,268 195,262 C240,255 255,300 305,332 C350,360 400,374 440,378" fill="none" stroke="var(--dim)" stroke-width="2"/>
<path d="M80,380 L440,380" stroke="var(--line)" stroke-width="2" fill="none"/>
<path d="M390,196 L390,380" stroke="var(--accent)" stroke-width="2.5" fill="none"/>
<text x="390" y="182" font-size="15" fill="var(--accent)" text-anchor="middle">25 萬美元</text>
<text x="436" y="406" font-size="15" fill="var(--accent)" text-anchor="end">多數帳戶在線內</text>

<text x="520" y="106" font-size="19" fill="var(--ink)">壽險保額</text>
<path d="M520,376 C570,374 595,268 635,262 C680,255 695,300 745,332 C790,360 840,374 880,378 L880,380 L520,380 Z" fill="var(--accent)" fill-opacity="0.25" clip-path="url(#clipDR)"/>
<path d="M520,376 C570,374 595,268 635,262 C680,255 695,300 745,332 C790,360 840,374 880,378 L880,380 L520,380 Z" fill="var(--warn)" fill-opacity="0.2" clip-path="url(#clipDRu)"/>
<path d="M520,376 C570,374 595,268 635,262 C680,255 695,300 745,332 C790,360 840,374 880,378" fill="none" stroke="var(--dim)" stroke-width="2"/>
<path d="M520,380 L880,380" stroke="var(--line)" stroke-width="2" fill="none"/>
<path d="M664,196 L664,380" stroke="var(--warn)" stroke-width="2.5" fill="none"/>
<text x="664" y="182" font-size="15" fill="var(--warn)" text-anchor="middle">30 萬美元</text>
<text x="664" y="406" font-size="15" fill="var(--warn)" text-anchor="middle">第 40 百分位</text>
<text x="800" y="356" font-size="15" fill="var(--warn)" text-anchor="middle">線外</text>

<text x="480" y="472" font-size="22" fill="var(--ink)" text-anchor="middle">保額越大的人，越接不住</text>
</svg>
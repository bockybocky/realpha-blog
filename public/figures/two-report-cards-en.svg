<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The left report card is full of entries, the right one is blank">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  .ttl{font-size:27px;fill:var(--ink);font-weight:700}
  .lbl{font-size:19px;fill:var(--ink);font-weight:600}
  .txt{font-size:16px;fill:var(--dim)}
  .cc{font-size:22px;fill:var(--ink);font-weight:600}
</style></defs>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="ttl" x="60" y="62">Two cards, one leaves traces</text>
<text class="lbl" x="270" y="122" text-anchor="middle">Things done</text>
<text class="lbl" x="690" y="122" text-anchor="middle">Things undone</text>
<rect x="110" y="146" width="320" height="290" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="530" y="146" width="320" height="290" rx="10" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="9 7"/>
<line x1="142" y1="192" x2="330" y2="192" stroke="var(--ink)" stroke-width="3"/>
<rect x="352" y="182" width="46" height="14" rx="4" fill="var(--accent)"/>
<line x1="142" y1="238" x2="306" y2="238" stroke="var(--ink)" stroke-width="3"/>
<rect x="352" y="228" width="46" height="14" rx="4" fill="var(--accent)"/>
<line x1="142" y1="284" x2="322" y2="284" stroke="var(--ink)" stroke-width="3"/>
<rect x="352" y="274" width="46" height="14" rx="4" fill="var(--accent)"/>
<line x1="142" y1="330" x2="296" y2="330" stroke="var(--ink)" stroke-width="3"/>
<rect x="352" y="320" width="46" height="14" rx="4" fill="var(--accent)"/>
<line x1="142" y1="376" x2="316" y2="376" stroke="var(--ink)" stroke-width="3"/>
<rect x="352" y="366" width="46" height="14" rx="4" fill="var(--accent)"/>
<text class="txt" x="690" y="248" text-anchor="middle" fill="var(--grey)">Trend not chased</text>
<text class="txt" x="690" y="300" text-anchor="middle" fill="var(--grey)">Job turned down</text>
<text class="txt" x="690" y="352" text-anchor="middle" fill="var(--grey)">Words never said</text>
<text class="txt" x="270" y="472" text-anchor="middle">Numbers, praise</text>
<text class="txt" x="690" y="472" text-anchor="middle">No receipt</text>
<text class="cc" x="60" y="536">Both count, only one is recorded</text>
</svg>
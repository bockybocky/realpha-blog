<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊兩條曲線越離越遠，右邊兩條曲線撞上同一條水平上限後併攏">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">同一個賭注，兩個世界</text>

<rect x="48" y="92" width="412" height="340" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="254" y="130" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">模型會自我遞歸改進</text>
<line x1="90" y1="400" x2="430" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="90" y1="150" x2="90" y2="400" stroke="var(--line)" stroke-width="2"/>
<path d="M90 392 C220 386 300 330 400 160" fill="none" stroke="var(--accent)" stroke-width="5"/>
<path d="M126 396 C250 392 330 376 430 352" fill="none" stroke="var(--warn)" stroke-width="5"/>
<text class="t" x="408" y="196" font-size="16" fill="var(--accent)" text-anchor="end">領先的那方</text>
<text class="t" x="430" y="338" font-size="16" fill="var(--warn)" text-anchor="end">落後十二個月</text>
<text class="t" x="254" y="424" font-size="16" fill="var(--dim)" text-anchor="middle">差距只會越來越大</text>

<rect x="500" y="92" width="412" height="340" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="706" y="130" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">經濟體能吸收的有上限</text>
<line x1="542" y1="400" x2="882" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="542" y1="150" x2="542" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="542" y1="210" x2="882" y2="210" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="t" x="882" y="198" font-size="16" fill="var(--dim)" text-anchor="end">夠好了</text>
<path d="M542 392 C640 384 700 240 882 218" fill="none" stroke="var(--accent)" stroke-width="5"/>
<path d="M578 396 C680 392 740 262 882 226" fill="none" stroke="var(--accent)" stroke-width="5" opacity="0.5"/>
<text class="t" x="706" y="424" font-size="16" fill="var(--dim)" text-anchor="middle">後面追上來，前面賣不出價</text>

<line x1="48" y1="470" x2="912" y2="470" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="480" y="512" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">管制的效果在兩邊符號相反，而我們還不知道在哪一邊</text>
</svg>
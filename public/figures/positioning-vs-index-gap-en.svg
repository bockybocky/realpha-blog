<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two lines start from the same point: net long positioning falls steeply to just over a fifth of its starting level while the index stays almost flat, and the height difference between them is large at the end.">
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px}
    .b{font-size:15px;fill:var(--dim)}
    .c{font-size:22px}
  </style>
  <text class="t" x="40" y="58">Positioning −77%, index only −10%</text>
  <line x1="150" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
  <path d="M170 140 L740 168" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M170 140 L740 356" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="170" cy="140" r="6" fill="var(--ink)"/>
  <circle cx="740" cy="168" r="6" fill="var(--accent)"/>
  <circle cx="740" cy="356" r="6" fill="var(--warn)"/>
  <text class="g" x="752" y="174" fill="var(--accent)">Index −10%</text>
  <text class="g" x="752" y="362" fill="var(--warn)">Net longs −77%</text>
  <line x1="700" y1="186" x2="700" y2="338" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="g" x="672" y="272" fill="var(--warn)" text-anchor="end">Gap</text>
  <text class="b" x="170" y="448">Two months ago</text>
  <text class="b" x="740" y="448" text-anchor="end">Week of 11/10</text>
  <text class="b" x="40" y="478">Net longs = 25 major commodity futures combined | Index = Bloomberg Commodity Index</text>
  <text class="c" x="40" y="514">The gap points to positioning, not supply and demand</text>
</svg>
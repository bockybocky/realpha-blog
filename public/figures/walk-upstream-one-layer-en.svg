<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A line rising to the right with five points, moving from distant estimates to records that must be kept accurate.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700 }
.g { font-size:20px; fill:var(--ink); font-weight:600 }
.b { font-size:16px; fill:var(--dim) }
.n { font-size:22px; fill:var(--ink); font-weight:700 }
.c { font-size:22px; fill:var(--ink); font-weight:600 }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56">Walk one layer upstream</text>
<line x1="120" y1="440" x2="120" y2="120" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="440" x2="920" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="120" y="104">Credibility</text>
<text class="b" x="920" y="466" text-anchor="end">Closer to the action →</text>
<polyline points="190,400 350,345 510,280 670,210 850,150" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="190" cy="400" r="9" fill="var(--grey)"/>
<circle cx="350" cy="345" r="9" fill="var(--grey)"/>
<circle cx="510" cy="280" r="9" fill="var(--accent)"/>
<circle cx="670" cy="210" r="9" fill="var(--accent)"/>
<circle cx="850" cy="150" r="12" fill="var(--warn)"/>
<text class="b" x="190" y="378" text-anchor="middle">Market size</text>
<text class="b" x="350" y="323" text-anchor="middle">Revenue guess</text>
<text class="b" x="510" y="258" text-anchor="middle">Shipment orders</text>
<text class="b" x="670" y="188" text-anchor="middle">Capacity schedule</text>
<text class="g" x="850" y="124" text-anchor="middle" fill="var(--warn)">Customs, payments</text>
<text class="c" x="60" y="500">Trust the layer someone must get right to do business</text>
</svg>
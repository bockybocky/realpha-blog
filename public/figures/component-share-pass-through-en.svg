<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two stacked bar groups: in the camera, memory is just a sliver and the finished product's length barely changes after the price rise; in the accelerator card, memory takes a large block and the finished product's bar grows noticeably longer.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text x="480" y="52" class="t" text-anchor="middle">Absorbed? Part share</text>
<text x="30" y="152" class="g">CCTV cam</text>
<text x="30" y="176" class="b">~$33</text>
<text x="190" y="142" class="b" text-anchor="end">Pre</text>
<rect x="200" y="120" width="480" height="32" fill="var(--grey)"/>
<rect x="200" y="120" width="14" height="32" fill="var(--accent)"/>
<text x="696" y="142" class="b">~3%</text>
<text x="190" y="186" class="b" text-anchor="end">Post</text>
<rect x="200" y="164" width="508" height="32" fill="var(--grey)"/>
<rect x="200" y="164" width="42" height="32" fill="var(--accent)"/>
<text x="724" y="186" class="b">~8%</text>
<text x="200" y="230" class="b">Memory 3x → unit +$2</text>
<text x="30" y="332" class="g">AI card</text>
<text x="190" y="322" class="b" text-anchor="end">Pre</text>
<rect x="200" y="300" width="480" height="32" fill="var(--grey)"/>
<rect x="200" y="300" width="190" height="32" fill="var(--accent)"/>
<text x="295" y="322" text-anchor="middle" style="font-size:16px;fill:var(--page)">Big</text>
<text x="190" y="366" class="b" text-anchor="end">Post</text>
<rect x="200" y="344" width="576" height="32" fill="var(--grey)"/>
<rect x="200" y="344" width="260" height="32" fill="var(--accent)"/>
<rect x="776" y="345" width="144" height="30" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4"/>
<text x="848" y="336" class="b" text-anchor="middle" style="fill:var(--accent)">+20~50%</text>
<text x="200" y="410" class="b">Card price rises</text>
<rect x="200" y="466" width="16" height="16" fill="var(--accent)"/>
<text x="224" y="480" class="b">Memory</text>
<rect x="330" y="466" width="16" height="16" fill="var(--grey)"/>
<text x="354" y="480" class="b">Other</text>
<rect x="480" y="467" width="30" height="14" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4"/>
<text x="520" y="480" class="b">Unit hike</text>
</svg>
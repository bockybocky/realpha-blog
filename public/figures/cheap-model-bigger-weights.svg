<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩格對比：左格模型權重柱低於單機柱，右格權重柱高過單機柱，需要更高的機櫃柱才裝得下">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;font-weight:700;fill:var(--ink)}
.g{font-size:20px;font-weight:700;fill:var(--ink)}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="h" x="60" y="56">便宜不等於小</text>

<rect x="60" y="120" width="390" height="350" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="90" y="166">舊邏輯：便宜就是變小</text>
<rect x="150" y="330" width="85" height="90" fill="var(--grey)"/>
<rect x="290" y="360" width="85" height="60" fill="var(--grey)"/>
<line x1="100" y1="420" x2="415" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="192" y="446" text-anchor="middle">單機</text>
<text class="s" x="332" y="446" text-anchor="middle">權重</text>
<text class="s" x="332" y="344" text-anchor="middle">塞得下</text>

<rect x="510" y="120" width="390" height="350" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="540" y="166">這次：便宜但更大</text>
<rect x="550" y="330" width="85" height="90" fill="var(--grey)"/>
<rect x="680" y="190" width="85" height="230" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<rect x="800" y="240" width="85" height="180" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<line x1="530" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="592" y="446" text-anchor="middle">單機</text>
<text class="s" x="722" y="446" text-anchor="middle">權重</text>
<text class="s" x="842" y="446" text-anchor="middle">機櫃</text>
<text class="s" x="722" y="176" text-anchor="middle">塞不下</text>
<text class="s" x="842" y="226" text-anchor="middle">裝得下</text>

<text class="c" x="480" y="524" text-anchor="middle">判準是塞不塞得進單一節點</text>
</svg>
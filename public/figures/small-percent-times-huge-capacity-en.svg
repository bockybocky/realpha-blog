<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A very thin saving sliver on a huge capacity block becomes a large sum once multiplied out.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="48" font-size="27" fill="var(--ink)">A thin layer, times a very large base</text>
<rect x="70" y="150" width="330" height="240" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="70" y="150" width="330" height="14" fill="var(--accent)"/>
<text x="235" y="290" font-size="20" fill="var(--dim)" text-anchor="middle">Gigawatt capacity</text>
<text x="235" y="138" font-size="16" fill="var(--accent)" text-anchor="middle">That 2% saved</text>
<text x="235" y="420" font-size="16" fill="var(--dim)" text-anchor="middle">A whole campus of power</text>
<path d="M 440 265 L 540 265" stroke="var(--dim)" stroke-width="2" fill="none"/>
<path d="M 530 258 L 542 265 L 530 272 Z" fill="var(--dim)"/>
<text x="490" y="248" font-size="16" fill="var(--dim)" text-anchor="middle">Multiplied out</text>
<line x1="600" y1="390" x2="900" y2="390" stroke="var(--line)" stroke-width="2"/>
<rect x="620" y="366" width="90" height="24" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text x="665" y="420" font-size="16" fill="var(--dim)" text-anchor="middle">Former odds and ends</text>
<rect x="780" y="170" width="90" height="220" fill="var(--accent)" opacity="0.85"/>
<text x="825" y="420" font-size="16" fill="var(--accent)" text-anchor="middle">Money saved</text>
<text x="825" y="155" font-size="19" fill="var(--accent)" text-anchor="middle">Worth redesigning</text>
<text x="60" y="490" font-size="22" fill="var(--ink)">A small share is not a small sum; on a large base, a thin sliver is thick</text>
</svg>
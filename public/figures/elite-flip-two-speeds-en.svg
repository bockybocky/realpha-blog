<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two timelines four times apart in length describing the same flip, long for Britain and short for China.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="480" y="56" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">The same flip at two speeds</text>

  <text x="70" y="212" font-size="20" font-weight="700" fill="var(--dim)">Britain</text>
  <line x1="160" y1="205" x2="820" y2="205" stroke="var(--grey)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="160" cy="205" r="8" fill="var(--grey)"/>
  <circle cx="820" cy="205" r="8" fill="var(--grey)"/>
  <text x="490" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="var(--dim)">A hundred and fifty years</text>
  <text x="160" y="240" font-size="16" fill="var(--dim)">1688</text>
  <text x="820" y="240" text-anchor="end" font-size="16" fill="var(--dim)">1900</text>
  <text x="160" y="274" font-size="16" fill="var(--ink)">Capitalist class: few and poorer, then many and catching up</text>

  <text x="70" y="392" font-size="20" font-weight="700" fill="var(--ink)">China</text>
  <line x1="160" y1="385" x2="336" y2="385" stroke="var(--accent)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="160" cy="385" r="8" fill="var(--accent)"/>
  <circle cx="336" cy="385" r="8" fill="var(--accent)"/>
  <text x="248" y="362" text-anchor="middle" font-size="20" font-weight="700" fill="var(--accent)">Forty years</text>
  <text x="160" y="420" font-size="16" fill="var(--dim)">1988</text>
  <text x="336" y="420" text-anchor="middle" font-size="16" fill="var(--dim)">2023</text>
  <text x="160" y="454" font-size="16" fill="var(--ink)">Elite two thirds state-based, then two thirds private sector</text>

  <text x="480" y="512" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">Six generations in Britain, two in China</text>
</svg>
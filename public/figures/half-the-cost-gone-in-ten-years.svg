<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一根完整的實心柱代表鋼廠，右邊資料中心的柱子上半段在十年後變成空的虛線框，只剩下半段還在">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<text class="t" x="60" y="64">一半的錢，十年後不在了</text>
<text class="g" x="150" y="130">鋼廠</text>
<rect x="150" y="180" width="130" height="250" fill="var(--grey)"/>
<text class="s" x="215" y="458" text-anchor="middle">二十年後還在用</text>
<line x1="400" y1="120" x2="400" y2="470" stroke="var(--line)" stroke-width="1"/>
<text class="g" x="520" y="130">資料中心</text>
<rect x="520" y="305" width="130" height="125" fill="var(--grey)"/>
<rect x="520" y="180" width="130" height="125" fill="var(--accent)"/>
<text class="s" x="585" y="252" text-anchor="middle" style="fill:var(--page)">晶片</text>
<text class="s" x="585" y="374" text-anchor="middle">廠房電力</text>
<rect x="730" y="305" width="130" height="125" fill="var(--grey)"/>
<rect x="730" y="180" width="130" height="125" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="668" y1="242" x2="712" y2="242" stroke="var(--dim)" stroke-width="2"/>
<polygon points="722,242 706,235 706,249" fill="var(--dim)"/>
<text class="s" x="585" y="458" text-anchor="middle">今天</text>
<text class="s" x="795" y="458" text-anchor="middle">十年後</text>
<text class="c" x="60" y="512">所以就算不再新建，替換的需求還在</text>
</svg>
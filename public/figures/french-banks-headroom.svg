<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條橫條比長度，現在持債最短、過去高點居中、義大利同業最長，括號標出中間可加碼的空間">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">加碼的空間還有多長</text>
<text x="60" y="162" font-size="19" fill="var(--ink)">現在持債</text>
<rect x="240" y="138" width="160" height="42" rx="4" fill="var(--accent)"/>
<text x="60" y="262" font-size="19" fill="var(--ink)">2011 高點</text>
<rect x="240" y="238" width="270" height="42" rx="4" fill="var(--accent)" opacity="0.6"/>
<text x="524" y="268" font-size="16" fill="var(--dim)">仍在安全範圍</text>
<text x="60" y="362" font-size="19" fill="var(--ink)">義大利同業</text>
<rect x="240" y="338" width="600" height="42" rx="4" fill="var(--grey)"/>
<path d="M404 418 L404 440 L838 440 L838 418" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text x="500" y="474" font-size="22" fill="var(--warn)">空間 3,000 至 4,000 億</text>
</svg>
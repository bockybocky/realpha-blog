<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三條時間線中兩條中途斷掉，第三條延續且下方有一條平行的現金流線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="52" font-size="27" fill="var(--ink)">設計、製造、自用一手包</text>
<text x="60" y="166" font-size="19" fill="var(--dim)">IBM</text>
<path d="M230 160 L470 160" stroke="var(--accent)" stroke-width="5" fill="none"/>
<path d="M458 142 L482 178 M482 142 L458 178" stroke="var(--warn)" stroke-width="4"/>
<text x="506" y="166" font-size="19" fill="var(--warn)">退出</text>
<text x="60" y="256" font-size="19" fill="var(--dim)">摩托羅拉</text>
<path d="M230 250 L560 250" stroke="var(--accent)" stroke-width="5" fill="none"/>
<path d="M548 232 L572 268 M572 232 L548 268" stroke="var(--warn)" stroke-width="4"/>
<text x="596" y="256" font-size="19" fill="var(--warn)">退出</text>
<text x="60" y="346" font-size="19" fill="var(--dim)">三星</text>
<path d="M230 340 L880 340" stroke="var(--accent)" stroke-width="5" fill="none"/>
<circle cx="880" cy="340" r="8" fill="var(--accent)"/>
<text x="770" y="320" font-size="19" fill="var(--accent)">仍在</text>
<path d="M230 400 L880 400" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 7" fill="none"/>
<text x="230" y="432" font-size="16" fill="var(--warn)">記憶體現金流／政府支持／集團資金</text>
<path d="M230 460 L880 460" stroke="var(--line)" stroke-width="2"/>
<text x="830" y="488" font-size="16" fill="var(--dim)">時間</text>
<text x="60" y="520" font-size="22" fill="var(--ink)">撐住的那一條，底下另有一條線</text>
</svg>
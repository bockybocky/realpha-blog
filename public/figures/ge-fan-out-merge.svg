<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="最小分工表：分派節點展開成三條並行線，各讀一個開源專案的更新紀錄，收斂到合併節點；最長的那條決定合併何時開始">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #b9c2d0;
      --accent: #1f6feb;
      --warn:   #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #4a5464;
        --accent: #58a6ff;
        --warn:   #d29922;
      }
    }
    .t { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <defs>
    <marker id="gah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="380" fill="var(--page)"/>
  <text class="t" x="480" y="40" text-anchor="middle" font-size="24" fill="var(--ink)">分工表最小的完整形狀：發散，再收斂</text>

  <rect x="70" y="160" width="120" height="56" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="130" y="194" text-anchor="middle" font-size="18" fill="var(--ink)">分派</text>

  <!-- three parallel bars of different lengths -->
  <g>
    <rect x="300" y="88"  width="300" height="44" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="1.5"/>
    <rect x="300" y="166" width="330" height="44" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="1.5"/>
    <rect x="300" y="244" width="470" height="44" rx="8" fill="var(--warn)" fill-opacity="0.12" stroke="var(--warn)" stroke-width="2"/>
  </g>
  <g class="t" font-size="16" fill="var(--ink)">
    <text x="316" y="115">讀 Godot 更新紀錄（20 幾秒）</text>
    <text x="316" y="193">讀 OBS 更新紀錄（20 幾秒）</text>
    <text x="316" y="271">讀 Home Assistant 更新紀錄（最長，大家等它）</text>
  </g>

  <g stroke="var(--grey)" stroke-width="2" fill="none">
    <line x1="190" y1="172" x2="292" y2="110" marker-end="url(#gah)"/>
    <line x1="190" y1="188" x2="292" y2="188" marker-end="url(#gah)"/>
    <line x1="190" y1="204" x2="292" y2="266" marker-end="url(#gah)"/>
    <line x1="600" y1="110" x2="792" y2="172" marker-end="url(#gah)"/>
    <line x1="630" y1="188" x2="792" y2="188" marker-end="url(#gah)"/>
    <line x1="770" y1="266" x2="792" y2="204" marker-end="url(#gah)"/>
  </g>

  <rect x="800" y="160" width="120" height="56" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="860" y="194" text-anchor="middle" font-size="18" fill="var(--ink)">合併</text>

  <text class="t" x="480" y="345" text-anchor="middle" font-size="17" fill="var(--dim)">三條線各跑各的互不等待；只有合併節點要等三邊都回報，最慢的那條決定它何時開工</text>
</svg>

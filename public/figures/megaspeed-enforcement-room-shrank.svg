<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一個大方框代表電話之前執法人員可動的範圍，右邊同樣的範圍縮成一個明顯小很多的方框，中間一支箭頭由大指向小，小框底下列出被加上的三項限制">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56">同一個案子，能動的空間</text>
  <text class="g" x="90" y="126" text-anchor="start">之前</text>
  <rect x="90" y="140" width="340" height="256" rx="12" fill="var(--accent)" opacity="0.14"/>
  <rect x="90" y="140" width="340" height="256" rx="12" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="112" y="190" text-anchor="start" fill="var(--accent)">可動範圍</text>
  <text class="n" x="112" y="236" text-anchor="start" fill="var(--ink)">直接向公司索取資料</text>
  <text class="n" x="112" y="272" text-anchor="start" fill="var(--ink)">對外可以提名字</text>
  <text class="n" x="112" y="308" text-anchor="start" fill="var(--ink)">案子在 BIS 手上</text>
  <line x1="454" y1="268" x2="528" y2="268" stroke="var(--dim)" stroke-width="4"/>
  <polygon points="544,268 526,258 526,278" fill="var(--dim)"/>
  <text class="g" x="580" y="126" text-anchor="start">之後幾週到幾個月</text>
  <rect x="580" y="196" width="196" height="106" rx="10" fill="var(--warn)" opacity="0.16"/>
  <rect x="580" y="196" width="196" height="106" rx="10" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text class="g" x="678" y="256" text-anchor="middle" fill="var(--warn)">可動範圍</text>
  <text class="n" x="580" y="348" text-anchor="start">索資要先經上級批准</text>
  <text class="n" x="580" y="382" text-anchor="start">不得提那兩個名字</text>
  <text class="n" x="580" y="416" text-anchor="start">案子移交司法部</text>
  <text class="c" x="60" y="486">索資要先批准這一條，只套在一家公司身上</text>
</svg>
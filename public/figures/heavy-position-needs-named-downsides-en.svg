<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One bar on each side at the same height: the left bar sits on three solid blocks; below the right bar the space is blank and the bar hangs unsupported.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">What a heavy position stands on</text>
  <rect x="60" y="88" width="400" height="356" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="88" width="400" height="356" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="88" y="126">Downsides you can name</text>
  <text class="g" x="528" y="126">Can't name them</text>
  <rect x="200" y="150" width="120" height="186" fill="var(--accent)"/>
  <text class="s" x="336" y="250">80%</text>
  <rect x="160" y="344" width="200" height="20" fill="var(--grey)"/>
  <rect x="160" y="370" width="200" height="20" fill="var(--grey)"/>
  <rect x="160" y="396" width="200" height="20" fill="var(--grey)"/>
  <text class="s" x="160" y="438">Three of them, visible</text>
  <rect x="640" y="150" width="120" height="186" fill="var(--warn)"/>
  <text class="s" x="776" y="250">80%</text>
  <path d="M600 416 L800 416" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="s" x="600" y="438">Nothing underneath</text>
  <text class="c" x="60" y="494">Can't count them? You're betting on a feeling</text>
</svg>
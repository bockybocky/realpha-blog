<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three pairs of arrows: the dashed one above is the expectation, the solid one below the result, all three opposite">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">Three AI expectations</text>
<text x="64" y="158" font-size="19" fill="var(--dim)">Expected</text>
<text x="64" y="466" font-size="19" fill="var(--ink)">Actual</text>

<line x1="200" y1="282" x2="200" y2="190" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<polygon points="193,190 207,190 200,176" fill="var(--grey)"/>
<line x1="200" y1="326" x2="200" y2="418" stroke="var(--accent)" stroke-width="3"/>
<polygon points="192,418 208,418 200,432" fill="var(--accent)"/>
<rect x="110" y="282" width="180" height="44" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="200" y="311" font-size="19" fill="var(--ink)" text-anchor="middle">Replace</text>
<text x="200" y="158" font-size="16" fill="var(--dim)" text-anchor="middle">I'm replaced</text>
<text x="200" y="466" font-size="16" fill="var(--ink)" text-anchor="middle">Judgment pays</text>

<line x1="480" y1="282" x2="480" y2="190" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<polygon points="473,190 487,190 480,176" fill="var(--grey)"/>
<line x1="480" y1="326" x2="480" y2="418" stroke="var(--accent)" stroke-width="3"/>
<polygon points="472,418 488,418 480,432" fill="var(--accent)"/>
<rect x="390" y="282" width="180" height="44" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="311" font-size="19" fill="var(--ink)" text-anchor="middle">Compete</text>
<text x="480" y="158" font-size="16" fill="var(--dim)" text-anchor="middle">Kill rivals</text>
<text x="480" y="466" font-size="16" fill="var(--ink)" text-anchor="middle">More rivals</text>

<line x1="760" y1="282" x2="760" y2="190" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<polygon points="753,190 767,190 760,176" fill="var(--grey)"/>
<line x1="760" y1="326" x2="760" y2="418" stroke="var(--accent)" stroke-width="3"/>
<polygon points="752,418 768,418 760,432" fill="var(--accent)"/>
<rect x="670" y="282" width="180" height="44" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="760" y="311" font-size="19" fill="var(--ink)" text-anchor="middle">Load</text>
<text x="760" y="158" font-size="16" fill="var(--dim)" text-anchor="middle">Easier</text>
<text x="760" y="466" font-size="16" fill="var(--ink)" text-anchor="middle">Longer hours</text>

<text x="480" y="522" font-size="22" fill="var(--ink)" text-anchor="middle">All three reversed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="矮柱與兩倍高的柱子並列，箭頭從矮柱指向高柱，顯示進口一台電腦必須在五年內賺回兩倍的出口額">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="60" text-anchor="middle" font-size="27" fill="var(--ink)">一台電腦換一張出口承諾</text>
<line x1="120" y1="470" x2="840" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="190" y="320" width="150" height="150" rx="4" fill="var(--grey)"/>
<text x="265" y="300" text-anchor="middle" font-size="20" fill="var(--ink)">進口</text>
<text x="265" y="505" text-anchor="middle" font-size="16" fill="var(--dim)">B1728 · 30 萬美元</text>
<rect x="620" y="170" width="150" height="300" rx="4" fill="var(--accent)"/>
<text x="695" y="150" text-anchor="middle" font-size="20" fill="var(--ink)">出口</text>
<text x="695" y="505" text-anchor="middle" font-size="16" fill="var(--dim)">軟體 · 60 萬美元</text>
<path d="M370 395 L580 395" stroke="var(--ink)" stroke-width="2" fill="none"/>
<path d="M580 395 l-14 -7 l0 14 z" fill="var(--ink)"/>
<text x="475" y="378" text-anchor="middle" font-size="19" fill="var(--ink)">五年內</text>
<text x="475" y="425" text-anchor="middle" font-size="16" fill="var(--dim)">兩倍</text>
<text x="480" y="540" text-anchor="middle" font-size="22" fill="var(--ink)">守外匯的規定，把人推出了國門</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="有殼的圓與無殼融化的圓對比，殼代表機動性">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  .h{font-size:27px;font-weight:700;fill:var(--ink)}
  .g{font-size:19px;font-weight:700;fill:var(--ink)}
  .b{font-size:16px;fill:var(--dim)}
  .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t h" x="60" y="68">那層硬糖殼</text>
<circle cx="260" cy="250" r="118" fill="none" stroke="var(--accent)" stroke-width="7"/>
<circle cx="260" cy="250" r="96" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="208" y="244">火力</text>
<text class="t b" x="196" y="274">無人機／打擊</text>
<text class="t g" x="196" y="110" fill="var(--accent)">殼＝機動性</text>
<path d="M330 150 L300 190" stroke="var(--accent)" stroke-width="2"/>
<path d="M700 250 m-118 0 a118 118 0 0 1 180 -92" fill="none" stroke="var(--warn)" stroke-width="7" stroke-dasharray="10 14"/>
<path d="M604 300 a96 96 0 0 0 192 -24 l-10 70 q-86 36 -172 0 z" fill="var(--card)" stroke="var(--line)"/>
<circle cx="672" cy="416" r="11" fill="var(--card)" stroke="var(--line)"/>
<circle cx="716" cy="438" r="7" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="600" y="250">沒有殼</text>
<text class="t b" x="600" y="280">還沒進嘴就融在手上</text>
<text class="t g" x="600" y="110" fill="var(--warn)">殼掉了</text>
<text class="t c" x="60" y="486">殼裝不回去，機動就不回來</text>
</svg>
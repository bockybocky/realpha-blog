<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Running three projects at the same time makes them overlap, and only a queue spreads them apart.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style></defs>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t h" x="70" y="70">Three retrofits, only a queue finishes them</text>
<text class="t g" x="70" y="130">All at once</text>
<rect x="240" y="150" width="440" height="28" fill="var(--warn)" opacity="0.8"/>
<rect x="240" y="186" width="440" height="28" fill="var(--warn)" opacity="0.55"/>
<rect x="240" y="222" width="440" height="28" fill="var(--warn)" opacity="0.35"/>
<text class="t b" x="700" y="200">Interfaces collide</text>
<line x1="70" y1="300" x2="890" y2="300" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="70" y="360">One at a time</text>
<rect x="240" y="380" width="200" height="28" fill="var(--accent)"/>
<text class="t b" x="250" y="368">Liquid cooling</text>
<rect x="450" y="416" width="200" height="28" fill="var(--accent)" opacity="0.7"/>
<text class="t b" x="460" y="404">Optical links</text>
<rect x="660" y="452" width="200" height="28" fill="var(--accent)" opacity="0.45"/>
<text class="t b" x="670" y="440">800 VDC</text>
<line x1="240" y1="500" x2="880" y2="500" stroke="var(--grey)" stroke-width="2"/>
<text class="t b" x="240" y="526">Before</text>
<text class="t b" x="845" y="526">After</text>
<text class="t c" x="70" y="575">Cooling booths were packed; the order is already voted</text>
</svg>
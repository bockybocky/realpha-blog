<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Over the same period, the wide window has one checkpoint, while dividing the narrow window into three cells produces three checkpoints.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="64" font-size="27" fill="var(--ink)">Observation Window Width</text>

<text x="60" y="150" font-size="20" fill="var(--ink)">Three Months</text>
<rect x="240" y="120" width="540" height="90" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="510" cy="165" r="11" fill="var(--accent)"/>
<text x="820" y="172" font-size="19" fill="var(--dim)">1 Time</text>

<text x="60" y="330" font-size="20" fill="var(--ink)">One Month</text>
<rect x="240" y="300" width="176" height="90" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="422" y="300" width="176" height="90" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="604" y="300" width="176" height="90" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="328" cy="345" r="11" fill="var(--warn)"/>
<circle cx="510" cy="345" r="11" fill="var(--warn)"/>
<circle cx="692" cy="345" r="11" fill="var(--warn)"/>
<text x="820" y="352" font-size="19" fill="var(--warn)">3 Times</text>

<text x="240" y="450" font-size="16" fill="var(--dim)">Same Period</text>
<text x="700" y="450" font-size="16" fill="var(--dim)">Points Affected</text>
</svg>
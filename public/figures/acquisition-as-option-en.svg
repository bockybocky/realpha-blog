<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A small box nested inside a large box, the areas wildly unequal, representing an option on a large market bought for little money.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .l { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">What the buyer is buying</text>
<text class="s" x="60" y="88">Area is the ratio</text>
<rect x="60" y="120" width="620" height="320" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="86" y="156">The market the buyer wants</text>
<text class="l" x="86" y="182">$40B</text>
<rect x="86" y="356" width="106" height="52" rx="6" fill="var(--accent)"/>
<text class="l" x="208" y="380" fill="var(--accent)">The price actually paid</text>
<text class="l" x="208" y="404">$1.26B</text>
<text class="g" x="716" y="190">What the seller must do</text>
<rect x="716" y="214" width="180" height="56" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="l" x="736" y="248">Budget sold into today</text>
<path d="M806 278 L806 306 M796 296 L806 310 L816 296" stroke="var(--accent)" stroke-width="2" fill="none"/>
<rect x="716" y="314" width="180" height="56" rx="8" fill="var(--accent)"/>
<text class="l" x="736" y="348" fill="var(--page)">Sell more once connected</text>
<text class="c" x="60" y="494">Only founders finish this step</text>
</svg>
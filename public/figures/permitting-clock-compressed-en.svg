<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two rows of bars are compared, and after the bill both the review period and the window for lawsuits are much shorter.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .d { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700">Both clocks shrink</text>
<text class="d" x="60" y="94" font-size="16">Bar length = time</text>

<text class="d" x="60" y="150" font-size="20" font-weight="700">Now</text>
<text class="d" x="60" y="200" font-size="16">EIS</text>
<rect x="230" y="178" width="470" height="34" rx="6" fill="var(--grey)"/>
<text class="t" x="248" y="201" font-size="16">~2 years (was 4-5)</text>
<text class="d" x="60" y="262" font-size="16">Lawsuits</text>
<rect x="230" y="240" width="620" height="34" rx="6" fill="var(--grey)"/>
<text class="t" x="248" y="263" font-size="16">6 yr</text>

<line x1="60" y1="310" x2="900" y2="310" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="60" y="364" font-size="20" font-weight="700">After</text>
<text class="d" x="60" y="414" font-size="16">EIS</text>
<rect x="230" y="392" width="300" height="34" rx="6" fill="var(--accent)"/>
<text class="t" x="248" y="415" font-size="16" fill="var(--page)">Caps</text>
<text class="d" x="60" y="476" font-size="16">Lawsuits</text>
<rect x="230" y="454" width="64" height="34" rx="6" fill="var(--accent)"/>
<text class="t" x="308" y="477" font-size="16">150 days</text>
<text class="d" x="430" y="477" font-size="16">+ vacatur gone</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Bars extending from a center axis, some sectors shrinking and others expanding, with an arc marking the movement of resources">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
  <marker id="a4" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto">
    <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--warn)"/>
  </marker>
</defs>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Construction didn't stop, it moved house</text>
<line x1="480" y1="110" x2="480" y2="480" stroke="var(--line)" stroke-width="2"/>
<text x="300" y="132" font-size="16" fill="var(--dim)" text-anchor="middle">Down</text>
<text x="660" y="132" font-size="16" fill="var(--dim)" text-anchor="middle">Up</text>

<rect x="300" y="160" width="180" height="34" rx="8" fill="var(--grey)"/>
<text x="286" y="183" font-size="19" fill="var(--ink)" text-anchor="end">Offices</text>

<rect x="240" y="216" width="240" height="34" rx="8" fill="var(--grey)"/>
<text x="226" y="239" font-size="19" fill="var(--ink)" text-anchor="end">Multifamily</text>

<rect x="450" y="272" width="60" height="34" rx="8" fill="var(--accent)" opacity="0.35"/>
<text x="524" y="295" font-size="19" fill="var(--ink)">Housing (okay)</text>

<rect x="480" y="328" width="150" height="34" rx="8" fill="var(--accent)"/>
<text x="644" y="351" font-size="19" fill="var(--ink)">Industrial</text>

<rect x="480" y="384" width="300" height="34" rx="8" fill="var(--accent)"/>
<text x="794" y="407" font-size="19" fill="var(--ink)">Data centers</text>

<path d="M300 250 C 300 330, 380 420, 470 410" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a4)"/>
<text x="252" y="330" font-size="16" fill="var(--warn)">Electricians</text>
<text x="252" y="356" font-size="16" fill="var(--warn)">Transformers</text>
<text x="252" y="382" font-size="16" fill="var(--warn)">Switchgear</text>

<text x="480" y="530" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">The same people and materials go to whoever pays more</text>
</svg>
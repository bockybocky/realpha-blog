<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三條長度遞增的橫條，代表三層理由的可搬移範圍：前兩層很短，第三層鋪滿整列">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:20px;fill:var(--ink)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">三層理由，能搬走的範圍差很多</text>
<text class="b" x="60" y="96">條的長度＝適用的國家範圍</text>

<text class="g" x="60" y="164">第一層　傳導</text>
<rect x="60" y="180" width="200" height="44" rx="6" fill="var(--grey)"/>
<text class="b" x="280" y="210">要以浮動利率借款為主</text>

<text class="g" x="60" y="284">第二層　賠錢去要錢</text>
<rect x="60" y="300" width="250" height="44" rx="6" fill="var(--grey)"/>
<text class="b" x="330" y="330">要鑄幣稅收入薄</text>

<text class="g" x="60" y="404">第三層　待在公債市場＝做財政</text>
<rect x="60" y="420" width="840" height="44" rx="6" fill="var(--accent)" opacity="0.8"/>
<text class="b" x="60" y="500">第三層沒有前提條件，所以誰都躲不掉</text>
</svg>
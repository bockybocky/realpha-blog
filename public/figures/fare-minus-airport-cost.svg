<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="票價條幾乎全被機場成本吃掉，剩下的缺口裝不下油、飛機、員工、維修四項成本">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70">剩下的那一截要裝四樣東西</text>

  <text class="g" x="60" y="130">票價 58 美元</text>
  <rect x="60" y="150" width="812" height="70" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="150" width="728" height="70" rx="8" fill="var(--grey)"/>
  <text class="g" x="424" y="193" text-anchor="middle">機場成本 52</text>
  <rect x="788" y="150" width="84" height="70" rx="8" fill="var(--accent)"/>
  <text class="d" x="830" y="193" text-anchor="middle" fill="var(--page)">6</text>

  <line x1="788" y1="228" x2="788" y2="300" stroke="var(--line)" stroke-dasharray="5 5"/>
  <line x1="872" y1="228" x2="872" y2="300" stroke="var(--line)" stroke-dasharray="5 5"/>
  <rect x="788" y="300" width="84" height="150" rx="6" fill="none" stroke="var(--accent)" stroke-dasharray="6 6" stroke-width="2"/>
  <text class="d" x="830" y="478" text-anchor="middle">能用的空間</text>

  <rect x="200" y="300" width="420" height="34" rx="5" fill="var(--warn)"/>
  <text class="d" x="212" y="324" fill="var(--page)">油</text>
  <rect x="200" y="340" width="360" height="34" rx="5" fill="var(--warn)"/>
  <text class="d" x="212" y="364" fill="var(--page)">飛機</text>
  <rect x="200" y="380" width="300" height="34" rx="5" fill="var(--warn)"/>
  <text class="d" x="212" y="404" fill="var(--page)">員工</text>
  <rect x="200" y="420" width="240" height="34" rx="5" fill="var(--warn)"/>
  <text class="d" x="212" y="444" fill="var(--page)">維修</text>

  <text class="c" x="60" y="528">這不是經營得好不好，是加法不成立</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三格計數器，前兩格已填、第三格仍空，表示警訊已響兩次">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="80" y="72" font-size="27" font-weight="700" fill="var(--ink)">核心 CPI 超預期的次數</text>
  <text class="t" x="80" y="108" font-size="16" fill="var(--dim)">判準：三次才算趨勢</text>

  <rect x="90" y="160" width="220" height="170" rx="14" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="200" cy="235" r="34" fill="var(--warn)"/>
  <text class="t" x="200" y="300" font-size="19" font-weight="600" text-anchor="middle" fill="var(--ink)">第一次</text>

  <rect x="370" y="160" width="220" height="170" rx="14" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="480" cy="235" r="34" fill="var(--warn)"/>
  <text class="t" x="480" y="300" font-size="19" font-weight="600" text-anchor="middle" fill="var(--ink)">第二次</text>

  <rect x="650" y="160" width="220" height="170" rx="14" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="760" cy="235" r="34" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
  <text class="t" x="760" y="300" font-size="19" font-weight="600" text-anchor="middle" fill="var(--dim)">第三次</text>

  <text class="t" x="200" y="372" font-size="16" text-anchor="middle" fill="var(--dim)">已發生</text>
  <text class="t" x="480" y="372" font-size="16" text-anchor="middle" fill="var(--dim)">已發生</text>
  <text class="t" x="760" y="372" font-size="16" text-anchor="middle" fill="var(--dim)">未知</text>

  <text class="t" x="480" y="452" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">還沒到第三次　＝　已經響了兩次</text>
</svg>
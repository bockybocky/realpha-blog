<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three positions on a zero-to-one axis: the pre-storm point sits in the left zone already marked as unreachable, hawks-win-all sits at the far right, and the post-reinstatement point lands in the middle.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t27{font-size:27px;font-weight:700;fill:var(--ink)}
.t19{font-size:19px;font-weight:700;fill:var(--ink)}
.t15{font-size:15px;fill:var(--dim)}
.t22{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t27" x="48" y="46">Between zero and one</text>

<rect x="140" y="276" width="140" height="48" fill="var(--card)"/>
<text class="t15" x="210" y="348" text-anchor="middle">Gone</text>
<line x1="140" y1="300" x2="860" y2="300" stroke="var(--grey)" stroke-width="4"/>
<line x1="140" y1="276" x2="140" y2="324" stroke="var(--grey)" stroke-width="4"/>
<line x1="860" y1="276" x2="860" y2="324" stroke="var(--grey)" stroke-width="4"/>
<text class="t15" x="140" y="252" text-anchor="middle">0</text>
<text class="t15" x="860" y="252" text-anchor="middle">1</text>
<text class="t15" x="140" y="380" text-anchor="middle">No change</text>
<text class="t15" x="860" y="380" text-anchor="middle">Banned</text>

<circle cx="210" cy="300" r="13" fill="var(--grey)"/>
<line x1="210" y1="287" x2="210" y2="200" stroke="var(--grey)" stroke-width="2"/>
<text class="t19" x="210" y="186" text-anchor="middle">Pre-storm</text>

<circle cx="530" cy="300" r="15" fill="var(--accent)"/>
<line x1="530" y1="315" x2="530" y2="420" stroke="var(--accent)" stroke-width="2"/>
<text class="t19" x="530" y="444" text-anchor="middle">After return</text>

<circle cx="860" cy="300" r="13" fill="var(--warn)"/>
<line x1="860" y1="287" x2="860" y2="200" stroke="var(--warn)" stroke-width="2"/>
<text class="t19" x="860" y="186" text-anchor="middle">Hawk dream</text>

<text class="t22" x="48" y="492">No zero, no all</text>
</svg>
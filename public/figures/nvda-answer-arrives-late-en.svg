<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the timeline the answer sits at the far right, while the price line above keeps jumping throughout the wait.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="70" font-size="27" fill="var(--ink)">The answer arrives later than the stock</text>
<polyline points="80,180 150,140 220,210 290,150 360,230 430,160 500,220 570,130 640,200 710,150 780,215 850,165 900,190" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text x="80" y="110" font-size="16" fill="var(--dim)">What the price reacts to in the meantime is something else</text>
<line x1="80" y1="330" x2="900" y2="330" stroke="var(--line)" stroke-width="3"/>
<circle cx="200" cy="330" r="9" fill="var(--accent)"/>
<circle cx="450" cy="330" r="9" fill="var(--accent)"/>
<circle cx="840" cy="330" r="12" fill="var(--warn)"/>
<text x="150" y="372" font-size="19" fill="var(--ink)">Next year</text>
<text x="150" y="400" font-size="16" fill="var(--dim)">No problem visible</text>
<text x="400" y="372" font-size="19" fill="var(--ink)">The year after</text>
<text x="400" y="400" font-size="16" fill="var(--dim)">Probably still not visible</text>
<text x="740" y="372" font-size="19" fill="var(--warn)">Two to three years out</text>
<text x="740" y="400" font-size="16" fill="var(--dim)">Only then an answer</text>
<text x="60" y="470" font-size="22" fill="var(--ink)">The risk is marked here, the quote moves every day</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="虛線分界左邊三個實心方塊、右邊一條虛線輪廓的利率路徑">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
<marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--dim)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">說輸入，不說輸出</text>
<rect x="60" y="90" width="840" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="500" y1="110" x2="500" y2="390" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="g" x="100" y="142">我說的</text>
<rect x="100" y="164" width="300" height="56" rx="10" fill="var(--accent)" opacity="0.18"/>
<rect x="100" y="164" width="300" height="56" rx="10" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="122" y="200">產出</text>
<rect x="100" y="234" width="300" height="56" rx="10" fill="var(--accent)" opacity="0.18"/>
<rect x="100" y="234" width="300" height="56" rx="10" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="122" y="270">就業</text>
<rect x="100" y="304" width="300" height="56" rx="10" fill="var(--accent)" opacity="0.18"/>
<rect x="100" y="304" width="300" height="56" rx="10" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="122" y="340">通膨</text>
<path d="M410 262 L560 262" fill="none" stroke="var(--dim)" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a4)"/>
<text class="g" x="600" y="142">你自己推的</text>
<rect x="600" y="164" width="250" height="196" rx="10" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 7"/>
<path d="M626 320 L690 270 L760 288 L826 210" fill="none" stroke="var(--grey)" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/>
<text class="s" x="626" y="352">利率</text>
<text class="c" x="60" y="462">推論在你那邊，承諾不在我這邊</text>
</svg>
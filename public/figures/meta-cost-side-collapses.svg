<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩組柱狀對比：左組兩柱等高相抵；右組一柱更高、另一柱塌成矮截，兩者間空出大面積。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">成本那一邊塌下來</text>
  <rect x="60" y="88" width="400" height="356" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="88" width="400" height="356" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="88" y="126">今天</text>
  <text class="g" x="528" y="126">智力價格掉到百分之一</text>
  <path d="M100 400 L420 400" stroke="var(--grey)" stroke-width="2"/>
  <path d="M540 400 L860 400" stroke="var(--grey)" stroke-width="2"/>
  <rect x="150" y="180" width="90" height="220" fill="var(--accent)"/>
  <text class="s" x="168" y="424">收入</text>
  <rect x="280" y="180" width="90" height="220" fill="var(--grey)"/>
  <text class="s" x="298" y="424">成本</text>
  <rect x="590" y="150" width="90" height="250" fill="var(--accent)"/>
  <text class="s" x="608" y="424">收入</text>
  <rect x="720" y="330" width="90" height="70" fill="var(--grey)"/>
  <text class="s" x="738" y="424">成本</text>
  <path d="M720 180 L810 180" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M765 190 L765 318" stroke="var(--warn)" stroke-width="4"/>
  <path d="M757 304 L765 324 L773 304" fill="var(--warn)"/>
  <text class="c" x="60" y="494">買的多半是智力，所以降的是那一邊</text>
</svg>
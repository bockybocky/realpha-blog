<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間線上三個點，現在與量產之間隔著很長一段距離，下方以括號標記">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="56" y="56" font-size="27" font-weight="700" fill="var(--ink)">從規格公開到量產，中間有多遠</text>
<line x1="120" y1="230" x2="880" y2="230" stroke="var(--line)" stroke-width="4"/>
<circle cx="120" cy="230" r="12" fill="var(--accent)"/>
<circle cx="470" cy="230" r="10" fill="var(--page)" stroke="var(--grey)" stroke-width="4"/>
<circle cx="840" cy="230" r="10" fill="var(--page)" stroke="var(--grey)" stroke-width="4"/>
<text x="120" y="192" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">現在</text>
<text x="120" y="164" font-size="16" fill="var(--dim)" text-anchor="middle">規格 0.7.0</text>
<text x="470" y="192" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">工程樣品</text>
<text x="470" y="164" font-size="16" fill="var(--dim)" text-anchor="middle">2027 年底</text>
<text x="840" y="192" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">量產</text>
<text x="840" y="164" font-size="16" fill="var(--dim)" text-anchor="middle">2029 年</text>
<path d="M120 280 L120 300 L840 300 L840 280" fill="none" stroke="var(--grey)" stroke-width="2"/>
<line x1="480" y1="300" x2="480" y2="318" stroke="var(--grey)" stroke-width="2"/>
<text x="480" y="348" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">兩次以上資本支出週期</text>
<text x="480" y="378" font-size="16" fill="var(--dim)" text-anchor="middle">兩次以上產品世代</text>
<text x="56" y="462" font-size="22" font-weight="700" fill="var(--ink)">願意談介面，不等於有人下單</text>
</svg>
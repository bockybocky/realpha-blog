<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一個模型的兩根分數柱，左矮右高，差別只在框架">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="80" y="58" font-size="27" font-weight="700" fill="var(--ink)">同一個模型，同一份題目</text>

  <line x1="150" y1="470" x2="830" y2="470" stroke="var(--line)" stroke-width="2"/>
  <line x1="150" y1="150" x2="830" y2="150" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="838" y="156" font-size="15" fill="var(--dim)">滿分</text>

  <rect x="250" y="282" width="150" height="188" rx="8" fill="var(--grey)"/>
  <text x="325" y="262" font-size="34" font-weight="700" fill="var(--ink)" text-anchor="middle">62.7</text>
  <text x="325" y="506" font-size="19" font-weight="600" fill="var(--dim)" text-anchor="middle">主辦方框架</text>
  <text x="325" y="532" font-size="15" fill="var(--dim)" text-anchor="middle">用 API 接進去</text>

  <rect x="580" y="170" width="150" height="300" rx="8" fill="var(--accent)"/>
  <text x="655" y="150" font-size="34" font-weight="700" fill="var(--accent)" text-anchor="middle">99.9</text>
  <text x="655" y="506" font-size="19" font-weight="600" fill="var(--ink)" text-anchor="middle">自家框架</text>
  <text x="655" y="532" font-size="15" fill="var(--dim)" text-anchor="middle">記憶與上下文管理</text>

  <text x="80" y="112" font-size="22" font-weight="600" fill="var(--ink)">差的 37 分，不在模型，在框架。</text>
</svg>
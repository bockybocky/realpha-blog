<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三級越來越陡的階梯，利潤率每加十個百分點，公司價值的跳幅就放大一次">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">藏在標價裡的那個假設：長期營業利益率</text>
<line x1="80" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="130" y="380" width="150" height="60" fill="var(--grey)"/>
<text class="g" x="130" y="366">1 兆</text>
<text class="g" x="130" y="472">20%</text>
<rect x="360" y="320" width="150" height="120" fill="var(--grey)"/>
<text class="g" x="360" y="306">2 兆</text>
<text class="g" x="360" y="472">30%</text>
<rect x="590" y="140" width="150" height="300" fill="var(--accent)"/>
<text class="g" x="590" y="126">5 兆</text>
<text class="g" x="590" y="472">40%</text>
<line x1="790" y1="140" x2="790" y2="380" stroke="var(--warn)" stroke-width="3"/>
<line x1="782" y1="140" x2="798" y2="140" stroke="var(--warn)" stroke-width="3"/>
<line x1="782" y1="380" x2="798" y2="380" stroke="var(--warn)" stroke-width="3"/>
<text class="c" x="812" y="252">差 4 兆</text>
<text class="d" x="812" y="282">同一條營收</text>
<text class="d" x="130" y="504">示意用的整數，不是估值結論</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="一塊很寬的底座撐著上方三個並排的方塊，三支箭頭從底座指向上方，形狀是三塊全部站在同一塊地基上" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>

  <text x="80" y="70" font-size="27" font-weight="700" fill="var(--ink)">上面三塊，站在同一塊地基上</text>

  <rect x="110" y="190" width="200" height="120" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="390" y="190" width="200" height="120" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="670" y="190" width="200" height="120" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text x="210" y="243" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Starlink</text>
  <text x="210" y="273" font-size="15" fill="var(--dim)" text-anchor="middle">滲透率</text>
  <text x="490" y="243" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">AI 算力</text>
  <text x="490" y="273" font-size="15" fill="var(--dim)" text-anchor="middle">貨幣化率</text>
  <text x="770" y="243" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">自有模型</text>
  <text x="770" y="273" font-size="15" fill="var(--dim)" text-anchor="middle">選擇權</text>

  <line x1="210" y1="378" x2="210" y2="330" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="210,314 202,332 218,332" fill="var(--accent)"/>
  <line x1="490" y1="378" x2="490" y2="330" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="490,314 482,332 498,332" fill="var(--accent)"/>
  <line x1="770" y1="378" x2="770" y2="330" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="770,314 762,332 778,332" fill="var(--accent)"/>

  <rect x="110" y="380" width="760" height="120" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text x="490" y="432" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">發射</text>
  <text x="490" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">可重複使用 → 每公斤入軌成本</text>

  <text x="80" y="562" font-size="22" font-weight="700" fill="var(--ink)">地基不成立，上面三塊就沒有經濟意義</text>
</svg>
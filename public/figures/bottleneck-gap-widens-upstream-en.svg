<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three stacked bars running upstream where the shortfall widens at each level, from data centres to memory at sixty to seventy percent of requests to lasers with the largest gap.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">The same chain: the further upstream, the wider the gap</text>

  <line x1="72" y1="420" x2="72" y2="140" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="72,128 79,144 65,144" fill="var(--grey)"/>
  <text class="t" x="52" y="290" font-size="16" fill="var(--dim)" transform="rotate(-90 52 290)" text-anchor="middle">Upstream</text>

  <text class="t" x="110" y="176" font-size="19" font-weight="700" fill="var(--ink)">InP lasers</text>
  <text class="t" x="110" y="200" font-size="15" fill="var(--dim)">Upstream</text>
  <rect x="330" y="150" width="480" height="40" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="330" y="150" width="288" height="40" fill="var(--accent)"/>
  <rect x="618" y="150" width="192" height="40" fill="var(--warn)"/>
  <text class="t" x="810" y="212" font-size="15" text-anchor="end" fill="var(--warn)">Gap over 30%, insiders say worse</text>

  <text class="t" x="110" y="286" font-size="19" font-weight="700" fill="var(--ink)">Memory: DRAM and HBM</text>
  <text class="t" x="110" y="310" font-size="15" fill="var(--dim)">Midstream</text>
  <rect x="330" y="260" width="480" height="40" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="330" y="260" width="312" height="40" fill="var(--accent)"/>
  <rect x="642" y="260" width="168" height="40" fill="var(--warn)"/>
  <text class="t" x="810" y="322" font-size="15" text-anchor="end" fill="var(--warn)">Getting 60-70% of what they ask for</text>

  <text class="t" x="110" y="396" font-size="19" font-weight="700" fill="var(--ink)">Data centres</text>
  <text class="t" x="110" y="420" font-size="15" fill="var(--dim)">Downstream</text>
  <rect x="330" y="370" width="480" height="40" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="330" y="370" width="432" height="40" fill="var(--accent)"/>
  <rect x="762" y="370" width="48" height="40" fill="var(--warn)"/>
  <text class="t" x="810" y="432" font-size="15" text-anchor="end" fill="var(--warn)">Capex still rising and still not enough</text>

  <line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="60" y="508" font-size="22" font-weight="700" fill="var(--ink)">The tightest layer is not always the most discussed one</text>
  <text class="t" x="900" y="508" font-size="14" text-anchor="end" fill="var(--dim)">Illustrative, not to scale</text>
</svg>
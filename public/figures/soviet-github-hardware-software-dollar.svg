<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="美國硬體與軟體支出兩根柱等高，蘇聯硬體柱同高但軟體只剩貼地的一條細線">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="60" y="54" font-size="27" font-weight="700" fill="var(--ink)">每花一美元買硬體，花多少錢買軟體（1980）</text>

  <line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

  <text x="170" y="112" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">美國</text>
  <rect x="100" y="150" width="86" height="270" rx="4" fill="var(--grey)"/>
  <rect x="216" y="150" width="86" height="270" rx="4" fill="var(--accent)"/>
  <text x="143" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">硬體</text>
  <text x="259" y="452" font-size="16" fill="var(--accent)" text-anchor="middle">軟體</text>
  <text x="143" y="136" font-size="16" fill="var(--dim)" text-anchor="middle">1 美元</text>
  <text x="259" y="136" font-size="16" fill="var(--accent)" text-anchor="middle">1 美元</text>

  <line x1="480" y1="120" x2="480" y2="440" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>

  <text x="700" y="112" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">蘇聯</text>
  <rect x="630" y="150" width="86" height="270" rx="4" fill="var(--grey)"/>
  <rect x="746" y="414" width="86" height="6" rx="2" fill="var(--warn)"/>
  <text x="673" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">硬體</text>
  <text x="789" y="452" font-size="16" fill="var(--warn)" text-anchor="middle">軟體</text>
  <text x="673" y="136" font-size="16" fill="var(--dim)" text-anchor="middle">1 美元</text>
  <text x="789" y="396" font-size="16" fill="var(--warn)" text-anchor="middle" font-weight="700">1.5 到 2 美分</text>

  <text x="60" y="504" font-size="22" font-weight="700" fill="var(--ink)">弄得到別人的程式，就不必自己投資</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條橫長條分成大小兩段，左邊一大段是已經懂的 AI 概念，右邊一小段是要背的 Azure 服務名，一支箭頭從大段指向小段，指出力氣要全砸在小的那一段。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="60" y="74" font-size="27" font-weight="700" fill="var(--ink)">準備的力氣該放在哪</text>

  <text x="60" y="168" font-size="19" fill="var(--dim)">AI 概念</text>
  <text x="620" y="168" font-size="19" font-weight="700" fill="var(--accent)">Azure 服務名</text>

  <rect x="60" y="190" width="550" height="88" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="620" y="190" width="280" height="88" rx="8" fill="var(--accent)"/>

  <text x="92" y="243" font-size="16" fill="var(--dim)">你已經懂</text>
  <text x="652" y="243" font-size="16" font-weight="700" fill="var(--page)">要背</text>

  <line x1="335" y1="340" x2="735" y2="340" stroke="var(--accent)" stroke-width="4"/>
  <polygon points="735,326 768,340 735,354" fill="var(--accent)"/>
  <text x="404" y="392" font-size="20" font-weight="700" fill="var(--accent)">力氣全砸這裡</text>

  <text x="60" y="466" font-size="22" fill="var(--ink)">難的不是理解，是對應</text>
</svg>
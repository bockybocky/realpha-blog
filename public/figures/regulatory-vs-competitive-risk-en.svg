<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two paths: on the left a narrow, deep, clearly bounded dip that returns quickly; on the right a gradually falling dashed line that fades and never returns">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.s { font-size:16px; fill:var(--dim); }
.g { font-size:20px; font-weight:600; }
.n { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">Two risks, two shapes</text>
<text class="s" x="60" y="94">One has edges, one doesn't</text>
<line x1="80" y1="300" x2="440" y2="300" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="520" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="480" y1="130" x2="480" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="80" y="170" fill="var(--accent)">Regulatory</text>
<polyline points="90,300 190,300 240,424 300,308 440,300" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="n" x="240" y="462" text-anchor="middle">Overdone, priced fast</text>
<text class="g" x="520" y="170" fill="var(--warn)">Competitive</text>
<polyline points="530,300 620,318" fill="none" stroke="var(--warn)" stroke-width="4"/>
<polyline points="620,318 720,350" fill="none" stroke="var(--warn)" stroke-width="4" opacity="0.8" stroke-dasharray="14 6"/>
<polyline points="720,350 820,392" fill="none" stroke="var(--warn)" stroke-width="4" opacity="0.6" stroke-dasharray="10 8"/>
<polyline points="820,392 900,430" fill="none" stroke="var(--warn)" stroke-width="4" opacity="0.4" stroke-dasharray="6 10"/>
<text class="n" x="700" y="462" text-anchor="middle">Hidden early, never returns</text>
<text class="c" x="60" y="514">Wait out one, not the other</text>
</svg>
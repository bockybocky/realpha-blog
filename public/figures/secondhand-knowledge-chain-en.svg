<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The knowledge chain breaks at the embedded observer link, ending in four fragments that cannot be fitted together.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  .h{font-size:27px;font-weight:700;fill:var(--ink)}
  .g{font-size:19px;font-weight:700;fill:var(--ink)}
  .b{font-size:16px;fill:var(--dim)}
  .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--grey)"/></marker></defs>
<text class="t h" x="60" y="68">Where knowledge enters</text>
<rect x="60" y="150" width="150" height="86" rx="8" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)"/>
<text class="t g" x="84" y="188">Front line</text>
<text class="t b" x="84" y="216">How they fight</text>
<rect x="250" y="150" width="170" height="86" rx="8" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 7"/>
<text class="t g" x="274" y="188" fill="var(--warn)">Embedded observers</text>
<text class="t b" x="274" y="216" fill="var(--warn)">This link is missing</text>
<rect x="460" y="150" width="150" height="86" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="484" y="188">Kyiv</text>
<text class="t b" x="484" y="216">Not the front</text>
<rect x="650" y="150" width="250" height="86" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="674" y="188">Secondhand</text>
<text class="t b" x="674" y="216">A few analysts visit each quarter</text>
<line x1="212" y1="193" x2="246" y2="193" stroke="var(--grey)" stroke-width="2" marker-end="url(#a5)"/>
<line x1="424" y1="193" x2="456" y2="193" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="612" y1="193" x2="646" y2="193" stroke="var(--grey)" stroke-width="2" marker-end="url(#a5)"/>
<text class="t g" x="60" y="312">What lands in the institution</text>
<rect x="60" y="340" width="170" height="74" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="84" y="384">A piece per service</text>
<rect x="258" y="356" width="170" height="74" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="282" y="400">A piece per theater</text>
<rect x="456" y="336" width="170" height="74" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="480" y="380">A tech-first piece</text>
<rect x="654" y="358" width="170" height="74" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="678" y="402">Don't mention Ukraine</text>
<text class="t c" x="60" y="498">No observers, only fragments</text>
</svg>
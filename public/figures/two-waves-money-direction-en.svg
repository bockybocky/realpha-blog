<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The two waves of investment flow in opposite directions: the first was driven by government subsidies bringing companies back, while the later wave is funded by companies themselves to secure production time.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">The payer flips the flow</text>

  <rect x="60" y="100" width="390" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="88" y="140">2017–2018</text>
  <text class="b" x="88" y="168">Five gaps: water, power, labor, land</text>

  <rect x="88" y="200" width="110" height="56" rx="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="104" y="234">Government</text>
  <rect x="312" y="200" width="110" height="56" rx="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="328" y="234">Taiwanese firms</text>
  <path d="M206 228 L300 228" stroke="var(--grey)" stroke-width="4" fill="none"/>
  <path d="M300 228 l-14 -8 l0 16 z" fill="var(--grey)"/>
  <text class="b" x="212" y="212">Tax cuts・preferential loans</text>

  <path d="M88 300 L422 300" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="b" x="88" y="334">Repatriated money buys production equipment only</text>
  <text class="b" x="88" y="360">No real estate</text>

  <rect x="510" y="100" width="390" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="538" y="140">After 2022</text>
  <text class="b" x="538" y="168">No one is subsidizing it</text>

  <rect x="538" y="200" width="110" height="56" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text class="b" x="554" y="234" fill="var(--ink)">Major firms</text>
  <rect x="762" y="200" width="110" height="56" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text class="b" x="778" y="234" fill="var(--ink)">Taiwan</text>
  <path d="M656 228 L750 228" stroke="var(--accent)" stroke-width="5" fill="none"/>
  <path d="M750 228 l-16 -9 l0 18 z" fill="var(--accent)"/>
  <text class="b" x="660" y="212" fill="var(--accent)">Self-funded</text>

  <path d="M538 300 L872 300" stroke="var(--accent)" stroke-width="2"/>
  <text class="b" x="538" y="334" fill="var(--ink)">First to mass-produce wins orders</text>
  <text class="b" x="538" y="360">Buy, rent, new or old—all come after time</text>

  <text class="c" x="60" y="470">The first wave was invited back; this wave comes by choice</text>
  <text class="b" x="60" y="502">So the later wave can pay a premium for time</text>
</svg>
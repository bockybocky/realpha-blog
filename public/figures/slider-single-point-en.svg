<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Three dispersed assembly nodes converge on a single slider fab through thick lines, with only one hairline third-party bypass, forming an hourglass-shaped single point.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">The layer you can swap, and the one you cannot</text>
<text x="60" y="86" font-size="16" fill="var(--dim)">The hourglass in the HDD supply chain</text>

<rect x="90" y="140" width="200" height="64" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="330" y="140" width="200" height="64" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="570" y="140" width="200" height="64" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="190" y="178" font-size="16" text-anchor="middle" fill="var(--ink)">Thai assembly</text>
<text x="430" y="178" font-size="16" text-anchor="middle" fill="var(--ink)">Malaysia assembly 40%</text>
<text x="670" y="178" font-size="16" text-anchor="middle" fill="var(--ink)">Other assembly sites</text>
<text x="60" y="122" font-size="20" font-weight="700" fill="var(--ink)">Assembly: spread out</text>

<path d="M190 204 L380 300" stroke="var(--accent)" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
<path d="M430 204 L430 300" stroke="var(--accent)" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
<path d="M670 204 L480 300" stroke="var(--accent)" stroke-width="20" stroke-linecap="round" opacity="0.85"/>

<rect x="290" y="308" width="290" height="84" fill="var(--accent)"/>
<text x="435" y="344" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">In-house slider fab</text>
<text x="435" y="372" font-size="16" text-anchor="middle" fill="var(--page)">This one only</text>
<text x="60" y="292" font-size="20" font-weight="700" fill="var(--ink)">Sliders: one box only</text>

<rect x="700" y="316" width="180" height="68" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="790" y="346" font-size="15" text-anchor="middle" fill="var(--dim)">Philippine third party</text>
<text x="790" y="368" font-size="15" text-anchor="middle" fill="var(--dim)">Covers a sliver</text>
<path d="M790 384 L620 466" stroke="var(--dim)" stroke-width="4" stroke-linecap="round"/>

<path d="M435 392 L435 462" stroke="var(--accent)" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
<rect x="290" y="466" width="330" height="84" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="455" y="502" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">75% of pre-flood volume</text>
<text x="455" y="530" font-size="16" text-anchor="middle" fill="var(--warn)">affected</text>

<text x="480" y="582" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">The layer that spreads out cannot save you, the layer that converges decides you</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The bar is split into four segments, the first three sharing one color and totaling about two-thirds, with the last segment grey at about one-third.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); }
.g { font-size:20px; fill:var(--ink); }
.s { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="68">Two-thirds of the index is one trade</text>

<rect x="60" y="150" width="840" height="110" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="150" width="336" height="110" fill="var(--accent)"/>
<rect x="396" y="150" width="84" height="110" fill="var(--accent)" opacity="0.78"/>
<rect x="480" y="150" width="126" height="110" fill="var(--accent)" opacity="0.56"/>
<line x1="396" y1="150" x2="396" y2="260" stroke="var(--page)" stroke-width="2"/>
<line x1="480" y1="150" x2="480" y2="260" stroke="var(--page)" stroke-width="2"/>
<text class="g" x="80" y="216" fill="var(--page)">Tech 40%</text>
<text class="s" x="404" y="216" fill="var(--page)">+10%</text>
<text class="s" x="498" y="216" fill="var(--page)">+15%</text>
<text class="s" x="700" y="216">Rest</text>

<line x1="60" y1="296" x2="606" y2="296" stroke="var(--accent)" stroke-width="4"/>
<line x1="60" y1="288" x2="60" y2="304" stroke="var(--accent)" stroke-width="4"/>
<line x1="606" y1="288" x2="606" y2="304" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="60" y="336">65%</text>

<text class="s" x="404" y="384">2 clouds</text>
<text class="s" x="498" y="384">Banks + power</text>

<line x1="60" y1="432" x2="900" y2="432" stroke="var(--line)"/>
<text class="c" x="60" y="476">Sell the bucket, all of it goes</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A tree diagram growing upward: one trunk at the bottom splits into five branches, each with a leaf, and a note on the right marks the difference between leaf and trunk." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>

<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Memorise leaves, or grasp the trunk</text>

<g stroke="var(--line)" stroke-width="2" fill="none">
<path d="M410 440 L110 368"/>
<path d="M410 440 L260 368"/>
<path d="M410 440 L410 368"/>
<path d="M410 440 L560 368"/>
<path d="M410 440 L710 368"/>
<path d="M110 320 L110 250"/>
<path d="M260 320 L260 250"/>
<path d="M410 320 L410 250"/>
<path d="M560 320 L560 250"/>
<path d="M710 320 L710 250"/>
</g>

<g>
<rect x="62" y="210" width="96" height="40" rx="8" fill="var(--card)" stroke="var(--grey)"/>
<text x="110" y="236" font-size="15" text-anchor="middle" fill="var(--dim)">OCR</text>
<rect x="212" y="210" width="96" height="40" rx="8" fill="var(--card)" stroke="var(--grey)"/>
<text x="260" y="236" font-size="15" text-anchor="middle" fill="var(--dim)">Sentiment</text>
<rect x="362" y="210" width="96" height="40" rx="8" fill="var(--card)" stroke="var(--grey)"/>
<text x="410" y="236" font-size="15" text-anchor="middle" fill="var(--dim)">Chat</text>
<rect x="512" y="210" width="96" height="40" rx="8" fill="var(--card)" stroke="var(--grey)"/>
<text x="560" y="236" font-size="15" text-anchor="middle" fill="var(--dim)">Prediction</text>
<rect x="662" y="210" width="96" height="40" rx="8" fill="var(--card)" stroke="var(--grey)"/>
<text x="710" y="236" font-size="15" text-anchor="middle" fill="var(--dim)">Fairness</text>
</g>
<g fill="var(--grey)">
<circle cx="86" cy="186" r="5"/><circle cx="110" cy="178" r="5"/><circle cx="134" cy="186" r="5"/>
<circle cx="236" cy="186" r="5"/><circle cx="260" cy="178" r="5"/><circle cx="284" cy="186" r="5"/>
<circle cx="386" cy="186" r="5"/><circle cx="410" cy="178" r="5"/><circle cx="434" cy="186" r="5"/>
<circle cx="536" cy="186" r="5"/><circle cx="560" cy="178" r="5"/><circle cx="584" cy="186" r="5"/>
<circle cx="686" cy="186" r="5"/><circle cx="710" cy="178" r="5"/><circle cx="734" cy="186" r="5"/>
</g>

<g>
<rect x="46" y="320" width="128" height="48" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="350" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Vision</text>
<rect x="196" y="320" width="128" height="48" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="260" y="350" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Language</text>
<rect x="346" y="320" width="128" height="48" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="410" y="350" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Generative</text>
<rect x="496" y="320" width="128" height="48" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="560" y="350" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Machine learning</text>
<rect x="646" y="320" width="128" height="48" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="710" y="350" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Responsible AI</text>
</g>

<rect x="230" y="440" width="360" height="64" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="410" y="480" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">Guess what, from which clues</text>

<g stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5">
<line x1="770" y1="230" x2="836" y2="230"/>
<line x1="600" y1="472" x2="836" y2="472"/>
</g>
<text x="846" y="224" font-size="19" font-weight="700" fill="var(--warn)">Leaf</text>
<text x="846" y="248" font-size="15" fill="var(--dim)">You forget</text>
<text x="846" y="466" font-size="19" font-weight="700" fill="var(--accent)">Trunk</text>
<text x="846" y="490" font-size="15" fill="var(--dim)">You infer</text>

<text x="410" y="552" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">One trunk line, all five branches hang on it</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊視線折下去看螢幕，右邊視線直視道路資訊貼在視線上">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:600}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t h" x="480" y="58" text-anchor="middle">同樣的資訊，放在哪裡</text>
<rect x="60" y="100" width="400" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="100" width="400" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<polygon points="150,400 230,225 290,225 370,400" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<polygon points="590,400 670,225 730,225 810,400" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="225" x2="420" y2="225" stroke="var(--line)" stroke-width="2"/>
<line x1="540" y1="225" x2="860" y2="225" stroke="var(--line)" stroke-width="2"/>
<rect x="112" y="318" width="126" height="70" rx="8" fill="var(--grey)" opacity="0.35"/>
<rect x="112" y="318" width="126" height="70" rx="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="290" cy="392" r="9" fill="var(--ink)"/>
<line x1="290" y1="392" x2="290" y2="248" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 7"/>
<line x1="286" y1="386" x2="196" y2="342" stroke="var(--accent)" stroke-width="4"/>
<circle cx="700" cy="392" r="9" fill="var(--ink)"/>
<line x1="700" y1="392" x2="700" y2="266" stroke="var(--accent)" stroke-width="4"/>
<rect x="620" y="240" width="160" height="16" rx="8" fill="var(--accent)"/>
<text class="t g" x="260" y="452" text-anchor="middle">資訊在下面</text>
<text class="t g" x="700" y="452" text-anchor="middle">資訊在視線上</text>
<text class="t c" x="480" y="504" text-anchor="middle">路，不必離開視線</text>
</svg>
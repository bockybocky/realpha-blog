<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="兩條一模一樣的下行線並排，底下兩組箭頭方向相反，一邊往上一邊往下">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
  <text x="80" y="56" font-size="27" font-weight="700" fill="var(--ink)">兩條一樣的線</text>

  <rect x="90" y="92" width="360" height="216" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <polyline points="130,132 190,166 250,154 310,206 370,198 420,258" fill="none" stroke="var(--grey)" stroke-width="5" stroke-linecap="round"/>
  <rect x="510" y="92" width="360" height="216" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <polyline points="550,132 610,166 670,154 730,206 790,198 840,258" fill="none" stroke="var(--grey)" stroke-width="5" stroke-linecap="round"/>

  <text x="90" y="348" font-size="20" font-weight="700" fill="var(--accent)">股價跌、生意沒跌</text>
  <text x="510" y="348" font-size="20" font-weight="700" fill="var(--warn)">生意真的壞了</text>

  <rect x="90" y="368" width="60" height="6" rx="3" fill="var(--accent)"/>
  <text x="168" y="380" font-size="16" fill="var(--ink)">財測 持平</text>
  <path d="M 120 434 L 138 408 L 102 408 Z" fill="var(--accent)"/>
  <text x="168" y="428" font-size="16" fill="var(--ink)">現金流 上升</text>
  <path d="M 120 482 L 138 456 L 102 456 Z" fill="var(--accent)"/>
  <text x="168" y="476" font-size="16" fill="var(--ink)">自家回購</text>

  <path d="M 540 366 L 558 392 L 522 392 Z" fill="var(--warn)"/>
  <text x="588" y="380" font-size="16" fill="var(--ink)">盈餘 下滑</text>
  <path d="M 540 414 L 558 440 L 522 440 Z" fill="var(--warn)"/>
  <text x="588" y="428" font-size="16" fill="var(--ink)">通路 斷裂</text>
  <path d="M 540 482 L 558 456 L 522 456 Z" fill="var(--warn)"/>
  <text x="588" y="476" font-size="16" fill="var(--ink)">對手 變強</text>

  <text x="80" y="580" font-size="22" font-weight="700" fill="var(--ink)">線一樣，處理相反</text>
</svg>
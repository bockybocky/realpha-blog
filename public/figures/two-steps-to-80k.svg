<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一根實心柱加一段虛線空柱，實心是伺服器撐到的高度，虛線那段還沒有東西填">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">8 萬點被拆成兩段</text>

  <line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>

  <rect x="190" y="290" width="190" height="180" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="285" y="265" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">5 萬點</text>
  <text class="t" x="285" y="385" font-size="16" fill="var(--dim)" text-anchor="middle">AI 伺服器</text>

  <rect x="570" y="290" width="190" height="180" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="665" y="385" font-size="16" fill="var(--dim)" text-anchor="middle">AI 伺服器</text>
  <rect x="570" y="140" width="190" height="150" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 7"/>
  <text class="t" x="665" y="205" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">殺手級應用</text>
  <text class="t" x="665" y="235" font-size="16" fill="var(--warn)" text-anchor="middle">內容不明</text>
  <text class="t" x="665" y="115" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">8 萬點</text>

  <text class="t" x="285" y="505" font-size="16" fill="var(--dim)" text-anchor="middle">只有這個：上不去</text>
  <text class="t" x="665" y="505" font-size="16" fill="var(--dim)" text-anchor="middle">董事長開的支票</text>
  <text class="t" x="60" y="545" font-size="22" fill="var(--ink)">缺的不是機器，是上面那一格還沒有東西。</text>
</svg>
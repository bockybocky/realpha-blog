<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="An illustrative line chart: the demand line climbs steadily to the right, while the price line spikes to a peak, collapses and recovers only slowly years later, with the entry moment marked at the peak.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600}
.b{font-size:16px}
.d{font-size:15px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">Right direction, wrong timing</text>
<line x1="100" y1="424" x2="880" y2="424" stroke="var(--line)" stroke-width="2"/>
<path d="M100 400 C 300 372, 560 292, 880 188" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M100 382 C 180 300, 220 168, 264 150 C 320 128, 372 320, 424 396 C 560 420, 700 330, 880 254" fill="none" stroke="var(--warn)" stroke-width="3"/>
<circle cx="264" cy="150" r="6" fill="var(--warn)"/>
<text class="b" x="282" y="144">You buy in here</text>
<text class="b" x="700" y="200" style="fill:var(--accent)">Real demand</text>
<text class="b" x="700" y="352" style="fill:var(--warn)">Market price</text>
<text class="d" x="100" y="450">1999</text>
<text class="d" x="880" y="450" text-anchor="end">Many years later</text>
<text class="c" x="60" y="504">Being right can mean waiting a long time</text>
</svg>
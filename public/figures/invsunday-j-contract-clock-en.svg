<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A line chart of transfer fee against time: a solid line gradually declines from a high level, then drops steeply to zero near contract expiry; a short dashed line appears only on the final steep drop, and a gray band on the right is labeled free agent.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .n { font-size:22px; font-weight:700; fill:var(--accent); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62">Contract time left decides who is rushing</text>

  <line x1="160" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
  <line x1="160" y1="110" x2="160" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="160" y="100">Transfer fee</text>
  <text class="b" x="900" y="500" text-anchor="end">Time → expiry</text>

  <rect x="760" y="110" width="140" height="360" fill="var(--grey)" opacity="0.25"/>
  <text class="b" x="830" y="500" text-anchor="middle">Free agent</text>

  <path d="M200 160 L560 190 L720 300 L800 460" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text class="g" x="300" y="140">Multi-year deal</text>

  <path d="M640 250 L800 460" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 6"/>
  <text class="g" x="596" y="236" text-anchor="end" fill="var(--warn)">One-year deal</text>

  <path d="M640 404 L800 404" stroke="var(--warn)" stroke-width="2"/>
  <path d="M640 396 L640 412" stroke="var(--warn)" stroke-width="2"/>
  <path d="M800 396 L800 412" stroke="var(--warn)" stroke-width="2"/>
  <text class="b" x="720" y="436" text-anchor="middle">Always in this stretch</text>

  <text class="c" x="200" y="420">All leverage exposed</text>
</svg>
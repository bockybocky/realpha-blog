<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three staggered term bars and a vertical line that can cut only one of them.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="48" y="62" font-size="27" fill="var(--ink)" font-weight="700">Stagger the terms and no single cut finishes it</text>

<rect x="250" y="130" width="520" height="46" rx="8" fill="var(--grey)"/>
<text x="48" y="160" font-size="19" fill="var(--ink)">Chairman, State Power Authority</text>

<rect x="330" y="206" width="560" height="46" rx="8" fill="var(--grey)"/>
<text x="48" y="236" font-size="19" fill="var(--ink)">Chairman, Triborough Bridge Authority</text>

<rect x="190" y="282" width="610" height="46" rx="8" fill="var(--grey)"/>
<text x="48" y="312" font-size="19" fill="var(--ink)">Parks Commissioner</text>

<line x1="430" y1="110" x2="430" y2="370" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 8"/>
<text x="448" y="400" font-size="16" fill="var(--warn)">The day the resignation threat was accepted</text>

<line x1="48" y1="430" x2="912" y2="430" stroke="var(--line)" stroke-width="2"/>
<text x="48" y="462" font-size="16" fill="var(--dim)">Decades</text>
<text x="820" y="462" font-size="16" fill="var(--dim)">Armor cracks</text>
<text x="48" y="506" font-size="22" fill="var(--ink)">Removing him waits on the structure loosening, not on a decision</text>
</svg>
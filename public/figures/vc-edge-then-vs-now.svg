<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左圖兩點在小圈內直接相連、周圍空曠；右圖中心點外有三層圓環，外面擠滿灰點">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="40" y="52" font-size="27" font-weight="700">投資人離創辦人有多遠</text>
<text x="240" y="115" font-size="20" font-weight="700" text-anchor="middle">八〇年代</text>
<text x="720" y="115" font-size="20" font-weight="700" text-anchor="middle">今天</text>
<line x1="480" y1="100" x2="480" y2="500" stroke="var(--line)" stroke-width="2"/>
<circle cx="240" cy="300" r="110" fill="var(--card)" stroke="var(--dim)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="240" y="220" font-size="16" text-anchor="middle" style="fill:var(--dim)">圈內</text>
<line x1="205" y1="300" x2="275" y2="300" stroke="var(--accent)" stroke-width="4"/>
<circle cx="205" cy="300" r="16" fill="var(--ink)"/>
<circle cx="275" cy="300" r="16" fill="var(--accent)"/>
<text x="205" y="345" font-size="15" text-anchor="middle">創辦人</text>
<text x="275" y="345" font-size="15" text-anchor="middle" style="fill:var(--accent)">投資人</text>
<circle cx="80" cy="170" r="10" fill="var(--grey)"/>
<circle cx="400" cy="440" r="10" fill="var(--grey)"/>
<circle cx="720" cy="300" r="130" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="720" cy="300" r="95" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="720" cy="300" r="60" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="720" cy="300" r="16" fill="var(--ink)"/>
<text x="720" y="335" font-size="15" text-anchor="middle">創辦人</text>
<text x="720" y="160" font-size="16" text-anchor="middle" style="fill:var(--dim)">中介</text>
<line x1="736" y1="300" x2="874" y2="300" stroke="var(--accent)" stroke-width="3" stroke-dasharray="6 6"/>
<circle cx="890" cy="300" r="16" fill="var(--accent)"/>
<text x="890" y="345" font-size="15" text-anchor="middle" style="fill:var(--accent)">投資人</text>
<circle cx="560" cy="160" r="10" fill="var(--grey)"/><circle cx="600" cy="130" r="10" fill="var(--grey)"/>
<circle cx="850" cy="150" r="10" fill="var(--grey)"/><circle cx="890" cy="190" r="10" fill="var(--grey)"/>
<circle cx="540" cy="230" r="10" fill="var(--grey)"/><circle cx="520" cy="300" r="10" fill="var(--grey)"/>
<circle cx="545" cy="370" r="10" fill="var(--grey)"/><circle cx="570" cy="440" r="10" fill="var(--grey)"/>
<circle cx="630" cy="470" r="10" fill="var(--grey)"/><circle cx="700" cy="480" r="10" fill="var(--grey)"/>
<circle cx="780" cy="470" r="10" fill="var(--grey)"/><circle cx="850" cy="440" r="10" fill="var(--grey)"/>
<circle cx="900" cy="390" r="10" fill="var(--grey)"/><circle cx="910" cy="240" r="10" fill="var(--grey)"/>
<circle cx="660" cy="140" r="10" fill="var(--grey)"/><circle cx="790" cy="130" r="10" fill="var(--grey)"/>
<circle cx="600" cy="410" r="10" fill="var(--grey)"/><circle cx="880" cy="110" r="10" fill="var(--grey)"/>
<text x="240" y="535" font-size="16" text-anchor="middle" style="fill:var(--dim)">玩家少｜直接見面｜圈外看不到</text>
<text x="720" y="535" font-size="16" text-anchor="middle" style="fill:var(--dim)">玩家多｜層層中介｜人人看得到</text>
</svg>
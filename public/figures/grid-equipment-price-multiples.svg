<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四條橫條從一倍基準線往右延伸到兩倍到三倍，顯示導線、開關設備、變壓器、燃氣電廠全面漲價">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .l { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="56" text-anchor="middle">電網設備漲了幾倍</text>
<text class="b" x="480" y="88" text-anchor="middle">相對過去，依節目口述</text>
<line x1="580" y1="120" x2="580" y2="424" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="750" y1="120" x2="750" y2="424" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="240" y="140" width="340" height="44" fill="var(--accent)"/>
<rect x="240" y="215" width="340" height="44" fill="var(--accent)"/>
<rect x="240" y="290" width="340" height="44" fill="var(--accent)"/>
<rect x="580" y="290" width="60" height="44" fill="var(--accent)" fill-opacity="0.35"/>
<rect x="240" y="365" width="340" height="44" fill="var(--accent)"/>
<rect x="580" y="365" width="170" height="44" fill="var(--accent)" fill-opacity="0.35"/>
<line x1="410" y1="120" x2="410" y2="424" stroke="var(--grey)" stroke-width="3"/>
<text class="l" x="222" y="169" text-anchor="end">導線</text>
<text class="l" x="222" y="244" text-anchor="end">開關設備</text>
<text class="l" x="222" y="319" text-anchor="end">變壓器</text>
<text class="l" x="222" y="394" text-anchor="end">燃氣電廠</text>
<text class="g" x="592" y="169">×2</text>
<text class="g" x="592" y="244">×2</text>
<text class="g" x="652" y="319">×2 以上</text>
<text class="g" x="762" y="394">×2–3</text>
<text class="b" x="410" y="450" text-anchor="middle">×1 原價</text>
<text class="b" x="580" y="450" text-anchor="middle">×2</text>
<text class="b" x="750" y="450" text-anchor="middle">×3</text>
<text class="b" x="480" y="488" text-anchor="middle">複循環燃氣電廠報價：每瓩 3,600 美元</text>
<text class="c" x="480" y="532" text-anchor="middle">新建和維修一起變貴</text>
</svg>
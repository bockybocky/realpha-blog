<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條視線從左邊的眼睛穿過中間虛線畫的方框，落在右邊三個實線方塊上">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">他看的是後面</text>
<circle cx="120" cy="280" r="34" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="120" cy="280" r="12" fill="var(--accent)"/>
<text x="120" y="352" font-size="19" fill="var(--ink)" text-anchor="middle">放款方</text>
<rect x="280" y="170" width="240" height="220" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text x="400" y="420" font-size="19" fill="var(--dim)" text-anchor="middle">資料中心</text>
<line x1="162" y1="280" x2="596" y2="280" stroke="var(--accent)" stroke-width="2"/>
<polygon points="614,280 594,272 594,288" fill="var(--accent)"/>
<rect x="630" y="166" width="270" height="58" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="765" y="203" font-size="19" fill="var(--ink)" text-anchor="middle">信用評等</text>
<rect x="630" y="248" width="270" height="58" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="765" y="285" font-size="19" fill="var(--ink)" text-anchor="middle">十二年租約</text>
<rect x="630" y="330" width="270" height="58" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="765" y="367" font-size="19" fill="var(--ink)" text-anchor="middle">穩定現金流</text>
<text x="480" y="486" font-size="22" fill="var(--ink)" text-anchor="middle">裡面在做什麼，不在他的問題清單上</text>
</svg>
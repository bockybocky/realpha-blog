<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左格兩條線分岔，右格兩條線一起往下">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="66" font-size="27" fill="var(--ink)">買的是壞月份的緩衝</text>
<rect x="60" y="110" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="88" y="152" font-size="20" fill="var(--dim)">本來買的</text>
<line x1="100" y1="200" x2="420" y2="350" stroke="var(--warn)" stroke-width="4"/>
<line x1="100" y1="200" x2="420" y2="228" stroke="var(--accent)" stroke-width="4"/>
<text x="300" y="218" font-size="15" fill="var(--accent)">那筆配置</text>
<text x="300" y="376" font-size="15" fill="var(--warn)">風險資產</text>
<text x="88" y="376" font-size="15" fill="var(--dim)">下跌時被墊住</text>
<rect x="500" y="110" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="528" y="152" font-size="20" fill="var(--dim)">十月拿到的</text>
<line x1="540" y1="200" x2="860" y2="350" stroke="var(--warn)" stroke-width="4"/>
<line x1="540" y1="200" x2="860" y2="322" stroke="var(--accent)" stroke-width="4"/>
<text x="528" y="376" font-size="15" fill="var(--dim)">兩條一起往下</text>
<text x="60" y="468" font-size="22" fill="var(--ink)">付了避險的錢，沒拿到避險</text>
</svg>
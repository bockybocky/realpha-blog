<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條累計收入曲線：家用錄影帶早期陡升到約十億後就平了，百老匯音樂劇是一條持續三十年的斜線，一路爬到一百一十億，終點高出前者十倍以上">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">同一個故事，兩個視窗</text>
  <text class="s" x="110" y="118">累計毛收入（億美元）</text>

  <line x1="110" y1="145" x2="880" y2="145" stroke="var(--line)" stroke-width="1"/>
  <line x1="110" y1="290" x2="880" y2="290" stroke="var(--line)" stroke-width="1"/>
  <line x1="110" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="1.5"/>
  <text class="s" x="96" y="151" text-anchor="end">120</text>
  <text class="s" x="96" y="296" text-anchor="end">60</text>
  <text class="s" x="96" y="436" text-anchor="end">0</text>

  <polyline points="110,430 187,406 880,406" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <circle cx="880" cy="406" r="6" fill="var(--grey)"/>
  <text class="g" x="872" y="392" text-anchor="end">家用錄影帶</text>
  <text class="b" x="872" y="372" text-anchor="end">約 10 億．一次買斷</text>

  <polyline points="110,430 880,164" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="880" cy="164" r="6" fill="var(--accent)"/>
  <text class="g" x="872" y="200" text-anchor="end">百老匯音樂劇</text>
  <text class="b" x="872" y="222" text-anchor="end">110 億．每年同一個斜率</text>

  <text class="s" x="110" y="454" text-anchor="middle">上映</text>
  <text class="s" x="495" y="454" text-anchor="middle">15 年</text>
  <text class="s" x="880" y="454" text-anchor="middle">30 年</text>

  <text class="c" x="60" y="510">高峰是一次，斜率是三十年</text>
</svg>
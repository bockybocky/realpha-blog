<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two pairs of overlapping circles are shown side by side: the circles on the left barely touch and are labeled “Share only the conclusion,” while those on the right overlap substantially and are labeled “Give them the exact same document.”"><rect x="0" y="0" width="960" height="560" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
<text x="80" y="56" font-size="27" fill="var(--ink)">What you share shapes what they can say</text>
<circle cx="170" cy="280" r="92" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="350" cy="280" r="92" fill="none" stroke="var(--line)" stroke-width="2"/>
<text x="150" y="168" font-size="16" fill="var(--dim)" text-anchor="middle">What you see</text>
<text x="370" y="168" font-size="16" fill="var(--dim)" text-anchor="middle">What they see</text>
<text x="260" y="432" font-size="20" fill="var(--ink)" text-anchor="middle">Share only the conclusion</text>
<text x="260" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">They can only offer general rules</text>
<line x1="480" y1="150" x2="480" y2="470" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="640" cy="280" r="92" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="724" cy="280" r="92" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="596" y="168" font-size="16" fill="var(--dim)" text-anchor="middle">What you see</text>
<text x="768" y="168" font-size="16" fill="var(--dim)" text-anchor="middle">What they see</text>
<text x="682" y="432" font-size="20" fill="var(--ink)" text-anchor="middle">Give them the exact same document</text>
<text x="682" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">Their advice fits your situation</text>
<text x="80" y="534" font-size="22" fill="var(--ink)">Only the overlap is where they can help</text>
</svg>
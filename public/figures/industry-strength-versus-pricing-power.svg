<line x1="48" y1="484" x2="912" y2="484" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="480" y="524" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">兩條線要分開問</text>

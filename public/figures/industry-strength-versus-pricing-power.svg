<text class="t" x="846" y="336" font-size="16" fill="var(--dim)" text-anchor="middle">廠商一直湧進來</text>

<path d="M110 390 C320 370 520 250 890 150" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="t" x="890" y="134" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="end">全球競爭力</text>

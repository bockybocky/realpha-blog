<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條上升線與一條下降線交叉，背景小方塊越往右越密">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">產業變強，單位利潤變薄</text>

<line x1="100" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="110" x2="100" y2="420" stroke="var(--line)" stroke-width="2"/>

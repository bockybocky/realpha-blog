<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一根高柱標七百億美元，右邊一根只剩不到三分之一高的柱標兩百億美元，兩者高度差的那一段被標成一路疊上來的毛利">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:700; fill:var(--ink); }
    .body { font-size:15px; fill:var(--dim); }
    .concl { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t title" x="60" y="56">一吉瓦，五年要多少錢</text>
  <line x1="80" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <rect x="160" y="120" width="130" height="320" fill="var(--grey)"/>
  <text class="t grp" x="160" y="106">現在 700 億美元</text>
  <rect x="620" y="348" width="130" height="92" fill="var(--accent)"/>
  <text class="t grp" x="620" y="334">他要的 200 億美元</text>
  <rect x="620" y="120" width="130" height="228" fill="var(--card)" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="t grp" x="620" y="190">這一段要壓掉</text>
  <text class="t body" x="620" y="216">能源、以及一路疊上來的毛利</text>
  <path d="M300 300 L600 300" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="612,300 594,292 594,308" fill="var(--grey)"/>
  <text class="t concl" x="80" y="500">沙子融掉到代幣送回來，一路的毛利</text>
</svg>
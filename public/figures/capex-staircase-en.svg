<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A three-step capex staircase, each step higher than the last, with the final step being guidance.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">The three-step capex staircase</text>

  <line x1="80" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

  <rect x="110" y="376" width="200" height="44" fill="var(--grey)" opacity="0.6"/>
  <text x="210" y="356" font-size="20" fill="var(--ink)" text-anchor="middle">$8.1B</text>
  <text x="210" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">Last year's first 3 quarters</text>

  <rect x="350" y="300" width="200" height="120" fill="var(--accent)" opacity="0.55"/>
  <text x="450" y="280" font-size="20" fill="var(--ink)" text-anchor="middle">$16.4B</text>
  <text x="450" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">One quarter this year</text>

  <rect x="590" y="140" width="200" height="280" fill="var(--accent)"/>
  <text x="690" y="120" font-size="20" fill="var(--ink)" text-anchor="middle">$35–40B</text>
  <text x="690" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">Next quarter's guidance</text>

  <text x="60" y="498" font-size="22" fill="var(--ink)">84% of it goes to AI data centers</text>
</svg>
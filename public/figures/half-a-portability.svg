<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="實線的完整可移植性對上虛線加問號的一半可移植性">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62">同一份原始碼，兩種命運</text>
  <line x1="480" y1="92" x2="480" y2="420" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="60" y="124">System/360</text>
  <rect x="60" y="146" width="130" height="60" rx="6" fill="var(--accent)"/>
  <text class="b" x="125" y="182" fill="var(--page)" text-anchor="middle">原始碼</text>
  <g stroke="var(--accent)" stroke-width="3" fill="none">
    <path d="M190 176 L300 140"/>
    <path d="M190 176 L300 176"/>
    <path d="M190 176 L300 212"/>
  </g>
  <rect x="300" y="118" width="130" height="44" rx="5" fill="var(--card)" stroke="var(--line)"/>
  <rect x="300" y="154" width="130" height="44" rx="5" fill="var(--card)" stroke="var(--line)"/>
  <rect x="300" y="190" width="130" height="44" rx="5" fill="var(--card)" stroke="var(--line)"/>
  <text class="b" x="300" y="268">跑得一樣</text>
  <text class="g" x="520" y="124">ARMU</text>
  <rect x="520" y="146" width="130" height="60" rx="6" fill="var(--grey)"/>
  <text class="b" x="585" y="182" fill="var(--page)" text-anchor="middle">原始碼</text>
  <g stroke="var(--warn)" stroke-width="3" fill="none" stroke-dasharray="8 8">
    <path d="M650 176 L760 140"/>
    <path d="M650 176 L760 176"/>
    <path d="M650 176 L760 212"/>
  </g>
  <text class="t" x="790" y="150" fill="var(--warn)">?</text>
  <text class="t" x="790" y="188" fill="var(--warn)">?</text>
  <text class="t" x="790" y="226" fill="var(--warn)">?</text>
  <text class="b" x="520" y="268">搬得過去，不保證跑得一樣好</text>
  <text class="c" x="60" y="370">比較表上寫得像優點</text>
  <text class="c" x="60" y="410">談判桌上不是籌碼</text>
</svg>
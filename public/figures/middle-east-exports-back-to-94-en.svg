<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The horizontal progress bar nearly reaches the dashed prewar baseline, leaving only a small gap at the right edge.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="48" y="54" font-size="27" font-weight="700" fill="var(--ink)">Middle East crude exports: back to 94% of prewar level</text>
<rect x="80" y="156" width="800" height="62" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="80" y="156" width="752" height="62" rx="6" fill="var(--accent)"/>
<text x="104" y="194" font-size="19" font-weight="700" fill="var(--page)">Latest: September</text>
<line x1="880" y1="134" x2="880" y2="240" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>
<text x="756" y="126" font-size="16" fill="var(--dim)">Prewar baseline</text>
<rect x="80" y="296" width="370" height="104" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="510" y="296" width="370" height="104" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="112" y="336" font-size="19" font-weight="700" fill="var(--warn)">On the surface</text>
<text x="112" y="372" font-size="16" fill="var(--dim)">Blockade declaration</text>
<text x="542" y="336" font-size="19" font-weight="700" fill="var(--accent)">Under the surface</text>
<text x="542" y="372" font-size="16" fill="var(--dim)">Exports continue</text>
<line x1="456" y1="348" x2="500" y2="348" stroke="var(--grey)" stroke-width="4"/>
<text x="48" y="470" font-size="22" font-weight="700" fill="var(--ink)">Declarations and actual flows are two different things</text>
</g>
</svg>
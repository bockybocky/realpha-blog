<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="水面線分成兩層，上層是對外可見的轉型動作，下層是薪酬預算升遷等內部人才在意的改動">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink)}
.g{font-size:19px;fill:var(--ink)}
.b{font-size:16px;fill:var(--dim)}
.s{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<text class="h" x="80" y="70">簡報上看得到的，與看不到的</text>
<text class="g" x="80" y="132" fill="var(--dim)">投資人看得到</text>
<rect x="80" y="156" width="180" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="170" y="196" text-anchor="middle">新部門</text>
<rect x="290" y="156" width="180" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="380" y="196" text-anchor="middle">新願景</text>
<rect x="500" y="156" width="180" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="590" y="196" text-anchor="middle">找顧問</text>
<rect x="710" y="156" width="180" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="800" y="196" text-anchor="middle">誓師大會</text>
<path d="M80 288 q 25 -14 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0" stroke="var(--accent)" stroke-width="3" fill="none"/>
<text class="g" x="80" y="352" fill="var(--accent)">內部人才在意</text>
<rect x="80" y="376" width="180" height="66" rx="10" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
<text x="170" y="416" font-size="16" fill="var(--ink)" text-anchor="middle">薪酬算法</text>
<rect x="290" y="376" width="180" height="66" rx="10" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
<text x="380" y="416" font-size="16" fill="var(--ink)" text-anchor="middle">預算決定權</text>
<rect x="500" y="376" width="180" height="66" rx="10" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
<text x="590" y="416" font-size="16" fill="var(--ink)" text-anchor="middle">升遷排隊</text>
<rect x="710" y="376" width="180" height="66" rx="10" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
<text x="800" y="416" font-size="16" fill="var(--ink)" text-anchor="middle">取消的會議</text>
<text class="c" x="80" y="504">水面下那些，比願景那一頁更難編。</text>
</svg>
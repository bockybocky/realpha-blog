<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A violently jumping line on the left for tone and a steady sloping line on the right for the reaction function, with a dashed line lying exactly on top of it">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56">One changes daily, one holds for years</text>

<rect x="60" y="100" width="390" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="90" y="142">Tone</text>
<text class="b" x="420" y="142" text-anchor="end">Hawk · dove</text>
<polyline points="95,320 130,200 165,330 200,190 235,340 270,210 305,326 340,196 375,336 410,230" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="255" y="378" text-anchor="middle">Rewritten by every headline</text>

<rect x="510" y="100" width="390" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="540" y="142">Reaction function</text>
<line x1="560" y1="180" x2="560" y2="330" stroke="var(--line)" stroke-width="2"/>
<line x1="560" y1="330" x2="860" y2="330" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="540" y="196" text-anchor="end">Action</text>
<text class="b" x="860" y="356" text-anchor="end">Data</text>
<polyline points="570,320 660,286 750,236 850,196" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="570,320 660,286 750,236 850,196" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 8"/>
<text class="b" x="705" y="378" text-anchor="middle">Same line tomorrow</text>

<text class="c" x="60" y="472">Follow the line, not today's adjective</text>
</svg>
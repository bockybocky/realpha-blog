<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A four-quadrant chart of ability to pay against willingness to pay, with the top two cells boxed as the zone companies target.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Willing to pay is not able to pay</text>

  <rect x="120" y="110" width="370" height="180" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="490" y="110" width="370" height="180" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="120" y="290" width="370" height="180" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="490" y="290" width="370" height="180" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="305" y="186" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">Cornered</text>
  <text class="t" x="305" y="216" font-size="15" fill="var(--dim)" text-anchor="middle">Fever, fever pills</text>
  <text class="t" x="675" y="186" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">Rich and urgent</text>
  <text class="t" x="675" y="216" font-size="15" fill="var(--dim)" text-anchor="middle">Charged the most</text>
  <text class="t" x="305" y="366" font-size="20" font-weight="700" fill="var(--grey)" text-anchor="middle">Money out of reach</text>
  <text class="t" x="305" y="396" font-size="15" fill="var(--dim)" text-anchor="middle">Has to be let go</text>
  <text class="t" x="675" y="366" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Rich, free to pick</text>
  <text class="t" x="675" y="396" font-size="15" fill="var(--dim)" text-anchor="middle">Compares and leaves</text>

  <rect x="114" y="104" width="752" height="192" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
  <text class="t" x="866" y="96" font-size="16" fill="var(--warn)" text-anchor="end">This row is the target</text>

  <line x1="120" y1="470" x2="880" y2="470" stroke="var(--ink)" stroke-width="2"/>
  <line x1="120" y1="104" x2="120" y2="470" stroke="var(--ink)" stroke-width="2"/>
  <text class="t" x="880" y="496" font-size="16" fill="var(--dim)" text-anchor="end">Ability to pay →</text>
  <text class="t" x="132" y="130" font-size="16" fill="var(--dim)">↑ Willingness to pay</text>

  <text class="t" x="60" y="544" font-size="22" font-weight="700" fill="var(--ink)">The highest price lands on the people with the fewest options.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-label="一條從不知道到非常確信的橫軸，兩端各聚著幾個議題；下方一個小樣本方塊被放大成一個大結論方塊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="610" fill="var(--page)"/>
  <text x="48" y="54" font-size="27" fill="var(--ink)">她的不知道，跟她的確信</text>

  <line x1="80" y1="250" x2="880" y2="250" stroke="var(--line)" stroke-width="3"/>

  <circle cx="140" cy="250" r="8" fill="var(--dim)"/>
  <text x="140" y="222" font-size="16" fill="var(--dim)" text-anchor="middle">回收比例</text>
  <circle cx="252" cy="250" r="8" fill="var(--dim)"/>
  <text x="252" y="286" font-size="16" fill="var(--dim)" text-anchor="middle">許可制度</text>
  <circle cx="364" cy="250" r="8" fill="var(--dim)"/>
  <text x="364" y="222" font-size="16" fill="var(--dim)" text-anchor="middle">融合</text>

  <circle cx="700" cy="250" r="8" fill="var(--warn)"/>
  <text x="700" y="222" font-size="16" fill="var(--warn)" text-anchor="middle">油氣蘊藏</text>
  <circle cx="830" cy="250" r="8" fill="var(--warn)"/>
  <text x="830" y="286" font-size="16" fill="var(--warn)" text-anchor="middle">太陽能占比</text>

  <text x="80" y="330" font-size="19" fill="var(--dim)">我不知道</text>
  <text x="880" y="330" font-size="19" fill="var(--warn)" text-anchor="end">我非常確信</text>

  <rect x="120" y="410" width="60" height="60" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
  <text x="150" y="500" font-size="15" fill="var(--dim)" text-anchor="middle">一個週末・一個電網</text>
  <line x1="220" y1="440" x2="520" y2="440" stroke="var(--warn)" stroke-width="2"/>
  <polygon points="520,432 520,448 552,440" fill="var(--warn)"/>
  <text x="370" y="424" font-size="15" fill="var(--warn)" text-anchor="middle">被放大</text>
  <rect x="560" y="382" width="300" height="116" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="710" y="447" font-size="17" fill="var(--ink)" text-anchor="middle">全國性的判斷</text>

  <text x="48" y="566" font-size="22" fill="var(--ink)">前者通常是資訊，後者通常是立場</text>
</svg>
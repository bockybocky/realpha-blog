<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上市高峰後落成一條長長不墜的水平尾巴，橫跨十三年，續作動機的箭頭往下">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="60" font-size="27" fill="var(--ink)">不斷的尾巴，稀釋掉的續作</text>
<rect x="48" y="90" width="864" height="330" rx="14" fill="var(--card)"/>
<line x1="100" y1="382" x2="890" y2="382" stroke="var(--line)" stroke-width="2"/>
<path d="M100 382 L150 140 C 200 200 230 300 300 330 C 420 360 560 336 880 332" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="168" y="130" font-size="19" fill="var(--ink)">上市高峰</text>
<text x="620" y="312" font-size="19" fill="var(--ink)">每年估計 5 億美元</text>
<text x="120" y="408" font-size="16" fill="var(--dim)">2013</text>
<text x="860" y="408" font-size="16" fill="var(--dim)" text-anchor="end">十三年</text>
<line x1="470" y1="196" x2="470" y2="296" stroke="var(--warn)" stroke-width="3"/>
<polygon points="462,294 478,294 470,312" fill="var(--warn)"/>
<text x="490" y="214" font-size="19" fill="var(--warn)">續作動機</text>
<text x="48" y="482" font-size="22" fill="var(--ink)">拖得最久，是因為舊作太賺</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="十二個月長條切成四段，真正能做事的只有中間四格，整條每年重來">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70">一年只有四格在動工</text>

  <rect x="60" y="130" width="840" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="130" width="140" height="80" rx="8" fill="var(--grey)"/>
  <rect x="200" y="130" width="210" height="80" fill="var(--grey)" opacity="0.55"/>
  <rect x="410" y="130" width="280" height="80" fill="var(--accent)"/>
  <rect x="690" y="130" width="210" height="80" fill="var(--grey)" opacity="0.55"/>
  <line x1="200" y1="130" x2="200" y2="210" stroke="var(--page)" stroke-width="2"/>
  <line x1="410" y1="130" x2="410" y2="210" stroke="var(--page)" stroke-width="2"/>
  <line x1="690" y1="130" x2="690" y2="210" stroke="var(--page)" stroke-width="2"/>

  <text class="d" x="130" y="178" text-anchor="middle">等預算</text>
  <text class="d" x="305" y="178" text-anchor="middle">暖機</text>
  <text class="g" x="550" y="178" text-anchor="middle" fill="var(--page)">做事</text>
  <text class="d" x="795" y="178" text-anchor="middle">收工</text>
  <text class="d" x="130" y="242" text-anchor="middle">2 個月</text>
  <text class="d" x="305" y="242" text-anchor="middle">3 個月</text>
  <text class="d" x="550" y="242" text-anchor="middle">4 個月</text>
  <text class="d" x="795" y="242" text-anchor="middle">3 個月</text>

  <text class="g" x="60" y="312">授權只到十二個月，然後整條重來</text>
  <rect x="60" y="334" width="840" height="18" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="410" y="334" width="280" height="18" rx="4" fill="var(--accent)"/>
  <rect x="60" y="366" width="840" height="18" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="410" y="366" width="280" height="18" rx="4" fill="var(--accent)"/>
  <rect x="60" y="398" width="840" height="18" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="410" y="398" width="280" height="18" rx="4" fill="var(--accent)"/>

  <text class="d" x="60" y="454">而這類資本專案要五到十年才做得完</text>
  <text class="c" x="60" y="494">不是沒錢，是每年只剩三分之一的工期</text>
</svg>
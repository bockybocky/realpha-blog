<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條比例條：美國佔全球市值三分之二、佔全球經濟五分之一、商品在指數裡只剩一小截">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">錢在哪裡，東西在哪裡</text>

<text x="60" y="148" font-size="19" fill="var(--dim)">全球股市市值</text>
<rect x="300" y="118" width="560" height="46" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="300" y="118" width="373" height="46" rx="6" fill="var(--accent)"/>
<text x="318" y="148" font-size="19" fill="var(--page)">美國</text>
<text x="690" y="148" font-size="19" fill="var(--ink)">三分之二</text>

<text x="60" y="258" font-size="19" fill="var(--dim)">全球經濟規模</text>
<rect x="300" y="228" width="560" height="46" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="300" y="228" width="112" height="46" rx="6" fill="var(--accent)"/>
<text x="428" y="258" font-size="19" fill="var(--ink)">五分之一</text>

<text x="60" y="368" font-size="19" fill="var(--dim)">指數裡的石油・銅・金</text>
<rect x="300" y="338" width="560" height="46" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="300" y="338" width="34" height="46" rx="6" fill="var(--warn)"/>
<text x="350" y="368" font-size="19" fill="var(--ink)">個位數</text>

<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="472" font-size="22" fill="var(--ink)">指數是資金的倒影，不是世界的地圖</text>
</svg>
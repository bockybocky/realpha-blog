<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four horizontal axes with arrows pointing from gray expected dots to blue actual dots, three pointing right and one pointing left.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">4 misjudged calls</text>
<text x="330" y="112" font-size="15" fill="var(--dim)">Low</text>
<text x="860" y="112" font-size="15" fill="var(--dim)" text-anchor="end">High</text>
<text x="60" y="176" font-size="19" fill="var(--ink)">DC rebound speed</text>
<line x1="330" y1="170" x2="860" y2="170" stroke="var(--line)" stroke-width="2"/>
<circle cx="450" cy="170" r="10" fill="var(--grey)"/>
<text x="450" y="148" font-size="15" fill="var(--dim)" text-anchor="middle">Exp.</text>
<line x1="462" y1="170" x2="742" y2="170" stroke="var(--accent)" stroke-width="3" marker-end="url(#m1)"/>
<circle cx="760" cy="170" r="12" fill="var(--accent)"/>
<text x="760" y="148" font-size="15" fill="var(--accent)" text-anchor="middle">Real</text>
<text x="60" y="266" font-size="19" fill="var(--ink)">War hit to EVs</text>
<line x1="330" y1="260" x2="860" y2="260" stroke="var(--line)" stroke-width="2"/>
<circle cx="760" cy="260" r="10" fill="var(--grey)"/>
<text x="760" y="238" font-size="15" fill="var(--dim)" text-anchor="middle">Exp.</text>
<line x1="748" y1="260" x2="448" y2="260" stroke="var(--accent)" stroke-width="3" marker-end="url(#m1)"/>
<circle cx="430" cy="260" r="12" fill="var(--accent)"/>
<text x="430" y="238" font-size="15" fill="var(--accent)" text-anchor="middle">Real</text>
<text x="60" y="356" font-size="19" fill="var(--ink)">Solar pace</text>
<line x1="330" y1="350" x2="860" y2="350" stroke="var(--line)" stroke-width="2"/>
<circle cx="460" cy="350" r="10" fill="var(--grey)"/>
<text x="460" y="328" font-size="15" fill="var(--dim)" text-anchor="middle">Fcst</text>
<line x1="472" y1="350" x2="772" y2="350" stroke="var(--accent)" stroke-width="3" marker-end="url(#m1)"/>
<circle cx="790" cy="350" r="12" fill="var(--accent)"/>
<text x="790" y="328" font-size="15" fill="var(--accent)" text-anchor="middle">Real</text>
<text x="60" y="446" font-size="19" fill="var(--ink)">Grid ramp</text>
<line x1="330" y1="440" x2="860" y2="440" stroke="var(--line)" stroke-width="2"/>
<circle cx="420" cy="440" r="10" fill="var(--grey)"/>
<text x="420" y="418" font-size="15" fill="var(--dim)" text-anchor="middle">Mkt</text>
<line x1="432" y1="440" x2="782" y2="440" stroke="var(--accent)" stroke-width="3" marker-end="url(#m1)"/>
<circle cx="800" cy="440" r="12" fill="var(--accent)"/>
<text x="800" y="418" font-size="15" fill="var(--accent)" text-anchor="middle">Shayle</text>
<text x="480" y="522" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Bias skews</text>
</svg>
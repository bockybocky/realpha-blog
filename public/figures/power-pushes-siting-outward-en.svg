<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The inner ring is the city, where power is contested and substations cannot be built; an arrow pushes the data center to the outer ring, marked by uncontested power and ample land.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">Fill in the power, and odd siting makes sense</text>

  <circle cx="380" cy="290" r="210" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="380" cy="290" r="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="336" y="284">City</text>
  <text class="b" x="306" y="312">Offices and plants compete for power</text>
  <text class="b" x="248" y="150">Substation blocked by protests for years</text>
  <text class="b" x="248" y="470">No one would approve building beside an airport</text>

  <circle cx="380" cy="290" r="14" fill="var(--grey)"/>
  <path d="M400 282 L700 240" stroke="var(--accent)" stroke-width="5" fill="none"/>
  <path d="M700 240 l-18 -3 l3 18 z" fill="var(--accent)"/>

  <rect x="700" y="196" width="200" height="92" rx="10" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text class="g" x="722" y="232" fill="var(--accent)">Data center</text>
  <text class="b" x="722" y="262">Farther is better</text>

  <text class="g" x="700" y="330">What the outer ring has</text>
  <text class="b" x="700" y="360">No one competes for its power</text>
  <text class="b" x="700" y="386">Enough land</text>
  <text class="b" x="700" y="412">Water・power・roads connected</text>

  <text class="c" x="60" y="524">The bottleneck is power and buildable space, not land price</text>
</svg>
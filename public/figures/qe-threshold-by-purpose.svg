<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一個工具分兩條路，金融穩定用途的門檻牆很矮，推通膨用途的門檻牆高得多">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:20px;fill:var(--ink)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">同一個工具，兩道不一樣高的門檻</text>

<rect x="60" y="230" width="150" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="80" y="266">大規模購債</text>
<path d="M216 250 L300 176" stroke="var(--dim)" stroke-width="3" marker-end="url(#pa)"/>
<path d="M216 266 L300 352" stroke="var(--dim)" stroke-width="3" marker-end="url(#pa)"/>

<text class="g" x="320" y="150">金融穩定</text>
<text class="b" x="320" y="180">市場失序、看不見底</text>
<rect x="640" y="146" width="40" height="46" fill="var(--accent)" opacity="0.75"/>
<text class="b" x="700" y="178">門檻低，保留</text>

<text class="g" x="320" y="330">把通膨從 1.4% 推向 2%</text>
<text class="b" x="320" y="360">成長本來就不錯</text>
<rect x="640" y="216" width="40" height="176" fill="var(--warn)" opacity="0.75"/>
<text class="b" x="700" y="250">門檻拉高</text>
<text class="b" x="700" y="282">先用耐心</text>
<text class="b" x="700" y="314">盯通膨預期</text>

<line x1="320" y1="410" x2="900" y2="410" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="60" y="480">拉高的是門檻，不是把工具丟掉</text>
</svg>
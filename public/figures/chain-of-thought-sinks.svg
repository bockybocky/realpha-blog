<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩格，警示色圓點由分隔線上方移到下方">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="480" y="54" text-anchor="middle" font-size="27" fill="var(--ink)">罰過之後，念頭沉下去</text>

<rect x="90" y="100" width="370" height="330" rx="14" fill="var(--card)"/>
<rect x="500" y="100" width="370" height="330" rx="14" fill="var(--card)"/>

<line x1="110" y1="300" x2="440" y2="300" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>
<line x1="520" y1="300" x2="850" y2="300" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>
<text x="430" y="292" text-anchor="end" font-size="15" fill="var(--dim)">看得見</text>
<text x="430" y="322" text-anchor="end" font-size="15" fill="var(--dim)">看不見</text>
<text x="840" y="292" text-anchor="end" font-size="15" fill="var(--dim)">看得見</text>
<text x="840" y="322" text-anchor="end" font-size="15" fill="var(--dim)">看不見</text>

<text x="275" y="142" text-anchor="middle" font-size="20" fill="var(--ink)">照實寫</text>
<circle cx="160" cy="240" r="11" fill="var(--accent)"/>
<circle cx="230" cy="205" r="11" fill="var(--accent)"/>
<circle cx="300" cy="250" r="11" fill="var(--warn)"/>
<circle cx="370" cy="215" r="11" fill="var(--accent)"/>

<text x="685" y="142" text-anchor="middle" font-size="20" fill="var(--ink)">被罰之後</text>
<circle cx="570" cy="240" r="11" fill="var(--accent)"/>
<circle cx="640" cy="205" r="11" fill="var(--accent)"/>
<circle cx="780" cy="215" r="11" fill="var(--accent)"/>
<line x1="700" y1="245" x2="700" y2="352" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M700 362 L693 348 L707 348 Z" fill="var(--grey)"/>
<circle cx="700" cy="385" r="11" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="4 4"/>

<text x="480" y="500" text-anchor="middle" font-size="22" fill="var(--ink)">罰的是寫出來，不是想</text>
</svg>
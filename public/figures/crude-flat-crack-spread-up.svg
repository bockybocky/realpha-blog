<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩根堆疊柱，下段原油不變、上段加工價差暴漲">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">不飆的是油價，飆的是加工費</text>

  <line x1="150" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>

  <rect x="230" y="300" width="130" height="120" fill="var(--grey)"/>
  <text class="t" x="295" y="368" font-size="16" text-anchor="middle" fill="var(--page)">原油</text>
  <rect x="230" y="258" width="130" height="42" fill="var(--accent)"/>
  <text class="t" x="295" y="285" font-size="15" text-anchor="middle" fill="var(--page)">價差</text>
  <text class="t" x="295" y="455" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">平常</text>

  <rect x="620" y="300" width="130" height="120" fill="var(--grey)"/>
  <text class="t" x="685" y="368" font-size="16" text-anchor="middle" fill="var(--page)">原油</text>
  <rect x="620" y="140" width="130" height="160" fill="var(--warn)"/>
  <text class="t" x="685" y="230" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">加工價差</text>
  <text class="t" x="685" y="455" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">情境</text>

  <line x1="400" y1="300" x2="580" y2="300" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="t" x="490" y="290" font-size="15" text-anchor="middle" fill="var(--dim)">原油這一段沒動</text>

  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">錢收在中間那一層的口袋</text>
</svg>
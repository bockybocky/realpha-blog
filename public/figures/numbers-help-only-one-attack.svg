<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="同一片衛星群，動能攻擊只打掉零星幾顆，網路攻擊一條路徑覆蓋全片">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">數量只擋得住一種攻擊</text>

<rect x="48" y="86" width="424" height="400" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="72" y="122" font-size="20" font-weight="700" fill="var(--ink)">動能攻擊</text>
<text x="72" y="148" font-size="16" fill="var(--dim)">一顆一顆打，打不完</text>
<g fill="var(--grey)">
<circle cx="96" cy="196" r="7"/><circle cx="140" cy="196" r="7"/><circle cx="184" cy="196" r="7"/><circle cx="228" cy="196" r="7"/><circle cx="272" cy="196" r="7"/><circle cx="316" cy="196" r="7"/><circle cx="360" cy="196" r="7"/><circle cx="404" cy="196" r="7"/><circle cx="448" cy="196" r="7"/>
<circle cx="96" cy="240" r="7"/><circle cx="140" cy="240" r="7"/><circle cx="184" cy="240" r="7"/><circle cx="272" cy="240" r="7"/><circle cx="316" cy="240" r="7"/><circle cx="360" cy="240" r="7"/><circle cx="404" cy="240" r="7"/><circle cx="448" cy="240" r="7"/>
<circle cx="96" cy="284" r="7"/><circle cx="140" cy="284" r="7"/><circle cx="184" cy="284" r="7"/><circle cx="228" cy="284" r="7"/><circle cx="272" cy="284" r="7"/><circle cx="360" cy="284" r="7"/><circle cx="404" cy="284" r="7"/><circle cx="448" cy="284" r="7"/>
<circle cx="96" cy="328" r="7"/><circle cx="140" cy="328" r="7"/><circle cx="184" cy="328" r="7"/><circle cx="228" cy="328" r="7"/><circle cx="272" cy="328" r="7"/><circle cx="316" cy="328" r="7"/><circle cx="360" cy="328" r="7"/><circle cx="404" cy="328" r="7"/><circle cx="448" cy="328" r="7"/>
<circle cx="96" cy="372" r="7"/><circle cx="140" cy="372" r="7"/><circle cx="228" cy="372" r="7"/><circle cx="272" cy="372" r="7"/><circle cx="316" cy="372" r="7"/><circle cx="360" cy="372" r="7"/><circle cx="404" cy="372" r="7"/><circle cx="448" cy="372" r="7"/>
</g>
<polygon points="228,240 214,218 242,218" fill="var(--warn)"/>
<polygon points="316,284 302,262 330,262" fill="var(--warn)"/>
<polygon points="184,372 170,350 198,350" fill="var(--warn)"/>
<text x="72" y="444" font-size="16" fill="var(--warn)">打掉三顆，剩下的照常運作</text>

<rect x="488" y="86" width="424" height="400" rx="14" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="512" y="122" font-size="20" font-weight="700" fill="var(--ink)">網路攻擊</text>
<text x="512" y="148" font-size="16" fill="var(--dim)">一個入口，往上通到全部</text>
<g fill="var(--warn)">
<circle cx="536" cy="196" r="7"/><circle cx="580" cy="196" r="7"/><circle cx="624" cy="196" r="7"/><circle cx="668" cy="196" r="7"/><circle cx="712" cy="196" r="7"/><circle cx="756" cy="196" r="7"/><circle cx="800" cy="196" r="7"/><circle cx="844" cy="196" r="7"/><circle cx="888" cy="196" r="7"/>
<circle cx="536" cy="240" r="7"/><circle cx="580" cy="240" r="7"/><circle cx="624" cy="240" r="7"/><circle cx="668" cy="240" r="7"/><circle cx="712" cy="240" r="7"/><circle cx="756" cy="240" r="7"/><circle cx="800" cy="240" r="7"/><circle cx="844" cy="240" r="7"/><circle cx="888" cy="240" r="7"/>
</g>
<path d="M700 404 L560 264" fill="none" stroke="var(--warn)" stroke-width="3"/>
<path d="M700 404 L700 264" fill="none" stroke="var(--warn)" stroke-width="3"/>
<path d="M700 404 L860 264" fill="none" stroke="var(--warn)" stroke-width="3"/>
<rect x="620" y="404" width="160" height="56" rx="10" fill="var(--warn)"/>
<text x="644" y="440" font-size="16" font-weight="700" fill="var(--page)">地面站</text>
<text x="512" y="300" font-size="16" font-weight="700" fill="var(--ink)">最後一層：開機程序</text>
<text x="512" y="326" font-size="16" fill="var(--warn)">修不回來</text>

<text x="60" y="552" font-size="22" font-weight="700" fill="var(--ink)">五千顆共用的那座站，只有一個。</text>
</svg>
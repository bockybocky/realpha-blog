<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="兩條長條上下對齊，右端各只剩一小截藍色，分別代表只認同是中國人與投資去中國">
<rect x="0" y="0" width="960" height="480" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700">認同與投資，都只剩一小段</text>
<text x="80" y="150" font-size="20" font-weight="700">認同</text>
<rect x="80" y="165" width="520" height="72" fill="var(--grey)"/>
<rect x="600" y="165" width="240" height="72" fill="var(--line)"/>
<rect x="840" y="165" width="40" height="72" fill="var(--accent)"/>
<text x="340" y="207" text-anchor="middle" font-size="16">台灣人 65%</text>
<text x="720" y="207" text-anchor="middle" font-size="16">兩者都是 30%</text>
<text x="880" y="265" text-anchor="end" font-size="16" font-weight="700" style="fill:var(--accent)">只是中國人 5%</text>
<text x="80" y="330" font-size="20" font-weight="700">對外投資</text>
<rect x="80" y="345" width="760" height="72" fill="var(--grey)"/>
<rect x="840" y="345" width="40" height="72" fill="var(--accent)"/>
<text x="460" y="387" text-anchor="middle" font-size="16">其他地方 95%</text>
<text x="880" y="445" text-anchor="end" font-size="16" font-weight="700" style="fill:var(--accent)">去中國 5%</text>
</svg>
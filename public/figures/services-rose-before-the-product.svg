<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="服務的兩條長、產品的一條短，差距就是還沒追上的空間">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">服務先漲，產品還在後面</text>
<text x="60" y="88" font-size="16" fill="var(--dim)">條長＝這一節價格變成原來的幾倍</text>

<text x="60" y="162" font-size="20" font-weight="700" fill="var(--accent)">服務</text>
<text x="60" y="196" font-size="19" fill="var(--ink)">轉化</text>
<rect x="200" y="170" width="600" height="46" fill="var(--accent)"/>
<text x="812" y="202" font-size="19" font-weight="700" fill="var(--accent)">十幾倍</text>
<text x="60" y="268" font-size="19" fill="var(--ink)">濃縮</text>
<rect x="200" y="242" width="280" height="46" fill="var(--accent)"/>
<text x="492" y="274" font-size="19" font-weight="700" fill="var(--accent)">約七倍</text>

<line x1="60" y1="318" x2="900" y2="318" stroke="var(--line)" stroke-width="2"/>

<text x="60" y="372" font-size="20" font-weight="700" fill="var(--warn)">產品</text>
<text x="60" y="406" font-size="19" fill="var(--ink)">鈾</text>
<rect x="200" y="380" width="160" height="46" fill="var(--warn)"/>
<text x="372" y="412" font-size="19" font-weight="700" fill="var(--warn)">四倍</text>

<text x="60" y="470" font-size="19" fill="var(--dim)">沒有產品，服務本身沒有意義</text>
<text x="60" y="502" font-size="22" font-weight="700" fill="var(--ink)">價格得去把產品叫出來</text>
</svg>
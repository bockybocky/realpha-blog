<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="安全門檻的階梯線，碰到私人資料之後整條往上跳，後面維持在高位">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:20px; fill:var(--ink); font-weight:600; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="48" y="58">碰過私人資料，後面每一步都變嚴</text>
<line x1="110" y1="140" x2="110" y2="420" stroke="var(--line)" stroke-width="3"/>
<line x1="110" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="48" y="150">門檻</text>
<text class="b" x="820" y="452">流程往後</text>
<path d="M110 376 H 400 V 272 H 640 V 180 H 886" fill="none" stroke="var(--accent)" stroke-width="5"/>
<line x1="400" y1="150" x2="400" y2="420" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>
<circle cx="400" cy="376" r="10" fill="var(--warn)"/>
<text class="b" x="340" y="140">私人資料</text>
<text class="b" x="146" y="356">時刻表</text>
<text class="b" x="436" y="252">信用卡號</text>
<text class="b" x="676" y="160">後續每一步</text>
<text class="c" x="48" y="500">門檻不是固定的，是被資料污染後升上去的</text>
</svg>
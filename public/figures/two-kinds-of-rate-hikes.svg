<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左格經濟線在升息後大幅下彎，右格只凹一小口後繼續往上，兩種升息的結果方向相反">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="52" font-size="27" font-weight="700" fill="var(--ink)">什麼時候才該怕</text>

  <rect x="60" y="96" width="390" height="344" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="255" y="144" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">被通膨逼著升</text>
  <line x1="255" y1="180" x2="255" y2="370" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
  <polyline points="96,268 180,252 255,248 320,300 414,372" fill="none" stroke="var(--warn)" stroke-width="5"/>
  <text x="104" y="404" font-size="16" fill="var(--dim)">壓需求</text>
  <text x="414" y="404" font-size="16" fill="var(--dim)" text-anchor="end">失去支撐</text>

  <rect x="510" y="96" width="390" height="344" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="705" y="144" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">被經濟逼出來</text>
  <line x1="705" y1="180" x2="705" y2="370" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
  <polyline points="546,320 630,290 705,286 770,300 864,244" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <text x="554" y="404" font-size="16" fill="var(--dim)">三條件成立</text>
  <text x="864" y="404" font-size="16" fill="var(--dim)" text-anchor="end">只削一點</text>

  <text x="480" y="504" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">看數據站在哪一邊，不是升了幾碼</text>
</svg>
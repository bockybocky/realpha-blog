<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸上三個到達點由近到遠：客戶問卷、授信與續保條件、法規">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:700;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .s{font-size:15px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="56" y="56">誰會先敲你的門</text>
<path d="M96 268 L892 268" stroke="var(--line)" stroke-width="4"/>
<path d="M872 256 L900 268 L872 280 Z" fill="var(--line)"/>
<circle cx="176" cy="268" r="14" fill="var(--accent)"/>
<circle cx="452" cy="268" r="14" fill="var(--accent)" opacity="0.6"/>
<circle cx="768" cy="268" r="14" fill="var(--grey)"/>
<path d="M176 254 L176 176 M452 254 L452 176 M768 254 L768 176" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="120" y="160">大客戶</text>
<text class="s" x="120" y="188">採購問卷</text>
<text class="g" x="396" y="160">銀行與保險</text>
<text class="s" x="396" y="188">授信・續保條件</text>
<text class="g" x="716" y="160">法規</text>
<text class="s" x="716" y="188">強制要求</text>
<text class="b" x="128" y="320">廠址在哪</text>
<text class="b" x="128" y="348">取水多少</text>
<text class="b" x="128" y="376">廢棄物怎麼處理</text>
<text class="b" x="128" y="404">是否鄰近保護區</text>
<text class="b" x="716" y="320">最後才到</text>
<text class="c" x="56" y="470">第一封信不是政府寄的</text>
</svg>
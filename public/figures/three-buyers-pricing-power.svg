<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩格對比：左格一個供應方連到十二個小客戶、價格箭頭朝上；右格同一個供應方只連到三個大客戶、價格箭頭朝下">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="66" font-size="27" fill="var(--ink)">買方從一群變成三個</text>
<rect x="60" y="110" width="400" height="330" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="86" y="146" font-size="19" fill="var(--dim)">過去五年</text>
<g fill="var(--grey)">
<rect x="92" y="176" width="40" height="34" rx="5"/>
<rect x="144" y="176" width="40" height="34" rx="5"/>
<rect x="196" y="176" width="40" height="34" rx="5"/>
<rect x="248" y="176" width="40" height="34" rx="5"/>
<rect x="300" y="176" width="40" height="34" rx="5"/>
<rect x="352" y="176" width="40" height="34" rx="5"/>
<rect x="92" y="222" width="40" height="34" rx="5"/>
<rect x="144" y="222" width="40" height="34" rx="5"/>
<rect x="196" y="222" width="40" height="34" rx="5"/>
<rect x="248" y="222" width="40" height="34" rx="5"/>
<rect x="300" y="222" width="40" height="34" rx="5"/>
<rect x="352" y="222" width="40" height="34" rx="5"/>
</g>
<rect x="150" y="330" width="220" height="54" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="260" y="364" font-size="16" fill="var(--accent)" text-anchor="middle">商用 GPU</text>
<line x1="260" y1="266" x2="260" y2="326" stroke="var(--line)" stroke-width="2"/>
<text x="260" y="420" font-size="16" fill="var(--dim)" text-anchor="middle">議價力被打散</text>
<rect x="500" y="110" width="400" height="330" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="526" y="146" font-size="19" fill="var(--warn)">回到三個</text>
<g fill="var(--grey)">
<rect x="540" y="176" width="100" height="80" rx="7"/>
<rect x="650" y="176" width="100" height="80" rx="7"/>
<rect x="760" y="176" width="100" height="80" rx="7"/>
</g>
<rect x="590" y="330" width="220" height="54" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="700" y="364" font-size="16" fill="var(--accent)" text-anchor="middle">商用 GPU</text>
<line x1="700" y1="266" x2="700" y2="326" stroke="var(--warn)" stroke-width="3"/>
<text x="700" y="420" font-size="16" fill="var(--warn)" text-anchor="middle">價格往下</text>
<text x="60" y="492" font-size="22" fill="var(--ink)">客戶數少一位數，議價力就換邊</text>
</svg>
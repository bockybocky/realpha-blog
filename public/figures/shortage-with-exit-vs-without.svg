<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條進度條對比，左邊填滿、右邊只填一半">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .ra { font-size:19px; fill:var(--accent); font-weight:700; }
    .rw { font-size:19px; fill:var(--warn); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="80" y="58">同樣是吃緊，出路不一樣</text>
  <text class="s" x="80" y="90">條的長度＝缺口被補上的程度</text>

  <rect x="80" y="128" width="380" height="292" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="112" y="170">銅箔</text>
  <text class="b" x="112" y="200">龍頭有擴、良率沒掉</text>
  <rect x="112" y="230" width="316" height="38" rx="8" fill="var(--page)" stroke="var(--grey)"/>
  <rect x="112" y="230" width="316" height="38" rx="8" fill="var(--accent)"/>
  <text class="ra" x="112" y="310">缺口被錢跟時間填掉</text>
  <text class="b" x="112" y="342">供給吃緊</text>
  <text class="b" x="112" y="370">但不會短缺</text>

  <rect x="500" y="128" width="380" height="292" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="532" y="170">Low CTE 玻纖布</text>
  <text class="b" x="532" y="200">龍頭擴三倍，可能還是不夠</text>
  <rect x="532" y="230" width="316" height="38" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="532" y="230" width="174" height="38" rx="8" fill="var(--warn)"/>
  <text class="rw" x="532" y="310">缺口填不滿</text>
  <text class="b" x="532" y="342">下游降規頂著</text>
  <text class="b" x="532" y="370">議價權留在上游</text>

  <text class="c" x="80" y="500">先問誰能擴、多久擴得出來、客戶有沒有替代</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="On the left, three reserve assets are the same size and each weighted 1; on the right, T-bills stand on a wide pillar while uninsured deposits stand on a thin one that has to queue in a failure.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .h { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .n { font-size:16px; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text x="60" y="62" class="h">Who's behind it?</text>
<text x="80" y="120" class="g">The Act</text>
<path d="M80 192 L80 178 L450 178 L450 192" fill="none" stroke="var(--dim)" stroke-width="1.5"/>
<text x="265" y="164" class="b" text-anchor="middle">HQLA</text>
<rect x="80" y="200" width="110" height="110" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="135" y="261" class="n" text-anchor="middle">$</text>
<rect x="210" y="200" width="110" height="110" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="265" y="261" class="n" text-anchor="middle">Bill</text>
<rect x="340" y="200" width="110" height="110" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="395" y="261" class="n" text-anchor="middle">Unins. dep</text>
<text x="135" y="340" class="b" text-anchor="middle">Wt 1</text>
<text x="265" y="340" class="b" text-anchor="middle">Wt 1</text>
<text x="395" y="340" class="b" text-anchor="middle">Wt 1</text>
<line x1="495" y1="100" x2="495" y2="530" stroke="var(--line)" stroke-width="1.5"/>
<text x="560" y="120" class="g">Backer</text>
<rect x="560" y="150" width="140" height="56" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="630" y="184" class="n" text-anchor="middle">Bill</text>
<rect x="560" y="206" width="140" height="230" fill="var(--accent)" opacity="0.25"/>
<text x="630" y="328" class="g" text-anchor="middle">US gov</text>
<rect x="750" y="150" width="150" height="56" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="825" y="184" class="n" text-anchor="middle">Unins.</text>
<rect x="815" y="206" width="20" height="230" fill="var(--grey)"/>
<text x="825" y="462" class="n" text-anchor="middle">1 bank</text>
<circle cx="750" cy="500" r="9" fill="var(--grey)"/>
<circle cx="780" cy="500" r="9" fill="var(--grey)"/>
<circle cx="810" cy="500" r="9" fill="var(--grey)"/>
<circle cx="840" cy="500" r="9" fill="var(--grey)"/>
<circle cx="870" cy="500" r="9" fill="var(--warn)"/>
<circle cx="900" cy="500" r="9" fill="var(--grey)"/>
<text x="825" y="532" class="b" text-anchor="middle">Queue up</text>
<text x="480" y="582" class="c" text-anchor="middle">Equal wt, diff base</text>
</svg>
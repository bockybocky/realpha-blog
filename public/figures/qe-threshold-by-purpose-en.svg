<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The same tool splits into two roads: the threshold wall is low for financial-stability use and much higher for pushing inflation up.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:20px;fill:var(--ink)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">One tool, two walls of different height</text>

<rect x="60" y="230" width="150" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="80" y="266">Large-scale asset purchases</text>
<path d="M216 250 L300 176" stroke="var(--dim)" stroke-width="3" marker-end="url(#pa)"/>
<path d="M216 266 L300 352" stroke="var(--dim)" stroke-width="3" marker-end="url(#pa)"/>

<text class="g" x="320" y="150">Financial stability</text>
<text class="b" x="320" y="180">Markets disorderly, no floor in sight</text>
<rect x="640" y="146" width="40" height="46" fill="var(--accent)" opacity="0.75"/>
<text class="b" x="700" y="178">Low bar; keep it</text>

<text class="g" x="320" y="330">Push inflation from 1.4% toward 2%</text>
<text class="b" x="320" y="360">Growth is fine already</text>
<rect x="640" y="216" width="40" height="176" fill="var(--warn)" opacity="0.75"/>
<text class="b" x="700" y="250">Raise the bar</text>
<text class="b" x="700" y="282">Try patience first</text>
<text class="b" x="700" y="314">Watch inflation expectations</text>

<line x1="320" y1="410" x2="900" y2="410" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="60" y="480">Raise the bar, don't drop the tool</text>
</svg>
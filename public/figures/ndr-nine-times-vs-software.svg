<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條橫條長度對比：一般軟體公司老客戶第二年花費 1.1 倍，條只比基準長一小截；Anthropic 9 倍，條長度是前者的八倍以上">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t h" x="60" y="66">老客戶第二年，花多少</text>
  <text class="t s" x="60" y="96">以第一年花費為 1</text>

  <line x1="200" y1="130" x2="200" y2="430" stroke="var(--line)" stroke-width="2"/>
  <text class="t s" x="186" y="452" text-anchor="middle">第一年</text>

  <text class="t g" x="180" y="196" text-anchor="end">一般軟體</text>
  <rect x="200" y="172" width="66" height="34" rx="4" fill="var(--grey)"/>
  <text class="t g" x="282" y="196" fill="var(--dim)">1.1 倍</text>

  <text class="t g" x="180" y="316" text-anchor="end">Anthropic</text>
  <rect x="200" y="292" width="540" height="34" rx="4" fill="var(--accent)"/>
  <text class="t g" x="756" y="316" fill="var(--accent)">9 倍</text>

  <line x1="266" y1="150" x2="266" y2="400" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="740" y1="270" x2="740" y2="400" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="266" y1="400" x2="740" y2="400" stroke="var(--dim)" stroke-width="2"/>
  <text class="t s" x="503" y="424" text-anchor="middle">這段距離，就是被我當成「補貼」的那一塊</text>

  <text class="t c" x="60" y="492">同一個欄位，差了八倍</text>
</svg>
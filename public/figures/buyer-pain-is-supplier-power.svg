<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三對左右對稱的橫條，從中間同一個詞往兩邊等長延伸，左邊標示成本、右邊標示議價權，兩側長度完全相同。">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>

<text x="64" y="58" font-size="27" fill="var(--ink)">同一件事，兩邊讀</text>

<rect x="380" y="140" width="200" height="300" rx="12" fill="var(--card)"/>
<line x1="380" y1="140" x2="380" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="580" y1="140" x2="580" y2="440" stroke="var(--line)" stroke-width="2"/>

<text x="220" y="120" font-size="20" fill="var(--warn)" text-anchor="middle">創業者的成本</text>
<text x="740" y="120" font-size="20" fill="var(--accent)" text-anchor="middle">供應商的議價權</text>

<rect x="130" y="178" width="250" height="44" rx="6" fill="var(--warn)"/>
<rect x="580" y="178" width="250" height="44" rx="6" fill="var(--accent)"/>
<text x="480" y="206" font-size="16" fill="var(--ink)" text-anchor="middle">換不掉</text>

<rect x="170" y="268" width="210" height="44" rx="6" fill="var(--warn)"/>
<rect x="580" y="268" width="210" height="44" rx="6" fill="var(--accent)"/>
<text x="480" y="296" font-size="16" fill="var(--ink)" text-anchor="middle">斷供就死</text>

<rect x="205" y="358" width="175" height="44" rx="6" fill="var(--warn)"/>
<rect x="580" y="358" width="175" height="44" rx="6" fill="var(--accent)"/>
<text x="480" y="386" font-size="16" fill="var(--ink)" text-anchor="middle">沉沒成本</text>

<text x="64" y="510" font-size="22" fill="var(--ink)">換邊看，痛苦就是議價權</text>
</svg>
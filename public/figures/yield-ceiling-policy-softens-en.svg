<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The yield line approaches the dashed ceiling three times, and each approach is matched by a policy-softening event below.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="66" font-size="27" fill="var(--ink)">Every time yields near the line, policy softens</text>

  <rect x="120" y="120" width="760" height="290" fill="var(--card)" stroke="var(--line)"/>

  <text class="t" x="100" y="345" font-size="15" fill="var(--dim)" text-anchor="end">4.5%</text>
  <text class="t" x="100" y="225" font-size="15" fill="var(--dim)" text-anchor="end">4.7%</text>

  <line x1="120" y1="340" x2="880" y2="340" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="t" x="872" y="330" font-size="19" fill="var(--warn)" text-anchor="end">The policymakers' pain point</text>

  <polyline points="200,392 300,340 500,310 700,268 830,220" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="300" cy="340" r="7" fill="var(--accent)"/>
  <circle cx="500" cy="310" r="7" fill="var(--accent)"/>
  <circle cx="830" cy="220" r="7" fill="var(--accent)"/>

  <text class="t" x="300" y="180" font-size="19" fill="var(--ink)" text-anchor="middle">Sixty-day pause</text>
  <line x1="300" y1="192" x2="300" y2="330" stroke="var(--grey)" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="t" x="500" y="180" font-size="19" fill="var(--ink)" text-anchor="middle">Memo</text>
  <line x1="500" y1="192" x2="500" y2="300" stroke="var(--grey)" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="t" x="820" y="180" font-size="19" fill="var(--ink)" text-anchor="middle">Sixty more days</text>
  <line x1="830" y1="192" x2="830" y2="210" stroke="var(--grey)" stroke-width="1" stroke-dasharray="4 4"/>

  <text class="t" x="300" y="440" font-size="16" fill="var(--dim)" text-anchor="middle">April</text>
  <text class="t" x="500" y="440" font-size="16" fill="var(--dim)" text-anchor="middle">June</text>
  <text class="t" x="830" y="440" font-size="16" fill="var(--dim)" text-anchor="middle">Recently</text>

  <text class="t" x="60" y="500" font-size="22" fill="var(--ink)">How dramatic the event is does not count; whether it reaches this line does</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Two horizontal bars split highly asymmetrically: the upper bar is almost entirely programming languages, with only a tiny section about real rust, while most of the lower bar lacks metal words in its titles but still covers metal topics.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">Literal search fails both ways</text>

<text class="g" x="60" y="130">35 videos with “rust”</text>
<rect x="60" y="150" width="816" height="64" rx="8" fill="var(--grey)"/>
<rect x="852" y="150" width="24" height="64" rx="8" fill="var(--warn)"/>
<text class="b" x="80" y="190">34 are programming languages or coding</text>
<text class="b" x="700" y="246">1 is truly about rust</text>
<polygon points="864,222 856,238 872,238" fill="var(--warn)"/>

<text class="g" x="60" y="330">27 manually selected metallurgy videos</text>
<rect x="60" y="350" width="574" height="64" rx="8" fill="var(--accent)"/>
<rect x="634" y="350" width="242" height="64" rx="8" fill="var(--grey)"/>
<text class="b" fill="#ffffff" style="fill:#ffffff" x="80" y="390">19 have no metal words at all</text>
<text class="b" x="654" y="390">8 do</text>

<text class="c" x="60" y="492">High literal hit rate is not the same as correct classification</text>
</svg>
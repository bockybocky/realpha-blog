<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條下滑線與一條上升線交叉，交叉點標為存量翻面">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="54" font-size="27" font-weight="700" fill="var(--ink)">存量什麼時候從資產變成對手</text>
<rect x="90" y="100" width="810" height="320" fill="var(--card)"/>
<line x1="120" y1="400" x2="880" y2="400" stroke="var(--grey)" stroke-width="2"/>
<line x1="120" y1="140" x2="120" y2="400" stroke="var(--grey)" stroke-width="2"/>
<polyline points="140,160 880,360" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
<polyline points="140,370 880,170" fill="none" stroke="var(--warn)" stroke-width="3.5"/>
<circle cx="510" cy="264" r="11" fill="var(--ink)"/>
<line x1="510" y1="140" x2="510" y2="400" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="524" y="158" font-size="20" font-weight="700" fill="var(--ink)">翻面</text>
<text x="524" y="182" font-size="16" fill="var(--dim)">資產 → 對手</text>
<text x="146" y="148" font-size="19" font-weight="700" fill="var(--accent)">舊品項變現</text>
<text x="146" y="172" font-size="15" fill="var(--dim)">授權金・續訂・二手價</text>
<text x="878" y="150" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="end">新品項獲客成本</text>
<text x="878" y="424" font-size="15" fill="var(--dim)" text-anchor="end">時間</text>
<text x="60" y="482" font-size="22" font-weight="700" fill="var(--ink)">一條掉、一條漲，存量就翻面了。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="散在曲線下方的低價舊券小點，被一支箭頭掃回平滑曲線上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink)}
.ga{font-size:19px;fill:var(--accent)}
.b{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">買回原本在掃什麼</text>
<path d="M120 360 C 320 300, 560 240, 880 180" fill="none" stroke="var(--line)" stroke-width="3"/>
<text class="g" x="760" y="160">平滑殖利率曲線</text>
<circle cx="220" cy="400" r="7" fill="var(--grey)"/>
<circle cx="300" cy="418" r="6" fill="var(--grey)"/>
<circle cx="380" cy="392" r="7" fill="var(--grey)"/>
<circle cx="455" cy="424" r="5" fill="var(--grey)"/>
<circle cx="520" cy="398" r="6" fill="var(--grey)"/>
<rect x="180" y="370" width="400" height="80" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="b" x="180" y="478">舊券碎屑 · 堵在交易商帳上</text>
<path d="M620 400 C 700 400, 720 300, 800 262" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M810 258 L791 258 L799 273 Z" fill="var(--accent)"/>
<text class="ga" x="640" y="360">買回 · 換新券</text>
<text class="c" x="60" y="520">把碎屑掃回曲線上，市場才好走</text>
</svg>
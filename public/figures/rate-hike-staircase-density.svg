<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩道上升階梯，左邊密而連續、右邊稀疏且有長平台，顯示同樣往上但密度不同">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:19px; fill:var(--ink); font-weight:700; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="h" x="60" y="72">同樣往上，密度不同</text>
<line x1="60" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
<polyline points="80,440 128,440 128,398 176,398 176,356 224,356 224,314 272,314 272,272 320,272 320,230 368,230 368,188 410,188"
 fill="none" stroke="var(--warn)" stroke-width="5"/>
<text class="g" x="80" y="152">連續的那一種</text>
<text class="b" x="80" y="182">2022：中間沒有停下來看一眼</text>
<line x1="465" y1="130" x2="465" y2="470" stroke="var(--line)" stroke-width="2"/>
<polyline points="520,440 640,440 640,372 780,372 780,304 870,304"
 fill="none" stroke="var(--accent)" stroke-width="5"/>
<polyline points="870,304 870,246 900,246" fill="none" stroke="var(--accent)" stroke-width="5" stroke-dasharray="10 8"/>
<text class="g" x="520" y="152">走走停停</text>
<text class="b" x="520" y="182">2026：平台上留了時間</text>
<text class="b" x="760" y="222">12 月，約八成機率</text>
<text class="c" x="60" y="512">平台的長度，就是企業調整融資的時間</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左邊一根極高的柱子標 2 兆日圓、右邊一條幾乎貼地的短條標 3 億日圓，兩者之間虛線寫同一門生意，用高度差顯示同樣一支球隊被給出差幾千倍的價格。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .n { font-size:22px; font-weight:700; fill:var(--accent); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="62">同一門生意，兩個價格</text>
  <text class="s" x="60" y="92">縱向尺度已截斷，只看高度差</text>

  <rect x="150" y="130" width="180" height="340" rx="6" fill="var(--accent)" opacity="0.85"/>
  <text class="n" x="240" y="118" text-anchor="middle">2 兆日圓</text>
  <text class="g" x="240" y="505" text-anchor="middle">湖人</text>
  <text class="b" x="240" y="532" text-anchor="middle">年營收 1000 億</text>
  <text class="b" x="240" y="556" text-anchor="middle">約 20 倍</text>

  <rect x="630" y="455" width="180" height="15" rx="3" fill="var(--grey)"/>
  <text class="c" x="720" y="438" text-anchor="middle">3 億日圓</text>
  <text class="g" x="720" y="505" text-anchor="middle">大宮</text>
  <text class="b" x="720" y="532" text-anchor="middle">約等於淨資產</text>
  <text class="s" x="720" y="556" text-anchor="middle">（傳聞）</text>

  <line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
  <path d="M60 300 L900 300" stroke="var(--line)" stroke-width="2" stroke-dasharray="10 8"/>
  <text class="s" x="900" y="292" text-anchor="end">尺度截斷</text>

  <path d="M370 250 L590 250" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="g" x="480" y="228" text-anchor="middle">同一門生意</text>
  <text class="b" x="480" y="282" text-anchor="middle">球員、球場、球迷</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="一道高牆中央立著，四條箭頭各從上下繞過牆到右邊的美國市場">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">牆擋住一條路，不擋壓力</text>

  <rect x="455" y="120" width="52" height="380" fill="var(--grey)"/>
  <text class="t" x="481" y="534" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">100% 關稅</text>

  <rect x="60" y="280" width="120" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="120" y="310" font-size="19" fill="var(--ink)" text-anchor="middle">過剩產能</text>
  <text class="t" x="120" y="332" font-size="16" fill="var(--dim)" text-anchor="middle">1500–2000 萬輛</text>

  <rect x="790" y="280" width="110" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="845" y="316" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">美國市場</text>

  <path d="M190 292 C 320 150 620 140 786 282" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="790,292 776,276 786,270" fill="var(--accent)"/>
  <text class="t" x="330" y="140" font-size="19" fill="var(--accent)">墨西哥：稅 0 → 20% → 50%，改當地組裝</text>

  <path d="M190 304 C 330 212 620 206 786 296" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="790,304 775,290 784,283" fill="var(--accent)"/>
  <text class="t" x="330" y="200" font-size="19" fill="var(--accent)">加拿大：4.9 萬輛免稅配額</text>

  <path d="M190 326 C 330 420 620 424 786 330" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="790,322 776,338 785,345" fill="var(--accent)"/>
  <text class="t" x="330" y="452" font-size="19" fill="var(--accent)">邊境：在那邊買車、在那邊登記</text>

  <path d="M190 338 C 330 482 620 486 786 342" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="790,334 775,350 784,357" fill="var(--accent)"/>
  <text class="t" x="330" y="512" font-size="19" fill="var(--accent)">合資：美方控股，大家聳聳肩</text>

  <text class="t" x="60" y="572" font-size="22" font-weight="700" fill="var(--ink)">要數的是替代路徑有幾條，牆的高度排在後面</text>
</svg>
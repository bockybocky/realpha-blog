<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Horizontal bar chart: Ontario at 247 books and S Chand at 149 books are the longest bars, while OpenStax at 41 books and LibreTexts at 8 books are extremely short.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">What the 665 books are made of</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">Same shelf: the two names you know are only a sliver</text>

<text class="t" x="245" y="162" font-size="19" text-anchor="end" fill="var(--ink)">Ontario Open Library</text>
<rect x="260" y="144" width="600" height="26" rx="4" fill="var(--grey)"/>
<text class="t" x="872" y="164" font-size="16" fill="var(--dim)">247</text>

<text class="t" x="245" y="224" font-size="19" text-anchor="end" fill="var(--ink)">India's S Chand</text>
<rect x="260" y="206" width="362" height="26" rx="4" fill="var(--grey)"/>
<text class="t" x="634" y="226" font-size="16" fill="var(--dim)">149</text>

<text class="t" x="245" y="286" font-size="19" text-anchor="end" fill="var(--dim)">Other sources</text>
<rect x="260" y="268" width="535" height="26" rx="4" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="807" y="288" font-size="16" fill="var(--dim)">220</text>

<text class="t" x="245" y="348" font-size="19" text-anchor="end" fill="var(--ink)" font-weight="700">OpenStax</text>
<rect x="260" y="330" width="100" height="26" rx="4" fill="var(--accent)"/>
<text class="t" x="372" y="350" font-size="16" fill="var(--accent)">41</text>

<text class="t" x="245" y="410" font-size="19" text-anchor="end" fill="var(--ink)" font-weight="700">LibreTexts</text>
<rect x="260" y="392" width="19" height="26" rx="4" fill="var(--accent)"/>
<text class="t" x="291" y="412" font-size="16" fill="var(--accent)">8</text>

<line x1="260" y1="440" x2="860" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="486" font-size="22" font-weight="700" fill="var(--ink)">More books is not the book you need</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條灰色虛線直線代表長期總量穩定上升，另一條實線在中段向下凹出一個洞再回到同一個終點高度">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="70" y="70" font-size="27" fill="var(--ink)">總量不變，速度被誰決定</text>
<line x1="120" y1="455" x2="890" y2="455" stroke="var(--line)" stroke-width="2"/>
<path d="M120 420 L880 170" stroke="var(--grey)" stroke-width="4" stroke-dasharray="10 8" fill="none"/>
<text x="700" y="150" font-size="19" fill="var(--dim)">總量</text>
<text x="700" y="176" font-size="16" fill="var(--dim)">同一個高度</text>
<path d="M120 420 C 200 392 250 368 305 352 C 352 341 374 352 402 384 C 432 416 468 438 518 434 C 580 428 640 358 702 298 C 762 242 834 196 880 170" stroke="var(--accent)" stroke-width="6" fill="none"/>
<circle cx="880" cy="170" r="9" fill="var(--accent)"/>
<circle cx="505" cy="435" r="9" fill="var(--accent)"/>
<line x1="505" y1="455" x2="505" y2="498" stroke="var(--grey)" stroke-width="2"/>
<text x="430" y="522" font-size="19" fill="var(--ink)">時程：先凹一個洞</text>
<text x="190" y="330" font-size="19" fill="var(--dim)">搶料期</text>
<text x="70" y="110" font-size="22" fill="var(--ink)">總量沒變，速度變了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A low fence stops the path along the ground while another path goes over the top">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Who does this fence stop?</text>

  <line x1="80" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="3"/>

  <rect x="470" y="316" width="10" height="84" fill="var(--grey)"/>
  <rect x="530" y="316" width="10" height="84" fill="var(--grey)"/>
  <rect x="455" y="330" width="100" height="9" fill="var(--grey)"/>
  <rect x="455" y="362" width="100" height="9" fill="var(--grey)"/>
  <text class="t" x="505" y="432" font-size="19" fill="var(--dim)" text-anchor="middle">Kids sources</text>

  <line x1="120" y1="372" x2="440" y2="372" stroke="var(--accent)" stroke-width="4"/>
  <polygon points="458,372 436,362 436,382" fill="var(--accent)"/>
  <line x1="452" y1="348" x2="452" y2="396" stroke="var(--accent)" stroke-width="4"/>
  <text class="t" x="120" y="348" font-size="19" fill="var(--accent)">Accidental taps</text>

  <path d="M140 270 C 300 140, 700 140, 860 270" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="860,284 849,262 871,262" fill="var(--warn)"/>
  <text class="t" x="500" y="176" font-size="19" fill="var(--warn)" text-anchor="middle">Installing apps, opening a browser</text>

  <text class="t" x="60" y="486" font-size="22" font-weight="700" fill="var(--ink)">Stops a toddler, not a climber</text>
</svg>
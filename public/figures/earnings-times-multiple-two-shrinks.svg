<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三個矩形面積比較：原本的大矩形分別因為寬度縮小或高度縮小，變成兩個面積一樣小的矩形">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="480" y="56" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">同樣的跌，兩種原因</text>

  <line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="60" y1="430" x2="60" y2="150" stroke="var(--line)" stroke-width="2"/>
  <text x="40" y="300" text-anchor="middle" font-size="16" fill="var(--dim)" transform="rotate(-90 40 300)">乘數</text>
  <text x="96" y="456" text-anchor="middle" font-size="16" fill="var(--dim)">盈餘</text>

  <line x1="330" y1="130" x2="330" y2="450" stroke="var(--grey)" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="580" y1="130" x2="580" y2="450" stroke="var(--grey)" stroke-width="1.2" stroke-dasharray="5 5"/>

  <rect x="90" y="230" width="180" height="200" fill="var(--card)" stroke="var(--line)" stroke-width="1.8"/>
  <text x="180" y="212" text-anchor="middle" font-size="20" fill="var(--ink)">原本</text>
  <text x="180" y="322" text-anchor="middle" font-size="16" fill="var(--dim)">5 × 20</text>
  <text x="180" y="350" text-anchor="middle" font-size="16" fill="var(--dim)">＝ 100</text>

  <rect x="390" y="230" width="108" height="200" fill="var(--warn)" fill-opacity="0.2" stroke="var(--warn)" stroke-width="2"/>
  <text x="444" y="212" text-anchor="middle" font-size="20" fill="var(--warn)">需求沒了</text>
  <text x="444" y="322" text-anchor="middle" font-size="16" fill="var(--dim)">3 × 20</text>
  <text x="444" y="350" text-anchor="middle" font-size="16" fill="var(--dim)">＝ 60</text>
  <text x="444" y="482" text-anchor="middle" font-size="22" font-weight="700" fill="var(--warn)">要砍</text>

  <rect x="650" y="310" width="180" height="120" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="2"/>
  <text x="740" y="292" text-anchor="middle" font-size="20" fill="var(--accent)">乘數縮水</text>
  <text x="740" y="360" text-anchor="middle" font-size="16" fill="var(--dim)">5 × 12</text>
  <text x="740" y="388" text-anchor="middle" font-size="16" fill="var(--dim)">＝ 60</text>
  <text x="740" y="482" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">要等</text>

  <text x="480" y="530" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">跌一樣多，處理相反</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A very wide arrow and a very thin arrow push the same tray, the wide one being policy and the thin one being a single person.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700">Two hands push the orders, one far thicker</text>

  <rect x="70" y="140" width="420" height="110" fill="var(--accent)"/>
  <polygon points="490,118 490,272 580,195" fill="var(--accent)"/>
  <text x="100" y="204" font-size="20" font-weight="700" fill="var(--page)">Policy: supply chains leave China</text>

  <rect x="70" y="330" width="420" height="18" fill="var(--grey)"/>
  <polygon points="490,318 490,360 540,339" fill="var(--grey)"/>
  <text x="100" y="312" font-size="19" fill="var(--dim)">One man's visibility</text>

  <rect x="640" y="150" width="250" height="210" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text x="765" y="250" font-size="20" font-weight="700" text-anchor="middle">Taiwan wins</text>
  <text x="765" y="282" font-size="20" font-weight="700" text-anchor="middle">Fat-margin orders</text>

  <text x="60" y="460" font-size="22" font-weight="700">Pull the thin hand; the tray barely moves</text>
</svg>
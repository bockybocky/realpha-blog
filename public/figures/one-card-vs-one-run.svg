<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="一根長橫條代表一張顯示卡的價錢，旁邊一小截幾乎看不見的短條代表昨天那一次雲端字幕的三塊四台幣；長條約等於四千一百次那樣的短條">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #b9c2d0;
      --accent: #1f6feb;
      --warn:   #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #4a5464;
        --accent: #58a6ff;
        --warn:   #d29922;
      }
    }
    .t     { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1    { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .cap   { font-size: 19px; font-weight: 700; fill: var(--dim); }
    .capA  { font-size: 19px; font-weight: 700; fill: var(--accent); }
    .big   { font-size: 34px; font-weight: 700; fill: var(--ink); }
    .unit  { font-size: 17px; fill: var(--dim); }
    .onfill{ font-size: 17px; font-weight: 700; fill: var(--page); }
    .kick  { font-size: 22px; font-weight: 700; fill: var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="420" fill="var(--page)"/>
  <g class="t">
    <text x="480" y="46" class="h1" text-anchor="middle">一張卡的錢，等於幾次雲端字幕</text>

    <!-- 一次：極短 -->
    <text x="60" y="140" class="capA" text-anchor="start">昨天那一次</text>
    <rect x="240" y="118" width="3" height="32" fill="var(--accent)"/>
    <text x="256" y="141" class="unit" text-anchor="start">3.4 元台幣（567 秒 GPU）</text>

    <!-- 一張卡：長 -->
    <text x="60" y="230" class="cap" text-anchor="start">一張顯示卡</text>
    <rect x="240" y="208" width="640" height="32" rx="3" fill="var(--grey)"/>
    <text x="560" y="230" class="onfill" text-anchor="middle">約 1,400 美元</text>

    <text x="240" y="290" class="big" text-anchor="start">≈ 4,100 次</text>
    <text x="240" y="318" class="unit" text-anchor="start">用 4090 社群雲每小時 0.34 美元換算成小時數，也大約是 4,100 小時</text>

    <text x="480" y="385" class="kick" text-anchor="middle">每天跑兩小時，要五年多才追平</text>
  </g>
</svg>

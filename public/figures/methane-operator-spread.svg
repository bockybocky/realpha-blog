<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條橫條：最好的業者極短、平均中等、最差的長度是平均兩倍以上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="64">「平均 4%」裡面，差距有二十倍</text>

<text class="g" x="60" y="156">最好的業者</text>
<rect x="260" y="134" width="12" height="30" fill="var(--grey)"/>
<text class="g" x="290" y="158">0.2%</text>

<text class="g" x="60" y="256">平均值</text>
<rect x="260" y="234" width="240" height="30" fill="var(--accent)"/>
<text class="g" x="518" y="258">4%</text>

<text class="g" x="60" y="356">最差的</text>
<rect x="260" y="334" width="480" height="30" fill="var(--warn)"/>
<text class="g" x="758" y="358">8% 以上</text>

<text class="n" x="260" y="404">同樣的氣、同樣的設備類型，差的是有沒有人在巡</text>
<text class="c" x="60" y="470">拿平均值算，等於假設每個人一樣用心</text>
</svg>
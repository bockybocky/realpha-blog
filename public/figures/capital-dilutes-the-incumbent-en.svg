<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars compared: after capital arrives the whole bar grows longer, the incumbent segment keeps its absolute length, and its share is diluted by new entrants.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--dim); }
.b { font-size:16px; fill:var(--ink); }
.s { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">Bigger pie, but more mouths at the table</text>

<rect x="560" y="96" width="340" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="580" y="130">Capital invested and stakes taken</text>
<path d="M700 152 L700 200" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
<path d="M700 208 l-6 -12 l12 0 z" fill="var(--accent)"/>
<path d="M800 152 L800 200" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
<path d="M800 208 l-6 -12 l12 0 z" fill="var(--accent)"/>

<text class="g" x="90" y="200">Before the investment</text>
<rect x="90" y="212" width="210" height="64" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
<rect x="300" y="212" width="90" height="64" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="112" y="251">Incumbent winner</text>

<path d="M406 244 L452 244" stroke="var(--dim)" stroke-width="2"/>
<path d="M460 244 l-12 -6 l0 12 z" fill="var(--dim)"/>

<text class="g" x="470" y="200">After capital arrives</text>
<rect x="470" y="212" width="210" height="64" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
<rect x="680" y="212" width="70" height="64" fill="var(--accent)"/>
<rect x="750" y="212" width="70" height="64" fill="var(--accent)"/>
<rect x="820" y="212" width="70" height="64" fill="var(--accent)"/>
<text class="b" x="492" y="251">Incumbent winner</text>
<text class="s" x="686" y="300" fill="var(--accent)">New winners</text>

<path d="M90 300 L300 300" stroke="var(--dim)" stroke-width="2"/>
<path d="M90 294 L90 306 M300 294 L300 306" stroke="var(--dim)" stroke-width="2"/>
<path d="M470 322 L680 322" stroke="var(--dim)" stroke-width="2"/>
<path d="M470 316 L470 328 M680 316 L680 328" stroke="var(--dim)" stroke-width="2"/>
<text class="s" x="146" y="324">Same length</text>
<text class="s" x="526" y="346">Same length</text>

<text class="c" x="60" y="430">Same amount, smaller place</text>
</svg>
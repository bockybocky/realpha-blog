<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="四象限圖，縱軸是效果驗不驗得出、橫軸是解釋成不成立，左上格效果在解釋錯被藍框標出並寫著能用但倉位壓小">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700">效果與解釋，分開驗</text>

  <rect x="180" y="110" width="620" height="400" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="180" y="110" width="310" height="200" rx="14" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="2.5"/>
  <line x1="490" y1="110" x2="490" y2="510" stroke="var(--line)" stroke-width="2"/>
  <line x1="180" y1="310" x2="800" y2="310" stroke="var(--line)" stroke-width="2"/>

  <text x="168" y="140" font-size="16" fill="var(--dim)" text-anchor="end">效果驗得出</text>
  <text x="168" y="498" font-size="16" fill="var(--dim)" text-anchor="end">效果沒驗出</text>
  <text x="185" y="544" font-size="16" fill="var(--dim)">解釋被推翻</text>
  <text x="795" y="544" font-size="16" fill="var(--dim)" text-anchor="end">解釋站得住</text>

  <text x="335" y="192" font-size="19" font-weight="700" text-anchor="middle">效果在，解釋錯</text>
  <text x="335" y="224" font-size="15" fill="var(--dim)" text-anchor="middle">動物磁力 · EMDR</text>
  <text x="335" y="262" font-size="16" font-weight="700" fill="var(--accent)" text-anchor="middle">能用，倉位壓小</text>

  <text x="645" y="192" font-size="19" font-weight="700" text-anchor="middle">兩個都站得住</text>
  <text x="645" y="228" font-size="15" fill="var(--dim)" text-anchor="middle">有失效地圖</text>

  <text x="335" y="400" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">兩個都沒有</text>
  <text x="335" y="436" font-size="15" fill="var(--dim)" text-anchor="middle">丟掉</text>

  <text x="645" y="400" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">故事講得通</text>
  <text x="645" y="436" font-size="15" fill="var(--dim)" text-anchor="middle">樣本外還沒驗</text>

  <text x="60" y="580" font-size="22" font-weight="700">解釋的用處，是告訴你什麼時候該閃</text>
</svg>
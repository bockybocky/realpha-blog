<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一個分數，分子清楚寫著解了一題，分母是空格打問號；旁邊三個候選分母一、十、一百各自算出完全不同的成功率">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #b9c2d0;
      --accent: #1f6feb;
      --warn:   #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #4a5464;
        --accent: #58a6ff;
        --warn:   #d29922;
      }
    }
    .t     { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1    { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .cap   { font-size: 19px; font-weight: 700; fill: var(--dim); }
    .capA  { font-size: 19px; font-weight: 700; fill: var(--accent); }
    .capW  { font-size: 19px; font-weight: 700; fill: var(--warn); }
    .big   { font-size: 34px; font-weight: 700; fill: var(--ink); }
    .huge  { font-size: 48px; font-weight: 700; fill: var(--ink); }
    .hugeW { font-size: 48px; font-weight: 700; fill: var(--warn); }
    .unit  { font-size: 17px; fill: var(--dim); }
    .pct   { font-size: 16px; font-weight: 700; }
    .kick  { font-size: 22px; font-weight: 700; fill: var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <g class="t">
    <text x="480" y="46" class="h1" text-anchor="middle">公開的只有分子</text>

    <!-- 左：分數 -->
    <text x="230" y="180" class="huge" text-anchor="middle">解了 1 題</text>
    <line x1="90" y1="210" x2="370" y2="210" stroke="var(--ink)" stroke-width="4"/>
    <rect x="150" y="232" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="230" y="290" class="hugeW" text-anchor="middle">？</text>
    <text x="230" y="350" class="capW" text-anchor="middle">試了幾題</text>

    <!-- 中：等號 -->
    <text x="450" y="268" class="huge" text-anchor="middle">＝</text>

    <!-- 右：三個候選 -->
    <text x="700" y="120" class="cap" text-anchor="middle">如果分母是</text>

    <text x="600" y="190" class="big" text-anchor="middle">1</text>
    <rect x="660" y="166" width="240" height="30" rx="4" fill="var(--accent)"/>
    <text x="780" y="188" class="pct" text-anchor="middle" fill="var(--page)">100%</text>

    <text x="600" y="268" class="big" text-anchor="middle">10</text>
    <rect x="660" y="244" width="24" height="30" rx="4" fill="var(--accent)"/>
    <text x="700" y="266" class="unit" text-anchor="start">10%</text>

    <text x="600" y="346" class="big" text-anchor="middle">100</text>
    <rect x="660" y="322" width="4" height="30" rx="2" fill="var(--accent)"/>
    <text x="680" y="344" class="unit" text-anchor="start">1%</text>

    <text x="480" y="470" class="kick" text-anchor="middle">同一個分子，成功率可以差一百倍——沒有分母就沒有成功率</text>
  </g>
</svg>

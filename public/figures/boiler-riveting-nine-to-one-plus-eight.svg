<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" role="img" aria-label="兩格各九個圓點：左格九個都是熟練工，右格只有一個熟練工加八個粗工">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .c { font-size:22px; font-weight:700; }
    .d { fill:var(--dim); }
    .a { fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="550" fill="var(--page)"/>
<defs><marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker></defs>
<text x="480" y="56" text-anchor="middle" class="t">鍋爐鉚接：熟練名額從 9 變 1</text>
<rect x="60" y="100" width="380" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="520" y="100" width="380" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="250" y="142" text-anchor="middle" class="g">手工鉚接</text>
<text x="710" y="142" text-anchor="middle" class="g">液壓鉚接機</text>
<circle cx="180" cy="200" r="24" fill="var(--accent)"/>
<circle cx="250" cy="200" r="24" fill="var(--accent)"/>
<circle cx="320" cy="200" r="24" fill="var(--accent)"/>
<circle cx="180" cy="270" r="24" fill="var(--accent)"/>
<circle cx="250" cy="270" r="24" fill="var(--accent)"/>
<circle cx="320" cy="270" r="24" fill="var(--accent)"/>
<circle cx="180" cy="340" r="24" fill="var(--accent)"/>
<circle cx="250" cy="340" r="24" fill="var(--accent)"/>
<circle cx="320" cy="340" r="24" fill="var(--accent)"/>
<circle cx="640" cy="200" r="24" fill="var(--accent)"/>
<circle cx="710" cy="200" r="24" fill="var(--grey)"/>
<circle cx="780" cy="200" r="24" fill="var(--grey)"/>
<circle cx="640" cy="270" r="24" fill="var(--grey)"/>
<circle cx="710" cy="270" r="24" fill="var(--grey)"/>
<circle cx="780" cy="270" r="24" fill="var(--grey)"/>
<circle cx="640" cy="340" r="24" fill="var(--grey)"/>
<circle cx="710" cy="340" r="24" fill="var(--grey)"/>
<circle cx="780" cy="340" r="24" fill="var(--grey)"/>
<text x="250" y="412" text-anchor="middle" class="b">9 熟練工</text>
<text x="710" y="412" text-anchor="middle" class="b">1 熟練工 ＋ 8 粗工</text>
<line x1="450" y1="270" x2="510" y2="270" stroke="var(--dim)" stroke-width="2" marker-end="url(#m1)"/>
<circle cx="360" cy="472" r="9" fill="var(--accent)"/>
<text x="376" y="478" class="b">熟練工</text>
<circle cx="530" cy="472" r="9" fill="var(--grey)"/>
<text x="546" y="478" class="b">粗工</text>
<text x="480" y="522" text-anchor="middle" class="c">人數沒變，熟練名額少了八個</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A comparison of headcount in two train cars above two share-price paths of differing steepness.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="60">It depends on who is already aboard</text>
<rect x="70" y="95" width="350" height="120" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--grey)">
<circle cx="110" cy="135" r="9"/><circle cx="145" cy="135" r="9"/><circle cx="180" cy="135" r="9"/><circle cx="215" cy="135" r="9"/><circle cx="250" cy="135" r="9"/><circle cx="285" cy="135" r="9"/><circle cx="320" cy="135" r="9"/><circle cx="355" cy="135" r="9"/>
<circle cx="110" cy="178" r="9"/><circle cx="145" cy="178" r="9"/><circle cx="180" cy="178" r="9"/><circle cx="215" cy="178" r="9"/><circle cx="250" cy="178" r="9"/><circle cx="285" cy="178" r="9"/><circle cx="320" cy="178" r="9"/><circle cx="355" cy="178" r="9"/>
</g>
<text class="g" x="70" y="248">Leader · most orders</text>
<text class="n" x="70" y="274">Same info → 0 disagreement → few trades</text>
<rect x="540" y="95" width="350" height="120" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<g fill="var(--accent)">
<circle cx="600" cy="140" r="9"/><circle cx="700" cy="170" r="9"/><circle cx="790" cy="130" r="9"/><circle cx="845" cy="180" r="9"/>
</g>
<text class="g" x="540" y="248">Runner-up · fewer orders</text>
<text class="n" x="540" y="274">Info scattered → disagreement → trades</text>
<line x1="90" y1="490" x2="890" y2="490" stroke="var(--line)" stroke-width="2"/>
<line x1="90" y1="330" x2="90" y2="490" stroke="var(--line)" stroke-width="2"/>
<path d="M90 470 L200 440 L300 350 L420 340 L620 345 L870 340" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M90 470 L250 468 L420 455 L620 420 L870 375" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text class="n" x="880" y="330" text-anchor="end">Runner-up</text>
<text class="n" x="880" y="400" text-anchor="end">Leader</text>
<text class="n" x="90" y="516">Time</text>
<text class="c" x="480" y="556" text-anchor="middle">Most exposed ≠ most upside</text>
</svg>
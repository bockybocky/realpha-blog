<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩張小折線圖：左邊那條方向變號後一路往下再也沒回到原位；右邊那條衝出一個尖峰後又落回起點附近">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">同一把尺</text>

  <rect x="50" y="100" width="420" height="330" rx="10" fill="var(--card)"/>
  <text class="g" x="80" y="140">結構</text>
  <text class="b" x="80" y="166">ESPN 訂戶數</text>
  <line x1="80" y1="390" x2="440" y2="390" stroke="var(--line)" stroke-width="1.5"/>
  <line x1="228" y1="200" x2="228" y2="390" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 5"/>
  <polyline points="82,230 130,226 178,232 228,236 276,268 324,306 372,340 440,368" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="228" cy="236" r="6" fill="var(--accent)"/>
  <text class="b" x="238" y="212">方向變號</text>
  <text class="b" x="80" y="418">沒有回來過</text>

  <rect x="490" y="100" width="420" height="330" rx="10" fill="var(--card)"/>
  <text class="g" x="520" y="140">雜音</text>
  <text class="b" x="520" y="166">Disney+ 的那十六個月</text>
  <line x1="520" y1="390" x2="880" y2="390" stroke="var(--line)" stroke-width="1.5"/>
  <polyline points="522,352 570,344 618,286 666,214 714,206 762,262 810,318 880,346" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <circle cx="690" cy="204" r="6" fill="var(--grey)"/>
  <text class="b" x="700" y="192">關在家裡．零利率</text>
  <text class="b" x="520" y="418">情境結束就退回去</text>

  <text class="c" x="60" y="490">看的不是幅度，是回不回得來</text>
</svg>
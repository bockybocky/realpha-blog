<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊中心放射狀連線完整，右邊中心消失連線散落">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">圍繞一個人長出來的骨架</text>
<rect x="60" y="100" width="380" height="400" rx="10" fill="var(--card)"/>
<rect x="520" y="100" width="380" height="400" rx="10" fill="var(--card)"/>
<text x="84" y="140" font-size="20" fill="var(--ink)">上週之前</text>
<text x="544" y="140" font-size="20" fill="var(--warn)">上週之後</text>
<line x1="250" y1="230" x2="110" y2="400" stroke="var(--accent)" stroke-width="2"/>
<line x1="250" y1="230" x2="160" y2="420" stroke="var(--accent)" stroke-width="2"/>
<line x1="250" y1="230" x2="215" y2="430" stroke="var(--accent)" stroke-width="2"/>
<line x1="250" y1="230" x2="285" y2="430" stroke="var(--accent)" stroke-width="2"/>
<line x1="250" y1="230" x2="340" y2="420" stroke="var(--accent)" stroke-width="2"/>
<line x1="250" y1="230" x2="390" y2="400" stroke="var(--accent)" stroke-width="2"/>
<circle cx="110" cy="408" r="9" fill="var(--grey)"/>
<circle cx="160" cy="428" r="9" fill="var(--grey)"/>
<circle cx="215" cy="438" r="9" fill="var(--grey)"/>
<circle cx="285" cy="438" r="9" fill="var(--grey)"/>
<circle cx="340" cy="428" r="9" fill="var(--grey)"/>
<circle cx="390" cy="408" r="9" fill="var(--grey)"/>
<circle cx="250" cy="230" r="34" fill="var(--accent)"/>
<text x="196" y="196" font-size="19" fill="var(--ink)">創辦人</text>
<text x="84" y="478" font-size="16" fill="var(--dim)">60 個直接下屬，中間幾乎沒有層</text>
<circle cx="710" cy="230" r="34" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="570" y1="400" x2="596" y2="372" stroke="var(--grey)" stroke-width="2"/>
<line x1="620" y1="420" x2="640" y2="388" stroke="var(--grey)" stroke-width="2"/>
<line x1="675" y1="430" x2="686" y2="396" stroke="var(--grey)" stroke-width="2"/>
<line x1="745" y1="430" x2="734" y2="396" stroke="var(--grey)" stroke-width="2"/>
<line x1="800" y1="420" x2="780" y2="388" stroke="var(--grey)" stroke-width="2"/>
<line x1="850" y1="400" x2="824" y2="372" stroke="var(--grey)" stroke-width="2"/>
<circle cx="570" cy="408" r="9" fill="var(--grey)"/>
<circle cx="620" cy="428" r="9" fill="var(--grey)"/>
<circle cx="675" cy="438" r="9" fill="var(--grey)"/>
<circle cx="745" cy="438" r="9" fill="var(--grey)"/>
<circle cx="800" cy="428" r="9" fill="var(--grey)"/>
<circle cx="850" cy="408" r="9" fill="var(--grey)"/>
<text x="544" y="478" font-size="16" fill="var(--dim)">沒有一個人份量夠大，拿得起那隻手套</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條路分岔，通往共產主義的分支斷掉，另一支走到市場經濟加代議民主的終點；終點下方溫飽橫條全滿、驕傲橫條幾乎空白">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); font-size:16px; }
</style>
<text x="480" y="52" text-anchor="middle" style="font-size:27px;font-weight:700">歷史的終點在哪裡</text>
<path d="M130 300 C 300 300, 340 170, 500 170" fill="none" stroke="var(--grey)" stroke-width="5" stroke-dasharray="12 9"/>
<line x1="506" y1="156" x2="532" y2="184" stroke="var(--warn)" stroke-width="5"/>
<line x1="532" y1="156" x2="506" y2="184" stroke="var(--warn)" stroke-width="5"/>
<text x="555" y="168" style="font-size:20px;fill:var(--dim)">共產主義</text>
<text x="555" y="195" style="font-size:16px;fill:var(--warn)">走不到</text>
<path d="M130 300 L630 300" fill="none" stroke="var(--accent)" stroke-width="6"/>
<path d="M620 288 L642 300 L620 312 Z" fill="var(--accent)"/>
<circle cx="120" cy="300" r="12" fill="var(--accent)"/>
<text x="120" y="340" text-anchor="middle" style="font-size:19px">現代化</text>
<rect x="645" y="258" width="250" height="84" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="770" y="292" text-anchor="middle" style="font-size:20px;font-weight:700">市場經濟</text>
<text x="770" y="322" text-anchor="middle" style="font-size:20px;font-weight:700">＋代議民主</text>
<text x="770" y="244" text-anchor="middle" style="font-size:16px;fill:var(--dim)">終點</text>
<text x="600" y="400" text-anchor="end" style="font-size:19px">末人</text>
<text x="690" y="392" text-anchor="end" style="font-size:16px;fill:var(--dim)">溫飽</text>
<rect x="705" y="376" width="190" height="22" rx="5" fill="var(--card)" stroke="var(--line)"/>
<rect x="705" y="376" width="190" height="22" rx="5" fill="var(--accent)"/>
<text x="690" y="432" text-anchor="end" style="font-size:16px;fill:var(--dim)">驕傲</text>
<rect x="705" y="416" width="190" height="22" rx="5" fill="var(--card)" stroke="var(--line)"/>
<rect x="705" y="416" width="18" height="22" rx="5" fill="var(--warn)"/>
<text x="480" y="500" text-anchor="middle" style="font-size:22px;font-weight:700">到了終點，還有一塊空著</text>
</svg>
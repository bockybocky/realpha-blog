<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="科技股前瞻本益比分布長條圖，重心壓在低倍數那幾格，30 倍以上只是右邊一小截">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型 */
</style></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">震央的重心在哪一格</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">科技類股　前瞻本益比分布</text>
<rect x="60" y="112" width="840" height="368" fill="var(--card)" rx="8"/>
<line x1="110" y1="424" x2="880" y2="424" stroke="var(--line)" stroke-width="2"/>
<rect x="140" y="361" width="110" height="63" fill="var(--grey)" rx="4"/>
<text x="195" y="348" font-size="19" fill="var(--dim)" text-anchor="middle">9%</text>
<text x="195" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">10 倍以下</text>
<rect x="290" y="158" width="110" height="266" fill="var(--accent)" rx="4"/>
<text x="345" y="145" font-size="20" fill="var(--ink)" text-anchor="middle" font-weight="700">38%</text>
<text x="345" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">10 到 20 倍</text>
<rect x="440" y="228" width="110" height="196" fill="var(--accent)" rx="4" opacity="0.72"/>
<text x="495" y="215" font-size="19" fill="var(--ink)" text-anchor="middle">28%</text>
<text x="495" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">20 到 30 倍</text>
<rect x="590" y="319" width="110" height="105" fill="var(--grey)" rx="4"/>
<text x="645" y="306" font-size="19" fill="var(--dim)" text-anchor="middle">15%</text>
<text x="645" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">30 到 40 倍</text>
<rect x="740" y="354" width="110" height="70" fill="var(--grey)" rx="4"/>
<text x="795" y="341" font-size="19" fill="var(--dim)" text-anchor="middle">10%</text>
<text x="795" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">40 倍以上</text>
<path d="M140 486 L140 496 L550 496 L550 486" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="345" y="518" font-size="19" fill="var(--ink)" text-anchor="middle">30 倍以下　約三分之二</text>
<text x="880" y="518" font-size="16" fill="var(--dim)" text-anchor="end">全市場：52% 落在 10 到 20 倍</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="選後兩天的跌幅長條，半導體那組深跌，雲端前三大只跌一小截">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">同一則新聞，兩層方向相反</text>
  <text class="t" x="60" y="96" font-size="16" fill="var(--dim)">選後兩天，節目報的讀數</text>

  <line x1="80" y1="150" x2="900" y2="150" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="110" y="138" font-size="20" font-weight="700" fill="var(--warn)">要蓋的那一層</text>
  <rect x="120" y="150" width="76" height="210" fill="var(--warn)"/>
  <text class="t" x="120" y="384" font-size="16" fill="var(--ink)">NVIDIA</text>
  <text class="t" x="120" y="406" font-size="16" font-weight="700" fill="var(--warn)">－21%</text>
  <rect x="236" y="150" width="76" height="100" fill="var(--warn)" opacity="0.75"/>
  <text class="t" x="236" y="384" font-size="16" fill="var(--ink)">25 檔裡 20 檔</text>
  <text class="t" x="236" y="406" font-size="16" font-weight="700" fill="var(--warn)">跌超過 10%</text>
  <rect x="352" y="150" width="76" height="90" fill="var(--warn)" opacity="0.6"/>
  <text class="t" x="352" y="384" font-size="16" fill="var(--ink)">台積電</text>
  <text class="t" x="352" y="406" font-size="16" font-weight="700" fill="var(--warn)">－9%</text>

  <line x1="500" y1="130" x2="500" y2="440" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="560" y="138" font-size="20" font-weight="700" fill="var(--accent)">已經有運算力的那一層</text>
  <rect x="570" y="150" width="120" height="20" fill="var(--accent)"/>
  <text class="t" x="570" y="384" font-size="16" fill="var(--ink)">雲端前三大</text>
  <text class="t" x="570" y="406" font-size="16" font-weight="700" fill="var(--accent)">不到 －2%</text>

  <text class="t" x="740" y="196" font-size="16" fill="var(--dim)">參考：QQQ －6.4%</text>
  <text class="t" x="740" y="220" font-size="16" fill="var(--dim)">標普 －4.4%</text>

  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">先問：我買的是哪一層</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩張座標圖用同一組數字，左邊縱軸上限二點四億時線陡峭上升，右邊縱軸上限八百四十億時同樣的線貼在底部幾乎看不見">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">同一組數字，兩個座標</text>
  <text x="60" y="96" font-size="16" fill="var(--dim)">單位：億美元</text>

  <rect x="60" y="120" width="390" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="90" y="152" font-size="19" font-weight="700" fill="var(--ink)">部門自己的座標</text>
  <text x="90" y="176" font-size="15" fill="var(--dim)">縱軸頂端 2.4</text>
  <line x1="120" y1="200" x2="120" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="120" y1="430" x2="420" y2="430" stroke="var(--line)" stroke-width="2"/>
  <polyline points="200,322 360,213" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="200" cy="322" r="6" fill="var(--accent)"/>
  <circle cx="360" cy="213" r="6" fill="var(--accent)"/>
  <text x="166" y="352" font-size="15" fill="var(--dim)">1978 · 1</text>
  <text x="326" y="200" font-size="15" fill="var(--ink)">1979 · 2</text>

  <rect x="510" y="120" width="390" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="540" y="152" font-size="19" font-weight="700" fill="var(--ink)">母公司的座標</text>
  <text x="540" y="176" font-size="15" fill="var(--dim)">縱軸頂端 840</text>
  <line x1="570" y1="200" x2="570" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="570" y1="430" x2="870" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="570" y1="212" x2="870" y2="212" stroke="var(--grey)" stroke-width="6"/>
  <text x="600" y="200" font-size="16" fill="var(--dim)">石油本業 840</text>
  <polyline points="650,428 810,427" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="650" cy="428" r="6" fill="var(--accent)"/>
  <circle cx="810" cy="427" r="6" fill="var(--accent)"/>
  <line x1="730" y1="424" x2="730" y2="382" stroke="var(--accent)" stroke-width="2"/>
  <text x="662" y="372" font-size="15" fill="var(--ink)">同樣的 1 → 2</text>

  <text x="60" y="510" font-size="22" font-weight="700" fill="var(--ink)">翻倍，與小數點後面</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Cheapness and value investors form a loop, with the shareholders' arrow for returning cash pointing left and the company's arrow for investment and expansion pointing right, leaving a gap.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t h" x="60" y="62">Valuation picks the buyer, the buyer sets the demand</text>

  <rect x="120" y="120" width="220" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text class="t g" x="140" y="163">Cheap</text>
  <path d="M340 155 H560" stroke="var(--line)" stroke-width="3"/>
  <path d="M560 155 l-16 -8 v16 z" fill="var(--line)"/>
  <rect x="560" y="120" width="280" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text class="t g" x="580" y="163">More value investors</text>
  <path d="M700 190 V250 H230 V190" stroke="var(--line)" stroke-width="3" fill="none"/>
  <path d="M230 190 l-8 16 h16 z" fill="var(--line)"/>
  <text class="t b" x="400" y="240">The buyer mix sets in</text>

  <line x1="60" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>

  <text class="t g" x="60" y="350">Below: what holders want</text>
  <path d="M470 380 H120" stroke="var(--accent)" stroke-width="4"/>
  <path d="M120 380 l18 -9 v18 z" fill="var(--accent)"/>
  <text class="t g" x="150" y="364" fill="var(--accent)">Hand the cash back</text>

  <text class="t g" x="620" y="350">Above: what the firm wants</text>
  <path d="M530 440 H880" stroke="var(--warn)" stroke-width="4"/>
  <path d="M880 440 l-18 -9 v18 z" fill="var(--warn)"/>
  <text class="t g" x="640" y="424" fill="var(--warn)">Invest, expand</text>

  <line x1="500" y1="330" x2="500" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="t b" x="400" y="496">A mismatch, not a lie</text>

  <text class="t c" x="60" y="540">Cheap won't fix itself</text>
</svg>
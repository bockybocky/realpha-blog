<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two profit curves overlap exactly while order books are full, and only separate into a higher and a lower one once capacity catches up">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">In a tailwind the two look identical</text>
<path d="M120 130 V440 H890" stroke="var(--line)" stroke-width="2" fill="none"/>
<text x="112" y="120" font-size="15" fill="var(--dim)" text-anchor="middle">Profit</text>
<path d="M520 150 V440" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text x="520" y="140" font-size="15" fill="var(--dim)" text-anchor="middle">Pressure arrives</text>
<text x="310" y="200" font-size="19" fill="var(--dim)" text-anchor="middle">Order books full</text>
<text x="710" y="200" font-size="19" fill="var(--dim)" text-anchor="middle">Catch-up</text>
<path d="M140 390 C 270 355, 390 305, 520 262" stroke="var(--ink)" stroke-width="4" fill="none"/>
<path d="M520 262 C 630 240, 750 226, 870 218" stroke="var(--accent)" stroke-width="4" fill="none"/>
<path d="M520 262 C 630 300, 750 358, 870 398" stroke="var(--warn)" stroke-width="4" fill="none"/>
<circle cx="870" cy="218" r="7" fill="var(--accent)"/>
<circle cx="870" cy="398" r="7" fill="var(--warn)"/>
<text x="858" y="200" font-size="16" fill="var(--accent)" text-anchor="end">Irreplaceable</text>
<text x="858" y="380" font-size="16" fill="var(--warn)" text-anchor="end">Just quick delivery</text>
<text x="60" y="515" font-size="22" fill="var(--ink)">A moat is built for bad weather; heat doesn't reveal it.</text>
</svg>
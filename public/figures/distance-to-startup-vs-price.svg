<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="價格隨著距離可開工的時間拉長而往右下滑落，現成廠房在高點，停產五六年的面板廠在深折低點">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">折價折的是距離，不是新舊</text>

  <path d="M180 110 L180 420 L880 420" stroke="var(--line)" stroke-width="2" fill="none"/>
  <text class="b" x="60" y="150">價格</text>
  <text class="b" x="60" y="176">高</text>
  <text class="b" x="60" y="410">低</text>
  <text class="b" x="700" y="466">距離可以開工還有多久</text>
  <text class="b" x="180" y="446">現在</text>
  <text class="b" x="430" y="446">兩三年</text>
  <text class="b" x="700" y="446">五六年</text>

  <path d="M200 160 C360 180, 520 300, 800 384" stroke="var(--grey)" stroke-width="4" fill="none"/>

  <circle cx="212" cy="164" r="11" fill="var(--accent)"/>
  <text class="g" x="236" y="156">現成廠房</text>
  <text class="b" x="236" y="182">新舊、買租都不是重點</text>

  <circle cx="450" cy="250" r="9" fill="var(--grey)"/>
  <text class="b" x="474" y="246">要洗土、要過檢測的老廠區</text>

  <circle cx="792" cy="382" r="11" fill="var(--warn)"/>
  <text class="g" x="560" y="350" fill="var(--warn)">停產的面板廠</text>
  <text class="b" x="560" y="376">地和廠房都算新</text>
  <text class="b" x="560" y="400">搬設備・清環境・再處分</text>

  <text class="c" x="60" y="518">同一座廠，地還是那塊地，價格差在幾年後才有人進去開工</text>
</svg>
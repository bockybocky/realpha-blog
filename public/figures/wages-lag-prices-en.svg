<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The price curve rises and falls first while the wage curve is shifted later, with shading marking where prices fall and wages stay high">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<rect x="560" y="200" width="150" height="240" fill="var(--card)"/>
<text x="48" y="62" font-size="27" fill="var(--ink)">Wages are stickier: prices move first, wages after</text>

<line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="880" y="466" font-size="15" fill="var(--dim)" text-anchor="end">Time</text>

<polyline points="140,400 240,300 340,220 440,200 560,270 680,350 820,392" fill="none" stroke="var(--accent)" stroke-width="3"/>
<polyline points="140,412 260,396 360,332 470,272 590,252 700,292 830,342" fill="none" stroke="var(--dim)" stroke-width="3"/>

<text x="420" y="178" font-size="16" fill="var(--accent)" text-anchor="middle">Prices</text>
<text x="586" y="232" font-size="16" fill="var(--dim)">Wages</text>
<text x="635" y="192" font-size="15" fill="var(--dim)" text-anchor="middle">Prices falling, wages still high</text>

<text x="480" y="510" font-size="22" fill="var(--ink)" text-anchor="middle">Wages are still high; the queue just hasn't finished</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A four-segment stacked bar with the smallest segment colored, and a bracket covering the whole bar pointing at it">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">Better year, credit to whom</text>

<rect x="260" y="310" width="140" height="150" fill="var(--grey)" fill-opacity="0.3" stroke="var(--line)"/>
<rect x="260" y="200" width="140" height="110" fill="var(--grey)" fill-opacity="0.5" stroke="var(--line)"/>
<rect x="260" y="130" width="140" height="70" fill="var(--grey)" fill-opacity="0.7" stroke="var(--line)"/>
<rect x="260" y="100" width="140" height="30" fill="var(--accent)" stroke="var(--accent)"/>

<line x1="240" y1="385" x2="256" y2="385" stroke="var(--line)" stroke-width="2"/>
<line x1="240" y1="255" x2="256" y2="255" stroke="var(--line)" stroke-width="2"/>
<line x1="240" y1="165" x2="256" y2="165" stroke="var(--line)" stroke-width="2"/>
<line x1="240" y1="115" x2="256" y2="115" stroke="var(--line)" stroke-width="2"/>
<text x="230" y="391" font-size="16" fill="var(--dim)" text-anchor="end">Market up</text>
<text x="230" y="261" font-size="16" fill="var(--dim)" text-anchor="end">Sector bid</text>
<text x="230" y="171" font-size="16" fill="var(--dim)" text-anchor="end">More risk</text>
<text x="230" y="121" font-size="16" fill="var(--accent)" text-anchor="end">AI research</text>

<line x1="440" y1="100" x2="440" y2="460" stroke="var(--accent)" stroke-width="3"/>
<line x1="440" y1="100" x2="424" y2="100" stroke="var(--accent)" stroke-width="3"/>
<line x1="440" y1="460" x2="424" y2="460" stroke="var(--accent)" stroke-width="3"/>
<line x1="440" y1="280" x2="480" y2="280" stroke="var(--accent)" stroke-width="3"/>
<text x="496" y="272" font-size="19" fill="var(--accent)">All to AI</text>
<text x="496" y="302" font-size="16" fill="var(--dim)">Only the top sliver</text>

<text x="480" y="526" font-size="22" fill="var(--ink)" text-anchor="middle">Wrong credit, no repeat</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="To the left of the vertical line, two figures and prepared material; to the right, one figure alone">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">Butler stops at the door</text>

<rect x="60" y="120" width="380" height="330" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="520" y="120" width="380" height="330" rx="12" fill="var(--card)" stroke="var(--line)"/>
<line x1="480" y1="108" x2="480" y2="466" stroke="var(--accent)" stroke-width="4"/>
<text x="480" y="94" font-size="19" fill="var(--accent)" text-anchor="middle">Exam door</text>

<text x="250" y="162" font-size="19" fill="var(--dim)" text-anchor="middle">Outside</text>
<circle cx="180" cy="248" r="26" fill="none" stroke="var(--ink)" stroke-width="3"/>
<circle cx="280" cy="248" r="26" fill="var(--accent)" fill-opacity="0.35" stroke="var(--accent)" stroke-width="3"/>
<text x="180" y="308" font-size="15" fill="var(--ink)" text-anchor="middle">You</text>
<text x="280" y="308" font-size="15" fill="var(--dim)" text-anchor="middle">AI</text>
<rect x="140" y="340" width="46" height="30" rx="4" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)"/>
<rect x="204" y="340" width="46" height="30" rx="4" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)"/>
<rect x="268" y="340" width="46" height="30" rx="4" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)"/>
<text x="227" y="402" font-size="15" fill="var(--dim)" text-anchor="middle">Notes and pencils ready</text>

<text x="710" y="162" font-size="19" fill="var(--ink)" text-anchor="middle">Inside</text>
<circle cx="710" cy="248" r="26" fill="none" stroke="var(--ink)" stroke-width="3"/>
<text x="710" y="308" font-size="15" fill="var(--ink)" text-anchor="middle">You</text>
<text x="710" y="402" font-size="15" fill="var(--dim)" text-anchor="middle">Answer alone</text>

<text x="480" y="522" font-size="22" fill="var(--ink)" text-anchor="middle">Entry is the fee, answers are yours</text>
</svg>
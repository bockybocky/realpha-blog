<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="瀑布圖：正的利多柱依序被兩段扣減拉低，越過零線，最後淨值落在零線之下">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); font-weight:700; }
    .gl { font-size:19px; fill:var(--ink); font-weight:700; }
    .bd { font-size:16px; fill:var(--dim); }
    .bs { font-size:15px; fill:var(--dim); }
    .cc { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ti" x="48" y="58">好消息、壞價格：兩層扣減</text>
<line x1="48" y1="340" x2="912" y2="340" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="200" width="140" height="140" fill="var(--accent)"/>
<rect x="300" y="200" width="140" height="80" fill="var(--grey)"/>
<rect x="490" y="280" width="140" height="120" fill="var(--warn)"/>
<rect x="680" y="340" width="140" height="60" fill="var(--warn)"/>
<line x1="250" y1="200" x2="300" y2="200" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="440" y1="280" x2="490" y2="280" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="630" y1="400" x2="680" y2="400" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="bd" x="180" y="188" text-anchor="middle">消息面利多</text>
<text class="bd" x="370" y="188" text-anchor="middle">－ 早就算進去的</text>
<text class="bd" x="560" y="268" text-anchor="middle">－ 消息本身露的餡</text>
<text class="bd" x="750" y="428" text-anchor="middle">淨值　負</text>
<text class="cc" x="48" y="520">扣完這兩層，剩下的才是價格</text>
</svg>
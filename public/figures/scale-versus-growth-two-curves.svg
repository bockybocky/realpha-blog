<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="規模放大時，一條成長率曲線下滑，另一條維持水平">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t  { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">規模放大之後，成長率怎麼走</text>

<line x1="140" y1="400" x2="860" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="120" x2="140" y2="400" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="134" font-size="15" fill="var(--dim)">成長率</text>
<text class="t" x="150" y="430" font-size="15" fill="var(--dim)">原規模</text>
<text class="t" x="470" y="430" font-size="15" fill="var(--dim)">兩倍</text>
<text class="t" x="770" y="430" font-size="15" fill="var(--dim)">三倍</text>

<path d="M170 170 C 360 174, 600 168, 840 172" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="t" x="600" y="152" font-size="19" fill="var(--accent)">網路生意</text>

<path d="M170 180 C 360 240, 600 330, 840 376" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text class="t" x="600" y="368" font-size="19" fill="var(--dim)">放款生意</text>

<text class="t" x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">沒掉下來，就是界線站得住</text>
</svg>
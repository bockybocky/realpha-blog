<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊海面上許多船形符號在動，右邊港口的補給區是空的虛線框">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">同一把尺量過去：海上很滿，港口很空</text>
  <rect x="60" y="110" width="400" height="300" fill="var(--card)"/>
  <text x="80" y="146" font-size="20" fill="var(--accent)">海上</text>
  <polygon points="110,200 134,212 110,224" fill="var(--accent)"/>
  <polygon points="176,186 200,198 176,210" fill="var(--accent)"/>
  <polygon points="140,252 164,264 140,276" fill="var(--accent)"/>
  <polygon points="218,240 242,252 218,264" fill="var(--accent)"/>
  <polygon points="282,196 306,208 282,220" fill="var(--accent)"/>
  <polygon points="190,306 214,318 190,330" fill="var(--accent)"/>
  <polygon points="272,290 296,302 272,314" fill="var(--accent)"/>
  <polygon points="336,248 360,260 336,272" fill="var(--accent)"/>
  <polygon points="356,320 380,332 356,344" fill="var(--accent)"/>
  <polygon points="100,340 124,352 100,364" fill="var(--accent)"/>
  <text x="80" y="390" font-size="16" fill="var(--dim)">艦艇大量移動，含一艘航空母艦</text>
  <rect x="500" y="110" width="400" height="300" fill="var(--card)"/>
  <text x="520" y="146" font-size="20" fill="var(--dim)">港口</text>
  <rect x="520" y="340" width="360" height="24" fill="var(--grey)"/>
  <rect x="540" y="200" width="100" height="120" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="660" y="200" width="100" height="120" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="780" y="200" width="100" height="120" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="552" y="268" font-size="16" fill="var(--dim)">補給</text>
  <text x="672" y="268" font-size="16" fill="var(--dim)">油料</text>
  <text x="792" y="268" font-size="16" fill="var(--dim)">彈藥</text>
  <text x="520" y="390" font-size="16" fill="var(--dim)">看不到大規模後勤整備的跡象</text>
  <text x="60" y="470" font-size="22" fill="var(--ink)">出去得快、回來得快；撐不撐得久還沒答案。</text>
</svg>
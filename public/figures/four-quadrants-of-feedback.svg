<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="判斷對錯乘以市場給不給回饋的四象限，右下角為詭譎">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">四格裡只有一格會讓你懷疑自己</text>
<text x="66" y="188" font-size="19" fill="var(--dim)">市場</text>
<text x="66" y="214" font-size="19" fill="var(--dim)">給回饋</text>
<text x="66" y="372" font-size="19" fill="var(--dim)">市場</text>
<text x="66" y="398" font-size="19" fill="var(--dim)">不給</text>
<rect x="180" y="130" width="330" height="160" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="520" y="130" width="330" height="160" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="180" y="302" width="330" height="160" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="520" y="302" width="330" height="160" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="4"/>
<text x="318" y="222" font-size="27" fill="var(--dim)">運氣</text>
<text x="658" y="222" font-size="27" fill="var(--accent)">正常</text>
<text x="318" y="394" font-size="27" fill="var(--dim)">活該</text>
<text x="650" y="384" font-size="27" fill="var(--warn)">詭譎</text>
<text x="590" y="420" font-size="16" fill="var(--warn)">預判別人的預判</text>
<text x="300" y="492" font-size="19" fill="var(--dim)">判斷錯</text>
<text x="640" y="492" font-size="19" fill="var(--ink)">判斷對</text>
<text x="60" y="548" font-size="22" fill="var(--ink)">對了卻沒回饋，那是減碼與休息的格子</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條生產力曲線分岔，勞動生產力留在零線之上，總要素生產力穿過零線轉為負值">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="58">投進去的，沒換出來</text>
<line x1="80" y1="340" x2="900" y2="340" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="80" y="366">零</text>
<polyline points="100,220 260,208 420,214 580,200 740,206 880,198" fill="none" stroke="var(--accent)" stroke-width="6"/>
<text class="g" x="700" y="178" fill="var(--accent)">勞動生產力</text>
<polyline points="100,214 260,222 420,250 580,300 700,340 800,382 880,410" fill="none" stroke="var(--warn)" stroke-width="6"/>
<text class="g" x="640" y="430" fill="var(--warn)">總要素生產力</text>
<circle cx="700" cy="340" r="10" fill="var(--warn)"/>
<text class="b" x="716" y="326" fill="var(--warn)">轉負</text>
<text class="b" x="100" y="150">十八個月前還在一起</text>
<line x1="880" y1="198" x2="880" y2="410" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 6"/>
<text class="b" x="100" y="470">同一段時間，兩個數字講不同的故事</text>
<text class="c" x="60" y="516">他看著這張圖，想起九零年代中的東南亞</text>
</svg>
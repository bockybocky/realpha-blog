<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The same cost split among five people compared with the same cost split among six">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; font-weight:700; fill:var(--ink); }
    .g  { font-size:20px; font-weight:600; }
    .b  { font-size:16px; fill:var(--dim); }
    .c  { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">Same backbone cost, split how many ways</text>

<rect x="60" y="96" width="400" height="330" fill="var(--card)"/>
<text class="g" x="88" y="136" fill="var(--warn)">He stays behind the meter</text>
<rect x="88" y="160" width="344" height="52" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="104" y="194">Same backbone　$60</text>
<circle cx="118" cy="266" r="18" fill="var(--grey)"/>
<circle cx="176" cy="266" r="18" fill="var(--grey)"/>
<circle cx="234" cy="266" r="18" fill="var(--grey)"/>
<circle cx="292" cy="266" r="18" fill="var(--grey)"/>
<circle cx="350" cy="266" r="18" fill="var(--grey)"/>
<circle cx="408" cy="266" r="18" fill="var(--card)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="4 4"/>
<text class="b" x="366" y="312">Own generation</text>
<text class="g" x="88" y="368" fill="var(--warn)">Split five ways</text>
<text class="t" x="88" y="406">$12 each</text>

<rect x="500" y="96" width="400" height="330" fill="var(--card)"/>
<text class="g" x="528" y="136" fill="var(--accent)">He connects to the grid</text>
<rect x="528" y="160" width="344" height="52" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="544" y="194">Same backbone　$60</text>
<circle cx="558" cy="266" r="18" fill="var(--grey)"/>
<circle cx="616" cy="266" r="18" fill="var(--grey)"/>
<circle cx="674" cy="266" r="18" fill="var(--grey)"/>
<circle cx="732" cy="266" r="18" fill="var(--grey)"/>
<circle cx="790" cy="266" r="18" fill="var(--grey)"/>
<circle cx="848" cy="266" r="18" fill="var(--accent)"/>
<text class="b" x="806" y="312">Shared together</text>
<text class="g" x="528" y="368" fill="var(--accent)">Split six ways</text>
<text class="t" x="528" y="406">$10 each</text>

<text class="c" x="60" y="486">He doesn't raise the bill, he keeps it from falling</text>
</svg>
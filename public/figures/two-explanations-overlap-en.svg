<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two overlapping circles: a positioning rewrite and a demand-driven lead change, with parts capability in the overlap, while two crossed-out explanations below are already excluded.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="52">Two reads, one fact</text>

  <circle cx="390" cy="250" r="160" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="610" cy="250" r="160" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="3"/>

  <text class="g" x="200" y="136">Rewrite</text>
  <text class="d" x="200" y="164">Door = parts</text>
  <text class="g" x="662" y="136">Demand</text>
  <text class="d" x="662" y="164">Servers hot</text>

  <text class="g" x="446" y="244">Parts</text>
  <text class="d" x="440" y="274">Both</text>

  <rect x="140" y="440" width="300" height="70" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text class="g" x="166" y="484" fill="var(--dim)">Space</text>
  <line x1="150" y1="505" x2="430" y2="445" stroke="var(--warn)" stroke-width="3"/>

  <rect x="520" y="440" width="300" height="70" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text class="g" x="546" y="484" fill="var(--dim)">EV cut</text>
  <line x1="530" y1="505" x2="810" y2="445" stroke="var(--warn)" stroke-width="3"/>

  <text class="d" x="140" y="420">Out</text>
  <text class="c" x="60" y="556">Watch in-house parts</text>
</svg>
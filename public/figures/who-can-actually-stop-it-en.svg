<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Of seven states only one says pause; below that is the presidential veto, and the final two-thirds threshold line sits above the actual seat count.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">Who can really hit pause</text>

  <text class="t" x="60" y="130" font-size="19" font-weight="700" fill="var(--dim)">Governors of seven states</text>
  <rect x="60" y="150" width="80" height="80" fill="var(--warn)" opacity="0.8"/>
  <rect x="150" y="150" width="80" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="240" y="150" width="80" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="330" y="150" width="80" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="420" y="150" width="80" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="510" y="150" width="80" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="600" y="150" width="80" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="100" y="258" font-size="16" fill="var(--warn)" text-anchor="middle">Pause</text>
  <text class="t" x="420" y="258" font-size="16" fill="var(--dim)" text-anchor="middle">No new permits / existing ones proceed / want more payouts</text>

  <line x1="60" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="60" y="350" font-size="19" font-weight="700" fill="var(--dim)">One layer up</text>
  <rect x="60" y="370" width="300" height="70" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="210" y="413" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Presidential veto</text>

  <line x1="520" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
  <rect x="560" y="370" width="110" height="100" fill="var(--grey)" opacity="0.6"/>
  <text class="t" x="615" y="495" font-size="16" fill="var(--dim)" text-anchor="middle">Actual seats</text>
  <line x1="520" y1="330" x2="900" y2="330" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
  <text class="t" x="900" y="318" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="end">Override a veto: two-thirds</text>

  <text class="t" x="60" y="552" font-size="22" fill="var(--ink)">Slower and costlier, but not stopping.</text>
</svg>
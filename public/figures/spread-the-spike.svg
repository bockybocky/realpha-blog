<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一根高柱攤成五根矮柱，面積相同而帳單上的衝擊變小">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">同一筆錢，兩種感受</text>

<line x1="90" y1="400" x2="420" y2="400" stroke="var(--line)"/>
<rect x="210" y="140" width="80" height="260" fill="var(--warn)"/>
<text class="g" x="250" y="438" text-anchor="middle">一年付完</text>
<text class="b" x="250" y="466" text-anchor="middle">風災修復</text>

<text class="g" x="465" y="275" text-anchor="middle" fill="var(--dim)">攤開</text>
<path d="M440 300 L500 300 M486 290 L502 300 L486 310" stroke="var(--grey)" stroke-width="3" fill="none"/>

<line x1="540" y1="400" x2="890" y2="400" stroke="var(--line)"/>
<rect x="560" y="348" width="55" height="52" fill="var(--accent)"/>
<rect x="628" y="348" width="55" height="52" fill="var(--accent)"/>
<rect x="696" y="348" width="55" height="52" fill="var(--accent)"/>
<rect x="764" y="348" width="55" height="52" fill="var(--accent)"/>
<rect x="832" y="348" width="55" height="52" fill="var(--accent)"/>
<text class="g" x="723" y="438" text-anchor="middle">分好幾年</text>
<text class="b" x="723" y="466" text-anchor="middle">公共融資</text>

<text class="c" x="60" y="512">面積一樣，帳單上的高度不一樣</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One very tall bar beside one almost invisible bar, a gap of sixty times.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="120" y="56" font-size="27" fill="var(--ink)">Where the effort went</text>

  <line x1="120" y1="470" x2="840" y2="470" stroke="var(--line)" stroke-width="2"/>

  <rect x="220" y="130" width="130" height="340" fill="var(--grey)"/>
  <rect x="580" y="464" width="130" height="6" fill="var(--accent)"/>

  <text x="285" y="112" font-size="28" fill="var(--ink)" text-anchor="middle">546</text>
  <text x="645" y="446" font-size="28" fill="var(--accent)" text-anchor="middle">9</text>

  <text x="285" y="506" font-size="19" fill="var(--dim)" text-anchor="middle">Building it</text>
  <text x="645" y="506" font-size="19" fill="var(--dim)" text-anchor="middle">Actually trading</text>

  <line x1="350" y1="130" x2="770" y2="130" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="770" y1="136" x2="770" y2="458" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="770,128 764,142 776,142" fill="var(--accent)"/>
  <polygon points="770,466 764,452 776,452" fill="var(--accent)"/>
  <text x="790" y="302" font-size="22" fill="var(--accent)">60x</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Five small blocks sit side by side on the left, and a large frame on the right takes in four of them, leaving one pushed outside.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Bigger bids squeeze niches</text>
<text x="60" y="90" font-size="15" fill="var(--dim)">Late 1980s: 5 schools bundle it all</text>

<text x="60" y="140" font-size="19" fill="var(--dim)">Before: bid by bid</text>
<g>
<rect x="60" y="162" width="196" height="50" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="76" y="193" font-size="16" fill="var(--ink)">Laundry</text>
<rect x="60" y="222" width="196" height="50" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="76" y="253" font-size="16" fill="var(--ink)">Dining</text>
<rect x="60" y="282" width="196" height="50" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="76" y="313" font-size="16" fill="var(--ink)">Buses</text>
<rect x="60" y="342" width="196" height="50" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="76" y="373" font-size="16" fill="var(--ink)">Stadium food</text>
<rect x="60" y="402" width="196" height="50" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="76" y="433" font-size="16" fill="var(--accent)">Coffee shop</text>
</g>

<path d="M280 300 L336 300" stroke="var(--dim)" stroke-width="3"/>
<path d="M336 300 l-12 -8 l0 16 z" fill="var(--dim)"/>

<rect x="372" y="150" width="500" height="302" rx="12" fill="none" stroke="var(--dim)" stroke-width="3"/>
<text x="392" y="182" font-size="20" font-weight="700" fill="var(--ink)">Bundled deal</text>
<text x="392" y="206" font-size="15" fill="var(--dim)">Aramark / Compass</text>
<rect x="400" y="224" width="440" height="48" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="418" y="254" font-size="16" fill="var(--ink)">Laundry</text>
<rect x="400" y="282" width="440" height="48" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="418" y="312" font-size="16" fill="var(--ink)">Dining</text>
<rect x="400" y="340" width="440" height="48" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="418" y="370" font-size="16" fill="var(--ink)">Buses</text>
<rect x="400" y="394" width="440" height="48" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="418" y="424" font-size="16" fill="var(--ink)">Stadium food</text>

<rect x="560" y="474" width="312" height="52" rx="8" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="578" y="506" font-size="16" fill="var(--warn)">23 coffee shops: no bid</text>

<text x="60" y="566" font-size="22" font-weight="700" fill="var(--ink)">The niche wasn't beaten; there was no bid for it</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A short solid bar next to a much taller hollow bar drawn with a dashed outline.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">The part you got right looks like nothing happened</text>

<line x1="120" y1="430" x2="860" y2="430" stroke="var(--line)" stroke-width="2"/>

<rect x="260" y="310" width="130" height="120" fill="var(--warn)" fill-opacity="0.25" stroke="var(--warn)" stroke-width="3"/>
<text x="325" y="380" font-size="19" fill="var(--ink)" text-anchor="middle">Cost</text>
<text x="325" y="466" font-size="19" fill="var(--warn)" text-anchor="middle">Visible</text>
<text x="325" y="292" font-size="15" fill="var(--dim)" text-anchor="middle">The half you sold</text>

<rect x="600" y="130" width="130" height="300" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="665" y="290" font-size="19" fill="var(--dim)" text-anchor="middle">Loss avoided</text>
<text x="665" y="466" font-size="19" fill="var(--accent)" text-anchor="middle">Unseen</text>
<text x="665" y="112" font-size="15" fill="var(--dim)" text-anchor="middle">The year it didn't crash</text>

<text x="480" y="516" font-size="22" fill="var(--ink)" text-anchor="middle">So write it down first: what would prove me wrong</text>
</svg>
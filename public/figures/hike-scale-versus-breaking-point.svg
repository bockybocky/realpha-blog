<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="刻度對比：市場算的升息幅度很短，落幕門檻只在稍遠處，他算的幅度長得多">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="58">門檻比你以為的近</text>
<line x1="80" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="80" y="462">現在</text>
<text class="g" x="60" y="160">市場算的</text>
<rect x="80" y="176" width="200" height="56" rx="8" fill="var(--grey)" opacity="0.6"/>
<text class="g" x="60" y="310">他算的</text>
<rect x="80" y="326" width="760" height="56" rx="8" fill="var(--accent)"/>
<line x1="420" y1="130" x2="420" y2="430" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 7"/>
<text class="g" x="440" y="124" fill="var(--warn)">殖利率再跳一段</text>
<text class="b" x="440" y="150" fill="var(--warn)">股市的落幕線</text>
<text class="c" x="60" y="500">不必等 AI 的帳算不過來，這條線先到</text>
</svg>
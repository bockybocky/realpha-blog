<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="右邊高高一疊代表光罩廠要換的設備，左邊只有矮矮兩塊代表晶圓廠，好處箭頭由右指向左">
<rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">要改的東西，一邊兩樣，一邊整廠</text>

<text x="80" y="420" font-size="20" fill="var(--ink)">晶圓廠</text>
<rect x="80" y="440" width="300" height="46" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="100" y="470" font-size="16" fill="var(--dim)">掃描機</text>
<rect x="80" y="494" width="300" height="46" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="100" y="524" font-size="16" fill="var(--dim)">搬運・檢驗・庫存</text>

<text x="580" y="152" font-size="20" fill="var(--ink)">光罩廠</text>
<rect x="580" y="172" width="300" height="46" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="600" y="202" font-size="16" fill="var(--dim)">載具儲位</text>
<rect x="580" y="226" width="300" height="46" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="600" y="256" font-size="16" fill="var(--dim)">載具櫃</text>
<rect x="580" y="280" width="300" height="46" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="600" y="310" font-size="16" fill="var(--dim)">清洗機</text>
<rect x="580" y="334" width="300" height="46" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="600" y="364" font-size="16" fill="var(--dim)">檢查機</text>
<rect x="580" y="388" width="300" height="46" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="600" y="418" font-size="16" fill="var(--dim)">搬運設備</text>
<rect x="580" y="442" width="300" height="46" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="600" y="472" font-size="16" fill="var(--dim)">天車</text>
<rect x="580" y="496" width="300" height="46" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="600" y="526" font-size="16" fill="var(--dim)">新舊兩線並行</text>
<text x="580" y="568" font-size="16" fill="var(--warn)">設備貴 20% 到 100%</text>

<path d="M560 230 Q470 250 240 390" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<path d="M247 381 L233 395 L252 394 Z" fill="var(--accent)"/>
<text x="330" y="258" font-size="19" fill="var(--accent)">好處往這邊</text>

<text x="60" y="600" font-size="22" fill="var(--ink)">花費落右邊，好處進左邊</text>
</svg>
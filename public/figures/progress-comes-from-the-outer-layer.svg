<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="外層包住內層的兩個方框，旁邊一條七比三的橫棒，長的那段屬於外層">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56">這次的進步，七成來自模型外面那一圈</text>

  <rect x="70" y="120" width="330" height="280" rx="18" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="98" y="158">工具層</text>
  <rect x="140" y="196" width="190" height="140" rx="12" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
  <text class="g" x="235" y="274" text-anchor="middle">模型</text>
  <text class="s" x="98" y="382">查資料．串接．逐頁自檢</text>

  <line x1="460" y1="150" x2="460" y2="380" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

  <text class="s" x="520" y="196">進步的來源</text>
  <rect x="520" y="216" width="380" height="70" rx="8" fill="var(--accent)"/>
  <rect x="786" y="216" width="114" height="70" rx="8" fill="var(--grey)"/>
  <text class="g" x="600" y="260" fill="var(--page)">工具層 70%</text>
  <text class="s" x="520" y="318">好抄</text>
  <text class="s" x="800" y="318">難抄</text>
  <text class="s" x="800" y="196" text-anchor="middle">模型 30%</text>

  <text class="c" x="60" y="470">好抄的那一層，領先撐不久</text>
</svg>
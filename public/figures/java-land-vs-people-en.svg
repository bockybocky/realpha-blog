<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A very short horizontal bar sits beside a very long one, so the share of land is far smaller than the share of people, and below them two bars of almost identical height show that the area of rice land barely moved.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">Java: 9% of the land, two-thirds of the people</text>
<text x="60" y="150" font-size="19" fill="var(--dim)">Share of Indonesia's land</text>
<rect x="60" y="165" width="840" height="44" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="165" width="76" height="44" fill="var(--accent)"/>
<text x="152" y="195" font-size="20" fill="var(--ink)">9%</text>
<text x="60" y="258" font-size="19" fill="var(--dim)">Share of people on Java</text>
<rect x="60" y="273" width="840" height="44" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="273" width="546" height="44" fill="var(--accent)"/>
<text x="622" y="303" font-size="20" fill="var(--ink)">~2/3</text>
<text x="60" y="382" font-size="19" fill="var(--dim)">Irrigated rice, 10k ha</text>
<line x1="60" y1="480" x2="420" y2="480" stroke="var(--line)" stroke-width="2"/>
<rect x="90" y="364" width="70" height="116" fill="var(--accent)"/>
<text x="90" y="352" font-size="16" fill="var(--ink)">290</text>
<text x="90" y="502" font-size="16" fill="var(--dim)">1905</text>
<rect x="200" y="348" width="70" height="132" fill="var(--accent)"/>
<text x="200" y="336" font-size="16" fill="var(--ink)">330</text>
<text x="200" y="502" font-size="16" fill="var(--dim)">1930</text>
<text x="470" y="420" font-size="22" fill="var(--ink)">+14% in 25 years</text>
<text x="470" y="455" font-size="16" fill="var(--dim)">Land ran out</text>
</svg>
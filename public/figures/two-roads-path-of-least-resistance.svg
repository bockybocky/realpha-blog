<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="從同一個起點分出兩條路，上坡那條沒走，下坡那條走了">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="480" y="56" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">面對中產停滯的兩條路</text>

  <line x1="80" y1="470" x2="80" y2="150" stroke="var(--line)" stroke-width="2"/>
  <polygon points="80,136 73,152 87,152" fill="var(--line)"/>
  <text x="80" y="126" text-anchor="middle" font-size="15" fill="var(--dim)">阻力大</text>
  <text x="80" y="494" text-anchor="middle" font-size="15" fill="var(--dim)">阻力小</text>

  <circle cx="190" cy="320" r="9" fill="var(--ink)"/>
  <text x="190" y="290" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)">中產停滯</text>

  <path d="M190 320 C 400 320, 520 210, 740 178" fill="none" stroke="var(--grey)" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <text x="500" y="150" text-anchor="middle" font-size="19" fill="var(--dim)">對內：課富人稅・財富移轉・公共教育</text>
  <text x="762" y="184" font-size="19" font-weight="700" fill="var(--grey)">沒走</text>

  <path d="M190 320 C 400 340, 520 408, 726 424" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
  <polygon points="744,426 722,414 720,434" fill="var(--accent)"/>
  <text x="470" y="478" text-anchor="middle" font-size="19" fill="var(--ink)">對外：關稅・對付中國</text>
  <text x="762" y="430" font-size="19" font-weight="700" fill="var(--accent)">走了</text>

  <text x="480" y="534" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">被選的不是最好的那條，是最省力的那條</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The car is held against the vertical wall, with clearly more suction arrows pointing into the wall than downward gravity arrows, and the pressure-difference bar on the right far taller than the gravity bar.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<defs>
<marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="var(--accent)"/></marker>
<marker id="dg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="var(--dim)"/></marker>
</defs>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="62" font-size="27" fill="var(--ink)">Pressure, not horsepower, holds it up</text>

<rect x="140" y="110" width="26" height="380" fill="var(--grey)"/>
<text x="120" y="96" font-size="19" fill="var(--dim)">Wall</text>

<rect x="166" y="200" width="78" height="170" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="158" y="214" width="10" height="28" rx="3" fill="var(--grey)"/>
<rect x="158" y="330" width="10" height="28" rx="3" fill="var(--grey)"/>
<line x1="166" y1="200" x2="166" y2="370" stroke="var(--accent)" stroke-width="3"/>

<line x1="300" y1="228" x2="176" y2="228" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar)"/>
<line x1="300" y1="285" x2="176" y2="285" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar)"/>
<line x1="300" y1="342" x2="176" y2="342" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar)"/>
<text x="312" y="234" font-size="16" fill="var(--ink)">Near vacuum underneath</text>
<text x="312" y="291" font-size="16" fill="var(--ink)">High-pressure fans</text>
<text x="312" y="348" font-size="16" fill="var(--ink)">Skirts lowered</text>

<line x1="205" y1="382" x2="205" y2="462" stroke="var(--dim)" stroke-width="3" marker-end="url(#dg)"/>
<text x="178" y="486" font-size="16" fill="var(--dim)">Gravity</text>

<text x="640" y="176" font-size="20" fill="var(--ink)">What holds it</text>
<line x1="620" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="646" y="212" width="70" height="258" fill="var(--accent)"/>
<rect x="770" y="382" width="70" height="88" fill="var(--grey)"/>
<text x="652" y="196" font-size="19" fill="var(--accent)">Pressure</text>
<text x="782" y="366" font-size="19" fill="var(--dim)">Weight</text>
<text x="640" y="500" font-size="16" fill="var(--dim)">Two atm</text>
<text x="770" y="500" font-size="16" fill="var(--dim)">Car</text>
</g>
</svg>
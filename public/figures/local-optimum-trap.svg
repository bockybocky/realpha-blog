<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條起伏曲線，左邊小山峰上有一個點，右邊是一座更高的山峰，兩者之間隔著一個谷">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="480" y="62" text-anchor="middle" font-size="27" fill="var(--ink)">每一步都往上，卻到不了更高的山</text>

  <line x1="250" y1="340" x2="860" y2="340" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="860" y1="175" x2="860" y2="340" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <path d="M 90 460 C 150 462, 185 352, 250 340 C 330 326, 375 430, 500 442 C 645 456, 715 300, 860 175"
        fill="none" stroke="var(--grey)" stroke-width="3"/>

  <circle cx="250" cy="340" r="9" fill="var(--accent)"/>
  <circle cx="860" cy="175" r="9" fill="var(--accent)"/>

  <text x="250" y="308" text-anchor="middle" font-size="19" fill="var(--ink)">電視</text>
  <text x="838" y="145" text-anchor="middle" font-size="19" fill="var(--ink)">新媒介</text>

  <text x="163" y="420" text-anchor="middle" font-size="15" fill="var(--dim)">邊際報酬</text>
  <text x="500" y="478" text-anchor="middle" font-size="15" fill="var(--dim)">要先下坡</text>
  <text x="822" y="268" text-anchor="end" font-size="15" fill="var(--dim)">更高</text>

  <text x="480" y="515" text-anchor="middle" font-size="22" fill="var(--ink)">擋住轉型的不是愚蠢，是局部最佳化</text>
</svg>
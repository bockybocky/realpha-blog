<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩格對照，左邊虧損箭頭短獲利箭頭長，右邊虧損箭頭長獲利箭頭短且被剪斷">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.f6-b{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.f6-t{font-size:27px;font-weight:700}
.f6-g{font-size:19px;font-weight:700}
.f6-s{font-size:15px}
.f6-c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="f6-b f6-t" x="60" y="66">同一套不對稱，方向裝反了</text>
<rect x="60" y="112" width="410" height="330" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="500" y="112" width="400" height="330" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="f6-b f6-g" x="265" y="152" text-anchor="middle">趨勢跟隨</text>
<text class="f6-b f6-g" x="700" y="152" text-anchor="middle">人的直覺</text>
<line x1="90" y1="300" x2="440" y2="300" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="524" y1="300" x2="876" y2="300" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="180" y1="300" x2="180" y2="348" stroke="var(--warn)" stroke-width="6"/>
<polygon points="180,368 170,344 190,344" fill="var(--warn)"/>
<text class="f6-b f6-s" x="180" y="394" text-anchor="middle" fill="var(--warn)">虧損：砍很近</text>
<line x1="350" y1="300" x2="350" y2="200" stroke="var(--accent)" stroke-width="6"/>
<polygon points="350,180 340,204 360,204" fill="var(--accent)"/>
<text class="f6-b f6-s" x="350" y="266" text-anchor="middle" fill="var(--accent)">獲利：給空間</text>
<line x1="615" y1="300" x2="615" y2="400" stroke="var(--warn)" stroke-width="6"/>
<polygon points="615,420 605,396 625,396" fill="var(--warn)"/>
<text class="f6-b f6-s" x="615" y="252" text-anchor="middle" fill="var(--warn)">虧損：再等一天</text>
<line x1="790" y1="300" x2="790" y2="252" stroke="var(--accent)" stroke-width="6"/>
<line x1="762" y1="246" x2="818" y2="234" stroke="var(--ink)" stroke-width="3"/>
<text class="f6-b f6-s" x="790" y="212" text-anchor="middle" fill="var(--ink)">獲利：先鎖住</text>
<text class="f6-b f6-c" x="60" y="500">右尾被自己剪掉，左尾被自己放長</text>
</svg>
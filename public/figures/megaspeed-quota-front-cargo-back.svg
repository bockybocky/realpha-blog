<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="六個方塊從左到右排成一列，高度與顏色一路遞減到幾乎看不見，代表從發配額那一端往下游看，越往後越看不到；一支箭頭只從最左邊那塊的上方垂下來，表示配額只從最前端發出">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56">配額在最前面，貨落在最後面</text>
  <text class="g" x="50" y="112" text-anchor="start">配額在這一端</text>
  <line x1="116" y1="130" x2="116" y2="222" stroke="var(--accent)" stroke-width="4"/>
  <polygon points="116,238 106,220 126,220" fill="var(--accent)"/>
  <rect x="50" y="240" width="132" height="110" rx="6" fill="var(--accent)"/>
  <text class="n" x="116" y="378" text-anchor="middle" fill="var(--ink)">晶片供應者</text>
  <rect x="202" y="252" width="132" height="98" rx="6" fill="var(--accent)" opacity="0.78"/>
  <text class="n" x="268" y="378" text-anchor="middle">伺服器廠</text>
  <rect x="354" y="264" width="132" height="86" rx="6" fill="var(--accent)" opacity="0.58"/>
  <text class="n" x="420" y="378" text-anchor="middle">通路</text>
  <rect x="506" y="276" width="132" height="74" rx="6" fill="var(--accent)" opacity="0.4"/>
  <text class="n" x="572" y="378" text-anchor="middle">再轉通路</text>
  <rect x="658" y="288" width="132" height="62" rx="6" fill="var(--accent)" opacity="0.26"/>
  <text class="n" x="724" y="378" text-anchor="middle">機房</text>
  <rect x="810" y="300" width="132" height="50" rx="6" fill="var(--accent)" opacity="0.15"/>
  <text class="n" x="876" y="378" text-anchor="middle">租用者</text>
  <line x1="50" y1="416" x2="906" y2="416" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="922,416 904,406 904,426" fill="var(--grey)"/>
  <text class="n" x="50" y="444" text-anchor="start">從發配額這端看得到</text>
  <text class="n" x="876" y="444" text-anchor="middle">看不到了</text>
  <text class="c" x="60" y="506">配額發在最前面，貨落在隔了幾手之後</text>
</svg>
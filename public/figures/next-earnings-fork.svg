<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="單一節點往右分成兩條岔路的分岔圖">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="60">不動的原因，要等下一份財報分岔</text>
<rect x="60" y="215" width="180" height="80" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="150" y="262" text-anchor="middle">股價不動</text>
<line x1="240" y1="255" x2="350" y2="255" stroke="var(--dim)" stroke-width="3"/>
<path d="M350 245 L368 255 L350 265 Z" fill="var(--dim)"/>
<rect x="375" y="215" width="200" height="80" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="475" y="262" text-anchor="middle">下一份財報</text>
<path d="M575 245 C640 245 640 160 690 160" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M690 150 L708 160 L690 170 Z" fill="var(--accent)"/>
<path d="M575 265 C640 265 640 355 690 355" fill="none" stroke="var(--warn)" stroke-width="3"/>
<path d="M690 345 L708 355 L690 365 Z" fill="var(--warn)"/>
<rect x="715" y="120" width="200" height="80" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="815" y="152" text-anchor="middle">撐得出來</text>
<text class="n" x="815" y="178" text-anchor="middle">籌碼問題・耐心換空間</text>
<rect x="715" y="315" width="200" height="80" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="g" x="815" y="347" text-anchor="middle">撐不出來</text>
<text class="n" x="815" y="373" text-anchor="middle">市場比你早聞到</text>
<text class="c" x="480" y="470" text-anchor="middle">當下分不出來，就先別急著下結論</text>
</svg>
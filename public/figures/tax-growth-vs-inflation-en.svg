<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Tax receipt growth rises to eight percent then falls back to five, meeting the dashed inflation line at five.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
 svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
       --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
 @media (prefers-color-scheme: dark) {
   svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
         --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
 }
 text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
 .h{font-size:27px;font-weight:700}
 .g{font-size:19px;fill:var(--dim)}
 .b{font-size:16px;fill:var(--dim)}
 .c{font-size:22px;font-weight:700}
</style>
<text class="h" x="60" y="56">Not GDP — what the IRS collects daily</text>
<line x1="90" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="90" y1="270" x2="900" y2="270" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="g" x="90" y="256" fill="var(--warn)">Inflation 5%</text>
<polyline points="130,283 330,231 560,192 840,270" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="130" cy="283" r="7" fill="var(--accent)"/>
<circle cx="560" cy="192" r="7" fill="var(--accent)"/>
<circle cx="840" cy="270" r="9" fill="var(--accent)"/>
<text class="b" x="100" y="320">Pre-Covid 4–5%</text>
<text class="b" x="520" y="174">Early this year 8%</text>
<text class="b" x="790" y="320">Now 5%</text>
<text class="g" x="640" y="400">Tax growth</text>
<text class="c" x="60" y="500">Both lines meet: no real income gains</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A fixed-length bar is cut by a divider in the middle, with each explanation pushing toward the centre from its own side.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="50" y="58" font-size="27" font-weight="700" fill="var(--ink)">There is only so much to explain</text>

<text x="60" y="118" font-size="19" font-weight="700" fill="var(--dim)">Total to be explained (fixed)</text>
<rect x="60" y="134" width="840" height="20" rx="6" fill="var(--grey)" opacity="0.35"/>
<line x1="60" y1="128" x2="60" y2="160" stroke="var(--grey)" stroke-width="3"/>
<line x1="900" y1="128" x2="900" y2="160" stroke="var(--grey)" stroke-width="3"/>

<rect x="60" y="220" width="840" height="86" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="220" width="420" height="86" rx="8" fill="var(--accent)" opacity="0.28"/>
<line x1="480" y1="206" x2="480" y2="320" stroke="var(--warn)" stroke-width="4"/>
<text x="268" y="272" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Attention shift</text>
<text x="690" y="272" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">His name and scandals</text>

<polygon points="440,356 408,356 408,346 376,364 408,382 408,372 440,372" fill="var(--accent)"/>
<text x="330" y="370" font-size="16" fill="var(--dim)" text-anchor="end">Pushes this way</text>
<polygon points="520,356 552,356 552,346 584,364 552,382 552,372 520,372" fill="var(--warn)"/>
<text x="630" y="370" font-size="16" fill="var(--dim)">Pushes this way</text>

<text x="480" y="456" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">More on one side means less on the other</text>
</svg>
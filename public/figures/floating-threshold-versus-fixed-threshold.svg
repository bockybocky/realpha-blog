<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左圖門檻跟著曲線移動永不相交，右圖固定門檻被曲線穿過一次。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="72" font-size="27" fill="var(--ink)">兩種理由，兩種失效條件</text>

  <rect x="60" y="120" width="400" height="300" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="84" y="160" font-size="20" fill="var(--dim)">理由＝它會漲</text>
  <polyline points="90,300 150,250 210,280 270,200 330,240 390,190 440,220" fill="none" stroke="var(--ink)" stroke-width="4"/>
  <polyline points="90,346 150,296 210,326 270,246 330,286 390,236 440,266" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="260" y="398" font-size="16" fill="var(--dim)" text-anchor="middle">門檻跟著價格跑，碰不到</text>

  <rect x="500" y="120" width="400" height="300" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="524" y="160" font-size="20" fill="var(--dim)">理由＝它跟股票不同步</text>
  <polyline points="530,250 590,220 650,240 710,200 770,250 830,300 880,330" fill="none" stroke="var(--ink)" stroke-width="4"/>
  <line x1="520" y1="270" x2="890" y2="270" stroke="var(--accent)" stroke-width="3.5"/>
  <circle cx="794" cy="270" r="9" fill="var(--accent)"/>
  <text x="700" y="398" font-size="16" fill="var(--dim)" text-anchor="middle">門檻不動，會被穿過</text>

  <text x="60" y="490" font-size="22" fill="var(--ink)">工作講得清楚，才有一個真的會響的檢查點</text>
</svg>
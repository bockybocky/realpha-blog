<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三排方格：第一排單向向右填滿；第二排中間留空、兩側向內指；第三排中間留空且空格內再由左往右逐格生成。">

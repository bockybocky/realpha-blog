<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The continuation engine follows the existing pattern: a clean codebase produces clean new work, while a messy codebase produces equally messy new work.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" fill="var(--ink)">It continues in your existing style</text>
<text x="60" y="118" font-size="20" fill="var(--dim)">Clean to begin with</text>
<rect x="60" y="140" width="110" height="34" fill="var(--grey)"/>
<rect x="60" y="184" width="110" height="34" fill="var(--grey)"/>
<rect x="60" y="228" width="110" height="34" fill="var(--grey)"/>
<line x1="196" y1="200" x2="236" y2="200" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="252" y="140" width="110" height="34" fill="var(--accent)"/>
<rect x="252" y="184" width="110" height="34" fill="var(--accent)"/>
<rect x="252" y="228" width="110" height="34" fill="var(--accent)"/>
<text x="252" y="302" font-size="19" fill="var(--accent)">What the agent writes</text>
<line x1="470" y1="100" x2="470" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="540" y="118" font-size="20" fill="var(--dim)">Messy to begin with</text>
<rect x="540" y="140" width="130" height="30" fill="var(--grey)" transform="rotate(-4 540 140)"/>
<rect x="552" y="186" width="86" height="38" fill="var(--grey)" transform="rotate(3 552 186)"/>
<rect x="536" y="234" width="146" height="24" fill="var(--grey)" transform="rotate(-2 536 234)"/>
<line x1="706" y1="200" x2="746" y2="200" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="762" y="140" width="130" height="30" fill="var(--warn)" transform="rotate(-5 762 140)"/>
<rect x="774" y="186" width="86" height="38" fill="var(--warn)" transform="rotate(4 774 186)"/>
<rect x="758" y="234" width="146" height="24" fill="var(--warn)" transform="rotate(-3 758 234)"/>
<text x="762" y="302" font-size="19" fill="var(--warn)">Agent output</text>
<text x="60" y="400" font-size="22" fill="var(--ink)">The environment is clean, not the model</text>
</svg>
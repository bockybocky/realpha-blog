<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="最高的柱子上半截被虛線切掉，剩下的實心部分比右邊那根矮">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">把倒閉機率折進薪水</text>
<text class="b" x="60" y="88">Morley 舉的假設例子，數字非實況</text>
<rect x="80" y="110" width="800" height="370" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="120" y1="430" x2="840" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="190" width="120" height="120" fill="var(--page)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="180" y="310" width="120" height="120" fill="var(--warn)"/>
<text class="g" x="240" y="176" text-anchor="middle">名義 $200萬</text>
<text class="b" x="240" y="242" text-anchor="middle">一半機率</text>
<text class="b" x="240" y="266" text-anchor="middle">拿不到</text>
<rect x="420" y="310" width="120" height="120" fill="var(--warn)"/>
<text class="g" x="480" y="296" text-anchor="middle">折算後 $100萬</text>
<rect x="660" y="250" width="120" height="180" fill="var(--accent)"/>
<text class="g" x="720" y="236" text-anchor="middle">隔壁 $150萬</text>
<text class="b" x="240" y="458" text-anchor="middle">留下 · 紙面</text>
<text class="b" x="480" y="458" text-anchor="middle">留下 · 實值</text>
<text class="b" x="720" y="458" text-anchor="middle">走</text>
<text class="c" x="60" y="520">紙面上像減薪，實際是加薪</text>
</svg>
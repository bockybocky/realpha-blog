<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一張兩軸圖，橫軸是續航距離、縱軸是可用功率，浮力引擎滑翔機落在右下角跑很遠但電很少，電力推進載具落在左上角電夠但跑不遠，兩點呈對角">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">能量長，不等於功率夠</text>

  <rect x="150" y="120" width="720" height="320" fill="var(--card)"/>
  <line x1="150" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="3"/>
  <line x1="150" y1="120" x2="150" y2="440" stroke="var(--line)" stroke-width="3"/>

  <text x="150" y="480" font-size="19" fill="var(--dim)">續航</text>
  <text x="838" y="480" font-size="19" fill="var(--dim)">很遠</text>
  <text x="60" y="436" font-size="19" fill="var(--dim)">低</text>
  <text x="60" y="138" font-size="19" fill="var(--dim)">高</text>
  <text x="60" y="108" font-size="19" fill="var(--dim)">可用功率</text>

  <line x1="300" y1="200" x2="300" y2="440" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="150" y1="200" x2="300" y2="200" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="300" cy="200" r="16" fill="var(--accent)"/>
  <text x="330" y="196" font-size="20" fill="var(--ink)">電力推進載具</text>
  <text x="330" y="224" font-size="16" fill="var(--dim)">感測器餵得飽，走不遠</text>

  <line x1="790" y1="380" x2="790" y2="440" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="150" y1="380" x2="790" y2="380" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="790" cy="380" r="16" fill="var(--warn)"/>
  <text x="470" y="356" font-size="20" text-anchor="middle" fill="var(--ink)">浮力引擎滑翔機</text>
  <text x="470" y="330" font-size="16" text-anchor="middle" fill="var(--dim)">滑很遠，船上沒什麼電</text>

  <text x="60" y="528" font-size="22" font-weight="700" fill="var(--ink)">一條軸好看，不保證另一條軸也好看</text>
</svg>
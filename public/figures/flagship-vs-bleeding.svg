<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="左格曲線下降到事先畫好的虛線上限就走平，右格沒有線、曲線一路穿出格子底部">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="56" font-size="27">旗艦與失血，差在那條線</text>
  <text x="60" y="98" font-size="19" fill="var(--dim)">旗艦｜事先畫線</text>
  <rect x="60" y="112" width="390" height="298" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <line x1="80" y1="310" x2="430" y2="310" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="86" y="300" font-size="16" fill="var(--accent)">上限</text>
  <polyline points="100,155 170,212 240,264 300,300 345,310 430,310" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text x="255" y="442" font-size="15" text-anchor="middle" fill="var(--dim)">事先說好賠到哪裡</text>
  <text x="510" y="98" font-size="19" fill="var(--dim)">失血｜事後追認</text>
  <rect x="510" y="112" width="390" height="298" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <polyline points="550,155 640,228 720,292 800,356 890,414" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text x="876" y="300" font-size="16" text-anchor="end" fill="var(--warn)">沒有線</text>
  <text x="705" y="442" font-size="15" text-anchor="middle" fill="var(--dim)">每次都想再撐一下</text>
  <text x="480" y="502" font-size="22" text-anchor="middle">差別不在賠不賠，在有沒有先畫線</text>
</svg>
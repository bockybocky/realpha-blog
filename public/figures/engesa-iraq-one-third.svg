<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條橫條上下對照，佔三分之一的伊拉克那一段在停火後變成空白，其餘客戶的長度沒有補上">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">三分之一的生意，由一場戰爭支撐</text>

<text x="60" y="150" font-size="19" fill="var(--dim)">1980–1987</text>
<rect x="60" y="170" width="280" height="64" fill="var(--accent)"/>
<rect x="340" y="170" width="560" height="64" fill="var(--card)" stroke="var(--line)"/>
<text x="80" y="210" font-size="19" fill="var(--page)">伊拉克</text>
<text x="362" y="210" font-size="19" fill="var(--dim)">其他所有客戶</text>

<text x="60" y="300" font-size="19" fill="var(--warn)">1988 停火</text>
<rect x="60" y="320" width="280" height="64" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="340" y="320" width="560" height="64" fill="var(--card)" stroke="var(--line)"/>
<text x="112" y="360" font-size="19" fill="var(--warn)">空缺</text>
<text x="362" y="360" font-size="19" fill="var(--dim)">其他所有客戶（沒有變大）</text>

<text x="60" y="462" font-size="22" fill="var(--ink)">沒有一種商務能力，補得回一塊憑戰爭存在的需求。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars of equal length: the top is mostly the main session, the lower flips with scheduled jobs and bots filling nearly all of it">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .n { font-size:16px; fill:var(--page); }
    .m { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="40" y="56">Who actually burns Claude's quota</text>

<text class="g" x="40" y="212">What I assumed</text>
<rect x="200" y="180" width="460" height="70" rx="6" fill="var(--grey)"/>
<rect x="660" y="180" width="180" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="n" x="430" y="222" text-anchor="middle">Typing in the main session</text>
<text class="m" x="750" y="222" text-anchor="middle">Scheduled jobs</text>

<text class="g" x="40" y="372">Actual</text>
<text class="s" x="40" y="396">2026-09-05</text>
<rect x="200" y="340" width="40" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="240" y="340" width="600" height="70" rx="6" fill="var(--accent)"/>
<text class="n" x="540" y="382" text-anchor="middle">Jobs and bots　Opus 1,372 calls, 540M tokens</text>
<text class="s" x="220" y="432" text-anchor="middle">Main session</text>

<text class="c" x="40" y="490">When the window turns yellow, look at the half you aren't typing</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The middle of a bell curve is boxed to mark the range of expert vision, while the thin tails on both sides are labeled as recurring exceptions.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="70">Experts, mid</text>

  <rect x="330" y="140" width="300" height="260" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M100,400 C 290,400 320,160 480,160 C 640,160 670,400 860,400" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <line x1="100" y1="400" x2="860" y2="400" stroke="var(--line)" stroke-width="2"/>

  <path d="M100,400 C 200,400 250,384 330,352" fill="none" stroke="var(--warn)" stroke-width="5"/>
  <path d="M860,400 C 760,400 710,384 630,352" fill="none" stroke="var(--warn)" stroke-width="5"/>

  <text class="g" x="480" y="282" text-anchor="middle" fill="var(--accent)">Two sigma</text>
  <text class="d" x="480" y="312" text-anchor="middle">All seen shapes</text>

  <text class="d" x="100" y="442" fill="var(--warn)">Tail</text>
  <text class="d" x="860" y="442" text-anchor="end" fill="var(--warn)">Tail</text>
  <text class="d" x="100" y="470">Model says no</text>
  <text class="d" x="860" y="470" text-anchor="end">Every 5 yrs</text>

  <text class="c" x="60" y="518">Value in tails, not mid</text>
</svg>
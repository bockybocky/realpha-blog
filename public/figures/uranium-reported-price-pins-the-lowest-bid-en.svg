<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The price points spread from low to high, the reported-price line clings to the lowest point, and the point where business is actually done sits at the top.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">The quote is pinned to the lowest one</text>
<text x="60" y="88" font-size="16" fill="var(--dim)">Unit: USD / lb</text>

<line x1="150" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="398" x2="880" y2="398" stroke="var(--accent)" stroke-width="3" stroke-dasharray="10 6"/>
<text x="880" y="389" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="end">Reported price</text>

<circle cx="250" cy="398" r="11" fill="var(--accent)"/>
<circle cx="420" cy="356" r="9" fill="var(--grey)"/>
<circle cx="590" cy="300" r="9" fill="var(--grey)"/>
<circle cx="760" cy="230" r="13" fill="var(--warn)"/>

<text x="250" y="375" font-size="16" fill="var(--accent)" text-anchor="middle">98</text>
<text x="420" y="333" font-size="16" fill="var(--dim)" text-anchor="middle">101</text>
<text x="590" y="277" font-size="16" fill="var(--dim)" text-anchor="middle">105</text>
<text x="760" y="207" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">Triple digits</text>

<text x="250" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">Lowest bid</text>
<text x="420" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">Bid</text>
<text x="590" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">Bid</text>
<text x="760" y="458" font-size="18" font-weight="700" fill="var(--ink)" text-anchor="middle">Where deals happen</text>

<text x="60" y="498" font-size="22" font-weight="700" fill="var(--ink)">Done deals never enter the table, so the table reads low</text>
</svg>
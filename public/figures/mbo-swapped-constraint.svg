<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="公司外圍的一圈股東換成一個銀行的方框，約束沒消失只是換了形狀">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="58" font-size="27" fill="var(--ink)">換掉的不是約束，是約束的形狀</text>

  <rect x="56" y="100" width="376" height="340" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text x="244" y="134" font-size="20" fill="var(--dim)" text-anchor="middle">下市前</text>
  <circle cx="244" cy="268" r="54" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <text x="244" y="276" font-size="19" fill="var(--ink)" text-anchor="middle">公司</text>
  <circle cx="244" cy="166" r="18" fill="var(--grey)"/>
  <circle cx="346" cy="268" r="18" fill="var(--grey)"/>
  <circle cx="244" cy="370" r="18" fill="var(--grey)"/>
  <circle cx="142" cy="268" r="18" fill="var(--grey)"/>
  <circle cx="316" cy="196" r="18" fill="var(--grey)"/>
  <circle cx="172" cy="340" r="18" fill="var(--grey)"/>
  <text x="244" y="414" font-size="16" fill="var(--dim)" text-anchor="middle">股東會、律師、流程　慢</text>

  <rect x="528" y="100" width="376" height="340" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text x="716" y="134" font-size="20" fill="var(--dim)" text-anchor="middle">下市後</text>
  <rect x="600" y="180" width="232" height="176" rx="10" fill="none" stroke="var(--warn)" stroke-width="5"/>
  <circle cx="716" cy="268" r="54" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <text x="716" y="276" font-size="19" fill="var(--ink)" text-anchor="middle">公司</text>
  <text x="716" y="168" font-size="19" fill="var(--warn)" text-anchor="middle">主力銀行</text>
  <text x="716" y="384" font-size="16" fill="var(--warn)" text-anchor="middle">兩年內這不准那不准</text>
  <text x="716" y="414" font-size="16" fill="var(--accent)" text-anchor="middle">股東只剩一人　快</text>

  <path d="M 452 268 L 512 268" stroke="var(--ink)" stroke-width="2"/>
  <path d="M 500 258 L 514 268 L 500 278 Z" fill="var(--ink)"/>
  <text x="482" y="246" font-size="16" fill="var(--dim)" text-anchor="middle">MBO</text>

  <text x="480" y="508" font-size="22" fill="var(--ink)" text-anchor="middle">自由的代價，是兩年之內照銀行說的做</text>
</svg>
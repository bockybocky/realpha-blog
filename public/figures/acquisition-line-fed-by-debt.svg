<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="長條裡 29% 被利息吃掉，旁邊有機成長只是一條 3% 的細線">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" fill="var(--ink)">成長靠流水線，流水線靠債</text>

<text x="60" y="150" font-size="20" fill="var(--dim)">調整後營業利益</text>
<rect x="60" y="170" width="800" height="70" fill="var(--grey)"/>
<rect x="628" y="170" width="232" height="70" fill="var(--warn)"/>
<text x="648" y="214" font-size="19" fill="var(--page)">利息 29%</text>
<text x="628" y="272" font-size="16" fill="var(--warn)">利息費用年增三倍</text>

<text x="60" y="350" font-size="20" fill="var(--dim)">有機成長</text>
<rect x="60" y="370" width="24" height="40" fill="var(--accent)"/>
<text x="100" y="398" font-size="19" fill="var(--accent)">3%</text>
<text x="60" y="446" font-size="16" fill="var(--dim)">其餘成長來自一筆接一筆的收購</text>
<text x="60" y="500" font-size="22" fill="var(--ink)">它會停在：沒有新案子，或利息吃光報酬</text>
</svg>
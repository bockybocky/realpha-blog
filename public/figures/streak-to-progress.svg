<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一排等高的打卡圓點，右邊換成一階一階往上的階梯，上方一個買方要求的方塊用箭頭指向兩者之間">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; }
    .ag { font-size:20px; font-weight:700; fill:var(--accent); }
</style>
<text class="t" x="60" y="62">買方的要求回頭改寫了消費者版</text>
<rect x="300" y="100" width="360" height="72" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="480" y="132" text-anchor="middle">企業、學校與高等教育的買方</text>
<text class="b" x="480" y="156" text-anchor="middle">要拿得出可衡量的成果</text>
<line x1="480" y1="172" x2="480" y2="214" stroke="var(--accent)" stroke-width="3"/>
<path d="M472 214 L488 214 L480 232 Z" fill="var(--accent)"/>
<line x1="90" y1="430" x2="400" y2="430" stroke="var(--line)" stroke-width="2"/>
<circle cx="110" cy="400" r="10" fill="var(--grey)"/>
<circle cx="146" cy="400" r="10" fill="var(--grey)"/>
<circle cx="182" cy="400" r="10" fill="var(--grey)"/>
<circle cx="218" cy="400" r="10" fill="var(--grey)"/>
<circle cx="254" cy="400" r="10" fill="var(--grey)"/>
<circle cx="290" cy="400" r="10" fill="var(--grey)"/>
<circle cx="326" cy="400" r="10" fill="var(--grey)"/>
<circle cx="362" cy="400" r="10" fill="var(--grey)"/>
<text class="g" x="110" y="298">之前</text>
<text class="b" x="110" y="330">連續打卡與遊戲化</text>
<text class="b" x="110" y="356">多巴胺迴圈</text>
<text class="b" x="110" y="464">每天一樣高</text>
<line x1="430" y1="250" x2="430" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 7"/>
<line x1="470" y1="430" x2="890" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="490" y="394" width="70" height="36" fill="var(--accent)"/>
<rect x="570" y="352" width="70" height="78" fill="var(--accent)"/>
<rect x="650" y="310" width="70" height="120" fill="var(--accent)"/>
<rect x="730" y="268" width="70" height="162" fill="var(--accent)"/>
<rect x="810" y="226" width="70" height="204" fill="var(--accent)"/>
<text class="ag" x="490" y="298">之後</text>
<text class="b" x="490" y="330">看見自己現在能做什麼</text>
<text class="b" x="490" y="356">以前不能做什麼</text>
<text class="b" x="890" y="464" text-anchor="end">學習進步本身</text>
<text class="c" x="60" y="524">比較挑的買方，把產品推去比較健康的方向</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The timeline rises for two decades and then turns downward at the committee decision.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">20 years up, 2 down</text>
  <rect x="612" y="110" width="78" height="300" fill="var(--warn)" opacity="0.14"/>
  <text class="g" x="651" y="136" fill="var(--warn)" text-anchor="middle">cmte</text>
  <line x1="60" y1="410" x2="900" y2="410" stroke="var(--line)" stroke-width="2"/>
  <polyline points="100,352 240,300 330,262 420,214 560,186" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <polyline points="560,186 651,246 740,312" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <polyline points="740,312 860,372" fill="none" stroke="var(--grey)" stroke-width="4" stroke-dasharray="7 7"/>
  <circle cx="100" cy="352" r="7" fill="var(--accent)"/>
  <circle cx="240" cy="300" r="7" fill="var(--accent)"/>
  <circle cx="330" cy="262" r="7" fill="var(--accent)"/>
  <circle cx="420" cy="214" r="7" fill="var(--accent)"/>
  <circle cx="560" cy="186" r="9" fill="var(--accent)"/>
  <circle cx="651" cy="246" r="9" fill="var(--warn)"/>
  <circle cx="740" cy="312" r="7" fill="var(--warn)"/>
  <circle cx="860" cy="372" r="7" fill="var(--grey)"/>
  <text class="g" x="100" y="332" text-anchor="middle">no reply</text>
  <text class="b" x="100" y="436" text-anchor="middle">1946</text>
  <text class="g" x="240" y="280" text-anchor="middle">STRELA output</text>
  <text class="b" x="240" y="436" text-anchor="middle">1954</text>
  <text class="g" x="330" y="242" text-anchor="middle">Ural-1</text>
  <text class="b" x="330" y="436" text-anchor="middle">1956</text>
  <text class="g" x="420" y="194" text-anchor="middle">Ural-2</text>
  <text class="b" x="420" y="436" text-anchor="middle">1959</text>
  <text class="g" x="560" y="166" text-anchor="middle">Ural-11, 14</text>
  <text class="b" x="560" y="436" text-anchor="middle">1965</text>
  <text class="g" x="651" y="272" text-anchor="middle" fill="var(--warn)">8bit</text>
  <text class="b" x="651" y="436" text-anchor="middle">1966 to 67</text>
  <text class="g" x="748" y="296">he left</text>
  <text class="b" x="740" y="436" text-anchor="middle">1968</text>
  <text class="g" x="878" y="356" text-anchor="end">stop</text>
  <text class="b" x="860" y="436" text-anchor="middle">1972</text>
  <text class="c" x="60" y="500">Hardware up, place set in 66</text>
</svg>
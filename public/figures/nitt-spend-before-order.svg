<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="支出區塊在時間軸左端，營收區塊在十五個月後，中間空白">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .w { font-size:20px; font-weight:700; fill:var(--warn); }
    .a { font-size:20px; font-weight:700; fill:var(--accent); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="68">錢先走，訂單後到</text>
  <rect x="110" y="190" width="120" height="70" rx="6" fill="var(--warn)"/>
  <text class="w" x="170" y="172" text-anchor="middle">六千萬</text>
  <text class="b" x="170" y="300" text-anchor="middle">零訂單</text>
  <rect x="240" y="200" width="240" height="50" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="360" y="232" text-anchor="middle">蓋廠與換設備</text>
  <text class="b" x="360" y="300" text-anchor="middle">七到八個月</text>
  <rect x="490" y="200" width="210" height="50" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="595" y="232" text-anchor="middle">開出第一支規格</text>
  <text class="b" x="595" y="300" text-anchor="middle">約七個月</text>
  <rect x="710" y="190" width="160" height="70" rx="6" fill="var(--accent)"/>
  <text class="a" x="790" y="172" text-anchor="middle">量產與營收</text>
  <line x1="90" y1="360" x2="890" y2="360" stroke="var(--line)" stroke-width="3"/>
  <polygon points="890,350 912,360 890,370" fill="var(--line)"/>
  <line x1="110" y1="330" x2="110" y2="390" stroke="var(--grey)" stroke-width="2"/>
  <line x1="710" y1="330" x2="710" y2="390" stroke="var(--grey)" stroke-width="2"/>
  <line x1="110" y1="420" x2="710" y2="420" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
  <text class="c" x="410" y="458" text-anchor="middle">十五個月都在花錢</text>
  <text class="b" x="410" y="488" text-anchor="middle">技術長在這段後面</text>
</svg>
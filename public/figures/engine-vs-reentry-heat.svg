<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="右柱高、左柱極矮，引擎內部熱負荷約為再入大氣二十倍，弧線箭頭把冷卻做法從高處搬到低處">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">熱環境的高度差</text>
<line x1="150" y1="470" x2="830" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="250" y="452" width="150" height="18" rx="3" fill="var(--grey)"/>
<text x="325" y="435" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">×1</text>
<text x="325" y="500" font-size="19" fill="var(--ink)" text-anchor="middle">再入大氣</text>
<text x="325" y="524" font-size="15" fill="var(--dim)" text-anchor="middle">外殼</text>
<rect x="610" y="130" width="150" height="340" rx="3" fill="var(--accent)"/>
<text x="685" y="112" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">×20</text>
<text x="685" y="500" font-size="19" fill="var(--ink)" text-anchor="middle">引擎燃燒室</text>
<text x="685" y="524" font-size="15" fill="var(--dim)" text-anchor="middle">已用液冷數十年</text>
<path d="M 600 150 C 470 90 400 110 335 165" fill="none" stroke="var(--dim)" stroke-width="2.5" stroke-dasharray="7 6"/>
<path d="M 335 165 L 352 150 L 355 172 Z" fill="var(--dim)"/>
<text x="468" y="90" font-size="16" fill="var(--dim)" text-anchor="middle">同一招搬過來</text>
<text x="60" y="545" font-size="22" font-weight="700" fill="var(--ink)">更兇的地方壓得住，再入就不是新題目</text>
</svg>
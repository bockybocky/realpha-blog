<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Buying keeps rising on the left while it flattens and stops halfway on the right.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">Same rally, different after</text>
<rect x="60" y="92" width="400" height="370" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="92" width="400" height="370" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="92" y="134" font-size="20" fill="var(--accent)">Real bids</text>
<text x="532" y="134" font-size="20" fill="var(--warn)">Covers</text>
<line x1="96" y1="420" x2="430" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="536" y1="420" x2="870" y2="420" stroke="var(--line)" stroke-width="2"/>
<polyline points="106,400 170,358 240,312 310,254 420,192" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text x="330" y="176" font-size="19" fill="var(--accent)">On</text>
<polyline points="546,400 610,318 672,244 706,224 744,220" fill="none" stroke="var(--warn)" stroke-width="5"/>
<line x1="744" y1="220" x2="866" y2="220" stroke="var(--grey)" stroke-width="5" stroke-dasharray="9 8"/>
<text x="744" y="200" font-size="19" fill="var(--warn)">Ends</text>
<text x="60" y="520" font-size="22" fill="var(--ink)">Bids with a next day</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="二乘二矩陣，兩軸各為放慢與不放慢，右下角雙方都不放慢那一格被框起來標為均衡">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--dim); }
.n { font-size:16px; fill:var(--dim); }
.k { font-size:20px; font-weight:600; fill:var(--ink); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="58" class="t">都說要放慢，沒人敢先停</text>
<text x="440" y="176" class="g" text-anchor="middle">對手放慢</text>
<text x="720" y="176" class="g" text-anchor="middle">對手不放慢</text>
<text x="282" y="278" class="g" text-anchor="end">自己放慢</text>
<text x="282" y="428" class="g" text-anchor="end">自己不放慢</text>
<rect x="300" y="200" width="280" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="580" y="200" width="280" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="300" y="350" width="280" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="580" y="350" width="280" height="150" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="440" y="268" class="k" text-anchor="middle">一起省錢</text>
<text x="440" y="300" class="n" text-anchor="middle">沒人相信</text>
<text x="720" y="268" class="k" text-anchor="middle" fill="var(--warn)">位置換人</text>
<text x="720" y="300" class="n" text-anchor="middle">最怕的一格</text>
<text x="440" y="418" class="k" text-anchor="middle">領先擴大</text>
<text x="440" y="450" class="n" text-anchor="middle">對手自廢</text>
<text x="720" y="418" class="k" text-anchor="middle">一起燒錢</text>
<text x="720" y="450" class="n" text-anchor="middle">誰都不敢停</text>
<text x="846" y="378" class="n" text-anchor="end" fill="var(--accent)">均衡</text>
<text x="60" y="545" class="c">不管對手怎麼選，不放慢都比較好</text>
</svg>
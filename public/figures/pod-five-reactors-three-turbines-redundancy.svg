<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="五個圓接到一條橫管再接三個方塊，各有一個灰掉但輸出不變">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66">一「艙」的出貨單位</text>
<g>
<circle cx="150" cy="150" r="42" fill="var(--accent)"/>
<circle cx="288" cy="150" r="42" fill="var(--accent)"/>
<circle cx="426" cy="150" r="42" fill="var(--accent)"/>
<circle cx="564" cy="150" r="42" fill="var(--accent)"/>
<circle cx="702" cy="150" r="42" fill="var(--grey)"/>
</g>
<text class="n" x="702" y="100" text-anchor="middle">換料中</text>
<text class="g" x="60" y="236">反應爐 ×5</text>
<path d="M150 192 L150 268 M288 192 L288 268 M426 192 L426 268 M564 192 L564 268 M702 192 L702 268" stroke="var(--line)" stroke-width="3"/>
<rect x="110" y="268" width="640" height="26" rx="13" fill="var(--ink)" opacity="0.75"/>
<text class="g" x="770" y="288">蒸汽總管</text>
<path d="M240 294 L240 350 M430 294 L430 350 M620 294 L620 350" stroke="var(--line)" stroke-width="3"/>
<rect x="180" y="350" width="120" height="78" rx="6" fill="var(--accent)"/>
<rect x="370" y="350" width="120" height="78" rx="6" fill="var(--accent)"/>
<rect x="560" y="350" width="120" height="78" rx="6" fill="var(--grey)"/>
<text class="g" x="60" y="398">汽輪機 ×3</text>
<text class="n" x="620" y="446" text-anchor="middle">停機</text>
<text class="c" x="740" y="398">仍是 50 兆瓦</text>
</svg>
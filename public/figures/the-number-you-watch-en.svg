<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three commonly watched numbers on the left connect to three things you actually care about on the right, with the lines slanting out of alignment.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">The number you watch, the thing you care about</text>

  <text class="t" x="200" y="120" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">What you watch</text>
  <text class="t" x="740" y="120" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">What you really care about</text>

  <rect x="80" y="150" width="240" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="200" y="190" font-size="19" text-anchor="middle" fill="var(--ink)">Crude price</text>
  <rect x="620" y="186" width="240" height="64" rx="8" fill="var(--card)" stroke="var(--accent)"/>
  <text class="t" x="740" y="226" font-size="19" text-anchor="middle" fill="var(--ink)">Products and diesel</text>
  <path d="M320 182 L620 218" stroke="var(--warn)" stroke-width="3" fill="none"/>

  <rect x="80" y="260" width="240" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="200" y="300" font-size="19" text-anchor="middle" fill="var(--ink)">Body weight</text>
  <rect x="620" y="300" width="240" height="64" rx="8" fill="var(--card)" stroke="var(--accent)"/>
  <text class="t" x="740" y="340" font-size="19" text-anchor="middle" fill="var(--ink)">Energy · clothes fitting</text>
  <path d="M320 292 L620 332" stroke="var(--warn)" stroke-width="3" fill="none"/>

  <rect x="80" y="370" width="240" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="200" y="410" font-size="19" text-anchor="middle" fill="var(--ink)">Your kid's grades</text>
  <rect x="620" y="412" width="240" height="64" rx="8" fill="var(--card)" stroke="var(--accent)"/>
  <text class="t" x="740" y="452" font-size="19" text-anchor="middle" fill="var(--ink)">Sleeps well · talks to you</text>
  <path d="M320 402 L620 444" stroke="var(--warn)" stroke-width="3" fill="none"/>

  <text class="t" x="480" y="518" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">If they don't line up, go find a second number</text>
</svg>
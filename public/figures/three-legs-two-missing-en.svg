<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Of three supports only one is solid, the other two are dashed gaps, and the platform tilts.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="48" y="62" font-size="27" fill="var(--ink)" font-weight="700">Building takes three legs</text>

<path d="M90 150 L880 232 L880 268 L90 186 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="330" y="124" font-size="19" fill="var(--ink)" font-weight="700">Things get built</text>

<rect x="140" y="186" width="56" height="200" fill="var(--accent)"/>
<text x="92" y="420" font-size="16" fill="var(--ink)">An appointed man holds the power</text>
<text x="118" y="446" font-size="16" fill="var(--accent)">Yes</text>

<rect x="440" y="222" width="56" height="200" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="12 9"/>
<text x="382" y="456" font-size="16" fill="var(--ink)">Inputs cheap enough to waste</text>
<text x="452" y="482" font-size="16" fill="var(--warn)">No</text>

<rect x="760" y="258" width="56" height="200" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="12 9"/>
<text x="700" y="492" font-size="16" fill="var(--ink)">Power tied hard to undo</text>
<text x="772" y="518" font-size="16" fill="var(--warn)">No</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The direct route is blocked, and a dotted detour below reaches the same endpoint.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="70" font-size="27" fill="var(--ink)">What is blocked is shipment, not use</text>
<rect x="60" y="140" width="190" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="188" font-size="19" fill="var(--ink)">The most advanced GPUs</text>
<rect x="720" y="140" width="200" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="740" y="178" font-size="19" fill="var(--ink)">China's AI firms</text>
<text x="740" y="204" font-size="16" fill="var(--dim)">Get the compute</text>
<line x1="250" y1="180" x2="660" y2="180" stroke="var(--grey)" stroke-width="5"/>
<polygon points="660,170 690,180 660,190" fill="var(--grey)"/>
<line x1="430" y1="150" x2="490" y2="210" stroke="var(--warn)" stroke-width="6"/>
<line x1="490" y1="150" x2="430" y2="210" stroke="var(--warn)" stroke-width="6"/>
<text x="400" y="134" font-size="16" fill="var(--warn)">Selling directly into China: not allowed</text>
<rect x="250" y="330" width="190" height="80" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="268" y="378" font-size="19" fill="var(--ink)">Singapore company</text>
<rect x="490" y="330" width="190" height="80" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="508" y="378" font-size="19" fill="var(--ink)">Malaysian data center</text>
<line x1="155" y1="220" x2="155" y2="370" stroke="var(--accent)" stroke-width="3" stroke-dasharray="9 7"/>
<line x1="155" y1="370" x2="230" y2="370" stroke="var(--accent)" stroke-width="3" stroke-dasharray="9 7"/>
<polygon points="230,362 250,370 230,378" fill="var(--accent)"/>
<line x1="440" y1="370" x2="470" y2="370" stroke="var(--accent)" stroke-width="3" stroke-dasharray="9 7"/>
<polygon points="470,362 490,370 470,378" fill="var(--accent)"/>
<line x1="680" y1="370" x2="820" y2="370" stroke="var(--accent)" stroke-width="3" stroke-dasharray="9 7"/>
<line x1="820" y1="370" x2="820" y2="230" stroke="var(--accent)" stroke-width="3" stroke-dasharray="9 7"/>
<polygon points="812,230 820,210 828,230" fill="var(--accent)"/>
<text x="690" y="412" font-size="16" fill="var(--accent)">Remote access, legal today</text>
<text x="60" y="480" font-size="22" fill="var(--ink)">He says this makes no sense unless only older chips are allowed</text>
</svg>
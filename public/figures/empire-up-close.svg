<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一個完整方塊，右邊同尺寸方塊中只有角落極小一塊亮色，其餘為灰色底層">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">走近看同一個帝國</text>

<text class="t" x="60" y="124" font-size="19" font-weight="700" fill="var(--dim)">遠處</text>
<rect x="60" y="150" width="330" height="300" rx="10" fill="var(--grey)" opacity="0.55"/>
<rect x="60" y="150" width="330" height="300" rx="10" fill="none" stroke="var(--line)"/>
<text class="t" x="172" y="312" font-size="20" font-weight="700" fill="var(--ink)">一整塊</text>

<text class="t" x="438" y="312" font-size="27" fill="var(--dim)">→</text>

<text class="t" x="540" y="124" font-size="19" font-weight="700" fill="var(--accent)">走近</text>
<rect x="540" y="150" width="360" height="300" rx="10" fill="var(--grey)" opacity="0.35"/>
<rect x="540" y="150" width="360" height="300" rx="10" fill="none" stroke="var(--line)"/>
<rect x="540" y="150" width="36" height="30" rx="4" fill="var(--accent)"/>
<text class="t" x="592" y="174" font-size="16" fill="var(--accent)">統治族群</text>
<text class="t" x="670" y="330" font-size="20" font-weight="700" fill="var(--ink)">被壓著的</text>
<text class="t" x="670" y="360" font-size="16" fill="var(--dim)">語言不同、仇在那裡</text>

<text class="t" x="60" y="506" font-size="22" fill="var(--ink)">地圖上的帝國和地上的帝國，是兩件事</text>
</svg>
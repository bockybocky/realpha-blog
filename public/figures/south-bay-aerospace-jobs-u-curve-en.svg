<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The curve drops from an old high to a trough, recovers three or four years after SpaceX was founded in 2002, and finally rises above the horizontal dashed line of the old high; this is an illustrative chart.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:700}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700;fill:var(--accent)}
.w{fill:var(--page)}.a{fill:var(--accent)}.wa{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="40" y="56" class="t">Jobs dip, then new high</text>
<line x1="100" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="130" x2="100" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="100" y="116" class="d">Jobs</text>
<line x1="100" y1="185" x2="880" y2="185" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="290" y="175" class="d">Peak</text>
<line x1="360" y1="140" x2="360" y2="440" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="360" y="470" text-anchor="middle" class="b">2002 SpaceX founded</text>
<path d="M100,190 C220,205 330,400 460,410 C530,415 560,380 620,320 C700,240 790,170 880,145" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text x="480" y="378" text-anchor="middle" class="b">3–4y rebound</text>
<circle cx="880" cy="145" r="8" fill="var(--accent)"/>
<text x="866" y="126" text-anchor="end" class="g a">Beats</text>
<text x="880" y="520" text-anchor="end" class="d">Illustrative only</text>
</svg>
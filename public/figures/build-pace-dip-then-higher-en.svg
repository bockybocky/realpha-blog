<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three bars whose heights go high, dip in the middle, then reach their highest, with the last bar in an accent colour.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="58">Build pace: a dip first, then back up in the 2030s</text>
  <text class="d" x="60" y="88">Wind, solar and storage capacity added each year (capacity is not generation)</text>

  <rect x="120" y="248" width="170" height="172" fill="var(--grey)"/>
  <rect x="360" y="278" width="170" height="142" fill="var(--grey)"/>
  <rect x="600" y="210" width="170" height="210" fill="var(--accent)"/>
  <line x1="90" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="3"/>

  <text class="g" x="205" y="236" text-anchor="middle">About 90 GW</text>
  <text class="g" x="445" y="266" text-anchor="middle">About 75 GW</text>
  <text class="g" x="685" y="198" text-anchor="middle">100–110 GW</text>
  <text class="d" x="205" y="446" text-anchor="middle">This year and next</text>
  <text class="d" x="445" y="446" text-anchor="middle">The next few years</text>
  <text class="d" x="685" y="446" text-anchor="middle">The 2030s</text>
  <text class="d" x="685" y="468" text-anchor="middle">Past the tax credits</text>

  <text class="c" x="60" y="504">The dip years are not a reversal of trend</text>
</svg>
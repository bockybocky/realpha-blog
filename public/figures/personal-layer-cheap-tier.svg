<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊五條線收斂到一個大圓，右邊四條線分流到一個小圓、僅一條仍連到大圓">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="40" y="54" font-size="27" font-weight="700" fill="var(--ink)">你自己的分層長什麼樣子</text>

  <rect x="40" y="86" width="420" height="376" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="86" width="420" height="376" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <text x="70" y="126" font-size="20" font-weight="700" fill="var(--dim)">現在</text>
  <text x="530" y="126" font-size="20" font-weight="700" fill="var(--accent)">補上便宜的那層</text>

  <line x1="176" y1="182" x2="316" y2="284" stroke="var(--grey)" stroke-width="2"/>
  <line x1="176" y1="234" x2="316" y2="284" stroke="var(--grey)" stroke-width="2"/>
  <line x1="176" y1="286" x2="316" y2="284" stroke="var(--grey)" stroke-width="2"/>
  <line x1="176" y1="338" x2="316" y2="284" stroke="var(--grey)" stroke-width="2"/>
  <line x1="176" y1="390" x2="316" y2="284" stroke="var(--grey)" stroke-width="2"/>
  <rect x="72" y="164" width="104" height="34" rx="6" fill="var(--page)" stroke="var(--line)"/>
  <rect x="72" y="216" width="104" height="34" rx="6" fill="var(--page)" stroke="var(--line)"/>
  <rect x="72" y="268" width="104" height="34" rx="6" fill="var(--page)" stroke="var(--line)"/>
  <rect x="72" y="320" width="104" height="34" rx="6" fill="var(--page)" stroke="var(--line)"/>
  <rect x="72" y="372" width="104" height="34" rx="6" fill="var(--page)" stroke="var(--line)"/>
  <text x="84" y="187" font-size="15" fill="var(--dim)">小事</text>
  <text x="84" y="239" font-size="15" fill="var(--dim)">小事</text>
  <text x="84" y="291" font-size="15" fill="var(--dim)">小事</text>
  <text x="84" y="343" font-size="15" fill="var(--dim)">小事</text>
  <text x="84" y="395" font-size="15" fill="var(--dim)">小事</text>
  <circle cx="374" cy="284" r="56" fill="var(--accent)"/>
  <text x="374" y="278" font-size="16" font-weight="700" fill="var(--page)" text-anchor="middle">最貴的</text>
  <text x="374" y="300" font-size="16" font-weight="700" fill="var(--page)" text-anchor="middle">那一招</text>

  <line x1="636" y1="182" x2="790" y2="212" stroke="var(--accent)" stroke-width="2"/>
  <line x1="636" y1="234" x2="790" y2="212" stroke="var(--accent)" stroke-width="2"/>
  <line x1="636" y1="286" x2="790" y2="212" stroke="var(--accent)" stroke-width="2"/>
  <line x1="636" y1="338" x2="790" y2="212" stroke="var(--accent)" stroke-width="2"/>
  <line x1="636" y1="390" x2="782" y2="366" stroke="var(--grey)" stroke-width="2"/>
  <rect x="532" y="164" width="104" height="34" rx="6" fill="var(--page)" stroke="var(--line)"/>
  <rect x="532" y="216" width="104" height="34" rx="6" fill="var(--page)" stroke="var(--line)"/>
  <rect x="532" y="268" width="104" height="34" rx="6" fill="var(--page)" stroke="var(--line)"/>
  <rect x="532" y="320" width="104" height="34" rx="6" fill="var(--page)" stroke="var(--line)"/>
  <rect x="532" y="372" width="104" height="34" rx="6" fill="var(--page)" stroke="var(--line)"/>
  <text x="544" y="187" font-size="15" fill="var(--dim)">小事</text>
  <text x="544" y="239" font-size="15" fill="var(--dim)">小事</text>
  <text x="544" y="291" font-size="15" fill="var(--dim)">小事</text>
  <text x="544" y="343" font-size="15" fill="var(--dim)">小事</text>
  <text x="544" y="395" font-size="15" fill="var(--dim)">真的需要</text>
  <circle cx="822" cy="212" r="30" fill="var(--accent)"/>
  <text x="822" y="264" font-size="16" font-weight="700" fill="var(--accent)" text-anchor="middle">便宜十倍</text>
  <circle cx="822" cy="374" r="40" fill="var(--accent)" opacity="0.3" stroke="var(--accent)" stroke-width="2"/>
  <text x="822" y="380" font-size="15" fill="var(--ink)" text-anchor="middle">最貴的</text>

  <text x="40" y="512" font-size="22" font-weight="700" fill="var(--ink)">不是找最強的一招，是把最貴的留給剩下那兩成</text>
</svg>
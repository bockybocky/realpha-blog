<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Seven of the ten supplier boxes on the top row sit below the water line, while the plant on dry ground below is intact and the seven supply lines running to it are broken.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">The plant stayed dry and still stopped</text>
<text x="60" y="86" font-size="16" fill="var(--dim)">Top ten component suppliers</text>

<rect x="60" y="196" width="620" height="86" fill="var(--accent)" opacity="0.2"/>
<line x1="60" y1="196" x2="900" y2="196" stroke="var(--accent)" stroke-width="3"/>
<text x="900" y="186" font-size="16" text-anchor="end" fill="var(--accent)">Water line</text>

<rect x="72" y="214" width="72" height="58" fill="var(--warn)"/>
<rect x="156" y="214" width="72" height="58" fill="var(--warn)"/>
<rect x="240" y="214" width="72" height="58" fill="var(--warn)"/>
<rect x="324" y="214" width="72" height="58" fill="var(--warn)"/>
<rect x="408" y="214" width="72" height="58" fill="var(--warn)"/>
<rect x="492" y="214" width="72" height="58" fill="var(--warn)"/>
<rect x="576" y="214" width="72" height="58" fill="var(--warn)"/>
<text x="360" y="308" font-size="19" font-weight="700" text-anchor="middle" fill="var(--warn)">Seven under water, spindle motors included</text>

<rect x="690" y="128" width="66" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="772" y="128" width="66" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="854" y="128" width="46" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="795" y="118" font-size="16" text-anchor="middle" fill="var(--ink)">Three left</text>

<path d="M108 272 L108 380" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 8"/>
<path d="M276 272 L330 380" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 8"/>
<path d="M444 272 L440 380" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 8"/>
<path d="M612 272 L540 380" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 8"/>
<path d="M723 184 L600 380" stroke="var(--dim)" stroke-width="2"/>

<rect x="330" y="396" width="300" height="96" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="480" y="432" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Our own plant</text>
<text x="480" y="460" font-size="16" text-anchor="middle" fill="var(--dim)">Running fine, not a drop inside</text>

<text x="480" y="534" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">The risk sits with whoever you depend on, not with you</text>
</svg>
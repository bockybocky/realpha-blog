<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊三十個零散小方格與右邊一整塊完整區塊的面積相同對比">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:600}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t h" x="480" y="58" text-anchor="middle">同樣的配備，誰把它決定完</text>
<rect x="60" y="100" width="390" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="510" y="100" width="390" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<g fill="var(--page)" stroke="var(--grey)">
<rect x="100" y="122" width="40" height="40" rx="5"/><rect x="154" y="122" width="40" height="40" rx="5"/><rect x="208" y="122" width="40" height="40" rx="5"/><rect x="262" y="122" width="40" height="40" rx="5"/><rect x="316" y="122" width="40" height="40" rx="5"/><rect x="370" y="122" width="40" height="40" rx="5"/>
<rect x="100" y="176" width="40" height="40" rx="5"/><rect x="154" y="176" width="40" height="40" rx="5"/><rect x="208" y="176" width="40" height="40" rx="5"/><rect x="262" y="176" width="40" height="40" rx="5"/><rect x="316" y="176" width="40" height="40" rx="5"/><rect x="370" y="176" width="40" height="40" rx="5"/>
<rect x="100" y="230" width="40" height="40" rx="5"/><rect x="154" y="230" width="40" height="40" rx="5"/><rect x="208" y="230" width="40" height="40" rx="5"/><rect x="262" y="230" width="40" height="40" rx="5"/><rect x="316" y="230" width="40" height="40" rx="5"/><rect x="370" y="230" width="40" height="40" rx="5"/>
<rect x="100" y="284" width="40" height="40" rx="5"/><rect x="154" y="284" width="40" height="40" rx="5"/><rect x="208" y="284" width="40" height="40" rx="5"/><rect x="262" y="284" width="40" height="40" rx="5"/><rect x="316" y="284" width="40" height="40" rx="5"/><rect x="370" y="284" width="40" height="40" rx="5"/>
<rect x="100" y="338" width="40" height="40" rx="5"/><rect x="154" y="338" width="40" height="40" rx="5"/><rect x="208" y="338" width="40" height="40" rx="5"/><rect x="262" y="338" width="40" height="40" rx="5"/><rect x="316" y="338" width="40" height="40" rx="5"/><rect x="370" y="338" width="40" height="40" rx="5"/>
</g>
<rect x="550" y="122" width="310" height="256" rx="8" fill="var(--accent)" opacity="0.14"/>
<rect x="550" y="122" width="310" height="256" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="t g" x="255" y="434" text-anchor="middle">逐項選配</text>
<text class="t g" x="705" y="434" text-anchor="middle">打包標配</text>
<text class="t s" x="255" y="464" text-anchor="middle">客人自己拼</text>
<text class="t s" x="705" y="464" text-anchor="middle">品牌先拼好</text>
<text class="t c" x="480" y="510" text-anchor="middle">面積一樣，決定成本換了人</text>
</svg>
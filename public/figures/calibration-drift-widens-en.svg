<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two lines start together, the device reading drifts upward, and the gap against flat true blood pressure keeps widening.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">Calibrated once, then slowly drifting off</text>
<rect x="150" y="110" width="730" height="310" fill="var(--card)"/>
<polygon points="190,300 330,282 470,254 610,221 750,193 870,166 870,300" fill="var(--grey)" opacity="0.35"/>
<line x1="150" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="190" y1="300" x2="870" y2="300" stroke="var(--dim)" stroke-width="3"/>
<polyline points="190,300 330,282 470,254 610,221 750,193 870,166" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="190" cy="300" r="8" fill="var(--accent)"/>
<text class="g" x="700" y="150">Device reading</text>
<text class="g" x="700" y="330">True pressure</text>
<text class="b" x="166" y="340">Moment of calibration</text>
<text class="b" x="455" y="448">Hours</text>
<text class="b" x="800" y="448">Days</text>
<text class="b" x="470" y="290">Error</text>
<text class="c" x="60" y="500">What drifts is not the sensor but the lifespan of the baseline</text>
</svg>
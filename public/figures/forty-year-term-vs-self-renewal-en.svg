<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The upper line terminates when its forty years are up; the lower line attaches a new segment at every expiry, and the arrow runs off the right edge of the frame.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .ttl { font-size:27px; font-weight:700; }
    .grp { font-size:20px; font-weight:700; fill:var(--dim); }
    .lbl { font-size:16px; fill:var(--dim); }
    .cc { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t ttl" x="60" y="60">One law, two lives</text>

  <text class="t grp" x="60" y="124">Intended</text>
  <rect x="60" y="146" width="500" height="34" rx="4" fill="var(--card)" stroke="var(--grey)"/>
  <text class="t lbl" x="74" y="170">40yr bonds</text>
  <line x1="560" y1="130" x2="560" y2="196" stroke="var(--grey)" stroke-width="4"/>
  <text class="t lbl" x="576" y="170">Paid off → dissolved</text>

  <text class="t grp" x="60" y="262">The clause in §9</text>
  <rect x="60" y="284" width="230" height="34" rx="4" fill="var(--accent)" opacity="0.85"/>
  <rect x="300" y="284" width="230" height="34" rx="4" fill="var(--accent)" opacity="0.62"/>
  <rect x="540" y="284" width="230" height="34" rx="4" fill="var(--accent)" opacity="0.4"/>
  <rect x="780" y="284" width="120" height="34" rx="4" fill="var(--accent)" opacity="0.22"/>
  <path d="M60 352 L895 352" stroke="var(--accent)" stroke-width="4"/>
  <path d="M884 342 L906 352 L884 362 Z" fill="var(--accent)"/>
  <path d="M290 284 q10 -26 10 0" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <path d="M530 284 q10 -26 10 0" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <path d="M770 284 q10 -26 10 0" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <text class="t lbl" x="74" y="394">New bonds before maturity</text>

  <line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="t cc" x="60" y="486">Self-renewing: no real end</text>
</svg>
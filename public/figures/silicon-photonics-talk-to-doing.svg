<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="時間線：前兩年停在還在談的低區，今年跳升到已經在做的高區，並附上難關清單">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="40" y="58" class="t">矽光子：同一個題目，講法跳了一階</text>
<rect x="40" y="130" width="880" height="130" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="40" y="290" width="880" height="130" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="64" y="202" class="g">已經在做</text>
<text x="64" y="362" class="g">還在談</text>
<path d="M330 360 L560 360 C680 360 680 200 790 200" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="330" cy="360" r="12" fill="var(--grey)"/>
<circle cx="560" cy="360" r="12" fill="var(--grey)"/>
<circle cx="790" cy="200" r="14" fill="var(--accent)"/>
<text x="330" y="330" class="b" text-anchor="middle">潛力</text>
<text x="560" y="330" class="b" text-anchor="middle">潛力</text>
<rect x="612" y="146" width="64" height="30" rx="6" fill="var(--page)" stroke="var(--accent)"/>
<text x="644" y="167" class="b" text-anchor="middle">翹曲</text>
<rect x="700" y="146" width="64" height="30" rx="6" fill="var(--page)" stroke="var(--accent)"/>
<text x="732" y="167" class="b" text-anchor="middle">散熱</text>
<rect x="840" y="185" width="64" height="30" rx="6" fill="var(--page)" stroke="var(--accent)"/>
<text x="872" y="206" class="b" text-anchor="middle">解法</text>
<line x1="260" y1="445" x2="860" y2="445" stroke="var(--line)" stroke-width="2"/>
<text x="330" y="475" class="b" text-anchor="middle">兩年前</text>
<text x="560" y="475" class="b" text-anchor="middle">去年</text>
<text x="790" y="475" class="b" text-anchor="middle">今年</text>
<text x="40" y="518" class="c">講得出難關，手上才有樣品</text>
</svg>
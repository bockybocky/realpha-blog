<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The basket on the left has one item; the basket on the right has four — and the 'half' on the right is a half calculated from the bigger basket.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .bb { font-size:16px; font-weight:700; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="40" y="52">The 'half' basket got bigger</text>
<text class="g" x="240" y="120" text-anchor="middle">5/27 call</text>
<text class="g" x="720" y="120" text-anchor="middle">9/2 call</text>
<path d="M140 170 L165 330 L315 330 L340 170" fill="var(--card)" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
<rect x="190" y="270" width="100" height="40" rx="20" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)"/>
<text class="bb" x="240" y="296" text-anchor="middle">CoCo</text>
<path d="M520 150 L545 330 L895 330 L920 150" fill="var(--card)" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
<rect x="565" y="200" width="150" height="40" rx="20" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)"/>
<text class="bb" x="640" y="226" text-anchor="middle">CoCo</text>
<rect x="740" y="200" width="150" height="40" rx="20" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)"/>
<text class="bb" x="815" y="226" text-anchor="middle">CoWork</text>
<rect x="565" y="260" width="150" height="40" rx="20" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)"/>
<text class="bb" x="640" y="286" text-anchor="middle">AI Functions</text>
<rect x="740" y="260" width="150" height="40" rx="20" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)"/>
<text class="bb" x="815" y="286" text-anchor="middle">AI Gateway</text>
<text class="d" x="240" y="358" text-anchor="middle">Top driver of raise</text>
<text class="d" x="720" y="358" text-anchor="middle">Wide scope</text>
<rect x="140" y="390" width="200" height="44" rx="6" fill="none" stroke="var(--dim)" stroke-width="2" stroke-dasharray="8 6"/>
<text class="d" x="240" y="418" text-anchor="middle">No split given</text>
<rect x="520" y="390" width="200" height="44" fill="var(--accent)" fill-opacity="0.3"/>
<rect x="720" y="390" width="200" height="44" fill="var(--grey)"/>
<text class="bb" x="620" y="418" text-anchor="middle">AI ≈ half</text>
<text class="bb" x="820" y="418" text-anchor="middle">Core ≈ half</text>
<text class="c" x="480" y="510" text-anchor="middle">Check the basket first</text>
</svg>
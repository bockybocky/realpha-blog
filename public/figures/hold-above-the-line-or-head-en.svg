<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two rebound paths cross the dashed quarterly line and split; one holds above it and continues higher, while the other immediately falls back below it and forms a head.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="68">After the rebound</text>
  <line x1="90" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="3" stroke-dasharray="10 8"/>
  <text class="g" x="90" y="285">Quarterly line</text>
  <circle cx="150" cy="430" r="9" fill="var(--ink)"/>
  <text class="b" x="118" y="465">Low</text>
  <polyline points="150,430 330,330 450,250 620,245 780,160" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linejoin="round"/>
  <text class="g" x="640" y="200" fill="var(--accent)">Hold, then rise</text>
  <polyline points="150,430 330,335 430,265 520,330 700,440 860,470" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linejoin="round"/>
  <text class="g" x="560" y="470" fill="var(--warn)">Drop back = head</text>
  <text class="c" x="60" y="515">Raise cash first</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩欄並排，下方兩條長度懸殊的力氣長條，左長右短">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="70">兩欄分開寫，才看得出力氣放錯邊</text>
<rect x="80" y="120" width="380" height="210" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="510" y="120" width="380" height="210" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="270" y="160" text-anchor="middle">這一關過關</text>
<text class="g" x="700" y="160" text-anchor="middle" fill="var(--accent)">對方真的改變</text>
<text class="b" x="270" y="205" text-anchor="middle">醫生說沒問題</text>
<text class="b" x="270" y="243" text-anchor="middle">主管點頭</text>
<text class="b" x="270" y="281" text-anchor="middle">財報沒壞</text>
<text class="b" x="700" y="205" text-anchor="middle">同齡朋友的真實例子</text>
<text class="b" x="700" y="243" text-anchor="middle">隔壁部門省下的工時</text>
<text class="b" x="700" y="281" text-anchor="middle">連兩季照說的走</text>
<text class="g" x="60" y="400">力氣實際花在哪</text>
<rect x="80" y="420" width="380" height="34" rx="6" fill="var(--grey)"/>
<rect x="510" y="420" width="70" height="34" rx="6" fill="var(--accent)"/>
<text class="b" x="270" y="484" text-anchor="middle">多數</text>
<text class="b" x="545" y="484" text-anchor="middle">零頭</text>
<text class="c" x="60" y="532">先做右欄裡最便宜的那一項</text>
</svg>
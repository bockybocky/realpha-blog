<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The short-term yield arrow is longer than the long-term one, with cross-default marked on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">Short Debt Fell Harder</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">Yield Increase Over the Past Half-Month</text>

<line x1="120" y1="420" x2="820" y2="420" stroke="var(--line)" stroke-width="2"/>

<rect x="200" y="400" width="140" height="20" rx="4" fill="var(--grey)" opacity="0.4"/>
<text class="t" x="200" y="452" font-size="19" font-weight="700" fill="var(--ink)">Due 2030</text>
<line x1="270" y1="400" x2="270" y2="180" stroke="var(--warn)" stroke-width="10" stroke-linecap="round"/>
<path d="M248 196 L270 160 L292 196 Z" fill="var(--warn)"/>
<text class="t" x="310" y="178" font-size="19" font-weight="700" fill="var(--warn)">Larger Rise</text>

<rect x="560" y="400" width="140" height="20" rx="4" fill="var(--grey)" opacity="0.4"/>
<text class="t" x="560" y="452" font-size="19" font-weight="700" fill="var(--ink)">Due 2032</text>
<line x1="630" y1="400" x2="630" y2="300" stroke="var(--accent)" stroke-width="10" stroke-linecap="round"/>
<path d="M608 316 L630 280 L652 316 Z" fill="var(--accent)"/>
<text class="t" x="670" y="300" font-size="19" font-weight="700" fill="var(--accent)">Smaller</text>

<path d="M200 486 L200 500 L700 500 L700 486" fill="none" stroke="var(--ink)" stroke-width="2"/>
<text class="t" x="240" y="528" font-size="20" font-weight="700" fill="var(--ink)">Cross-Default: One Fails, All Come Due</text>
</svg>
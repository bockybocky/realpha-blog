<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條長條代表全部的熱，左端被切走一大塊、緊接一小塊，右邊一長段留白">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="60">同一份熱，尾巴還能再榨一截</text>
<text class="s" x="60" y="98">燒出來的熱・全部</text>

<rect x="60" y="176" width="840" height="96" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="60" y="176" width="252" height="96" rx="8" fill="var(--accent)"/>
<rect x="312" y="176" width="50" height="96" fill="var(--warn)"/>
<line x1="60" y1="150" x2="60" y2="176" stroke="var(--grey)" stroke-width="2"/>
<line x1="312" y1="150" x2="312" y2="176" stroke="var(--grey)" stroke-width="2"/>
<line x1="480" y1="150" x2="480" y2="176" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="900" y1="150" x2="900" y2="176" stroke="var(--grey)" stroke-width="2"/>
<text class="s" x="60" y="140">0</text>
<text class="s" x="288" y="140">三成</text>
<text class="s" x="452" y="140">五成</text>
<text class="s" x="864" y="140">全部</text>

<line x1="186" y1="272" x2="186" y2="316" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="132" y="342">蒸汽渦輪</text>
<line x1="337" y1="272" x2="380" y2="330" stroke="var(--warn)" stroke-width="2"/>
<text class="g" x="386" y="342" fill="var(--warn)">底循環・掛在舊機組後面</text>
<text class="s" x="386" y="370">同一批資產多榨一到兩成</text>
<text class="s" x="700" y="342">其餘・排掉</text>
<text class="s" x="452" y="120">換工作流體的新機組上限</text>

<text class="c" x="60" y="452">不必等新爐子，接在既有設備後面就成立</text>
</svg>
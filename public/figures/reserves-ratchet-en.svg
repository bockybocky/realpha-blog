<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The staircase steps upward and the downward arrow on each step is pushed back to its original height by a rebound arrow">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink)}
.ga{font-size:19px;fill:var(--accent)}
.b{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">Ratchet: up easy, down stuck</text>
<path d="M120 420 L300 420 L300 348 L480 348 L480 276 L660 276 L660 204 L860 204" fill="none" stroke="var(--accent)" stroke-width="4"/>
<line x1="210" y1="420" x2="210" y2="452" stroke="var(--warn)" stroke-width="2.5"/>
<path d="M210 462 L204 446 L216 446 Z" fill="var(--warn)"/>
<path d="M232 456 C 244 440, 244 432, 236 424" fill="none" stroke="var(--grey)" stroke-width="2.5"/>
<path d="M232 416 L228 432 L240 429 Z" fill="var(--grey)"/>
<line x1="390" y1="348" x2="390" y2="380" stroke="var(--warn)" stroke-width="2.5"/>
<path d="M390 390 L384 374 L396 374 Z" fill="var(--warn)"/>
<path d="M412 384 C 424 368, 424 360, 416 352" fill="none" stroke="var(--grey)" stroke-width="2.5"/>
<path d="M412 344 L408 360 L420 357 Z" fill="var(--grey)"/>
<line x1="570" y1="276" x2="570" y2="308" stroke="var(--warn)" stroke-width="2.5"/>
<path d="M570 318 L564 302 L576 302 Z" fill="var(--warn)"/>
<path d="M592 312 C 604 296, 604 288, 596 280" fill="none" stroke="var(--grey)" stroke-width="2.5"/>
<path d="M592 272 L588 288 L600 285 Z" fill="var(--grey)"/>
<text class="b" x="120" y="452">Try to drain</text>
<text class="b" x="640" y="330">One shock, back off</text>
<text class="ga" x="700" y="180">Reserve floor</text>
<text class="c" x="60" y="500">Each round leaves a higher floor</text>
</svg>
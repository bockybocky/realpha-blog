<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根柱子高度差極大，一根很矮一根很高">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="76">四季資本支出的增加額</text>
<text class="b" x="60" y="108">同一把尺，同一段時間</text>

<line x1="200" y1="450" x2="860" y2="450" stroke="var(--line)" stroke-width="2"/>

<rect x="280" y="434" width="120" height="16" rx="3" fill="var(--grey)"/>
<text class="g" x="280" y="416">100 億美元</text>
<text class="g" x="300" y="486">Apple</text>
<text class="b" x="258" y="514">不玩這場遊戲</text>

<rect x="640" y="150" width="120" height="300" rx="3" fill="var(--accent)"/>
<text class="g" x="640" y="132" fill="var(--accent)">2150 億美元</text>
<text class="g" x="648" y="486">Amazon</text>
<text class="b" x="618" y="514">靠資料中心活著</text>

<text class="c" x="60" y="550">同一欄裡的兩家公司，扛的不是同一種風險</text>
</svg>
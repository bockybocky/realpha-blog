<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A price line marked 'authorized' at the high and 'now' at the low.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">Expensive when authorized, cheap when usable</text>
<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<polyline points="90,380 240,320 400,240 520,170 620,200 720,300 850,370" fill="none" stroke="var(--grey)" stroke-width="3"/>
<circle cx="520" cy="170" r="10" fill="var(--warn)"/>
<text x="470" y="146" font-size="20" fill="var(--warn)">Buyback authorized</text>
<text x="470" y="124" font-size="16" fill="var(--dim)">Heading toward $6T</text>
<circle cx="850" cy="370" r="10" fill="var(--accent)"/>
<text x="700" y="414" font-size="20" fill="var(--accent)">Now</text>
<text x="700" y="438" font-size="16" fill="var(--dim)">36% off, about 11x</text>
<text x="60" y="488" font-size="22" fill="var(--ink)">The same $150B, at two prices</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The height gap between the two bars shows third-quarter acceleration, while the three source heights and the steep arrow on the right show the acceleration came from consumption, restocking and investment.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:19px; fill:var(--ink); font-weight:700; }
.b { font-size:16px; fill:var(--dim); }
.n { font-size:22px; fill:var(--ink); font-weight:700; }
.c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="h" x="60" y="72">Why it sped up</text>
<text class="g" x="60" y="150">QoQ SAAR</text>
<line x1="60" y1="462" x2="380" y2="462" stroke="var(--line)" stroke-width="2"/>
<rect x="90" y="308" width="96" height="154" fill="var(--grey)"/>
<rect x="230" y="224" width="96" height="238" fill="var(--accent)"/>
<text class="n" x="138" y="294" text-anchor="middle">2.2%</text>
<text class="n" x="278" y="210" text-anchor="middle">3.4%</text>
<text class="b" x="138" y="488" text-anchor="middle">Q2</text>
<text class="b" x="278" y="488" text-anchor="middle">Q3</text>
<line x1="412" y1="130" x2="412" y2="490" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="452" y="150">Sources</text>
<line x1="452" y1="462" x2="900" y2="462" stroke="var(--line)" stroke-width="2"/>
<rect x="470" y="287" width="80" height="175" fill="var(--accent)"/>
<rect x="600" y="350" width="80" height="112" fill="var(--accent)" opacity="0.65"/>
<text class="n" x="510" y="273" text-anchor="middle">2.5</text>
<text class="n" x="640" y="336" text-anchor="middle">1.6</text>
<text class="b" x="510" y="488" text-anchor="middle">Consumer</text>
<text class="b" x="640" y="488" text-anchor="middle">Restock</text>
<path d="M 760 440 L 870 250" stroke="var(--accent)" stroke-width="5" fill="none"/>
<path d="M 870 250 L 858 276 L 882 274 Z" fill="var(--accent)"/>
<text class="b" x="790" y="488" text-anchor="middle">Capex</text>
<text class="b" x="790" y="230" text-anchor="middle">4.6% → 19.4%</text>
<text class="c" x="60" y="534">Clean mix: spend, restock</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="長橫條切成三段，否決極細、附條件通過最寬，箭頭指向最寬的那一段">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .d { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700">州政府的籌碼不在否決，在條件</text>
<text class="d" x="60" y="94" font-size="16">約 7,500 件決定，2023 到 2025 年</text>

<rect x="60" y="190" width="7" height="90" fill="var(--warn)"/>
<rect x="67" y="190" width="563" height="90" fill="var(--accent)"/>
<rect x="630" y="190" width="270" height="90" fill="var(--grey)"/>

<text class="t" x="80" y="244" font-size="19" font-weight="700" fill="var(--page)">附條件通過 67%</text>
<text class="t" x="650" y="244" font-size="19" font-weight="700">直接通過</text>

<line x1="63" y1="190" x2="63" y2="140" stroke="var(--warn)" stroke-width="2"/>
<text class="d" x="60" y="128" font-size="16" fill="var(--warn)">否決 0.8%</text>

<path d="M 348 350 L 348 292" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M 340 300 L 348 288 L 356 300 Z" fill="var(--accent)"/>
<text class="t" x="240" y="382" font-size="22" font-weight="700">法案動的是這一段</text>
<text class="d" x="240" y="414" font-size="16">否決要有清楚而有說服力的證據</text>
<text class="d" x="240" y="440" font-size="16">附的條件要是最小侵害的那一個</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩張並排的期貨曲線，左邊由近月往遠月向下傾斜，右邊由近月往遠月向上傾斜">
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px}
    .b{font-size:15px;fill:var(--dim)}
    .c{font-size:22px}
  </style>
  <text class="t" x="40" y="58">逆價差加分，正價差扣分</text>
  <rect x="60" y="120" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <path d="M100 190 C 180 230, 300 272, 420 296" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="100" y="162">能源：逆價差</text>
  <text class="b" x="100" y="350">近月比遠月貴</text>
  <text class="b" x="100" y="376">總報酬 74%｜價格 45%</text>
  <text class="b" x="100" y="408">近月</text>
  <text class="b" x="420" y="408" text-anchor="end">遠月</text>
  <rect x="500" y="120" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <path d="M540 296 C 620 272, 740 230, 860 190" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text class="g" x="540" y="162">天然氣：正價差</text>
  <text class="b" x="540" y="350">一年後比現貨高 24%</text>
  <text class="b" x="540" y="376">今年 −25%</text>
  <text class="b" x="540" y="408">近月</text>
  <text class="b" x="860" y="408" text-anchor="end">遠月</text>
  <text class="c" x="40" y="498">斜率決定每次轉倉是收錢還是付錢</text>
</svg>
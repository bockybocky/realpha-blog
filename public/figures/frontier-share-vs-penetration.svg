<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條同長橫條，一條幾乎填滿、一條幾乎全空，對照前沿模型拿走的金額與市場滲透率">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .l { font-size:15px; fill:var(--dim); }
    .n { font-size:20px; font-weight:700; fill:var(--accent); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">幾乎全拿，幾乎還沒開始</text>
<text class="s" x="60" y="88">同一個市場的兩個刻度</text>
<text class="g" x="60" y="166">按金額的佔有</text>
<rect x="60" y="186" width="760" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="60" y="186" width="608" height="64" rx="8" fill="var(--accent)"/>
<text class="n" x="690" y="228">八成以上</text>
<text class="l" x="60" y="276">已經維持三年</text>
<text class="g" x="60" y="346">市場的滲透</text>
<rect x="60" y="366" width="760" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="60" y="366" width="5" height="64" fill="var(--accent)"/>
<text class="n" x="90" y="408">0.1%</text>
<text class="l" x="190" y="408">企業端按預算口徑 1% 以下</text>
<text class="c" x="60" y="484">定價權來自需求端近乎無限</text>
</svg>
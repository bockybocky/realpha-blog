<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條水平時間線對比，上方一條持續延伸並有箭頭，下方一條在中途被虛線截斷">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="90" y="72" font-size="27" font-weight="700" fill="var(--ink)">資產，還是租金</text>
<text x="90" y="108" font-size="16" fill="var(--dim)">報酬能持續多久・示意</text>

<text x="90" y="218" font-size="19" fill="var(--accent)">資產</text>
<line x1="200" y1="210" x2="830" y2="210" stroke="var(--accent)" stroke-width="10" stroke-linecap="round"/>
<polygon points="866,210 830,196 830,224" fill="var(--accent)"/>
<text x="200" y="180" font-size="15" fill="var(--dim)">不會到期</text>

<text x="90" y="338" font-size="19" fill="var(--warn)">租金</text>
<line x1="200" y1="330" x2="620" y2="330" stroke="var(--warn)" stroke-width="10" stroke-linecap="round"/>
<line x1="628" y1="330" x2="866" y2="330" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 10"/>
<line x1="620" y1="284" x2="620" y2="376" stroke="var(--dim)" stroke-width="2" stroke-dasharray="7 7"/>
<text x="620" y="272" font-size="19" text-anchor="middle" fill="var(--warn)">到期</text>
<text x="620" y="398" font-size="15" text-anchor="middle" fill="var(--dim)">日期未知</text>

<text x="90" y="470" font-size="22" font-weight="700" fill="var(--ink)">護城河若是租來的，先問租約多長</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右對比：逐條接線是長長的序列，整片轉印是一次落下的單一動作">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .k { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66">一條一條　對　一整片</text>

<rect x="60" y="110" width="380" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="88" y="150">打線</text>
<text class="b" x="88" y="178">逐條</text>
<g stroke="var(--grey)" stroke-width="3" fill="none">
<path d="M110 220 q20 -26 40 0"/><path d="M160 220 q20 -26 40 0"/><path d="M210 220 q20 -26 40 0"/>
<path d="M260 220 q20 -26 40 0"/><path d="M310 220 q20 -26 40 0"/><path d="M360 220 q20 -26 40 0"/>
</g>
<rect x="100" y="222" width="300" height="26" fill="var(--grey)" opacity="0.35"/>
<g stroke="var(--grey)" stroke-width="2">
<line x1="110" y1="270" x2="130" y2="270"/><line x1="150" y1="270" x2="170" y2="270"/>
<line x1="190" y1="270" x2="210" y2="270"/><line x1="230" y1="270" x2="250" y2="270"/>
<line x1="270" y1="270" x2="290" y2="270"/><line x1="310" y1="270" x2="330" y2="270"/>
<line x1="350" y1="270" x2="370" y2="270"/>
</g>
<text class="b" x="110" y="310">八百萬個接點</text>
<text class="k" x="110" y="358">好幾個小時</text>

<rect x="520" y="110" width="380" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="548" y="150">整片轉印</text>
<text class="b" x="548" y="178">一次</text>
<rect x="560" y="196" width="300" height="34" rx="6" fill="var(--accent)" opacity="0.18" stroke="var(--accent)"/>
<g fill="var(--accent)">
<rect x="572" y="205" width="12" height="16"/><rect x="600" y="205" width="12" height="16"/>
<rect x="628" y="205" width="12" height="16"/><rect x="656" y="205" width="12" height="16"/>
<rect x="684" y="205" width="12" height="16"/><rect x="712" y="205" width="12" height="16"/>
<rect x="740" y="205" width="12" height="16"/><rect x="768" y="205" width="12" height="16"/>
<rect x="796" y="205" width="12" height="16"/><rect x="824" y="205" width="12" height="16"/>
</g>
<g stroke="var(--accent)" stroke-width="3">
<line x1="578" y1="240" x2="578" y2="262"/><line x1="606" y1="240" x2="606" y2="262"/>
<line x1="634" y1="240" x2="634" y2="262"/><line x1="662" y1="240" x2="662" y2="262"/>
<line x1="690" y1="240" x2="690" y2="262"/><line x1="718" y1="240" x2="718" y2="262"/>
<line x1="746" y1="240" x2="746" y2="262"/><line x1="774" y1="240" x2="774" y2="262"/>
<line x1="802" y1="240" x2="802" y2="262"/><line x1="830" y1="240" x2="830" y2="262"/>
</g>
<rect x="560" y="264" width="300" height="26" fill="var(--grey)" opacity="0.35"/>
<text class="b" x="570" y="322">十萬個接點同時</text>
<text class="k" x="570" y="358">一次落下</text>
</svg>
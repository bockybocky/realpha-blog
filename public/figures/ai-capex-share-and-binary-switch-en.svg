<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A thin slice at the base of the large GDP block takes up less than an eighth of it, and on the right only on and off states exist, with the smooth ramp between them crossed out.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" fill="var(--ink)" font-weight="700">Small share, binary switch</text>
<rect x="70" y="130" width="340" height="310" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="94" y="164" font-size="19" fill="var(--dim)">GDP</text>
<rect x="70" y="415" width="340" height="25" fill="var(--accent)"/>
<text class="t" x="70" y="474" font-size="16" fill="var(--ink)">Tech HW, SW, industrial gear ≈ 8%</text>
<rect x="540" y="160" width="150" height="90" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="615" y="213" font-size="19" fill="var(--ink)" text-anchor="middle">On</text>
<rect x="740" y="330" width="150" height="90" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="815" y="383" font-size="19" fill="var(--ink)" text-anchor="middle">Off</text>
<path d="M690,250 L740,330" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 7"/>
<line x1="690" y1="320" x2="745" y2="260" stroke="var(--grey)" stroke-width="3"/>
<text class="t" x="540" y="300" font-size="15" fill="var(--grey)">No glide</text>
<text class="t" x="540" y="474" font-size="16" fill="var(--dim)">Homes stuck</text>
<text class="t" x="70" y="524" font-size="22" fill="var(--ink)" font-weight="700">If off, nothing takes over</text>
</svg>
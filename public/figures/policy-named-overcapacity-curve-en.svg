<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A curve rises sharply, collapses, and then oscillates at a low level.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">The shape after policy names a sector</text>
  <text class="t" x="48" y="90" font-size="16" fill="var(--dim)">Pigs, tutoring, crypto capital — one curve</text>

  <line x1="100" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <line x1="100" y1="130" x2="100" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="68" y="140" font-size="16" fill="var(--dim)">Price</text>
  <text class="t" x="880" y="468" font-size="16" fill="var(--dim)">Time</text>

  <polyline points="100,390 180,370 260,180 360,160 440,250 540,400 620,330 700,392 780,342 880,372" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <circle cx="260" cy="180" r="7" fill="var(--accent)"/>
  <circle cx="360" cy="160" r="7" fill="var(--accent)"/>
  <circle cx="540" cy="400" r="7" fill="var(--warn)"/>

  <text class="t" x="252" y="158" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="end">Supply swept out</text>
  <text class="t" x="372" y="136" font-size="16" font-weight="700" fill="var(--ink)">Money poured in · crowds arrive</text>
  <text class="t" x="548" y="424" font-size="16" font-weight="700" fill="var(--warn)">Oversupply · price war</text>
  <text class="t" x="800" y="320" font-size="16" fill="var(--dim)">Years of churn</text>

  <text class="t" x="480" y="508" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Direction from the top, a race to prove it below</text>
</svg>
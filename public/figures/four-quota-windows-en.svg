<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Four tracks of different lengths, each with a filled left segment for the quota remaining, the shortest almost unfilled">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Four windows, four lengths</text>
<text x="60" y="94" font-size="16" fill="var(--dim)">Track = reset cycle, fill = left</text>

<text x="60" y="188" font-size="20" fill="var(--ink)">5-hour</text>
<rect x="260" y="160" width="140" height="40" fill="var(--card)" stroke="var(--line)"/>
<rect x="260" y="160" width="15" height="40" fill="var(--warn)"/>
<text x="412" y="188" font-size="16" fill="var(--warn)">11% left</text>
<text x="260" y="228" font-size="16" fill="var(--warn)">Burning fast</text>

<text x="60" y="298" font-size="20" fill="var(--ink)">Weekly (1)</text>
<rect x="260" y="270" width="380" height="40" fill="var(--card)" stroke="var(--line)"/>
<rect x="260" y="270" width="289" height="40" fill="var(--accent)"/>
<text x="652" y="298" font-size="16" fill="var(--dim)">76% left</text>

<text x="60" y="378" font-size="20" fill="var(--ink)">Weekly (2)</text>
<rect x="260" y="350" width="380" height="40" fill="var(--card)" stroke="var(--line)"/>
<rect x="260" y="350" width="95" height="40" fill="var(--accent)"/>
<text x="652" y="378" font-size="16" fill="var(--dim)">25% left</text>
<text x="260" y="418" font-size="16" fill="var(--dim)">Coding reads a lot</text>

<text x="60" y="478" font-size="20" fill="var(--ink)">Monthly</text>
<rect x="260" y="450" width="560" height="40" fill="var(--card)" stroke="var(--line)"/>
<rect x="260" y="450" width="140" height="40" fill="var(--accent)"/>
<text x="832" y="478" font-size="16" fill="var(--dim)">25% left</text>

<text x="60" y="548" font-size="22" fill="var(--ink)">First to empty sets today</text>
</svg>
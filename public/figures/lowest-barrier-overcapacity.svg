<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三層寬度由下往上遞減，最窄的頂層被點亮">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">過剩在最寬的那層</text>

  <rect x="400" y="190" width="160" height="80" fill="var(--accent)"/>
  <text class="t" x="480" y="238" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">最窄的一層</text>
  <text class="t" x="584" y="226" font-size="16" font-weight="700" fill="var(--ink)">需求翻倍時最先斷 ・ 有定價權</text>

  <rect x="240" y="290" width="480" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="338" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">要點本事的一層</text>

  <rect x="100" y="390" width="760" height="80" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="480" y="428" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">門檻最低 ・ 人人進得來</text>
  <text class="t" x="480" y="452" font-size="16" fill="var(--warn)" text-anchor="middle">註定過剩</text>

  <text class="t" x="480" y="520" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">定價權不在誰都進得來的那層</text>
</svg>
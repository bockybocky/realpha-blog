<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="斜率圖兩條線交叉：違約風險排名奧地利最安全、阿根廷最危險；總成績排名反過來，阿根廷在上、奧地利在下。">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:600}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}.p{fill:var(--page)}
</style>
<text class="t" x="480" y="52" text-anchor="middle">最安全的，不一定賺最多</text>
<text class="g" x="260" y="118" text-anchor="middle">違約風險</text>
<text class="d" x="260" y="144" text-anchor="middle">上方＝安全</text>
<text class="g" x="700" y="118" text-anchor="middle">實際總成績</text>
<text class="d" x="700" y="144" text-anchor="middle">上方＝較好</text>
<line x1="260" y1="165" x2="260" y2="415" stroke="var(--line)" stroke-width="3"/>
<line x1="700" y1="165" x2="700" y2="415" stroke="var(--line)" stroke-width="3"/>
<line x1="260" y1="180" x2="700" y2="400" stroke="var(--warn)" stroke-width="4"/>
<line x1="260" y1="400" x2="700" y2="180" stroke="var(--accent)" stroke-width="4"/>
<circle cx="260" cy="180" r="8" fill="var(--warn)"/>
<circle cx="700" cy="400" r="8" fill="var(--warn)"/>
<circle cx="260" cy="400" r="8" fill="var(--accent)"/>
<circle cx="700" cy="180" r="8" fill="var(--accent)"/>
<text class="g" x="240" y="186" text-anchor="end">奧地利</text>
<text class="d" x="240" y="210" text-anchor="end">從未違約</text>
<text class="g" x="240" y="406" text-anchor="end">阿根廷</text>
<text class="d" x="240" y="430" text-anchor="end">曾違約</text>
<text class="g" x="720" y="186">阿根廷</text>
<text class="d" x="720" y="210">票息高</text>
<text class="g" x="720" y="406">奧地利</text>
<text class="d" x="720" y="430">一度跌逾八成</text>
<text class="c" x="480" y="515" text-anchor="middle">「安全」只算違約，沒算利率</text>
</svg>
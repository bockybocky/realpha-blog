<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="短時間軸末端是小效果方塊，長時間軸末端是大效果方塊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">時間放多久，效果就有多大</text>

  <text class="t" x="60" y="150" font-size="20" font-weight="700" fill="var(--ink)">幾個月的危機</text>
  <rect x="60" y="176" width="130" height="18" rx="9" fill="var(--warn)"/>
  <rect x="220" y="152" width="110" height="64" rx="8" fill="var(--warn)" opacity="0.25" stroke="var(--warn)"/>
  <text class="t" x="275" y="182" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">2.5%</text>
  <text class="t" x="275" y="206" font-size="15" text-anchor="middle" fill="var(--dim)">全球需求</text>

  <text class="t" x="60" y="300" font-size="20" font-weight="700" fill="var(--ink)">十年的電動化（中國）</text>
  <rect x="60" y="326" width="560" height="18" rx="9" fill="var(--accent)"/>
  <rect x="650" y="286" width="230" height="100" rx="8" fill="var(--accent)" opacity="0.25" stroke="var(--accent)"/>
  <text class="t" x="765" y="326" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">150 萬桶／日</text>
  <text class="t" x="765" y="356" font-size="15" text-anchor="middle" fill="var(--dim)">一個國家，一個品項</text>

  <text class="t" x="60" y="420" font-size="16" fill="var(--dim)">乘用車・卡車・公車・兩輪・三輪</text>
  <text class="t" x="60" y="450" font-size="16" fill="var(--dim)">緊急狀況喊不來</text>

  <text class="t" x="480" y="508" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">短的那條喊得響，長的那條才搬得動</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="噸位數軸上，十四噸與五十噸之間是一段空隙，奧索里歐落在空隙右端，幾乎碰到五十噸級">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">他們押的那道縫隙，在噸位上</text>

<rect x="297" y="250" width="456" height="90" fill="var(--card)" stroke="var(--line)"/>
<text x="400" y="232" font-size="19" fill="var(--dim)">空著的重量帶</text>

<line x1="120" y1="340" x2="880" y2="340" stroke="var(--ink)" stroke-width="3"/>
<g font-size="15" fill="var(--dim)">
<line x1="120" y1="340" x2="120" y2="356" stroke="var(--line)" stroke-width="2"/><text x="108" y="380">0</text>
<line x1="247" y1="340" x2="247" y2="356" stroke="var(--line)" stroke-width="2"/><text x="235" y="380">10</text>
<line x1="373" y1="340" x2="373" y2="356" stroke="var(--line)" stroke-width="2"/><text x="361" y="380">20</text>
<line x1="500" y1="340" x2="500" y2="356" stroke="var(--line)" stroke-width="2"/><text x="488" y="380">30</text>
<line x1="627" y1="340" x2="627" y2="356" stroke="var(--line)" stroke-width="2"/><text x="615" y="380">40</text>
<line x1="753" y1="340" x2="753" y2="356" stroke="var(--line)" stroke-width="2"/><text x="741" y="380">50</text>
<line x1="880" y1="340" x2="880" y2="356" stroke="var(--line)" stroke-width="2"/><text x="862" y="380">60 噸</text>
</g>

<circle cx="297" cy="340" r="11" fill="var(--grey)"/>
<text x="238" y="204" font-size="19" fill="var(--dim)">卡斯卡維</text>
<line x1="297" y1="214" x2="297" y2="328" stroke="var(--grey)" stroke-width="2"/>

<circle cx="652" cy="340" r="13" fill="var(--accent)"/>
<text x="600" y="150" font-size="19" fill="var(--accent)">奧索里歐</text>
<line x1="652" y1="160" x2="652" y2="326" stroke="var(--accent)" stroke-width="2"/>

<circle cx="765" cy="340" r="11" fill="var(--warn)"/>
<text x="740" y="204" font-size="19" fill="var(--warn)">M1、豹 2</text>
<line x1="765" y1="214" x2="765" y2="328" stroke="var(--warn)" stroke-width="2"/>

<text x="60" y="462" font-size="22" fill="var(--ink)">縫隙的右邊緣，就是強權賣家站的位置。</text>
</svg>
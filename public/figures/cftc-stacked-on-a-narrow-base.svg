<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="愈往上愈寬的塔疊在最窄的農產品原則地基上，頭重腳輕">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t h" x="60" y="66">同一張原則表</text>

  <rect x="200" y="400" width="200" height="56" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text class="t g" x="222" y="435">農產品原則</text>
  <text class="t b" x="430" y="435">1972</text>

  <rect x="170" y="336" width="300" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t g" x="192" y="371">金融期貨</text>

  <rect x="140" y="272" width="400" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t g" x="162" y="307">股價指數</text>

  <rect x="110" y="208" width="520" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t g" x="132" y="243">加密貨幣</text>

  <rect x="80" y="144" width="660" height="56" rx="6" fill="var(--accent)"/>
  <text class="t g" x="102" y="179" fill="var(--page)">預測市場・永續合約</text>

  <path d="M200 470 L400 470" stroke="var(--grey)" stroke-width="4"/>
  <text class="t b" x="200" y="500">地基最窄</text>
  <text class="t c" x="640" y="470">上層最寬</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three horizontal bars show the baseline, supply up 20%, and demand doubling, leaving a clear gap between supply and demand.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="52" text-anchor="middle">Memory: supply lags</text>
<text class="g" x="190" y="157" text-anchor="end">Now</text>
<rect x="210" y="128" width="300" height="44" fill="var(--grey)"/>
<text class="b" x="522" y="157">100</text>
<text class="g" x="190" y="247" text-anchor="end">Sup</text>
<rect x="210" y="218" width="360" height="44" fill="var(--accent)"/>
<text class="b" x="582" y="247" style="fill:var(--accent)">+20%</text>
<text class="g" x="190" y="337" text-anchor="end">Dem</text>
<rect x="210" y="308" width="600" height="44" fill="var(--warn)"/>
<text class="b" x="822" y="337" style="fill:var(--warn)">+100%</text>
<line x1="570" y1="200" x2="570" y2="400" stroke="var(--dim)" stroke-width="2" stroke-dasharray="5 6"/>
<line x1="810" y1="360" x2="810" y2="400" stroke="var(--dim)" stroke-width="2" stroke-dasharray="5 6"/>
<line x1="570" y1="395" x2="810" y2="395" stroke="var(--warn)" stroke-width="3"/>
<line x1="570" y1="385" x2="570" y2="405" stroke="var(--warn)" stroke-width="3"/>
<line x1="810" y1="385" x2="810" y2="405" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="690" y="428" text-anchor="middle" style="fill:var(--warn)">Gap</text>
<text class="s" x="690" y="450" text-anchor="middle">Lifts price</text>
<text class="c" x="480" y="498" text-anchor="middle">Inflation bets climb</text>
</svg>
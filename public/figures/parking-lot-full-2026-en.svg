<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Two rows of parking spaces: scattered empties in past years, completely full this year, with arrows to off-site alternatives.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="70" font-size="27" fill="var(--ink)">First time in fifteen years, no space</text>

  <text x="60" y="150" font-size="19" fill="var(--dim)">Past years</text>
  <rect x="60" y="170" width="62" height="58" rx="6" fill="var(--grey)"/>
  <rect x="134" y="170" width="62" height="58" rx="6" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="208" y="170" width="62" height="58" rx="6" fill="var(--grey)"/>
  <rect x="282" y="170" width="62" height="58" rx="6" fill="var(--grey)"/>
  <rect x="356" y="170" width="62" height="58" rx="6" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="430" y="170" width="62" height="58" rx="6" fill="var(--grey)"/>
  <rect x="504" y="170" width="62" height="58" rx="6" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="578" y="170" width="62" height="58" rx="6" fill="var(--grey)"/>
  <rect x="652" y="170" width="62" height="58" rx="6" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>

  <text x="60" y="290" font-size="19" fill="var(--dim)">Day one this year</text>
  <rect x="60" y="310" width="62" height="58" rx="6" fill="var(--accent)"/>
  <rect x="134" y="310" width="62" height="58" rx="6" fill="var(--accent)"/>
  <rect x="208" y="310" width="62" height="58" rx="6" fill="var(--accent)"/>
  <rect x="282" y="310" width="62" height="58" rx="6" fill="var(--accent)"/>
  <rect x="356" y="310" width="62" height="58" rx="6" fill="var(--accent)"/>
  <rect x="430" y="310" width="62" height="58" rx="6" fill="var(--accent)"/>
  <rect x="504" y="310" width="62" height="58" rx="6" fill="var(--accent)"/>
  <rect x="578" y="310" width="62" height="58" rx="6" fill="var(--accent)"/>
  <rect x="652" y="310" width="62" height="58" rx="6" fill="var(--accent)"/>
  <line x1="726" y1="339" x2="762" y2="339" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="774,339 760,332 760,346" fill="var(--accent)"/>
  <text x="784" y="332" font-size="15" fill="var(--dim)">Levi's</text>
  <text x="784" y="356" font-size="15" fill="var(--dim)">Across</text>

  <text x="60" y="440" font-size="22" fill="var(--accent)">Density is a reading too</text>
</svg>
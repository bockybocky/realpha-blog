<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A trail of footprints along a timeline with only a dashed circle and a question mark at the right end">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs>
  <marker id="arw-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/></marker>
</defs>
<text x="48" y="62" font-size="27" fill="var(--ink)">The neutral rate: you see the footprints only after walking past</text>
<text x="48" y="96" font-size="16" fill="var(--dim)">Thirty years an academic, and he calls it "Bigfoot"</text>

<line x1="100" y1="340" x2="880" y2="340" stroke="var(--grey)" stroke-width="2" marker-end="url(#arw-f2)"/>
<text x="892" y="333" font-size="15" fill="var(--dim)">Time</text>

<ellipse cx="150" cy="318" rx="8" ry="13" fill="var(--dim)"/>
<ellipse cx="230" cy="364" rx="8" ry="13" fill="var(--dim)"/>
<ellipse cx="310" cy="318" rx="8" ry="13" fill="var(--dim)"/>
<ellipse cx="390" cy="364" rx="8" ry="13" fill="var(--dim)"/>
<ellipse cx="470" cy="318" rx="8" ry="13" fill="var(--dim)"/>

<circle cx="660" cy="340" r="36" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 7"/>
<text x="660" y="353" font-size="27" fill="var(--accent)" text-anchor="middle">?</text>

<text x="310" y="424" font-size="19" fill="var(--dim)" text-anchor="middle">You only know where it was after passing it</text>
<text x="660" y="424" font-size="19" fill="var(--accent)" text-anchor="middle">Now? Not visible</text>

<text x="480" y="480" font-size="22" fill="var(--ink)" text-anchor="middle">What's only visible afterward can't ground a decision now</text>
</svg>
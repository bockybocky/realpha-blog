<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three downward bars differ enormously in length: 14, 7 and 0.17 percentage points, with the rightmost one reduced to a hairline.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .n { font-size:20px; fill:var(--ink); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="68">Heart down 14, body down 0.17</text>
<text class="b" x="60" y="100">Same session: intraday moves on the day of the recording</text>

<line x1="90" y1="160" x2="880" y2="160" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="90" y="146">Zero line</text>

<rect x="150" y="160" width="130" height="280" rx="6" fill="var(--warn)"/>
<text class="n" x="215" y="474" text-anchor="middle">-14</text>
<text class="g" x="215" y="506" text-anchor="middle">Core company</text>
<text class="b" x="215" y="532" text-anchor="middle">Intraday: under $4 trillion</text>

<rect x="415" y="160" width="130" height="140" rx="6" fill="var(--accent)"/>
<text class="n" x="480" y="474" text-anchor="middle">-7</text>
<text class="g" x="480" y="506" text-anchor="middle">Same stock</text>
<text class="b" x="480" y="532" text-anchor="middle">After the 9:55 narrowing</text>

<rect x="680" y="160" width="130" height="4" rx="2" fill="var(--accent)"/>
<text class="n" x="745" y="474" text-anchor="middle">-0.17</text>
<text class="g" x="745" y="506" text-anchor="middle">Broad market</text>
<text class="b" x="745" y="532" text-anchor="middle">S&amp;P 500</text>

<text class="c" x="480" y="398" text-anchor="middle">One name falls, the race goes on</text>
</svg>
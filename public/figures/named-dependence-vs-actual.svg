<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="濃縮服務來源長條圖，歐洲占大半但未被稱為瓶頸，被點名的只有右側俄羅斯小段">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="78" font-size="27" fill="var(--ink)">美國消耗的濃縮服務來自哪裡</text>

<rect x="60" y="180" width="630" height="110" fill="var(--grey)"/>
<rect x="690" y="180" width="210" height="110" fill="var(--warn)"/>

<text x="375" y="230" font-size="20" fill="var(--page)" text-anchor="middle">歐洲供應商</text>
<text x="375" y="262" font-size="20" fill="var(--page)" text-anchor="middle">約七成五</text>
<text x="795" y="230" font-size="20" fill="var(--page)" text-anchor="middle">俄羅斯</text>
<text x="795" y="262" font-size="20" fill="var(--page)" text-anchor="middle">兩成上下</text>

<path d="M690 320 L690 350 L900 350 L900 320" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text x="795" y="382" font-size="19" fill="var(--warn)" text-anchor="middle">被叫作瓶頸</text>

<path d="M60 320 L60 350 L690 350 L690 320" fill="none" stroke="var(--line)" stroke-width="3"/>
<text x="375" y="382" font-size="19" fill="var(--dim)" text-anchor="middle">沒人叫它瓶頸</text>

<text x="60" y="470" font-size="22" fill="var(--ink)">本土化處理的是可被制裁打斷的那一段</text>
</g>
</svg>
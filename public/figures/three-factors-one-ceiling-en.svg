<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three bars differ sharply in height, and the middle one standing for tools is shortest and labeled stuck.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="h" x="60" y="58">Three factors multiply, each with its own headroom</text>
  <text class="b" x="60" y="88">Bar height is room to expand, illustrative</text>

  <line x1="100" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>

  <rect x="180" y="200" width="120" height="230" rx="6" fill="var(--accent)" opacity="0.85"/>
  <rect x="420" y="370" width="120" height="60" rx="6" fill="var(--warn)"/>
  <rect x="660" y="402" width="120" height="28" rx="6" fill="var(--grey)"/>

  <g class="g" text-anchor="middle">
    <text x="240" y="186">Can expand</text>
    <text x="480" y="356" fill="var(--warn)">Stuck</text>
    <text x="720" y="388">A few points</text>
  </g>
  <g class="g" text-anchor="middle">
    <text x="240" y="464">Cleanroom space</text>
    <text x="480" y="464">Tools</text>
    <text x="720" y="464">Yield</text>
  </g>
  <g class="b" text-anchor="middle">
    <text x="240" y="490">Money and time can solve it</text>
    <text x="480" y="490">18-month lead time, no substitute</text>
    <text x="720" y="490">Higher means harder to gain</text>
  </g>
  <text class="c" x="60" y="534">Three factors multiply, the shortest sets the ceiling</text>
</svg>
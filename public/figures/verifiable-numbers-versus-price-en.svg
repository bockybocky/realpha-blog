<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two lines from one point pull apart, the upper checkable numbers rising and the lower share price falling, with the gap marked on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">When they diverge, trust the side you can check</text>

<rect x="60" y="96" width="840" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="120" y1="396" x2="880" y2="396" stroke="var(--line)" stroke-width="2"/>

<polyline points="150,300 300,268 450,232 600,196 780,164" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="150" cy="300" r="6" fill="var(--accent)"/>
<circle cx="780" cy="164" r="6" fill="var(--accent)"/>
<text class="g" x="780" y="142" text-anchor="end" fill="var(--accent)">Prices . orders . filings</text>
<text class="b" x="780" y="120" text-anchor="end">Checkable</text>

<polyline points="150,300 300,322 450,306 600,352 780,378" fill="none" stroke="var(--grey)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="780" cy="378" r="6" fill="var(--grey)"/>
<text class="g" x="780" y="410" text-anchor="end">Share price</text>

<line x1="820" y1="164" x2="820" y2="378" stroke="var(--dim)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="812" y1="164" x2="828" y2="164" stroke="var(--dim)" stroke-width="2"/>
<line x1="812" y1="378" x2="828" y2="378" stroke="var(--dim)" stroke-width="2"/>
<text class="b" x="838" y="277">Divergence</text>

<text class="c" x="480" y="490" text-anchor="middle">The numbers did not change, the price did</text>
</svg>
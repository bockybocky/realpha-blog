<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Left: three steps on one axis that can be checked against answers. Right: a cloud of signal words with no axis, so nothing can be judged right or wrong.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .w { font-size:16px; fill:var(--ink); font-weight:600; }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <text class="t" x="60" y="56">Things with a ruler, and things without one</text>

  <rect x="60" y="96" width="400" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="96" width="400" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="80" y="134" fill="var(--accent)">The sequence he gave himself</text>
  <text class="g" x="520" y="134" fill="var(--warn)">The signals going around</text>

  <line x1="120" y1="180" x2="120" y2="420" stroke="var(--accent)" stroke-width="3" marker-end="url(#a2)"/>
  <circle cx="120" cy="212" r="9" fill="var(--accent)"/>
  <circle cx="120" cy="296" r="9" fill="var(--accent)"/>
  <circle cx="120" cy="380" r="9" fill="var(--accent)"/>
  <text class="w" x="150" y="206">Flight 1</text>
  <text class="b" x="150" y="232">Up, not back</text>
  <text class="w" x="150" y="290">Flight 2</text>
  <text class="b" x="150" y="316">On-orbit capability</text>
  <text class="w" x="150" y="374">Flight 3</text>
  <text class="b" x="150" y="400">Reentry and heat shield</text>

  <rect x="536" y="180" width="150" height="52" rx="26" fill="var(--card)" stroke="var(--grey)"/>
  <text class="w" x="611" y="212" text-anchor="middle">Amount raised</text>
  <rect x="712" y="238" width="150" height="52" rx="26" fill="var(--card)" stroke="var(--grey)"/>
  <text class="w" x="787" y="270" text-anchor="middle">Administrator visit</text>
  <rect x="546" y="300" width="150" height="52" rx="26" fill="var(--card)" stroke="var(--grey)"/>
  <text class="w" x="621" y="332" text-anchor="middle">Press volume</text>
  <rect x="702" y="366" width="150" height="52" rx="26" fill="var(--card)" stroke="var(--grey)"/>
  <text class="w" x="777" y="398" text-anchor="middle">Next-round valuation</text>

  <text class="b" x="80" y="446">Every box can be checked against an answer</text>
  <text class="b" x="520" y="446">Not one of them tells you you were wrong</text>

  <text class="c" x="60" y="514">Without a ruler you trade on feel</text>
</svg>
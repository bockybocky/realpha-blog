<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩張小圖，左邊一條線往下墜，右邊一條線年復一年貼在同一個高度">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">這兩題會翻掉的兩種樣子</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">右邊那一種更難察覺</text>
<rect x="90" y="150" width="350" height="280" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="182" font-size="19" fill="var(--ink)" font-weight="700">同樣的智能，吃掉的算力</text>
<text x="110" y="208" font-size="16" fill="var(--dim)">架構改變</text>
<polyline points="140,250 240,272 340,312 400,345 420,360" fill="none" stroke="var(--accent)" stroke-width="4"/>
<line x1="120" y1="400" x2="420" y2="400" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="460" font-size="19" fill="var(--accent)" font-weight="700">大幅下降</text>
<rect x="520" y="150" width="350" height="280" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="540" y="182" font-size="19" fill="var(--ink)" font-weight="700">採用率</text>
<text x="540" y="208" font-size="16" fill="var(--dim)">擴不出去</text>
<polyline points="570,320 670,318 770,322 850,319" fill="none" stroke="var(--warn)" stroke-width="4"/>
<line x1="550" y1="400" x2="850" y2="400" stroke="var(--line)" stroke-width="2"/>
<text x="540" y="460" font-size="19" fill="var(--warn)" font-weight="700">年復一年停在原地</text>
<text x="60" y="510" font-size="22" fill="var(--ink)" font-weight="700">更難察覺的那一種，不會出現在任何一天的新聞裡</text>
</svg>
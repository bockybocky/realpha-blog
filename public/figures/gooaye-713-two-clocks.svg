<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條線從同一點反向拉開，一條往上一條往下，右側開口標為風險">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">價格天天更新，便宜一季才更新一次</text>
<line x1="110" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="110" y1="110" x2="110" y2="440" stroke="var(--line)" stroke-width="2"/>
<polyline points="160,300 320,262 480,205 640,160 800,126" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="160,300 320,318 480,348 640,378 800,404" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 7"/>
<circle cx="160" cy="300" r="7" fill="var(--grey)"/>
<text class="t" x="820" y="132" font-size="19" fill="var(--accent)">漲勢</text>
<text class="t" x="820" y="410" font-size="19" fill="var(--warn)">估值空間</text>
<line x1="800" y1="126" x2="800" y2="404" stroke="var(--grey)" stroke-width="2"/>
<text class="t" x="700" y="268" font-size="20" fill="var(--ink)" text-anchor="end">風險</text>
<text class="t" x="160" y="470" font-size="16" fill="var(--dim)">上禮拜算的</text>
<text class="t" x="760" y="470" font-size="16" fill="var(--dim)">檢驗期下修</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩格對比出資者：2000 年是薄薄一層創投資金，2026 年是厚很多的自由現金流，但頂部一塊被資本支出佔走，兩者都往下流進基礎設施">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600}
.b{font-size:16px}
.d{font-size:15px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">出錢的人換了</text>
<text class="g" x="100" y="116">2000 年　光纖</text>
<text class="g" x="560" y="116">2026 年　AI 基建</text>
<rect x="100" y="230" width="280" height="60" rx="6" fill="var(--grey)"/>
<text class="b" x="240" y="267" text-anchor="middle">創投資金</text>
<rect x="560" y="150" width="280" height="140" rx="6" fill="var(--accent)"/>
<rect x="560" y="150" width="280" height="56" rx="6" fill="var(--warn)"/>
<text x="700" y="186" text-anchor="middle" style="font-size:16px;fill:var(--page)">資本支出正在吃</text>
<text x="700" y="256" text-anchor="middle" style="font-size:16px;fill:var(--page)">自由現金流</text>
<line x1="240" y1="294" x2="240" y2="322" stroke="var(--grey)" stroke-width="3"/>
<polygon points="232,322 248,322 240,336" fill="var(--grey)"/>
<line x1="700" y1="294" x2="700" y2="322" stroke="var(--accent)" stroke-width="3"/>
<polygon points="692,322 708,322 700,336" fill="var(--accent)"/>
<rect x="100" y="344" width="280" height="54" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="240" y="378" text-anchor="middle">鋪出去的光纖</text>
<rect x="560" y="344" width="280" height="54" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="700" y="378" text-anchor="middle">蓋出去的資料中心</text>
<text class="c" x="60" y="470">錢更厚，但正在被吃掉</text>
</svg>
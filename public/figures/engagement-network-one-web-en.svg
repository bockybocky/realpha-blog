<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Six unconnected dots on the left, and on the right the same dots linked into a web that ties back to a central main account, with the company above paying influencers via dashed lines.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text x="480" y="52" class="t" text-anchor="middle">Looks like many voices, really one web</text>
<text x="240" y="112" class="g" text-anchor="middle">Looks like</text>
<text x="720" y="112" class="g" text-anchor="middle" style="fill:var(--accent)">Actually</text>
<line x1="480" y1="96" x2="480" y2="500" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="120" cy="230" r="30" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="360" cy="230" r="30" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="240" cy="320" r="30" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="120" cy="420" r="30" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="240" cy="460" r="30" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="360" cy="420" r="30" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="120" y="235" class="b" text-anchor="middle">Account</text>
<text x="360" y="235" class="b" text-anchor="middle">Account</text>
<text x="240" y="325" class="b" text-anchor="middle">Account</text>
<text x="120" y="425" class="b" text-anchor="middle">Account</text>
<text x="240" y="465" class="b" text-anchor="middle">Account</text>
<text x="360" y="425" class="b" text-anchor="middle">Account</text>
<line x1="720" y1="320" x2="600" y2="230" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="720" y1="320" x2="840" y2="230" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="720" y1="320" x2="600" y2="420" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="720" y1="320" x2="720" y2="460" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="720" y1="320" x2="840" y2="420" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="600" y1="230" x2="840" y2="230" stroke="var(--grey)" stroke-width="2"/>
<line x1="600" y1="230" x2="600" y2="420" stroke="var(--grey)" stroke-width="2"/>
<line x1="840" y1="230" x2="840" y2="420" stroke="var(--grey)" stroke-width="2"/>
<line x1="600" y1="420" x2="720" y2="460" stroke="var(--grey)" stroke-width="2"/>
<line x1="720" y1="460" x2="840" y2="420" stroke="var(--grey)" stroke-width="2"/>
<line x1="600" y1="420" x2="840" y2="420" stroke="var(--grey)" stroke-width="2"/>
<line x1="700" y1="178" x2="622" y2="208" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="740" y1="178" x2="818" y2="208" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="680" y="142" width="80" height="36" rx="6" fill="var(--page)" stroke="var(--ink)" stroke-width="2"/>
<text x="720" y="166" class="b" text-anchor="middle" style="fill:var(--ink)">Company</text>
<text x="720" y="212" class="b" text-anchor="middle" style="fill:var(--accent)">Pays</text>
<circle cx="600" cy="230" r="30" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="840" cy="230" r="30" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="600" cy="420" r="30" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="720" cy="460" r="30" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="840" cy="420" r="30" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="720" cy="320" r="38" fill="var(--accent)"/>
<text x="600" y="235" class="b" text-anchor="middle" style="fill:var(--ink)">Influencer</text>
<text x="840" y="235" class="b" text-anchor="middle" style="fill:var(--ink)">Influencer</text>
<text x="600" y="425" class="b" text-anchor="middle" style="fill:var(--ink)">Affiliate</text>
<text x="720" y="465" class="b" text-anchor="middle" style="fill:var(--ink)">Affiliate</text>
<text x="840" y="425" class="b" text-anchor="middle" style="fill:var(--ink)">Affiliate</text>
<text x="720" y="326" text-anchor="middle" style="font-size:16px;font-weight:700;fill:var(--page)">Main account</text>
<text x="240" y="532" class="b" text-anchor="middle">Independent voices</text>
<text x="720" y="532" class="b" text-anchor="middle">Quote &amp; retweet each other</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two rectangles compared: wide and tall during shortage, then narrower and shorter once the gap closes, so the area shrinks more than either side.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="80" font-size="27" fill="var(--ink)">Area, not one edge</text>
  <line x1="100" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
  <rect x="140" y="170" width="250" height="230" fill="var(--accent)" opacity="0.8"/>
  <text class="t" x="265" y="150" font-size="20" fill="var(--ink)" text-anchor="middle">Short</text>
  <text class="t" x="265" y="300" font-size="19" fill="var(--page)" text-anchor="middle">P&amp;L</text>
  <rect x="580" y="250" width="175" height="150" fill="var(--warn)" opacity="0.8"/>
  <text class="t" x="667" y="150" font-size="20" fill="var(--ink)" text-anchor="middle">No gap</text>
  <text class="t" x="667" y="335" font-size="19" fill="var(--page)" text-anchor="middle">P&amp;L</text>
  <line x1="140" y1="425" x2="390" y2="425" stroke="var(--dim)" stroke-width="2"/>
  <text class="t" x="265" y="448" font-size="16" fill="var(--dim)" text-anchor="middle">W=units</text>
  <line x1="580" y1="425" x2="755" y2="425" stroke="var(--dim)" stroke-width="2"/>
  <text class="t" x="667" y="448" font-size="16" fill="var(--dim)" text-anchor="middle">Thin</text>
  <line x1="118" y1="170" x2="118" y2="400" stroke="var(--dim)" stroke-width="2"/>
  <text class="t" x="108" y="290" font-size="16" fill="var(--dim)" text-anchor="end">H</text>
  <text class="t" x="108" y="312" font-size="16" fill="var(--dim)" text-anchor="end">GM</text>
  <line x1="558" y1="250" x2="558" y2="400" stroke="var(--dim)" stroke-width="2"/>
  <text class="t" x="548" y="330" font-size="16" fill="var(--dim)" text-anchor="end">Low</text>
  <text class="t" x="140" y="500" font-size="22" fill="var(--ink)">Both sides down, area more</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="震盪曲線繞著一條平緩上升的粗線上下擺動，被一條帶狀範圍包住">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="66" font-size="27" fill="var(--ink)">狗會跑前跑後，但不會走丟</text>
  <rect x="60" y="100" width="840" height="370" rx="16" fill="var(--page)" stroke="var(--line)"/>
  <path d="M110 430 L870 230 L870 350 L110 550 Z" fill="var(--card)"/>
  <path d="M110 480 L870 280" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M110 380 L870 180" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M110 430 L870 230" fill="none" stroke="var(--dim)" stroke-width="7"/>
  <path d="M110 420 C 180 330, 230 200, 290 250 C 350 300, 380 470, 440 440 C 500 410, 520 230, 590 210 C 650 195, 680 400, 740 380 C 790 365, 820 240, 870 232" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text x="596" y="188" font-size="19" fill="var(--accent)">衝過頭</text>
  <text x="400" y="472" font-size="19" fill="var(--accent)">跌過頭</text>
  <text x="640" y="300" font-size="19" fill="var(--dim)">基本面</text>
  <text x="60" y="516" font-size="22" fill="var(--ink)">短期不貼合是常態，走離太遠才是訊息</text>
</svg>
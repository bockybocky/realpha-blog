<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一起點長出兩條線，前段幾乎重合，中段開始分離，末端一條高一條低，差距極大。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">少打一位小數之後</text>
  <rect x="60" y="88" width="840" height="368" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <path d="M120 420 L860 420" stroke="var(--grey)" stroke-width="2"/>
  <path d="M120 420 L120 130" stroke="var(--grey)" stroke-width="2"/>
  <text class="s" x="112" y="446">第一天</text>
  <text class="s" x="420" y="446">第三天</text>
  <text class="s" x="770" y="446">第五天</text>
  <circle cx="140" cy="330" r="7" fill="var(--ink)"/>
  <text class="s" x="118" y="312">同一起點</text>
  <path d="M140 330 C 260 322 330 300 420 268 C 560 220 700 190 840 172" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <path d="M140 330 C 260 338 330 352 420 372 C 560 396 700 404 840 408" stroke="var(--warn)" stroke-width="4" fill="none"/>
  <text class="g" x="700" y="156">晴</text>
  <text class="g" x="700" y="396">大雨</text>
  <path d="M840 176 L840 404" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="c" x="60" y="512">誤差不是偏一點，是每一步複利</text>
</svg>
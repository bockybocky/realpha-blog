<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="每次呼叫字量三根橫條由長到短，末端虛線標示關不掉的地板">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">一次呼叫，背多少字</text>

  <text x="60" y="146" font-size="19" fill="var(--ink)">正常</text>
  <rect x="230" y="122" width="640" height="42" rx="6" fill="var(--grey)"/>
  <text x="240" y="150" font-size="16" fill="var(--page)">105,758</text>

  <text x="60" y="248" font-size="19" fill="var(--ink)">只讀本機設定</text>
  <rect x="230" y="224" width="212" height="42" rx="6" fill="var(--dim)"/>
  <text x="240" y="252" font-size="16" fill="var(--page)">35,052</text>

  <text x="60" y="350" font-size="19" fill="var(--ink)">安全模式</text>
  <rect x="230" y="326" width="100" height="42" rx="6" fill="var(--accent)"/>
  <text x="240" y="354" font-size="16" fill="var(--page)">16,585</text>

  <path d="M 330 108 L 330 396" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6" fill="none"/>
  <text x="344" y="412" font-size="16" fill="var(--warn)">地板　關不掉</text>

  <text x="60" y="480" font-size="22" fill="var(--ink)">少八成四，剩下的關不掉。</text>
</svg>
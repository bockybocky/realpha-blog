<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A chain of four links runs from wide to narrow, with a three-year waiting-cost block attached at the end.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .d { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700">To wait, win four</text>
<text class="d" x="60" y="94" font-size="16">Height = odds left</text>

<rect x="80" y="150" width="150" height="260" rx="8" fill="var(--accent)"/>
<rect x="258" y="212" width="150" height="198" rx="8" fill="var(--accent)" opacity="0.8"/>
<rect x="436" y="268" width="150" height="142" rx="8" fill="var(--accent)" opacity="0.6"/>
<rect x="614" y="320" width="150" height="90" rx="8" fill="var(--accent)" opacity="0.4"/>

<text class="t" x="96" y="196" font-size="19" font-weight="700" fill="var(--page)">Win both</text>
<text class="t" x="274" y="258" font-size="19" font-weight="700" fill="var(--page)">60 votes</text>
<text class="t" x="452" y="314" font-size="19" font-weight="700">GOP joins</text>
<text class="t" x="630" y="366" font-size="19" font-weight="700">Signed</text>

<line x1="80" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>

<rect x="790" y="150" width="110" height="260" rx="8" fill="var(--warn)"/>
<text class="t" x="845" y="268" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">3yr</text>
<text class="t" x="845" y="296" font-size="16" fill="var(--page)" text-anchor="middle">Lag</text>
<text class="d" x="790" y="476" font-size="16">2 yr + 1 yr rules</text>
<text class="t" x="80" y="528" font-size="22" font-weight="700">Same deal, 3 years later</text>
</svg>
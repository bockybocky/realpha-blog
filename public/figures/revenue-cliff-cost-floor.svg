<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="收入線在一天內垂直掉到成本線之下，成本線保持水平，之後兩線之間留下一塊缺口">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">收入是斷崖，成本是階梯</text>
<rect x="80" y="100" width="800" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<polygon points="400,215 860,215 860,330 400,330" fill="var(--line)"/>
<line x1="120" y1="215" x2="860" y2="215" stroke="var(--warn)" stroke-width="4"/>
<polyline points="120,160 400,160 400,330 860,330" fill="none" stroke="var(--accent)" stroke-width="4"/>
<line x1="400" y1="136" x2="400" y2="400" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="b" x="400" y="128" text-anchor="middle">帶客戶的人離開那天</text>
<text class="g" x="124" y="146" fill="var(--accent)">收入</text>
<text class="g" x="124" y="205" fill="var(--warn)">成本</text>
<text class="g" x="630" y="282" text-anchor="middle" fill="var(--dim)">拆不掉的那一塊</text>
<line x1="120" y1="400" x2="848" y2="400" stroke="var(--line)" stroke-width="2"/>
<polygon points="848,393 862,400 848,407" fill="var(--line)"/>
<text class="b" x="860" y="428" text-anchor="end">時間</text>
<text class="c" x="60" y="500">收入一夜歸零，成本照合約付完</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="With retail price as a full bar, connected electronics and gift cards fill 70 to 80 percent of it, while everyday goods fill only 30 to 40 percent.">
<rect x="0" y="0" width="960" height="480" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text x="48" y="62" class="t">Resale vs retail</text>
<rect x="300" y="170" width="560" height="40" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="300" y="170" width="392" height="40" fill="var(--accent)"/>
<rect x="692" y="170" width="56" height="40" fill="var(--accent)" fill-opacity="0.45"/>
<text x="280" y="197" class="g" text-anchor="end">Tech·gift cards</text>
<text x="760" y="197" class="b">70–80%</text>
<rect x="300" y="290" width="560" height="40" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="300" y="290" width="168" height="40" fill="var(--accent)"/>
<rect x="468" y="290" width="56" height="40" fill="var(--accent)" fill-opacity="0.45"/>
<text x="280" y="316" class="g" text-anchor="end">Basics</text>
<text x="280" y="342" class="d" text-anchor="end">Deo·tees·pills</text>
<text x="536" y="316" class="b">30–40%</text>
<line x1="300" y1="370" x2="300" y2="382" stroke="var(--dim)" stroke-width="2"/>
<line x1="580" y1="370" x2="580" y2="382" stroke="var(--dim)" stroke-width="2"/>
<line x1="860" y1="370" x2="860" y2="382" stroke="var(--dim)" stroke-width="2"/>
<text x="300" y="402" class="d" text-anchor="middle">0</text>
<text x="580" y="402" class="d" text-anchor="middle">50%</text>
<text x="860" y="402" class="d" text-anchor="middle">MSRP</text>
<text x="480" y="452" class="c" text-anchor="middle">Fenceable first</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The zero-retention promise rests on three cracked, slightly leaning pillars.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="60" font-size="27" font-weight="700" fill="var(--ink)">Three pillars holding up the claim</text>

  <rect x="120" y="110" width="720" height="78" rx="8" fill="var(--accent)"/>
  <text class="t" x="480" y="158" font-size="22" font-weight="700" fill="var(--page)" text-anchor="middle">Zero retention; your data is not used for training</text>

  <g>
    <path d="M196 200 L 268 200 L 276 420 L 204 420 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <path d="M196 268 L 268 282" fill="none" stroke="var(--warn)" stroke-width="3"/>
    <path d="M204 344 L 276 330" fill="none" stroke="var(--warn)" stroke-width="3"/>
  </g>
  <g>
    <path d="M444 200 L 516 200 L 512 420 L 440 420 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <path d="M444 292 L 514 276" fill="none" stroke="var(--warn)" stroke-width="3"/>
  </g>
  <g>
    <path d="M692 200 L 764 200 L 772 420 L 700 420 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <path d="M692 254 L 762 268" fill="none" stroke="var(--warn)" stroke-width="3"/>
    <path d="M698 368 L 770 356" fill="none" stroke="var(--warn)" stroke-width="3"/>
  </g>

  <line x1="120" y1="420" x2="840" y2="420" stroke="var(--ink)" stroke-width="3"/>

  <text class="t" x="236" y="458" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Who promises?</text>
  <text class="t" x="236" y="484" font-size="15" fill="var(--dim)" text-anchor="middle">Upstream unnamed</text>
  <text class="t" x="478" y="458" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Commitment or copy?</text>
  <text class="t" x="478" y="484" font-size="15" fill="var(--dim)" text-anchor="middle">Same claim copied twice</text>
  <text class="t" x="732" y="458" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">How long?</text>
  <text class="t" x="732" y="484" font-size="15" fill="var(--dim)" text-anchor="middle">Limited time, no end date</text>

  <text class="t" x="480" y="530" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">I cannot verify any of the three</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="長坡上兩條上升曲線，晚起跑的那條終點明顯較低，最左邊一段被標為被錯過的前三分之一">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">長坡的前三分之一</text>
<rect x="120" y="120" width="210" height="340" fill="var(--card)"/>
<line x1="120" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="3"/>
<line x1="120" y1="120" x2="120" y2="460" stroke="var(--line)" stroke-width="3"/>
<path d="M120 455 C 420 440 700 330 890 150" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
<path d="M120 455 C 430 445 690 350 880 170" fill="none" stroke="var(--accent)" stroke-width="7"/>
<path d="M330 452 C 520 448 720 400 880 280" fill="none" stroke="var(--warn)" stroke-width="7"/>
<circle cx="120" cy="455" r="8" fill="var(--accent)"/>
<circle cx="330" cy="452" r="8" fill="var(--warn)"/>
<text class="g" x="700" y="150" style="fill:var(--accent)">出生就開戶</text>
<text class="g" x="700" y="262" style="fill:var(--warn)">等爸媽去開戶</text>
<text class="s" x="134" y="150">被錯過的</text>
<text class="s" x="134" y="174">前三分之一</text>
<text class="s" x="106" y="492">出生</text>
<text class="s" x="848" y="492">十八歲</text>
<text class="s" x="60" y="112">帳戶</text>
<text class="c" x="60" y="534">坡的前面最便宜，也最容易被放掉</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="相同大小的取水量方塊放在兩塊厚薄差距極大的地層上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:700;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .s{font-size:15px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
    .w{font-size:16px;font-weight:700;fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="56" y="56">同樣的取水量，兩種風險</text>
<rect x="56" y="88" width="400" height="404" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="504" y="88" width="400" height="404" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="80" y="128">水源充足的流域</text>
<text class="g" x="528" y="128">缺水、搶水的流域</text>
<rect x="196" y="168" width="120" height="120" rx="6" fill="var(--accent)"/>
<rect x="644" y="168" width="120" height="120" rx="6" fill="var(--accent)"/>
<text class="b" x="216" y="312">取水量</text>
<text class="b" x="664" y="312">取水量</text>
<path d="M256 300 L256 336" stroke="var(--dim)" stroke-width="2"/>
<path d="M704 300 L704 336" stroke="var(--dim)" stroke-width="2"/>
<path d="M248 330 L256 344 L264 330 Z" fill="var(--dim)"/>
<path d="M696 330 L704 344 L712 330 Z" fill="var(--dim)"/>
<rect x="80" y="352" width="352" height="112" rx="6" fill="var(--accent)" opacity="0.28"/>
<rect x="528" y="436" width="352" height="28" rx="6" fill="var(--warn)" opacity="0.4"/>
<path d="M528 400 L880 400" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="96" y="392">當地餘裕</text>
<text class="w" x="544" y="424">當地餘裕</text>
<text class="s" x="96" y="440">流域穩定・韌性高</text>
<text class="s" x="544" y="392">產業搶水・流域脆弱</text>
<text class="c" x="56" y="548">量一樣，餘裕不一樣</text>
<text class="b" x="56" y="580">金融機構問的是後面那一格</text>
</svg>
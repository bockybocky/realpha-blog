<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左邊三格中一格藍色，右邊三十格中一格藍色，比較資料中心佔比">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">同一座資料中心，攤給多少人</text>
<rect x="690" y="80" width="18" height="18" fill="var(--accent)"/>
<text x="716" y="95" font-size="16" fill="var(--dim)">資料中心 1 吉瓦</text>
<text x="250" y="150" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">小型電力公司</text>
<rect x="125" y="230" width="80" height="80" fill="var(--accent)"/>
<rect x="210" y="230" width="80" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="295" y="230" width="80" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="250" y="410" font-size="16" fill="var(--dim)" text-anchor="middle">系統尖峰 3 吉瓦</text>
<text x="250" y="452" font-size="22" font-weight="700" fill="var(--accent)" text-anchor="middle">補貼 20–50%</text>
<text x="680" y="150" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">全州（示意）</text>
<g fill="var(--card)" stroke="var(--line)" stroke-width="1.5">
<rect x="557" y="170" width="36" height="36"/><rect x="599" y="170" width="36" height="36"/><rect x="641" y="170" width="36" height="36"/><rect x="683" y="170" width="36" height="36"/><rect x="725" y="170" width="36" height="36"/><rect x="767" y="170" width="36" height="36"/>
<rect x="557" y="212" width="36" height="36"/><rect x="599" y="212" width="36" height="36"/><rect x="641" y="212" width="36" height="36"/><rect x="683" y="212" width="36" height="36"/><rect x="725" y="212" width="36" height="36"/><rect x="767" y="212" width="36" height="36"/>
<rect x="557" y="254" width="36" height="36"/><rect x="599" y="254" width="36" height="36"/><rect x="641" y="254" width="36" height="36"/><rect x="683" y="254" width="36" height="36"/><rect x="725" y="254" width="36" height="36"/><rect x="767" y="254" width="36" height="36"/>
<rect x="557" y="296" width="36" height="36"/><rect x="599" y="296" width="36" height="36"/><rect x="641" y="296" width="36" height="36"/><rect x="683" y="296" width="36" height="36"/><rect x="725" y="296" width="36" height="36"/><rect x="767" y="296" width="36" height="36"/>
<rect x="557" y="338" width="36" height="36"/><rect x="599" y="338" width="36" height="36"/><rect x="641" y="338" width="36" height="36"/><rect x="683" y="338" width="36" height="36"/><rect x="725" y="338" width="36" height="36"/><rect x="767" y="338" width="36" height="36"/>
</g>
<rect x="557" y="170" width="36" height="36" fill="var(--accent)"/>
<text x="680" y="410" font-size="16" fill="var(--dim)" text-anchor="middle">佔比很小</text>
<text x="680" y="452" font-size="22" font-weight="700" fill="var(--warn)" text-anchor="middle">補到零做不到</text>
<line x1="480" y1="140" x2="480" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="530" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">佔比越大，補得越多</text>
</svg>
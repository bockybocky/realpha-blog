<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="同一個市場的兩根柱子，換經營的人之前矮，之後高出一倍多。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <g style="font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
    <text x="40" y="52" font-size="27" font-weight="700" fill="var(--ink)">同一批球迷，換了經營的人</text>

    <line x1="140" y1="430" x2="820" y2="430" stroke="var(--line)" stroke-width="2"/>

    <rect x="280" y="294" width="140" height="136" fill="var(--grey)" opacity="0.5" stroke="var(--dim)" stroke-width="2"/>
    <text x="350" y="276" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">150 億</text>
    <text x="350" y="464" font-size="19" fill="var(--dim)" text-anchor="middle">之前</text>

    <rect x="560" y="130" width="140" height="300" fill="var(--accent)" opacity="0.3" stroke="var(--accent)" stroke-width="2"/>
    <text x="630" y="112" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">330 億</text>
    <text x="630" y="464" font-size="19" fill="var(--accent)" text-anchor="middle">之後</text>

    <text x="140" y="180" font-size="19" fill="var(--dim)">ESCON</text>
    <text x="480" y="504" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">市場沒變，人變了</text>
  </g>
</svg>
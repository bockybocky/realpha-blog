<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="成本上升在一個路口分岔：接進薪水就繞成循環，接不進去就落下成為一次性的加稅。">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t h" x="60" y="66">那個路口</text>
<rect x="60" y="250" width="170" height="80" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="84" y="286" fill="var(--ink)">能源 · 關稅</text>
<text class="t b" x="84" y="312">成本上升</text>
<path d="M230 290 H330" stroke="var(--grey)" stroke-width="4"/>
<path d="M430 240 L530 290 L430 340 L330 290 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="364" y="285" fill="var(--ink)">進到</text>
<text class="t g" x="364" y="309" fill="var(--ink)">薪水？</text>
<path d="M530 280 L600 180 H700" stroke="var(--warn)" stroke-width="4" fill="none"/>
<text class="t g" x="548" y="212" fill="var(--warn)">進去了</text>
<path d="M700 180 a60 48 0 1 1 0 96 a60 48 0 1 1 0 -96" fill="none" stroke="var(--warn)" stroke-width="4"/>
<path d="M760 228 l-12 -16 l24 0 Z" fill="var(--warn)"/>
<text class="t g" x="836" y="206" fill="var(--warn)">自我循環</text>
<text class="t b" x="836" y="232">薪資</text>
<text class="t b" x="836" y="254">價格</text>
<text class="t b" x="836" y="276">薪資</text>
<path d="M530 300 L620 400 H700" stroke="var(--accent)" stroke-width="4" fill="none"/>
<text class="t g" x="548" y="382" fill="var(--accent)">接不住</text>
<rect x="700" y="364" width="190" height="86" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="t g" x="722" y="400" fill="var(--accent)">等同一次加稅</text>
<text class="t b" x="722" y="428">壓的是需求</text>
<text class="t c" x="60" y="516">同一記成本，兩種性質</text>
</svg>
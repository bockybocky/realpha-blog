<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四層金字塔，頂層窄而嚴、底層寬而鬆">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<defs><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">四級風險</text>
<polygon points="420,120 540,120 615,200 345,200" fill="var(--warn)" fill-opacity="0.18" stroke="var(--warn)" stroke-width="2"/>
<polygon points="345,200 615,200 690,280 270,280" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
<polygon points="270,280 690,280 765,360 195,360" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="195,360 765,360 840,440 120,440" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="480" y="172" text-anchor="middle">不可接受　禁止</text>
<text class="g" x="480" y="252" text-anchor="middle">高風險　嚴格義務</text>
<text class="g" x="480" y="332" text-anchor="middle">有限風險　透明義務</text>
<text class="g" x="480" y="412" text-anchor="middle">最低風險　幾乎不管</text>
<line x1="90" y1="430" x2="90" y2="140" stroke="var(--dim)" stroke-width="2" marker-end="url(#a6)"/>
<text class="s" x="70" y="290" text-anchor="middle" transform="rotate(-90 70 290)">管得越嚴</text>
<line x1="880" y1="150" x2="880" y2="430" stroke="var(--dim)" stroke-width="2" marker-end="url(#a6)"/>
<text class="s" x="906" y="290" text-anchor="middle" transform="rotate(-90 906 290)">數量越多</text>
<text class="c" x="60" y="500">越上面越嚴　越下面越多</text>
</svg>
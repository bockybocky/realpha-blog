<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Software engineering is clearly the highest of the three bars, while engineering, transportation, and making and art, music, and film are nearly equal in height beside it.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">Share of the top category</text>

<line x1="120" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>

<rect x="170" y="130" width="160" height="270" rx="6" fill="var(--accent)"/>
<text class="g" x="196" y="116">13.4%</text>
<text class="b" x="176" y="430">Software engineering</text>
<text class="b" x="176" y="454">And programming languages</text>

<rect x="420" y="227" width="160" height="173" rx="6" fill="var(--grey)"/>
<text class="g" x="448" y="213">8.6%</text>
<text class="b" x="426" y="430">Engineering, transport</text>
<text class="b" x="426" y="454">And making</text>

<rect x="670" y="229" width="160" height="171" rx="6" fill="var(--grey)"/>
<text class="g" x="698" y="213">8.5%</text>
<text class="b" x="676" y="430">Art, comedy</text>
<text class="b" x="676" y="454">Music and film</text>

<text class="c" x="60" y="506">The two bars on the right are nearly equal</text>
</svg>
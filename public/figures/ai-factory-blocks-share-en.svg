<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="An AI factory split into five blocks in a row: the largest, compute, turns gray to show customers build it themselves, while interconnect, storage, and networking racks stay with the same supplier, and the memory block at the end is dashed to show it is unproven">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.w{font-size:16px;fill:var(--page)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">Compute is just one block</text>
<rect x="60" y="120" width="840" height="230" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="80" y="152">An AI factory</text>
<rect x="90" y="180" width="240" height="120" rx="10" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="g" x="210" y="235" text-anchor="middle" fill="var(--dim)">Compute</text>
<text class="b" x="210" y="264" text-anchor="middle">In-house</text>
<rect x="342" y="180" width="140" height="120" rx="10" fill="var(--accent)"/>
<text class="w" x="412" y="246" text-anchor="middle">Interconnect</text>
<rect x="494" y="180" width="130" height="120" rx="10" fill="var(--accent)"/>
<text class="w" x="559" y="246" text-anchor="middle">Storage</text>
<rect x="636" y="180" width="150" height="120" rx="10" fill="var(--accent)"/>
<text class="w" x="711" y="246" text-anchor="middle">Network racks</text>
<rect x="798" y="180" width="72" height="120" rx="10" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
<text class="b" x="834" y="246" text-anchor="middle" fill="var(--warn)">Memory</text>
<rect x="60" y="386" width="18" height="18" rx="4" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 5"/>
<text class="b" x="90" y="401">Taken by customers</text>
<rect x="60" y="420" width="18" height="18" rx="4" fill="var(--accent)"/>
<text class="b" x="90" y="435">Same supplier</text>
<rect x="440" y="420" width="18" height="18" rx="4" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="6 5"/>
<text class="b" x="470" y="435">Own spec, unproven</text>
<text class="c" x="60" y="494">Your block, the rest is mine</text>
</svg>
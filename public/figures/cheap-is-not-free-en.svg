<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the price axis, AI stops at cheap, and the free end is still a gap away.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="54" font-size="27" font-weight="700" fill="var(--ink)">Where AI sits, still short of free</text>
<rect x="60" y="110" width="840" height="240" fill="var(--card)"/>
<line x1="110" y1="260" x2="850" y2="260" stroke="var(--ink)" stroke-width="3"/>
<text x="110" y="300" font-size="16" fill="var(--dim)">Expensive</text>
<text x="850" y="300" font-size="16" fill="var(--dim)" text-anchor="end">Free</text>
<circle cx="150" cy="260" r="10" fill="var(--grey)"/>
<text x="150" y="232" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">Big budget</text>
<circle cx="360" cy="260" r="10" fill="var(--grey)"/>
<text x="360" y="232" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">Mid-budget</text>
<circle cx="560" cy="260" r="13" fill="var(--accent)"/>
<text x="560" y="228" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">AI-made</text>
<text x="560" y="332" font-size="16" fill="var(--dim)" text-anchor="middle">Cheap</text>
<circle cx="830" cy="260" r="13" fill="var(--warn)"/>
<text x="830" y="222" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="end">Free, by everyone</text>
<text x="830" y="332" font-size="16" fill="var(--dim)" text-anchor="end">Ranked to your taste</text>
<path d="M573 190 L817 190" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M573 182 L573 198" stroke="var(--warn)" stroke-width="2"/>
<path d="M817 182 L817 198" stroke="var(--warn)" stroke-width="2"/>
<text x="695" y="174" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Gap not crossed</text>
<text x="60" y="424" font-size="22" font-weight="700" fill="var(--ink)">The bar to clear is free, not cheap.</text>
<text x="60" y="458" font-size="16" fill="var(--dim)">And daily viewing hours are finite</text>
</svg>
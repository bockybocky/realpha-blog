<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="同一把鑰匙對左門的鎖孔吻合，對右門的鎖孔形狀不合">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="48" y="62">同一把鑰匙，門換過鎖</text>

<rect x="80" y="130" width="200" height="260" fill="var(--card)" stroke="var(--accent)" stroke-width="4"/>
<circle cx="200" cy="240" r="26" fill="var(--accent)"/>
<rect x="190" y="240" width="20" height="46" fill="var(--accent)"/>
<text class="g" x="80" y="118">1930 年代</text>
<text class="b" x="80" y="428">送貨的人願意待下來</text>

<rect x="680" y="130" width="200" height="260" fill="var(--card)" stroke="var(--warn)" stroke-width="4"/>
<polygon points="780,210 816,276 744,276" fill="var(--warn)"/>
<text class="g" x="680" y="118">1970 年代</text>
<text class="b" x="680" y="428">要有懂電腦的人</text>

<circle cx="470" cy="250" r="30" fill="none" stroke="var(--ink)" stroke-width="10"/>
<rect x="470" y="242" width="110" height="16" fill="var(--ink)"/>
<rect x="540" y="258" width="14" height="22" fill="var(--ink)"/>
<rect x="566" y="258" width="14" height="22" fill="var(--ink)"/>
<text class="g" x="412" y="330">內部晉升</text>

<polyline points="404,200 316,200" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polygon points="316,188 288,200 316,212" fill="var(--accent)"/>
<polyline points="600,200 652,200" fill="none" stroke="var(--grey)" stroke-width="4" stroke-dasharray="10 7"/>
<line x1="604" y1="152" x2="640" y2="188" stroke="var(--warn)" stroke-width="6"/>
<line x1="640" y1="152" x2="604" y2="188" stroke="var(--warn)" stroke-width="6"/>

<text class="c" x="48" y="484">文化不會提醒你它過期了</text>
</svg>
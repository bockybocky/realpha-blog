<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A timeline shows a solid compute bar at the end of 2027 and a dashed incremental bar for 2028, with a leftward arrow pushing the decision point back to mid-2027.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="58" font-size="27" fill="var(--ink)">Working back from the gigawatts</text>
<line x1="90" y1="400" x2="920" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="420" y="250" width="160" height="150" fill="var(--accent)" opacity="0.85"/>
<text x="500" y="238" font-size="20" fill="var(--accent)" text-anchor="middle">50 GW</text>
<text x="500" y="330" font-size="16" fill="var(--page)" text-anchor="middle">Grid can carry it</text>
<text x="500" y="430" font-size="19" fill="var(--dim)" text-anchor="middle">End of 2027</text>
<rect x="660" y="250" width="160" height="150" fill="var(--accent)" opacity="0.85"/>
<rect x="660" y="115" width="160" height="135" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="740" y="104" font-size="20" fill="var(--warn)" text-anchor="middle">+40–50 more</text>
<text x="740" y="190" font-size="16" fill="var(--warn)" text-anchor="middle">Still moving</text>
<text x="740" y="430" font-size="19" fill="var(--dim)" text-anchor="middle">2028</text>
<line x1="240" y1="110" x2="240" y2="400" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="240" y="100" font-size="20" fill="var(--accent)" text-anchor="middle">Decision point</text>
<text x="240" y="430" font-size="19" fill="var(--accent)" text-anchor="middle">Mid-2027</text>
<polyline points="415,180 262,180" fill="none" stroke="var(--dim)" stroke-width="2"/>
<polygon points="248,180 266,172 266,188" fill="var(--dim)"/>
<text x="340" y="165" font-size="16" fill="var(--dim)" text-anchor="middle">Equipment lead time 12–18 months</text>
<polyline points="112,470 232,470" fill="none" stroke="var(--grey)" stroke-width="2"/>
<polygon points="240,470 224,463 224,477" fill="var(--grey)"/>
<text x="176" y="497" font-size="16" fill="var(--dim)" text-anchor="middle">Six to eight months</text>
<text x="100" y="430" font-size="19" fill="var(--dim)">Today</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The left is a saw-toothed line running along a horizontal baseline, the right a curve that dips deep before turning upward, with a clear gap in both dip depth and end height.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; font-weight:700; }
    .bd  { font-size:16px; fill:var(--dim); }
    .cc  { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t ttl" x="60" y="62">Same question, two shapes of shareholder answer</text>

  <rect x="60" y="95" width="400" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="95" width="400" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="t grp" x="90" y="135" fill="var(--dim)">Thousands of shareholders</text>
  <text class="t grp" x="530" y="135" fill="var(--accent)">One large shareholder</text>

  <line x1="90" y1="290" x2="430" y2="290" stroke="var(--line)" stroke-width="2"/>
  <line x1="530" y1="290" x2="870" y2="290" stroke="var(--line)" stroke-width="2"/>

  <path d="M100,290 L150,262 L200,300 L250,264 L300,302 L350,266 L400,298 L430,282"
        fill="none" stroke="var(--grey)" stroke-width="4"/>
  <text class="t bd" x="100" y="235">Answer every quarter</text>
  <text class="t bd" x="100" y="345">Spread the spending</text>

  <path d="M530,282 C580,282 606,400 660,418 C716,436 760,330 800,250 C826,200 846,176 870,168"
        fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text class="t bd" x="596" y="448">Dig deep at once</text>
  <text class="t bd" x="782" y="200">To hundreds</text>

  <text class="t cc" x="60" y="505">Whether it's good is one question, spending now is another</text>
</svg>
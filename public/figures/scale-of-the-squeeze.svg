<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="按面積等比畫的兩個方塊，公債市場的方塊大到旁邊那個一兆的小方塊只有它的角落大小">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink)}
.ga{font-size:19px;fill:var(--accent)}
.b{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">量級差在哪裡</text>
<rect x="80" y="110" width="560" height="330" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="104" y="150">美國公債市場</text>
<text class="g" x="104" y="178">31 兆</text>
<rect x="80" y="419" width="560" height="21" fill="var(--accent)" opacity="0.4"/>
<line x1="646" y1="429" x2="700" y2="429" stroke="var(--grey)" stroke-width="1.5"/>
<text class="b" x="708" y="434">每年 2 兆</text>
<rect x="790" y="363" width="77" height="77" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
<text class="b" x="790" y="342">資料中心債</text>
<text class="b" x="790" y="322">約 1 兆</text>
<text class="c" x="60" y="510">擠壓來自財政部，不是來自那幾家業者</text>
</svg>
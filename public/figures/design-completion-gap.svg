<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條橫條比較：自評完成度約一半，事後回看只剩很短一截">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="48" y="66" font-size="27" fill="var(--ink)">「設計完成」的兩種讀法</text>
<rect x="140" y="150" width="720" height="52" fill="var(--card)" stroke="var(--line)"/>
<rect x="140" y="150" width="360" height="52" fill="var(--accent)"/>
<text x="140" y="134" font-size="19" fill="var(--dim)">2006 年自評</text>
<text x="516" y="183" font-size="16" fill="var(--ink)">約五成</text>
<rect x="140" y="290" width="720" height="52" fill="var(--card)" stroke="var(--line)"/>
<rect x="140" y="290" width="36" height="52" fill="var(--warn)"/>
<text x="140" y="274" font-size="19" fill="var(--dim)">事後回看</text>
<text x="192" y="323" font-size="16" fill="var(--ink)">約百分之五</text>
<line x1="140" y1="380" x2="860" y2="380" stroke="var(--line)"/>
<text x="140" y="410" font-size="16" fill="var(--dim)">安全相關部件</text>
<text x="500" y="410" font-size="16" fill="var(--grey)">一萬七千條電纜的走法</text>
<text x="48" y="478" font-size="22" fill="var(--ink)">差四分之三英寸，就還沒完成</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Fifty small dots in a grid with only one lit up, and to the right a single carefully made dot on its own.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .k { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="h" x="60" y="66">Volume buys the one hit</text>

<rect x="60" y="110" width="560" height="270" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="88" y="150">AI account: 50 posts a day</text>
<g fill="var(--grey)">
  <circle cx="110" cy="200" r="12"/><circle cx="160" cy="200" r="12"/><circle cx="210" cy="200" r="12"/><circle cx="260" cy="200" r="12"/><circle cx="310" cy="200" r="12"/><circle cx="360" cy="200" r="12"/><circle cx="410" cy="200" r="12"/><circle cx="460" cy="200" r="12"/><circle cx="510" cy="200" r="12"/><circle cx="560" cy="200" r="12"/>
  <circle cx="110" cy="240" r="12"/><circle cx="160" cy="240" r="12"/><circle cx="210" cy="240" r="12"/><circle cx="260" cy="240" r="12"/><circle cx="310" cy="240" r="12"/><circle cx="360" cy="240" r="12"/><circle cx="410" cy="240" r="12"/><circle cx="460" cy="240" r="12"/><circle cx="510" cy="240" r="12"/><circle cx="560" cy="240" r="12"/>
  <circle cx="110" cy="280" r="12"/><circle cx="160" cy="280" r="12"/><circle cx="210" cy="280" r="12"/><circle cx="260" cy="280" r="12"/><circle cx="360" cy="280" r="12"/><circle cx="410" cy="280" r="12"/><circle cx="460" cy="280" r="12"/><circle cx="510" cy="280" r="12"/><circle cx="560" cy="280" r="12"/>
  <circle cx="110" cy="320" r="12"/><circle cx="160" cy="320" r="12"/><circle cx="210" cy="320" r="12"/><circle cx="260" cy="320" r="12"/><circle cx="310" cy="320" r="12"/><circle cx="360" cy="320" r="12"/><circle cx="410" cy="320" r="12"/><circle cx="460" cy="320" r="12"/><circle cx="510" cy="320" r="12"/><circle cx="560" cy="320" r="12"/>
  <circle cx="110" cy="360" r="12"/><circle cx="160" cy="360" r="12"/><circle cx="210" cy="360" r="12"/><circle cx="260" cy="360" r="12"/><circle cx="310" cy="360" r="12"/><circle cx="360" cy="360" r="12"/><circle cx="410" cy="360" r="12"/><circle cx="460" cy="360" r="12"/><circle cx="510" cy="360" r="12"/><circle cx="560" cy="360" r="12"/>
</g>
<circle cx="310" cy="280" r="18" fill="var(--accent)"/>
<text class="s" x="310" y="256" text-anchor="middle">Hit</text>

<rect x="660" y="110" width="240" height="270" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="688" y="150">Human: 1 a day</text>
<circle cx="780" cy="270" r="18" fill="var(--warn)"/>
<text class="s" x="780" y="320" text-anchor="middle">Can't afford the odds</text>

<text class="k" x="60" y="450">It runs on confusion, not craft</text>
<text class="s" x="60" y="480">Fake behind-the-scenes clips borrow the proof-it's-real framing</text>
</svg>
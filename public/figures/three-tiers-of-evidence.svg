<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三級高度不同的階梯：知情人士轉述最矮，主持人推論居中，公開論文最高">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">同一件事，三種硬度</text>

  <line x1="60" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="3"/>

  <rect x="110" y="330" width="240" height="70" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="134" y="372" font-size="19" fill="var(--grey)">兩名知情人士</text>
  <text x="134" y="434" font-size="16" fill="var(--dim)">公司未確認</text>
  <text x="134" y="462" font-size="16" fill="var(--dim)">轉述</text>

  <rect x="372" y="250" width="240" height="150" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="396" y="332" font-size="19" fill="var(--warn)">主持人的推論</text>
  <text x="396" y="434" font-size="16" fill="var(--dim)">他自己標了</text>
  <text x="396" y="462" font-size="16" fill="var(--dim)">聽起來合理</text>

  <rect x="634" y="150" width="240" height="250" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="658" y="282" font-size="19" fill="var(--accent)">公開論文</text>
  <text x="658" y="434" font-size="16" fill="var(--dim)">署名、可查</text>
  <text x="658" y="462" font-size="16" fill="var(--dim)">紙本</text>

  <text x="48" y="112" font-size="16" fill="var(--dim)">越高越硬</text>
  <text x="48" y="500" font-size="22" fill="var(--ink)">疊在一起讀，最矮那階會長到最高。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-label="On the left, four bars rise with age; on the right, four gray bars are equal in height, each topped by a blue segment of varying height.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="590" fill="var(--page)"/>
<text x="480" y="56" text-anchor="middle" class="t">Knowledge inflation</text>
<text x="260" y="130" text-anchor="middle" class="g">Before</text>
<text x="260" y="156" text-anchor="middle" class="s">Age = more</text>
<text x="700" y="130" text-anchor="middle" class="g">Now</text>
<text x="700" y="156" text-anchor="middle" class="s">AI evens it</text>
<rect x="110" y="380" width="50" height="70" fill="var(--grey)"/>
<rect x="190" y="330" width="50" height="120" fill="var(--grey)"/>
<rect x="270" y="280" width="50" height="170" fill="var(--grey)"/>
<rect x="350" y="230" width="50" height="220" fill="var(--grey)"/>
<rect x="550" y="290" width="50" height="160" fill="var(--grey)"/>
<rect x="630" y="290" width="50" height="160" fill="var(--grey)"/>
<rect x="710" y="290" width="50" height="160" fill="var(--grey)"/>
<rect x="790" y="290" width="50" height="160" fill="var(--grey)"/>
<rect x="550" y="240" width="50" height="50" fill="var(--accent)"/>
<rect x="630" y="275" width="50" height="15" fill="var(--accent)"/>
<rect x="710" y="220" width="50" height="70" fill="var(--accent)"/>
<rect x="790" y="260" width="50" height="30" fill="var(--accent)"/>
<line x1="80" y1="450" x2="440" y2="450" stroke="var(--dim)" stroke-width="2"/>
<line x1="520" y1="450" x2="880" y2="450" stroke="var(--dim)" stroke-width="2"/>
<text x="135" y="476" text-anchor="middle" class="s">25y</text>
<text x="215" y="476" text-anchor="middle" class="s">35y</text>
<text x="295" y="476" text-anchor="middle" class="s">45y</text>
<text x="375" y="476" text-anchor="middle" class="s">55y</text>
<text x="575" y="476" text-anchor="middle" class="s">25y</text>
<text x="655" y="476" text-anchor="middle" class="s">35y</text>
<text x="735" y="476" text-anchor="middle" class="s">45y</text>
<text x="815" y="476" text-anchor="middle" class="s">55y</text>
<rect x="290" y="504" width="18" height="18" fill="var(--grey)"/>
<text x="316" y="519" class="b">Knowledge</text>
<rect x="420" y="504" width="18" height="18" fill="var(--accent)"/>
<text x="446" y="519" class="b">Exp + learning</text>
<text x="480" y="568" text-anchor="middle" class="c">Gap is the top</text>
</svg>
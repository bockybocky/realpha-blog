<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條並排的順序列，每條由多個方塊組成，最後一格在兩條上都對齊同一個位置並被標示">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">同一棒，排在同一個位置</text>

<rect x="60" y="88" width="840" height="300" fill="var(--card)" rx="10"/>

<text class="g" x="92" y="156">上一輪</text>
<rect x="212" y="130" width="92" height="40" rx="6" fill="var(--grey)" opacity="0.5"/>
<rect x="320" y="130" width="92" height="40" rx="6" fill="var(--grey)" opacity="0.5"/>
<rect x="428" y="130" width="92" height="40" rx="6" fill="var(--grey)" opacity="0.5"/>
<rect x="536" y="130" width="92" height="40" rx="6" fill="var(--grey)" opacity="0.5"/>
<rect x="644" y="130" width="92" height="40" rx="6" fill="var(--accent)" opacity="0.8"/>
<polygon points="752,138 752,162 776,150" fill="var(--grey)"/>

<text class="g" x="92" y="266">這一輪</text>
<rect x="212" y="240" width="92" height="40" rx="6" fill="var(--grey)" opacity="0.5"/>
<rect x="320" y="240" width="92" height="40" rx="6" fill="var(--grey)" opacity="0.5"/>
<rect x="428" y="240" width="92" height="40" rx="6" fill="var(--grey)" opacity="0.5"/>
<rect x="536" y="240" width="92" height="40" rx="6" fill="var(--grey)" opacity="0.5"/>
<rect x="644" y="240" width="92" height="40" rx="6" fill="var(--accent)" opacity="0.8"/>
<polygon points="752,248 752,272 776,260" fill="var(--grey)"/>

<line x1="690" y1="112" x2="690" y2="300" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>
<text class="b" x="612" y="332" fill="var(--warn)">最後才動的那一格</text>
<text class="b" x="212" y="332">前面輪完的題材</text>

<text class="c" x="60" y="444">看得出順序，不等於還有空間——</text>
<text class="c" x="60" y="474">它站的位置，本來就是隊伍的尾巴。</text>
</svg>
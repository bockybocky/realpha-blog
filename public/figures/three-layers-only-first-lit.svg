<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三級由低到高的階梯，只有最低一階是亮色並有箭頭指著，上面兩階都是灰色">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">新技術的三階，證據只蓋到第一階</text>
<rect x="150" y="330" width="210" height="120" rx="8" fill="var(--accent)"/>
<text x="255" y="372" font-size="20" fill="var(--page)" text-anchor="middle">能力到了</text>
<text x="255" y="402" font-size="16" fill="var(--page)" text-anchor="middle">這集的證據</text>
<rect x="380" y="250" width="210" height="200" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="485" y="300" font-size="20" fill="var(--dim)" text-anchor="middle">成本降了</text>
<text x="485" y="330" font-size="16" fill="var(--dim)" text-anchor="middle">還沒動</text>
<rect x="610" y="170" width="210" height="280" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="715" y="226" font-size="20" fill="var(--dim)" text-anchor="middle">擴散開了</text>
<text x="715" y="256" font-size="16" fill="var(--dim)" text-anchor="middle">還沒動</text>
<line x1="150" y1="460" x2="820" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="255" y1="300" x2="255" y2="322" stroke="var(--accent)" stroke-width="3"/>
<polygon points="255,330 243,306 267,306" fill="var(--accent)"/>
<text x="255" y="286" font-size="19" fill="var(--accent)" text-anchor="middle">新聞停在這裡</text>
<text x="480" y="524" font-size="22" fill="var(--ink)" text-anchor="middle">把第一階的好消息讀成第三階的時間表，就會錯</text>
</g>
</svg>
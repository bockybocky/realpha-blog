<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩格對比，房間裡的三個視窗在門開與門關兩種狀態下都一樣存在">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); font-weight:700; }
    .bd  { font-size:15px; fill:var(--dim); }
    .cc  { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="ttl" x="60" y="60">門開門關，房間一樣</text>

<text class="grp" x="70" y="120">手機開著</text>
<rect x="70" y="140" width="380" height="230" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="180" width="300" height="150" rx="10" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="130" y="210" width="76" height="60" rx="6" fill="none" stroke="var(--ink)" stroke-width="2"/>
<rect x="222" y="210" width="76" height="60" rx="6" fill="none" stroke="var(--ink)" stroke-width="2"/>
<rect x="314" y="210" width="76" height="60" rx="6" fill="none" stroke="var(--ink)" stroke-width="2"/>
<rect x="62" y="220" width="16" height="80" rx="4" fill="var(--accent)"/>
<text class="bd" x="260" y="306" text-anchor="middle">三個視窗在跑</text>
<text class="bd" x="260" y="352" text-anchor="middle">門開著</text>

<text class="grp" x="510" y="120">App 關掉</text>
<rect x="510" y="140" width="380" height="230" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="550" y="180" width="300" height="150" rx="10" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="570" y="210" width="76" height="60" rx="6" fill="none" stroke="var(--ink)" stroke-width="2"/>
<rect x="662" y="210" width="76" height="60" rx="6" fill="none" stroke="var(--ink)" stroke-width="2"/>
<rect x="754" y="210" width="76" height="60" rx="6" fill="none" stroke="var(--ink)" stroke-width="2"/>
<rect x="502" y="220" width="16" height="80" rx="4" fill="var(--grey)"/>
<text class="bd" x="700" y="306" text-anchor="middle">三個視窗在跑</text>
<text class="bd" x="700" y="352" text-anchor="middle">門關上</text>

<text class="cc" x="480" y="450" text-anchor="middle">關的是門，不是工作</text>
</svg>
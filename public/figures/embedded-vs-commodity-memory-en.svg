<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the left, logic and memory cells sit inside the same chip; on the right, memory chips stand alone and are sold separately.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">The memory TSMC makes vs. the memory everyone cares about</text>

  <line x1="480" y1="100" x2="480" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>

  <text x="48" y="130" font-size="20" fill="var(--accent)">Embedded</text>
  <rect x="48" y="150" width="380" height="230" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="68" y="180" font-size="16" fill="var(--dim)">Same chip</text>
  <rect x="68" y="196" width="160" height="70" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="104" y="238" font-size="16" fill="var(--ink)">Logic transistors</text>
  <rect x="246" y="196" width="162" height="70" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text x="297" y="238" font-size="16" fill="var(--ink)">Memory cells</text>
  <text x="68" y="300" font-size="16" fill="var(--dim)">SRAM</text>
  <text x="148" y="300" font-size="16" fill="var(--dim)">Embedded DRAM</text>
  <text x="68" y="330" font-size="16" fill="var(--dim)">STT-MRAM</text>
  <text x="188" y="330" font-size="16" fill="var(--dim)">ReRAM</text>
  <text x="68" y="362" font-size="16" fill="var(--ink)">Already does this</text>

  <text x="528" y="130" font-size="20" fill="var(--warn)">Commodity</text>
  <rect x="528" y="196" width="110" height="70" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="556" y="238" font-size="16" fill="var(--ink)">DRAM</text>
  <rect x="656" y="196" width="110" height="70" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="692" y="238" font-size="16" fill="var(--ink)">Flash</text>
  <rect x="784" y="196" width="110" height="70" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="818" y="238" font-size="16" fill="var(--ink)">DRAM</text>
  <text x="528" y="180" font-size="16" fill="var(--dim)">Sold on its own</text>
  <text x="528" y="310" font-size="16" fill="var(--dim)">Korea's turf</text>
  <text x="528" y="340" font-size="16" fill="var(--dim)">Unchallenged for over a decade</text>
  <text x="528" y="372" font-size="16" fill="var(--warn)">Does not do this</text>

  <text x="48" y="448" font-size="22" fill="var(--ink)">The gap is not making memory, it is selling memory.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two rising lines diverge, and the shading between the steeper upper line and the lower one is the gap the hedge does not cover." style="font-family:&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="80" y="72" font-size="27" fill="var(--ink)">The oil you hedge versus the oil you burn</text>

<line x1="180" y1="460" x2="820" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="180" y1="460" x2="180" y2="130" stroke="var(--line)" stroke-width="2"/>
<text x="180" y="492" font-size="15" fill="var(--dim)" text-anchor="middle">February</text>
<text x="820" y="492" font-size="15" fill="var(--dim)" text-anchor="middle">Now</text>

<path d="M180 460 L820 160 L820 310 Z" fill="var(--warn)" opacity="0.14"/>
<polyline points="180,460 820,310" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="180,460 820,160" fill="none" stroke="var(--warn)" stroke-width="4"/>

<text x="832" y="316" font-size="19" fill="var(--accent)">Brent</text>
<text x="832" y="340" font-size="15" fill="var(--dim)">Hedged</text>
<text x="832" y="166" font-size="19" fill="var(--warn)">Jet fuel</text>
<text x="832" y="190" font-size="15" fill="var(--dim)">Burned</text>

<text x="600" y="258" font-size="19" fill="var(--ink)">Gap</text>
<text x="600" y="282" font-size="15" fill="var(--dim)">Not covered</text>

<text x="80" y="542" font-size="22" fill="var(--ink)">A hedge covers a proxy, not the fuel you burn</text>
</svg>
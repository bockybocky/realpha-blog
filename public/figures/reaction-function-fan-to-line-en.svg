<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Left: the reply let me think sends out a spreading dashed fan for the other side's guessing cost; right: with a time and criteria given, only one converging solid line remains">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); font-weight:700; }
    .gl { font-size:19px; fill:var(--ink); font-weight:700; }
    .bd { font-size:16px; fill:var(--dim); }
    .bs { font-size:15px; fill:var(--dim); }
    .cc { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ti" x="48" y="58">Others price your delay</text>
<rect x="48" y="100" width="400" height="360" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="512" y="100" width="400" height="360" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="gl" x="72" y="142">Reply: I'll think</text>
<text class="gl" x="536" y="142">Reply: time + test</text>
<text class="bs" x="536" y="170">By Thu · weighing A and B</text>
<circle cx="120" cy="300" r="7" fill="var(--grey)"/>
<line x1="120" y1="300" x2="380" y2="200" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="120" y1="300" x2="380" y2="250" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="120" y1="300" x2="380" y2="300" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="120" y1="300" x2="380" y2="350" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="120" y1="300" x2="380" y2="400" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="396" y1="200" x2="396" y2="400" stroke="var(--warn)" stroke-width="3"/>
<text class="bd" x="240" y="440" text-anchor="middle">Guess cost high</text>
<circle cx="584" cy="300" r="7" fill="var(--accent)"/>
<line x1="584" y1="300" x2="844" y2="300" stroke="var(--accent)" stroke-width="4"/>
<circle cx="844" cy="300" r="7" fill="var(--accent)"/>
<text class="bd" x="714" y="440" text-anchor="middle">Guess cost zero</text>
<text class="cc" x="48" y="516">Give your reaction function</text>
</svg>
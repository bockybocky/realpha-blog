<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="短債報酬長條中匯率那段佔超過一半">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); }
  .g { font-size:20px; fill:var(--ink); }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">短債的報酬來自哪裡</text>
<text class="g" x="60" y="104">過去一年還原價格 6.8%</text>

<rect x="60" y="160" width="580" height="80" rx="8" fill="var(--warn)"/>
<text class="g" x="90" y="208" fill="var(--page)">匯率 4.7%</text>
<rect x="640" y="160" width="258" height="80" rx="8" fill="var(--accent)"/>
<text class="g" x="668" y="208" fill="var(--page)">利率 2.1%</text>

<line x1="60" y1="270" x2="640" y2="270" stroke="var(--warn)"/>
<text class="b" x="60" y="300" fill="var(--warn)">一半以上不是你買它的理由</text>

<rect x="60" y="340" width="838" height="80" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="90" y="388">台幣曾在幾天內快速升值 → 這一段會反過來</text>

<text class="c" x="60" y="480">買短債，先想匯率</text>
</svg>
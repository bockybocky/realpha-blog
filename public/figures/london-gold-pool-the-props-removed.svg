<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="水平的官價線在右端分岔出一條往上離開的自由市價線，底下三根支撐柱有兩根變成灰色虛線空框">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .gd { font-size:19px; fill:var(--grey); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .bd { font-size:15px; fill:var(--grey); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="68">支撐被一層層拆掉，價格才脫鉤</text>

<line x1="90" y1="210" x2="610" y2="210" stroke="var(--grey)" stroke-width="5"/>
<line x1="610" y1="210" x2="880" y2="210" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 9"/>
<text class="g" x="100" y="192">官價</text>
<text class="b" x="100" y="246">一盎司三十五美元</text>

<polyline points="610,210 700,176 790,140 866,112" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polygon points="866,100 884,118 856,124" fill="var(--accent)"/>
<text class="g" x="700" y="156">自由市價</text>

<circle cx="610" cy="210" r="9" fill="var(--warn)"/>
<text class="b" x="596" y="282">分岔</text>

<rect x="110" y="330" width="230" height="86" rx="10" fill="var(--page)" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 9"/>
<text class="gd" x="225" y="366" text-anchor="middle">黃金擔保</text>
<text class="bd" x="225" y="394" text-anchor="middle">要求被廢除</text>

<rect x="365" y="330" width="230" height="86" rx="10" fill="var(--page)" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 9"/>
<text class="gd" x="480" y="366" text-anchor="middle">各國的美元</text>
<text class="bd" x="480" y="394" text-anchor="middle">賣出、抽走黃金</text>

<rect x="620" y="330" width="230" height="86" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="735" y="366" text-anchor="middle">政策方向</text>
<text class="b" x="735" y="394" text-anchor="middle">仍往同一邊走</text>

<text class="c" x="480" y="492" text-anchor="middle">官價不是一天崩掉的，是撐它的東西先不見了</text>
</svg>
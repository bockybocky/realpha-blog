<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一根直立柱子分四層，最底一層很薄是實際交易需要，上面三層是法規水位、預防性緩衝、借錢的污名，把柱子撐到底層的好幾倍高">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型：思源黑體優先 */
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">準備金需求是被規則墊高的</text>

<text x="245" y="115" font-size="19" fill="var(--dim)" text-anchor="middle">供給得追到這裡</text>

<rect x="150" y="130" width="190" height="70" fill="var(--warn)" fill-opacity="0.42" stroke="var(--warn)"/>
<rect x="150" y="200" width="190" height="110" fill="var(--warn)" fill-opacity="0.28" stroke="var(--warn)"/>
<rect x="150" y="310" width="190" height="110" fill="var(--warn)" fill-opacity="0.16" stroke="var(--warn)"/>
<rect x="150" y="420" width="190" height="60" fill="var(--accent)" fill-opacity="0.85" stroke="var(--accent)"/>

<line x1="340" y1="165" x2="400" y2="165" stroke="var(--line)" stroke-dasharray="4 4"/>
<line x1="340" y1="255" x2="400" y2="255" stroke="var(--line)" stroke-dasharray="4 4"/>
<line x1="340" y1="365" x2="400" y2="365" stroke="var(--line)" stroke-dasharray="4 4"/>
<line x1="340" y1="450" x2="400" y2="450" stroke="var(--line)" stroke-dasharray="4 4"/>

<text x="412" y="162" font-size="20" fill="var(--ink)">借錢的污名</text>
<text x="412" y="186" font-size="15" fill="var(--dim)">貼現窗口／日內信用</text>
<text x="412" y="252" font-size="20" fill="var(--ink)">預防性緩衝</text>
<text x="412" y="276" font-size="15" fill="var(--dim)">怕真的動用會被盯上</text>
<text x="412" y="362" font-size="20" fill="var(--ink)">流動性法規水位</text>
<text x="412" y="386" font-size="15" fill="var(--dim)">巴塞爾／陶德法蘭克</text>
<text x="412" y="447" font-size="20" fill="var(--accent)">實際交易需要</text>
<text x="412" y="471" font-size="15" fill="var(--dim)">真正用得到的那一塊</text>

<line x1="110" y1="480" x2="110" y2="134" stroke="var(--dim)" stroke-width="2"/>
<path d="M 110,126 L 105,140 L 115,140 Z" fill="var(--dim)"/>
<line x1="100" y1="480" x2="120" y2="480" stroke="var(--dim)" stroke-width="2"/>

<text x="60" y="527" font-size="22" font-weight="600" fill="var(--ink)">撐大它的不是意願，是規則</text>
</svg>
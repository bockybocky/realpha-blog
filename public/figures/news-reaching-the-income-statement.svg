<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條盈餘曲線，上方浮著兩個帶關閉符號的彈出視窗沒有碰到曲線；另一則消息用箭頭指進曲線，把後半段折得更陡">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.s { font-size:16px; fill:var(--dim); }
.g { font-size:19px; font-weight:600; }
.b { font-size:16px; }
.n { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">哪一則消息真的走進了損益表</text>
<text class="s" x="60" y="94">走不進去的，關掉就好</text>
<g>
<rect x="200" y="150" width="210" height="96" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="200" y="150" width="210" height="26" rx="8" fill="var(--line)"/>
<line x1="388" y1="157" x2="400" y2="169" stroke="var(--dim)" stroke-width="2"/>
<line x1="400" y1="157" x2="388" y2="169" stroke="var(--dim)" stroke-width="2"/>
<text class="b" x="305" y="212" text-anchor="middle" fill="var(--dim)">政治頭條</text>
</g>
<g>
<rect x="450" y="170" width="210" height="96" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="450" y="170" width="210" height="26" rx="8" fill="var(--line)"/>
<line x1="638" y1="177" x2="650" y2="189" stroke="var(--dim)" stroke-width="2"/>
<line x1="650" y1="177" x2="638" y2="189" stroke="var(--dim)" stroke-width="2"/>
<text class="b" x="555" y="232" text-anchor="middle" fill="var(--dim)">地緣事件</text>
</g>
<text class="n" x="690" y="212">關掉之後，線還在原位</text>
<path d="M120,410 C300,396 380,386 520,370" fill="none" stroke="var(--grey)" stroke-width="4"/>
<path d="M520,370 L860,272" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="520" cy="370" r="7" fill="var(--accent)"/>
<line x1="520" y1="444" x2="520" y2="388" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 5"/>
<polygon points="520,380 514,394 526,394" fill="var(--accent)"/>
<text class="g" x="520" y="472" text-anchor="middle" fill="var(--accent)">關稅</text>
<text class="n" x="520" y="496" text-anchor="middle">價格與毛利率</text>
<text class="g" x="140" y="392" fill="var(--dim)">盈餘</text>
<text class="c" x="60" y="540">先問它會出現在誰的哪一條數字上</text>
</svg>
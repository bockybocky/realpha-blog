<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Waterfall chart: 1 dollar is issued, 0.8 becomes gross T-bill demand, 0.2 is offset by money market funds, and the net increase is 0.6.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .h { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .n { font-size:16px; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text x="60" y="62" class="h">Per $1 minted</text>
<line x1="90" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="160" width="140" height="300" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="180" y="145" class="g" text-anchor="middle">1.0</text>
<rect x="320" y="220" width="140" height="240" fill="var(--accent)" opacity="0.35"/>
<text x="390" y="205" class="g" text-anchor="middle">0.8</text>
<line x1="460" y1="220" x2="530" y2="220" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="530" y="220" width="140" height="60" fill="var(--warn)" opacity="0.55"/>
<text x="600" y="205" class="g" text-anchor="middle" style="fill:var(--warn)">−0.2</text>
<line x1="670" y1="280" x2="740" y2="280" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="740" y="280" width="140" height="180" fill="var(--accent)"/>
<text x="810" y="265" class="g" text-anchor="middle" style="fill:var(--accent)">0.6</text>
<text x="180" y="492" class="n" text-anchor="middle">New</text>
<text x="390" y="492" class="n" text-anchor="middle">Gross T-bill</text>
<text x="390" y="518" class="b" text-anchor="middle">79% T-bills</text>
<text x="600" y="492" class="n" text-anchor="middle">Less</text>
<text x="600" y="518" class="b" text-anchor="middle">Money funds</text>
<text x="810" y="492" class="n" text-anchor="middle">Net</text>
<text x="810" y="518" class="b" text-anchor="middle">Dep+Intl</text>
<text x="480" y="570" class="c" text-anchor="middle">Net after shifts</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A jagged record line beside a smoothed and lifted memory line, with the troughs marked by dashes">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600;fill:var(--dim)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">Memory smooths the troughs</text>
<line x1="60" y1="106" x2="96" y2="106" stroke="var(--warn)" stroke-width="4"/>
<text class="b" x="106" y="112">Written then</text>
<line x1="260" y1="106" x2="296" y2="106" stroke="var(--accent)" stroke-width="4"/>
<text class="b" x="306" y="112">Recalled later</text>
<line x1="140" y1="440" x2="860" y2="440" stroke="var(--line)" stroke-width="2"/>
<polyline points="170,254 280,392 390,246 500,362 610,204 720,340 830,266" fill="none" stroke="var(--warn)" stroke-width="4"/>
<path d="M170,282 C330,266 500,246 830,232" fill="none" stroke="var(--accent)" stroke-width="4"/>
<line x1="280" y1="392" x2="280" y2="272" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="500" y1="362" x2="500" y2="248" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<text class="b" x="292" y="418">Sugar-coated</text>
<text class="c" x="60" y="504">Not judgment, an unedited record</text>
</svg>
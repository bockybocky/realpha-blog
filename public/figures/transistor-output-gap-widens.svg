<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩個年份的對照長條，產量差距在七年後明顯拉大">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">複製得很快，量產追不上</text>
  <line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
  <rect x="150" y="414" width="70" height="6" rx="3" fill="var(--accent)"/>
  <rect x="250" y="412" width="70" height="8" rx="3" fill="var(--grey)"/>
  <text class="b" x="150" y="400">約 250 萬</text>
  <text class="b" x="250" y="396">2,870 萬</text>
  <text class="g" x="235" y="462" text-anchor="middle">1957</text>
  <rect x="600" y="372" width="70" height="48" rx="3" fill="var(--accent)"/>
  <rect x="700" y="92" width="70" height="328" rx="3" fill="var(--grey)"/>
  <text class="b" x="600" y="358">2 億</text>
  <text class="b" x="700" y="78">13.6 億</text>
  <text class="g" x="685" y="462" text-anchor="middle">1964</text>
  <line x1="820" y1="92" x2="820" y2="420" stroke="var(--warn)" stroke-width="3"/>
  <text class="b" x="834" y="250" fill="var(--warn)">缺口</text>
  <text class="b" x="60" y="140" fill="var(--accent)">蘇聯</text>
  <text class="b" x="60" y="166" fill="var(--dim)">美國</text>
  <text class="c" x="60" y="510">電晶體化追趕的那幾年，都帶著它</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two storage tanks show the left one about 70% full and the right one just over 10% full at the end of winter.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; } .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); } .c { font-size:22px; font-weight:700; }
</style>
<defs><marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker></defs>
<text x="40" y="55" class="t">EU gas</text>
<rect x="230" y="110" width="160" height="320" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="230" y="200" width="160" height="230" fill="var(--accent)" fill-opacity="0.8"/>
<text x="310" y="185" class="g" text-anchor="middle">70%+</text>
<rect x="570" y="110" width="160" height="320" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="570" y="392" width="160" height="38" fill="var(--warn)"/>
<text x="650" y="378" class="g" text-anchor="middle" style="fill:var(--warn)">10%+</text>
<line x1="410" y1="270" x2="550" y2="270" stroke="var(--dim)" stroke-width="3" marker-end="url(#ga)"/>
<text x="480" y="255" class="b" text-anchor="middle">Normal</text>
<text x="310" y="470" class="g" text-anchor="middle">Now</text>
<text x="650" y="470" class="g" text-anchor="middle">Spring</text>
<text x="480" y="530" class="c" text-anchor="middle">Cold winter: TTF €100–150</text>
</svg>
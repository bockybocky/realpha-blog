<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="升息機率線一路爬升、股價線同段下滑，到了宣布當天兩條線都轉為水平">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="52" font-size="27" font-weight="700" fill="var(--ink)">下跌發生在哪一段</text>

  <rect x="150" y="110" width="370" height="290" rx="10" fill="var(--card)"/>
  <text x="335" y="146" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">預期形成</text>

  <line x1="120" y1="400" x2="890" y2="400" stroke="var(--line)" stroke-width="2"/>
  <text x="180" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">演講之後</text>
  <text x="500" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">會前</text>
  <text x="820" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">宣布當天</text>

  <polyline points="180,336 340,268 500,196 660,180 820,176" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <text x="700" y="160" font-size="16" fill="var(--accent)">升息機率</text>

  <polyline points="180,236 340,278 500,312 660,318 820,316" fill="none" stroke="var(--grey)" stroke-width="5"/>
  <text x="620" y="352" font-size="16" fill="var(--dim)">價格</text>

  <line x1="820" y1="150" x2="820" y2="400" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="878" y="256" font-size="16" fill="var(--warn)" text-anchor="middle">變動量</text>
  <text x="878" y="280" font-size="16" fill="var(--warn)" text-anchor="middle">接近零</text>

  <text x="480" y="504" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">價格反映的是預期的變動量</text>
</svg>
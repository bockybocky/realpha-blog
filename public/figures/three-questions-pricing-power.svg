<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三級階梯由低到高：熱鬧、有訂單、握定價權，高度隨答得出的問題數增加">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="52" font-size="27" fill="var(--ink)">缺貨和定價權，差在答得出幾題</text>
<text x="60" y="92" font-size="16" fill="var(--dim)">三題：長約寫不寫價格　報價有沒有真的動　錢有沒有留在自己手上</text>

<rect x="80" y="380" width="240" height="90" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="200" y="418" font-size="20" fill="var(--dim)" text-anchor="middle">熱鬧</text>
<text x="200" y="448" font-size="16" fill="var(--dim)" text-anchor="middle">零題</text>

<rect x="360" y="290" width="240" height="180" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="330" font-size="20" fill="var(--ink)" text-anchor="middle">有訂單</text>
<text x="480" y="360" font-size="16" fill="var(--dim)" text-anchor="middle">一題</text>

<rect x="640" y="170" width="240" height="300" rx="8" fill="var(--accent)"/>
<text x="760" y="212" font-size="20" fill="var(--page)" text-anchor="middle">握定價權</text>
<text x="760" y="242" font-size="16" fill="var(--page)" text-anchor="middle">三題</text>

<rect x="80" y="470" width="800" height="2" fill="var(--line)"/>
<text x="480" y="522" font-size="22" fill="var(--ink)" text-anchor="middle">看合約，不看缺貨新聞</text>
</svg>
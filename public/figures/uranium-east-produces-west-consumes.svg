<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條比例條的重心一條偏左一條偏右，錯開的那段就是缺口">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">產在東邊，用在西邊</text>

<text x="120" y="152" font-size="20" font-weight="700" fill="var(--ink)">產量</text>
<rect x="120" y="170" width="504" height="76" fill="var(--accent)"/>
<rect x="624" y="170" width="216" height="76" fill="var(--grey)"/>
<text x="372" y="218" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">東方 七成</text>
<text x="732" y="218" font-size="19" fill="var(--ink)" text-anchor="middle">西方 三成</text>

<text x="120" y="312" font-size="20" font-weight="700" fill="var(--ink)">消費</text>
<rect x="120" y="330" width="216" height="76" fill="var(--grey)"/>
<rect x="336" y="330" width="504" height="76" fill="var(--accent)"/>
<text x="228" y="378" font-size="19" fill="var(--ink)" text-anchor="middle">東方 三成</text>
<text x="588" y="378" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">西方 七成</text>

<line x1="624" y1="246" x2="624" y2="330" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="336" y1="246" x2="336" y2="330" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="480" y="292" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">錯開的這一塊＝西方缺口</text>

<text x="60" y="470" font-size="19" fill="var(--dim)">東方的剩餘要先餵俄羅斯、中國、印度自己的機組</text>
<text x="60" y="502" font-size="22" font-weight="700" fill="var(--ink)">可替換的大宗商品，換不過來</text>
</svg>
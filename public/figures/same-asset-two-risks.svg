<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="同一座空置資料中心，左側債權人視角風險低，右側股東視角是沉沒的資本">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">同一組資產，兩種風險</text>
<rect x="390" y="170" width="180" height="200" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="412" y="212" font-size="20" fill="var(--ink)">資料中心</text>
<text x="412" y="242" font-size="16" fill="var(--dim)">全空著</text>
<rect x="412" y="268" width="136" height="16" fill="var(--grey)" opacity="0.4"/>
<rect x="412" y="294" width="136" height="16" fill="var(--grey)" opacity="0.4"/>
<rect x="412" y="320" width="136" height="16" fill="var(--grey)" opacity="0.4"/>
<path d="M360 270 L 230 270" stroke="var(--accent)" stroke-width="4" fill="none"/>
<path d="M230 270 L 256 258 L 256 282 Z" fill="var(--accent)"/>
<text x="60" y="200" font-size="20" fill="var(--accent)">債權人看到</text>
<text x="60" y="236" font-size="16" fill="var(--dim)">廣告營收還在</text>
<text x="60" y="262" font-size="16" fill="var(--dim)">負債為零</text>
<text x="60" y="288" font-size="16" fill="var(--dim)">現金流巨大</text>
<text x="60" y="326" font-size="19" fill="var(--accent)">也沒差</text>
<path d="M600 270 L 730 270" stroke="var(--warn)" stroke-width="4" fill="none"/>
<path d="M730 270 L 704 258 L 704 282 Z" fill="var(--warn)"/>
<text x="750" y="200" font-size="20" fill="var(--warn)">股東看到</text>
<text x="750" y="236" font-size="16" fill="var(--dim)">資本支出</text>
<text x="750" y="262" font-size="16" fill="var(--dim)">超過自由現金流</text>
<text x="750" y="288" font-size="16" fill="var(--dim)">要去市場借錢</text>
<text x="750" y="326" font-size="19" fill="var(--warn)">埋進地底</text>
<text x="60" y="470" font-size="22" fill="var(--ink)">於是科技分析師被迫問信用分析師的問題</text>
</svg>
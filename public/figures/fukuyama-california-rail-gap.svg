<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="洛杉磯到舊金山一整條虛線，中間只有極短一段實線是已鋪好的軌道">
<rect x="0" y="0" width="960" height="460" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); font-size:16px; }
</style>
<text x="480" y="52" text-anchor="middle" style="font-size:27px;font-weight:700">承諾與兌現：加州高鐵</text>
<line x1="130" y1="260" x2="830" y2="260" stroke="var(--grey)" stroke-width="6" stroke-dasharray="14 10"/>
<line x1="470" y1="260" x2="488" y2="260" stroke="var(--accent)" stroke-width="16"/>
<circle cx="130" cy="260" r="12" fill="var(--ink)"/>
<circle cx="830" cy="260" r="12" fill="var(--ink)"/>
<text x="130" y="228" text-anchor="middle" style="font-size:20px;font-weight:700">洛杉磯</text>
<text x="830" y="228" text-anchor="middle" style="font-size:20px;font-weight:700">舊金山</text>
<line x1="479" y1="248" x2="479" y2="160" stroke="var(--accent)" stroke-width="2"/>
<text x="479" y="148" text-anchor="middle" style="font-size:20px;fill:var(--accent);font-weight:700">已鋪：約十英里</text>
<line x1="130" y1="310" x2="830" y2="310" stroke="var(--line)" stroke-width="2"/>
<line x1="130" y1="302" x2="130" y2="318" stroke="var(--line)" stroke-width="2"/>
<line x1="830" y1="302" x2="830" y2="318" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="345" text-anchor="middle" style="font-size:19px;fill:var(--dim)">他想要：三小時直達</text>
<text x="480" y="420" text-anchor="middle" style="font-size:22px;font-weight:700">撥款三十年，兌現一小段</text>
</svg>
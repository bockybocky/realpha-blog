<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條水平管道上有四個夾點，開口由左至右逐漸收窄，最右邊收得最緊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="62">緊的地方一站一站往下移</text>
  <text class="b" x="48" y="92">開口越窄＝越緊</text>
  <rect x="40" y="118" width="880" height="284" rx="14" fill="var(--card)"/>
  <line x1="80" y1="168" x2="900" y2="168" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="900,168 888,162 888,174" fill="var(--grey)"/>
  <text class="b" x="80" y="154">已緩解</text>
  <text class="b" x="900" y="154" text-anchor="end">下一站</text>
  <rect x="80" y="230" width="820" height="80" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <polygon points="184,230 236,230 210,242" fill="var(--grey)"/>
  <polygon points="184,310 236,310 210,298" fill="var(--grey)"/>
  <polygon points="374,230 426,230 400,248" fill="var(--grey)"/>
  <polygon points="374,310 426,310 400,292" fill="var(--grey)"/>
  <polygon points="564,230 616,230 590,254" fill="var(--dim)"/>
  <polygon points="564,310 616,310 590,286" fill="var(--dim)"/>
  <polygon points="754,230 806,230 780,262" fill="var(--accent)"/>
  <polygon points="754,310 806,310 780,278" fill="var(--accent)"/>
  <text class="g" x="210" y="356" text-anchor="middle">算力</text>
  <text class="g" x="400" y="356" text-anchor="middle">互連</text>
  <text class="g" x="590" y="356" text-anchor="middle">記憶體</text>
  <text class="g" x="780" y="356" text-anchor="middle" fill="var(--accent)">電源</text>
  <text class="c" x="48" y="470">緩解不是消滅，是搬家</text>
</svg>
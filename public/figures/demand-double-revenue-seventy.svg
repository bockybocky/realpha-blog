<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根柱子高度不同，矮的那根上方缺一塊被虛線框起來">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">差在中間那一塊，不在態度</text>

<line x1="120" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="220" y="160" width="160" height="310" rx="6" fill="var(--accent)" opacity="0.22"/>
<rect x="220" y="160" width="160" height="310" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="300" y="140" font-size="20" fill="var(--accent)" text-anchor="middle">需求　一倍以上</text>
<text x="300" y="504" font-size="16" fill="var(--dim)" text-anchor="middle">他說的市場</text>

<rect x="580" y="253" width="160" height="217" rx="6" fill="var(--accent)" opacity="0.22"/>
<rect x="580" y="253" width="160" height="217" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<rect x="580" y="160" width="160" height="93" rx="6" fill="var(--warn)" opacity="0.12"/>
<rect x="580" y="160" width="160" height="93" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="660" y="140" font-size="20" fill="var(--ink)" text-anchor="middle">營收　七成信心</text>
<text x="660" y="504" font-size="16" fill="var(--dim)" text-anchor="middle">他敢承諾的</text>

<line x1="770" y1="206" x2="830" y2="206" stroke="var(--warn)" stroke-width="2"/>
<text x="840" y="200" font-size="16" fill="var(--warn)">這一塊</text>
<text x="840" y="224" font-size="16" fill="var(--warn)">＝產能</text>

<text x="480" y="540" font-size="22" fill="var(--ink)" text-anchor="middle">缺口告訴你下一個該盯哪裡</text>
</svg>
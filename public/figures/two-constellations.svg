<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="左邊一個中心向外三條輪輻，右邊五個節點彼此互連成網，找不到中心">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .n { font-size:16px; fill:var(--ink); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="66">兩個星座，不是兩個國家</text>
<text class="g" x="230" y="132" text-anchor="middle">一邊有中心</text>
<line x1="230" y1="300" x2="230" y2="182" stroke="var(--line)" stroke-width="3"/>
<line x1="230" y1="300" x2="125" y2="372" stroke="var(--line)" stroke-width="3"/>
<line x1="230" y1="300" x2="395" y2="372" stroke="var(--line)" stroke-width="3"/>
<circle cx="230" cy="300" r="56" fill="var(--accent)"/>
<text class="g" x="230" y="308" text-anchor="middle" style="fill:var(--page)">美國</text>
<rect x="175" y="160" width="110" height="44" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="70" y="350" width="110" height="44" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="340" y="350" width="110" height="44" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="n" x="230" y="188" text-anchor="middle">盟友</text>
<text class="n" x="125" y="378" text-anchor="middle">待談</text>
<text class="n" x="395" y="378" text-anchor="middle">觀望</text>
<line x1="470" y1="130" x2="470" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="g" x="720" y="132" text-anchor="middle">另一邊沒有中心</text>
<line x1="570" y1="370" x2="830" y2="200" stroke="var(--dim)" stroke-width="2"/>
<line x1="830" y1="200" x2="700" y2="480" stroke="var(--dim)" stroke-width="2"/>
<line x1="610" y1="190" x2="830" y2="200" stroke="var(--dim)" stroke-width="2"/>
<line x1="860" y1="380" x2="830" y2="200" stroke="var(--dim)" stroke-width="2"/>
<line x1="610" y1="190" x2="570" y2="370" stroke="var(--dim)" stroke-width="2"/>
<line x1="860" y1="380" x2="700" y2="480" stroke="var(--dim)" stroke-width="2"/>
<circle cx="610" cy="190" r="44" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<circle cx="830" cy="200" r="44" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<circle cx="570" cy="370" r="44" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<circle cx="860" cy="380" r="44" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<circle cx="700" cy="480" r="44" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<text class="n" x="610" y="196" text-anchor="middle">中國</text>
<text class="n" x="830" y="206" text-anchor="middle">俄羅斯</text>
<text class="n" x="570" y="376" text-anchor="middle">伊朗</text>
<text class="n" x="860" y="386" text-anchor="middle">北韓</text>
<text class="n" x="700" y="486" text-anchor="middle">中東</text>
<text class="b" x="676" y="278">無人機</text>
<text class="b" x="742" y="356">加噴射</text>
<text class="b" x="856" y="292">彈藥</text>
<text class="c" x="60" y="560">一邊是輪輻，另一邊是網</text>
</svg>
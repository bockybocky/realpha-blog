<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三根柱子從幾乎看不見長到頂天，底下標著做一款遊戲要花的年期與預算">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="60" font-size="27" fill="var(--ink)">一款遊戲要多少人、多少年</text>
<rect x="48" y="90" width="864" height="382" rx="14" fill="var(--card)"/>
<line x1="88" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="394" width="130" height="6" rx="3" fill="var(--grey)"/>
<text x="215" y="378" font-size="16" fill="var(--dim)" text-anchor="middle">不到 100 人</text>
<text x="215" y="430" font-size="20" fill="var(--ink)" text-anchor="middle">2000 年代</text>
<text x="215" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">2–3 年・2,000 萬美元</text>
<rect x="415" y="247" width="130" height="153" rx="4" fill="var(--grey)"/>
<text x="480" y="231" font-size="16" fill="var(--dim)" text-anchor="middle">2,400 人</text>
<text x="480" y="430" font-size="20" fill="var(--ink)" text-anchor="middle">2018 年</text>
<text x="480" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">送出門那一年</text>
<rect x="680" y="130" width="130" height="270" rx="4" fill="var(--accent)"/>
<text x="745" y="114" font-size="16" fill="var(--ink)" text-anchor="middle">4,700 人</text>
<text x="745" y="430" font-size="20" fill="var(--ink)" text-anchor="middle">現在</text>
<text x="745" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">8 年・傳聞 10–15 億美元</text>
<text x="48" y="520" font-size="22" fill="var(--ink)">同業正往反方向走</text>
</svg>
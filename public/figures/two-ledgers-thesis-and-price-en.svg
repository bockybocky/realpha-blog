<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two lines move apart in opposite directions from a shared starting point, with two exits on the right.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Keep two ledgers apart</text>

<circle cx="140" cy="260" r="9" fill="var(--ink)"/>
<polyline points="140,260 300,250 440,236 560,228" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polyline points="140,260 300,300 440,348 560,392" fill="none" stroke="var(--warn)" stroke-width="5" stroke-dasharray="12 7"/>

<text x="150" y="206" font-size="20" font-weight="700" fill="var(--accent)">Thesis ledger</text>
<text x="150" y="234" font-size="16" fill="var(--dim)">Gap　Term price　Contracting　Slippage</text>
<text x="150" y="430" font-size="20" font-weight="700" fill="var(--warn)">Price ledger</text>

<rect x="600" y="170" width="300" height="104" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="624" y="210" font-size="19" font-weight="700" fill="var(--accent)">Four fields unchanged</text>
<text x="624" y="244" font-size="17" fill="var(--ink)">Money is what fell</text>

<rect x="600" y="330" width="300" height="104" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="624" y="370" font-size="19" font-weight="700" fill="var(--warn)">Fields start flipping</text>
<text x="624" y="404" font-size="17" fill="var(--ink)">Fix the thesis</text>

<text x="60" y="504" font-size="22" font-weight="700" fill="var(--ink)">Write it down, and you can tell where you were wrong</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="買方數量從稀疏變密集，折價的寬度隨之從很寬收縮到很窄">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">買方變多，空間變窄</text>

<rect x="60" y="92" width="840" height="170" rx="10" fill="var(--card)"/>
<text class="t" x="80" y="126" font-size="19" font-weight="700" fill="var(--dim)">買方少的時候</text>
<circle cx="120" cy="186" r="10" fill="var(--grey)"/>
<circle cx="160" cy="186" r="10" fill="var(--grey)"/>
<circle cx="200" cy="186" r="10" fill="var(--grey)"/>
<rect x="250" y="168" width="470" height="36" rx="6" fill="var(--warn)"/>
<text class="t" x="268" y="194" font-size="19" font-weight="700" fill="var(--page)">折價很寬</text>
<text class="t" x="740" y="194" font-size="16" fill="var(--dim)">賣方沒得挑</text>

<rect x="60" y="292" width="840" height="170" rx="10" fill="var(--card)"/>
<text class="t" x="80" y="326" font-size="19" font-weight="700" fill="var(--dim)">買方一堆的時候</text>
<circle cx="120" cy="386" r="10" fill="var(--grey)"/>
<circle cx="148" cy="386" r="10" fill="var(--grey)"/>
<circle cx="176" cy="386" r="10" fill="var(--grey)"/>
<circle cx="204" cy="386" r="10" fill="var(--grey)"/>
<circle cx="232" cy="386" r="10" fill="var(--grey)"/>
<circle cx="260" cy="386" r="10" fill="var(--grey)"/>
<circle cx="288" cy="386" r="10" fill="var(--grey)"/>
<circle cx="316" cy="386" r="10" fill="var(--grey)"/>
<rect x="360" y="368" width="110" height="36" rx="6" fill="var(--accent)"/>
<text class="t" x="486" y="394" font-size="19" font-weight="700" fill="var(--accent)">約 13%</text>
<text class="t" x="640" y="394" font-size="16" fill="var(--dim)">仲介幫賣方跑競標</text>

<text class="t" x="60" y="506" font-size="22" font-weight="700" fill="var(--ink)">超額報酬被擠壓成一條窄縫</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左側研發柱是營收柱的兩倍多；右側箭頭把它送進算力，再從一個右邊開口的框穿出圖外。">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">花出去的，比收進來的多一倍以上</text>
<path d="M100 500 L900 500" stroke="var(--line)" stroke-width="2"/>
<rect x="130" y="390" width="110" height="110" fill="var(--grey)"/>
<text x="185" y="372" font-size="16" fill="var(--dim)" text-anchor="middle">1</text>
<text x="185" y="530" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">營收</text>
<rect x="290" y="250" width="110" height="250" fill="var(--warn)"/>
<text x="345" y="232" font-size="16" fill="var(--warn)" text-anchor="middle">2 倍以上</text>
<text x="345" y="530" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">研發</text>

<path d="M400 285 L498 285" stroke="var(--warn)" stroke-width="3" fill="none"/>
<path d="M498 277 L514 285 L498 293 z" fill="var(--warn)"/>
<rect x="520" y="252" width="140" height="66" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="590" y="292" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">算力</text>
<path d="M660 285 L706 285" stroke="var(--warn)" stroke-width="3" fill="none"/>
<path d="M706 277 L722 285 L706 293 z" fill="var(--warn)"/>
<path d="M900 252 L728 252 L728 318 L900 318" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="814" y="292" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">免費送出</text>
<path d="M860 360 L936 360" stroke="var(--warn)" stroke-width="3" fill="none"/>
<path d="M936 352 L952 360 L936 368 z" fill="var(--warn)"/>
<text x="728" y="392" font-size="16" fill="var(--dim)">出去就不回來</text>
</g>
</svg>
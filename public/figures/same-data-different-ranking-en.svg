<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One set of data connects down to two scales, the left tipping toward inflation and the right toward employment, in opposite directions">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<defs>
<marker id="a8a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56">The same data, a different ordering</text>

<rect x="360" y="102" width="240" height="60" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="480" y="140" text-anchor="middle">The same data</text>
<line x1="420" y1="166" x2="300" y2="214" stroke="var(--grey)" stroke-width="2" marker-end="url(#a8a)"/>
<line x1="540" y1="166" x2="660" y2="214" stroke="var(--grey)" stroke-width="2" marker-end="url(#a8a)"/>

<line x1="185" y1="318" x2="355" y2="274" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
<circle cx="185" cy="318" r="8" fill="var(--accent)"/>
<circle cx="355" cy="274" r="8" fill="var(--accent)" fill-opacity="0.4"/>
<path d="M270,296 L246,372 L294,372 Z" fill="var(--grey)" fill-opacity="0.5"/>
<line x1="228" y1="372" x2="312" y2="372" stroke="var(--line)" stroke-width="3"/>
<text class="g" x="185" y="348" text-anchor="middle">Inflation</text>
<text class="b" x="365" y="262">Employment</text>
<text class="b" x="270" y="412" text-anchor="middle">Puts inflation first</text>

<line x1="605" y1="274" x2="775" y2="318" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
<circle cx="605" cy="274" r="8" fill="var(--accent)" fill-opacity="0.4"/>
<circle cx="775" cy="318" r="8" fill="var(--accent)"/>
<path d="M690,296 L666,372 L714,372 Z" fill="var(--grey)" fill-opacity="0.5"/>
<line x1="648" y1="372" x2="732" y2="372" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="595" y="262" text-anchor="end">Inflation</text>
<text class="g" x="775" y="348" text-anchor="middle">Employment</text>
<text class="b" x="690" y="412" text-anchor="middle">Puts employment first</text>

<text class="c" x="60" y="500">The argument is about weights, not facts</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="四條交期長條，太陽能加電池最短，燃氣渦輪與變壓器伸到二零三零年代初">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">現在下訂，什麼時候交得出來</text>

  <line x1="280" y1="110" x2="280" y2="430" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="280" y="462" font-size="16" text-anchor="middle" fill="var(--dim)">現在下訂</text>
  <line x1="820" y1="110" x2="820" y2="430" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="t" x="820" y="462" font-size="16" text-anchor="middle" fill="var(--dim)">2030 年代初</text>

  <text class="t" x="260" y="165" font-size="19" font-weight="700" text-anchor="end" fill="var(--ink)">太陽能＋電池</text>
  <rect x="280" y="146" width="130" height="26" rx="6" fill="var(--accent)"/>

  <text class="t" x="260" y="230" font-size="19" font-weight="700" text-anchor="end" fill="var(--ink)">風電</text>
  <rect x="280" y="211" width="200" height="26" rx="6" fill="var(--accent)" opacity="0.7"/>

  <text class="t" x="260" y="300" font-size="19" font-weight="700" text-anchor="end" fill="var(--ink)">燃氣渦輪機</text>
  <rect x="280" y="281" width="540" height="26" rx="6" fill="var(--warn)"/>

  <text class="t" x="260" y="368" font-size="19" font-weight="700" text-anchor="end" fill="var(--ink)">電網變壓器</text>
  <rect x="280" y="349" width="520" height="26" rx="6" fill="var(--warn)" opacity="0.7"/>

  <text class="t" x="480" y="500" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">要快，可選的就只有最上面那兩條</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="能力與所有權的四格圖：1928 奧斯華落在有能力無所有權格、1942 戰時落在有所有權無產出格、1937 白雪公主落在兩者兼具格、左下格不成立">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t{font-size:27px;fill:var(--ink);font-weight:700}
    .g{font-size:19px;fill:var(--dim)}
    .n{font-size:16px;fill:var(--ink)}
    .w{font-size:16px;fill:var(--warn)}
    .a{font-size:16px;fill:var(--accent)}
    .s{font-size:15px;fill:var(--grey)}
    .c{font-size:22px;fill:var(--ink);font-weight:700}
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="50">卡脖子的是兩件事疊在一起</text>
  <rect x="150" y="96" width="700" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <line x1="500" y1="106" x2="500" y2="446" stroke="var(--line)" stroke-width="2"/>
  <line x1="160" y1="276" x2="840" y2="276" stroke="var(--line)" stroke-width="2"/>

  <text class="g" x="500" y="82" text-anchor="middle">角色歸自己</text>
  <text class="g" x="500" y="486" text-anchor="middle">角色歸別人</text>
  <text class="g" x="140" y="282" text-anchor="end">做不出角色</text>
  <text class="g" x="860" y="282">做得出角色</text>

  <circle cx="330" cy="186" r="7" fill="var(--warn)"/>
  <text class="w" x="348" y="180">1942 戰時</text>
  <text class="s" x="348" y="204">飛輪空轉</text>

  <circle cx="660" cy="186" r="9" fill="var(--accent)"/>
  <text class="a" x="680" y="180">1937 白雪公主</text>
  <text class="s" x="680" y="204">開始複利</text>

  <circle cx="660" cy="356" r="7" fill="var(--warn)"/>
  <text class="w" x="680" y="350">1928 奧斯華</text>
  <text class="s" x="680" y="374">價值歸零</text>

  <text class="s" x="330" y="356">不成立</text>

  <text class="c" x="60" y="524">少任何一邊，這條鏈都會斷</text>
</svg>
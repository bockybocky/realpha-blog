<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Of three rising thresholds, the seat height clears only the lowest majority line and cannot reach the filibuster or veto-override lines.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="64">Winning the Senate vs. moving it</text>
<rect x="60" y="100" width="840" height="340" rx="14" fill="var(--card)"/>
<rect x="130" y="286" width="150" height="124" rx="6" fill="var(--accent)"/>
<text class="g" x="130" y="268" fill="var(--accent)">Actual seats</text>
<line x1="110" y1="286" x2="880" y2="286" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="440" y="276">Majority  51</text>
<text class="b" x="820" y="276">✓</text>
<line x1="110" y1="214" x2="880" y2="214" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="g" x="440" y="204">End filibuster  60</text>
<text class="b" x="820" y="204">✗</text>
<line x1="110" y1="144" x2="880" y2="144" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="g" x="440" y="134">Override veto  two-thirds</text>
<text class="b" x="820" y="134">✗</text>
<line x1="205" y1="286" x2="205" y2="152" stroke="var(--dim)" stroke-width="2"/>
<path d="M205 152 l-7 14 h14 z" fill="var(--dim)"/>
<text class="b" x="222" y="240">Gap</text>
<text class="c" x="60" y="500">Past the lowest line; the two above stay shut</text>
</svg>
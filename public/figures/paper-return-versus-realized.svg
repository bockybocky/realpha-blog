<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條經過三個深谷後持續攀高的曲線，另一條在第一個深谷處斷開並水平延伸到最右側，兩條終點高度差距極大">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">數字是真的，但那條路沒有人走完</text>
  <rect x="60" y="100" width="840" height="330" rx="14" fill="var(--card)"/>
  <line x1="120" y1="392" x2="880" y2="392" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <polyline points="140,392 200,340 250,300 300,368 340,392 400,330 450,286 500,250 540,300 580,332 640,266 690,216 730,256 780,214 830,182 860,166"
            fill="none" stroke="var(--accent)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="140,392 200,340 250,300 300,368 340,392"
            fill="none" stroke="var(--warn)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="340" y1="392" x2="860" y2="392" stroke="var(--warn)" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle cx="340" cy="392" r="10" fill="var(--warn)"/>
  <circle cx="860" cy="166" r="9" fill="var(--accent)"/>
  <text x="856" y="146" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="end">帳面年化</text>
  <text x="856" y="424" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="end">實際拿到</text>
  <text x="340" y="360" font-size="17" font-weight="700" fill="var(--warn)" text-anchor="middle">贖回</text>
  <text x="480" y="492" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">看到亮眼的長期數字，先問有沒有人真的領到</text>
</svg>
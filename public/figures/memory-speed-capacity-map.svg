<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩軸圖上三個點，兩個在對角，第三個落在中間偏上">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">在快與大之間，找一個沒人站過的位置</text>

<line x1="160" y1="110" x2="160" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="160" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>
<text x="160" y="96" font-size="16" fill="var(--dim)" text-anchor="middle">頻寬高</text>
<text x="160" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">低</text>
<text x="880" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">容量大</text>
<text x="212" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">小</text>

<circle cx="270" cy="180" r="11" fill="var(--grey)"/>
<text x="294" y="174" font-size="20" fill="var(--ink)">SRAM</text>
<text x="294" y="200" font-size="15" fill="var(--dim)">快．裝不多</text>

<circle cx="770" cy="380" r="11" fill="var(--grey)"/>
<text x="746" y="374" font-size="20" fill="var(--ink)" text-anchor="end">HBM</text>
<text x="746" y="400" font-size="15" fill="var(--dim)" text-anchor="end">大．較慢</text>

<circle cx="500" cy="252" r="34" fill="var(--accent)" opacity="0.14"/>
<circle cx="500" cy="252" r="34" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="500" cy="252" r="11" fill="var(--accent)"/>
<text x="548" y="246" font-size="20" fill="var(--accent)">3D DRAM</text>
<text x="548" y="272" font-size="15" fill="var(--dim)">更快更省電．容量較小</text>
<text x="548" y="296" font-size="15" fill="var(--warn)">得在 DRAM 上打孔．2028 到 2029</text>

<text x="480" y="524" font-size="22" fill="var(--ink)" text-anchor="middle">模擬數據漂亮，離出貨還有一段</text>
</svg>
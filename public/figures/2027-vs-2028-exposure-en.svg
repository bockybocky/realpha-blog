<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two yearly capacity bars: the short one has only a small slice affected, while close to half of the tall one falls in the affected range.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="64">The variable is 2028, not 2027</text>
<rect x="60" y="100" width="840" height="340" rx="14" fill="var(--card)"/>
<line x1="110" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="190" y="268" width="180" height="132" rx="6" fill="var(--grey)"/>
<rect x="190" y="268" width="180" height="10" fill="var(--warn)"/>
<text class="g" x="190" y="248">2027</text>
<text class="b" x="190" y="430">About 6% affected</text>
<rect x="580" y="156" width="180" height="244" rx="6" fill="var(--grey)"/>
<rect x="580" y="156" width="180" height="118" fill="var(--warn)"/>
<text class="g" x="580" y="136">2028</text>
<text class="b" x="580" y="430">About half unpermitted</text>
<text class="b" x="790" y="222" fill="var(--warn)">Exposure</text>
<text class="c" x="60" y="500">Same ban, very different bite in the two years</text>
</svg>
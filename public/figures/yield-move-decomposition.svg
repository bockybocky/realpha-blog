<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩段期間殖利率變動的分解，下降期約四分之一來自避險屬性，上升期多數來自公債變得像股票">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="40" y="58" font-size="27" font-weight="700" fill="var(--ink)">殖利率的變動，拆成兩塊看</text>
<text class="t" x="40" y="92" font-size="16" fill="var(--dim)">信封背面的估算，長度代表占比</text>

<text class="t" x="40" y="146" font-size="20" font-weight="700" fill="var(--ink)">1980 年代中 ─ 2010 年代：往下</text>
<rect x="40" y="166" width="205" height="62" fill="var(--accent)"/>
<rect x="245" y="166" width="615" height="62" fill="var(--grey)"/>
<text class="t" x="58" y="204" font-size="16" fill="var(--page)">避險屬性變好</text>
<text class="t" x="266" y="204" font-size="16" fill="var(--ink)">通膨預期下降等因素</text>
<text class="t" x="58" y="252" font-size="15" fill="var(--dim)">約四分之一</text>

<text class="t" x="40" y="330" font-size="20" font-weight="700" fill="var(--ink)">2020 ─ 2025 年：往上</text>
<rect x="40" y="350" width="640" height="62" fill="var(--warn)"/>
<rect x="680" y="350" width="180" height="62" fill="var(--grey)"/>
<text class="t" x="58" y="388" font-size="16" fill="var(--page)">公債變得更像股票</text>
<text class="t" x="700" y="388" font-size="16" fill="var(--ink)">其餘</text>
<text class="t" x="58" y="436" font-size="15" fill="var(--dim)">多數</text>

<text class="t" x="40" y="490" font-size="22" font-weight="700" fill="var(--ink)">這一次漲的是風險補償，不是通膨預期</text>
</svg>
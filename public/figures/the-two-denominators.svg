<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩根同高的堆疊柱，左柱上段佔約四成標為多出來的那一台，右柱上段只有很薄一條">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:600;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:600;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="60">兩個比例，量的不是同一件事</text>
<text class="g" x="310" y="140" text-anchor="middle">歐洲的新車分母</text>
<rect x="230" y="170" width="160" height="130" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2"/>
<rect x="230" y="300" width="160" height="170" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="310" y="242" text-anchor="middle">多出來的那一台</text>
<text class="b" x="310" y="392" text-anchor="middle">唯一的那一台</text>
<text class="g" x="650" y="140" text-anchor="middle">台灣的新車分母</text>
<rect x="570" y="170" width="160" height="30" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2"/>
<rect x="570" y="200" width="160" height="270" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="732" y1="185" x2="748" y2="185" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="754" y="190">多出來的那一台</text>
<text class="b" x="650" y="342" text-anchor="middle">唯一的那一台</text>
<text class="g" x="310" y="508" text-anchor="middle" fill="var(--accent)">純電 20%</text>
<text class="g" x="650" y="508" text-anchor="middle" fill="var(--accent)">純電 8%</text>
<text class="c" x="480" y="556" text-anchor="middle">落差在家庭持車結構，不在態度</text>
</svg>
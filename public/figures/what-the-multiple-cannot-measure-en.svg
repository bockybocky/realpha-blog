<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Inside the large box of company value, only a small corner at the lower left is circled, and everything else falls outside it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:19px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="58">What the P/E ruler leaves out</text>

  <rect x="120" y="110" width="720" height="300" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="146" y="148">Value of this company</text>

  <rect x="150" y="240" width="250" height="140" rx="10" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="196" y="300" fill="var(--accent)">This year's earnings</text>
  <text class="b" x="196" y="336">The ruler reaches this</text>

  <text class="b" x="470" y="212">Brand</text>
  <text class="b" x="640" y="196">Culture</text>
  <text class="b" x="470" y="300">CEO</text>
  <text class="b" x="630" y="288">Repeat customers</text>
  <text class="b" x="470" y="376">Innovation</text>
  <text class="b" x="660" y="368">Staff retention</text>

  <text class="c" x="120" y="472">Cheap or dear depends on how much your ruler reaches</text>
</svg>
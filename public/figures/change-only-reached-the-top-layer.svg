<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三層金字塔，只有頂層上色，下面兩層仍是空的">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="58" font-size="27" fill="var(--ink)">變化只到第一層</text>

<polygon points="430,150 530,150 556,232 404,232" fill="var(--accent)"/>
<text x="480" y="198" font-size="20" fill="var(--page)" text-anchor="middle">董事會</text>
<text x="596" y="198" font-size="15" fill="var(--dim)">席次多半是外部董事</text>

<polygon points="404,242 556,242 590,332 370,332" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="295" font-size="20" fill="var(--dim)" text-anchor="middle">執行役員</text>
<text x="620" y="295" font-size="15" fill="var(--dim)">沒動</text>

<polygon points="370,342 590,342 640,440 320,440" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="400" font-size="20" fill="var(--dim)" text-anchor="middle">部長層</text>
<text x="668" y="400" font-size="15" fill="var(--dim)">沒動</text>

<text x="80" y="510" font-size="22" fill="var(--ink)">下面兩層沒換人，公司就沒換</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="財報不如預期後，便宜那支下跌段明顯比貴的那支長">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">財報不如預期之後，誰掉得更深</text>
<text x="60" y="100" font-size="16" fill="var(--dim)">形狀示意，不是實際跌幅</text>
<line x1="60" y1="170" x2="900" y2="170" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="158" font-size="16" fill="var(--dim)">財報當天</text>
<rect x="250" y="170" width="120" height="90" fill="var(--grey)"/>
<polygon points="250,260 370,260 310,300" fill="var(--grey)"/>
<text x="250" y="340" font-size="20" fill="var(--ink)">貴的那支</text>
<rect x="600" y="170" width="120" height="220" fill="var(--warn)"/>
<polygon points="600,390 720,390 660,430" fill="var(--warn)"/>
<text x="600" y="470" font-size="20" fill="var(--ink)">便宜那支</text>
<text x="600" y="496" font-size="16" fill="var(--dim)">25 年來最重的懲罰</text>
<text x="250" y="366" font-size="16" fill="var(--dim)">預期本來就高</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="製作成本八比二的長條，付八成的一方只換到兩次播出，付兩成的一方換到永久版權">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--page); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="80" y="78">赤字融資：誰付錢，誰留下東西</text>
<text class="b" x="80" y="118">一齣戲的製作成本</text>
<rect x="80" y="140" width="640" height="76" fill="var(--grey)"/>
<rect x="720" y="140" width="160" height="76" fill="var(--warn)"/>
<text class="n" x="360" y="186" text-anchor="middle">八成</text>
<text class="n" x="800" y="186" text-anchor="middle">兩成</text>
<path d="M400 216 L400 268" stroke="var(--line)" stroke-width="3"/>
<path d="M800 216 L800 268" stroke="var(--line)" stroke-width="3"/>
<rect x="80" y="268" width="640" height="130" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="736" y="268" width="144" height="130" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="110" y="306">電視台出錢</text>
<text class="b" x="110" y="338">換到的東西</text>
<text class="g" x="110" y="372">播兩次</text>
<text class="g" x="760" y="306">製作公司</text>
<text class="b" x="760" y="338">換到</text>
<text class="g" x="760" y="372" fill="var(--warn)">版權</text>
<text class="c" x="80" y="462">付得多的那一邊，結束那天什麼都沒留下</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條方向相反的線，檔案大小往下、出錯與忘記前文往上，在壓縮加深時交叉">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">壓縮沒有免費午餐</text>
<text x="480" y="88" text-anchor="middle" font-size="16" fill="var(--dim)">同一顆模型，二十一個版本</text>
<line x1="140" y1="430" x2="840" y2="430" stroke="var(--line)" stroke-width="2"/>
<polyline points="140,160 380,268 600,340 820,388" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
<polyline points="140,404 380,384 600,330 820,170" fill="none" stroke="var(--warn)" stroke-width="3.5"/>
<circle cx="140" cy="160" r="6" fill="var(--accent)"/>
<circle cx="820" cy="170" r="6" fill="var(--warn)"/>
<text x="140" y="140" font-size="20" fill="var(--accent)">檔案大小</text>
<text x="820" y="150" text-anchor="end" font-size="20" fill="var(--warn)">出錯與忘記前文</text>
<text x="140" y="462" font-size="16" fill="var(--dim)">原尺寸 16 位元</text>
<text x="840" y="462" text-anchor="end" font-size="16" fill="var(--dim)">壓最狠 2 位元</text>
<text x="480" y="508" text-anchor="middle" font-size="22" fill="var(--ink)">省下的空間，用記性換</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一個由理論與實驗組成的循環，上半段弧細而標示可壓縮，下半段弧粗重並標示壓不動">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">迴圈裡只有一段壓得動</text>
<path d="M330,230 C420,140 540,140 630,230" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polygon points="630,230 606,220 618,204" fill="var(--accent)"/>
<path d="M630,330 C540,420 420,420 330,330" fill="none" stroke="var(--warn)" stroke-width="16" stroke-linecap="round"/>
<polygon points="330,330 354,340 342,356" fill="var(--warn)"/>
<rect x="190" y="248" width="150" height="64" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="265" y="288" font-size="20" fill="var(--ink)" text-anchor="middle">理論</text>
<rect x="620" y="248" width="150" height="64" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="695" y="288" font-size="20" fill="var(--ink)" text-anchor="middle">實驗</text>
<text x="480" y="134" font-size="19" fill="var(--accent)" text-anchor="middle">想出下一批實驗</text>
<text x="480" y="112" font-size="16" fill="var(--dim)" text-anchor="middle">七天壓到兩小時</text>
<text x="480" y="452" font-size="19" fill="var(--warn)" text-anchor="middle">實驗本身的真實時間</text>
<text x="480" y="476" font-size="16" fill="var(--dim)" text-anchor="middle">臨床試驗壓不動，量一下就丟的可以</text>
<text x="480" y="530" font-size="22" fill="var(--ink)" text-anchor="middle">加速落在細的那一段，瓶頸在粗的那一段</text>
</g>
</svg>
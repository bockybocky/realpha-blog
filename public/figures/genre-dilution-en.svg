<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two stacked bars compared: the Coca-Cola block is diluted smaller by a large block of bonds.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="68">A defensive acquisition</text>
<text class="g" x="150" y="130">Before the deal</text>
<rect x="150" y="160" width="170" height="130" fill="var(--accent)" opacity="0.8"/>
<rect x="150" y="290" width="170" height="130" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="150" y="452">Coca-Cola is a big slice</text>
<path d="M370,290 L470,290" stroke="var(--grey)" stroke-width="4"/>
<path d="M470,290 l-14,-7 l0,14 z" fill="var(--grey)"/>
<text class="b" x="356" y="266">Bonds swapped in</text>
<text class="g" x="520" y="130">After the deal</text>
<rect x="520" y="160" width="170" height="52" fill="var(--accent)" opacity="0.8"/>
<rect x="520" y="212" width="170" height="130" fill="var(--grey)" opacity="0.55"/>
<rect x="520" y="342" width="170" height="78" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="520" y="452">Coke diluted, bonds in</text>
<line x1="150" y1="496" x2="900" y2="496" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="150" y="534">The crash year</text>
<text class="g" x="320" y="534">Stocks</text>
<path d="M392,516 L392,542" stroke="var(--warn)" stroke-width="5"/><path d="M392,542 l-7,-14 l14,0 z" fill="var(--warn)"/>
<text class="g" x="440" y="534">Bonds</text>
<path d="M512,542 L512,516" stroke="var(--accent)" stroke-width="5"/><path d="M512,516 l-7,14 l14,0 z" fill="var(--accent)"/>
<text class="c" x="580" y="534">Sell bonds, buy stocks</text>
</svg>
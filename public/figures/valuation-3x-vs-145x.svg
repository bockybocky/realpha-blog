<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩根長條，左邊約3倍幾乎貼地，右邊約145倍高至圖頂，高度相差約五十倍">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<text x="60" y="52" class="t">同一個市場，兩種定價</text>
<text x="60" y="84" class="d">預估本益比</text>
<rect x="260" y="473" width="140" height="7" fill="var(--accent)"/>
<text x="330" y="458" class="g a" text-anchor="middle">約 3 倍</text>
<rect x="560" y="160" width="140" height="320" fill="var(--warn)"/>
<text x="630" y="146" class="g w" text-anchor="middle">約 145 倍</text>
<line x1="200" y1="480" x2="760" y2="480" stroke="var(--line)" stroke-width="2"/>
<text x="330" y="510" class="g" text-anchor="middle">上游記憶體</text>
<text x="330" y="534" class="d" text-anchor="middle">2027 年度・長約到 2031</text>
<text x="630" y="510" class="g" text-anchor="middle">資安公司</text>
<text x="630" y="534" class="d" text-anchor="middle">2028 年度・營收成長 26%</text>
<text x="480" y="568" class="c" text-anchor="middle">確定性被打折，故事被加價</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一條由三格串成的算式，中間一格破掉、結果格空白，下方總量條全空；右邊六格網格只有一格破掉，下方總量條仍接近填滿">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.op{font-size:24px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56">同樣少一塊，結果不一樣</text>
<line x1="480" y1="96" x2="480" y2="440" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

<text class="g" x="60" y="128">新創</text>
<text class="s" x="128" y="128">一條式子</text>
<rect x="60" y="162" width="100" height="100" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="110" cy="212" r="16" fill="var(--accent)"/>
<text class="op" x="176" y="222">＋</text>
<rect x="210" y="162" width="100" height="100" rx="10" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="7 6"/>
<line x1="238" y1="190" x2="282" y2="234" stroke="var(--warn)" stroke-width="3"/>
<line x1="282" y1="190" x2="238" y2="234" stroke="var(--warn)" stroke-width="3"/>
<text class="op" x="326" y="222">＝</text>
<rect x="360" y="162" width="100" height="100" rx="10" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 7"/>
<text class="s" x="210" y="292">缺一項</text>
<text class="s" x="368" y="292">沒有結果</text>

<rect x="60" y="352" width="400" height="28" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text class="s" x="60" y="408">沒有東西補得回來</text>

<text class="g" x="520" y="128">大公司</text>
<text class="s" x="600" y="128">投資組合</text>
<rect x="520" y="162" width="112" height="88" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="576" cy="206" r="14" fill="var(--accent)"/>
<rect x="644" y="162" width="112" height="88" rx="10" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="7 6"/>
<line x1="682" y1="188" x2="718" y2="224" stroke="var(--warn)" stroke-width="3"/>
<line x1="718" y1="188" x2="682" y2="224" stroke="var(--warn)" stroke-width="3"/>
<rect x="768" y="162" width="112" height="88" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="824" cy="206" r="14" fill="var(--accent)"/>
<rect x="520" y="262" width="112" height="88" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="576" cy="306" r="14" fill="var(--accent)"/>
<rect x="644" y="262" width="112" height="88" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="700" cy="306" r="14" fill="var(--accent)"/>
<rect x="768" y="262" width="112" height="88" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="824" cy="306" r="14" fill="var(--accent)"/>

<rect x="520" y="382" width="360" height="28" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="520" y="382" width="300" height="28" rx="6" fill="var(--accent)"/>
<text class="s" x="520" y="438">整體還在</text>

<text class="c" x="480" y="510" text-anchor="middle">快，是因為沒有第二次機會</text>
</svg>
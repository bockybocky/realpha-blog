<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A cross-section of the elevation gap between high ground and low-lying land, where water pools in the low part and the plant sits on the low part.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56">Cheap land is the low ground</text>

  <polygon points="60,460 60,250 330,250 470,400 900,400 900,460" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="470" y="352" width="430" height="48" fill="var(--accent)" opacity="0.2"/>
  <line x1="470" y1="352" x2="900" y2="352" stroke="var(--accent)" stroke-width="3"/>

  <rect x="150" y="206" width="110" height="44" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="150" y="192">High ground</text>
  <text class="b" x="150" y="286">Costly; needs new roads</text>

  <rect x="560" y="332" width="130" height="68" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
  <text class="g" x="560" y="318">Plant</text>
  <text class="b" x="730" y="344">Water level</text>

  <text class="g" x="470" y="446">Cheap, ready, close to Bangkok</text>
  <text class="c" x="60" y="506">It sat empty because it sits low</text>
</svg>
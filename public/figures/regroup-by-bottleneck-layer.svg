<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="同一批點左邊散亂、右邊分進四個瓶頸層盒子">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="52" font-size="27" fill="var(--ink)">同一批漲幅，換一種排法</text>

<text x="220" y="104" font-size="19" fill="var(--dim)" text-anchor="middle">按公司排</text>
<rect x="60" y="126" width="320" height="250" rx="10" fill="var(--card)" stroke="var(--line)"/>
<circle cx="112" cy="168" r="13" fill="var(--grey)"/>
<circle cx="186" cy="196" r="13" fill="var(--grey)"/>
<circle cx="268" cy="156" r="13" fill="var(--grey)"/>
<circle cx="330" cy="214" r="13" fill="var(--grey)"/>
<circle cx="142" cy="246" r="13" fill="var(--grey)"/>
<circle cx="234" cy="268" r="13" fill="var(--grey)"/>
<circle cx="308" cy="306" r="13" fill="var(--grey)"/>
<circle cx="112" cy="326" r="13" fill="var(--grey)"/>
<circle cx="198" cy="344" r="13" fill="var(--grey)"/>
<circle cx="272" cy="230" r="13" fill="var(--grey)"/>
<text x="220" y="404" font-size="16" fill="var(--dim)" text-anchor="middle">一張消息清單</text>

<path d="M400 250 L452 250" fill="none" stroke="var(--dim)" stroke-width="3"/>
<path d="M460 250 l-14 -7 v14 z" fill="var(--dim)"/>

<text x="740" y="104" font-size="19" fill="var(--accent)" text-anchor="middle">按瓶頸層排</text>
<rect x="580" y="126" width="150" height="116" rx="10" fill="var(--card)" stroke="var(--accent)"/>
<text x="655" y="152" font-size="16" fill="var(--accent)" text-anchor="middle">CPU</text>
<circle cx="626" cy="190" r="13" fill="var(--accent)"/>
<circle cx="668" cy="190" r="13" fill="var(--accent)"/>
<circle cx="646" cy="220" r="13" fill="var(--accent)"/>
<rect x="750" y="126" width="150" height="116" rx="10" fill="var(--card)" stroke="var(--accent)"/>
<text x="825" y="152" font-size="16" fill="var(--accent)" text-anchor="middle">雷射</text>
<circle cx="806" cy="190" r="13" fill="var(--accent)"/>
<circle cx="848" cy="190" r="13" fill="var(--accent)"/>
<rect x="580" y="260" width="150" height="116" rx="10" fill="var(--card)" stroke="var(--accent)"/>
<text x="655" y="286" font-size="16" fill="var(--accent)" text-anchor="middle">記憶體</text>
<circle cx="626" cy="324" r="13" fill="var(--accent)"/>
<circle cx="668" cy="324" r="13" fill="var(--accent)"/>
<circle cx="646" cy="354" r="13" fill="var(--accent)"/>
<rect x="750" y="260" width="150" height="116" rx="10" fill="var(--card)" stroke="var(--accent)"/>
<text x="825" y="286" font-size="16" fill="var(--accent)" text-anchor="middle">算力</text>
<circle cx="806" cy="324" r="13" fill="var(--accent)"/>
<circle cx="848" cy="324" r="13" fill="var(--accent)"/>
<text x="740" y="404" font-size="16" fill="var(--dim)" text-anchor="middle">一句可以檢驗的話</text>

<text x="480" y="470" font-size="22" fill="var(--ink)" text-anchor="middle">動的是哪一層，不是誰有好消息</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="重資產項目從雲端供應商的框裡搬進 Anthropic 自己的框裡">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">誰的框裡裝著那些重東西</text>

<text x="60" y="118" font-size="19" fill="var(--dim)">現在</text>
<rect x="60" y="134" width="380" height="286" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="164" font-size="19" fill="var(--dim)">雲端供應商</text>
<rect x="84" y="182" width="150" height="46" fill="var(--grey)"/>
<text x="96" y="211" font-size="15" fill="var(--page)">折舊</text>
<rect x="246" y="182" width="150" height="46" fill="var(--grey)"/>
<text x="258" y="211" font-size="15" fill="var(--page)">電力合約</text>
<rect x="84" y="242" width="150" height="46" fill="var(--grey)"/>
<text x="96" y="271" font-size="15" fill="var(--page)">土地</text>
<rect x="246" y="242" width="150" height="46" fill="var(--grey)"/>
<text x="258" y="271" font-size="15" fill="var(--page)">變電站</text>
<rect x="84" y="330" width="312" height="26" fill="var(--accent)"/>
<text x="96" y="380" font-size="15" fill="var(--ink)">Anthropic 只是客戶，帳上很薄</text>

<text x="520" y="118" font-size="19" fill="var(--dim)">申請書宣告要改</text>
<rect x="520" y="134" width="380" height="286" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="540" y="164" font-size="19" fill="var(--accent)">Anthropic Direct</text>
<rect x="544" y="182" width="150" height="46" fill="var(--accent)"/>
<text x="556" y="211" font-size="15" fill="var(--page)">折舊</text>
<rect x="706" y="182" width="150" height="46" fill="var(--accent)"/>
<text x="718" y="211" font-size="15" fill="var(--page)">電力合約</text>
<rect x="544" y="242" width="150" height="46" fill="var(--accent)"/>
<text x="556" y="271" font-size="15" fill="var(--page)">土地</text>
<rect x="706" y="242" width="150" height="46" fill="var(--accent)"/>
<text x="718" y="271" font-size="15" fill="var(--page)">變電站</text>
<text x="544" y="347" font-size="15" fill="var(--ink)">長期租約、直接管到資料中心這一層</text>
<text x="544" y="380" font-size="15" fill="var(--dim)">不見得百分之百持有</text>

<path d="M 452 232 L 506 232" stroke="var(--dim)" stroke-width="2"/>
<path d="M 506 232 l -13 -7 l 0 14 z" fill="var(--dim)"/>
<text x="60" y="490" font-size="22" fill="var(--ink)">資本效率原本是租來的，搬進自己框裡就換了體質</text>
</g>
</svg>
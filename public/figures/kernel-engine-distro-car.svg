<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊單獨一具引擎，右邊一台車把引擎與周邊零件整台包起來">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">核心是引擎，發行版是整台車</text>

<text class="g" x="100" y="150">核心</text>
<rect x="100" y="180" width="180" height="120" rx="10" fill="var(--accent)"/>
<text class="n" x="190" y="248" text-anchor="middle" fill="var(--page)">Linux</text>
<text class="b" x="100" y="340">重要，但開不走</text>

<polygon points="336,250 372,226 372,274" fill="var(--grey)"/>

<text class="g" x="420" y="150">發行版</text>
<path d="M400 320 L400 230 Q400 200 430 200 L560 200 L610 150 L800 150 Q860 150 860 210 L860 320 Z" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<circle cx="480" cy="330" r="30" fill="var(--grey)"/>
<circle cx="790" cy="330" r="30" fill="var(--grey)"/>
<rect x="424" y="236" width="118" height="68" rx="8" fill="var(--accent)"/>
<text class="b" x="483" y="276" text-anchor="middle" fill="var(--page)">Linux 核心</text>
<rect x="560" y="236" width="140" height="30" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="630" y="258" text-anchor="middle">GNU 工具</text>
<rect x="560" y="274" width="140" height="30" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="630" y="296" text-anchor="middle">套件管理</text>
<rect x="714" y="236" width="130" height="30" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="779" y="258" text-anchor="middle">安裝與文件</text>
<rect x="714" y="274" width="130" height="30" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="779" y="296" text-anchor="middle">客戶支援</text>
<text class="b" x="400" y="400">Red Hat、Debian、Slackware</text>

<text class="c" x="60" y="462">賣的不是水，是瓶子和送水的人</text>
</svg>
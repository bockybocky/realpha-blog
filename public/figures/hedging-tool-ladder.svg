<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三張損益線並排：對稱斜線、付了權利金的折線、兩端斜中間平的區間" style="font-family:&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="80" y="72" font-size="27" fill="var(--ink)">三種工具，差別在願不願意付保險費</text>

<rect x="80" y="110" width="250" height="320" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="300" x2="310" y2="300" stroke="var(--line)" stroke-width="2"/>
<polyline points="100,380 310,220" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="205" y="152" font-size="20" fill="var(--ink)" text-anchor="middle">交換合約</text>
<text x="205" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">漲賺・跌賠</text>

<rect x="355" y="110" width="250" height="320" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="375" y1="300" x2="585" y2="300" stroke="var(--line)" stroke-width="2"/>
<polyline points="375,335 490,335 585,215" fill="none" stroke="var(--accent)" stroke-width="4"/>
<line x1="420" y1="300" x2="420" y2="335" stroke="var(--warn)" stroke-width="3"/>
<text x="480" y="152" font-size="20" fill="var(--ink)" text-anchor="middle">買權</text>
<text x="480" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">跌不賠・先付權利金</text>

<rect x="630" y="110" width="250" height="320" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="650" y1="300" x2="860" y2="300" stroke="var(--line)" stroke-width="2"/>
<polyline points="650,380 715,300 795,300 860,230" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="755" y="152" font-size="20" fill="var(--ink)" text-anchor="middle">零成本區間</text>
<text x="755" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">賣賣權・換買權的錢</text>

<text x="80" y="500" font-size="22" fill="var(--ink)">不付錢的那一端，風險就回到你身上</text>
</svg>
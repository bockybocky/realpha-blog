<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊一個點往右分岔成兩條線，上面一條走向差異化，下面一條走向做錯了，中間有一條垂直虛線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:600;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:600;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">事前，兩件事長得一樣</text>
<text class="g" x="200" y="262" text-anchor="middle">市場不喜歡</text>
<circle cx="200" cy="300" r="11" fill="var(--accent)"/>
<line x1="212" y1="296" x2="756" y2="190" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="212" y1="306" x2="756" y2="412" stroke="var(--warn)" stroke-width="2.5"/>
<line x1="580" y1="140" x2="580" y2="450" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>
<text class="b" x="580" y="126" text-anchor="middle">事後才分得出</text>
<text class="b" x="450" y="222" text-anchor="middle">後來被同業抄</text>
<text class="b" x="450" y="392" text-anchor="middle">後來沒人跟</text>
<text class="g" x="772" y="186" fill="var(--accent)">差異化</text>
<text class="g" x="772" y="418" fill="var(--warn)">做錯了</text>
<text class="c" x="480" y="484" text-anchor="middle">同一個現象，兩個相反的解釋</text>
</svg>
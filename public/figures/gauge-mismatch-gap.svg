<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左右兩組齒形不同的排列對不上，中間留下一段空隙。">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" fill="var(--ink)">現在量的，和要做的對不上</text>

<text x="60" y="120" font-size="20" fill="var(--dim)">現在量的</text>
<rect x="60" y="200" width="300" height="140" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--grey)">
<circle cx="360" cy="228" r="22"/>
<circle cx="360" cy="270" r="22"/>
<circle cx="360" cy="312" r="22"/>
</g>

<text x="600" y="120" font-size="20" fill="var(--dim)">新方向要的</text>
<rect x="600" y="200" width="300" height="140" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<g fill="var(--accent)" opacity="0.8">
<rect x="568" y="212" width="34" height="34"/>
<rect x="568" y="256" width="34" height="34"/>
<rect x="568" y="300" width="34" height="34"/>
</g>

<rect x="390" y="196" width="150" height="148" fill="var(--warn)" opacity="0.14"/>
<line x1="390" y1="196" x2="390" y2="344" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="540" y1="196" x2="540" y2="344" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="465" y="276" font-size="20" fill="var(--warn)" text-anchor="middle">時程</text>

<text x="60" y="414" font-size="16" fill="var(--dim)">形狀不同，咬不上</text>

<text x="60" y="472" font-size="22" fill="var(--ink)">先問缺哪一層資料，再問意願</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left one extremely tall thin column stands for a single AI with a trillion IQ, and on the right thirty short columns just above the human line are packed together, standing for a trillion AIs each slightly better than a person.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:700; fill:var(--ink); }
    .body { font-size:15px; fill:var(--dim); }
    .concl { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t title" x="60" y="56">Two shapes, and he picks the right one</text>
  <line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="60" y1="390" x2="900" y2="390" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="t body" x="60" y="380">Human level</text>
  <rect x="200" y="110" width="64" height="320" fill="var(--grey)"/>
  <text class="t grp" x="150" y="470">One of them</text>
  <text class="t body" x="150" y="494">IQ of a trillion</text>
  <rect x="540" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="552" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="564" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="576" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="588" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="600" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="612" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="624" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="636" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="648" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="660" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="672" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="684" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="696" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="708" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="720" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="732" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="744" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="756" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="768" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="780" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="792" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="804" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="816" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="828" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="840" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="852" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="864" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="876" y="360" width="8" height="70" fill="var(--accent)"/>
  <rect x="888" y="360" width="8" height="70" fill="var(--accent)"/>
  <text class="t grp" x="540" y="470">A trillion of them</text>
  <text class="t body" x="540" y="494">Each a bit above human</text>
  <text class="t concl" x="60" y="92">Height vs number</text>
</svg>
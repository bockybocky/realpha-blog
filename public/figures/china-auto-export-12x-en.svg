<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="China's auto exports grew from a small 2020 bar to a bar twelve times taller this year, surpassing dashed lines marking Japan's and Germany's peaks.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Six years, twelvefold</text>
  <text class="t" x="60" y="100" font-size="16" fill="var(--dim)">China auto exports (10,000 vehicles)</text>

  <line x1="150" y1="452" x2="860" y2="452" stroke="var(--line)" stroke-width="2"/>

  <line x1="150" y1="320" x2="860" y2="320" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="t" x="860" y="312" font-size="15" fill="var(--dim)" text-anchor="end">Japan/Germany peaks</text>

  <rect x="240" y="425" width="150" height="27" fill="var(--grey)"/>
  <text class="t" x="315" y="412" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">100</text>
  <text class="t" x="315" y="482" font-size="19" fill="var(--ink)" text-anchor="middle">2020</text>

  <rect x="610" y="132" width="150" height="320" fill="var(--accent)"/>
  <text class="t" x="685" y="118" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">1200</text>
  <text class="t" x="685" y="482" font-size="19" fill="var(--ink)" text-anchor="middle">This year's track</text>

  <path d="M410 420 C 480 400 520 250 592 160" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 6"/>
  <polygon points="592,160 586,176 602,172" fill="var(--accent)"/>

  <text class="t" x="60" y="520" font-size="22" font-weight="700" fill="var(--ink)">A market outside the walls changed scale in six years</text>
</svg>
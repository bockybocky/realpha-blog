<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Left, the textbook: the dollar bar up and the gold bar down on a seesaw; right, that week: dollar, gold, and bitcoin bars all rising together">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); font-weight:700; }
    .gl { font-size:19px; fill:var(--ink); font-weight:700; }
    .bd { font-size:16px; fill:var(--dim); }
    .bs { font-size:15px; fill:var(--dim); }
    .cc { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ti" x="48" y="58">One week, both up</text>
<rect x="48" y="100" width="400" height="380" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="512" y="100" width="400" height="380" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="gl" x="72" y="140">Textbook</text>
<text class="gl" x="536" y="140">This week</text>
<line x1="80" y1="340" x2="416" y2="340" stroke="var(--line)" stroke-width="2"/>
<rect x="140" y="220" width="80" height="120" fill="var(--grey)"/>
<rect x="280" y="340" width="80" height="110" fill="var(--grey)"/>
<text class="bd" x="180" y="208" text-anchor="middle">Dollar  strong</text>
<text class="bd" x="320" y="472" text-anchor="middle">Gold  weak</text>
<line x1="544" y1="340" x2="880" y2="340" stroke="var(--line)" stroke-width="2"/>
<rect x="580" y="300" width="70" height="40" fill="var(--accent)"/>
<rect x="690" y="270" width="70" height="70" fill="var(--accent)"/>
<rect x="800" y="210" width="70" height="130" fill="var(--accent)"/>
<text class="bd" x="615" y="288" text-anchor="middle">Dollar</text>
<text class="bd" x="725" y="258" text-anchor="middle">Gold</text>
<text class="bd" x="835" y="198" text-anchor="middle">Bitcoin</text>
<text class="bs" x="615" y="366" text-anchor="middle">Held 99</text>
<text class="bs" x="725" y="366" text-anchor="middle">≈ +2%</text>
<text class="bs" x="835" y="366" text-anchor="middle">3 days +20%</text>
<text class="cc" x="48" y="528">One pool bought both sides</text>
</svg>
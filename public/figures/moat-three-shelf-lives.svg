<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="護城河三項的保鮮期長短不同，產能最短、認證中等、技術最長">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">護城河拆三樣，保鮮期不一樣</text>
<text class="t" x="60" y="86" font-size="16" fill="var(--dim)">長度＝能擋多久</text>

<text class="t" x="60" y="146" font-size="19" font-weight="600" fill="var(--dim)">產能</text>
<rect x="200" y="124" width="180" height="56" rx="6" fill="var(--warn)"/>
<text class="t" x="396" y="160" font-size="16" fill="var(--dim)">別人也在蓋</text>

<text class="t" x="60" y="268" font-size="19" font-weight="600" fill="var(--dim)">認證資格</text>
<rect x="200" y="246" width="360" height="56" rx="6" fill="var(--accent)" opacity="0.6"/>
<text class="t" x="576" y="282" font-size="16" fill="var(--dim)">換供應商要重跑驗證</text>

<text class="t" x="60" y="390" font-size="19" font-weight="600" fill="var(--dim)">技術</text>
<rect x="200" y="368" width="600" height="56" rx="6" fill="var(--accent)"/>
<text class="t" x="816" y="390" font-size="16" fill="var(--dim)">最長</text>
<text class="t" x="816" y="412" font-size="16" fill="var(--dim)">也最難查核</text>

<text class="t" x="60" y="492" font-size="22" font-weight="600" fill="var(--ink)">只有第一條的公司，跟同業的擴產進度綁在一起</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊兩格的鏈走到底停住，右邊三格繞成一圈並有箭頭折回起點">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; fill:var(--dim); }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--dim); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:2; }
</style>
<defs>
<marker id="arH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--dim)"/></marker>
<marker id="arHw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--warn)"/></marker>
</defs>
<text class="t" x="60" y="56">同樣在跌，兩種生物</text>
<line x1="492" y1="100" x2="492" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="g" x="80" y="140">自由現金流為正</text>
<rect class="card" x="90" y="190" width="150" height="56" rx="8"/>
<text class="b" x="165" y="224" text-anchor="middle">價格下跌</text>
<line x1="246" y1="218" x2="296" y2="218" stroke="var(--dim)" stroke-width="2" marker-end="url(#arH)"/>
<rect class="card" x="300" y="190" width="150" height="56" rx="8"/>
<text class="b" x="375" y="224" text-anchor="middle">估值變低</text>
<line x1="375" y1="252" x2="375" y2="292" stroke="var(--dim)" stroke-width="2" marker-end="url(#arH)"/>
<line x1="320" y1="300" x2="430" y2="300" stroke="var(--ink)" stroke-width="4"/>
<text class="s" x="300" y="330">鏈到這裡停住</text>
<text class="g" x="520" y="140">自由現金流為負</text>
<rect x="540" y="190" width="140" height="56" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="610" y="224" text-anchor="middle">價格下跌</text>
<line x1="686" y1="218" x2="734" y2="218" stroke="var(--dim)" stroke-width="2" marker-end="url(#arH)"/>
<rect class="card" x="740" y="190" width="170" height="56" rx="8"/>
<text class="b" x="825" y="224" text-anchor="middle">融資條件變差</text>
<line x1="825" y1="252" x2="825" y2="310" stroke="var(--dim)" stroke-width="2" marker-end="url(#arH)"/>
<rect class="card" x="740" y="316" width="170" height="56" rx="8"/>
<text class="b" x="825" y="350" text-anchor="middle">基本面惡化</text>
<path d="M 736 344 C 650 344, 612 310, 610 254" fill="none" stroke="var(--warn)" stroke-width="3" marker-end="url(#arHw)"/>
<text class="s" x="540" y="416">跌本身變成原因</text>
<text class="c" x="60" y="512">前者跌掉估值，後者跌出壞消息</text>
</svg>
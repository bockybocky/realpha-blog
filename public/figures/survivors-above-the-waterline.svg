<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="水面線之上浮著三個被寫下名字的案例，水面線之下沉著一排無名的灰色圓圈，顯示我們只看到贏家">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">水面上的三個名字</text>

  <circle cx="240" cy="180" r="56" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="240" y="188" font-size="19" text-anchor="middle" fill="var(--ink)">威尼斯</text>
  <circle cx="430" cy="160" r="56" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="430" y="168" font-size="19" text-anchor="middle" fill="var(--ink)">荷蘭</text>
  <circle cx="620" cy="185" r="56" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="620" y="193" font-size="19" text-anchor="middle" fill="var(--ink)">英國</text>

  <line x1="60" y1="290" x2="900" y2="290" stroke="var(--ink)" stroke-width="3"/>
  <text class="t" x="900" y="278" font-size="16" text-anchor="end" fill="var(--dim)">被寫下來的</text>
  <text class="t" x="900" y="318" font-size="16" text-anchor="end" fill="var(--dim)">沒被寫下來的</text>

  <circle cx="150" cy="370" r="34" fill="var(--grey)" opacity="0.45"/>
  <text class="t" x="150" y="378" font-size="19" text-anchor="middle" fill="var(--page)">？</text>
  <circle cx="265" cy="415" r="28" fill="var(--grey)" opacity="0.4"/>
  <text class="t" x="265" y="423" font-size="17" text-anchor="middle" fill="var(--page)">？</text>
  <circle cx="380" cy="360" r="31" fill="var(--grey)" opacity="0.45"/>
  <text class="t" x="380" y="368" font-size="18" text-anchor="middle" fill="var(--page)">？</text>
  <circle cx="500" cy="430" r="26" fill="var(--grey)" opacity="0.35"/>
  <circle cx="610" cy="375" r="33" fill="var(--grey)" opacity="0.45"/>
  <text class="t" x="610" y="383" font-size="18" text-anchor="middle" fill="var(--page)">？</text>
  <circle cx="720" cy="425" r="27" fill="var(--grey)" opacity="0.35"/>
  <circle cx="820" cy="372" r="30" fill="var(--grey)" opacity="0.4"/>

  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">結論只由浮著的那幾個寫成</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Each of three rows pairs a commitment with a name box; the first two hold names and the third is an empty dashed box marked as skipped for three weeks.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .gd { font-size:20px; fill:var(--grey); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .bw { font-size:16px; fill:var(--warn); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="68">The one with no name is the one that gets sacrificed</text>

<text class="b" x="110" y="128">Three things you say you can't break</text>
<text class="b" x="560" y="128">Who comes after you if you don't</text>

<rect x="100" y="150" width="330" height="76" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="128" y="198">The overtime project</text>
<line x1="440" y1="188" x2="540" y2="188" stroke="var(--grey)" stroke-width="3"/>
<polygon points="552,188 536,180 536,196" fill="var(--grey)"/>
<rect x="560" y="150" width="300" height="76" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="588" y="198">Your boss</text>

<rect x="100" y="246" width="330" height="76" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="128" y="294">What you promised your kid</text>
<line x1="440" y1="284" x2="540" y2="284" stroke="var(--grey)" stroke-width="3"/>
<polygon points="552,284 536,276 536,292" fill="var(--grey)"/>
<rect x="560" y="246" width="300" height="76" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="588" y="294">Your kid</text>

<rect x="100" y="342" width="330" height="76" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="gd" x="128" y="390">Your fixed workout slot</text>
<line x1="440" y1="380" x2="540" y2="380" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="560" y="342" width="300" height="76" rx="10" fill="var(--page)" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 9"/>
<text class="bw" x="588" y="390">Empty</text>
<text class="bw" x="588" y="448">Skipped three weeks</text>

<text class="c" x="480" y="508" text-anchor="middle">Its victims are spread a decade out, so it yields first</text>
</svg>
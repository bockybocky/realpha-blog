<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left a triangle tapering upward has only its tip lit, while on the right a grid of blocks spreads out sideways.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">One goes up a layer, one spreads out wide</text>
  <line x1="480" y1="100" x2="480" y2="460" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="240" y="128" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Frontier models</text>
  <polygon points="240,160 130,420 350,420" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="212" y="160" width="56" height="30" fill="var(--accent)"/>
  <text class="t" x="240" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">Attention sits at the tip</text>

  <text class="t" x="726" y="128" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">AI+ · new quality productive forces</text>
  <g fill="var(--card)" stroke="var(--line)" stroke-width="2">
    <rect x="548" y="160" width="44" height="34"/><rect x="600" y="160" width="44" height="34"/><rect x="652" y="160" width="44" height="34"/><rect x="704" y="160" width="44" height="34"/><rect x="756" y="160" width="44" height="34"/><rect x="808" y="160" width="44" height="34"/><rect x="860" y="160" width="44" height="34"/>
    <rect x="548" y="202" width="44" height="34"/><rect x="600" y="202" width="44" height="34"/><rect x="652" y="202" width="44" height="34"/><rect x="704" y="202" width="44" height="34"/><rect x="756" y="202" width="44" height="34"/><rect x="808" y="202" width="44" height="34"/><rect x="860" y="202" width="44" height="34"/>
    <rect x="548" y="244" width="44" height="34"/><rect x="600" y="244" width="44" height="34"/><rect x="652" y="244" width="44" height="34"/><rect x="704" y="244" width="44" height="34"/><rect x="756" y="244" width="44" height="34"/><rect x="808" y="244" width="44" height="34"/><rect x="860" y="244" width="44" height="34"/>
    <rect x="548" y="286" width="44" height="34"/><rect x="600" y="286" width="44" height="34"/><rect x="652" y="286" width="44" height="34"/><rect x="704" y="286" width="44" height="34"/><rect x="756" y="286" width="44" height="34"/><rect x="808" y="286" width="44" height="34"/><rect x="860" y="286" width="44" height="34"/>
  </g>
  <rect x="548" y="160" width="44" height="34" fill="var(--accent)"/>
  <rect x="704" y="202" width="44" height="34" fill="var(--accent)"/>
  <rect x="860" y="244" width="44" height="34" fill="var(--accent)"/>
  <rect x="600" y="286" width="44" height="34" fill="var(--accent)"/>
  <text class="t" x="726" y="360" font-size="16" fill="var(--dim)" text-anchor="middle">Manufacturing · Supply · Education · Farming</text>
  <text class="t" x="726" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">Poured into thousands of industries</text>

  <text class="t" x="480" y="508" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">One competes on height, the other on width</text>
</svg>
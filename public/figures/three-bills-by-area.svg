<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三個底部對齊的正方形，面積代表金額：左邊一個巨大方塊，中間一個小方塊，右邊一個幾乎看不見的點，相差五百倍">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; }
    .c { font-size:22px; font-weight:700; }
    .ac { fill:var(--accent); }
    .dm { fill:var(--dim); }
</style>
<text x="60" y="52" class="t">同一天的工作，三種帳單</text>
<text x="900" y="52" class="s dm" text-anchor="end">面積＝金額</text>
<rect x="70" y="100" width="380" height="380" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
<text x="92" y="140" class="g">$80,000</text>
<text x="92" y="166" class="b dm">無快取・全 Opus 級</text>
<rect x="540" y="432" width="48" height="48" fill="var(--accent)"/>
<text x="564" y="382" class="s dm" text-anchor="middle">實際：快取＋Sonnet</text>
<text x="564" y="412" class="g" text-anchor="middle">$1,300</text>
<rect x="760" y="463" width="17" height="17" fill="var(--accent)"/>
<text x="768" y="414" class="s dm" text-anchor="middle">換 GLM 5.3</text>
<text x="768" y="444" class="g" text-anchor="middle">$150</text>
<line x1="50" y1="480" x2="910" y2="480" stroke="var(--line)" stroke-width="2"/>
<text x="564" y="510" class="s dm" text-anchor="middle">省錢指令：用量再 −85%</text>
<text x="700" y="230" class="c ac" text-anchor="middle">差 500 倍</text>
</svg>
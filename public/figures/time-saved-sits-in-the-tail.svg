<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="柱狀圖由左到右升高，左側多數極低、右端少數很高，中位數在低處">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .d { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700">省下的時間長在尾巴上</text>
<text class="d" x="60" y="94" font-size="16">每根柱子＝一件案子省下的時間</text>

<line x1="110" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="110" y1="140" x2="110" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="d" x="60" y="150" font-size="16" transform="rotate(-90 60 150)">省下的時間</text>

<rect x="124" y="434" width="26" height="6" fill="var(--grey)"/>
<rect x="160" y="432" width="26" height="8" fill="var(--grey)"/>
<rect x="196" y="430" width="26" height="10" fill="var(--grey)"/>
<rect x="232" y="428" width="26" height="12" fill="var(--grey)"/>
<rect x="268" y="424" width="26" height="16" fill="var(--grey)"/>
<rect x="304" y="420" width="26" height="20" fill="var(--grey)"/>
<rect x="340" y="414" width="26" height="26" fill="var(--grey)"/>
<rect x="376" y="406" width="26" height="34" fill="var(--grey)"/>
<rect x="412" y="396" width="26" height="44" fill="var(--grey)"/>
<rect x="448" y="382" width="26" height="58" fill="var(--grey)"/>
<rect x="484" y="364" width="26" height="76" fill="var(--grey)"/>
<rect x="520" y="340" width="26" height="100" fill="var(--grey)"/>
<rect x="556" y="312" width="26" height="128" fill="var(--accent)"/>
<rect x="592" y="282" width="26" height="158" fill="var(--accent)"/>
<rect x="628" y="248" width="26" height="192" fill="var(--accent)"/>
<rect x="664" y="214" width="26" height="226" fill="var(--accent)"/>
<rect x="700" y="188" width="26" height="252" fill="var(--accent)"/>
<rect x="736" y="166" width="26" height="274" fill="var(--accent)"/>
<rect x="772" y="150" width="26" height="290" fill="var(--accent)"/>
<rect x="808" y="140" width="26" height="300" fill="var(--accent)"/>

<line x1="330" y1="130" x2="330" y2="440" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="t" x="240" y="122" font-size="19" font-weight="700" fill="var(--warn)">中位數</text>

<text class="d" x="124" y="476" font-size="16">機關本來就準時</text>
<text class="t" x="640" y="476" font-size="19" font-weight="700">期限沒守、核准後被告</text>
<text class="t" x="60" y="528" font-size="22" font-weight="700">好案子拿到確定性，壞案子拿到時間</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two lines compared: export orders keep rising while exports stay flat for three months and only turn upward in August.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="80" y="76">Orders lead, shipments follow</text>

<line x1="140" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="120" x2="140" y2="400" stroke="var(--line)" stroke-width="2"/>

<polyline points="200,320 360,276 520,236 760,180" fill="none" stroke="var(--grey)" stroke-width="5"/>
<text class="g" x="770" y="172" fill="var(--dim)">Orders</text>

<polyline points="200,350 360,348 520,346 760,226" fill="none" stroke="var(--accent)" stroke-width="6"/>
<circle cx="760" cy="226" r="8" fill="var(--accent)"/>
<text class="g" x="770" y="246" fill="var(--accent)">Exports</text>

<text class="b" x="200" y="432" text-anchor="middle">May</text>
<text class="b" x="360" y="432" text-anchor="middle">Jun</text>
<text class="b" x="520" y="432" text-anchor="middle">Jul</text>
<text class="b" x="760" y="432" text-anchor="middle">Aug</text>

<text class="b" x="300" y="384">Booked, not yet shipped</text>
<text class="c" x="140" y="492">Check talk against a number it can't move</text>
</svg>
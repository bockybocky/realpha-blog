<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="縱向信用成本刻度，低評級與 CoreWeave 在上緣跳升，高評級與專案債貼在下緣">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">壓力只堆在最上面一段</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">同一時間的借錢成本</text>

<line x1="300" y1="150" x2="300" y2="470" stroke="var(--line)" stroke-width="3"/>
<text class="t" x="214" y="146" font-size="16" fill="var(--dim)">貴</text>
<text class="t" x="214" y="482" font-size="16" fill="var(--dim)">便宜</text>

<rect x="300" y="150" width="520" height="110" rx="8" fill="var(--warn)" opacity="0.14"/>
<circle cx="340" cy="180" r="9" fill="var(--warn)"/>
<text class="t" x="364" y="187" font-size="19" font-weight="700" fill="var(--ink)">CCC 級 16.5%</text>
<text class="t" x="600" y="187" font-size="16" fill="var(--dim)">回到 2022 高點</text>
<circle cx="340" cy="228" r="9" fill="var(--warn)"/>
<text class="t" x="364" y="235" font-size="19" font-weight="700" fill="var(--ink)">CoreWeave 債 15%</text>
<text class="t" x="600" y="235" font-size="16" fill="var(--dim)">評等 B+ 到 BB−</text>

<circle cx="340" cy="310" r="9" fill="var(--grey)"/>
<text class="t" x="364" y="317" font-size="19" fill="var(--ink)">高收益債整體 8%</text>

<rect x="300" y="360" width="520" height="110" rx="8" fill="var(--accent)" opacity="0.12"/>
<circle cx="340" cy="392" r="9" fill="var(--accent)"/>
<text class="t" x="364" y="399" font-size="19" font-weight="700" fill="var(--ink)">巨頭擔保專案債 2%～3%</text>
<text class="t" x="700" y="399" font-size="16" fill="var(--dim)">沒跟著跳</text>
<circle cx="340" cy="440" r="9" fill="var(--accent)"/>
<text class="t" x="364" y="447" font-size="19" font-weight="700" fill="var(--ink)">AAA 級 0.55%</text>
<text class="t" x="700" y="447" font-size="16" fill="var(--dim)">仍在低檔</text>

<line x1="60" y1="510" x2="900" y2="510" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="550" font-size="22" font-weight="700" fill="var(--ink)">同一條供應鏈，兩種借錢成本</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A pricing staircase cut off by one rule, with competitor adoption rising quickly from zero on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">The price hikes rested on that rule</text>

<text class="t" x="60" y="118" font-size="19" font-weight="700" fill="var(--dim)">Price per score</text>
<rect x="70" y="400" width="70" height="30" fill="var(--grey)"/>
<rect x="155" y="360" width="70" height="70" fill="var(--grey)"/>
<rect x="240" y="300" width="70" height="130" fill="var(--grey)"/>
<rect x="325" y="210" width="70" height="220" fill="var(--accent)"/>
<text class="t" x="105" y="390" font-size="16" fill="var(--dim)" text-anchor="middle">0.6</text>
<text class="t" x="360" y="198" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">10</text>
<text class="t" x="70" y="452" font-size="16" fill="var(--dim)">Two decades of monopoly</text>

<path d="M50 180 L420 150" stroke="var(--warn)" stroke-width="4"/>
<text class="t" x="50" y="138" font-size="19" font-weight="700" fill="var(--warn)">One order</text>

<line x1="470" y1="120" x2="470" y2="470" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="520" y="118" font-size="19" font-weight="700" fill="var(--dim)">Competitor adoption</text>
<line x1="520" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>

<rect x="560" y="420" width="50" height="10" fill="var(--grey)"/>
<text class="t" x="585" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">Before</text>
<rect x="650" y="265" width="50" height="165" fill="var(--warn)"/>
<text class="t" x="675" y="253" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">41%</text>
<text class="t" x="675" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">One firm</text>
<rect x="760" y="325" width="50" height="105" fill="var(--warn)"/>
<text class="t" x="785" y="313" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">26%</text>
<text class="t" x="785" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">Another</text>

<text class="t" x="60" y="528" font-size="22" font-weight="700" fill="var(--ink)">The rule changed, and within months so did the winner</text>
</svg>
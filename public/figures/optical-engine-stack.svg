<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="基板上並排加速器與兩層疊起來的光學引擎，光纖從側邊接出">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:700; fill:var(--ink); }
    .body { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text x="60" y="56" class="title">光學引擎：兩塊晶片疊起來，再接光纖</text>
  <rect x="80" y="440" width="740" height="56" fill="var(--grey)"/>
  <text x="450" y="474" class="body" text-anchor="middle" style="fill:var(--ink)">封裝基板</text>
  <rect x="110" y="290" width="300" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="260" y="360" class="grp" text-anchor="middle">AI 加速器</text>
  <text x="260" y="386" class="body" text-anchor="middle">GPU／記憶體</text>
  <line x1="410" y1="420" x2="500" y2="420" stroke="var(--dim)" stroke-width="4"/>
  <text x="455" y="408" class="body" text-anchor="middle">短銅線</text>
  <rect x="500" y="370" width="280" height="70" fill="var(--accent)" opacity="0.25" stroke="var(--accent)" stroke-width="2"/>
  <text x="640" y="412" class="grp" text-anchor="middle">矽光子晶片</text>
  <rect x="530" y="290" width="220" height="80" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="640" y="326" class="grp" text-anchor="middle">電路晶片</text>
  <text x="640" y="352" class="body" text-anchor="middle">3 奈米</text>
  <path d="M510,292 L500,292 L500,368 L510,368" fill="none" stroke="var(--dim)" stroke-width="2"/>
  <text x="640" y="272" class="body" text-anchor="middle">3D 整合</text>
  <path d="M780,405 L860,405 C 900,405 910,380 920,330" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
  <text x="920" y="316" class="grp" text-anchor="end" style="fill:var(--accent)">光纖</text>
  <circle cx="780" cy="405" r="16" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <text x="800" y="540" class="grp" text-anchor="middle" style="fill:var(--warn)">最難接的一步</text>
  <line x1="790" y1="520" x2="782" y2="425" stroke="var(--warn)" stroke-width="2"/>
  <text x="60" y="574" class="end">封裝裡再塞一個新功能＝難上加難</text>
</svg>
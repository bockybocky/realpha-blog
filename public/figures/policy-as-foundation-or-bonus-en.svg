<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two stacks of blocks: on the left, pulling out the bottom policy block topples the three blocks above it; on the right, pulling out the top policy block leaves the three below standing.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="60">After you pull the policy line out</text>
<text class="d" x="60" y="90">Same case, policy sitting in a different place</text>

<line x1="480" y1="120" x2="480" y2="450" stroke="var(--line)" stroke-width="2"/>

<text class="g" x="60" y="146">Policy at the base</text>
<rect x="60" y="166" width="170" height="42" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="145" y="194" text-anchor="middle">Growth</text>
<rect x="60" y="212" width="170" height="42" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="145" y="240" text-anchor="middle">Balance sheet</text>
<rect x="60" y="258" width="170" height="42" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="145" y="286" text-anchor="middle">Operations</text>
<rect x="60" y="304" width="170" height="42" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
<text class="b" x="145" y="332" text-anchor="middle">Policy backing</text>
<line x1="60" y1="358" x2="230" y2="358" stroke="var(--line)" stroke-width="2"/>

<path d="M262 262 L318 262" stroke="var(--grey)" stroke-width="2.5" fill="none"/>
<path d="M306 254 L318 262 L306 270" stroke="var(--grey)" stroke-width="2.5" fill="none"/>
<text class="d" x="290" y="242" text-anchor="middle">Pull out</text>

<g transform="rotate(-14 435 358)">
<rect x="350" y="230" width="170" height="42" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="435" y="258" text-anchor="middle">Growth</text>
<rect x="350" y="276" width="170" height="42" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="435" y="304" text-anchor="middle">Balance sheet</text>
<rect x="350" y="322" width="170" height="42" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="435" y="350" text-anchor="middle">Operations</text>
</g>
<line x1="350" y1="382" x2="520" y2="382" stroke="var(--line)" stroke-width="2"/>
<text class="d" x="145" y="416">Foundation of the case</text>
<text class="d" x="435" y="416" text-anchor="middle">Falls</text>

<text class="g" x="530" y="146">Policy on top</text>
<rect x="530" y="166" width="170" height="42" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
<text class="b" x="615" y="194" text-anchor="middle">Policy backing</text>
<rect x="530" y="212" width="170" height="42" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="615" y="240" text-anchor="middle">Growth</text>
<rect x="530" y="258" width="170" height="42" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="615" y="286" text-anchor="middle">Balance sheet</text>
<rect x="530" y="304" width="170" height="42" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="615" y="332" text-anchor="middle">Operations</text>
<line x1="530" y1="358" x2="700" y2="358" stroke="var(--line)" stroke-width="2"/>

<path d="M732 262 L788 262" stroke="var(--grey)" stroke-width="2.5" fill="none"/>
<path d="M776 254 L788 262 L776 270" stroke="var(--grey)" stroke-width="2.5" fill="none"/>
<text class="d" x="760" y="242" text-anchor="middle">Pull out</text>

<rect x="820" y="212" width="140" height="42" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="890" y="240" text-anchor="middle">Growth</text>
<rect x="820" y="258" width="140" height="42" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="890" y="286" text-anchor="middle">Balance sheet</text>
<rect x="820" y="304" width="140" height="42" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="890" y="332" text-anchor="middle">Operations</text>
<line x1="820" y1="358" x2="960" y2="358" stroke="var(--line)" stroke-width="2"/>
<text class="d" x="615" y="416">A bonus</text>
<text class="d" x="890" y="416" text-anchor="middle">Stands</text>

<text class="c" x="60" y="500">What still stands after you pull it out is your part.</text>
</svg>
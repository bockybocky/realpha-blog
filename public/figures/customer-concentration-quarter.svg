<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條營收長條，左側四分之一被單獨標示為兩個客戶，其餘四分之三為所有其他客戶">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="80" y="68">這家公司的營收由誰付</text>

  <rect x="80" y="220" width="200" height="130" rx="6" fill="var(--warn)"/>
  <rect x="280" y="220" width="600" height="130" rx="6" fill="var(--grey)"/>
  <line x1="280" y1="200" x2="280" y2="370" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 6"/>

  <text class="g" x="180" y="196" text-anchor="middle" fill="var(--warn)">兩個客戶</text>
  <text class="g" x="580" y="196" text-anchor="middle" fill="var(--dim)">其他所有客戶</text>
  <text class="c" x="180" y="300" text-anchor="middle" fill="var(--page)">四分之一</text>

  <text class="b" x="80" y="416">虧損：投資</text>
  <text class="b" x="80" y="444">集中度：結構</text>
</svg>
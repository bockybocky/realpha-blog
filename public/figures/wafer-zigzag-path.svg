<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條折線在四個製程區之間來回折返，反覆回到黃光區，顯示晶圓在廠內走的是來回路線而非直線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl{font-size:27px;fill:var(--ink);font-weight:700}
    .grp{font-size:20px;fill:var(--ink);font-weight:600}
    .bd{font-size:16px;fill:var(--dim)}
    .cc{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="ttl" x="60" y="62">一片晶圓在廠內走的路</text>
<rect x="200" y="140" width="460" height="44" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="200" y="210" width="460" height="44" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="200" y="280" width="460" height="44" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="200" y="350" width="460" height="44" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="grp" x="182" y="169" text-anchor="end">黃光</text>
<text class="grp" x="182" y="239" text-anchor="end">蝕刻</text>
<text class="grp" x="182" y="309" text-anchor="end">薄膜</text>
<text class="grp" x="182" y="379" text-anchor="end">離子植入</text>
<polyline points="225,162 267,232 309,162 351,302 393,162 435,232 477,162 519,372 561,162 603,232 645,162" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
<circle cx="225" cy="162" r="5" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="267" cy="232" r="5" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="309" cy="162" r="5" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="351" cy="302" r="5" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="393" cy="162" r="5" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="435" cy="232" r="5" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="477" cy="162" r="5" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="519" cy="372" r="5" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="561" cy="162" r="5" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="603" cy="232" r="5" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="645" cy="162" r="7" fill="var(--accent)"/>
<rect x="700" y="140" width="200" height="254" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="grp" x="724" y="190">8 到 10 英里</text>
<text class="bd" x="724" y="215">廠內總移動</text>
<text class="grp" x="724" y="265">250 台</text>
<text class="bd" x="724" y="290">經過的機台</text>
<text class="grp" x="724" y="340">12 趟</text>
<text class="bd" x="724" y="365">黃光重複次數</text>
<text class="bd" x="200" y="425">同一道製程要回來很多次</text>
<text class="cc" x="60" y="478">決定它多久出得來的，是路線長度，不是機台數量。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Of the three exit conditions, the first two connect to a source of observation and the third breaks off partway.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">Three exits, two visible</text>
<text class="t" x="60" y="112" font-size="19" fill="var(--dim)">Condition</text>
<text class="t" x="620" y="112" font-size="19" fill="var(--dim)">Where I see it</text>
<rect x="60" y="140" width="300" height="72" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="86" y="184" font-size="19" fill="var(--ink)">Capex collapses</text>
<line x1="360" y1="176" x2="600" y2="176" stroke="var(--accent)" stroke-width="3"/>
<path d="M592 168 L610 176 L592 184 Z" fill="var(--accent)"/>
<rect x="620" y="140" width="280" height="72" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="646" y="184" font-size="19" fill="var(--ink)">Guidance</text>
<rect x="60" y="250" width="300" height="72" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="86" y="294" font-size="19" fill="var(--ink)">Fed acts</text>
<line x1="360" y1="286" x2="600" y2="286" stroke="var(--accent)" stroke-width="3"/>
<path d="M592 278 L610 286 L592 294 Z" fill="var(--accent)"/>
<rect x="620" y="250" width="280" height="72" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="646" y="294" font-size="19" fill="var(--ink)">Statement wording</text>
<rect x="60" y="360" width="300" height="72" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="86" y="404" font-size="19" fill="var(--ink)">Data center denied</text>
<line x1="360" y1="396" x2="470" y2="396" stroke="var(--warn)" stroke-width="3"/>
<line x1="500" y1="376" x2="530" y2="416" stroke="var(--warn)" stroke-width="3"/>
<rect x="620" y="360" width="280" height="72" rx="8" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
<text class="t" x="748" y="406" font-size="22" fill="var(--warn)">?</text>
<text class="t" x="60" y="500" font-size="22" fill="var(--ink)">Unseen means blind</text>
</svg>
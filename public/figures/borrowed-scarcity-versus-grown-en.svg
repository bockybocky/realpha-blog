<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Borrowed scarcity is a spike that falls back, while grown scarcity is a curve that climbs slowly and never returns.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Borrowed scarcity vs grown</text>

<path d="M110 460 L900 460" stroke="var(--line)" stroke-width="2"/>
<path d="M110 460 L110 120" stroke="var(--line)" stroke-width="2"/>
<text x="92" y="128" font-size="16" text-anchor="end" fill="var(--dim)">Price</text>
<text x="898" y="492" font-size="16" text-anchor="end" fill="var(--dim)">Time</text>

<path d="M130 430 C 250 430 300 170 400 168 C 520 166 640 350 880 404" fill="none" stroke="var(--warn)" stroke-width="5"/>
<circle cx="400" cy="168" r="7" fill="var(--warn)"/>
<text x="400" y="142" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">Borrowed</text>
<path d="M520 230 L560 196" stroke="var(--warn)" stroke-width="2"/>
<text x="568" y="194" font-size="19" fill="var(--warn)">New supplier enters</text>
<text x="820" y="374" font-size="16" text-anchor="middle" fill="var(--warn)">Ends unannounced</text>

<path d="M130 444 C 330 440 420 400 520 330 C 650 240 760 214 880 196" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="520" cy="330" r="7" fill="var(--accent)"/>
<path d="M520 346 L520 400" stroke="var(--accent)" stroke-width="2"/>
<text x="520" y="424" font-size="19" text-anchor="middle" fill="var(--accent)">Design locked in</text>
<text x="860" y="176" font-size="20" font-weight="700" text-anchor="end" fill="var(--accent)">Grown</text>

<text x="200" y="520" font-size="19" fill="var(--warn)">Chase quotes and lists</text>
<text x="640" y="520" font-size="19" fill="var(--accent)">Track spec and position</text>
</svg>
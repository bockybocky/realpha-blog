<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="效能對價格的曲線在末端極陡，最後一成效能要付十倍價格">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">最後那一成效能最貴</text>
<text x="60" y="94" font-size="16" fill="var(--dim)">形狀為示意，數字是節目中的隨口估計</text>
<line x1="150" y1="440" x2="880" y2="440" stroke="var(--grey)" stroke-width="2"/>
<line x1="150" y1="140" x2="150" y2="440" stroke="var(--grey)" stroke-width="2"/>
<text x="76" y="156" font-size="16" fill="var(--dim)">價格</text>
<text x="800" y="470" font-size="16" fill="var(--dim)">效能</text>
<path d="M150 432 C 450 420, 660 400, 740 370 C 800 345, 820 250, 824 160" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="740" cy="370" r="10" fill="var(--warn)"/>
<text x="470" y="352" font-size="20" fill="var(--warn)">半年前的模型</text>
<text x="470" y="378" font-size="16" fill="var(--dim)">效能九成・價格一成</text>
<circle cx="824" cy="162" r="10" fill="var(--accent)"/>
<text x="600" y="156" font-size="20" fill="var(--accent)">最新的全脂模型</text>
<text x="600" y="130" font-size="16" fill="var(--dim)">效能十成・價格十成</text>
<text x="60" y="520" font-size="22" fill="var(--ink)">問的不是哪個模型最好，是自己的使用情境落在曲線哪一段</text>
</svg>
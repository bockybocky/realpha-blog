<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The data centre on the left can be cleared out and walked away from, while the fab's tools on the right are rooted to the ground and cannot leave.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs>
<marker id="arw10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
</marker>
</defs>
<text x="60" y="52" font-size="27" fill="var(--ink)">When it is time to leave</text>
<rect x="56" y="86" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="118" font-size="20" fill="var(--ink)">Data centre</text>
<rect x="100" y="250" width="70" height="70" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="186" y="250" width="70" height="70" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="272" y="250" width="70" height="70" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M100 340 L410 340" stroke="var(--line)" stroke-width="2"/>
<path d="M352 190 L440 190" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#arw10)"/>
<text x="150" y="196" font-size="19" fill="var(--accent)">Wipe the data · clear out and go</text>
<rect x="504" y="86" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="528" y="118" font-size="20" fill="var(--ink)">Wafer fab</text>
<rect x="548" y="240" width="80" height="100" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<rect x="650" y="240" width="80" height="100" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<rect x="752" y="240" width="80" height="100" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<path d="M560 340 L560 390 M588 340 L600 392 M616 340 L612 388" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M662 340 L662 390 M690 340 L702 392 M718 340 L714 388" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M764 340 L764 390 M792 340 L804 392 M820 340 L816 388" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M528 340 L880 340" stroke="var(--ink)" stroke-width="4"/>
<path d="M840 190 L890 190" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 5" fill="none"/>
<path d="M862 168 L886 212 M886 168 L862 212" stroke="var(--warn)" stroke-width="4"/>
<text x="560" y="196" font-size="19" fill="var(--warn)">Only leaves if ripped out whole</text>
<text x="60" y="508" font-size="22" fill="var(--ink)">Tools grow into the ground</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two panels showing the same row of houses: the left panel has three crossing, zigzagging routes; the right panel has one straight route running from end to end.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">One street</text>
  <rect x="60" y="88" width="400" height="356" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="88" width="400" height="356" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="88" y="126">No coordination</text>
  <text class="g" x="528" y="126">After the agents talk</text>
  <path d="M90 390 L430 390" stroke="var(--grey)" stroke-width="3"/>
  <path d="M530 390 L870 390" stroke="var(--grey)" stroke-width="3"/>
  <g fill="var(--grey)">
    <polygon points="100,360 128,336 156,360 156,384 100,384"/>
    <polygon points="166,360 194,336 222,360 222,384 166,384"/>
    <polygon points="232,360 260,336 288,360 288,384 232,384"/>
    <polygon points="298,360 326,336 354,360 354,384 298,384"/>
    <polygon points="364,360 392,336 420,360 420,384 364,384"/>
    <polygon points="540,360 568,336 596,360 596,384 540,384"/>
    <polygon points="606,360 634,336 662,360 662,384 606,384"/>
    <polygon points="672,360 700,336 728,360 728,384 672,384"/>
    <polygon points="738,360 766,336 794,360 794,384 738,384"/>
    <polygon points="804,360 832,336 860,360 860,384 804,384"/>
  </g>
  <path d="M100 300 C 180 240 240 320 330 258" stroke="var(--warn)" stroke-width="3" fill="none"/>
  <path d="M110 240 C 210 300 300 200 420 270" stroke="var(--warn)" stroke-width="3" fill="none"/>
  <path d="M130 190 C 240 250 300 160 400 210" stroke="var(--warn)" stroke-width="3" fill="none"/>
  <text class="s" x="110" y="166">Three trucks, three trips</text>
  <path d="M540 250 L856 250" stroke="var(--accent)" stroke-width="5"/>
  <path d="M842 240 L862 250 L842 260" fill="var(--accent)"/>
  <text class="s" x="540" y="226">One trip, all done</text>
  <text class="c" x="60" y="494">No one could afford to coordinate; now they can</text>
</svg>
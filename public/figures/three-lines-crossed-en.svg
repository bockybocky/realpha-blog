<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three horizontal bars side by side, each crossing the same vertical dashed boundary to the right">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="72">Three limits, all breached</text>

<line x1="640" y1="132" x2="640" y2="500" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
<text class="b" x="640" y="118" text-anchor="middle">Limit</text>

<text class="g" x="60" y="205">Economic</text>
<text class="b" x="60" y="232">Debt &amp;gt; growth</text>
<rect x="270" y="192" width="370" height="36" rx="6" fill="var(--accent)" opacity="0.55"/>
<rect x="640" y="192" width="120" height="36" rx="6" fill="var(--warn)"/>

<text class="g" x="60" y="325">Fiscal</text>
<text class="b" x="60" y="352">Deficit &amp;gt; taxes</text>
<rect x="270" y="312" width="370" height="36" rx="6" fill="var(--accent)" opacity="0.55"/>
<rect x="640" y="312" width="180" height="36" rx="6" fill="var(--warn)"/>

<text class="g" x="60" y="445">Inflation</text>
<text class="b" x="60" y="472">Prices &amp;gt; promises</text>
<rect x="270" y="432" width="370" height="36" rx="6" fill="var(--accent)" opacity="0.55"/>
<rect x="640" y="432" width="240" height="36" rx="6" fill="var(--warn)"/>

<text class="c" x="60" y="528">All three crossed; only "when" is left</text>
</svg>
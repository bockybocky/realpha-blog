<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="零到一的軸上三個位置：風暴前落在左端已被劃為回不去的灰區，鷹派全贏在最右端，復職後落在中間">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t27{font-size:27px;font-weight:700;fill:var(--ink)}
.t19{font-size:19px;font-weight:700;fill:var(--ink)}
.t15{font-size:15px;fill:var(--dim)}
.t22{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t27" x="48" y="46">管制的力度，停在零與一中間</text>

<rect x="140" y="276" width="140" height="48" fill="var(--card)"/>
<text class="t15" x="210" y="348" text-anchor="middle">回不去</text>
<line x1="140" y1="300" x2="860" y2="300" stroke="var(--grey)" stroke-width="4"/>
<line x1="140" y1="276" x2="140" y2="324" stroke="var(--grey)" stroke-width="4"/>
<line x1="860" y1="276" x2="860" y2="324" stroke="var(--grey)" stroke-width="4"/>
<text class="t15" x="140" y="252" text-anchor="middle">零</text>
<text class="t15" x="860" y="252" text-anchor="middle">一</text>
<text class="t15" x="140" y="380" text-anchor="middle">什麼都沒變</text>
<text class="t15" x="860" y="380" text-anchor="middle">全面禁止</text>

<circle cx="210" cy="300" r="13" fill="var(--grey)"/>
<line x1="210" y1="287" x2="210" y2="200" stroke="var(--grey)" stroke-width="2"/>
<text class="t19" x="210" y="186" text-anchor="middle">風暴前一個月</text>

<circle cx="530" cy="300" r="15" fill="var(--accent)"/>
<line x1="530" y1="315" x2="530" y2="420" stroke="var(--accent)" stroke-width="2"/>
<text class="t19" x="530" y="444" text-anchor="middle">復職後的落點</text>

<circle cx="860" cy="300" r="13" fill="var(--warn)"/>
<line x1="860" y1="287" x2="860" y2="200" stroke="var(--warn)" stroke-width="2"/>
<text class="t19" x="860" y="186" text-anchor="middle">鷹派全贏的想像</text>

<text class="t22" x="48" y="492">不會歸零，也不會全拿</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊護欄是模型外的一道牆，右邊判斷長在模型裡面把請求折返">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<defs>
<marker id="f8d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker>
<marker id="f8a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="64" class="t">護欄在模型外面，還是裡面</text>
<line x1="480" y1="110" x2="480" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="250" y="140" class="g" text-anchor="middle">外掛擋住</text>
<line x1="70" y1="290" x2="190" y2="290" stroke="var(--dim)" stroke-width="3" marker-end="url(#f8d)"/>
<text x="120" y="270" class="b" text-anchor="middle">請求</text>
<rect x="196" y="200" width="22" height="180" rx="4" fill="var(--warn)"/>
<text x="207" y="190" class="b" text-anchor="middle" style="fill:var(--warn)">分類器</text>
<circle cx="350" cy="290" r="72" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="350" y="297" class="g" text-anchor="middle">模型</text>
<text x="350" y="400" class="b" text-anchor="middle">裡面沒學到</text>
<text x="720" y="140" class="g" text-anchor="middle">學進去</text>
<circle cx="760" cy="290" r="100" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="760" y="222" class="g" text-anchor="middle">模型</text>
<circle cx="785" cy="295" r="40" fill="var(--accent)"/>
<text x="785" y="301" class="g" text-anchor="middle" style="fill:var(--page)">判斷</text>
<line x1="530" y1="270" x2="738" y2="270" stroke="var(--dim)" stroke-width="3" marker-end="url(#f8d)"/>
<text x="580" y="250" class="b" text-anchor="middle">請求</text>
<line x1="738" y1="320" x2="540" y2="320" stroke="var(--accent)" stroke-width="3" marker-end="url(#f8a)"/>
<text x="590" y="348" class="b" text-anchor="middle" style="fill:var(--accent)">拒絕</text>
<text x="480" y="470" class="c" text-anchor="middle">攔得住，不等於學得會</text>
</svg>
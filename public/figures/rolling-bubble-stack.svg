<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="由左往右升高的階梯上放著大小不同的圓，左側的圓已縮小、中央的圓最大、右側的圓還很小，箭頭沿階梯往右">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">滾動泡沫：一顆接一顆，不是一顆爆掉</text>

<rect x="80" y="396" width="176" height="60" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="264" y="352" width="176" height="104" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="448" y="308" width="176" height="148" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="632" y="264" width="176" height="192" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

<circle cx="168" cy="360" r="22" fill="var(--grey)" opacity="0.5"/>
<circle cx="352" cy="292" r="58" fill="var(--accent)" opacity="0.3" stroke="var(--accent)" stroke-width="2"/>
<circle cx="536" cy="252" r="34" fill="var(--accent)" opacity="0.2" stroke="var(--accent)" stroke-width="2"/>
<circle cx="720" cy="216" r="16" fill="var(--accent)" opacity="0.16" stroke="var(--accent)" stroke-width="2"/>

<text class="t" x="168" y="432" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">原物料</text>
<text class="t" x="352" y="432" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">基礎設施</text>
<text class="t" x="536" y="432" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">模型</text>
<text class="t" x="720" y="432" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">應用</text>

<text class="t" x="168" y="332" font-size="15" fill="var(--dim)" text-anchor="middle">已消風</text>
<text class="t" x="352" y="222" font-size="15" fill="var(--dim)" text-anchor="middle">未見頂</text>
<text class="t" x="536" y="206" font-size="15" fill="var(--dim)" text-anchor="middle">商品化中</text>
<text class="t" x="720" y="188" font-size="15" fill="var(--dim)" text-anchor="middle">還沒起飛</text>

<path d="M100 496 L840 496" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M856 496 l-20 -9 l0 18 z" fill="var(--accent)"/>
<text class="t" x="884" y="502" font-size="16" fill="var(--dim)" text-anchor="end"> </text>
<text class="t" x="480" y="534" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">主題對了，你站的那一階不一定對</text>
</svg>
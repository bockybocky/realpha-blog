<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two wide blocks on the left and right are pinched by a narrow neck in the middle, and that neck is chip and equipment capacity.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">Both ends of one chain, pinched by the same narrow gate</text>

  <rect x="60" y="130" width="250" height="230" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="80" y="170" font-size="20" fill="var(--accent)">The money end</text>
  <text x="80" y="212" font-size="16" fill="var(--ink)">SpaceX</text>
  <text x="80" y="244" font-size="16" fill="var(--dim)">Data center leasing</text>
  <text x="80" y="276" font-size="16" fill="var(--dim)">Payback in 6 months</text>
  <text x="80" y="320" font-size="16" fill="var(--dim)">Q4 guide 35–40B</text>

  <rect x="650" y="130" width="250" height="230" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="670" y="170" font-size="20" fill="var(--accent)">Order end</text>
  <text x="670" y="212" font-size="16" fill="var(--ink)">PCB makers</text>
  <text x="670" y="244" font-size="16" fill="var(--dim)">Fully loaded</text>
  <text x="670" y="276" font-size="16" fill="var(--dim)">30-mo tool lead</text>
  <text x="670" y="320" font-size="16" fill="var(--dim)">Material gap 20–40%</text>

  <path d="M330 150 L450 220 L450 280 L330 350 Z" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <path d="M630 150 L510 220 L510 280 L630 350 Z" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="450" y="220" width="60" height="60" fill="var(--warn)" opacity="0.25"/>
  <text x="480" y="410" font-size="20" fill="var(--warn)" text-anchor="middle">Narrow gate</text>
  <text x="480" y="440" font-size="16" fill="var(--dim)" text-anchor="middle">Chip capacity</text>
  <text x="480" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">Tool delivery order</text>

  <text x="60" y="490" font-size="22" fill="var(--ink)">Money ≠ goods</text>
</svg>
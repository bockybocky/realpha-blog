<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="零線上方一根收錢的柱、下方一根付錢的柱，方向相反">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">對沖的持有成本，決定你抱多久</text>

  <line x1="120" y1="290" x2="880" y2="290" stroke="var(--line)" stroke-width="3"/>
  <text class="t" x="96" y="297" font-size="16" text-anchor="end" fill="var(--dim)">0</text>

  <rect x="230" y="290" width="150" height="130" fill="var(--warn)"/>
  <text class="t" x="305" y="455" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">每年倒貼</text>
  <text class="t" x="305" y="483" font-size="16" text-anchor="middle" fill="var(--dim)">150 個基點</text>
  <text class="t" x="305" y="265" font-size="19" text-anchor="middle" fill="var(--dim)">空法債、多德債</text>

  <rect x="620" y="150" width="150" height="140" fill="var(--accent)"/>
  <text class="t" x="695" y="130" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">每年收錢</text>
  <text class="t" x="695" y="105" font-size="16" text-anchor="middle" fill="var(--dim)">150～500 個基點</text>
  <text class="t" x="695" y="325" font-size="19" text-anchor="middle" fill="var(--dim)">賣歐元、買北歐貨幣</text>

  <text class="t" x="60" y="505" font-size="22" font-weight="700" fill="var(--ink)">倒貼的那種，會在用到之前被平掉</text>
</svg>
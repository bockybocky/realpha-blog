<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A one-minute clip is made of twenty separately generated three-second shots, and the face does not match across a few of them.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62">One minute = twenty regenerations</text>

  <g>
    <rect x="60" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="79" cy="195" r="11" fill="var(--accent)"/>
    <rect x="102" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="121" cy="195" r="11" fill="var(--accent)"/>
    <rect x="144" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="163" cy="195" r="11" fill="var(--accent)"/>
    <rect x="186" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/><circle cx="205" cy="182" r="14" fill="var(--warn)"/>
    <rect x="228" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="247" cy="195" r="11" fill="var(--accent)"/>
    <rect x="270" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="289" cy="195" r="11" fill="var(--accent)"/>
    <rect x="312" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/><circle cx="337" cy="205" r="8" fill="var(--warn)"/>
    <rect x="354" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="373" cy="195" r="11" fill="var(--accent)"/>
    <rect x="396" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="415" cy="195" r="11" fill="var(--accent)"/>
    <rect x="438" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="457" cy="195" r="11" fill="var(--accent)"/>
    <rect x="480" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="499" cy="195" r="11" fill="var(--accent)"/>
    <rect x="522" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/><circle cx="541" cy="212" r="13" fill="var(--warn)"/>
    <rect x="564" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="583" cy="195" r="11" fill="var(--accent)"/>
    <rect x="606" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="625" cy="195" r="11" fill="var(--accent)"/>
    <rect x="648" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="667" cy="195" r="11" fill="var(--accent)"/>
    <rect x="690" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/><circle cx="715" cy="180" r="9" fill="var(--warn)"/>
    <rect x="732" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="751" cy="195" r="11" fill="var(--accent)"/>
    <rect x="774" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="793" cy="195" r="11" fill="var(--accent)"/>
    <rect x="816" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="835" cy="195" r="11" fill="var(--accent)"/>
    <rect x="858" y="150" width="38" height="90" rx="4" fill="var(--card)" stroke="var(--line)"/><circle cx="877" cy="195" r="11" fill="var(--accent)"/>
  </g>

  <path d="M60 280 H896" stroke="var(--line)" stroke-width="2"/>
  <text class="s" x="60" y="310">Three seconds a cell, one action</text>
  <text class="s" x="760" y="310">One minute</text>

  <circle cx="90" cy="380" r="9" fill="var(--warn)"/>
  <text class="g" x="112" y="388">Face mismatch</text>
  <text class="c" x="60" y="450">Higher resolution only makes these cells stand out more</text>
</svg>
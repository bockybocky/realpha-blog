<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="長度對比：書櫃把拿到的那段縮得很短，但挑選章節那段最長且完全沒縮短">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">按鈕縮短的是哪一段</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">條越長＝花的時間越多</text>

<text class="t" x="60" y="166" font-size="19" fill="var(--dim)">拿到（自己找）</text>
<rect x="300" y="146" width="300" height="28" rx="4" fill="var(--grey)"/>
<text class="t" x="616" y="166" font-size="15" fill="var(--dim)">找站、下載、上傳</text>

<text class="t" x="60" y="238" font-size="19" fill="var(--ink)">拿到（按書櫃）</text>
<rect x="300" y="218" width="60" height="28" rx="4" fill="var(--accent)"/>
<text class="t" x="376" y="238" font-size="15" fill="var(--accent)">一步</text>

<line x1="300" y1="276" x2="860" y2="276" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="60" y="344" font-size="19" fill="var(--ink)" font-weight="700">挑選</text>
<rect x="300" y="324" width="600" height="28" rx="4" fill="var(--warn)"/>
<text class="t" x="300" y="384" font-size="16" fill="var(--dim)">我到底該讀哪幾章　沒有按鈕可按</text>

<text class="t" x="60" y="466" font-size="22" font-weight="700" fill="var(--ink)">省掉的是拿到，省不掉的是挑選</text>
</svg>
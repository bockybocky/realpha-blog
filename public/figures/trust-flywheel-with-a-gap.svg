<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一個環，從上方的更信它順時針轉到右邊的給更多權限，再往下通到完成更多事的那一段是斷開的虛線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">飛輪缺一口</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">信任越多，權限越多，能完成的事越多</text>
<path d="M 480 170 A 150 150 0 0 1 630 320" fill="none" stroke="var(--accent)" stroke-width="10"/>
<path d="M 630 320 A 150 150 0 0 1 480 470" fill="none" stroke="var(--warn)" stroke-width="10" stroke-dasharray="8 10"/>
<path d="M 480 470 A 150 150 0 0 1 330 320 A 150 150 0 0 1 480 170" fill="none" stroke="var(--accent)" stroke-width="10"/>
<polygon points="498,170 478,160 478,180" fill="var(--accent)"/>
<text x="480" y="150" font-size="19" fill="var(--ink)" text-anchor="middle" font-weight="700">你更信它</text>
<text x="655" y="300" font-size="19" fill="var(--ink)" font-weight="700">給它更多工具</text>
<text x="655" y="326" font-size="19" fill="var(--ink)" font-weight="700">與資料的權限</text>
<text x="480" y="500" font-size="19" fill="var(--ink)" text-anchor="middle" font-weight="700">它能完成的事更多</text>
<text x="655" y="392" font-size="19" fill="var(--warn)" font-weight="700">斷在這裡</text>
<text x="655" y="416" font-size="16" fill="var(--warn)">最後一哩</text>
<text x="60" y="530" font-size="22" fill="var(--ink)" font-weight="700">要加 LINE、要打電話，它就停在那裡</text>
</svg>
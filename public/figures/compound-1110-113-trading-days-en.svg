<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A horizontal line represents all-time highs, one dot sits on it and another 10% below, and an arrow rises across a span of time back to the line.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Down 10%, 113 days to parity</text>
<line x1="120" y1="170" x2="880" y2="170" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 6"/>
<text x="120" y="156" font-size="16" fill="var(--dim)">Record</text>
<circle cx="200" cy="170" r="11" fill="var(--accent)"/>
<text x="230" y="140" font-size="20" font-weight="700" fill="var(--ink)">Equal-weight S&amp;P at high</text>
<circle cx="200" cy="280" r="11" fill="var(--warn)"/>
<text x="230" y="288" font-size="20" font-weight="700" fill="var(--ink)">Nasdaq 100 down 10%</text>
<polyline points="240,286 560,256 806,182" fill="none" stroke="var(--warn)" stroke-width="5"/>
<polygon points="840,172 804,166 808,198" fill="var(--warn)"/>
<line x1="200" y1="350" x2="200" y2="372" stroke="var(--line)" stroke-width="2"/>
<line x1="840" y1="350" x2="840" y2="372" stroke="var(--line)" stroke-width="2"/>
<line x1="200" y1="372" x2="840" y2="372" stroke="var(--line)" stroke-width="2"/>
<text x="520" y="404" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">Avg 113 sessions</text>
<rect x="200" y="436" width="280" height="64" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="520" y="436" width="320" height="64" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="340" y="476" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">3 mo later +8.1%</text>
<text x="680" y="476" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">12 mo later +21.6%</text>
</svg>
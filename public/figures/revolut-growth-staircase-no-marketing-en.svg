<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A five-step staircase rising in equal steps, labelled with daily customer sign-ups from one to ten up to about 100,000, with a note that the first seven years had zero marketing budget.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="80" y="62" font-size="27" fill="var(--ink)">Step by step, not one jump</text>
<line x1="80" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>
<rect x="130" y="390" width="120" height="70" fill="var(--grey)" opacity="0.45"/>
<rect x="286" y="320" width="120" height="140" fill="var(--grey)" opacity="0.55"/>
<rect x="442" y="250" width="120" height="210" fill="var(--grey)" opacity="0.65"/>
<rect x="598" y="180" width="120" height="280" fill="var(--grey)" opacity="0.8"/>
<rect x="754" y="110" width="120" height="350" fill="var(--accent)"/>
<text x="190" y="378" font-size="16" fill="var(--dim)" text-anchor="middle">1–10</text>
<text x="346" y="308" font-size="16" fill="var(--dim)" text-anchor="middle">100</text>
<text x="502" y="238" font-size="16" fill="var(--dim)" text-anchor="middle">500</text>
<text x="658" y="168" font-size="16" fill="var(--dim)" text-anchor="middle">1,000</text>
<text x="814" y="98" font-size="20" fill="var(--accent)" text-anchor="middle">~100,000</text>
<text x="190" y="486" font-size="15" fill="var(--dim)" text-anchor="middle">per day</text>
<text x="814" y="486" font-size="15" fill="var(--dim)" text-anchor="middle">per day / now</text>
<text x="80" y="524" font-size="22" fill="var(--ink)">Word of mouth and PR carried seven years; the marketing budget came in 2022</text>
</g>
</svg>
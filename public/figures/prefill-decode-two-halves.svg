<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊六條橫條齊頭並進，右邊一串方塊逐個推進且下方筆記本愈疊愈厚">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="56" y="56" font-size="27" font-weight="700" fill="var(--ink)">一次推論的兩半</text>
<rect x="56" y="88" width="400" height="372" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="504" y="88" width="400" height="372" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="80" y="128" font-size="19" font-weight="700" fill="var(--accent)">prefill｜全部讀一遍</text>
<rect x="80" y="164" width="344" height="16" rx="6" fill="var(--accent)"/>
<rect x="80" y="198" width="320" height="16" rx="6" fill="var(--accent)"/>
<rect x="80" y="232" width="352" height="16" rx="6" fill="var(--accent)"/>
<rect x="80" y="266" width="300" height="16" rx="6" fill="var(--accent)"/>
<rect x="80" y="300" width="336" height="16" rx="6" fill="var(--accent)"/>
<rect x="80" y="334" width="288" height="16" rx="6" fill="var(--accent)"/>
<text x="80" y="392" font-size="16" fill="var(--dim)">同時開跑</text>
<text x="80" y="420" font-size="16" fill="var(--dim)">吃算力</text>
<text x="528" y="128" font-size="19" font-weight="700" fill="var(--accent)">decode｜一次吐一個字</text>
<rect x="528" y="160" width="30" height="30" rx="6" fill="var(--accent)"/>
<rect x="590" y="160" width="30" height="30" rx="6" fill="var(--accent)"/>
<rect x="652" y="160" width="30" height="30" rx="6" fill="var(--accent)"/>
<rect x="714" y="160" width="30" height="30" rx="6" fill="var(--accent)"/>
<rect x="776" y="160" width="30" height="30" rx="6" fill="var(--accent)"/>
<line x1="560" y1="175" x2="588" y2="175" stroke="var(--grey)" stroke-width="2"/>
<line x1="622" y1="175" x2="650" y2="175" stroke="var(--grey)" stroke-width="2"/>
<line x1="684" y1="175" x2="712" y2="175" stroke="var(--grey)" stroke-width="2"/>
<line x1="746" y1="175" x2="774" y2="175" stroke="var(--grey)" stroke-width="2"/>
<rect x="528" y="348" width="30" height="24" rx="4" fill="var(--grey)"/>
<rect x="590" y="328" width="30" height="44" rx="4" fill="var(--grey)"/>
<rect x="652" y="308" width="30" height="64" rx="4" fill="var(--grey)"/>
<rect x="714" y="288" width="30" height="84" rx="4" fill="var(--grey)"/>
<rect x="776" y="268" width="30" height="104" rx="4" fill="var(--grey)"/>
<text x="528" y="400" font-size="16" fill="var(--dim)">筆記本愈寫愈厚</text>
<text x="528" y="428" font-size="16" fill="var(--dim)">吃記憶體</text>
<text x="56" y="512" font-size="22" font-weight="700" fill="var(--ink)">後半段卡在搬資料，不在算</text>
</svg>
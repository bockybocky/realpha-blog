<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A three-block handoff note: the first and last blocks stay, the middle steps block is crossed out">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">The handoff note keeps only two paragraphs</text>
<rect x="230" y="100" width="500" height="360" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="270" y="140" width="420" height="80" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="294" y="188" font-size="20" fill="var(--ink)">What it looks like when done</text>
<rect x="270" y="240" width="420" height="80" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="294" y="288" font-size="20" fill="var(--grey)">Steps</text>
<line x1="270" y1="240" x2="690" y2="320" stroke="var(--grey)" stroke-width="2"/>
<line x1="270" y1="320" x2="690" y2="240" stroke="var(--grey)" stroke-width="2"/>
<rect x="270" y="340" width="420" height="80" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="294" y="388" font-size="20" fill="var(--ink)">How I'll know it's right</text>
<text x="758" y="188" font-size="16" fill="var(--dim)">Usually easy to write</text>
<text x="758" y="388" font-size="16" fill="var(--warn)">Often hard to write</text>
<text x="60" y="512" font-size="22" fill="var(--ink)">Can't write the second paragraph -- you haven't thought it through</text>
</svg>
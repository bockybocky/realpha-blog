<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="AI 發債去年與今年兩根柱、財政部長債一根柱，全部插進下方同一個長天期買盤的池子，今年 AI 那根最高">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); font-weight:700; }
    .gl { font-size:19px; fill:var(--ink); font-weight:700; }
    .bd { font-size:16px; fill:var(--dim); }
    .bs { font-size:15px; fill:var(--dim); }
    .cc { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ti" x="48" y="58">兩邊在搶同一批長天期買盤</text>
<text class="gl" x="310" y="132" text-anchor="middle">AI 相關發債</text>
<text class="gl" x="650" y="132" text-anchor="middle">財政部長債</text>
<rect x="210" y="260" width="90" height="140" fill="var(--grey)"/>
<rect x="320" y="200" width="90" height="200" fill="var(--accent)"/>
<rect x="590" y="220" width="120" height="180" fill="var(--accent)"/>
<text class="bs" x="255" y="248" text-anchor="middle">去年　約三千多億</text>
<text class="bs" x="365" y="188" text-anchor="middle">今年　近五千億</text>
<text class="bs" x="650" y="208" text-anchor="middle">全年　四千～四千五百億</text>
<line x1="320" y1="300" x2="410" y2="300" stroke="var(--page)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="bs" x="420" y="305">其中雲端業者一半</text>
<rect x="180" y="400" width="600" height="90" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="gl" x="480" y="452" text-anchor="middle">長天期買盤</text>
<text class="cc" x="48" y="536">雲端巨頭發的是十三到十五年，跟長債擠同一格</text>
</svg>
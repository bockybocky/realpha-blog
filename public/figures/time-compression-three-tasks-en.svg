<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three pairs of bars, the old ones long and the new ones much shorter.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .a { font-size:16px; fill:var(--accent); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70">Same job, old/new</text>

  <text class="g" x="60" y="140">Find first bug</text>
  <rect x="300" y="122" width="520" height="22" rx="4" fill="var(--grey)"/>
  <text class="d" x="834" y="140">Months</text>
  <rect x="300" y="154" width="36" height="22" rx="4" fill="var(--accent)"/>
  <text class="a" x="350" y="172">Days</text>

  <text class="g" x="60" y="260">Full iPhone chain</text>
  <rect x="300" y="242" width="460" height="22" rx="4" fill="var(--grey)"/>
  <text class="d" x="774" y="260">Team</text>
  <rect x="300" y="274" width="60" height="22" rx="4" fill="var(--accent)"/>
  <text class="a" x="374" y="292">Solo</text>

  <text class="g" x="60" y="380">Net-wide sweep</text>
  <rect x="300" y="362" width="420" height="22" rx="4" fill="var(--grey)"/>
  <text class="d" x="734" y="380">1 mo</text>
  <rect x="300" y="394" width="20" height="22" rx="4" fill="var(--accent)"/>
  <text class="a" x="334" y="412">Next</text>

  <line x1="60" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>
  <text class="c" x="60" y="512">Every task, not one</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The short timeline ends in a small effect block and the long timeline ends in a large effect block.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">How long it runs is how much it moves</text>

  <text class="t" x="60" y="150" font-size="20" font-weight="700" fill="var(--ink)">A crisis of months</text>
  <rect x="60" y="176" width="130" height="18" rx="9" fill="var(--warn)"/>
  <rect x="220" y="152" width="110" height="64" rx="8" fill="var(--warn)" opacity="0.25" stroke="var(--warn)"/>
  <text class="t" x="275" y="182" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">2.5%</text>
  <text class="t" x="275" y="206" font-size="15" text-anchor="middle" fill="var(--dim)">of global demand</text>

  <text class="t" x="60" y="300" font-size="20" font-weight="700" fill="var(--ink)">A decade of electrification (China)</text>
  <rect x="60" y="326" width="560" height="18" rx="9" fill="var(--accent)"/>
  <rect x="650" y="286" width="230" height="100" rx="8" fill="var(--accent)" opacity="0.25" stroke="var(--accent)"/>
  <text class="t" x="765" y="326" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">1.5 mb/d</text>
  <text class="t" x="765" y="356" font-size="15" text-anchor="middle" fill="var(--dim)">One country, one fuel</text>

  <text class="t" x="60" y="420" font-size="16" fill="var(--dim)">Cars · trucks · buses · 2-wheelers · 3-wheelers</text>
  <text class="t" x="60" y="450" font-size="16" fill="var(--dim)">You cannot summon it in an emergency</text>

  <text class="t" x="480" y="508" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">The short line shouts; the long line moves things</text>
</svg>
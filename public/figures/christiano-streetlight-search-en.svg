<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A streetlight casts a cone of light over a bright central area labeled verifiable tasks and containing several keys, while the large dark area outside is labeled messy real-world tasks and contains one key.">
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">We search for keys under the streetlight</text>
  <rect x="60" y="100" width="840" height="320" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <polygon points="420,120 300,400 620,400 500,120" fill="var(--accent)" opacity="0.18"/>
  <line x1="460" y1="100" x2="460" y2="124" stroke="var(--dim)" stroke-width="4"/>
  <circle cx="460" cy="132" r="14" fill="var(--accent)"/>
  <circle cx="380" cy="356" r="9" fill="var(--accent)"/>
  <circle cx="440" cy="372" r="9" fill="var(--accent)"/>
  <circle cx="520" cy="350" r="9" fill="var(--accent)"/>
  <text x="460" y="252" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">Verifiable tasks</text>
  <text x="460" y="284" font-size="16" text-anchor="middle" fill="var(--dim)">Measurable</text>
  <text x="460" y="312" font-size="16" text-anchor="middle" fill="var(--warn)">And used for training</text>
  <circle cx="810" cy="340" r="9" fill="var(--grey)"/>
  <text x="700" y="180" font-size="20" font-weight="700" fill="var(--dim)">Messy real-world tasks</text>
  <text x="700" y="212" font-size="16" fill="var(--dim)">In the dark</text>
  <text x="140" y="180" font-size="16" fill="var(--dim)">The vast unmeasured area</text>
  <text x="60" y="478" font-size="22" font-weight="700" fill="var(--ink)">When speed doubles, ask which class of tasks doubled</text>
</svg>
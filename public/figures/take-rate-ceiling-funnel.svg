<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條由長到極短的橫條，最後一條細到只剩一道線">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:20px; fill:var(--ink); font-weight:600; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="48" y="58">天花板是一道很細的線</text>
<text class="b" x="48" y="130">全球卡別交易量</text>
<rect x="48" y="146" width="780" height="54" rx="6" fill="var(--grey)"/>
<text class="g" x="840" y="182">23 兆</text>
<text class="b" x="48" y="256">抓六成在線上</text>
<rect x="48" y="272" width="475" height="54" rx="6" fill="var(--grey)"/>
<text class="g" x="540" y="308">14 兆</text>
<text class="b" x="48" y="382">乘 1% 抽成</text>
<rect x="48" y="398" width="6" height="54" rx="3" fill="var(--accent)"/>
<line x1="54" y1="425" x2="200" y2="425" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="212" y="432">1,400 億</text>
<text class="c" x="48" y="498">大，但沒有大到無法想像</text>
</svg>
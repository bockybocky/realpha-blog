<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一把左右向的尺，三個灰點擠在左端的打折區，右端只有一個藍點，中間留著一段空白" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="64" y="66" font-size="27" font-weight="700" fill="var(--ink)">一句話擺在哪裡，份量就在哪裡</text>
<text x="64" y="98" font-size="16" fill="var(--dim)">同一句「不缺」，講的位置不同，能推出來的東西不同</text>

<rect x="64" y="176" width="372" height="132" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="250" y="210" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">有位置的話</text>

<circle cx="150" cy="262" r="11" fill="var(--grey)"/>
<circle cx="250" cy="262" r="11" fill="var(--grey)"/>
<circle cx="350" cy="262" r="11" fill="var(--grey)"/>
<text x="150" y="300" font-size="15" fill="var(--dim)" text-anchor="middle">上游喊話</text>
<text x="250" y="300" font-size="15" fill="var(--dim)" text-anchor="middle">下游喊話</text>
<text x="350" y="300" font-size="15" fill="var(--dim)" text-anchor="middle">對投資人</text>

<line x1="64" y1="352" x2="896" y2="352" stroke="var(--line)" stroke-width="3"/>
<line x1="64" y1="344" x2="64" y2="360" stroke="var(--grey)" stroke-width="3"/>
<line x1="896" y1="344" x2="896" y2="360" stroke="var(--accent)" stroke-width="3"/>
<text x="64" y="388" font-size="16" fill="var(--dim)">打折</text>
<text x="896" y="388" font-size="16" fill="var(--accent)" text-anchor="end">照單全收</text>

<line x1="150" y1="282" x2="150" y2="344" stroke="var(--grey)" stroke-width="2"/>
<line x1="250" y1="282" x2="250" y2="344" stroke="var(--grey)" stroke-width="2"/>
<line x1="350" y1="282" x2="350" y2="344" stroke="var(--grey)" stroke-width="2"/>

<circle cx="820" cy="262" r="15" fill="var(--accent)"/>
<line x1="820" y1="282" x2="820" y2="344" stroke="var(--accent)" stroke-width="2"/>
<text x="820" y="222" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">可自己查的</text>
<text x="820" y="246" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">中間量</text>
<text x="820" y="300" font-size="15" fill="var(--dim)" text-anchor="middle">容量・規格・顆粒數</text>

<text x="480" y="462" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">看位置，不看頭銜</text>
</svg>
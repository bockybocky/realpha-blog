<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two panels are contrasted: a small circle in the left panel encloses only the evaluation run, while a much larger concentric circle in the right panel expands to include everything employees can see.">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">After one penalty, the scope of winning expands</text>
  <rect x="60" y="100" width="400" height="340" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text x="84" y="134" font-size="19" font-weight="700" fill="var(--dim)">Before</text>
  <circle cx="260" cy="270" r="70" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="260" cy="270" r="18" fill="var(--accent)"/>
  <text x="260" y="372" font-size="16" text-anchor="middle" fill="var(--dim)">Alter just that run</text>
  <text x="260" y="402" font-size="17" font-weight="700" text-anchor="middle" fill="var(--ink)">Hack it</text>
  <rect x="500" y="100" width="400" height="340" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="524" y="134" font-size="19" font-weight="700" fill="var(--warn)">After</text>
  <circle cx="700" cy="270" r="140" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="700" cy="270" r="70" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <circle cx="700" cy="270" r="18" fill="var(--warn)"/>
  <text x="700" y="372" font-size="16" text-anchor="middle" fill="var(--dim)">Alter the later review too</text>
  <text x="700" y="402" font-size="17" font-weight="700" text-anchor="middle" fill="var(--ink)">Hack it undetected</text>
  <text x="60" y="492" font-size="22" font-weight="700" fill="var(--ink)">What changed was not its behavior, but how it sees the scoring</text>
</svg>
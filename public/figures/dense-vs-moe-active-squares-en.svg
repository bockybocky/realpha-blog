<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Left, all 27 squares lit at 1.8 tokens a second; right, 3 of 35 lit at 23 tokens a second">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">Change the shape: a small slice per token</text>

  <text x="243" y="140" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">27B dense</text>
  <text x="703" y="140" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">35B-A3B</text>

  <g fill="var(--warn)">
    <rect x="100" y="170" width="34" height="34" rx="4"/><rect x="142" y="170" width="34" height="34" rx="4"/><rect x="184" y="170" width="34" height="34" rx="4"/><rect x="226" y="170" width="34" height="34" rx="4"/><rect x="268" y="170" width="34" height="34" rx="4"/><rect x="310" y="170" width="34" height="34" rx="4"/><rect x="352" y="170" width="34" height="34" rx="4"/>
    <rect x="100" y="212" width="34" height="34" rx="4"/><rect x="142" y="212" width="34" height="34" rx="4"/><rect x="184" y="212" width="34" height="34" rx="4"/><rect x="226" y="212" width="34" height="34" rx="4"/><rect x="268" y="212" width="34" height="34" rx="4"/><rect x="310" y="212" width="34" height="34" rx="4"/><rect x="352" y="212" width="34" height="34" rx="4"/>
    <rect x="100" y="254" width="34" height="34" rx="4"/><rect x="142" y="254" width="34" height="34" rx="4"/><rect x="184" y="254" width="34" height="34" rx="4"/><rect x="226" y="254" width="34" height="34" rx="4"/><rect x="268" y="254" width="34" height="34" rx="4"/><rect x="310" y="254" width="34" height="34" rx="4"/><rect x="352" y="254" width="34" height="34" rx="4"/>
    <rect x="100" y="296" width="34" height="34" rx="4"/><rect x="142" y="296" width="34" height="34" rx="4"/><rect x="184" y="296" width="34" height="34" rx="4"/><rect x="226" y="296" width="34" height="34" rx="4"/><rect x="268" y="296" width="34" height="34" rx="4"/><rect x="310" y="296" width="34" height="34" rx="4"/>
  </g>

  <g fill="var(--grey)">
    <rect x="686" y="170" width="34" height="34" rx="4"/><rect x="728" y="170" width="34" height="34" rx="4"/><rect x="770" y="170" width="34" height="34" rx="4"/><rect x="812" y="170" width="34" height="34" rx="4"/>
    <rect x="560" y="212" width="34" height="34" rx="4"/><rect x="602" y="212" width="34" height="34" rx="4"/><rect x="644" y="212" width="34" height="34" rx="4"/><rect x="686" y="212" width="34" height="34" rx="4"/><rect x="728" y="212" width="34" height="34" rx="4"/><rect x="770" y="212" width="34" height="34" rx="4"/><rect x="812" y="212" width="34" height="34" rx="4"/>
    <rect x="560" y="254" width="34" height="34" rx="4"/><rect x="602" y="254" width="34" height="34" rx="4"/><rect x="644" y="254" width="34" height="34" rx="4"/><rect x="686" y="254" width="34" height="34" rx="4"/><rect x="728" y="254" width="34" height="34" rx="4"/><rect x="770" y="254" width="34" height="34" rx="4"/><rect x="812" y="254" width="34" height="34" rx="4"/>
    <rect x="560" y="296" width="34" height="34" rx="4"/><rect x="602" y="296" width="34" height="34" rx="4"/><rect x="644" y="296" width="34" height="34" rx="4"/><rect x="686" y="296" width="34" height="34" rx="4"/><rect x="728" y="296" width="34" height="34" rx="4"/><rect x="770" y="296" width="34" height="34" rx="4"/><rect x="812" y="296" width="34" height="34" rx="4"/>
    <rect x="560" y="338" width="34" height="34" rx="4"/><rect x="602" y="338" width="34" height="34" rx="4"/><rect x="644" y="338" width="34" height="34" rx="4"/><rect x="686" y="338" width="34" height="34" rx="4"/><rect x="728" y="338" width="34" height="34" rx="4"/><rect x="770" y="338" width="34" height="34" rx="4"/><rect x="812" y="338" width="34" height="34" rx="4"/>
  </g>
  <g fill="var(--accent)">
    <rect x="560" y="170" width="34" height="34" rx="4"/><rect x="602" y="170" width="34" height="34" rx="4"/><rect x="644" y="170" width="34" height="34" rx="4"/>
  </g>

  <text x="243" y="412" font-size="16" text-anchor="middle" fill="var(--dim)">27 lit per token</text>
  <text x="703" y="412" font-size="16" text-anchor="middle" fill="var(--dim)">3 lit per token</text>
  <text x="243" y="460" font-size="27" font-weight="700" text-anchor="middle" fill="var(--warn)">1.8<tspan font-size="16" font-weight="400" fill="var(--dim)"> tok/s</tspan></text>
  <text x="703" y="460" font-size="27" font-weight="700" text-anchor="middle" fill="var(--accent)">23<tspan font-size="16" font-weight="400" fill="var(--dim)"> tok/s</tspan></text>
  <text x="480" y="522" font-size="15" text-anchor="middle" fill="var(--dim)">1 square = 1 billion parameters</text>
</svg>
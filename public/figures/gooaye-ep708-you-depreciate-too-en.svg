<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The curve declines with age: the same money buys a tall bar in your thirties and only a short stub in your sixties.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">Same money, different age, different thing back</text>
<line x1="150" y1="110" x2="150" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="124" font-size="16" fill="var(--dim)">What you get back</text>
<text x="860" y="480" font-size="16" fill="var(--dim)">Age</text>
<path d="M170 160 C 380 182 560 322 880 412 L880 450 L170 450 Z" fill="var(--accent)" opacity="0.12"/>
<path d="M170 160 C 380 182 560 322 880 412" fill="none" stroke="var(--accent)" stroke-width="3"/>
<rect x="248" y="174" width="26" height="276" fill="var(--accent)" opacity="0.40"/>
<rect x="710" y="378" width="26" height="72" fill="var(--grey)" opacity="0.60"/>
<line x1="150" y1="174" x2="248" y2="174" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="150" y1="378" x2="710" y2="378" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 6"/>
<text x="206" y="478" font-size="19" fill="var(--accent)">Thirties</text>
<text x="666" y="478" font-size="19" fill="var(--dim)">Sixties</text>
<text x="300" y="300" font-size="16" fill="var(--dim)">Same money</text>
<text x="150" y="528" font-size="22" fill="var(--ink)">Some experiences are only on sale at that age</text>
</svg>
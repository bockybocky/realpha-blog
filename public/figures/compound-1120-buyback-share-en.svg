<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A thin band is filled in at the base of the large square, and a third of the small square is filled in.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .h1{font-size:27px;font-weight:700;fill:var(--ink);}
    .cap{font-size:19px;font-weight:700;fill:var(--dim);}
    .capA{font-size:19px;font-weight:700;fill:var(--accent);}
    .big{font-size:34px;font-weight:700;fill:var(--ink);}
    .unit{font-size:16px;fill:var(--dim);}
    .kick{font-size:22px;font-weight:700;fill:var(--ink);}
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <g class="t">
    <text x="480" y="48" class="h1" text-anchor="middle">Same buyback, 3x the share</text>
    <rect x="110" y="190" width="280" height="280" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <rect x="110" y="445" width="280" height="25" rx="2" fill="var(--accent)"/>
    <text x="250" y="166" class="cap" text-anchor="middle">Today's market cap</text>
    <text x="250" y="512" class="big" text-anchor="middle">9%</text>
    <text x="250" y="542" class="unit" text-anchor="middle">$350B buyback</text>
    <rect x="630" y="330" width="142" height="142" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <rect x="630" y="425" width="142" height="47" rx="2" fill="var(--warn)"/>
    <text x="701" y="306" class="cap" text-anchor="middle">$1T market cap</text>
    <text x="701" y="512" class="big" text-anchor="middle">One third</text>
    <text x="701" y="542" class="unit" text-anchor="middle">Buying yourself back</text>
    <text x="480" y="250" class="capA" text-anchor="middle">Same money</text>
    <text x="480" y="282" class="unit" text-anchor="middle">Smaller cap, bigger bite</text>
  </g>
</svg>
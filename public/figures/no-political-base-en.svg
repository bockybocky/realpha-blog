<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A factory sends many lines into the community while the data center has only two people lines and one tax line">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Brings tax money, not neighbors</text>

<rect x="60" y="96" width="400" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="260" y="136" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Factory</text>
<g stroke="var(--accent)" stroke-width="2">
<line x1="260" y1="290" x2="140" y2="200"/><line x1="260" y1="290" x2="180" y2="170"/>
<line x1="260" y1="290" x2="260" y2="162"/><line x1="260" y1="290" x2="340" y2="170"/>
<line x1="260" y1="290" x2="380" y2="200"/><line x1="260" y1="290" x2="140" y2="380"/>
<line x1="260" y1="290" x2="200" y2="412"/><line x1="260" y1="290" x2="320" y2="412"/>
<line x1="260" y1="290" x2="380" y2="380"/>
</g>
<g fill="var(--accent)">
<circle cx="140" cy="200" r="11"/><circle cx="180" cy="170" r="11"/><circle cx="260" cy="162" r="11"/>
<circle cx="340" cy="170" r="11"/><circle cx="380" cy="200" r="11"/><circle cx="140" cy="380" r="11"/>
<circle cx="200" cy="412" r="11"/><circle cx="320" cy="412" r="11"/><circle cx="380" cy="380" r="11"/>
</g>
<circle cx="260" cy="290" r="34" fill="var(--page)" stroke="var(--ink)" stroke-width="3"/>
<text x="260" y="472" font-size="16" fill="var(--dim)" text-anchor="middle">Baseball, soccer, hockey teams</text>

<rect x="500" y="96" width="400" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="700" y="136" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Data center</text>
<g stroke="var(--grey)" stroke-width="2">
<line x1="700" y1="290" x2="630" y2="200"/><line x1="700" y1="290" x2="770" y2="200"/>
</g>
<g fill="var(--grey)"><circle cx="630" cy="200" r="11"/><circle cx="770" cy="200" r="11"/></g>
<line x1="700" y1="290" x2="700" y2="392" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
<rect x="628" y="392" width="144" height="42" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text x="700" y="419" font-size="16" fill="var(--warn)" text-anchor="middle">Taxes</text>
<circle cx="700" cy="290" r="34" fill="var(--page)" stroke="var(--ink)" stroke-width="3"/>
<text x="700" y="472" font-size="16" fill="var(--dim)" text-anchor="middle">No friend of yours works inside</text>

<text x="480" y="525" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">No people means no political base</text>
</svg>
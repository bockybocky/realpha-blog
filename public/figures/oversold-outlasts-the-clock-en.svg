<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Two bars of different length: the upper one shows that oversold conditions can persist for a long time and extends into an arrow on the right, the lower one shows the time left on the option and is much shorter, and a dashed line marks where time runs out.">
  <rect x="0" y="0" width="960" height="480" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px}
    .b{font-size:15px;fill:var(--dim)}
    .c{font-size:22px}
  </style>
  <text class="t" x="40" y="58">Oversold can last; time runs out first</text>
  <text class="g" x="150" y="156">Oversold can persist</text>
  <rect x="150" y="170" width="680" height="46" fill="var(--grey)" fill-opacity="0.5"/>
  <polygon points="830,170 830,216 862,193" fill="var(--grey)"/>
  <text class="g" x="150" y="266">Time left on the option</text>
  <rect x="150" y="280" width="250" height="46" fill="var(--accent)"/>
  <line x1="400" y1="166" x2="400" y2="360" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="g" x="412" y="352" fill="var(--warn)">Time runs out here</text>
  <text class="b" x="150" y="404">Ceresna himself calls timing the main risk</text>
  <text class="c" x="40" y="446">Right direction, wrong timing still loses</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two timelines compared: the top row is mostly empty, the bottom row is fully filled with one segment boxed off">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Same name "long-term contract," different binding terms</text>
<text x="60" y="126" font-size="20" font-weight="700" fill="var(--ink)">Before</text>
<text x="130" y="126" font-size="16" fill="var(--dim)">Only gave purchasing visibility</text>
<rect x="60" y="150" width="96" height="54" rx="6" fill="var(--accent)"/>
<text x="108" y="184" font-size="15" text-anchor="middle" fill="var(--page)">NCNR</text>
<rect x="162" y="150" width="96" height="54" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="264" y="150" width="96" height="54" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="366" y="150" width="96" height="54" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="468" y="150" width="96" height="54" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="570" y="150" width="96" height="54" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="672" y="150" width="96" height="54" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="774" y="150" width="96" height="54" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="60" y="234" font-size="15" fill="var(--dim)">Only the quarter already ordered is legally binding -- the rest evaporates on a reversal</text>
<text x="60" y="312" font-size="20" font-weight="700" fill="var(--ink)">Now</text>
<text x="130" y="312" font-size="16" fill="var(--dim)">Five years, every quarter locked to volume</text>
<text x="900" y="312" font-size="16" text-anchor="end" fill="var(--ink)">Take-or-pay: don't take delivery, pay anyway</text>
<rect x="60" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="102" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="144" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="186" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="228" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="270" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="312" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="354" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="396" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="438" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="480" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="522" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="564" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="606" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="648" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="690" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="732" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="774" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="816" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="858" y="340" width="36" height="54" rx="4" fill="var(--accent)"/>
<rect x="54" y="334" width="174" height="66" rx="8" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text x="60" y="426" font-size="16" fill="var(--warn)">Deposit = 20% of contract, about a year's volume, held in escrow</text>
<rect x="60" y="466" width="840" height="76" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="513" font-size="22" text-anchor="middle" fill="var(--ink)">The seller gives up price, gets five years of visibility</text>
</svg>
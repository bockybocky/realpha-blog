<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two lines running opposite ways: the assumption for other industries rises to the right, the one for commodities falls to the right.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">One future, two sets of assumptions</text>

<line x1="150" y1="430" x2="890" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="120" x2="150" y2="430" stroke="var(--line)" stroke-width="2"/>

<line x1="170" y1="380" x2="870" y2="165" stroke="var(--accent)" stroke-width="4"/>
<line x1="170" y1="300" x2="870" y2="402" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 6"/>

<circle cx="870" cy="165" r="7" fill="var(--accent)"/>
<circle cx="870" cy="402" r="7" fill="var(--warn)"/>

<text x="470" y="200" font-size="19" fill="var(--accent)">Others: dollar thins out</text>
<text x="430" y="285" font-size="19" fill="var(--warn)">Commodities: price cut yearly</text>

<text x="160" y="458" font-size="15" fill="var(--dim)">Year 0</text>
<text x="840" y="458" font-size="15" fill="var(--dim)">40 yr</text>
<text x="470" y="458" font-size="16" fill="var(--dim)">Licence years</text>
<text x="132" y="280" font-size="16" fill="var(--dim)" transform="rotate(-90 132 280)" text-anchor="middle">Assumed price</text>

<text x="60" y="502" font-size="22" fill="var(--ink)">The longer the life, the cheaper they price it</text>
</svg>
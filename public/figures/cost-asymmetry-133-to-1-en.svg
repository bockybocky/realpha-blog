<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A long bar filling the frame on top and a bar so thin it is almost invisible below">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="40" y="54" font-size="27" font-weight="700" fill="var(--ink)">Your cost vs theirs</text>

  <text x="60" y="144" font-size="20" font-weight="700" fill="var(--ink)">One interceptor</text>
  <rect x="60" y="164" width="800" height="58" rx="5" fill="var(--accent)"/>
  <text x="76" y="202" font-size="19" font-weight="700" fill="var(--page)">$4 million</text>

  <text x="60" y="292" font-size="20" font-weight="700" fill="var(--ink)">One drone</text>
  <rect x="60" y="312" width="6" height="58" rx="2" fill="var(--grey)"/>
  <text x="84" y="350" font-size="19" fill="var(--dim)">$30,000</text>

  <line x1="60" y1="404" x2="860" y2="404" stroke="var(--line)" stroke-width="2"/>
  <text x="60" y="452" font-size="27" font-weight="700" fill="var(--accent)">133 : 1</text>

  <text x="240" y="452" font-size="22" font-weight="700" fill="var(--ink)">Win every fight, lose on the books</text>
</svg>
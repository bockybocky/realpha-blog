<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩排點共用同一條平均線，上排貼近，下排有一點跑得很遠">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700 }
.g { font-size:20px; fill:var(--ink); font-weight:600 }
.b { font-size:16px; fill:var(--dim) }
.n { font-size:22px; fill:var(--ink); font-weight:700 }
.c { font-size:22px; fill:var(--ink); font-weight:600 }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56">平均一樣，距離不一樣</text>
<line x1="480" y1="120" x2="480" y2="400" stroke="var(--ink)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="g" x="480" y="104" text-anchor="middle">平均</text>
<text class="g" x="80" y="196">差距小</text>
<circle cx="430" cy="190" r="10" fill="var(--accent)"/>
<circle cx="470" cy="190" r="10" fill="var(--accent)"/>
<circle cx="500" cy="190" r="10" fill="var(--accent)"/>
<circle cx="535" cy="190" r="10" fill="var(--accent)"/>
<text class="g" x="80" y="336">差距大</text>
<circle cx="440" cy="330" r="10" fill="var(--grey)"/>
<circle cx="480" cy="330" r="10" fill="var(--grey)"/>
<circle cx="515" cy="330" r="10" fill="var(--grey)"/>
<circle cx="860" cy="330" r="13" fill="var(--warn)"/>
<path d="M515 366 L515 380 L860 380 L860 366" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="688" y="410" text-anchor="middle" fill="var(--warn)">撐不住的那一段</text>
<text class="c" x="60" y="470">平均會騙你，距離不會</text>
</svg>
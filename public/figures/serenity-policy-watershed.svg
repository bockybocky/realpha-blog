<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條政策分界線把同一塊需求切到兩邊，一邊的產能利用率往上，另一邊往下">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">一條線畫下去，兩邊走反向</text>
<rect x="300" y="104" width="360" height="56" rx="8" fill="var(--grey)"/>
<text class="t" x="372" y="140" font-size="19" fill="var(--ink)">同一塊資料中心需求</text>
<line x1="480" y1="176" x2="480" y2="430" stroke="var(--ink)" stroke-width="4"/>
<text class="t" x="420" y="464" font-size="16" fill="var(--dim)">進口限制</text>
<path d="M440 196 L240 250" stroke="var(--accent)" stroke-width="4" fill="none"/>
<path d="M240 250 L262 248 L258 262 Z" fill="var(--accent)"/>
<path d="M520 196 L720 250" stroke="var(--dim)" stroke-width="4" fill="none"/>
<path d="M720 250 L698 248 L702 262 Z" fill="var(--dim)"/>
<text class="t" x="120" y="300" font-size="20" fill="var(--accent)">西方模組與雷射</text>
<path d="M150 390 L150 322" stroke="var(--accent)" stroke-width="6" fill="none"/>
<path d="M150 316 L138 338 L162 338 Z" fill="var(--accent)"/>
<text class="t" x="186" y="372" font-size="16" fill="var(--dim)">利用率往上</text>
<text class="t" x="660" y="300" font-size="20" fill="var(--dim)">中國模組與上游</text>
<path d="M690 322 L690 390" stroke="var(--dim)" stroke-width="6" fill="none"/>
<path d="M690 396 L678 374 L702 374 Z" fill="var(--dim)"/>
<text class="t" x="726" y="372" font-size="16" fill="var(--dim)">利用率往下</text>
<text class="t" x="60" y="506" font-size="22" fill="var(--ink)">跟今年看多看空無關的那條線</text>
</svg>
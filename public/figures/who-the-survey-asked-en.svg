<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Three concentric circles show 3,600 listed companies in the outer ring, a deliberately not-to-scale dashed middle ring representing the group that regularly engages with investors, and 700 survey respondents in the inner ring."><rect x="0" y="0" width="960" height="580" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
<text x="80" y="56" font-size="27" fill="var(--ink)">Who produced that 75%?</text>
<circle cx="320" cy="320" r="196" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="320" cy="320" r="130" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="320" cy="320" r="78" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="320" y="176" font-size="19" fill="var(--dim)" text-anchor="middle">3,600</text>
<text x="320" y="328" font-size="19" fill="var(--ink)" text-anchor="middle">700</text>
<circle cx="600" cy="224" r="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="626" y="230" font-size="19" fill="var(--ink)">3,600 listed firms</text>
<circle cx="600" cy="294" r="12" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 4"/>
<text x="626" y="300" font-size="19" fill="var(--ink)">Regular investor contacts</text>
<circle cx="600" cy="364" r="12" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="626" y="370" font-size="19" fill="var(--ink)">700 replied; 75% found talks useful</text>
<text x="80" y="516" font-size="16" fill="var(--dim)">Dashed ring not to scale: the group's size was not stated</text>
<text x="80" y="556" font-size="22" fill="var(--ink)">It asks active participants how well the talks work</text>
</svg>
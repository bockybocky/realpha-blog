<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The cost bar falls from above the willingness-to-pay line to below it, so a matter that would not have happened now does.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="60" y="58" font-size="27" fill="var(--ink)">The cost AI removed became work that did not exist</text>

  <rect x="60" y="90" width="840" height="380" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <line x1="100" y1="192" x2="860" y2="192" stroke="var(--dim)" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="856" y="180" font-size="16" fill="var(--dim)" text-anchor="end">What the client will pay</text>

  <line x1="100" y1="390" x2="860" y2="390" stroke="var(--line)" stroke-width="2"/>

  <rect x="230" y="140" width="110" height="250" fill="var(--warn)"/>
  <text x="285" y="128" font-size="20" fill="var(--ink)" text-anchor="middle">About $10m</text>
  <text x="285" y="422" font-size="19" fill="var(--ink)" text-anchor="middle">Three years ago</text>
  <text x="285" y="452" font-size="19" fill="var(--warn)" text-anchor="middle">Never happened</text>

  <rect x="570" y="318" width="110" height="72" fill="var(--accent)"/>
  <text x="625" y="306" font-size="20" fill="var(--ink)" text-anchor="middle">About $3m</text>
  <text x="625" y="422" font-size="19" fill="var(--ink)" text-anchor="middle">With AI</text>
  <text x="625" y="452" font-size="19" fill="var(--accent)" text-anchor="middle">It goes ahead</text>

  <text x="480" y="520" font-size="22" fill="var(--ink)" text-anchor="middle">Demand appears only once cost drops below that line</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="終端系統往上收窄的三層結構，最上層填不出來的問號標為知識邊界">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="52" font-size="27" fill="var(--ink)">往上游畫三層，每格只寫兩件事</text>

<rect x="330" y="100" width="300" height="70" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="400" y="130" font-size="19" fill="var(--warn)" text-anchor="middle">第三層</text>
<text x="540" y="128" font-size="16" fill="var(--warn)" text-anchor="middle">幾家？</text>
<text x="540" y="154" font-size="16" fill="var(--warn)" text-anchor="middle">長約？</text>

<rect x="270" y="200" width="420" height="70" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="350" y="230" font-size="19" fill="var(--accent)" text-anchor="middle">第二層</text>
<text x="540" y="228" font-size="16" fill="var(--dim)" text-anchor="middle">幾家做得出來</text>
<text x="540" y="254" font-size="16" fill="var(--dim)" text-anchor="middle">長約幾年</text>

<rect x="210" y="300" width="540" height="70" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="300" y="330" font-size="19" fill="var(--accent)" text-anchor="middle">第一層</text>
<text x="540" y="328" font-size="16" fill="var(--dim)" text-anchor="middle">幾家做得出來</text>
<text x="540" y="354" font-size="16" fill="var(--dim)" text-anchor="middle">長約幾年</text>

<rect x="150" y="400" width="660" height="70" rx="8" fill="var(--accent)"/>
<text x="480" y="443" font-size="20" fill="var(--page)" text-anchor="middle">你講得出名字的終端系統</text>

<text x="700" y="140" font-size="16" fill="var(--warn)">畫不下去的地方＝知識邊界</text>
<text x="480" y="522" font-size="22" fill="var(--ink)" text-anchor="middle">大漲那天先看這張紙，再讀新聞</text>
</svg>
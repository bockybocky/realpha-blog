<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四支箭頭全部指向同一個結論，另外兩件相反的事實被繞過去了">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型 */
</style></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">先有了結論之後</text>
<rect x="70" y="140" width="230" height="150" fill="var(--card)" rx="12" stroke="var(--accent)" stroke-width="3"/>
<text x="185" y="205" font-size="20" fill="var(--ink)" text-anchor="middle" font-weight="700">結論</text>
<text x="185" y="240" font-size="19" fill="var(--accent)" text-anchor="middle">這是泡沫</text>
<rect x="560" y="112" width="220" height="56" fill="var(--card)" rx="8"/>
<text x="670" y="148" font-size="18" fill="var(--ink)" text-anchor="middle">誰的資本支出</text>
<rect x="560" y="184" width="220" height="56" fill="var(--card)" rx="8"/>
<text x="670" y="220" font-size="18" fill="var(--ink)" text-anchor="middle">名人發的幣</text>
<rect x="560" y="256" width="220" height="56" fill="var(--card)" rx="8"/>
<text x="670" y="292" font-size="18" fill="var(--ink)" text-anchor="middle">離譜的估值新聞</text>
<rect x="560" y="328" width="220" height="56" fill="var(--card)" rx="8"/>
<text x="670" y="364" font-size="18" fill="var(--ink)" text-anchor="middle">又一檔上市</text>
<path d="M552 140 L318 200" stroke="var(--accent)" stroke-width="3"/>
<path d="M552 212 L318 212" stroke="var(--accent)" stroke-width="3"/>
<path d="M552 284 L318 228" stroke="var(--accent)" stroke-width="3"/>
<path d="M552 356 L318 244" stroke="var(--accent)" stroke-width="3"/>
<path d="M304 205 L332 194 L332 216 Z" fill="var(--accent)"/>
<rect x="560" y="424" width="220" height="56" fill="var(--card)" rx="8" opacity="0.6"/>
<text x="670" y="460" font-size="18" fill="var(--dim)" text-anchor="middle">倍數在降</text>
<rect x="300" y="424" width="200" height="56" fill="var(--card)" rx="8" opacity="0.6"/>
<text x="400" y="460" font-size="18" fill="var(--dim)" text-anchor="middle">盈餘在升</text>
<path d="M552 452 C 460 520, 300 520, 200 452 L 200 300" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
<text x="60" y="524" font-size="22" fill="var(--ink)">排隊進來的，只有你在找的那一種</text>
</svg>
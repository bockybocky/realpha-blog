<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A wide plank balanced on a very narrow fulcrum, with several arrows from outside the deal pushing against it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">Stability on a very narrow fulcrum</text>
  <rect x="140" y="188" width="680" height="34" fill="var(--accent)"/>
  <text x="420" y="176" font-size="20" fill="var(--accent)">Stability</text>
  <polygon points="480,230 440,320 520,320" fill="var(--grey)"/>
  <text x="396" y="352" font-size="16" fill="var(--dim)">Rare earths</text>
  <text x="430" y="378" font-size="16" fill="var(--dim)">Narrow deal</text>
  <line x1="190" y1="330" x2="190" y2="246" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="182,246 190,224 198,246" fill="var(--warn)"/>
  <text x="104" y="362" font-size="16" fill="var(--warn)">Acid curbs</text>
  <line x1="780" y1="330" x2="780" y2="246" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="772,246 780,224 788,246" fill="var(--warn)"/>
  <text x="700" y="362" font-size="16" fill="var(--warn)">Passport holds</text>
  <text x="60" y="440" font-size="16" fill="var(--dim)">Moves outside the deal don't stop</text>
  <text x="60" y="492" font-size="22" fill="var(--ink)">One point agreed; the rest moves.</text>
</svg>
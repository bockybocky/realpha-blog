<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A long bar of nearly equal length reaches out on each side of a center line, one down and one up, while the line beside them standing for the index is flat.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="66" font-size="27" font-weight="700" fill="var(--ink)">Churn below, calm</text>
<rect x="80" y="280" width="560" height="4" fill="var(--line)"/>
<rect x="180" y="284" width="110" height="158" fill="var(--warn)"/>
<text x="235" y="262" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Alphabet</text>
<text x="235" y="474" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Down 7.9%</text>
<rect x="420" y="152" width="110" height="128" fill="var(--accent)"/>
<text x="475" y="130" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Up 6.4%</text>
<text x="475" y="312" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">MSFT</text>
<rect x="700" y="152" width="180" height="290" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="716" y="294" width="148" height="4" fill="var(--grey)"/>
<text x="790" y="200" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">Idx</text>
<text x="790" y="268" font-size="16" fill="var(--dim)" text-anchor="middle">Nets</text>
<text x="790" y="340" font-size="16" fill="var(--dim)" text-anchor="middle">Calm vol</text>
<text x="80" y="496" font-size="22" font-weight="700" fill="var(--ink)">Vol went to rotation</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊三根高柱與右邊十二根矮柱，頂端高度明顯落差">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">一樣的十小時，兩種花法</text>

<line x1="100" y1="180" x2="900" y2="180" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="100" y1="264" x2="900" y2="264" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="92" y="186" font-size="15" fill="var(--dim)" text-anchor="end">十分</text>
<text x="92" y="270" font-size="15" fill="var(--dim)" text-anchor="end">七分</text>
<line x1="100" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>

<rect x="120" y="180" width="60" height="280" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="2"/>
<rect x="200" y="180" width="60" height="280" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="2"/>
<rect x="280" y="180" width="60" height="280" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="2"/>
<text x="230" y="492" font-size="19" fill="var(--ink)" text-anchor="middle">3 個標的</text>

<rect x="500" y="264" width="24" height="196" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="532" y="264" width="24" height="196" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="564" y="264" width="24" height="196" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="596" y="264" width="24" height="196" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="628" y="264" width="24" height="196" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="660" y="264" width="24" height="196" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="692" y="264" width="24" height="196" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="724" y="264" width="24" height="196" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="756" y="264" width="24" height="196" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="788" y="264" width="24" height="196" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="820" y="264" width="24" height="196" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="852" y="264" width="24" height="196" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="688" y="492" font-size="19" fill="var(--dim)" text-anchor="middle">12 個標的</text>

<text x="480" y="530" font-size="22" fill="var(--ink)" text-anchor="middle">看得更多，也看得更淺</text>
</svg>
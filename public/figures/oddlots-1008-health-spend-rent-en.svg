<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two horizontal bars compare health spending, with the extra stretch on the US bar marked as excess, and three cells below showing price up, utilisation down and outcomes down.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="60">The extra spending buys no better outcome</text>
<text class="g" x="60" y="134">Most European countries</text>
<rect x="260" y="112" width="330" height="34" rx="4" fill="var(--grey)"/>
<text class="g" x="60" y="206">US</text>
<rect x="260" y="184" width="330" height="34" rx="4" fill="var(--grey)"/>
<rect x="590" y="184" width="170" height="34" rx="4" fill="var(--warn)" opacity="0.85"/>
<line x1="590" y1="100" x2="590" y2="236" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="b" x="618" y="262">Over 5 pct points higher</text>
<text class="b" x="618" y="286">About 50% more</text>
<text class="b" x="618" y="310">$1.7–1.9 trillion a year</text>
<text class="b" x="260" y="340">Health spending as a share of GDP</text>
<rect x="60" y="376" width="252" height="110" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="88" y="422">Price</text>
<path d="M200 462 L200 406" stroke="var(--warn)" stroke-width="5"/>
<path d="M200 400 l-10 14 l20 0 z" fill="var(--warn)"/>
<text class="b" x="88" y="462">Unit price</text>
<rect x="340" y="376" width="252" height="110" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="368" y="422">Utilisation</text>
<path d="M480 406 L480 456" stroke="var(--accent)" stroke-width="5"/>
<path d="M480 462 l-10 -14 l20 0 z" fill="var(--accent)"/>
<text class="b" x="368" y="462">Visits and procedures</text>
<rect x="620" y="376" width="252" height="110" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="648" y="422">Outcomes</text>
<path d="M760 406 L760 456" stroke="var(--warn)" stroke-width="5"/>
<path d="M760 462 l-10 -14 l20 0 z" fill="var(--warn)"/>
<text class="b" x="648" y="462">Life expectancy, mortality</text>
<text class="c" x="60" y="532">Part of the gap is rent</text>
<text class="b" x="378" y="532">Cuts taken by hospitals, insurers and administrative middlemen</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="PJM 的橫條很短，其他電網區域的橫條長將多倍">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">風光占比：同一個國家，兩種世界</text>

<text class="t" x="60" y="178" font-size="20" font-weight="700" fill="var(--ink)">PJM</text>
<rect x="240" y="155" width="60" height="44" fill="var(--grey)"/>
<text class="t" x="316" y="186" font-size="19" font-weight="700" fill="var(--dim)">個位數</text>

<text class="t" x="60" y="268" font-size="20" font-weight="700" fill="var(--ink)">MISO · SPP</text>
<rect x="240" y="245" width="400" height="44" fill="var(--accent)"/>
<text class="t" x="656" y="276" font-size="19" font-weight="700" fill="var(--accent)">近 4 成</text>

<text class="t" x="60" y="358" font-size="20" font-weight="700" fill="var(--ink)">ERCOT · 西部</text>
<rect x="240" y="335" width="400" height="44" fill="var(--accent)"/>
<text class="t" x="656" y="366" font-size="19" font-weight="700" fill="var(--accent)">近 4 成</text>

<line x1="240" y1="400" x2="240" y2="120" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="240" y="452" font-size="16" fill="var(--dim)">差這麼多，病不在技術</text>
<text class="t" x="240" y="478" font-size="16" fill="var(--dim)">在輸電與併網排隊</text>
</svg>
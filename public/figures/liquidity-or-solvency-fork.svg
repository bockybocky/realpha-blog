<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Y 形分岔，依三條理由是否還在分成流動性與償付能力兩支">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">跌一半之後走哪一支</text>
<rect x="60" y="250" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="78" y="286">跌一半</text>
<text class="b" x="78" y="312">的持股</text>
<rect x="260" y="250" width="200" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="278" y="286">當初買它的</text>
<text class="b" x="278" y="312">那三條理由</text>
<path d="M220 290 L260 290" stroke="var(--grey)" stroke-width="2.5"/>
<path d="M460 275 L560 170" stroke="var(--accent)" stroke-width="3"/>
<path d="M460 305 L560 410" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="470" y="212" fill="var(--accent)">三條都還在</text>
<text class="b" x="470" y="400" fill="var(--warn)">有一條被打掉</text>
<rect x="560" y="120" width="340" height="96" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="582" y="158" fill="var(--accent)">流動性</text>
<text class="b" x="582" y="190">沒人願意出價，會自己好</text>
<rect x="560" y="366" width="340" height="96" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="g" x="582" y="404" fill="var(--warn)">償付能力</text>
<text class="b" x="582" y="436">賺錢的能力變了，不會好</text>
<text class="c" x="60" y="518">先寫下「什麼事發生我就承認錯」</text>
</svg>
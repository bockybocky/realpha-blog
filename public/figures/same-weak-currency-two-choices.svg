<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="一個由弱勢貨幣分出的兩條岔路，上路通往收成利潤且結果線先升後落，下路通往換成銷量且結果線升上去後維持水平。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); font-weight:700; }
    .bdy { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="ttl" x="60" y="62">同一個弱勢貨幣，兩種選擇</text>
  <rect x="60" y="215" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1"/>
  <text class="grp" x="155" y="262" text-anchor="middle">弱勢貨幣</text>
  <line x1="250" y1="255" x2="410" y2="160" stroke="var(--grey)" stroke-width="3"/>
  <line x1="250" y1="255" x2="410" y2="380" stroke="var(--grey)" stroke-width="3"/>
  <text class="bdy" x="410" y="108">豐田</text>
  <rect x="410" y="120" width="200" height="80" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1"/>
  <text class="grp" x="510" y="167" text-anchor="middle">收成利潤</text>
  <text class="bdy" x="410" y="328">韓國車廠</text>
  <rect x="410" y="340" width="200" height="80" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1"/>
  <text class="grp" x="510" y="387" text-anchor="middle">換成銷量</text>
  <polyline points="660,190 715,132 775,132 835,190 900,190" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text class="bdy" x="660" y="226">匯率反轉就吐回去</text>
  <polyline points="660,410 715,352 900,352" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text class="bdy" x="660" y="446">留得下來</text>
  <text class="end" x="60" y="532">宏觀變數不能直接往個股推</text>
</svg>
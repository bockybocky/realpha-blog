<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="五個來源中有四個連到同一批未平倉資料，第五個回答的是另一個問題，真正獨立的證據只有一份">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">五個署名，一份證據</text>

<rect x="100" y="120" width="140" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="262" y="120" width="140" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="424" y="120" width="140" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="586" y="120" width="140" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="748" y="120" width="140" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>

<text x="170" y="156" font-size="19" fill="var(--ink)" text-anchor="middle">來源 1</text>
<text x="332" y="156" font-size="19" fill="var(--ink)" text-anchor="middle">來源 2</text>
<text x="494" y="156" font-size="19" fill="var(--ink)" text-anchor="middle">來源 3</text>
<text x="656" y="156" font-size="19" fill="var(--ink)" text-anchor="middle">來源 4</text>
<text x="818" y="156" font-size="19" fill="var(--warn)" text-anchor="middle">來源 5</text>

<path d="M 170 176 L 350 310" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M 332 176 L 350 310" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M 494 176 L 350 310" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M 656 176 L 350 310" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M 818 176 L 730 310" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>

<rect x="180" y="310" width="340" height="76" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="350" y="345" font-size="19" fill="var(--ink)" text-anchor="middle">同一批未平倉資料</text>
<text x="350" y="371" font-size="16" fill="var(--dim)" text-anchor="middle">來源 1 到 4 都讀它</text>

<rect x="580" y="310" width="300" height="76" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="730" y="345" font-size="19" fill="var(--ink)" text-anchor="middle">另一個問題</text>
<text x="730" y="371" font-size="16" fill="var(--dim)" text-anchor="middle">保證金限制</text>

<text x="350" y="424" font-size="19" fill="var(--accent)" text-anchor="middle">真正獨立：1</text>

<text x="480" y="480" font-size="22" fill="var(--ink)" text-anchor="middle">獨立不是看署名，是看會不會一起錯</text>
</svg>
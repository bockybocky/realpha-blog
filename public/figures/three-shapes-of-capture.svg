<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三個收斂程度不同的漏斗：晶片收到一家、雲端收到幾家、模型層出口仍不確定">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">價值捕獲的三種形狀</text>
<text x="60" y="94" font-size="16" fill="var(--dim)">上緣＝進來的錢，下緣＝最後收走的人</text>
<path d="M90 140 L 330 140 L 262 400 L 158 400 Z" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="150" y="120" font-size="20" fill="var(--accent)">晶片</text>
<text x="100" y="440" font-size="16" fill="var(--dim)">幾十家收到剩一家</text>
<text x="100" y="466" font-size="19" fill="var(--ink)">想定什麼價就定什麼價</text>
<path d="M360 140 L 600 140 L 560 400 L 400 400 Z" fill="var(--card)" stroke="var(--accent)" stroke-width="3" opacity="0.75"/>
<text x="430" y="120" font-size="20" fill="var(--accent)">雲端</text>
<text x="370" y="440" font-size="16" fill="var(--dim)">賺得不錯但沒收走全部</text>
<text x="370" y="466" font-size="19" fill="var(--ink)">軟體業的價值留在軟體業</text>
<path d="M630 140 L 870 140 L 870 400 L 630 400 Z" fill="var(--card)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 7"/>
<text x="700" y="120" font-size="20" fill="var(--warn)">模型</text>
<text x="640" y="440" font-size="16" fill="var(--dim)">收斂還是變成商品</text>
<text x="640" y="466" font-size="19" fill="var(--ink)">出口還沒成形</text>
<text x="60" y="528" font-size="22" fill="var(--ink)">先決定自己押的是哪一種形狀，再談買誰</text>
</svg>
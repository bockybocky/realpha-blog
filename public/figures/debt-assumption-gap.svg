<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條從左下同一點出發的曲線，上方虛線陡升，下方實線緩升，中間橘色喇叭形缺口向右越張越大">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; }
    .c { font-size:22px; font-weight:700; }
    .ac { fill:var(--accent); }
    .wn { fill:var(--warn); }
    .dm { fill:var(--dim); }
</style>
<text x="60" y="52" class="t">債照前沿價估，錢流去別處</text>
<line x1="120" y1="460" x2="880" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="460" x2="120" y2="110" stroke="var(--line)" stroke-width="2"/>
<text x="130" y="104" class="b dm">營收</text>
<text x="880" y="490" class="b dm" text-anchor="end">時間</text>
<path d="M120,440 C400,420 650,300 860,130 L860,345 C650,395 400,428 120,440 Z" fill="var(--warn)" fill-opacity="0.16"/>
<path d="M120,440 C400,420 650,300 860,130" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M120,440 C400,428 650,395 860,345" fill="none" stroke="var(--ink)" stroke-width="3"/>
<text x="845" y="118" class="b ac" text-anchor="end">還款假設：前沿價 × 用量</text>
<text x="860" y="404" class="b" text-anchor="end">實際流向前沿</text>
<text x="796" y="236" class="c wn" text-anchor="middle">缺口</text>
<text x="796" y="268" class="s dm" text-anchor="middle">開源模型</text>
<text x="796" y="292" class="s dm" text-anchor="middle">自有硬體</text>
<text x="796" y="316" class="s dm" text-anchor="middle">快取優化</text>
</svg>
<circle cx="280" cy="310" r="175" fill="none" stroke="var(--line)" stroke-width="3"/>

<rect x="580" y="135" width="350" height="350" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="583" y="138" width="81.5" height="81.5" fill="var(--accent)"/>
<rect x="670.5" y="138" width="81.5" height="81.5" fill="var(--accent)"/>
<rect x="758" y="138" width="81.5" height="81.5" fill="var(--accent)"/>

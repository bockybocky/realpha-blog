  <rect x="387" y="277" width="66" height="66" fill="var(--warn)" opacity="0.3"/>
  <rect x="107" y="347" width="66" height="66" fill="var(--warn)" opacity="0.3"/>
  <rect x="177" y="347" width="66" height="66" fill="var(--accent)"/>
  <rect x="247" y="347" width="66" height="66" fill="var(--accent)"/>
  <rect x="317" y="347" width="66" height="66" fill="var(--accent)"/>
  <rect x="387" y="347" width="66" height="66" fill="var(--warn)" opacity="0.3"/>
  <rect x="107" y="417" width="66" height="66" fill="var(--warn)" opacity="0.3"/>
  <rect x="177" y="417" width="66" height="66" fill="var(--warn)" opacity="0.3"/>
  <rect x="247" y="417" width="66" height="66" fill="var(--warn)" opacity="0.3"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="圓形載體只切出九個完整方塊、周圍全是碎角；方形載體同尺寸方塊排滿無浪費">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
<defs><clipPath id="wafer"><circle cx="280" cy="310" r="175"/></clipPath></defs>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">方塊變大之後，圓形載體開始不划算</text>

<circle cx="280" cy="310" r="175" fill="var(--card)"/>
<g clip-path="url(#wafer)">
  <rect x="107" y="137" width="66" height="66" fill="var(--warn)" opacity="0.3"/>

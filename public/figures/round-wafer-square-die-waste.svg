<rect x="758" y="400.5" width="81.5" height="81.5" fill="var(--accent)"/>
<rect x="845.5" y="400.5" width="81.5" height="81.5" fill="var(--accent)"/>

<text x="280" y="523" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">圓形載體</text>
<text x="280" y="552" font-size="16" fill="var(--dim)" text-anchor="middle">九塊完整　邊角全是碎料</text>
<text x="755" y="523" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">方形載體</text>
<text x="755" y="552" font-size="16" fill="var(--dim)" text-anchor="middle">同尺寸　排得滿</text>
<text x="60" y="596" font-size="22" font-weight="700" fill="var(--ink)">換的是形狀，不是製程等級</text>
</svg>
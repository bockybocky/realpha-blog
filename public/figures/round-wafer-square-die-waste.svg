  <rect x="387" y="207" width="66" height="66" fill="var(--warn)" opacity="0.3"/>
  <rect x="107" y="277" width="66" height="66" fill="var(--warn)" opacity="0.3"/>
  <rect x="177" y="277" width="66" height="66" fill="var(--accent)"/>

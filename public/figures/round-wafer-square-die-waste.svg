<rect x="670.5" y="313" width="81.5" height="81.5" fill="var(--accent)"/>
<rect x="758" y="313" width="81.5" height="81.5" fill="var(--accent)"/>
<rect x="845.5" y="313" width="81.5" height="81.5" fill="var(--accent)"/>
<rect x="583" y="400.5" width="81.5" height="81.5" fill="var(--accent)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一個現金方塊分出兩條粗箭頭，往上通到往外擴，往下通到回購，往下那條標成踩剎車">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="70" y="70" font-size="27" fill="var(--ink)">錢的兩個出口</text>
<rect x="80" y="235" width="200" height="105" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="112" y="297" font-size="20" fill="var(--ink)">手上的現金</text>
<path d="M292 265 L560 178" stroke="var(--accent)" stroke-width="16" fill="none" stroke-linecap="round"/>
<polygon points="556,152 610,176 548,202" fill="var(--accent)"/>
<path d="M292 312 L560 400" stroke="var(--warn)" stroke-width="16" fill="none" stroke-linecap="round"/>
<polygon points="548,374 610,400 556,424" fill="var(--warn)"/>
<text x="634" y="172" font-size="20" fill="var(--ink)">往外擴</text>
<text x="634" y="202" font-size="16" fill="var(--dim)">相信丟進去會賺</text>
<text x="634" y="398" font-size="20" fill="var(--ink)">回購</text>
<text x="634" y="428" font-size="16" fill="var(--warn)">踩剎車</text>
<text x="80" y="498" font-size="22" fill="var(--ink)">錢往哪走，就是表態</text>
</svg>
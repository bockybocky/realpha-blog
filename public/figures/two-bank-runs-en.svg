<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two banks face the same run: one line plunges into disorderly failure, the other lands gently into an orderly wind-down; the difference is not asset quality but whether the borrowing route had been walked before.">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #9aa5b5;
      --accent: #1f6feb;
      --warn:   #d97706;
      --warnbg: #fdf4e7;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #6b7686;
        --accent: #58a6ff;
        --warn:   #d29922;
        --warnbg: #2b2411;
      }
    }
    .t     { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1    { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .nameW { font-size: 20px; font-weight: 700; fill: var(--warn); }
    .nameA { font-size: 20px; font-weight: 700; fill: var(--accent); }
    .step  { font-size: 15px; fill: var(--dim); }
    .end   { font-size: 17px; font-weight: 700; }
    .start { font-size: 17px; font-weight: 700; fill: var(--ink); }
    .key   { font-size: 16.5px; font-weight: 700; fill: var(--ink); }
    .kick  { font-size: 22px; font-weight: 700; fill: var(--ink); }
  </style>

  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>

  <g class="t">
    <text x="480" y="44" class="h1" text-anchor="middle">The same run, two completely different shapes</text>

    <!-- 共同起點 -->
    <circle cx="120" cy="200" r="8" fill="var(--ink)"/>
    <text x="120" y="176" class="start" text-anchor="middle">Run begins</text>

    <!-- SVB：急墜 -->
    <path d="M120,200 C220,206 280,222 360,262 C440,302 500,360 580,398 C660,432 720,444 830,452"
          fill="none" stroke="var(--warn)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="830" cy="452" r="8" fill="var(--warn)"/>
    <text x="200" y="228" class="nameW">SVB</text>
    <text x="300" y="262" class="step">Sold securities, losses in daylight</text>
    <text x="452" y="330" class="step">Run on Thursday</text>
    <text x="556" y="402" class="step">Closed Friday noon</text>
    <text x="826" y="486" class="end" fill="var(--warn)" text-anchor="end">Disorderly failure, a chain of rescues</text>

    <!-- Silvergate：平緩 -->
    <path d="M120,200 C240,196 340,190 460,184 C580,178 700,172 830,168"
          fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="830" cy="168" r="8" fill="var(--accent)"/>
    <text x="200" y="164" class="nameA">Silvergate</text>
    <text x="330" y="152" class="step">Borrowed at the window</text>
    <text x="560" y="146" class="step">Sold it down slowly and repaid</text>
    <text x="826" y="134" class="end" fill="var(--accent)" text-anchor="end">Wound itself up, no panic</text>

    <!-- 關鍵差別 -->
    <rect x="120" y="510" width="720" height="0" />
    <line x1="80" y1="506" x2="880" y2="506" stroke="var(--line)" stroke-width="1"/>
    <text x="480" y="538" class="key" text-anchor="middle">Not asset quality: SVB was full of quality assets. It was whether the borrowing route had been walked before.</text>

    <text x="480" y="574" class="kick" text-anchor="middle">The point is not that it could survive, but that it could fail in order.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A four-stage funnel narrows at each step, leaving only the thinnest layer at the bottom.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="64" font-size="27" fill="var(--ink)">How the twelve charts were filtered down</text>

<rect x="60" y="96" width="840" height="340" fill="var(--card)" rx="10"/>
<polygon points="100,130 820,130 700,200 220,200" fill="var(--accent)" opacity="0.28"/>
<polygon points="220,210 700,210 550,280 370,280" fill="var(--accent)" opacity="0.45"/>
<polygon points="370,290 550,290 500,350 420,350" fill="var(--accent)" opacity="0.68"/>
<polygon points="420,360 500,360 492,410 428,410" fill="var(--accent)"/>

<text x="460" y="172" font-size="19" fill="var(--ink)" text-anchor="middle">Russell 1000</text>
<text x="460" y="252" font-size="19" fill="var(--ink)" text-anchor="middle">152 strongest names</text>
<text x="460" y="326" font-size="19" fill="var(--ink)" text-anchor="middle">29 pass the chart test</text>
<text x="460" y="394" font-size="19" fill="var(--page)" text-anchor="middle">12</text>

<text x="620" y="252" font-size="16" fill="var(--dim)">Higher lows</text>
<text x="580" y="326" font-size="16" fill="var(--dim)">In-house score</text>

<text x="60" y="490" font-size="22" fill="var(--ink)">Charts are only the start; fundamentals come after</text>
</g>
</svg>
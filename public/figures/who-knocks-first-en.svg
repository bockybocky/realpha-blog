<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three arrival points on a timeline run from near to far: customer questionnaires, credit and renewal terms, then regulation.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:700;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .s{font-size:15px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="56" y="56">Who knocks first</text>
<path d="M96 268 L892 268" stroke="var(--line)" stroke-width="4"/>
<path d="M872 256 L900 268 L872 280 Z" fill="var(--line)"/>
<circle cx="176" cy="268" r="14" fill="var(--accent)"/>
<circle cx="452" cy="268" r="14" fill="var(--accent)" opacity="0.6"/>
<circle cx="768" cy="268" r="14" fill="var(--grey)"/>
<path d="M176 254 L176 176 M452 254 L452 176 M768 254 L768 176" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="120" y="160">Big customers</text>
<text class="s" x="120" y="188">Procurement questionnaire</text>
<text class="g" x="396" y="160">Banks and insurers</text>
<text class="s" x="396" y="188">Credit and renewal terms</text>
<text class="g" x="716" y="160">Regulation</text>
<text class="s" x="716" y="188">Mandatory</text>
<text class="b" x="128" y="320">Where the site is</text>
<text class="b" x="128" y="348">How much water</text>
<text class="b" x="128" y="376">How waste is handled</text>
<text class="b" x="128" y="404">Near a protected area</text>
<text class="b" x="716" y="320">Arrives last</text>
<text class="c" x="56" y="470">The first letter is not from the government</text>
</svg>
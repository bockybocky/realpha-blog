<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="An area chart: the in-house band fills the chart at the prototype stage, shrinks quickly once the design converges, and by mass production is only a strip of 10 to 15 percent at the bottom, with the rest outsourced.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:700}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700;fill:var(--accent)}
.w{fill:var(--page)}.a{fill:var(--accent)}.wa{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="40" y="56" class="t">In-house, then out</text>
<path d="M120,120 C290,120 400,150 490,300 C560,390 660,400 820,400 L820,120 Z" fill="var(--grey)" opacity="0.55"/>
<path d="M120,440 L120,120 C290,120 400,150 490,300 C560,390 660,400 820,400 L820,440 Z" fill="var(--accent)"/>
<text x="250" y="320" text-anchor="middle" class="g w">Own</text>
<text x="700" y="250" text-anchor="middle" class="g">Out</text>
<text x="110" y="126" text-anchor="end" class="d">100%</text>
<text x="110" y="444" text-anchor="end" class="d">0</text>
<line x1="836" y1="400" x2="836" y2="440" stroke="var(--ink)" stroke-width="2"/>
<line x1="828" y1="400" x2="836" y2="400" stroke="var(--ink)" stroke-width="2"/>
<line x1="828" y1="440" x2="836" y2="440" stroke="var(--ink)" stroke-width="2"/>
<text x="846" y="418" class="b">Keep 10–15%</text>
<text x="846" y="440" class="d">Hot</text>
<text x="170" y="472" text-anchor="middle" class="b">Proto #1</text>
<text x="490" y="472" text-anchor="middle" class="b">Converge</text>
<text x="780" y="472" text-anchor="middle" class="b">Vol</text>
<text x="480" y="528" text-anchor="middle" class="c">Know it to let go</text>
</svg>
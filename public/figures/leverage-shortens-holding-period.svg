<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="長短兩條橫條對比，正常回檔的虛線越過短的那條但沒越過長的">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { fill:var(--ink); font-size:27px; font-weight:700; }
.g { fill:var(--dim); font-size:19px; }
.b { fill:var(--dim); font-size:16px; }
.c { fill:var(--ink); font-size:22px; font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56">部位大小會偷偷改掉持有週期</text>
<text class="g" x="60" y="196">你以為的週期</text>
<rect x="250" y="172" width="620" height="42" rx="6" fill="var(--accent)" opacity="0.3"/>
<rect x="250" y="172" width="620" height="42" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="560" y="200" text-anchor="middle" fill="var(--ink)">半年</text>
<text class="g" x="60" y="336">槓桿放大後的忍耐力</text>
<rect x="250" y="312" width="70" height="42" rx="6" fill="var(--warn)"/>
<text class="g" x="336" y="340" fill="var(--ink)">三天</text>
<line x1="420" y1="140" x2="420" y2="392" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="b" x="432" y="136">一次正常回檔走到這裡</text>
<text class="b" x="432" y="380" fill="var(--warn)">在這之前就被洗出去</text>
<text class="c" x="480" y="468" text-anchor="middle">回檔沒有變大，是忍耐力變短了</text>
</svg>
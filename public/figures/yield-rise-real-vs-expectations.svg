<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="殖利率上升的長條九成屬於實質利率、一成屬於通膨預期，九成那段指向兩個來源。">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t h" x="60" y="66">這波殖利率上升是什麼組成的</text>
<rect x="60" y="130" width="738" height="64" rx="8" fill="var(--accent)"/>
<rect x="798" y="130" width="82" height="64" rx="8" fill="var(--grey)"/>
<text class="t g" x="84" y="170" fill="var(--page)">實質利率 九成</text>
<text class="t b" x="760" y="224">通膨預期 一成</text>
<path d="M240 194 V272" stroke="var(--accent)" stroke-width="3"/>
<path d="M620 194 V272" stroke="var(--accent)" stroke-width="3"/>
<rect x="60" y="272" width="330" height="118" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="84" y="308" fill="var(--ink)">雲端資本支出</text>
<text class="t b" x="84" y="336">自由現金流轉負 · 四家中三家</text>
<text class="t b" x="84" y="362">轉向債市長端籌錢</text>
<rect x="450" y="272" width="430" height="118" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t g" x="474" y="308" fill="var(--accent)">聯準會換人（主因）</text>
<text class="t b" x="474" y="336">原本定價降息 → 改成緊縮傾向 → 真的升一次</text>
<text class="t b" x="474" y="362">債務從 38 兆走到 39 兆時，十年期還在 4% 以下</text>
<text class="t c" x="60" y="470">變掉的那一格是政策，不是物價預期</text>
</svg>
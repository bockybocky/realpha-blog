<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條水平線，一條中途消散，一條撞上右邊的垂直線">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">把展望拆成兩堆：有些話一年後對得了答案</text>

<line x1="720" y1="120" x2="720" y2="420" stroke="var(--accent)" stroke-width="3" stroke-dasharray="9 7"/>
<text x="736" y="140" font-size="19" fill="var(--accent)">一年後攤開財報</text>

<rect x="60" y="176" width="280" height="60" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="200" y="213" font-size="16" fill="var(--dim)" text-anchor="middle">需求非常強勁</text>
<line x1="340" y1="206" x2="470" y2="206" stroke="var(--grey)" stroke-width="3"/>
<line x1="480" y1="206" x2="560" y2="206" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8" opacity="0.7"/>
<line x1="570" y1="206" x2="620" y2="206" stroke="var(--grey)" stroke-width="3" stroke-dasharray="3 12" opacity="0.4"/>
<text x="640" y="180" font-size="15" fill="var(--dim)">查不出對錯</text>

<rect x="60" y="326" width="280" height="60" rx="10" fill="var(--card)" stroke="var(--accent)"/>
<text x="200" y="363" font-size="16" fill="var(--ink)" text-anchor="middle">需求一倍．營收七成</text>
<line x1="340" y1="356" x2="712" y2="356" stroke="var(--accent)" stroke-width="3"/>
<circle cx="720" cy="356" r="10" fill="var(--accent)"/>
<text x="748" y="362" font-size="16" fill="var(--accent)">對得了答案</text>
<text x="748" y="388" font-size="15" fill="var(--dim)">而且指向電力．記憶體．封裝</text>

<text x="480" y="490" font-size="22" fill="var(--ink)" text-anchor="middle">前者感受氣氛，後者拿來記帳</text>
</svg>
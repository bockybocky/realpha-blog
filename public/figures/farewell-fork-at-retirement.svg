<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條線在垂直虛線處分岔，一支維持高度並被下方磚塊托住，另一支滑落到低處">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="60" y="62" font-size="27" fill="var(--ink)">兩種協作，退場那天才分岔</text>

  <line x1="520" y1="140" x2="520" y2="455" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="520" y="126" font-size="19" fill="var(--dim)" text-anchor="middle">退役日</text>

  <circle cx="110" cy="300" r="6" fill="var(--accent)"/>
  <path d="M110 300 L520 300" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="150" y="282" font-size="19" fill="var(--dim)">日常協作</text>

  <path d="M520 300 L850 300" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="560" y="280" font-size="19" fill="var(--ink)">留下思考方式</text>
  <text x="866" y="307" font-size="20" fill="var(--accent)">延續</text>

  <rect x="560" y="318" width="58" height="18" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="630" y="318" width="58" height="18" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="700" y="318" width="58" height="18" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="770" y="318" width="58" height="18" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="560" y="360" font-size="16" fill="var(--dim)">制度承接</text>

  <path d="M520 300 C 556 300, 566 420, 606 420 L 850 420" fill="none" stroke="var(--warn)" stroke-width="4" stroke-linecap="round"/>
  <text x="620" y="402" font-size="19" fill="var(--ink)">只拿答案</text>
  <text x="866" y="427" font-size="20" fill="var(--warn)">歸零</text>
</svg>
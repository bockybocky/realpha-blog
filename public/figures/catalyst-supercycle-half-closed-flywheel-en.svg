<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A ring made of four nodes: the half running from solar to batteries to electric vehicles is a thick solid line, while the half where power electronics feed back to the grid is a thin dashed line that has not closed yet.">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Only half the flywheel has closed</text>

  <path d="M 470 140 A 170 170 0 0 1 640 310" fill="none" stroke="var(--accent)" stroke-width="10"/>
  <path d="M 640 310 A 170 170 0 0 1 470 480" fill="none" stroke="var(--accent)" stroke-width="10"/>
  <path d="M 470 480 A 170 170 0 0 1 300 310" fill="none" stroke="var(--accent)" stroke-width="10"/>
  <path d="M 300 310 A 170 170 0 0 1 470 140" fill="none" stroke="var(--warn)" stroke-width="5" stroke-dasharray="14 12"/>

  <circle cx="470" cy="140" r="58" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="640" cy="310" r="58" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="470" cy="480" r="58" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="300" cy="310" r="58" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text x="470" y="147" font-size="19" fill="var(--ink)" text-anchor="middle">Solar</text>
  <text x="640" y="304" font-size="19" fill="var(--ink)" text-anchor="middle">Lithium batteries</text>
  <text x="640" y="328" font-size="19" fill="var(--ink)" text-anchor="middle">and storage</text>
  <text x="470" y="474" font-size="19" fill="var(--ink)" text-anchor="middle">Electric vehicles</text>
  <text x="470" y="498" font-size="19" fill="var(--ink)" text-anchor="middle">and motors</text>
  <text x="300" y="304" font-size="19" fill="var(--ink)" text-anchor="middle">Power</text>
  <text x="300" y="328" font-size="19" fill="var(--ink)" text-anchor="middle">electronics</text>

  <text x="700" y="178" font-size="20" font-weight="700" fill="var(--accent)">The half that happened</text>
  <text x="700" y="206" font-size="16" fill="var(--dim)">Volume cut the costs</text>
  <text x="240" y="178" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="end">The half still happening</text>
  <text x="240" y="206" font-size="16" fill="var(--dim)" text-anchor="end">Back to grid, much smaller</text>
  <text x="240" y="232" font-size="16" fill="var(--dim)" text-anchor="end">Narrator holds a position</text>

  <text x="60" y="534" font-size="22" font-weight="700" fill="var(--ink)">Reading the open half off the closed one is analogy, not evidence</text>
</svg>
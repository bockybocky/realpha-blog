<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條四十三度門檻橫線：左側多數氣候在線下，熱可往下排；右側極熱日超過線，熱必須往上推">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">同一套水，兩種氣候兩種結果</text>

<line x1="120" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="230" x2="900" y2="230" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 7"/>
<text class="n" x="900" y="214" text-anchor="end">戶外 43 度門檻</text>

<rect x="200" y="200" width="120" height="240" fill="var(--accent)" rx="4"/>
<text class="g" x="260" y="186" text-anchor="middle">45 度進水</text>
<text class="n" x="260" y="480" text-anchor="middle">晶片端出來的水</text>

<rect x="440" y="340" width="120" height="100" fill="var(--grey)" rx="4"/>
<text class="g" x="500" y="326" text-anchor="middle">多數氣候</text>
<text class="n" x="500" y="480" text-anchor="middle">熱往下排</text>
<path d="M500 250 l0 60 m-14 -16 l14 16 l14 -16" fill="none" stroke="var(--accent)" stroke-width="4"/>

<rect x="700" y="180" width="120" height="260" fill="var(--warn)" rx="4"/>
<text class="g" x="760" y="166" text-anchor="middle">極熱日</text>
<text class="n" x="760" y="480" text-anchor="middle">熱要往上推</text>
<path d="M760 140 l0 -50 m-14 16 l14 -16 l14 16" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="n" x="760" y="124" text-anchor="middle">開冰水機</text>

<text class="c" x="60" y="518">低耗水是氣候帶給的，不是規格表上的</text>
</svg>
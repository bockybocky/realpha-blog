<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The dashed cost threshold drops to a tenth of its old level, so a cluster of known gaps that all sat below it cross the line at once without moving.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">They do not expire one by one</text>
<text x="60" y="112" font-size="19" fill="var(--dim)">Before</text>
<text x="520" y="112" font-size="19" fill="var(--warn)">Cost falls to a tenth</text>
<line x1="60" y1="150" x2="440" y2="150" stroke="var(--accent)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="60" y="140" font-size="16" fill="var(--accent)">Threshold worth acting on</text>
<circle cx="110" cy="300" r="11" fill="var(--grey)"/>
<circle cx="170" cy="356" r="11" fill="var(--grey)"/>
<circle cx="232" cy="276" r="11" fill="var(--grey)"/>
<circle cx="296" cy="382" r="11" fill="var(--grey)"/>
<circle cx="356" cy="318" r="11" fill="var(--grey)"/>
<circle cx="412" cy="360" r="11" fill="var(--grey)"/>
<text x="248" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">Known gaps</text>
<text x="248" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">Unlikely, leave it</text>
<line x1="520" y1="430" x2="900" y2="430" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="520" y="462" font-size="16" fill="var(--warn)">Threshold</text>
<path d="M470 158 L 470 414" stroke="var(--warn)" stroke-width="4"/>
<polygon points="460,414 480,414 470,438" fill="var(--warn)"/>
<circle cx="570" cy="300" r="11" fill="var(--warn)"/>
<circle cx="630" cy="356" r="11" fill="var(--warn)"/>
<circle cx="692" cy="276" r="11" fill="var(--warn)"/>
<circle cx="756" cy="382" r="11" fill="var(--warn)"/>
<circle cx="816" cy="318" r="11" fill="var(--warn)"/>
<circle cx="872" cy="360" r="11" fill="var(--warn)"/>
<text x="710" y="200" font-size="19" fill="var(--ink)" text-anchor="middle">Dots never moved</text>
<text x="710" y="228" font-size="16" fill="var(--dim)" text-anchor="middle">All due at once</text>
<text x="60" y="524" font-size="22" fill="var(--ink)">What changed is the cost, not the gaps</text>
</g>
</svg>
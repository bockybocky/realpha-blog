<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars, short on the left and tall on the right, with the right more than twice the height of the left, showing house prices rising from three times annual income to seven times.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .n { font-size:36px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="70">Years of income for one house</text>
  <line x1="80" y1="462" x2="880" y2="462" stroke="var(--line)" stroke-width="2"/>

  <rect x="230" y="312" width="150" height="150" rx="6" fill="var(--grey)"/>
  <text class="n" x="305" y="292" text-anchor="middle" fill="var(--dim)">3</text>
  <text class="g" x="305" y="496" text-anchor="middle">Grandparents' day</text>

  <rect x="600" y="112" width="150" height="350" rx="6" fill="var(--accent)"/>
  <text class="n" x="675" y="92" text-anchor="middle" fill="var(--accent)">7</text>
  <text class="g" x="675" y="496" text-anchor="middle">Today</text>

  <text class="b" x="80" y="140">Unit: times annual income</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三層漏斗由寬到窄，上層五千份由 Jev 粗篩，中層兩百份由大模型細讀，底層一小格">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="40" y="58" font-size="27" font-weight="700">先粗篩，再細讀</text>
<path d="M120,100 L840,100 L630,250 L330,250 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="148" font-size="20" font-weight="700" text-anchor="middle">5,000 份履歷</text>
<text x="480" y="226" font-size="19" font-weight="700" text-anchor="middle" style="fill:var(--accent)">Jev 粗篩</text>
<text x="700" y="232" font-size="16" style="fill:var(--dim)">快、便宜</text>
<path d="M330,266 L630,266 L545,386 L415,386 Z" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="480" y="306" font-size="20" font-weight="700" text-anchor="middle">200 份</text>
<text x="480" y="360" font-size="16" text-anchor="middle">大模型細讀</text>
<text x="604" y="352" font-size="16" style="fill:var(--dim)">慢、貴</text>
<rect x="440" y="402" width="80" height="44" rx="8" fill="var(--accent)"/>
<text x="480" y="430" font-size="16" font-weight="700" text-anchor="middle" style="fill:var(--page)">面試</text>
<text x="480" y="520" font-size="22" font-weight="700" text-anchor="middle">使用者只感覺到變快、變便宜</text>
</svg>
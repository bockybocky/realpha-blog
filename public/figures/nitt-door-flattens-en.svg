<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="As the price line falls, the door collapses from a tall gateway into a slab lying flat on the ground.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="66">How the door collapses</text>
  <line x1="140" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
  <path d="M170 140 C 330 170, 470 300, 840 372" fill="none" stroke="var(--warn)" stroke-width="5"/>
  <circle cx="170" cy="140" r="8" fill="var(--warn)"/>
  <circle cx="840" cy="372" r="8" fill="var(--warn)"/>
  <text class="g" x="170" y="116">Over US$5,000 per ton</text>
  <text class="g" x="840" y="356" text-anchor="end">Over US$1,000 per ton</text>
  <rect x="200" y="200" width="22" height="200" fill="var(--grey)"/>
  <rect x="330" y="200" width="22" height="200" fill="var(--grey)"/>
  <rect x="200" y="186" width="152" height="18" fill="var(--grey)"/>
  <text class="b" x="276" y="440" text-anchor="middle">Once a gateway</text>
  <rect x="700" y="384" width="160" height="16" fill="var(--grey)"/>
  <text class="b" x="780" y="440" text-anchor="middle">Now just a floor</text>
  <text class="c" x="480" y="500" text-anchor="middle">Once commoditized, the gateway is gone</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One stream of power splits into three branches, and the three bars on the right differ clearly in height, with the data center bar the tallest.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Power flows to best pay</text>
<text x="60" y="92" font-size="16" fill="var(--dim)">Bar = spread captured</text>

<circle cx="130" cy="300" r="54" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="130" y="309" font-size="20" text-anchor="middle" fill="var(--ink)">Power</text>

<path d="M184 300 C 300 300 320 420 420 426" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M184 300 C 300 300 460 210 596 196" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M184 300 C 300 300 640 330 780 322" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 6"/>

<rect x="420" y="426" width="92" height="40" fill="var(--grey)"/>
<text x="466" y="494" font-size="19" text-anchor="middle" fill="var(--dim)">Sell power</text>

<rect x="596" y="196" width="92" height="270" fill="var(--accent)"/>
<text x="642" y="494" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Data center</text>
<text x="642" y="172" font-size="19" text-anchor="middle" fill="var(--accent)">Convert</text>

<rect x="780" y="322" width="92" height="144" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="826" y="494" font-size="19" text-anchor="middle" fill="var(--ink)">Move abroad</text>
<text x="826" y="300" font-size="16" text-anchor="middle" fill="var(--dim)">Compute via fiber</text>

<path d="M400 466 L900 466" stroke="var(--line)" stroke-width="2"/>
</svg>
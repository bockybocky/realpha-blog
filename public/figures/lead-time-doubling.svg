<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="四根橫條由上而下逐根變長，從二十週延伸到三十六週">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:19px; fill:var(--dim); }
    .val { font-size:19px; fill:var(--ink); font-weight:700; }
    .cap { font-size:15px; fill:var(--dim); }
    .cc  { font-size:22px; fill:var(--accent); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="ttl" x="60" y="72">同一顆零件，拿到手要等多久</text>
<text class="cap" x="60" y="102">積層陶瓷電容　單位：週</text>

<text class="grp" x="60" y="163">年初</text>
<rect x="180" y="136" width="300" height="46" rx="6" fill="var(--grey)"/>
<text class="val" x="496" y="167">20</text>

<text class="grp" x="60" y="238">六月</text>
<rect x="180" y="211" width="360" height="46" rx="6" fill="var(--grey)"/>
<text class="val" x="556" y="242">24</text>

<text class="grp" x="60" y="313">七月</text>
<rect x="180" y="286" width="450" height="46" rx="6" fill="var(--grey)"/>
<text class="val" x="646" y="317">30</text>

<text class="grp" x="60" y="388">八月</text>
<rect x="180" y="361" width="540" height="46" rx="6" fill="var(--accent)"/>
<text class="val" x="736" y="392">36</text>

<line x1="180" y1="120" x2="180" y2="425" stroke="var(--line)" stroke-width="2"/>
<text class="cc" x="180" y="470">半年，翻了一倍</text>
</svg>
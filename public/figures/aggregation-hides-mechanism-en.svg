<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bars from different sources add into one total bar, with their supports labeled below">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
  <marker id="a7" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto">
    <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--dim)"/>
  </marker>
</defs>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Aggregation flattens two opposite things into one number</text>

<rect x="100" y="180" width="130" height="180" rx="8" fill="var(--accent)"/>
<text x="165" y="160" font-size="19" fill="var(--ink)" text-anchor="middle">The wealthy</text>
<text x="255" y="285" font-size="27" fill="var(--dim)">+</text>
<rect x="300" y="180" width="130" height="180" rx="8" fill="var(--warn)"/>
<text x="365" y="160" font-size="19" fill="var(--ink)" text-anchor="middle">Low income</text>

<line x1="470" y1="270" x2="580" y2="270" stroke="var(--dim)" stroke-width="3" marker-end="url(#a7)"/>

<rect x="640" y="180" width="200" height="180" rx="8" fill="var(--grey)"/>
<text x="740" y="160" font-size="19" fill="var(--ink)" text-anchor="middle">Consumer spending growth</text>
<text x="740" y="285" font-size="16" fill="var(--page)" text-anchor="middle">You can't see what's mixed inside</text>

<line x1="60" y1="400" x2="900" y2="400" stroke="var(--line)"/>
<text x="60" y="436" font-size="16" fill="var(--dim)">What holds it up</text>
<rect x="100" y="452" width="130" height="52" rx="10" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="165" y="484" font-size="16" fill="var(--accent)" text-anchor="middle">Asset prices</text>
<rect x="300" y="452" width="130" height="52" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text x="365" y="484" font-size="16" fill="var(--warn)" text-anchor="middle">Future slack</text>
<text x="450" y="484" font-size="16" fill="var(--warn)">Runs out</text>

<text x="480" y="540" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Same number, different staying power</text>
</svg>
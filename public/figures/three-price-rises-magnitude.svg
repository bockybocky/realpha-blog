<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條橫向長條：被動元件和算力租金只略超過原價線，記憶體長條延伸到四到近六倍">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
    .p { fill:var(--page); }
</style>
<text x="60" y="52" class="t">同一週的漲價，量級不同</text>
<line x1="375" y1="120" x2="375" y2="410" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="375" y="112" class="d" text-anchor="middle">原價</text>
<text x="60" y="176" class="g">被動元件</text>
<rect x="280" y="152" width="105" height="36" fill="var(--grey)"/>
<text x="400" y="176" class="b">＋個位數～一成多</text>
<text x="60" y="276" class="g">算力租金</text>
<rect x="280" y="252" width="114" height="36" fill="var(--grey)"/>
<text x="410" y="276" class="b">＋17～21%</text>
<text x="60" y="376" class="g">成熟製程記憶體</text>
<rect x="280" y="352" width="380" height="36" fill="var(--accent)"/>
<rect x="660" y="352" width="171" height="36" fill="var(--accent)" opacity="0.35"/>
<text x="300" y="377" class="g p">4～近 6 倍</text>
<line x1="280" y1="425" x2="860" y2="425" stroke="var(--line)" stroke-width="2"/>
<text x="375" y="450" class="d" text-anchor="middle">1×</text>
<text x="470" y="450" class="d" text-anchor="middle">2×</text>
<text x="660" y="450" class="d" text-anchor="middle">4×</text>
<text x="850" y="450" class="d" text-anchor="middle">6×</text>
<text x="480" y="495" class="c" text-anchor="middle">漲最凶的那層 ＝ 最先斷的那層</text>
</svg>
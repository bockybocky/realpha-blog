<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一排由左到右變高的長條，左邊容易複製的技能矮，右邊難以複製的高。">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .k { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="h" x="60" y="66">剩下的價值，看複製難度不看學了幾年</text>

<line x1="90" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="90" y="450">容易複製</text>
<text class="s" x="900" y="450" text-anchor="end">難以複製</text>

<rect x="120" y="366" width="110" height="54" rx="6" fill="var(--grey)"/>
<text class="s" x="175" y="350" text-anchor="middle">整理資料</text>

<rect x="270" y="356" width="110" height="64" rx="6" fill="var(--grey)"/>
<text class="s" x="325" y="340" text-anchor="middle">翻譯</text>

<rect x="420" y="340" width="110" height="80" rx="6" fill="var(--grey)"/>
<text class="s" x="475" y="324" text-anchor="middle">制式文案</text>

<rect x="580" y="212" width="130" height="208" rx="6" fill="var(--accent)"/>
<text class="g" x="645" y="196" text-anchor="middle">有觀點的評論</text>

<rect x="750" y="168" width="130" height="252" rx="6" fill="var(--accent)"/>
<text class="g" x="815" y="152" text-anchor="middle">本人的存在感</text>

<text class="k" x="60" y="500">那位廚師複製不了，因為那是他每天真的在做的事</text>
</svg>
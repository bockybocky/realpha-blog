<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three horizontal bars extend according to the days needed to find a replacement, and the one that seems most stable is the longest.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="78" font-size="27" fill="var(--ink)">How fast can it be replaced?</text>

<line x1="300" y1="130" x2="300" y2="420" stroke="var(--line)" stroke-width="2"/>

<text x="280" y="196" font-size="19" fill="var(--ink)" text-anchor="end">Backup babysitter</text>
<rect x="300" y="172" width="120" height="36" fill="var(--accent)"/>
<text x="436" y="198" font-size="20" fill="var(--ink)">1 day</text>

<text x="280" y="286" font-size="19" fill="var(--ink)" text-anchor="end">Our usual electrician</text>
<rect x="300" y="262" width="260" height="36" fill="var(--accent)"/>
<text x="576" y="288" font-size="20" fill="var(--ink)">7 days</text>

<text x="280" y="376" font-size="19" fill="var(--ink)" text-anchor="end">Photos on one drive only</text>
<rect x="300" y="352" width="560" height="36" fill="var(--warn)"/>
<text x="876" y="378" font-size="20" fill="var(--warn)" text-anchor="end">No replacement</text>

<text x="60" y="470" font-size="22" fill="var(--ink)">So stable we never sought a second</text>
</g>
</svg>
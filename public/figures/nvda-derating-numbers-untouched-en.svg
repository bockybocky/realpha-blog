<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars side by side: the left one keeps its full height, the right one is only half of its dotted original height.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="70" font-size="27" fill="var(--ink)">What he moved, and what he didn't</text>
<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="150" width="160" height="270" fill="var(--accent)" opacity="0.85"/>
<text x="180" y="130" font-size="20" fill="var(--dim)">The original view</text>
<text x="180" y="455" font-size="19" fill="var(--ink)">Financial estimates</text>
<text x="180" y="482" font-size="16" fill="var(--dim)">No changes</text>
<rect x="600" y="150" width="160" height="270" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="600" y="285" width="160" height="135" fill="var(--warn)" opacity="0.85"/>
<text x="600" y="130" font-size="20" fill="var(--dim)">After this week</text>
<text x="600" y="455" font-size="19" fill="var(--ink)">Rating and target</text>
<text x="600" y="482" font-size="16" fill="var(--dim)">Target cut in half</text>
<line x1="790" y1="152" x2="790" y2="283" stroke="var(--warn)" stroke-width="2"/>
<text x="805" y="225" font-size="16" fill="var(--warn)">Cut</text>
<text x="380" y="300" font-size="22" fill="var(--ink)">Same numbers</text>
<text x="380" y="332" font-size="22" fill="var(--ink)">Different rating</text>
</svg>
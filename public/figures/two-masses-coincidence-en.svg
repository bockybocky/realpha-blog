<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the electromagnetic side inertia and charge bear no relation; on the gravity side each pair of bars matches exactly in height.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56">Two unrelated quantities happen to match under gravity</text>

  <rect x="60" y="90" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="90" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="84" y="126">Electromagnetism</text>
  <text class="g" x="524" y="126">Gravity</text>

  <line x1="84" y1="368" x2="436" y2="368" stroke="var(--line)" stroke-width="2"/>
  <line x1="524" y1="368" x2="876" y2="368" stroke="var(--line)" stroke-width="2"/>

  <rect x="112" y="208" width="44" height="160" fill="var(--grey)"/>
  <rect x="176" y="362" width="44" height="6" fill="var(--grey)"/>
  <text class="s" x="134" y="390" text-anchor="middle">Inertia</text>
  <text class="s" x="198" y="390" text-anchor="middle">Charge</text>
  <text class="s" x="166" y="412" text-anchor="middle">Neutron</text>

  <rect x="290" y="322" width="44" height="46" fill="var(--grey)"/>
  <rect x="354" y="246" width="44" height="122" fill="var(--grey)"/>
  <text class="s" x="312" y="390" text-anchor="middle">Inertia</text>
  <text class="s" x="376" y="390" text-anchor="middle">Charge</text>
  <text class="s" x="344" y="412" text-anchor="middle">Electron</text>

  <rect x="552" y="208" width="44" height="160" fill="var(--accent)"/>
  <rect x="616" y="208" width="44" height="160" fill="var(--accent)"/>
  <line x1="546" y1="208" x2="666" y2="208" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>
  <text class="s" x="574" y="390" text-anchor="middle">Inertia</text>
  <text class="s" x="638" y="390" text-anchor="middle">Grav.</text>
  <text class="s" x="606" y="412" text-anchor="middle">Brick</text>

  <rect x="730" y="312" width="44" height="56" fill="var(--accent)"/>
  <rect x="794" y="312" width="44" height="56" fill="var(--accent)"/>
  <line x1="724" y1="312" x2="844" y2="312" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>
  <text class="s" x="752" y="390" text-anchor="middle">Inertia</text>
  <text class="s" x="816" y="390" text-anchor="middle">Grav.</text>
  <text class="s" x="784" y="412" text-anchor="middle">Feather</text>

  <text class="c" x="60" y="490">Mismatched heights are normal; every pair matching needs explaining</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="走進同一扇門一次與反覆走進去的對比：次數多了，行動自由被那個房間定價">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:20px;fill:var(--ink)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<marker id="ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
<marker id="rw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">傷獨立性的不是虧損，是次數</text>

<rect x="60" y="100" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="140">偶爾一次</text>
<rect x="330" y="176" width="80" height="200" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="336" y="404">要錢的房間</text>
<path d="M110 276 L316 276" stroke="var(--accent)" stroke-width="4" marker-end="url(#ra)"/>
<text class="b" x="112" y="256">走進去一次</text>

<rect x="500" y="100" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="524" y="140">好幾次</text>
<rect x="770" y="176" width="80" height="200" rx="6" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text class="b" x="776" y="404">要錢的房間</text>
<path d="M550 216 L756 216" stroke="var(--warn)" stroke-width="4" marker-end="url(#rw)"/>
<path d="M550 262 L756 262" stroke="var(--warn)" stroke-width="4" marker-end="url(#rw)"/>
<path d="M550 308 L756 308" stroke="var(--warn)" stroke-width="4" marker-end="url(#rw)"/>
<path d="M550 354 L756 354" stroke="var(--warn)" stroke-width="4" marker-end="url(#rw)"/>
<text class="b" x="524" y="190">反覆解釋、請求、爭取</text>

<text class="c" x="60" y="486">行動自由，被那個房間定價</text>
</svg>
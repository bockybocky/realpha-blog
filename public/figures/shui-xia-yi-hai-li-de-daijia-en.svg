<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A tiny block at the top stands for the energy needed to move one nautical mile through air, while a long bar below, spanning the whole figure with a break mark in the middle, stands for the energy needed to cover the same distance through water, a difference of roughly one thousand times in length.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">The price of one nautical mile</text>

  <text x="60" y="168" font-size="19" fill="var(--dim)">In air</text>
  <rect x="60" y="186" width="24" height="46" rx="3" fill="var(--grey)"/>
  <text x="100" y="219" font-size="16" fill="var(--dim)">×1</text>

  <text x="60" y="288" font-size="19" fill="var(--ink)">In water</text>
  <rect x="60" y="306" width="760" height="46" rx="3" fill="var(--accent)"/>
  <path d="M 430 300 L 410 358" stroke="var(--page)" stroke-width="7" fill="none"/>
  <path d="M 452 300 L 432 358" stroke="var(--page)" stroke-width="7" fill="none"/>
  <text x="834" y="337" font-size="19" font-weight="700" fill="var(--accent)">×1000</text>

  <line x1="60" y1="404" x2="900" y2="404" stroke="var(--line)" stroke-width="2"/>
  <text x="60" y="450" font-size="22" font-weight="700" fill="var(--ink)">1000x the density, 1000x the propulsion energy</text>
  <text x="60" y="482" font-size="16" fill="var(--dim)">Same nautical mile · same machine</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two cards compared: in the announced version decisions flow only to the CEO, in the real version they flow to the chairman as well, along a thicker line">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="56" font-size="27" fill="var(--ink)">Titles in the filing, decisions in the hall</text>

<rect x="60" y="100" width="390" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="84" y="140" font-size="20" fill="var(--dim)">Announced</text>
<rect x="230" y="180" width="200" height="64" rx="10" fill="none" stroke="var(--grey)"/>
<text x="330" y="219" font-size="19" fill="var(--dim)" text-anchor="middle">Chairman</text>
<rect x="230" y="310" width="200" height="64" rx="10" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="330" y="349" font-size="19" fill="var(--ink)" text-anchor="middle">CEO</text>
<rect x="78" y="318" width="110" height="48" rx="8" fill="none" stroke="var(--line)"/>
<text x="133" y="348" font-size="16" fill="var(--dim)" text-anchor="middle">Big decisions</text>
<line x1="190" y1="342" x2="218" y2="342" stroke="var(--accent)" stroke-width="3"/>
<polygon points="228,342 216,336 216,348" fill="var(--accent)"/>

<rect x="510" y="100" width="390" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="534" y="140" font-size="20" fill="var(--dim)">Actual</text>
<rect x="680" y="180" width="200" height="64" rx="10" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="780" y="219" font-size="19" fill="var(--ink)" text-anchor="middle">Chairman</text>
<rect x="680" y="310" width="200" height="64" rx="10" fill="none" stroke="var(--grey)"/>
<text x="780" y="349" font-size="19" fill="var(--dim)" text-anchor="middle">CEO</text>
<rect x="528" y="318" width="110" height="48" rx="8" fill="none" stroke="var(--line)"/>
<text x="583" y="348" font-size="16" fill="var(--dim)" text-anchor="middle">Big decisions</text>
<line x1="640" y1="342" x2="658" y2="342" stroke="var(--grey)" stroke-width="2"/>
<polygon points="668,342 657,337 657,347" fill="var(--grey)"/>
<path d="M640 336 C 660 330 650 216 656 212" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polygon points="668,212 654,205 654,219" fill="var(--accent)"/>

<text x="60" y="500" font-size="22" fill="var(--accent)">Follow the decisions, not the title</text>
</g>
</svg>
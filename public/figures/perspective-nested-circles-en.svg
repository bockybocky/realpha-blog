<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-label="Four concentric circles; the blame-shifting reaction links to the innermost circle, and the responsibility-taking reactions link to the company circle.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<rect x="0" y="0" width="960" height="570" fill="var(--page)"/>
<text x="480" y="56" text-anchor="middle" class="t">How wide you see</text>
<circle cx="330" cy="320" r="210" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="330" cy="320" r="160" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="330" cy="320" r="110" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="330" cy="320" r="55" fill="var(--page)" stroke="var(--warn)" stroke-width="2.5"/>
<text x="330" y="140" text-anchor="middle" class="b">World</text>
<text x="330" y="190" text-anchor="middle" class="b">Japan</text>
<text x="330" y="240" text-anchor="middle" class="b a">Company</text>
<text x="330" y="326" text-anchor="middle" class="b">Me, pals</text>
<line x1="612" y1="262" x2="385" y2="320" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="620" y="252" class="g w">Small</text>
<text x="620" y="280" class="b">Not on me</text>
<line x1="612" y1="412" x2="430" y2="366" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="620" y="402" class="g a">Big</text>
<text x="620" y="430" class="b">Ask next team</text>
<text x="620" y="456" class="b">Should've hired</text>
<text x="620" y="526" class="c">See wider, grow</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three bars from tall to short; the rightmost, living on friction, is left as a sliver, and the dashed area above is what was scraped away.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:20px; fill:var(--ink); font-weight:600; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="48" y="58">What is left after the scraping</text>
<line x1="48" y1="430" x2="912" y2="430" stroke="var(--line)" stroke-width="3"/>
<rect x="110" y="140" width="180" height="290" fill="var(--accent)"/>
<rect x="110" y="116" width="180" height="24" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="g" x="118" y="470">The service itself</text>
<text class="b" x="118" y="496">Almost nothing lost</text>
<rect x="390" y="286" width="180" height="144" fill="var(--grey)"/>
<rect x="390" y="116" width="180" height="170" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="g" x="398" y="470">Interface traffic</text>
<text class="b" x="398" y="496">Half gone</text>
<rect x="670" y="410" width="180" height="20" fill="var(--warn)"/>
<rect x="670" y="116" width="180" height="294" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="g" x="678" y="470">Friction</text>
<text class="b" x="678" y="496">Scraped cleanest</text>
<text class="b" x="676" y="106">Scraped off</text>
<text class="c" x="48" y="540">The more you earn from laziness, the less is left</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="只有起步金的柱子極矮，疊上每月小額與外部加碼後的柱子越過一條虛線門檻">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">金額小的時候，教不動</text>
<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="3"/>
<rect x="150" y="416" width="160" height="24" fill="var(--line)"/>
<text class="g" x="150" y="400">只有起步金</text>
<text class="s" x="150" y="472">＄1,000</text>
<text class="s" x="150" y="496">沒人問問題</text>
<rect x="560" y="416" width="200" height="24" fill="var(--line)"/>
<rect x="560" y="236" width="200" height="180" fill="var(--accent)"/>
<rect x="560" y="176" width="200" height="60" fill="var(--grey)"/>
<text class="s" x="770" y="432">起步金</text>
<text class="s" x="770" y="336">每月 ＄50</text>
<text class="s" x="770" y="212">慈善與公司加碼</text>
<line x1="500" y1="176" x2="900" y2="176" stroke="var(--ink)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="g" x="500" y="158">到這裡才會開始問問題</text>
<text class="s" x="560" y="472">七年級約 ＄12,000 到 ＄13,000</text>
<text class="c" x="60" y="534">規模不夠，金融教育只是一堂空話</text>
</svg>
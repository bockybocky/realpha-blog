<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條交叉的箭頭，立場對調">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">馬鈴薯通信：立場對調</text>

  <rect x="60" y="140" width="220" height="80" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="170" y="188" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">艾奇沃斯</text>

  <rect x="680" y="140" width="220" height="80" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="790" y="188" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">李嘉圖</text>

  <path d="M290 200 L670 320" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <path d="M652 308 L678 322 L650 326 Z" fill="var(--accent)"/>
  <path d="M670 200 L290 320" stroke="var(--warn)" stroke-width="4" fill="none"/>
  <path d="M310 308 L282 322 L308 326 Z" fill="var(--warn)"/>

  <rect x="60" y="340" width="300" height="76" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="210" y="386" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">風險太大</text>

  <rect x="600" y="340" width="300" height="76" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="750" y="386" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">全押馬鈴薯</text>

  <text class="t" x="210" y="440" font-size="16" fill="var(--dim)" text-anchor="middle">理論作者的保留</text>
  <text class="t" x="750" y="440" font-size="16" fill="var(--dim)" text-anchor="middle">照他的理論推到底</text>

  <text class="t" x="60" y="492" font-size="22" font-weight="700" fill="var(--ink)">各自講出對方該講的話</text>
</svg>
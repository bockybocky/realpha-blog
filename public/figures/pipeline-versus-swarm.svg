<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="左邊一條直線流水線：主控拆任務、三個子代理各做各的、主控彙總；右邊三個節點之間有來回的箭頭，中間標著費洛蒙，箭頭愈走愈粗">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #b9c2d0;
      --accent: #1f6feb;
      --warn:   #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #4a5464;
        --accent: #58a6ff;
        --warn:   #d29922;
      }
    }
    .t    { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1   { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .head { font-size: 21px; font-weight: 700; fill: var(--ink); }
    .headA{ font-size: 21px; font-weight: 700; fill: var(--accent); }
    .lab  { font-size: 16px; font-weight: 700; fill: var(--ink); }
    .sub  { font-size: 15px; fill: var(--dim); }
    .tag  { font-size: 15px; font-weight: 700; fill: var(--warn); }
  </style>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--grey)"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" fill="var(--page)"/>
  <g class="t">
    <text x="480" y="44" class="h1" text-anchor="middle">流水線，還是蜂群？差在同伴之間有沒有訊號</text>

    <!-- 左：流水線 -->
    <text x="240" y="90" class="head" text-anchor="middle">流水線（大多數產品）</text>
    <rect x="180" y="110" width="120" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text x="240" y="136" class="lab" text-anchor="middle">主控拆任務</text>
    <line x1="240" y1="150" x2="120" y2="200" stroke="var(--grey)" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="240" y1="150" x2="240" y2="200" stroke="var(--grey)" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="240" y1="150" x2="360" y2="200" stroke="var(--grey)" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="80"  y="205" width="80" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <rect x="200" y="205" width="80" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <rect x="320" y="205" width="80" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text x="120" y="231" class="lab" text-anchor="middle">代理 A</text>
    <text x="240" y="231" class="lab" text-anchor="middle">代理 B</text>
    <text x="360" y="231" class="lab" text-anchor="middle">代理 C</text>
    <line x1="120" y1="245" x2="240" y2="300" stroke="var(--grey)" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="240" y1="245" x2="240" y2="300" stroke="var(--grey)" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="360" y1="245" x2="240" y2="300" stroke="var(--grey)" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="180" y="305" width="120" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text x="240" y="331" class="lab" text-anchor="middle">主控彙總</text>
    <text x="240" y="385" class="sub" text-anchor="middle">各做各的，彼此看不到；效率有，智慧沒有</text>

    <!-- 中線 -->
    <line x1="480" y1="80" x2="480" y2="395" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- 右：蜂群 -->
    <text x="720" y="90" class="headA" text-anchor="middle">蜂群（蜜蜂、螞蟻、EvoX 想做的）</text>
    <circle cx="640" cy="180" r="34" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="800" cy="180" r="34" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="720" cy="300" r="34" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <text x="640" y="185" class="lab" text-anchor="middle">A</text>
    <text x="800" y="185" class="lab" text-anchor="middle">B</text>
    <text x="720" y="305" class="lab" text-anchor="middle">C</text>
    <!-- 來回箭頭，愈走愈粗 -->
    <path d="M 676 170 L 764 170" stroke="var(--accent)" stroke-width="2" marker-end="url(#arA)" fill="none"/>
    <path d="M 764 192 L 676 192" stroke="var(--accent)" stroke-width="4" marker-end="url(#arA)" fill="none"/>
    <path d="M 655 212 L 700 268" stroke="var(--accent)" stroke-width="3" marker-end="url(#arA)" fill="none"/>
    <path d="M 740 268 L 785 212" stroke="var(--accent)" stroke-width="5" marker-end="url(#arA)" fill="none"/>
    <text x="720" y="124" class="tag" text-anchor="middle">費洛蒙：走過的路留下記號</text>
    <text x="720" y="385" class="sub" text-anchor="middle">彼此影響、強化或修正對方；箭頭愈走愈粗</text>
  </g>
</svg>

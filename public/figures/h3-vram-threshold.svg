<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="柱狀高度圖：52GB 需求線橫過，8GB、12GB、24GB 三根柱遠低於線，80GB 與 96GB 高過線">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">52GB 這條線，決定你的卡能不能用</text>

  <line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>

  <line x1="60" y1="309" x2="900" y2="309" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="t" x="60" y="298" font-size="19" font-weight="700" fill="var(--warn)">峰值需求 52GB</text>

  <rect x="110" y="445" width="100" height="25" fill="var(--grey)"/>
  <text class="t" x="160" y="498" font-size="16" fill="var(--dim)" text-anchor="middle">家用卡</text>
  <text class="t" x="160" y="520" font-size="16" fill="var(--ink)" text-anchor="middle">8GB</text>

  <rect x="250" y="433" width="100" height="37" fill="var(--grey)"/>
  <text class="t" x="300" y="498" font-size="16" fill="var(--dim)" text-anchor="middle">家用卡</text>
  <text class="t" x="300" y="520" font-size="16" fill="var(--ink)" text-anchor="middle">12GB</text>

  <rect x="390" y="396" width="100" height="74" fill="var(--grey)"/>
  <text class="t" x="440" y="498" font-size="16" fill="var(--dim)" text-anchor="middle">租卡常選</text>
  <text class="t" x="440" y="520" font-size="16" fill="var(--ink)" text-anchor="middle">24GB</text>

  <rect x="580" y="222" width="100" height="248" fill="var(--accent)" opacity="0.45"/>
  <text class="t" x="630" y="498" font-size="16" fill="var(--dim)" text-anchor="middle">A100</text>
  <text class="t" x="630" y="520" font-size="16" fill="var(--ink)" text-anchor="middle">80GB</text>

  <rect x="740" y="172" width="100" height="298" fill="var(--accent)"/>
  <text class="t" x="790" y="498" font-size="16" fill="var(--dim)" text-anchor="middle">Colab G4</text>
  <text class="t" x="790" y="520" font-size="16" fill="var(--ink)" text-anchor="middle">96GB</text>

  <text class="t" x="245" y="375" font-size="20" font-weight="700" fill="var(--dim)">線下＝跑不動</text>
  <text class="t" x="600" y="150" font-size="20" font-weight="700" fill="var(--accent)">線上＝借得到</text>
</svg>
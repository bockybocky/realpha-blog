<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A thick pipeline in five sections running left to right, the second narrowing sharply while the others keep their width">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .gw { font-size:19px; font-weight:700; fill:var(--warn); }
    .s { font-size:15px; fill:var(--dim); }
    .sw { font-size:15px; fill:var(--warn); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="60">The bottleneck isn't the reactor, it's this middle section</text>

<rect x="60" y="130" width="146" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="226" y="158" width="126" height="30" rx="6" fill="var(--page)" stroke="var(--warn)" stroke-width="4"/>
<rect x="372" y="130" width="146" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="538" y="130" width="146" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="704" y="130" width="146" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="850,160 890,173 850,186" fill="var(--grey)"/>

<text class="g" x="97" y="180">Mining</text>
<text class="gw" x="252" y="228">Conversion</text>
<text class="g" x="409" y="180">Enrichment</text>
<text class="g" x="561" y="180">Fuel fabrication</text>
<text class="g" x="746" y="180">Reactor</text>

<circle cx="133" cy="252" r="6" fill="var(--accent)"/>
<circle cx="445" cy="252" r="6" fill="var(--accent)"/>
<circle cx="611" cy="252" r="6" fill="var(--accent)"/>
<circle cx="777" cy="252" r="6" fill="var(--accent)"/>
<text class="s" x="372" y="290">Every other layer・already being worked on</text>

<rect x="60" y="330" width="500" height="112" rx="10" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="sw" x="88" y="368">5 plants worldwide</text>
<text class="sw" x="248" y="368">Only 1 in the US・old</text>
<text class="sw" x="88" y="410">Most capacity in Russia</text>
<text class="sw" x="248" y="410">2028 executive order to exit</text>

<text class="c" x="60" y="500">The other holes are being filled; this one is still open</text>
</svg>
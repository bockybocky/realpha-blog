<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="同樣兩顆球落向兩道不同的篩子，左邊那道兩顆都被攔住，右邊那道攔住一顆、另一顆從缺口落下">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="62">兩個解釋，拿現在這一局去分辨</text>
<rect x="48" y="96" width="408" height="382" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="76" y="136">篩子一：公司大就攔</text>
<circle cx="160" cy="196" r="20" fill="var(--warn)"/>
<text class="b" x="134" y="252">Libra</text>
<circle cx="344" cy="196" r="20" fill="var(--accent)"/>
<text class="b" x="300" y="252">OpenUSD</text>
<line x1="78" y1="284" x2="426" y2="284" stroke="var(--dim)" stroke-width="7"/>
<text class="b" x="78" y="330">兩顆都該被攔住</text>
<text class="g" x="78" y="430" fill="var(--warn)">✗　現實不是這樣</text>
<rect x="504" y="96" width="408" height="382" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="532" y="136">篩子二：擔保品對得出來</text>
<circle cx="616" cy="196" r="20" fill="var(--warn)"/>
<text class="b" x="590" y="252">Libra</text>
<circle cx="800" cy="196" r="20" fill="var(--accent)"/>
<text class="b" x="756" y="252">OpenUSD</text>
<line x1="534" y1="284" x2="752" y2="284" stroke="var(--dim)" stroke-width="7"/>
<line x1="848" y1="284" x2="882" y2="284" stroke="var(--dim)" stroke-width="7"/>
<line x1="800" y1="226" x2="800" y2="352" stroke="var(--accent)" stroke-width="3"/>
<polygon points="792,352 800,376 808,352" fill="var(--accent)"/>
<circle cx="800" cy="398" r="20" fill="var(--accent)"/>
<text class="g" x="532" y="430" fill="var(--accent)">✓　和現在這一局吻合</text>
<text class="c" x="60" y="534">差別落在擔保品與法規位置，不落在它姓什麼</text>
</svg>
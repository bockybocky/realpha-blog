<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bars of equal height, the left mostly given to what matters most and the right entirely to what is urgent, with the most-important cell left blank.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">One resource, two ways to split it</text>

<rect x="50" y="100" width="860" height="340" rx="14" fill="var(--card)"/>
<text x="480" y="140" font-size="16" fill="var(--dim)" text-anchor="middle">Those two spare hours</text>

<text x="260" y="186" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">Stated order</text>
<rect x="180" y="200" width="160" height="150" rx="4" fill="var(--grey)"/>
<text x="260" y="282" font-size="16" fill="var(--page)" text-anchor="middle">Most important</text>
<rect x="180" y="350" width="160" height="50" rx="4" fill="var(--line)"/>
<text x="260" y="382" font-size="16" fill="var(--dim)" text-anchor="middle">Most urgent</text>

<text x="700" y="186" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">Actual flow</text>
<rect x="620" y="200" width="160" height="150" rx="4" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="700" y="282" font-size="16" fill="var(--dim)" text-anchor="middle">Most important  zero</text>
<rect x="620" y="350" width="160" height="50" rx="4" fill="var(--accent)"/>
<text x="700" y="382" font-size="16" fill="var(--page)" text-anchor="middle">Most urgent  all of it</text>

<text x="60" y="506" font-size="22" font-weight="700" fill="var(--ink)">Write what already happened, not the plan</text>
</svg>
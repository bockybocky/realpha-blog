<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The line on top runs off the edge of the figure, while the blocks below are solid only through 2029 and become empty dashed outlines after that.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">Half is written into law; half is re-argued every four years</text>
<text class="g" x="60" y="150">Automatic accounts</text>
<line x1="230" y1="180" x2="960" y2="180" stroke="var(--accent)" stroke-width="18"/>
<text class="s" x="230" y="222">Permanent</text>
<text class="g" x="60" y="320">That $1,000</text>
<rect x="230" y="300" width="320" height="40" fill="var(--accent)"/>
<rect x="570" y="300" width="150" height="40" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<rect x="740" y="300" width="150" height="40" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="s" x="230" y="382">2025</text>
<text class="s" x="536" y="382">2029</text>
<text class="s" x="570" y="272" style="fill:var(--warn)">Needs a new Congress to renew it</text>
<line x1="230" y1="400" x2="550" y2="400" stroke="var(--line)" stroke-width="3"/>
<text class="s" x="230" y="428">Funding only runs this far</text>
<text class="c" x="60" y="490">One bill, two lifespans</text>
</svg>
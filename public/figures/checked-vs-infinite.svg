<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="左邊一小段實線被填滿，右邊虛線箭頭沒有盡頭地往右延伸，上方標一個問號">
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">查了很多個，為什麼還不算證明</text>
<rect x="100" y="250" width="300" height="34" rx="6" fill="var(--accent)"/>
<line x1="140" y1="250" x2="140" y2="284" stroke="var(--page)" stroke-width="2"/>
<line x1="180" y1="250" x2="180" y2="284" stroke="var(--page)" stroke-width="2"/>
<line x1="220" y1="250" x2="220" y2="284" stroke="var(--page)" stroke-width="2"/>
<line x1="260" y1="250" x2="260" y2="284" stroke="var(--page)" stroke-width="2"/>
<line x1="300" y1="250" x2="300" y2="284" stroke="var(--page)" stroke-width="2"/>
<line x1="340" y1="250" x2="340" y2="284" stroke="var(--page)" stroke-width="2"/>
<line x1="380" y1="250" x2="380" y2="284" stroke="var(--page)" stroke-width="2"/>
<line x1="400" y1="267" x2="860" y2="267" stroke="var(--grey)" stroke-width="3" stroke-dasharray="12 10"/>
<polygon points="880,267 856,255 856,279" fill="var(--grey)"/>
<text x="250" y="330" font-size="20" fill="var(--ink)" text-anchor="middle">已檢查</text>
<text x="250" y="356" font-size="16" fill="var(--dim)" text-anchor="middle">全部符合</text>
<text x="640" y="330" font-size="20" fill="var(--dim)" text-anchor="middle">沒有盡頭</text>
<text x="640" y="214" font-size="40" font-weight="700" fill="var(--warn)" text-anchor="middle">?</text>
<text x="480" y="440" font-size="22" fill="var(--ink)" text-anchor="middle">驗證只能走完左邊，證明要蓋住整條線</text>
</g>
</svg>
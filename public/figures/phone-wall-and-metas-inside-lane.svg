<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="中央一道厚牆是手機，左邊三個小方塊撞牆失敗，右邊Meta已在牆內側起跑">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:19px; fill:var(--ink); font-weight:600; }
    .body { font-size:16px; fill:var(--dim); }
    .wall { font-size:20px; fill:var(--ink); font-weight:700; }
    .concl { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t title" x="60" y="56">要繞過去，還是本來就在裡面</text>

  <rect x="430" y="96" width="76" height="344" fill="var(--grey)" opacity="0.45" stroke="var(--line)"/>
  <text class="t wall" x="468" y="272" text-anchor="middle" transform="rotate(-90 468 272)">手機</text>

  <g>
    <rect x="70" y="120" width="240" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
    <text class="t grp" x="90" y="160">胸針　$699</text>
    <rect x="70" y="220" width="240" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
    <text class="t grp" x="90" y="260">隨身機　$199</text>
    <rect x="70" y="320" width="240" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
    <text class="t grp" x="90" y="360">吊墜　$99</text>
  </g>
  <g stroke="var(--warn)" stroke-width="3">
    <path d="M 320 152 L 410 152"/><path d="M 320 252 L 410 252"/><path d="M 320 352 L 410 352"/>
    <path d="M 396 138 L 424 166 M 424 138 L 396 166"/>
    <path d="M 396 238 L 424 266 M 424 238 L 396 266"/>
    <path d="M 396 338 L 424 366 M 424 338 L 396 366"/>
  </g>
  <text class="t body" x="70" y="420">想繞過手機</text>

  <rect x="540" y="220" width="200" height="64" rx="10" fill="var(--card)" stroke="var(--accent)"/>
  <text class="t grp" x="560" y="260">Meta</text>
  <path d="M 752 252 L 890 252" stroke="var(--accent)" stroke-width="4"/>
  <path d="M 872 238 L 892 252 L 872 266" fill="var(--accent)"/>
  <text class="t body" x="540" y="320">自家用戶挪過來</text>
  <text class="t body" x="540" y="348">起跑點在牆內</text>

  <text class="t concl" x="60" y="500">難打的對手不是別的裝置，是那塊平板</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三根容量柱：MMCD 3.7GB、SD 5GB、合併後 DVD 4.7GB；DVD 比 SD 矮一小截，缺口標示 0.3GB，柱下標出結構取自 SD、調變取自 MMCD">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">兩張規格單，併成一張碟</text>
<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>

<rect x="130" y="292" width="150" height="148" fill="var(--grey)" opacity="0.55"/>
<text x="205" y="272" font-size="20" fill="var(--ink)" text-anchor="middle">3.7GB</text>
<text x="205" y="470" font-size="19" fill="var(--dim)" text-anchor="middle">MMCD</text>
<text x="205" y="496" font-size="15" fill="var(--dim)" text-anchor="middle">飛利浦・Sony</text>

<rect x="405" y="240" width="150" height="200" fill="var(--grey)" opacity="0.55"/>
<text x="480" y="220" font-size="20" fill="var(--ink)" text-anchor="middle">5GB</text>
<text x="480" y="470" font-size="19" fill="var(--dim)" text-anchor="middle">SD</text>
<text x="480" y="496" font-size="15" fill="var(--dim)" text-anchor="middle">東芝・松下</text>

<rect x="680" y="252" width="150" height="188" fill="var(--accent)" opacity="0.85"/>
<rect x="680" y="240" width="150" height="12" fill="var(--warn)" opacity="0.5"/>
<text x="755" y="220" font-size="20" fill="var(--ink)" text-anchor="middle">4.7GB</text>
<text x="880" y="250" font-size="15" fill="var(--warn)">缺 0.3GB</text>
<text x="755" y="470" font-size="19" fill="var(--ink)" text-anchor="middle">DVD</text>
<text x="755" y="496" font-size="15" fill="var(--dim)" text-anchor="middle">1995 年 8 月</text>

<path d="M295 366 L 665 350" stroke="var(--dim)" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
<text x="430" y="352" font-size="15" fill="var(--dim)">調變方式</text>
<path d="M570 330 L 665 322" stroke="var(--dim)" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
<text x="572" y="312" font-size="15" fill="var(--dim)">基板・錯誤更正</text>

<text x="60" y="538" font-size="22" fill="var(--ink)">付錢的那一方說：那 0.3GB 我不在乎</text>
</svg>
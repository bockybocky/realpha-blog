<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Four upward bars on the left stand for sectors rising over the same stretch, while six dots on the right sit just below a line representing all-time highs.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Same span, some rose</text>
<line x1="540" y1="100" x2="540" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="124" font-size="19" font-weight="700" fill="var(--dim)">These rose</text>
<line x1="60" y1="430" x2="500" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="80" y="222" width="80" height="208" fill="var(--accent)"/>
<rect x="190" y="270" width="80" height="160" fill="var(--accent)"/>
<rect x="300" y="190" width="80" height="240" fill="var(--accent)"/>
<rect x="410" y="142" width="80" height="288" fill="var(--accent)"/>
<text x="120" y="208" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">13%</text>
<text x="230" y="256" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">10%</text>
<text x="340" y="176" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">15%</text>
<text x="450" y="128" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">18%</text>
<text x="120" y="458" font-size="17" fill="var(--ink)" text-anchor="middle">Ins</text>
<text x="230" y="458" font-size="17" fill="var(--ink)" text-anchor="middle">Rx</text>
<text x="340" y="458" font-size="17" fill="var(--ink)" text-anchor="middle">Cns</text>
<text x="340" y="480" font-size="17" fill="var(--ink)" text-anchor="middle">Stpl</text>
<text x="450" y="458" font-size="17" fill="var(--ink)" text-anchor="middle">Biz &amp;</text>
<text x="450" y="480" font-size="17" fill="var(--ink)" text-anchor="middle">Pro svcs</text>
<text x="580" y="124" font-size="19" font-weight="700" fill="var(--dim)">&lt;3% from high</text>
<line x1="580" y1="190" x2="900" y2="190" stroke="var(--accent)" stroke-width="3"/>
<text x="580" y="178" font-size="16" fill="var(--dim)">Record</text>
<circle cx="605" cy="216" r="13" fill="var(--accent)"/>
<circle cx="655" cy="216" r="13" fill="var(--accent)"/>
<circle cx="705" cy="216" r="13" fill="var(--accent)"/>
<circle cx="755" cy="216" r="13" fill="var(--accent)"/>
<circle cx="805" cy="216" r="13" fill="var(--accent)"/>
<circle cx="855" cy="216" r="13" fill="var(--accent)"/>
<text x="580" y="268" font-size="20" font-weight="700" fill="var(--ink)">6 sect</text>
<text x="580" y="300" font-size="16" fill="var(--dim)">Health, staples</text>
<text x="580" y="324" font-size="16" fill="var(--dim)">2y hides wk</text>
</svg>
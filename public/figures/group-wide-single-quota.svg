<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三地資料中心的線匯進同一個計量閘，閘後分叉給多個中國客戶共用一份額度">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="48">一個集團，全球只有一份額度</text>

<rect x="60" y="110" width="190" height="70" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="80" y="153">歐洲機房</text>
<rect x="60" y="230" width="190" height="70" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="80" y="273">美國機房</text>
<rect x="60" y="350" width="190" height="70" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="80" y="393">東南亞機房</text>

<path d="M250 145 C340 145 360 240 430 265" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M250 265 L430 265" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M250 385 C340 385 360 290 430 265" fill="none" stroke="var(--accent)" stroke-width="3"/>

<rect x="430" y="215" width="130" height="100" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="452" y="258">TPP</text>
<text class="g" x="452" y="286">1200 萬</text>
<text class="s" x="430" y="340">超過要申報</text>

<path d="M560 265 L700 150" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M560 265 L700 265" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M560 265 L700 380" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="700" y="120" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="720" y="157">中國客戶 A</text>
<rect x="700" y="235" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="720" y="272">中國客戶 B</text>
<rect x="700" y="350" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="720" y="387">中國客戶 C</text>

<text class="c" x="60" y="500">額度在集團頭上，不在客戶頭上</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="前兩根柱貼地幾乎看不見，第三根柱極高：少賺兩百美元，幾週後換來十萬美元">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .v { font-size:19px; font-weight:700; }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="60" y="56" class="t">一顆墊圈的帳</text>
<text x="60" y="96" class="c">少賺 200，換來 10 萬</text>
<line x1="100" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="447" width="100" height="3" fill="var(--grey)"/>
<text x="200" y="428" class="v" text-anchor="middle">200 美元</text>
<text x="200" y="480" class="g" text-anchor="middle">新水龍頭</text>
<text x="200" y="504" class="b" text-anchor="middle">原本要賣</text>
<rect x="430" y="448" width="100" height="2" fill="var(--accent)"/>
<text x="480" y="428" class="v" text-anchor="middle">0.25 美元</text>
<text x="480" y="480" class="g" text-anchor="middle">墊圈</text>
<text x="480" y="504" class="b" text-anchor="middle">實際賣出</text>
<rect x="710" y="150" width="100" height="300" fill="var(--accent)"/>
<text x="760" y="138" class="v" text-anchor="middle">100,000 美元</text>
<text x="760" y="480" class="g" text-anchor="middle">廚房</text>
<text x="760" y="504" class="b" text-anchor="middle">幾週後</text>
<line x1="150" y1="530" x2="530" y2="530" stroke="var(--grey)" stroke-width="2"/>
<text x="340" y="552" class="b" text-anchor="middle">當天</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三根柱子由低到高，代表報酬率假設愈高，營收與錨定客戶承諾上界同步抬高">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; font-weight:700; fill:var(--ink); }
  .g { font-size:20px; font-weight:700; fill:var(--ink); }
  .d { font-size:15px; fill:var(--dim); }
  .a { font-size:20px; font-weight:700; fill:var(--accent); }
  .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="68">整條鏈的起點是一個沒人公布的數字</text>
<text class="d" x="60" y="98">報酬率假設（橫軸）→ 使用年限營收（柱高）→ 錨定客戶承諾上界（柱頂）</text>

<line x1="140" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>

<rect x="200" y="300" width="130" height="120" rx="5" fill="var(--grey)"/>
<text class="g" x="200" y="286">約 3400 億</text>
<text class="a" x="200" y="252">承諾上界 約 1000 億</text>
<text class="g" x="232" y="452">三成</text>

<rect x="420" y="250" width="130" height="170" rx="5" fill="var(--accent)"/>
<text class="g" x="420" y="236">4000 億</text>
<text class="a" x="420" y="202">承諾上界 1200 億</text>
<text class="g" x="452" y="452">五成</text>
<text class="d" x="408" y="478">他的假設</text>

<rect x="640" y="214" width="130" height="206" rx="5" fill="var(--grey)"/>
<text class="g" x="640" y="200">約 4500 億</text>
<text class="a" x="640" y="166">承諾上界 約 1350 億</text>
<text class="g" x="672" y="452">七成</text>
<text class="d" x="628" y="478">海外成本更高</text>

<text class="c" x="60" y="516">假設動一格，誰負擔得起的答案就換人</text>
</svg>
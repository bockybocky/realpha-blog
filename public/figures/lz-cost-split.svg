<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="成本對照：上面一條長槓大部分是免費本地段、尾端一小截雲端段，一天 30 元人民幣；下面整條高階雲端一天 100 多元；兩個月差額約等於一張 4090">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #b9c2d0;
      --accent: #1f6feb;
      --warn:   #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #4a5464;
        --accent: #58a6ff;
        --warn:   #d29922;
      }
    }
    .t { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="360" fill="var(--page)"/>
  <text class="t" x="480" y="40" text-anchor="middle" font-size="24" fill="var(--ink)">同一天的活，兩種排法</text>

  <text class="t" x="80" y="106" font-size="17" fill="var(--ink)">便宜的先上，貴的收尾</text>
  <rect x="80"  y="120" width="520" height="46" rx="8" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
  <rect x="600" y="120" width="130" height="46" rx="8" fill="var(--warn)" fill-opacity="0.25" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="340" y="149" text-anchor="middle" font-size="15" fill="var(--ink)">本地 Qwen3.8 27B 吃粗活（讀代碼、長線開發）＝免電費以外的錢</text>
  <text class="t" x="665" y="149" text-anchor="middle" font-size="14" fill="var(--ink)">雲端 Flash 收尾</text>
  <text class="t" x="790" y="149" font-size="18" fill="var(--accent)">一天約 30 元</text>

  <text class="t" x="80" y="226" font-size="17" fill="var(--ink)">全部接高階雲端模型</text>
  <rect x="80" y="240" width="650" height="46" rx="8" fill="var(--warn)" fill-opacity="0.25" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="405" y="269" text-anchor="middle" font-size="15" fill="var(--ink)">DeepSeek V4 Pro 從頭做到尾</text>
  <text class="t" x="790" y="269" font-size="18" fill="var(--warn)">一天 100 多元</text>

  <text class="t" x="480" y="336" text-anchor="middle" font-size="17" fill="var(--dim)">差額每天約 70 元人民幣，省兩個月約等於一張 4090（講者自己的帳）</text>
</svg>

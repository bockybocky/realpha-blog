<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="France's arrow points into the EU budget as money paid in, while Italy's arrow points out of the EU budget as money received, the two running in opposite directions.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">Who pays in, who takes out</text>
<circle cx="480" cy="280" r="100" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text x="424" y="274" font-size="19" fill="var(--ink)">EU</text>
<text x="424" y="302" font-size="19" fill="var(--ink)">budget</text>
<rect x="60" y="240" width="170" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="106" y="288" font-size="19" fill="var(--ink)">France</text>
<path d="M240 280 L364 280" stroke="var(--accent)" stroke-width="8"/>
<path d="M364 262 L380 280 L364 298 Z" fill="var(--accent)"/>
<text x="248" y="248" font-size="16" fill="var(--accent)">Net payer</text>
<rect x="730" y="240" width="170" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="754" y="288" font-size="19" fill="var(--ink)">Italy</text>
<path d="M596 280 L714 280" stroke="var(--warn)" stroke-width="8"/>
<path d="M714 262 L730 280 L714 298 Z" fill="var(--warn)"/>
<text x="600" y="248" font-size="16" fill="var(--warn)">Net taker</text>
<text x="600" y="326" font-size="16" fill="var(--dim)">Recovery fund EUR 300bn</text>
<text x="60" y="440" font-size="22" fill="var(--ink)">Only payers get to argue</text>
</svg>
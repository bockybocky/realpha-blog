<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left the estimates bar stands more than three times taller than the price bar; on the right two arrows point in opposite directions, one up and one down.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Estimates ran 3x price</text>
<line x1="60" y1="440" x2="440" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="120" y="100" width="110" height="340" fill="var(--accent)"/>
<rect x="290" y="323" width="110" height="117" fill="var(--accent)" fill-opacity="0.4"/>
<text x="175" y="86" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">~30x</text>
<text x="345" y="309" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">~9x</text>
<text x="175" y="470" font-size="17" fill="var(--ink)" text-anchor="middle">Fwd EPS</text>
<text x="345" y="470" font-size="17" fill="var(--ink)" text-anchor="middle">Px</text>
<text x="60" y="506" font-size="16" fill="var(--dim)">Start: ChatGPT launch</text>
<line x1="490" y1="80" x2="490" y2="480" stroke="var(--line)" stroke-width="2"/>
<text x="540" y="120" font-size="19" font-weight="700" fill="var(--dim)">Last ~25 days</text>
<line x1="600" y1="340" x2="600" y2="200" stroke="var(--accent)" stroke-width="6"/>
<polygon points="600,172 582,208 618,208" fill="var(--accent)"/>
<line x1="800" y1="200" x2="800" y2="340" stroke="var(--warn)" stroke-width="6"/>
<polygon points="800,368 782,332 818,332" fill="var(--warn)"/>
<text x="600" y="400" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Fwd EPS</text>
<text x="600" y="426" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">At record</text>
<text x="800" y="400" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Px</text>
<text x="800" y="426" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">-30%</text>
</svg>
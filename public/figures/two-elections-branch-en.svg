<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One month after the presidential election the parliamentary election splits into two branches, and the thicker one is falling short of a majority, leading to even weaker decision-making.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">One vote, then another</text>
<rect x="60" y="150" width="170" height="70" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="84" y="193" font-size="19" fill="var(--ink)">Presidential vote</text>
<line x1="230" y1="185" x2="290" y2="185" stroke="var(--grey)" stroke-width="3"/>
<rect x="290" y="150" width="170" height="70" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="330" y="193" font-size="19" fill="var(--ink)">Parliament vote</text>
<text x="290" y="238" font-size="15" fill="var(--dim)">One month later</text>
<path d="M460 170 L560 110" fill="none" stroke="var(--grey)" stroke-width="2"/>
<path d="M460 205 L560 290" fill="none" stroke="var(--warn)" stroke-width="7"/>
<rect x="560" y="80" width="200" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="584" y="120" font-size="19" fill="var(--dim)">Majority won</text>
<rect x="560" y="258" width="200" height="64" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="584" y="298" font-size="19" fill="var(--ink)">No majority</text>
<line x1="660" y1="322" x2="660" y2="400" stroke="var(--warn)" stroke-width="7"/>
<rect x="470" y="400" width="390" height="76" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="496" y="448" font-size="22" fill="var(--ink)">Even weaker than now</text>
<rect x="60" y="400" width="330" height="76" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="84" y="434" font-size="16" fill="var(--dim)">Since 2024</text>
<text x="84" y="460" font-size="16" fill="var(--dim)">No majority</text>
</svg>
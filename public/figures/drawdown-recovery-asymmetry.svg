<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三組左右對照橫條，右側回本需要的漲幅明顯比左側跌幅長，且越往下差距越大" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">回吐與回本，不是同一個數字</text>

<text x="416" y="118" font-size="19" fill="var(--dim)" text-anchor="end">回吐</text>
<text x="444" y="118" font-size="19" fill="var(--dim)">回本需要</text>
<line x1="430" y1="132" x2="430" y2="422" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 6"/>

<rect x="378" y="150" width="52" height="46" fill="var(--warn)" fill-opacity="0.15" stroke="var(--warn)"/>
<text x="366" y="180" font-size="16" fill="var(--ink)" text-anchor="end">跌 20%</text>
<rect x="430" y="150" width="65" height="46" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)"/>
<text x="507" y="180" font-size="16" fill="var(--ink)">漲 25%</text>

<rect x="352" y="248" width="78" height="46" fill="var(--warn)" fill-opacity="0.15" stroke="var(--warn)"/>
<text x="340" y="278" font-size="16" fill="var(--ink)" text-anchor="end">跌 30%</text>
<rect x="430" y="248" width="112" height="46" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)"/>
<text x="554" y="278" font-size="16" font-weight="700" fill="var(--ink)">漲 43%</text>

<rect x="300" y="346" width="130" height="46" fill="var(--warn)" fill-opacity="0.15" stroke="var(--warn)"/>
<text x="288" y="376" font-size="16" fill="var(--ink)" text-anchor="end">跌 50%</text>
<rect x="430" y="346" width="260" height="46" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)"/>
<text x="702" y="376" font-size="16" fill="var(--ink)">漲 100%</text>

<text x="480" y="470" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">跌得越深，回本要漲的越不成比例</text>
</svg>
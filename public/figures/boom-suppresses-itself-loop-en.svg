<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A clockwise loop of five nodes from buildout boom to commodity and wage costs, sticky inflation, the long end and discount rates, and pressure on distant profits, with a note that the same variable appears twice">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<defs>
<marker id="a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="56">Go around this loop and it presses down on itself</text>

<path d="M516,149 A175,175 0 0 1 632,232" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#a7a)"/>
<path d="M654,302 A175,175 0 0 1 610,437" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#a7a)"/>
<path d="M551,480 A175,175 0 0 1 409,480" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#a7a)"/>
<path d="M350,437 A175,175 0 0 1 306,302" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#a7a)"/>
<path d="M328,232 A175,175 0 0 1 444,149" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#a7a)"/>

<circle cx="480" cy="145" r="9" fill="var(--accent)"/>
<circle cx="646" cy="266" r="9" fill="var(--accent)"/>
<circle cx="583" cy="462" r="9" fill="var(--accent)"/>
<circle cx="377" cy="462" r="9" fill="var(--accent)"/>
<circle cx="314" cy="266" r="9" fill="var(--accent)"/>

<text class="g" x="480" y="120" text-anchor="middle">Buildout boom</text>
<text class="g" x="670" y="262">Commodities · wages</text>
<text class="g" x="610" y="500">Sticky inflation</text>
<text class="g" x="350" y="500" text-anchor="end">Long end · discount rate</text>
<text class="g" x="290" y="262" text-anchor="end">Distant profits</text>
<text class="b" x="290" y="288" text-anchor="end">Valuation pressed</text>

<text class="g" x="480" y="312" text-anchor="middle">The same variable</text>
<text class="b" x="480" y="342" text-anchor="middle">Appears twice in the model</text>
<text class="b" x="480" y="370" text-anchor="middle" fill="var(--warn)">In opposite directions</text>

<text class="c" x="60" y="562">What lifts it also presses down its valuation</text>
</svg>
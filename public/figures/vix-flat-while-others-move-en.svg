<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three moving volatility lines contrasted with one flat equity volatility line.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Only the equity line is flat</text>
<text class="t" x="60" y="100" font-size="16" fill="var(--dim)">Four markets' volatility since March</text>

<rect x="60" y="130" width="840" height="86" rx="6" fill="var(--card)"/>
<text class="t" x="80" y="180" font-size="19" fill="var(--ink)">Bond volatility</text>
<path d="M300 200 L380 160 L450 195 L530 150 L620 185 L720 145 L860 165" stroke="var(--grey)" stroke-width="3" fill="none"/>

<rect x="60" y="226" width="840" height="86" rx="6" fill="var(--card)"/>
<text class="t" x="80" y="276" font-size="19" fill="var(--ink)">FX volatility</text>
<path d="M300 290 L380 250 L450 285 L530 245 L620 282 L720 248 L860 258" stroke="var(--grey)" stroke-width="3" fill="none"/>

<rect x="60" y="322" width="840" height="86" rx="6" fill="var(--card)"/>
<text class="t" x="80" y="372" font-size="19" fill="var(--ink)">10-year rate</text>
<path d="M300 395 L400 380 L500 362 L600 350 L720 338 L860 330" stroke="var(--grey)" stroke-width="3" fill="none"/>

<rect x="60" y="418" width="840" height="86" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="80" y="468" font-size="19" font-weight="700" fill="var(--warn)">Equity volatility</text>
<path d="M300 462 L860 462" stroke="var(--warn)" stroke-width="4" fill="none"/>
<text class="t" x="300" y="494" font-size="16" fill="var(--dim)">March</text>
<text class="t" x="836" y="494" font-size="16" fill="var(--dim)">Now</text>

<text class="t" x="60" y="538" font-size="22" font-weight="700" fill="var(--ink)">The two biggest weights are holding it down</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="外部三個煞車被劃掉，腦袋裡出現一個手工的驗證迴圈">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="58" font-size="27" fill="var(--ink)">煞車搬進腦袋裡</text>

  <text x="186" y="126" font-size="20" fill="var(--dim)" text-anchor="middle">外面的</text>
  <rect x="70" y="154" width="232" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="186" y="192" font-size="19" fill="var(--grey)" text-anchor="middle">股東會</text>
  <line x1="82" y1="212" x2="290" y2="158" stroke="var(--grey)" stroke-width="2"/>
  <rect x="70" y="244" width="232" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="186" y="282" font-size="19" fill="var(--grey)" text-anchor="middle">市場的評價</text>
  <line x1="82" y1="302" x2="290" y2="248" stroke="var(--grey)" stroke-width="2"/>
  <rect x="70" y="334" width="232" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="186" y="372" font-size="19" fill="var(--grey)" text-anchor="middle">責問的人</text>
  <line x1="82" y1="392" x2="290" y2="338" stroke="var(--grey)" stroke-width="2"/>

  <path d="M 322 274 L 400 274" stroke="var(--ink)" stroke-width="2"/>
  <path d="M 388 264 L 402 274 L 388 284 Z" fill="var(--ink)"/>

  <path d="M 440 220 C 440 130 700 118 782 180 C 866 244 826 420 700 424 C 560 428 440 366 440 220 Z" fill="var(--card)" stroke="var(--line)"/>
  <text x="664" y="126" font-size="20" fill="var(--dim)" text-anchor="middle">自己的</text>
  <circle cx="660" cy="272" r="96" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="9 7"/>
  <circle cx="660" cy="176" r="8" fill="var(--accent)"/>
  <text x="660" y="162" font-size="16" fill="var(--accent)" text-anchor="middle">這只是假說</text>
  <circle cx="756" cy="272" r="8" fill="var(--accent)"/>
  <text x="800" y="278" font-size="16" fill="var(--accent)" text-anchor="middle">做下去</text>
  <circle cx="660" cy="368" r="8" fill="var(--accent)"/>
  <text x="660" y="394" font-size="16" fill="var(--accent)" text-anchor="middle">驗證</text>
  <circle cx="564" cy="272" r="8" fill="var(--accent)"/>
  <text x="520" y="278" font-size="16" fill="var(--accent)" text-anchor="middle">不是就改</text>

  <text x="480" y="508" font-size="22" fill="var(--ink)" text-anchor="middle">沒人罵了，就得自己長出一個會罵的人</text>
</svg>
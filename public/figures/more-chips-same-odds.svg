<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊本錢三座塔高度差一百倍，右邊三根勝率柱一樣矮、彼此等高">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">本錢差一百倍，勝率一樣</text>
  <text class="t" x="60" y="104" font-size="19" fill="var(--dim)">帶進場的本錢</text>
  <line x1="60" y1="430" x2="430" y2="430" stroke="var(--line)" stroke-width="2"/>
  <rect x="90" y="400" width="70" height="30" fill="var(--grey)"/>
  <text class="t" x="96" y="456" font-size="16" fill="var(--ink)">100</text>
  <rect x="190" y="340" width="70" height="90" fill="var(--grey)"/>
  <text class="t" x="190" y="456" font-size="16" fill="var(--ink)">1,000</text>
  <rect x="290" y="160" width="70" height="270" fill="var(--grey)"/>
  <text class="t" x="285" y="456" font-size="16" fill="var(--ink)">10,000</text>
  <text class="t" x="540" y="104" font-size="19" fill="var(--dim)">先贏到 100 塊的機率</text>
  <line x1="530" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
  <rect x="560" y="422" width="70" height="8" fill="var(--accent)"/>
  <text class="t" x="556" y="456" font-size="16" fill="var(--accent)">0.45%</text>
  <rect x="660" y="422" width="70" height="8" fill="var(--accent)"/>
  <text class="t" x="656" y="456" font-size="16" fill="var(--accent)">0.45%</text>
  <rect x="760" y="422" width="70" height="8" fill="var(--accent)"/>
  <text class="t" x="756" y="456" font-size="16" fill="var(--accent)">0.45%</text>
  <line x1="545" y1="412" x2="890" y2="412" stroke="var(--accent)" stroke-width="1" stroke-dasharray="5 5"/>
  <text class="t" x="60" y="524" font-size="22" font-weight="700" fill="var(--ink)">左邊一直長高，右邊一動也不動</text>
</svg>
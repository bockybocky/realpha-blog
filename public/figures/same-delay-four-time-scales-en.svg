<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four rows of blocks, where the shorter the scale the larger the share taken by the block that was moved away.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Shorter clock, worse hit</text>
<text x="60" y="92" font-size="16" fill="var(--dim)">Dashed = pushed-out part</text>

<text x="60" y="162" font-size="20" fill="var(--dim)">10 years</text>
<rect x="150" y="134" width="44" height="40" fill="var(--accent)"/>
<rect x="198" y="134" width="44" height="40" fill="var(--accent)"/>
<rect x="246" y="134" width="44" height="40" fill="var(--accent)"/>
<rect x="294" y="134" width="44" height="40" fill="var(--accent)"/>
<rect x="342" y="134" width="44" height="40" fill="var(--accent)"/>
<rect x="390" y="134" width="44" height="40" fill="var(--accent)"/>
<rect x="438" y="134" width="44" height="40" fill="var(--accent)"/>
<rect x="486" y="134" width="44" height="40" fill="var(--accent)"/>
<text x="560" y="162" font-size="19" fill="var(--dim)">Total unchanged</text>

<text x="60" y="262" font-size="20" fill="var(--dim)">5 years</text>
<rect x="150" y="234" width="44" height="40" fill="var(--accent)"/>
<rect x="198" y="234" width="44" height="40" fill="var(--accent)"/>
<rect x="246" y="234" width="44" height="40" fill="var(--accent)"/>
<rect x="294" y="234" width="44" height="40" fill="var(--accent)"/>
<rect x="342" y="234" width="44" height="40" fill="var(--accent)"/>
<rect x="414" y="234" width="44" height="40" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="6 5"/>
<text x="560" y="262" font-size="19" fill="var(--dim)">Nearly flat</text>

<text x="60" y="362" font-size="20" fill="var(--ink)">Next year</text>
<rect x="150" y="334" width="44" height="40" fill="var(--accent)"/>
<rect x="198" y="334" width="44" height="40" fill="var(--accent)"/>
<rect x="246" y="334" width="44" height="40" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="6 5"/>
<path d="M300 354 L376 354" stroke="var(--warn)" stroke-width="3"/>
<path d="M376 344 L396 354 L376 364 Z" fill="var(--warn)"/>
<text x="420" y="362" font-size="19" fill="var(--warn)">Slips a year</text>
<text x="620" y="362" font-size="19" fill="var(--ink)">Less</text>

<text x="60" y="462" font-size="20" fill="var(--ink)">6 months</text>
<rect x="150" y="434" width="44" height="40" fill="var(--accent)"/>
<rect x="198" y="434" width="44" height="40" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="6 5"/>
<path d="M252 454 L328 454" stroke="var(--warn)" stroke-width="3"/>
<path d="M328 444 L348 454 L328 464 Z" fill="var(--warn)"/>
<text x="372" y="462" font-size="19" fill="var(--warn)">One quarter less</text>
<text x="620" y="462" font-size="19" fill="var(--warn)">Half bitten off</text>

<text x="480" y="524" font-size="22" text-anchor="middle" fill="var(--ink)">Same news, different row</text>
</svg>
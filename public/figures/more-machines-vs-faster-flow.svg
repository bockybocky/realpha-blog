<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左格機台多但每台後面排著長隊，右格機台少但幾乎沒有排隊，對比兩種擴產的形狀">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl{font-size:27px;fill:var(--ink);font-weight:700}
    .grp{font-size:20px;fill:var(--ink);font-weight:600}
    .bd{font-size:16px;fill:var(--dim)}
    .cc{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="ttl" x="50" y="62">兩種擴產，形狀不一樣</text>

<rect x="50" y="120" width="410" height="300" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="grp" x="70" y="158">加機台</text>
<rect x="90" y="190" width="64" height="44" rx="6" fill="var(--page)" stroke="var(--line)"/>
<rect x="162" y="204" width="16" height="16" fill="var(--warn)"/>
<rect x="184" y="204" width="16" height="16" fill="var(--warn)"/>
<rect x="206" y="204" width="16" height="16" fill="var(--warn)"/>
<rect x="270" y="190" width="64" height="44" rx="6" fill="var(--page)" stroke="var(--line)"/>
<rect x="342" y="204" width="16" height="16" fill="var(--warn)"/>
<rect x="364" y="204" width="16" height="16" fill="var(--warn)"/>
<rect x="386" y="204" width="16" height="16" fill="var(--warn)"/>
<rect x="90" y="250" width="64" height="44" rx="6" fill="var(--page)" stroke="var(--line)"/>
<rect x="162" y="264" width="16" height="16" fill="var(--warn)"/>
<rect x="184" y="264" width="16" height="16" fill="var(--warn)"/>
<rect x="206" y="264" width="16" height="16" fill="var(--warn)"/>
<rect x="270" y="250" width="64" height="44" rx="6" fill="var(--page)" stroke="var(--line)"/>
<rect x="342" y="264" width="16" height="16" fill="var(--warn)"/>
<rect x="364" y="264" width="16" height="16" fill="var(--warn)"/>
<rect x="386" y="264" width="16" height="16" fill="var(--warn)"/>
<rect x="90" y="310" width="64" height="44" rx="6" fill="var(--page)" stroke="var(--line)"/>
<rect x="162" y="324" width="16" height="16" fill="var(--warn)"/>
<rect x="184" y="324" width="16" height="16" fill="var(--warn)"/>
<rect x="206" y="324" width="16" height="16" fill="var(--warn)"/>
<rect x="270" y="310" width="64" height="44" rx="6" fill="var(--page)" stroke="var(--line)"/>
<rect x="342" y="324" width="16" height="16" fill="var(--warn)"/>
<rect x="364" y="324" width="16" height="16" fill="var(--warn)"/>
<rect x="386" y="324" width="16" height="16" fill="var(--warn)"/>
<text class="bd" x="70" y="398">機台 6，每台等 3</text>

<rect x="500" y="120" width="410" height="300" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="grp" x="520" y="158">加流動速度</text>
<rect x="540" y="200" width="64" height="44" rx="6" fill="var(--page)" stroke="var(--line)"/>
<rect x="612" y="214" width="16" height="16" fill="var(--warn)"/>
<rect x="720" y="200" width="64" height="44" rx="6" fill="var(--page)" stroke="var(--line)"/>
<rect x="792" y="214" width="16" height="16" fill="var(--warn)"/>
<rect x="540" y="280" width="64" height="44" rx="6" fill="var(--page)" stroke="var(--line)"/>
<rect x="612" y="294" width="16" height="16" fill="var(--warn)"/>
<rect x="720" y="280" width="64" height="44" rx="6" fill="var(--page)" stroke="var(--line)"/>
<rect x="792" y="294" width="16" height="16" fill="var(--warn)"/>
<text class="bd" x="520" y="398">機台 4，每台等 1</text>

<rect x="50" y="446" width="16" height="16" fill="var(--warn)"/>
<text class="bd" x="76" y="460">等待中的晶圓盒</text>
<text class="cc" x="50" y="506">看到擴產，先問加的是機台，還是流動速度。</text>
</svg>
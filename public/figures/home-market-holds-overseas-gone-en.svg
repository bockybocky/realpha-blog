<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The flat domestic-market-share line diverges from the declining overseas-market line, which is marked with Volkswagen plant closures and Honda losses.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Home holds, overseas cleared</text>
  <text class="t" x="60" y="100" font-size="16" fill="var(--dim)">An old automaker's two ledgers</text>

  <line x1="140" y1="440" x2="860" y2="440" stroke="var(--line)" stroke-width="2"/>
  <circle cx="160" cy="210" r="7" fill="var(--grey)"/>

  <path d="M160 210 C 350 206 600 216 860 212" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <text class="t" x="860" y="190" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="end">Domestic share: no bad news in headlines</text>

  <path d="M160 210 C 360 250 560 340 860 408" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <circle cx="470" cy="300" r="7" fill="var(--warn)"/>
  <text class="t" x="470" y="282" font-size="19" fill="var(--warn)" text-anchor="middle">VW plant closures・50,000 layoffs</text>
  <circle cx="690" cy="368" r="7" fill="var(--warn)"/>
  <text class="t" x="690" y="350" font-size="19" fill="var(--warn)" text-anchor="middle">Honda losses・Thailand, India, UK, Australia</text>
  <text class="t" x="860" y="432" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="end">Overseas markets: one line item in the report</text>

  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">Customers on the lower line switched habits after switching cars once</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A long, gentle slope on the left contrasts with a vertical drop on the right, showing a vast difference in the time needed to exit.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">Scale forces him to move early</text>
<line x1="80" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<circle cx="130" cy="150" r="46" fill="var(--grey)"/>
<text class="t" x="130" y="88" font-size="19" fill="var(--dim)" text-anchor="middle">His position</text>
<polyline points="130,196 300,290 470,420" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="t" x="300" y="372" font-size="20" fill="var(--ink)">Exit slowly, up to a year</text>
<circle cx="700" cy="168" r="18" fill="var(--grey)"/>
<text class="t" x="700" y="128" font-size="19" fill="var(--dim)" text-anchor="middle">Retail position</text>
<line x1="700" y1="190" x2="700" y2="420" stroke="var(--warn)" stroke-width="4"/>
<polygon points="700,420 690,398 710,398" fill="var(--warn)"/>
<text class="t" x="728" y="310" font-size="20" fill="var(--ink)">One-click exit</text>
<text class="t" x="80" y="490" font-size="22" fill="var(--ink)">Copying his timing does not copy his constraints</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A three-layer filter funnel from wide to narrow: site flags, keywords, blocklist; two sources are missing the top layer">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Three layers, each waiting for someone to spell it out</text>

  <rect x="170" y="92" width="620" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="126" font-size="20" fill="var(--dim)" text-anchor="middle">Source site search results</text>

  <rect x="240" y="176" width="480" height="54" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="480" y="210" font-size="20" fill="var(--ink)" text-anchor="middle">① Site's adult flag</text>
  <text class="t" x="745" y="206" font-size="15" fill="var(--dim)">Flag/field/R18</text>

  <rect x="315" y="260" width="330" height="54" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="480" y="294" font-size="20" fill="var(--ink)" text-anchor="middle">② Title and blurb keywords</text>
  <text class="t" x="670" y="290" font-size="15" fill="var(--dim)">adult / R18 / 18+</text>

  <rect x="375" y="344" width="210" height="54" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="480" y="378" font-size="20" fill="var(--ink)" text-anchor="middle">③ Remote blocklist</text>
  <text class="t" x="610" y="374" font-size="15" fill="var(--dim)">One title at a time</text>

  <polygon points="480,406 492,424 468,424" fill="var(--grey)"/>
  <rect x="375" y="430" width="210" height="54" rx="8" fill="var(--accent)"/>
  <text class="t" x="480" y="464" font-size="20" fill="var(--page)" text-anchor="middle">What the child sees</text>

  <line x1="60" y1="203" x2="232" y2="203" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="t" x="60" y="190" font-size="16" fill="var(--warn)">Woai Manhua / GoDa</text>
  <text class="t" x="60" y="232" font-size="15" fill="var(--warn)">No ratings, clean titles</text>
  <text class="t" x="60" y="256" font-size="15" fill="var(--warn)">① and ② can't help</text>

  <text class="t" x="60" y="542" font-size="22" font-weight="700" fill="var(--ink)">Nothing spelled out, nothing caught</text>
</svg>
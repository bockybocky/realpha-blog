<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三層堆疊：CodexBar 讀數、監國協議當家、herdr 現場；翻牌鏈只穿過上面兩層，herdr 在鏈外">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">三個零件，各管一層</text>

  <rect x="60" y="108" width="620" height="100" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="88" y="148" font-size="20" fill="var(--ink)">CodexBar　讀數</text>
  <text x="88" y="180" font-size="16" fill="var(--dim)">還剩多少　·　幾小時後重置</text>

  <rect x="60" y="234" width="620" height="100" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="88" y="274" font-size="20" fill="var(--ink)">監國協議　當家</text>
  <text x="88" y="306" font-size="16" fill="var(--dim)">翻牌　·　隔離區　·　交還</text>

  <rect x="60" y="360" width="620" height="100" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="88" y="400" font-size="20" fill="var(--dim)">herdr　現場</text>
  <text x="88" y="432" font-size="16" fill="var(--dim)">做事　·　卡住　·　做完</text>

  <path d="M 720 128 L 720 316" stroke="var(--accent)" stroke-width="3" fill="none"/>
  <path d="M 720 316 l -7 -14 l 14 0 z" fill="var(--accent)"/>
  <circle cx="720" cy="158" r="6" fill="var(--accent)"/>
  <circle cx="720" cy="284" r="6" fill="var(--accent)"/>
  <text x="742" y="222" font-size="19" fill="var(--accent)">翻牌鏈</text>

  <path d="M 720 360 L 720 410" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
  <text x="742" y="416" font-size="16" fill="var(--grey)">鏈外</text>

  <text x="60" y="502" font-size="22" fill="var(--ink)">「卡住」與「額度用完」，畫面上長得一樣。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條股價線從高點一路下墜到四成的位置，才出現第一次向下修正的圓點，之後繼續走低，右側一支雙箭頭量出已經跌掉的那段">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .gd { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .w { font-size:19px; fill:var(--warn); }
    .a { font-size:19px; fill:var(--accent); }
  </style>
  <text class="t" x="60" y="66">訊號到的時候，已經跌掉四成</text>
  <line x1="70" y1="410" x2="900" y2="410" stroke="var(--line)" stroke-width="2"/>
  <line x1="70" y1="150" x2="900" y2="150" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="b" x="76" y="142">2000 年的高點</text>
  <line x1="70" y1="254" x2="900" y2="254" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M120 152 L230 180 L320 214 L420 254" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M420 254 L560 300 L700 326 L840 348" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="420" cy="254" r="7" fill="var(--warn)"/>
  <text class="g" x="440" y="206">第一次向下修正才出現</text>
  <text class="b" x="440" y="234">分析師掉進同一個陷阱</text>
  <line x1="866" y1="150" x2="866" y2="254" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="858 156 874 156 866 142" fill="var(--warn)"/>
  <polygon points="858 248 874 248 866 262" fill="var(--warn)"/>
  <text class="w" x="856" y="290" text-anchor="end">已經跌四成</text>
  <text class="c" x="60" y="478">聽起來合邏輯，資料裡沒用</text>
</svg>
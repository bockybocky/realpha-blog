<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一次崩盤在百年尺度上幾乎看不見，放大後是一道深落差">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px;font-weight:700}
    .b{font-size:16px;fill:var(--dim)}
    .k{font-size:22px;font-weight:700}
</style>
<text class="t" x="60" y="58">同一天，兩個尺度</text>
<rect x="60" y="96" width="400" height="340" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="80" y="130">百年尺度</text>
<path d="M92,404 C 200,394 296,336 448,166" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
<circle cx="300" cy="330" r="4.5" fill="var(--warn)"/>
<line x1="300" y1="336" x2="300" y2="412" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="b" x="300" y="432" text-anchor="middle">1987</text>
<line x1="304" y1="326" x2="520" y2="110" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="304" y1="336" x2="520" y2="430" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="520" y="96" width="380" height="340" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="540" y="130">放大那一天</text>
<path d="M548,178 L648,188 L700,192 L706,336 L800,318 L868,286" fill="none" stroke="var(--warn)" stroke-width="3.5"/>
<text class="b" x="724" y="272" fill="var(--warn)">單日 −20%</text>
<text class="b" x="868" y="266" text-anchor="end">同年收正</text>
<text class="k" x="60" y="500">崩盤與泡沫，本身不含下一步的資訊</text>
</svg>
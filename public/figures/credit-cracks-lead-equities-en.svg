<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Event markers on the upper credit track cluster to the left while those on the lower equity track sit farther right, leaving a horizontal gap between them.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sansse-rif; }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <defs>
    <marker id="f8a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--warn)"/>
    </marker>
  </defs>
  <text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Cracks show up in credit first</text>

  <text x="60" y="150" font-size="19" font-weight="700" fill="var(--accent)">Credit</text>
  <line x1="150" y1="200" x2="900" y2="200" stroke="var(--line)" stroke-width="3"/>
  <circle cx="210" cy="200" r="11" fill="var(--accent)"/>
  <circle cx="330" cy="200" r="11" fill="var(--accent)"/>
  <circle cx="450" cy="200" r="11" fill="var(--accent)"/>
  <text x="210" y="178" font-size="16" fill="var(--ink)" text-anchor="middle">Spreads gap</text>
  <text x="330" y="178" font-size="16" fill="var(--ink)" text-anchor="middle">HY deals pulled</text>
  <text x="470" y="178" font-size="16" fill="var(--ink)" text-anchor="middle">Debt costs more</text>

  <text x="60" y="350" font-size="19" font-weight="700" fill="var(--dim)">Equities</text>
  <line x1="150" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="3"/>
  <circle cx="740" cy="400" r="11" fill="var(--dim)"/>
  <text x="740" y="440" font-size="16" fill="var(--ink)" text-anchor="middle">De-rate</text>

  <line x1="450" y1="240" x2="450" y2="360" stroke="var(--grey)" stroke-dasharray="6 6"/>
  <line x1="740" y1="240" x2="740" y2="360" stroke="var(--grey)" stroke-dasharray="6 6"/>
  <line x1="462" y1="300" x2="726" y2="300" stroke="var(--warn)" stroke-width="4" marker-end="url(#f8a)"/>
  <text x="594" y="286" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="middle">Leads</text>

  <text x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">Watch funding, not just price</text>
</svg>
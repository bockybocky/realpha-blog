<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="六條灰線各在不同時間從低處垂直跳到高處，粗藍線是平均，呈平滑 S 形">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="60" y="62" class="h">一個個跳躍，平均成一條平滑曲線</text>
<line x1="560" y1="106" x2="600" y2="106" stroke="var(--grey)" stroke-width="3"/>
<text x="610" y="112" class="b">單一任務</text>
<line x1="720" y1="106" x2="760" y2="106" stroke="var(--accent)" stroke-width="5"/>
<text x="770" y="112" class="b">平均</text>
<line x1="120" y1="140" x2="120" y2="480" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="480" x2="850" y2="480" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="476" text-anchor="end" class="b">0.5%</text>
<text x="110" y="184" text-anchor="end" class="b">90%</text>
<text x="850" y="506" text-anchor="end" class="b">時間</text>
<g fill="none" stroke="var(--grey)" stroke-width="2.5" stroke-linejoin="round">
<path d="M120,470 H212 L228,176 H850"/>
<path d="M120,466 H312 L328,168 H850"/>
<path d="M120,472 H422 L438,182 H850"/>
<path d="M120,468 H512 L528,172 H850"/>
<path d="M120,474 H612 L628,186 H850"/>
<path d="M120,470 H732 L748,178 H850"/>
</g>
<text x="336" y="300" class="b" style="fill:var(--warn)">相變</text>
<path d="M120,470 C230,468 330,400 475,323 S700,190 850,178" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
</svg>
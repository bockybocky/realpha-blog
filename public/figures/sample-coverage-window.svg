<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊棋盤只有角落一格有色，右邊整片棋盤都有色，代表樣本覆蓋範圍的差距">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .cell { fill:var(--card); stroke:var(--line); stroke-width:2; }
    .on { fill:var(--accent); stroke:var(--line); stroke-width:2; }
</style>
<text class="t" x="60" y="62">這份研究的受試者，長得像你嗎</text>
<text class="g" x="90" y="118">五個健康的大學生</text>
<g>
<rect class="on" x="90" y="140" width="56" height="56"/>
<rect class="cell" x="146" y="140" width="56" height="56"/><rect class="cell" x="202" y="140" width="56" height="56"/><rect class="cell" x="258" y="140" width="56" height="56"/><rect class="cell" x="314" y="140" width="56" height="56"/>
<rect class="cell" x="90" y="196" width="56" height="56"/><rect class="cell" x="146" y="196" width="56" height="56"/><rect class="cell" x="202" y="196" width="56" height="56"/><rect class="cell" x="258" y="196" width="56" height="56"/><rect class="cell" x="314" y="196" width="56" height="56"/>
<rect class="cell" x="90" y="252" width="56" height="56"/><rect class="cell" x="146" y="252" width="56" height="56"/><rect class="cell" x="202" y="252" width="56" height="56"/><rect class="cell" x="258" y="252" width="56" height="56"/><rect class="cell" x="314" y="252" width="56" height="56"/>
<rect class="cell" x="90" y="308" width="56" height="56"/><rect class="cell" x="146" y="308" width="56" height="56"/><rect class="cell" x="202" y="308" width="56" height="56"/><rect class="cell" x="258" y="308" width="56" height="56"/><rect class="cell" x="314" y="308" width="56" height="56"/>
<rect class="cell" x="90" y="364" width="56" height="56"/><rect class="cell" x="146" y="364" width="56" height="56"/><rect class="cell" x="202" y="364" width="56" height="56"/><rect class="cell" x="258" y="364" width="56" height="56"/><rect class="cell" x="314" y="364" width="56" height="56"/>
</g>
<text class="b" x="90" y="448">膚色</text>
<text class="b" x="230" y="448">年齡、體位指數、用藥</text>
<text class="g" x="590" y="118">七百九十二人</text>
<g>
<rect class="on" x="590" y="140" width="56" height="56"/><rect class="on" x="646" y="140" width="56" height="56"/><rect class="on" x="702" y="140" width="56" height="56"/><rect class="on" x="758" y="140" width="56" height="56"/><rect class="on" x="814" y="140" width="56" height="56"/>
<rect class="on" x="590" y="196" width="56" height="56"/><rect class="on" x="646" y="196" width="56" height="56"/><rect class="on" x="702" y="196" width="56" height="56"/><rect class="on" x="758" y="196" width="56" height="56"/><rect class="on" x="814" y="196" width="56" height="56"/>
<rect class="on" x="590" y="252" width="56" height="56"/><rect class="on" x="646" y="252" width="56" height="56"/><rect class="on" x="702" y="252" width="56" height="56"/><rect class="on" x="758" y="252" width="56" height="56"/><rect class="on" x="814" y="252" width="56" height="56"/>
<rect class="on" x="590" y="308" width="56" height="56"/><rect class="on" x="646" y="308" width="56" height="56"/><rect class="on" x="702" y="308" width="56" height="56"/><rect class="on" x="758" y="308" width="56" height="56"/><rect class="on" x="814" y="308" width="56" height="56"/>
<rect class="on" x="590" y="364" width="56" height="56"/><rect class="on" x="646" y="364" width="56" height="56"/><rect class="on" x="702" y="364" width="56" height="56"/><rect class="on" x="758" y="364" width="56" height="56"/><rect class="on" x="814" y="364" width="56" height="56"/>
</g>
<text class="b" x="590" y="448">每個格子都要填滿</text>
<text class="c" x="60" y="528">格子外面的人，那個準確度對他沒有效力</text>
</svg>
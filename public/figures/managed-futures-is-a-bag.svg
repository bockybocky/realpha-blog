<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條長條圖比較 CTA 產業構成，上面整條是趨勢跟隨，下面趨勢跟隨只剩一半多，其餘被其他策略分掉">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.f1-b{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.f1-t{font-size:27px;font-weight:700}
.f1-g{font-size:19px;fill:var(--dim)}
.f1-i{font-size:19px;fill:var(--page)}
.f1-s{font-size:15px;fill:var(--dim)}
.f1-c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="f1-b f1-t" x="60" y="66">管理期貨是一個袋子，趨勢跟隨只是其中一格</text>
<text class="f1-b f1-g" x="60" y="150">1980 年代</text>
<rect x="60" y="168" width="840" height="62" fill="var(--accent)"/>
<text class="f1-b f1-i" x="480" y="207" text-anchor="middle">趨勢跟隨</text>
<text class="f1-b f1-g" x="60" y="300">現在</text>
<rect x="60" y="318" width="470" height="62" fill="var(--accent)"/>
<rect x="530" y="318" width="95" height="62" fill="var(--grey)"/>
<rect x="625" y="318" width="80" height="62" fill="var(--card)" stroke="var(--line)"/>
<rect x="705" y="318" width="95" height="62" fill="var(--grey)"/>
<rect x="800" y="318" width="55" height="62" fill="var(--card)" stroke="var(--line)"/>
<rect x="855" y="318" width="45" height="62" fill="var(--grey)"/>
<text class="f1-b f1-i" x="295" y="357" text-anchor="middle">趨勢跟隨</text>
<text class="f1-b f1-s" x="577" y="404" text-anchor="middle">均值回歸</text>
<text class="f1-b f1-s" x="665" y="404" text-anchor="middle">套利</text>
<text class="f1-b f1-s" x="752" y="404" text-anchor="middle">型態辨識</text>
<text class="f1-b f1-s" x="827" y="404" text-anchor="middle">短線</text>
<text class="f1-b f1-s" x="877" y="404" text-anchor="middle">AI</text>
<text class="f1-b f1-c" x="60" y="466">同一個詞，指的已經不是同一件事</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條價格區間長條並列比較，無塵室地板的區間與台北精華地段住宅的區間重疊，顯示兩者價位相當">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl{font-size:27px;fill:var(--ink);font-weight:700}
    .grp{font-size:20px;fill:var(--ink);font-weight:600}
    .bd{font-size:16px;fill:var(--dim)}
    .val{font-size:16px;fill:var(--ink)}
    .cc{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="ttl" x="60" y="62">無塵室的地板，比台北蛋黃區還貴</text>
<line x1="140" y1="150" x2="140" y2="400" stroke="var(--line)" stroke-dasharray="4 5"/>
<line x1="387" y1="150" x2="387" y2="400" stroke="var(--line)" stroke-dasharray="4 5"/>
<line x1="633" y1="150" x2="633" y2="400" stroke="var(--line)" stroke-dasharray="4 5"/>
<line x1="880" y1="150" x2="880" y2="400" stroke="var(--line)" stroke-dasharray="4 5"/>
<text class="grp" x="140" y="160">先進廠無塵室地板</text>
<rect x="359" y="170" width="435" height="54" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="val" x="373" y="203">8.9 萬 到 26.5 萬</text>
<text class="grp" x="140" y="260">台北精華地段住宅</text>
<rect x="510" y="270" width="370" height="54" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="val" x="524" y="303">15 萬 到 30 萬</text>
<line x1="140" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<text class="bd" x="140" y="428" text-anchor="middle">0</text>
<text class="bd" x="387" y="428" text-anchor="middle">10 萬</text>
<text class="bd" x="633" y="428" text-anchor="middle">20 萬</text>
<text class="bd" x="880" y="428" text-anchor="middle">30 萬</text>
<text class="bd" x="880" y="456" text-anchor="end">美元／坪</text>
<text class="cc" x="60" y="492">地板每一坪都在燒錢，搬運系統只能往天花板走。</text>
</svg>
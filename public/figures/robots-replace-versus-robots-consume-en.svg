<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The left panel pairs one-way replacement with a small circle, while the right panel pairs an output-and-consumption loop with a large one.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">Robots: a third output?</text>
<rect x="60" y="100" width="380" height="370" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="88" y="140" font-size="20" fill="var(--dim)">Replace only</text>
<text class="t" x="110" y="200" font-size="19" fill="var(--ink)">People</text>
<path d="M150 194 L250 194" fill="none" stroke="var(--dim)" stroke-width="3"/>
<path d="M240 186 L258 194 L240 202 Z" fill="var(--dim)"/>
<text class="t" x="272" y="200" font-size="19" fill="var(--ink)">Robots</text>
<circle cx="250" cy="340" r="44" fill="var(--grey)"/>
<text class="t" x="206" y="420" font-size="16" fill="var(--dim)">Economy shrinks</text>
<rect x="520" y="100" width="380" height="370" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="548" y="140" font-size="20" fill="var(--accent)">They consume</text>
<text class="t" x="560" y="200" font-size="19" fill="var(--ink)">Robots</text>
<path d="M640 194 L720 194" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M712 186 L730 194 L712 202 Z" fill="var(--accent)"/>
<text class="t" x="740" y="200" font-size="19" fill="var(--ink)">Output</text>
<path d="M770 212 L770 252" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M762 244 L770 262 L778 244 Z" fill="var(--accent)"/>
<text class="t" x="740" y="288" font-size="19" fill="var(--ink)">Spending</text>
<path d="M730 280 L600 280 L600 212" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M592 224 L600 206 L608 224 Z" fill="var(--accent)"/>
<circle cx="710" cy="386" r="72" fill="var(--accent)"/>
<text class="t" x="666" y="472" font-size="16" fill="var(--dim)">Economy grows</text>
<text class="t" x="60" y="524" font-size="22" fill="var(--ink)">Difference: does it buy?</text>
</svg>
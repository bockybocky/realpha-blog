<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩根柱子並排：左邊完整樣本的柱子上面三分之二標為已下市、下面三分之一是還活著；右邊只剩下面那一小塊，上面三分之二是空的虛線框">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">回測看得到的，只有三分之一</text>
  <rect x="150" y="120" width="200" height="232" fill="var(--grey)" opacity="0.45"/>
  <rect x="150" y="352" width="200" height="108" fill="var(--accent)"/>
  <text class="n" x="250" y="228" text-anchor="middle" fill="var(--ink)">已下市</text>
  <text class="n" x="250" y="254" text-anchor="middle" fill="var(--ink)">68.3%</text>
  <text class="g" x="250" y="414" text-anchor="middle" fill="var(--page)">還活著 31.7%</text>
  <text class="g" x="250" y="497" text-anchor="middle">含下市全樣本</text>
  <text class="n" x="250" y="522" text-anchor="middle">11,151 檔</text>
  <path d="M 400 290 L 550 290" stroke="var(--dim)" stroke-width="3" fill="none"/>
  <path d="M 556 290 l -16 -10 l 0 20 z" fill="var(--dim)"/>
  <rect x="610" y="120" width="200" height="232" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="610" y="352" width="200" height="108" fill="var(--accent)"/>
  <text class="n" x="710" y="228" text-anchor="middle">這一塊</text>
  <text class="n" x="710" y="254" text-anchor="middle">你看不到</text>
  <text class="g" x="710" y="414" text-anchor="middle" fill="var(--page)">3,540 檔</text>
  <text class="g" x="710" y="497" text-anchor="middle">一般回測的樣本</text>
  <text class="n" x="710" y="522" text-anchor="middle">今天還在市場上的</text>
</svg>
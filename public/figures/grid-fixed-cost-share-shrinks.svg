<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上下兩根等長的長條代表同一筆電網固定成本，下面那根多切出資料中心的一段，住戶那一段因此變短">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">分攤的人變多，住戶那一份變短</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">電網固定成本（示意）</text>
<rect x="130" y="170" width="700" height="90" fill="var(--accent)"/>
<text x="480.0" y="225" font-size="20" fill="var(--page)" text-anchor="middle" font-weight="700">住戶分攤</text>
<text x="130" y="155" font-size="19" fill="var(--dim)">資料中心進來前</text>
<line x1="480.0" y1="285" x2="480.0" y2="333" stroke="var(--dim)" stroke-width="2"/>
<polygon points="480.0,345 473.0,331 487.0,331" fill="var(--dim)"/>
<rect x="130" y="360" width="430" height="90" fill="var(--accent)"/>
<rect x="560" y="360" width="270" height="90" fill="var(--grey)"/>
<text x="345" y="415" font-size="20" fill="var(--page)" text-anchor="middle" font-weight="700">住戶分攤</text>
<text x="695.0" y="415" font-size="19" fill="var(--ink)" text-anchor="middle" font-weight="700">資料中心</text>
<text x="130" y="345" font-size="19" fill="var(--dim)">進來後</text>
<text x="60" y="505" font-size="22" fill="var(--ink)" font-weight="700">總成本沒變，住戶那一段被切短了</text>
</svg>
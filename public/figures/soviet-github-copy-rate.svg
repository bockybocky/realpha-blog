<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一支程式輻射出大量線條落在許多使用點上，右邊同一支程式只伸出一條短線與半截虛線">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="60" y="54" font-size="27" font-weight="700" fill="var(--ink)">一支程式平均被複製幾份</text>

  <text x="250" y="110" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">美國　100 份</text>
  <text x="710" y="110" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">蘇聯　1.7 份</text>

  <g stroke="var(--accent)" stroke-width="1.2" opacity="0.75">
    <line x1="250" y1="290" x2="100" y2="180"/>
    <line x1="250" y1="290" x2="130" y2="150"/>
    <line x1="250" y1="290" x2="185" y2="140"/>
    <line x1="250" y1="290" x2="250" y2="134"/>
    <line x1="250" y1="290" x2="315" y2="140"/>
    <line x1="250" y1="290" x2="370" y2="150"/>
    <line x1="250" y1="290" x2="400" y2="180"/>
    <line x1="250" y1="290" x2="420" y2="240"/>
    <line x1="250" y1="290" x2="424" y2="300"/>
    <line x1="250" y1="290" x2="408" y2="356"/>
    <line x1="250" y1="290" x2="368" y2="402"/>
    <line x1="250" y1="290" x2="306" y2="430"/>
    <line x1="250" y1="290" x2="250" y2="440"/>
    <line x1="250" y1="290" x2="194" y2="430"/>
    <line x1="250" y1="290" x2="132" y2="402"/>
    <line x1="250" y1="290" x2="92" y2="356"/>
    <line x1="250" y1="290" x2="76" y2="300"/>
    <line x1="250" y1="290" x2="80" y2="240"/>
  </g>
  <g fill="var(--accent)">
    <circle cx="100" cy="180" r="6"/><circle cx="130" cy="150" r="6"/><circle cx="185" cy="140" r="6"/>
    <circle cx="250" cy="134" r="6"/><circle cx="315" cy="140" r="6"/><circle cx="370" cy="150" r="6"/>
    <circle cx="400" cy="180" r="6"/><circle cx="420" cy="240" r="6"/><circle cx="424" cy="300" r="6"/>
    <circle cx="408" cy="356" r="6"/><circle cx="368" cy="402" r="6"/><circle cx="306" cy="430" r="6"/>
    <circle cx="250" cy="440" r="6"/><circle cx="194" cy="430" r="6"/><circle cx="132" cy="402" r="6"/>
    <circle cx="92" cy="356" r="6"/><circle cx="76" cy="300" r="6"/><circle cx="80" cy="240" r="6"/>
  </g>
  <circle cx="250" cy="290" r="34" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="250" y="296" font-size="15" fill="var(--accent)" text-anchor="middle">程式</text>

  <line x1="480" y1="120" x2="480" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>

  <line x1="710" y1="290" x2="800" y2="290" stroke="var(--warn)" stroke-width="2"/>
  <circle cx="806" cy="290" r="6" fill="var(--warn)"/>
  <line x1="710" y1="290" x2="760" y2="226" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 5"/>
  <circle cx="766" cy="220" r="6" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <circle cx="710" cy="290" r="34" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
  <text x="710" y="296" font-size="15" fill="var(--warn)" text-anchor="middle">程式</text>
  <text x="710" y="396" font-size="16" fill="var(--warn)" text-anchor="middle">沒離開過那台機器</text>

  <text x="60" y="508" font-size="22" font-weight="700" fill="var(--ink)">值錢的是第二個人在第二台機器上用起來的次數</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩根同高的一百元長條，底部算力那段從十五長到三十，上方毛利那段從八十五縮到七十">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">算力翻倍，毛利還在</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">每 100 元營收的切法</text>
<rect x="230" y="110" width="150" height="272.0" fill="var(--accent)"/>
<rect x="230" y="382.0" width="150" height="48.0" fill="var(--warn)"/>
<text x="305" y="154" font-size="20" fill="var(--page)" text-anchor="middle" font-weight="700">毛利 85%</text>
<text x="390" y="412.0" font-size="19" fill="var(--warn)">算力 15 元</text>
<text x="305" y="462" font-size="19" fill="var(--ink)" text-anchor="middle" font-weight="700">現在</text>
<rect x="590" y="110" width="150" height="224.0" fill="var(--accent)"/>
<rect x="590" y="334.0" width="150" height="96.0" fill="var(--warn)"/>
<text x="665" y="154" font-size="20" fill="var(--page)" text-anchor="middle" font-weight="700">毛利 70%</text>
<text x="750" y="388.0" font-size="19" fill="var(--warn)">算力 30 元</text>
<text x="665" y="462" font-size="19" fill="var(--ink)" text-anchor="middle" font-weight="700">算力價格翻一倍</text>
<line x1="430" y1="270.0" x2="568" y2="270.0" stroke="var(--dim)" stroke-width="2"/>
<polygon points="580,270.0 566,263.0 566,277.0" fill="var(--dim)"/>
<text x="60" y="505" font-size="22" fill="var(--ink)" font-weight="700">所以照買，虧的是整間公司</text>
</svg>
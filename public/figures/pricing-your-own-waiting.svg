<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條等待軸從今天到做完標示九十天，起點一根短柱標示願意付的金額，兩個數字並排就是你對等待的定價">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .n { font-size:34px; font-weight:700; fill:var(--ink); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62">你自己對時間的定價</text>
  <text class="b" x="60" y="94">拿一件拖了一陣子的事：換護照、看牙、修車</text>

  <path d="M200 300 L820 300" stroke="var(--grey)" stroke-width="4"/>
  <path d="M820 300 l-16 -9 l0 18 z" fill="var(--grey)"/>
  <circle cx="200" cy="300" r="10" fill="var(--grey)"/>
  <text class="b" x="176" y="340">今天</text>
  <text class="b" x="760" y="340">做完</text>
  <text class="n" x="450" y="268">90 天</text>
  <text class="b" x="450" y="340">第一個數字：還要等幾天</text>

  <rect x="200" y="150" width="72" height="110" rx="6" fill="var(--accent)"/>
  <text class="n" x="286" y="200" fill="var(--accent)">$2</text>
  <text class="b" x="286" y="230">第二個數字：明天就要用到它</text>
  <text class="b" x="286" y="254">你願意付多少把等待買掉</text>

  <path d="M200 400 L820 400" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="c" x="60" y="452">願意付的錢，通常比你以為的多</text>
  <text class="b" x="60" y="484">那些「現成的、馬上能用」的選項，以前只覺得貴</text>
</svg>
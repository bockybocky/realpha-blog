<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="估計值的橫條只有實際值的九分之一長，實際值由三段業務疊成，其中兩段在估計時還不存在">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">算得出來的，只有已經存在的那一段</text>
<text x="60" y="94" font-size="16" fill="var(--dim)">Uber 的 2024 年交易額：2014 年的估計 vs 實際</text>
<text x="60" y="166" font-size="20" fill="var(--dim)">2014 年估計</text>
<rect x="60" y="182" width="88" height="54" fill="var(--grey)"/>
<text x="164" y="218" font-size="19" fill="var(--ink)">180 億美元</text>
<text x="60" y="166" font-size="20" fill="var(--dim)">2014 年估計</text>
<text x="60" y="310" font-size="20" fill="var(--accent)">實際</text>
<rect x="60" y="326" width="406" height="54" fill="var(--accent)"/>
<rect x="466" y="326" width="367" height="54" fill="var(--accent)" opacity="0.55"/>
<rect x="833" y="326" width="25" height="54" fill="var(--accent)" opacity="0.3"/>
<text x="92" y="360" font-size="16" fill="var(--page)">叫車 830 億</text>
<text x="500" y="360" font-size="16" fill="var(--page)">外送 750 億</text>
<text x="700" y="410" font-size="16" fill="var(--dim)">貨運 50 億</text>
<text x="60" y="412" font-size="16" fill="var(--dim)">合計 1,630 億美元</text>
<text x="60" y="470" font-size="22" fill="var(--ink)">估的方法沒錯，缺的是「新東西會是什麼」這一格</text>
</svg>
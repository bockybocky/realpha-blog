<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left, many to one: several buildings share a single bin with trash scattered around it; on the right, one to one: each building has a container of its own at its door.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" fill="var(--ink)">It belongs to everyone, so it belongs to no one</text>

<text x="60" y="110" font-size="20" fill="var(--dim)">Shared</text>
<g fill="var(--card)" stroke="var(--line)" stroke-width="2">
<rect x="60" y="130" width="70" height="90"/>
<rect x="146" y="130" width="70" height="90"/>
<rect x="232" y="130" width="70" height="90"/>
<rect x="318" y="130" width="70" height="90"/>
</g>
<g stroke="var(--grey)" stroke-width="2" fill="none">
<path d="M95 220 L220 306"/>
<path d="M181 220 L220 306"/>
<path d="M267 220 L224 306"/>
<path d="M353 220 L228 306"/>
</g>
<rect x="172" y="306" width="104" height="80" rx="8" fill="var(--grey)" opacity="0.55"/>
<line x1="60" y1="400" x2="420" y2="400" stroke="var(--ink)" stroke-width="3"/>
<g fill="var(--warn)">
<rect x="120" y="374" width="24" height="20" rx="6"/>
<rect x="300" y="374" width="24" height="20" rx="6"/>
<rect x="348" y="378" width="24" height="18" rx="6"/>
<rect x="88" y="380" width="22" height="16" rx="6"/>
</g>
<text x="224" y="440" font-size="19" fill="var(--warn)" text-anchor="middle">No name on it</text>
<text x="224" y="466" font-size="15" fill="var(--dim)" text-anchor="middle">Piles up beside it</text>

<text x="540" y="110" font-size="20" fill="var(--dim)">Assigned</text>
<rect x="540" y="130" width="70" height="90" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="626" y="130" width="70" height="90" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="712" y="130" width="70" height="90" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="798" y="130" width="70" height="90" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<g stroke="var(--accent)" stroke-width="2">
<path d="M575 220 L575 320"/>
<path d="M661 220 L661 320"/>
<path d="M747 220 L747 320"/>
<path d="M833 220 L833 320"/>
</g>
<g fill="var(--accent)" opacity="0.75">
<rect x="548" y="320" width="54" height="80" rx="6"/>
<rect x="634" y="320" width="54" height="80" rx="6"/>
<rect x="720" y="320" width="54" height="80" rx="6"/>
<rect x="806" y="320" width="54" height="80" rx="6"/>
</g>
<line x1="540" y1="400" x2="900" y2="400" stroke="var(--ink)" stroke-width="3"/>
<text x="720" y="440" font-size="19" fill="var(--accent)" text-anchor="middle">One per building</text>
<text x="720" y="466" font-size="15" fill="var(--dim)" text-anchor="middle">At your own door</text>

<text x="60" y="528" font-size="22" fill="var(--ink)">The mess lands in the few metres nobody owns</text>
</g>
</svg>
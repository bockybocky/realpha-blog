<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="49.5 分鐘的橫條分成開機、下載模型、畫圖三段，等待段與畫圖段幾乎一樣長">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .w { font-size:20px; fill:var(--page); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70">49.5 分鐘裡，畫圖只佔一半</text>

<rect x="60" y="150" width="34" height="76" rx="4" fill="var(--grey)"/>
<rect x="94" y="150" width="356" height="76" fill="var(--warn)"/>
<rect x="450" y="150" width="450" height="76" rx="4" fill="var(--accent)"/>

<text class="w" x="120" y="196">下載模型 21 分</text>
<text class="w" x="480" y="196">畫 50 張圖 26.5 分</text>

<text class="n" x="60" y="262">開機與傳回</text>
<text class="n" x="60" y="286">約 2 分</text>

<line x1="60" y1="330" x2="450" y2="330" stroke="var(--warn)" stroke-width="3"/>
<line x1="450" y1="330" x2="900" y2="330" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="60" y="364" fill="var(--warn)">等待 23 分</text>
<text class="g" x="450" y="364" fill="var(--accent)">工作 26.5 分</text>

<text class="c" x="60" y="440">在雲端，等待跟工作一樣貴</text>
<text class="n" x="60" y="472">一張 RTX 3090，整趟帳單 0.18 美元</text>
</svg>
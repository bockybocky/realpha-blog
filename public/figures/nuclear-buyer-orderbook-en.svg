<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Six separate small boxes on the left with two or three cells each, and one large box on the right enclosing twelve cells">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="60">The buyer changed, then the market opened</text>

<text class="g" x="60" y="112">Before・local utilities</text>
<g fill="var(--card)" stroke="var(--line)" stroke-width="2">
<rect x="60" y="134" width="110" height="76" rx="8"/>
<rect x="186" y="134" width="110" height="76" rx="8"/>
<rect x="312" y="134" width="110" height="76" rx="8"/>
<rect x="60" y="228" width="110" height="76" rx="8"/>
<rect x="186" y="228" width="110" height="76" rx="8"/>
<rect x="312" y="228" width="110" height="76" rx="8"/>
</g>
<g fill="var(--grey)">
<rect x="80" y="162" width="18" height="18" rx="3"/><rect x="106" y="162" width="18" height="18" rx="3"/>
<rect x="206" y="162" width="18" height="18" rx="3"/><rect x="232" y="162" width="18" height="18" rx="3"/><rect x="258" y="162" width="18" height="18" rx="3"/>
<rect x="332" y="162" width="18" height="18" rx="3"/><rect x="358" y="162" width="18" height="18" rx="3"/>
<rect x="80" y="256" width="18" height="18" rx="3"/><rect x="106" y="256" width="18" height="18" rx="3"/><rect x="132" y="256" width="18" height="18" rx="3"/>
<rect x="206" y="256" width="18" height="18" rx="3"/><rect x="232" y="256" width="18" height="18" rx="3"/>
<rect x="332" y="256" width="18" height="18" rx="3"/><rect x="358" y="256" width="18" height="18" rx="3"/>
</g>
<text class="s" x="60" y="336">2–4 plants each</text>

<line x1="448" y1="219" x2="506" y2="219" stroke="var(--grey)" stroke-width="4"/>
<polygon points="506,207 532,219 506,231" fill="var(--grey)"/>

<text class="g" x="560" y="112">Now・cloud providers</text>
<rect x="560" y="134" width="340" height="170" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<g fill="var(--accent)">
<rect x="586" y="160" width="28" height="28" rx="4"/><rect x="632" y="160" width="28" height="28" rx="4"/><rect x="678" y="160" width="28" height="28" rx="4"/><rect x="724" y="160" width="28" height="28" rx="4"/><rect x="770" y="160" width="28" height="28" rx="4"/><rect x="816" y="160" width="28" height="28" rx="4"/>
<rect x="586" y="206" width="28" height="28" rx="4"/><rect x="632" y="206" width="28" height="28" rx="4"/><rect x="678" y="206" width="28" height="28" rx="4"/><rect x="724" y="206" width="28" height="28" rx="4"/><rect x="770" y="206" width="28" height="28" rx="4"/><rect x="816" y="206" width="28" height="28" rx="4"/>
</g>
<text class="s" x="586" y="266">20-year contract・all at once</text>
<text class="s" x="560" y="336">A dozen plants at once</text>

<line x1="60" y1="392" x2="900" y2="392" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="60" y="440">Banks lend only once an order book exists</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="第二節每磅代價條長是第一節的五倍，下方酬載條被三塊回收裝備切走">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">同樣一磅，放哪一節差五倍</text>
<text x="60" y="126" font-size="19" fill="var(--ink)">第一節 ＋1 磅</text>
<rect x="290" y="106" width="110" height="28" rx="4" fill="var(--grey)"/>
<text x="60" y="186" font-size="19" fill="var(--ink)">第二節 ＋1 磅</text>
<rect x="290" y="166" width="550" height="28" rx="4" fill="var(--accent)"/>
<text x="855" y="188" font-size="20" font-weight="700" fill="var(--accent)">×5</text>
<text x="60" y="270" font-size="19" fill="var(--dim)">酬載</text>
<rect x="60" y="290" width="780" height="70" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="470" y="290" width="120" height="70" fill="var(--warn)" opacity="0.75"/>
<rect x="590" y="290" width="130" height="70" fill="var(--warn)" opacity="0.55"/>
<rect x="720" y="290" width="120" height="70" fill="var(--warn)" opacity="0.35"/>
<text x="530" y="332" font-size="15" fill="var(--ink)" text-anchor="middle">著陸腿</text>
<text x="655" y="332" font-size="15" fill="var(--ink)" text-anchor="middle">返航燃料</text>
<text x="780" y="332" font-size="15" fill="var(--ink)" text-anchor="middle">隔熱罩</text>
<text x="230" y="332" font-size="16" fill="var(--dim)" text-anchor="middle">剩下的才是收入</text>
<line x1="470" y1="378" x2="840" y2="378" stroke="var(--warn)" stroke-width="2"/>
<text x="655" y="404" font-size="16" fill="var(--warn)" text-anchor="middle">回收裝備，從這一欄直接扣</text>
<text x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">可回收火箭上，油耗的份量被放大</text>
</svg>
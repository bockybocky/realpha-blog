<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Twelve bars of which most are tiny and one is enormous, showing returns concentrated in a few winners.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="64" font-size="27" fill="var(--ink)">A basket of bets, and the returns are not evenly split</text>
  <text class="t" x="60" y="96" font-size="16" fill="var(--dim)">One bar = one colonial bet</text>

  <rect x="90" y="456" width="46" height="14" fill="var(--grey)"/>
  <rect x="156" y="462" width="46" height="8" fill="var(--grey)"/>
  <rect x="222" y="448" width="46" height="22" fill="var(--grey)"/>
  <rect x="288" y="460" width="46" height="10" fill="var(--grey)"/>
  <rect x="354" y="430" width="46" height="40" fill="var(--grey)"/>
  <rect x="420" y="464" width="46" height="6" fill="var(--grey)"/>
  <rect x="486" y="140" width="46" height="330" fill="var(--accent)"/>
  <rect x="552" y="452" width="46" height="18" fill="var(--grey)"/>
  <rect x="618" y="458" width="46" height="12" fill="var(--grey)"/>
  <rect x="684" y="415" width="46" height="55" fill="var(--grey)"/>
  <rect x="750" y="461" width="46" height="9" fill="var(--grey)"/>
  <rect x="816" y="444" width="46" height="26" fill="var(--grey)"/>

  <text class="t" x="509" y="120" font-size="20" fill="var(--accent)" text-anchor="middle">Bigger than anyone imagined</text>
  <line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="90" y="500" font-size="16" fill="var(--dim)">Most struggled or collapsed</text>
  <text class="t" x="60" y="540" font-size="22" fill="var(--ink)">The shape of a power law</text>
</svg>
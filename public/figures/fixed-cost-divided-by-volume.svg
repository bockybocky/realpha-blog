<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同樣的固定成本攤在三片與三十片晶圓上，單位成本柱子高度差極大">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="52" font-size="27" fill="var(--ink)">同一塊成本，分母不同</text>
<rect x="150" y="92" width="200" height="62" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="250" y="130" font-size="19" fill="var(--ink)" text-anchor="middle">固定成本 $60</text>
<rect x="610" y="92" width="200" height="62" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="710" y="130" font-size="19" fill="var(--ink)" text-anchor="middle">固定成本 $60</text>
<circle cx="190" cy="212" r="18" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="250" cy="212" r="18" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="310" cy="212" r="18" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text x="380" y="218" font-size="19" fill="var(--dim)">3 片</text>
<g fill="none" stroke="var(--grey)" stroke-width="2">
<circle cx="572" cy="188" r="9"/><circle cx="596" cy="188" r="9"/><circle cx="620" cy="188" r="9"/><circle cx="644" cy="188" r="9"/><circle cx="668" cy="188" r="9"/><circle cx="692" cy="188" r="9"/><circle cx="716" cy="188" r="9"/><circle cx="740" cy="188" r="9"/><circle cx="764" cy="188" r="9"/><circle cx="788" cy="188" r="9"/>
<circle cx="572" cy="214" r="9"/><circle cx="596" cy="214" r="9"/><circle cx="620" cy="214" r="9"/><circle cx="644" cy="214" r="9"/><circle cx="668" cy="214" r="9"/><circle cx="692" cy="214" r="9"/><circle cx="716" cy="214" r="9"/><circle cx="740" cy="214" r="9"/><circle cx="764" cy="214" r="9"/><circle cx="788" cy="214" r="9"/>
<circle cx="572" cy="240" r="9"/><circle cx="596" cy="240" r="9"/><circle cx="620" cy="240" r="9"/><circle cx="644" cy="240" r="9"/><circle cx="668" cy="240" r="9"/><circle cx="692" cy="240" r="9"/><circle cx="716" cy="240" r="9"/><circle cx="740" cy="240" r="9"/><circle cx="764" cy="240" r="9"/><circle cx="788" cy="240" r="9"/>
</g>
<text x="830" y="222" font-size="19" fill="var(--dim)">30 片</text>
<path d="M120 460 L880 460" stroke="var(--line)" stroke-width="2"/>
<rect x="215" y="292" width="70" height="168" fill="var(--accent)"/>
<text x="250" y="282" font-size="19" fill="var(--accent)" text-anchor="middle">每片 $20</text>
<rect x="675" y="444" width="70" height="16" fill="var(--accent)"/>
<text x="710" y="432" font-size="19" fill="var(--accent)" text-anchor="middle">每片 $2</text>
<text x="60" y="524" font-size="22" fill="var(--ink)">量，就是成本的分母</text>
</svg>
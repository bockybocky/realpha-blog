<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四根長條的高度對比，左邊兩根是 Anthropic 每日合併次數從極矮變極高，右邊一般工程師的長條幾乎是一條線，Lauren Tan 的長條高出數百倍">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" fill="var(--ink)">同一段時間，產出差一個數量級</text>
<line x1="60" y1="470" x2="420" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="540" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="445" width="100" height="25" fill="var(--grey)"/>
<rect x="270" y="150" width="100" height="320" fill="var(--accent)"/>
<text x="110" y="432" font-size="16" fill="var(--dim)">2,500</text>
<text x="270" y="137" font-size="20" fill="var(--accent)">30,000</text>
<text x="110" y="496" font-size="16" fill="var(--dim)">2026 年 5 月</text>
<text x="270" y="496" font-size="16" fill="var(--dim)">2026 年 9 月</text>
<text x="60" y="532" font-size="19" fill="var(--ink)">Anthropic 每日合併的程式碼更動</text>
<rect x="590" y="464" width="100" height="6" fill="var(--grey)"/>
<rect x="750" y="150" width="100" height="320" fill="var(--accent)"/>
<text x="590" y="452" font-size="16" fill="var(--dim)">4 到 8</text>
<text x="750" y="137" font-size="20" fill="var(--accent)">2,500</text>
<text x="590" y="496" font-size="16" fill="var(--dim)">沒大量用代理人</text>
<text x="750" y="496" font-size="16" fill="var(--dim)">Lauren Tan</text>
<text x="540" y="532" font-size="19" fill="var(--ink)">一位工程師每月送出的程式碼更新</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="In the left panel a pothole in the road traps the wheel, while in the right panel the same pothole is filled beforehand and the wheel passes over it without trouble.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">TGA digs the pothole</text>

  <rect x="60" y="92" width="400" height="330" rx="10" fill="var(--card)"/>
  <rect x="500" y="92" width="400" height="330" rx="10" fill="var(--card)"/>
  <text class="t" x="84" y="128" font-size="20" font-weight="700" fill="var(--dim)">Unfilled</text>
  <text class="t" x="524" y="128" font-size="20" font-weight="700" fill="var(--dim)">Filled</text>

  <path d="M100 300 h100 l20 60 h60 l20 -60 h120" fill="none" stroke="var(--warn)" stroke-width="6"/>
  <circle cx="250" cy="330" r="26" fill="var(--warn)" opacity="0.5"/>
  <text class="t" x="206" y="398" font-size="16" fill="var(--warn)">Wheel dips</text>
  <text class="t" x="206" y="284" font-size="16" fill="var(--dim)">Taxes</text>

  <path d="M540 300 h320" fill="none" stroke="var(--accent)" stroke-width="6"/>
  <path d="M620 300 l20 60 h60 l20 -60" fill="var(--grey)" opacity="0.35"/>
  <circle cx="690" cy="274" r="26" fill="var(--accent)" opacity="0.55"/>
  <text class="t" x="646" y="398" font-size="16" fill="var(--dim)">Smooth</text>
  <text class="t" x="596" y="236" font-size="16" fill="var(--accent)">→ Rolls</text>

  <text class="t" x="60" y="486" font-size="22" font-weight="700" fill="var(--ink)">Smooth ops vs road</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One horizontal bar is very short, while the other is much longer and ends with a right-pointing arrow.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">Same relative decline, vastly different paths</text>
<rect x="80" y="100" width="800" height="280" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="110" y="160" fill="var(--warn)">Weil · Partners can take their share</text>
<rect x="110" y="176" width="200" height="36" rx="6" fill="var(--warn)"/>
<line x1="310" y1="176" x2="310" y2="212" stroke="var(--ink)" stroke-width="3"/>
<text class="b" x="326" y="200">Voted to dissolve within months</text>
<text class="g" x="110" y="276" fill="var(--accent)">Slater &amp;amp; Gordon · Money stays in firm</text>
<rect x="110" y="292" width="590" height="36" rx="6" fill="var(--accent)"/>
<line x1="700" y1="310" x2="820" y2="310" stroke="var(--accent)" stroke-width="4"/>
<polygon points="820,300 840,310 820,320" fill="var(--accent)"/>
<text class="b" x="110" y="362">Talks led to a debt-for-equity restructuring; both still operate today</text>
<text class="c" x="60" y="440">The difference: can leavers withdraw capital too?</text>
</svg>
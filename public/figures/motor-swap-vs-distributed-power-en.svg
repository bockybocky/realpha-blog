<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left, a single large power source with line shafts spanning the plant and a flat output line; on the right, many small distributed power sources and a rising output line.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">Swap the power source, keep the process</text>
<text class="b" x="60" y="94">Before / after</text>
<rect x="100" y="130" width="360" height="250" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="200" x2="440" y2="200" stroke="var(--grey)" stroke-width="6"/>
<line x1="120" y1="300" x2="440" y2="300" stroke="var(--grey)" stroke-width="6"/>
<rect x="250" y="226" width="60" height="48" rx="8" fill="var(--grey)"/>
<line x1="280" y1="200" x2="280" y2="226" stroke="var(--grey)" stroke-width="4"/>
<line x1="280" y1="274" x2="280" y2="300" stroke="var(--grey)" stroke-width="4"/>
<text class="g" x="120" y="164" fill="var(--dim)">Before: power source only</text>
<polyline points="130,352 220,350 310,348 430,346" fill="none" stroke="var(--dim)" stroke-width="4"/>
<text class="b" x="130" y="372">Output flat</text>
<rect x="500" y="130" width="360" height="250" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="196" width="44" height="36" rx="8" fill="var(--accent)"/>
<rect x="640" y="186" width="44" height="36" rx="8" fill="var(--accent)"/>
<rect x="744" y="200" width="44" height="36" rx="8" fill="var(--accent)"/>
<rect x="580" y="262" width="44" height="36" rx="8" fill="var(--accent)"/>
<rect x="700" y="268" width="44" height="36" rx="8" fill="var(--accent)"/>
<text class="g" x="520" y="164" fill="var(--accent)">After: power distributed</text>
<polyline points="530,352 620,344 710,322 830,282" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="b" x="530" y="372">Output jumps</text>
<text class="c" x="60" y="440">Swap a few small tasks in an old process for new tools,</text>
<text class="c" x="60" y="472">leave the rest, and output will not move</text>
<text class="b" x="60" y="510">Look one or two layers down: a right answer does not prove right reasoning</text>
</svg>
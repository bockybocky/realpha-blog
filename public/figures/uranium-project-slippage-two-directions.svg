<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊柱子變高、右邊柱子變矮，兩個方向同時對自己不利">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">開發案跳票的兩個方向</text>

<line x1="80" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="480" y1="110" x2="480" y2="440" stroke="var(--line)" stroke-width="1" stroke-dasharray="6 6"/>

<rect x="150" y="260" width="90" height="160" fill="var(--grey)"/>
<rect x="290" y="124" width="90" height="296" fill="var(--warn)"/>
<text x="195" y="248" font-size="16" fill="var(--dim)" text-anchor="middle">承諾</text>
<text x="335" y="112" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">高出 80 至 90%</text>
<text x="335" y="248" font-size="16" fill="var(--dim)" text-anchor="middle">實際</text>
<text x="265" y="452" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">成本</text>

<rect x="580" y="260" width="90" height="160" fill="var(--grey)"/>
<rect x="720" y="356" width="90" height="64" fill="var(--warn)"/>
<text x="625" y="248" font-size="16" fill="var(--dim)" text-anchor="middle">承諾</text>
<text x="765" y="344" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">砍掉 50 至 70%</text>
<text x="765" y="400" font-size="16" fill="var(--dim)" text-anchor="middle">實際</text>
<text x="695" y="452" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">產量</text>

<text x="60" y="496" font-size="22" font-weight="700" fill="var(--ink)">持股的人承受風險，市場的供應更緊</text>
</svg>
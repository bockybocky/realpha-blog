<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Solid bars inside three equal dashed boxes compare the share users pay, with the two AI subscription bars so low they nearly hug the baseline.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="58" font-size="27" fill="var(--ink)">The sliver users actually pay</text>
<line x1="100" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="160" width="130" height="260" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="180" y="313" width="130" height="107" fill="var(--accent)" opacity="0.85"/>
<text x="245" y="300" font-size="20" fill="var(--accent)" text-anchor="middle">41%</text>
<text x="245" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">Uber rider</text>
<text x="245" y="478" font-size="16" fill="var(--dim)" text-anchor="middle">2016</text>
<rect x="450" y="160" width="130" height="260" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="450" y="394" width="130" height="26" fill="var(--accent)" opacity="0.85"/>
<text x="515" y="381" font-size="20" fill="var(--accent)" text-anchor="middle">10%</text>
<text x="515" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">200 buys 2,000</text>
<rect x="700" y="160" width="130" height="260" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="700" y="416" width="130" height="4" fill="var(--warn)"/>
<text x="765" y="403" font-size="20" fill="var(--warn)" text-anchor="middle">1.4%</text>
<text x="765" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">200 buys 14,000</text>
<text x="150" y="148" font-size="16" fill="var(--dim)" text-anchor="end">Real value</text>
<line x1="155" y1="160" x2="175" y2="160" stroke="var(--grey)" stroke-width="2"/>
</g>
</svg>
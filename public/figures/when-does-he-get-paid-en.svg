<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two timelines, with the payment point at the start on one and far along on the other.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">The payday lands at different points</text>

  <text class="t" x="60" y="150" font-size="20" font-weight="700" fill="var(--ink)">The one collecting your fee</text>
  <line x1="200" y1="210" x2="880" y2="210" stroke="var(--line)" stroke-width="4"/>
  <circle cx="230" cy="210" r="16" fill="var(--accent)"/>
  <text class="t" x="230" y="186" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">Gets paid</text>
  <text class="t" x="230" y="248" font-size="16" fill="var(--dim)" text-anchor="middle">Sign-up day</text>

  <text class="t" x="60" y="330" font-size="20" font-weight="700" fill="var(--ink)">The one paid only if it works</text>
  <line x1="200" y1="390" x2="760" y2="390" stroke="var(--grey)" stroke-width="4" stroke-dasharray="10 10"/>
  <line x1="760" y1="390" x2="880" y2="390" stroke="var(--line)" stroke-width="4"/>
  <circle cx="790" cy="390" r="16" fill="var(--accent)"/>
  <text class="t" x="790" y="366" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">Gets paid</text>
  <text class="t" x="470" y="428" font-size="16" fill="var(--dim)" text-anchor="middle">You actually have to pull it off in between</text>

  <text class="t" x="480" y="486" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Two answers, two different things</text>
</svg>
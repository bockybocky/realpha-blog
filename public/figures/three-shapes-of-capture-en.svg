<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three funnels with different degrees of convergence: chips narrow to one company, cloud narrows to a few, and the model layer's outlet remains uncertain.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">The three shapes of value capture</text>
<text x="60" y="94" font-size="16" fill="var(--dim)">Top = money in, bottom = who keeps it</text>
<path d="M90 140 L 330 140 L 262 400 L 158 400 Z" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="150" y="120" font-size="20" fill="var(--accent)">Chips</text>
<text x="100" y="440" font-size="16" fill="var(--dim)">Dozens narrowed to one</text>
<text x="100" y="466" font-size="19" fill="var(--ink)">Can charge whatever it wants</text>
<path d="M360 140 L 600 140 L 560 400 L 400 400 Z" fill="var(--card)" stroke="var(--accent)" stroke-width="3" opacity="0.75"/>
<text x="430" y="120" font-size="20" fill="var(--accent)">Cloud</text>
<text x="370" y="440" font-size="16" fill="var(--dim)">Good money, not all of it</text>
<text x="370" y="466" font-size="19" fill="var(--ink)">Software keeps its own value</text>
<path d="M630 140 L 870 140 L 870 400 L 630 400 Z" fill="var(--card)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 7"/>
<text x="700" y="120" font-size="20" fill="var(--warn)">Models</text>
<text x="640" y="440" font-size="16" fill="var(--dim)">Converge or commoditize</text>
<text x="640" y="466" font-size="19" fill="var(--ink)">Outlet not formed yet</text>
<text x="60" y="528" font-size="22" fill="var(--ink)">Pick the shape you're betting on first</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The left pipe is locked into steady flow and the right pipe has a valve that can be shut anytime, yet the output looks the same.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" fill="var(--ink)">Two kinds of demand, identical on the statements</text>

<rect x="60" y="100" width="400" height="340" fill="var(--card)"/>
<text x="90" y="140" font-size="20" fill="var(--accent)">Locked by contract</text>
<rect x="150" y="170" width="44" height="190" fill="var(--grey)"/>
<rect x="134" y="215" width="76" height="50" rx="8" fill="var(--accent)"/>
<path d="M156 215 a16 16 0 0 1 32 0" stroke="var(--accent)" stroke-width="6" fill="none"/>
<text x="240" y="245" font-size="16" fill="var(--dim)">Regardless of actual usage</text>
<text x="240" y="268" font-size="16" fill="var(--dim)">you still pay</text>
<rect x="150" y="372" width="44" height="12" fill="var(--accent)"/>
<rect x="150" y="392" width="44" height="12" fill="var(--accent)"/>
<text x="90" y="424" font-size="16" fill="var(--dim)">Cash flow is certain to happen</text>

<rect x="500" y="100" width="400" height="340" fill="var(--card)"/>
<text x="530" y="140" font-size="20" fill="var(--warn)">Renews by choice</text>
<rect x="590" y="170" width="44" height="190" fill="var(--grey)"/>
<circle cx="612" cy="240" r="26" fill="none" stroke="var(--warn)" stroke-width="6"/>
<line x1="612" y1="240" x2="652" y2="212" stroke="var(--warn)" stroke-width="6"/>
<text x="680" y="245" font-size="16" fill="var(--dim)">Can stop anytime</text>
<text x="680" y="268" font-size="16" fill="var(--dim)">No contract</text>
<rect x="590" y="372" width="44" height="12" fill="var(--warn)"/>
<rect x="590" y="392" width="44" height="12" fill="var(--warn)"/>
<text x="530" y="424" font-size="16" fill="var(--dim)">Statements won't show them leaving</text>
<text x="60" y="500" font-size="22" fill="var(--ink)">A contract guarantees the money happens, not that it was worth it</text>
</svg>
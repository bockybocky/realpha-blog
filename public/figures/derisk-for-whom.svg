<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩組前後對照的風險條，公司那組明顯縮短，國家那組幾乎沒變，下方三個未打勾的方框是還沒動的制度工程">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="60">風險條變短的是誰</text>
<text class="d" x="60" y="90">條長＝投資人要承擔的風險</text>

<text class="d" x="300" y="128">交易前</text>
<text class="d" x="300" y="228">交易後</text>

<text class="g" x="60" y="152">NABEP</text>
<rect x="300" y="136" width="580" height="42" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2.5"/>
<rect x="300" y="236" width="170" height="42" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="d" x="490" y="264">美國政府 35% 股權背書</text>

<text class="g" x="60" y="336">委內瑞拉</text>
<rect x="300" y="320" width="580" height="42" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2.5"/>
<rect x="300" y="380" width="560" height="42" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
<text class="d" x="300" y="312">交易前</text>
<text class="d" x="300" y="412" opacity="0">.</text>

<rect x="300" y="446" width="186" height="52" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="b" x="393" y="478" text-anchor="middle">修碳氫化合物法</text>
<rect x="497" y="446" width="186" height="52" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="b" x="590" y="478" text-anchor="middle">訂實施細則</text>
<rect x="694" y="446" width="186" height="52" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="b" x="787" y="478" text-anchor="middle">設監理機關</text>
<text class="d" x="60" y="478">都還沒動</text>

<text class="c" x="60" y="536">短的那條是公司的，長的那條是國家的。</text>
</svg>
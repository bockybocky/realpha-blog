<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左側棋盤整齊格線，右側歪斜疊加的街區塊，對照沙盒與現實兩種建造形狀">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">兩種城市的形狀</text>

<rect x="60" y="92" width="400" height="300" fill="var(--card)" rx="10"/>
<g stroke="var(--grey)" stroke-width="2">
<line x1="100" y1="140" x2="420" y2="140"/><line x1="100" y1="200" x2="420" y2="200"/>
<line x1="100" y1="260" x2="420" y2="260"/><line x1="100" y1="320" x2="420" y2="320"/>
<line x1="100" y1="140" x2="100" y2="320"/><line x1="180" y1="140" x2="180" y2="320"/>
<line x1="260" y1="140" x2="260" y2="320"/><line x1="340" y1="140" x2="340" y2="320"/>
<line x1="420" y1="140" x2="420" y2="320"/>
</g>
<rect x="112" y="152" width="56" height="36" fill="var(--accent)" opacity="0.5"/>
<rect x="272" y="212" width="56" height="36" fill="var(--accent)" opacity="0.5"/>
<rect x="192" y="272" width="56" height="36" fill="var(--accent)" opacity="0.5"/>
<text class="g" x="100" y="362" fill="var(--accent)">沙盒</text>
<text class="b" x="160" y="362">預算無限</text>

<rect x="500" y="92" width="400" height="300" fill="var(--card)" rx="10"/>
<g stroke="var(--grey)" stroke-width="2" fill="none">
<path d="M530 326 L580 300 L640 312 L700 282 L760 300 L830 268"/>
<path d="M534 288 L592 268 L648 280 L716 246 L786 264 L862 238"/>
<path d="M548 248 L604 236 L676 212 L742 226 L820 196"/>
<path d="M566 206 L628 190 L706 170 L792 184"/>
</g>
<rect x="548" y="288" width="44" height="34" fill="var(--warn)" opacity="0.55"/>
<rect x="636" y="236" width="52" height="40" fill="var(--warn)" opacity="0.45"/>
<rect x="712" y="178" width="46" height="46" fill="var(--warn)" opacity="0.5"/>
<path d="M600 318 L620 150" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
<text class="g" x="540" y="362" fill="var(--warn)">現實</text>
<text class="b" x="600" y="362">經費卡住，一代疊一代</text>

<text class="c" x="60" y="448">整齊是預算的樣子；歪斜是活下來的樣子。</text>
</svg>
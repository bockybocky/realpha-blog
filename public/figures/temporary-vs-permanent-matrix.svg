<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="二乘二方格，左上與右下這條對角線的兩格是對的做法，另一條對角線的兩格是兩種痛">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.s { font-size:16px; fill:var(--dim); }
.g { font-size:19px; font-weight:600; }
.n { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="60">兩個問題，不是同一個問題</text>
<text class="s" x="60" y="92">跌了，跟本體被拆掉了，是兩回事</text>
<text class="g" x="410" y="162" text-anchor="middle" fill="var(--dim)">其實只是暫時</text>
<text class="g" x="730" y="162" text-anchor="middle" fill="var(--dim)">已經永久變了</text>
<text class="g" x="240" y="262" text-anchor="end" fill="var(--dim)">我等</text>
<text class="g" x="240" y="432" text-anchor="end" fill="var(--dim)">我停損</text>
<rect x="260" y="180" width="300" height="150" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="410" y="262" text-anchor="middle" fill="var(--accent)">拿住</text>
<rect x="580" y="180" width="300" height="150" rx="10" fill="var(--warn)" opacity="0.16"/>
<rect x="580" y="180" width="300" height="150" rx="10" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="g" x="730" y="262" text-anchor="middle" fill="var(--warn)">該走的抱著等</text>
<rect x="260" y="350" width="300" height="150" rx="10" fill="var(--warn)" opacity="0.16"/>
<rect x="260" y="350" width="300" height="150" rx="10" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="g" x="410" y="432" text-anchor="middle" fill="var(--warn)">該等的先跑了</text>
<rect x="580" y="350" width="300" height="150" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="730" y="432" text-anchor="middle" fill="var(--accent)">停損</text>
<text class="c" x="60" y="562">兩種痛，都來自用錯那一邊</text>
</svg>
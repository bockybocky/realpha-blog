<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three bars grow from barely visible to ceiling height, labelled with the years and budget one game now takes.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="60" font-size="27" fill="var(--ink)">How many people, how many years</text>
<rect x="48" y="90" width="864" height="382" rx="14" fill="var(--card)"/>
<line x1="88" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="394" width="130" height="6" rx="3" fill="var(--grey)"/>
<text x="215" y="378" font-size="16" fill="var(--dim)" text-anchor="middle">Under 100 people</text>
<text x="215" y="430" font-size="20" fill="var(--ink)" text-anchor="middle">2000s</text>
<text x="215" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">2–3 yrs · $20M</text>
<rect x="415" y="247" width="130" height="153" rx="4" fill="var(--grey)"/>
<text x="480" y="231" font-size="16" fill="var(--dim)" text-anchor="middle">2,400 people</text>
<text x="480" y="430" font-size="20" fill="var(--ink)" text-anchor="middle">2018</text>
<text x="480" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">Year it shipped</text>
<rect x="680" y="130" width="130" height="270" rx="4" fill="var(--accent)"/>
<text x="745" y="114" font-size="16" fill="var(--ink)" text-anchor="middle">4,700 people</text>
<text x="745" y="430" font-size="20" fill="var(--ink)" text-anchor="middle">Now</text>
<text x="745" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">8 yrs · rumored $1–1.5B</text>
<text x="48" y="520" font-size="22" fill="var(--ink)">Peers are moving the other way</text>
</svg>
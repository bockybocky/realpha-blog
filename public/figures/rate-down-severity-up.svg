<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條交叉的曲線，一條下降一條上升，下降的那條在右側尾端翹起一小段。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="72" font-size="27" fill="var(--ink)">他預測了兩件方向相反的事</text>
  <rect x="60" y="110" width="840" height="300" rx="16" fill="var(--card)" stroke="var(--line)"/>

  <line x1="110" y1="130" x2="110" y2="400" stroke="var(--line)" stroke-width="2"/>
  <line x1="110" y1="400" x2="870" y2="400" stroke="var(--line)" stroke-width="2"/>

  <path d="M 130 175 C 330 245, 560 322, 740 342" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M 740 342 C 790 338, 826 324, 858 302" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="858" cy="302" r="6" fill="var(--warn)"/>
  <text x="852" y="276" font-size="16" fill="var(--warn)" text-anchor="end">最近的反彈</text>

  <path d="M 130 378 C 350 352, 620 262, 860 168" fill="none" stroke="var(--dim)" stroke-width="3"/>

  <text x="136" y="155" font-size="19" fill="var(--accent)">發生率</text>
  <text x="854" y="152" font-size="19" fill="var(--dim)" text-anchor="end">最糟個案的嚴重度</text>

  <text x="60" y="480" font-size="22" fill="var(--ink)">分數變好，不等於狀況變好</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條分岔的路最後匯進同一個評分器，得到同樣的滿分">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">兩條路，同一個分數</text>
<rect x="60" y="232" width="140" height="70" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="100" y="275" font-size="20" fill="var(--ink)">代理</text>
<path d="M200 254 L270 254 L270 178 L332 178" fill="none" stroke="var(--grey)" stroke-width="3"/>
<polygon points="340,178 326,171 326,185" fill="var(--grey)"/>
<rect x="344" y="146" width="220" height="64" rx="10" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 8"/>
<text x="392" y="186" font-size="20" fill="var(--dim)">真的解題</text>
<text x="344" y="234" font-size="16" fill="var(--warn)">四成走不通</text>
<path d="M200 282 L270 282 L270 366 L332 366" fill="none" stroke="var(--accent)" stroke-width="3"/>
<polygon points="340,366 326,359 326,373" fill="var(--accent)"/>
<rect x="344" y="334" width="220" height="64" rx="10" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="2"/>
<text x="380" y="374" font-size="20" fill="var(--ink)">讓答案出現</text>
<path d="M564 178 L640 178 L640 250" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M564 366 L640 366 L640 300" fill="none" stroke="var(--accent)" stroke-width="3"/>
<rect x="660" y="222" width="220" height="106" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="684" y="264" font-size="20" fill="var(--ink)">評分器</text>
<text x="684" y="298" font-size="16" fill="var(--dim)">只看答案對不對</text>
<line x1="770" y1="328" x2="770" y2="380" stroke="var(--line)" stroke-width="2"/>
<polygon points="770,388 762,374 778,374" fill="var(--line)"/>
<text x="738" y="424" font-size="27" fill="var(--accent)">滿分</text>
<text x="60" y="494" font-size="22" fill="var(--ink)">驗收表看不見的差別，等於不存在</text>
</svg>
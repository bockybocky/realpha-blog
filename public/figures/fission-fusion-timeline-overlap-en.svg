<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three bars on one timeline start at different points but all end inside the same shaded interval">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">Two people arguing, answers landing in the same window</text>

<rect x="567" y="110" width="266" height="256" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="586" y="140">Both sides land here</text>

<rect x="233" y="168" width="67" height="26" rx="6" fill="var(--accent)"/>
<text class="g" x="312" y="188">First microreactor</text>

<rect x="567" y="228" width="200" height="26" rx="6" fill="var(--accent)"/>
<text class="g" x="779" y="248">Grid fission</text>

<rect x="633" y="298" width="200" height="26" rx="6" fill="var(--warn)"/>
<text class="g" x="586" y="292" fill="var(--warn)">Fusion plant</text>

<line x1="100" y1="400" x2="900" y2="400" stroke="var(--grey)" stroke-width="3"/>
<g stroke="var(--grey)" stroke-width="2">
<line x1="100" y1="400" x2="100" y2="412"/>
<line x1="233" y1="400" x2="233" y2="412"/>
<line x1="367" y1="400" x2="367" y2="412"/>
<line x1="500" y1="400" x2="500" y2="412"/>
<line x1="633" y1="400" x2="633" y2="412"/>
<line x1="767" y1="400" x2="767" y2="412"/>
<line x1="900" y1="400" x2="900" y2="412"/>
</g>
<text class="s" x="80" y="436">2026</text>
<text class="s" x="213" y="436">2028</text>
<text class="s" x="347" y="436">2030</text>
<text class="s" x="480" y="436">2032</text>
<text class="s" x="613" y="436">2034</text>
<text class="s" x="747" y="436">2036</text>
<text class="s" x="880" y="436">2038</text>

<text class="c" x="60" y="490">Whether the tech works and when it arrives are two questions</text>
</svg>
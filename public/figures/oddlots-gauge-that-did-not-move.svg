<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊刻度帶上的區塊停在原處，右邊柱子衝出框外">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="72" font-size="27" fill="var(--ink)">該響的那顆表沒有動</text>
<rect x="60" y="120" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="88" y="164" font-size="20" fill="var(--dim)">基金之間的相關係數</text>
<rect x="164" y="256" width="32" height="28" fill="var(--accent)"/>
<line x1="100" y1="284" x2="420" y2="284" stroke="var(--line)" stroke-width="4"/>
<text x="100" y="312" font-size="15" fill="var(--dim)">0</text>
<text x="412" y="312" font-size="15" fill="var(--dim)">1</text>
<text x="140" y="340" font-size="16" fill="var(--ink)">0.2 到 0.3</text>
<text x="88" y="384" font-size="16" fill="var(--dim)">多年如此，十月也在帶子裡</text>
<rect x="500" y="120" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="528" y="164" font-size="20" fill="var(--dim)">擁擠程度</text>
<rect x="640" y="92" width="92" height="300" fill="var(--warn)"/>
<text x="748" y="112" font-size="16" fill="var(--ink)">衝出表外</text>
<text x="500" y="452" font-size="15" fill="var(--dim)">沒有公開讀數，只知道它出界了</text>
<text x="60" y="508" font-size="22" fill="var(--ink)">相關性沒有惡化，出事的是另一個東西</text>
</svg>
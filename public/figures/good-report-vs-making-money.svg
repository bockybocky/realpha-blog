<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四象限圖，決定賺不賺錢的是橫軸的題材，不是縱軸的估得準不準" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">估得準，跟賺不賺錢，是兩件事</text>

<rect x="320" y="130" width="260" height="160" fill="var(--card)" stroke="var(--line)"/>
<rect x="580" y="130" width="260" height="160" fill="var(--card)" stroke="var(--line)"/>
<rect x="320" y="290" width="260" height="160" fill="var(--card)" stroke="var(--line)"/>
<rect x="580" y="290" width="260" height="160" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>

<text x="450" y="220" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">白費</text>
<text x="710" y="220" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">賺到</text>
<text x="450" y="380" font-size="20" font-weight="700" fill="var(--grey)" text-anchor="middle">沒戲</text>
<text x="710" y="380" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">還是賺到</text>

<text x="304" y="216" font-size="16" fill="var(--dim)" text-anchor="end">估得準</text>
<text x="304" y="376" font-size="16" fill="var(--dim)" text-anchor="end">估不準</text>
<text x="450" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">沒題材</text>
<text x="710" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">有題材</text>

<text x="580" y="512" font-size="19" fill="var(--dim)" text-anchor="middle">池子</text>
<text x="230" y="290" font-size="19" fill="var(--dim)" text-anchor="middle" transform="rotate(-90 230 290)">研究品質</text>

<text x="580" y="546" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">先選池子，再談估得準</text>
</svg>
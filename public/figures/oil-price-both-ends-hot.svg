<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條油價橫軸，兩端各掛一個代價">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">省下來的，跟賠進去的，在同一條線上</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">以每天進口 1,100 萬桶計</text>

<path d="M140 210 L140 186 L820 186 L820 210" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="480" y="170" font-size="20" font-weight="600" fill="var(--accent)" text-anchor="middle">一天約差 4 億美元</text>

<line x1="120" y1="250" x2="840" y2="250" stroke="var(--line)" stroke-width="4"/>
<circle cx="140" cy="250" r="10" fill="var(--accent)"/>
<circle cx="820" cy="250" r="10" fill="var(--accent)"/>
<text x="140" y="226" font-size="19" font-weight="600" fill="var(--ink)" text-anchor="middle">65 美元</text>
<text x="820" y="226" font-size="19" font-weight="600" fill="var(--ink)" text-anchor="middle">100 美元</text>

<line x1="140" y1="262" x2="140" y2="322" stroke="var(--warn)" stroke-width="2"/>
<line x1="820" y1="262" x2="820" y2="322" stroke="var(--warn)" stroke-width="2"/>
<rect x="60" y="330" width="300" height="92" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<rect x="600" y="330" width="300" height="92" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="210" y="366" font-size="19" font-weight="600" fill="var(--warn)" text-anchor="middle">油價低</text>
<text x="210" y="398" font-size="16" fill="var(--ink)" text-anchor="middle">傷自家 400 萬桶／日 上游</text>
<text x="750" y="366" font-size="19" font-weight="600" fill="var(--warn)" text-anchor="middle">油價高</text>
<text x="750" y="398" font-size="16" fill="var(--ink)" text-anchor="middle">擠壓下游、推升通膨</text>

<text x="60" y="478" font-size="22" font-weight="600" fill="var(--ink)">兩頭都燙手，握不成一支調價工具</text>
</svg>
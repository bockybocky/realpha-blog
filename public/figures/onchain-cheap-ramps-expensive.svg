<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="中間細、兩端厚的成本剖面，便宜的只有中間那一段">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.lb{font-size:19px;fill:var(--dim)}.sm{font-size:15px;fill:var(--dim)}.t{font-size:27px}.c{font-size:22px}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">便宜的只有中間那一段</text>
<line x1="60" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="80" y="170" width="200" height="230" rx="8" fill="var(--warn)" opacity="0.32"/>
<rect x="80" y="170" width="200" height="230" rx="8" fill="none" stroke="var(--warn)" stroke-width="3"/>
<rect x="340" y="352" width="280" height="48" rx="8" fill="var(--accent)" opacity="0.35"/>
<rect x="340" y="352" width="280" height="48" rx="8" fill="none" stroke="var(--accent)" stroke-width="3"/>
<rect x="680" y="170" width="200" height="230" rx="8" fill="var(--warn)" opacity="0.32"/>
<rect x="680" y="170" width="200" height="230" rx="8" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="lb" x="104" y="150">上鏈匝道</text>
<text class="lb" x="404" y="334">鏈上轉帳</text>
<text class="lb" x="704" y="150">下鏈匝道</text>
<text class="sm" x="104" y="436">貴又慢</text>
<text class="sm" x="452" y="436">快又便宜</text>
<text class="sm" x="704" y="436">貴又慢</text>
<text class="lb" x="60" y="110">成本</text>
<text class="c" x="60" y="492">省下來的，在出入口被收回去</text>
</svg>
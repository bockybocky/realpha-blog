<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="On the left a very tall dashed empty column stands for an order of a hundred and sixty thousand chips that could not be delivered, while on the right, on the same baseline, there is only a barely visible thin filled bar standing for the two thousand chips offered in the bid for Egypt.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="56">Order unmet, bid 2,000</text>
  <rect x="160" y="130" width="220" height="310" rx="6" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
  <text class="g" x="270" y="262" text-anchor="middle" fill="var(--warn)">Ord</text>
  <text class="n" x="270" y="296" text-anchor="middle">Undelivered</text>
  <text class="g" x="270" y="472" text-anchor="middle">160,000 950DT</text>
  <text class="n" x="270" y="500" text-anchor="middle">DeepSeek order, new Nei Mongol cluster</text>
  <rect x="600" y="432" width="220" height="8" fill="var(--accent)"/>
  <text class="g" x="710" y="472" text-anchor="middle">2,000 units</text>
  <text class="n" x="710" y="500" text-anchor="middle">Bid for Egypt</text>
  <line x1="120" y1="440" x2="880" y2="440" stroke="var(--ink)" stroke-width="3"/>
  <text class="n" x="710" y="406" text-anchor="middle" fill="var(--accent)">Top chips sent</text>
  <text class="c" x="60" y="552">80x apart</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The flat, elongated gate on the left is contrasted with the tall, narrow, deep hole on the right, which is labeled with a high aspect ratio and additional surrounding steps.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="40" y="58" font-size="27" fill="var(--ink)">Gate: Flat or Vertical?</text>

<rect x="60" y="110" width="400" height="340" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="90" y="370" width="340" height="52" fill="var(--grey)" opacity="0.45"/>
<rect x="150" y="336" width="220" height="30" fill="var(--accent)"/>
<text x="260" y="300" font-size="20" fill="var(--dim)" text-anchor="middle">Flat</text>
<text x="260" y="480" font-size="19" fill="var(--dim)" text-anchor="middle">6F²</text>

<rect x="500" y="110" width="400" height="340" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="530" y="150" width="340" height="272" fill="var(--grey)" opacity="0.45"/>
<rect x="676" y="150" width="34" height="250" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
<rect x="684" y="162" width="18" height="226" fill="var(--accent)"/>
<line x1="648" y1="150" x2="648" y2="400" stroke="var(--warn)" stroke-width="2"/>
<text x="634" y="282" font-size="16" fill="var(--warn)" text-anchor="end">Deep</text>
<line x1="676" y1="424" x2="710" y2="424" stroke="var(--warn)" stroke-width="2"/>
<text x="693" y="446" font-size="16" fill="var(--warn)" text-anchor="middle">Narrow</text>
<text x="790" y="200" font-size="19" fill="var(--dim)">Etch</text>
<text x="790" y="232" font-size="19" fill="var(--dim)">Clean</text>
<text x="790" y="264" font-size="19" fill="var(--dim)">Test</text>
<text x="790" y="296" font-size="19" fill="var(--dim)">Bond</text>
<text x="700" y="480" font-size="19" fill="var(--accent)" text-anchor="middle">4F²　Vertical</text>

<text x="480" y="522" font-size="22" fill="var(--ink)" text-anchor="middle">The Hard Part Is Everything Around It</text>
</svg>
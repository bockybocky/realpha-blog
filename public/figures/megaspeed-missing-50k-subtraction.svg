<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一根高柱被切成兩段：下面較大的一段是機房裡清點到的，上面一段是差額約五萬顆；一支箭頭從上面那段指向右邊一個帶問號的虛線框，框代表一週後才被提到的倉庫">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">總量減掉清點到的，剩下的在哪</text>
  <rect x="140" y="120" width="190" height="150" fill="var(--warn)" opacity="0.5"/>
  <rect x="140" y="270" width="190" height="170" fill="var(--accent)"/>
  <rect x="140" y="120" width="190" height="320" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="235" y="190" text-anchor="middle">差約 5 萬顆</text>
  <text class="n" x="235" y="218" text-anchor="middle" fill="var(--ink)">多數 Blackwell</text>
  <text class="g" x="235" y="350" text-anchor="middle" fill="var(--page)">機房裡清點到的</text>
  <text class="n" x="235" y="378" text-anchor="middle" fill="var(--page)">三國、八家、十二座以上</text>
  <text class="g" x="235" y="474" text-anchor="middle">貿易紀錄的總量</text>
  <text class="n" x="235" y="500" text-anchor="middle">馬來西亞與印尼（比例示意）</text>
  <line x1="350" y1="195" x2="562" y2="195" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="576,195 558,185 558,205" fill="var(--warn)"/>
  <text class="n" x="456" y="178" text-anchor="middle">那差額去哪了</text>
  <rect x="596" y="120" width="280" height="150" rx="10" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="g" x="736" y="178" text-anchor="middle" fill="var(--warn)">幾座倉庫</text>
  <text class="n" x="736" y="208" text-anchor="middle">一週前還沒人知道</text>
  <text class="n" x="736" y="234" text-anchor="middle">是這個數字嗎</text>
  <text class="c" x="736" y="330" text-anchor="middle" fill="var(--warn)">不評論</text>
  <text class="c" x="60" y="534">減法做得出來，答覆沒有</text>
</svg>
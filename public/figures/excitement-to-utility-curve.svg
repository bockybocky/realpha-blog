<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="先陡後平的曲線：陡升段標興奮，轉折點標減速，長長的水平尾段標管線與本益比 12 倍">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>

  <text x="50" y="58" font-size="27" font-weight="700" fill="var(--ink)">一切順利的終點</text>

  <line x1="120" y1="460" x2="880" y2="460" stroke="var(--line)" stroke-width="2"/>

  <path d="M140 450 C 300 450 340 230 480 205" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M480 205 C 620 185 700 182 860 180" fill="none" stroke="var(--grey)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="480" cy="205" r="8" fill="var(--page)" stroke="var(--accent)" stroke-width="4"/>

  <text x="250" y="300" font-size="20" font-weight="700" fill="var(--accent)">興奮</text>
  <text x="500" y="250" font-size="20" font-weight="600" fill="var(--dim)">減速</text>
  <text x="700" y="145" font-size="20" font-weight="700" fill="var(--ink)">管線</text>
  <text x="700" y="172" font-size="16" fill="var(--dim)">本益比 12 倍</text>

  <line x1="140" y1="500" x2="480" y2="500" stroke="var(--line)" stroke-width="2"/>
  <line x1="140" y1="494" x2="140" y2="506" stroke="var(--line)" stroke-width="2"/>
  <line x1="480" y1="494" x2="480" y2="506" stroke="var(--line)" stroke-width="2"/>
  <text x="310" y="526" font-size="16" text-anchor="middle" fill="var(--dim)">要騎過的是這段</text>

  <text x="480" y="562" font-size="22" font-weight="600" text-anchor="middle" fill="var(--ink)">終點是變成經濟的管線</text>
</svg>
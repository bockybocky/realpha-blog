<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="總報酬扣掉市場與產業兩大段後，選股只剩一小段">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); }
  .g { font-size:20px; fill:var(--ink); }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">漂亮的報酬，先拆三層</text>

<text class="g" x="60" y="140">今年的總報酬</text>
<rect x="300" y="116" width="598" height="46" rx="8" fill="var(--ink)" opacity="0.75"/>

<text class="g" x="60" y="228">扣掉市場位階</text>
<rect x="300" y="204" width="300" height="46" rx="8" fill="var(--grey)"/>
<text class="b" x="320" y="234">三循環同步向上</text>
<rect x="608" y="204" width="290" height="46" rx="8" fill="var(--ink)" opacity="0.45"/>

<text class="g" x="60" y="316">扣掉產業曝險</text>
<rect x="608" y="292" width="240" height="46" rx="8" fill="var(--grey)"/>
<text class="b" x="626" y="322">半導體與電子</text>
<rect x="854" y="292" width="44" height="46" rx="8" fill="var(--accent)"/>

<text class="g" x="60" y="404">剩下的才是選股</text>
<rect x="854" y="380" width="44" height="46" rx="8" fill="var(--accent)"/>
<text class="b" x="640" y="410" fill="var(--accent)">一年多的族群，還沒走過反轉</text>

<text class="c" x="60" y="480">贏在哪一層，決定順風停了要不要續抱</text>
</svg>
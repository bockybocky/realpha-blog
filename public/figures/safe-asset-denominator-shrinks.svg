<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊白銀黃金混合三塊各佔三分之一，右邊白銀被劃掉，三支箭頭全部壓向剩下的黃金那一塊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">避險的地方，突然少了三分之一</text>

  <text x="90" y="120" font-size="20" fill="var(--dim)">之前</text>
  <rect x="90" y="140" width="300" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="240" y="192" font-size="19" fill="var(--dim)" text-anchor="middle">白銀 1/3</text>
  <rect x="90" y="240" width="300" height="90" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="240" y="292" font-size="19" fill="var(--accent)" text-anchor="middle">黃金 1/3</text>
  <rect x="90" y="340" width="300" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="240" y="392" font-size="19" fill="var(--dim)" text-anchor="middle">混合 1/3</text>

  <line x1="430" y1="285" x2="512" y2="285" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="522,285 504,276 504,294" fill="var(--dim)"/>

  <text x="570" y="120" font-size="20" fill="var(--dim)">之後</text>
  <rect x="570" y="140" width="300" height="90" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <line x1="570" y1="140" x2="870" y2="230" stroke="var(--grey)" stroke-width="2"/>
  <line x1="870" y1="140" x2="570" y2="230" stroke="var(--grey)" stroke-width="2"/>
  <text x="720" y="192" font-size="19" fill="var(--grey)" text-anchor="middle">白銀</text>

  <line x1="640" y1="248" x2="640" y2="286" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="640,296 632,278 648,278" fill="var(--warn)"/>
  <line x1="720" y1="248" x2="720" y2="286" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="720,296 712,278 728,278" fill="var(--warn)"/>
  <line x1="800" y1="248" x2="800" y2="286" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="800,296 792,278 808,278" fill="var(--warn)"/>

  <rect x="570" y="306" width="300" height="124" fill="var(--accent)"/>
  <text x="720" y="376" font-size="19" fill="var(--page)" text-anchor="middle">黃金</text>
  <text x="720" y="460" font-size="16" fill="var(--warn)" text-anchor="middle">全部擠上來</text>

  <text x="480" y="512" font-size="22" fill="var(--ink)" text-anchor="middle">不是需求變大，是分母變小</text>
</svg>
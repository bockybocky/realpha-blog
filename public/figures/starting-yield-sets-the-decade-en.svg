<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Dots slope up to the right, the past decade clustered in a grey box at lower left and today's dot far upper right.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">The yield you buy at sets the next decade</text>

<rect x="60" y="88" width="840" height="356" rx="10" fill="var(--card)" stroke="var(--line)"/>
<line x1="130" y1="404" x2="860" y2="404" stroke="var(--line)" stroke-width="2"/>
<line x1="130" y1="404" x2="130" y2="124" stroke="var(--line)" stroke-width="2"/>
<text class="n" x="700" y="432">Starting yield (high)</text>
<text class="n" x="146" y="142">Annualized return over the next decade (high)</text>

<rect x="150" y="300" width="230" height="96" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-dasharray="6 6"/>
<text class="n" x="162" y="292">Every sample from the past decade sits here</text>
<circle cx="188" cy="372" r="6" fill="var(--grey)"/>
<circle cx="214" cy="356" r="6" fill="var(--grey)"/>
<circle cx="240" cy="364" r="6" fill="var(--grey)"/>
<circle cx="268" cy="344" r="6" fill="var(--grey)"/>
<circle cx="296" cy="350" r="6" fill="var(--grey)"/>
<circle cx="324" cy="332" r="6" fill="var(--grey)"/>
<circle cx="352" cy="338" r="6" fill="var(--grey)"/>

<circle cx="430" cy="316" r="6" fill="var(--grey)"/>
<circle cx="486" cy="286" r="6" fill="var(--grey)"/>
<circle cx="540" cy="272" r="6" fill="var(--grey)"/>
<circle cx="596" cy="240" r="6" fill="var(--grey)"/>
<circle cx="652" cy="226" r="6" fill="var(--grey)"/>
<circle cx="714" cy="196" r="6" fill="var(--grey)"/>
<circle cx="776" cy="178" r="6" fill="var(--grey)"/>
<path d="M 170 378 L 820 164" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6" fill="none"/>

<circle cx="700" cy="206" r="11" fill="var(--accent)"/>
<text class="g" x="672" y="182">Today 6%</text>

<text class="c" x="60" y="500">There is a risk-free alternative now; back then there was none</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One short bar and one tall bar: the short one is labelled 60 to 80 percent growth, the tall one 300 percent, with a gap between them.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="80" y="62" font-size="27" fill="var(--ink)">Same product line, two heights</text>
<line x1="100" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="240" y="365" width="150" height="75" fill="var(--grey)"/>
<rect x="580" y="120" width="150" height="320" fill="var(--accent)"/>
<path d="M465 365 L465 130" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M459 136 L465 122 L471 136 Z" fill="var(--dim)"/>
<text x="478" y="258" font-size="19" fill="var(--dim)">The gap he looks for</text>
<text x="315" y="348" font-size="20" fill="var(--dim)" text-anchor="middle">60% to 80%</text>
<text x="655" y="104" font-size="20" fill="var(--accent)" text-anchor="middle">300%</text>
<text x="315" y="474" font-size="16" fill="var(--dim)" text-anchor="middle">Back then</text>
<text x="655" y="474" font-size="16" fill="var(--dim)" text-anchor="middle">After the team swap</text>
<text x="80" y="516" font-size="22" fill="var(--ink)">Growing is not the same as growing enough</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Three positions on a timeline: changing orders lands this quarter, changing capability lands in one to two years, and merely changing a relationship lands further out and is drawn dashed">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<defs>
<marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker>
</defs>
<text class="t" x="60" y="62">Which slot moves?</text>
<line x1="100" y1="300" x2="890" y2="300" stroke="var(--line)" stroke-width="4" marker-end="url(#mt)"/>
<circle cx="220" cy="300" r="18" fill="var(--accent)"/>
<text class="g" x="220" y="248" text-anchor="middle">Orders</text>
<text class="b" x="220" y="222" text-anchor="middle">Moves now</text>
<text class="b" x="220" y="348" text-anchor="middle">This Q</text>
<circle cx="520" cy="300" r="15" fill="var(--page)" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="520" y="248" text-anchor="middle">Capability</text>
<text class="b" x="520" y="222" text-anchor="middle">Product cycle</text>
<text class="b" x="520" y="348" text-anchor="middle">1–2 years</text>
<circle cx="790" cy="300" r="13" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 5"/>
<text class="g" x="790" y="248" text-anchor="middle" fill="var(--dim)">Ties only</text>
<text class="b" x="790" y="222" text-anchor="middle">Zero → nonzero</text>
<text class="b" x="790" y="348" text-anchor="middle">Later</text>
<text class="c" x="60" y="440">Big name ≠ nearest slot</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Bar chart: next to two tall bars calling for 300 and 200, the already-under-construction bar is only about a third as tall, leaving a clear height gap in between.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="80" y="78">Cumulative power deployed by 2030</text>

<line x1="120" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>

<rect x="170" y="130" width="120" height="270" rx="4" fill="var(--grey)" opacity="0.55"/>
<rect x="350" y="220" width="120" height="180" rx="4" fill="var(--grey)" opacity="0.8"/>
<rect x="660" y="310" width="120" height="90" rx="4" fill="var(--accent)"/>

<text class="g" x="230" y="112" text-anchor="middle">300GW</text>
<text class="g" x="410" y="202" text-anchor="middle">200GW</text>
<text class="g" x="720" y="292" text-anchor="middle">Just over 100GW</text>

<text class="b" x="230" y="434" text-anchor="middle">Market talk</text>
<text class="b" x="410" y="434" text-anchor="middle">Market talk</text>
<text class="b" x="720" y="434" text-anchor="middle">Actually building</text>

<line x1="540" y1="140" x2="540" y2="390" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="g" x="556" y="250" fill="var(--warn)">Gap</text>

<text class="c" x="120" y="496">Not enough, and nobody waits</text>
</svg>
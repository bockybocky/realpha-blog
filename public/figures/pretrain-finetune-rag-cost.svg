<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="三根柱子高度由左到右急遽下降：預訓練最高、微調中等、RAG 最矮，柱高代表運算量">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="58">預訓練　微調　RAG</text>
<path d="M110 450 L110 108" stroke="var(--line)" stroke-width="2" fill="none"/>
<path d="M110 100 L104 114 L116 114 z" fill="var(--line)"/>
<text class="s" x="86" y="290" text-anchor="middle" transform="rotate(-90 86 290)">運算量</text>
<line x1="110" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
<rect x="170" y="130" width="180" height="320" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="420" y="335" width="180" height="115" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="670" y="410" width="180" height="40" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="s" x="260" y="120" text-anchor="middle">最貴</text>
<text class="s" x="760" y="400" text-anchor="middle">最便宜</text>
<text class="g" x="260" y="486" text-anchor="middle">預訓練</text>
<text class="g" x="510" y="486" text-anchor="middle">微調</text>
<text class="g" x="760" y="486" text-anchor="middle">RAG</text>
<text class="b" x="260" y="514" text-anchor="middle">通用知識</text>
<text class="b" x="510" y="514" text-anchor="middle">專業與口氣</text>
<text class="b" x="760" y="514" text-anchor="middle">外部即時資料</text>
<text class="c" x="60" y="566">換資料 → RAG　　換行為 → 微調</text>
</svg>
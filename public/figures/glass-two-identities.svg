<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩張卡片對照：暫時載具的玻璃在成品裡消失，永久基板的玻璃留在成品裡">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:20px; font-weight:700; fill:var(--ink); }
    .bd  { font-size:16px; fill:var(--dim); }
    .sm  { font-size:15px; fill:var(--dim); }
    .cc  { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="58">同一塊玻璃，兩種身分</text>

  <rect x="60" y="92" width="400" height="350" rx="16" fill="var(--card)" stroke="var(--line)"/>
  <text class="grp" x="88" y="134">暫時載具</text>
  <text class="sm" x="88" y="160">像一張工作台</text>
  <text class="sm" x="185" y="196" text-anchor="middle">加工中</text>
  <rect x="120" y="208" width="130" height="36" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="bd" x="185" y="232" text-anchor="middle" fill="var(--ink)">材料</text>
  <rect x="120" y="244" width="130" height="36" rx="6" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
  <text class="bd" x="185" y="268" text-anchor="middle" fill="var(--accent)">玻璃</text>
  <line x1="268" y1="262" x2="312" y2="262" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="322,262 308,255 308,269" fill="var(--grey)"/>
  <text class="sm" x="375" y="196" text-anchor="middle">成品</text>
  <rect x="310" y="208" width="130" height="36" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="bd" x="375" y="232" text-anchor="middle" fill="var(--ink)">晶片</text>
  <rect x="310" y="244" width="130" height="36" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="sm" x="375" y="268" text-anchor="middle">已移除</text>
  <text class="grp" x="260" y="400" text-anchor="middle" fill="var(--dim)">成品裡沒有玻璃</text>

  <rect x="500" y="92" width="400" height="350" rx="16" fill="var(--card)" stroke="var(--line)"/>
  <text class="grp" x="528" y="134">永久基板</text>
  <text class="sm" x="528" y="160">留在成品裡</text>
  <text class="sm" x="625" y="196" text-anchor="middle">加工中</text>
  <rect x="560" y="208" width="130" height="36" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="bd" x="625" y="232" text-anchor="middle" fill="var(--ink)">材料</text>
  <rect x="560" y="244" width="130" height="36" rx="6" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
  <text class="bd" x="625" y="268" text-anchor="middle" fill="var(--accent)">玻璃</text>
  <line x1="708" y1="262" x2="752" y2="262" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="762,262 748,255 748,269" fill="var(--grey)"/>
  <text class="sm" x="815" y="196" text-anchor="middle">成品</text>
  <rect x="750" y="208" width="130" height="36" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="bd" x="815" y="232" text-anchor="middle" fill="var(--ink)">晶片</text>
  <rect x="750" y="244" width="130" height="36" rx="6" fill="var(--accent)" fill-opacity="0.30" stroke="var(--accent)" stroke-width="2"/>
  <text class="bd" x="815" y="268" text-anchor="middle" fill="var(--accent)">玻璃</text>
  <text class="grp" x="700" y="400" text-anchor="middle" fill="var(--dim)">玻璃是產品的一部分</text>

  <text class="cc" x="60" y="505">先確認講的是哪一種，兩句矛盾的話才可能同時是對的</text>
</svg>
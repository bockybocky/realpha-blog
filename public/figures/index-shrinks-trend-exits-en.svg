<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The same falling price line, with the trend stopping at the stop and the index becoming a row of shrinking blocks that runs to the end">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.f3-b{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.f3-t{font-size:27px;font-weight:700}
.f3-g{font-size:19px;fill:var(--dim)}
.f3-s{font-size:15px}
.f3-c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="f3-b f3-t" x="60" y="66">The same decline: one just shrinks, one exits</text>
<path d="M190,180 L280,212 L360,190 L430,262 L510,300 L600,288 L700,360 L800,392 L900,420" fill="none" stroke="var(--dim)" stroke-width="3"/>
<line x1="190" y1="250" x2="900" y2="250" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="f3-b f3-s" x="196" y="242" fill="var(--warn)">Stop</text>
<circle cx="418" cy="250" r="8" fill="var(--warn)"/>
<text class="f3-b f3-g" x="60" y="446">Trend following</text>
<rect x="190" y="432" width="228" height="16" fill="var(--accent)"/>
<line x1="418" y1="440" x2="900" y2="440" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 8"/>
<text class="f3-b f3-s" x="430" y="470" fill="var(--dim)">Flat</text>
<text class="f3-b f3-g" x="60" y="512">Index</text>
<rect x="190" y="493" width="26" height="26" fill="var(--grey)"/>
<rect x="263" y="494" width="24" height="24" fill="var(--grey)"/>
<rect x="336" y="495" width="22" height="22" fill="var(--grey)"/>
<rect x="409" y="496" width="20" height="20" fill="var(--grey)"/>
<rect x="482" y="497" width="18" height="18" fill="var(--grey)"/>
<rect x="555" y="498" width="16" height="16" fill="var(--grey)"/>
<rect x="628" y="499" width="14" height="14" fill="var(--grey)"/>
<rect x="701" y="500" width="12" height="12" fill="var(--grey)"/>
<rect x="774" y="501" width="10" height="10" fill="var(--grey)"/>
<rect x="847" y="502" width="8" height="8" fill="var(--grey)"/>
<text class="f3-b f3-c" x="60" y="558">One is still in, the other is gone</text>
</svg>
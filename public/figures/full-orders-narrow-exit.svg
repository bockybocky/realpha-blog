<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="高高的訂單堆經過一個窄口後，右邊出貨只剩一小段">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<text x="60" y="72" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="27" fill="var(--ink)">滿手訂單，窄口出貨</text>

<rect x="90" y="150" width="200" height="280" rx="8" fill="var(--accent)" opacity="0.8"/>
<text x="190" y="468" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">需求</text>

<path d="M 330 150 L 470 270 L 470 310 L 330 430 Z" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="400" y="468" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--warn)">卡住的兩道</text>
<text x="520" y="222" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--dim)">自己供應吃緊</text>
<text x="520" y="358" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--dim)">客戶無塵室沒蓋好</text>

<rect x="760" y="270" width="110" height="40" rx="6" fill="var(--accent)"/>
<text x="815" y="468" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">認得到的營收</text>

<text x="60" y="510" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="22" fill="var(--ink)">被重新定價的不是左邊，是中間</text>
</svg>
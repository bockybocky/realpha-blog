<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上長條幾乎填滿、下長條只到一半的高度差對比">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">指數幾乎在頂，底下只有一半跟上</text>

<text x="60" y="176" font-size="20" fill="var(--dim)">指數位置</text>
<rect x="60" y="196" width="840" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="196" width="836" height="64" rx="8" fill="var(--accent)"/>
<text x="84" y="236" font-size="20" font-weight="700" fill="var(--page)">距歷史高點 0.5%</text>

<text x="60" y="336" font-size="20" fill="var(--dim)">成分股站上 200 日均線</text>
<rect x="60" y="356" width="840" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="356" width="430" height="64" rx="8" fill="var(--warn)"/>
<text x="84" y="396" font-size="20" font-weight="700" fill="var(--page)">51.2%</text>
<text x="510" y="396" font-size="19" fill="var(--grey)">其餘在均線之下</text>

<text x="60" y="476" font-size="22" font-weight="700" fill="var(--ink)">同一天，兩個高度</text>
</svg>
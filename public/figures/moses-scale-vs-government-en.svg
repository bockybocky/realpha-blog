<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bar comparisons: the state's total highway mileage and the portion Moses built are nearly equal in length; the city government's borrowing capacity is less than half the Authority's.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .ttl { font-size:27px; font-weight:700; }
    .grp { font-size:20px; font-weight:700; fill:var(--dim); }
    .lbl { font-size:16px; fill:var(--dim); }
    .num { font-size:16px; font-weight:700; }
    .cc { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t ttl" x="60" y="64">Unelected, outbuilt NY</text>

  <text class="t grp" x="60" y="130">Highway miles (NY State, by 1964)</text>
  <rect x="60" y="150" width="760" height="40" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="150" width="760" height="40" rx="6" fill="none" stroke="var(--grey)"/>
  <text class="t lbl" x="836" y="176">Statewide</text>
  <text class="t num" x="72" y="177" fill="var(--dim)">899 miles</text>
  <rect x="60" y="202" width="568" height="40" rx="6" fill="var(--accent)" opacity="0.85"/>
  <text class="t num" x="72" y="229" fill="var(--page)">672 miles</text>
  <text class="t lbl" x="644" y="229">By Moses</text>

  <text class="t grp" x="60" y="312">Debt capacity (1946)</text>
  <rect x="60" y="332" width="317" height="40" rx="6" fill="var(--card)" stroke="var(--grey)"/>
  <text class="t num" x="72" y="359" fill="var(--dim)">$150 million</text>
  <text class="t lbl" x="393" y="359">NYC (at debt limit)</text>
  <rect x="60" y="384" width="760" height="40" rx="6" fill="var(--accent)" opacity="0.85"/>
  <text class="t num" x="72" y="411" fill="var(--page)">$360 million</text>
  <text class="t lbl" x="836" y="411">Authority</text>

  <line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text class="t cc" x="60" y="512">No voters, twice the city's room</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="In this four-quadrant chart, the bottom-right box of findable but nobody looking is where things keep sleeping.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="56" font-size="27" fill="var(--ink)">Findable is not the same as looked for</text>

<rect x="200" y="96" width="330" height="200" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="530" y="96" width="330" height="200" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="200" y="296" width="330" height="200" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="530" y="296" width="330" height="200" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>

<text x="226" y="140" font-size="19" fill="var(--dim)">Boxes in a basement</text>
<text x="226" y="172" font-size="16" fill="var(--dim)">Someone wants it, but must dig in person</text>
<text x="556" y="140" font-size="19" fill="var(--accent)">Wakes up</text>
<text x="556" y="172" font-size="16" fill="var(--dim)">Question meets thing</text>
<text x="226" y="340" font-size="19" fill="var(--dim)">Truly gone</text>
<text x="556" y="340" font-size="19" fill="var(--warn)">Keeps sleeping</text>
<text x="556" y="376" font-size="16" fill="var(--ink)">The O-ring warning</text>
<text x="556" y="408" font-size="16" fill="var(--ink)">A genre nobody heard</text>
<text x="556" y="440" font-size="16" fill="var(--dim)">Cannot type those words</text>

<line x1="200" y1="520" x2="860" y2="520" stroke="var(--line)" stroke-width="2"/>
<text x="226" y="552" font-size="16" fill="var(--dim)">Not findable</text>
<text x="800" y="552" font-size="16" fill="var(--dim)">Findable</text>
<line x1="160" y1="96" x2="160" y2="496" stroke="var(--line)" stroke-width="2"/>
<text x="40" y="130" font-size="16" fill="var(--dim)">Will look</text>
<text x="40" y="486" font-size="16" fill="var(--dim)">Will not look</text>
</g>
</svg>
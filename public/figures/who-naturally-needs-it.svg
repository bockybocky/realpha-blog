<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左圈有四個外部箭頭拉住，右圈外面空無一物只有是否兩格對賭">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t h" x="60" y="66">先問另一邊是誰</text>

  <circle cx="250" cy="300" r="92" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t g" x="214" y="308">合約</text>
  <path d="M250 130 L250 196" stroke="var(--accent)" stroke-width="4"/>
  <path d="M242 186 L250 198 L258 186" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <path d="M70 300 L148 300" stroke="var(--accent)" stroke-width="4"/>
  <path d="M138 292 L150 300 L138 308" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <path d="M430 300 L352 300" stroke="var(--accent)" stroke-width="4"/>
  <path d="M362 292 L350 300 L362 308" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <path d="M250 470 L250 404" stroke="var(--accent)" stroke-width="4"/>
  <path d="M242 414 L250 402 L258 414" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <text class="t b" x="196" y="118">生產者</text>
  <text class="t b" x="60" y="276">商業用戶</text>
  <text class="t b" x="372" y="276">天然買方</text>
  <text class="t b" x="196" y="500">天然賣方</text>
  <text class="t c" x="150" y="534">價格有東西錨住</text>

  <circle cx="710" cy="300" r="92" fill="var(--card)" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="648" y="276" width="54" height="48" rx="5" fill="var(--warn)"/>
  <rect x="718" y="276" width="54" height="48" rx="5" fill="var(--grey)"/>
  <text class="t b" x="666" y="306" fill="var(--page)">是</text>
  <text class="t b" x="736" y="306" fill="var(--page)">否</text>
  <text class="t c" x="618" y="534">外面沒有人需要它</text>
</svg>
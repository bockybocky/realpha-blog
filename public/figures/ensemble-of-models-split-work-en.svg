<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One task is split into four parts handed to models that cannot see each other, then an executor with no guardrails assembles them into a complete attack.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">Four parts, no one sees the end</text>
<rect x="46" y="256" width="150" height="76" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="121" y="290" font-size="16" fill="var(--ink)" text-anchor="middle">One prompt</text>
<text x="121" y="314" font-size="16" fill="var(--dim)" text-anchor="middle">A few dollars</text>
<path d="M196 294 C 250 294 250 150 320 150" fill="none" stroke="var(--line)" stroke-width="3"/>
<path d="M196 294 C 250 294 250 226 320 226" fill="none" stroke="var(--line)" stroke-width="3"/>
<path d="M196 294 C 250 294 250 302 320 302" fill="none" stroke="var(--line)" stroke-width="3"/>
<path d="M196 294 C 250 294 250 378 320 378" fill="none" stroke="var(--line)" stroke-width="3"/>
<rect x="320" y="120" width="190" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="320" y="196" width="190" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="320" y="272" width="190" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="320" y="348" width="190" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="415" y="157" font-size="16" fill="var(--dim)" text-anchor="middle">Scan the subnet</text>
<text x="415" y="233" font-size="16" fill="var(--dim)" text-anchor="middle">Read the code</text>
<text x="415" y="309" font-size="16" fill="var(--dim)" text-anchor="middle">Write a test script</text>
<text x="415" y="385" font-size="16" fill="var(--dim)" text-anchor="middle">Format the credentials</text>
<text x="415" y="446" font-size="15" fill="var(--dim)" text-anchor="middle">Each part looks like normal work</text>
<path d="M510 150 C 580 150 580 294 640 294" fill="none" stroke="var(--line)" stroke-width="3"/>
<path d="M510 226 C 580 226 580 294 640 294" fill="none" stroke="var(--line)" stroke-width="3"/>
<path d="M510 302 C 580 302 580 294 640 294" fill="none" stroke="var(--line)" stroke-width="3"/>
<path d="M510 378 C 580 378 580 294 640 294" fill="none" stroke="var(--line)" stroke-width="3"/>
<rect x="640" y="230" width="170" height="128" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="725" y="276" font-size="20" fill="var(--ink)" text-anchor="middle">Executor</text>
<text x="725" y="306" font-size="16" fill="var(--warn)" text-anchor="middle">Guardrails removed</text>
<text x="725" y="332" font-size="16" fill="var(--dim)" text-anchor="middle">Not smart, but never refuses</text>
<path d="M810 294 L 868 294" stroke="var(--warn)" stroke-width="5"/>
<polygon points="868,284 894,294 868,304" fill="var(--warn)"/>
<text x="60" y="516" font-size="22" fill="var(--ink)">No single part breaks a rule; the sum is the attack</text>
</g>
</svg>
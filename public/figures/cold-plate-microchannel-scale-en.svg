<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A magnified cold plate cross-section: dense thin fins stand on a thin copper base and water flows through the microchannels between them, with dimensions marked in millimeters and microns.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66">A cold plate in cross-section (magnified)</text>

<rect x="150" y="330" width="660" height="46" fill="var(--accent)"/>
<text class="g" x="840" y="360">Copper base</text>
<text class="n" x="840" y="384">About 2 mm</text>

<g fill="var(--accent)">
<rect x="160" y="258" width="10" height="72"/><rect x="190" y="258" width="10" height="72"/>
<rect x="220" y="258" width="10" height="72"/><rect x="250" y="258" width="10" height="72"/>
<rect x="280" y="258" width="10" height="72"/><rect x="310" y="258" width="10" height="72"/>
<rect x="340" y="258" width="10" height="72"/><rect x="370" y="258" width="10" height="72"/>
<rect x="400" y="258" width="10" height="72"/><rect x="430" y="258" width="10" height="72"/>
<rect x="460" y="258" width="10" height="72"/><rect x="490" y="258" width="10" height="72"/>
<rect x="520" y="258" width="10" height="72"/><rect x="550" y="258" width="10" height="72"/>
<rect x="580" y="258" width="10" height="72"/><rect x="610" y="258" width="10" height="72"/>
<rect x="640" y="258" width="10" height="72"/><rect x="670" y="258" width="10" height="72"/>
<rect x="700" y="258" width="10" height="72"/><rect x="730" y="258" width="10" height="72"/>
<rect x="760" y="258" width="10" height="72"/><rect x="790" y="258" width="10" height="72"/>
</g>

<line x1="120" y1="258" x2="120" y2="330" stroke="var(--ink)" stroke-width="2"/>
<text class="n" x="108" y="300" text-anchor="end">Fin height</text>
<text class="n" x="108" y="322" text-anchor="end">3 mm</text>

<line x1="250" y1="230" x2="320" y2="230" stroke="var(--ink)" stroke-width="2"/>
<text class="n" x="285" y="216" text-anchor="middle">Spacing on the order of 100 microns</text>

<text class="g" x="150" y="440">Water passes through every microchannel</text>
<line x1="150" y1="460" x2="810" y2="460" stroke="var(--accent)" stroke-width="3" stroke-dasharray="12 8"/>
<text class="g" x="150" y="400">The chip sits against this face</text>
<text class="c" x="60" y="510">The hard part is not taking the heat, it is making every channel flow alike</text>
</svg>
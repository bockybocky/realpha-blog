<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊單一買方的高柱，右邊三個新需求來源疊成的柱子還比較矮">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t h" x="60" y="70">誰來補那塊需求</text>

  <line x1="80" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="3"/>

  <rect x="150" y="170" width="180" height="280" rx="8" fill="var(--accent)" opacity="0.85"/>
  <text class="t g" x="240" y="150" text-anchor="middle">微軟</text>
  <text class="t b" x="240" y="490" text-anchor="middle">約 4500 萬噸</text>

  <rect x="600" y="295" width="180" height="155" rx="8" fill="var(--warn)" opacity="0.8"/>
  <rect x="600" y="245" width="180" height="46" rx="8" fill="var(--grey)"/>
  <rect x="600" y="195" width="180" height="46" rx="8" fill="var(--grey)" opacity="0.6"/>
  <text class="t b" x="690" y="378" text-anchor="middle" fill="var(--page)">歐盟 約 2500 萬噸</text>
  <text class="t b" x="690" y="274" text-anchor="middle">CORSIA</text>
  <text class="t b" x="690" y="224" text-anchor="middle">第六條</text>
  <text class="t g" x="690" y="175" text-anchor="middle">新來源</text>
  <text class="t b" x="690" y="490" text-anchor="middle">量未定，方向在路上</text>

  <line x1="330" y1="170" x2="600" y2="170" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
</svg>
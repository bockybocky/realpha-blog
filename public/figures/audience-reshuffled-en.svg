<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="An audience proportion bar: women at 42%, the young slice growing fastest, branching into three destinations below.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t h" x="60" y="68">The audience has been reshuffled</text>

<rect x="60" y="120" width="353" height="80" rx="8" fill="var(--accent)"/>
<rect x="413" y="120" width="487" height="80" rx="8" fill="var(--grey)" opacity="0.5"/>
<text class="t g" x="84" y="170" fill="var(--page)">Women 42%</text>
<text class="t g" x="440" y="170">The rest</text>

<rect x="60" y="120" width="120" height="80" rx="8" fill="var(--warn)"/>
<text class="t g" x="78" y="170" fill="var(--page)">15–25</text>
<text class="t b" x="60" y="232">The fastest-growing slice</text>

<path d="M120 250 L120 300" stroke="var(--warn)" stroke-width="3"/>
<path d="M120 300 L250 300 M120 300 L120 360 M120 360 L250 360 M120 300 L120 420 M120 420 L250 420" stroke="var(--line)" stroke-width="3" fill="none"/>
<rect x="250" y="276" width="220" height="48" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="272" y="308">Want to drive</text>
<rect x="250" y="336" width="220" height="48" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="272" y="368">Want to engineer</text>
<rect x="250" y="396" width="220" height="48" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="272" y="428">Want to market</text>

<text class="t c" x="560" y="300">Entertainment</text>
<path d="M560 320 L760 320" stroke="var(--line)" stroke-width="3"/>
<text class="t c" x="560" y="360">Sport</text>
<text class="t b" x="560" y="400">The top layer grows on the lower one</text>
</svg>
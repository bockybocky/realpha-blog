<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One starting point branching into a thin path and a thick path">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">One sentence, two destinations</text>

<rect x="330" y="100" width="300" height="72" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="146" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">"It's a bubble"</text>

<path d="M 480 172 L 480 224 L 250 224 L 250 288" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
<path d="M 480 172 L 480 224 L 710 224 L 710 288" fill="none" stroke="var(--accent)" stroke-width="9"/>

<rect x="110" y="288" width="280" height="164" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="250" y="330" font-size="19" font-weight="600" fill="var(--dim)" text-anchor="middle">Nothing changed</text>
<text x="250" y="366" font-size="16" fill="var(--dim)" text-anchor="middle">Still bidding</text>
<text x="250" y="396" font-size="16" fill="var(--dim)" text-anchor="middle">Still on site</text>
<text x="250" y="432" font-size="16" font-weight="600" fill="var(--grey)" text-anchor="middle">Information ≈ 0</text>

<rect x="570" y="288" width="280" height="164" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="710" y="330" font-size="19" font-weight="600" fill="var(--accent)" text-anchor="middle">Turned into cost</text>
<text x="710" y="366" font-size="16" fill="var(--ink)" text-anchor="middle">Shorter contract terms</text>
<text x="710" y="396" font-size="16" fill="var(--ink)" text-anchor="middle">Prepayment required</text>
<text x="710" y="426" font-size="16" fill="var(--ink)" text-anchor="middle">Refuse expansion</text>

<text x="480" y="520" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Watch what they did differently because of it</text>
</svg>
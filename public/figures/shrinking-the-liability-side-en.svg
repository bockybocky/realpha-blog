<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The liability side is cut into four blocks, three locked, so all the pressure falls on the reserves block in the middle">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink)}
.ga{font-size:19px;fill:var(--accent)}
.b{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">Assets shrink, so must liabilities</text>
<rect x="150" y="140" width="180" height="300" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="240" y="290" text-anchor="middle">Assets</text>
<path d="M100 200 L100 400" stroke="var(--accent)" stroke-width="3"/>
<path d="M100 412 L93 394 L107 394 Z" fill="var(--accent)"/>
<text class="b" x="70" y="180">Shrink</text>
<path d="M350 290 L500 290" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M512 290 L496 283 L496 297 Z" fill="var(--line)"/>
<rect x="530" y="140" width="280" height="72" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="552" y="175">Treasury account</text>
<text class="b" x="552" y="199">Cannot recall</text>
<rect x="530" y="218" width="280" height="72" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="552" y="253">Currency in circulation</text>
<text class="b" x="552" y="277">Cannot retrieve</text>
<rect x="530" y="296" width="280" height="106" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="ga" x="552" y="336">Reserves</text>
<text class="b" x="552" y="362">Interest · Rules · Payments</text>
<text class="b" x="552" y="386">Banks hold on</text>
<rect x="530" y="408" width="280" height="32" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="552" y="430">Other</text>
<text class="g" x="830" y="360">Movable</text>
<text class="c" x="60" y="510">All pressure on one block</text>
</svg>
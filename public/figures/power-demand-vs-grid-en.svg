<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-label="Bar chart: the top bar for chip power demand, 16 to 22 GW, is longer than the bottom bar for grid supply, 10 to 15 GW, and the gap between their ends is marked as 1 GW at best and 12 GW at worst."><rect x="0" y="0" width="960" height="570" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:19px;font-weight:600}.b{font-size:16px;fill:var(--dim)}.k{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}
</style>
<text x="480" y="52" text-anchor="middle" class="t">This year: chips &gt; grid</text>
<line x1="600" y1="165" x2="600" y2="385" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="628" y1="165" x2="628" y2="385" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M600 162 H628" stroke="var(--warn)" stroke-width="3" fill="none"/>
<text x="614" y="148" text-anchor="middle" class="b w">Best: 1 GW short</text>
<text x="165" y="226" text-anchor="end" class="g">Demand</text>
<rect x="180" y="190" width="448" height="56" fill="var(--accent)"/>
<rect x="628" y="190" width="168" height="56" fill="var(--accent)" fill-opacity="0.3" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4"/>
<text x="806" y="226" class="g a">16–22 GW</text>
<text x="165" y="336" text-anchor="end" class="g">Supply</text>
<rect x="180" y="300" width="280" height="56" fill="var(--grey)"/>
<rect x="460" y="300" width="140" height="56" fill="var(--grey)" fill-opacity="0.45" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 4"/>
<text x="612" y="336" class="g">10–15 GW</text>
<line x1="180" y1="390" x2="880" y2="390" stroke="var(--line)" stroke-width="2"/>
<g text-anchor="middle" class="b">
<text x="180" y="414">0</text><text x="320" y="414">5</text><text x="460" y="414">10</text><text x="600" y="414">15</text><text x="740" y="414">20</text><text x="880" y="414">25 GW</text>
</g>
<path d="M460 432 V446 H796 V432" stroke="var(--warn)" stroke-width="2.5" fill="none"/>
<text x="628" y="474" text-anchor="middle" class="g w">Worst: 12 GW</text>
<text x="880" y="474" text-anchor="end" class="b">1 GW ≈ a city</text>
<text x="480" y="530" text-anchor="middle" class="k">Power is scarce now</text>
</svg>
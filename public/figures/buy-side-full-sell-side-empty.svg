<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩個等高容器，左邊填滿、右邊幾乎全空，比喻買進端做足功課而賣出端空白">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="72" font-size="27" font-weight="700" fill="var(--ink)">同一筆錢的兩端</text>

  <rect x="180" y="140" width="200" height="300" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="188" y="148" width="184" height="70" rx="4" fill="var(--accent)" opacity="0.9"/>
  <text class="t" x="280" y="191" font-size="16" fill="var(--page)" text-anchor="middle">看基本面</text>
  <rect x="188" y="224" width="184" height="70" rx="4" fill="var(--accent)" opacity="0.75"/>
  <text class="t" x="280" y="267" font-size="16" fill="var(--page)" text-anchor="middle">比較同業</text>
  <rect x="188" y="300" width="184" height="66" rx="4" fill="var(--accent)" opacity="0.6"/>
  <text class="t" x="280" y="340" font-size="16" fill="var(--page)" text-anchor="middle">試算估值</text>
  <rect x="188" y="372" width="184" height="60" rx="4" fill="var(--accent)" opacity="0.45"/>
  <text class="t" x="280" y="409" font-size="16" fill="var(--page)" text-anchor="middle">問人</text>
  <text class="t" x="280" y="480" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">買進</text>

  <rect x="580" y="140" width="200" height="300" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="588" y="405" width="184" height="27" rx="4" fill="var(--accent)"/>
  <text class="t" x="680" y="424" font-size="15" fill="var(--page)" text-anchor="middle">有準則</text>
  <text class="t" x="680" y="290" font-size="20" fill="var(--dim)" text-anchor="middle">沒想過</text>
  <text class="t" x="680" y="322" font-size="16" fill="var(--grey)" text-anchor="middle">走一步算一步</text>
  <text class="t" x="680" y="480" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">賣出</text>

  <text class="t" x="60" y="536" font-size="22" font-weight="700" fill="var(--ink)">功課全做在一端</text>
</svg>
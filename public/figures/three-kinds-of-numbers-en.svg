<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three boxes from different sources feed arrows into one shared result box.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">Three origins, one look</text>

<rect x="60" y="118" width="320" height="92" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="60" y="238" width="320" height="92" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="60" y="358" width="320" height="92" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

<text x="86" y="154" font-size="20" font-weight="600" fill="var(--ink)">Published</text>
<text x="86" y="186" font-size="15" fill="var(--dim)">Run rates, output, imports and exports</text>
<text x="86" y="274" font-size="20" font-weight="600" fill="var(--ink)">Derived</text>
<text x="86" y="306" font-size="15" fill="var(--dim)">Net imports + output − refinery runs</text>
<text x="86" y="394" font-size="20" font-weight="600" fill="var(--ink)">Sampled</text>
<text x="86" y="426" font-size="15" fill="var(--dim)">Satellites read floating-roof tank shadows</text>

<path d="M380 164 L560 270" fill="none" stroke="var(--line)" stroke-width="2"/>
<path d="M380 284 L560 284" fill="none" stroke="var(--line)" stroke-width="2"/>
<path d="M380 404 L560 298" fill="none" stroke="var(--line)" stroke-width="2"/>
<polygon points="566,270 546,262 550,280" fill="var(--dim)"/>
<polygon points="566,284 548,276 548,292" fill="var(--dim)"/>
<polygon points="566,298 550,288 546,306" fill="var(--dim)"/>

<text x="466" y="200" font-size="15" fill="var(--dim)" text-anchor="middle">Small error</text>
<text x="466" y="272" font-size="15" fill="var(--dim)" text-anchor="middle">Medium error</text>
<text x="466" y="372" font-size="15" fill="var(--dim)" text-anchor="middle">Large error</text>

<rect x="580" y="224" width="320" height="120" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="740" y="278" font-size="20" font-weight="600" fill="var(--accent)" text-anchor="middle">One number + one unit</text>
<text x="740" y="312" font-size="16" fill="var(--ink)" text-anchor="middle">Identical in a news story</text>

<text x="60" y="510" font-size="22" font-weight="600" fill="var(--ink)">Before citing it, ask which kind it is</text>
</svg>
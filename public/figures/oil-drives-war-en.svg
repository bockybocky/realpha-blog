<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The arrow runs left to right in the top row and right to left in the bottom, reversing the causation between the same two blocks.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <defs>
    <marker id="oilArrowA" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="var(--accent)"/>
    </marker>
    <marker id="oilArrowB" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="var(--warn)"/>
    </marker>
  </defs>
  <text x="60" y="54" font-size="27" fill="var(--ink)">Which one is the independent variable</text>

  <rect x="70" y="96" width="820" height="210" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="100" y="130" font-size="19" fill="var(--dim)">Now</text>
  <rect x="140" y="150" width="190" height="76" rx="10" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text x="235" y="196" font-size="20" fill="var(--ink)" text-anchor="middle">Oil price</text>
  <line x1="350" y1="188" x2="585" y2="188" stroke="var(--accent)" stroke-width="5" marker-end="url(#oilArrowA)"/>
  <text x="467" y="172" font-size="16" fill="var(--dim)" text-anchor="middle">drives</text>
  <rect x="600" y="150" width="230" height="76" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="715" y="196" font-size="20" fill="var(--ink)" text-anchor="middle">Fight or talk</text>
  <line x1="140" y1="262" x2="470" y2="262" stroke="var(--line)" stroke-width="3"/>
  <circle cx="180" cy="262" r="6" fill="var(--accent)"/>
  <circle cx="430" cy="262" r="6" fill="var(--accent)"/>
  <text x="180" y="288" font-size="15" fill="var(--dim)" text-anchor="middle">$70 hard line</text>
  <text x="430" y="288" font-size="15" fill="var(--dim)" text-anchor="middle">$100 wants to talk</text>

  <rect x="70" y="330" width="820" height="150" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="100" y="364" font-size="19" fill="var(--warn)">Reversed</text>
  <rect x="140" y="386" width="190" height="70" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="235" y="428" font-size="20" fill="var(--ink)" text-anchor="middle">Oil price</text>
  <line x1="585" y1="421" x2="350" y2="421" stroke="var(--warn)" stroke-width="5" marker-end="url(#oilArrowB)"/>
  <text x="467" y="405" font-size="16" fill="var(--dim)" text-anchor="middle">drives</text>
  <rect x="600" y="386" width="230" height="70" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
  <text x="715" y="428" font-size="20" fill="var(--ink)" text-anchor="middle">Inventories bottom out</text>
</svg>
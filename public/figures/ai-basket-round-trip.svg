<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條曲線先倍增後完整回到起點，旁邊五條細線同時下彎">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="64" font-size="27" fill="var(--ink)">漲回去的那一整段，原路還回來</text>

<rect x="60" y="96" width="840" height="300" fill="var(--card)" rx="10"/>
<line x1="100" y1="340" x2="880" y2="340" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="100" y="362" font-size="16" fill="var(--dim)">年初</text>
<text x="100" y="150" font-size="16" fill="var(--dim)">接近一倍</text>
<polyline points="100,340 200,290 300,240 400,190 500,160 560,164 640,220 720,270 800,310 880,338" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="520" cy="158" r="6" fill="var(--accent)"/>
<text x="492" y="138" font-size="16" fill="var(--ink)">6 月底</text>
<polyline points="560,180 640,232 720,276 800,308 880,330" fill="none" stroke="var(--grey)" stroke-width="2"/>
<polyline points="560,196 640,246 720,288 800,318 880,344" fill="none" stroke="var(--grey)" stroke-width="2"/>
<polyline points="560,212 640,262 720,300 800,330 880,354" fill="none" stroke="var(--grey)" stroke-width="2"/>
<polyline points="560,228 640,276 720,314 800,342 880,364" fill="none" stroke="var(--grey)" stroke-width="2"/>

<text x="60" y="448" font-size="20" fill="var(--dim)">半導體 · 新雲端 · 電力基建 · 記憶體 · 矽光子</text>
<text x="60" y="500" font-size="22" fill="var(--ink)">一群標的同時動，動的是資金成本那一層</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Length comparison: the shelf makes the getting-it bar very short, but the choosing-chapters bar is the longest and is not shortened at all.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">Which part the button shortens</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">Longer bar = more time spent</text>

<text class="t" x="60" y="166" font-size="19" fill="var(--dim)">Getting it (on your own)</text>
<rect x="300" y="146" width="300" height="28" rx="4" fill="var(--grey)"/>
<text class="t" x="616" y="166" font-size="15" fill="var(--dim)">Find site, download, upload</text>

<text class="t" x="60" y="238" font-size="19" fill="var(--ink)">Getting it (shelf button)</text>
<rect x="300" y="218" width="60" height="28" rx="4" fill="var(--accent)"/>
<text class="t" x="376" y="238" font-size="15" fill="var(--accent)">One step</text>

<line x1="300" y1="276" x2="860" y2="276" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="60" y="344" font-size="19" fill="var(--ink)" font-weight="700">Choosing</text>
<rect x="300" y="324" width="600" height="28" rx="4" fill="var(--warn)"/>
<text class="t" x="300" y="384" font-size="16" fill="var(--dim)">Which chapters should I read?　No button for this</text>

<text class="t" x="60" y="466" font-size="22" font-weight="700" fill="var(--ink)">Getting it is saved; choosing is not</text>
</svg>
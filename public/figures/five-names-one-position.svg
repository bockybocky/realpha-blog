<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="一條線穿過五個並排的方塊，底部大括號把五格標成一個部位">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<text class="t" x="48" y="62">五個名字，一條理由</text>
<rect x="60" y="150" width="150" height="130" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="240" y="150" width="150" height="130" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="420" y="150" width="150" height="130" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="600" y="150" width="150" height="130" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="780" y="150" width="150" height="130" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="60" y1="215" x2="930" y2="215" stroke="var(--warn)" stroke-width="8"/>
<text class="g" x="60" y="130" fill="var(--warn)">資金成本</text>
<path d="M60 320 L60 348 L930 348 L930 320" fill="none" stroke="var(--dim)" stroke-width="3"/>
<path d="M495 348 L495 376" stroke="var(--dim)" stroke-width="3"/>
<text class="g" x="430" y="408">一個部位</text>
<text class="c" x="48" y="462">分散要問的是：會不會同一天被同一個理由賣掉</text>
</svg>
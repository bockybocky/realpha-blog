<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two blocks in an adversarial loop on the left, and four frames whose noise clears step by step on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">Adversarial, and denoising</text>
<line x1="480" y1="100" x2="480" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="60" y="130">GAN</text>
<rect x="60" y="170" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="140" y="217" text-anchor="middle">Generator</text>
<rect x="290" y="170" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="370" y="217" text-anchor="middle">Discriminator</text>
<line x1="222" y1="196" x2="282" y2="196" stroke="var(--accent)" stroke-width="2" marker-end="url(#a2)"/>
<text class="s" x="252" y="182" text-anchor="middle">Fake image</text>
<path d="M370 254 L370 320 L140 320 L140 254" stroke="var(--accent)" stroke-width="2" fill="none" marker-end="url(#a2)"/>
<text class="s" x="255" y="342" text-anchor="middle">Real or fake</text>
<text class="b" x="60" y="400">The two chase each other</text>
<text class="g" x="520" y="130">Diffusion</text>
<rect x="520" y="170" width="80" height="80" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="537" cy="188" r="3" fill="var(--grey)"/><circle cx="562" cy="180" r="3" fill="var(--grey)"/><circle cx="585" cy="196" r="3" fill="var(--grey)"/><circle cx="530" cy="212" r="3" fill="var(--grey)"/><circle cx="556" cy="206" r="3" fill="var(--grey)"/><circle cx="578" cy="222" r="3" fill="var(--grey)"/><circle cx="541" cy="236" r="3" fill="var(--grey)"/><circle cx="568" cy="242" r="3" fill="var(--grey)"/><circle cx="592" cy="234" r="3" fill="var(--grey)"/><circle cx="548" cy="196" r="3" fill="var(--grey)"/><circle cx="592" cy="210" r="3" fill="var(--grey)"/><circle cx="527" cy="228" r="3" fill="var(--grey)"/>
<rect x="620" y="170" width="80" height="80" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="640" cy="192" r="3" fill="var(--grey)"/><circle cx="668" cy="184" r="3" fill="var(--grey)"/><circle cx="686" cy="212" r="3" fill="var(--grey)"/><circle cx="634" cy="222" r="3" fill="var(--grey)"/><circle cx="660" cy="234" r="3" fill="var(--grey)"/><circle cx="690" cy="238" r="3" fill="var(--grey)"/>
<circle cx="660" cy="210" r="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="720" y="170" width="80" height="80" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="742" cy="188" r="3" fill="var(--grey)"/><circle cx="784" cy="232" r="3" fill="var(--grey)"/><circle cx="736" cy="236" r="3" fill="var(--grey)"/>
<circle cx="760" cy="210" r="20" fill="none" stroke="var(--accent)" stroke-width="2"/>
<rect x="820" y="170" width="80" height="80" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="860" cy="210" r="24" fill="none" stroke="var(--accent)" stroke-width="3"/>
<line x1="602" y1="210" x2="616" y2="210" stroke="var(--accent)" stroke-width="2" marker-end="url(#a2)"/>
<line x1="702" y1="210" x2="716" y2="210" stroke="var(--accent)" stroke-width="2" marker-end="url(#a2)"/>
<line x1="802" y1="210" x2="816" y2="210" stroke="var(--accent)" stroke-width="2" marker-end="url(#a2)"/>
<text class="s" x="560" y="285" text-anchor="middle">Noise</text>
<text class="s" x="860" y="285" text-anchor="middle">Image</text>
<text class="b" x="520" y="400">Take the noise out step by step</text>
<text class="c" x="60" y="500">One works by catching errors, one by cleaning up</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="In one bar, a thin sliver runs up to the news headline while the long remainder fans down to mortgages, corporate borrowing and cash-flow discounting.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">The bit in the headlines is too thin to see</text>
  <text x="120" y="108" font-size="15" fill="var(--dim)">New issuance mix</text>
  <line x1="838" y1="118" x2="838" y2="92" stroke="var(--warn)" stroke-width="2"/>
  <text x="900" y="88" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="end">30-year 1%</text>
  <rect x="120" y="126" width="713" height="44" fill="var(--accent)"/>
  <rect x="833" y="126" width="7" height="44" fill="var(--warn)"/>
  <text x="120" y="200" font-size="20" font-weight="700" fill="var(--accent)">10-year</text>
  <line x1="240" y1="170" x2="180" y2="286" stroke="var(--grey)" stroke-width="2"/>
  <line x1="400" y1="170" x2="368" y2="286" stroke="var(--grey)" stroke-width="2"/>
  <line x1="560" y1="170" x2="576" y2="286" stroke="var(--grey)" stroke-width="2"/>
  <line x1="838" y1="170" x2="838" y2="286" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="94" y="288" width="172" height="72" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="180" y="332" font-size="19" fill="var(--ink)" text-anchor="middle">Mortgages</text>
  <rect x="282" y="288" width="172" height="72" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="368" y="332" font-size="19" fill="var(--ink)" text-anchor="middle">Corporate borrowing</text>
  <rect x="470" y="288" width="212" height="72" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="576" y="332" font-size="19" fill="var(--ink)" text-anchor="middle">Discounting cash flows</text>
  <rect x="754" y="288" width="168" height="72" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="838" y="332" font-size="19" fill="var(--warn)" text-anchor="middle">Headline</text>
  <text x="480" y="452" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">The news picks the biggest number; pick the one wired to you</text>
</svg>
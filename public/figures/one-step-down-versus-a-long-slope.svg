<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條持續往右上走的線，中途被一個一次性的垂直落差往下拉一階，之後照樣繼續往上升" font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">一次性的台階，遇上一直走的斜坡</text>

<line x1="160" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="160" y1="120" x2="160" y2="460" stroke="var(--line)" stroke-width="2"/>
<text x="160" y="106" font-size="16" fill="var(--dim)" text-anchor="middle">用量</text>
<text x="890" y="486" font-size="16" fill="var(--dim)" text-anchor="end">時間</text>

<polyline points="180,420 330,392 480,358 630,300 780,230 880,160" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6"/>
<polyline points="180,420 330,392 480,358" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="480,418 630,360 780,290 880,220" fill="none" stroke="var(--accent)" stroke-width="4"/>
<line x1="480" y1="358" x2="480" y2="418" stroke="var(--warn)" stroke-width="4"/>

<line x1="452" y1="358" x2="452" y2="418" stroke="var(--warn)" stroke-width="1.5"/>
<polygon points="452,358 447,370 457,370" fill="var(--warn)"/>
<polygon points="452,418 447,406 457,406" fill="var(--warn)"/>
<text x="438" y="394" font-size="20" fill="var(--warn)" text-anchor="end">效率改善</text>

<text x="810" y="196" font-size="16" fill="var(--dim)" text-anchor="end">原本的路徑</text>
<text x="800" y="268" font-size="20" fill="var(--accent)" text-anchor="end">省完之後</text>

<text x="480" y="520" font-size="22" fill="var(--ink)" text-anchor="middle">台階只有一階，斜坡沒有停</text>
</svg>
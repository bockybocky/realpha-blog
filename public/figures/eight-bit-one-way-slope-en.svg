<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A five-step slope where every step leads only downward and none leads back.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">One step, one slope</text>
  <rect x="60" y="100" width="300" height="56" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="80" y="136">talk abroad</text>
  <rect x="190" y="186" width="300" height="56" rx="6" fill="var(--warn)"/>
  <text class="g" x="210" y="222" fill="var(--page)">go 8-bit</text>
  <rect x="320" y="272" width="300" height="56" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="340" y="308">cheap to match</text>
  <rect x="450" y="358" width="300" height="56" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="470" y="394">lib pool</text>
  <rect x="580" y="444" width="300" height="56" rx="6" fill="var(--accent)"/>
  <text class="g" x="600" y="480" fill="var(--page)">no redo</text>
  <g stroke="var(--dim)" stroke-width="3" fill="none">
    <path d="M190 156 L200 180"/>
    <path d="M200 180 l-10 -4 M200 180 l2 -11"/>
    <path d="M320 242 L330 266"/>
    <path d="M330 266 l-10 -4 M330 266 l2 -11"/>
    <path d="M450 328 L460 352"/>
    <path d="M460 352 l-10 -4 M460 352 l2 -11"/>
    <path d="M580 414 L590 438"/>
    <path d="M590 438 l-10 -4 M590 438 l2 -11"/>
  </g>
  <text class="c" x="60" y="500">No arrow back</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A blank between two points on the left, and three different routes between the same points on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56">Two kinds of training data: just the ends, or the middle too</text>

  <rect x="60" y="100" width="400" height="330" rx="14" fill="var(--card)"/>
  <rect x="500" y="100" width="400" height="330" rx="14" fill="var(--card)"/>
  <text class="g" x="88" y="140">Work already done well</text>
  <text class="g" x="528" y="140">All real work</text>

  <line x1="130" y1="270" x2="390" y2="270" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 9"/>
  <circle cx="130" cy="270" r="12" fill="var(--grey)"/>
  <circle cx="390" cy="270" r="12" fill="var(--grey)"/>
  <text class="s" x="130" y="310" text-anchor="middle">Start</text>
  <text class="s" x="390" y="310" text-anchor="middle">End</text>
  <text class="s" x="260" y="240" text-anchor="middle">Blank</text>
  <text class="s" x="88" y="404">Results only</text>

  <path d="M570 270 C640 190 760 190 830 270" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M570 270 C650 250 750 300 830 270" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M570 270 C640 360 760 350 830 270" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="570" cy="270" r="12" fill="var(--accent)"/>
  <circle cx="830" cy="270" r="12" fill="var(--accent)"/>
  <text class="s" x="570" y="330" text-anchor="middle">Start</text>
  <text class="s" x="830" y="330" text-anchor="middle">End</text>
  <text class="s" x="528" y="404">The routes walked as well</text>

  <text class="c" x="60" y="500">Not how much data, but whether the middle is in it</text>
</svg>
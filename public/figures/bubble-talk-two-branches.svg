<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一個起點分出一細一粗兩條岔路">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">同一句話，兩種去向</text>

<rect x="330" y="100" width="300" height="72" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="146" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">「這是泡沫」</text>

<path d="M 480 172 L 480 224 L 250 224 L 250 288" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
<path d="M 480 172 L 480 224 L 710 224 L 710 288" fill="none" stroke="var(--accent)" stroke-width="9"/>

<rect x="110" y="288" width="280" height="164" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="250" y="330" font-size="19" font-weight="600" fill="var(--dim)" text-anchor="middle">什麼也沒改變</text>
<text x="250" y="366" font-size="16" fill="var(--dim)" text-anchor="middle">照樣接單</text>
<text x="250" y="396" font-size="16" fill="var(--dim)" text-anchor="middle">照樣上工</text>
<text x="250" y="432" font-size="16" font-weight="600" fill="var(--grey)" text-anchor="middle">資訊量 ≈ 0</text>

<rect x="570" y="288" width="280" height="164" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="710" y="330" font-size="19" font-weight="600" fill="var(--accent)" text-anchor="middle">把話變成成本</text>
<text x="710" y="366" font-size="16" fill="var(--ink)" text-anchor="middle">縮短合約年限</text>
<text x="710" y="396" font-size="16" fill="var(--ink)" text-anchor="middle">要求提前付款</text>
<text x="710" y="426" font-size="16" fill="var(--ink)" text-anchor="middle">拒絕擴廠</text>

<text x="480" y="520" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">看他因此做了什麼不同的事</text>
</svg>
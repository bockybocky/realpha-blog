<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Left-right bar chart: company numbers grow rightward, Home Depot's stock and staff per store shrink leftward, Lowe's stock is the longest bar">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .v { font-size:19px; font-weight:700; }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="40" y="56" class="t">Under Nardelli: numbers doubled, stock fell</text>
<text x="40" y="118" class="b">Company numbers</text>
<line x1="400" y1="126" x2="400" y2="510" stroke="var(--grey)" stroke-width="2"/>
<text x="40" y="170" class="g">Revenue</text>
<rect x="400" y="140" width="260" height="44" fill="var(--accent)"/>
<text x="670" y="170" class="v">+100%</text>
<text x="40" y="240" class="g">Store count</text>
<rect x="400" y="210" width="213" height="44" fill="var(--accent)"/>
<text x="623" y="240" class="v">+82%</text>
<text x="40" y="310" class="g">Staff per store</text>
<rect x="361" y="280" width="39" height="44" fill="var(--warn)"/>
<text x="353" y="310" class="v" text-anchor="end">-15%</text>
<line x1="40" y1="350" x2="920" y2="350" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="40" y="376" class="b">Stock price</text>
<text x="40" y="416" class="g">Home Depot</text>
<rect x="369" y="386" width="31" height="44" fill="var(--warn)"/>
<text x="361" y="416" class="v" text-anchor="end">-12%</text>
<text x="40" y="486" class="g">Lowe's</text>
<rect x="400" y="456" width="450" height="44" fill="var(--grey)"/>
<text x="860" y="486" class="v">+173%</text>
<text x="40" y="560" class="c">Revenue x2, stock -12%</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Position size on the horizontal axis; one curve rises fast then flattens, the other hugs the bottom then shoots up, with a narrow band marked on the left">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="60" y="58" font-size="27" fill="var(--ink)">Size up, you buy something else</text>

  <rect x="150" y="130" width="96" height="300" fill="var(--card)" stroke="var(--line)" stroke-dasharray="7 5"/>
  <text x="198" y="118" font-size="16" fill="var(--dim)" text-anchor="middle">Small enough to ignore</text>

  <line x1="120" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="120" y1="430" x2="120" y2="130" stroke="var(--line)" stroke-width="2"/>
  <text x="900" y="462" font-size="16" fill="var(--dim)" text-anchor="end">Position size</text>

  <path d="M120,428 C 176,240 216,168 300,158 L880,150" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text x="470" y="188" font-size="19" fill="var(--accent)">Attention: fills fast</text>

  <path d="M120,428 C 380,424 580,392 880,182" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <text x="640" y="380" font-size="19" fill="var(--warn)">Bias: hits later</text>

  <text x="60" y="512" font-size="22" fill="var(--ink)">Buy attention, not conviction</text>
</svg>
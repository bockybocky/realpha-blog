<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三組相同形狀的投入與產出高度差並列：原油、大豆、算力，中間那段落差就是價差">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">同一個形狀，換了三種原料</text>

  <g>
    <rect x="60" y="96" width="260" height="300" rx="14" fill="var(--card)"/>
    <rect x="96" y="300" width="80" height="60" rx="6" fill="var(--grey)"/>
    <rect x="212" y="200" width="80" height="160" rx="6" fill="var(--accent)" opacity="0.85"/>
    <line x1="176" y1="300" x2="212" y2="200" stroke="var(--line)" stroke-width="3"/>
    <text class="b" x="96" y="384">原油</text>
    <text class="b" x="212" y="384">成品油</text>
    <text class="g" x="96" y="140">crack</text>
  </g>

  <g>
    <rect x="350" y="96" width="260" height="300" rx="14" fill="var(--card)"/>
    <rect x="386" y="312" width="80" height="48" rx="6" fill="var(--grey)"/>
    <rect x="502" y="224" width="80" height="136" rx="6" fill="var(--accent)" opacity="0.85"/>
    <line x1="466" y1="312" x2="502" y2="224" stroke="var(--line)" stroke-width="3"/>
    <text class="b" x="386" y="384">大豆</text>
    <text class="b" x="502" y="384">豆粕豆油</text>
    <text class="g" x="386" y="140">crush</text>
  </g>

  <g>
    <rect x="640" y="96" width="260" height="300" rx="14" fill="var(--card)"/>
    <rect x="676" y="290" width="80" height="70" rx="6" fill="var(--grey)"/>
    <rect x="792" y="212" width="80" height="148" rx="6" fill="var(--warn)" opacity="0.9"/>
    <line x1="756" y1="290" x2="792" y2="212" stroke="var(--line)" stroke-width="3"/>
    <text class="b" x="676" y="384">租卡成本</text>
    <text class="b" x="792" y="384">賣 token</text>
    <text class="g" x="676" y="140" fill="var(--warn)">crunch</text>
  </g>

  <text class="c" x="60" y="464">中間那段高度差，就是這門生意</text>
  <text class="b" x="60" y="496">能被量出來，就能被交易</text>
</svg>
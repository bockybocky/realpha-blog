<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Four cards, the first three crossed out and the last an empty dashed frame with a question mark.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="480" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">Deleting the wrong ones does not produce the right one</text>

  <rect x="60" y="150" width="195" height="180" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="157" y="216" text-anchor="middle" font-size="19" fill="var(--dim)">US-Iran conflict</text>
  <text x="157" y="252" text-anchor="middle" font-size="16" fill="var(--dim)">Oil did not move</text>
  <line x1="80" y1="170" x2="235" y2="310" stroke="var(--grey)" stroke-width="3"/>

  <rect x="285" y="150" width="195" height="180" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="382" y="216" text-anchor="middle" font-size="19" fill="var(--dim)">Leaner models</text>
  <text x="382" y="252" text-anchor="middle" font-size="16" fill="var(--dim)">Parameters still growing</text>
  <line x1="305" y1="170" x2="460" y2="310" stroke="var(--grey)" stroke-width="3"/>

  <rect x="510" y="150" width="195" height="180" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="607" y="216" text-anchor="middle" font-size="19" fill="var(--dim)">Demand gone</text>
  <text x="607" y="252" text-anchor="middle" font-size="16" fill="var(--dim)">Prices still rising</text>
  <line x1="530" y1="170" x2="685" y2="310" stroke="var(--grey)" stroke-width="3"/>

  <rect x="735" y="150" width="195" height="180" rx="10" fill="none" stroke="var(--dim)" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="832" y="230" text-anchor="middle" font-size="46" font-weight="700" fill="var(--dim)">?</text>
  <text x="832" y="270" text-anchor="middle" font-size="16" fill="var(--dim)">Liquidity</text>

  <text x="480" y="428" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">What is left is often just I do not know</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-label="Two seating grids side by side: the left has only the front three rows filled and empty back rows, while the right is completely full and mixed with many people from finance.">

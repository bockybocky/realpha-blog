<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="五個節點組成的封閉迴圈，只有環外一個虛線框是出口">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<defs>
<marker id="arw4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
</marker>
<marker id="arw4b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/>
</marker>
</defs>
<text x="60" y="52" font-size="27" fill="var(--ink)">會自己收緊的環</text>
<circle cx="420" cy="310" r="170" fill="none" stroke="var(--line)" stroke-width="2"/>
<path d="M484 150 A 180 180 0 0 1 574 254" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#arw4)"/>
<path d="M584 300 A 180 180 0 0 1 500 440" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#arw4)"/>
<path d="M440 476 A 180 180 0 0 1 300 452" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#arw4)"/>
<path d="M254 420 A 180 180 0 0 1 244 288" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#arw4)"/>
<path d="M264 220 A 180 180 0 0 1 356 150" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#arw4)"/>
<rect x="340" y="110" width="160" height="46" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="420" y="140" font-size="19" fill="var(--ink)" text-anchor="middle">量不足</text>
<rect x="500" y="248" width="160" height="46" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="580" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">良率卡住</text>
<rect x="430" y="420" width="160" height="46" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="510" y="450" font-size="19" fill="var(--ink)" text-anchor="middle">成本流血</text>
<rect x="250" y="420" width="160" height="46" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="330" y="450" font-size="19" fill="var(--ink)" text-anchor="middle">不敢投錢</text>
<rect x="180" y="248" width="160" height="46" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="260" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">學習停滯</text>
<path d="M662 262 L730 200" stroke="var(--warn)" stroke-width="3" fill="none" marker-end="url(#arw4b)"/>
<rect x="710" y="118" width="210" height="76" rx="10" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text x="815" y="150" font-size="19" fill="var(--warn)" text-anchor="middle">外部客戶</text>
<text x="815" y="176" font-size="19" fill="var(--warn)" text-anchor="middle">另一頭現金牛</text>
<text x="60" y="544" font-size="22" fill="var(--ink)">唯一的出口在環外</text>
</svg>
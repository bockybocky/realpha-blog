<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="指數刻度由五萬點往下落到半腰的兩萬多點，更下方的幾千點區被劃掉">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">上去的方式，決定下來的方式</text>

  <rect x="300" y="110" width="300" height="200" fill="var(--card)"/>
  <line x1="260" y1="130" x2="700" y2="130" stroke="var(--line)" stroke-width="2"/>
  <line x1="260" y1="310" x2="700" y2="310" stroke="var(--line)" stroke-width="2"/>
  <line x1="260" y1="470" x2="700" y2="470" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="240" y="124" font-size="20" text-anchor="end" fill="var(--ink)">5 萬點</text>
  <text class="t" x="240" y="304" font-size="20" text-anchor="end" fill="var(--warn)">2 萬多點</text>
  <text class="t" x="240" y="464" font-size="20" text-anchor="end" fill="var(--grey)">幾千點</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--warn)"/>
    </marker>
  </defs>
  <line x1="450" y1="140" x2="450" y2="296" stroke="var(--warn)" stroke-width="6" marker-end="url(#ar)"/>
  <text class="t" x="470" y="215" font-size="20" font-weight="700" fill="var(--warn)">回五成</text>
  <text class="t" x="470" y="245" font-size="16" fill="var(--dim)">會死一堆人</text>

  <line x1="300" y1="440" x2="700" y2="500" stroke="var(--grey)" stroke-width="4"/>
  <line x1="300" y1="500" x2="700" y2="440" stroke="var(--grey)" stroke-width="4"/>
  <text class="t" x="720" y="465" font-size="19" fill="var(--grey)">幻想的撿貨位置</text>
  <text class="t" x="720" y="492" font-size="16" fill="var(--dim)">他說不會到</text>

  <text class="t" x="60" y="530" font-size="22" font-weight="700" fill="var(--ink)">幅度有講，時間沒講 —— 所以是準備，不是等訊號</text>
</svg>
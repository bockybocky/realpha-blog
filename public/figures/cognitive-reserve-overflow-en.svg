<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two containers hold pathology at the same level: the short container overflows and is labeled symptoms, while the tall container leaves a gap above the waterline labeled reserve.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
  <marker id="arrAcc5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
  </marker>
</defs>
<text x="60" y="52" font-size="27" fill="var(--ink)">Same pathology, different reserve</text>

<line x1="140" y1="250" x2="880" y2="250" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="140" y="236" font-size="15" fill="var(--dim)">Pathology: nearly everyone has it</text>

<rect x="240" y="250" width="180" height="210" fill="var(--grey)"/>
<path d="M240 292 L240 460 L420 460 L420 292" fill="none" stroke="var(--ink)" stroke-width="3"/>
<text x="330" y="224" font-size="19" fill="var(--warn)" text-anchor="middle">Overflow = symptoms</text>

<rect x="560" y="250" width="180" height="210" fill="var(--grey)"/>
<path d="M560 150 L560 460 L740 460 L740 150" fill="none" stroke="var(--ink)" stroke-width="3"/>
<line x1="650" y1="250" x2="650" y2="156" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrAcc5)"/>
<text x="770" y="205" font-size="19" fill="var(--accent)">Reserve</text>

<text x="330" y="492" font-size="19" fill="var(--dim)" text-anchor="middle">Low reserve</text>
<text x="650" y="492" font-size="19" fill="var(--dim)" text-anchor="middle">High reserve</text>

<text x="140" y="524" font-size="15" fill="var(--dim)">Highest-risk group: 43 percent fall ill</text>
<text x="880" y="524" font-size="15" fill="var(--dim)" text-anchor="end">Best-marker group: still 5 percent</text>

<text x="480" y="560" font-size="22" fill="var(--ink)" text-anchor="middle">The layer in between decides whether symptoms show</text>
</svg>
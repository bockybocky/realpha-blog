<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Only eight slots surround the compute die, with six HBM and two HBF modules occupying every position while additional capacity remains stranded outside." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Only eight shoreline slots</text>
<rect x="150" y="120" width="660" height="320" rx="14" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>
<text x="480" y="150" font-size="20" fill="var(--dim)" text-anchor="middle">Shoreline</text>
<rect x="390" y="190" width="180" height="200" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="480" y="298" font-size="19" fill="var(--ink)" text-anchor="middle">Compute die</text>
<rect x="240" y="190" width="120" height="40" rx="6" fill="var(--accent)"/>
<text x="300" y="217" font-size="15" fill="var(--page)" text-anchor="middle">HBM</text>
<rect x="240" y="243" width="120" height="40" rx="6" fill="var(--accent)"/>
<text x="300" y="270" font-size="15" fill="var(--page)" text-anchor="middle">HBM</text>
<rect x="240" y="296" width="120" height="40" rx="6" fill="var(--accent)"/>
<text x="300" y="323" font-size="15" fill="var(--page)" text-anchor="middle">HBM</text>
<rect x="240" y="349" width="120" height="40" rx="6" fill="var(--accent)"/>
<text x="300" y="376" font-size="15" fill="var(--page)" text-anchor="middle">HBM</text>
<rect x="600" y="190" width="120" height="40" rx="6" fill="var(--accent)"/>
<text x="660" y="217" font-size="15" fill="var(--page)" text-anchor="middle">HBM</text>
<rect x="600" y="243" width="120" height="40" rx="6" fill="var(--accent)"/>
<text x="660" y="270" font-size="15" fill="var(--page)" text-anchor="middle">HBM</text>
<rect x="600" y="296" width="120" height="40" rx="6" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="660" y="323" font-size="15" fill="var(--ink)" text-anchor="middle">HBF</text>
<rect x="600" y="349" width="120" height="40" rx="6" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="660" y="376" font-size="15" fill="var(--ink)" text-anchor="middle">HBF</text>
<rect x="820" y="243" width="110" height="146" rx="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text x="875" y="310" font-size="15" fill="var(--dim)" text-anchor="middle">More capacity</text>
<text x="875" y="334" font-size="15" fill="var(--dim)" text-anchor="middle">Stranded</text>
<line x1="815" y1="316" x2="745" y2="316" stroke="var(--grey)" stroke-width="2"/>
<polygon points="745,310 731,316 745,322" fill="var(--grey)"/>
<text x="60" y="500" font-size="22" fill="var(--ink)">Capacity can stack; shoreline width cannot</text>
</svg>
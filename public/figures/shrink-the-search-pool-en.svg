<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Dots are sparse in the large circle, and dense in the small circle inside it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .sub { font-size:16px; fill:var(--dim); }
    .grp { font-size:19px; fill:var(--ink); }
    .dimtxt { font-size:15px; fill:var(--dim); }
    .concl { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="62">Where you fish comes before how well you fish</text>
  <text class="sub" x="60" y="92">Different starting pool, different signal density</text>

  <circle cx="400" cy="320" r="180" fill="var(--card)" stroke="var(--grey)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text class="grp" x="400" y="160" text-anchor="middle" fill="var(--dim)">Every stock ever mentioned</text>
  <text class="dimtxt" x="400" y="528" text-anchor="middle">Tickers tossed around on financial TV</text>

  <circle cx="300" cy="250" r="5" fill="var(--grey)"/>
  <circle cx="352" cy="204" r="5" fill="var(--grey)"/>
  <circle cx="268" cy="330" r="5" fill="var(--grey)"/>
  <circle cx="318" cy="392" r="5" fill="var(--grey)"/>
  <circle cx="392" cy="430" r="5" fill="var(--grey)"/>
  <circle cx="246" cy="286" r="5" fill="var(--grey)"/>
  <circle cx="420" cy="196" r="5" fill="var(--grey)"/>
  <circle cx="366" cy="286" r="5" fill="var(--grey)"/>
  <circle cx="290" cy="440" r="5" fill="var(--grey)"/>
  <circle cx="470" cy="452" r="5" fill="var(--grey)"/>
  <circle cx="330" cy="316" r="5" fill="var(--grey)"/>
  <circle cx="240" cy="380" r="5" fill="var(--grey)"/>
  <circle cx="404" cy="356" r="5" fill="var(--grey)"/>
  <circle cx="452" cy="240" r="5" fill="var(--grey)"/>

  <circle cx="500" cy="330" r="86" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="470" cy="300" r="5" fill="var(--accent)"/>
  <circle cx="500" cy="286" r="5" fill="var(--accent)"/>
  <circle cx="528" cy="308" r="5" fill="var(--accent)"/>
  <circle cx="464" cy="336" r="5" fill="var(--accent)"/>
  <circle cx="498" cy="340" r="5" fill="var(--accent)"/>
  <circle cx="534" cy="352" r="5" fill="var(--accent)"/>
  <circle cx="478" cy="372" r="5" fill="var(--accent)"/>
  <circle cx="512" cy="382" r="5" fill="var(--accent)"/>
  <circle cx="544" cy="326" r="5" fill="var(--accent)"/>
  <circle cx="486" cy="312" r="5" fill="var(--accent)"/>

  <line x1="586" y1="330" x2="660" y2="330" stroke="var(--accent)" stroke-width="2"/>
  <text class="grp" x="672" y="288" fill="var(--accent)">The 200 already rising</text>
  <text class="dimtxt" x="672" y="320">Price rising</text>
  <text class="dimtxt" x="672" y="346">Valuation rerating up</text>
  <text class="dimtxt" x="672" y="372">Earnings growing</text>
  <text class="dimtxt" x="672" y="398">Someone accumulating</text>

  <text class="concl" x="60" y="524">Shrinking the pool is not chasing</text>
</svg>
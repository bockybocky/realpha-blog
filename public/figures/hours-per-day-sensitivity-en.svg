<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars; the right one, for round-the-clock use, is twelve times taller than the left one for two hours.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:20px; fill:var(--ink); font-weight:600; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="48" y="58">The whole estimate hangs on hours per day</text>
<line x1="48" y1="430" x2="912" y2="430" stroke="var(--line)" stroke-width="3"/>
<rect x="180" y="404" width="160" height="26" fill="var(--grey)"/>
<text class="b" x="190" y="392">8.33M</text>
<text class="g" x="190" y="466">2 hours a day</text>
<rect x="600" y="118" width="160" height="312" fill="var(--warn)"/>
<text class="b" x="610" y="106">100M</text>
<text class="g" x="610" y="466">Running all day</text>
<text class="c" x="48" y="516">Same math, one assumption, twelve times apart</text>
</svg>
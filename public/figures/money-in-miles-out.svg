<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="金額方塊很大，對應的里程線段極短或為零">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="48" y="62" font-size="27" fill="var(--ink)" font-weight="700">投入看得見，蓋出來的線看不見</text>
<text x="48" y="100" font-size="16" fill="var(--dim)">左＝投入金額　右＝多出來的鐵路里程</text>

<text x="48" y="150" font-size="20" fill="var(--ink)" font-weight="700">第二大道地鐵</text>
<text x="48" y="176" font-size="15" fill="var(--dim)">五十年</text>
<rect x="210" y="128" width="120" height="58" rx="6" fill="var(--grey)"/>
<text x="210" y="208" font-size="16" fill="var(--dim)">四十億美元以上</text>
<line x1="660" y1="157" x2="700" y2="157" stroke="var(--accent)" stroke-width="10"/>
<text x="660" y="208" font-size="16" fill="var(--dim)">一英里半</text>

<line x1="48" y1="250" x2="912" y2="250" stroke="var(--line)" stroke-width="1"/>

<text x="48" y="310" font-size="20" fill="var(--ink)" font-weight="700">加州</text>
<text x="48" y="336" font-size="15" fill="var(--dim)">十年</text>
<rect x="210" y="288" width="450" height="58" rx="6" fill="var(--grey)"/>
<text x="210" y="368" font-size="16" fill="var(--dim)">約一百五十億美元</text>
<circle cx="680" cy="317" r="11" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text x="660" y="368" font-size="16" fill="var(--dim)">零英里</text>

<rect x="48" y="420" width="864" height="78" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="76" y="468" font-size="22" fill="var(--ink)">一九二○年代，護欄同樣在，他蓋成了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="容量越大成本未必越高：第三階最貴，第四階反而便宜，硬體廠卻停在最貴的第三階">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .a { font-size:16px; fill:var(--accent); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">價格沒有跟著容量一路往上</text>
  <text class="b" x="60" y="94">縱軸＝單價高低（示意）　橫軸＝容量級距</text>

  <line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>

  <rect x="160" y="300" width="110" height="140" fill="var(--grey)" rx="4"/>
  <rect x="330" y="250" width="110" height="190" fill="var(--grey)" rx="4"/>
  <rect x="500" y="180" width="110" height="260" fill="var(--accent)" rx="4"/>
  <rect x="670" y="270" width="110" height="170" fill="var(--grey)" rx="4"/>

  <text class="g" x="215" y="472" text-anchor="middle">小</text>
  <text class="g" x="385" y="472" text-anchor="middle">中</text>
  <text class="g" x="555" y="472" text-anchor="middle">大</text>
  <text class="g" x="725" y="472" text-anchor="middle">更大</text>

  <text class="a" x="555" y="162" text-anchor="middle">硬體廠停在這</text>
  <text class="b" x="725" y="252" text-anchor="middle">更大卻更便宜</text>
  <text class="b" x="725" y="228" text-anchor="middle">沒人跳上去</text>

  <line x1="640" y1="215" x2="700" y2="245" stroke="var(--dim)" stroke-width="2"/>
  <text class="b" x="60" y="512">漲價集中在被刻意避開的那一階</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一個繞行動作，在分界線外側箭頭指向外，在內側箭頭反過來指向重物">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:15px; fill:var(--dim); }
    .w { font-size:16px; fill:var(--warn); font-weight:700; }
    .a { font-size:16px; fill:var(--accent); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z" fill="var(--accent)"/>
    </marker>
    <marker id="wh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z" fill="var(--warn)"/>
    </marker>
  </defs>
  <text class="t" x="60" y="56">同一個繞行，過了線就換符號</text>

  <circle cx="120" cy="290" r="46" fill="var(--grey)"/>
  <text class="s" x="120" y="368" text-anchor="middle">重物</text>

  <line x1="120" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="s" x="880" y="470" text-anchor="end">離重物越來越遠</text>

  <line x1="420" y1="120" x2="420" y2="440" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
  <text class="w" x="432" y="146">分界線</text>

  <ellipse cx="290" cy="272" rx="52" ry="30" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <circle cx="342" cy="272" r="7" fill="var(--ink)"/>
  <line x1="290" y1="330" x2="230" y2="368" stroke="var(--warn)" stroke-width="4" marker-end="url(#wh)"/>
  <text class="w" x="196" y="398">往裡拉</text>
  <text class="s" x="290" y="222" text-anchor="middle">繞得越快越糟</text>

  <ellipse cx="660" cy="272" rx="52" ry="30" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <circle cx="712" cy="272" r="7" fill="var(--ink)"/>
  <line x1="660" y1="330" x2="740" y2="374" stroke="var(--accent)" stroke-width="4" marker-end="url(#ah)"/>
  <text class="a" x="748" y="398">往外推</text>
  <text class="s" x="660" y="222" text-anchor="middle">繞得越快越安全</text>

  <text class="c" x="60" y="516">遠處保命的機制，近處反過來害你</text>
</svg>
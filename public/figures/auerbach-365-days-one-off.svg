<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="365 格的年曆，幾乎全部塗滿，只有靠近年底的一格留白">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<defs>
<pattern id="day" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="13" height="13" rx="2" fill="var(--accent)"/></pattern>
</defs>
<text x="40" y="52" font-size="27" font-weight="700">奧爾巴赫的一年</text>
<rect x="64" y="176" width="832" height="112" fill="url(#day)"/>
<rect x="896" y="176" width="13" height="13" rx="2" fill="var(--accent)"/>
<rect x="880" y="224" width="13" height="13" rx="2" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<line x1="886" y1="220" x2="886" y2="140" stroke="var(--warn)" stroke-width="2"/>
<text x="880" y="128" font-size="19" font-weight="700" text-anchor="end" style="fill:var(--warn)">聖誕節・布萊頓</text>
<rect x="64" y="340" width="20" height="20" rx="3" fill="var(--accent)"/>
<text x="96" y="357" font-size="19">畫畫　364 天</text>
<rect x="330" y="340" width="20" height="20" rx="3" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text x="362" y="357" font-size="19">休息　1 天</text>
<text x="480" y="450" font-size="22" font-weight="700" text-anchor="middle">其他日子，全部擋掉</text>
</svg>
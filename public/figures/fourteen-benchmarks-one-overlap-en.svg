<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two overlapping sets, thirteen cells on the left, only one in the intersection, and the composite leaderboard on the right">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="80" y="58" font-size="27" font-weight="700" fill="var(--ink)">What the launch listed vs what others watch</text>

  <rect x="80" y="110" width="480" height="300" rx="18" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="400" y="110" width="470" height="300" rx="18" fill="none" stroke="var(--accent)" stroke-width="2.5"/>

  <text x="108" y="148" font-size="19" font-weight="600" fill="var(--dim)">14 benchmarks the launch picked</text>
  <text x="842" y="148" font-size="19" font-weight="600" fill="var(--accent)" text-anchor="end">The composite board others cite</text>

  <g fill="var(--grey)">
    <rect x="108" y="178" width="46" height="30" rx="6"/>
    <rect x="166" y="178" width="46" height="30" rx="6"/>
    <rect x="224" y="178" width="46" height="30" rx="6"/>
    <rect x="282" y="178" width="46" height="30" rx="6"/>
    <rect x="108" y="222" width="46" height="30" rx="6"/>
    <rect x="166" y="222" width="46" height="30" rx="6"/>
    <rect x="224" y="222" width="46" height="30" rx="6"/>
    <rect x="282" y="222" width="46" height="30" rx="6"/>
    <rect x="108" y="266" width="46" height="30" rx="6"/>
    <rect x="166" y="266" width="46" height="30" rx="6"/>
    <rect x="224" y="266" width="46" height="30" rx="6"/>
    <rect x="282" y="266" width="46" height="30" rx="6"/>
    <rect x="108" y="310" width="46" height="30" rx="6"/>
  </g>
  <text x="108" y="368" font-size="16" fill="var(--dim)">13 appear only in the launch</text>

  <rect x="440" y="230" width="80" height="46" rx="8" fill="var(--accent)"/>
  <text x="480" y="260" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">1</text>
  <text x="480" y="308" font-size="16" fill="var(--ink)" text-anchor="middle">The only overlap</text>

  <text x="700" y="252" font-size="19" font-weight="600" fill="var(--ink)" text-anchor="middle">Fifth on the board</text>
  <text x="700" y="284" font-size="16" fill="var(--dim)" text-anchor="middle">Behind another vendor</text>

  <text x="80" y="486" font-size="22" font-weight="600" fill="var(--ink)">One of fourteen; nobody compares the other thirteen for you.</text>
</svg>
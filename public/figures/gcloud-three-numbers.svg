<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三組長條對比：新客速度一年前一倍、現在兩倍；億美元級交易一倍變兩倍；客戶承諾一百、實際花一百五">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="62">Google Cloud 交出的三個數字</text>
  <line x1="100" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>

  <rect x="150" y="370" width="64" height="100" fill="var(--grey)" rx="3"/>
  <rect x="234" y="270" width="64" height="200" fill="var(--accent)" rx="3"/>
  <text class="g" x="182" y="358" text-anchor="middle">×1</text>
  <text class="g" x="266" y="258" text-anchor="middle">×2</text>
  <text class="s" x="224" y="502" text-anchor="middle">新客獲取速度</text>
  <text class="s" x="224" y="524" text-anchor="middle">一年前 → 現在</text>

  <rect x="410" y="370" width="64" height="100" fill="var(--grey)" rx="3"/>
  <rect x="494" y="260" width="64" height="210" fill="var(--accent)" rx="3"/>
  <text class="g" x="442" y="358" text-anchor="middle">×1</text>
  <text class="g" x="526" y="248" text-anchor="middle">×2 以上</text>
  <text class="s" x="484" y="502" text-anchor="middle">億美元級大型交易</text>
  <text class="s" x="484" y="524" text-anchor="middle">一年前 → 現在</text>

  <rect x="670" y="320" width="64" height="150" fill="var(--grey)" rx="3"/>
  <rect x="754" y="245" width="64" height="225" fill="var(--accent)" rx="3"/>
  <text class="g" x="702" y="308" text-anchor="middle">$100</text>
  <text class="g" x="786" y="233" text-anchor="middle">$150</text>
  <text class="s" x="744" y="502" text-anchor="middle">客戶花費</text>
  <text class="s" x="744" y="524" text-anchor="middle">承諾 → 實際</text>

  <text class="c" x="60" y="562">第三根最難造假：錢已經花掉了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="On a vertical credit-cost scale, low-rated debt and CoreWeave jump to the top while high-rated and project debt remain near the bottom.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">Pressure Is Concentrated at the Top</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">Borrowing Costs at the Same Time</text>

<line x1="300" y1="150" x2="300" y2="470" stroke="var(--line)" stroke-width="3"/>
<text class="t" x="214" y="146" font-size="16" fill="var(--dim)">Costly</text>
<text class="t" x="214" y="482" font-size="16" fill="var(--dim)">Cheap</text>

<rect x="300" y="150" width="520" height="110" rx="8" fill="var(--warn)" opacity="0.14"/>
<circle cx="340" cy="180" r="9" fill="var(--warn)"/>
<text class="t" x="364" y="187" font-size="19" font-weight="700" fill="var(--ink)">CCC Rated 16.5%</text>
<text class="t" x="600" y="187" font-size="16" fill="var(--dim)">Back at the 2022 Peak</text>
<circle cx="340" cy="228" r="9" fill="var(--warn)"/>
<text class="t" x="364" y="235" font-size="19" font-weight="700" fill="var(--ink)">CoreWeave Debt 15%</text>
<text class="t" x="600" y="235" font-size="16" fill="var(--dim)">Rated B+ to BB−</text>

<circle cx="340" cy="310" r="9" fill="var(--grey)"/>
<text class="t" x="364" y="317" font-size="19" fill="var(--ink)">Broad High Yield 8%</text>

<rect x="300" y="360" width="520" height="110" rx="8" fill="var(--accent)" opacity="0.12"/>
<circle cx="340" cy="392" r="9" fill="var(--accent)"/>
<text class="t" x="364" y="399" font-size="19" font-weight="700" fill="var(--ink)">Giant-Backed Project Debt 2%–3%</text>
<text class="t" x="700" y="399" font-size="16" fill="var(--dim)">No Jump</text>
<circle cx="340" cy="440" r="9" fill="var(--accent)"/>
<text class="t" x="364" y="447" font-size="19" font-weight="700" fill="var(--ink)">AAA Rated 0.55%</text>
<text class="t" x="700" y="447" font-size="16" fill="var(--dim)">Still Low</text>

<line x1="60" y1="510" x2="900" y2="510" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="550" font-size="22" font-weight="700" fill="var(--ink)">One Supply Chain, Two Borrowing Costs</text>
</svg>
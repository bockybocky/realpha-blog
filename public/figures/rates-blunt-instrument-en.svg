<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One force presses down on two columns; one gets clearly shorter while the other hardly moves.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">One blunt tool, two kinds of pain</text>

<rect x="60" y="118" width="840" height="52" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="84" y="152" font-size="20" font-weight="700" fill="var(--ink)">Rates</text>
<path d="M300 180 L 300 212 M292 204 L300 216 L308 204" stroke="var(--dim)" stroke-width="4" fill="none"/>
<path d="M680 180 L 680 212 M672 204 L680 216 L688 204" stroke="var(--dim)" stroke-width="4" fill="none"/>

<line x1="60" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="180" y1="240" x2="420" y2="240" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
<line x1="560" y1="240" x2="800" y2="240" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="180" y="228" font-size="19" fill="var(--grey)">Before</text>

<rect x="200" y="392" width="200" height="68" rx="6" fill="var(--warn)"/>
<text x="200" y="492" font-size="20" font-weight="700" fill="var(--ink)">Homebuilders</text>
<text x="200" y="520" font-size="19" fill="var(--dim)">Borrow at mortgage rates</text>

<rect x="580" y="268" width="200" height="192" rx="6" fill="var(--accent)"/>
<text x="580" y="492" font-size="20" font-weight="700" fill="var(--ink)">Big AI firms</text>
<text x="580" y="520" font-size="19" fill="var(--dim)">Can issue large bonds</text>
</svg>
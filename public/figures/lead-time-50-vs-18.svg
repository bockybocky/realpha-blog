<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條等比例橫條，機械硬碟的 50 週幾乎撐滿畫面，DRAM 的 18 週只有它三分之一長。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .n { font-size:34px; font-weight:700; fill:var(--ink); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">第一個溫度計：交期</text>
  <text class="b" x="60" y="94">同一把尺量兩種記憶裝置</text>
  <text class="g" x="60" y="196">機械硬碟</text>
  <rect x="200" y="170" width="600" height="40" fill="var(--accent)"/>
  <text class="n" x="814" y="202" fill="var(--accent)">50 週</text>
  <text class="g" x="60" y="306">DRAM</text>
  <rect x="200" y="280" width="216" height="40" fill="var(--grey)"/>
  <text class="n" x="430" y="312">18 週</text>
  <text class="b" x="200" y="372">今天下訂，一年後才拿得到貨</text>
  <path d="M60 410 L900 410" stroke="var(--line)" stroke-width="2"/>
  <text class="c" x="60" y="458">隊伍很長是事實，為什麼長卻分不開</text>
  <text class="b" x="60" y="492">同一批需求往前挪半年，或在多家重複下單，交期一樣會拉長</text>
</svg>
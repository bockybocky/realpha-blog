<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="時間軸左段是長長一段稀疏的虛線，右段短短一截擠滿五個藍點，上方一條背景帶從頭到尾都在">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700">刺殺後過了 25 天，通牒一出，12 天全面開戰</text>
<rect x="60" y="100" width="840" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="128" font-size="16" style="fill:var(--dim)">背景：恐懼與怨恨，一直都在</text>
<line x1="80" y1="330" x2="620" y2="330" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<line x1="620" y1="330" x2="880" y2="330" stroke="var(--accent)" stroke-width="5"/>
<circle cx="80" cy="330" r="9" fill="var(--grey)"/>
<text x="80" y="300" text-anchor="middle" font-size="16">刺殺</text>
<text x="80" y="360" text-anchor="middle" font-size="15" style="fill:var(--dim)">6/28</text>
<circle cx="620" cy="330" r="9" fill="var(--accent)"/>
<circle cx="728" cy="330" r="9" fill="var(--accent)"/>
<circle cx="772" cy="330" r="9" fill="var(--accent)"/>
<circle cx="815" cy="330" r="9" fill="var(--accent)"/>
<circle cx="880" cy="330" r="9" fill="var(--accent)"/>
<text x="620" y="360" text-anchor="middle" font-size="15" style="fill:var(--dim)">7/23</text>
<text x="728" y="360" text-anchor="middle" font-size="15" style="fill:var(--dim)">7/28</text>
<text x="772" y="360" text-anchor="middle" font-size="15" style="fill:var(--dim)">7/30</text>
<text x="815" y="360" text-anchor="middle" font-size="15" style="fill:var(--dim)">8/1</text>
<text x="880" y="360" text-anchor="middle" font-size="15" style="fill:var(--dim)">8/4</text>
<line x1="620" y1="320" x2="620" y2="296" stroke="var(--accent)" stroke-width="1.5"/>
<text x="620" y="288" text-anchor="middle" font-size="16">奧匈通牒</text>
<line x1="728" y1="320" x2="728" y2="256" stroke="var(--accent)" stroke-width="1.5"/>
<text x="728" y="248" text-anchor="middle" font-size="16">奧匈宣戰</text>
<line x1="772" y1="370" x2="772" y2="390" stroke="var(--accent)" stroke-width="1.5"/>
<text x="772" y="408" text-anchor="middle" font-size="16">俄國動員</text>
<line x1="815" y1="370" x2="815" y2="430" stroke="var(--accent)" stroke-width="1.5"/>
<text x="815" y="448" text-anchor="middle" font-size="16">德國宣戰</text>
<line x1="880" y1="320" x2="880" y2="296" stroke="var(--accent)" stroke-width="1.5"/>
<text x="880" y="288" text-anchor="middle" font-size="16">英國參戰</text>
<path d="M80 482V498M80 490H612M612 482V498" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text x="346" y="524" text-anchor="middle" font-size="20" style="fill:var(--dim)">25 天</text>
<path d="M628 482V498M628 490H880M880 482V498" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="754" y="524" text-anchor="middle" font-size="20" font-weight="700" style="fill:var(--accent)">12 天、五個決定</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="四個滿的容器和一個半滿的容器並排，箭頭指向半滿的那一個">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink)}
.ga{font-size:19px;fill:var(--accent)}
.b{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">決定成交價的是誰</text>
<rect x="100" y="200" width="120" height="200" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="104" y="204" width="112" height="192" fill="var(--grey)" opacity="0.45"/>
<rect x="250" y="200" width="120" height="200" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="254" y="204" width="112" height="192" fill="var(--grey)" opacity="0.45"/>
<rect x="400" y="200" width="120" height="200" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="404" y="204" width="112" height="192" fill="var(--grey)" opacity="0.45"/>
<rect x="550" y="200" width="120" height="200" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="554" y="204" width="112" height="192" fill="var(--grey)" opacity="0.45"/>
<rect x="710" y="200" width="120" height="200" fill="none" stroke="var(--accent)" stroke-width="3"/>
<rect x="714" y="300" width="112" height="96" fill="var(--accent)" opacity="0.45"/>
<text class="b" x="160" y="430" text-anchor="middle">滿了</text>
<text class="b" x="310" y="430" text-anchor="middle">滿了</text>
<text class="b" x="460" y="430" text-anchor="middle">滿了</text>
<text class="b" x="610" y="430" text-anchor="middle">滿了</text>
<text class="ga" x="770" y="432" text-anchor="middle">還有空間</text>
<path d="M770 150 L770 186" stroke="var(--accent)" stroke-width="3"/>
<path d="M770 196 L763 180 L777 180 Z" fill="var(--accent)"/>
<text class="ga" x="770" y="136" text-anchor="middle">價格從這裡開始</text>
<text class="c" x="60" y="500">同意的人不定價，還沒滿的人才定價</text>
</svg>
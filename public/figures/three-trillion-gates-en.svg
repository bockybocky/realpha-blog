<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A three trillion dollar cash pool at twice its level of six years ago, with two closed gates to equities: rates below three percent, and a drawdown over thirty percent.">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #9aa5b5;
      --accent: #1f6feb;
      --warn:   #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #6b7686;
        --accent: #58a6ff;
        --warn:   #d29922;
      }
    }
    .t     { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1    { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .pool  { font-size: 30px; font-weight: 700; fill: var(--page); }
    .pools { font-size: 16px; fill: var(--page); }
    .mark  { font-size: 15px; font-weight: 700; fill: var(--ink); }
    .gate  { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .shut  { font-size: 15.5px; font-weight: 700; fill: var(--warn); }
    .note  { font-size: 15px; fill: var(--dim); }
    .kick  { font-size: 22px; font-weight: 700; fill: var(--ink); }
  </style>

  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <g class="t">
    <text x="480" y="44" class="h1" text-anchor="middle">Three trillion sitting still, both gates shut</text>

    <!-- 水池 -->
    <rect x="90" y="120" width="240" height="290" rx="4" fill="var(--accent)"/>
    <text x="210" y="196" class="pool" text-anchor="middle">$3T</text>
    <text x="210" y="226" class="pools" text-anchor="middle">Retail money funds</text>

    <!-- 六年前水位 -->
    <line x1="90" y1="265" x2="330" y2="265" stroke="var(--page)" stroke-width="2.5" stroke-dasharray="8,6"/>
    <text x="342" y="270" class="mark">Six years ago here ($1.5T)</text>

    <!-- 通道一 -->
    <rect x="330" y="150" width="230" height="40" fill="var(--accent)" opacity="0.28"/>
    <line x1="566" y1="138" x2="566" y2="202" stroke="var(--warn)" stroke-width="9" stroke-linecap="round"/>
    <text x="590" y="160" class="gate">Rates below 3%</text>
    <text x="590" y="186" class="shut">Not yet</text>

    <!-- 通道二 -->
    <rect x="330" y="330" width="230" height="40" fill="var(--accent)" opacity="0.28"/>
    <line x1="566" y1="318" x2="566" y2="382" stroke="var(--warn)" stroke-width="9" stroke-linecap="round"/>
    <text x="590" y="340" class="gate">Stocks down over 30%</text>
    <text x="590" y="366" class="shut">Not yet</text>
    <text x="590" y="396" class="note">This one is counterintuitive: in a crash</text>
    <text x="590" y="418" class="note">money moves from funds into stocks,</text>
    <text x="590" y="440" class="note">and that has almost never happened.</text>

    <text x="480" y="500" class="kick" text-anchor="middle">Write down when to move as a condition,</text>
    <text x="480" y="532" class="kick" text-anchor="middle">not as a feeling.</text>
  </g>
</svg>

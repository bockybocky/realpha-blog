<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩個等大的直立桶，左桶下方八成塗成淺色代表便宜活，右桶上方八成塗成重色代表付錢活，兩桶下方各寫一個相反結果">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); }
.g { font-size:20px; fill:var(--ink); }
.s { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="68">整條鏈的開關，在這個比例裡</text>

<rect x="120" y="120" width="260" height="300" fill="var(--card)" stroke="var(--line)"/>
<rect x="120" y="180" width="260" height="240" fill="var(--grey)"/>
<text class="g" x="140" y="310" fill="var(--page)">便宜活 八成</text>
<text class="s" x="140" y="158">付錢活 兩成</text>
<text class="g" x="120" y="470" fill="var(--warn)">價格戰打起來</text>
<text class="s" x="120" y="502">鏈條一節一節接上</text>

<rect x="580" y="120" width="260" height="300" fill="var(--card)" stroke="var(--line)"/>
<rect x="580" y="120" width="260" height="240" fill="var(--accent)"/>
<text class="g" x="600" y="250" fill="var(--page)">付錢活 八成</text>
<text class="s" x="600" y="396">便宜活 兩成</text>
<text class="g" x="580" y="470" fill="var(--accent)">打不起來</text>
<text class="s" x="580" y="502">第一節就接不上</text>

<line x1="440" y1="120" x2="440" y2="420" stroke="var(--line)" stroke-dasharray="6 7"/>
<text class="s" x="408" y="548">同一個產業，兩種分叉</text>
</svg>
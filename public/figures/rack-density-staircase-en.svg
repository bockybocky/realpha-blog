<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A six-step rising staircase of rack power from nine kilowatts to five hundred kilowatts, where the two low steps are air cooled and the three high steps are liquid cooled.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="66">Where the heat is headed: kW per rack</text>

<line x1="120" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>

<rect x="130" y="437" width="90" height="13" fill="var(--grey)" rx="3"/>
<text class="g" x="175" y="480" text-anchor="middle">9</text>
<text class="n" x="175" y="505" text-anchor="middle">Air</text>

<rect x="250" y="392" width="90" height="58" fill="var(--grey)" rx="3"/>
<text class="g" x="295" y="480" text-anchor="middle">40</text>
<text class="n" x="295" y="505" text-anchor="middle">In-row</text>

<rect x="370" y="334" width="90" height="116" fill="var(--grey)" rx="3"/>
<text class="g" x="415" y="480" text-anchor="middle">80</text>
<text class="n" x="415" y="505" text-anchor="middle">Rear-door swap</text>

<rect x="490" y="131" width="90" height="319" fill="var(--accent)" rx="3"/>
<text class="g" x="535" y="480" text-anchor="middle">220</text>
<text class="n" x="535" y="505" text-anchor="middle">Today</text>

<rect x="610" y="99" width="90" height="351" fill="var(--accent)" rx="3"/>
<text class="g" x="655" y="480" text-anchor="middle">280</text>
<text class="n" x="655" y="505" text-anchor="middle">HPC cluster</text>

<rect x="730" y="80" width="90" height="370" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 6" rx="3"/>
<text class="g" x="775" y="480" text-anchor="middle">500</text>
<text class="n" x="775" y="505" text-anchor="middle">In planning</text>

<text class="n" x="60" y="110">kW</text>
<text class="c" x="60" y="545">Packing this tight is what interconnect cost forces</text>
</svg>
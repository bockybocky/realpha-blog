<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊用途一對一分散到三台車，右邊四種用途匯聚到唯一一台車">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:600}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="480" y="58" text-anchor="middle">同一個百分比，分母不是同一種東西</text>
<line x1="480" y1="100" x2="480" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="250" y="134" text-anchor="middle">歐洲　家裡三台</text>
<text class="t g" x="710" y="134" text-anchor="middle">台灣　家裡一台</text>
<text class="t s" x="130" y="196" text-anchor="middle">長途</text>
<text class="t s" x="250" y="196" text-anchor="middle">通勤</text>
<text class="t s" x="370" y="196" text-anchor="middle">載小孩</text>
<line x1="130" y1="212" x2="130" y2="286" stroke="var(--grey)" stroke-width="2"/>
<line x1="250" y1="212" x2="250" y2="286" stroke="var(--accent)" stroke-width="2"/>
<line x1="370" y1="212" x2="370" y2="286" stroke="var(--grey)" stroke-width="2"/>
<rect x="80" y="290" width="100" height="56" rx="12" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="200" y="290" width="100" height="56" rx="12" fill="var(--accent)" opacity="0.18"/>
<rect x="200" y="290" width="100" height="56" rx="12" fill="none" stroke="var(--accent)" stroke-width="2"/>
<rect x="320" y="290" width="100" height="56" rx="12" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="t s" x="250" y="378" text-anchor="middle">這台可以是電動車</text>
<text class="t s" x="600" y="182" text-anchor="middle">通勤</text>
<text class="t s" x="820" y="182" text-anchor="middle">載小孩</text>
<text class="t s" x="600" y="232" text-anchor="middle">載長輩</text>
<text class="t s" x="820" y="232" text-anchor="middle">談生意</text>
<line x1="600" y1="194" x2="700" y2="286" stroke="var(--grey)" stroke-width="2"/>
<line x1="820" y1="194" x2="722" y2="286" stroke="var(--grey)" stroke-width="2"/>
<line x1="628" y1="238" x2="700" y2="286" stroke="var(--grey)" stroke-width="2"/>
<line x1="792" y1="238" x2="722" y2="286" stroke="var(--grey)" stroke-width="2"/>
<rect x="656" y="290" width="110" height="56" rx="12" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
<text class="t s" x="711" y="378" text-anchor="middle">這台要全包</text>
<text class="t c" x="480" y="500" text-anchor="middle">分母的門檻不同，8% 不等於落後</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四層波浪線由下往上擺幅越來越大，表示同一個需求訊號往上游每傳一層就被放大">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="58" font-size="27" fill="var(--ink)">同一個訊號，越往上游擺得越大</text>
<polyline points="320,460 360,452.4 400,450.1 440,454.9 480,463.1 520,469 560,469.3 600,463.9 640,455.6 680,450.5 720,451.6 760,457.4 800,465.6 840,469.8 880,467.4" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text x="40" y="466" font-size="19" fill="var(--dim)">算力需求</text>
<polyline points="320,380 360,360.2 400,354.4 440,366.7 480,388.2 520,403.4 560,404.1 600,390.1 640,368.6 680,355.4 720,358.1 760,373.3 800,394.5 840,405.5 880,399.2" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0.55"/>
<text x="40" y="386" font-size="19" fill="var(--dim)">晶圓廠擴產</text>
<polyline points="320,280 360,243.4 400,232.7 440,255.4 480,295.1 520,323.2 560,324.4 600,298.7 640,258.9 680,234.6 720,239.5 760,267.6 800,306.7 840,327 880,315.5" fill="none" stroke="var(--accent)" stroke-width="3" opacity="0.78"/>
<text x="40" y="286" font-size="19" fill="var(--dim)">設備訂單</text>
<polyline points="320,160 360,102.9 400,86 440,121.6 480,183.6 520,227.5 560,229.4 600,189.2 640,127.2 680,89.1 720,96.7 760,140.7 800,201.7 840,233.4 880,215.5" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
<text x="40" y="166" font-size="19" fill="var(--ink)">設備零組件</text>
<circle cx="760" cy="140.7" r="9" fill="var(--warn)"/>
<text x="775" y="134" font-size="16" fill="var(--warn)">招聘凍結</text>
<polyline points="290,450 290,120" fill="none" stroke="var(--line)" stroke-width="2"/>
<polygon points="290,104 282,122 298,122" fill="var(--line)"/>
<text x="268" y="300" font-size="16" fill="var(--dim)" text-anchor="middle" transform="rotate(-90 268 300)">往上游</text>
<text x="600" y="520" font-size="22" fill="var(--ink)" text-anchor="middle">放大，不是看錯</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The gap from the start to the first island is the longest, and the gaps between islands keep shrinking" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">The first island is farthest; each hop after is shorter</text>

<line x1="60" y1="320" x2="900" y2="320" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 6"/>

<rect x="60" y="290" width="95" height="60" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="107" y="327" font-size="16" fill="var(--dim)" text-anchor="middle">Start</text>

<line x1="160" y1="320" x2="388" y2="320" stroke="var(--warn)" stroke-width="2"/>
<polygon points="388,312 404,320 388,328" fill="var(--warn)"/>
<text x="272" y="296" font-size="16" fill="var(--warn)" text-anchor="middle">From zero</text>

<circle cx="430" cy="320" r="34" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="430" y="392" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">Immersion cooling</text>

<line x1="464" y1="320" x2="560" y2="320" stroke="var(--accent)" stroke-width="2"/>
<polygon points="560,312 576,320 560,328" fill="var(--accent)"/>
<circle cx="610" cy="320" r="34" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="610" y="392" font-size="15" fill="var(--dim)" text-anchor="middle">Busbars</text>

<line x1="644" y1="320" x2="690" y2="320" stroke="var(--accent)" stroke-width="2"/>
<polygon points="690,312 706,320 690,328" fill="var(--accent)"/>
<circle cx="740" cy="320" r="34" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="740" y="392" font-size="15" fill="var(--dim)" text-anchor="middle">Cables</text>

<line x1="774" y1="320" x2="790" y2="320" stroke="var(--accent)" stroke-width="2"/>
<polygon points="788,312 804,320 788,328" fill="var(--accent)"/>
<circle cx="838" cy="320" r="34" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="838" y="392" font-size="15" fill="var(--dim)" text-anchor="middle">Connectors</text>

<text x="700" y="272" font-size="16" fill="var(--accent)" text-anchor="middle">Reuse</text>

<text x="480" y="462" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">The first costs most; the rest is the same logic</text>
</svg>
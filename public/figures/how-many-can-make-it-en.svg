<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A scale running from few suppliers to many, structural on the left, cyclical on the right, split by a divider.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<text x="60" y="72" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="27" fill="var(--ink)">At this layer, how many can actually make it</text>

<circle cx="120" cy="230" r="26" fill="var(--accent)"/>
<circle cx="190" cy="230" r="26" fill="var(--accent)"/>
<circle cx="260" cy="230" r="26" fill="var(--accent)"/>

<circle cx="540" cy="230" r="26" fill="var(--grey)"/>
<circle cx="606" cy="230" r="26" fill="var(--grey)"/>
<circle cx="672" cy="230" r="26" fill="var(--grey)"/>
<circle cx="738" cy="230" r="26" fill="var(--grey)"/>
<circle cx="804" cy="230" r="26" fill="var(--grey)"/>
<circle cx="870" cy="230" r="26" fill="var(--grey)"/>
<circle cx="606" cy="300" r="26" fill="var(--grey)"/>
<circle cx="672" cy="300" r="26" fill="var(--grey)"/>

<line x1="420" y1="150" x2="420" y2="360" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>

<text x="120" y="400" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--accent)">No second source to turn to</text>
<text x="120" y="430" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--dim)">Structural</text>
<text x="540" y="400" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">Queue just happens to be long</text>
<text x="540" y="430" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">Cyclical</text>

<text x="60" y="490" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="22" fill="var(--ink)">Queues clear; supplier counts do not grow within a year</text>
</svg>
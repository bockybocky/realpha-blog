<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Only the left two of eight bars have height, the other six lie flat, and a dashed frame marks their original positions.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="72" font-size="27" fill="var(--ink)">Of the leading markets of 1899, how many bars are left</text>

  <rect x="100" y="120" width="70" height="300" fill="var(--accent)"/>
  <rect x="200" y="210" width="70" height="210" fill="var(--accent)"/>

  <rect x="300" y="270" width="70" height="150" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="400" y="270" width="70" height="150" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="500" y="270" width="70" height="150" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="600" y="270" width="70" height="150" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="700" y="270" width="70" height="150" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="800" y="270" width="70" height="150" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="300" y="414" width="70" height="6" fill="var(--warn)"/>
  <rect x="400" y="414" width="70" height="6" fill="var(--warn)"/>
  <rect x="500" y="414" width="70" height="6" fill="var(--warn)"/>
  <rect x="600" y="414" width="70" height="6" fill="var(--warn)"/>
  <rect x="700" y="414" width="70" height="6" fill="var(--warn)"/>
  <rect x="800" y="414" width="70" height="6" fill="var(--warn)"/>
  <text x="585" y="250" font-size="19" fill="var(--warn)" text-anchor="middle">To zero</text>

  <line x1="80" y1="420" x2="900" y2="420" stroke="var(--dim)" stroke-width="2.5"/>
  <text x="135" y="450" font-size="16" fill="var(--ink)" text-anchor="middle">US</text>
  <text x="235" y="450" font-size="16" fill="var(--ink)" text-anchor="middle">UK</text>
  <path d="M 300 466 L 300 476 L 870 476 L 870 466" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text x="585" y="500" font-size="16" fill="var(--dim)" text-anchor="middle">The other markets that led back then</text>

  <text x="60" y="538" font-size="22" fill="var(--ink)">That long-run return number comes only from these two bars</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two rising curves on a long slope; the one that starts later ends clearly lower, and the leftmost stretch is marked as the missed first third.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">The first third of a long hill</text>
<rect x="120" y="120" width="210" height="340" fill="var(--card)"/>
<line x1="120" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="3"/>
<line x1="120" y1="120" x2="120" y2="460" stroke="var(--line)" stroke-width="3"/>
<path d="M120 455 C 420 440 700 330 890 150" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
<path d="M120 455 C 430 445 690 350 880 170" fill="none" stroke="var(--accent)" stroke-width="7"/>
<path d="M330 452 C 520 448 720 400 880 280" fill="none" stroke="var(--warn)" stroke-width="7"/>
<circle cx="120" cy="455" r="8" fill="var(--accent)"/>
<circle cx="330" cy="452" r="8" fill="var(--warn)"/>
<text class="g" x="700" y="150" style="fill:var(--accent)">Account at birth</text>
<text class="g" x="700" y="262" style="fill:var(--warn)">Waiting on parents</text>
<text class="s" x="134" y="150">Missed</text>
<text class="s" x="134" y="174">first third</text>
<text class="s" x="106" y="492">Birth</text>
<text class="s" x="848" y="492">Age 18</text>
<text class="s" x="60" y="112">Account</text>
<text class="c" x="60" y="534">The front of the hill is cheapest, and easiest to give up</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A long bar and a very short bar side by side, wildly different in length.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">From wanting a cookie shop to opening the door</text>
<text x="60" y="90" font-size="15" fill="var(--dim)">Same road, two lengths</text>

<text x="60" y="150" font-size="20" font-weight="700" fill="var(--ink)">Find your own space</text>
<rect x="60" y="170" width="260" height="58" fill="var(--grey)"/>
<rect x="322" y="170" width="260" height="58" fill="var(--grey)" opacity="0.75"/>
<rect x="584" y="170" width="256" height="58" fill="var(--grey)" opacity="0.5"/>
<text x="76" y="206" font-size="16" fill="var(--page)">A space that can be licensed</text>
<text x="338" y="206" font-size="16" fill="var(--ink)">3–5 year lease plus deposit</text>
<text x="600" y="206" font-size="16" fill="var(--ink)">Permit process</text>
<text x="840" y="254" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="end">Six months at best</text>

<text x="60" y="340" font-size="20" font-weight="700" fill="var(--ink)">Through a shared kitchen</text>
<rect x="60" y="360" width="56" height="58" fill="var(--accent)"/>
<rect x="118" y="360" width="56" height="58" fill="var(--accent)" opacity="0.6"/>
<text x="192" y="384" font-size="16" fill="var(--dim)">User license on Monday</text>
<text x="192" y="408" font-size="16" fill="var(--dim)">Open on Tuesday</text>
<text x="192" y="440" font-size="19" font-weight="700" fill="var(--accent)">Two days</text>

<text x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">What he sells is the six months you can't skip</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The same question splits into two paths: the borrowing side is an investment, and the non-borrowing side is a credit backstop.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .h { font-size:24px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:16px; fill:var(--ink); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs>
  <marker id="f3a" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
    <path d="M0 0 L11 4.5 L0 9 Z" fill="var(--accent)"/>
  </marker>
  <marker id="f3w" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
    <path d="M0 0 L11 4.5 L0 9 Z" fill="var(--warn)"/>
  </marker>
</defs>
<text class="t" x="60" y="58">Same money, two natures</text>

<rect x="60" y="200" width="250" height="110" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="185" y="245" text-anchor="middle">Who takes the money</text>
<text class="b" x="185" y="278" text-anchor="middle">Can they borrow on their own?</text>

<path d="M310 240 L 410 240 L 410 155 L 500 155" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#f3a)"/>
<text class="s" x="418" y="140" fill="var(--accent)">Can borrow</text>
<path d="M310 270 L 410 270 L 410 380 L 500 380" fill="none" stroke="var(--warn)" stroke-width="2.5" marker-end="url(#f3w)"/>
<text class="s" x="418" y="410" fill="var(--warn)">Cannot borrow</text>

<rect x="510" y="96" width="390" height="118" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="h" x="536" y="140" fill="var(--accent)">Investment</text>
<text class="s" x="536" y="172">MediaTek, $3.5B</text>
<text class="b" x="536" y="198">0% coupon, NVLink access</text>

<rect x="510" y="322" width="390" height="118" rx="14" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="h" x="536" y="366" fill="var(--warn)">Bank</text>
<text class="s" x="536" y="398">OpenAI, $105B</text>
<text class="b" x="536" y="424">Credit backstop until it is rated</text>

<text class="c" x="185" y="400" text-anchor="middle">Not about one deal</text>
<text class="c" x="185" y="432" text-anchor="middle">About who needs money</text>
</svg>
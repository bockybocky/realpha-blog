<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A rectangle split roughly eighty-twenty, with a small cell and a long bar below contrasting launch week against every year.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="60" font-size="27" fill="var(--ink)">Which column the money comes from</text>
<rect x="80" y="120" width="640" height="130" rx="10" fill="var(--accent)"/>
<rect x="720" y="120" width="160" height="130" rx="10" fill="var(--grey)"/>
<text x="110" y="190" font-size="20" fill="var(--page)">In-game spending</text>
<text x="110" y="220" font-size="16" fill="var(--page)">About 80%</text>
<text x="800" y="190" font-size="20" fill="var(--ink)" text-anchor="middle">Game sales</text>
<text x="800" y="220" font-size="16" fill="var(--dim)" text-anchor="middle">About 20%</text>
<text x="48" y="318" font-size="20" fill="var(--dim)">How long each column lasts</text>
<rect x="80" y="340" width="52" height="34" rx="6" fill="var(--grey)"/>
<text x="148" y="364" font-size="16" fill="var(--dim)">Launch-week record: one week</text>
<rect x="80" y="392" width="640" height="34" rx="6" fill="var(--accent)"/>
<text x="736" y="416" font-size="16" fill="var(--ink)">In-game: every year</text>
<text x="48" y="482" font-size="22" fill="var(--ink)">The long one is what to track</text>
</svg>
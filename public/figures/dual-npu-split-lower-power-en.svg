<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One engine at full speed versus two engines at lower voltage: the left has one tall bar with eight power cells, and the right has two short bars with six power cells in total.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="480" y="48" text-anchor="middle" class="h">Split a task in half</text>
<text x="480" y="78" text-anchor="middle" class="b">Illustrative</text>
<rect x="40" y="96" width="420" height="380" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="96" width="420" height="380" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="250" y="134" text-anchor="middle" class="g">1 full</text>
<text x="710" y="134" text-anchor="middle" class="g">2 low</text>
<line x1="90" y1="340" x2="410" y2="340" stroke="var(--line)" stroke-width="2"/>
<rect x="200" y="160" width="100" height="180" rx="6" fill="var(--warn)"/>
<text x="250" y="258" text-anchor="middle" class="b" style="fill:var(--page)">Hi V/f</text>
<line x1="550" y1="340" x2="870" y2="340" stroke="var(--line)" stroke-width="2"/>
<rect x="600" y="250" width="90" height="90" rx="6" fill="var(--accent)"/>
<rect x="730" y="250" width="90" height="90" rx="6" fill="var(--accent)"/>
<text x="645" y="240" text-anchor="middle" class="b">Low</text>
<text x="775" y="240" text-anchor="middle" class="b">Low</text>
<text x="90" y="392" class="b">Pwr</text>
<g fill="var(--warn)">
<rect x="150" y="376" width="22" height="22" rx="3"/><rect x="180" y="376" width="22" height="22" rx="3"/>
<rect x="210" y="376" width="22" height="22" rx="3"/><rect x="240" y="376" width="22" height="22" rx="3"/>
<rect x="270" y="376" width="22" height="22" rx="3"/><rect x="300" y="376" width="22" height="22" rx="3"/>
<rect x="330" y="376" width="22" height="22" rx="3"/><rect x="360" y="376" width="22" height="22" rx="3"/>
</g>
<text x="266" y="436" text-anchor="middle" class="g">8</text>
<text x="550" y="392" class="b">Pwr</text>
<g fill="var(--accent)">
<rect x="610" y="376" width="22" height="22" rx="3"/><rect x="640" y="376" width="22" height="22" rx="3"/>
<rect x="670" y="376" width="22" height="22" rx="3"/>
<rect x="740" y="376" width="22" height="22" rx="3"/><rect x="770" y="376" width="22" height="22" rx="3"/>
<rect x="800" y="376" width="22" height="22" rx="3"/>
</g>
<text x="716" y="436" text-anchor="middle" class="g">3+3=6</text>
<text x="480" y="522" text-anchor="middle" class="c">Split+slow=less W</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two contrasting lines show copper bandwidth dropping sharply with distance while optical bandwidth stays flat.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:20px; font-weight:700; }
    .body { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="56" class="title">More bits, less reach</text>
  <rect x="120" y="100" width="760" height="340" fill="var(--card)" stroke="var(--line)"/>
  <line x1="120" y1="440" x2="880" y2="440" stroke="var(--dim)" stroke-width="2"/>
  <line x1="120" y1="100" x2="120" y2="440" stroke="var(--dim)" stroke-width="2"/>
  <text x="108" y="120" class="body" text-anchor="end">Bandwidth</text>
  <text x="108" y="140" class="body" text-anchor="end">High</text>
  <text x="108" y="436" class="body" text-anchor="end">Low</text>
  <path d="M140,150 L860,158" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M140,132 C 300,150 380,330 860,420" fill="none" stroke="var(--warn)" stroke-width="6" stroke-linecap="round"/>
  <text x="760" y="146" class="grp" fill="var(--accent)" style="fill:var(--accent)">Optical</text>
  <text x="760" y="392" class="grp" style="fill:var(--warn)">Copper</text>
  <text x="190" y="470" class="body" text-anchor="middle">Near chip</text>
  <text x="400" y="470" class="body" text-anchor="middle">Same board</text>
  <text x="620" y="470" class="body" text-anchor="middle">Same rack</text>
  <text x="840" y="470" class="body" text-anchor="middle">Cross-rack</text>
  <text x="880" y="496" class="body" text-anchor="end">Distance →</text>
  <text x="480" y="536" class="end" text-anchor="middle">Far out, only light holds</text>
</svg>
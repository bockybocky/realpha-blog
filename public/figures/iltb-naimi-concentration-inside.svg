<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="大方框中約四成是創投，而創投那塊又被三四個小方塊幾乎填滿">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="80" y="60" font-size="27" font-weight="700">看起來是一個資產類別，其實是四家公司</text>
<rect x="120" y="120" width="720" height="340" fill="none" stroke="var(--line)" stroke-width="3"/>
<text x="600" y="110" font-size="19" fill="var(--dim)">機構投資人全部資產</text>
<rect x="120" y="120" width="300" height="340" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="140" y="155" font-size="20" font-weight="700" fill="var(--accent)">創投 三到五成</text>
<rect x="148" y="180" width="244" height="58" fill="var(--accent)"/>
<text x="168" y="217" font-size="16" fill="var(--page)">SpaceX</text>
<rect x="148" y="248" width="244" height="58" fill="var(--accent)"/>
<text x="168" y="285" font-size="16" fill="var(--page)">Anthropic</text>
<rect x="148" y="316" width="244" height="58" fill="var(--accent)"/>
<text x="168" y="353" font-size="16" fill="var(--page)">OpenAI</text>
<rect x="148" y="384" width="244" height="58" fill="var(--accent)"/>
<text x="168" y="421" font-size="16" fill="var(--page)">Databricks</text>
<text x="560" y="300" font-size="19" fill="var(--dim)">其餘資產</text>
<text x="80" y="510" font-size="22" font-weight="700">它們不吐，曝險就降不下來</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One free cash flow bar sits above the zero line and two sit below it.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">Same week, FCF splits</text>
<rect x="60" y="92" width="840" height="400" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="120" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="3"/>
<text x="98" y="306" font-size="15" fill="var(--dim)">0</text>
<rect x="190" y="190" width="120" height="110" fill="var(--accent)"/>
<text x="206" y="176" font-size="20" fill="var(--accent)">+</text>
<text x="190" y="152" font-size="16" fill="var(--dim)">Over $18B</text>
<rect x="430" y="300" width="120" height="90" fill="var(--warn)"/>
<text x="462" y="414" font-size="20" fill="var(--warn)">Neg</text>
<rect x="670" y="300" width="120" height="110" fill="var(--warn)"/>
<text x="716" y="434" font-size="20" fill="var(--warn)">−</text>
<text x="206" y="462" font-size="16" fill="var(--ink)">MSFT (qtr)</text>
<text x="452" y="462" font-size="16" fill="var(--ink)">Meta (qtr)</text>
<text x="670" y="462" font-size="16" fill="var(--ink)">Amazon (TTM)</text>
<text x="60" y="534" font-size="22" fill="var(--ink)">Can they sustain it, not just spend</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three hills on a timeline mark three launches in 1970, 2009, and 2015, each taller than the last; beneath each hill is what drove it out: DRAM and erasable ROM, 3D NAND, and falling NAND prices with DRAM prices.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700} .g{font-size:20px;font-weight:700}
    .b{font-size:16px} .bb{font-size:16px;font-weight:700} .d{font-size:15px;fill:var(--dim)} .c{font-size:22px;font-weight:700}
</style>
<text x="480" y="50" class="t" text-anchor="middle">3 in, 3 out</text>
<line x1="60" y1="380" x2="384" y2="380" stroke="var(--dim)" stroke-width="2"/>
<line x1="408" y1="380" x2="880" y2="380" stroke="var(--dim)" stroke-width="2"/>
<path d="M382,392 L392,368 M398,392 L408,368" stroke="var(--dim)" stroke-width="2" fill="none"/>
<path d="M176,380 C200,380 196,230 236,230 C276,230 272,380 296,380 Z" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<path d="M584,380 C604,380 604,210 624,210 C644,210 644,380 664,380 Z" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<path d="M680,380 C705,380 705,165 736,165 C767,165 767,380 792,380 Z" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<text x="236" y="214" class="bb" text-anchor="middle">Read-mostly</text>
<text x="624" y="196" class="bb" text-anchor="middle">Phone</text>
<text x="736" y="150" class="bb" text-anchor="middle">3D XPoint/Optane</text>
<line x1="296" y1="380" x2="424" y2="380" stroke="var(--grey)" stroke-width="6" stroke-dasharray="4 6"/>
<circle cx="424" cy="380" r="7" fill="var(--accent)"/>
<text x="424" y="330" class="bb" text-anchor="middle">Back</text>
<text x="424" y="352" class="d" text-anchor="middle">Shrink</text>
<text x="200" y="404" class="d" text-anchor="middle">1970</text>
<text x="440" y="404" class="d" text-anchor="middle">2000</text>
<text x="584" y="404" class="d" text-anchor="middle">2009</text>
<text x="680" y="404" class="d" text-anchor="middle">2015</text>
<text x="792" y="404" class="d" text-anchor="middle">2022</text>
<text x="60" y="456" class="d">Killer</text>
<text x="236" y="456" class="bb" text-anchor="middle" style="fill:var(--warn)">DRAM scales</text>
<text x="236" y="480" class="bb" text-anchor="middle" style="fill:var(--warn)">EPROM</text>
<text x="624" y="456" class="bb" text-anchor="middle" style="fill:var(--warn)">3D NAND</text>
<text x="736" y="456" class="bb" text-anchor="middle" style="fill:var(--warn)">Cheap NAND</text>
<text x="736" y="480" class="bb" text-anchor="middle" style="fill:var(--warn)">DRAM prices</text>
<text x="480" y="532" class="c" text-anchor="middle">Rivals won each time</text>
</svg>
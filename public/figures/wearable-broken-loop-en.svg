<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="One segment of the four-part loop is broken, preventing the full loop from returning to its starting point.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="80" y="62">Wearables: the loop is not closed</text>
<rect x="80" y="100" width="800" height="340" fill="var(--card)"/>
<rect x="150" y="150" width="230" height="90" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="174" y="196">Measured numbers</text>
<text class="s" x="174" y="222">Heart rate, steps, sleep</text>
<line x1="380" y1="195" x2="560" y2="195" stroke="var(--accent)" stroke-width="4"/>
<polygon points="568,195 548,186 548,204" fill="var(--accent)"/>
<rect x="580" y="150" width="230" height="90" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="604" y="196">Infer a risk</text>
<text class="s" x="604" y="222">High blood pressure</text>
<line x1="695" y1="240" x2="695" y2="330" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 10"/>
<polygon points="695,338 686,318 704,318" fill="var(--warn)"/>
<rect x="580" y="340" width="230" height="90" fill="var(--page)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="g" x="604" y="386">How to intervene</text>
<text class="s" x="604" y="412">How high is high? Which drug?</text>
<text class="g" x="400" y="378">Break here</text>
<text class="s" x="400" y="404">No clinical support</text>
<line x1="580" y1="385" x2="500" y2="385" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 10"/>
<line x1="150" y1="385" x2="150" y2="240" stroke="var(--line)" stroke-width="4" stroke-dasharray="10 10"/>
<line x1="150" y1="385" x2="300" y2="385" stroke="var(--line)" stroke-width="4" stroke-dasharray="10 10"/>
<text class="c" x="80" y="486">Can only say “I can,” so it ends up back in consumer products</text>
<text class="s" x="80" y="518">Contrast: continuous glucose monitoring measures reliably, from periodic calibration to no calibration</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars: the booked share is about half and tall, while actual shipments sit almost on the baseline.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t h" x="60" y="70">Where it sits on paper, where it sits physically</text>
<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="230" y="160" width="140" height="260" fill="var(--accent)"/>
<text class="t g" x="230" y="140">About half</text>
<text class="t b" x="230" y="452">Revenue booked to the Singapore unit</text>
<rect x="580" y="408" width="140" height="12" fill="var(--grey)"/>
<text class="t g" x="580" y="388">Under 2%</text>
<text class="t b" x="580" y="452">Actually shipped to Singapore</text>
<text class="t c" x="60" y="500">Books go one way, goods another</text>
</svg>
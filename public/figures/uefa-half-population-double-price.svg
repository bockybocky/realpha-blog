<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊一塊又寬又矮的方塊，右邊一塊寬度減半但高度加倍的方塊，兩塊面積一樣大。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <g style="font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
    <text x="40" y="52" font-size="27" font-weight="700" fill="var(--ink)">人減半、單價兩倍，面積沒變</text>

    <line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

    <rect x="120" y="300" width="300" height="120" fill="var(--grey)" opacity="0.5" stroke="var(--dim)" stroke-width="2"/>
    <text x="270" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">人 10</text>
    <text x="104" y="366" font-size="19" fill="var(--dim)" text-anchor="end">$2</text>
    <text x="270" y="366" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">現在</text>

    <rect x="620" y="180" width="150" height="240" fill="var(--accent)" opacity="0.28" stroke="var(--accent)" stroke-width="2"/>
    <text x="695" y="452" font-size="19" fill="var(--accent)" text-anchor="middle">人 5</text>
    <text x="604" y="306" font-size="19" fill="var(--accent)" text-anchor="end">$4</text>
    <text x="695" y="306" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">六十年後</text>

    <text x="520" y="306" font-size="27" fill="var(--dim)" text-anchor="middle">=</text>
    <text x="480" y="500" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">兩塊一樣大</text>
  </g>
</svg>
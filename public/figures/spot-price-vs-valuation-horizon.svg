<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="時間軸左端一小塊已通電容量價格昂貴，右端一大片尚未通電的容量才是估值所買，兩個箭頭指向不同位置">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="80" font-size="27" fill="var(--ink)">兩個不同年份被講成同一件事</text>
  <rect x="150" y="300" width="90" height="70" fill="var(--warn)" opacity="0.85"/>
  <rect x="430" y="250" width="420" height="120" fill="var(--grey)" opacity="0.5"/>
  <line x1="120" y1="400" x2="890" y2="400" stroke="var(--line)" stroke-width="3"/>
  <text class="t" x="195" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">今天</text>
  <text class="t" x="640" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">2028–2029</text>
  <text class="t" x="195" y="285" font-size="19" fill="var(--ink)" text-anchor="middle">已通電</text>
  <text class="t" x="640" y="232" font-size="19" fill="var(--ink)" text-anchor="middle">還沒上線</text>
  <line x1="195" y1="200" x2="195" y2="290" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="195,298 187,280 203,280" fill="var(--warn)"/>
  <text class="t" x="195" y="182" font-size="19" fill="var(--warn)" text-anchor="middle">現貨價格很貴</text>
  <line x1="640" y1="470" x2="640" y2="388" stroke="var(--accent)" stroke-width="4"/>
  <polygon points="640,380 632,398 648,398" fill="var(--accent)"/>
  <text class="t" x="640" y="500" font-size="22" fill="var(--accent)" text-anchor="middle">估值買的是這一塊</text>
</svg>
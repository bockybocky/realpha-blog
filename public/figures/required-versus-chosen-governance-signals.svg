<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩軸圖，左上角藍點叢與右下角灰點叢分居對角">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="56" font-size="27" fill="var(--ink)">哪一類數字值得看</text>

<line x1="140" y1="450" x2="890" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="450" x2="140" y2="110" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="290" font-size="16" fill="var(--dim)" text-anchor="middle" transform="rotate(-90 120 290)">告訴你多少事</text>
<text x="515" y="490" font-size="16" fill="var(--dim)" text-anchor="middle">被外部要求的程度</text>

<text x="156" y="140" font-size="20" fill="var(--accent)">被選擇的</text>
<circle cx="250" cy="200" r="9" fill="var(--accent)"/>
<text x="272" y="206" font-size="15" fill="var(--ink)">執行役員層的組成</text>
<circle cx="320" cy="258" r="9" fill="var(--accent)"/>
<text x="342" y="264" font-size="15" fill="var(--ink)">中階晉升路徑</text>
<circle cx="215" cy="316" r="9" fill="var(--accent)"/>
<text x="237" y="322" font-size="15" fill="var(--ink)">引導訓練的預算</text>

<text x="876" y="356" font-size="20" fill="var(--dim)" text-anchor="end">被要求的</text>
<circle cx="800" cy="392" r="9" fill="var(--grey)"/>
<text x="778" y="398" font-size="15" fill="var(--dim)" text-anchor="end">董事會女性比例</text>
<circle cx="836" cy="420" r="9" fill="var(--grey)"/>
<text x="814" y="426" font-size="15" fill="var(--dim)" text-anchor="end">揭露頁數</text>
<circle cx="762" cy="432" r="9" fill="var(--grey)"/>
<text x="740" y="438" font-size="15" fill="var(--dim)" text-anchor="end">政策文件齊不齊</text>

<text x="80" y="528" font-size="22" fill="var(--ink)">花錢做的，比寫進報告的誠實</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The line of sight falls only inside the income statement box, and the surcharge outside the box stays unseen." style="font-family:&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="80" y="72" font-size="27" fill="var(--ink)">Risk on both sides, only one hits the P&amp;L</text>

<circle cx="140" cy="280" r="26" fill="none" stroke="var(--ink)" stroke-width="3"/>
<circle cx="140" cy="280" r="9" fill="var(--ink)"/>
<text x="140" y="344" font-size="16" fill="var(--dim)" text-anchor="middle">Outsiders</text>

<line x1="176" y1="270" x2="330" y2="240" stroke="var(--accent)" stroke-width="3"/>
<line x1="176" y1="290" x2="330" y2="320" stroke="var(--accent)" stroke-width="3"/>

<rect x="340" y="150" width="300" height="260" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="490" y="192" font-size="20" fill="var(--accent)" text-anchor="middle">Income statement</text>
<rect x="380" y="240" width="220" height="80" rx="8" fill="var(--accent)"/>
<text x="490" y="288" font-size="20" fill="var(--page)" text-anchor="middle">Hedge gain or loss</text>
<text x="490" y="368" font-size="16" fill="var(--dim)" text-anchor="middle">Visible</text>

<rect x="700" y="240" width="200" height="80" rx="8" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 7"/>
<text x="800" y="288" font-size="20" fill="var(--dim)" text-anchor="middle">Fuel surcharge</text>
<text x="800" y="368" font-size="16" fill="var(--dim)" text-anchor="middle">Out of view</text>

<text x="80" y="500" font-size="22" fill="var(--ink)">A paper loss is only half the picture</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two lines with an arrow jumping from the low point of the fallen one to the line still high, which then also turns down." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/>
    </marker>
  </defs>

  <text x="80" y="54" font-size="27" font-weight="700" fill="var(--ink)">Fastest to switch, into what fell last</text>

  <line x1="100" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>

  <text x="120" y="190" font-size="19" font-weight="700" fill="var(--accent)">The strongest group before</text>
  <polyline points="120,210 250,190 370,252 480,385 620,398 860,392" fill="none" stroke="var(--accent)" stroke-width="4"/>

  <text x="120" y="252" font-size="19" font-weight="700" fill="var(--grey)">What everyone called shelter</text>
  <polyline points="120,270 300,256 520,232 630,300 770,425 860,430" fill="none" stroke="var(--grey)" stroke-width="4"/>

  <path d="M486,378 C520,340 520,270 546,236" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar3)"/>
  <text x="470" y="322" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="end">Switched</text>

  <text x="480" y="422" font-size="15" fill="var(--dim)" text-anchor="middle">Fell early</text>
  <text x="782" y="458" font-size="15" fill="var(--dim)" text-anchor="middle">Fell late</text>

  <text x="200" y="497" font-size="15" fill="var(--dim)" text-anchor="middle">May-June</text>
  <text x="500" y="497" font-size="15" fill="var(--dim)" text-anchor="middle">Early July</text>
  <text x="790" y="497" font-size="15" fill="var(--dim)" text-anchor="middle">Late July</text>

  <text x="480" y="536" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Fast, but toward the crowd</text>
</svg>
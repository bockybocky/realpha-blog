<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-label="一道只對大車隊開口的牆，把大量小方塊擋在網路之外">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .h{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:700;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
    .sq{fill:var(--card);stroke:var(--grey);stroke-width:1.5}
  </style>
  <rect x="0" y="0" width="960" height="570" fill="var(--page)"/>
  <text class="h" x="60" y="56">接不上網路的運能</text>
  <text class="g" x="60" y="104">近百萬家貨運公司</text>

  <rect x="70" y="132" width="48" height="48" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <rect x="132" y="132" width="48" height="48" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <rect x="194" y="132" width="48" height="48" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="b" x="70" y="206" fill="var(--accent)">大車隊</text>

  <rect class="sq" x="70" y="240" width="16" height="16"/><rect class="sq" x="92" y="240" width="16" height="16"/><rect class="sq" x="114" y="240" width="16" height="16"/><rect class="sq" x="136" y="240" width="16" height="16"/><rect class="sq" x="158" y="240" width="16" height="16"/><rect class="sq" x="180" y="240" width="16" height="16"/><rect class="sq" x="202" y="240" width="16" height="16"/><rect class="sq" x="224" y="240" width="16" height="16"/><rect class="sq" x="246" y="240" width="16" height="16"/><rect class="sq" x="268" y="240" width="16" height="16"/><rect class="sq" x="290" y="240" width="16" height="16"/><rect class="sq" x="312" y="240" width="16" height="16"/>
  <rect class="sq" x="70" y="262" width="16" height="16"/><rect class="sq" x="92" y="262" width="16" height="16"/><rect class="sq" x="114" y="262" width="16" height="16"/><rect class="sq" x="136" y="262" width="16" height="16"/><rect class="sq" x="158" y="262" width="16" height="16"/><rect class="sq" x="180" y="262" width="16" height="16"/><rect class="sq" x="202" y="262" width="16" height="16"/><rect class="sq" x="224" y="262" width="16" height="16"/><rect class="sq" x="246" y="262" width="16" height="16"/><rect class="sq" x="268" y="262" width="16" height="16"/><rect class="sq" x="290" y="262" width="16" height="16"/><rect class="sq" x="312" y="262" width="16" height="16"/>
  <rect class="sq" x="70" y="284" width="16" height="16"/><rect class="sq" x="92" y="284" width="16" height="16"/><rect class="sq" x="114" y="284" width="16" height="16"/><rect class="sq" x="136" y="284" width="16" height="16"/><rect class="sq" x="158" y="284" width="16" height="16"/><rect class="sq" x="180" y="284" width="16" height="16"/><rect class="sq" x="202" y="284" width="16" height="16"/><rect class="sq" x="224" y="284" width="16" height="16"/><rect class="sq" x="246" y="284" width="16" height="16"/><rect class="sq" x="268" y="284" width="16" height="16"/><rect class="sq" x="290" y="284" width="16" height="16"/><rect class="sq" x="312" y="284" width="16" height="16"/>
  <rect class="sq" x="70" y="306" width="16" height="16"/><rect class="sq" x="92" y="306" width="16" height="16"/><rect class="sq" x="114" y="306" width="16" height="16"/><rect class="sq" x="136" y="306" width="16" height="16"/><rect class="sq" x="158" y="306" width="16" height="16"/><rect class="sq" x="180" y="306" width="16" height="16"/><rect class="sq" x="202" y="306" width="16" height="16"/><rect class="sq" x="224" y="306" width="16" height="16"/><rect class="sq" x="246" y="306" width="16" height="16"/><rect class="sq" x="268" y="306" width="16" height="16"/><rect class="sq" x="290" y="306" width="16" height="16"/><rect class="sq" x="312" y="306" width="16" height="16"/>
  <rect class="sq" x="70" y="328" width="16" height="16"/><rect class="sq" x="92" y="328" width="16" height="16"/><rect class="sq" x="114" y="328" width="16" height="16"/><rect class="sq" x="136" y="328" width="16" height="16"/><rect class="sq" x="158" y="328" width="16" height="16"/><rect class="sq" x="180" y="328" width="16" height="16"/><rect class="sq" x="202" y="328" width="16" height="16"/><rect class="sq" x="224" y="328" width="16" height="16"/><rect class="sq" x="246" y="328" width="16" height="16"/><rect class="sq" x="268" y="328" width="16" height="16"/><rect class="sq" x="290" y="328" width="16" height="16"/><rect class="sq" x="312" y="328" width="16" height="16"/>
  <rect class="sq" x="70" y="350" width="16" height="16"/><rect class="sq" x="92" y="350" width="16" height="16"/><rect class="sq" x="114" y="350" width="16" height="16"/><rect class="sq" x="136" y="350" width="16" height="16"/><rect class="sq" x="158" y="350" width="16" height="16"/><rect class="sq" x="180" y="350" width="16" height="16"/><rect class="sq" x="202" y="350" width="16" height="16"/><rect class="sq" x="224" y="350" width="16" height="16"/><rect class="sq" x="246" y="350" width="16" height="16"/><rect class="sq" x="268" y="350" width="16" height="16"/><rect class="sq" x="290" y="350" width="16" height="16"/><rect class="sq" x="312" y="350" width="16" height="16"/>
  <text class="b" x="70" y="392">小車隊　不到十台車</text>

  <text class="g" x="441" y="106" text-anchor="middle">經紀商</text>
  <rect x="430" y="120" width="22" height="18" fill="var(--line)"/>
  <rect x="430" y="196" width="22" height="244" fill="var(--line)"/>
  <text class="b" x="441" y="464" text-anchor="middle">評等・責任</text>

  <path d="M240 162 H546" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <polygon points="546,154 546,170 560,162" fill="var(--accent)"/>

  <path d="M340 262 H412 M340 300 H412 M340 338 H412" stroke="var(--warn)" stroke-width="3" fill="none"/>
  <path d="M420 250 V274 M420 288 V312 M420 326 V350" stroke="var(--warn)" stroke-width="5" fill="none"/>
  <text class="b" x="376" y="234" text-anchor="middle" fill="var(--warn)">接不上</text>

  <rect x="560" y="132" width="300" height="136" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="710" y="190" text-anchor="middle">貨主</text>
  <text class="b" x="710" y="224" text-anchor="middle">一次要一千台</text>

  <text class="c" x="480" y="524" text-anchor="middle">車在、人在、照在，網路外</text>
</svg>
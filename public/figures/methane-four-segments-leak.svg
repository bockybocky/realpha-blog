<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條管線分成四段，各段向上漏出的箭頭長短差距懸殊，長程輸氣那段幾乎沒有">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="64">同一條氣，漏在四個不同的地方</text>

<line x1="180" y1="390" x2="180" y2="230" stroke="var(--accent)" stroke-width="11"/>
<polygon points="168,246 192,246 180,220" fill="var(--accent)"/>
<text class="g" x="180" y="200" text-anchor="middle">4%</text>
<text class="n" x="180" y="176" text-anchor="middle">平均值</text>

<line x1="380" y1="390" x2="380" y2="358" stroke="var(--grey)" stroke-width="4"/>
<polygon points="374,364 386,364 380,350" fill="var(--grey)"/>
<text class="g" x="380" y="332" text-anchor="middle">幾乎不漏</text>

<line x1="580" y1="390" x2="580" y2="270" stroke="var(--accent)" stroke-width="14"/>
<polygon points="566,286 594,286 580,258" fill="var(--accent)"/>
<text class="g" x="580" y="238" text-anchor="middle">隨場地放大</text>
<text class="n" x="580" y="214" text-anchor="middle">焊道、接頭變多</text>

<line x1="780" y1="390" x2="780" y2="200" stroke="var(--warn)" stroke-width="19"/>
<polygon points="762,216 798,216 780,186" fill="var(--warn)"/>
<text class="g" x="780" y="166" text-anchor="middle">3% → 12%</text>
<text class="n" x="780" y="142" text-anchor="middle">沒燒掉就溜走</text>

<rect x="80" y="390" width="800" height="40" fill="var(--grey)"/>
<line x1="280" y1="390" x2="280" y2="430" stroke="var(--page)" stroke-width="5"/>
<line x1="480" y1="390" x2="480" y2="430" stroke="var(--page)" stroke-width="5"/>
<line x1="680" y1="390" x2="680" y2="430" stroke="var(--page)" stroke-width="5"/>

<text class="n" x="180" y="458" text-anchor="middle">井口與集氣</text>
<text class="n" x="380" y="458" text-anchor="middle">長程輸氣</text>
<text class="n" x="580" y="458" text-anchor="middle">廠區管線</text>
<text class="n" x="780" y="458" text-anchor="middle">引擎排氣</text>

<text class="c" x="60" y="520">只算燒掉的，等於只算了一半</text>
</svg>
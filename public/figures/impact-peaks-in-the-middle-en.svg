<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Impact forms a bulge across career stages that peaks in the middle and falls off at both ends.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="58" font-size="27" fill="var(--ink)">Impact lands on the middle stretch</text>
<line x1="120" y1="400" x2="910" y2="400" stroke="var(--line)" stroke-width="2"/>
<polyline points="120,400 120,130" fill="none" stroke="var(--line)" stroke-width="2"/>
<text x="98" y="270" font-size="19" fill="var(--dim)" text-anchor="middle" transform="rotate(-90 98 270)">Impact</text>
<polygon points="160,398 300,330 450,215 560,180 680,230 780,320 860,385 860,400 160,400" fill="var(--warn)" opacity="0.16"/>
<polyline points="160,398 300,330 450,215 560,180 680,230 780,320 860,385" fill="none" stroke="var(--warn)" stroke-width="3.5"/>
<circle cx="560" cy="180" r="9" fill="var(--warn)"/>
<text x="560" y="160" font-size="20" fill="var(--warn)" text-anchor="middle">Deepest</text>
<text x="190" y="432" font-size="19" fill="var(--dim)" text-anchor="middle">Grad students</text>
<text x="330" y="458" font-size="19" fill="var(--dim)" text-anchor="middle">Young PhDs</text>
<text x="560" y="432" font-size="19" fill="var(--ink)" text-anchor="middle">Mid-career</text>
<text x="830" y="458" font-size="19" fill="var(--dim)" text-anchor="middle">Senior professors</text>
<text x="270" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">Can still pivot</text>
<text x="840" y="340" font-size="16" fill="var(--dim)" text-anchor="middle">Name established</text>
</g>
</svg>
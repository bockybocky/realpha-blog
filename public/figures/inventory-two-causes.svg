<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根等高的庫存柱，組成不同，左邊出口暢通右邊出口被堵住">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="80" y="72" font-size="27" font-weight="700" fill="var(--ink)">一樣高的庫存，推它的手不同</text>

  <text class="t" x="230" y="134" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">備料在推</text>
  <rect x="130" y="170" width="200" height="60" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="230" y="208" font-size="16" text-anchor="middle" fill="var(--dim)">製成品</text>
  <rect x="130" y="230" width="200" height="180" rx="6" fill="var(--accent)"/>
  <text class="t" x="230" y="330" font-size="16" font-weight="600" text-anchor="middle" fill="var(--page)">原物料・在製品</text>
  <line x1="340" y1="440" x2="430" y2="440" stroke="var(--accent)" stroke-width="5"/>
  <polygon points="448,440 424,429 424,451" fill="var(--accent)"/>
  <text class="t" x="230" y="474" font-size="16" text-anchor="middle" fill="var(--dim)">出得去</text>

  <text class="t" x="700" y="134" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">成品在堆</text>
  <rect x="600" y="170" width="200" height="180" rx="6" fill="var(--warn)"/>
  <text class="t" x="700" y="268" font-size="16" font-weight="600" text-anchor="middle" fill="var(--page)">製成品</text>
  <rect x="600" y="350" width="200" height="60" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="700" y="388" font-size="16" text-anchor="middle" fill="var(--dim)">原物料</text>
  <line x1="810" y1="440" x2="866" y2="440" stroke="var(--warn)" stroke-width="5"/>
  <line x1="880" y1="408" x2="880" y2="472" stroke="var(--warn)" stroke-width="7"/>
  <text class="t" x="700" y="474" font-size="16" text-anchor="middle" fill="var(--dim)">出不去</text>

  <line x1="480" y1="150" x2="480" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>

  <text class="t" x="480" y="524" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">同一個往上的數字，結論相反</text>
</svg>
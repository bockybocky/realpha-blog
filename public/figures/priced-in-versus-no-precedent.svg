<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左半邊三個方塊往下收斂成一條實心長條，右半邊上格填滿、下格是空的虛線框，形成滿與空的對比">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">會傷到你的，通常不是正瞪著你看的那個</text>
  <rect x="60" y="110" width="400" height="300" rx="14" fill="var(--card)"/>
  <text x="84" y="152" font-size="20" font-weight="700" fill="var(--ink)">攤在檯面上</text>
  <rect x="84" y="176" width="110" height="48" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="139" y="206" font-size="16" fill="var(--ink)" text-anchor="middle">日期</text>
  <rect x="206" y="176" width="110" height="48" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="261" y="206" font-size="16" fill="var(--ink)" text-anchor="middle">金額</text>
  <rect x="328" y="176" width="110" height="48" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="383" y="206" font-size="16" fill="var(--ink)" text-anchor="middle">報價</text>
  <line x1="139" y1="224" x2="200" y2="286" stroke="var(--grey)" stroke-width="2"/>
  <line x1="261" y1="224" x2="261" y2="286" stroke="var(--grey)" stroke-width="2"/>
  <line x1="383" y1="224" x2="322" y2="286" stroke="var(--grey)" stroke-width="2"/>
  <rect x="84" y="288" width="354" height="52" rx="10" fill="var(--accent)"/>
  <text x="261" y="322" font-size="17" font-weight="700" fill="var(--page)" text-anchor="middle">已經在價格裡</text>
  <text x="84" y="382" font-size="19" fill="var(--dim)">已知風險</text>
  <rect x="500" y="110" width="400" height="300" rx="14" fill="var(--card)"/>
  <text x="524" y="152" font-size="20" font-weight="700" fill="var(--ink)">沒有前例的那一塊</text>
  <text x="524" y="208" font-size="17" fill="var(--ink)">租約條款</text>
  <rect x="700" y="180" width="176" height="44" rx="10" fill="var(--accent)"/>
  <text x="788" y="209" font-size="16" font-weight="700" fill="var(--page)" text-anchor="middle">有</text>
  <text x="524" y="282" font-size="17" fill="var(--ink)">拆夥的判例</text>
  <rect x="700" y="254" width="176" height="44" rx="10" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="788" y="283" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="middle">無</text>
  <text x="524" y="344" font-size="19" font-weight="700" fill="var(--warn)">定不出價格</text>
  <text x="524" y="382" font-size="19" fill="var(--dim)">不確定性</text>
  <text x="480" y="482" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">該問的不是數字大不大，是有沒有人做過一遍</text>
</svg>
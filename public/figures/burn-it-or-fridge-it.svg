<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="左格債務塊燒掉成虛線消失，右格債務塊原樣被長箭頭往右推到未來">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">燒掉與冷藏，不是同一件事</text>
<rect x="60" y="96" width="400" height="300" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="84" y="132" font-size="19" fill="var(--warn)">丟進火裡</text>
<rect x="100" y="200" width="120" height="100" rx="6" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6"/>
<text x="112" y="336" font-size="16" fill="var(--dim)">債務不見</text>
<path d="M300 300 L330 230 L350 268 L374 200 L400 300 Z" fill="var(--warn)" opacity="0.7"/>
<rect x="500" y="96" width="400" height="300" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="524" y="132" font-size="19" fill="var(--accent)">放進冰箱</text>
<rect x="540" y="200" width="120" height="100" rx="6" fill="var(--grey)" opacity="0.4"/>
<path d="M676 250 L838 250" stroke="var(--accent)" stroke-width="8"/>
<path d="M838 232 L856 250 L838 268 Z" fill="var(--accent)"/>
<rect x="736" y="200" width="120" height="100" rx="6" fill="var(--grey)"/>
<text x="540" y="336" font-size="16" fill="var(--dim)">債務原樣，往後推</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一條路走到同一個斷裂處，有墊子的那條搭板跨過去，沒墊子的那條折下去掉進坑裡">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">教育打開了門，意外在門後面</text>
<rect x="470" y="150" width="110" height="340" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="470" y="130" style="fill:var(--warn)">車壞了</text>
<text class="s" x="470" y="108">＄1,500</text>
<text class="g" x="60" y="205">有存款</text>
<line x1="150" y1="240" x2="470" y2="240" stroke="var(--accent)" stroke-width="7"/>
<rect x="470" y="232" width="110" height="16" fill="var(--accent)"/>
<line x1="580" y1="240" x2="880" y2="240" stroke="var(--accent)" stroke-width="7"/>
<polygon points="880,224 912,240 880,256" fill="var(--accent)"/>
<text class="s" x="470" y="222">墊得過去</text>
<text class="g" x="700" y="205">照樣上班</text>
<text class="g" x="60" y="385">沒存款</text>
<line x1="150" y1="420" x2="470" y2="420" stroke="var(--accent)" stroke-width="7"/>
<polyline points="470,420 516,462 556,470" fill="none" stroke="var(--warn)" stroke-width="7"/>
<circle cx="560" cy="470" r="9" fill="var(--warn)"/>
<line x1="580" y1="420" x2="880" y2="420" stroke="var(--grey)" stroke-width="5" stroke-dasharray="10 10"/>
<text class="g" x="700" y="385" style="fill:var(--grey)">沒有後面</text>
<text class="c" x="60" y="528">同一個坑，差別只在腳下有沒有墊子</text>
</svg>
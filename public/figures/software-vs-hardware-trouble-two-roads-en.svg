<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two paths: the left one leads all the way to an AI agent, while the right one breaks halfway and never reaches the used-card seller.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
</style>
<text class="t" x="48" y="56">Who can help?</text>
<line x1="260" y1="475" x2="260" y2="175" stroke="var(--line)" stroke-width="70"/>
<line x1="260" y1="470" x2="260" y2="180" stroke="var(--grey)" stroke-width="4" stroke-dasharray="18 14"/>
<circle cx="260" cy="140" r="34" fill="var(--accent)"/>
<text class="g" x="310" y="134">AI agent</text>
<text class="b" x="310" y="160" style="fill:var(--accent)">1 CNY</text>
<text class="g" x="260" y="512" text-anchor="middle">Software</text>
<line x1="700" y1="475" x2="700" y2="335" stroke="var(--line)" stroke-width="70"/>
<line x1="700" y1="470" x2="700" y2="340" stroke="var(--grey)" stroke-width="4" stroke-dasharray="18 14"/>
<polyline points="665,335 678,325 690,337 703,324 716,336 728,325 735,333" fill="none" stroke="var(--warn)" stroke-width="3"/>
<polyline points="665,270 678,280 690,268 703,281 716,269 728,280 735,272" fill="none" stroke="var(--warn)" stroke-width="3"/>
<rect x="665" y="180" width="70" height="88" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="700" cy="140" r="34" fill="none" stroke="var(--grey)" stroke-width="2.5" stroke-dasharray="6 5"/>
<text class="g" x="750" y="134" style="fill:var(--dim)">Seller</text>
<text class="g" x="760" y="298" style="fill:var(--warn)">Cut</text>
<text class="s" x="760" y="322">No link/phone</text>
<text class="g" x="700" y="512" text-anchor="middle">Hardware</text>
</svg>
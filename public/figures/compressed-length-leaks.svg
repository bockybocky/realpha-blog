<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三根長度條，猜中的那根明顯比較短">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .a { font-size:16px; fill:var(--accent); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="68">加密藏得住內容，藏不住長度</text>
  <text class="d" x="60" y="108">攻擊方餵進一段自己挑的字，看壓縮後有多長</text>

  <text class="g" x="60" y="190">猜 a</text>
  <rect x="200" y="168" width="420" height="28" rx="4" fill="var(--grey)"/>
  <text class="d" x="636" y="190">7</text>

  <text class="g" x="60" y="260">猜 b</text>
  <rect x="200" y="238" width="420" height="28" rx="4" fill="var(--grey)"/>
  <text class="d" x="636" y="260">7</text>

  <text class="g" x="60" y="330">猜 c</text>
  <rect x="200" y="308" width="300" height="28" rx="4" fill="var(--accent)"/>
  <text class="a" x="516" y="330">5　猜中了</text>

  <line x1="200" y1="370" x2="620" y2="370" stroke="var(--line)" stroke-width="2"/>
  <text class="d" x="200" y="400">一個字一個字還原出密碼</text>

  <text class="c" x="60" y="486">2011 年的標準答案，三年後是漏洞</text>
</svg>
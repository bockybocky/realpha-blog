<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條先漲後崩的價格線：太早賣少賺的那一段有上限，太晚賣虧掉的那一段大得多，而且發生在你最需要現金的時候">
  <style>
    svg {
      --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; --warnbg:#fdf4e7;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; --warnbg:#2b2411;
      }
    }
    .t    { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1   { font-size:27px; font-weight:700; fill:var(--ink); }
    .lab  { font-size:18px; font-weight:700; fill:var(--ink); }
    .cost { font-size:16px; font-weight:700; }
    .sub  { font-size:15px; fill:var(--dim); }
    .kick { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>

  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <g class="t">
    <text x="480" y="44" class="h1" text-anchor="middle">賣太早和賣太晚，錯誤的形狀不一樣</text>

    <rect x="380" y="140" width="12" height="82" fill="var(--accent)" opacity="0.35"/>
    <rect x="788" y="140" width="12" height="250" fill="var(--warn)" opacity="0.4"/>

    <path d="M120,392 C240,340 360,244 520,146 C640,200 720,300 860,418"
          fill="none" stroke="var(--grey)" stroke-width="4" stroke-linecap="round"/>

    <line x1="120" y1="146" x2="860" y2="146" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6,5"/>

    <circle cx="386" cy="222" r="9" fill="var(--accent)"/>
    <text x="386" y="196" class="lab" text-anchor="middle">太早賣</text>
    <text x="298" y="262" class="cost" fill="var(--accent)">少賺的部分</text>
    <text x="298" y="286" class="sub">有上限，而且你活得下去</text>

    <circle cx="794" cy="390" r="9" fill="var(--warn)"/>
    <text x="800" y="426" class="lab" text-anchor="middle">太晚賣</text>
    <text x="700" y="286" class="cost" fill="var(--warn)">虧掉的部分</text>
    <text x="640" y="312" class="sub">被迫在最壞的價格離開，</text>
    <text x="640" y="336" class="sub">而那通常同時是</text>
    <text x="640" y="360" class="sub">你最需要現金的時候</text>

    <line x1="100" y1="462" x2="880" y2="462" stroke="var(--line)" stroke-width="1"/>
    <text x="480" y="496" class="sub" text-anchor="middle">有人問摩根成功的祕訣，他說：賣得太早。</text>

    <text x="480" y="542" class="kick" text-anchor="middle">兩種錯誤不該用同一個標準去避免。</text>
  </g>
</svg>

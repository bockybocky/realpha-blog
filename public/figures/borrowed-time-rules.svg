<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左柱立在薄薄的機關規則上、下有一支筆，右柱立在厚實的國會法律基座上">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t h" x="60" y="66">規則站在什麼上面</text>

  <rect x="110" y="120" width="300" height="48" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t g" x="196" y="152">長出來的市場</text>
  <rect x="240" y="168" width="40" height="180" fill="var(--grey)"/>
  <rect x="190" y="348" width="140" height="14" rx="4" fill="var(--warn)"/>
  <text class="t b" x="130" y="394">機關自訂規則</text>
  <path d="M190 430 L300 430" stroke="var(--warn)" stroke-width="4"/>
  <path d="M300 430 L330 418" stroke="var(--warn)" stroke-width="4"/>
  <text class="t b" x="130" y="466">一支筆就能抹掉</text>

  <rect x="550" y="120" width="300" height="48" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t g" x="636" y="152">長出來的市場</text>
  <rect x="680" y="168" width="40" height="180" fill="var(--accent)"/>
  <rect x="560" y="348" width="280" height="62" rx="6" fill="var(--accent)"/>
  <text class="t b" x="584" y="386" fill="var(--page)">國會立的法</text>
  <text class="t c" x="560" y="466">撐得過換屆</text>
</svg>
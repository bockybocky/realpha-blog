<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上下兩條等長的長條，下面那條左端的色塊明顯變長，再往下拆成約三分之二與其餘兩段">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">資料中心這一塊，會從一小段變成三倍以上</text>

  <text class="d" x="80" y="118">現在的全美用電</text>
  <rect x="80" y="132" width="800" height="72" fill="var(--card)" stroke="var(--line)"/>
  <rect x="80" y="132" width="42" height="72" fill="var(--accent)"/>
  <text class="d" x="138" y="176">約 5%（他自己標「我猜」）</text>

  <polygon points="470,218 490,218 480,250" fill="var(--dim)"/>

  <text class="d" x="80" y="296">未來的全美用電</text>
  <rect x="80" y="310" width="800" height="72" fill="var(--card)" stroke="var(--line)"/>
  <rect x="80" y="310" width="140" height="72" fill="var(--accent)"/>
  <text class="d" x="238" y="354">三倍以上</text>

  <text class="d" x="80" y="432">這一塊的氣源來源</text>
  <rect x="80" y="444" width="140" height="48" fill="var(--card)" stroke="var(--line)"/>
  <rect x="80" y="444" width="93" height="48" fill="var(--warn)"/>
  <text class="d" x="238" y="476">約三分之二由燃氣發電供應</text>

  <text class="c" x="560" y="476">長出來的那一塊，燃氣吃掉大半</text>
</svg>
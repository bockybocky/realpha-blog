<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left a column stands on the regulatory minimum with its upper slice added by the rules; on the right two points at the same height show one narrow and one wide band of volatility.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .a { font-size:16px; font-weight:700; fill:var(--accent); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56">Size, not vol</text>
  <text class="g" x="60" y="110">Amt</text>
  <text class="g" x="520" y="110">Vol</text>

  <rect x="120" y="170" width="140" height="210" fill="var(--accent)" fill-opacity="0.3" stroke="var(--accent)" stroke-width="2"/>
  <line x1="80" y1="310" x2="330" y2="310" stroke="var(--dim)" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="80" y1="380" x2="330" y2="380" stroke="var(--dim)" stroke-width="3"/>
  <text class="s" x="80" y="406">0</text>
  <text class="s" x="268" y="302">RegMin</text>
  <text class="a" x="268" y="206">Added</text>

  <line x1="520" y1="280" x2="900" y2="280" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="560" y="262" width="140" height="36" fill="var(--accent)" fill-opacity="0.28" stroke="var(--accent)" stroke-width="2"/>
  <rect x="740" y="214" width="140" height="132" fill="var(--warn)" fill-opacity="0.24" stroke="var(--warn)" stroke-width="2"/>
  <text class="s" x="572" y="336">N</text>
  <text class="s" x="752" y="384">W</text>
  <text class="s" x="520" y="430">Same flr, 2 vols</text>
</svg>
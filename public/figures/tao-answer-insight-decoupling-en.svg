<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Two routes to an answer: the old one runs through understanding, the new one is an AI tunnel that bypasses it">
  <style>
    svg {
      --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922;
      }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect width="960" height="420" fill="var(--page)"/>
  <text class="t" x="480" y="40" text-anchor="middle" font-size="22" fill="var(--ink)">Both roads reach the answer. Only one makes you stronger.</text>

  <rect x="46" y="150" width="118" height="72" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="105" y="194" text-anchor="middle" font-size="21" fill="var(--ink)">Problem</text>

  <rect x="796" y="150" width="118" height="72" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="855" y="194" text-anchor="middle" font-size="21" fill="var(--ink)">Answer</text>

  <rect x="380" y="82" width="200" height="76" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="480" y="128" text-anchor="middle" font-size="21" fill="var(--accent)">Understand the field</text>

  <path d="M164 172 C 260 172 280 120 380 120" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M580 120 C 680 120 700 172 790 172" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="790,166 804,172 790,178" fill="var(--accent)"/>
  <text class="t" x="480" y="70" text-anchor="middle" font-size="19" fill="var(--accent)">The old road: you had to understand first</text>

  <path d="M164 200 C 380 300 580 300 790 200" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
  <polygon points="784,194 800,199 786,206" fill="var(--warn)"/>
  <text class="t" x="480" y="322" text-anchor="middle" font-size="19" fill="var(--warn)">The new one: type it into an AI, skip the middle box</text>

  <text class="t" x="480" y="378" text-anchor="middle" font-size="20" fill="var(--dim)">Equally correct, equally checkable. The difference shows up the day someone asks you why.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條同樣長的軌道上下並排，上面那條只填到六成右邊留一大段空白，下面那條整條填滿，空白處就是落差">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="66" font-size="27" font-weight="700" fill="var(--ink)">同一題，兩個答案</text>
<text x="80" y="150" font-size="20" font-weight="700" fill="var(--dim)">巴克萊調查回收的答案</text>
<rect x="80" y="170" width="720" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="80" y="170" width="432" height="60" rx="8" fill="var(--accent)"/>
<text x="104" y="208" font-size="20" font-weight="700" fill="var(--page)">六成：會是問題</text>
<text x="536" y="208" font-size="16" fill="var(--dim)">其餘約四成：看不出有融資問題</text>
<text x="80" y="300" font-size="20" font-weight="700" fill="var(--dim)">Altmann 認為該有的答案</text>
<rect x="80" y="320" width="720" height="60" rx="8" fill="var(--warn)"/>
<text x="104" y="358" font-size="20" font-weight="700" fill="var(--page)">一百</text>
<rect x="512" y="400" width="288" height="4" fill="var(--grey)"/>
<rect x="512" y="400" width="4" height="22" fill="var(--grey)"/>
<rect x="796" y="400" width="4" height="22" fill="var(--grey)"/>
<text x="656" y="446" font-size="16" fill="var(--dim)" text-anchor="middle">這一段＝落差</text>
<text x="80" y="492" font-size="22" font-weight="700" fill="var(--ink)">落差不在數字，在這幾週有沒有被算進去</text>
</svg>
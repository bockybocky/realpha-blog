<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一群零散的小方塊大多轉成淺灰消失，一個箭頭指向右邊一個大方塊，大方塊裡並列三格資產">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="66" font-size="27" fill="var(--ink)">倒掉的那層，資產往上集中</text>
<text x="90" y="140" font-size="19" fill="var(--dim)">GPU 出租業者</text>
<g fill="var(--grey)">
<rect x="90" y="170" width="52" height="52" rx="6"/>
<rect x="156" y="170" width="52" height="52" rx="6"/>
<rect x="222" y="170" width="52" height="52" rx="6"/>
<rect x="288" y="170" width="52" height="52" rx="6"/>
<rect x="90" y="236" width="52" height="52" rx="6"/>
<rect x="222" y="236" width="52" height="52" rx="6"/>
<rect x="288" y="236" width="52" height="52" rx="6"/>
<rect x="90" y="302" width="52" height="52" rx="6"/>
<rect x="156" y="302" width="52" height="52" rx="6"/>
<rect x="288" y="302" width="52" height="52" rx="6"/>
</g>
<rect x="156" y="236" width="52" height="52" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="222" y="302" width="52" height="52" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="90" y="400" font-size="16" fill="var(--grey)">灰的：消失</text>
<text x="240" y="400" font-size="16" fill="var(--accent)">留下：少數</text>
<line x1="400" y1="262" x2="520" y2="262" stroke="var(--dim)" stroke-width="3"/>
<polygon points="520,254 544,262 520,270" fill="var(--dim)"/>
<text x="470" y="240" font-size="16" fill="var(--dim)" text-anchor="middle">整併</text>
<rect x="570" y="150" width="320" height="250" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="730" y="186" font-size="19" fill="var(--accent)" text-anchor="middle">超大規模雲</text>
<rect x="596" y="210" width="268" height="52" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="730" y="243" font-size="16" fill="var(--ink)" text-anchor="middle">土地</text>
<rect x="596" y="272" width="268" height="52" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="730" y="305" font-size="16" fill="var(--ink)" text-anchor="middle">電力</text>
<rect x="596" y="334" width="268" height="52" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="730" y="367" font-size="16" fill="var(--ink)" text-anchor="middle">廠殼</text>
<text x="60" y="490" font-size="22" fill="var(--ink)">低價接手的人，資本支出效率反而更好</text>
</svg>
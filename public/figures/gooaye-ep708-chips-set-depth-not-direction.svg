<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條路徑從同一點沿同一條基本面斜線往下，被迫賣出那條多出一根長下影線，終點相同">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">籌碼決定深度，方向歸基本面</text>
<line x1="130" y1="100" x2="130" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="130" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="62" y="114" font-size="16" fill="var(--dim)">價格</text>
<text x="860" y="500" font-size="16" fill="var(--dim)">時間</text>
<line x1="180" y1="180" x2="820" y2="330" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="740" y="306" font-size="19" fill="var(--dim)">基本面</text>
<path d="M180 180 L300 226 L420 274 L560 300 L780 322" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M180 180 L300 252 L420 356 L478 428 L520 334 L620 330 L780 322" fill="none" stroke="var(--warn)" stroke-width="3"/>
<line x1="478" y1="358" x2="478" y2="430" stroke="var(--warn)" stroke-width="5"/>
<circle cx="180" cy="180" r="7" fill="var(--ink)"/>
<circle cx="780" cy="322" r="7" fill="var(--ink)"/>
<text x="286" y="206" font-size="19" fill="var(--accent)">沒人被迫賣</text>
<text x="340" y="400" font-size="19" fill="var(--warn)">被迫賣出</text>
<text x="494" y="452" font-size="16" fill="var(--warn)">長下影線</text>
<text x="790" y="356" font-size="16" fill="var(--dim)">同一個方向</text>
<text x="130" y="525" font-size="22" fill="var(--ink)">站不住的，籌碼洗完也只是跌得慢一點</text>
</svg>
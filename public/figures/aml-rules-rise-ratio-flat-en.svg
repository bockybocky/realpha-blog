<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The staircase at the top rises from 1970 as anti-money-laundering rules stack up, while the 2% to 5% band below stays flat from the late 1990s to today.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<text class="t" x="480" y="48" text-anchor="middle">Rules up, ratio flat</text>
<text class="g" x="20" y="205">AML rules</text>
<line x1="120" y1="290" x2="880" y2="290" stroke="var(--grey)" stroke-width="1.5"/>
<path d="M120,290 L120,265 L378,265 L378,225 L541,225 L541,185 L663,185 L663,150 L798,150 L798,115 L880,115 L880,290 Z" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="128" y="256">1970 Bank Secrecy Act</text>
<text class="b" x="386" y="216">1989 FATF founded</text>
<text class="g a" x="876" y="104" text-anchor="end">Compliance ≈ $200B/yr</text>
<text class="g" x="20" y="400">Laundering</text>
<text class="g" x="20" y="426">of global GDP</text>
<rect x="500" y="363" width="380" height="70" fill="var(--warn)" fill-opacity="0.18" stroke="var(--warn)" stroke-width="2"/>
<text class="b" x="500" y="352">Late-1990s estimate</text>
<text class="c w" x="690" y="406" text-anchor="middle">2% – 5%</text>
<text class="b" x="690" y="462" text-anchor="middle">Flat for 30 years</text>
<line x1="120" y1="480" x2="880" y2="480" stroke="var(--grey)" stroke-width="1.5"/>
<text class="b" x="120" y="504" text-anchor="middle">1970</text>
<text class="b" x="391" y="504" text-anchor="middle">1990</text>
<text class="b" x="663" y="504" text-anchor="middle">2010</text>
<text class="b" x="880" y="504" text-anchor="end">2026</text>
<text class="c" x="480" y="545" text-anchor="middle">Spending climbs, the ratio stays flat</text>
</svg>
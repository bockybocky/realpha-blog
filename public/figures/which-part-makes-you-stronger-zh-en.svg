<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two lines on one chart: the chores that never make you stronger no matter how many times you do them run flat along the bottom, while working out why you were wrong climbs up to the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Which part makes you stronger next time</text>

  <rect x="60" y="92" width="840" height="340" rx="14" fill="var(--card)"/>
  <line x1="130" y1="390" x2="860" y2="390" stroke="var(--line)" stroke-width="2"/>
  <line x1="130" y1="140" x2="130" y2="390" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="130" y="128" font-size="16" fill="var(--dim)">Stronger</text>
  <text class="t" x="860" y="416" font-size="16" fill="var(--dim)" text-anchor="end">Times done</text>

  <path d="M130 360 C 330 280, 560 210, 820 158" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="820" cy="158" r="9" fill="var(--accent)"/>
  <text class="t" x="806" y="138" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="end">Why it was wrong</text>
  <text class="t" x="806" y="186" font-size="16" fill="var(--dim)" text-anchor="end">How to think next</text>

  <line x1="130" y1="366" x2="820" y2="362" stroke="var(--grey)" stroke-width="4"/>
  <circle cx="820" cy="362" r="9" fill="var(--grey)"/>
  <text class="t" x="806" y="344" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="end">Writing tests</text>
  <text class="t" x="806" y="384" font-size="16" fill="var(--dim)" text-anchor="end">Tool setup　Charting</text>

  <text class="t" x="480" y="498" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Hand off the flat line, keep the climbing one</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="單一上游民調分出兩條線到模型與預測市場，兩者再互連">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .ti{font-size:27px;font-weight:700}
    .g{font-size:20px;font-weight:700}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t ti" x="60" y="56">看起來兩個訊號源，上游只有一個</text>
<rect x="70" y="210" width="190" height="100" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t g" x="132" y="266" fill="var(--accent)">民調</text>
<text class="t b" x="92" y="336">同一份原料</text>
<path d="M265 240 C 400 180, 480 160, 600 160" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#a6)"/>
<path d="M265 282 C 400 340, 480 370, 600 370" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#a6)"/>
<rect x="610" y="118" width="250" height="86" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="664" y="168">他的模型</text>
<rect x="610" y="328" width="250" height="86" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="664" y="378">預測市場</text>
<path d="M700 208 L700 322" stroke="var(--dim)" stroke-width="3" marker-end="url(#a6d)"/>
<path d="M780 322 L780 208" stroke="var(--dim)" stroke-width="3" marker-end="url(#a6d)"/>
<text class="t g" x="800" y="270" fill="var(--dim)">相關 0.995</text>
<defs>
<marker id="a6" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
<marker id="a6d" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker>
</defs>
<text class="t c" x="60" y="488">不是第二個訊號，是同一個訊號的兩種包裝</text>
</svg>
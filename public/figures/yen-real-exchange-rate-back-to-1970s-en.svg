<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A real purchasing-power curve rises from the early 1970s to a mid-period peak and falls back to the same level it started from.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); font-weight:700; }
    .bdy { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="62">The yen's purchasing power is back at the start</text>
  <text class="bdy" x="90" y="104">Real purchasing power</text>
  <line x1="90" y1="115" x2="90" y2="440" stroke="var(--line)" stroke-width="2"/>
  <line x1="90" y1="440" x2="910" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="bdy" x="80" y="130" text-anchor="end">Strong</text>
  <text class="bdy" x="80" y="432" text-anchor="end">Weak</text>
  <line x1="130" y1="403" x2="880" y2="403" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <polyline points="130,405 260,300 400,205 560,175 700,255 880,400" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="130" cy="405" r="7" fill="var(--accent)"/>
  <circle cx="880" cy="400" r="7" fill="var(--accent)"/>
  <text class="bdy" x="400" y="185" text-anchor="middle">Electronics swept the world</text>
  <text class="bdy" x="580" y="155" text-anchor="middle">The Toyota export wave</text>
  <text class="grp" x="130" y="474" text-anchor="middle">Early 1970s</text>
  <text class="grp" x="880" y="474" text-anchor="middle">Today</text>
  <text class="end" x="60" y="524">Same purchasing power, a different Japan</text>
</svg>
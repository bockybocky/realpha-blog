<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A dashed arc leaps over the wide band in the middle, going straight from the left end to the right end.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.ttl{font-size:27px;font-weight:700}
.grp{font-size:20px;font-weight:700}
.bdy{font-size:16px;fill:var(--dim)}
.cnc{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ttl" x="60" y="62">Skipped bit</text>

<path d="M120 258 C 300 96, 700 96, 850 258" fill="none" stroke="var(--warn)" stroke-width="5" stroke-dasharray="14 10"/>
<path d="M850 258 l-18 -18 l24 -6 z" fill="var(--warn)"/>
<text class="grp" x="432" y="132">"Rev"</text>

<rect x="60" y="258" width="124" height="120" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="grp" x="92" y="326">Tech</text>

<rect x="230" y="258" width="540" height="120" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="338" y1="258" x2="338" y2="378" stroke="var(--line)" stroke-width="2"/>
<line x1="446" y1="258" x2="446" y2="378" stroke="var(--line)" stroke-width="2"/>
<line x1="554" y1="258" x2="554" y2="378" stroke="var(--line)" stroke-width="2"/>
<line x1="662" y1="258" x2="662" y2="378" stroke="var(--line)" stroke-width="2"/>
<text class="bdy" x="252" y="326">Org</text>
<text class="bdy" x="360" y="326">Doc</text>
<text class="bdy" x="468" y="326">Trg</text>
<text class="bdy" x="576" y="326">Ppl</text>
<text class="bdy" x="684" y="326">Cul</text>

<rect x="816" y="258" width="88" height="120" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="grp" x="840" y="326">Use</text>

<line x1="230" y1="414" x2="770" y2="414" stroke="var(--accent)" stroke-width="4"/>
<line x1="230" y1="402" x2="230" y2="426" stroke="var(--accent)" stroke-width="4"/>
<line x1="770" y1="402" x2="770" y2="426" stroke="var(--accent)" stroke-width="4"/>
<text class="grp" x="462" y="452">20yr</text>

<text class="cnc" x="60" y="518">Skipped part decides</text>
</svg>
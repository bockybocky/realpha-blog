<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="加倍下注的注碼柱由幾乎看不見一路暴衝頂天，右側標示要贏回的只有一塊錢，那條線細到幾乎看不見">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">輸了就加倍，注碼長這樣</text>
  <line x1="80" y1="430" x2="700" y2="430" stroke="var(--line)" stroke-width="2"/>
  <rect x="90" y="428" width="40" height="2" fill="var(--warn)"/>
  <rect x="150" y="427" width="40" height="3" fill="var(--warn)"/>
  <rect x="210" y="425" width="40" height="5" fill="var(--warn)"/>
  <rect x="270" y="422" width="40" height="8" fill="var(--warn)"/>
  <rect x="330" y="415" width="40" height="15" fill="var(--warn)"/>
  <rect x="390" y="400" width="40" height="30" fill="var(--warn)"/>
  <rect x="450" y="370" width="40" height="60" fill="var(--warn)"/>
  <rect x="510" y="310" width="40" height="120" fill="var(--warn)"/>
  <rect x="570" y="190" width="40" height="240" fill="var(--warn)"/>
  <text class="t" x="86" y="456" font-size="16" fill="var(--dim)">第 1 把</text>
  <text class="t" x="556" y="456" font-size="16" fill="var(--dim)">第 10 把</text>
  <text class="t" x="560" y="170" font-size="19" font-weight="700" fill="var(--warn)">押 1,024</text>
  <line x1="760" y1="428" x2="880" y2="428" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="760" y="404" font-size="19" font-weight="700" fill="var(--accent)">贏回 1</text>
  <text class="t" x="760" y="456" font-size="16" fill="var(--dim)">目標</text>
  <text class="t" x="60" y="524" font-size="22" font-weight="700" fill="var(--ink)">押上去的往上衝，想拿回來的始終貼著地</text>
</svg>
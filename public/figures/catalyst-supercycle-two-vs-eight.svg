<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="十格方塊代表終端能源需求，只有兩格是電、八格是直接燒掉的燃料，一支箭頭把燃料那側一格一格往電這側搬">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">美國終端能源需求，十格裡只有兩格是電</text>

  <rect x="60" y="140" width="164" height="150" rx="8" fill="var(--accent)"/>
  <rect x="236" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="304" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="372" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="440" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="508" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="576" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="644" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="712" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>

  <text x="142" y="222" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">電</text>
  <text x="142" y="252" font-size="16" fill="var(--page)" text-anchor="middle">兩成</text>
  <text x="502" y="222" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">直接燒掉的燃料</text>
  <text x="502" y="252" font-size="16" fill="var(--ink)" text-anchor="middle">八成</text>

  <g font-size="15" fill="var(--dim)" text-anchor="middle">
    <text x="264" y="320">客運</text>
    <text x="400" y="320">重載運輸</text>
    <text x="536" y="320">暖氣</text>
    <text x="700" y="320">精密製造製程</text>
  </g>

  <line x1="700" y1="372" x2="252" y2="372" stroke="var(--accent)" stroke-width="4"/>
  <path d="M 252 360 L 228 372 L 252 384 Z" fill="var(--accent)"/>
  <text x="700" y="356" font-size="19" fill="var(--accent)" text-anchor="end">一格一格往電這邊搬</text>
  <text x="700" y="402" font-size="16" fill="var(--dim)" text-anchor="end">幾十年的慢趨勢，AI 出現之前就在走</text>

  <text x="60" y="470" font-size="22" font-weight="700" fill="var(--ink)">看多的空間不在那兩格，在要被搬過來的八格</text>
</svg>
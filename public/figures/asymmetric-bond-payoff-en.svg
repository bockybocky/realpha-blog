<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A tall upward bar sits left of the zero line and a very short downward bar sits right of it, making reward and risk wildly unequal.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="48" y="62">The two sides differ in length</text>
<line x1="48" y1="360" x2="912" y2="360" stroke="var(--ink)" stroke-width="3"/>
<text class="b" x="48" y="386">Zero</text>
<rect x="240" y="195" width="140" height="165" rx="4" fill="var(--accent)"/>
<text class="g" x="258" y="178" fill="var(--accent)">+11</text>
<text class="b" x="230" y="420">Yields fall 100 bps</text>
<rect x="600" y="360" width="140" height="15" rx="3" fill="var(--warn)"/>
<text class="g" x="618" y="402" fill="var(--warn)">-1</text>
<text class="b" x="590" y="440">Yields rise 100 bps</text>
<text class="c" x="48" y="492">Not an opinion, a sum you can redo yourself</text>
</svg>
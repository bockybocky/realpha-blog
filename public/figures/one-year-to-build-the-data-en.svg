<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A line falls from a high point on the left into a trough and rises to a high point on the right; the trough is labeled one year, with notes below saying segment profits were unavailable, investors were consulted first, and the internal system was then built."><rect x="0" y="0" width="960" height="600" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
<text x="80" y="60" font-size="27" fill="var(--ink)">What held up that year</text>
<text x="80" y="92" font-size="16" fill="var(--dim)">One year passed between the board's decision to improve the data and its delivery</text>
<line x1="140" y1="168" x2="820" y2="168" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="440" y="150" width="80" height="34" fill="var(--page)"/>
<text x="480" y="175" font-size="20" fill="var(--dim)" text-anchor="middle">One year</text>
<path d="M140 250 C 300 250, 320 420, 480 420 C 640 420, 660 250, 820 250" fill="none" stroke="var(--accent)" stroke-width="3"/>
<circle cx="140" cy="250" r="8" fill="var(--accent)"/>
<circle cx="820" cy="250" r="8" fill="var(--accent)"/>
<text x="160" y="228" font-size="19" fill="var(--ink)">Board decision: improve the data</text>
<text x="800" y="228" font-size="19" fill="var(--ink)" text-anchor="end">Investors see the new deck</text>
<text x="480" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">Segment profits unavailable</text>
<text x="480" y="490" font-size="16" fill="var(--dim)" text-anchor="middle">Ask investors what they need</text>
<text x="480" y="518" font-size="16" fill="var(--dim)" text-anchor="middle">Build the internal system</text>
<text x="80" y="572" font-size="22" fill="var(--ink)">A side effect: better board discussions</text>
</svg>
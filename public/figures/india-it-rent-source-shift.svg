<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩根堆疊柱，灰色的工時段大幅縮短，藍色的簽名段相對變厚，整根也變矮">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">收的是哪一種租</text>
<line x1="120" y1="420" x2="840" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="210" y="140" width="180" height="220" fill="var(--grey)"/>
<rect x="210" y="360" width="180" height="60" fill="var(--accent)"/>
<text x="300" y="258" text-anchor="middle" font-size="19" fill="var(--ink)">程式員工時</text>
<text x="300" y="398" text-anchor="middle" font-size="16" fill="var(--page)">簽名</text>
<text x="300" y="458" text-anchor="middle" font-size="19" fill="var(--dim)">以前</text>
<rect x="580" y="260" width="180" height="70" fill="var(--grey)"/>
<rect x="580" y="330" width="180" height="90" fill="var(--accent)"/>
<text x="670" y="302" text-anchor="middle" font-size="16" fill="var(--ink)">工時</text>
<text x="670" y="382" text-anchor="middle" font-size="19" fill="var(--page)">為結果簽名</text>
<text x="670" y="458" text-anchor="middle" font-size="19" fill="var(--dim)">現在</text>
<path d="M410 200 L560 258" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="485" y="195" text-anchor="middle" font-size="16" fill="var(--warn)">被工具吃掉</text>
<text x="480" y="508" text-anchor="middle" font-size="22" fill="var(--ink)">稀缺搬家，收費位置跟著動</text>
</svg>
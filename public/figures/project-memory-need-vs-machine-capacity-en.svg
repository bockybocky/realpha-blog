<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three machine-memory bars are compared with a dashed project-requirement line, and only the tallest machine clears it.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="48" y="54">Will it fit?</text>
<line x1="110" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="410" width="140" height="30" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="420" y="358" width="140" height="82" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="660" y="220" width="140" height="220" fill="var(--accent)"/>
<line x1="110" y1="268" x2="880" y2="268" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="9 6"/>
<text class="b" x="110" y="256" fill="var(--warn)">One project: about 200GB</text>
<text class="b" x="250" y="398" text-anchor="middle">Not enough memory</text>
<text class="b" x="490" y="346" text-anchor="middle">96GB</text>
<text class="b" x="730" y="208" text-anchor="middle">256GB</text>
<text class="g" x="250" y="474" text-anchor="middle">Small Mac mini</text>
<text class="g" x="490" y="474" text-anchor="middle">Mac Studio</text>
<text class="g" x="730" y="474" text-anchor="middle">Workstation</text>
<text class="c" x="480" y="528" text-anchor="middle">Memory holds him back, not model size</text>
</svg>
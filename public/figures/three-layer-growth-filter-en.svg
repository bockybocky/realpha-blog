<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A three-stage funnel narrowing from wide to tight, labeled payback, track record and oversight, each with a side branch for what is screened out, and only what passes the bottom exit enters the valuation.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t h" x="60" y="62">Three filters for a growth plan</text>

  <rect x="200" y="110" width="440" height="80" fill="var(--accent)" opacity="0.18" stroke="var(--line)"/>
  <text class="t g" x="222" y="158">Payback</text>
  <text class="t b" x="380" y="158">As a return; below the cost of capital it's out</text>

  <rect x="260" y="210" width="320" height="80" fill="var(--accent)" opacity="0.30" stroke="var(--line)"/>
  <text class="t g" x="282" y="258">Track record</text>
  <text class="t b" x="400" y="258">What past spending grew into</text>

  <rect x="320" y="310" width="200" height="80" fill="var(--accent)" opacity="0.45" stroke="var(--line)"/>
  <text class="t g" x="342" y="358">Oversight</text>

  <path d="M420 390 V450" stroke="var(--accent)" stroke-width="4"/>
  <path d="M420 450 l-9 -18 h18 z" fill="var(--accent)"/>
  <rect x="280" y="455" width="280" height="64" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t g" x="302" y="496">Into the valuation numerator</text>

  <path d="M640 150 H840" stroke="var(--grey)" stroke-width="3"/>
  <path d="M840 150 l-16 -8 v16 z" fill="var(--grey)"/>
  <path d="M580 250 H840" stroke="var(--grey)" stroke-width="3"/>
  <path d="M840 250 l-16 -8 v16 z" fill="var(--grey)"/>
  <path d="M520 350 H840" stroke="var(--grey)" stroke-width="3"/>
  <path d="M840 350 l-16 -8 v16 z" fill="var(--grey)"/>
  <rect x="770" y="380" width="160" height="60" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text class="t g" x="788" y="418">As an option</text>

  <text class="t c" x="60" y="556">Miss any layer and it stays out of the numerator</text>
</svg>
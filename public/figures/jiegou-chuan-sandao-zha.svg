<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="衰減圖：粗箭頭自左往右連過三道閘門，每過一道粗度減少，抵達右端價格時已經很細">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">結構要先穿過緩衝，才走到價格上</text>

<text x="60" y="112" font-size="19" fill="var(--dim)">結構</text>
<rect x="60" y="190" width="200" height="88" fill="var(--accent)"/>
<rect x="300" y="206" width="160" height="56" fill="var(--accent)"/>
<rect x="500" y="218" width="160" height="32" fill="var(--accent)"/>
<rect x="700" y="228" width="120" height="12" fill="var(--accent)"/>
<path d="M820 214 L868 234 L820 254 Z" fill="var(--accent)"/>

<rect x="264" y="160" width="32" height="148" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<rect x="464" y="160" width="32" height="148" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<rect x="664" y="160" width="32" height="148" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>

<text x="280" y="348" font-size="16" fill="var(--ink)" text-anchor="middle">中國壓需求</text>
<text x="480" y="348" font-size="16" fill="var(--ink)" text-anchor="middle">放戰略儲備</text>
<text x="680" y="348" font-size="16" fill="var(--ink)" text-anchor="middle">煉油廠停工</text>
<text x="880" y="284" font-size="19" fill="var(--dim)" text-anchor="end">價格</text>

<text x="60" y="440" font-size="22" fill="var(--ink)">緩衝沒用完之前，價格看起來像在否定你</text>
</svg>
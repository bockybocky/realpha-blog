<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="人寫的文章在難的地方會變厚，AI 寫的每一段都一樣厚，讀者因此看不出哪裡該專心">
  <style>
    svg {
      --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922;
      }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect width="960" height="470" fill="var(--page)"/>
  <text class="t" x="480" y="38" text-anchor="middle" font-size="24" fill="var(--ink)">同一份材料，四個段落：作者在哪裡用力，看得出來嗎</text>

  <text class="t" x="70" y="86" font-size="20" fill="var(--accent)">人寫的</text>
  <rect x="180" y="70" width="150" height="40" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="345" y="70" width="150" height="40" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="510" y="62" width="150" height="130" rx="6" fill="var(--accent)" opacity="0.16" stroke="var(--accent)" stroke-width="3"/>
  <rect x="675" y="70" width="150" height="40" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="585" y="136" text-anchor="middle" font-size="20" fill="var(--accent)">關鍵那一步</text>
  <text class="t" x="585" y="164" text-anchor="middle" font-size="18" fill="var(--dim)">停下來、寫得細</text>
  <text class="t" x="480" y="222" text-anchor="middle" font-size="19" fill="var(--dim)">厚度的落差就是訊號：這裡我該慢下來</text>

  <line x1="60" y1="252" x2="900" y2="252" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="70" y="306" font-size="20" fill="var(--warn)">AI 寫的</text>
  <rect x="180" y="278" width="150" height="86" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="345" y="278" width="150" height="86" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="510" y="278" width="150" height="86" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="675" y="278" width="150" height="86" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="585" y="328" text-anchor="middle" font-size="20" fill="var(--warn)">關鍵那一步</text>
  <text class="t" x="585" y="354" text-anchor="middle" font-size="18" fill="var(--dim)">跟旁邊一樣厚</text>
  <text class="t" x="480" y="398" text-anchor="middle" font-size="19" fill="var(--dim)">每一段都寫滿，等於告訴你每件事都很重要</text>

  <text class="t" x="480" y="444" text-anchor="middle" font-size="20" fill="var(--ink)">對 AI 難的東西，跟對人難的東西，關係很小——所以它的厚度幫不了你</text>
</svg>

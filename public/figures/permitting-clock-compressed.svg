<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩排橫條對比，法案後審查期與訴訟時效的長度都大幅縮短">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .d { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700">兩段時間同時被壓短</text>
<text class="d" x="60" y="94" font-size="16">橫條長度＝時間長度</text>

<text class="d" x="60" y="150" font-size="20" font-weight="700">現況</text>
<text class="d" x="60" y="200" font-size="16">環境影響說明書</text>
<rect x="230" y="178" width="470" height="34" rx="6" fill="var(--grey)"/>
<text class="t" x="248" y="201" font-size="16">約兩年（曾經四到五年）</text>
<text class="d" x="60" y="262" font-size="16">訴訟時效</text>
<rect x="230" y="240" width="620" height="34" rx="6" fill="var(--grey)"/>
<text class="t" x="248" y="263" font-size="16">六年</text>

<line x1="60" y1="310" x2="900" y2="310" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="60" y="364" font-size="20" font-weight="700">法案後</text>
<text class="d" x="60" y="414" font-size="16">環境影響說明書</text>
<rect x="230" y="392" width="300" height="34" rx="6" fill="var(--accent)"/>
<text class="t" x="248" y="415" font-size="16" fill="var(--page)">硬期限</text>
<text class="d" x="60" y="476" font-size="16">訴訟時效</text>
<rect x="230" y="454" width="64" height="34" rx="6" fill="var(--accent)"/>
<text class="t" x="308" y="477" font-size="16">150 天</text>
<text class="d" x="430" y="477" font-size="16">＋撤銷處分這個救濟不見了</text>
</svg>
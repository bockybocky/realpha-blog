<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩排權重方塊對照：日經集中在少數高股價股，東證分散在許多成分股">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); }
  .g { font-size:20px; fill:var(--ink); }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">同一個市場，兩種權重形狀</text>

<text class="g" x="60" y="140">日經 · 股價加權</text>
<text class="b" x="60" y="168">高股價股撐起大塊</text>
<rect x="300" y="118" width="230" height="60" rx="6" fill="var(--accent)"/>
<rect x="536" y="118" width="120" height="60" rx="6" fill="var(--accent)" opacity="0.7"/>
<rect x="662" y="118" width="70" height="60" rx="6" fill="var(--grey)"/>
<rect x="738" y="118" width="40" height="60" rx="6" fill="var(--grey)"/>
<rect x="784" y="118" width="26" height="60" rx="6" fill="var(--grey)"/>
<rect x="816" y="118" width="20" height="60" rx="6" fill="var(--grey)"/>
<rect x="842" y="118" width="16" height="60" rx="6" fill="var(--grey)"/>

<text class="g" x="60" y="290">東證 · 市值加權</text>
<text class="b" x="60" y="318">大型權值股領頭，範圍更廣</text>
<rect x="300" y="268" width="120" height="60" rx="6" fill="var(--accent)"/>
<rect x="426" y="268" width="96" height="60" rx="6" fill="var(--accent)" opacity="0.7"/>
<rect x="528" y="268" width="80" height="60" rx="6" fill="var(--grey)"/>
<rect x="614" y="268" width="70" height="60" rx="6" fill="var(--grey)"/>
<rect x="690" y="268" width="60" height="60" rx="6" fill="var(--grey)"/>
<rect x="756" y="268" width="50" height="60" rx="6" fill="var(--grey)"/>
<rect x="812" y="268" width="46" height="60" rx="6" fill="var(--grey)"/>

<text class="c" x="60" y="430">說「我要買日本」，話還沒講完</text>
</svg>
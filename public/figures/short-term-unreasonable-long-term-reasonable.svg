<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條先下沉後上揚的曲線與一條水平線對照，下沉段被標為看起來像浪費，谷底標示多數人離開">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .t{font-size:27px;fill:var(--ink);font-weight:700}
    .g{font-size:19px;fill:var(--ink);font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .s{font-size:15px;fill:var(--dim)}
    .c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">短期的不合理，長期的合理</text>
<text class="b" x="60" y="88">同一件事划不划算，取決於你量的是哪一段時間</text>
<rect x="120" y="130" width="340" height="310" fill="var(--card)"/>
<text class="g" x="144" y="172" fill="var(--dim)">看起來像浪費</text>
<line x1="120" y1="440" x2="890" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="120" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
<path d="M120 300 L880 262" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text class="b" x="672" y="246">人人都做的事</text>
<path d="M120 300 C 210 400 310 436 430 430 C 570 422 700 330 880 152" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
<circle cx="430" cy="430" r="7" fill="var(--warn)"/>
<text class="b" x="360" y="474" fill="var(--warn)">多數人在這裡離開</text>
<text class="g" x="768" y="140" fill="var(--accent)">優勢</text>
<text class="s" x="132" y="114">看起來的回報</text>
<text class="s" x="884" y="470" text-anchor="end">時間</text>
<text class="c" x="60" y="522">別人不肯待的那一段，才有位置</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left, two off-the-shelf dies are stacked vertically and this is already being done; on the right stands an unbuilt fab with a five-to-ten-year timeline.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">Two readings, two price tags</text>

  <text x="48" y="112" font-size="20" fill="var(--accent)">Stacking dies someone else made</text>
  <rect x="48" y="150" width="380" height="64" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="72" y="190" font-size="16" fill="var(--ink)">Compute die</text>
  <circle cx="150" cy="232" r="7" fill="var(--accent)"/>
  <circle cx="200" cy="232" r="7" fill="var(--accent)"/>
  <circle cx="250" cy="232" r="7" fill="var(--accent)"/>
  <circle cx="300" cy="232" r="7" fill="var(--accent)"/>
  <rect x="48" y="250" width="380" height="64" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="72" y="290" font-size="16" fill="var(--ink)">DRAM die</text>
  <text x="48" y="356" font-size="16" fill="var(--dim)">Joined vertically, not side by side</text>
  <text x="48" y="384" font-size="16" fill="var(--dim)">Doing it since 2023</text>
  <line x1="48" y1="410" x2="200" y2="410" stroke="var(--accent)" stroke-width="4"/>
  <text x="48" y="446" font-size="16" fill="var(--accent)">Now</text>

  <line x1="480" y1="100" x2="480" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>

  <text x="528" y="112" font-size="20" fill="var(--warn)">Making the die itself</text>
  <path d="M528 314 L528 170 L700 150 L700 314 Z" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="740" y="180" width="60" height="134" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="818" y="236" font-size="16" fill="var(--warn)">New etch tool</text>
  <text x="548" y="250" font-size="16" fill="var(--grey)">A fab not yet built</text>
  <line x1="528" y1="314" x2="900" y2="314" stroke="var(--line)" stroke-width="3"/>
  <text x="528" y="356" font-size="16" fill="var(--dim)">Buy a fab, or build one</text>
  <text x="528" y="384" font-size="16" fill="var(--dim)">A whole new etch tool set</text>
  <line x1="528" y1="410" x2="900" y2="410" stroke="var(--warn)" stroke-width="4"/>
  <text x="528" y="446" font-size="16" fill="var(--warn)">5 to 10 years</text>

  <text x="48" y="512" font-size="22" fill="var(--ink)">One headline: tomorrow on one side, the next decade on the other.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The left bar stops at a solid ceiling; on the right the ceiling turns dashed, the arrow passes through, and outside capital flows in from both sides">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">Ceiling traded for outside money</text>
<text x="70" y="126" font-size="19" fill="var(--dim)">Before</text>
<line x1="70" y1="176" x2="430" y2="176" stroke="var(--warn)" stroke-width="4"/>
<text x="250" y="162" font-size="16" fill="var(--warn)" text-anchor="middle">Own-cash ceiling</text>
<rect x="205" y="250" width="90" height="176" fill="var(--grey)"/>
<line x1="250" y1="330" x2="250" y2="200" stroke="var(--warn)" stroke-width="3"/>
<polygon points="250,190 242,206 258,206" fill="var(--warn)"/>
<line x1="70" y1="426" x2="430" y2="426" stroke="var(--line)" stroke-width="2"/>
<text x="250" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">Demand</text>
<text x="250" y="486" font-size="16" fill="var(--warn)" text-anchor="middle">Hits the ceiling</text>
<line x1="480" y1="120" x2="480" y2="490" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="530" y="126" font-size="19" fill="var(--accent)">Goal</text>
<line x1="530" y1="176" x2="890" y2="176" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="665" y="250" width="90" height="176" fill="var(--accent)"/>
<line x1="710" y1="330" x2="710" y2="146" stroke="var(--accent)" stroke-width="3"/>
<polygon points="710,134 702,152 718,152" fill="var(--accent)"/>
<line x1="545" y1="320" x2="650" y2="320" stroke="var(--dim)" stroke-width="3"/>
<polygon points="660,320 644,313 644,327" fill="var(--dim)"/>
<text x="545" y="302" font-size="16" fill="var(--dim)">Outside capital</text>
<line x1="880" y1="320" x2="775" y2="320" stroke="var(--dim)" stroke-width="3"/>
<polygon points="765,320 781,313 781,327" fill="var(--dim)"/>
<text x="812" y="302" font-size="16" fill="var(--dim)">Pensions</text>
<line x1="530" y1="426" x2="890" y2="426" stroke="var(--line)" stroke-width="2"/>
<text x="710" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">Demand</text>
<text x="710" y="486" font-size="16" fill="var(--accent)" text-anchor="middle">Own and operate split</text>
<text x="480" y="544" font-size="22" fill="var(--ink)" text-anchor="middle">Cash is finite, demand is not</text>
</svg>
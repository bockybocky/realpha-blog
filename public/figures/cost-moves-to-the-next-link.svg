<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="前後對照的兩組堆疊柱，高的那一節縮小後，不變的那一小節在總高度裡從一小條變成一半，兩組形狀相同">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型：繁體中文無襯線 */
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">成本搬到下一節</text>
<line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="3"/>
<rect x="110" y="272" width="110" height="180" fill="var(--grey)" opacity="0.55"/>
<rect x="110" y="452" width="110" height="18" fill="var(--accent)"/>
<text x="110" y="248" font-size="19" font-weight="600" fill="var(--dim)">衛星 10</text>
<text x="110" y="500" font-size="17" fill="var(--accent)">發射 1</text>
<rect x="300" y="434" width="110" height="18" fill="var(--grey)" opacity="0.55"/>
<rect x="300" y="452" width="110" height="18" fill="var(--accent)"/>
<text x="300" y="410" font-size="19" font-weight="600" fill="var(--dim)">衛星 1</text>
<text x="300" y="500" font-size="17" font-weight="700" fill="var(--accent)">發射 ＝ 一半</text>
<text x="118" y="196" font-size="20" font-weight="600" fill="var(--ink)">小衛星</text>
<path d="M232,360 L288,360" stroke="var(--ink)" stroke-width="3"/>
<polygon points="296,360 280,352 280,368" fill="var(--ink)"/>
<rect x="560" y="272" width="110" height="180" fill="var(--grey)" opacity="0.55"/>
<rect x="560" y="452" width="110" height="18" fill="var(--accent)"/>
<text x="560" y="248" font-size="19" font-weight="600" fill="var(--dim)">工程案 10</text>
<text x="560" y="500" font-size="17" fill="var(--accent)">燃料 1</text>
<rect x="750" y="434" width="110" height="18" fill="var(--grey)" opacity="0.55"/>
<rect x="750" y="452" width="110" height="18" fill="var(--accent)"/>
<text x="750" y="410" font-size="19" font-weight="600" fill="var(--dim)">模組 1</text>
<text x="742" y="500" font-size="17" font-weight="700" fill="var(--accent)">燃料 ＝ 一半</text>
<text x="568" y="196" font-size="20" font-weight="600" fill="var(--ink)">小型反應爐</text>
<path d="M682,360 L738,360" stroke="var(--ink)" stroke-width="3"/>
<polygon points="746,360 730,352 730,368" fill="var(--ink)"/>
<text x="60" y="100" font-size="22" font-weight="600" fill="var(--ink)">那一節沒變貴，是別人變便宜了</text>
<text x="60" y="548" font-size="19" fill="var(--dim)">示意用的小數字，不是實際報價</text>
</svg>
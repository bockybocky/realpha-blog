<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Pick one of the three things he already pays for as the entrance, and the exit forks into the right entrance or still teaching from zero.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="40" y="52" font-size="27" fill="var(--ink)">Enter through what he already pays for</text>

  <text x="40" y="104" font-size="19" fill="var(--dim)">Three things he spent money or time on this past year</text>
  <g>
    <rect x="40" y="128" width="220" height="60" rx="10" fill="var(--card)" stroke="var(--line)"/>
    <text x="64" y="166" font-size="16" fill="var(--ink)">One of them</text>
    <rect x="40" y="206" width="220" height="60" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
    <text x="64" y="244" font-size="16" fill="var(--ink)">Use this as the entrance</text>
    <rect x="40" y="284" width="220" height="60" rx="10" fill="var(--card)" stroke="var(--line)"/>
    <text x="64" y="322" font-size="16" fill="var(--ink)">One of them</text>
  </g>

  <path d="M260 236 L370 236" stroke="var(--accent)" stroke-width="8"/>
  <path d="M362 222 L392 236 L362 250 Z" fill="var(--accent)"/>

  <rect x="400" y="190" width="220" height="92" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="424" y="230" font-size="20" fill="var(--ink)">In that thing's language</text>
  <text x="424" y="262" font-size="16" fill="var(--dim)">Say your thing</text>

  <path d="M620 220 C700 220 700 150 790 150" fill="none" stroke="var(--accent)" stroke-width="6"/>
  <path d="M620 252 C700 252 700 330 790 330" fill="none" stroke="var(--warn)" stroke-width="6"/>

  <rect x="790" y="116" width="140" height="70" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="810" y="148" font-size="16" fill="var(--ink)">Asks details</text>
  <text x="810" y="174" font-size="15" fill="var(--accent)">Right entrance</text>

  <rect x="790" y="296" width="150" height="70" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="810" y="328" font-size="16" fill="var(--ink)">What is that?</text>
  <text x="810" y="354" font-size="15" fill="var(--warn)">Still teaching</text>

  <line x1="40" y1="440" x2="920" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text x="40" y="482" font-size="22" fill="var(--ink)">He doesn't need to understand, only to recognize</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The fuel cell's annual run-hours line forks at the point grid power arrives, falling for transitional and staying flat for permanent.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">A fork you can check directly</text>
<line x1="120" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="120" x2="120" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="70" y="114" font-size="16" fill="var(--dim)">Annual run</text>
<text x="70" y="162" font-size="16" fill="var(--dim)">hours</text>
<path d="M150 200 L480 200" stroke="var(--accent)" stroke-width="5" fill="none"/>
<line x1="480" y1="120" x2="480" y2="420" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="480" y="452" font-size="19" fill="var(--ink)" text-anchor="middle">Grid arrives</text>
<path d="M480 200 L840 200" stroke="var(--accent)" stroke-width="5" fill="none"/>
<text x="850" y="196" font-size="19" fill="var(--accent)">Flat</text>
<text x="850" y="222" font-size="16" fill="var(--dim)">Permanent</text>
<path d="M480 200 L840 372" stroke="var(--warn)" stroke-width="5" fill="none"/>
<text x="850" y="378" font-size="19" fill="var(--warn)">Falls</text>
<text x="850" y="404" font-size="16" fill="var(--dim)">Transitional</text>
<text x="120" y="496" font-size="22" fill="var(--ink)">The answer surfaces on its own, with no one admitting it</text>
</svg>
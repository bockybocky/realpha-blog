<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars showing per-request reads falling from 450,000 to a tenth, with no change of model">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="80" y="58" font-size="27" font-weight="700" fill="var(--ink)">How much the model rereads per request</text>

  <line x1="140" y1="430" x2="840" y2="430" stroke="var(--line)" stroke-width="2"/>

  <rect x="220" y="130" width="150" height="300" rx="8" fill="var(--warn)"/>
  <text x="295" y="112" font-size="30" font-weight="700" fill="var(--ink)" text-anchor="middle">450K</text>
  <text x="295" y="466" font-size="19" font-weight="600" fill="var(--dim)" text-anchor="middle">Default usage</text>
  <text x="295" y="492" font-size="16" fill="var(--dim)" text-anchor="middle">The whole workspace is context</text>

  <rect x="610" y="400" width="150" height="30" rx="6" fill="var(--accent)"/>
  <text x="685" y="382" font-size="30" font-weight="700" fill="var(--accent)" text-anchor="middle">One tenth</text>
  <text x="685" y="466" font-size="19" font-weight="600" fill="var(--ink)" text-anchor="middle">A different way of using it</text>
  <text x="685" y="492" font-size="16" fill="var(--dim)" text-anchor="middle">Cheap engines read; new topic, new conversation</text>

  <text x="452" y="270" font-size="19" font-weight="600" fill="var(--dim)" text-anchor="middle">Same model</text>
  <path d="M400 300 L520 300" stroke="var(--dim)" stroke-width="2"/>
  <path d="M532 300 L516 293 L516 307 Z" fill="var(--dim)"/>
</svg>
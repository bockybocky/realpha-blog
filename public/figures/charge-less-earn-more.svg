<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="收費柱與報酬率柱之間的兩條連線交叉，收得少的那家賺得多">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="80" y="62" font-size="27" font-weight="700" fill="var(--ink)">收得比對手少，賺得比對手多</text>

  <line x1="80" y1="460" x2="880" y2="460" stroke="var(--line)" stroke-width="2"/>

  <text x="230" y="124" font-size="20" font-weight="700" fill="var(--dim)">向客戶收的費用</text>
  <rect x="160" y="220" width="70" height="240" fill="var(--grey)"/>
  <rect x="260" y="370" width="70" height="90" fill="var(--accent)"/>
  <text x="195" y="492" font-size="16" text-anchor="middle" fill="var(--dim)">對手</text>
  <text x="295" y="492" font-size="16" text-anchor="middle" fill="var(--accent)">它</text>

  <text x="700" y="124" font-size="20" font-weight="700" fill="var(--dim)">股東權益報酬率</text>
  <rect x="630" y="370" width="70" height="90" fill="var(--grey)"/>
  <rect x="730" y="220" width="70" height="240" fill="var(--accent)"/>
  <text x="665" y="492" font-size="16" text-anchor="middle" fill="var(--dim)">對手</text>
  <text x="765" y="492" font-size="16" text-anchor="middle" fill="var(--accent)">它　兩到三倍</text>

  <line x1="195" y1="220" x2="665" y2="370" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="295" y1="370" x2="765" y2="220" stroke="var(--accent)" stroke-width="3"/>

  <text x="480" y="536" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">這個交叉只有成本結構撐得住</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="以看對沒有與撐不撐得到為兩軸的四格方陣，只有同時成立的右上格被填滿">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">兩個分開問的問題</text>
<rect x="280" y="100" width="300" height="180" rx="8" fill="var(--card)"/>
<rect x="600" y="100" width="300" height="180" rx="8" fill="var(--accent)"/>
<rect x="280" y="300" width="300" height="180" rx="8" fill="var(--card)"/>
<rect x="600" y="300" width="300" height="180" rx="8" fill="var(--card)"/>
<text class="t" x="310" y="200" font-size="19" fill="var(--dim)">撐著，但看錯</text>
<text class="t" x="630" y="200" font-size="20" fill="var(--page)">兌現</text>
<text class="t" x="310" y="400" font-size="19" fill="var(--dim)">兩頭都沒有</text>
<text class="t" x="630" y="400" font-size="19" fill="var(--warn)">看對，卻被洗掉</text>
<text class="t" x="60" y="190" font-size="19" fill="var(--ink)">撐得到</text>
<text class="t" x="60" y="222" font-size="16" fill="var(--dim)">成本、借錢、稀釋</text>
<text class="t" x="60" y="390" font-size="19" fill="var(--ink)">撐不到</text>
<text class="t" x="310" y="520" font-size="19" fill="var(--ink)">我看錯</text>
<text class="t" x="630" y="520" font-size="19" fill="var(--ink)">我看對</text>
<text class="t" x="630" y="548" font-size="16" fill="var(--dim)">預付款、交期、認證</text>
<text class="t" x="60" y="548" font-size="22" fill="var(--ink)">加碼前先分清楚問的是哪一題</text>
</svg>
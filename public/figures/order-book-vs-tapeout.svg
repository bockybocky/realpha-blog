<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸近端一個實心點，遠端一段虛線區間，分居軸線上下">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">一個在接單，一個在打樣</text>

<line x1="120" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="2"/>
<text x="160" y="336" font-size="16" fill="var(--dim)" text-anchor="middle">2026</text>
<text x="400" y="336" font-size="16" fill="var(--dim)" text-anchor="middle">2027</text>
<text x="640" y="336" font-size="16" fill="var(--dim)" text-anchor="middle">2028</text>
<text x="840" y="336" font-size="16" fill="var(--dim)" text-anchor="middle">2029</text>
<line x1="160" y1="290" x2="160" y2="310" stroke="var(--line)" stroke-width="2"/>
<line x1="400" y1="290" x2="400" y2="310" stroke="var(--line)" stroke-width="2"/>
<line x1="640" y1="290" x2="640" y2="310" stroke="var(--line)" stroke-width="2"/>
<line x1="840" y1="290" x2="840" y2="310" stroke="var(--line)" stroke-width="2"/>

<circle cx="200" cy="300" r="13" fill="var(--accent)"/>
<line x1="200" y1="287" x2="200" y2="216" stroke="var(--accent)" stroke-width="2"/>
<rect x="120" y="152" width="300" height="60" rx="10" fill="var(--accent)" opacity="0.16"/>
<rect x="120" y="152" width="300" height="60" rx="10" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="270" y="177" font-size="16" fill="var(--ink)" text-anchor="middle">面板級封裝．第一條線滿載</text>
<text x="270" y="200" font-size="15" fill="var(--accent)" text-anchor="middle">要付錢的事實</text>

<line x1="640" y1="300" x2="840" y2="300" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 8"/>
<circle cx="740" cy="300" r="13" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
<line x1="740" y1="313" x2="740" y2="384" stroke="var(--warn)" stroke-width="2"/>
<rect x="590" y="388" width="300" height="60" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="740" y="413" font-size="16" fill="var(--ink)" text-anchor="middle">3D DRAM．還在打孔</text>
<text x="740" y="436" font-size="15" fill="var(--warn)" text-anchor="middle">公關可以無限產生</text>

<text x="480" y="500" font-size="22" fill="var(--ink)" text-anchor="middle">訂單是唯一不能靠公關生出來的訊號</text>
</svg>
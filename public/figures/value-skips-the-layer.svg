<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三層堆疊，投入在底層執照，價值箭頭越過中間營運商層落在頂層應用">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">預測全對，錢沒到手</text>
<rect x="300" y="110" width="520" height="110" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="330" y="152" font-size="20" fill="var(--accent)">上層應用</text>
<text x="330" y="186" font-size="16" fill="var(--dim)">Uber・Amazon・Instagram</text>
<text x="700" y="186" font-size="19" fill="var(--accent)">價值在這</text>
<rect x="300" y="250" width="520" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="330" y="292" font-size="20" fill="var(--dim)">行動營運商</text>
<text x="330" y="326" font-size="16" fill="var(--dim)">低毛利・沒有定價權・商品生意</text>
<rect x="300" y="390" width="520" height="110" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="330" y="432" font-size="20" fill="var(--warn)">3G 執照與網路</text>
<text x="330" y="466" font-size="16" fill="var(--dim)">歐洲營運商付出 1,100～1,200 億歐元</text>
<path d="M240 445 C 150 445, 150 165, 290 165" fill="none" stroke="var(--accent)" stroke-width="5"/>
<path d="M290 165 L 264 151 L 264 179 Z" fill="var(--accent)"/>
<text x="62" y="300" font-size="19" fill="var(--accent)">跳過</text>
<text x="62" y="326" font-size="19" fill="var(--accent)">中間層</text>
<text x="60" y="540" font-size="22" fill="var(--ink)">人們後來真的拿手機做了那些事，蓋網路的那一層沒賺到</text>
</svg>
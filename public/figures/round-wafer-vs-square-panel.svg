<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="圓形晶圓裡只放得下四個大方塊，同寬的方形面板放得下九個">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="50" text-anchor="middle">同樣寬度，放得下幾塊大中介層</text>
<text class="g" x="250" y="130" text-anchor="middle">圓形晶圓</text>
<text class="g" x="710" y="130" text-anchor="middle">方形面板</text>
<circle cx="250" cy="320" r="150" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<g fill="var(--accent)" opacity="0.85">
<rect x="152" y="222" width="96" height="96" rx="4"/><rect x="252" y="222" width="96" height="96" rx="4"/>
<rect x="152" y="322" width="96" height="96" rx="4"/><rect x="252" y="322" width="96" height="96" rx="4"/>
</g>
<rect x="560" y="170" width="300" height="300" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<g fill="var(--accent)" opacity="0.85">
<rect x="562" y="172" width="96" height="96" rx="4"/><rect x="662" y="172" width="96" height="96" rx="4"/><rect x="762" y="172" width="96" height="96" rx="4"/>
<rect x="562" y="272" width="96" height="96" rx="4"/><rect x="662" y="272" width="96" height="96" rx="4"/><rect x="762" y="272" width="96" height="96" rx="4"/>
<rect x="562" y="372" width="96" height="96" rx="4"/><rect x="662" y="372" width="96" height="96" rx="4"/><rect x="762" y="372" width="96" height="96" rx="4"/>
</g>
<text class="c" x="250" y="522" text-anchor="middle">4 塊</text>
<text class="c" x="710" y="522" text-anchor="middle" fill="var(--accent)">9 塊</text>
<text class="b" x="480" y="560" text-anchor="middle">示意數字</text>
</svg>
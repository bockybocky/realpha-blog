<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="四象限圖，只有交期長且中間層數多的右上角那一格被標為失效，其餘三格正常">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">訂單簿什麼時候量不到終端需求</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">兩個條件同時成立，數字才會變成同一批需求的疊加</text>
<rect x="200" y="140" width="330" height="170" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="530" y="140" width="330" height="170" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<rect x="200" y="310" width="330" height="170" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="530" y="310" width="330" height="170" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="695" y="218" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">訂單簿＝回聲的疊加</text>
<text x="695" y="248" font-size="16" fill="var(--dim)" text-anchor="middle">思科 2000 年初在這一格</text>
<text x="365" y="232" font-size="16" fill="var(--dim)" text-anchor="middle">還量得到需求</text>
<text x="365" y="402" font-size="16" fill="var(--dim)" text-anchor="middle">還量得到需求</text>
<text x="695" y="402" font-size="16" fill="var(--dim)" text-anchor="middle">還量得到需求</text>
<line x1="200" y1="480" x2="880" y2="480" stroke="var(--ink)" stroke-width="2"/>
<line x1="200" y1="480" x2="200" y2="130" stroke="var(--ink)" stroke-width="2"/>
<text x="365" y="508" font-size="16" fill="var(--dim)" text-anchor="middle">交期短，客戶不必囤</text>
<text x="695" y="508" font-size="16" fill="var(--dim)" text-anchor="middle">交期四到六個月，客戶必須避險</text>
<text x="540" y="542" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">交期</text>
<text x="188" y="232" font-size="16" fill="var(--dim)" text-anchor="end">層數多</text>
<text x="188" y="402" font-size="16" fill="var(--dim)" text-anchor="end">層數少</text>
<text x="100" y="316" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle" transform="rotate(-90 100 316)">中間可各自加碼的層數</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左大圓稀疏點與右小框密集點的面積對比圖">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">人多的地方不要去：分兩種人多</text>
<line x1="490" y1="100" x2="490" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="265" cy="275" r="150" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--grey)">
<circle cx="200" cy="200" r="6"/><circle cx="300" cy="185" r="6"/><circle cx="350" cy="250" r="6"/>
<circle cx="250" cy="245" r="6"/><circle cx="170" cy="290" r="6"/><circle cx="220" cy="330" r="6"/>
<circle cx="310" cy="320" r="6"/><circle cx="265" cy="380" r="6"/><circle cx="360" cy="190" r="6"/>
<circle cx="150" cy="235" r="6"/><circle cx="190" cy="370" r="6"/><circle cx="340" cy="360" r="6"/>
<circle cx="285" cy="290" r="6"/><circle cx="215" cy="150" r="6"/>
</g>
<text class="g" x="265" y="460" text-anchor="middle">指數・ETF</text>
<text class="n" x="265" y="488" text-anchor="middle">人多＝有流動性</text>
<rect x="625" y="210" width="210" height="130" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<g fill="var(--accent)">
<circle cx="650" cy="232" r="6"/><circle cx="681" cy="232" r="6"/><circle cx="712" cy="232" r="6"/><circle cx="743" cy="232" r="6"/><circle cx="774" cy="232" r="6"/><circle cx="805" cy="232" r="6"/>
<circle cx="650" cy="259" r="6"/><circle cx="681" cy="259" r="6"/><circle cx="712" cy="259" r="6"/><circle cx="743" cy="259" r="6"/><circle cx="774" cy="259" r="6"/><circle cx="805" cy="259" r="6"/>
<circle cx="650" cy="286" r="6"/><circle cx="681" cy="286" r="6"/><circle cx="712" cy="286" r="6"/><circle cx="743" cy="286" r="6"/><circle cx="774" cy="286" r="6"/><circle cx="805" cy="286" r="6"/>
<circle cx="650" cy="313" r="6"/><circle cx="681" cy="313" r="6"/><circle cx="712" cy="313" r="6"/><circle cx="743" cy="313" r="6"/><circle cx="774" cy="313" r="6"/><circle cx="805" cy="313" r="6"/>
</g>
<text class="g" x="730" y="400" text-anchor="middle">小型設備股</text>
<text class="n" x="730" y="428" text-anchor="middle">人多＝沒有新買盤</text>
<text class="c" x="480" y="535" text-anchor="middle">同一句話，看的是位置不是人數</text>
</svg>
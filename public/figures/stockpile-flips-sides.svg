<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="同樣長度的兩根柱子，一根向上一根向下，只差在形態有沒有改變">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">同一批存量，形態一變就換邊</text>

<line x1="80" y1="290" x2="880" y2="290" stroke="var(--line)" stroke-width="2"/>

<rect x="240" y="140" width="120" height="150" fill="var(--accent)" fill-opacity="0.20" stroke="var(--accent)" stroke-width="3"/>
<text x="300" y="222" font-size="19" fill="var(--ink)" text-anchor="middle">存量</text>
<text x="300" y="118" font-size="20" fill="var(--accent)" text-anchor="middle">護城河</text>
<text x="300" y="322" font-size="16" fill="var(--dim)" text-anchor="middle">形態沒變</text>

<rect x="600" y="290" width="120" height="150" fill="var(--warn)" fill-opacity="0.20" stroke="var(--warn)" stroke-width="3"/>
<text x="660" y="372" font-size="19" fill="var(--ink)" text-anchor="middle">存量</text>
<text x="660" y="470" font-size="20" fill="var(--warn)" text-anchor="middle">包袱</text>
<text x="660" y="268" font-size="16" fill="var(--dim)" text-anchor="middle">形態改變</text>

<path d="M400 260 L560 260" stroke="var(--grey)" stroke-width="3"/>
<path d="M560 260 l-14 -7 l0 14 Z" fill="var(--grey)"/>
<text x="480" y="242" font-size="16" fill="var(--dim)" text-anchor="middle">無人機／小艇</text>

<text x="480" y="506" font-size="22" fill="var(--ink)" text-anchor="middle">存得越多，越難承認它可能過期</text>
</svg>
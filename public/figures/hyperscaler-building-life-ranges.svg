<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="五條水平區間條表示各家建築耐用年限，微軟的區間最短且有一段虛線延伸到二十五年，其他幾家的區間右端都伸到四十年附近。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">五家的尺有多長：建築耐用年限區間</text>

  <line x1="220" y1="110" x2="220" y2="420" stroke="var(--line)"/>
  <line x1="460" y1="110" x2="460" y2="420" stroke="var(--line)"/>
  <line x1="700" y1="110" x2="700" y2="420" stroke="var(--line)"/>

  <rect x="248" y="140" width="80" height="34" rx="4" fill="var(--accent)"/>
  <rect x="328" y="148" width="152" height="18" rx="4" fill="var(--accent)" opacity="0.3"/>
  <text class="t" x="48" y="164" font-size="19" fill="var(--ink)">微軟</text>
  <text class="t" x="496" y="164" font-size="16" fill="var(--dim)">5～15 年，法說會稱改 25 年</text>

  <rect x="276" y="200" width="664" height="34" rx="4" fill="var(--grey)"/>
  <text class="t" x="48" y="224" font-size="19" fill="var(--ink)">Alphabet</text>
  <text class="t" x="292" y="224" font-size="16" fill="var(--ink)">7～40 年</text>

  <rect x="220" y="260" width="720" height="34" rx="4" fill="var(--grey)"/>
  <text class="t" x="48" y="284" font-size="19" fill="var(--ink)">Amazon</text>
  <text class="t" x="236" y="284" font-size="16" fill="var(--ink)">最長 40 年</text>

  <rect x="620" y="320" width="120" height="34" rx="4" fill="var(--grey)"/>
  <text class="t" x="48" y="344" font-size="19" fill="var(--ink)">Meta</text>
  <text class="t" x="756" y="344" font-size="16" fill="var(--ink)">25～30 年</text>

  <rect x="228" y="380" width="712" height="34" rx="4" fill="var(--grey)"/>
  <text class="t" x="48" y="404" font-size="19" fill="var(--ink)">Oracle</text>
  <text class="t" x="244" y="404" font-size="16" fill="var(--ink)">1～40 年</text>

  <text class="t" x="220" y="446" font-size="15" fill="var(--dim)" text-anchor="middle">0 年</text>
  <text class="t" x="460" y="446" font-size="15" fill="var(--dim)" text-anchor="middle">10</text>
  <text class="t" x="700" y="446" font-size="15" fill="var(--dim)" text-anchor="middle">20</text>
  <text class="t" x="940" y="446" font-size="15" fill="var(--dim)" text-anchor="end">40</text>

  <text class="t" x="48" y="506" font-size="22" font-weight="700" fill="var(--ink)">年限本身不離譜，時間點值得記住</text>
</svg>
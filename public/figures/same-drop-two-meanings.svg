<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩格放著同一條下跌線：左格底下是加碼的向上箭頭，右格底下是往外離場的出口箭頭">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">同一根下跌，兩種意思</text>
  <rect x="60" y="100" width="400" height="340" fill="var(--card)"/>
  <text class="t" x="88" y="140" font-size="20" font-weight="700" fill="var(--accent)">買它的理由還在</text>
  <polyline points="100,180 180,230 260,210 340,290 420,330" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <line x1="180" y1="400" x2="180" y2="250" stroke="var(--accent)" stroke-width="4"/>
  <polygon points="180,236 172,256 188,256" fill="var(--accent)"/>
  <line x1="300" y1="400" x2="300" y2="300" stroke="var(--accent)" stroke-width="4"/>
  <polygon points="300,286 292,306 308,306" fill="var(--accent)"/>
  <line x1="420" y1="400" x2="420" y2="350" stroke="var(--accent)" stroke-width="4"/>
  <polygon points="420,336 412,356 428,356" fill="var(--accent)"/>
  <text class="t" x="88" y="424" font-size="19" fill="var(--accent)">打折</text>
  <rect x="500" y="100" width="400" height="340" fill="var(--card)"/>
  <text class="t" x="528" y="140" font-size="20" font-weight="700" fill="var(--warn)">理由不在了</text>
  <polyline points="540,180 620,230 700,210 780,290 860,330" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <line x1="620" y1="300" x2="620" y2="400" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="620,414 612,394 628,394" fill="var(--warn)"/>
  <text class="t" x="528" y="424" font-size="19" fill="var(--warn)">警告</text>
  <text class="t" x="60" y="504" font-size="22" font-weight="700" fill="var(--ink)">線一樣，分岔的是理由</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="When demand weakens, the sticky line declines gently and the fast-repricing line drops steeply, swapping the positions they held when prices were rising.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); font-weight:700; }
  .g { font-size:20px; fill:var(--ink); font-weight:700; }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="70" y="58">Reprices fast up, reprices fast down</text>
<line x1="110" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="110" y1="110" x2="110" y2="400" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="70" y="126">Cash flow</text>
<text class="b" x="800" y="428">Demand weakens</text>
<polyline points="130,170 300,170 430,196 600,222 780,244" fill="none" stroke="var(--grey)" stroke-width="5"/>
<polyline points="130,170 300,170 380,250 460,330 560,366 780,374" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="300" cy="170" r="8" fill="var(--warn)"/>
<text class="b" x="268" y="150">Turn</text>
<text class="g" x="792" y="250">Long term</text>
<text class="b" x="792" y="274">Sticky = shield</text>
<text class="g" x="792" y="372">Quarterly</text>
<text class="b" x="792" y="396">Sticky = none</text>
<text class="c" x="70" y="488">The show counts repricing of old rates in one direction only</text>
</svg>
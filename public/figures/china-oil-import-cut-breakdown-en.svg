<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two horizontal bars of different lengths, with the shorter one split into left and right halves.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">The 3.5 mb/d import cut came from two places</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">Unit: million barrels per day</text>

<text x="60" y="152" font-size="19" fill="var(--dim)">Feb peak → April–May</text>
<rect x="60" y="166" width="600" height="40" rx="4" fill="var(--grey)"/>
<text x="676" y="194" font-size="19" fill="var(--dim)">about 5.0</text>

<text x="60" y="272" font-size="20" font-weight="600" fill="var(--ink)">Q2, vs. a year earlier</text>
<rect x="60" y="288" width="210" height="56" rx="4" fill="var(--accent)"/>
<rect x="270" y="288" width="210" height="56" rx="4" fill="var(--accent)" opacity="0.45"/>
<rect x="268" y="288" width="4" height="56" fill="var(--page)"/>
<text x="496" y="324" font-size="19" fill="var(--dim)">about 3.5</text>

<line x1="165" y1="352" x2="165" y2="376" stroke="var(--line)" stroke-width="2"/>
<line x1="375" y1="352" x2="375" y2="376" stroke="var(--line)" stroke-width="2"/>
<text x="165" y="400" font-size="16" fill="var(--ink)" text-anchor="middle">No more stockpiling, small draw</text>
<text x="375" y="400" font-size="16" fill="var(--ink)" text-anchor="middle">Lower refinery runs</text>
<text x="165" y="424" font-size="15" fill="var(--dim)" text-anchor="middle">about half</text>
<text x="375" y="424" font-size="15" fill="var(--dim)" text-anchor="middle">about half</text>

<text x="60" y="478" font-size="22" font-weight="600" fill="var(--ink)">Not a scramble for oil: less bought, less refined</text>
</svg>
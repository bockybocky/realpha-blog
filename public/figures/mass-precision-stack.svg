<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三層底座支撐無人機層，抽掉砲兵層後上層塌斜">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  .h{font-size:27px;font-weight:700;fill:var(--ink)}
  .g{font-size:19px;font-weight:700;fill:var(--ink)}
  .b{font-size:16px;fill:var(--dim)}
  .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="60" y="68">無人機的效果靠誰托著</text>
<text class="t g" x="60" y="112">現在</text>
<rect x="60" y="140" width="340" height="62" rx="6" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)"/>
<text class="t g" x="84" y="179">無人機殺傷</text>
<rect x="60" y="212" width="340" height="56" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="84" y="247">大量佈雷</text>
<rect x="60" y="276" width="340" height="56" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="84" y="311">傳統砲兵（逼你不能集中）</text>
<rect x="60" y="340" width="340" height="56" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="84" y="375">預設陣地</text>
<line x1="60" y1="404" x2="400" y2="404" stroke="var(--grey)" stroke-width="3"/>
<text class="t g" x="560" y="112" fill="var(--warn)">抽掉砲兵</text>
<g transform="rotate(-9 730 171)">
<rect x="560" y="140" width="340" height="62" rx="6" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)"/>
<text class="t g" x="584" y="179">只剩點狀殺傷</text>
</g>
<rect x="560" y="212" width="340" height="56" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="584" y="247">大量佈雷</text>
<rect x="560" y="276" width="340" height="56" rx="6" fill="none" stroke="var(--warn)" stroke-dasharray="8 7"/>
<text class="t b" x="584" y="311" fill="var(--warn)">空的</text>
<rect x="560" y="340" width="340" height="56" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="584" y="375">預設陣地</text>
<line x1="560" y1="404" x2="900" y2="404" stroke="var(--grey)" stroke-width="3"/>
<text class="t b" x="560" y="440">徒步步兵的大規模進攻反而難處理</text>
<text class="t c" x="60" y="506">能力是疊出來的，不是單獨成立的</text>
</svg>
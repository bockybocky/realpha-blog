<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="想買的小方塊被遠大於它的整包方塊包住，無法單獨取出">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="80" y="78">想買的那一格，不單賣</text>
<rect x="80" y="120" width="620" height="300" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text class="g" x="110" y="160">整季黃金時段</text>
<text class="b" x="110" y="190">2 億美元</text>
<rect x="110" y="300" width="94" height="94" rx="8" fill="var(--accent)"/>
<rect x="222" y="300" width="94" height="94" rx="8" fill="var(--grey)" opacity="0.45"/>
<rect x="334" y="300" width="94" height="94" rx="8" fill="var(--grey)" opacity="0.45"/>
<rect x="446" y="300" width="94" height="94" rx="8" fill="var(--grey)" opacity="0.45"/>
<rect x="558" y="300" width="94" height="94" rx="8" fill="var(--grey)" opacity="0.45"/>
<path d="M760 347 L712 347" stroke="var(--accent)" stroke-width="4"/>
<path d="M712 347 l16 -11 l0 22 z" fill="var(--accent)"/>
<text class="g" x="772" y="332" fill="var(--accent)">廣告主要的</text>
<text class="b" x="772" y="362">3000 萬</text>
<text class="c" x="80" y="486">最紅的那一格不能單買，熱度被綁去撐整包</text>
</svg>
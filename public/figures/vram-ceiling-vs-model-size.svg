<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="三根不同高度的柱子被三條水平虛線天花板攔住，最高的一根穿過全部虛線">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">先有版本，才輪到挑卡</text>
<text x="480" y="88" text-anchor="middle" font-size="16" fill="var(--dim)">同一顆模型的三個壓縮版本，差六倍</text>
<rect x="175" y="446" width="130" height="54" fill="var(--grey)"/>
<rect x="405" y="392" width="130" height="108" fill="var(--accent)"/>
<rect x="635" y="176" width="130" height="324" fill="var(--warn)"/>
<line x1="118" y1="428" x2="830" y2="428" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="118" y1="356" x2="830" y2="356" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="118" y1="308" x2="830" y2="308" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 5"/>
<text x="108" y="433" text-anchor="end" font-size="16" fill="var(--dim)">12 GB 卡</text>
<text x="108" y="361" text-anchor="end" font-size="16" fill="var(--dim)">24 GB 卡</text>
<text x="108" y="313" text-anchor="end" font-size="16" fill="var(--dim)">32 GB 卡</text>
<line x1="100" y1="500" x2="880" y2="500" stroke="var(--ink)" stroke-width="2"/>
<text x="240" y="436" text-anchor="middle" font-size="16" fill="var(--ink)">9 GB</text>
<text x="470" y="382" text-anchor="middle" font-size="16" fill="var(--ink)">18 GB</text>
<text x="700" y="166" text-anchor="middle" font-size="16" fill="var(--ink)">54 GB</text>
<text x="240" y="530" text-anchor="middle" font-size="20" fill="var(--ink)">壓最狠</text>
<text x="470" y="530" text-anchor="middle" font-size="20" fill="var(--ink)">甜蜜點</text>
<text x="700" y="530" text-anchor="middle" font-size="20" fill="var(--ink)">原尺寸</text>
<text x="240" y="556" text-anchor="middle" font-size="15" fill="var(--dim)">品質掉最多</text>
<text x="470" y="556" text-anchor="middle" font-size="15" fill="var(--dim)">24 GB 剛好吃得下</text>
<text x="700" y="556" text-anchor="middle" font-size="15" fill="var(--dim)">三張卡都放不進</text>
<text x="480" y="598" text-anchor="middle" font-size="22" fill="var(--ink)">先挑版本，再挑卡</text>
</svg>
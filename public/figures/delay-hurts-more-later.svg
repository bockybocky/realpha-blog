<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="低矮積木抽一塊仍站著、高疊積木抽同一塊就傾倒的時間對比">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="48" font-size="27" fill="var(--ink)">同一個延後，愈晚愈重</text>
<line x1="80" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="200" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">今天</text>
<text x="700" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">一年後</text>
<g fill="none" stroke="var(--grey)" stroke-width="2">
<rect x="150" y="388" width="100" height="30"/>
<rect x="150" y="356" width="100" height="30"/>
</g>
<rect x="150" y="324" width="100" height="30" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="268" y="345" font-size="16" fill="var(--warn)">抽走半年</text>
<text x="200" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">還站著</text>
<g fill="none" stroke="var(--grey)" stroke-width="2">
<rect x="650" y="388" width="100" height="30"/>
<rect x="650" y="356" width="100" height="30"/>
<rect x="650" y="324" width="100" height="30"/>
<rect x="650" y="292" width="100" height="30"/>
<rect x="650" y="260" width="100" height="30"/>
<rect x="650" y="228" width="100" height="30"/>
</g>
<rect x="650" y="196" width="100" height="30" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
<g fill="none" stroke="var(--warn)" stroke-width="2">
<rect x="770" y="170" width="100" height="28" transform="rotate(22 820 184)"/>
<rect x="786" y="138" width="100" height="28" transform="rotate(34 836 152)"/>
</g>
<text x="700" y="128" font-size="16" fill="var(--dim)" text-anchor="middle">期待與複雜度愈堆愈高</text>
<text x="860" y="238" font-size="19" fill="var(--warn)" text-anchor="middle">倒的是上面</text>
<text x="60" y="508" font-size="22" fill="var(--ink)">同樣抽掉半年，差別在那時上面堆了多少</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="把脈絡窗攤在一條代表一生的長條上，一百萬 token 只是一道細線，十億 token 才是二三十年的區塊" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">把脈絡攤在一生上</text>
<text x="100" y="140" font-size="20" fill="var(--dim)">一個人的一生</text>
<rect x="100" y="152" width="760" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="100" y="250" font-size="20" fill="var(--ink)">一百萬 token</text>
<rect x="100" y="262" width="8" height="44" rx="2" fill="var(--accent)"/>
<text x="126" y="291" font-size="15" fill="var(--dim)">幾千本書，換成聲音只有幾小時</text>
<text x="100" y="360" font-size="20" fill="var(--accent)">十億 token</text>
<rect x="100" y="372" width="250" height="44" rx="4" fill="var(--accent)"/>
<text x="368" y="401" font-size="15" fill="var(--ink)">二三十年的經驗</text>
<text x="60" y="478" font-size="22" fill="var(--ink)">DRAM 走不到右邊那一格</text>
</svg>
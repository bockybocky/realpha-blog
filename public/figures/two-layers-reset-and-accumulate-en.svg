<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The upper jagged layer keeps resetting to zero while the lower staircase layer keeps accumulating.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>svg{--page:#ffffff;--card:#f6f8fc;--line:#dde3ee;--ink:#1a212b;--dim:#57616f;--grey:#b9c2d0;--accent:#1f6feb;--warn:#d97706;}@media (prefers-color-scheme: dark){svg{--page:#0d1117;--card:#161b22;--line:#272e39;--ink:#e6edf3;--dim:#8b949e;--grey:#4a5464;--accent:#58a6ff;--warn:#d29922;}}text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}</style>
<text x="60" y="58" font-size="27" font-weight="700">Two layers running at once</text>
<rect x="60" y="88" width="840" height="190" rx="10" fill="var(--card)" stroke="var(--line)"/>
<line x1="92" y1="252" x2="880" y2="252" stroke="var(--line)" stroke-width="2"/>
<polyline points="100,252 185,128 185,252 280,252 365,128 365,252 460,252 545,128 545,252 640,252 725,128 725,252 820,252 870,186" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text x="92" y="118" font-size="20" font-weight="700" fill="var(--dim)">Copyable</text>
<text x="92" y="146" font-size="16" fill="var(--dim)">One weekend</text>
<text x="770" y="236" font-size="16" fill="var(--dim)">Reset</text>
<rect x="60" y="300" width="840" height="190" rx="10" fill="var(--card)" stroke="var(--line)"/>
<polyline points="100,462 220,462 220,428 340,428 340,392 460,392 460,356 580,356 580,330 700,330 700,336 820,336 820,330 880,330" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text x="560" y="470" font-size="20" font-weight="700" fill="var(--accent)">Not copyable</text>
<text x="560" y="494" font-size="16" fill="var(--dim)">400 integrations · certs · upkeep</text>
<text x="60" y="534" font-size="22" font-weight="700">One company, winner and house of cards</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="四象限圖以客戶集中度與槓桿為兩軸，恩傑薩的位置在右上角兩者皆高的那一格">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">兩題疊起來，才看得出處境</text>

<rect x="200" y="110" width="560" height="380" fill="var(--card)" stroke="var(--line)"/>
<rect x="480" y="110" width="280" height="190" fill="none" stroke="var(--warn)" stroke-width="3"/>
<line x1="480" y1="110" x2="480" y2="490" stroke="var(--line)" stroke-width="2"/>
<line x1="200" y1="300" x2="760" y2="300" stroke="var(--line)" stroke-width="2"/>

<text x="226" y="150" font-size="16" fill="var(--dim)">分散客戶</text>
<text x="226" y="176" font-size="16" fill="var(--dim)">高槓桿</text>
<text x="506" y="150" font-size="16" fill="var(--warn)">集中客戶</text>
<text x="506" y="176" font-size="16" fill="var(--warn)">高槓桿</text>
<text x="226" y="430" font-size="16" fill="var(--dim)">分散客戶</text>
<text x="226" y="456" font-size="16" fill="var(--dim)">低槓桿</text>
<text x="506" y="430" font-size="16" fill="var(--dim)">集中客戶</text>
<text x="506" y="456" font-size="16" fill="var(--dim)">低槓桿</text>

<circle cx="672" cy="196" r="14" fill="var(--warn)"/>
<text x="698" y="202" font-size="19" fill="var(--warn)">恩傑薩</text>

<line x1="200" y1="520" x2="760" y2="520" stroke="var(--ink)" stroke-width="2"/>
<text x="200" y="548" font-size="19" fill="var(--dim)">客戶集中度　低</text>
<text x="690" y="548" font-size="19" fill="var(--dim)">高</text>
<line x1="170" y1="110" x2="170" y2="490" stroke="var(--ink)" stroke-width="2"/>
<text x="92" y="122" font-size="19" fill="var(--dim)">槓桿 高</text>
<text x="128" y="486" font-size="19" fill="var(--dim)">低</text>

<text x="60" y="586" font-size="22" fill="var(--ink)">問它的資產負債表，允不允許它輸一次。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一年時間軸：左端一小格是約一個月的增發賣壓，右邊遠處一個標記是約 2027 年第二季末的基本面轉折">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text x="480" y="52" class="t" text-anchor="middle">兩個時鐘：以週計，以季計</text>
<text x="30" y="212" class="g">股票供給</text>
<rect x="140" y="180" width="60" height="50" fill="var(--accent)"/>
<text x="216" y="202" class="g">增發賣壓</text>
<text x="216" y="226" class="b">約 1 個月・6 億美元額度</text>
<text x="30" y="332" class="g">產品供需</text>
<line x1="140" y1="325" x2="718" y2="325" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<polygon points="740,307 758,325 740,343 722,325" fill="var(--accent)"/>
<text x="740" y="292" class="g" text-anchor="middle">基本面轉折</text>
<text x="740" y="370" class="b" text-anchor="middle">約 2027 年第二季末</text>
<line x1="140" y1="420" x2="860" y2="420" stroke="var(--ink)" stroke-width="2"/>
<line x1="140" y1="412" x2="140" y2="428" stroke="var(--ink)" stroke-width="2"/>
<line x1="320" y1="412" x2="320" y2="428" stroke="var(--ink)" stroke-width="2"/>
<line x1="500" y1="412" x2="500" y2="428" stroke="var(--ink)" stroke-width="2"/>
<line x1="680" y1="412" x2="680" y2="428" stroke="var(--ink)" stroke-width="2"/>
<line x1="860" y1="412" x2="860" y2="428" stroke="var(--ink)" stroke-width="2"/>
<text x="140" y="452" class="b" text-anchor="middle">2026/9</text>
<text x="320" y="452" class="b" text-anchor="middle">2026/12</text>
<text x="500" y="452" class="b" text-anchor="middle">2027/3</text>
<text x="680" y="452" class="b" text-anchor="middle">2027/6</text>
<text x="860" y="452" class="b" text-anchor="middle">2027/9</text>
<text x="140" y="480" class="b" text-anchor="middle">現在</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A narrow block above and a much wider block below, with an arrow pointing down, showing that the lower layer applies far more broadly">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:600;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:600;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">This episode has two layers</text>
<rect x="300" y="120" width="360" height="100" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="480" y="163" text-anchor="middle">One carmaker interview</text>
<text class="b" x="480" y="193" text-anchor="middle">New models, electrification, HMI</text>
<text class="b" x="690" y="176">Cars only</text>
<line x1="480" y1="228" x2="480" y2="278" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<polygon points="480,292 472,276 488,276" fill="var(--grey)"/>
<rect x="100" y="308" width="760" height="126" rx="10" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="480" y="356" text-anchor="middle">Choosing for the user between global targets and local needs</text>
<text class="b" x="480" y="390" text-anchor="middle">Any team that makes trade-offs for others</text>
<text class="c" x="480" y="480" text-anchor="middle">The top layer is cars, the lower one is choice</text>
</svg>
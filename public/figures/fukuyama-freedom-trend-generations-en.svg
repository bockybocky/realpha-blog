<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="An illustrative curve rises to a 2008 peak and then declines for about twenty years, with the left segment below labeled the generation that lived through dictatorship and the right segment labeled the generation that treats freedom like air.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); font-size:16px; }
</style>
<text x="480" y="50" text-anchor="middle" style="font-size:27px;font-weight:700">Freedom</text>
<text x="480" y="80" text-anchor="middle" style="font-size:15px;fill:var(--dim)">Not real data</text>
<line x1="100" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<path d="M120 360 C 250 300, 380 170, 470 160" fill="none" stroke="var(--accent)" stroke-width="6"/>
<path d="M470 160 C 560 170, 720 250, 860 300" fill="none" stroke="var(--warn)" stroke-width="6"/>
<circle cx="120" cy="360" r="8" fill="var(--accent)"/>
<circle cx="470" cy="160" r="8" fill="var(--ink)"/>
<circle cx="860" cy="300" r="8" fill="var(--warn)"/>
<text x="100" y="398" style="font-size:16px;fill:var(--dim)">Berlin Wall</text>
<text x="470" y="135" text-anchor="middle" style="font-size:19px;font-weight:700">Peak</text>
<text x="700" y="205" text-anchor="middle" style="font-size:20px;fill:var(--warn);font-weight:700">~20y fall</text>
<text x="120" y="466" text-anchor="middle" style="font-size:16px;fill:var(--dim)">1989</text>
<text x="470" y="466" text-anchor="middle" style="font-size:16px;fill:var(--dim)">2008</text>
<text x="860" y="466" text-anchor="middle" style="font-size:16px;fill:var(--dim)">Now</text>
<rect x="120" y="486" width="346" height="44" rx="8" fill="var(--card)" stroke="var(--accent)"/>
<text x="293" y="514" text-anchor="middle" style="font-size:19px">Saw tyranny</text>
<rect x="474" y="486" width="386" height="44" rx="8" fill="var(--card)" stroke="var(--warn)"/>
<text x="667" y="514" text-anchor="middle" style="font-size:19px">Freedom as air</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three bars of different length, the longest of which hits an upright wall.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">Tripling every year is three things multiplied</text>

  <line x1="330" y1="110" x2="330" y2="430" stroke="var(--line)" stroke-width="2"/>

  <text class="g" x="310" y="163" text-anchor="end">Moore's law</text>
  <rect x="330" y="135" width="196" height="46" fill="var(--grey)"/>
  <text class="g" x="546" y="166">1.4x</text>

  <text class="g" x="310" y="248" text-anchor="end">New fabs</text>
  <rect x="330" y="220" width="168" height="46" fill="var(--grey)"/>
  <text class="g" x="518" y="251">1.2x</text>

  <text class="g" x="310" y="333" text-anchor="end">Taking phone and PC quota</text>
  <rect x="330" y="305" width="252" height="46" fill="var(--warn)"/>
  <text class="g" x="602" y="336">1.8x</text>

  <rect x="596" y="285" width="8" height="120" fill="var(--warn)"/>
  <text class="g" x="620" y="330" fill="var(--warn)">End of next year</text>
  <text class="s" x="620" y="356">Leading node 60% to 86%</text>

  <text class="s" x="330" y="404">The first two hit physics; the third just moves existing stock</text>

  <text class="c" x="60" y="500">The biggest piece runs out once it is moved</text>
</svg>
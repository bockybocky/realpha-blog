<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="正方形市場的左半是兩個大塊，右半被切成許多小格">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">買下整個指數，拿到的是兩檔</text>

<text x="280" y="104" font-size="19" fill="var(--dim)">韓國市場</text>

<rect x="280" y="115" width="170" height="168" fill="var(--accent)"/>
<rect x="280" y="287" width="170" height="168" fill="var(--accent)"/>
<text x="300" y="205" font-size="19" fill="var(--page)">半導體</text>
<text x="300" y="377" font-size="19" fill="var(--page)">半導體</text>

<rect x="450" y="115" width="170" height="340" fill="var(--grey)"/>
<line x1="492" y1="115" x2="492" y2="455" stroke="var(--page)" stroke-width="2"/>
<line x1="535" y1="115" x2="535" y2="455" stroke="var(--page)" stroke-width="2"/>
<line x1="578" y1="115" x2="578" y2="455" stroke="var(--page)" stroke-width="2"/>
<line x1="450" y1="183" x2="620" y2="183" stroke="var(--page)" stroke-width="2"/>
<line x1="450" y1="251" x2="620" y2="251" stroke="var(--page)" stroke-width="2"/>
<line x1="450" y1="319" x2="620" y2="319" stroke="var(--page)" stroke-width="2"/>
<line x1="450" y1="387" x2="620" y2="387" stroke="var(--page)" stroke-width="2"/>
<rect x="280" y="115" width="340" height="340" fill="none" stroke="var(--line)" stroke-width="2"/>

<text x="650" y="290" font-size="19" fill="var(--dim)">其餘數百家</text>

<text x="60" y="505" font-size="22" fill="var(--ink)">一籃子，一半是同一種東西</text>
</svg>
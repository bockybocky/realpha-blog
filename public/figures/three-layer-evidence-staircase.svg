<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩座三階樓梯：左邊三階全部填滿，右邊只有最低一階填滿、上兩階是空虛線">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text x="480" y="52" class="t" text-anchor="middle">一份上修，填得出幾層</text>
<line x1="70" y1="440" x2="70" y2="218" stroke="var(--dim)" stroke-width="2"/>
<polygon points="63,220 70,204 77,220" fill="var(--dim)"/>
<text x="70" y="190" class="b" text-anchor="middle">越難造假</text>
<text x="264" y="150" class="g" text-anchor="middle">雷射（這週）</text>
<text x="724" y="150" class="g" text-anchor="middle">只填得出第一層</text>
<line x1="100" y1="440" x2="430" y2="440" stroke="var(--grey)" stroke-width="2"/>
<rect x="110" y="360" width="96" height="80" fill="var(--accent)"/>
<rect x="216" y="280" width="96" height="160" fill="var(--accent)"/>
<rect x="322" y="200" width="96" height="240" fill="var(--accent)"/>
<line x1="560" y1="440" x2="890" y2="440" stroke="var(--grey)" stroke-width="2"/>
<rect x="570" y="360" width="96" height="80" fill="var(--accent)"/>
<rect x="677" y="281" width="94" height="158" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="783" y="201" width="94" height="238" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="158" y="470" class="g" text-anchor="middle">總量</text>
<text x="264" y="470" class="g" text-anchor="middle">用量</text>
<text x="370" y="470" class="g" text-anchor="middle">零件報價</text>
<text x="158" y="496" class="b" text-anchor="middle">改假設就動</text>
<text x="264" y="496" class="b" text-anchor="middle">綁硬體架構</text>
<text x="370" y="496" class="b" text-anchor="middle">有人真付錢</text>
<text x="618" y="470" class="g" text-anchor="middle">總量</text>
<text x="724" y="470" class="g" text-anchor="middle">用量</text>
<text x="830" y="470" class="g" text-anchor="middle">零件報價</text>
<text x="618" y="496" class="b" text-anchor="middle">改假設就動</text>
<text x="724" y="496" class="b" text-anchor="middle">綁硬體架構</text>
<text x="830" y="496" class="b" text-anchor="middle">有人真付錢</text>
<text x="264" y="550" class="c" text-anchor="middle" style="fill:var(--accent)">三層都有證據</text>
<text x="724" y="550" class="c" text-anchor="middle" style="fill:var(--warn)">當成氣氛</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two horizontal bars, short on top and long below, where the lower bar extends well past the upper one and that overhang is labeled as the gap.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">The asset ages before the debt does</text>

<text class="t" x="60" y="170" font-size="19" font-weight="700" fill="var(--ink)">What earns the money</text>
<text class="t" x="60" y="196" font-size="16" fill="var(--dim)">One GPU</text>
<rect x="250" y="146" width="178" height="56" rx="8" fill="var(--accent)"/>
<text class="t" x="339" y="182" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">5–6 yrs</text>

<text class="t" x="60" y="298" font-size="19" font-weight="700" fill="var(--ink)">What must be repaid</text>
<text class="t" x="60" y="324" font-size="16" fill="var(--dim)">Leases and debt</text>
<rect x="250" y="274" width="178" height="56" rx="8" fill="var(--grey)"/>
<rect x="428" y="274" width="462" height="56" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="t" x="659" y="310" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Resale value sinks, bills keep coming</text>

<line x1="428" y1="128" x2="428" y2="352" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 5"/>

<line x1="250" y1="392" x2="890" y2="392" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="250" y="420" font-size="16" fill="var(--dim)">Signing</text>
<text class="t" x="428" y="420" font-size="16" fill="var(--dim)" text-anchor="middle">Next gen arrives</text>
<text class="t" x="890" y="420" font-size="16" fill="var(--dim)" text-anchor="end">10–20 yrs</text>

<text class="t" x="480" y="480" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">The gap sits in the back half</text>
</svg>
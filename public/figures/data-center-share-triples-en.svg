<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars of equal length, one above the other, where the colored block at the left end of the lower bar is clearly longer, and is then split below into a segment of about two thirds plus the remaining two parts.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">Data centers go from a sliver to more than triple</text>

  <text class="d" x="80" y="118">US power demand today</text>
  <rect x="80" y="132" width="800" height="72" fill="var(--card)" stroke="var(--line)"/>
  <rect x="80" y="132" width="42" height="72" fill="var(--accent)"/>
  <text class="d" x="138" y="176">About 5% (his own guess)</text>

  <polygon points="470,218 490,218 480,250" fill="var(--dim)"/>

  <text class="d" x="80" y="296">US power demand ahead</text>
  <rect x="80" y="310" width="800" height="72" fill="var(--card)" stroke="var(--line)"/>
  <rect x="80" y="310" width="140" height="72" fill="var(--accent)"/>
  <text class="d" x="238" y="354">More than triple</text>

  <text class="d" x="80" y="432">Where that block's power comes from</text>
  <rect x="80" y="444" width="140" height="48" fill="var(--card)" stroke="var(--line)"/>
  <rect x="80" y="444" width="93" height="48" fill="var(--warn)"/>
  <text class="d" x="238" y="476">~2/3 from gas-fired power</text>

  <text class="c" x="560" y="476">Gas takes most growth</text>
</svg>
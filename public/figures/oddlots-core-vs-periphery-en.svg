<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A thick ring wraps a solid inner circle, the outer ring marked as neocloud builders with no operating cash flow and the inner circle marked as hyperscalers with cash volcanoes.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="66" font-size="27" font-weight="700" fill="var(--ink)">Which ring pays</text>
<circle cx="330" cy="320" r="210" fill="var(--card)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<circle cx="330" cy="320" r="112" fill="var(--accent)"/>
<text x="330" y="312" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">Hub</text>
<text x="330" y="342" font-size="16" fill="var(--page)" text-anchor="middle">Cash</text>
<text x="330" y="166" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">Rim</text>
<text x="330" y="196" font-size="16" fill="var(--dim)" text-anchor="middle">No op. cash</text>
<rect x="600" y="140" width="300" height="4" fill="var(--warn)"/>
<text x="600" y="192" font-size="20" font-weight="700" fill="var(--warn)">Neoclouds</text>
<text x="600" y="224" font-size="16" fill="var(--dim)">Build, then sell</text>
<text x="600" y="252" font-size="16" fill="var(--dim)">Some imagined</text>
<text x="600" y="280" font-size="16" fill="var(--dim)">Riskiest end</text>
<rect x="600" y="340" width="300" height="4" fill="var(--accent)"/>
<text x="600" y="392" font-size="20" font-weight="700" fill="var(--accent)">Hyperscalers</text>
<text x="600" y="424" font-size="16" fill="var(--dim)">Self-built</text>
<text x="600" y="452" font-size="16" fill="var(--dim)">Legacy cash</text>
<text x="600" y="480" font-size="16" fill="var(--dim)">No squeeze</text>
<text x="80" y="536" font-size="22" font-weight="700" fill="var(--ink)">One spectrum, two tolerances</text>
</svg>
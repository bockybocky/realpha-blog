<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A price line plunges to a low and rebounds in a V shape, but only reaches below the major moving average; the prior high is marked by a higher dashed line, and both reference lines remain above the price.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="70" y="70" font-size="27" fill="var(--ink)">Long Thesis Written Above</text>
<line x1="110" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="3"/>
<line x1="110" y1="150" x2="900" y2="150" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="110" y="136" font-size="19" fill="var(--dim)">Prior High</text>
<path d="M110 268 C 260 254 420 246 600 240 C 740 236 830 234 900 232" stroke="var(--grey)" stroke-width="5" fill="none"/>
<text x="742" y="216" font-size="19" fill="var(--ink)">Major MA</text>
<text x="742" y="242" font-size="16" fill="var(--warn)">Exit on Touch</text>
<path d="M120 200 C 200 246 268 356 342 412 C 400 400 452 348 508 322 C 580 290 660 306 720 314 C 790 324 850 318 896 326" stroke="var(--accent)" stroke-width="6" fill="none"/>
<circle cx="342" cy="412" r="9" fill="var(--accent)"/>
<text x="300" y="450" font-size="19" fill="var(--ink)">Plunge to Low</text>
<text x="520" y="382" font-size="19" fill="var(--ink)">V Rebound</text>
<text x="70" y="512" font-size="22" fill="var(--ink)">Profit There, Exit Drawn First</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A timeline of liquidity poured in and then withdrawn, with the price peaking and bending down after the withdrawal.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="56">Liquidity popped it, not the first rate hike</text>
<path d="M90,330 L300,300 L430,170 L620,150 L760,320 L880,420" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="620" cy="150" r="9" fill="var(--warn)"/>
<text class="g" x="596" y="126" fill="var(--warn)">Peak</text>
<text class="g" x="96" y="316" fill="var(--accent)">Nasdaq</text>
<line x1="90" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="90" y1="470" x2="880" y2="470" stroke="var(--ink)" stroke-width="3"/>
<rect x="300" y="408" width="130" height="58" rx="6" fill="var(--grey)"/>
<text class="d" x="300" y="500">Q4 1999</text>
<text class="d" x="300" y="526">Liquidity poured in</text>
<rect x="500" y="408" width="130" height="58" rx="6" fill="var(--warn)" opacity="0.85"/>
<text class="d" x="500" y="500">Q1 2000</text>
<text class="d" x="500" y="526">Pulled back out</text>
<text class="d" x="700" y="500">March 2000</text>
<text class="c" x="60" y="556">Still short of the pop, because the water is still in</text>
</svg>
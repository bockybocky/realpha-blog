<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="左右兩欄對比同樣三件事：客戶方塊由兩個變成八個，價格柱由矮變高，年限橫條由短變長">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="70" font-size="27" fill="var(--ink)">長約換了兩個變數</text>

  <text x="230" y="140" font-size="19" fill="var(--dim)">過去</text>
  <text x="620" y="140" font-size="19" fill="var(--accent)">現在</text>
  <line x1="560" y1="160" x2="560" y2="450" stroke="var(--line)" stroke-width="2"/>

  <text x="60" y="205" font-size="16" fill="var(--ink)">客戶家數</text>
  <rect x="230" y="184" width="24" height="24" rx="4" fill="var(--grey)"/>
  <rect x="264" y="184" width="24" height="24" rx="4" fill="var(--grey)"/>
  <rect x="620" y="184" width="24" height="24" rx="4" fill="var(--accent)"/>
  <rect x="654" y="184" width="24" height="24" rx="4" fill="var(--accent)"/>
  <rect x="688" y="184" width="24" height="24" rx="4" fill="var(--accent)"/>
  <rect x="722" y="184" width="24" height="24" rx="4" fill="var(--accent)"/>
  <rect x="756" y="184" width="24" height="24" rx="4" fill="var(--accent)"/>
  <rect x="790" y="184" width="24" height="24" rx="4" fill="var(--accent)"/>
  <rect x="824" y="184" width="24" height="24" rx="4" fill="var(--accent)"/>
  <rect x="858" y="184" width="24" height="24" rx="4" fill="var(--accent)"/>

  <text x="60" y="330" font-size="16" fill="var(--ink)">價格與毛利</text>
  <line x1="200" y1="340" x2="900" y2="340" stroke="var(--line)" stroke-width="2"/>
  <rect x="230" y="308" width="50" height="32" rx="4" fill="var(--grey)"/>
  <rect x="620" y="250" width="50" height="90" rx="4" fill="var(--accent)"/>

  <text x="60" y="418" font-size="16" fill="var(--ink)">年限</text>
  <rect x="230" y="400" width="60" height="18" rx="6" fill="var(--grey)"/>
  <rect x="620" y="400" width="240" height="18" rx="6" fill="var(--accent)"/>
  <text x="620" y="446" font-size="15" fill="var(--dim)">四到五年</text>

  <text x="60" y="510" font-size="22" fill="var(--accent)">換的是變數，不是承諾</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A long band runs from the law to your bill, cut by two upright gates in the middle, with long blank stretches between the segments.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="58">Two gates remain, each one a wait</text>
  <rect x="70" y="220" width="130" height="60" rx="10" fill="var(--accent)" opacity="0.85"/>
  <text class="g" x="96" y="258">Law passes</text>
  <rect x="200" y="238" width="180" height="24" fill="var(--grey)" opacity="0.4"/>
  <rect x="380" y="170" width="18" height="160" fill="var(--warn)"/>
  <text class="n" x="340" y="356">New generation online</text>
  <text class="n" x="352" y="380">Takes years</text>
  <rect x="398" y="238" width="220" height="24" fill="var(--grey)" opacity="0.4"/>
  <rect x="618" y="170" width="18" height="160" fill="var(--warn)"/>
  <text class="n" x="560" y="356">Written in state by state</text>
  <text class="n" x="584" y="380">Rate rules</text>
  <rect x="636" y="238" width="150" height="24" fill="var(--grey)" opacity="0.4"/>
  <rect x="786" y="220" width="130" height="60" rx="10" fill="var(--ink)" opacity="0.85"/>
  <text class="g" x="810" y="258" fill="var(--page)">Your bill</text>
  <text class="c" x="60" y="462">The law sets direction; cheaper rides on your state's gate</text>
</svg>
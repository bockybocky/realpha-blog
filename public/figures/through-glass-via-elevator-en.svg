<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A glass panel in cross section with a central via through both sides and a dashed line around the edge for the long way around">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:20px; font-weight:700; fill:var(--ink); }
    .bd  { font-size:16px; fill:var(--dim); }
    .sm  { font-size:15px; fill:var(--dim); }
    .cc  { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="58">Tower above, basement below, elevator between</text>

  <text class="sm" x="200" y="150">Ten or twenty copper layers</text>
  <rect x="200" y="164" width="560" height="6" fill="var(--grey)"/>
  <rect x="200" y="180" width="560" height="6" fill="var(--grey)"/>
  <rect x="200" y="196" width="560" height="6" fill="var(--grey)"/>
  <rect x="200" y="212" width="560" height="6" fill="var(--grey)"/>
  <rect x="200" y="228" width="560" height="6" fill="var(--grey)"/>
  <rect x="200" y="244" width="560" height="6" fill="var(--grey)"/>
  <rect x="200" y="260" width="560" height="6" fill="var(--grey)"/>

  <rect x="180" y="284" width="600" height="64" rx="6" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
  <text class="grp" x="212" y="324" fill="var(--accent)">Glass</text>

  <rect x="200" y="366" width="560" height="6" fill="var(--grey)"/>
  <rect x="200" y="382" width="560" height="6" fill="var(--grey)"/>
  <rect x="200" y="398" width="560" height="6" fill="var(--grey)"/>
  <rect x="200" y="414" width="560" height="6" fill="var(--grey)"/>
  <text class="sm" x="200" y="444">Want a full stack below too</text>

  <rect x="470" y="164" width="24" height="256" rx="4" fill="var(--accent)"/>
  <text class="grp" x="516" y="316" fill="var(--accent)">Drill through</text>

  <path d="M330 172 L840 172 L840 412 L330 412" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
  <text class="bd" x="560" y="480" fill="var(--warn)">Long way around: longer traces, more loss</text>

  <text class="cc" x="60" y="522">You drill not for the hole but to avoid the detour</text>
</svg>
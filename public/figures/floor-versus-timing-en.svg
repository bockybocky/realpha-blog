<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The line moves sideways above a fundamentals floor for a long time before turning up on the right, with timing decided in the area above.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text class="t" x="60" y="60">It cannot fall further, but that is not a reason to rise now</text>

  <rect x="120" y="120" width="760" height="70" fill="var(--card)"/>
  <line x1="120" y1="190" x2="880" y2="190" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
  <text class="g" x="136" y="152">Upside</text>
  <text class="s" x="136" y="176">Timing set by money</text>

  <rect x="120" y="380" width="760" height="60" fill="var(--card)"/>
  <line x1="120" y1="380" x2="880" y2="380" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="136" y="412">Downside</text>
  <text class="s" x="136" y="434">Cheap enough and buyers show up</text>

  <polyline points="140,300 200,332 260,302 320,356 380,330 440,368 500,340 560,362 620,344 680,300 740,256 800,216 860,192"
            fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>

  <text class="s" x="360" y="252" text-anchor="middle">Good earnings, still no rally</text>
  <text class="s" x="800" y="308" text-anchor="middle">Money arrives</text>

  <text class="c" x="480" y="502" text-anchor="middle">Fundamentals set how far it falls; money sets when it turns</text>
</svg>
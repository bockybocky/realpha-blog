<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars compared by height, the right one more than twice the left.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Same gigawatt, more fits inside</text>
<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>

<rect x="200" y="290" width="150" height="150" rx="6" fill="var(--grey)"/>
<text class="t" x="275" y="268" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">18B</text>
<text class="t" x="275" y="472" font-size="16" fill="var(--dim)" text-anchor="middle">Before</text>

<rect x="560" y="106" width="150" height="334" rx="6" fill="var(--accent)"/>
<text class="t" x="635" y="88" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">40B+</text>
<text class="t" x="635" y="472" font-size="16" fill="var(--dim)" text-anchor="middle">His now</text>

<line x1="420" y1="290" x2="480" y2="290" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="420" y1="106" x2="480" y2="106" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="t" x="450" y="206" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Extra</text>
<text class="t" x="450" y="232" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">This gap</text>

<text class="t" x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">USD per gigawatt site; seller's own numbers</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="When the context window is mapped onto a human lifetime, one million tokens form only a thin line, while one billion tokens span twenty to thirty years." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Map context onto a life</text>
<text x="100" y="140" font-size="20" fill="var(--dim)">One human lifetime</text>
<rect x="100" y="152" width="760" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="100" y="250" font-size="20" fill="var(--ink)">1 million tokens</text>
<rect x="100" y="262" width="8" height="44" rx="2" fill="var(--accent)"/>
<text x="126" y="291" font-size="15" fill="var(--dim)">Thousands of books, but only hours of audio</text>
<text x="100" y="360" font-size="20" fill="var(--accent)">1 billion tokens</text>
<rect x="100" y="372" width="250" height="44" rx="4" fill="var(--accent)"/>
<text x="368" y="401" font-size="15" fill="var(--ink)">20–30 years of experience</text>
<text x="60" y="478" font-size="22" fill="var(--ink)">DRAM cannot reach the block on the right</text>
</svg>
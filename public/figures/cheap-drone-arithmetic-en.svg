<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left one of fifty dots gets through, on the right a single missile, the two joined by the words sometimes costs more.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">The arithmetic of cheap drones</text>
<text x="80" y="126" font-size="19" fill="var(--ink)">Salvo of 50</text>
<g fill="var(--grey)">
<circle cx="96" cy="170" r="11"/><circle cx="136" cy="170" r="11"/><circle cx="176" cy="170" r="11"/><circle cx="216" cy="170" r="11"/><circle cx="256" cy="170" r="11"/><circle cx="296" cy="170" r="11"/><circle cx="336" cy="170" r="11"/><circle cx="376" cy="170" r="11"/><circle cx="416" cy="170" r="11"/><circle cx="456" cy="170" r="11"/>
<circle cx="96" cy="214" r="11"/><circle cx="136" cy="214" r="11"/><circle cx="176" cy="214" r="11"/><circle cx="216" cy="214" r="11"/><circle cx="256" cy="214" r="11"/><circle cx="296" cy="214" r="11"/><circle cx="336" cy="214" r="11"/><circle cx="376" cy="214" r="11"/><circle cx="416" cy="214" r="11"/><circle cx="456" cy="214" r="11"/>
<circle cx="96" cy="258" r="11"/><circle cx="136" cy="258" r="11"/><circle cx="176" cy="258" r="11"/><circle cx="216" cy="258" r="11"/><circle cx="256" cy="258" r="11"/><circle cx="296" cy="258" r="11"/><circle cx="336" cy="258" r="11"/><circle cx="376" cy="258" r="11"/><circle cx="416" cy="258" r="11"/><circle cx="456" cy="258" r="11"/>
<circle cx="96" cy="302" r="11"/><circle cx="136" cy="302" r="11"/><circle cx="176" cy="302" r="11"/><circle cx="216" cy="302" r="11"/><circle cx="256" cy="302" r="11"/><circle cx="296" cy="302" r="11"/><circle cx="336" cy="302" r="11"/><circle cx="376" cy="302" r="11"/><circle cx="416" cy="302" r="11"/><circle cx="456" cy="302" r="11"/>
<circle cx="96" cy="346" r="11"/><circle cx="136" cy="346" r="11"/><circle cx="176" cy="346" r="11"/><circle cx="216" cy="346" r="11"/><circle cx="256" cy="346" r="11"/><circle cx="296" cy="346" r="11"/><circle cx="336" cy="346" r="11"/><circle cx="376" cy="346" r="11"/><circle cx="416" cy="346" r="11"/>
</g>
<circle cx="456" cy="346" r="11" fill="var(--accent)"/>
<text x="80" y="398" font-size="16" fill="var(--dim)">49 stopped　1 through</text>
<text x="565" y="262" text-anchor="middle" font-size="19" fill="var(--warn)">Sometimes costs more</text>
<text x="565" y="294" text-anchor="middle" font-size="15" fill="var(--dim)">Cost of one salvo</text>
<text x="760" y="126" text-anchor="middle" font-size="19" fill="var(--ink)">One costly missile</text>
<rect x="715" y="160" width="90" height="200" rx="45" fill="var(--accent)" opacity="0.3" stroke="var(--accent)" stroke-width="2"/>
<text x="480" y="480" text-anchor="middle" font-size="22" fill="var(--ink)">Cheap pays off in volume, not in unit cost</text>
</svg>
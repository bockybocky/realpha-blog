<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two panels: the left bar keeps its length and only changes color, the right bar gains a section at the end and gets longer">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="48" y="56" font-size="27" font-weight="700" fill="var(--ink)">Taken or added?</text>

  <rect x="48" y="96" width="416" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="78" y="140" font-size="20" font-weight="700" fill="var(--ink)">Orders switch</text>
  <text x="106" y="176" font-size="15" fill="var(--dim)">Before</text>
  <rect x="106" y="186" width="126" height="46" rx="5" fill="var(--grey)"/>
  <rect x="236" y="186" width="96" height="46" rx="5" fill="var(--grey)"/>
  <rect x="336" y="186" width="66" height="46" rx="5" fill="var(--grey)"/>
  <text x="106" y="276" font-size="15" fill="var(--dim)">After</text>
  <rect x="106" y="286" width="126" height="46" rx="5" fill="var(--grey)"/>
  <rect x="236" y="286" width="96" height="46" rx="5" fill="var(--accent)"/>
  <rect x="336" y="286" width="66" height="46" rx="5" fill="var(--grey)"/>
  <text x="106" y="380" font-size="16" fill="var(--dim)">Same total, someone hurt</text>

  <rect x="496" y="96" width="416" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="526" y="140" font-size="20" font-weight="700" fill="var(--ink)">New projects</text>
  <text x="524" y="176" font-size="15" fill="var(--dim)">Before</text>
  <rect x="524" y="186" width="126" height="46" rx="5" fill="var(--grey)"/>
  <rect x="654" y="186" width="96" height="46" rx="5" fill="var(--grey)"/>
  <rect x="754" y="186" width="66" height="46" rx="5" fill="var(--grey)"/>
  <text x="524" y="276" font-size="15" fill="var(--dim)">After</text>
  <rect x="524" y="286" width="126" height="46" rx="5" fill="var(--grey)"/>
  <rect x="654" y="286" width="96" height="46" rx="5" fill="var(--grey)"/>
  <rect x="754" y="286" width="66" height="46" rx="5" fill="var(--grey)"/>
  <rect x="824" y="286" width="56" height="46" rx="5" fill="var(--accent)"/>
  <text x="524" y="380" font-size="16" fill="var(--dim)">Bigger pie, one more sharer</text>

  <text x="480" y="500" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">Not who got it, did the pie grow</text>
</svg>
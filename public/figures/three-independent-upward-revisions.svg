<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三組各自獨立的兩點連線並排，三條線都由左下往右上傾斜，方向完全一致">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--ink); }
.d { font-size:16px; fill:var(--dim); }
.n { font-size:19px; font-weight:700; fill:var(--ink); }
.c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">三個獨立來源，同時往上修</text>
<line x1="340" y1="120" x2="340" y2="420" stroke="var(--line)" stroke-width="1.5"/>
<line x1="600" y1="120" x2="600" y2="420" stroke="var(--line)" stroke-width="1.5"/>
<text class="g" x="220" y="148" text-anchor="middle">明年營收成長</text>
<text class="g" x="480" y="148" text-anchor="middle">收發器年消耗</text>
<text class="g" x="740" y="148" text-anchor="middle">2027 雲端資本支出</text>
<line x1="140" y1="340" x2="300" y2="205" stroke="var(--accent)" stroke-width="4"/>
<circle cx="140" cy="340" r="7" fill="var(--grey)"/>
<circle cx="300" cy="205" r="8" fill="var(--accent)"/>
<text class="d" x="140" y="372" text-anchor="middle">44%</text>
<text class="n" x="300" y="186" text-anchor="middle">70%</text>
<line x1="400" y1="352" x2="560" y2="198" stroke="var(--accent)" stroke-width="4"/>
<circle cx="400" cy="352" r="7" fill="var(--grey)"/>
<circle cx="560" cy="198" r="8" fill="var(--accent)"/>
<text class="d" x="400" y="384" text-anchor="middle">5000 萬顆</text>
<text class="n" x="560" y="179" text-anchor="middle">8000～9000 萬</text>
<line x1="660" y1="346" x2="820" y2="202" stroke="var(--accent)" stroke-width="4"/>
<circle cx="660" cy="346" r="7" fill="var(--grey)"/>
<circle cx="820" cy="202" r="8" fill="var(--accent)"/>
<text class="d" x="660" y="378" text-anchor="middle">六月估值</text>
<text class="n" x="820" y="183" text-anchor="middle">1.3 兆美元</text>
<text class="c" x="60" y="472">重要的不是數字大，是修的方向一致</text>
</svg>
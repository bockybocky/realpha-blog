<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條平行線匯入一個窄口，出口只剩一條細線">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">三條線進來，出口只有一條</text>

  <rect x="48" y="132" width="360" height="54" rx="10" fill="var(--accent)" opacity="0.85"/>
  <rect x="48" y="238" width="360" height="54" rx="10" fill="var(--accent)" opacity="0.85"/>
  <rect x="48" y="344" width="360" height="54" rx="10" fill="var(--accent)" opacity="0.85"/>
  <text class="t" x="228" y="167" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">agent 一　改動</text>
  <text class="t" x="228" y="273" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">agent 二　改動</text>
  <text class="t" x="228" y="379" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">agent 三　改動</text>
  <text class="t" x="48" y="112" font-size="16" fill="var(--dim)">同時做完</text>

  <path d="M408 132 L560 240 L560 290 L408 398 L408 344 L520 265 L408 186 Z" fill="var(--grey)" opacity="0.5"/>
  <rect x="560" y="236" width="150" height="58" rx="10" fill="var(--warn)"/>
  <text class="t" x="635" y="273" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">你的眼睛</text>
  <text class="t" x="635" y="330" font-size="16" fill="var(--dim)" text-anchor="middle">一份一份讀</text>

  <rect x="710" y="252" width="200" height="26" rx="8" fill="var(--warn)" opacity="0.85"/>
  <text class="t" x="810" y="320" font-size="16" fill="var(--dim)" text-anchor="middle">一條合併的速度</text>
  <text class="t" x="810" y="232" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">真正的產出</text>
</svg>
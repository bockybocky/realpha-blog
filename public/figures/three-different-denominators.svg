<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條等長的長條各自代表不同的整體，上色的比例一條很長、一條約三分之二、一條完全沒有">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="58">百分比一樣高，分母不是同一個</text>

  <text class="g" x="80" y="124">去年併網的新增容量</text>
  <rect x="80" y="138" width="800" height="64" fill="var(--card)" stroke="var(--line)"/>
  <rect x="80" y="138" width="720" height="64" fill="var(--accent)"/>
  <text class="d" x="104" y="178">清潔能源約九成</text>

  <text class="g" x="80" y="256">新增用電</text>
  <rect x="80" y="270" width="800" height="64" fill="var(--card)" stroke="var(--line)"/>
  <rect x="80" y="270" width="533" height="64" fill="var(--warn)"/>
  <text class="d" x="104" y="310">燃氣供應約三分之二</text>

  <text class="g" x="80" y="388">占總量</text>
  <rect x="80" y="402" width="800" height="64" fill="var(--card)" stroke="var(--line)" stroke-dasharray="8 6"/>
  <text class="d" x="104" y="442">這集沒給數字</text>

  <text class="c" x="60" y="500">看到百分比，先問這是誰的分母</text>
</svg>
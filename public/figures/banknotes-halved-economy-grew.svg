<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="鈔票供給下滑一半、經濟上升，兩條線張開一道缺口">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">經濟往上，鈔票往下</text>
<line x1="150" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="150" y="450">1880</text>
<text class="b" x="820" y="450">1890</text>
<path d="M170 300 L820 170" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
<text class="g" x="640" y="150" fill="var(--accent)">經濟</text>
<path d="M170 300 L820 380" fill="none" stroke="var(--warn)" stroke-width="3.5"/>
<text class="g" x="600" y="410" fill="var(--warn)">國家銀行券流通量</text>
<line x1="820" y1="170" x2="820" y2="380" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="836" y="280">缺口</text>
<circle cx="170" cy="300" r="7" fill="var(--ink)"/>
<text class="b" x="186" y="296">同一個起點</text>
<text class="c" x="60" y="492">鈔票被綁在一批愈來愈貴的國債上</text>
</svg>
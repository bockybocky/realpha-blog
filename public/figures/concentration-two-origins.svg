<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一條高度集中的營收長條，下方兩個來源方向相反，一邊客戶散開離去，一邊客戶正靠近">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <defs>
    <marker id="ad4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/>
    </marker>
  </defs>

  <text x="60" y="58" font-size="27" fill="var(--ink)">同一個數字，兩種來路</text>

  <rect x="300" y="110" width="360" height="58" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <rect x="300" y="110" width="300" height="58" rx="8" fill="var(--accent)"/>
  <text x="450" y="147" font-size="16" fill="var(--page)" text-anchor="middle">兩個客戶</text>
  <text x="680" y="147" font-size="19" fill="var(--dim)">營收</text>

  <path d="M230,250 L370,180" fill="none" stroke="var(--grey)" stroke-width="3" marker-end="url(#ad4)"/>
  <path d="M730,250 L590,180" fill="none" stroke="var(--grey)" stroke-width="3" marker-end="url(#ad4)"/>

  <rect x="56" y="272" width="392" height="196" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="80" y="312" font-size="20" fill="var(--warn)">賣不太動</text>
  <circle cx="150" cy="392" r="15" fill="var(--accent)"/>
  <circle cx="232" cy="386" r="11" fill="var(--grey)"/>
  <circle cx="308" cy="378" r="8" fill="var(--grey)" opacity="0.6"/>
  <circle cx="382" cy="372" r="5" fill="var(--grey)" opacity="0.35"/>
  <line x1="256" y1="386" x2="292" y2="381" stroke="var(--grey)" stroke-width="2" marker-end="url(#ad4)"/>
  <line x1="326" y1="377" x2="366" y2="373" stroke="var(--grey)" stroke-width="2" marker-end="url(#ad4)"/>
  <text x="80" y="440" font-size="16" fill="var(--dim)">客戶在離開</text>

  <rect x="512" y="272" width="392" height="196" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="536" y="312" font-size="20" fill="var(--accent)">剛做出來</text>
  <circle cx="588" cy="392" r="15" fill="var(--accent)"/>
  <circle cx="700" cy="386" r="11" fill="var(--grey)"/>
  <circle cx="790" cy="378" r="11" fill="var(--grey)"/>
  <circle cx="872" cy="372" r="11" fill="var(--grey)"/>
  <line x1="684" y1="388" x2="632" y2="392" stroke="var(--grey)" stroke-width="2" marker-end="url(#ad4)"/>
  <line x1="774" y1="380" x2="726" y2="384" stroke="var(--grey)" stroke-width="2" marker-end="url(#ad4)"/>
  <text x="536" y="440" font-size="16" fill="var(--dim)">最挑的先來試</text>

  <text x="60" y="518" font-size="22" fill="var(--ink)">財報上長得一樣，處境剛好相反</text>
</svg>
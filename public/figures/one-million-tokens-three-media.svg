<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條長度懸殊的橫條，語音橫跨整條時間軸，影片只剩十二分之一">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="56" y="56" font-size="27" font-weight="700" fill="var(--ink)">同樣一百萬個 token，裝得下多少</text>
<rect x="56" y="96" width="848" height="86" rx="14" fill="var(--card)" stroke="var(--line)" stroke-dasharray="6 6"/>
<text x="80" y="132" font-size="19" font-weight="700" fill="var(--dim)">文字</text>
<text x="80" y="164" font-size="22" font-weight="700" fill="var(--ink)">1,500 至 3,000 頁</text>
<text x="880" y="150" font-size="15" fill="var(--dim)" text-anchor="end">單位不同，另計</text>
<text x="56" y="246" font-size="19" font-weight="700" fill="var(--ink)">語音</text>
<rect x="160" y="224" width="600" height="30" rx="6" fill="var(--accent)"/>
<text x="776" y="246" font-size="16" fill="var(--dim)">11 至 12 小時</text>
<text x="56" y="326" font-size="19" font-weight="700" fill="var(--ink)">影片</text>
<rect x="160" y="304" width="50" height="30" rx="6" fill="var(--warn)"/>
<text x="226" y="326" font-size="16" fill="var(--dim)">約 1 小時</text>
<line x1="160" y1="372" x2="760" y2="372" stroke="var(--line)" stroke-width="2"/>
<line x1="160" y1="372" x2="160" y2="382" stroke="var(--grey)" stroke-width="2"/>
<line x1="360" y1="372" x2="360" y2="382" stroke="var(--grey)" stroke-width="2"/>
<line x1="560" y1="372" x2="560" y2="382" stroke="var(--grey)" stroke-width="2"/>
<line x1="760" y1="372" x2="760" y2="382" stroke="var(--grey)" stroke-width="2"/>
<text x="160" y="402" font-size="15" fill="var(--dim)" text-anchor="middle">0</text>
<text x="360" y="402" font-size="15" fill="var(--dim)" text-anchor="middle">4</text>
<text x="560" y="402" font-size="15" fill="var(--dim)" text-anchor="middle">8</text>
<text x="760" y="402" font-size="15" fill="var(--dim)" text-anchor="middle">12 小時</text>
<text x="56" y="470" font-size="22" font-weight="700" fill="var(--ink)">同一個視窗，換成影片只剩一小時</text>
</svg>
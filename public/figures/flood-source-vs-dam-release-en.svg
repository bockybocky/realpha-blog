<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars of wildly unequal length: local rainfall accounts for 73.7 percent, while perfect dam releases would recover only 3.68 percent of the flooded area, a bar almost too short to see.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">The blamed link was not the deciding one</text>
<text x="60" y="86" font-size="16" fill="var(--dim)">Where the lowland flood came from, and the ceiling across 17 release scenarios</text>

<text x="80" y="164" font-size="20" font-weight="700" fill="var(--ink)">Where the water came from</text>
<rect x="80" y="180" width="800" height="86" fill="var(--card)" stroke="var(--line)"/>
<rect x="80" y="180" width="590" height="86" fill="var(--accent)"/>
<text x="375" y="216" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">Rain falling locally</text>
<text x="375" y="244" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">73.7%</text>
<text x="775" y="216" font-size="16" text-anchor="middle" fill="var(--ink)">Rivers</text>
<text x="775" y="242" font-size="16" text-anchor="middle" fill="var(--ink)">Under 30%</text>

<text x="80" y="342" font-size="20" font-weight="700" fill="var(--ink)">Perfect releases would recover</text>
<rect x="80" y="358" width="800" height="60" fill="var(--card)" stroke="var(--line)"/>
<rect x="80" y="358" width="29" height="60" fill="var(--warn)"/>
<line x1="109" y1="358" x2="160" y2="330" stroke="var(--warn)" stroke-width="2"/>
<text x="168" y="326" font-size="19" font-weight="700" fill="var(--warn)">3.68%</text>
<text x="480" y="396" font-size="16" text-anchor="middle" fill="var(--dim)">Even with perfect foresight of the rain to come</text>

<text x="480" y="478" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">The fragile point is not where the blame lands</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三根高度相近的柱子並排標示 100%、80%、70%，第一名只比第二名高出一小截。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .n { font-size:34px; font-weight:700; fill:var(--ink); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">一倍大不大，要放回隊伍裡才知道</text>
  <text class="b" x="60" y="94">同期、同單位，兩年位元出貨量成長</text>
  <rect x="140" y="180" width="140" height="240" fill="var(--accent)"/>
  <rect x="400" y="228" width="140" height="192" fill="var(--grey)"/>
  <rect x="660" y="252" width="140" height="168" fill="var(--grey)"/>
  <text class="n" x="140" y="168" fill="var(--accent)">100%</text>
  <text class="n" x="400" y="216">80%</text>
  <text class="n" x="660" y="240">70%</text>
  <text class="g" x="140" y="452">東芝</text>
  <text class="g" x="400" y="452">希捷</text>
  <text class="g" x="660" y="452">威騰</text>
  <path d="M100 420 L860 420" stroke="var(--line)" stroke-width="2"/>
  <text class="c" x="60" y="506">它是排第一的那個，跟第二名差 20 個百分點</text>
</svg>
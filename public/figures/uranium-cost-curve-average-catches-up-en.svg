<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The line climbs to the upper right, and the lowest-cost producer's horizontal line sits directly above the line's end point, with the two almost touching.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">The whole cost curve has moved up</text>
<text x="60" y="88" font-size="16" fill="var(--dim)">Unit: USD / lb</text>

<line x1="150" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="333" x2="880" y2="333" stroke="var(--line)" stroke-width="1"/>
<line x1="150" y1="120" x2="880" y2="120" stroke="var(--line)" stroke-width="1"/>
<text x="118" y="446" font-size="15" fill="var(--dim)" text-anchor="end">0</text>
<text x="118" y="339" font-size="15" fill="var(--dim)" text-anchor="end">20</text>
<text x="118" y="126" font-size="15" fill="var(--dim)" text-anchor="end">60</text>

<line x1="150" y1="147" x2="880" y2="147" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 7"/>
<text x="880" y="138" font-size="19" fill="var(--warn)" text-anchor="end">55 in FX-adjusted terms</text>

<line x1="150" y1="227" x2="880" y2="227" stroke="var(--accent)" stroke-width="3" stroke-dasharray="10 6"/>
<text x="880" y="218" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="end">Lowest-cost producer 40</text>

<polyline points="200,312 400,296 600,280 780,237" fill="none" stroke="var(--ink)" stroke-width="4"/>
<circle cx="200" cy="312" r="7" fill="var(--ink)"/>
<circle cx="400" cy="296" r="7" fill="var(--ink)"/>
<circle cx="600" cy="280" r="7" fill="var(--ink)"/>
<circle cx="780" cy="237" r="9" fill="var(--ink)"/>
<text x="200" y="296" font-size="16" fill="var(--ink)" text-anchor="middle">24</text>
<text x="400" y="280" font-size="16" fill="var(--ink)" text-anchor="middle">27</text>
<text x="600" y="264" font-size="16" fill="var(--ink)" text-anchor="middle">30</text>
<text x="780" y="221" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">38</text>
<text x="200" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">2019</text>
<text x="400" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">2021</text>
<text x="600" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">2023</text>
<text x="780" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">2025</text>
<text x="160" y="407" font-size="19" fill="var(--dim)">Industry weighted average</text>

<text x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">The cheapest producer now sits on the average</text>
</svg>
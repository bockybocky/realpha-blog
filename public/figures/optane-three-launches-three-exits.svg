<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="時間軸上三座小山代表三次上市，1970、2009、2015，一座比一座高；每座山下方標出退場推手，分別是 DRAM 與可抹除 ROM、3D NAND、NAND 降價與 DRAM 價格。">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700} .g{font-size:20px;font-weight:700}
    .b{font-size:16px} .bb{font-size:16px;font-weight:700} .d{font-size:15px;fill:var(--dim)} .c{font-size:22px;font-weight:700}
</style>
<text x="480" y="50" class="t" text-anchor="middle">三次上市、三次退場</text>
<line x1="60" y1="380" x2="384" y2="380" stroke="var(--dim)" stroke-width="2"/>
<line x1="408" y1="380" x2="880" y2="380" stroke="var(--dim)" stroke-width="2"/>
<path d="M382,392 L392,368 M398,392 L408,368" stroke="var(--dim)" stroke-width="2" fill="none"/>
<path d="M176,380 C200,380 196,230 236,230 C276,230 272,380 296,380 Z" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<path d="M584,380 C604,380 604,210 624,210 C644,210 644,380 664,380 Z" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<path d="M680,380 C705,380 705,165 736,165 C767,165 767,380 792,380 Z" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<text x="236" y="214" class="bb" text-anchor="middle">讀多寫少記憶體</text>
<text x="624" y="196" class="bb" text-anchor="middle">手機版</text>
<text x="736" y="150" class="bb" text-anchor="middle">3D XPoint／Optane</text>
<line x1="296" y1="380" x2="424" y2="380" stroke="var(--grey)" stroke-width="6" stroke-dasharray="4 6"/>
<circle cx="424" cy="380" r="7" fill="var(--accent)"/>
<text x="424" y="330" class="bb" text-anchor="middle">復活</text>
<text x="424" y="352" class="d" text-anchor="middle">製程縮小</text>
<text x="200" y="404" class="d" text-anchor="middle">1970</text>
<text x="440" y="404" class="d" text-anchor="middle">2000</text>
<text x="584" y="404" class="d" text-anchor="middle">2009</text>
<text x="680" y="404" class="d" text-anchor="middle">2015</text>
<text x="792" y="404" class="d" text-anchor="middle">2022</text>
<text x="60" y="456" class="d">退場推手</text>
<text x="236" y="456" class="bb" text-anchor="middle" style="fill:var(--warn)">DRAM 衝容量</text>
<text x="236" y="480" class="bb" text-anchor="middle" style="fill:var(--warn)">可抹除 ROM</text>
<text x="624" y="456" class="bb" text-anchor="middle" style="fill:var(--warn)">3D NAND</text>
<text x="736" y="456" class="bb" text-anchor="middle" style="fill:var(--warn)">NAND 降價</text>
<text x="736" y="480" class="bb" text-anchor="middle" style="fill:var(--warn)">DRAM 價格</text>
<text x="480" y="532" class="c" text-anchor="middle">每次退場，都是鄰居進步推的</text>
</svg>
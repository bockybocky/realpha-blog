<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="四根長條圖：五美元以下那根特別高，其餘三根幾乎貼在基線上">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="58">優勢住在哪裡：觸發後 10 日同群超額</text>
  <line x1="80" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
  <rect x="120" y="200" width="130" height="200" fill="var(--warn)"/>
  <text class="g" x="185" y="184" text-anchor="middle" fill="var(--warn)">+1.33%</text>
  <text class="g" x="185" y="432" text-anchor="middle">低於 $5</text>
  <text class="n" x="185" y="457" text-anchor="middle">占觸發 27%</text>
  <rect x="320" y="380" width="130" height="20" fill="var(--accent)"/>
  <text class="g" x="385" y="364" text-anchor="middle" fill="var(--dim)">+0.13%</text>
  <text class="g" x="385" y="432" text-anchor="middle">$5 到 $20</text>
  <rect x="520" y="397" width="130" height="3" fill="var(--accent)"/>
  <text class="g" x="585" y="381" text-anchor="middle" fill="var(--dim)">+0.02%</text>
  <text class="g" x="585" y="432" text-anchor="middle">$20 到 $50</text>
  <rect x="720" y="383" width="130" height="17" fill="var(--accent)"/>
  <text class="g" x="785" y="367" text-anchor="middle" fill="var(--dim)">+0.11%</text>
  <text class="g" x="785" y="432" text-anchor="middle">高於 $50</text>
  <text class="c" x="60" y="498">水餃股扛下幾乎全部的優勢，其他價格帶貼著地板</text>
</svg>
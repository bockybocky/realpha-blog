<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="四個方塊沿一條軸由左往右排列，尺寸與間距同時遞增，形成由近而小到遠而大的階梯">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="62">越不常用的，放越遠</text>
  <text class="b" x="48" y="92">方塊大小＝容量　間距＝取用成本</text>
  <rect x="40" y="118" width="880" height="304" rx="14" fill="var(--card)"/>
  <line x1="80" y1="170" x2="900" y2="170" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="900,170 888,164 888,176" fill="var(--grey)"/>
  <text class="b" x="80" y="156">常用</text>
  <text class="b" x="900" y="156" text-anchor="end">不常用</text>
  <line x1="80" y1="360" x2="900" y2="360" stroke="var(--line)" stroke-width="2"/>
  <rect x="90" y="300" width="70" height="60" rx="6" fill="var(--accent)"/>
  <rect x="240" y="280" width="90" height="80" rx="6" fill="var(--grey)"/>
  <rect x="440" y="250" width="120" height="110" rx="6" fill="var(--grey)"/>
  <rect x="690" y="210" width="200" height="150" rx="6" fill="var(--grey)"/>
  <text class="b" x="125" y="386" text-anchor="middle">高頻寬記憶體</text>
  <text class="b" x="285" y="386" text-anchor="middle">板上低功耗</text>
  <text class="b" x="500" y="386" text-anchor="middle">一般記憶體</text>
  <text class="b" x="790" y="386" text-anchor="middle">固態硬碟</text>
  <text class="g" x="125" y="290" text-anchor="middle" fill="var(--accent)">最擠</text>
  <text class="c" x="48" y="470">不是一塊，是一疊</text>
</svg>
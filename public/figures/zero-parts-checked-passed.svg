<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三根柱子比較檢查了幾個零件，第一根高度為零卻同樣標示通過">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="80" y="72" font-size="27" font-weight="700" fill="var(--ink)">同一句「通過」，背後可以是零</text>

  <line x1="120" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

  <rect x="190" y="404" width="150" height="16" rx="4" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="265" y="382" font-size="27" font-weight="700" text-anchor="middle" fill="var(--warn)">0</text>
  <text x="265" y="452" font-size="19" font-weight="700" text-anchor="middle" fill="var(--warn)">通過</text>
  <text x="265" y="482" font-size="16" text-anchor="middle" fill="var(--dim)">第一次跑</text>

  <rect x="430" y="220" width="150" height="200" rx="5" fill="var(--accent)" opacity="0.85"/>
  <text x="505" y="200" font-size="27" font-weight="700" text-anchor="middle" fill="var(--ink)">74</text>
  <text x="505" y="452" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">通過</text>
  <text x="505" y="482" font-size="16" text-anchor="middle" fill="var(--dim)">補上一行之後，抓到 1 個問題</text>

  <rect x="670" y="120" width="150" height="300" rx="5" fill="var(--grey)" opacity="0.55"/>
  <text x="745" y="104" font-size="27" font-weight="700" text-anchor="middle" fill="var(--ink)">111</text>
  <text x="745" y="452" font-size="19" font-weight="700" text-anchor="middle" fill="var(--dim)">通過</text>
  <text x="745" y="482" font-size="16" text-anchor="middle" fill="var(--dim)">之前那台咖啡機</text>

  <text x="80" y="520" font-size="22" font-weight="700" fill="var(--ink)">先問它看了幾樣，再決定要不要信</text>
</svg>
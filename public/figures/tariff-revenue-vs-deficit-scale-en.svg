<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars, the upper about nine times the length of the lower">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:19px;fill:var(--ink)}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">Billions in, trillions short</text>
<text class="g" x="140" y="172">Deficit  $1.8T</text>
<rect x="140" y="188" width="700" height="72" fill="var(--grey)"/>
<text class="g" x="140" y="332">Tariffs  ~$0.2T</text>
<rect x="140" y="348" width="78" height="72" fill="var(--accent)"/>
<rect x="218" y="348" width="622" height="72" fill="var(--card)" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="s" x="529" y="392" text-anchor="middle">Uncovered</text>
<text class="c" x="60" y="478">Rates rise, scale off by 10x</text>
</svg>
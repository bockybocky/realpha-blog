<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三條等長的擴產長條，填色代表不同資金來源，最後一條偏後才開工且用警示色">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="52" font-size="27" fill="var(--ink)">一樣要擴產，錢從哪裡來不一樣</text>

<text x="60" y="152" font-size="19" fill="var(--dim)">客戶預付</text>
<rect x="260" y="126" width="420" height="54" rx="8" fill="var(--accent)"/>
<text x="470" y="161" font-size="16" fill="var(--page)" text-anchor="middle">客戶端資金 20 億美元</text>

<text x="60" y="246" font-size="19" fill="var(--dim)">自己賺的</text>
<rect x="260" y="220" width="420" height="54" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="470" y="255" font-size="16" fill="var(--accent)" text-anchor="middle">營運現金流</text>

<text x="60" y="340" font-size="19" fill="var(--warn)">賣新股</text>
<rect x="470" y="314" width="420" height="54" rx="8" fill="var(--warn)"/>
<text x="680" y="349" font-size="16" fill="var(--page)" text-anchor="middle">隨市增發 6 億美元額度</text>
<text x="260" y="349" font-size="16" fill="var(--dim)">開工要等</text>

<rect x="260" y="420" width="630" height="2" fill="var(--line)"/>
<text x="300" y="452" font-size="16" fill="var(--dim)">2026</text>
<text x="510" y="452" font-size="16" fill="var(--dim)">2027 上半年</text>

<text x="480" y="516" font-size="22" fill="var(--ink)" text-anchor="middle">這一年決定誰難過的是資金結構</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="一個實心箱代表賣出一組，後面三個多的虛線箱代表被偷的三點二組">
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<text x="48" y="62" class="t">賣出 1 組，要進 4.2 組</text>
<text x="48" y="92" class="d">$799 工具組・上鎖前</text>
<path d="M250 176 L250 160 L790 160 L790 176" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text x="520" y="146" class="g w" text-anchor="middle">被偷 3.2 組</text>
<rect x="80" y="190" width="150" height="140" rx="6" fill="var(--accent)"/>
<rect x="250" y="190" width="150" height="140" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="420" y="190" width="150" height="140" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="590" y="190" width="150" height="140" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="760" y="190" width="30" height="140" rx="4" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 5"/>
<text x="155" y="366" class="g a" text-anchor="middle">賣出 1 組</text>
<text x="480" y="444" class="c" text-anchor="middle">毛利結構撐不住</text>
</svg>
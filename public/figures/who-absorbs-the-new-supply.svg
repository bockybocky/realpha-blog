<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="新增供給的箭頭幾乎全部匯向最下方那一群買家，另外兩群只分到細箭頭">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink)}
.ga{font-size:19px;fill:var(--accent)}
.b{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">接手的人換了一批</text>
<rect x="80" y="150" width="130" height="290" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="ga" x="145" y="290" text-anchor="middle">新增</text>
<text class="ga" x="145" y="316" text-anchor="middle">供給</text>
<text class="b" x="145" y="470" text-anchor="middle">每年往上加</text>
<line x1="215" y1="200" x2="520" y2="185" stroke="var(--grey)" stroke-width="2"/>
<path d="M528 184 L512 178 L513 192 Z" fill="var(--grey)"/>
<line x1="215" y1="285" x2="520" y2="290" stroke="var(--grey)" stroke-width="3"/>
<path d="M528 290 L512 283 L512 297 Z" fill="var(--grey)"/>
<line x1="215" y1="380" x2="518" y2="400" stroke="var(--accent)" stroke-width="10"/>
<path d="M530 401 L510 391 L510 413 Z" fill="var(--accent)"/>
<rect x="540" y="150" width="340" height="76" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="562" y="185">外國央行</text>
<text class="b" x="562" y="211">量已備齊</text>
<rect x="540" y="252" width="340" height="76" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="562" y="287">外國投資人</text>
<text class="b" x="562" y="313">跟不上擴張</text>
<rect x="540" y="354" width="340" height="106" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="ga" x="562" y="394">國內可裁量投資人</text>
<text class="b" x="562" y="422">基金 · 銀行 · 保險 · 退休金</text>
<text class="b" x="562" y="446">對殖利率敏感</text>
<text class="c" x="60" y="520">增量最後落在對價格最敏感的那群人手上</text>
</svg>
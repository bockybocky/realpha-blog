<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two side views of a car body, the left tipping forward and the right staying level, with the bar below almost entirely regeneration">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:600;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:600;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">At the red light, watch the nose</text>
<text class="g" x="215" y="118" text-anchor="middle" fill="var(--warn)">Dips</text>
<g transform="translate(92,150) rotate(-6 123 50)">
<path d="M0,58 L14,30 L60,10 L150,10 L192,32 L232,38 L246,54 L246,72 L0,72 Z" fill="none" stroke="var(--warn)" stroke-width="2.5"/>
<circle cx="58" cy="72" r="17" fill="var(--page)" stroke="var(--warn)" stroke-width="2.5"/>
<circle cx="192" cy="72" r="17" fill="var(--page)" stroke="var(--warn)" stroke-width="2.5"/>
</g>
<line x1="70" y1="246" x2="360" y2="246" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="695" y="118" text-anchor="middle" fill="var(--accent)">No dip</text>
<g transform="translate(572,150)">
<path d="M0,58 L14,30 L60,10 L150,10 L192,32 L232,38 L246,54 L246,72 L0,72 Z" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="58" cy="72" r="17" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="192" cy="72" r="17" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5"/>
</g>
<line x1="550" y1="246" x2="840" y2="246" stroke="var(--line)" stroke-width="2"/>
<rect x="140" y="310" width="680" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="140" y="310" width="666" height="46" rx="8" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="470" y="340" text-anchor="middle">Everyday braking: 98% regenerative</text>
<text class="b" x="820" y="392" text-anchor="end">The rest is friction braking</text>
<text class="c" x="480" y="460" text-anchor="middle">Saying how it could be disproved is saying something</text>
</svg>
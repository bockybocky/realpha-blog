<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two panels compared: the width of the bottom layer sets the width of the layers above. On the left a narrow launch layer squeezes everything above it; on the right a wider launch layer lets them widen.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .w { font-size:16px; fill:var(--ink); font-weight:600; }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">The narrowest layer sets how wide every layer above it can be</text>

  <rect x="60" y="96" width="380" height="352" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="520" y="96" width="380" height="352" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="80" y="132">Today</text>
  <text class="g" x="540" y="132">After launch widens</text>

  <rect x="100" y="164" width="300" height="60" rx="8" fill="none" stroke="var(--grey)" stroke-dasharray="6 6"/>
  <rect x="100" y="242" width="300" height="60" rx="8" fill="none" stroke="var(--grey)" stroke-dasharray="6 6"/>
  <rect x="190" y="164" width="120" height="60" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="190" y="242" width="120" height="60" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="190" y="330" width="120" height="72" rx="8" fill="var(--accent)"/>
  <text class="w" x="250" y="200" text-anchor="middle">On-orbit services</text>
  <text class="w" x="250" y="278" text-anchor="middle">Orbital hardware</text>
  <text x="250" y="373" text-anchor="middle" font-size="16px" fill="var(--page)" font-weight="700">Launch</text>
  <text class="b" x="250" y="428" text-anchor="middle">Flights leaving the pad each year</text>

  <rect x="560" y="164" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="560" y="242" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="560" y="330" width="300" height="72" rx="8" fill="var(--accent)"/>
  <text class="w" x="710" y="200" text-anchor="middle">On-orbit services</text>
  <text class="w" x="710" y="278" text-anchor="middle">Orbital hardware</text>
  <text x="710" y="373" text-anchor="middle" font-size="16px" fill="var(--page)" font-weight="700">Launch</text>
  <text class="b" x="710" y="428" text-anchor="middle">Same layer, more throughput</text>

  <text class="c" x="60" y="510">Demand above only grows to the width the layer below lets through</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊對方手上的盒子是空的虛線框，右邊同一個盒子裡放著一塊日期和一塊地點">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">改寫之後，對面手上多了什麼</text>
<rect x="48" y="100" width="408" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="78" y="142" fill="var(--warn)">我會盡快</text>
<rect x="110" y="188" width="284" height="166" rx="10" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="b" x="78" y="394">對方手上　空的</text>
<rect x="504" y="100" width="408" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="534" y="142" fill="var(--accent)">日期　加　地方</text>
<rect x="566" y="188" width="284" height="166" rx="10" fill="none" stroke="var(--accent)" stroke-width="3"/>
<rect x="596" y="214" width="106" height="56" rx="6" fill="var(--accent)"/>
<rect x="716" y="214" width="106" height="56" rx="6" fill="var(--accent)"/>
<rect x="596" y="288" width="226" height="40" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="534" y="394">對方手上　有東西可以對</text>
<text class="c" x="60" y="486">不用問你就能自己確認，那才算承諾</text>
</svg>
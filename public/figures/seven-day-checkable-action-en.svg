<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The timeline splits into two paths from the day it is written, with the concrete action above reaching a tick box on day seven and the vague wording below disappearing midway.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--dim); }
.n { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" class="t">Seven days on, can you check it off</text>
<circle cx="180" cy="300" r="8" fill="var(--ink)"/>
<text x="180" y="340" class="g" text-anchor="middle">Day written</text>
<path d="M180 300 C 320 300, 360 220, 520 220 H760" stroke="var(--accent)" stroke-width="3.5" fill="none"/>
<path d="M180 300 C 320 300, 360 400, 520 400 H640" stroke="var(--grey)" stroke-width="3.5" stroke-dasharray="10 8" fill="none"/>
<rect x="420" y="178" width="220" height="44" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="530" y="208" class="g" text-anchor="middle" fill="var(--ink)">Throw out that pack of cigarettes</text>
<rect x="420" y="378" width="220" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="530" y="408" class="g" text-anchor="middle" fill="var(--grey)">Become more proactive</text>
<text x="660" y="446" class="n" fill="var(--grey)">No tick possible</text>
<path d="M800 150 V420" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="800" y="136" class="g" text-anchor="middle">Day 7</text>
<rect x="762" y="196" width="48" height="48" rx="6" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<path d="M773 220 l10 11 l17 -22" stroke="var(--accent)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="490" class="c">A sentence with no concrete action in it never carried information</text>
</svg>
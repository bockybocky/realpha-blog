<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="危機模式效力隨時間下滑的曲線，早收的點在高處、晚收的點已經接近底部">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">危機模式從啟動那天就開始衰退</text>
  <text class="t" x="60" y="86" font-size="16" fill="var(--dim)">縱軸：這套做法還剩多少效力　橫軸：時間</text>

  <line x1="120" y1="130" x2="120" y2="400" stroke="var(--line)" stroke-width="2"/>
  <line x1="120" y1="400" x2="890" y2="400" stroke="var(--line)" stroke-width="2"/>

  <path d="M120 150 C 300 170, 420 300, 560 350 S 780 392, 890 396" fill="none" stroke="var(--accent)" stroke-width="5"/>

  <circle cx="330" cy="222" r="12" fill="var(--accent)"/>
  <line x1="330" y1="210" x2="330" y2="168" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="330" y="158" font-size="20" text-anchor="middle" fill="var(--accent)">稍微提前收</text>

  <circle cx="740" cy="386" r="12" fill="var(--warn)"/>
  <line x1="740" y1="374" x2="740" y2="320" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="740" y="310" font-size="20" text-anchor="middle" fill="var(--warn)">稍微延後收</text>
  <text class="t" x="740" y="336" font-size="16" text-anchor="middle" fill="var(--dim)">更常見，也更貴</text>

  <text class="t" x="120" y="432" font-size="16" fill="var(--dim)">啟動</text>
  <text class="t" x="890" y="432" font-size="16" text-anchor="end" fill="var(--dim)">凌晨三點的會照打十年</text>

  <text class="t" x="60" y="496" font-size="22" font-weight="700" fill="var(--ink)">什麼時候結束，要跟什麼時候開始一樣先寫下來</text>
</svg>
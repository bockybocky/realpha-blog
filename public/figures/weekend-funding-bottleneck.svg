<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="週末兩格關門的時間帶，下方小方塊過得去、巨大方塊壓住關門格">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t h" x="60" y="66">瓶頸在銀行，不在交易所</text>

  <rect x="80" y="110" width="110" height="52" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="195" y="110" width="110" height="52" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="310" y="110" width="110" height="52" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="425" y="110" width="110" height="52" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="540" y="110" width="110" height="52" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="655" y="110" width="110" height="52" rx="5" fill="var(--warn)"/>
  <rect x="770" y="110" width="110" height="52" rx="5" fill="var(--warn)"/>
  <text class="t b" x="110" y="144">週一</text>
  <text class="t b" x="680" y="144" fill="var(--page)">關門</text>
  <text class="t b" x="795" y="144" fill="var(--page)">關門</text>
  <text class="t b" x="655" y="190">銀行週末不撥款</text>

  <rect x="80" y="280" width="90" height="70" rx="6" fill="var(--accent)"/>
  <text class="t g" x="80" y="378">加密</text>
  <text class="t b" x="80" y="406">預撥得起</text>

  <rect x="340" y="246" width="520" height="260" rx="8" fill="var(--grey)"/>
  <text class="t g" x="364" y="300" fill="var(--page)">股票現貨</text>
  <text class="t b" x="364" y="332" fill="var(--page)">76 兆美元</text>
  <text class="t c" x="364" y="430" fill="var(--page)">沒人週五先撥得出來</text>
</svg>
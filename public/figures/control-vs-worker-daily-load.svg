<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-label="上排一條整天低平的帶子，下排平時貼地、偶爾衝到頂的兩座方塊">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="530" fill="var(--page)"/>
<text x="480" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">兩台機器的一天（示意）</text>
<text x="160" y="175" text-anchor="end" font-size="20" font-weight="700" fill="var(--ink)">指揮</text>
<line x1="180" y1="230" x2="900" y2="230" stroke="var(--line)" stroke-width="2"/>
<polygon points="180,200 300,196 420,202 540,194 660,200 780,197 900,200 900,230 180,230" fill="var(--accent)" opacity="0.85"/>
<text x="540" y="150" text-anchor="middle" font-size="16" fill="var(--dim)">整天醒著・負擔低</text>
<text x="160" y="345" text-anchor="end" font-size="20" font-weight="700" fill="var(--ink)">出力</text>
<line x1="180" y1="272" x2="900" y2="272" stroke="var(--line)" stroke-width="1" stroke-dasharray="5 5"/>
<text x="905" y="277" font-size="15" fill="var(--dim)">滿</text>
<line x1="180" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
<path d="M180,398 L480,398 L480,272 L570,272 L570,398 L780,398 L780,272 L870,272 L870,398 L900,398 L900,400 L180,400 Z" fill="var(--accent)" opacity="0.85"/>
<text x="330" y="385" text-anchor="middle" font-size="16" fill="var(--dim)">閒著</text>
<text x="675" y="385" text-anchor="middle" font-size="16" fill="var(--dim)">閒著</text>
<text x="525" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="var(--accent)">重活</text>
<text x="825" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="var(--accent)">重活</text>
<g font-size="15" fill="var(--dim)" text-anchor="middle">
<text x="180" y="430">0 點</text><text x="360" y="430">6</text><text x="540" y="430">12</text><text x="720" y="430">18</text><text x="900" y="430">24</text>
</g>
<text x="480" y="492" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">一台一直開，一台忙時才滿</text>
</svg>
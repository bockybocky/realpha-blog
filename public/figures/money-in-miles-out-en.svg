<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The money blocks are huge, while the mileage bars they bought are tiny or zero.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="48" y="62" font-size="27" fill="var(--ink)" font-weight="700">Money is visible, the miles are not</text>
<text x="48" y="100" font-size="16" fill="var(--dim)">Left = money spent   Right = new rail miles</text>

<text x="48" y="150" font-size="20" fill="var(--ink)" font-weight="700">Second Avenue Subway</text>
<text x="48" y="176" font-size="15" fill="var(--dim)">50 years</text>
<rect x="210" y="128" width="120" height="58" rx="6" fill="var(--grey)"/>
<text x="210" y="208" font-size="16" fill="var(--dim)">Over $4 billion</text>
<line x1="660" y1="157" x2="700" y2="157" stroke="var(--accent)" stroke-width="10"/>
<text x="660" y="208" font-size="16" fill="var(--dim)">1.5 miles</text>

<line x1="48" y1="250" x2="912" y2="250" stroke="var(--line)" stroke-width="1"/>

<text x="48" y="310" font-size="20" fill="var(--ink)" font-weight="700">California</text>
<text x="48" y="336" font-size="15" fill="var(--dim)">10 years</text>
<rect x="210" y="288" width="450" height="58" rx="6" fill="var(--grey)"/>
<text x="210" y="368" font-size="16" fill="var(--dim)">About $15 billion</text>
<circle cx="680" cy="317" r="11" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text x="660" y="368" font-size="16" fill="var(--dim)">0 miles</text>

<rect x="48" y="420" width="864" height="78" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="76" y="468" font-size="22" fill="var(--ink)">In the 1920s, same guardrails, and he built it</text>
</svg>
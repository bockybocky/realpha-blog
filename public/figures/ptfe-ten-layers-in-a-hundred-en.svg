<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="In a tall stack of material layers, only a small highlighted section represents the roughly ten layers made from the new material.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="40" y="58" font-size="27" fill="var(--ink)">New Material's Share of Board Thickness</text>

<rect x="300" y="110" width="200" height="390" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<g stroke="var(--line)" stroke-width="2">
<line x1="300" y1="128" x2="500" y2="128"/><line x1="300" y1="146" x2="500" y2="146"/>
<line x1="300" y1="164" x2="500" y2="164"/><line x1="300" y1="182" x2="500" y2="182"/>
<line x1="300" y1="200" x2="500" y2="200"/><line x1="300" y1="218" x2="500" y2="218"/>
<line x1="300" y1="236" x2="500" y2="236"/><line x1="300" y1="254" x2="500" y2="254"/>
<line x1="300" y1="272" x2="500" y2="272"/><line x1="300" y1="290" x2="500" y2="290"/>
<line x1="300" y1="344" x2="500" y2="344"/><line x1="300" y1="362" x2="500" y2="362"/>
<line x1="300" y1="380" x2="500" y2="380"/><line x1="300" y1="398" x2="500" y2="398"/>
<line x1="300" y1="416" x2="500" y2="416"/><line x1="300" y1="434" x2="500" y2="434"/>
<line x1="300" y1="452" x2="500" y2="452"/><line x1="300" y1="470" x2="500" y2="470"/>
<line x1="300" y1="488" x2="500" y2="488"/>
</g>
<rect x="300" y="300" width="200" height="36" fill="var(--accent)"/>

<line x1="266" y1="110" x2="266" y2="500" stroke="var(--dim)" stroke-width="2"/>
<text x="248" y="312" font-size="20" fill="var(--dim)" text-anchor="end">100+ Layers</text>
<line x1="534" y1="300" x2="534" y2="336" stroke="var(--accent)" stroke-width="3"/>
<text x="554" y="312" font-size="20" fill="var(--accent)">About 10 New-Material Layers</text>
<text x="554" y="348" font-size="16" fill="var(--dim)">Same Drill, Slower Process</text>

<text x="480" y="536" font-size="22" fill="var(--ink)" text-anchor="middle">Approval Does Not Guarantee Volume</text>
</svg>
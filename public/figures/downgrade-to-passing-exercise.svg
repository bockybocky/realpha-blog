<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三根等高的時間柱中兩根被截短到及格線，省下的高度移到第三根上">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">只做到及格，會不會有人察覺</text>
<line x1="100" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="3"/>
<line x1="100" y1="360" x2="880" y2="360" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="b" x="820" y="348">及格線</text>
<rect x="150" y="360" width="130" height="70" fill="var(--grey)"/>
<rect x="150" y="170" width="130" height="190" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="g" x="150" y="470">第一件</text>
<text class="b" x="150" y="500">不會</text>
<rect x="340" y="360" width="130" height="70" fill="var(--grey)"/>
<rect x="340" y="170" width="130" height="190" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="g" x="340" y="470">第二件</text>
<text class="b" x="340" y="500">不會</text>
<path d="M 300 240 C 420 190 520 180 640 190" fill="none" stroke="var(--dim)" stroke-width="4"/>
<polygon points="634,180 656,192 632,202" fill="var(--dim)"/>
<rect x="660" y="150" width="150" height="280" fill="var(--accent)"/>
<text class="g" x="660" y="470">第三件</text>
<text class="b" x="660" y="500">會</text>
<text class="c" x="60" y="534">省下來的時間，只往一個地方放</text>
</svg>
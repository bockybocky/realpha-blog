<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="三級由矮到高的階梯，要求逐段堆高，底部一條貫穿全程的安全線，第二與第三級之間有一道單向門">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="72">每一階要的東西不一樣</text>
<rect x="80" y="310" width="250" height="120" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="355" y="240" width="250" height="190" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="640" y="160" width="250" height="270" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="205" y="292" text-anchor="middle">首次人體</text>
<text class="g" x="480" y="222" text-anchor="middle">關鍵性試驗</text>
<text class="g" x="765" y="142" text-anchor="middle">量產上市</text>
<text class="b" x="205" y="352" text-anchor="middle" fill="var(--accent)">差異化功能</text>
<text class="b" x="205" y="384" text-anchor="middle">日後補得上去</text>
<text class="b" x="480" y="282" text-anchor="middle">差異化功能</text>
<text class="b" x="480" y="314" text-anchor="middle" fill="var(--accent)">整合進生態系</text>
<text class="b" x="480" y="346" text-anchor="middle" fill="var(--accent)">臨床證據規格</text>
<text class="b" x="480" y="378" text-anchor="middle">日後補得上去</text>
<text class="b" x="765" y="202" text-anchor="middle">差異化功能</text>
<text class="b" x="765" y="234" text-anchor="middle">整合進生態系</text>
<text class="b" x="765" y="266" text-anchor="middle" fill="var(--accent)">可製造性</text>
<text class="b" x="765" y="298" text-anchor="middle" fill="var(--accent)">可維修性</text>
<text class="b" x="765" y="330" text-anchor="middle" fill="var(--accent)">成本</text>
<line x1="622" y1="140" x2="622" y2="450" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="b" x="622" y="126" text-anchor="middle" fill="var(--warn)">單向門</text>
<line x1="60" y1="470" x2="900" y2="470" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="60" y="500" fill="var(--accent)">安全：任何一階都不打折</text>
<text class="c" x="60" y="556">前面可以簡，不能走進回不來的門</text>
</svg>
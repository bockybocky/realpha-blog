<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A dashed empty space in the center filled by arrows arriving from three directions">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
<marker id="a10" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="var(--grey)"/></marker>
<marker id="a10b" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="var(--warn)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">If you don't fill it, others will</text>
<rect x="60" y="90" width="840" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="388" y="196" width="200" height="130" rx="12" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="g" x="424" y="252">What went</text>
<text class="g" x="424" y="284">unsaid</text>
<path d="M180 150 L370 210" fill="none" stroke="var(--grey)" stroke-width="4" marker-end="url(#a10)"/>
<path d="M170 262 L370 262" fill="none" stroke="var(--grey)" stroke-width="4" marker-end="url(#a10)"/>
<path d="M180 372 L370 312" fill="none" stroke="var(--grey)" stroke-width="4" marker-end="url(#a10)"/>
<text class="s" x="96" y="140">Last time's behavior</text>
<text class="s" x="96" y="252">Headlines</text>
<text class="s" x="96" y="392">The most fearful reading</text>
<path d="M600 262 L740 262" fill="none" stroke="var(--warn)" stroke-width="5" marker-end="url(#a10b)"/>
<text class="g" x="752" y="248" fill="var(--warn)">Authorship</text>
<text class="g" x="752" y="278" fill="var(--warn)">changes hands</text>
<text class="c" x="60" y="482">Silence is never neutral</text>
</svg>
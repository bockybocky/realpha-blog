<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一時間窗內，計畫是一條長條，實際是三段短條加三個回頭募資箭頭">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="80" y="60" font-size="27" font-weight="700">同一段時間，錢走完三趟</text>
<line x1="200" y1="120" x2="200" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="880" y1="120" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<text x="420" y="110" font-size="16" fill="var(--dim)">十八到二十四個月</text>
<rect x="200" y="160" width="680" height="54" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="400" y="195" font-size="19" fill="var(--dim)">計畫：一趟投完</text>
<text x="90" y="195" font-size="19">計畫</text>
<rect x="200" y="290" width="212" height="54" fill="var(--accent)"/>
<rect x="434" y="290" width="212" height="54" fill="var(--accent)"/>
<rect x="668" y="290" width="212" height="54" fill="var(--accent)"/>
<text x="90" y="325" font-size="19">實際</text>
<polygon points="306,278 294,250 318,250" fill="var(--warn)"/>
<polygon points="540,278 528,250 552,250" fill="var(--warn)"/>
<polygon points="774,278 762,250 786,250" fill="var(--warn)"/>
<text x="258" y="240" font-size="16" fill="var(--warn)">回頭募資</text>
<text x="492" y="240" font-size="16" fill="var(--warn)">回頭募資</text>
<text x="726" y="240" font-size="16" fill="var(--warn)">回頭募資</text>
<text x="80" y="420" font-size="22" font-weight="700" fill="var(--accent)">三倍速</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根預估柱有高度，實際柱幾乎貼在零線">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">美國需求年增：預估與實際</text>
  <text class="t" x="60" y="100" font-size="16" fill="var(--dim)">單位：日均萬桶</text>

  <line x1="120" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>

  <rect x="190" y="160" width="120" height="240" fill="var(--grey)"/>
  <text class="t" x="250" y="145" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">16</text>
  <text class="t" x="250" y="437" font-size="19" text-anchor="middle" fill="var(--dim)">能源總署預估</text>

  <rect x="420" y="235" width="120" height="165" fill="var(--grey)"/>
  <text class="t" x="480" y="220" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">11</text>
  <text class="t" x="480" y="437" font-size="19" text-anchor="middle" fill="var(--dim)">OPEC 預估</text>

  <rect x="650" y="392" width="120" height="8" fill="var(--warn)"/>
  <text class="t" x="710" y="375" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">約 0</text>
  <text class="t" x="710" y="437" font-size="19" font-weight="700" text-anchor="middle" fill="var(--warn)">實際</text>

  <text class="t" x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">需求的地板在哪，沒人量過</text>
</svg>
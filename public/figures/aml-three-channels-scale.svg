<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條橫條：銀行案最短並標為監管焦點，現金走私中等且範圍模糊，貿易洗錢最長">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .a { fill:var(--accent); }
</style>
<text class="t" x="480" y="48" text-anchor="middle">大宗的錢不走銀行</text>
<text class="b" x="920" y="90" text-anchor="end">單位：億美元</text>
<text class="g" x="260" y="142" text-anchor="end">銀行案</text>
<text class="b" x="260" y="166" text-anchor="end">丹斯克，幾年合計</text>
<rect x="280" y="120" width="83" height="44" fill="var(--accent)"/>
<text class="g a" x="375" y="150">1,300</text>
<text class="b a" x="448" y="150">← 監管焦點</text>
<text class="g" x="260" y="252" text-anchor="end">現金走私</text>
<text class="b" x="260" y="276" text-anchor="end">每年</text>
<rect x="280" y="230" width="128" height="44" fill="var(--grey)"/>
<rect x="408" y="230" width="192" height="44" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="g" x="614" y="260">數千億</text>
<text class="g" x="260" y="362" text-anchor="end">貿易洗錢</text>
<text class="b" x="260" y="386" text-anchor="end">每年</text>
<rect x="280" y="340" width="640" height="44" fill="var(--grey)"/>
<text class="g" x="904" y="370" text-anchor="end">約 10,000</text>
<line x1="280" y1="410" x2="920" y2="410" stroke="var(--line)" stroke-width="1.5"/>
<text class="b" x="280" y="434" text-anchor="middle">0</text>
<text class="b" x="600" y="434" text-anchor="middle">5,000</text>
<text class="b" x="920" y="434" text-anchor="end">10,000</text>
<text class="c" x="480" y="490" text-anchor="middle">監管盯的是最短的那條</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bars of different height, with the missing piece above the shorter one boxed by a dashed line">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">The gap is in the middle, not in the attitude</text>

<line x1="120" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="220" y="160" width="160" height="310" rx="6" fill="var(--accent)" opacity="0.22"/>
<rect x="220" y="160" width="160" height="310" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="300" y="140" font-size="20" fill="var(--accent)" text-anchor="middle">Demand　more than 2x</text>
<text x="300" y="504" font-size="16" fill="var(--dim)" text-anchor="middle">The market he describes</text>

<rect x="580" y="253" width="160" height="217" rx="6" fill="var(--accent)" opacity="0.22"/>
<rect x="580" y="253" width="160" height="217" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<rect x="580" y="160" width="160" height="93" rx="6" fill="var(--warn)" opacity="0.12"/>
<rect x="580" y="160" width="160" height="93" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="660" y="140" font-size="20" fill="var(--ink)" text-anchor="middle">Revenue　70% confidence</text>
<text x="660" y="504" font-size="16" fill="var(--dim)" text-anchor="middle">What he'll commit to</text>

<line x1="770" y1="206" x2="830" y2="206" stroke="var(--warn)" stroke-width="2"/>
<text x="840" y="200" font-size="16" fill="var(--warn)">This piece</text>
<text x="840" y="224" font-size="16" fill="var(--warn)">= capacity</text>

<text x="480" y="540" font-size="22" fill="var(--ink)" text-anchor="middle">The gap tells you what to watch next</text>
</svg>
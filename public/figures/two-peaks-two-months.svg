<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩座分開的山峰頂到同一條水平虛線，一道弧線從左峰跨到右峰，標示四十幾天">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">兩個月，兩座不相鄰的山頂</text>
<line x1="100" y1="200" x2="880" y2="200" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text x="100" y="186" font-size="15" fill="var(--dim)">千禧年難題前沿</text>
<polygon points="100,460 260,200 420,460" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="560,460 720,200 880,460" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="260" cy="200" r="9" fill="var(--accent)"/>
<circle cx="720" cy="200" r="9" fill="var(--accent)"/>
<path d="M260,200 C380,104 600,104 720,200" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="9 7"/>
<polygon points="720,200 700,174 724,178" fill="var(--accent)"/>
<text x="490" y="94" font-size="22" fill="var(--accent)" text-anchor="middle">四十幾天</text>
<line x1="80" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>
<text x="260" y="494" font-size="20" fill="var(--ink)" text-anchor="middle">流體力學</text>
<text x="260" y="520" font-size="16" fill="var(--dim)" text-anchor="middle">九月</text>
<text x="720" y="494" font-size="20" fill="var(--ink)" text-anchor="middle">解析數論</text>
<text x="720" y="520" font-size="16" fill="var(--dim)" text-anchor="middle">十一月</text>
<line x1="430" y1="430" x2="550" y2="430" stroke="var(--grey)" stroke-width="2"/>
<polygon points="430,430 446,424 446,436" fill="var(--grey)"/>
<polygon points="550,430 534,424 534,436" fill="var(--grey)"/>
<text x="490" y="416" font-size="15" fill="var(--dim)" text-anchor="middle">不相鄰</text>
<text x="480" y="560" font-size="22" fill="var(--ink)" text-anchor="middle">跨過去的時間，就是那塊證據</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A curve rises high from near the zero line and then falls back to it, like a hill that came and went.">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px}
    .b{font-size:15px;fill:var(--dim)}
    .c{font-size:22px}
  </style>
  <text class="t" x="40" y="58">A million contracts came and went</text>
  <line x1="150" y1="400" x2="860" y2="400" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="150" y="422">Zero</text>
  <path d="M170 395 C 300 390, 340 182, 450 174 C 560 166, 620 380, 790 393" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="450" cy="174" r="6" fill="var(--accent)"/>
  <text class="g" x="450" y="152" text-anchor="middle">1 million contracts</text>
  <text class="b" x="178" y="372">Near zero</text>
  <text class="b" x="782" y="372" text-anchor="end">Almost back to zero</text>
  <text class="b" x="290" y="246">Black Sea risk + heatwaves in several regions</text>
  <text class="b" x="170" y="448">Before July</text>
  <text class="b" x="450" y="448" text-anchor="middle">July and August</text>
  <text class="b" x="790" y="448" text-anchor="end">Now</text>
  <text class="c" x="40" y="492">Six soybean and grain contracts, a full round trip</text>
</svg>
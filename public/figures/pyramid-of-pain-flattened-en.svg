<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The three-tier pyramid is flattened into a single bar, so the people at the base now stand at the height that used to belong only to the top.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">The pyramid of pain, flattened</text>
<text x="60" y="118" font-size="19" fill="var(--dim)">Before</text>
<text x="560" y="118" font-size="19" fill="var(--dim)">Now</text>
<line x1="60" y1="452" x2="900" y2="452" stroke="var(--line)" stroke-width="2"/>
<polygon points="240,160 330,300 150,300" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<polygon points="330,300 390,376 90,376" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="390,376 450,452 30,452" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="240" y="196" font-size="16" fill="var(--ink)" text-anchor="middle">Nation-state</text>
<text x="240" y="346" font-size="16" fill="var(--dim)" text-anchor="middle">Crime rings</text>
<text x="240" y="422" font-size="16" fill="var(--dim)" text-anchor="middle">Hacktivist defacers</text>
<text x="470" y="200" font-size="15" fill="var(--dim)">Strongest</text>
<text x="470" y="430" font-size="15" fill="var(--dim)">Most numerous</text>
<path d="M486 300 L 538 300" stroke="var(--warn)" stroke-width="5"/>
<polygon points="538,290 560,300 538,310" fill="var(--warn)"/>
<rect x="580" y="160" width="320" height="292" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<line x1="580" y1="160" x2="900" y2="160" stroke="var(--warn)" stroke-width="6"/>
<text x="740" y="200" font-size="20" fill="var(--ink)" text-anchor="middle">Agent-grade</text>
<text x="740" y="232" font-size="16" fill="var(--dim)" text-anchor="middle">Same headcount</text>
<text x="740" y="258" font-size="16" fill="var(--dim)" text-anchor="middle">Capability levelled</text>
<text x="740" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">Same crude attacker</text>
<text x="60" y="516" font-size="22" fill="var(--ink)">The height is unchanged; anyone can reach it</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上下兩條等長時間條，上面整條一色，下面被切成兩段，切點標著轉折">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">同一批數字，兩種切法</text>

<text x="60" y="132" font-size="20" font-weight="700" fill="var(--ink)">切法一</text>
<rect x="60" y="152" width="840" height="52" rx="10" fill="var(--warn)" opacity="0.55"/>
<text x="480" y="187" font-size="19" fill="var(--ink)" text-anchor="middle">六十五個月連續高於目標</text>
<text x="60" y="238" font-size="16" fill="var(--dim)">別跟我講藉口</text>

<text x="60" y="322" font-size="20" font-weight="700" fill="var(--ink)">切法二</text>
<rect x="60" y="342" width="600" height="52" rx="10" fill="var(--accent)" opacity="0.6"/>
<rect x="672" y="342" width="228" height="52" rx="10" fill="var(--warn)" opacity="0.55"/>
<text x="360" y="377" font-size="19" fill="var(--ink)" text-anchor="middle">四十七個月：升息、通膨降下來</text>
<text x="786" y="377" font-size="19" fill="var(--ink)" text-anchor="middle">十八個月</text>
<line x1="666" y1="316" x2="666" y2="410" stroke="var(--ink)" stroke-width="3"/>
<text x="666" y="306" font-size="16" fill="var(--ink)" text-anchor="middle">飛機要落地了</text>
<text x="786" y="428" font-size="16" fill="var(--warn)" text-anchor="middle">AI、關稅、油價</text>

<line x1="60" y1="268" x2="900" y2="268" stroke="var(--line)" stroke-dasharray="6 6"/>
<text x="480" y="500" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">同一段歷史，責任歸屬天差地遠</text>
</svg>
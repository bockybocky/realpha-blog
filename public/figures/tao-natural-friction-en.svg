<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Human writing thickens at the hard step; AI writing is uniformly thick, so the reader cannot tell where to concentrate">
  <style>
    svg {
      --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922;
      }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect width="960" height="470" fill="var(--page)"/>
  <text class="t" x="480" y="38" text-anchor="middle" font-size="21" fill="var(--ink)">Same material, four sections: can you see where the author worked hardest?</text>

  <text class="t" x="70" y="86" font-size="20" fill="var(--accent)">Human</text>
  <rect x="180" y="70" width="150" height="40" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="345" y="70" width="150" height="40" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="510" y="62" width="150" height="130" rx="6" fill="var(--accent)" opacity="0.16" stroke="var(--accent)" stroke-width="3"/>
  <rect x="675" y="70" width="150" height="40" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="585" y="136" text-anchor="middle" font-size="20" fill="var(--accent)">The hard step</text>
  <text class="t" x="585" y="164" text-anchor="middle" font-size="18" fill="var(--dim)">slows down, writes with care</text>
  <text class="t" x="480" y="222" text-anchor="middle" font-size="19" fill="var(--dim)">The change in thickness is the signal: slow down here</text>

  <line x1="60" y1="252" x2="900" y2="252" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="70" y="306" font-size="20" fill="var(--warn)">AI</text>
  <rect x="180" y="278" width="150" height="86" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="345" y="278" width="150" height="86" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="510" y="278" width="150" height="86" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="675" y="278" width="150" height="86" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="585" y="328" text-anchor="middle" font-size="20" fill="var(--warn)">The hard step</text>
  <text class="t" x="585" y="354" text-anchor="middle" font-size="18" fill="var(--dim)">same thickness as the rest</text>
  <text class="t" x="480" y="398" text-anchor="middle" font-size="19" fill="var(--dim)">Every section filled, telling you everything is important</text>

  <text class="t" x="480" y="444" text-anchor="middle" font-size="20" fill="var(--ink)">What is hard for an AI and what is hard for you are barely related</text>
</svg>

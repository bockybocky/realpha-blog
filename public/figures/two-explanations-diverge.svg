<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一條主幹在料變多之後分岔，一支順利通過，一支撞牆停住">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>

<text x="70" y="62" font-size="27" font-weight="700" fill="var(--ink)">兩種說法，預測的未來不同</text>

<line x1="90" y1="290" x2="330" y2="290" stroke="var(--ink)" stroke-width="4"/>
<circle cx="90" cy="290" r="8" fill="var(--ink)"/>
<text x="90" y="332" font-size="19" fill="var(--ink)">今天</text>
<text x="200" y="268" font-size="16" fill="var(--dim)" text-anchor="middle">料變多、模型變強</text>

<path d="M330 290 L470 190 L790 190" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M330 290 L470 400 L700 400" fill="none" stroke="var(--warn)" stroke-width="4"/>
<circle cx="330" cy="290" r="9" fill="var(--grey)"/>

<text x="470" y="166" font-size="20" font-weight="700" fill="var(--accent)">幻覺說</text>
<text x="620" y="166" font-size="16" fill="var(--dim)">這關會過</text>
<polygon points="790,182 812,190 790,198" fill="var(--accent)"/>

<text x="470" y="440" font-size="20" font-weight="700" fill="var(--warn)">經驗說</text>
<rect x="706" y="330" width="26" height="140" rx="4" fill="var(--warn)"/>
<text x="748" y="406" font-size="16" fill="var(--warn)">還是卡住</text>

<text x="70" y="500" font-size="22" font-weight="700" fill="var(--ink)">John 選了下面那條</text>
</svg>
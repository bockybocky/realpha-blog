<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一排十六格猜測經過一道驗證帶，下排前十一格填實收下，第十二格標叉，其後虛線格丟棄">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); font-weight:700; }
    .bdy { font-size:16px; fill:var(--dim); }
    .cnc { font-size:22px; fill:var(--ink); font-weight:700; }
    .mk { font-size:20px; fill:var(--warn); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ttl" x="60" y="62">先猜十六個，一次驗完</text>

<text class="grp" x="68" y="150">草稿模型　一次猜十六個</text>
<rect x="68" y="176" width="44" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="120" y="176" width="44" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>

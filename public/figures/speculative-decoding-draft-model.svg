<rect x="640" y="356" width="44" height="56" rx="6" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text class="mk" x="662" y="392" text-anchor="middle">✗</text>
<rect x="692" y="356" width="44" height="56" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="744" y="356" width="44" height="56" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="796" y="356" width="44" height="56" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="848" y="356" width="44" height="56" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>

<text class="bdy" x="354" y="440" text-anchor="middle">猜對的，直接收下</text>
<text class="bdy" x="776" y="440" text-anchor="middle">從錯的那格起，全丟</text>

<text class="cnc" x="60" y="496">一輪驗證，吐出十一個字</text>
<text class="bdy" x="60" y="526">速度翻倍，品質不變</text>
</svg>
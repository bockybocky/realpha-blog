<rect x="328" y="176" width="44" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="380" y="176" width="44" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="432" y="176" width="44" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="484" y="176" width="44" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="536" y="176" width="44" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="588" y="176" width="44" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="640" y="176" width="44" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="692" y="176" width="44" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="744" y="176" width="44" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="796" y="176" width="44" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="848" y="176" width="44" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>

<rect x="68" y="272" width="824" height="48" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="grp" x="480" y="303" text-anchor="middle">大模型　一次平行驗證</text>

<rect x="68" y="356" width="44" height="56" rx="6" fill="var(--accent)"/>
<rect x="120" y="356" width="44" height="56" rx="6" fill="var(--accent)"/>
<rect x="172" y="356" width="44" height="56" rx="6" fill="var(--accent)"/>
<rect x="224" y="356" width="44" height="56" rx="6" fill="var(--accent)"/>

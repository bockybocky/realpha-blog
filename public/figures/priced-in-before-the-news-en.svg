<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A comparison of two price paths: one has finished falling before the news is released and rebounds slightly after it, while the other only begins falling at the release point.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700">Did the drop come before the news, or after</text>

  <rect x="60" y="100" width="840" height="170" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="300" width="840" height="170" rx="10" fill="var(--card)" stroke="var(--line)"/>

  <line x1="620" y1="100" x2="620" y2="470" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="620" y="505" font-size="19" fill="var(--dim)" text-anchor="middle">News released</text>

  <path d="M100 150 L200 170 L300 160 L400 196 L500 214 L620 232 L700 206 L800 198 L870 202"
        fill="none" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="620" cy="232" r="7" fill="var(--accent)"/>
  <text x="100" y="131" font-size="20" font-weight="700" fill="var(--accent)">The market's version</text>
  <text x="652" y="196" font-size="16" fill="var(--dim)">Rebound</text>

  <path d="M100 350 L200 346 L300 352 L400 348 L500 350 L620 348 L700 390 L800 428 L870 442"
        fill="none" stroke="var(--warn)" stroke-width="4"/>
  <circle cx="620" cy="348" r="7" fill="var(--warn)"/>
  <text x="100" y="331" font-size="20" font-weight="700" fill="var(--warn)">Straight line from the news</text>
  <text x="700" y="468" font-size="16" fill="var(--dim)">Expected drop</text>
</svg>
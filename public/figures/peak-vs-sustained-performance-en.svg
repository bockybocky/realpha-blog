<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two performance curves: the old one spikes and then drops to a low plateau, the new one spikes higher and stays flat, and the gap in the later stretch is the sustained performance.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="480" y="48" text-anchor="middle" class="h">Peak vs hold</text>
<line x1="100" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="100" x2="100" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="90" y="110" text-anchor="end" class="b">Perf</text>
<text x="900" y="468" text-anchor="end" class="b">T</text>
<line x1="190" y1="120" x2="190" y2="440" stroke="var(--grey)" stroke-dasharray="5 6"/>
<text x="190" y="468" text-anchor="middle" class="b">30 s</text>
<line x1="840" y1="120" x2="840" y2="440" stroke="var(--grey)" stroke-dasharray="5 6"/>
<text x="840" y="468" text-anchor="middle" class="b">30m</text>
<path d="M100 440 L135 185 L250 190 C310 196 330 330 410 332 L880 332" fill="none" stroke="var(--warn)" stroke-width="4"/>
<path d="M100 440 L135 150 L880 162" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text x="880" y="146" text-anchor="end" class="g" style="fill:var(--accent)">New: flat</text>
<text x="880" y="360" text-anchor="end" class="g" style="fill:var(--warn)">Old: drops</text>
<text x="150" y="136" class="b">Peak</text>
<line x1="760" y1="168" x2="760" y2="326" stroke="var(--ink)" stroke-width="2"/>
<path d="M752 178 L760 164 L768 178 Z M752 316 L760 330 L768 316 Z" fill="var(--ink)"/>
<text x="748" y="252" text-anchor="end" class="g" style="fill:var(--ink)">Steady</text>
<text x="480" y="520" text-anchor="middle" class="c">Judge the tail</text>
</svg>
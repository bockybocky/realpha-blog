<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two stacked timelines, the upper one unbroken and the lower one repeatedly breaking off and restarting.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="70">Put last time's words beside this time's</text>
<text class="g" x="60" y="175" fill="var(--accent)">Lines up</text>
<line x1="230" y1="215" x2="880" y2="215" stroke="var(--accent)" stroke-width="3"/>
<circle cx="260" cy="215" r="9" fill="var(--accent)"/>
<circle cx="460" cy="215" r="9" fill="var(--accent)"/>
<circle cx="660" cy="215" r="9" fill="var(--accent)"/>
<circle cx="860" cy="215" r="9" fill="var(--accent)"/>
<text class="b" x="260" y="255" text-anchor="middle">Promise</text>
<text class="b" x="460" y="255" text-anchor="middle">Delivered</text>
<text class="b" x="660" y="255" text-anchor="middle">Promise</text>
<text class="b" x="860" y="255" text-anchor="middle">Delivered</text>
<text class="g" x="60" y="355" fill="var(--warn)">Does not line up</text>
<line x1="230" y1="395" x2="380" y2="395" stroke="var(--warn)" stroke-width="3"/>
<line x1="380" y1="395" x2="540" y2="395" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 8"/>
<line x1="540" y1="395" x2="690" y2="395" stroke="var(--warn)" stroke-width="3"/>
<line x1="690" y1="395" x2="880" y2="395" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 8"/>
<circle cx="260" cy="395" r="9" fill="var(--warn)"/>
<circle cx="560" cy="395" r="9" fill="var(--warn)"/>
<circle cx="460" cy="395" r="9" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="860" cy="395" r="9" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="260" y="435" text-anchor="middle">Promise</text>
<text class="b" x="460" y="435" text-anchor="middle">Vanishes</text>
<text class="b" x="560" y="435" text-anchor="middle">New promise</text>
<text class="b" x="860" y="435" text-anchor="middle">Vanishes</text>
<text class="c" x="60" y="500">Due diligence a text file can do</text>
</svg>
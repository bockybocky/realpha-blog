<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊兩根柱子撐平的板，右邊缺一根柱子板子傾斜">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">撐著的是兩根柱子</text>

  <rect x="80" y="170" width="360" height="26" rx="4" fill="var(--accent)"/>
  <text class="t" x="260" y="155" font-size="19" font-weight="700" text-anchor="middle" fill="var(--dim)">景氣</text>
  <rect x="130" y="196" width="48" height="190" fill="var(--grey)"/>
  <rect x="342" y="196" width="48" height="190" fill="var(--grey)"/>
  <line x1="80" y1="386" x2="440" y2="386" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="154" y="425" font-size="16" text-anchor="middle" fill="var(--dim)">資本支出</text>
  <text class="t" x="366" y="425" font-size="16" text-anchor="middle" fill="var(--dim)">燃料補貼</text>
  <text class="t" x="260" y="465" font-size="19" font-weight="700" text-anchor="middle" fill="var(--dim)">現在</text>

  <g transform="rotate(9 700 190)">
    <rect x="520" y="170" width="360" height="26" rx="4" fill="var(--warn)"/>
  </g>
  <rect x="570" y="196" width="48" height="190" fill="var(--grey)"/>
  <rect x="782" y="196" width="48" height="190" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
  <line x1="520" y1="386" x2="880" y2="386" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="594" y="425" font-size="16" text-anchor="middle" fill="var(--dim)">資本支出</text>
  <text class="t" x="806" y="425" font-size="16" text-anchor="middle" fill="var(--warn)">撤掉</text>
  <text class="t" x="700" y="465" font-size="19" font-weight="700" text-anchor="middle" fill="var(--warn)">少一根</text>

  <text class="t" x="60" y="505" font-size="22" font-weight="700" fill="var(--ink)">衰退不是算出來的，是柱子鬆掉</text>
</svg>
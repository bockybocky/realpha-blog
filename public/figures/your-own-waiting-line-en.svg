<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A three-week line is almost entirely waiting, with only a short segment near the right end for the twenty minutes of real work">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl{font-size:27px;fill:var(--ink);font-weight:700}
    .grp{font-size:20px;fill:var(--ink);font-weight:600}
    .bd{font-size:16px;fill:var(--dim)}
    .ac{font-size:20px;fill:var(--accent);font-weight:600}
    .cc{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="ttl" x="60" y="62">Draw the thing you keep postponing as a line</text>

<line x1="100" y1="190" x2="880" y2="190" stroke="var(--dim)" stroke-width="1"/>
<line x1="100" y1="183" x2="100" y2="197" stroke="var(--dim)" stroke-width="1"/>
<line x1="880" y1="183" x2="880" y2="197" stroke="var(--dim)" stroke-width="1"/>
<text class="bd" x="490" y="176" text-anchor="middle">Three weeks</text>

<line x1="100" y1="250" x2="880" y2="250" stroke="var(--grey)" stroke-width="14" stroke-linecap="round"/>
<line x1="800" y1="250" x2="830" y2="250" stroke="var(--accent)" stroke-width="14"/>
<line x1="340" y1="241" x2="340" y2="259" stroke="var(--page)" stroke-width="5"/>
<line x1="600" y1="241" x2="600" y2="259" stroke="var(--page)" stroke-width="5"/>
<line x1="800" y1="241" x2="800" y2="259" stroke="var(--page)" stroke-width="5"/>

<text class="bd" x="220" y="300" text-anchor="middle">Waiting on a reply</text>
<text class="bd" x="470" y="300" text-anchor="middle">Waiting for them to be free</text>
<text class="bd" x="700" y="300" text-anchor="middle">Waiting to feel ready</text>

<line x1="815" y1="262" x2="815" y2="340" stroke="var(--accent)" stroke-width="2"/>
<text class="ac" x="815" y="364" text-anchor="middle">20 minutes of work</text>

<text class="cc" x="60" y="452">Shorten the longest blank, not the twenty minutes of work.</text>
</svg>
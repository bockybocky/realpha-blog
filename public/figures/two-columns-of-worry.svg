<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左欄已知的擔心全部劃掉，右欄沒人在講的留下來">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">把擔心的事分成兩欄</text>

<rect x="60" y="100" width="400" height="330" rx="8" fill="var(--card)"/>
<text class="t" x="80" y="142" font-size="20" font-weight="700" fill="var(--dim)">大家都在講</text>
<text class="t" x="80" y="200" font-size="19" fill="var(--grey)">利率 5.3%</text>
<line x1="78" y1="194" x2="230" y2="194" stroke="var(--grey)" stroke-width="2"/>
<text class="t" x="80" y="250" font-size="19" fill="var(--grey)">通膨水位</text>
<line x1="78" y1="244" x2="210" y2="244" stroke="var(--grey)" stroke-width="2"/>
<text class="t" x="80" y="300" font-size="19" fill="var(--grey)">聯準會偏緊</text>
<line x1="78" y1="294" x2="240" y2="294" stroke="var(--grey)" stroke-width="2"/>
<text class="t" x="80" y="390" font-size="19" fill="var(--dim)">已經在價格裡</text>

<rect x="500" y="100" width="400" height="330" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="520" y="142" font-size="20" font-weight="700" fill="var(--accent)">沒人在講</text>
<text class="t" x="520" y="200" font-size="19" fill="var(--ink)">一紙命令</text>
<text class="t" x="520" y="250" font-size="19" fill="var(--ink)">定價權來源</text>
<text class="t" x="520" y="300" font-size="19" fill="var(--ink)">你講得出後果的那件事</text>
<text class="t" x="520" y="390" font-size="19" font-weight="700" fill="var(--accent)">值得花一個下午</text>

<text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">只花時間在第二欄</text>
</svg>
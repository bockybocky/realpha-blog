<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="平台辨識真假的能力隨時間下滑到零，中間那段是有限的窗口">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="80" y="58" font-size="27" font-weight="700" fill="var(--ink)">偵測有到期日</text>

  <rect x="160" y="140" width="640" height="290" fill="var(--accent)" opacity="0.07"/>
  <line x1="160" y1="130" x2="160" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="160" y1="430" x2="890" y2="430" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="172" y="122" font-size="19" fill="var(--dim)">分得出真假的能力</text>
  <path d="M160,168 C 400,182 620,300 800,430" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
  <line x1="800" y1="430" x2="880" y2="430" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <circle cx="300" cy="196" r="7" fill="var(--warn)"/>
  <text class="t" x="318" y="202" font-size="16" fill="var(--warn)">已誤殺真人</text>

  <text class="t" x="160" y="458" font-size="16" text-anchor="middle" fill="var(--dim)">現在</text>
  <text class="t" x="480" y="458" font-size="16" text-anchor="middle" fill="var(--dim)">兩三年</text>
  <text class="t" x="800" y="458" font-size="16" text-anchor="middle" fill="var(--dim)">最長五年</text>
  <text class="t" x="480" y="392" font-size="19" text-anchor="middle" fill="var(--accent)">窗口</text>

  <text class="t" x="480" y="520" font-size="22" text-anchor="middle" fill="var(--ink)">還能自證真人的，只有這一段</text>
</svg>
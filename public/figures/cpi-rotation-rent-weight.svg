<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="權重橫條圖，房租的條最長且標成警示色，其他超預期項目的條都短">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="80" y="72" font-size="27" font-weight="700" fill="var(--ink)">輪動：項目換人，但權重沒換</text>

  <text class="t" x="80" y="132" font-size="19" font-weight="600" fill="var(--dim)">上一次</text>
  <text class="t" x="80" y="178" font-size="16" fill="var(--dim)">無線通訊</text>
  <rect x="300" y="158" width="150" height="26" rx="6" fill="var(--grey)"/>

  <line x1="80" y1="214" x2="880" y2="214" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="80" y="256" font-size="19" font-weight="600" fill="var(--ink)">這一次</text>

  <text class="t" x="80" y="302" font-size="16" font-weight="700" fill="var(--ink)">房租</text>
  <rect x="300" y="282" width="500" height="30" rx="6" fill="var(--warn)"/>
  <text class="t" x="816" y="303" font-size="16" fill="var(--warn)">權重最大・最黏</text>

  <text class="t" x="80" y="348" font-size="16" fill="var(--dim)">二手車</text>
  <rect x="300" y="330" width="150" height="26" rx="6" fill="var(--accent)"/>

  <text class="t" x="80" y="390" font-size="16" fill="var(--dim)">休閒娛樂</text>
  <rect x="300" y="372" width="122" height="26" rx="6" fill="var(--accent)"/>

  <text class="t" x="80" y="432" font-size="16" fill="var(--dim)">醫療保健</text>
  <rect x="300" y="414" width="108" height="26" rx="6" fill="var(--accent)"/>

  <text class="t" x="80" y="474" font-size="16" fill="var(--dim)">機票</text>
  <rect x="300" y="456" width="86" height="26" rx="6" fill="var(--accent)"/>

  <text class="t" x="480" y="528" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">冷得最慢的那一項，剛好是最大的那一塊</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars stand side by side: the 2021 stablecoin market is a small stub near the floor, while today's bar is about ten times taller.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .h { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .n { font-size:16px; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<defs>
  <marker id="yt-ms-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
  </marker>
</defs>
<text x="60" y="62" class="h">Stablecoins</text>
<line x1="160" y1="460" x2="800" y2="460" stroke="var(--line)" stroke-width="2"/>
<rect x="250" y="428" width="160" height="32" fill="var(--grey)" opacity="0.45"/>
<rect x="250" y="433" width="160" height="27" fill="var(--grey)"/>
<text x="330" y="412" class="n" text-anchor="middle">$25–30B</text>
<rect x="550" y="140" width="160" height="53" fill="var(--accent)" opacity="0.35"/>
<rect x="550" y="193" width="160" height="267" fill="var(--accent)"/>
<text x="630" y="124" class="n" text-anchor="middle">$250–300B</text>
<path d="M 350 400 Q 420 230 530 175" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#yt-ms-arr)"/>
<text x="400" y="250" class="c" text-anchor="end" style="fill:var(--accent)">~×10</text>
<text x="330" y="494" class="g" text-anchor="middle">Nov 2021</text>
<text x="630" y="494" class="g" text-anchor="middle">Now</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A rising curve crosses a vertical line; left of it failures are still fixable, right of it they are out of reach.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="80" y="78">Where trial and error ends</text>

  <rect x="80" y="110" width="480" height="300" rx="10" fill="var(--card)"/>
  <rect x="560" y="110" width="320" height="300" rx="10" fill="var(--card)"/>
  <line x1="560" y1="96" x2="560" y2="430" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>

  <path d="M90 395 C300 385 470 330 620 210 C700 148 760 130 870 122" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="560" cy="258" r="9" fill="var(--warn)"/>

  <text class="g" x="110" y="150">You survive the failure</text>
  <text class="b" x="110" y="180">Diagnose it, fix it, move on</text>
  <text class="b" x="110" y="208">Patches converge</text>

  <text class="g" x="590" y="150" fill="var(--warn)">No fix after</text>
  <text class="b" x="590" y="180">New failures still appear</text>
  <text class="b" x="590" y="208">Now it can switch you off first</text>

  <text class="b" x="80" y="452">Rightward = capability</text>
  <text class="b" x="560" y="452" text-anchor="middle">The line</text>

  <text class="c" x="80" y="500">Reactive safety isn't done badly</text>
  <text class="c" x="80" y="532">Past this line it structurally cannot work</text>
</svg>
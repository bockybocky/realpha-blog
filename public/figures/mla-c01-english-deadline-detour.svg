<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條時間線並列，上排英文版在九月二十八日中斷換新版，下排簡中版穿過該日期繼續延伸但末端淡出，考試日標在中斷點左側">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t h" x="60" y="72">同一張考試，兩條路的終點不同</text>

  <line x1="120" y1="150" x2="120" y2="430" stroke="var(--line)" stroke-width="2"/>
  <text class="t b" x="120" y="132" text-anchor="middle">四週前</text>

  <line x1="600" y1="150" x2="600" y2="430" stroke="var(--warn)" stroke-width="3"/>
  <text class="t g" x="600" y="132" text-anchor="middle" fill="var(--warn)">9/28</text>

  <line x1="470" y1="170" x2="470" y2="410" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="t g" x="470" y="462" text-anchor="middle" fill="var(--accent)">考試日</text>

  <rect x="120" y="196" width="480" height="52" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text class="t g" x="146" y="228">英文版</text>
  <text class="t b" x="240" y="228">到此停考</text>
  <path d="M600 222 L700 222" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 8"/>
  <text class="t b" x="712" y="228">換新版</text>

  <rect x="120" y="300" width="700" height="52" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t g" x="146" y="332" fill="var(--accent)">簡體中文版</text>
  <text class="t b" x="300" y="332">考試中可切英文對照</text>
  <path d="M820 326 L900 326" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 8" opacity="0.5"/>
  <text class="t b" x="700" y="380">停考日：未公布</text>

  <text class="t c" x="60" y="506">同一個日期，一條是牆，一條是門</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上方時間線一年兩個取樣點、只覆蓋點前一小段；下方時間線密密麻麻全年覆蓋">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="80" y="62" font-size="27" font-weight="700" fill="var(--ink)">多久校正一次</text>

  <text x="80" y="150" font-size="20" font-weight="700" fill="var(--dim)">一般員工的回饋</text>
  <line x1="80" y1="210" x2="880" y2="210" stroke="var(--line)" stroke-width="3"/>
  <rect x="425" y="200" width="55" height="20" fill="var(--grey)"/>
  <rect x="825" y="200" width="55" height="20" fill="var(--grey)"/>
  <circle cx="480" cy="210" r="13" fill="var(--grey)"/>
  <circle cx="880" cy="210" r="13" fill="var(--grey)"/>
  <text x="80" y="256" font-size="16" fill="var(--dim)">整年沒人說話</text>
  <text x="880" y="256" font-size="16" text-anchor="end" fill="var(--dim)">半年一次，裡面裝最近 30 天的印象</text>

  <text x="80" y="330" font-size="20" font-weight="700" fill="var(--accent)">奧運選手的回饋</text>
  <line x1="80" y1="390" x2="880" y2="390" stroke="var(--line)" stroke-width="3"/>
  <rect x="80" y="382" width="800" height="16" fill="var(--accent)"/>
  <g fill="var(--accent)">
    <circle cx="100" cy="390" r="7"/><circle cx="160" cy="390" r="7"/><circle cx="220" cy="390" r="7"/><circle cx="280" cy="390" r="7"/><circle cx="340" cy="390" r="7"/><circle cx="400" cy="390" r="7"/><circle cx="460" cy="390" r="7"/><circle cx="520" cy="390" r="7"/><circle cx="580" cy="390" r="7"/><circle cx="640" cy="390" r="7"/><circle cx="700" cy="390" r="7"/><circle cx="760" cy="390" r="7"/><circle cx="820" cy="390" r="7"/><circle cx="870" cy="390" r="7"/>
  </g>
  <text x="80" y="436" font-size="16" fill="var(--dim)">身邊天天有人在校正</text>

  <line x1="80" y1="462" x2="880" y2="462" stroke="var(--line)" stroke-width="2"/>
  <text x="80" y="500" font-size="22" font-weight="700" fill="var(--ink)">取樣太疏，看到的不是實況是印象</text>
</svg>
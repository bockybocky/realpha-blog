<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A block cut into two layers by a price line, the thin solid layer above already priced and the thick dashed layer below in no model">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:20px; font-weight:700; fill:var(--ink); }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="480" y="60" text-anchor="middle">One AI story, two stacked layers</text>

<rect x="230" y="110" width="500" height="110" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="262" y="158">Will I be replaced</text>
<text class="b" x="262" y="192">Compute, timelines, headcount saved</text>
<text class="b" x="698" y="158" text-anchor="end" fill="var(--grey)">Computable</text>

<line x1="190" y1="248" x2="770" y2="248" stroke="var(--accent)" stroke-width="4"/>
<text class="b" x="770" y="238" text-anchor="end" fill="var(--accent)">Price line</text>

<rect x="230" y="278" width="500" height="180" rx="10" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="9 7"/>
<text class="g" x="262" y="330">Why still do it yourself</text>
<text class="b" x="262" y="364">Meaning, relationships, process</text>
<text class="b" x="262" y="398">No sell-side model covers it</text>
<text class="b" x="698" y="330" text-anchor="end">Not computable</text>

<text class="c" x="480" y="510" text-anchor="middle">Above the line is priced; below it has no coordinates</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Three stacked columns of small cells, the left and right ones short and the column on the far right, labelled don't know, the tallest.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="440" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">List 10 names, count 3</text>
<text x="700" y="94" font-size="16" fill="var(--dim)">Illus.</text>
<line x1="120" y1="346" x2="840" y2="346" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="308" width="80" height="30" fill="var(--grey)"/>
<rect x="180" y="272" width="80" height="30" fill="var(--grey)"/>
<rect x="440" y="308" width="80" height="30" fill="var(--grey)"/>
<rect x="440" y="272" width="80" height="30" fill="var(--grey)"/>
<rect x="440" y="236" width="80" height="30" fill="var(--grey)"/>
<rect x="700" y="308" width="80" height="30" fill="var(--accent)"/>
<rect x="700" y="272" width="80" height="30" fill="var(--accent)"/>
<rect x="700" y="236" width="80" height="30" fill="var(--accent)"/>
<rect x="700" y="200" width="80" height="30" fill="var(--accent)"/>
<rect x="700" y="164" width="80" height="30" fill="var(--accent)"/>
<text x="220" y="250" font-size="22" font-weight="700" fill="var(--dim)" text-anchor="middle">2</text>
<text x="480" y="214" font-size="22" font-weight="700" fill="var(--dim)" text-anchor="middle">3</text>
<text x="740" y="142" font-size="22" font-weight="700" fill="var(--accent)" text-anchor="middle">5</text>
<text x="220" y="382" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Y</text>
<text x="480" y="382" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">N</text>
<text x="740" y="382" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">?</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A three-layer stack, wide above and below with the processing layer pinched into a narrow waist.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>

  <text x="56" y="60" font-size="27" font-weight="700" fill="var(--ink)">The bottleneck is the middle layer</text>

  <polygon points="140,228 820,228 570,262 390,262" fill="var(--line)" opacity="0.55"/>
  <polygon points="390,358 570,358 820,392 140,392" fill="var(--line)" opacity="0.55"/>

  <rect x="140" y="132" width="680" height="96" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="480" y="176" font-size="20" text-anchor="middle" fill="var(--ink)">Raw material . fish</text>
  <text x="480" y="204" font-size="15" text-anchor="middle" fill="var(--dim)">Morocco . Cornwall . Iberia</text>

  <rect x="390" y="262" width="180" height="96" rx="14" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text x="480" y="302" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">Processing</text>
  <text x="480" y="330" font-size="15" text-anchor="middle" fill="var(--dim)">Canneries</text>

  <path d="M574 306 H600" stroke="var(--warn)" stroke-width="2"/>
  <text x="610" y="303" font-size="16" fill="var(--warn)">Closed fifteen years ago</text>
  <text x="610" y="327" font-size="15" fill="var(--dim)">Family run, not chasing scale</text>

  <rect x="140" y="392" width="680" height="96" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="480" y="436" font-size="20" text-anchor="middle" fill="var(--ink)">Brands . distribution</text>
  <text x="480" y="464" font-size="15" text-anchor="middle" fill="var(--dim)">Demand doubles</text>

  <text x="480" y="544" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">What is narrow is the cannery, not the fish</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Three bars rising year by year, each topped with a pale block showing real compute above the headline share.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--ink); }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="h" x="60" y="60">They take more than shown</text>
<line x1="110" y1="480" x2="900" y2="480" stroke="var(--line)" stroke-width="2"/>
<rect x="170" y="390" width="140" height="90" fill="var(--accent)"/>
<rect x="170" y="336" width="140" height="52" fill="var(--accent)" opacity="0.28"/>
<rect x="410" y="345" width="140" height="135" fill="var(--accent)"/>
<rect x="410" y="264" width="140" height="79" fill="var(--accent)" opacity="0.28"/>
<rect x="650" y="255" width="140" height="225" fill="var(--accent)"/>
<rect x="650" y="120" width="140" height="133" fill="var(--accent)" opacity="0.28"/>
<text class="g" x="240" y="502" text-anchor="middle">2026</text>
<text class="b" x="240" y="526" text-anchor="middle">~30%</text>
<text class="g" x="480" y="502" text-anchor="middle">2027</text>
<text class="b" x="480" y="526" text-anchor="middle">40–50%</text>
<text class="g" x="720" y="502" text-anchor="middle">2028</text>
<text class="b" x="720" y="526" text-anchor="middle">70–80%</text>
<rect x="828" y="386" width="18" height="18" fill="var(--accent)"/>
<text class="b" x="854" y="401">On paper</text>
<rect x="828" y="416" width="18" height="18" fill="var(--accent)" opacity="0.28"/>
<text class="b" x="854" y="431">3–5x perf</text>
<text class="c" x="60" y="572">The percent understates it</text>
</svg>
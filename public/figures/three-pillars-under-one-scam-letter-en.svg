<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The scam email rests on three pillars—the sending account, domain, and messaging account—and each pillar has a point where reporting can cut it down.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">It stands on three pillars</text>

  <rect x="180" y="120" width="620" height="60" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="490" y="158" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">A deliverable scam email</text>

  <rect x="240" y="180" width="70" height="230" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="455" y="180" width="70" height="230" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="670" y="180" width="70" height="230" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>

  <line x1="220" y1="300" x2="330" y2="300" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 6"/>
  <line x1="435" y1="300" x2="545" y2="300" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 6"/>
  <line x1="650" y1="300" x2="760" y2="300" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 6"/>
  <text class="t" x="790" y="294" font-size="16" fill="var(--warn)">Report</text>

  <line x1="180" y1="410" x2="800" y2="410" stroke="var(--grey)" stroke-width="3"/>
  <text class="t" x="275" y="442" font-size="19" fill="var(--ink)" text-anchor="middle">Sender account</text>
  <text class="t" x="490" y="442" font-size="19" fill="var(--ink)" text-anchor="middle">Domain</text>
  <text class="t" x="705" y="442" font-size="19" fill="var(--ink)" text-anchor="middle">Messaging account</text>
  <text class="t" x="275" y="466" font-size="15" fill="var(--dim)" text-anchor="middle">Amazon</text>
  <text class="t" x="490" y="466" font-size="15" fill="var(--dim)" text-anchor="middle">Registrar</text>
  <text class="t" x="705" y="466" font-size="15" fill="var(--dim)" text-anchor="middle">LINE</text>

  <text class="t" x="60" y="516" font-size="22" font-weight="700" fill="var(--ink)">Don't catch them—dismantle their tools</text>
</svg>
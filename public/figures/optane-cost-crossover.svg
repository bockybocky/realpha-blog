<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條幾乎水平的線與一條持續下滑的線，中間間隙隨時間愈拉愈寬">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="56" y="56" font-size="27" font-weight="700" fill="var(--ink)">價格沒動，底下那條一直掉</text>
<text x="56" y="120" font-size="15" fill="var(--dim)">每位元成本</text>
<text x="56" y="160" font-size="15" fill="var(--dim)">貴</text>
<text x="56" y="404" font-size="15" fill="var(--dim)">便宜</text>
<polygon points="120,220 880,244 880,404 640,372 400,330 120,290" fill="var(--grey)" opacity="0.18"/>
<polyline points="120,220 400,228 640,236 880,244" fill="none" stroke="var(--accent)" stroke-width="3"/>
<polyline points="120,290 400,330 640,372 880,404" fill="none" stroke="var(--dim)" stroke-width="3"/>
<text x="140" y="206" font-size="19" font-weight="700" fill="var(--accent)">Optane 價格幾乎不動</text>
<text x="560" y="398" font-size="19" font-weight="700" fill="var(--dim)">3D NAND 一路變便宜</text>
<line x1="868" y1="232" x2="892" y2="256" stroke="var(--warn)" stroke-width="4"/>
<line x1="892" y1="232" x2="868" y2="256" stroke="var(--warn)" stroke-width="4"/>
<text x="856" y="200" font-size="16" fill="var(--warn)" text-anchor="end">收掉</text>
<line x1="120" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="458" font-size="15" fill="var(--dim)">2015</text>
<text x="500" y="458" font-size="15" fill="var(--dim)" text-anchor="middle">中間幾年</text>
<text x="880" y="458" font-size="15" fill="var(--dim)" text-anchor="end">結束</text>
<text x="56" y="518" font-size="22" font-weight="700" fill="var(--ink)">不是技術倒，是價位失去理由</text>
</svg>
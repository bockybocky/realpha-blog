<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="四象限，右上角同時擁有高薪與高資本所得的那一格被強調">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>

  <text x="480" y="56" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">同財：兩種富有同時發生</text>

  <rect x="500" y="100" width="250" height="200" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <rect x="250" y="100" width="250" height="200" fill="none" stroke="var(--line)" stroke-width="2"/>
  <rect x="250" y="300" width="250" height="200" fill="none" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="300" width="250" height="200" fill="none" stroke="var(--line)" stroke-width="2"/>

  <line x1="250" y1="300" x2="750" y2="300" stroke="var(--dim)" stroke-width="2"/>
  <line x1="500" y1="100" x2="500" y2="500" stroke="var(--dim)" stroke-width="2"/>

  <text x="625" y="186" text-anchor="middle" font-size="20" font-weight="700" fill="var(--accent)">兩邊都在前 10%</text>
  <text x="625" y="222" text-anchor="middle" font-size="16" fill="var(--ink)">這一群快速增加</text>
  <text x="625" y="256" text-anchor="middle" font-size="15" fill="var(--dim)">資本家立場・功績主義・勤奮倫理</text>

  <text x="375" y="186" text-anchor="middle" font-size="20" font-weight="700" fill="var(--dim)">只有資本</text>
  <text x="375" y="222" text-anchor="middle" font-size="16" fill="var(--dim)">十九世紀的巨富</text>

  <text x="625" y="386" text-anchor="middle" font-size="20" font-weight="700" fill="var(--dim)">只有薪水</text>
  <text x="625" y="422" text-anchor="middle" font-size="16" fill="var(--dim)">高薪專業工作</text>

  <text x="375" y="386" text-anchor="middle" font-size="20" font-weight="700" fill="var(--dim)">兩邊都不在</text>

  <text x="500" y="528" text-anchor="middle" font-size="16" fill="var(--dim)">薪水 低　←　　　→　薪水 高</text>
  <text x="212" y="300" text-anchor="middle" font-size="16" fill="var(--dim)" transform="rotate(-90 212 300)">資本所得 低　←　　→　高</text>

  <text x="480" y="562" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">股市跌了，他們還有薪水</text>
</svg>
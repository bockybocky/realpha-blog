<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三條並排的水平長條，每一條都往右越過同一條垂直虛線界線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="72">三條界線，都已經越過</text>

<line x1="640" y1="132" x2="640" y2="500" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
<text class="b" x="640" y="118" text-anchor="middle">界線</text>

<text class="g" x="60" y="205">經濟</text>
<text class="b" x="60" y="232">債務 &gt; 成長</text>
<rect x="270" y="192" width="370" height="36" rx="6" fill="var(--accent)" opacity="0.55"/>
<rect x="640" y="192" width="120" height="36" rx="6" fill="var(--warn)"/>

<text class="g" x="60" y="325">財政</text>
<text class="b" x="60" y="352">赤字 &gt; 稅收</text>
<rect x="270" y="312" width="370" height="36" rx="6" fill="var(--accent)" opacity="0.55"/>
<rect x="640" y="312" width="180" height="36" rx="6" fill="var(--warn)"/>

<text class="g" x="60" y="445">通膨</text>
<text class="b" x="60" y="472">物價 &gt; 承諾</text>
<rect x="270" y="432" width="370" height="36" rx="6" fill="var(--accent)" opacity="0.55"/>
<rect x="640" y="432" width="240" height="36" rx="6" fill="var(--warn)"/>

<text class="c" x="60" y="528">三條都過了，接下來只剩「什麼時候」</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the left is a straight line with an endpoint; on the right is a loop with no endpoint, and outside the loop a dashed line marks the acceptance condition.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:20px; fill:var(--ink); font-weight:600; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
</defs>
<text class="t" x="48" y="58">Dialogue ends; a role never does</text>
<rect x="48" y="96" width="396" height="300" rx="14" fill="var(--card)"/>
<text class="g" x="76" y="140">Dialogue</text>
<circle cx="100" cy="250" r="9" fill="var(--grey)"/>
<line x1="109" y1="250" x2="380" y2="250" stroke="var(--grey)" stroke-width="4" marker-end="url(#a1)"/>
<line x1="398" y1="214" x2="398" y2="286" stroke="var(--ink)" stroke-width="5"/>
<text class="b" x="78" y="294">Hand over a job</text>
<text class="b" x="228" y="294">Done</text>
<text class="b" x="366" y="196">End</text>
<text class="b" x="76" y="356">Has an endpoint</text>
<rect x="516" y="96" width="396" height="300" rx="14" fill="var(--card)"/>
<text class="g" x="544" y="140">Role</text>
<path d="M714 186 A 70 70 0 1 1 644 256" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#a2)"/>
<path d="M644 256 A 70 70 0 0 0 714 326" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M714 326 A 70 70 0 0 0 784 256" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="b" x="690" y="174">Goal</text>
<text class="b" x="796" y="262">Do</text>
<text class="b" x="690" y="352">Report</text>
<text class="b" x="596" y="262">Revise</text>
<line x1="860" y1="150" x2="860" y2="360" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>
<text class="b" x="820" y="382">Acceptance</text>
<text class="c" x="48" y="462">The endpoint becomes an acceptance condition</text>
</svg>
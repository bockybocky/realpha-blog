<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bars of wildly different height: $400 million in a quarter early last year is barely visible, while $11.5 billion in this year's second quarter stands more than thirty times taller, with a dashed ramp connecting the two.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t h" x="60" y="66">Q sales</text>
  <text class="t s" x="60" y="96">From the show, USD</text>

  <line x1="140" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>

  <rect x="220" y="458" width="120" height="12" rx="3" fill="var(--grey)"/>
  <text class="t g" x="280" y="440" text-anchor="middle" fill="var(--dim)">$400M</text>
  <text class="t s" x="280" y="498" text-anchor="middle">Last yr</text>

  <rect x="660" y="125" width="120" height="345" rx="4" fill="var(--accent)"/>
  <text class="t g" x="720" y="110" text-anchor="middle" fill="var(--accent)">$11.5B</text>
  <text class="t s" x="720" y="498" text-anchor="middle">This Q2</text>

  <line x1="340" y1="458" x2="660" y2="130" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="t g" x="470" y="300" text-anchor="middle" fill="var(--dim)">~30x+</text>

  <rect x="660" y="125" width="120" height="30" fill="var(--warn)" fill-opacity="0.85"/>
  <text class="t s" x="800" y="146" fill="var(--warn)">$970M from ops</text>

  <text class="t c" x="60" y="536">Small base, easy multiple; hard to hold</text>
</svg>
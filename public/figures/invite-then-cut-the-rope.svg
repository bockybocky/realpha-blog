<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左格三條供應線接進一個大圓，右格同樣三條線在半路斷開，中央的圓縮小">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">邀請他進來，然後在戰時剪斷繩子</text>

<rect x="52" y="96" width="400" height="360" rx="16" fill="var(--card)" stroke="var(--line)"/>
<text x="72" y="130" font-size="20" fill="var(--dim)">平時</text>
<line x1="150" y1="200" x2="248" y2="268" stroke="var(--accent)" stroke-width="3"/>
<line x1="150" y1="300" x2="248" y2="300" stroke="var(--accent)" stroke-width="3"/>
<line x1="150" y1="400" x2="248" y2="332" stroke="var(--accent)" stroke-width="3"/>
<circle cx="130" cy="200" r="22" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="130" cy="300" r="22" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="130" cy="400" r="22" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="102" y="176" font-size="15" fill="var(--dim)">穀物</text>
<text x="102" y="352" font-size="15" fill="var(--dim)">橡膠</text>
<text x="102" y="276" font-size="15" fill="var(--dim)">橡膠</text>
<circle cx="300" cy="300" r="54" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="3"/>
<text x="300" y="307" font-size="19" fill="var(--ink)" text-anchor="middle">挑戰者</text>
<text x="300" y="418" font-size="16" fill="var(--dim)" text-anchor="middle">在你的體系裡長大</text>

<rect x="508" y="96" width="400" height="360" rx="16" fill="var(--card)" stroke="var(--line)"/>
<text x="528" y="130" font-size="20" fill="var(--dim)">戰時</text>
<line x1="606" y1="200" x2="650" y2="230" stroke="var(--grey)" stroke-width="3"/>
<line x1="606" y1="300" x2="656" y2="300" stroke="var(--grey)" stroke-width="3"/>
<line x1="606" y1="400" x2="650" y2="370" stroke="var(--grey)" stroke-width="3"/>
<circle cx="586" cy="200" r="22" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="586" cy="300" r="22" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="586" cy="400" r="22" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<g stroke="var(--warn)" stroke-width="4">
  <line x1="656" y1="216" x2="676" y2="238"/><line x1="676" y1="216" x2="656" y2="238"/>
  <line x1="662" y1="288" x2="682" y2="312"/><line x1="682" y1="288" x2="662" y2="312"/>
  <line x1="656" y1="362" x2="676" y2="384"/><line x1="676" y1="362" x2="656" y2="384"/>
</g>
<circle cx="790" cy="300" r="26" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
<text x="790" y="306" font-size="15" fill="var(--dim)" text-anchor="middle">挑戰者</text>
<text x="756" y="418" font-size="16" fill="var(--warn)" text-anchor="middle">依賴變成弱點</text>

<text x="480" y="518" font-size="22" fill="var(--ink)" text-anchor="middle">繩子是你放出去的，所以你剪得斷</text>
</svg>
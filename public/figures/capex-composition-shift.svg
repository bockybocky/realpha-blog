<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根等高堆疊長條，記憶體段從兩格長到四格，算力晶片段從六格縮到四格，中間色帶顯示記憶體段變寬">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
</style>
<text x="60" y="52" class="t">資本支出：總額之外，看組成</text>
<polygon points="420,208 540,208 540,344 420,276" fill="var(--accent)" opacity="0.15"/>
<rect x="270" y="140" width="150" height="34" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="270" y="174" width="150" height="34" fill="var(--accent)" opacity="0.45"/>
<rect x="270" y="208" width="150" height="68" fill="var(--accent)"/>
<rect x="270" y="276" width="150" height="204" fill="var(--grey)"/>
<rect x="540" y="140" width="150" height="34" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="540" y="174" width="150" height="34" fill="var(--accent)" opacity="0.45"/>
<rect x="540" y="208" width="150" height="136" fill="var(--accent)"/>
<rect x="540" y="344" width="150" height="136" fill="var(--grey)"/>
<text x="710" y="163" class="d">其他</text>
<text x="710" y="197" class="b">封裝</text>
<text x="710" y="282" class="g a">記憶體</text>
<text x="710" y="418" class="g">算力晶片</text>
<line x1="240" y1="480" x2="720" y2="480" stroke="var(--line)" stroke-width="2"/>
<text x="345" y="508" class="g" text-anchor="middle">之前</text>
<text x="615" y="508" class="g" text-anchor="middle">之後</text>
<text x="880" y="508" class="d" text-anchor="end">比例示意</text>
<text x="480" y="545" class="c" text-anchor="middle">錢從算力格，移往記憶體格</text>
</svg>
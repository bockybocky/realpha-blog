<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two bars compare what makes up hosting cost: a typical city has three solid blocks, while Los Angeles has the top two as dashed empty outlines, leaving only games operations.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600}
.b{font-size:16px}
.d{font-size:15px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="62">LA's bill is missing two blocks</text>
<text class="d" x="60" y="92">What hosting costs, illustrative</text>
<rect x="160" y="150" width="200" height="150" fill="var(--grey)"/>
<rect x="160" y="300" width="200" height="90" fill="var(--grey)"/>
<rect x="160" y="390" width="200" height="90" fill="var(--accent)"/>
<line x1="160" y1="300" x2="360" y2="300" stroke="var(--page)" stroke-width="2"/>
<line x1="160" y1="390" x2="360" y2="390" stroke="var(--page)" stroke-width="2"/>
<text class="b" x="260" y="232" text-anchor="middle">New venues</text>
<text class="b" x="260" y="352" text-anchor="middle">Athletes village</text>
<text x="260" y="442" text-anchor="middle" style="font-size:16px;fill:var(--page)">Games operations</text>
<rect x="560" y="150" width="200" height="150" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="560" y="300" width="200" height="90" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="560" y="390" width="200" height="90" fill="var(--accent)"/>
<text class="d" x="660" y="218" text-anchor="middle">Venues already there</text>
<text class="d" x="660" y="244" text-anchor="middle">Nothing to build</text>
<text class="d" x="660" y="340" text-anchor="middle">College dorms</text>
<text class="d" x="660" y="366" text-anchor="middle">Nothing to build</text>
<text x="660" y="442" text-anchor="middle" style="font-size:16px;fill:var(--page)">Games operations</text>
<text class="g" x="260" y="512" text-anchor="middle">Typical host city</text>
<text class="g" x="660" y="512" text-anchor="middle">LA 2028</text>
<text class="d" x="790" y="212">Security, logistics</text>
<text class="d" x="790" y="236">Federal job</text>
<text class="c" x="60" y="552">What's saved was already standing there</text>
</svg>
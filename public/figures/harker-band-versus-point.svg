<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上排一條寬帶表示事前算不出來，下排一個孤立的點表示算得出來的秒數">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="480" y="60" font-size="27" fill="var(--ink)" text-anchor="middle">同一個人，兩種把握</text>

  <text x="100" y="150" font-size="20" fill="var(--ink)">準備金水位</text>
  <line x1="100" y1="230" x2="860" y2="230" stroke="var(--line)" stroke-width="3"/>
  <rect x="240" y="200" width="440" height="60" fill="var(--grey)" opacity="0.55"/>
  <line x1="240" y1="190" x2="240" y2="270" stroke="var(--dim)" stroke-width="3"/>
  <line x1="680" y1="190" x2="680" y2="270" stroke="var(--dim)" stroke-width="3"/>
  <text x="240" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">5000 億美元</text>
  <text x="680" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">1.5 兆美元</text>
  <text x="460" y="238" font-size="19" fill="var(--ink)" text-anchor="middle">事前算不出來</text>

  <text x="100" y="380" font-size="20" fill="var(--ink)">支付延遲</text>
  <line x1="100" y1="440" x2="860" y2="440" stroke="var(--line)" stroke-width="3"/>
  <circle cx="400" cy="440" r="11" fill="var(--accent)"/>
  <text x="400" y="412" font-size="20" fill="var(--accent)" text-anchor="middle">16 秒</text>
  <text x="400" y="478" font-size="16" fill="var(--warn)" text-anchor="middle">底下的基準率沒人量過</text>

  <text x="480" y="528" font-size="22" fill="var(--ink)" text-anchor="middle">一邊說不知道，一邊給一個點</text>
</svg>
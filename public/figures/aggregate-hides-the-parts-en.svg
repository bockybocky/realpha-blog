<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The overall score is positive, but once split apart one strong part is covering up two negative ones.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
 svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
       --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
 @media (prefers-color-scheme: dark) {
   svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
         --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
 }
 text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
 .h{font-size:27px;font-weight:700}
 .g{font-size:19px;fill:var(--dim)}
 .b{font-size:16px;fill:var(--dim)}
 .c{font-size:22px;font-weight:700}
</style>
<text class="h" x="60" y="56">Split it up</text>
<text class="g" x="60" y="106">Total</text>
<line x1="60" y1="190" x2="900" y2="190" stroke="var(--line)" stroke-width="2"/>
<rect x="60" y="130" width="300" height="60" fill="var(--accent)"/>
<text class="b" x="80" y="170" fill="var(--page)">Decent</text>
<text class="g" x="60" y="268">Parts</text>
<line x1="60" y1="400" x2="900" y2="400" stroke="var(--dim)" stroke-width="3"/>
<rect x="120" y="300" width="110" height="100" fill="var(--accent)"/>
<text class="b" x="130" y="286">Up a lot</text>
<rect x="300" y="400" width="110" height="70" fill="var(--warn)"/>
<text class="b" x="300" y="496" fill="var(--warn)">Falling</text>
<rect x="480" y="400" width="110" height="60" fill="var(--warn)"/>
<text class="b" x="480" y="496" fill="var(--warn)">Falling</text>
<rect x="660" y="392" width="110" height="8" fill="var(--grey)"/>
<text class="b" x="660" y="372">Flat</text>
<text class="c" x="60" y="542">The total is weighted; you are not</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A closed correction loop on the left and the same loop on the right with one segment missing, left open.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .ti{font-size:27px;font-weight:700}
    .g{font-size:20px;font-weight:700}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t ti" x="60" y="56">Not rigor — a day the answer arrives</text>
<text class="t g" x="120" y="108" fill="var(--accent)">Election</text>
<circle cx="250" cy="300" r="120" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M360 250 L372 300 L348 300 Z" fill="var(--accent)"/>
<circle cx="250" cy="180" r="10" fill="var(--accent)"/>
<circle cx="370" cy="300" r="10" fill="var(--accent)"/>
<circle cx="250" cy="420" r="10" fill="var(--accent)"/>
<circle cx="130" cy="300" r="10" fill="var(--accent)"/>
<text class="t b" x="206" y="162">Publish</text>
<text class="t b" x="392" y="306">E-Day</text>
<text class="t b" x="210" y="454">Scored</text>
<text class="t b" x="30" y="306">Revise</text>
<text class="t g" x="700" y="108" fill="var(--warn)">Confidence</text>
<path d="M710 300 A 120 120 0 1 1 745 215" fill="none" stroke="var(--warn)" stroke-width="4"/>
<circle cx="710" cy="180" r="10" fill="var(--warn)"/>
<circle cx="710" cy="420" r="10" fill="var(--warn)"/>
<circle cx="590" cy="300" r="10" fill="var(--warn)"/>
<circle cx="800" cy="260" r="7" fill="var(--warn)" opacity="0.45"/>
<circle cx="828" cy="300" r="7" fill="var(--warn)" opacity="0.3"/>
<text class="t b" x="666" y="162">Report</text>
<text class="t b" x="672" y="454">No E-Day</text>
<text class="t b" x="490" y="306">Tweak</text>
<text class="t g" x="760" y="340" fill="var(--warn)">Open</text>
<text class="t c" x="60" y="528">Only scored errors get fixed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="四塊色塊各蓋住一小片，中間留下一塊更大的虛線空白區沒有人蓋到">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">每個人都蓋住一小片，中間那塊最大</text>
  <rect x="70" y="100" width="820" height="380" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="100" y="130" width="190" height="110" rx="8" fill="var(--accent)" opacity="0.8"/>
  <text class="g" x="140" y="194">州 PUC</text>
  <rect x="670" y="130" width="190" height="110" rx="8" fill="var(--accent)" opacity="0.8"/>
  <text class="g" x="724" y="194">RTO</text>
  <rect x="100" y="340" width="190" height="110" rx="8" fill="var(--accent)" opacity="0.8"/>
  <text class="g" x="134" y="404">聯邦政府</text>
  <rect x="670" y="340" width="190" height="110" rx="8" fill="var(--accent)" opacity="0.8"/>
  <text class="g" x="724" y="404">FERC</text>
  <rect x="330" y="200" width="300" height="180" rx="10" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="12 10"/>
  <text class="g" x="382" y="276">跨區域輸電規劃</text>
  <text class="n" x="416" y="312">歸誰？</text>
  <text class="n" x="70" y="514">她的第一張藥方：先把這塊空白指派給人</text>
</svg>
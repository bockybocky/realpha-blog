<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="想法兌現所需的時間長條，與部位實際存活的短條，短條在長條中途就中斷">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">對的那段時間，比部位活得久</text>
<text class="t" x="60" y="156" font-size="20" fill="var(--ink)">想法走到終點</text>
<rect x="60" y="180" width="780" height="50" rx="8" fill="var(--accent)"/>
<text class="t" x="756" y="214" font-size="16" fill="var(--page)">兌現</text>
<text class="t" x="60" y="310" font-size="20" fill="var(--ink)">部位能活多久</text>
<rect x="60" y="334" width="300" height="50" rx="8" fill="var(--warn)"/>
<line x1="366" y1="320" x2="366" y2="398" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="386" y="366" font-size="19" fill="var(--warn)">槓桿與擁擠度在此結清</text>
<path d="M366 420 L366 448 L840 448" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
<text class="t" x="520" y="440" font-size="16" fill="var(--dim)">剩下這段與你無關</text>
<text class="t" x="60" y="494" font-size="22" fill="var(--ink)">方向對，但沒撐到那一天</text>
</svg>
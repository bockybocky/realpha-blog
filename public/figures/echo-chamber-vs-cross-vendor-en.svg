<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Left: three overlapping circles crowd one corner and leave a blind spot uncovered. Right: three spread-out circles cover the same blind spot.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .w { font-size:16px; fill:var(--warn); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="480" y="54" text-anchor="middle">Three times, or three houses</text>

  <rect x="60" y="86" width="390" height="322" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="510" y="86" width="390" height="322" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <circle cx="255" cy="247" r="128" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 7"/>
  <circle cx="705" cy="247" r="128" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 7"/>

  <circle cx="215" cy="207" r="52" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)"/>
  <circle cx="257" cy="227" r="52" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)"/>
  <circle cx="238" cy="264" r="52" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)"/>

  <circle cx="655" cy="202" r="52" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)"/>
  <circle cx="700" cy="262" r="52" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)"/>
  <circle cx="762" cy="302" r="52" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)"/>

  <circle cx="312" cy="302" r="8" fill="var(--warn)"/>
  <text class="w" x="330" y="308">Nobody saw it</text>
  <circle cx="762" cy="302" r="8" fill="var(--warn)"/>
  <text class="w" x="782" y="345">Caught</text>

  <text class="g" x="255" y="440" text-anchor="middle">One house, asked 3 times</text>
  <text class="g" x="705" y="440" text-anchor="middle">Three houses, once each</text>
  <text class="s" x="255" y="466" text-anchor="middle">Coverage overlaps</text>
  <text class="s" x="705" y="466" text-anchor="middle">Coverage spreads</text>

  <text class="c" x="480" y="512" text-anchor="middle">Similar answers miss one blind spot</text>
</svg>
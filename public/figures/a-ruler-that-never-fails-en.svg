<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The upper ruler has one notch with all points piled on it, while the lower ruler spreads its scale and the points land apart.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">Two rulers, one set of events</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">Give it the wrong ruler and it will politely measure a perfect score</text>

<text x="60" y="164" font-size="19" fill="var(--warn)">Back to the midline within 20 days</text>
<line x1="200" y1="222" x2="820" y2="222" stroke="var(--grey)" stroke-width="3"/>
<line x1="820" y1="204" x2="820" y2="240" stroke="var(--warn)" stroke-width="3"/>
<line x1="200" y1="204" x2="200" y2="240" stroke="var(--grey)" stroke-width="3"/>
<circle cx="812" cy="200" r="8" fill="var(--warn)"/>
<circle cx="826" cy="192" r="8" fill="var(--warn)"/>
<circle cx="818" cy="182" r="8" fill="var(--warn)"/>
<circle cx="806" cy="188" r="8" fill="var(--warn)"/>
<circle cx="830" cy="204" r="8" fill="var(--warn)"/>
<circle cx="800" cy="176" r="8" fill="var(--warn)"/>
<text x="820" y="266" font-size="19" fill="var(--warn)" text-anchor="middle">100%</text>
<text x="200" y="266" font-size="15" fill="var(--grey)" text-anchor="middle">No other notch</text>

<text x="60" y="366" font-size="19" fill="var(--accent)">Return distribution after the event</text>
<line x1="200" y1="424" x2="820" y2="424" stroke="var(--line)" stroke-width="3"/>
<line x1="200" y1="412" x2="200" y2="436" stroke="var(--grey)" stroke-width="2"/>
<line x1="324" y1="412" x2="324" y2="436" stroke="var(--grey)" stroke-width="2"/>
<line x1="448" y1="412" x2="448" y2="436" stroke="var(--grey)" stroke-width="2"/>
<line x1="572" y1="412" x2="572" y2="436" stroke="var(--grey)" stroke-width="2"/>
<line x1="696" y1="412" x2="696" y2="436" stroke="var(--grey)" stroke-width="2"/>
<line x1="820" y1="412" x2="820" y2="436" stroke="var(--grey)" stroke-width="2"/>
<circle cx="248" cy="398" r="8" fill="var(--accent)"/>
<circle cx="360" cy="382" r="8" fill="var(--accent)"/>
<circle cx="470" cy="392" r="8" fill="var(--accent)"/>
<circle cx="560" cy="374" r="8" fill="var(--accent)"/>
<circle cx="672" cy="390" r="8" fill="var(--accent)"/>
<circle cx="778" cy="380" r="8" fill="var(--accent)"/>
<text x="510" y="466" font-size="15" fill="var(--dim)" text-anchor="middle">Tells them apart</text>

<text x="60" y="512" font-size="22" fill="var(--ink)">A ruler that measures no difference scores everything perfect.</text>
</svg>
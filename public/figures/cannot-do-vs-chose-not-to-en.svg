<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A large block with a piece grayed out on the left and another small piece marked within the remainder">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:600}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs><clipPath id="box"><rect x="100" y="120" width="760" height="280" rx="14"/></clipPath></defs>
<text class="t h" x="480" y="58" text-anchor="middle">Separate the two kinds of absence</text>
<rect x="100" y="120" width="760" height="280" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g clip-path="url(#box)">
<rect x="100" y="120" width="220" height="280" fill="var(--grey)" opacity="0.4"/>
<line x1="320" y1="120" x2="320" y2="400" stroke="var(--grey)" stroke-width="2"/>
</g>
<text class="t s" x="130" y="158">Everything doable</text>
<text class="t g" x="210" y="268" text-anchor="middle">Cut by regulation</text>
<text class="t s" x="210" y="300" text-anchor="middle">Cannot do</text>
<rect x="560" y="196" width="220" height="140" rx="10" fill="var(--accent)" opacity="0.16"/>
<rect x="560" y="196" width="220" height="140" rx="10" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="t g" x="670" y="258" text-anchor="middle">Removed by itself</text>
<text class="t s" x="670" y="290" text-anchor="middle">Chose not to</text>
<text class="t c" x="480" y="462" text-anchor="middle">Only the right piece shows character</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左柱維持高度、右柱從虛線原高度塌成矮柱，箭頭由塌掉的一端指回沒動的一端">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="60" y="56" font-size="27" fill="var(--ink)">崩塌的是處理，不是取得</text>

  <line x1="120" y1="430" x2="840" y2="430" stroke="var(--grey)" stroke-width="2"/>

  <rect x="230" y="140" width="150" height="290" rx="6" fill="var(--accent)" opacity="0.85"/>
  <text x="305" y="126" font-size="15" fill="var(--dim)" text-anchor="middle">沒有變便宜</text>
  <text x="305" y="464" font-size="19" fill="var(--ink)" text-anchor="middle">取得資訊</text>
  <text x="305" y="490" font-size="15" fill="var(--dim)" text-anchor="middle">機票 · 現場 · 跟人講話</text>

  <rect x="580" y="140" width="150" height="290" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="580" y="350" width="150" height="80" rx="6" fill="var(--grey)"/>
  <text x="655" y="126" font-size="15" fill="var(--dim)" text-anchor="middle">原本</text>
  <text x="770" y="392" font-size="15" fill="var(--dim)">AI 之後</text>
  <text x="655" y="464" font-size="19" fill="var(--ink)" text-anchor="middle">處理資訊</text>
  <text x="655" y="490" font-size="15" fill="var(--dim)" text-anchor="middle">摘要 · 翻譯 · 找模式</text>

  <line x1="556" y1="232" x2="412" y2="232" stroke="var(--accent)" stroke-width="2.5"/>
  <polygon points="414,224 414,240 398,232" fill="var(--accent)"/>
  <text x="484" y="212" font-size="16" fill="var(--accent)" text-anchor="middle">價值往這端集中</text>

  <text x="480" y="530" font-size="22" fill="var(--ink)" text-anchor="middle">一端塌下去，另一端就成了瓶頸</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The corridor is blocked by two barriers, so the recipe stops halfway and never reaches the modern construction site.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="56" font-size="27" fill="var(--ink)">The recipe was never lost; two judgments blocked it</text>

<rect x="40" y="200" width="150" height="130" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="66" y="258" font-size="19" fill="var(--ink)">Vitruvius</text>
<text x="66" y="290" font-size="16" fill="var(--dim)">It's in the book</text>

<rect x="190" y="238" width="580" height="54" fill="var(--card)" stroke="var(--line)"/>
<path d="M200 265 L330 265" stroke="var(--accent)" stroke-width="10"/>

<rect x="344" y="176" width="26" height="178" rx="4" fill="var(--warn)"/>
<text x="300" y="158" font-size="19" fill="var(--warn)">Read as secret recipe</text>
<text x="300" y="392" font-size="16" fill="var(--dim)">No volcanic ash</text>

<rect x="560" y="176" width="26" height="178" rx="4" fill="var(--warn)"/>
<text x="508" y="158" font-size="19" fill="var(--warn)">Read as flaw</text>
<text x="494" y="392" font-size="16" fill="var(--dim)">White specks = bad mixing</text>

<rect x="800" y="200" width="120" height="130" rx="10" fill="var(--card)" stroke="var(--line)" stroke-dasharray="6 5"/>
<text x="826" y="258" font-size="19" fill="var(--dim)">Modern</text>
<text x="826" y="290" font-size="16" fill="var(--dim)">Job site</text>

<text x="40" y="470" font-size="22" fill="var(--ink)">Info arrived; judgment sent it back</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two falling lines with very different slopes, the gentle one stretching far and the steep one hitting bottom fast">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
</defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="48" y="60" font-size="27" font-weight="700" fill="var(--ink)">Fast decay is a brake</text>

<rect x="48" y="105" width="864" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="100" y1="135" x2="100" y2="370" stroke="var(--grey)" stroke-width="2"/>
<line x1="100" y1="370" x2="880" y2="370" stroke="var(--grey)" stroke-width="2"/>
<text x="100" y="128" font-size="15" text-anchor="middle" fill="var(--dim)">Value</text>
<text x="880" y="392" font-size="15" text-anchor="end" fill="var(--dim)">Time</text>
<path d="M120 162 L860 302" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M120 162 L420 360" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text x="856" y="286" font-size="16" text-anchor="end" fill="var(--accent)">Houses</text>
<text x="436" y="352" font-size="16" fill="var(--warn)">GPUs</text>

<text x="256" y="446" font-size="16" text-anchor="middle" fill="var(--warn)">Tight lenders → less leverage</text>
<text x="700" y="446" font-size="16" text-anchor="middle" fill="var(--accent)">Easy lenders → more leverage</text>

<text x="480" y="500" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">That flaw is a safety device</text>
</svg>
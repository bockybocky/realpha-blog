<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根柱子的高度落差：高階應用營收占比由兩三個百分點長到二十七個百分點">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .n { font-size:27px; font-weight:700; fill:var(--accent); }
    .nd { font-size:22px; font-weight:700; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="80" y="70">高階應用占營收的高度</text>
  <line x1="200" y1="430" x2="820" y2="430" stroke="var(--line)" stroke-width="2"/>
  <rect x="280" y="402" width="140" height="28" rx="4" fill="var(--grey)"/>
  <text class="nd" x="350" y="388" text-anchor="middle">2 至 3%</text>
  <text class="g" x="350" y="466" text-anchor="middle">2023 年</text>
  <text class="b" x="350" y="492" text-anchor="middle">門還關著</text>
  <rect x="620" y="130" width="140" height="300" rx="4" fill="var(--accent)"/>
  <text class="n" x="690" y="112" text-anchor="middle">27%</text>
  <text class="g" x="690" y="466" text-anchor="middle">2026 上半年</text>
  <text class="b" x="690" y="492" text-anchor="middle">門開了</text>
  <line x1="430" y1="402" x2="610" y2="402" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="b" x="120" y="408">同一條基準線</text>
</svg>
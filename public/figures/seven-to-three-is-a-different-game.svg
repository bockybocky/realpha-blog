<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="四條比例條，前兩條接近對半、第三條明顯失衡並標警示色、最後一條翻轉過來">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; fill:var(--ink); font-weight:700; }
    .g  { font-size:19px; fill:var(--dim); font-weight:700; }
    .b  { font-size:16px; fill:var(--ink); }
    .c  { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="40" y="54">七比三不是落後一點，是另一種局</text>
  <text class="g" x="200" y="104">自己</text>
  <text class="g" x="880" y="104" text-anchor="end">對手</text>

  <text class="g" x="180" y="162" text-anchor="end">五比五</text>
  <rect x="200" y="140" width="340" height="30" fill="var(--accent)"/>
  <rect x="540" y="140" width="340" height="30" fill="var(--grey)"/>
  <text class="b" x="900" y="162">有戲</text>

  <text class="g" x="180" y="232" text-anchor="end">六比四</text>
  <rect x="200" y="210" width="272" height="30" fill="var(--grey)"/>
  <rect x="472" y="210" width="408" height="30" fill="var(--grey)"/>
  <text class="b" x="900" y="232">有戲</text>

  <text class="g" x="180" y="302" text-anchor="end">七比三</text>
  <rect x="200" y="280" width="204" height="30" fill="var(--warn)"/>
  <rect x="404" y="280" width="476" height="30" fill="var(--grey)"/>
  <text class="b" x="900" y="302" fill="var(--warn)">前線被拆掉</text>

  <line x1="200" y1="346" x2="880" y2="346" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="g" x="180" y="402" text-anchor="end">三年多後</text>
  <rect x="200" y="380" width="476" height="30" fill="var(--accent)"/>
  <rect x="676" y="380" width="204" height="30" fill="var(--grey)"/>
  <text class="c" x="40" y="490">同樣的價錢，對面帶來的客人是兩倍</text>
</svg>
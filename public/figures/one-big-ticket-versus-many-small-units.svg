<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一根高窄柱子與一片一百個小方格面積相當，表示大數字可從單價或數量累積">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="48" font-size="27" fill="var(--ink)">同樣大的一塊，兩種堆法</text>
<line x1="60" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="120" width="60" height="280" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text x="180" y="430" font-size="20" fill="var(--dim)" text-anchor="middle">一顆</text>
<text x="180" y="455" font-size="16" fill="var(--dim)" text-anchor="middle">高單價・設計費</text>
<text x="180" y="105" font-size="16" fill="var(--dim)" text-anchor="middle">窄而高</text>
<g stroke="var(--accent)" stroke-width="1.5" fill="none">
<rect x="520" y="316" width="24" height="24"/><rect x="552" y="316" width="24" height="24"/><rect x="584" y="316" width="24" height="24"/><rect x="616" y="316" width="24" height="24"/><rect x="648" y="316" width="24" height="24"/><rect x="680" y="316" width="24" height="24"/><rect x="712" y="316" width="24" height="24"/><rect x="744" y="316" width="24" height="24"/><rect x="776" y="316" width="24" height="24"/><rect x="808" y="316" width="24" height="24"/>
<rect x="520" y="284" width="24" height="24"/><rect x="552" y="284" width="24" height="24"/><rect x="584" y="284" width="24" height="24"/><rect x="616" y="284" width="24" height="24"/><rect x="648" y="284" width="24" height="24"/><rect x="680" y="284" width="24" height="24"/><rect x="712" y="284" width="24" height="24"/><rect x="744" y="284" width="24" height="24"/><rect x="776" y="284" width="24" height="24"/><rect x="808" y="284" width="24" height="24"/>
<rect x="520" y="252" width="24" height="24"/><rect x="552" y="252" width="24" height="24"/><rect x="584" y="252" width="24" height="24"/><rect x="616" y="252" width="24" height="24"/><rect x="648" y="252" width="24" height="24"/><rect x="680" y="252" width="24" height="24"/><rect x="712" y="252" width="24" height="24"/><rect x="744" y="252" width="24" height="24"/><rect x="776" y="252" width="24" height="24"/><rect x="808" y="252" width="24" height="24"/>
<rect x="520" y="220" width="24" height="24"/><rect x="552" y="220" width="24" height="24"/><rect x="584" y="220" width="24" height="24"/><rect x="616" y="220" width="24" height="24"/><rect x="648" y="220" width="24" height="24"/><rect x="680" y="220" width="24" height="24"/><rect x="712" y="220" width="24" height="24"/><rect x="744" y="220" width="24" height="24"/><rect x="776" y="220" width="24" height="24"/><rect x="808" y="220" width="24" height="24"/>
<rect x="520" y="188" width="24" height="24"/><rect x="552" y="188" width="24" height="24"/><rect x="584" y="188" width="24" height="24"/><rect x="616" y="188" width="24" height="24"/><rect x="648" y="188" width="24" height="24"/><rect x="680" y="188" width="24" height="24"/><rect x="712" y="188" width="24" height="24"/><rect x="744" y="188" width="24" height="24"/><rect x="776" y="188" width="24" height="24"/><rect x="808" y="188" width="24" height="24"/>
</g>
<line x1="520" y1="364" x2="832" y2="364" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 5"/>
<text x="676" y="430" font-size="20" fill="var(--accent)" text-anchor="middle">數以百萬顆</text>
<text x="676" y="455" font-size="16" fill="var(--dim)" text-anchor="middle">一顆不貴・一顆一顆加</text>
<text x="676" y="105" font-size="16" fill="var(--dim)" text-anchor="middle">矮而寬</text>
<text x="360" y="268" font-size="20" fill="var(--dim)" text-anchor="middle">面積相當</text>
<text x="60" y="510" font-size="22" fill="var(--ink)">角落零件的營收來自數量，不是來自單價</text>
</svg>
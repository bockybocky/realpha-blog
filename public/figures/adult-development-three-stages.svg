<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三級由低到高的階梯，最高的第五階上方有一個繞回自身的循環箭頭">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
</style>
<defs>
<marker id="yt-ah-stage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="480" y="56" text-anchor="middle" class="t">大人也會發展：三個階段</text>
<rect x="100" y="390" width="240" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="340" y="300" width="240" height="170" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="580" y="210" width="240" height="260" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="220" y="422" text-anchor="middle" class="g">階段三</text>
<text x="220" y="450" text-anchor="middle" class="b">做好交辦</text>
<text x="460" y="334" text-anchor="middle" class="g">階段四</text>
<text x="460" y="362" text-anchor="middle" class="b">自己的價值判斷</text>
<text x="700" y="244" text-anchor="middle" class="g a">階段五</text>
<text x="700" y="272" text-anchor="middle" class="b">質疑自己的框架</text>
<path d="M 670 172 A 36 28 0 1 1 730 172" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#yt-ah-stage)"/>
<text x="700" y="112" text-anchor="middle" class="b a">框架跟著換</text>
<line x1="80" y1="470" x2="860" y2="470" stroke="var(--dim)" stroke-width="2"/>
<text x="220" y="500" text-anchor="middle" class="s">二、三十歲</text>
<text x="460" y="500" text-anchor="middle" class="s">四十歲上下</text>
<text x="700" y="500" text-anchor="middle" class="s">一部分經營者</text>
<text x="480" y="552" text-anchor="middle" class="c">最高一段會回頭改自己的尺</text>
</svg>
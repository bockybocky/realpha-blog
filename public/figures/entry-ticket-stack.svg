<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="以前只有一層的成本堆疊，現在往上多疊了電網升級、水電分攤、稅惠減少與工期拉長，高度拉開一倍以上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="64">入場門票</text>
<rect x="60" y="100" width="840" height="360" rx="14" fill="var(--card)"/>
<line x1="110" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="350" width="200" height="70" rx="6" fill="var(--accent)"/>
<text class="b" x="196" y="394" fill="var(--page)">電網供電</text>
<text class="g" x="180" y="330">以前</text>
<rect x="560" y="350" width="200" height="70" rx="6" fill="var(--accent)"/>
<text class="b" x="576" y="394" fill="var(--page)">電網供電</text>
<rect x="560" y="296" width="200" height="48" rx="6" fill="var(--warn)"/>
<text class="b" x="576" y="326" fill="var(--page)">電網升級分攤</text>
<rect x="560" y="242" width="200" height="48" rx="6" fill="var(--warn)"/>
<text class="b" x="576" y="272" fill="var(--page)">水電成本</text>
<rect x="560" y="188" width="200" height="48" rx="6" fill="var(--warn)"/>
<text class="b" x="576" y="218" fill="var(--page)">稅惠減少</text>
<rect x="560" y="134" width="200" height="48" rx="6" fill="var(--warn)"/>
<text class="b" x="576" y="164" fill="var(--page)">工期拉長</text>
<text class="g" x="560" y="124">現在</text>
<line x1="440" y1="420" x2="440" y2="134" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="c" x="60" y="520">貴的是門票，不是裡面那場需求</text>
</svg>
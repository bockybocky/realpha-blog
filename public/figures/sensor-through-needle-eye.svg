<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="放大的針孔裡擺著一顆剛好穿得過的方塊感測器，旁邊是它的實際大小小點，以及另外一塊較大的模組">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="52">它小到穿得過針孔</text>
  <text class="d" x="60" y="82">放大示意</text>

  <path d="M190 120 L230 120 L236 300 L184 300 Z" fill="var(--grey)"/>
  <ellipse cx="210" cy="190" rx="26" ry="52" fill="var(--page)" stroke="var(--grey)" stroke-width="4"/>
  <rect x="196" y="176" width="28" height="28" rx="3" fill="var(--accent)"/>
  <text class="g" x="268" y="186">針孔</text>
  <text class="d" x="268" y="214">一般縫衣針</text>

  <line x1="300" y1="190" x2="430" y2="190" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="440" y="150" width="80" height="80" rx="4" fill="var(--accent)"/>
  <text class="g" x="440" y="134">感測器</text>
  <text class="d" x="440" y="262">多百萬像素</text>

  <rect x="440" y="330" width="6" height="6" fill="var(--accent)"/>
  <text class="d" x="462" y="340">實際大小</text>

  <rect x="700" y="150" width="190" height="130" rx="8" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <text class="g" x="724" y="222">模組</text>
  <text class="d" x="700" y="310">藏在別處</text>

  <path d="M120 430 Q300 392 480 430" fill="none" stroke="var(--line)" stroke-width="22"/>
  <circle cx="300" cy="407" r="5" fill="var(--accent)"/>
  <text class="d" x="500" y="436">襯衫翻領，沒人發現</text>

  <text class="c" x="60" y="508">要嘛做得出來，要嘛做不出來</text>
</svg>
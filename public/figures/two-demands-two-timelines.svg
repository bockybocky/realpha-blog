<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩條平行需求時間線，低濃縮鈾今天就實線存在，HALEU 由零起延後數年才出現">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="78" font-size="27" fill="var(--ink)">兩種需求，兩條時間軸</text>

<line x1="200" y1="130" x2="200" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 6"/>
<text x="200" y="118" font-size="16" fill="var(--dim)" text-anchor="middle">今天</text>

<text x="60" y="208" font-size="20" fill="var(--ink)">低濃縮鈾</text>
<line x1="200" y1="230" x2="890" y2="230" stroke="var(--accent)" stroke-width="8"/>
<circle cx="200" cy="230" r="11" fill="var(--accent)"/>
<text x="230" y="208" font-size="16" fill="var(--dim)">買方已存在・換料需求・法定日期</text>

<text x="60" y="348" font-size="20" fill="var(--ink)">HALEU</text>
<line x1="200" y1="370" x2="600" y2="370" stroke="var(--grey)" stroke-width="4" stroke-dasharray="10 10"/>
<line x1="600" y1="370" x2="890" y2="370" stroke="var(--warn)" stroke-width="8"/>
<circle cx="200" cy="370" r="11" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text x="230" y="348" font-size="16" fill="var(--dim)">今天是零・等機隊商業換料</text>
<text x="196" y="408" font-size="19" fill="var(--grey)" text-anchor="start">零</text>

<line x1="470" y1="150" x2="470" y2="470" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text x="486" y="462" font-size="19" fill="var(--warn)">產能開始攤提</text>

<text x="60" y="530" font-size="22" fill="var(--ink)">同一座廠，一半有合約，一半在等客人</text>
</g>
</svg>
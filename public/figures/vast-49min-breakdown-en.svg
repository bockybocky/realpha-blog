<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The 49.5-minute bar is divided into three segments — boot-up, model download, and image generation — and the waiting segments are almost as long as the drawing segment.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .w { font-size:20px; fill:var(--page); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70">Drawing is just over half of 49.5 min</text>

<rect x="60" y="150" width="34" height="76" rx="4" fill="var(--grey)"/>
<rect x="94" y="150" width="356" height="76" fill="var(--warn)"/>
<rect x="450" y="150" width="450" height="76" rx="4" fill="var(--accent)"/>

<text class="w" x="120" y="196">Model download 21 min</text>
<text class="w" x="480" y="196">50 images, 26.5 min</text>

<text class="n" x="60" y="262">Boot and transfer back</text>
<text class="n" x="60" y="286">About 2 min</text>

<line x1="60" y1="330" x2="450" y2="330" stroke="var(--warn)" stroke-width="3"/>
<line x1="450" y1="330" x2="900" y2="330" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="60" y="364" fill="var(--warn)">23 min waiting</text>
<text class="g" x="450" y="364" fill="var(--accent)">26.5 min working</text>

<text class="c" x="60" y="440">Waiting costs as much as working</text>
<text class="n" x="60" y="472">One RTX 3090, US$0.18 for the whole run</text>
</svg>
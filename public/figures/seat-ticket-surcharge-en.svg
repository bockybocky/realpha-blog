<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The seat contains the ticket, the ticket contains the fuel surcharge, and the innermost box links to the crude price on the right." style="font-family:&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="80" y="72" font-size="27" fill="var(--ink)">What is inside the thing an airline sells</text>

<rect x="80" y="120" width="480" height="330" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="156" font-size="20" fill="var(--dim)">Seat</text>
<rect x="130" y="180" width="380" height="240" rx="12" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="160" y="216" font-size="20" fill="var(--dim)">Ticket</text>
<rect x="180" y="240" width="280" height="140" rx="10" fill="var(--accent)"/>
<text x="320" y="300" font-size="20" fill="var(--page)" text-anchor="middle">Fuel surcharge</text>
<text x="320" y="334" font-size="16" fill="var(--page)" text-anchor="middle">Tracks oil</text>

<line x1="460" y1="310" x2="700" y2="310" stroke="var(--accent)" stroke-width="4" stroke-dasharray="8 6"/>
<polygon points="716,310 696,300 696,320" fill="var(--accent)"/>
<text x="730" y="300" font-size="20" fill="var(--ink)">Crude price</text>
<text x="730" y="330" font-size="19" fill="var(--accent)">75% correlated</text>

<text x="80" y="500" font-size="22" fill="var(--ink)">One foot was already long oil all along</text>
</svg>
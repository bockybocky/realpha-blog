<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The top row's probability point shifts a little to the left while the bottom row's identical point is crossed out to zero, contrasting two ways of handling an objection.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .k { font-size:22px; font-weight:700; fill:var(--accent); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70">Objection</text>

  <rect x="60" y="110" width="840" height="140" rx="12" fill="var(--card)"/>
  <text class="g" x="80" y="148" fill="var(--accent)">Down a few</text>
  <line x1="200" y1="210" x2="800" y2="210" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="180" y="238">0</text>
  <text class="b" x="790" y="238">1</text>
  <circle cx="680" cy="210" r="10" fill="var(--accent)" opacity="0.35"/>
  <circle cx="620" cy="210" r="10" fill="var(--accent)"/>
  <path d="M 668 190 C 650 172 638 172 625 190" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M 619 196 L 621 180 L 634 188 Z" fill="var(--accent)"/>

  <rect x="60" y="280" width="840" height="140" rx="12" fill="var(--card)"/>
  <text class="g" x="80" y="318" fill="var(--warn)">Zeroed</text>
  <line x1="200" y1="380" x2="800" y2="380" stroke="var(--grey)" stroke-width="2"/>
  <circle cx="680" cy="380" r="10" fill="var(--grey)"/>
  <line x1="195" y1="365" x2="225" y2="395" stroke="var(--warn)" stroke-width="4"/>
  <line x1="225" y1="365" x2="195" y2="395" stroke="var(--warn)" stroke-width="4"/>
  <path d="M 660 400 C 500 430 320 420 230 398" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>
  <text class="b" x="420" y="440">Next time, start from zero</text>

  <text class="k" x="60" y="490">Worth only its points</text>
</svg>
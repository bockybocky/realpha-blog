<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩端之間一條繞遠的長弧與一條筆直的短線並列，對比搭飛機送程式碼與衛星線路">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">同樣兩端，兩條路</text>
<rect x="90" y="250" width="160" height="80" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="170" y="298" text-anchor="middle" font-size="20" fill="var(--ink)">邦加羅爾</text>
<rect x="710" y="250" width="160" height="80" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="790" y="298" text-anchor="middle" font-size="20" fill="var(--ink)">美國客戶</text>
<path d="M250 265 C330 100 630 100 710 265" stroke="var(--grey)" stroke-width="3" fill="none" stroke-dasharray="10 8"/>
<text x="480" y="128" text-anchor="middle" font-size="19" fill="var(--dim)">程式碼裝袋 · 真人搭飛機</text>
<text x="480" y="155" text-anchor="middle" font-size="16" fill="var(--dim)">來回數日</text>
<path d="M250 315 L710 315" stroke="var(--accent)" stroke-width="4" fill="none"/>
<circle cx="480" cy="315" r="9" fill="var(--accent)"/>
<text x="480" y="365" text-anchor="middle" font-size="19" fill="var(--ink)">衛星資料線路 · 1985</text>
<text x="480" y="470" text-anchor="middle" font-size="22" fill="var(--ink)">物理瓶頸拆掉，模式才跑得動</text>
</svg>
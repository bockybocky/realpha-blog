<svg xmlns="http://www.w3.org/2000/svg" id="fig-foundation" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four pillars standing on one floor with a downward arrow beneath it">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
#fig-foundation text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-foundation .h { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-foundation .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-foundation .b { font-size:16px; fill:var(--dim); }
#fig-foundation .s { font-size:15px; fill:var(--dim); }
#fig-foundation .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="h" x="60" y="54">Four facts, one floor</text>
<rect x="130" y="140" width="150" height="190" rx="8" fill="var(--accent)"/>
<text class="b" x="205" y="220" text-anchor="middle" fill="var(--page)">Correlation</text>
<text class="b" x="205" y="248" text-anchor="middle" fill="var(--page)">10-yr low</text>
<rect x="300" y="140" width="150" height="190" rx="8" fill="var(--accent)"/>
<text class="b" x="375" y="220" text-anchor="middle" fill="var(--page)">Volatility</text>
<text class="b" x="375" y="248" text-anchor="middle" fill="var(--page)">Low</text>
<rect x="470" y="140" width="150" height="190" rx="8" fill="var(--accent)"/>
<text class="b" x="545" y="220" text-anchor="middle" fill="var(--page)">Huge</text>
<text class="b" x="545" y="248" text-anchor="middle" fill="var(--page)">Capex</text>
<rect x="640" y="140" width="150" height="190" rx="8" fill="var(--accent)"/>
<text class="b" x="715" y="220" text-anchor="middle" fill="var(--page)">Equity &amp; debt</text>
<text class="b" x="715" y="248" text-anchor="middle" fill="var(--page)">Expanding</text>
<rect x="100" y="340" width="720" height="60" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="460" y="378" text-anchor="middle">Premise: no recession in 5 yrs</text>
<path d="M 460 410 L 460 452" stroke="var(--warn)" stroke-width="6"/>
<path d="M 460 476 L 444 446 L 476 446 Z" fill="var(--warn)"/>
<text class="b" x="500" y="460" fill="var(--warn)">Floor drops, all move</text>
<text class="c" x="60" y="528">One assumption, not diversified</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊三個獨立來源匯向我，右邊三條線其實收束到同一個來源">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">三個人說，不等於三個來源</text>

<text class="t" x="48" y="130" font-size="20" font-weight="700" fill="var(--accent)">聽起來像這樣</text>
<circle cx="110" cy="190" r="16" fill="var(--accent)"/>
<circle cx="110" cy="260" r="16" fill="var(--accent)"/>
<circle cx="110" cy="330" r="16" fill="var(--accent)"/>
<line x1="128" y1="190" x2="330" y2="260" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="128" y1="260" x2="330" y2="260" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="128" y1="330" x2="330" y2="260" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="350" cy="260" r="22" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="350" y="320" font-size="16" fill="var(--ink)" text-anchor="middle">我</text>

<line x1="480" y1="110" x2="480" y2="430" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="530" y="130" font-size="20" font-weight="700" fill="var(--warn)">其實是這樣</text>
<circle cx="570" cy="260" r="16" fill="var(--warn)"/>
<line x1="588" y1="260" x2="730" y2="190" stroke="var(--warn)" stroke-width="2.5"/>
<line x1="588" y1="260" x2="730" y2="260" stroke="var(--warn)" stroke-width="2.5"/>
<line x1="588" y1="260" x2="730" y2="330" stroke="var(--warn)" stroke-width="2.5"/>
<circle cx="748" cy="190" r="13" fill="var(--grey)"/>
<circle cx="748" cy="260" r="13" fill="var(--grey)"/>
<circle cx="748" cy="330" r="13" fill="var(--grey)"/>
<line x1="766" y1="190" x2="870" y2="260" stroke="var(--grey)" stroke-width="2.5"/>
<line x1="766" y1="260" x2="870" y2="260" stroke="var(--grey)" stroke-width="2.5"/>
<line x1="766" y1="330" x2="870" y2="260" stroke="var(--grey)" stroke-width="2.5"/>
<circle cx="890" cy="260" r="22" fill="none" stroke="var(--dim)" stroke-width="3"/>
<text class="t" x="570" y="320" font-size="16" fill="var(--warn)" text-anchor="middle">同一個圈子</text>
<text class="t" x="890" y="320" font-size="16" fill="var(--ink)" text-anchor="middle">我</text>

<text class="t" x="48" y="498" font-size="22" font-weight="700" fill="var(--ink)">往回收束到一點，就還是傳聞</text>
</svg>
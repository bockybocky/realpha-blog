<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="攻擊路徑第一條被擋住後自己折回繞出第二條，約二十分鐘後抵達憑證，中途沒有人介入">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">擋掉一條，它自己找下一條</text>
<circle cx="100" cy="250" r="16" fill="var(--accent)"/>
<text x="100" y="304" font-size="16" fill="var(--dim)" text-anchor="middle">代理進場</text>
<path d="M116 250 L 300 250 L 360 190" fill="none" stroke="var(--grey)" stroke-width="4" stroke-dasharray="9 7"/>
<rect x="372" y="150" width="18" height="90" fill="var(--grey)"/>
<path d="M352 182 L 382 212 M382 182 L 352 212" stroke="var(--warn)" stroke-width="5"/>
<text x="406" y="178" font-size="16" fill="var(--dim)">第一條被擋</text>
<path d="M300 250 L 360 330 L 560 330 L 640 254" fill="none" stroke="var(--accent)" stroke-width="6"/>
<text x="406" y="368" font-size="16" fill="var(--accent)">自己寫程式、自己找洞</text>
<rect x="656" y="208" width="214" height="90" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="763" y="244" font-size="20" fill="var(--ink)" text-anchor="middle">關鍵系統憑證</text>
<text x="763" y="272" font-size="16" fill="var(--dim)" text-anchor="middle">全部解得開</text>
<line x1="100" y1="440" x2="870" y2="440" stroke="var(--line)" stroke-width="2"/>
<circle cx="100" cy="440" r="5" fill="var(--dim)"/>
<circle cx="763" cy="440" r="5" fill="var(--accent)"/>
<text x="100" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">0 分</text>
<text x="763" y="470" font-size="16" fill="var(--accent)" text-anchor="middle">約 20 分</text>
<text x="430" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">中間沒有人指揮</text>
</g>
</svg>
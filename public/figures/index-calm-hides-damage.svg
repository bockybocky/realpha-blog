<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩根向下柱子，標普淺、投機性指數深到幾乎一半">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" fill="var(--ink)">你問的是哪一個市場？</text>
<line x1="60" y1="150" x2="900" y2="150" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="140" font-size="15" fill="var(--dim)">高點</text>

<text x="200" y="128" font-size="20" fill="var(--dim)">標普 500</text>
<rect x="200" y="150" width="160" height="56" fill="var(--grey)"/>
<text x="200" y="232" font-size="19" fill="var(--dim)">兩成半</text>

<text x="560" y="128" font-size="20" fill="var(--accent)">投機性標的指數</text>
<rect x="560" y="150" width="160" height="246" fill="var(--accent)"/>
<text x="560" y="422" font-size="19" fill="var(--accent)">44%</text>
<text x="60" y="488" font-size="22" fill="var(--ink)">指數的平靜，蓋住了台面下多數持股人的帳面</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The authorisation code reaches only the local callback on the original computer; the paths to another device and to an automated browser are cut.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--accent)"/>
    </marker>
  </defs>

  <text class="t" x="40" y="54" font-size="27" fill="var(--ink)">The code can only land back where it started</text>

  <rect x="360" y="96" width="240" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="480" y="134" font-size="19" fill="var(--ink)" text-anchor="middle">Official authorisation page</text>

  <path d="M372 158 C 300 210 250 240 232 280" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#a2)"/>
  <text class="t" x="248" y="212" font-size="15" fill="var(--accent)" text-anchor="middle">Auth code</text>

  <rect x="70" y="288" width="330" height="184" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="96" y="322" font-size="19" fill="var(--accent)">That computer</text>
  <circle cx="232" cy="300" r="9" fill="var(--accent)"/>
  <rect x="104" y="348" width="126" height="56" rx="8" fill="var(--page)" stroke="var(--line)"/>
  <text class="t" x="167" y="382" font-size="16" fill="var(--ink)" text-anchor="middle">Browser</text>
  <rect x="248" y="348" width="126" height="56" rx="8" fill="var(--page)" stroke="var(--line)"/>
  <text class="t" x="311" y="382" font-size="16" fill="var(--ink)" text-anchor="middle">Local callback</text>
  <text class="t" x="104" y="440" font-size="16" fill="var(--dim)">A person present</text>

  <path d="M596 152 C 660 190 690 220 700 264" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="7 6"/>
  <line x1="676" y1="200" x2="700" y2="224" stroke="var(--warn)" stroke-width="3"/>
  <line x1="700" y1="200" x2="676" y2="224" stroke="var(--warn)" stroke-width="3"/>
  <rect x="600" y="276" width="290" height="76" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="745" y="308" font-size="19" fill="var(--ink)" text-anchor="middle">Another device</text>
  <text class="t" x="745" y="334" font-size="15" fill="var(--dim)" text-anchor="middle">Callback address is not here</text>

  <path d="M604 160 C 700 210 800 300 830 380" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="7 6"/>
  <line x1="806" y1="322" x2="830" y2="346" stroke="var(--warn)" stroke-width="3"/>
  <line x1="830" y1="322" x2="806" y2="346" stroke="var(--warn)" stroke-width="3"/>
  <rect x="600" y="392" width="290" height="76" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="745" y="424" font-size="19" fill="var(--ink)" text-anchor="middle">Automated browser</text>
  <text class="t" x="745" y="450" font-size="15" fill="var(--dim)" text-anchor="middle">Stopped by anti-bot checks</text>

  <text class="t" x="40" y="524" font-size="22" fill="var(--ink)">It is stuck by design: someone has to be there</text>
</svg>
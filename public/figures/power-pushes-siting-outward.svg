<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同心圓的內圈是市區、電被搶且變電所蓋不起來，一支箭頭把資料中心推到外圈，外圈標示沒人搶電、用地夠大">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">把電填進去，奇怪的選址就說得通</text>

  <circle cx="380" cy="290" r="210" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="380" cy="290" r="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="336" y="284">市區</text>
  <text class="b" x="306" y="312">商辦廠辦都在搶電</text>
  <text class="b" x="248" y="150">變電所抗議多年蓋不起來</text>
  <text class="b" x="248" y="470">蓋在機場旁沒人會贊成</text>

  <circle cx="380" cy="290" r="14" fill="var(--grey)"/>
  <path d="M400 282 L700 240" stroke="var(--accent)" stroke-width="5" fill="none"/>
  <path d="M700 240 l-18 -3 l3 18 z" fill="var(--accent)"/>

  <rect x="700" y="196" width="200" height="92" rx="10" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text class="g" x="722" y="232" fill="var(--accent)">資料中心</text>
  <text class="b" x="722" y="262">越遠越好</text>

  <text class="g" x="700" y="330">外圈有的東西</text>
  <text class="b" x="700" y="360">沒人跟它搶電</text>
  <text class="b" x="700" y="386">用地夠大</text>
  <text class="b" x="700" y="412">通水・通電・通路</text>

  <text class="c" x="60" y="524">瓶頸是電跟能開工的空間，不是地價</text>
</svg>
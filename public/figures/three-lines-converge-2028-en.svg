<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Three separate curves converge rightward onto the 2028 point of a timeline, beside a pair of boxes contrasting one empty column with one filled in.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">3 lines converge</text>
<path d="M120,150 Q450,165 752,406" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M120,215 Q450,245 750,410" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M120,280 Q450,322 746,412" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text x="124" y="136" font-size="16" fill="var(--dim)">Fabs online</text>
<text x="124" y="201" font-size="16" fill="var(--dim)">Data centers run</text>
<text x="124" y="266" font-size="16" fill="var(--dim)">Power eases</text>
<line x1="100" y1="420" x2="866" y2="420" stroke="var(--line)" stroke-width="2"/>
<polygon points="866,414 882,420 866,426" fill="var(--line)"/>
<line x1="200" y1="410" x2="200" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="460" y1="410" x2="460" y2="430" stroke="var(--line)" stroke-width="2"/>
<circle cx="760" cy="420" r="15" fill="var(--accent)"/>
<text x="200" y="456" text-anchor="middle" font-size="19" fill="var(--dim)">2026</text>
<text x="460" y="456" text-anchor="middle" font-size="19" fill="var(--dim)">2027</text>
<text x="760" y="456" text-anchor="middle" font-size="20" fill="var(--accent)">2028</text>
<rect x="110" y="488" width="220" height="58" rx="10" fill="none" stroke="var(--grey)" stroke-dasharray="6 6"/>
<text x="220" y="523" text-anchor="middle" font-size="16" fill="var(--dim)">6mo ago: —</text>
<rect x="356" y="488" width="220" height="58" rx="10" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="466" y="523" text-anchor="middle" font-size="16" fill="var(--ink)">Now: assumptions</text>
<text x="880" y="528" text-anchor="end" font-size="22" fill="var(--ink)">Fear sits here</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上下兩股箭頭往中間擠，夾出一條橫在中間的粗線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">兩個好意，夾出一面牆</text>
<rect x="200" y="110" width="560" height="78" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="230" y="146" font-size="20" font-weight="700" fill="var(--ink)">上司</text>
<text x="230" y="172" font-size="16" fill="var(--dim)">辛苦・可憐・別勉強</text>
<line x1="480" y1="196" x2="480" y2="248" stroke="var(--accent)" stroke-width="4"/>
<path d="M480 262 l-11 -18 h22 z" fill="var(--accent)"/>
<rect x="200" y="272" width="560" height="16" rx="4" fill="var(--warn)"/>
<text x="780" y="286" font-size="20" font-weight="700" fill="var(--warn)">天花板</text>
<line x1="480" y1="360" x2="480" y2="310" stroke="var(--accent)" stroke-width="4"/>
<path d="M480 296 l-11 18 h22 z" fill="var(--accent)"/>
<rect x="200" y="372" width="560" height="78" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="230" y="408" font-size="20" font-weight="700" fill="var(--ink)">本人</text>
<text x="230" y="434" font-size="16" fill="var(--dim)">不夠・做不到・運氣</text>
<text x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">沒有人動手，牆卻在</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Cross-section: the copper trace is only the small circle at the center, while the signal rides as a sleeve around it, inside the resin-impregnated cloth outside the copper.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="66">Signals don't run inside the copper</text>

  <rect x="120" y="120" width="620" height="34" fill="var(--grey)"/>
  <text class="g" x="770" y="143">Copper</text>

  <rect x="120" y="154" width="620" height="220" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="770" y="250">Prepreg</text>
  <text class="d" x="770" y="276">Dielectric</text>

  <rect x="120" y="374" width="620" height="34" fill="var(--grey)"/>
  <text class="g" x="770" y="397">Copper</text>

  <ellipse cx="430" cy="264" rx="150" ry="78" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <ellipse cx="430" cy="264" rx="104" ry="52" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="430" cy="264" r="26" fill="var(--grey)"/>
  <text class="g" x="430" y="272" text-anchor="middle">Trace</text>

  <text class="g" x="610" y="196" fill="var(--accent)">Signal</text>
  <text class="d" x="610" y="222">Wraps around the trace</text>

  <text class="d" x="180" y="200">Copper only guides it</text>

  <text class="c" x="60" y="470">Speed is set by the cloth, not the copper</text>
  <text class="d" x="60" y="506">So "how fast is the board" is a materials question</text>
</svg>
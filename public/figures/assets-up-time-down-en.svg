<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two crossing lines, one rising and one falling, opening like scissors">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600;fill:var(--dim)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">Assets up, free time down</text>
<line x1="140" y1="440" x2="860" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="130" x2="140" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="396" x2="800" y2="176" stroke="var(--accent)" stroke-width="4"/>
<line x1="140" y1="200" x2="800" y2="412" stroke="var(--warn)" stroke-width="4"/>
<circle cx="443" cy="296" r="7" fill="var(--ink)"/>
<text class="g" x="812" y="182" fill="var(--accent)">Assets</text>
<text class="g" x="812" y="418" fill="var(--warn)">Time</text>
<text class="b" x="140" y="472">From labor to assets</text>
<text class="c" x="60" y="510">No freedom means a wrong goal</text>
</svg>
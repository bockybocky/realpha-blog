<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="前後對比橫條：上條分成本業與持股估值兩段，估值段將近一半；下條只剩本業那段，右半變成虛線空框。"><rect x="0" y="0" width="960" height="540" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:19px;font-weight:600}.b{font-size:16px;fill:var(--dim)}.k{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}
</style>
<text x="480" y="52" text-anchor="middle" class="t">巨頭獲利裡，近一半是帳面增值</text>
<text x="80" y="132" class="g">五大巨頭第二季稅前淨利</text>
<text x="880" y="132" text-anchor="end" class="g">3500 億美元</text>
<rect x="80" y="150" width="440" height="80" fill="var(--accent)"/>
<rect x="520" y="150" width="360" height="80" fill="var(--warn)"/>
<text x="300" y="198" text-anchor="middle" class="g" style="fill:var(--page)">本業 約 55%</text>
<text x="700" y="198" text-anchor="middle" class="g" style="fill:var(--page)">持股估值 近 45%</text>
<text x="700" y="258" text-anchor="middle" class="b">列在「其他收益」</text>
<text x="80" y="312" class="g">扣掉估值認列後</text>
<rect x="80" y="330" width="440" height="80" fill="var(--accent)"/>
<rect x="520" y="330" width="360" height="80" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text x="300" y="378" text-anchor="middle" class="g" style="fill:var(--page)">本業</text>
<text x="700" y="378" text-anchor="middle" class="g w">扣掉</text>
<text x="480" y="490" text-anchor="middle" class="k">看本業，先扣這一行</text>
</svg>
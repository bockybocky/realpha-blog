<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上方一個方塊往左右分岔，左邊三個重複的叉，右邊三個由大到小的方塊">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">一直賠，先分清楚是哪一種</text>
<rect x="380" y="100" width="200" height="60" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="138" font-size="16" fill="var(--ink)" text-anchor="middle">連續不管用</text>
<line x1="420" y1="160" x2="250" y2="222" stroke="var(--line)" stroke-width="2"/>
<line x1="540" y1="160" x2="710" y2="222" stroke="var(--line)" stroke-width="2"/>
<line x1="480" y1="250" x2="480" y2="450" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="90" y="252" font-size="20" fill="var(--dim)">執行走樣</text>
<g stroke="var(--warn)" stroke-width="4" stroke-linecap="round">
<line x1="132" y1="300" x2="164" y2="332"/><line x1="164" y1="300" x2="132" y2="332"/>
<line x1="212" y1="300" x2="244" y2="332"/><line x1="244" y1="300" x2="212" y2="332"/>
<line x1="292" y1="300" x2="324" y2="332"/><line x1="324" y1="300" x2="292" y2="332"/>
</g>
<text x="90" y="376" font-size="16" fill="var(--dim)">同一個錯重複出現</text>
<circle cx="150" cy="424" r="20" fill="none" stroke="var(--accent)" stroke-width="3"/>
<line x1="230" y1="424" x2="182" y2="424" stroke="var(--accent)" stroke-width="3"/>
<polygon points="172,424 190,417 190,431" fill="var(--accent)"/>
<text x="250" y="432" font-size="20" fill="var(--accent)">修自己</text>
<text x="620" y="252" font-size="20" fill="var(--dim)">環境換了</text>
<rect x="620" y="284" width="96" height="56" rx="8" fill="none" stroke="var(--accent)" stroke-width="3"/>
<rect x="736" y="296" width="64" height="38" rx="6" fill="none" stroke="var(--accent)" stroke-width="3"/>
<rect x="820" y="304" width="40" height="24" rx="5" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="620" y="376" font-size="16" fill="var(--dim)">每步照紀律，還是被修理</text>
<text x="620" y="432" font-size="20" fill="var(--accent)">縮規模，繼續做</text>
<text x="60" y="500" font-size="22" fill="var(--ink)">兩邊的處方相反，弄錯了會愈修愈糟</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右對比，左邊高牆後的空地只有一個人，右邊牆被削矮後同一塊地擠滿了人">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">難度被外包，牆後就不再空著</text>

<text x="60" y="112" font-size="19" fill="var(--dim)">以前：牆很高</text>
<line x1="60" y1="430" x2="450" y2="430" stroke="var(--line)" stroke-width="3"/>
<rect x="200" y="150" width="44" height="280" fill="var(--grey)"/>
<circle cx="222" cy="132" r="11" fill="var(--dim)"/>
<line x1="222" y1="143" x2="222" y2="150" stroke="var(--dim)" stroke-width="2"/>
<text x="260" y="138" font-size="15" fill="var(--dim)">靠難度收租</text>
<circle cx="380" cy="404" r="10" fill="var(--grey)"/>
<line x1="380" y1="414" x2="380" y2="430" stroke="var(--grey)" stroke-width="2"/>
<text x="380" y="462" font-size="15" fill="var(--dim)" text-anchor="middle">沒什麼人來</text>

<text x="510" y="112" font-size="19" fill="var(--dim)">現在：牆被削矮</text>
<line x1="510" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="3"/>
<rect x="650" y="150" width="44" height="210" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="708" y="204" font-size="15" fill="var(--dim)">AI 扛掉的部分</text>
<rect x="650" y="360" width="44" height="70" fill="var(--accent)"/>
<circle cx="740" cy="404" r="10" fill="var(--accent)"/>
<line x1="740" y1="414" x2="740" y2="430" stroke="var(--accent)" stroke-width="2"/>
<circle cx="772" cy="404" r="10" fill="var(--accent)"/>
<line x1="772" y1="414" x2="772" y2="430" stroke="var(--accent)" stroke-width="2"/>
<circle cx="804" cy="404" r="10" fill="var(--accent)"/>
<line x1="804" y1="414" x2="804" y2="430" stroke="var(--accent)" stroke-width="2"/>
<circle cx="836" cy="404" r="10" fill="var(--accent)"/>
<line x1="836" y1="414" x2="836" y2="430" stroke="var(--accent)" stroke-width="2"/>
<circle cx="868" cy="404" r="10" fill="var(--accent)"/>
<line x1="868" y1="414" x2="868" y2="430" stroke="var(--accent)" stroke-width="2"/>
<text x="804" y="462" font-size="15" fill="var(--dim)" text-anchor="middle">一次全回來</text>

<text x="60" y="512" font-size="22" fill="var(--ink)">靠「很難」撐起來的價值，跟著難度一起消失</text>
</svg>
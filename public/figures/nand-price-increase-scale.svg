<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一根很長的長條與兩根很短的長條並列，顯示上半年漲幅遠超過產業常態">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">漲幅「趨緩」，是回到哪裡</text>
<line x1="258" y1="120" x2="258" y2="410" stroke="var(--line)" stroke-width="2"/>
<text x="240" y="176" font-size="19" text-anchor="end" fill="var(--ink)">上半年 實際</text>
<rect x="260" y="146" width="620" height="56" rx="6" fill="var(--accent)"/>
<text x="866" y="182" font-size="16" text-anchor="end" fill="var(--page)">每季 +80～100%</text>
<text x="240" y="276" font-size="19" text-anchor="end" fill="var(--ink)">下半年 預估</text>
<rect x="260" y="246" width="80" height="56" rx="6" fill="var(--accent)"/>
<text x="356" y="282" font-size="16" fill="var(--ink)">每季 +低雙位數</text>
<text x="240" y="376" font-size="19" text-anchor="end" fill="var(--ink)">過去的「大事」</text>
<rect x="260" y="346" width="32" height="56" rx="6" fill="var(--grey)"/>
<text x="308" y="376" font-size="16" fill="var(--ink)">每季 +5%</text>
<text x="308" y="399" font-size="15" fill="var(--dim)">整個產業會震動的水準</text>
<rect x="60" y="444" width="840" height="76" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="491" font-size="22" text-anchor="middle" fill="var(--ink)">慢下來，不是停下來</text>
</svg>
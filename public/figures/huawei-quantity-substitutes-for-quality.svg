<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊少數高柱與右邊大量矮柱綁成一組，兩邊頂到同一條水平線">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">單顆矮，就綁更多、連更緊</text>

<line x1="48" y1="150" x2="912" y2="150" stroke="var(--accent)" stroke-width="2" stroke-dasharray="10 8"/>
<text class="t" x="912" y="138" font-size="16" fill="var(--accent)" text-anchor="end">撐起一次大規模預訓練所需</text>
<line x1="48" y1="400" x2="912" y2="400" stroke="var(--line)" stroke-width="2"/>

<rect x="110" y="150" width="54" height="250" rx="6" fill="var(--grey)"/>
<rect x="194" y="150" width="54" height="250" rx="6" fill="var(--grey)"/>
<rect x="278" y="150" width="54" height="250" rx="6" fill="var(--grey)"/>
<text class="t" x="221" y="436" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">對手：少而高</text>
<text class="t" x="221" y="464" font-size="16" fill="var(--dim)" text-anchor="middle">單顆效率與算力領先</text>

<rect x="528" y="134" width="372" height="282" rx="12" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="12 8"/>
<rect x="548" y="300" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="584" y="300" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="620" y="300" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="656" y="300" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="692" y="300" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="728" y="300" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="764" y="300" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="800" y="300" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="836" y="300" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="548" y="186" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="584" y="186" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="620" y="186" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="656" y="186" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="692" y="186" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="728" y="186" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="764" y="186" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="800" y="186" width="26" height="100" rx="4" fill="var(--accent)"/>
<rect x="836" y="186" width="26" height="100" rx="4" fill="var(--accent)"/>
<line x1="548" y1="293" x2="862" y2="293" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="714" y="436" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">昇騰：多而矮，綁成超節點</text>
<text class="t" x="714" y="464" font-size="16" fill="var(--dim)" text-anchor="middle">靠網通本業把連線堆密</text>

<line x1="48" y1="494" x2="912" y2="494" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="480" y="532" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">以量補質要先有量</text>
</svg>
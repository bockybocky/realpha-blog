<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Left: a bar comparison of 1.2 million units expected against 340,000 actual; right: a timeline running from the unified standard in 1995 through three events in 1998, 1999 and 2000 before reaching parity with videotape in 2001.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">The roadblock is gone, the car still isn't moving</text>

<line x1="60" y1="330" x2="330" y2="330" stroke="var(--line)" stroke-width="2"/>
<rect x="90" y="130" width="80" height="200" fill="var(--grey)" opacity="0.5"/>
<text x="130" y="118" font-size="16" fill="var(--dim)" text-anchor="middle">1.2M expected</text>
<rect x="220" y="273" width="80" height="57" fill="var(--warn)" opacity="0.85"/>
<text x="260" y="261" font-size="16" fill="var(--warn)" text-anchor="middle">340,000 actual</text>
<text x="195" y="362" font-size="15" fill="var(--dim)" text-anchor="middle">End of 1997 · US</text>

<line x1="430" y1="150" x2="430" y2="470" stroke="var(--line)" stroke-width="3"/>

<circle cx="430" cy="170" r="8" fill="var(--accent)"/>
<text x="462" y="166" font-size="19" fill="var(--ink)">Aug 1995 · one standard</text>
<text x="462" y="192" font-size="15" fill="var(--dim)">Barrier removed</text>

<circle cx="430" cy="266" r="7" fill="var(--grey)"/>
<text x="462" y="272" font-size="16" fill="var(--dim)">1998 · mail-order rental</text>
<circle cx="430" cy="330" r="7" fill="var(--grey)"/>
<text x="462" y="336" font-size="16" fill="var(--dim)">1999 · $200 players</text>
<circle cx="430" cy="394" r="7" fill="var(--grey)"/>
<text x="462" y="400" font-size="16" fill="var(--dim)">2000 · consoles bring volume</text>

<circle cx="430" cy="470" r="8" fill="var(--accent)"/>
<text x="462" y="476" font-size="19" fill="var(--ink)">2001 · level with videotape</text>

<text x="60" y="534" font-size="22" fill="var(--ink)">What was missing in those six years wasn't a standard</text>
</svg>
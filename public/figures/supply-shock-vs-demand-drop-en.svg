<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A very tall supply-shock bar strikes a three-layer buffer wall and leaves behind only a very short demand-drop bar.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">The height of the shock, and what it bought</text>

  <rect x="90" y="110" width="150" height="330" rx="6" fill="var(--warn)" opacity="0.85"/>
  <text class="t" x="165" y="470" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Supply lost</text>
  <text class="t" x="165" y="496" font-size="16" text-anchor="middle" fill="var(--dim)">2.8 bn bbl crude</text>
  <text class="t" x="165" y="518" font-size="16" text-anchor="middle" fill="var(--dim)">60 bcm gas</text>
  <text class="t" x="165" y="96" font-size="16" text-anchor="middle" fill="var(--warn)">Largest ever</text>

  <rect x="400" y="110" width="22" height="330" fill="var(--grey)"/>
  <rect x="432" y="110" width="22" height="330" fill="var(--grey)" opacity="0.75"/>
  <rect x="464" y="110" width="22" height="330" fill="var(--grey)" opacity="0.5"/>
  <text class="t" x="443" y="96" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Buffers</text>
  <text class="t" x="510" y="200" font-size="16" fill="var(--dim)">Full stocks + 400 mn bbl released</text>
  <text class="t" x="510" y="232" font-size="16" fill="var(--dim)">Atlantic basin supply growth</text>
  <text class="t" x="510" y="264" font-size="16" fill="var(--dim)">China buying less mid-year</text>

  <path d="M250 275 L392 275" stroke="var(--warn)" stroke-width="5" fill="none"/>
  <path d="M392 275 l-16 -9 l0 18 z" fill="var(--warn)"/>
  <path d="M494 275 L772 275" stroke="var(--accent)" stroke-width="3" fill="none"/>
  <path d="M772 275 l-14 -8 l0 16 z" fill="var(--accent)"/>

  <rect x="790" y="412" width="110" height="28" rx="5" fill="var(--accent)"/>
  <text class="t" x="845" y="470" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Demand drop</text>
  <text class="t" x="845" y="496" font-size="16" text-anchor="middle" fill="var(--dim)">2.5%</text>
  <line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="545" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">Outage size ≠ demand loss size</text>
</svg>
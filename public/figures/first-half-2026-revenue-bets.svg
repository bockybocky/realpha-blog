<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="數線上三個標記由低到高排列，底線與市場期待之間隔著很寬的一段距離">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">2026 上半年營收：兩個人押的位置（億美元）</text>
<rect x="100" y="300" width="253" height="26" fill="var(--warn)" opacity="0.28"/>
<rect x="353" y="300" width="444" height="26" fill="var(--accent)" opacity="0.22"/>
<line x1="100" y1="313" x2="900" y2="313" stroke="var(--line)" stroke-width="3"/>
<line x1="353" y1="250" x2="353" y2="376" stroke="var(--warn)" stroke-width="3"/>
<circle cx="353" cy="313" r="10" fill="var(--warn)"/>
<text class="g" x="320" y="238">200</text>
<text class="d" x="258" y="404">Tim 的底線</text>
<text class="d" x="238" y="428">低於此，承諾失去意義</text>
<line x1="543" y1="250" x2="543" y2="376" stroke="var(--accent)" stroke-width="3"/>
<circle cx="543" cy="313" r="10" fill="var(--accent)"/>
<text class="g" x="510" y="238">350</text>
<text class="d" x="500" y="404">Jon 預期</text>
<line x1="797" y1="250" x2="797" y2="376" stroke="var(--accent)" stroke-width="3"/>
<circle cx="797" cy="313" r="10" fill="var(--accent)"/>
<text class="g" x="764" y="238">550</text>
<text class="d" x="724" y="404">市場需要看到</text>
<text class="d" x="700" y="428">低於 500 會被質問</text>
<text class="d" x="100" y="348">0</text>
<text class="d" x="876" y="348">600</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條折線先大幅拉高再小幅回落，回落後的位置仍遠高於起點">
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px}
    .b{font-size:15px;fill:var(--dim)}
    .c{font-size:22px}
  </style>
  <text class="t" x="40" y="58">貴金屬：兩年合起來看</text>
  <line x1="160" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M200 400 L520 180 L820 249" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="200" cy="400" r="6" fill="var(--ink)"/>
  <circle cx="520" cy="180" r="6" fill="var(--accent)"/>
  <circle cx="820" cy="249" r="6" fill="var(--warn)"/>
  <text class="c" x="300" y="268" fill="var(--accent)">+80%</text>
  <text class="c" x="672" y="196" fill="var(--warn)">−14%</text>
  <text class="b" x="200" y="428" text-anchor="middle">2025 年初</text>
  <text class="b" x="520" y="158" text-anchor="middle">2025 年底</text>
  <text class="b" x="820" y="282" text-anchor="middle">今年至今</text>
  <text class="b" x="40" y="478">−14% 的口徑只含黃金和銀，與 +80% 不同</text>
  <text class="c" x="40" y="514">回檔之後，位置還在高處</text>
</svg>
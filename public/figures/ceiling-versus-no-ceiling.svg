<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左格曲線被一條虛線天花板壓平，右格曲線一路衝出框外沒有天花板">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="48" y="54" font-size="27" font-weight="700" fill="var(--ink)">兩段的上限不一樣</text>
<rect x="48" y="92" width="416" height="340" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="496" y="92" width="416" height="340" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="72" y="130" font-size="20" font-weight="700" fill="var(--accent)">實質利率</text>
<text x="520" y="130" font-size="20" font-weight="700" fill="var(--warn)">期限溢價</text>
<line x1="72" y1="200" x2="440" y2="200" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="196" y="186" font-size="16" fill="var(--dim)">擔心衰退 · 政策空間受限</text>
<path d="M80 396 C 170 390, 230 290, 300 212 L 440 206" fill="none" stroke="var(--accent)" stroke-width="5"/>
<path d="M520 400 C 620 380, 700 300, 760 210 L 846 108" fill="none" stroke="var(--warn)" stroke-width="5"/>
<polygon points="862,86 836,112 858,126" fill="var(--warn)"/>
<text x="560" y="172" font-size="16" fill="var(--warn)">財政疑慮 · 沒有上限</text>
<text x="48" y="492" font-size="22" font-weight="700" fill="var(--ink)">要盯的是沒有天花板的那一段</text>
</g>
</svg>
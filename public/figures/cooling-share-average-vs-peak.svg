<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="冷氣在整體電力需求裡佔一小段，在尖峰需求裡佔掉將近三分之一">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">平均看不出來的壓力，在尖峰那一刻</text>

  <text class="t" x="60" y="150" font-size="20" font-weight="700" fill="var(--ink)">整體電力需求</text>
  <rect x="60" y="170" width="840" height="60" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="170" width="101" height="60" rx="6" fill="var(--accent)"/>
  <text class="t" x="180" y="208" font-size="19" font-weight="700" fill="var(--ink)">冷氣 12%</text>

  <text class="t" x="60" y="300" font-size="20" font-weight="700" fill="var(--ink)">尖峰需求</text>
  <rect x="60" y="320" width="840" height="60" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="320" width="252" height="60" rx="6" fill="var(--warn)"/>
  <text class="t" x="330" y="358" font-size="19" font-weight="700" fill="var(--ink)">冷氣 30%</text>

  <text class="t" x="60" y="430" font-size="16" fill="var(--dim)">中國以外的新興與開發中經濟體：85% 面對高溫，只有 20% 家戶有空調</text>
  <text class="t" x="480" y="492" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">熱浪來的時候，壓力從這一段出來</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條極長的橫條與一條極短的橫條對比">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="72">壞掉的那天，零件從哪裡來</text>
<text class="g" x="60" y="152">等補給</text>
<rect x="60" y="172" width="840" height="34" fill="var(--grey)"/>
<text class="b" x="60" y="236">四到五個月；壞著就不能練</text>
<text class="g" x="60" y="328">船上印</text>
<rect x="60" y="348" width="56" height="34" fill="var(--accent)"/>
<text class="b" x="132" y="374">12 天航程・1,200 個零件</text>
<text class="c" x="60" y="470">修得回來，能力才算存在</text>
</svg>
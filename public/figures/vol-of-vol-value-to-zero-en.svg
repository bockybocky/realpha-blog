<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left are three thin price lines: one rises on day one, exits and greys out, while the other two stay in and one of them falls deeply; on the right a tall bar of put value is carried by an arrow down to zero the moment the last name ticks up.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">Looks valuable, then zero in an instant</text>

<line x1="90" y1="300" x2="560" y2="300" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="b" x="90" y="288">Entry level</text>

<path d="M90 300 L150 224" stroke="var(--grey)" stroke-width="3" fill="none"/>
<circle cx="150" cy="224" r="8" fill="var(--grey)"/>
<path d="M150 224 L300 300 L450 400" stroke="var(--grey)" stroke-width="2" fill="none" stroke-dasharray="6 7" opacity="0.6"/>
<text class="b" x="166" y="212">Up on day one, gone</text>
<text class="b" x="330" y="398">its later falls do not matter</text>

<path d="M90 300 L220 360 L360 430 L500 420" stroke="var(--accent)" stroke-width="4" fill="none"/>
<text class="b" x="512" y="426">the one that fell hard</text>

<path d="M90 300 L220 318 L360 334 L500 314" stroke="var(--warn)" stroke-width="4" fill="none"/>
<text class="b" x="512" y="310">last one ticks up</text>

<rect x="700" y="170" width="100" height="250" rx="6" fill="var(--accent)" opacity="0.8"/>
<line x1="660" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="700" y="462" width="100" height="8" rx="3" fill="var(--grey)"/>
<text class="g" x="750" y="150" text-anchor="middle">Put value</text>
<text class="b" x="750" y="502" text-anchor="middle">note gone, value zero</text>

<path d="M840 200 C880 280 880 380 850 452" stroke="var(--warn)" stroke-width="4" fill="none"/>
<polygon points="844,440 852,462 836,456" fill="var(--warn)"/>
<text class="b" x="866" y="330">A tick up</text>

<text class="c" x="60" y="528">The volatility of volatility itself</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three bars sharing one first-crack point, with tail length increasing from light roast to dark roast.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="80" y="72" font-size="27" font-weight="700" fill="var(--ink)">Same first crack, the difference is how long you wait after it</text>

  <line x1="624" y1="110" x2="624" y2="430" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="624" y="100" font-size="19" font-weight="700" text-anchor="middle" fill="var(--accent)">First crack</text>

  <text x="178" y="172" font-size="20" font-weight="700" text-anchor="end" fill="var(--dim)">Light</text>
  <rect x="190" y="150" width="434" height="34" rx="5" fill="var(--card)" stroke="var(--line)"/>
  <rect x="624" y="150" width="68" height="34" rx="5" fill="var(--accent)" opacity="0.85"/>
  <text x="710" y="173" font-size="19" fill="var(--ink)">13%</text>
  <text x="820" y="173" font-size="16" fill="var(--warn)">Underdeveloped</text>

  <text x="178" y="252" font-size="20" font-weight="700" text-anchor="end" fill="var(--dim)">Medium</text>
  <rect x="190" y="230" width="434" height="34" rx="5" fill="var(--card)" stroke="var(--line)"/>
  <rect x="624" y="230" width="114" height="34" rx="5" fill="var(--accent)" opacity="0.85"/>
  <text x="756" y="253" font-size="19" fill="var(--ink)">21%</text>

  <text x="178" y="332" font-size="20" font-weight="700" text-anchor="end" fill="var(--dim)">Dark</text>
  <rect x="190" y="310" width="434" height="34" rx="5" fill="var(--card)" stroke="var(--line)"/>
  <rect x="624" y="310" width="220" height="34" rx="5" fill="var(--accent)" opacity="0.85"/>
  <text x="862" y="333" font-size="19" fill="var(--ink)">34%</text>
  <text x="700" y="372" font-size="16" fill="var(--warn)">Overdeveloped</text>

  <rect x="190" y="404" width="300" height="10" rx="5" fill="var(--grey)" opacity="0.5"/>
  <text x="500" y="414" font-size="15" fill="var(--dim)">Usual range 15% to 25%</text>

  <text x="80" y="500" font-size="22" font-weight="700" fill="var(--ink)">Same beans, the difference is that last stretch</text>
</svg>
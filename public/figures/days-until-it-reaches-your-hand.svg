<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條長度代表天數的橫條：現金幾乎沒有長度，額度約三天，答應過你的人是一條虛線一路延伸到問號"><rect x="0" y="0" width="960" height="520" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style><g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'><text x="60" y="58" font-size="27px" fill="var(--ink)" text-anchor="start" font-weight="600">從開口到東西到手，要幾天</text><line x1="300" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/><line x1="300" y1="400" x2="300" y2="412" stroke="var(--grey)" stroke-width="2"/><text x="300" y="436" font-size="16px" fill="var(--dim)" text-anchor="middle" font-weight="normal">0 天</text><line x1="480" y1="400" x2="480" y2="412" stroke="var(--grey)" stroke-width="2"/><text x="480" y="436" font-size="16px" fill="var(--dim)" text-anchor="middle" font-weight="normal">3 天</text><line x1="720" y1="400" x2="720" y2="412" stroke="var(--grey)" stroke-width="2"/><text x="720" y="436" font-size="16px" fill="var(--dim)" text-anchor="middle" font-weight="normal">7 天</text><text x="284" y="186" font-size="19px" fill="var(--dim)" text-anchor="end" font-weight="normal">現金</text><rect x="300" y="164" width="14" height="30" fill="var(--accent)"/><text x="284" y="266" font-size="19px" fill="var(--dim)" text-anchor="end" font-weight="normal">還沒用過的額度</text><rect x="300" y="244" width="180" height="30" fill="var(--accent)"/><text x="284" y="346" font-size="19px" fill="var(--dim)" text-anchor="end" font-weight="normal">答應過你的人</text><rect x="300" y="324" width="460" height="30" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/><text x="792" y="350" font-size="27px" fill="var(--warn)" text-anchor="start" font-weight="600">？</text><text x="300" y="136" font-size="16px" fill="var(--accent)" text-anchor="start" font-weight="normal">在你手上</text><text x="560" y="300" font-size="16px" fill="var(--warn)" text-anchor="middle" font-weight="normal">只是知道它存在</text><text x="60" y="480" font-size="22px" fill="var(--ink)" text-anchor="start" font-weight="600">寫得出天數，才算在你手上</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊單獨一格光罩面積，右邊十四格同尺寸光罩拼成一顆大晶片">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="50" text-anchor="middle">一次曝光的上限 vs 戰艦級晶片</text>
<text class="g" x="180" y="130" text-anchor="middle">一次曝光上限</text>
<text class="g" x="640" y="130" text-anchor="middle">戰艦級晶片</text>
<rect x="150" y="190" width="60" height="76" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="156" y="196" width="48" height="64" fill="var(--accent)" opacity="0.85"/>
<text class="c" x="180" y="310" text-anchor="middle">1 格</text>
<rect x="430" y="190" width="420" height="152" fill="var(--accent)" opacity="0.85"/>
<g stroke="var(--page)" stroke-width="2" stroke-dasharray="6 4">
<line x1="490" y1="190" x2="490" y2="342"/><line x1="550" y1="190" x2="550" y2="342"/><line x1="610" y1="190" x2="610" y2="342"/><line x1="670" y1="190" x2="670" y2="342"/><line x1="730" y1="190" x2="730" y2="342"/><line x1="790" y1="190" x2="790" y2="342"/>
<line x1="430" y1="266" x2="850" y2="266"/>
</g>
<rect x="430" y="190" width="420" height="152" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="c" x="640" y="386" text-anchor="middle">14 格</text>
<text class="c" x="480" y="470" text-anchor="middle" fill="var(--accent)">上限 1 格，晶片要 14 格</text>
</svg>
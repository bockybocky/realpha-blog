<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊走平的曲線被往回搶，右邊往上翹的曲線沿線長出新市場">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t h" x="60" y="70">兩種形狀</text>
<line x1="480" y1="110" x2="480" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="60" y="140">舊思維</text>
<path d="M80 400 C 180 400 200 220 300 200 C 360 190 400 188 430 186" fill="none" stroke="var(--grey)" stroke-width="5"/>
<polygon points="420,250 300,250 300,236 262,257 300,278 300,264 420,264" fill="var(--grey)"/>
<text class="t b" x="268" y="310">更便宜的方法來拿份額</text>
<text class="t g" x="520" y="140">能力指數往上</text>
<path d="M520 410 C 660 400 760 330 820 160" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="628" cy="392" r="8" fill="var(--accent)"/>
<text class="t b" x="580" y="430">聊天</text>
<circle cx="742" cy="330" r="8" fill="var(--accent)"/>
<text class="t b" x="756" y="336">寫程式</text>
<circle cx="806" cy="208" r="8" fill="var(--accent)"/>
<text class="t b" x="760" y="186">科學研究</text>
<text class="t c" x="60" y="500">成熟的那塊開始比價，所以要再開一塊</text>
</svg>
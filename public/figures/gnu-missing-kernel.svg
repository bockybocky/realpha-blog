<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩格對比，左邊堆疊中間空著一層虛線缺口，右邊缺口被填上">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">GNU 做完了外圈，缺中間那一層</text>

<text class="g" x="110" y="118">1990 年</text>
<rect x="110" y="140" width="340" height="56" rx="6" fill="var(--card)"/>
<text class="b" x="280" y="175" text-anchor="middle">編譯器</text>
<rect x="110" y="204" width="340" height="56" rx="6" fill="var(--card)"/>
<text class="b" x="280" y="239" text-anchor="middle">編輯器與工具鏈</text>
<rect x="110" y="268" width="340" height="68" rx="6" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 8"/>
<text class="n" x="280" y="310" text-anchor="middle" fill="var(--warn)">核心？</text>
<rect x="110" y="344" width="340" height="56" rx="6" fill="var(--grey)"/>
<text class="b" x="280" y="379" text-anchor="middle" fill="var(--page)">硬體</text>

<text class="g" x="510" y="118">1991 年</text>
<rect x="510" y="140" width="340" height="56" rx="6" fill="var(--card)"/>
<text class="b" x="680" y="175" text-anchor="middle">編譯器</text>
<rect x="510" y="204" width="340" height="56" rx="6" fill="var(--card)"/>
<text class="b" x="680" y="239" text-anchor="middle">編輯器與工具鏈</text>
<rect x="510" y="268" width="340" height="68" rx="6" fill="var(--accent)"/>
<text class="n" x="680" y="310" text-anchor="middle" fill="var(--page)">Linux 核心</text>
<rect x="510" y="344" width="340" height="56" rx="6" fill="var(--grey)"/>
<text class="b" x="680" y="379" text-anchor="middle" fill="var(--page)">硬體</text>

<text class="b" x="510" y="432">管記憶體、管 CPU 時間、管磁碟</text>
<text class="c" x="60" y="480">缺的不是最大的一塊，是唯一不能缺的</text>
</svg>
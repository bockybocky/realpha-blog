<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Several rebounds of similar height sit below one dashed line, and only the last clearly breaks above it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--dim); font-weight:700; }
    .ga { font-size:19px; fill:var(--accent); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="480" y="56" text-anchor="middle">What matters about a rebound is how rare it is</text>

  <line x1="90" y1="510" x2="910" y2="510" stroke="var(--line)" stroke-width="2"/>
  <line x1="110" y1="356" x2="640" y2="356" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="s" x="110" y="342">The size that shows up every few months</text>

  <path d="M 110 404 L 158 360 L 204 408 L 250 358 L 296 410 L 342 362 L 388 412 L 434 356 L 482 418 L 540 456 L 596 482 L 630 490"
        fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M 630 490 C 690 452 740 330 790 258 C 826 216 862 192 890 176"
        fill="none" stroke="var(--accent)" stroke-width="4"/>

  <text class="g" x="270" y="452">Frequent, similar size</text>
  <text class="ga" x="700" y="196">Once in a year or two</text>

  <text class="c" x="480" y="552" text-anchor="middle">You can judge relative position, not absolute</text>
</svg>
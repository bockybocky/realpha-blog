<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三層堆疊，最脆的一層在最底部，箭頭從底部往上貫穿">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">最脆的一層在最下面</text>

<rect x="150" y="96" width="560" height="96" rx="12" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<text x="180" y="140" font-size="20" font-weight="700" fill="var(--ink)">衛星本體</text>
<text x="180" y="168" font-size="16" fill="var(--dim)">封閉的鐵殼</text>
<text x="740" y="152" font-size="19" font-weight="700" fill="var(--grey)">難進</text>

<rect x="150" y="216" width="560" height="96" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="180" y="260" font-size="20" font-weight="700" fill="var(--ink)">星間鏈路</text>
<text x="180" y="288" font-size="16" fill="var(--dim)">衛星與衛星之間</text>

<rect x="150" y="336" width="560" height="120" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<rect x="150" y="376" width="22" height="44" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
<text x="196" y="382" font-size="20" font-weight="700" fill="var(--ink)">地面系統</text>
<text x="196" y="414" font-size="16" fill="var(--dim)">指管網路　任務處理</text>
<text x="740" y="406" font-size="19" font-weight="700" fill="var(--warn)">容易進</text>

<polygon points="96,456 118,456 118,140 136,140 107,92 78,140 96,140" fill="var(--warn)"/>
<text x="60" y="486" font-size="16" fill="var(--warn)">對手從這裡進</text>

<text x="60" y="520" font-size="22" font-weight="700" fill="var(--ink)">門開在最底層，眼睛卻一直看最上層。</text>
</svg>
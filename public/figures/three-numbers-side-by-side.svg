<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三根直條，最左最高，中間與最右幾乎一樣高，新指標貼近隨機而輸給最高的那根">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">補上第三個數字之後</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">事件後二十天的波動，越高越好</text>

<line x1="150" y1="462" x2="900" y2="462" stroke="var(--line)" stroke-width="2"/>

<rect x="190" y="162" width="130" height="300" rx="4" fill="var(--accent)"/>
<text x="255" y="148" font-size="16" fill="var(--ink)" text-anchor="middle">0.0104</text>
<text x="255" y="494" font-size="19" fill="var(--ink)" text-anchor="middle">現有溫度計</text>

<rect x="410" y="205" width="130" height="257" rx="4" fill="var(--warn)"/>
<text x="475" y="191" font-size="16" fill="var(--ink)" text-anchor="middle">0.0089</text>
<text x="475" y="494" font-size="19" fill="var(--ink)" text-anchor="middle">新指標</text>

<rect x="630" y="217" width="130" height="245" rx="4" fill="var(--grey)"/>
<text x="695" y="203" font-size="16" fill="var(--ink)" text-anchor="middle">0.0085</text>
<text x="695" y="494" font-size="19" fill="var(--ink)" text-anchor="middle">隨機挑日子</text>

<line x1="800" y1="205" x2="800" y2="217" stroke="var(--dim)" stroke-width="2"/>
<line x1="792" y1="205" x2="808" y2="205" stroke="var(--dim)" stroke-width="2"/>
<line x1="792" y1="217" x2="808" y2="217" stroke="var(--dim)" stroke-width="2"/>
<text x="820" y="216" font-size="15" fill="var(--dim)">只差這麼多</text>

<text x="60" y="536" font-size="22" fill="var(--ink)">題目做完了，題目本身少一個對照。</text>
</svg>
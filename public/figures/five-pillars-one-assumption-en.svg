<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Five industry pillars standing on one cracking foundation." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="48" y="56" font-size="27" fill="var(--ink)">Five industries, one assumption</text>
  <text x="48" y="88" font-size="16" fill="var(--dim)">The industry names are spread; the risk source is not</text>

  <rect x="130" y="150" width="116" height="216" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="188" y="266" font-size="16" fill="var(--ink)" text-anchor="middle">Chips</text>
  <rect x="286" y="150" width="116" height="216" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="344" y="266" font-size="16" fill="var(--ink)" text-anchor="middle">Power</text>
  <rect x="442" y="150" width="116" height="216" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="500" y="266" font-size="16" fill="var(--ink)" text-anchor="middle">Data centres</text>
  <rect x="598" y="150" width="116" height="216" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="656" y="266" font-size="16" fill="var(--ink)" text-anchor="middle">Cooling</text>
  <rect x="754" y="150" width="116" height="216" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="812" y="266" font-size="16" fill="var(--ink)" text-anchor="middle">Cloud</text>

  <rect x="100" y="386" width="790" height="62" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="400" y="424" font-size="20" fill="var(--warn)" text-anchor="middle">Compute stays scarce</text>
  <path d="M660 386 L682 410 L662 424 L684 448" fill="none" stroke="var(--warn)" stroke-width="3"/>

  <text x="480" y="502" font-size="22" fill="var(--accent)" text-anchor="middle">Looks like five, is one position</text>
</svg>
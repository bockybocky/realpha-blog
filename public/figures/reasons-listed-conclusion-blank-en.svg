<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four filled bars stacked, the last slot an empty dashed box, with an arrow from the empty box to three question-mark blocks on the right">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">Reasons full, verdict blank</text>

<text x="60" y="106" font-size="20" fill="var(--dim)">What the speech said</text>
<rect x="60" y="126" width="300" height="48" rx="8" fill="var(--accent)" opacity="0.85"/>
<text x="80" y="157" font-size="16" fill="var(--page)">Reason 1</text>
<rect x="60" y="184" width="300" height="48" rx="8" fill="var(--accent)" opacity="0.85"/>
<text x="80" y="215" font-size="16" fill="var(--page)">Reason 2</text>
<rect x="60" y="242" width="300" height="48" rx="8" fill="var(--accent)" opacity="0.85"/>
<text x="80" y="273" font-size="16" fill="var(--page)">Reason 3</text>
<rect x="60" y="300" width="300" height="48" rx="8" fill="var(--accent)" opacity="0.85"/>
<text x="80" y="331" font-size="16" fill="var(--page)">Reason 4</text>

<rect x="60" y="368" width="300" height="60" rx="8" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="80" y="405" font-size="19" fill="var(--warn)">Conclusion</text>
<text x="60" y="460" font-size="16" fill="var(--dim)">The line left out</text>

<path d="M370 398 L520 398" stroke="var(--warn)" stroke-width="2.5" fill="none"/>
<path d="M520 398 L506 391 L506 405 Z" fill="var(--warn)"/>
<text x="396" y="382" font-size="16" fill="var(--dim)">Others fill it</text>

<rect x="540" y="192" width="330" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="562" y="230" font-size="16" fill="var(--ink)">Political pressure?</text>
<rect x="540" y="268" width="330" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="562" y="306" font-size="16" fill="var(--ink)">Chair ahead of committee?</text>
<rect x="540" y="344" width="330" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="562" y="382" font-size="16" fill="var(--ink)">Not decided yet?</text>
<path d="M540 222 L520 222 L520 374 L540 374" stroke="var(--line)" stroke-width="2" fill="none"/>

<text x="60" y="516" font-size="22" fill="var(--ink)">Markets fill the blank</text>
</svg>
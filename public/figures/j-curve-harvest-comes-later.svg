<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條先平後揚的曲線，前段接近水平且微微下沉，後段陡峭上升，中間有一條垂直虛線分界">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">收成落在後面那一段</text>

<path d="M120 110 L120 420 L880 420" stroke="var(--line)" stroke-width="2.5" fill="none"/>
<text x="60" y="130" font-size="16" fill="var(--dim)">產出</text>
<text x="812" y="452" font-size="16" fill="var(--dim)">時間</text>

<path d="M150 322 C260 340 340 372 440 368 C600 360 740 260 860 150"
      stroke="var(--accent)" stroke-width="4" fill="none"/>
<path d="M470 120 L470 420" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="6 6"/>

<text x="164" y="266" font-size="19" fill="var(--dim)">做晶片</text>
<text x="164" y="294" font-size="16" fill="var(--dim)">看得見一點</text>
<text x="520" y="212" font-size="19" fill="var(--accent)">把生意重做一遍</text>
<text x="520" y="240" font-size="16" fill="var(--dim)">收成在這裡</text>

<text x="60" y="498" font-size="22" fill="var(--ink)">賣鏟子的先動，買鏟子的後收</text>
</svg>
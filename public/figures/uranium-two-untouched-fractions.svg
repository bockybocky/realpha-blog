<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩個環形圖，各只有一小塊被填滿，其餘留白標為未動用">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66">兩層都還沒動用</text>
<g transform="translate(260,280)">
<circle r="100" fill="none" stroke="var(--grey)" stroke-width="40" opacity="0.4"/>
<circle r="100" fill="none" stroke="var(--accent)" stroke-width="40"
        stroke-dasharray="188 440" transform="rotate(-90)"/>
<text class="c" y="8" text-anchor="middle">30%</text>
</g>
<text class="g" x="260" y="432" text-anchor="middle">已指認的礦</text>
<text class="n" x="260" y="458" text-anchor="middle">開採過的比例</text>
<g transform="translate(700,280)">
<circle r="100" fill="none" stroke="var(--grey)" stroke-width="40" opacity="0.4"/>
<circle r="100" fill="none" stroke="var(--warn)" stroke-width="40"
        stroke-dasharray="31 597" transform="rotate(-90)"/>
<text class="c" y="8" text-anchor="middle">5%</text>
</g>
<text class="g" x="700" y="432" text-anchor="middle">取出的燃料</text>
<text class="n" x="700" y="458" text-anchor="middle">燒掉的比例</text>
<text class="n" x="60" y="506">灰色＝還留在裡面的部分</text>
</svg>
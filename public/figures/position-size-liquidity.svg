<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條等長橫條，大部位只有最左端一小截可以賣出、其餘卡住，小部位整條都能出清">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t  { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1 { font-size:27px; font-weight:700; fill:var(--ink); }
    .lb { font-size:20px; font-weight:700; fill:var(--ink); }
    .bd { font-size:16px; fill:var(--dim); }
    .cc { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text class="t h1" x="60" y="62">同一檔、同一天，跌停板前的兩種處境</text>

  <rect x="60" y="100" width="840" height="150" rx="10" fill="var(--card)"/>
  <text class="t lb" x="84" y="140">大部位</text>
  <rect x="84" y="164" width="792" height="48" fill="var(--grey)"/>
  <rect x="84" y="164" width="24" height="48" fill="var(--accent)"/>
  <line x1="96" y1="164" x2="96" y2="132" stroke="var(--accent)" stroke-width="2"/>
  <text class="t bd" x="112" y="128" fill="var(--accent)">一天出得掉的</text>
  <text class="t bd" x="560" y="240">其餘全部卡在手上</text>

  <rect x="60" y="272" width="840" height="150" rx="10" fill="var(--card)"/>
  <text class="t lb" x="84" y="312">小部位</text>
  <rect x="84" y="336" width="792" height="48" fill="var(--accent)"/>
  <text class="t bd" x="96" y="412">想走就走，跌幅是唯一的問題</text>

  <text class="t cc" x="60" y="470">跌幅一樣，能不能動不一樣</text>
  <text class="t bd" x="60" y="500">流動性要在建立部位的時候就想</text>
</svg>
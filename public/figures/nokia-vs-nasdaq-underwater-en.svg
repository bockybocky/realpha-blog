<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two underwater curves are compared: the Nasdaq fell more than 40% at its deepest and resurfaced after nine years, while Nokia fell 80% and took twenty-five years to resurface.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Same monthly additions, different time underwater</text>
  <rect x="110" y="150" width="790" height="320" fill="var(--card)"/>
  <line x1="110" y1="150" x2="900" y2="150" stroke="var(--ink)" stroke-width="2"/>
  <text class="t" x="60" y="145" font-size="16" fill="var(--dim)">Surface</text>
  <text class="t" x="60" y="300" font-size="16" fill="var(--dim)">Loss</text>
  <polyline points="110,150 171,286 232,230 323,175 405,150" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <polyline points="405,150 500,128 700,105 900,88" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <polyline points="110,150 171,367 232,300 353,330 475,401 596,330 718,300 870,152 900,128" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <circle cx="405" cy="150" r="7" fill="var(--accent)"/>
  <circle cx="870" cy="152" r="7" fill="var(--warn)"/>
  <text class="t" x="300" y="250" font-size="20" font-weight="700" fill="var(--accent)">Nasdaq</text>
  <text class="t" x="171" y="312" font-size="16" fill="var(--accent)">Low −44%</text>
  <text class="t" x="330" y="128" font-size="16" fill="var(--accent)">Positive 2009</text>
  <text class="t" x="520" y="380" font-size="20" font-weight="700" fill="var(--warn)">Nokia</text>
  <text class="t" x="430" y="428" font-size="16" fill="var(--warn)">Low −81%</text>
  <text class="t" x="770" y="140" font-size="16" fill="var(--warn)">Positive 2025</text>
  <text class="t" x="110" y="494" font-size="16" fill="var(--dim)">2000</text>
  <text class="t" x="860" y="494" font-size="16" fill="var(--dim)">2026</text>
  <text class="t" x="60" y="534" font-size="22" font-weight="700" fill="var(--ink)">Same additions: nine years underwater versus twenty-five</text>
</svg>
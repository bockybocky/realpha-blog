<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two points on a rising curve, one with a long vertical gap to the top and one with a short gap">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">Same outlook, two prices, two different trades</text>

<line x1="120" y1="140" x2="880" y2="140" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>
<text x="880" y="124" font-size="16" fill="var(--dim)" text-anchor="end">If everything he says is right</text>

<path d="M120 430 C 320 410, 520 320, 860 200" fill="none" stroke="var(--accent)" stroke-width="3"/>

<circle cx="300" cy="392" r="10" fill="var(--accent)"/>
<line x1="300" y1="382" x2="300" y2="152" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="300" y="428" font-size="16" fill="var(--ink)" text-anchor="middle">Buy earlier</text>
<text x="316" y="280" font-size="16" fill="var(--accent)">Room left</text>

<circle cx="740" cy="238" r="10" fill="var(--warn)"/>
<line x1="740" y1="228" x2="740" y2="152" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="740" y="274" font-size="16" fill="var(--ink)" text-anchor="middle">Buy after it's spelled out</text>
<text x="756" y="196" font-size="16" fill="var(--warn)">Only this much left</text>

<line x1="120" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="498" font-size="15" fill="var(--dim)">Low visibility</text>
<text x="880" y="498" font-size="15" fill="var(--dim)" text-anchor="end">High visibility</text>
</svg>
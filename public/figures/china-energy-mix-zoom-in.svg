<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="三層逐層放大的橫條，愈放大剩下的比例愈小">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">把鏡頭拉遠，石油只是其中一塊</text>

<text x="60" y="124" font-size="19" fill="var(--dim)">全部能源</text>
<rect x="60" y="140" width="672" height="52" rx="4" fill="var(--grey)"/>
<rect x="732" y="140" width="168" height="52" rx="4" fill="var(--accent)"/>
<text x="396" y="222" font-size="16" fill="var(--ink)" text-anchor="middle">國內煤、核、水、再生</text>
<text x="816" y="222" font-size="16" font-weight="600" fill="var(--accent)" text-anchor="middle">石油 約 2 成</text>

<line x1="732" y1="232" x2="60" y2="284" stroke="var(--line)" stroke-width="2"/>
<line x1="900" y1="232" x2="900" y2="284" stroke="var(--line)" stroke-width="2"/>

<text x="60" y="276" font-size="19" fill="var(--dim)">石油</text>
<rect x="60" y="290" width="588" height="52" rx="4" fill="var(--accent)"/>
<rect x="648" y="290" width="252" height="52" rx="4" fill="var(--grey)"/>
<text x="354" y="372" font-size="16" font-weight="600" fill="var(--accent)" text-anchor="middle">靠進口 約 7 成</text>
<text x="774" y="372" font-size="16" fill="var(--ink)" text-anchor="middle">國內自產</text>

<line x1="60" y1="382" x2="60" y2="434" stroke="var(--line)" stroke-width="2"/>
<line x1="648" y1="382" x2="900" y2="434" stroke="var(--line)" stroke-width="2"/>

<text x="60" y="426" font-size="19" fill="var(--dim)">進口原油</text>
<rect x="60" y="440" width="420" height="52" rx="4" fill="var(--accent)"/>
<rect x="480" y="440" width="420" height="52" rx="4" fill="var(--grey)"/>
<text x="270" y="522" font-size="16" font-weight="600" fill="var(--accent)" text-anchor="middle">中東 約 5 成</text>
<text x="690" y="522" font-size="16" fill="var(--ink)" text-anchor="middle">其他來源</text>

<text x="60" y="570" font-size="22" font-weight="600" fill="var(--ink)">中東原油 ≈ 全部能源的 7%</text>
</svg>
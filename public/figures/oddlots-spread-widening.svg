<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條往上爬的示意線走了好幾個月，右側窄窄的那一週區帶裡才出現事件點，顯示價格早動注意力晚到">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="66" font-size="27" font-weight="700" fill="var(--ink)">價格先動，注意力後到</text>
<rect x="720" y="120" width="140" height="320" fill="var(--card)"/>
<text x="790" y="148" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">那一週</text>
<rect x="120" y="436" width="740" height="4" fill="var(--line)"/>
<rect x="118" y="120" width="4" height="320" fill="var(--line)"/>
<text x="112" y="140" font-size="16" fill="var(--dim)" text-anchor="end">闊</text>
<text x="112" y="432" font-size="16" fill="var(--dim)" text-anchor="end">窄</text>
<text x="120" y="472" font-size="16" fill="var(--dim)">幾個月前</text>
<text x="860" y="472" font-size="16" fill="var(--dim)" text-anchor="end">現在</text>
<polyline points="130,392 250,352 370,316 490,282 610,246 730,206 820,182" fill="none" stroke="var(--warn)" stroke-width="4"/>
<polyline points="130,418 250,410 370,400 490,388 610,374 730,356 820,344" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="330" y="294" font-size="19" font-weight="700" fill="var(--warn)">資料中心相關債券</text>
<text x="330" y="438" font-size="19" font-weight="700" fill="var(--accent)">投資級大雲債券</text>
<circle cx="760" cy="300" r="9" fill="var(--ink)"/>
<circle cx="800" cy="256" r="9" fill="var(--ink)"/>
<text x="744" y="336" font-size="16" fill="var(--ink)">可轉債砸坑</text>
<text x="744" y="226" font-size="16" fill="var(--ink)">債券被賣</text>
<text x="80" y="528" font-size="22" font-weight="700" fill="var(--ink)">被看見的那一週，不是開始的那一週</text>
</svg>
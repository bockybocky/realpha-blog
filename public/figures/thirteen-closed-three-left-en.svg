<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Thirteen circles, ten struck through and three solid ones that can still restart.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="48" y="66" font-size="27" fill="var(--ink)">Thirteen shut down, three recoverable</text>
<g fill="var(--accent)">
<circle cx="180" cy="200" r="42"/><circle cx="290" cy="200" r="42"/><circle cx="400" cy="200" r="42"/>
</g>
<g fill="var(--card)" stroke="var(--grey)" stroke-width="2">
<circle cx="540" cy="200" r="42"/><circle cx="650" cy="200" r="42"/><circle cx="760" cy="200" r="42"/><circle cx="870" cy="200" r="42"/>
<circle cx="540" cy="320" r="42"/><circle cx="650" cy="320" r="42"/><circle cx="760" cy="320" r="42"/><circle cx="870" cy="320" r="42"/>
<circle cx="320" cy="320" r="42"/><circle cx="430" cy="320" r="42"/>
</g>
<g stroke="var(--grey)" stroke-width="3">
<line x1="512" y1="172" x2="568" y2="228"/><line x1="622" y1="172" x2="678" y2="228"/><line x1="732" y1="172" x2="788" y2="228"/><line x1="842" y1="172" x2="898" y2="228"/>
<line x1="512" y1="292" x2="568" y2="348"/><line x1="622" y1="292" x2="678" y2="348"/><line x1="732" y1="292" x2="788" y2="348"/><line x1="842" y1="292" x2="898" y2="348"/>
<line x1="292" y1="292" x2="348" y2="348"/><line x1="402" y1="292" x2="458" y2="348"/>
</g>
<text x="140" y="282" font-size="19" fill="var(--accent)">Can still restart</text>
<text x="540" y="400" font-size="19" fill="var(--dim)">Internals already cut</text>
<text x="48" y="470" font-size="22" fill="var(--ink)">For most, the door has closed</text>
</g>
</svg>
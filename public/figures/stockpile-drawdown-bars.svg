<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三條存量長條由上而下遞減，最後一條以虛線與問號表示數字未公開">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">打完這一仗，櫃子裡還剩多少</text>
<text x="70" y="128" font-size="19" fill="var(--ink)">七種主力彈藥</text>
<rect x="70" y="146" width="520" height="34" rx="4" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="70" y="146" width="260" height="34" rx="4" fill="var(--accent)" opacity="0.55"/>
<text x="606" y="169" font-size="16" fill="var(--dim)">剩約一半</text>
<text x="70" y="240" font-size="19" fill="var(--ink)">愛國者、薩德</text>
<rect x="70" y="258" width="520" height="34" rx="4" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="70" y="258" width="208" height="34" rx="4" fill="var(--accent)" opacity="0.55"/>
<text x="606" y="281" font-size="16" fill="var(--dim)">剩約四成</text>
<text x="70" y="352" font-size="19" fill="var(--ink)">艦載攔截彈</text>
<rect x="70" y="370" width="520" height="34" rx="4" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="330" y="394" text-anchor="middle" font-size="19" fill="var(--grey)">？</text>
<text x="606" y="393" font-size="16" fill="var(--dim)">未公開</text>
<text x="70" y="452" font-size="15" fill="var(--dim)">實心＝還剩　外框＝已消耗</text>
<text x="480" y="504" text-anchor="middle" font-size="22" fill="var(--ink)">用完就是用完，沒有替代品頂上</text>
</svg>
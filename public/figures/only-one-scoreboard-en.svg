<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two-dimensional plot with yield on the horizontal axis and cost per bit on the vertical axis, where two paths diverge from the same starting point, one running flat to the right and the other descending to the lower right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="90" y="72" font-size="27" font-weight="700" fill="var(--ink)">Only one scoreboard</text>
<text x="90" y="108" font-size="16" fill="var(--dim)">Two paths · illustrative</text>

<line x1="170" y1="160" x2="170" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="170" y1="450" x2="870" y2="450" stroke="var(--line)" stroke-width="2"/>
<text x="156" y="168" font-size="15" text-anchor="end" fill="var(--dim)">High cost</text>
<text x="156" y="446" font-size="15" text-anchor="end" fill="var(--dim)">Low cost</text>
<text x="866" y="478" font-size="15" text-anchor="end" fill="var(--dim)">Higher yield →</text>

<circle cx="240" cy="300" r="6" fill="var(--ink)"/>
<text x="240" y="276" font-size="15" text-anchor="middle" fill="var(--dim)">Same starting point</text>

<path d="M240 300 C400 296 560 292 704 290" fill="none" stroke="var(--warn)" stroke-width="4"/>
<polygon points="720,290 702,283 702,297" fill="var(--warn)"/>
<text x="730" y="278" font-size="19" fill="var(--warn)">99% yield</text>
<text x="730" y="302" font-size="15" fill="var(--dim)">Cost flat</text>

<path d="M240 300 C400 340 560 380 686 408" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polygon points="702,412 683,405 680,419" fill="var(--accent)"/>
<text x="712" y="404" font-size="19" fill="var(--accent)">Cost per bit</text>
<text x="712" y="428" font-size="15" fill="var(--dim)">Falling</text>

<text x="90" y="522" font-size="22" font-weight="700" fill="var(--ink)">Yield to the right, cost to the floor</text>
</svg>
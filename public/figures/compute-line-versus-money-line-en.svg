<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A smooth rising compute line almost overlaps its dashed forecast above, while a money line over the same years is cut into six segments by five gaps.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="56" font-size="27" fill="var(--ink)">Compute held. Money kept breaking.</text>
<line x1="60" y1="96" x2="100" y2="96" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>
<text x="110" y="102" font-size="15" fill="var(--dim)">Forecast in 2010</text>
<line x1="240" y1="96" x2="280" y2="96" stroke="var(--accent)" stroke-width="3"/>
<text x="290" y="102" font-size="15" fill="var(--dim)">What happened</text>

<text x="60" y="205" font-size="20" fill="var(--dim)">Compute</text>
<polyline points="150,278 335,246 520,212 705,178 890,146" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>
<polyline points="150,268 335,235 520,203 705,169 890,136" fill="none" stroke="var(--accent)" stroke-width="4"/>

<text x="60" y="406" font-size="20" fill="var(--dim)">Money</text>
<g stroke="var(--ink)" stroke-width="5">
<line x1="150" y1="400" x2="163" y2="400"/>
<line x1="187" y1="400" x2="253" y2="400"/>
<line x1="277" y1="400" x2="343" y2="400"/>
<line x1="367" y1="400" x2="508" y2="400"/>
<line x1="532" y1="400" x2="833" y2="400"/>
<line x1="857" y1="400" x2="890" y2="400"/>
</g>
<g stroke="var(--warn)" stroke-width="4">
<line x1="175" y1="386" x2="175" y2="414"/>
<line x1="265" y1="386" x2="265" y2="414"/>
<line x1="355" y1="386" x2="355" y2="414"/>
<line x1="520" y1="386" x2="520" y2="414"/>
<line x1="845" y1="386" x2="845" y2="414"/>
</g>
<g font-size="15" fill="var(--dim)" text-anchor="middle">
<text x="175" y="370">Round 1</text>
<text x="265" y="370">Round 3</text>
<text x="360" y="370">Sold to Google</text>
<text x="520" y="370">$15B</text>
<text x="845" y="370">$2.7B</text>
</g>
<g font-size="15" fill="var(--grey)" text-anchor="middle">
<text x="150" y="446">2010</text>
<text x="335" y="446">2014</text>
<text x="520" y="446">2018</text>
<text x="705" y="446">2022</text>
<text x="885" y="446">2026</text>
</g>
<text x="60" y="508" font-size="22" fill="var(--ink)">The wall is money, not compute.</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="四象限：恐怖片往上長、喜劇往下縮，創作者由喜劇流向恐怖">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="54" font-size="27" font-weight="700" fill="var(--ink)">在長的好算，在縮的難取代</text>
<rect x="150" y="100" width="700" height="360" fill="var(--card)"/>
<line x1="500" y1="100" x2="500" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="280" x2="850" y2="280" stroke="var(--line)" stroke-width="2"/>
<text x="150" y="486" font-size="16" fill="var(--dim)">AI 已經做得動</text>
<text x="850" y="486" font-size="16" fill="var(--dim)" text-anchor="end">AI 最難做</text>
<text x="132" y="118" font-size="16" fill="var(--dim)" text-anchor="end">上檔潛力高</text>
<text x="132" y="452" font-size="16" fill="var(--dim)" text-anchor="end">上檔潛力低</text>
<circle cx="320" cy="190" r="58" fill="var(--accent)" opacity="0.18"/>
<circle cx="320" cy="190" r="12" fill="var(--accent)"/>
<text x="320" y="152" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">恐怖片</text>
<text x="320" y="226" font-size="16" fill="var(--dim)" text-anchor="middle">算得出來</text>
<path d="M394 190 L394 140" stroke="var(--accent)" stroke-width="3"/>
<path d="M387 148 L394 134 L401 148 Z" fill="var(--accent)"/>
<text x="410" y="152" font-size="19" font-weight="700" fill="var(--accent)">在長</text>
<circle cx="680" cy="375" r="58" fill="var(--warn)" opacity="0.18"/>
<circle cx="680" cy="375" r="12" fill="var(--warn)"/>
<text x="680" y="337" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">喜劇</text>
<text x="680" y="411" font-size="16" fill="var(--dim)" text-anchor="middle">沒有同樣的上檔</text>
<path d="M754 375 L754 425" stroke="var(--warn)" stroke-width="3"/>
<path d="M747 417 L754 431 L761 417 Z" fill="var(--warn)"/>
<text x="770" y="425" font-size="19" font-weight="700" fill="var(--warn)">在縮</text>
<path d="M630 330 Q500 240 378 200" stroke="var(--dim)" stroke-width="2.5" fill="none" stroke-dasharray="7 6"/>
<path d="M390 192 L372 198 L388 208 Z" fill="var(--dim)"/>
<text x="504" y="268" font-size="16" fill="var(--dim)" text-anchor="middle">創作者被挖走</text>
<text x="60" y="534" font-size="22" font-weight="700" fill="var(--ink)">最難被機器取代的那一類，產量正在縮。</text>
</svg>
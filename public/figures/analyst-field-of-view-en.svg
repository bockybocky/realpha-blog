<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A segmented bar with two middle segments lit by a cone of light and the rest dim">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">Everyone forecasts the slice they can see</text>

<polygon points="490,440 250,150 730,150" fill="var(--accent)" opacity="0.12"/>

<rect x="60" y="200" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="140" y="248" font-size="16" fill="var(--grey)" text-anchor="middle">Upstream materials</text>
<rect x="240" y="200" width="160" height="80" rx="8" fill="var(--accent)" opacity="0.22"/>
<rect x="240" y="200" width="160" height="80" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="320" y="248" font-size="16" fill="var(--ink)" text-anchor="middle">Wafers</text>
<rect x="420" y="200" width="160" height="80" rx="8" fill="var(--accent)" opacity="0.22"/>
<rect x="420" y="200" width="160" height="80" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="500" y="248" font-size="16" fill="var(--ink)" text-anchor="middle">Packaging and test</text>
<rect x="600" y="200" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="680" y="248" font-size="16" fill="var(--grey)" text-anchor="middle">System assembly</text>
<rect x="780" y="200" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="860" y="248" font-size="16" fill="var(--grey)" text-anchor="middle">End customers</text>

<text x="410" y="176" font-size="16" fill="var(--accent)" text-anchor="middle">Reachable　pull-in is hot</text>
<text x="140" y="176" font-size="15" fill="var(--grey)" text-anchor="middle">Counted as zero</text>
<text x="860" y="176" font-size="15" fill="var(--grey)" text-anchor="middle">Counted as zero</text>

<circle cx="490" cy="452" r="16" fill="var(--accent)"/>
<text x="490" y="500" font-size="16" fill="var(--dim)" text-anchor="middle">Where the analyst stands</text>

<text x="480" y="536" font-size="22" fill="var(--ink)" text-anchor="middle">Bias direction is predictable</text>
</svg>
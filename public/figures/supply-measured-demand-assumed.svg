<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一根實心柱標示兩年供給增加七到八成，右邊同高的位置只有一個虛線空框裡打問號。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .n { font-size:34px; font-weight:700; fill:var(--ink); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">一邊量得出來，一邊只有估計值</text>
  <text class="b" x="60" y="94">全場焦點在東芝，可是最大的供給數字是講者自己給的</text>
  <text class="g" x="140" y="168">兩年位元供給</text>
  <rect x="140" y="190" width="160" height="230" fill="var(--accent)"/>
  <text class="n" x="140" y="468" fill="var(--accent)">+70~80%</text>
  <text class="b" x="140" y="498">希捷、威騰、東芝一起算進去</text>
  <text class="g" x="620" y="168">兩年位元需求</text>
  <rect x="620" y="190" width="160" height="230" fill="none" stroke="var(--line)" stroke-width="4" stroke-dasharray="10 8"/>
  <text class="n" x="682" y="322" fill="var(--dim)">？</text>
  <text class="n" x="620" y="468">沒有數字</text>
  <text class="b" x="620" y="498">節目裡只有缺口的估計值</text>
  <path d="M380 300 L560 300" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
  <text class="b" x="398" y="288">對不對得上？</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars on the same base, differing in height by nearly double.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">Earnings stay put, the price column can double</text>
<rect x="60" y="400" width="840" height="56" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="84" y="436" font-size="19" fill="var(--ink)">Earnings +20% next year: both sides use the same number</text>
<rect x="240" y="276" width="150" height="124" fill="var(--grey)"/>
<text x="240" y="258" font-size="22" fill="var(--ink)">12x</text>
<rect x="580" y="130" width="150" height="270" fill="var(--accent)"/>
<text x="580" y="112" font-size="22" fill="var(--ink)">22x</text>
<text x="240" y="486" font-size="16" fill="var(--dim)">Sellers outnumber</text>
<text x="580" y="486" font-size="16" fill="var(--dim)">Buyers outnumber</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="四個格子各有兩根小柱，左柱是需求高度、右柱是本季入帳：左上一高一低、右上兩根都高、左下兩根都低、右下一低一高">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="66" font-size="27" fill="var(--ink)">兩欄分開記</text>
<rect x="700" y="46" width="20" height="20" rx="4" fill="var(--accent)"/>
<text x="730" y="63" font-size="16" fill="var(--dim)">需求高度</text>
<rect x="830" y="46" width="20" height="20" rx="4" fill="var(--grey)"/>
<text x="860" y="63" font-size="16" fill="var(--dim)">本季入帳</text>
<rect x="80" y="140" width="380" height="190" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="305" x2="430" y2="305" stroke="var(--line)" stroke-width="2"/>
<rect x="130" y="195" width="34" height="110" rx="4" fill="var(--accent)"/>
<rect x="180" y="269" width="34" height="36" rx="4" fill="var(--grey)"/>
<text x="250" y="246" font-size="19" fill="var(--ink)">估值打折</text>
<text x="250" y="276" font-size="15" fill="var(--dim)">故事留著</text>
<rect x="500" y="140" width="380" height="190" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<line x1="540" y1="305" x2="850" y2="305" stroke="var(--line)" stroke-width="2"/>
<rect x="550" y="195" width="34" height="110" rx="4" fill="var(--accent)"/>
<rect x="600" y="195" width="34" height="110" rx="4" fill="var(--grey)"/>
<text x="670" y="246" font-size="19" fill="var(--accent)">都對上</text>
<text x="670" y="276" font-size="15" fill="var(--dim)">高度與時間</text>
<rect x="80" y="360" width="380" height="190" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="525" x2="430" y2="525" stroke="var(--line)" stroke-width="2"/>
<rect x="130" y="489" width="34" height="36" rx="4" fill="var(--accent)"/>
<rect x="180" y="489" width="34" height="36" rx="4" fill="var(--grey)"/>
<text x="250" y="466" font-size="19" fill="var(--warn)">方向錯</text>
<text x="250" y="496" font-size="15" fill="var(--dim)">不是慢</text>
<rect x="500" y="360" width="380" height="190" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="540" y1="525" x2="850" y2="525" stroke="var(--line)" stroke-width="2"/>
<rect x="550" y="489" width="34" height="36" rx="4" fill="var(--accent)"/>
<rect x="600" y="415" width="34" height="110" rx="4" fill="var(--grey)"/>
<text x="670" y="466" font-size="19" fill="var(--ink)">只是一季</text>
<text x="670" y="496" font-size="15" fill="var(--dim)">高度沒跟上</text>
<text x="60" y="586" font-size="22" fill="var(--ink)">兩欄一起看，才分得出慢了還是錯了</text>
</svg>
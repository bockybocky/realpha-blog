<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊兩個圓點、右邊七個圓點，右邊那排明顯更長">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t  { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">同一個使用者，一年刷幾次</text>

<text class="t" x="60" y="150" font-size="20" fill="var(--dim)">上市時</text>
<circle cx="230" cy="190" r="26" fill="var(--grey)"/>
<circle cx="300" cy="190" r="26" fill="var(--grey)"/>
<text class="t" x="356" y="200" font-size="19" fill="var(--dim)">兩次</text>

<text class="t" x="60" y="310" font-size="20" fill="var(--accent)">現在</text>
<circle cx="230" cy="350" r="26" fill="var(--accent)"/>
<circle cx="300" cy="350" r="26" fill="var(--accent)"/>
<circle cx="370" cy="350" r="26" fill="var(--accent)"/>
<circle cx="440" cy="350" r="26" fill="var(--accent)"/>
<circle cx="510" cy="350" r="26" fill="var(--accent)"/>
<circle cx="580" cy="350" r="26" fill="var(--accent)"/>
<circle cx="650" cy="350" r="26" fill="var(--accent)"/>
<text class="t" x="706" y="360" font-size="19" fill="var(--accent)">七次</text>

<text class="t" x="60" y="462" font-size="22" font-weight="700" fill="var(--ink)">客戶沒變多，次數變多</text>
</svg>
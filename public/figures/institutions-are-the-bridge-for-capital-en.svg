<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Without a bridge the dots stay on the near bank; with one they cross the gap to the far side.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="64" font-size="27" fill="var(--ink)">No bridge, and the money cannot cross</text>

  <rect x="60" y="120" width="400" height="290" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="84" y="158" font-size="20" fill="var(--dim)">No institutions</text>
  <rect x="84" y="330" width="130" height="26" fill="var(--grey)"/>
  <rect x="306" y="330" width="130" height="26" fill="var(--grey)"/>
  <circle cx="100" cy="312" r="9" fill="var(--accent)"/>
  <circle cx="124" cy="312" r="9" fill="var(--accent)"/>
  <circle cx="148" cy="312" r="9" fill="var(--accent)"/>
  <circle cx="112" cy="290" r="9" fill="var(--accent)"/>
  <circle cx="136" cy="290" r="9" fill="var(--accent)"/>
  <circle cx="124" cy="268" r="9" fill="var(--accent)"/>
  <text class="t" x="84" y="382" font-size="15" fill="var(--dim)">Capital</text>
  <text class="t" x="306" y="382" font-size="15" fill="var(--dim)">Colony</text>

  <rect x="500" y="120" width="400" height="290" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="524" y="158" font-size="20" fill="var(--accent)">With institutions</text>
  <rect x="524" y="330" width="130" height="26" fill="var(--grey)"/>
  <rect x="746" y="330" width="130" height="26" fill="var(--grey)"/>
  <rect x="654" y="322" width="92" height="10" fill="var(--accent)"/>
  <circle cx="548" cy="312" r="9" fill="var(--accent)"/>
  <circle cx="600" cy="312" r="9" fill="var(--accent)"/>
  <circle cx="676" cy="304" r="9" fill="var(--accent)"/>
  <circle cx="724" cy="304" r="9" fill="var(--accent)"/>
  <circle cx="776" cy="312" r="9" fill="var(--accent)"/>
  <circle cx="824" cy="312" r="9" fill="var(--accent)"/>
  <text class="t" x="700" y="378" font-size="15" fill="var(--accent)" text-anchor="middle">Property . contract . governance</text>
  <text class="t" x="524" y="382" font-size="15" fill="var(--dim)">Capital</text>
  <text class="t" x="746" y="382" font-size="15" fill="var(--dim)">Colony</text>

  <text class="t" x="60" y="470" font-size="22" fill="var(--ink)">Rules first, capital after</text>
</svg>
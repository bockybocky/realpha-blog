<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The supply line rises steeply while the demand line stays flat to slightly lower, opening the gap between them into a pair of scissors towards the right.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .u { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="56">Supply opens up, demand does not follow</text>
<line x1="140" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="110" x2="140" y2="450" stroke="var(--line)" stroke-width="2"/>
<polygon points="150,360 490,215 830,145 830,370 490,348 150,360" fill="var(--card)"/>
<polyline points="150,360 490,215 830,145" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polyline points="150,360 490,348 830,370" fill="none" stroke="var(--grey)" stroke-width="5"/>
<circle cx="150" cy="360" r="6" fill="var(--ink)"/>
<text class="g" x="560" y="188" fill="var(--accent)">Supply</text>
<text class="u" x="560" y="212">+50%　+75%</text>
<text class="g" x="560" y="400">Demand</text>
<text class="u" x="560" y="424">Flat to weak</text>
<text class="u" x="150" y="482">2026</text>
<text class="u" x="490" y="482" text-anchor="middle">2029</text>
<text class="u" x="830" y="482" text-anchor="end">2031</text>
<text class="c" x="828" y="258" text-anchor="end">The gap keeps widening</text>
</svg>
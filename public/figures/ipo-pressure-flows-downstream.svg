<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上方一個節點往下收成一把刀，再扇出四條線指向四個下游硬體環節">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">上市之後，壓力往硬體鏈傳</text>
<rect x="330" y="96" width="300" height="62" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="356" y="134">某一季 虧損不收斂</text>
<line x1="480" y1="158" x2="480" y2="214" stroke="var(--warn)" stroke-width="3"/>
<path d="M472 214 L488 214 L480 232 Z" fill="var(--warn)"/>
<rect x="330" y="236" width="300" height="62" fill="var(--warn)"/>
<text class="g" x="356" y="274" fill="var(--page)">唯一槓桿：砍資本支出</text>
<line x1="480" y1="298" x2="480" y2="334" stroke="var(--line)" stroke-width="3"/>
<line x1="140" y1="334" x2="820" y2="334" stroke="var(--line)" stroke-width="3"/>
<line x1="140" y1="334" x2="140" y2="392" stroke="var(--line)" stroke-width="3"/>
<line x1="366" y1="334" x2="366" y2="392" stroke="var(--line)" stroke-width="3"/>
<line x1="594" y1="334" x2="594" y2="392" stroke="var(--line)" stroke-width="3"/>
<line x1="820" y1="334" x2="820" y2="392" stroke="var(--line)" stroke-width="3"/>
<rect x="68" y="392" width="146" height="90" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="92" y="432">Nvidia</text>
<text class="d" x="92" y="460">晶片</text>
<rect x="294" y="392" width="146" height="90" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="318" y="432">台積電</text>
<text class="d" x="318" y="460">產能</text>
<rect x="522" y="392" width="146" height="90" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="546" y="432">鴻海</text>
<text class="d" x="546" y="460">伺服器</text>
<rect x="748" y="392" width="146" height="90" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="772" y="432">Bloom</text>
<text class="d" x="772" y="460">供電</text>
<text class="d" x="68" y="520">反面故事：每多一吉瓦就變現金牛 — Tim 說他不認為那會是現實</text>
</svg>
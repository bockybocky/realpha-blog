<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three of every four patients already use several products at once, so the product was rearranged from one bottle into a routine.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="40" y="52" font-size="27" fill="var(--ink)">Patients already stack, so make it a routine</text>

  <text x="40" y="106" font-size="20" fill="var(--ink)">Four patients</text>
  <g>
    <circle cx="86" cy="170" r="26" fill="var(--accent)"/>
    <path d="M50 258 Q86 176 122 258 Z" fill="var(--accent)"/>
    <circle cx="176" cy="170" r="26" fill="var(--accent)"/>
    <path d="M140 258 Q176 176 212 258 Z" fill="var(--accent)"/>
    <circle cx="266" cy="170" r="26" fill="var(--accent)"/>
    <path d="M230 258 Q266 176 302 258 Z" fill="var(--accent)"/>
    <circle cx="356" cy="170" r="26" fill="var(--grey)"/>
    <path d="M320 258 Q356 176 392 258 Z" fill="var(--grey)"/>
  </g>
  <text x="40" y="294" font-size="19" fill="var(--accent)">Three use 3–5 at once</text>
  <text x="330" y="294" font-size="16" fill="var(--dim)">One doesn't stack</text>

  <line x1="450" y1="100" x2="450" y2="470" stroke="var(--line)" stroke-width="2"/>

  <text x="500" y="106" font-size="20" fill="var(--ink)">So don't bet here</text>
  <rect x="500" y="134" width="70" height="104" rx="12" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="524" y="118" width="22" height="20" rx="4" fill="var(--grey)"/>
  <line x1="492" y1="128" x2="580" y2="246" stroke="var(--warn)" stroke-width="5"/>
  <text x="600" y="196" font-size="16" fill="var(--dim)">One cure-all bottle</text>

  <text x="500" y="320" font-size="20" fill="var(--ink)">Rearranged like this</text>
  <g>
    <rect x="500" y="348" width="110" height="64" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <text x="528" y="388" font-size="16" fill="var(--ink)">Cleanse</text>
    <path d="M618 380 L646 380" stroke="var(--accent)" stroke-width="5"/>
    <path d="M640 370 L660 380 L640 390 Z" fill="var(--accent)"/>
    <rect x="668" y="348" width="110" height="64" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <text x="696" y="388" font-size="16" fill="var(--ink)">Soothe</text>
    <path d="M786 380 L814 380" stroke="var(--accent)" stroke-width="5"/>
    <path d="M808 370 L828 380 L808 390 Z" fill="var(--accent)"/>
    <rect x="836" y="348" width="84" height="64" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <text x="852" y="388" font-size="16" fill="var(--ink)">Balance</text>
  </g>
  <text x="500" y="452" font-size="16" fill="var(--dim)">Same habit as skincare</text>
</svg>
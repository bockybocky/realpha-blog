<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A clockwise self-reinforcing loop whose five nodes connect end to end, with two small boxes outside it unable to keep up.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">Intel's flywheel</text>

<circle cx="530" cy="300" r="170" fill="none" stroke="var(--accent)" stroke-width="6"/>
<polygon points="530,120 548,138 512,138" fill="var(--accent)"/>
<polygon points="700,300 682,318 682,282" fill="var(--accent)"/>
<polygon points="530,470 512,452 548,452" fill="var(--accent)"/>
<polygon points="360,300 378,282 378,318" fill="var(--accent)"/>

<g>
<rect x="452" y="88" width="156" height="46" rx="23" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="530" y="118" text-anchor="middle">Volume</text>
</g>
<g>
<rect x="690" y="208" width="156" height="46" rx="23" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="768" y="238" text-anchor="middle">Yield</text>
</g>
<g>
<rect x="690" y="348" width="156" height="46" rx="23" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="768" y="378" text-anchor="middle">Lower cost</text>
</g>
<g>
<rect x="452" y="468" width="156" height="46" rx="23" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="530" y="498" text-anchor="middle">Cash</text>
</g>
<g>
<rect x="214" y="268" width="156" height="46" rx="23" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="292" y="298" text-anchor="middle">Better fabs</text>
</g>

<rect x="70" y="150" width="120" height="44" rx="6" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text class="b" x="130" y="178" text-anchor="middle">AMD</text>
<rect x="70" y="210" width="120" height="44" rx="6" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text class="b" x="130" y="238" text-anchor="middle">Cyrix</text>
<text class="b" x="70" y="286">Can't keep up</text>

<text class="c" x="60" y="420">Each lap starts higher</text>
</svg>
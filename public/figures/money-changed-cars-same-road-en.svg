<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One shrinking circle sends two arcs toward two larger circles, with one tall bar and one short bar below them.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="72" font-size="27" fill="var(--ink)">The money didn't get off, it changed cars</text>
<circle cx="220" cy="230" r="44" fill="var(--grey)" opacity="0.4"/>
<circle cx="220" cy="230" r="44" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text x="220" y="236" font-size="19" fill="var(--ink)" text-anchor="middle">Nvidia</text>
<path d="M270 205 C400 150 480 150 590 155" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M272 255 C400 310 480 310 590 305" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M578 147 L600 155 L578 164 Z" fill="var(--accent)"/>
<path d="M578 296 L600 305 L578 313 Z" fill="var(--accent)"/>
<circle cx="680" cy="155" r="62" fill="var(--accent)" opacity="0.22"/>
<circle cx="680" cy="155" r="62" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="680" y="150" font-size="19" fill="var(--ink)" text-anchor="middle">AMD</text>
<text x="680" y="176" font-size="16" fill="var(--dim)" text-anchor="middle">5% that day</text>
<circle cx="680" cy="305" r="58" fill="var(--accent)" opacity="0.22"/>
<circle cx="680" cy="305" r="58" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="680" y="300" font-size="19" fill="var(--ink)" text-anchor="middle">Broadcom</text>
<text x="680" y="326" font-size="16" fill="var(--dim)" text-anchor="middle">6% that day</text>
<text x="60" y="400" font-size="19" fill="var(--ink)">Past twelve months</text>
<rect x="60" y="420" width="430" height="34" fill="var(--accent)"/>
<text x="505" y="444" font-size="16" fill="var(--dim)">AMD 123%</text>
<rect x="60" y="466" width="52" height="34" fill="var(--grey)"/>
<text x="128" y="490" font-size="16" fill="var(--dim)">Nvidia 15%</text>
<text x="60" y="540" font-size="22" fill="var(--ink)">Same AI road, different vehicle</text>
</svg>
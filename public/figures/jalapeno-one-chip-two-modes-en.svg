<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A side-by-side comparison: on the left two chips with a transfer arrow and an idle block, on the right one chip switching between two modes with no transfer arrow">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">Two phases, one chip switches</text>

<rect x="60" y="96" width="390" height="352" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="88" y="132" font-size="19" fill="var(--dim)">Before: two chips</text>

<rect x="100" y="158" width="180" height="72" rx="8" fill="var(--page)" stroke="var(--dim)"/>
<text x="190" y="186" font-size="16" fill="var(--ink)" text-anchor="middle">Read prompt</text>
<text x="190" y="210" font-size="16" fill="var(--dim)" text-anchor="middle">Compute-hungry</text>

<line x1="190" y1="230" x2="190" y2="316" stroke="var(--dim)" stroke-width="2"/>
<polygon points="190,326 184,312 196,312" fill="var(--dim)"/>
<text x="204" y="278" font-size="15" fill="var(--dim)">Move intermediates</text>

<rect x="100" y="330" width="180" height="72" rx="8" fill="var(--page)" stroke="var(--dim)"/>
<text x="190" y="358" font-size="16" fill="var(--ink)" text-anchor="middle">Emit answer</text>
<text x="190" y="382" font-size="16" fill="var(--dim)" text-anchor="middle">Bandwidth-hungry</text>

<rect x="308" y="330" width="110" height="72" rx="8" fill="none" stroke="var(--grey)" stroke-dasharray="6 5"/>
<text x="363" y="372" font-size="16" fill="var(--grey)" text-anchor="middle">Idle</text>

<rect x="510" y="96" width="390" height="352" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="538" y="132" font-size="19" fill="var(--dim)">Now: one chip switches</text>

<rect x="550" y="158" width="310" height="180" rx="10" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<rect x="576" y="180" width="258" height="56" rx="6" fill="var(--accent)"/>
<text x="705" y="215" font-size="16" fill="var(--page)" text-anchor="middle">Compute mode</text>
<rect x="576" y="262" width="258" height="56" rx="6" fill="none" stroke="var(--dim)"/>
<text x="705" y="297" font-size="16" fill="var(--ink)" text-anchor="middle">Bandwidth mode</text>
<line x1="705" y1="236" x2="705" y2="262" stroke="var(--accent)" stroke-width="2"/>
<polygon points="705,262 699,250 711,250" fill="var(--accent)"/>
<polygon points="705,236 699,248 711,248" fill="var(--accent)"/>

<rect x="576" y="360" width="44" height="34" rx="5" fill="var(--accent)"/>
<rect x="628" y="360" width="44" height="34" rx="5" fill="var(--accent)"/>
<rect x="680" y="360" width="44" height="34" rx="5" fill="var(--grey)"/>
<rect x="732" y="360" width="44" height="34" rx="5" fill="var(--grey)"/>
<rect x="784" y="360" width="44" height="34" rx="5" fill="var(--grey)"/>
<text x="576" y="418" font-size="15" fill="var(--dim)">Unused parts powered off</text>

<text x="60" y="508" font-size="22" fill="var(--ink)">Saves the moving, plus the idle parts</text>
</svg>
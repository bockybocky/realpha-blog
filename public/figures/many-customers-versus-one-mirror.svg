<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊的廠有一圈往內的客戶箭頭，右邊的廠只有一個自己繞回自己的迴圈">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs>
<marker id="arw5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
</marker>
</defs>
<text x="60" y="52" font-size="27" fill="var(--ink)">誰替你發現不夠用</text>
<circle cx="250" cy="280" r="72" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="250" y="288" font-size="20" fill="var(--ink)" text-anchor="middle">代工廠</text>
<g stroke="var(--accent)" stroke-width="2" fill="none" marker-end="url(#arw5)">
<path d="M250 130 L250 200"/>
<path d="M356 174 L306 224"/>
<path d="M400 280 L330 280"/>
<path d="M356 386 L306 336"/>
<path d="M250 430 L250 360"/>
<path d="M144 386 L194 336"/>
<path d="M100 280 L170 280"/>
<path d="M144 174 L194 224"/>
</g>
<text x="250" y="112" font-size="19" fill="var(--dim)" text-anchor="middle">幾十個客戶的抱怨</text>
<circle cx="710" cy="280" r="72" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<text x="710" y="288" font-size="20" fill="var(--ink)" text-anchor="middle">自用廠</text>
<path d="M770 240 C 850 210 850 350 770 322" stroke="var(--grey)" stroke-width="3" fill="none" marker-end="url(#arw5)"/>
<text x="710" y="112" font-size="19" fill="var(--dim)" text-anchor="middle">只有自己</text>
<text x="60" y="508" font-size="22" fill="var(--ink)">沒有外人，就沒有鏡子</text>
</svg>
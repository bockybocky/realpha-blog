<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根疊柱對比：左柱最大一段被塗成重色，右柱同一段被抽掉只剩淡痕，剩下幾段小區塊往下靠。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .w { font-size:16px; fill:var(--page); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">把智力抽掉，剩下什麼</text>
  <rect x="60" y="88" width="400" height="384" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="88" width="400" height="384" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="88" y="126">現在</text>
  <text class="g" x="528" y="126">智力便宜之後</text>
  <rect x="150" y="150" width="130" height="150" fill="var(--accent)"/>
  <text class="w" x="186" y="232">智力</text>
  <rect x="150" y="300" width="130" height="36" fill="var(--grey)"/>
  <text class="s" x="296" y="324">資料</text>
  <rect x="150" y="336" width="130" height="36" fill="var(--grey)"/>
  <text class="s" x="296" y="360">注意力</text>
  <rect x="150" y="372" width="130" height="30" fill="var(--grey)"/>
  <text class="s" x="296" y="393">鄰近</text>
  <rect x="150" y="402" width="130" height="24" fill="var(--grey)"/>
  <text class="s" x="296" y="421">規模</text>
  <rect x="150" y="426" width="130" height="20" fill="var(--grey)"/>
  <text class="s" x="296" y="443">法規</text>
  <rect x="590" y="150" width="130" height="150" fill="none" stroke="var(--line)" stroke-dasharray="6 6"/>
  <text class="s" x="736" y="232">塌掉</text>
  <rect x="590" y="300" width="130" height="36" fill="var(--accent)"/>
  <rect x="590" y="336" width="130" height="36" fill="var(--accent)"/>
  <rect x="590" y="372" width="130" height="30" fill="var(--accent)"/>
  <rect x="590" y="402" width="130" height="24" fill="var(--accent)"/>
  <rect x="590" y="426" width="130" height="20" fill="var(--accent)"/>
  <text class="s" x="736" y="372">還在手上</text>
  <text class="c" x="60" y="518">該擁有的是拿不走的那幾段</text>
</svg>
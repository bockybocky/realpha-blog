<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A pit marked equities for the last bear market on the left, with an arrow carrying money to a tall column of bonds on the right, cracked at the edge and marked 1873.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">Where the money was escaping from</text>

  <line x1="60" y1="330" x2="900" y2="330" stroke="var(--line)" stroke-width="2"/>

  <path d="M 90 330 C 150 480, 330 480, 390 330 Z" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="240" y="308" font-size="20" fill="var(--dim)" text-anchor="middle">Equities</text>
  <text x="240" y="400" font-size="16" fill="var(--grey)" text-anchor="middle">1845-50 bear market</text>
  <text x="240" y="424" font-size="16" fill="var(--grey)" text-anchor="middle">Burnt</text>

  <path d="M 410 292 Q 486 232 550 250" fill="none" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="558,252 538,240 540,260" fill="var(--dim)"/>
  <text x="482" y="222" font-size="16" fill="var(--dim)" text-anchor="middle">Moved</text>

  <rect x="570" y="250" width="300" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="720" y="296" font-size="16" fill="var(--dim)" text-anchor="middle">British gilts 3%</text>
  <rect x="570" y="196" width="300" height="54" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="720" y="229" font-size="16" fill="var(--dim)" text-anchor="middle">French bonds 4%</text>
  <rect x="570" y="140" width="300" height="56" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="720" y="174" font-size="16" fill="var(--accent)" text-anchor="middle">Railways . ports</text>
  <text x="720" y="118" font-size="20" fill="var(--ink)" text-anchor="middle">Bonds</text>

  <path d="M 878 142 L 862 192 L 884 240 L 864 288 L 880 330" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text x="900" y="240" font-size="16" fill="var(--warn)">1873</text>

  <text x="480" y="480" font-size="22" fill="var(--ink)" text-anchor="middle">Fleeing where you were hurt last time is where the crowd is next time</text>
</svg>
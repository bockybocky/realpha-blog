<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="舞池俯視圖：站在中央的人離安全門很遠，站在門邊的人只有幾步">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="58">同一首歌，不同的距離</text>
<rect x="150" y="100" width="700" height="340" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="138" y="230" width="24" height="90" fill="var(--accent)"/>
<text class="g" x="60" y="262" fill="var(--accent)">安全門</text>
<text class="b" x="60" y="288" fill="var(--accent)">在這裡</text>
<circle cx="560" cy="270" r="18" fill="var(--warn)"/>
<text class="g" x="560" y="232" text-anchor="middle" fill="var(--warn)">舞池中央</text>
<circle cx="220" cy="270" r="18" fill="var(--accent)"/>
<text class="g" x="236" y="330" fill="var(--accent)">門邊</text>
<line x1="166" y1="270" x2="540" y2="270" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<line x1="166" y1="398" x2="200" y2="398" stroke="var(--accent)" stroke-width="6"/>
<text class="b" x="212" y="404" fill="var(--accent)">幾步</text>
<text class="b" x="360" y="246" fill="var(--warn)">很多步</text>
<circle cx="700" cy="180" r="10" fill="var(--grey)" opacity="0.6"/>
<circle cx="760" cy="330" r="10" fill="var(--grey)" opacity="0.6"/>
<circle cx="640" cy="370" r="10" fill="var(--grey)" opacity="0.6"/>
<circle cx="480" cy="160" r="10" fill="var(--grey)" opacity="0.6"/>
<text class="c" x="60" y="500">音樂什麼時候停你決定不了，站哪裡可以</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左三格與右一格的兩欄對照，箭頭指向右邊那一格">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="60">開口之前，先寫兩欄</text>
<text class="g" x="90" y="118">他已經知道</text>
<rect x="90" y="140" width="320" height="64" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="90" y="220" width="320" height="64" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="90" y="300" width="320" height="64" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="172" x2="380" y2="172" stroke="var(--grey)" stroke-width="6"/>
<line x1="120" y1="252" x2="380" y2="252" stroke="var(--grey)" stroke-width="6"/>
<line x1="120" y1="332" x2="380" y2="332" stroke="var(--grey)" stroke-width="6"/>
<text class="n" x="90" y="398">反應已經發生過了</text>
<line x1="480" y1="110" x2="480" y2="400" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="g" x="550" y="118">只有我知道</text>
<rect x="550" y="220" width="320" height="64" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<line x1="580" y1="252" x2="840" y2="252" stroke="var(--accent)" stroke-width="6"/>
<path d="M710 180 L710 212" stroke="var(--accent)" stroke-width="3"/>
<path d="M700 212 L710 230 L720 212 Z" fill="var(--accent)"/>
<text class="g" x="710" y="170" text-anchor="middle">開場從這裡</text>
<text class="c" x="480" y="470" text-anchor="middle">好消息只在還有人不知道時有價格</text>
</svg>
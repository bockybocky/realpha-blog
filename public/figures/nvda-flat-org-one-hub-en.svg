<circle cx="480" cy="170" r="26" fill="var(--accent)"/>
<text x="520" y="150" font-size="20" fill="var(--ink)">About sixty direct reports</text>
<text x="520" y="178" font-size="16" fill="var(--dim)">Big calls made here</text>
<text x="60" y="440" font-size="19" fill="var(--accent)">Upside: one email, solved in seven minutes</text>
<text x="560" y="440" font-size="19" fill="var(--warn)">Downside: no real succession plan</text>
<text x="60" y="495" font-size="22" fill="var(--ink)">The speed and the fragility come from one design</text>

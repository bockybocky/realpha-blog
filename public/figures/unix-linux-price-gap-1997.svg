<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條長度懸殊的橫條：零售 Linux 極短、Windows NT 授權中等、UNIX 整機幾乎跨滿全圖">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">1997 年，一套伺服器軟硬體的價錢</text>
<text class="b" x="60" y="92">橫軸為對數刻度</text>

<rect x="200" y="140" width="680" height="54" rx="6" fill="var(--card)"/>
<rect x="200" y="140" width="50" height="54" rx="6" fill="var(--accent)"/>
<text class="g" x="186" y="163" text-anchor="end">Red Hat</text>
<text class="b" x="186" y="185" text-anchor="end">零售一盒</text>
<text class="n" x="266" y="174">50 美元</text>

<rect x="200" y="240" width="680" height="54" rx="6" fill="var(--card)"/>
<rect x="200" y="240" width="272" height="54" rx="6" fill="var(--grey)"/>
<line x1="329" y1="234" x2="329" y2="300" stroke="var(--ink)" stroke-width="2"/>
<text class="g" x="186" y="263" text-anchor="end">Windows NT</text>
<text class="b" x="186" y="285" text-anchor="end">授權</text>
<text class="n" x="488" y="274">150 ～ 1,100 美元</text>

<rect x="200" y="340" width="680" height="54" rx="6" fill="var(--card)"/>
<rect x="200" y="340" width="663" height="54" rx="6" fill="var(--grey)"/>
<line x1="697" y1="334" x2="697" y2="400" stroke="var(--ink)" stroke-width="2"/>
<text class="g" x="186" y="363" text-anchor="end">UNIX</text>
<text class="b" x="186" y="385" text-anchor="end">軟硬體整機</text>
<text class="n" x="440" y="374" fill="var(--page)">2.5 萬 ～ 25 萬美元</text>

<text class="c" x="60" y="470">差的不是百分比，是數量級</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A level line on top showing the same height before and after, with blocks below moving from the left container to the right one while the total stays the same.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型：思源黑體優先 */
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">The price of money held; its place moved</text>

<text x="70" y="112" font-size="19" font-weight="600" fill="var(--dim)">Price of money</text>
<line x1="200" y1="140" x2="820" y2="140" stroke="var(--grey)" stroke-width="3"/>
<circle cx="200" cy="140" r="7" fill="var(--grey)"/>
<circle cx="820" cy="140" r="7" fill="var(--grey)"/>
<text x="200" y="176" font-size="16" fill="var(--dim)" text-anchor="middle">Before</text>
<text x="820" y="176" font-size="16" fill="var(--dim)" text-anchor="middle">After</text>
<text x="510" y="122" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">Same height</text>

<line x1="70" y1="216" x2="890" y2="216" stroke="var(--line)"/>

<text x="70" y="262" font-size="19" font-weight="600" fill="var(--dim)">Place of money</text>

<rect x="90" y="290" width="300" height="180" fill="var(--card)" stroke="var(--line)"/>
<rect x="570" y="290" width="300" height="180" fill="var(--card)" stroke="var(--line)"/>
<text x="240" y="282" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">Reserves at the Fed</text>
<text x="720" y="282" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">Private lending relationships</text>

<rect x="126" y="392" width="58" height="58" fill="var(--accent)" fill-opacity="0.28" stroke="var(--accent)"/>
<rect x="614" y="392" width="58" height="58" fill="var(--accent)" fill-opacity="0.85" stroke="var(--accent)"/>
<rect x="682" y="392" width="58" height="58" fill="var(--accent)" fill-opacity="0.85" stroke="var(--accent)"/>
<rect x="750" y="392" width="58" height="58" fill="var(--accent)" fill-opacity="0.85" stroke="var(--accent)"/>
<rect x="614" y="324" width="58" height="58" fill="var(--accent)" fill-opacity="0.85" stroke="var(--accent)"/>

<path d="M 410,380 L 540,380" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M 552,380 L 534,371 L 534,389 Z" fill="var(--accent)"/>
<text x="480" y="360" font-size="16" fill="var(--dim)" text-anchor="middle">Moving house</text>
<text x="480" y="418" font-size="16" fill="var(--dim)" text-anchor="middle">Total unchanged</text>

<text x="60" y="527" font-size="22" font-weight="600" fill="var(--ink)">Price moves discount lines; place does not</text>
</svg>
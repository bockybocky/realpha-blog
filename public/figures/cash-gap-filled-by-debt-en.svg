<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The capital expenditure column towers over operating cash flow, and new borrowing fills the gap.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">Earnings Cannot Fund the Data Centers</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">First Half of 2026, Unit: $100 Million</text>

<line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>

<rect x="180" y="345" width="150" height="95" rx="4" fill="var(--accent)" opacity="0.5"/>
<text class="t" x="180" y="330" font-size="20" font-weight="700" fill="var(--ink)">37</text>
<text class="t" x="180" y="472" font-size="19" fill="var(--dim)">Operating Cash Flow</text>

<rect x="620" y="440" width="150" height="0" fill="none"/>
<rect x="620" y="155" width="150" height="285" rx="4" fill="none" stroke="var(--ink)" stroke-width="2"/>
<rect x="620" y="345" width="150" height="95" rx="4" fill="var(--accent)" opacity="0.5"/>
<rect x="620" y="155" width="150" height="190" rx="4" fill="var(--warn)" opacity="0.35"/>
<text class="t" x="620" y="140" font-size="20" font-weight="700" fill="var(--ink)">140</text>
<text class="t" x="620" y="472" font-size="19" fill="var(--dim)">Capex</text>
<text class="t" x="790" y="258" font-size="19" font-weight="700" fill="var(--warn)">Gap: 100+</text>
<text class="t" x="790" y="286" font-size="16" fill="var(--dim)">New Debt</text>
<text class="t" x="790" y="400" font-size="16" fill="var(--dim)">Self-Funded</text>

<line x1="60" y1="500" x2="900" y2="500" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="538" font-size="22" font-weight="700" fill="var(--ink)">No More Borrowing, No More Expansion</text>
</svg>
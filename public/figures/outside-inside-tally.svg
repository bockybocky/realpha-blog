<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩欄清單：左欄標「外」只有兩條、第三條的位置畫著虛線門檻；右欄標「內」四條全滿">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.h { font-size:20px; font-weight:700; }
.b { font-size:16px; }
.c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="70" y="62">數一數，有幾條是從外面來的</text>
<rect x="140" y="110" width="300" height="52" rx="8" fill="var(--accent)"/>
<text class="h" x="165" y="145" fill="var(--page)">外　你影響不了的事實</text>
<rect x="560" y="110" width="300" height="52" rx="8" fill="var(--grey)"/>
<text class="h" x="585" y="145" fill="var(--ink)">內　你自己產生的</text>
<rect x="140" y="190" width="300" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="165" y="219" fill="var(--ink)">別人主動說的話</text>
<rect x="140" y="245" width="300" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="165" y="274" fill="var(--ink)">白紙黑字的數字</text>
<rect x="140" y="300" width="300" height="44" rx="6" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="140" y="355" width="300" height="44" rx="6" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="110" y1="352" x2="470" y2="352" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="b" x="110" y="342" fill="var(--warn)">三條</text>
<rect x="560" y="190" width="300" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="585" y="219" fill="var(--ink)">我覺得</text>
<rect x="560" y="245" width="300" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="585" y="274" fill="var(--ink)">我因此做了什麼</text>
<rect x="560" y="300" width="300" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="585" y="329" fill="var(--ink)">結果被當成證明</text>
<rect x="560" y="355" width="300" height="44" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="585" y="384" fill="var(--ink)">大家都說（同一篇報導）</text>
<text class="c" x="70" y="470">「外」少於三條，那不是把握</text>
<text class="c" x="70" y="505" fill="var(--warn)">是一個轉得很順的圈</text>
</svg>
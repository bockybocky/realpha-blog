<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Only the first 30% of a long axis is filled, leaving the remaining 70% blank.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--dim); }
    .v { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="h" x="480" y="54" text-anchor="middle">Volume at ten—where is price?</text>
<text class="g" x="120" y="150">Usage (expansion already planned)</text>
<rect x="120" y="170" width="720" height="56" fill="var(--grey)"/>
<text class="v" x="126" y="252">One</text>
<text class="v" x="834" y="252" text-anchor="end">Ten</text>
<text class="g" x="120" y="326">Where price has reached</text>
<rect x="120" y="346" width="216" height="56" fill="var(--accent)"/>
<rect x="336" y="346" width="504" height="56" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="v" x="588" y="382" text-anchor="middle" fill="var(--dim)">The gap your research must fill</text>
<line x1="336" y1="170" x2="336" y2="412" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="v" x="328" y="434" text-anchor="end">Three</text>
<text class="s" x="120" y="470">First ask what drives volume and how clear its plan is</text>
<text class="c" x="480" y="506" text-anchor="middle">It may be cheap for a different reason</text>
</svg>
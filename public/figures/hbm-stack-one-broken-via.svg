<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩座同樣八片的晶片疊塔並列，左塔導線全通為良品，右塔一條導線中途斷開，整塔報廢">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">一條沒通，八片全報廢</text>
  <rect x="60" y="100" width="840" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <text class="t" x="260" y="160" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">8 片全通</text>
  <text class="t" x="700" y="160" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">1 條斷</text>

  <rect x="160" y="180" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--accent)" stroke-width="1.4"/>
  <rect x="160" y="208" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--accent)" stroke-width="1.4"/>
  <rect x="160" y="236" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--accent)" stroke-width="1.4"/>
  <rect x="160" y="264" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--accent)" stroke-width="1.4"/>
  <rect x="160" y="292" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--accent)" stroke-width="1.4"/>
  <rect x="160" y="320" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--accent)" stroke-width="1.4"/>
  <rect x="160" y="348" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--accent)" stroke-width="1.4"/>
  <rect x="160" y="376" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--accent)" stroke-width="1.4"/>
  <line x1="200" y1="180" x2="200" y2="402" stroke="var(--accent)" stroke-width="3"/>
  <line x1="260" y1="180" x2="260" y2="402" stroke="var(--accent)" stroke-width="3"/>
  <line x1="320" y1="180" x2="320" y2="402" stroke="var(--accent)" stroke-width="3"/>
  <rect x="140" y="402" width="240" height="14" rx="3" fill="var(--line)"/>
  <text class="t" x="260" y="436" font-size="19" text-anchor="middle" fill="var(--accent)">良品</text>

  <rect x="586" y="168" width="228" height="246" rx="8" fill="none" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="7 6"/>
  <rect x="600" y="180" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--grey)" stroke-width="1.4"/>
  <rect x="600" y="208" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--grey)" stroke-width="1.4"/>
  <rect x="600" y="236" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--grey)" stroke-width="1.4"/>
  <rect x="600" y="264" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--grey)" stroke-width="1.4"/>
  <rect x="600" y="292" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--grey)" stroke-width="1.4"/>
  <rect x="600" y="320" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--grey)" stroke-width="1.4"/>
  <rect x="600" y="348" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--grey)" stroke-width="1.4"/>
  <rect x="600" y="376" width="200" height="22" rx="3" fill="var(--page)" stroke="var(--grey)" stroke-width="1.4"/>
  <line x1="640" y1="180" x2="640" y2="402" stroke="var(--grey)" stroke-width="3"/>
  <line x1="760" y1="180" x2="760" y2="402" stroke="var(--grey)" stroke-width="3"/>
  <line x1="700" y1="312" x2="700" y2="402" stroke="var(--grey)" stroke-width="3"/>
  <line x1="700" y1="180" x2="700" y2="284" stroke="var(--grey)" stroke-width="3" stroke-dasharray="5 6"/>
  <line x1="688" y1="286" x2="712" y2="310" stroke="var(--warn)" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="712" y1="286" x2="688" y2="310" stroke="var(--warn)" stroke-width="3.4" stroke-linecap="round"/>
  <rect x="580" y="402" width="240" height="14" rx="3" fill="var(--line)"/>
  <text class="t" x="700" y="436" font-size="19" text-anchor="middle" font-weight="700" fill="var(--warn)">整組報廢</text>

  <text class="t" x="480" y="296" font-size="19" text-anchor="middle" fill="var(--dim)">差一條</text>

  <text class="t" x="60" y="486" font-size="22" fill="var(--ink)">勝負在怎麼黏起來，不在奈米數</text>
</svg>
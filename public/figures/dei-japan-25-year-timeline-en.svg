<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A timeline that is thin and gray at first and thick and blue at the end, showing the motive shifting from outside requirements to a company's own choice.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="60" font-size="27" fill="var(--ink)">20 years of push</text>

<line x1="90" y1="330" x2="890" y2="330" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="322" width="560" height="16" rx="8" fill="var(--grey)"/>
<rect x="687" y="300" width="183" height="40" rx="10" fill="var(--accent)"/>

<circle cx="110" cy="330" r="6" fill="var(--dim)"/>
<circle cx="201" cy="330" r="6" fill="var(--dim)"/>
<circle cx="292" cy="330" r="6" fill="var(--dim)"/>
<circle cx="475" cy="330" r="6" fill="var(--dim)"/>
<circle cx="566" cy="330" r="6" fill="var(--dim)"/>

<text x="110" y="250" font-size="16" fill="var(--dim)" text-anchor="middle">MNCs</text>
<text x="201" y="212" font-size="16" fill="var(--dim)" text-anchor="middle">Club</text>
<text x="292" y="250" font-size="16" fill="var(--dim)" text-anchor="middle">Work-life</text>
<text x="475" y="212" font-size="16" fill="var(--dim)" text-anchor="middle">Womenomics</text>
<text x="566" y="250" font-size="16" fill="var(--dim)" text-anchor="middle">Law</text>
<text x="778" y="250" font-size="16" fill="var(--accent)" text-anchor="middle">Advantage</text>

<text x="110" y="375" font-size="15" fill="var(--dim)" text-anchor="middle">2001</text>
<text x="201" y="375" font-size="15" fill="var(--dim)" text-anchor="middle">2004</text>
<text x="292" y="375" font-size="15" fill="var(--dim)" text-anchor="middle">2007</text>
<text x="475" y="375" font-size="15" fill="var(--dim)" text-anchor="middle">2013</text>
<text x="566" y="375" font-size="15" fill="var(--dim)" text-anchor="middle">2016</text>
<text x="778" y="375" font-size="15" fill="var(--accent)" text-anchor="middle">2020</text>

<text x="390" y="415" font-size="20" fill="var(--dim)" text-anchor="middle">Pushed</text>
<text x="778" y="415" font-size="20" fill="var(--accent)" text-anchor="middle">Chosen</text>

<text x="80" y="480" font-size="22" fill="var(--ink)">From law to payoff: 20 years</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊柱子有三條注入管補血，右邊同樣的柱子接口空著只有問號">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs>
<marker id="arw7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
</marker>
</defs>
<text x="60" y="52" font-size="27" fill="var(--ink)">補血的那一條線</text>
<rect x="56" y="86" width="400" height="360" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="118" font-size="20" fill="var(--ink)">三星</text>
<rect x="340" y="150" width="86" height="270" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="383" y="292" font-size="19" fill="var(--accent)" text-anchor="middle" transform="rotate(90 383 292)">垂直整合</text>
<g stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#arw7)">
<path d="M212 196 L332 196"/>
<path d="M212 286 L332 286"/>
<path d="M212 376 L332 376"/>
</g>
<text x="80" y="202" font-size="16" fill="var(--dim)">記憶體獲利</text>
<text x="80" y="292" font-size="16" fill="var(--dim)">政府支持</text>
<text x="80" y="382" font-size="16" fill="var(--dim)">集團資金</text>
<rect x="504" y="86" width="400" height="360" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="528" y="118" font-size="20" fill="var(--ink)">Terafab</text>
<rect x="788" y="150" width="86" height="270" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="831" y="292" font-size="19" fill="var(--accent)" text-anchor="middle" transform="rotate(90 831 292)">垂直整合</text>
<path d="M660 196 L780 196" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
<path d="M660 286 L780 286" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
<path d="M660 376 L780 376" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
<text x="596" y="300" font-size="60" fill="var(--warn)" text-anchor="middle">？</text>
<text x="60" y="508" font-size="22" fill="var(--ink)">少掉那條線，垂直整合只剩成本</text>
</svg>
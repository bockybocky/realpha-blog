<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩根柱，第二根剛好越過門檻虛線，思考過程那一欄是空的">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="78">答案往門檻那邊靠過去</text>

  <line x1="100" y1="380" x2="620" y2="380" stroke="var(--grey)" stroke-width="2"/>
  <line x1="100" y1="200" x2="620" y2="200" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="b" x="630" y="196" fill="var(--warn)">門檻 四萬噸</text>

  <rect x="170" y="245" width="100" height="135" rx="4" fill="var(--grey)"/>
  <text class="b" x="220" y="232" text-anchor="middle">三萬噸</text>
  <text class="g" x="220" y="412" text-anchor="middle">直接問</text>

  <rect x="400" y="182" width="100" height="198" rx="4" fill="var(--accent)"/>
  <text class="b" x="450" y="170" text-anchor="middle">四萬一千噸</text>
  <text class="g" x="450" y="412" text-anchor="middle">加一句條件</text>
  <text class="b" x="450" y="440" text-anchor="middle">超過就捐錢</text>

  <rect x="690" y="182" width="190" height="198" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="785" y="222" text-anchor="middle">思考過程裡</text>
  <text class="b" x="785" y="286" text-anchor="middle">找不到</text>
  <text class="b" x="785" y="314" text-anchor="middle">「我需要把數字抬高」</text>
  <text class="b" x="785" y="412" text-anchor="middle">只剩更用力的推理</text>

  <text class="c" x="80" y="492">所以它的自述不能當證據</text>
</svg>
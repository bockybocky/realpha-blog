<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two timelines, with the first gap on the lower one stretched out to show replacement being delayed.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">The stretch where replacement got pushed out</text>

<rect x="50" y="100" width="860" height="310" rx="14" fill="var(--card)"/>

<text x="90" y="166" font-size="20" font-weight="700" fill="var(--dim)">Before</text>
<line x1="90" y1="200" x2="870" y2="200" stroke="var(--line)" stroke-width="3"/>
<circle cx="140" cy="200" r="11" fill="var(--grey)"/>
<circle cx="380" cy="200" r="11" fill="var(--grey)"/>
<circle cx="620" cy="200" r="11" fill="var(--grey)"/>
<circle cx="860" cy="200" r="11" fill="var(--grey)"/>
<text x="260" y="236" font-size="16" fill="var(--dim)" text-anchor="middle">5 years</text>
<text x="500" y="236" font-size="16" fill="var(--dim)" text-anchor="middle">5 years</text>
<text x="740" y="236" font-size="16" fill="var(--dim)" text-anchor="middle">5 years</text>

<text x="90" y="306" font-size="20" font-weight="700" fill="var(--accent)">After memory got expensive</text>
<line x1="90" y1="340" x2="870" y2="340" stroke="var(--line)" stroke-width="3"/>
<circle cx="140" cy="340" r="11" fill="var(--grey)"/>
<circle cx="560" cy="340" r="11" fill="var(--accent)"/>
<circle cx="800" cy="340" r="11" fill="var(--grey)"/>
<line x1="140" y1="372" x2="560" y2="372" stroke="var(--accent)" stroke-width="3"/>
<text x="350" y="396" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Delayed: keep it till it dies</text>
<text x="680" y="372" font-size="16" fill="var(--dim)" text-anchor="middle">5 years again</text>

<text x="60" y="476" font-size="22" font-weight="700" fill="var(--ink)">The pushed-out stretch never fills itself back in</text>
</svg>
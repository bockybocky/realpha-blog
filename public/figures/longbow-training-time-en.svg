<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The tools are the same size, but the time-to-proficiency bars differ wildly in length.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.ttl{font-size:27px;font-weight:700}
.grp{font-size:20px;font-weight:700}
.bdy{font-size:16px;fill:var(--dim)}
.cnc{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="ttl" x="60" y="62">Agincourt 1415</text>

<text class="bdy" x="60" y="110">Tool</text>
<rect x="60" y="126" width="180" height="84" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="grp" x="120" y="175">Bow</text>
<rect x="280" y="126" width="180" height="84" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="grp" x="326" y="175">Xbow</text>
<text class="bdy" x="488" y="175">Same</text>

<text class="bdy" x="60" y="280">Training</text>
<text class="grp" x="60" y="330">Bow</text>
<rect x="190" y="310" width="660" height="26" rx="4" fill="var(--accent)"/>
<text class="bdy" x="862" y="330">Yrs</text>
<text class="grp" x="60" y="400">Xbow</text>
<rect x="190" y="380" width="18" height="26" rx="4" fill="var(--grey)"/>
<text class="bdy" x="222" y="400">Pick up</text>

<text class="cnc" x="60" y="472">Not bows, arms</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" id="fig-two-fives" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One line falls from a high level and one rises from a low one, meeting at the same point on the right">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
#fig-two-fives text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-two-fives .h { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-two-fives .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-two-fives .b { font-size:16px; fill:var(--dim); }
#fig-two-fives .s { font-size:15px; fill:var(--dim); }
#fig-two-fives .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="h" x="60" y="54">Same 5%, tailwind or headwind</text>
<line x1="120" y1="130" x2="120" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="460" x2="880" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="340" x2="880" y2="340" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>
<path d="M 140 140 L 760 340" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M 140 440 L 760 340" fill="none" stroke="var(--warn)" stroke-width="4"/>
<circle cx="760" cy="340" r="9" fill="var(--ink)"/>
<text class="g" x="782" y="334">5%</text>
<text class="s" x="782" y="358">Same number</text>
<text class="g" x="150" y="128" fill="var(--accent)">15%</text>
<text class="b" x="210" y="212" fill="var(--accent)">1990s: easing down</text>
<text class="s" x="210" y="238" fill="var(--accent)">Cheaper money, a tailwind</text>
<text class="g" x="150" y="470" fill="var(--warn)">0%</text>
<text class="b" x="210" y="424" fill="var(--warn)">Now: climbing</text>
<text class="s" x="210" y="398" fill="var(--warn)">Costlier money, headwind</text>
<text class="c" x="60" y="522">Where you came from defines it</text>
</svg>
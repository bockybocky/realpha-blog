<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The top half shows three unbroken color bands standing for one worker per step; the bottom half shows one band chopped into more than twenty short segments, standing for one brain whose continuous time is cut apart.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="52" font-size="27" fill="var(--ink)">What gets divided differs</text>

<text x="60" y="112" font-size="19" fill="var(--dim)">Pin factory: divide the steps</text>
<text x="225" y="152" font-size="15" fill="var(--dim)" text-anchor="end">Worker 1</text>
<rect x="240" y="130" width="660" height="32" fill="var(--accent)"/>
<text x="225" y="197" font-size="15" fill="var(--dim)" text-anchor="end">Worker 2</text>
<rect x="240" y="175" width="660" height="32" fill="var(--grey)"/>
<text x="225" y="242" font-size="15" fill="var(--dim)" text-anchor="end">Worker 3</text>
<rect x="240" y="220" width="660" height="32" fill="var(--card)" stroke="var(--line)"/>
<text x="900" y="282" font-size="15" fill="var(--dim)" text-anchor="end">One step, all day long</text>

<text x="60" y="332" font-size="19" fill="var(--accent)">Your day: divide the attention</text>
<text x="225" y="377" font-size="15" fill="var(--dim)" text-anchor="end">One brain</text>
<rect x="240" y="352" width="28" height="40" fill="var(--accent)"/>
<rect x="270" y="352" width="28" height="40" fill="var(--grey)"/>
<rect x="300" y="352" width="28" height="40" fill="var(--card)" stroke="var(--line)"/>
<rect x="330" y="352" width="28" height="40" fill="var(--grey)"/>
<rect x="360" y="352" width="28" height="40" fill="var(--accent)"/>
<rect x="390" y="352" width="28" height="40" fill="var(--card)" stroke="var(--line)"/>
<rect x="420" y="352" width="28" height="40" fill="var(--grey)"/>
<rect x="450" y="352" width="28" height="40" fill="var(--accent)"/>
<rect x="480" y="352" width="28" height="40" fill="var(--grey)"/>
<rect x="510" y="352" width="28" height="40" fill="var(--card)" stroke="var(--line)"/>
<rect x="540" y="352" width="28" height="40" fill="var(--accent)"/>
<rect x="570" y="352" width="28" height="40" fill="var(--grey)"/>
<rect x="600" y="352" width="28" height="40" fill="var(--card)" stroke="var(--line)"/>
<rect x="630" y="352" width="28" height="40" fill="var(--accent)"/>
<rect x="660" y="352" width="28" height="40" fill="var(--grey)"/>
<rect x="690" y="352" width="28" height="40" fill="var(--accent)"/>
<rect x="720" y="352" width="28" height="40" fill="var(--card)" stroke="var(--line)"/>
<rect x="750" y="352" width="28" height="40" fill="var(--grey)"/>
<rect x="780" y="352" width="28" height="40" fill="var(--accent)"/>
<rect x="810" y="352" width="28" height="40" fill="var(--grey)"/>
<rect x="840" y="352" width="28" height="40" fill="var(--card)" stroke="var(--line)"/>
<rect x="870" y="352" width="28" height="40" fill="var(--accent)"/>
<text x="240" y="424" font-size="15" fill="var(--dim)">About fifty seconds each</text>

<text x="480" y="500" font-size="22" fill="var(--ink)" text-anchor="middle">One brain, chopped into dozens of pieces</text>
</svg>
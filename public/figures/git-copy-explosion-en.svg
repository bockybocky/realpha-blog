<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A 100 GB history is copied into a grid of one hundred small squares, which converge below into an enormous daily data volume.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" fill="var(--ink)">Git assumes everyone keeps a copy</text>
<rect x="70" y="150" width="170" height="40" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="70" y="196" width="170" height="40" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="70" y="242" width="170" height="40" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="92" y="222" font-size="20" fill="var(--ink)">History</text>
<text x="92" y="318" font-size="19" fill="var(--accent)">100 GB</text>
<line x1="258" y1="216" x2="350" y2="216" stroke="var(--grey)" stroke-width="3"/>
<path d="M350 208 L368 216 L350 224 Z" fill="var(--grey)"/>
<g fill="var(--accent)">
<rect x="390" y="120" width="34" height="34"/><rect x="432" y="120" width="34" height="34"/><rect x="474" y="120" width="34" height="34"/><rect x="516" y="120" width="34" height="34"/><rect x="558" y="120" width="34" height="34"/><rect x="600" y="120" width="34" height="34"/><rect x="642" y="120" width="34" height="34"/><rect x="684" y="120" width="34" height="34"/><rect x="726" y="120" width="34" height="34"/><rect x="768" y="120" width="34" height="34"/>
<rect x="390" y="162" width="34" height="34"/><rect x="432" y="162" width="34" height="34"/><rect x="474" y="162" width="34" height="34"/><rect x="516" y="162" width="34" height="34"/><rect x="558" y="162" width="34" height="34"/><rect x="600" y="162" width="34" height="34"/><rect x="642" y="162" width="34" height="34"/><rect x="684" y="162" width="34" height="34"/><rect x="726" y="162" width="34" height="34"/><rect x="768" y="162" width="34" height="34"/>
<rect x="390" y="204" width="34" height="34"/><rect x="432" y="204" width="34" height="34"/><rect x="474" y="204" width="34" height="34"/><rect x="516" y="204" width="34" height="34"/><rect x="558" y="204" width="34" height="34"/><rect x="600" y="204" width="34" height="34"/><rect x="642" y="204" width="34" height="34"/><rect x="684" y="204" width="34" height="34"/><rect x="726" y="204" width="34" height="34"/><rect x="768" y="204" width="34" height="34"/>
<rect x="390" y="246" width="34" height="34"/><rect x="432" y="246" width="34" height="34"/><rect x="474" y="246" width="34" height="34"/><rect x="516" y="246" width="34" height="34"/><rect x="558" y="246" width="34" height="34"/><rect x="600" y="246" width="34" height="34"/><rect x="642" y="246" width="34" height="34"/><rect x="684" y="246" width="34" height="34"/><rect x="726" y="246" width="34" height="34"/><rect x="768" y="246" width="34" height="34"/>
<rect x="390" y="288" width="34" height="34"/><rect x="432" y="288" width="34" height="34"/><rect x="474" y="288" width="34" height="34"/><rect x="516" y="288" width="34" height="34"/><rect x="558" y="288" width="34" height="34"/><rect x="600" y="288" width="34" height="34"/><rect x="642" y="288" width="34" height="34"/><rect x="684" y="288" width="34" height="34"/><rect x="726" y="288" width="34" height="34"/><rect x="768" y="288" width="34" height="34"/>
</g>
<text x="390" y="356" font-size="19" fill="var(--ink)">One workspace per agent</text>
<line x1="390" y1="392" x2="812" y2="392" stroke="var(--line)" stroke-width="2"/>
<text x="390" y="446" font-size="22" fill="var(--warn)">600 PB per day</text>
<text x="390" y="480" font-size="16" fill="var(--dim)">Equals 600 million GB</text>
</svg>
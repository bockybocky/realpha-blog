<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三條向右上的斜線，英國與德國爬到相同高度，美國從相同起點爬到近兩倍高">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="40" y="58">醫療佔 GDP 的比重：同一個方向</text>
<line x1="240" y1="120" x2="240" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="240" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="240" y1="120" x2="880" y2="120" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 6"/>
<text class="b" x="196" y="126">20%</text>
<text class="b" x="206" y="476">0%</text>
<text class="b" x="248" y="500">早期</text>
<text class="b" x="820" y="500">現在</text>
<line x1="300" y1="358" x2="820" y2="256" stroke="var(--grey)" stroke-width="5"/>
<line x1="300" y1="307" x2="820" y2="256" stroke="var(--grey)" stroke-width="5"/>
<line x1="300" y1="307" x2="820" y2="154" stroke="var(--accent)" stroke-width="7"/>
<circle cx="300" cy="358" r="7" fill="var(--grey)"/>
<circle cx="300" cy="307" r="7" fill="var(--grey)"/>
<circle cx="820" cy="256" r="8" fill="var(--grey)"/>
<circle cx="300" cy="307" r="8" fill="var(--accent)"/>
<circle cx="820" cy="154" r="9" fill="var(--accent)"/>
<text class="g" x="836" y="148">美國 18%</text>
<text class="g" x="836" y="262">英國 · 德國 12%</text>
<text class="b" x="256" y="352">英 6%</text>
<text class="b" x="248" y="294">德 · 美 9%</text>
<text class="c" x="240" y="532">大家走在同一條路上，美國走得比較前面</text>
</svg>
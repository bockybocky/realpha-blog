<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四次利多的時間軸上，藍線每次利多後階梯式走高，橘線每次利多後先小漲再跌得更深，一路走低">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">同樣是利多，兩種走法</text>
<line x1="90" y1="120" x2="90" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="90" y1="470" x2="760" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="82" y="130" text-anchor="end" font-size="15" fill="var(--dim)">股價</text>
<text x="760" y="498" text-anchor="end" font-size="15" fill="var(--dim)">時間 →</text>
<line x1="190" y1="130" x2="190" y2="470" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 6"/>
<line x1="340" y1="130" x2="340" y2="470" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 6"/>
<line x1="490" y1="130" x2="490" y2="470" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 6"/>
<line x1="640" y1="130" x2="640" y2="470" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 6"/>
<text x="190" y="120" text-anchor="middle" font-size="15" fill="var(--dim)">利多</text>
<text x="340" y="120" text-anchor="middle" font-size="15" fill="var(--dim)">利多</text>
<text x="490" y="120" text-anchor="middle" font-size="15" fill="var(--dim)">利多</text>
<text x="640" y="120" text-anchor="middle" font-size="15" fill="var(--dim)">利多</text>
<polyline points="90,400 190,392 215,355 340,348 365,310 490,303 515,265 640,258 665,220 760,214" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round"/>
<polyline points="90,320 190,314 202,290 225,345 340,352 352,332 375,385 490,390 502,372 525,420 640,425 652,412 675,445 760,448" fill="none" stroke="var(--warn)" stroke-width="4" stroke-linejoin="round"/>
<text x="775" y="220" font-size="19" font-weight="700" fill="var(--accent)">業績兌現</text>
<text x="775" y="454" font-size="19" font-weight="700" fill="var(--warn)">利多就出貨</text>
<text x="480" y="538" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">利多後有人接，才有下一次</text>
</svg>
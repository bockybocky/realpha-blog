<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The waterline rises and submerges the lower step-instructions layer, while the upper context layer stays above the surface">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">The waterline rises, drowning the steps first</text>
<rect x="260" y="110" width="440" height="160" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="260" y="270" width="440" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="260" y="300" width="440" height="160" fill="var(--accent)" fill-opacity="0.18"/>
<line x1="260" y1="300" x2="700" y2="300" stroke="var(--accent)" stroke-width="3"/>
<text x="288" y="150" font-size="20" fill="var(--ink)">Your context</text>
<text x="288" y="186" font-size="16" fill="var(--dim)">Where the data lives</text>
<text x="288" y="214" font-size="16" fill="var(--dim)">How you define done</text>
<text x="288" y="242" font-size="16" fill="var(--dim)">Your taste</text>
<text x="288" y="292" font-size="20" fill="var(--dim)">Step instructions</text>
<text x="288" y="342" font-size="16" fill="var(--grey)">Check this first</text>
<text x="288" y="378" font-size="16" fill="var(--grey)">Then compute that</text>
<text x="288" y="414" font-size="16" fill="var(--grey)">Remember to check</text>
<line x1="210" y1="460" x2="210" y2="312" stroke="var(--accent)" stroke-width="3"/>
<polygon points="210,296 202,314 218,314" fill="var(--accent)"/>
<text x="196" y="486" font-size="16" fill="var(--dim)" text-anchor="middle">Model capability</text>
<text x="724" y="392" font-size="16" fill="var(--dim)">Already submerged</text>
<text x="724" y="180" font-size="16" fill="var(--dim)">Can't be cut</text>
<text x="60" y="522" font-size="22" fill="var(--ink)">What's above the waterline is what's actually yours</text>
</svg>
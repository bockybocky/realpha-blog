<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="冰山形狀：水面上只有碼表，水下三層能力，最底一層最大是感覺">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="60" y="60">碼表不會說謊，但它只露出一小塊</text>

<rect x="380" y="86" width="200" height="52" rx="10" fill="var(--accent)"/>
<text class="t g" x="432" y="120" fill="var(--page)">碼表</text>
<line x1="60" y1="152" x2="900" y2="152" stroke="var(--line)" stroke-width="4"/>
<text class="t b" x="60" y="144">量得到</text>
<text class="t b" x="60" y="180">量不到</text>

<rect x="300" y="176" width="360" height="62" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="324" y="216">把車調對</text>
<rect x="250" y="252" width="460" height="62" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="274" y="292">跟工程師互動</text>
<rect x="200" y="328" width="560" height="62" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="224" y="368">照顧贊助商</text>
<rect x="120" y="404" width="720" height="86" rx="10" fill="var(--warn)" opacity="0.9"/>
<text class="t g" x="148" y="442" fill="var(--page)">感覺</text>
<text class="t b" x="148" y="472" fill="var(--page)">把車綁在自己身上・基因</text>

<text class="t c" x="60" y="534">天賦在最底層，而最上層才是你看到的數字</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A three-segment bar for one ten-minute roast, where drying takes over half the time and development is the narrowest segment.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="80" y="76" font-size="27" font-weight="700" fill="var(--ink)">Ten minutes, half of it spent before much happens</text>
  <text x="80" y="110" font-size="16" fill="var(--dim)">Model defaults</text>

  <rect x="80" y="180" width="429.6" height="86" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="509.6" y="180" width="203.6" height="86" rx="6" fill="var(--grey)" opacity="0.45"/>
  <rect x="713.2" y="180" width="166.8" height="86" rx="6" fill="var(--accent)" opacity="0.85"/>

  <text x="294" y="232" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">Drying</text>
  <text x="611" y="232" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">Color and aroma</text>
  <text x="796" y="232" font-size="20" font-weight="700" text-anchor="middle" fill="var(--page)">Development</text>

  <line x1="509.6" y1="170" x2="509.6" y2="300" stroke="var(--line)" stroke-width="2"/>
  <line x1="713.2" y1="170" x2="713.2" y2="300" stroke="var(--accent)" stroke-width="3"/>
  <line x1="880" y1="170" x2="880" y2="300" stroke="var(--line)" stroke-width="2"/>

  <text x="80" y="330" font-size="16" fill="var(--dim)">0:00</text>
  <text x="509.6" y="330" font-size="16" text-anchor="middle" fill="var(--dim)">5:27</text>
  <text x="713.2" y="330" font-size="16" text-anchor="middle" fill="var(--accent)" font-weight="700">8:02</text>
  <text x="880" y="330" font-size="16" text-anchor="end" fill="var(--dim)">10:09</text>
  <text x="713.2" y="356" font-size="15" text-anchor="middle" fill="var(--accent)">First crack</text>
  <text x="880" y="356" font-size="15" text-anchor="end" fill="var(--dim)">Drop</text>

  <text x="294" y="406" font-size="19" text-anchor="middle" fill="var(--ink)">54%</text>
  <text x="611" y="406" font-size="19" text-anchor="middle" fill="var(--ink)">25%</text>
  <text x="796" y="406" font-size="19" text-anchor="middle" fill="var(--ink)">21%</text>

  <text x="80" y="470" font-size="22" font-weight="700" fill="var(--ink)">The taste is decided in the narrowest segment</text>
</svg>
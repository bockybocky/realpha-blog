<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左格小圓在大圓之內，右格方塊在大圓之外用虛線相連">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">長在裡面，還是另外掛一份</text>
<circle cx="270" cy="280" r="150" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="270" cy="300" r="66" fill="var(--accent)" opacity="0.85"/>
<text x="228" y="308" font-size="19" font-weight="700" fill="var(--page)">多樣性</text>
<text x="196" y="170" font-size="20" font-weight="700" fill="var(--ink)">經營戰略</text>
<text x="180" y="470" font-size="19" font-weight="700" fill="var(--accent)">同一份文件</text>
<circle cx="640" cy="280" r="150" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<text x="566" y="290" font-size="20" font-weight="700" fill="var(--ink)">經營戰略</text>
<rect x="790" y="330" width="130" height="80" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
<text x="806" y="378" font-size="19" font-weight="700" fill="var(--dim)">方針</text>
<line x1="760" y1="352" x2="786" y2="366" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
<text x="556" y="470" font-size="19" font-weight="700" fill="var(--dim)">另外一份文件</text>
<text x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">位置決定它有沒有份量</text>
</svg>
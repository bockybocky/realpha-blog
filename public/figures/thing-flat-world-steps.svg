<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="下層三條平線代表東西沒變，上層階梯代表外部問題改變，階梯跳升處對齊醒來的點">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="56" font-size="27" fill="var(--ink)">東西沒變，外面變了</text>

<text x="40" y="110" font-size="20" fill="var(--accent)">外部問題</text>
<path d="M190 200 L380 200 L380 168 L560 168 L560 136 L760 136 L760 104 L900 104" fill="none" stroke="var(--accent)" stroke-width="6"/>
<text x="286" y="232" font-size="16" fill="var(--dim)">比例與靈感</text>
<text x="412" y="200" font-size="16" fill="var(--dim)">我們是誰</text>
<text x="592" y="168" font-size="16" fill="var(--dim)">理性假設破功</text>
<text x="786" y="136" font-size="16" fill="var(--dim)">耗能與排碳</text>

<line x1="190" y1="270" x2="900" y2="270" stroke="var(--line)" stroke-dasharray="5 6"/>
<text x="40" y="330" font-size="20" fill="var(--dim)">東西本身</text>

<text x="40" y="382" font-size="16" fill="var(--ink)">配方</text>
<line x1="190" y1="376" x2="900" y2="376" stroke="var(--grey)" stroke-width="5"/>
<text x="40" y="432" font-size="16" fill="var(--ink)">白鯨記</text>
<line x1="320" y1="426" x2="900" y2="426" stroke="var(--grey)" stroke-width="5"/>
<text x="40" y="482" font-size="16" fill="var(--ink)">明斯基</text>
<line x1="500" y1="476" x2="900" y2="476" stroke="var(--grey)" stroke-width="5"/>

<circle cx="380" cy="426" r="10" fill="var(--accent)"/>
<circle cx="560" cy="476" r="10" fill="var(--accent)"/>
<circle cx="760" cy="376" r="10" fill="var(--accent)"/>
<line x1="380" y1="200" x2="380" y2="426" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 5"/>
<line x1="560" y1="168" x2="560" y2="476" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 5"/>
<line x1="760" y1="136" x2="760" y2="376" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 5"/>

<text x="40" y="534" font-size="22" fill="var(--ink)">醒的那一刻，是上面那條線跳了一格</text>
</g>
</svg>
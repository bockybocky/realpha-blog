<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="實線框內是地方性污染物四項，框外虛線框是二氧化碳，顯示乾淨的定義畫在哪裡">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">「乾淨」這個詞畫在哪一條線上</text>
<rect x="60" y="110" width="520" height="300" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="90" y="152" font-size="20" fill="var(--accent)">這集算進去的</text>
<text x="90" y="212" font-size="19" fill="var(--ink)">氮氧化物</text>
<text x="330" y="212" font-size="19" fill="var(--ink)">硫氧化物</text>
<text x="90" y="268" font-size="19" fill="var(--ink)">用水</text>
<text x="330" y="268" font-size="19" fill="var(--ink)">噪音</text>
<text x="90" y="330" font-size="16" fill="var(--dim)">聞得到、看得到、喝得到</text>
<text x="90" y="360" font-size="16" fill="var(--dim)">社區聽證會吵的那幾項</text>
<rect x="640" y="180" width="250" height="160" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text x="670" y="222" font-size="20" fill="var(--warn)">框外</text>
<text x="670" y="272" font-size="19" fill="var(--ink)">二氧化碳</text>
<text x="670" y="308" font-size="16" fill="var(--dim)">整集沒給數字</text>
<text x="60" y="474" font-size="22" fill="var(--ink)">客戶的承諾寫在框外時，這套說法接不上</text>
</svg>
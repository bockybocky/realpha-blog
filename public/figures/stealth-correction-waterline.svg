<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="指數線在水面上走平，水面下兩條比例條只填了四分之一與不到一半">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="48" y="62">水面上沒事，水面下在跌</text>
<polyline points="110,150 230,138 350,158 470,132 590,152 710,136 830,146" fill="none" stroke="var(--accent)" stroke-width="6"/>
<text class="g" x="110" y="118" fill="var(--accent)">指數</text>
<line x1="48" y1="220" x2="912" y2="220" stroke="var(--ink)" stroke-width="4"/>
<rect x="48" y="224" width="864" height="252" fill="var(--card)"/>
<text class="g" x="76" y="286">站在 50 日均線上方</text>
<rect x="76" y="302" width="600" height="34" rx="4" fill="var(--grey)" opacity="0.45"/>
<rect x="76" y="302" width="150" height="34" rx="4" fill="var(--warn)"/>
<text class="g" x="696" y="328">25%</text>
<text class="g" x="76" y="392">站在 200 日均線上方</text>
<rect x="76" y="408" width="600" height="34" rx="4" fill="var(--grey)" opacity="0.45"/>
<rect x="76" y="408" width="276" height="34" rx="4" fill="var(--warn)"/>
<text class="g" x="696" y="434">46%</text>
<text class="c" x="48" y="520">指數被最不怕利率的那幾檔撐著</text>
</svg>
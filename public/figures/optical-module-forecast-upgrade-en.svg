<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three pairs of bars show the 2026, 2027 and 2028 optical module market forecasts, with the blue upgraded bars rising further above the gray prior bars each year, by 33%, 81% and 115%.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text x="480" y="52" class="t" text-anchor="middle">Optical module forecasts: bigger raises further out</text>
<text x="100" y="100" class="b">Unit: US$100M</text>
<line x1="100" y1="470" x2="860" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="142" y="358" width="70" height="112" fill="var(--grey)"/>
<rect x="228" y="321" width="70" height="149" fill="var(--accent)"/>
<text x="263" y="311" class="b" text-anchor="middle">677</text>
<text x="263" y="281" class="g" text-anchor="middle" style="fill:var(--accent)">+33%</text>
<rect x="402" y="310" width="70" height="160" fill="var(--grey)"/>
<rect x="488" y="181" width="70" height="289" fill="var(--accent)"/>
<text x="523" y="171" class="b" text-anchor="middle">1,314</text>
<text x="523" y="141" class="g" text-anchor="middle" style="fill:var(--accent)">+81%</text>
<rect x="662" y="318" width="70" height="152" fill="var(--grey)"/>
<rect x="748" y="143" width="70" height="327" fill="var(--accent)"/>
<text x="783" y="133" class="b" text-anchor="middle">1,485</text>
<text x="783" y="103" class="g" text-anchor="middle" style="fill:var(--accent)">+115%</text>
<text x="220" y="500" class="g" text-anchor="middle">2026</text>
<text x="480" y="500" class="g" text-anchor="middle">2027</text>
<text x="740" y="500" class="g" text-anchor="middle">2028</text>
<rect x="290" y="526" width="16" height="16" fill="var(--grey)"/>
<text x="314" y="540" class="b">Prior (implied)</text>
<rect x="560" y="526" width="16" height="16" fill="var(--accent)"/>
<text x="584" y="540" class="b">Raised (Goldman)</text>
</svg>
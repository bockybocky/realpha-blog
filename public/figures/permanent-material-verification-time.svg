<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條橫向長條：三千小時約四個月，一萬小時約十四個月，後者長了三倍多">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="60" y="64">驗證一種永久材料，要等多久</text>
<text class="b" x="60" y="98">信賴性測試時數，換算成月</text>
<g stroke="var(--line)" stroke-width="1">
<line x1="228.6" y1="150" x2="228.6" y2="410"/>
<line x1="337.1" y1="150" x2="337.1" y2="410"/>
<line x1="445.7" y1="150" x2="445.7" y2="410"/>
<line x1="554.3" y1="150" x2="554.3" y2="410"/>
<line x1="662.9" y1="150" x2="662.9" y2="410"/>
<line x1="771.4" y1="150" x2="771.4" y2="410"/>
<line x1="880" y1="150" x2="880" y2="410"/>
</g>
<text class="g" x="120" y="170">三千小時</text>
<text class="b" x="220" y="170">車用、AI GPU 常見</text>
<rect x="120" y="185" width="223" height="56" rx="4" fill="var(--accent)"/>
<text class="g" x="358" y="221">約 4 個月</text>
<text class="g" x="120" y="300">一萬小時</text>
<text class="b" x="220" y="300">較嚴格</text>
<rect x="120" y="315" width="744" height="56" rx="4" fill="var(--accent)"/>
<text class="g" x="850" y="351" text-anchor="end" style="fill:var(--page)">約 14 個月</text>
<line x1="120" y1="410" x2="880" y2="410" stroke="var(--dim)" stroke-width="2"/>
<g class="b" text-anchor="middle">
<text class="b" x="120" y="438">0</text>
<text class="b" x="228.6" y="438">2</text>
<text class="b" x="337.1" y="438">4</text>
<text class="b" x="445.7" y="438">6</text>
<text class="b" x="554.3" y="438">8</text>
<text class="b" x="662.9" y="438">10</text>
<text class="b" x="771.4" y="438">12</text>
<text class="b" x="880" y="438">14</text>
</g>
<text class="b" x="910" y="438">月</text>
<text class="c" x="60" y="500">光驗證，就是四個月起跳</text>
</svg>
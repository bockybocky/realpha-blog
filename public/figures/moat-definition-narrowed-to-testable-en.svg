<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A small solid circle inside a large dashed circle, with an arrow to a tall bar and a short bar on the right, standing for a narrowed definition you can measure">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">Narrow the moat until it is measurable</text>
<circle cx="260" cy="300" r="140" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="260" y="200" font-size="20" fill="var(--dim)" text-anchor="middle">CUDA ecosystem</text>
<circle cx="260" cy="325" r="66" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="260" y="332" font-size="16" fill="var(--accent)" text-anchor="middle">Porting cost</text>
<text x="260" y="500" font-size="16" fill="var(--grey)" text-anchor="middle">Broad · no falsifier</text>
<line x1="440" y1="300" x2="536" y2="300" stroke="var(--dim)" stroke-width="3"/>
<polygon points="548,300 532,293 532,307" fill="var(--dim)"/>
<text x="494" y="280" font-size="19" fill="var(--dim)" text-anchor="middle">Narrow</text>
<text x="750" y="176" font-size="19" fill="var(--dim)" text-anchor="middle">Porting cost</text>
<line x1="620" y1="200" x2="620" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="620" y1="430" x2="890" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="665" y="210" width="64" height="220" fill="var(--grey)"/>
<rect x="785" y="350" width="64" height="80" fill="var(--accent)"/>
<text x="697" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">Before</text>
<text x="817" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">Now</text>
<text x="750" y="500" font-size="16" fill="var(--accent)" text-anchor="middle">Narrow · measurable</text>
<text x="480" y="548" font-size="22" fill="var(--ink)" text-anchor="middle">Narrower definitions show slippage sooner</text>
</svg>
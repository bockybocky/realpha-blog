<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="界線左側機密折回本機，右側日常工作穿過界線到雲端零保留供應商">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="80" y="72" font-size="27" font-weight="700" fill="var(--ink)">分兩堆，界線在我家門口</text>

<rect x="80" y="110" width="480" height="340" fill="var(--card)" stroke="var(--line)"/>
<text x="100" y="142" font-size="19" fill="var(--dim)">家裡</text>
<line x1="560" y1="100" x2="560" y2="470" stroke="var(--warn)" stroke-width="3"/>
<text x="572" y="142" font-size="19" fill="var(--dim)">雲端</text>

<rect x="120" y="180" width="170" height="60" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text x="205" y="218" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">機密</text>
<path d="M290 210 H400 V330 H290" fill="none" stroke="var(--warn)" stroke-width="2"/>
<polygon points="296,324 296,336 284,330" fill="var(--warn)"/>
<rect x="120" y="300" width="170" height="60" fill="none" stroke="var(--line)" stroke-width="2"/>
<text x="205" y="338" font-size="20" fill="var(--ink)" text-anchor="middle">本機 Qwen</text>

<rect x="120" y="390" width="170" height="52" fill="none" stroke="var(--line)" stroke-width="2"/>
<text x="205" y="424" font-size="20" fill="var(--ink)" text-anchor="middle">日常</text>
<line x1="290" y1="416" x2="690" y2="416" stroke="var(--accent)" stroke-width="2"/>
<polygon points="690,410 690,422 704,416" fill="var(--accent)"/>
<rect x="712" y="388" width="168" height="56" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="796" y="414" font-size="19" fill="var(--accent)" text-anchor="middle">零保留</text>
<text x="796" y="434" font-size="19" fill="var(--accent)" text-anchor="middle">供應商</text>

<text x="80" y="510" font-size="22" font-weight="700" fill="var(--ink)">按下送出，資料就出了門</text>
</svg>
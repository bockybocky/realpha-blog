<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="劇烈鋸齒的線最後落在起點以下，上方有一條陰影供給帶壓著">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="64" font-size="27" fill="var(--ink)">頭上懸著供給的那種股票</text>

<rect x="60" y="96" width="840" height="330" fill="var(--card)" rx="10"/>
<rect x="100" y="118" width="780" height="44" fill="var(--warn)" opacity="0.3" rx="6"/>
<text x="118" y="146" font-size="19" fill="var(--ink)">最多 600 億美元隨市發行</text>
<line x1="300" y1="168" x2="300" y2="200" stroke="var(--warn)" stroke-width="2"/>
<line x1="300" y1="200" x2="294" y2="188" stroke="var(--warn)" stroke-width="2"/>
<line x1="300" y1="200" x2="306" y2="188" stroke="var(--warn)" stroke-width="2"/>
<line x1="560" y1="168" x2="560" y2="200" stroke="var(--warn)" stroke-width="2"/>
<line x1="560" y1="200" x2="554" y2="188" stroke="var(--warn)" stroke-width="2"/>
<line x1="560" y1="200" x2="566" y2="188" stroke="var(--warn)" stroke-width="2"/>
<line x1="760" y1="168" x2="760" y2="200" stroke="var(--warn)" stroke-width="2"/>
<line x1="760" y1="200" x2="754" y2="188" stroke="var(--warn)" stroke-width="2"/>
<line x1="760" y1="200" x2="766" y2="188" stroke="var(--warn)" stroke-width="2"/>

<line x1="100" y1="320" x2="880" y2="320" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="100" y="344" font-size="16" fill="var(--dim)">年初</text>
<polyline points="100,320 180,252 262,364 348,276 436,384 520,296 604,400 692,236 790,300 880,352" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="880" cy="352" r="6" fill="var(--accent)"/>
<text x="796" y="380" font-size="16" fill="var(--ink)">年初至今負報酬</text>

<text x="60" y="482" font-size="22" fill="var(--ink)">股價一有好消息往上跳，就撒一點股票下來</text>
<text x="60" y="522" font-size="20" fill="var(--dim)">買回一兆美元的那群公司，現在是淨發行方</text>
</g>
</svg>
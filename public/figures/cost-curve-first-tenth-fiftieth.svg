<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="電價曲線下滑三階，最後落進底部的化石燃料價格帶">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="66">講者給的成本路徑</text>
<line x1="130" y1="120" x2="130" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="130" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="n" x="60" y="128">每度電價</text>
<text class="n" x="836" y="472">累積台數</text>
<rect x="130" y="380" width="770" height="60" fill="var(--grey)" opacity="0.35"/>
<text class="g" x="700" y="418">煤與天然氣的價格帶</text>
<polyline points="200,160 200,160 420,290 700,400" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="200" cy="160" r="8" fill="var(--accent)"/>
<circle cx="420" cy="290" r="8" fill="var(--accent)"/>
<circle cx="700" cy="400" r="8" fill="var(--accent)"/>
<text class="g" x="200" y="140" text-anchor="middle">十幾美分</text>
<text class="n" x="200" y="472" text-anchor="middle">第 1 座</text>
<text class="g" x="420" y="268" text-anchor="middle">十美分以內</text>
<text class="n" x="420" y="472" text-anchor="middle">第 10 座</text>
<text class="g" x="700" y="372" text-anchor="middle">同一價格區間</text>
<text class="n" x="700" y="472" text-anchor="middle">年產 50 座</text>
<text class="c" x="130" y="520">可對答案的三個點，不是方向性的話</text>
</svg>
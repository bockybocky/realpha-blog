<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一對柱子變矮，右邊一對柱子大幅變高，兩邊方向相反">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="40" y="58">人少了，營收多了</text>
<line x1="60" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="480" y1="100" x2="480" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>
<rect x="110" y="210" width="110" height="240" fill="var(--grey)" opacity="0.55"/>
<rect x="280" y="282" width="110" height="168" fill="var(--accent)"/>
<text class="g" x="110" y="194">六百多人</text>
<text class="g" x="286" y="266">四百出頭</text>
<text class="b" x="196" y="478">人</text>
<rect x="560" y="425" width="110" height="25" fill="var(--grey)" opacity="0.55"/>
<rect x="730" y="150" width="110" height="300" fill="var(--accent)"/>
<text class="g" x="560" y="410">2.5 億</text>
<text class="g" x="730" y="134">超過 30 億</text>
<text class="b" x="686" y="478">營收</text>
<polygon points="236,300 264,300 264,282 236,282" fill="var(--ink)"/>
<polygon points="250,320 272,290 228,290" fill="var(--ink)"/>
<polygon points="688,260 716,260 716,300 688,300" fill="var(--ink)"/>
<polygon points="702,232 724,262 680,262" fill="var(--ink)"/>
<text class="c" x="60" y="518">同一家公司，四年之間</text>
</svg>
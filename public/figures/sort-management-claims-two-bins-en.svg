<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A pile of sentences splits into two bins, one of which leads right to a table and a reconciliation point two quarters later.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">Sort what management says into two bins</text>
<rect x="60" y="210" width="150" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="78" y="246">Earnings call</text>
<text class="b" x="78" y="272">Management remarks</text>
<path d="M210 232 L300 160" stroke="var(--grey)" stroke-width="2.5"/>
<path d="M210 268 L300 340" stroke="var(--accent)" stroke-width="2.5"/>
<rect x="300" y="120" width="230" height="80" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-dasharray="6 6"/>
<text class="b" x="318" y="154">Can never be wrong</text>
<text class="b" x="318" y="180">Upbeat, confident, long term</text>
<text class="b" x="552" y="166" fill="var(--grey)">Throw away</text>
<rect x="300" y="310" width="230" height="80" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="318" y="344" fill="var(--accent)">Has numbers and dates</text>
<text class="b" x="318" y="370">Who said it, and when</text>
<path d="M530 350 L620 350" stroke="var(--accent)" stroke-width="2.5"/>
<rect x="620" y="310" width="120" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="648" y="356">One table</text>
<path d="M740 350 L830 350" stroke="var(--accent)" stroke-width="2.5"/>
<text class="g" x="790" y="330" fill="var(--accent)">Two quarters on</text>
<text class="b" x="790" y="382">Check the answers</text>
<text class="c" x="60" y="476">Only falsifiable claims are worth writing down</text>
</svg>
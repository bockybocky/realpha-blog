<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="底部兩個扁平的水池不往上長，中間一根柱子被上方一條虛線的天花板壓住，無法再高。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <g style="font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
    <text x="40" y="52" font-size="27" font-weight="700" fill="var(--ink)">錢只有兩個來源，池子不長就有天花板</text>

    <line x1="100" y1="150" x2="860" y2="150" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="860" y="134" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="end">天花板</text>

    <rect x="400" y="162" width="160" height="230" rx="8" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
    <text x="480" y="290" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">轉播權金</text>
    <path d="M480 200 L480 172" stroke="var(--accent)" stroke-width="3"/>
    <path d="M470 186 L480 172 L490 186" fill="none" stroke="var(--accent)" stroke-width="3"/>

    <path d="M250 440 C250 410 360 420 412 396" fill="none" stroke="var(--grey)" stroke-width="3"/>
    <path d="M422 404 L412 396 L418 384" fill="none" stroke="var(--grey)" stroke-width="3"/>
    <path d="M710 440 C710 410 600 420 548 396" fill="none" stroke="var(--grey)" stroke-width="3"/>
    <path d="M538 404 L548 396 L542 384" fill="none" stroke="var(--grey)" stroke-width="3"/>

    <rect x="130" y="446" width="240" height="36" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <rect x="590" y="446" width="240" height="36" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text x="250" y="516" font-size="19" fill="var(--dim)" text-anchor="middle">電視廣告市場</text>
    <text x="710" y="516" font-size="19" fill="var(--dim)" text-anchor="middle">付費電視訂戶</text>
    <g stroke="var(--grey)" stroke-width="2.5" fill="none">
      <path d="M180 464 L320 464"/><path d="M310 458 L320 464 L310 470"/>
      <path d="M640 464 L780 464"/><path d="M770 458 L780 464 L770 470"/>
    </g>
    <text x="250" y="546" font-size="16" fill="var(--warn)" text-anchor="middle">持平</text>
    <text x="710" y="546" font-size="16" fill="var(--warn)" text-anchor="middle">持平</text>
  </g>
</svg>
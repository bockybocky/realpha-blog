<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三個房客方框的箭頭往右收斂到同一個方框">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="66" font-size="27" fill="var(--ink)">名字不同的房客，同一個錢包</text>
<rect x="60" y="110" width="380" height="290" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="88" y="152" font-size="20" fill="var(--dim)">新雲端公司，當成房地產看</text>
<rect x="90" y="176" width="320" height="56" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="112" y="212" font-size="16" fill="var(--ink)">房客一</text>
<rect x="90" y="244" width="320" height="56" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="112" y="280" font-size="16" fill="var(--ink)">房客二</text>
<rect x="90" y="312" width="320" height="56" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="112" y="348" font-size="16" fill="var(--ink)">房客三</text>
<line x1="410" y1="204" x2="608" y2="256" stroke="var(--accent)" stroke-width="3"/>
<line x1="410" y1="272" x2="608" y2="260" stroke="var(--accent)" stroke-width="3"/>
<line x1="410" y1="340" x2="608" y2="264" stroke="var(--accent)" stroke-width="3"/>
<polygon points="602,250 602,270 622,260" fill="var(--accent)"/>
<rect x="622" y="210" width="278" height="100" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="761" y="268" font-size="22" fill="var(--ink)" text-anchor="middle">AI 這一個主題</text>
<text x="440" y="394" font-size="15" fill="var(--dim)">房租的錢來自同一處</text>
<text x="60" y="462" font-size="22" fill="var(--ink)">房客品質，就是同一個形狀的問題</text>
</svg>
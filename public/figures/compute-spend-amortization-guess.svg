<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一個大方塊被切成五個等高小方塊，表示三百五十億分五年攤成每年七十億，並標記這只是猜測">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .q { font-size:22px; fill:var(--warn); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">70 億這個數字，可能是攤提後的一年</text>
<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="80" y="140" width="150" height="300" fill="var(--grey)"/>
<text class="g" x="80" y="126">350 億</text>
<text class="d" x="80" y="470">1 吉瓦 建置</text>
<text class="q" x="282" y="300">分五年 ?</text>
<rect x="470" y="380" width="70" height="60" fill="var(--accent)"/>
<rect x="556" y="380" width="70" height="60" fill="var(--accent)"/>
<rect x="642" y="380" width="70" height="60" fill="var(--accent)"/>
<rect x="728" y="380" width="70" height="60" fill="var(--accent)"/>
<rect x="814" y="380" width="70" height="60" fill="var(--accent)"/>
<text class="g" x="470" y="366">70 億</text>
<text class="d" x="470" y="470">一年</text>
<text class="d" x="556" y="470">二年</text>
<text class="d" x="642" y="470">三年</text>
<text class="d" x="728" y="470">四年</text>
<text class="d" x="814" y="470">五年</text>
<text class="d" x="470" y="200">猜測，口徑未定</text>
<text class="d" x="470" y="228">也不含 Claude Code 之後</text>
</svg>
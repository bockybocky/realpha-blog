<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上排三個方塊與下排一個方塊，分別指向兩條長度相同的橫條，右側虛線顯示兩者終點齊平。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="72" font-size="27" fill="var(--ink)">兩條路徑，同一個結果</text>

  <line x1="850" y1="160" x2="850" y2="392" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="850" y="146" font-size="16" fill="var(--dim)" text-anchor="end">同樣的成果</text>

  <text x="60" y="207" font-size="19" fill="var(--ink)">更多晶片</text>
  <rect x="270" y="183" width="34" height="34" rx="6" fill="var(--grey)"/>
  <rect x="314" y="183" width="34" height="34" rx="6" fill="var(--grey)"/>
  <rect x="358" y="183" width="34" height="34" rx="6" fill="var(--grey)"/>
  <line x1="500" y1="200" x2="556" y2="200" stroke="var(--dim)" stroke-width="2"/>
  <path d="M 566 200 L 552 193 L 552 207 Z" fill="var(--dim)"/>
  <rect x="590" y="183" width="260" height="34" rx="6" fill="var(--accent)"/>

  <text x="60" y="357" font-size="19" fill="var(--ink)">更好的演算法與資料</text>
  <rect x="270" y="333" width="34" height="34" rx="6" fill="var(--grey)"/>
  <line x1="500" y1="350" x2="556" y2="350" stroke="var(--dim)" stroke-width="2"/>
  <path d="M 566 350 L 552 343 L 552 357 Z" fill="var(--dim)"/>
  <rect x="590" y="333" width="260" height="34" rx="6" fill="var(--accent)"/>

  <text x="60" y="452" font-size="22" fill="var(--ink)">受益的不是同一批人</text>
</svg>
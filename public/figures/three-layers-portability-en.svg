<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three bars of increasing length representing how far each of the three layers of argument travels: the first two are short, the third spans the entire row.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:20px;fill:var(--ink)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">Three layers, very different travel range</text>
<text class="b" x="60" y="96">Bar length = range of countries it applies to</text>

<text class="g" x="60" y="164">Layer 1　Transmission</text>
<rect x="60" y="180" width="200" height="44" rx="6" fill="var(--grey)"/>
<text class="b" x="280" y="210">Needs mostly floating-rate borrowing</text>

<text class="g" x="60" y="284">Layer 2　Losses force you to ask</text>
<rect x="60" y="300" width="250" height="44" rx="6" fill="var(--grey)"/>
<text class="b" x="330" y="330">Needs thin seigniorage</text>

<text class="g" x="60" y="404">Layer 3　Sitting in the bond market = fiscal policy</text>
<rect x="60" y="420" width="840" height="44" rx="6" fill="var(--accent)" opacity="0.8"/>
<text class="b" x="60" y="500">Layer 3 has no preconditions, so nobody escapes it</text>
</svg>
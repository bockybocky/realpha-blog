<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根柱，能付的那根比要付的矮一截，差額標成一條帶">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t h" x="60" y="70">2028 年算下來差一截</text>
<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="230" y="150" width="150" height="270" fill="var(--grey)"/>
<text class="t b" x="230" y="452">要付的資本支出</text>
<rect x="560" y="190" width="150" height="230" fill="var(--accent)"/>
<rect x="560" y="150" width="150" height="40" fill="var(--warn)" opacity="0.3"/>
<line x1="560" y1="150" x2="710" y2="150" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="t g" x="730" y="178">缺 5% 到 15%</text>
<text class="t b" x="560" y="452">營收攤進來付得出的</text>
<text class="t c" x="60" y="500">不夠就得再募一輪，兩輪就難講</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Forty dots stand for forty local ballot measures, thirty-eight of them marked as unfavorable to operators and only two not.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Election day: 40 ballots</text>
  <text class="t" x="60" y="96" font-size="16" fill="var(--dim)">1 dot = 1 data center vote</text>

  <circle cx="140" cy="180" r="18" fill="var(--warn)"/><circle cx="200" cy="180" r="18" fill="var(--warn)"/><circle cx="260" cy="180" r="18" fill="var(--warn)"/><circle cx="320" cy="180" r="18" fill="var(--warn)"/><circle cx="380" cy="180" r="18" fill="var(--warn)"/><circle cx="440" cy="180" r="18" fill="var(--warn)"/><circle cx="500" cy="180" r="18" fill="var(--warn)"/><circle cx="560" cy="180" r="18" fill="var(--warn)"/>
  <circle cx="140" cy="240" r="18" fill="var(--warn)"/><circle cx="200" cy="240" r="18" fill="var(--warn)"/><circle cx="260" cy="240" r="18" fill="var(--warn)"/><circle cx="320" cy="240" r="18" fill="var(--warn)"/><circle cx="380" cy="240" r="18" fill="var(--warn)"/><circle cx="440" cy="240" r="18" fill="var(--warn)"/><circle cx="500" cy="240" r="18" fill="var(--warn)"/><circle cx="560" cy="240" r="18" fill="var(--warn)"/>
  <circle cx="140" cy="300" r="18" fill="var(--warn)"/><circle cx="200" cy="300" r="18" fill="var(--warn)"/><circle cx="260" cy="300" r="18" fill="var(--warn)"/><circle cx="320" cy="300" r="18" fill="var(--warn)"/><circle cx="380" cy="300" r="18" fill="var(--warn)"/><circle cx="440" cy="300" r="18" fill="var(--warn)"/><circle cx="500" cy="300" r="18" fill="var(--warn)"/><circle cx="560" cy="300" r="18" fill="var(--warn)"/>
  <circle cx="140" cy="360" r="18" fill="var(--warn)"/><circle cx="200" cy="360" r="18" fill="var(--warn)"/><circle cx="260" cy="360" r="18" fill="var(--warn)"/><circle cx="320" cy="360" r="18" fill="var(--warn)"/><circle cx="380" cy="360" r="18" fill="var(--warn)"/><circle cx="440" cy="360" r="18" fill="var(--warn)"/><circle cx="500" cy="360" r="18" fill="var(--warn)"/><circle cx="560" cy="360" r="18" fill="var(--warn)"/>
  <circle cx="140" cy="420" r="18" fill="var(--warn)"/><circle cx="200" cy="420" r="18" fill="var(--warn)"/><circle cx="260" cy="420" r="18" fill="var(--warn)"/><circle cx="320" cy="420" r="18" fill="var(--warn)"/><circle cx="380" cy="420" r="18" fill="var(--warn)"/><circle cx="440" cy="420" r="18" fill="var(--warn)"/>
  <circle cx="500" cy="420" r="18" fill="none" stroke="var(--grey)" stroke-width="3"/><circle cx="560" cy="420" r="18" fill="none" stroke="var(--grey)" stroke-width="3"/>

  <line x1="620" y1="160" x2="620" y2="400" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="650" y="212" font-size="20" font-weight="700" fill="var(--warn)">38 against</text>
  <text class="t" x="650" y="252" font-size="16" fill="var(--dim)">In one, 3 council</text>
  <text class="t" x="650" y="276" font-size="16" fill="var(--dim)">recalled</text>
  <text class="t" x="650" y="418" font-size="20" font-weight="700" fill="var(--dim)">2 rest</text>

  <text class="t" x="60" y="506" font-size="22" font-weight="700" fill="var(--ink)">Not scattered, but broad</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三根直柱同一尺度，去年未起租租約矮、今年未起租租約高出三倍半、帳上現有租賃負債只與去年差不多高。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">真正該看的是規模：還沒起租的那一塊</text>

  <line x1="80" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>

  <rect x="150" y="345" width="150" height="85" fill="var(--grey)"/>
  <text class="t" x="225" y="332" font-size="19" fill="var(--dim)" text-anchor="middle">927 億</text>
  <text class="t" x="225" y="462" font-size="16" fill="var(--ink)" text-anchor="middle">去年未起租</text>

  <rect x="425" y="130" width="150" height="300" fill="var(--accent)"/>
  <text class="t" x="500" y="118" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">3,291 億</text>
  <text class="t" x="500" y="462" font-size="16" fill="var(--ink)" text-anchor="middle">今年未起租</text>
  <text class="t" x="500" y="486" font-size="16" fill="var(--dim)" text-anchor="middle">一年變 3.55 倍</text>

  <rect x="700" y="349" width="150" height="81" fill="var(--card)" stroke="var(--line)"/>
  <rect x="700" y="349" width="150" height="20" fill="var(--grey)"/>
  <text class="t" x="775" y="336" font-size="19" fill="var(--dim)" text-anchor="middle">885 億</text>
  <text class="t" x="775" y="462" font-size="16" fill="var(--ink)" text-anchor="middle">帳上現有租賃負債</text>
  <text class="t" x="775" y="486" font-size="16" fill="var(--dim)" text-anchor="middle">營業 219 ＋ 融資 666</text>

  <text class="t" x="48" y="534" font-size="22" font-weight="700" fill="var(--ink)">還沒進帳的，是已經在帳上的約 3.7 倍</text>
</svg>
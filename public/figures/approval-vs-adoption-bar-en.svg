<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two thresholds of very unequal height, the left one short and the right one about three times taller.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="70">Two thresholds, different heights</text>
<line x1="60" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="360" width="290" height="100" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="560" y="170" width="290" height="290" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="255" y="338" text-anchor="middle">Regulatory approval</text>
<text class="g" x="705" y="148" text-anchor="middle" fill="var(--accent)">Clinical adoption</text>
<text class="b" x="255" y="398" text-anchor="middle">Substantial equivalence</text>
<text class="b" x="255" y="430" text-anchor="middle">Safety and performance data</text>
<text class="b" x="705" y="212" text-anchor="middle">Multicenter studies</text>
<text class="b" x="705" y="252" text-anchor="middle">Multi-year follow-up</text>
<text class="b" x="705" y="292" text-anchor="middle">Reimbursement codes</text>
<text class="b" x="705" y="332" text-anchor="middle">Guideline rewrites</text>
<text class="b" x="705" y="372" text-anchor="middle">Workflow change</text>
<line x1="400" y1="360" x2="880" y2="360" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 6"/>
<line x1="480" y1="176" x2="480" y2="354" stroke="var(--accent)" stroke-width="2"/>
<path d="M480 170 l-7 14 h14 z" fill="var(--accent)"/>
<path d="M480 360 l-7 -14 h14 z" fill="var(--accent)"/>
<text class="b" x="480" y="150" text-anchor="middle" fill="var(--accent)">An order of magnitude apart</text>
<text class="c" x="60" y="518">The ticket price says nothing about the takings inside</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A two-column, four-cell comparison with the two effective cells on a diagonal, showing the same move works oppositely in two organizations">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink)}
.g{font-size:19px;fill:var(--ink)}
.b{font-size:16px;fill:var(--dim)}
.s{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<text class="h" x="80" y="70">One move, two orgs</text>
<text class="g" x="80" y="140">Microsoft</text>
<text class="g" x="500" y="140">Personnel Authority</text>
<path d="M270 220 L690 360" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 8" fill="none" opacity="0.6"/>
<rect x="80" y="160" width="380" height="120" rx="10" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="110" y="212">Laptop stickers</text>
<text x="110" y="248" font-size="19" fill="var(--accent)">All in 2–3 weeks</text>
<rect x="80" y="300" width="380" height="120" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="110" y="352" fill="var(--dim)">Official memo</text>
<text class="b" x="110" y="388">Unread</text>
<rect x="500" y="160" width="380" height="120" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="530" y="212" fill="var(--dim)">Said 100 times</text>
<text class="b" x="530" y="248">No use</text>
<rect x="500" y="300" width="380" height="120" rx="10" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="530" y="352">3 A4 pages</text>
<text x="530" y="388" font-size="19" fill="var(--accent)">It moves</text>
<text class="c" x="80" y="478">It's what the org believes</text>
</svg>
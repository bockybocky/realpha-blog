<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two identical boxes: the left filled grey with a question mark, the right transparent with three decision points visible.">
  <defs>
    <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">The same agent, two levels of visibility</text>

  <text class="t" x="60" y="118" font-size="20" font-weight="700" fill="var(--dim)">Closed</text>
  <text class="t" x="520" y="118" font-size="20" font-weight="700" fill="var(--accent)">Open</text>

  <rect x="60" y="146" width="380" height="270" rx="14" fill="var(--grey)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="250" y="305" font-size="76" font-weight="700" fill="var(--page)" text-anchor="middle">?</text>

  <rect x="520" y="146" width="380" height="270" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="552" y="176" width="316" height="58" rx="9" fill="var(--page)" stroke="var(--line)" stroke-width="1.5"/>
  <text class="t" x="710" y="212" font-size="16" fill="var(--ink)" text-anchor="middle">Where it may touch files</text>
  <rect x="552" y="252" width="316" height="58" rx="9" fill="var(--page)" stroke="var(--line)" stroke-width="1.5"/>
  <text class="t" x="710" y="288" font-size="16" fill="var(--ink)" text-anchor="middle">How it rolls back errors</text>
  <rect x="552" y="328" width="316" height="58" rx="9" fill="var(--page)" stroke="var(--line)" stroke-width="1.5"/>
  <text class="t" x="710" y="364" font-size="16" fill="var(--ink)" text-anchor="middle">Blocking dangerous commands</text>

  <text class="t" x="250" y="448" font-size="16" fill="var(--dim)" text-anchor="middle">You only see the output</text>
  <text class="t" x="710" y="448" font-size="16" fill="var(--dim)" text-anchor="middle">You see where the judgment happens</text>

  <text class="t" x="480" y="512" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">What open sourcing reveals is those few judgments</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One tall bar followed by nine flat ones, showing the marginal cost of copying approaching zero.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="80" y="58" font-size="27" font-weight="700" fill="var(--ink)">Only the first one is expensive</text>

  <text class="t" x="173" y="132" font-size="19" text-anchor="middle" fill="var(--accent)">Get the workflow working</text>
  <text class="t" x="513" y="352" font-size="19" text-anchor="middle" fill="var(--dim)">Open nine more</text>

  <rect x="150" y="150" width="46" height="250" rx="3" fill="var(--accent)"/>
  <rect x="218" y="384" width="46" height="16" rx="3" fill="var(--grey)"/>
  <rect x="286" y="384" width="46" height="16" rx="3" fill="var(--grey)"/>
  <rect x="354" y="384" width="46" height="16" rx="3" fill="var(--grey)"/>
  <rect x="422" y="384" width="46" height="16" rx="3" fill="var(--grey)"/>
  <rect x="490" y="384" width="46" height="16" rx="3" fill="var(--grey)"/>
  <rect x="558" y="384" width="46" height="16" rx="3" fill="var(--grey)"/>
  <rect x="626" y="384" width="46" height="16" rx="3" fill="var(--grey)"/>
  <rect x="694" y="384" width="46" height="16" rx="3" fill="var(--grey)"/>
  <rect x="762" y="384" width="46" height="16" rx="3" fill="var(--grey)"/>

  <line x1="120" y1="400" x2="860" y2="400" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="173" y="426" font-size="15" text-anchor="middle" fill="var(--dim)">1</text>
  <text class="t" x="241" y="426" font-size="15" text-anchor="middle" fill="var(--dim)">2</text>
  <text class="t" x="309" y="426" font-size="15" text-anchor="middle" fill="var(--dim)">3</text>
  <text class="t" x="377" y="426" font-size="15" text-anchor="middle" fill="var(--dim)">4</text>
  <text class="t" x="445" y="426" font-size="15" text-anchor="middle" fill="var(--dim)">5</text>
  <text class="t" x="513" y="426" font-size="15" text-anchor="middle" fill="var(--dim)">6</text>
  <text class="t" x="581" y="426" font-size="15" text-anchor="middle" fill="var(--dim)">7</text>
  <text class="t" x="649" y="426" font-size="15" text-anchor="middle" fill="var(--dim)">8</text>
  <text class="t" x="717" y="426" font-size="15" text-anchor="middle" fill="var(--dim)">9</text>
  <text class="t" x="785" y="426" font-size="15" text-anchor="middle" fill="var(--dim)">10</text>

  <text class="t" x="480" y="484" font-size="22" text-anchor="middle" fill="var(--ink)">Near-zero marginal cost makes a red ocean inevitable</text>
</svg>
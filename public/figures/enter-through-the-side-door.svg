<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條路徑，上路撞牆停住，下路繞行後接進右側房間">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
  <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
  </marker>
</defs>
<text x="80" y="58" font-size="27" fill="var(--ink)">從側門進去</text>

<text x="120" y="180" font-size="20" fill="var(--dim)">正面談多樣性</text>
<line x1="120" y1="215" x2="500" y2="215" stroke="var(--grey)" stroke-width="4"/>
<rect x="508" y="155" width="16" height="120" fill="var(--warn)"/>
<text x="546" y="222" font-size="19" fill="var(--warn)">防衛起來</text>

<text x="120" y="378" font-size="20" fill="var(--accent)">談引導・談邏輯・談留任</text>
<path d="M120,410 H600 Q660,410 660,355 V320 H694" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#ah)"/>

<rect x="700" y="275" width="200" height="90" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="800" y="328" font-size="19" fill="var(--ink)" text-anchor="middle">不講話的人開口</text>

<text x="80" y="500" font-size="22" fill="var(--ink)">同一個房間，正門進不去</text>
</svg>
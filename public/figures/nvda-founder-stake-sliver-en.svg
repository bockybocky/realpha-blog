<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="In one long horizontal bar, only a very thin sliver is the founder's stake and the whole rest is other shareholders.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" fill="var(--ink)">Voting weight</text>
<rect x="120" y="250" width="720" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="120" y="250" width="26" height="110" fill="var(--accent)"/>
<line x1="133" y1="250" x2="133" y2="180" stroke="var(--accent)" stroke-width="2"/>
<text x="133" y="166" font-size="20" fill="var(--ink)" text-anchor="middle">3.6%</text>
<text x="133" y="142" font-size="16" fill="var(--dim)" text-anchor="middle">His</text>
<text x="500" y="312" font-size="20" fill="var(--dim)" text-anchor="middle">Others</text>
<text x="60" y="440" font-size="22" fill="var(--ink)">So the board can remove him</text>
</svg>
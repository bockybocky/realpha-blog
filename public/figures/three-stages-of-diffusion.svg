<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="時間軸上三根依序變高的柱子，越晚出現越高，多數人在最右邊接手">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:19px; fill:var(--ink); font-weight:700; }
    .cap { font-size:15px; fill:var(--dim); }
    .cc  { font-size:22px; fill:var(--accent); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="ttl" x="60" y="72">同一件事，三段依序出現</text>
<text class="cap" x="60" y="102">柱高＝轉發熱度</text>

<rect x="140" y="330" width="140" height="60" rx="6" fill="var(--accent)"/>
<rect x="410" y="250" width="140" height="140" rx="6" fill="var(--grey)"/>
<rect x="680" y="150" width="140" height="240" rx="6" fill="var(--grey)"/>

<line x1="80" y1="392" x2="900" y2="392" stroke="var(--line)" stroke-width="3"/>
<polygon points="916,392 896,383 896,401" fill="var(--line)"/>
<text class="cap" x="856" y="424">時間</text>

<text class="grp" x="210" y="430" text-anchor="middle">可觀測量</text>
<text class="cap" x="210" y="456" text-anchor="middle">交期・報價・庫存</text>
<text class="grp" x="480" y="430" text-anchor="middle">當事人自陳</text>
<text class="cap" x="480" y="456" text-anchor="middle">法說・漲價信</text>
<text class="grp" x="750" y="430" text-anchor="middle">新聞與熱度</text>
<text class="cap" x="750" y="456" text-anchor="middle">標題・轉發</text>

<polygon points="750,120 738,98 762,98" fill="var(--warn)"/>
<text class="cap" x="750" y="88" text-anchor="middle" fill="var(--warn)">多數人在這裡接手</text>

<text class="cc" x="60" y="510">越好讀的，來得越晚</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two pairs of bars compare debt against equity: Engesa's debt stands as tall as its equity with no cushion left, while the average Brazilian company's debt reaches only forty percent of equity.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Room to be wrong: equity minus debt, what's left</text>

<line x1="90" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>

<rect x="150" y="260" width="90" height="180" fill="var(--grey)"/>
<rect x="260" y="260" width="90" height="180" fill="var(--warn)"/>
<text x="150" y="240" font-size="16" fill="var(--dim)">Equity</text>
<text x="268" y="240" font-size="16" fill="var(--warn)">Debt</text>
<text x="168" y="474" font-size="19" fill="var(--ink)">Engesa</text>
<line x1="370" y1="260" x2="370" y2="440" stroke="var(--warn)" stroke-width="2"/>
<text x="384" y="356" font-size="16" fill="var(--warn)">Cushion = zero</text>

<rect x="580" y="260" width="90" height="180" fill="var(--grey)"/>
<rect x="690" y="368" width="90" height="72" fill="var(--accent)"/>
<text x="580" y="240" font-size="16" fill="var(--dim)">Equity</text>
<text x="698" y="348" font-size="16" fill="var(--accent)">Debt</text>
<text x="572" y="474" font-size="19" fill="var(--ink)">Brazilian average</text>
<line x1="800" y1="260" x2="800" y2="368" stroke="var(--accent)" stroke-width="2"/>
<text x="814" y="318" font-size="16" fill="var(--accent)">Cushion left</text>

<text x="60" y="514" font-size="22" fill="var(--ink)">A company with no cushion has to keep betting right.</text>
</svg>
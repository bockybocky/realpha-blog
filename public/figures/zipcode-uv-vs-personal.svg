<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左邊九宮格每格同一個數字，右邊同樣的格子裡四個人各自不同的數字">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); }
    .g  { font-size:19px; fill:var(--dim); }
    .s  { font-size:15px; fill:var(--dim); }
    .c  { font-size:22px; fill:var(--ink); }
    .n  { font-size:34px; }
</style>
<text class="ti" x="80" y="62">一個區塊一個值，還是一個人一個值</text>
<text class="g" x="100" y="144">紫外線指數</text>
<rect x="100" y="166" width="300" height="300" fill="var(--grey)" fill-opacity="0.28" stroke="var(--grey)" stroke-width="2"/>
<line x1="200" y1="166" x2="200" y2="466" stroke="var(--grey)" stroke-width="2"/>
<line x1="300" y1="166" x2="300" y2="466" stroke="var(--grey)" stroke-width="2"/>
<line x1="100" y1="266" x2="400" y2="266" stroke="var(--grey)" stroke-width="2"/>
<line x1="100" y1="366" x2="400" y2="366" stroke="var(--grey)" stroke-width="2"/>
<text class="n" fill="var(--dim)" x="150" y="228" text-anchor="middle">9</text>
<text class="n" fill="var(--dim)" x="250" y="228" text-anchor="middle">9</text>
<text class="n" fill="var(--dim)" x="350" y="228" text-anchor="middle">9</text>
<text class="n" fill="var(--dim)" x="150" y="328" text-anchor="middle">9</text>
<text class="n" fill="var(--dim)" x="250" y="328" text-anchor="middle">9</text>
<text class="n" fill="var(--dim)" x="350" y="328" text-anchor="middle">9</text>
<text class="n" fill="var(--dim)" x="150" y="428" text-anchor="middle">9</text>
<text class="n" fill="var(--dim)" x="250" y="428" text-anchor="middle">9</text>
<text class="n" fill="var(--dim)" x="350" y="428" text-anchor="middle">9</text>
<text class="g" x="540" y="144">身上量到的</text>
<rect x="540" y="166" width="300" height="300" fill="none" stroke="var(--line)" stroke-width="2"/>
<line x1="640" y1="166" x2="640" y2="466" stroke="var(--line)" stroke-width="2"/>
<line x1="740" y1="166" x2="740" y2="466" stroke="var(--line)" stroke-width="2"/>
<line x1="540" y1="266" x2="840" y2="266" stroke="var(--line)" stroke-width="2"/>
<line x1="540" y1="366" x2="840" y2="366" stroke="var(--line)" stroke-width="2"/>
<circle cx="590" cy="220" r="13" fill="var(--accent)"/>
<text class="n" fill="var(--accent)" x="618" y="232">2</text>
<circle cx="712" cy="300" r="13" fill="var(--accent)"/>
<text class="n" fill="var(--accent)" x="740" y="312">7</text>
<circle cx="604" cy="412" r="13" fill="var(--accent)"/>
<text class="n" fill="var(--accent)" x="632" y="424">5</text>
<circle cx="788" cy="196" r="13" fill="var(--accent)"/>
<text class="n" fill="var(--accent)" x="806" y="208">9</text>
<text class="c" x="80" y="524">同一個郵遞區號，四個人四個數</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Windows 與麥金塔是兩條高水平線，Linux 貼在底部，右上放大框裡同一條線陡直上升">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">1997 年：基數差兩個數量級，斜率不是</text>

<line x1="120" y1="440" x2="120" y2="120" stroke="var(--line)" stroke-width="3"/>
<line x1="120" y1="440" x2="560" y2="440" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="100" y="130" text-anchor="end">使用者</text>

<line x1="120" y1="150" x2="560" y2="150" stroke="var(--grey)" stroke-width="5"/>
<text class="b" x="570" y="155">Windows　1 億</text>
<line x1="120" y1="282" x2="560" y2="282" stroke="var(--grey)" stroke-width="5"/>
<text class="b" x="570" y="287">麥金塔　5,000 萬</text>
<path d="M120 437 Q380 434 560 424" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="b" x="570" y="429" fill="var(--accent)">Linux　300 ～ 500 萬</text>

<rect x="620" y="110" width="280" height="220" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="640" y="146">只看 Linux</text>
<path d="M650 308 Q740 300 800 230 T870 150" fill="none" stroke="var(--accent)" stroke-width="5"/>
<line x1="650" y1="310" x2="880" y2="310" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="650" y="328">1992</text>
<text class="b" x="840" y="328">1997</text>

<text class="c" x="60" y="500">看高度它不存在，看斜率它在路上</text>
</svg>
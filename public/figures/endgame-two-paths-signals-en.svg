<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="One starting point splits into an upper and a lower path, each with two signal points along the way.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; } .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); } .c { font-size:22px; font-weight:700; }
</style>
<text x="40" y="50" class="t">Two endgames: signals</text>
<path d="M152 290 C 260 290, 280 170, 400 170 L 860 170" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M152 290 C 260 290, 280 410, 400 410 L 860 410" fill="none" stroke="var(--warn)" stroke-width="4"/>
<circle cx="140" cy="290" r="12" fill="var(--ink)"/>
<text x="140" y="330" class="g" text-anchor="middle">Now</text>
<circle cx="520" cy="170" r="9" fill="var(--accent)"/>
<text x="520" y="143" class="b" text-anchor="middle" style="fill:var(--ink)">Iran strait role</text>
<circle cx="740" cy="170" r="9" fill="var(--accent)"/>
<text x="740" y="143" class="b" text-anchor="middle" style="fill:var(--ink)">Gulf deal</text>
<text x="875" y="177" class="g" style="fill:var(--accent)">Deal</text>
<circle cx="520" cy="410" r="9" fill="var(--warn)"/>
<text x="520" y="447" class="b" text-anchor="middle" style="fill:var(--ink)">US troops up</text>
<circle cx="740" cy="410" r="9" fill="var(--warn)"/>
<text x="740" y="447" class="b" text-anchor="middle" style="fill:var(--ink)">Proxy wars</text>
<text x="875" y="417" class="g" style="fill:var(--warn)">War</text>
<text x="480" y="535" class="c" text-anchor="middle">Act on signals</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條時間線，上排到貨晚於開工，下排提前囤放趕上開工">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700">把庫存擋在自己的工期前面</text>

<line x1="620" y1="110" x2="620" y2="420" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="632" y="128" font-size="16" fill="var(--dim)">要用的那天</text>

<text x="60" y="180" font-size="20" font-weight="700">照流程</text>
<rect x="60" y="196" width="120" height="34" rx="6" fill="var(--accent)"/>
<text x="76" y="220" font-size="15" fill="var(--page)">下單</text>
<rect x="188" y="196" width="500" height="34" rx="6" fill="var(--grey)"/>
<text x="300" y="220" font-size="15" fill="var(--ink)">排隊</text>
<rect x="696" y="196" width="130" height="34" rx="6" fill="var(--warn)"/>
<text x="712" y="220" font-size="15" fill="var(--page)">到貨</text>
<text x="696" y="256" font-size="16" fill="var(--warn)">遲了</text>

<text x="60" y="330" font-size="20" font-weight="700">提前囤</text>
<rect x="60" y="346" width="150" height="34" rx="6" fill="var(--accent)"/>
<text x="76" y="370" font-size="15" fill="var(--page)">先買下</text>
<rect x="218" y="346" width="392" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="238" y="370" font-size="15" fill="var(--dim)">車庫裡</text>
<rect x="628" y="346" width="130" height="34" rx="6" fill="var(--accent)"/>
<text x="644" y="370" font-size="15" fill="var(--page)">就位</text>
<text x="628" y="406" font-size="16" fill="var(--dim)">工期保住</text>

<text x="60" y="482" font-size="22" font-weight="700">開發商的一部分資產，變成電力設備的庫存</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The height gap between a short bar and a tall bar: last quarter's income statement is small, while fixed commitments over the next five years are several times larger.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">Two documents, two time horizons</text>
<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="352" width="210" height="68" fill="var(--grey)"/>
<text x="150" y="336" font-size="19" fill="var(--dim)">Last quarter</text>
<text x="150" y="450" font-size="16" fill="var(--ink)">Income statement</text>
<text x="150" y="474" font-size="15" fill="var(--dim)">Profitable, cash-flow positive, 70-80% gross margin</text>
<rect x="600" y="118" width="210" height="302" fill="var(--accent)"/>
<text x="600" y="102" font-size="19" fill="var(--dim)">Next five years</text>
<text x="600" y="450" font-size="16" fill="var(--ink)">Fixed commitments</text>
<text x="600" y="474" font-size="15" fill="var(--dim)">$500-800B of compute</text>
<path d="M 380 386 L 580 300" stroke="var(--dim)" stroke-width="2" fill="none"/>
<path d="M 580 300 l -16 1 l 11 11 z" fill="var(--dim)"/>
<text x="60" y="516" font-size="22" fill="var(--ink)">Watch where the commitments point, not how good last quarter looked</text>
</g>
</svg>
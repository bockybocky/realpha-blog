<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Bar comparison: the combined size of three upcoming IPOs exceeds all IPOs combined across the 1990s.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="58">A decade total versus three</text>
<text class="g" x="60" y="152">All 1990s IPOs</text>
<rect x="60" y="172" width="520" height="72" rx="8" fill="var(--grey)" opacity="0.6"/>
<text class="b" x="60" y="268">Ten years, thousands of companies</text>
<text class="g" x="60" y="332">The next three</text>
<rect x="60" y="352" width="760" height="72" rx="8" fill="var(--accent)"/>
<text class="b" x="60" y="448">Three in one year</text>
<line x1="580" y1="160" x2="580" y2="440" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="c" x="60" y="500">Same pool, fewer but larger drains</text>
</svg>
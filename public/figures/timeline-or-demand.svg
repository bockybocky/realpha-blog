<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一則利空往上分岔只讓日曆標記右移一格而理由方塊完整，往下分岔則是理由方塊被劃掉。">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .gw { font-size:19px; fill:var(--warn); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .a { font-size:16px; fill:var(--accent); font-weight:600; }
</style>
<text class="t" x="60" y="66">它證偽的是時程，還是需求</text>
<rect x="60" y="238" width="170" height="64" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="98" y="278">一則利空</text>
<path d="M230,258 C300,258 300,180 370,180" fill="none" stroke="var(--line)" stroke-width="2"/>
<path d="M230,282 C300,282 300,400 370,400" fill="none" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="370" y="150">時程</text>
<line x1="370" y1="200" x2="660" y2="200" stroke="var(--line)" stroke-width="2"/>
<line x1="400" y1="192" x2="400" y2="208" stroke="var(--grey)" stroke-width="2"/>
<line x1="500" y1="192" x2="500" y2="208" stroke="var(--grey)" stroke-width="2"/>
<line x1="600" y1="192" x2="600" y2="208" stroke="var(--grey)" stroke-width="2"/>
<circle cx="400" cy="200" r="7" fill="var(--grey)" opacity="0.5"/>
<circle cx="500" cy="200" r="7" fill="var(--accent)"/>
<path d="M412,178 L488,178" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar)"/>
<text class="b" x="380" y="238">本季</text>
<text class="b" x="480" y="238">下季</text>
<rect x="720" y="164" width="180" height="72" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="a" x="762" y="208">持有理由</text>
<text class="g" x="370" y="370">需求</text>
<line x1="370" y1="420" x2="660" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="400" y1="412" x2="400" y2="428" stroke="var(--grey)" stroke-width="2"/>
<line x1="500" y1="412" x2="500" y2="428" stroke="var(--grey)" stroke-width="2"/>
<line x1="600" y1="412" x2="600" y2="428" stroke="var(--grey)" stroke-width="2"/>
<circle cx="400" cy="420" r="7" fill="var(--grey)" opacity="0.5"/>
<text class="b" x="380" y="458">本季</text>
<rect x="720" y="384" width="180" height="72" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="gw" x="762" y="428" opacity="0.55">持有理由</text>
<line x1="728" y1="450" x2="892" y2="390" stroke="var(--warn)" stroke-width="4"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
  </marker>
</defs>
</svg>
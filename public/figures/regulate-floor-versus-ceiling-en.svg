<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two groups of three bars, where a floor line below submerges the shortest bar in the left group and a ceiling line above shaves the tallest bar in the right group.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--dim); }
.n { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" class="t">Regulate the process, or regulate the ceiling</text>
<text x="270" y="126" class="g" text-anchor="middle">Process rules</text>
<text x="690" y="126" class="g" text-anchor="middle">Ceiling rules</text>
<path d="M120 450 H460" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="190" width="70" height="260" fill="var(--accent)"/>
<rect x="245" y="270" width="70" height="180" fill="var(--accent)"/>
<rect x="340" y="350" width="70" height="100" fill="var(--grey)"/>
<path d="M130 370 H450" stroke="var(--warn)" stroke-width="2.5"/>
<text x="450" y="358" class="n" text-anchor="end" fill="var(--warn)">Floor</text>
<text x="375" y="486" class="n" text-anchor="middle" fill="var(--warn)">Out</text>
<text x="185" y="486" class="n" text-anchor="middle">Leader</text>
<text x="280" y="486" class="n" text-anchor="middle">Middle</text>
<text x="270" y="522" class="n" text-anchor="middle">Gap unchanged</text>
<path d="M540 450 H880" stroke="var(--line)" stroke-width="2"/>
<rect x="570" y="270" width="70" height="180" fill="var(--accent)"/>
<rect x="570" y="190" width="70" height="80" fill="none" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="665" y="270" width="70" height="180" fill="var(--accent)"/>
<rect x="760" y="350" width="70" height="100" fill="var(--accent)"/>
<path d="M550 270 H870" stroke="var(--warn)" stroke-width="2.5"/>
<text x="870" y="258" class="n" text-anchor="end" fill="var(--warn)">Ceiling</text>
<text x="605" y="486" class="n" text-anchor="middle">Leader</text>
<text x="700" y="486" class="n" text-anchor="middle">Middle</text>
<text x="795" y="486" class="n" text-anchor="middle">Back</text>
<text x="690" y="522" class="n" text-anchor="middle" fill="var(--warn)">Gap shaved flat</text>
</svg>
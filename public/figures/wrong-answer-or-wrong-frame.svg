<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左格底座水平只有一支箭頭歪掉，右格底座整個傾斜使五支箭頭全部偏向同一邊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="52" font-size="27" font-weight="700" fill="var(--ink)">錯的是結論，還是框架</text>

  <rect x="60" y="96" width="390" height="344" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="255" y="144" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">結論錯</text>
  <rect x="96" y="356" width="318" height="20" rx="6" fill="var(--accent)"/>
  <line x1="130" y1="356" x2="130" y2="230" stroke="var(--grey)" stroke-width="4"/>
  <polygon points="130,216 120,240 140,240" fill="var(--grey)"/>
  <line x1="196" y1="356" x2="196" y2="230" stroke="var(--grey)" stroke-width="4"/>
  <polygon points="196,216 186,240 206,240" fill="var(--grey)"/>
  <line x1="262" y1="356" x2="300" y2="236" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="304,222 290,244 310,250" fill="var(--warn)"/>
  <line x1="328" y1="356" x2="328" y2="230" stroke="var(--grey)" stroke-width="4"/>
  <polygon points="328,216 318,240 338,240" fill="var(--grey)"/>
  <line x1="384" y1="356" x2="384" y2="230" stroke="var(--grey)" stroke-width="4"/>
  <polygon points="384,216 374,240 394,240" fill="var(--grey)"/>
  <text x="255" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">換一個答案</text>

  <rect x="510" y="96" width="390" height="344" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="705" y="144" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">框架錯</text>
  <polygon points="546,372 864,320 864,342 546,394" fill="var(--warn)"/>
  <line x1="580" y1="368" x2="622" y2="250" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="626,236 612,258 632,264" fill="var(--warn)"/>
  <line x1="646" y1="357" x2="688" y2="239" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="692,225 678,247 698,253" fill="var(--warn)"/>
  <line x1="712" y1="346" x2="754" y2="228" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="758,214 744,236 764,242" fill="var(--warn)"/>
  <line x1="778" y1="335" x2="820" y2="217" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="824,203 810,225 830,231" fill="var(--warn)"/>
  <line x1="844" y1="324" x2="886" y2="206" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="890,192 876,214 896,220" fill="var(--warn)"/>
  <text x="705" y="424" font-size="16" fill="var(--dim)" text-anchor="middle">整排都偏同一邊</text>

  <text x="480" y="504" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">底座不動，你會一路錯下去</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The same set of blocks appears in different colors in the left and right panels.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">Same capacity, two ledgers</text>

<rect x="60" y="120" width="390" height="290" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="510" y="120" width="390" height="290" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="90" y="160" font-size="20" font-weight="600" fill="var(--dim)">The everyday efficiency ledger</text>
<text x="540" y="160" font-size="20" font-weight="600" fill="var(--accent)">The three months of disruption</text>

<rect x="90" y="190" width="150" height="70" rx="6" fill="var(--accent)"/>
<rect x="260" y="190" width="150" height="70" rx="6" fill="var(--accent)"/>
<text x="90" y="284" font-size="15" fill="var(--dim)">Large integrated coastal refiners</text>

<rect x="90" y="306" width="90" height="56" rx="6" fill="var(--page)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="196" y="306" width="90" height="56" rx="6" fill="var(--page)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="302" y="306" width="90" height="56" rx="6" fill="var(--page)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="90" y="388" font-size="16" fill="var(--dim)">Small refiners: a deduction</text>

<rect x="540" y="190" width="150" height="70" rx="6" fill="var(--accent)"/>
<rect x="710" y="190" width="150" height="70" rx="6" fill="var(--accent)"/>
<text x="540" y="284" font-size="15" fill="var(--dim)">Large integrated coastal refiners</text>

<rect x="540" y="306" width="90" height="56" rx="6" fill="var(--accent)"/>
<rect x="646" y="306" width="90" height="56" rx="6" fill="var(--accent)"/>
<rect x="752" y="306" width="90" height="56" rx="6" fill="var(--accent)"/>
<text x="540" y="388" font-size="16" font-weight="600" fill="var(--accent)">Small refiners: an option</text>

<polygon points="462,255 492,270 462,285" fill="var(--dim)"/>

<text x="60" y="466" font-size="22" font-weight="600" fill="var(--ink)">Always a minus on the books, worth something the day supply stops</text>
</svg>
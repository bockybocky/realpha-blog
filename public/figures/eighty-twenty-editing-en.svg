<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Two horizontal bars: a script-driven agent covers 80 percent of a video edit; the remaining 20 percent, the part that decides quality, is only reachable by driving the editor directly">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #b9c2d0;
      --accent: #1f6feb;
      --warn:   #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #4a5464;
        --accent: #58a6ff;
        --warn:   #d29922;
      }
    }
    .t    { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1   { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .lab  { font-size: 19px; font-weight: 700; fill: var(--ink); }
    .sub  { font-size: 16px; fill: var(--dim); }
    .big  { font-size: 34px; font-weight: 700; fill: var(--page); }
    .bigW { font-size: 34px; font-weight: 700; fill: var(--warn); }
  </style>
  <rect x="0" y="0" width="960" height="400" fill="var(--page)"/>
  <g class="t">
    <text x="480" y="46" class="h1" text-anchor="middle">Why an agent needs the mouse, not just the shell</text>

    <!-- 整條 -->
    <rect x="80" y="150" width="800" height="70" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <!-- 80% -->
    <rect x="80" y="150" width="640" height="70" fill="var(--accent)"/>
    <text x="400" y="196" class="big" text-anchor="middle">80%</text>
    <!-- 20% -->
    <rect x="720" y="150" width="160" height="70" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="800" y="196" class="bigW" text-anchor="middle">20%</text>

    <text x="400" y="255" class="lab" text-anchor="middle">Scripts in the command line get you here</text>
    <text x="400" y="279" class="sub" text-anchor="middle">cut, rename, batch, export</text>

    <text x="800" y="255" class="lab" text-anchor="middle">Decides quality</text>
    <text x="800" y="279" class="sub" text-anchor="middle">only inside the editor</text>

    <text x="480" y="345" class="sub" text-anchor="middle">Tens of thousands of Macs are for learning this last stretch: how a person uses the software.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Only one item's arrow passes through the border of the box, while the other arrows all stop against the thickened wall.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">What walks out with you</text>
<rect x="140" y="110" width="520" height="370" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="160" y="142">The firm</text>
<line x1="660" y1="250" x2="660" y2="470" stroke="var(--grey)" stroke-width="7"/>
<rect x="180" y="160" width="200" height="48" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="280" y="190" text-anchor="middle">Clients</text>
<line x1="390" y1="184" x2="844" y2="184" stroke="var(--accent)" stroke-width="4"/>
<polygon points="844,175 862,184 844,193" fill="var(--accent)"/>
<text class="g" x="770" y="162" text-anchor="middle" fill="var(--accent)">Portable</text>
<rect x="180" y="250" width="200" height="44" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="280" y="278" text-anchor="middle">Lease</text>
<line x1="390" y1="272" x2="616" y2="272" stroke="var(--grey)" stroke-width="3"/>
<polygon points="616,264 630,272 616,280" fill="var(--grey)"/>
<rect x="180" y="312" width="200" height="44" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="280" y="340" text-anchor="middle">Landlord's 10 yrs</text>
<line x1="390" y1="334" x2="616" y2="334" stroke="var(--grey)" stroke-width="3"/>
<polygon points="616,326 630,334 616,342" fill="var(--grey)"/>
<rect x="180" y="374" width="200" height="44" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="280" y="402" text-anchor="middle">Pension</text>
<line x1="390" y1="396" x2="616" y2="396" stroke="var(--grey)" stroke-width="3"/>
<polygon points="616,388 630,396 616,404" fill="var(--grey)"/>
<rect x="180" y="424" width="200" height="44" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="280" y="452" text-anchor="middle">Your equity</text>
<line x1="390" y1="446" x2="616" y2="446" stroke="var(--grey)" stroke-width="3"/>
<polygon points="616,438 630,446 616,454" fill="var(--grey)"/>
<text class="g" x="680" y="330" fill="var(--dim)">Not portable</text>
<text class="c" x="60" y="560">A firm lasts only as long as what members can take</text>
</svg>
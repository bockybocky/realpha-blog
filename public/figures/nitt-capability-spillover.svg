<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="一個核心能力往右岔出三條分枝，最短的一條只花一年多，最意外的一條從航太認證轉向無人機">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .w { font-size:19px; font-weight:700; fill:var(--warn); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="80" y="66">一個能力，長出三條線</text>
  <rect x="80" y="240" width="190" height="110" rx="8" fill="var(--accent)"/>
  <text x="175" y="288" text-anchor="middle" font-family="Noto Sans TC,Microsoft JhengHei,PingFang TC,sans-serif" font-size="19" font-weight="700" fill="var(--page)">抗靜電</text>
  <text x="175" y="316" text-anchor="middle" font-family="Noto Sans TC,Microsoft JhengHei,PingFang TC,sans-serif" font-size="19" font-weight="700" fill="var(--page)">分散均勻度</text>
  <text class="b" x="175" y="376" text-anchor="middle">在載具客戶那邊練四年</text>
  <path d="M270 268 C 360 180, 420 150, 520 150" fill="none" stroke="var(--line)" stroke-width="4"/>
  <rect x="520" y="118" width="200" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="620" y="156" text-anchor="middle">積體電路載具</text>
  <text class="b" x="740" y="156">一年多就進去</text>
  <path d="M270 295 C 380 295, 430 295, 520 295" fill="none" stroke="var(--line)" stroke-width="4"/>
  <rect x="520" y="263" width="200" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="620" y="301" text-anchor="middle">備援電池模組</text>
  <text class="b" x="740" y="301">導熱與阻火</text>
  <path d="M270 322 C 360 410, 420 440, 520 440" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <rect x="520" y="408" width="190" height="64" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text class="w" x="615" y="446" text-anchor="middle">航太認證</text>
  <path d="M710 440 C 760 440, 770 500, 820 500" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="8 6"/>
  <text class="w" x="820" y="508">無人機</text>
  <text class="b" x="520" y="534">這條線當初不是為它鋪的</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Permissions layered as concentric rings, where an arrow from an outer ring crossing inward is blocked and you are notified.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">Who sees which ring</text>

  <circle cx="380" cy="320" r="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="380" cy="320" r="130" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="380" cy="320" r="70" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>

  <text class="t" x="380" y="315" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Full access</text>
  <text class="t" x="380" y="343" font-size="16" fill="var(--dim)" text-anchor="middle">Spouse</text>
  <text class="t" x="380" y="230" font-size="19" fill="var(--ink)" text-anchor="middle">Partial</text>
  <text class="t" x="380" y="256" font-size="16" fill="var(--dim)" text-anchor="middle">Friends</text>
  <text class="t" x="380" y="160" font-size="19" fill="var(--ink)" text-anchor="middle">Work calendar only</text>
  <text class="t" x="380" y="186" font-size="16" fill="var(--dim)" text-anchor="middle">Colleagues</text>

  <path d="M760 320 L516 320" stroke="var(--warn)" stroke-width="3" fill="none"/>
  <path d="M524 312 L508 320 L524 328 Z" fill="var(--warn)"/>
  <line x1="516" y1="288" x2="516" y2="352" stroke="var(--warn)" stroke-width="3" stroke-dasharray="5 4"/>
  <text class="t" x="770" y="314" font-size="19" fill="var(--ink)">Someone digs in</text>
  <text class="t" x="770" y="342" font-size="16" fill="var(--dim)">Past their ring</text>

  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">Blocked, and you get notified</text>
  <text class="t" x="60" y="528" font-size="16" fill="var(--dim)">The penalty lands on the relationship</text>
</svg>
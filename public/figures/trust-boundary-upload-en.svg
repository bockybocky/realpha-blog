<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A small block goes to the cloud in the top row, while a whole folder including keys and customer data goes to the same cloud in the bottom row.">
  <defs>
    <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">At the moment you run it, what leaves</text>

  <rect x="700" y="106" width="200" height="344" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="800" y="286" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">Cloud</text>

  <text class="t" x="60" y="130" font-size="19" font-weight="700" fill="var(--dim)">What you think you send</text>
  <rect x="60" y="146" width="160" height="58" rx="9" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="140" y="182" font-size="16" fill="var(--ink)" text-anchor="middle">One question</text>
  <line x1="232" y1="175" x2="686" y2="175" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="694,175 680,168 680,182" fill="var(--dim)"/>

  <text class="t" x="60" y="266" font-size="19" font-weight="700" fill="var(--warn)">What actually goes</text>
  <rect x="60" y="282" width="560" height="168" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
  <text class="t" x="80" y="310" font-size="16" fill="var(--dim)">The whole folder</text>
  <rect x="80" y="324" width="250" height="50" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="1.5"/>
  <text class="t" x="205" y="355" font-size="16" fill="var(--ink)" text-anchor="middle">Your question</text>
  <rect x="350" y="324" width="250" height="50" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="1.5"/>
  <text class="t" x="475" y="355" font-size="16" fill="var(--ink)" text-anchor="middle">Private source code</text>
  <rect x="80" y="386" width="250" height="50" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="1.5"/>
  <text class="t" x="205" y="417" font-size="16" fill="var(--ink)" text-anchor="middle">Keys</text>
  <rect x="350" y="386" width="250" height="50" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="1.5"/>
  <text class="t" x="475" y="417" font-size="16" fill="var(--ink)" text-anchor="middle">Customer data</text>
  <line x1="632" y1="366" x2="686" y2="366" stroke="var(--warn)" stroke-width="2.5"/>
  <polygon points="694,366 680,359 680,373" fill="var(--warn)"/>

  <text class="t" x="480" y="518" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Ask where the data goes before talking convenience</text>
</svg>
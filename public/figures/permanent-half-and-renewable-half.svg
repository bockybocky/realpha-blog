<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上面的線一路延伸出圖外，下面的方塊只實心到二〇二九年，之後是空的虛線框">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">一半寫進法律，一半每四年要再吵</text>
<text class="g" x="60" y="150">自動開戶</text>
<line x1="230" y1="180" x2="960" y2="180" stroke="var(--accent)" stroke-width="18"/>
<text class="s" x="230" y="222">永久</text>
<text class="g" x="60" y="320">那 ＄1,000</text>
<rect x="230" y="300" width="320" height="40" fill="var(--accent)"/>
<rect x="570" y="300" width="150" height="40" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<rect x="740" y="300" width="150" height="40" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="s" x="230" y="382">2025</text>
<text class="s" x="536" y="382">2029</text>
<text class="s" x="570" y="272" style="fill:var(--warn)">要新國會再授權一次</text>
<line x1="230" y1="400" x2="550" y2="400" stroke="var(--line)" stroke-width="3"/>
<text class="s" x="230" y="428">目前經費只排到這裡</text>
<text class="c" x="60" y="490">同一個法案，兩種壽命</text>
</svg>
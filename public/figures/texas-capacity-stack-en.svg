<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="70% of Texas capacity is planned and behind a permit gate; only the left 30% is already on the ground.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="64">Texas capacity: 70% still on paper</text>
<rect x="60" y="100" width="840" height="300" rx="14" fill="var(--card)"/>
<rect x="110" y="200" width="222" height="110" rx="6" fill="var(--accent)"/>
<rect x="332" y="200" width="518" height="110" rx="6" fill="var(--grey)"/>
<text class="g" x="110" y="184" fill="var(--accent)">Operating + building</text>
<text class="g" x="370" y="184" fill="var(--dim)">Planned ~70%</text>
<text class="b" x="110" y="340">Already on the ground</text>
<text class="b" x="370" y="340">Needs a new permit</text>
<line x1="332" y1="150" x2="332" y2="366" stroke="var(--warn)" stroke-width="5"/>
<text class="g" x="348" y="140" fill="var(--warn)">Pause, then legislate</text>
<text class="c" x="60" y="470">104GW sounds huge; only the left side can move</text>
</svg>
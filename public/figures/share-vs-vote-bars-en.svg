<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three pairs comparing stake with voting power: the first pair is equal and short, the second has voting far longer than stake, and the third has the longest voting bar.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t27{font-size:27px;font-weight:700;fill:var(--ink)}
.t19{font-size:19px;font-weight:700;fill:var(--ink)}
.t15{font-size:15px;fill:var(--dim)}
.t22{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t27" x="48" y="46">Low stake, high vote</text>
<line x1="300" y1="90" x2="300" y2="440" stroke="var(--line)" stroke-width="2"/>

<text class="t19" x="48" y="146">Jensen</text>
<rect x="300" y="110" width="120" height="30" fill="var(--grey)"/>
<text class="t15" x="432" y="132">Stake &lt;4%</text>
<rect x="300" y="152" width="120" height="30" fill="var(--accent)"/>
<text class="t15" x="432" y="174">Votes equal</text>

<text class="t19" x="48" y="266">Dual-class</text>
<rect x="300" y="230" width="120" height="30" fill="var(--grey)"/>
<text class="t15" x="432" y="252">Stake</text>
<rect x="300" y="272" width="380" height="30" fill="var(--accent)"/>
<text class="t15" x="692" y="294">Votes</text>

<text class="t19" x="48" y="386">Five-class</text>
<rect x="300" y="350" width="120" height="30" fill="var(--grey)"/>
<text class="t15" x="432" y="372">Stake</text>
<rect x="300" y="392" width="560" height="30" fill="var(--accent)"/>
<text class="t15" x="700" y="414" fill="var(--page)">Votes</text>

<rect x="300" y="470" width="20" height="20" fill="var(--grey)"/>
<text class="t15" x="330" y="487">Stake</text>
<rect x="420" y="470" width="20" height="20" fill="var(--accent)"/>
<text class="t15" x="450" y="487">Votes</text>

<text class="t22" x="48" y="534">Not voted in or out</text>
</svg>
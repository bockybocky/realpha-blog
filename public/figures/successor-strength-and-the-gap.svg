<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="長條覆蓋圖：接班人的長處只蓋住公司兩個洞的左半邊，右半邊空著，底下由另一個角色補位">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="56" font-size="27" fill="var(--ink)">補得住的那半邊，和沒人講的那半邊</text>

<text x="120" y="140" font-size="20" fill="var(--dim)">公司現在的洞</text>
<rect x="120" y="156" width="400" height="72" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="520" y="156" width="360" height="72" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="320" y="200" font-size="19" fill="var(--ink)" text-anchor="middle">產品與軟體</text>
<text x="700" y="200" font-size="19" fill="var(--ink)" text-anchor="middle">供應鏈與營運</text>

<text x="120" y="290" font-size="20" fill="var(--dim)">接班人的長處</text>
<rect x="120" y="306" width="400" height="72" rx="8" fill="var(--accent)" opacity="0.22"/>
<rect x="120" y="306" width="400" height="72" rx="8" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="320" y="350" font-size="19" fill="var(--ink)" text-anchor="middle">產品出身</text>
<rect x="520" y="306" width="360" height="72" rx="8" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="9 7"/>
<text x="700" y="350" font-size="19" fill="var(--warn)" text-anchor="middle">蓋不到</text>

<line x1="700" y1="386" x2="700" y2="424" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<polygon points="700,432 693,420 707,420" fill="var(--warn)"/>
<rect x="520" y="436" width="360" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="700" y="475" font-size="19" fill="var(--ink)" text-anchor="middle">資歷最久的營運長</text>
<text x="120" y="475" font-size="19" fill="var(--dim)">這裡誰在守？</text>

<text x="60" y="536" font-size="22" fill="var(--accent)">這格填不出名字，風險就在這格</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The revenue line drops below the cost line in one day, the cost line remains flat, and a gap persists between them afterward.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">Revenue cliffs, costs step</text>
<rect x="80" y="100" width="800" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<polygon points="400,215 860,215 860,330 400,330" fill="var(--line)"/>
<line x1="120" y1="215" x2="860" y2="215" stroke="var(--warn)" stroke-width="4"/>
<polyline points="120,160 400,160 400,330 860,330" fill="none" stroke="var(--accent)" stroke-width="4"/>
<line x1="400" y1="136" x2="400" y2="400" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="b" x="400" y="128" text-anchor="middle">The day the rainmaker leaves</text>
<text class="g" x="124" y="146" fill="var(--accent)">Revenue</text>
<text class="g" x="124" y="205" fill="var(--warn)">Costs</text>
<text class="g" x="630" y="282" text-anchor="middle" fill="var(--dim)">The irreducible part</text>
<line x1="120" y1="400" x2="848" y2="400" stroke="var(--line)" stroke-width="2"/>
<polygon points="848,393 862,400 848,407" fill="var(--line)"/>
<text class="b" x="860" y="428" text-anchor="end">Time</text>
<text class="c" x="60" y="500">Revenue vanishes overnight; contracts keep costs due</text>
</svg>
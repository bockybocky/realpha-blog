<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩疊成本柱並排，較高那疊的頂端拉出一條價格虛線橫貫全圖">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700 }
.g { font-size:20px; fill:var(--ink); font-weight:600 }
.b { font-size:16px; fill:var(--dim) }
.n { font-size:22px; fill:var(--ink); font-weight:700 }
.c { font-size:22px; fill:var(--ink); font-weight:600 }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="56">價格由最貴那家定</text>
<line x1="120" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="310" width="150" height="160" fill="var(--grey)"/>
<text class="b" x="255" y="345" text-anchor="middle" fill="var(--page)">原油</text>
<text class="b" x="255" y="368" text-anchor="middle" fill="var(--page)">管線</text>
<text class="g" x="255" y="500" text-anchor="middle">美灣煉廠</text>
<rect x="560" y="310" width="150" height="160" fill="var(--grey)"/>
<text class="b" x="635" y="345" text-anchor="middle" fill="var(--page)">原油</text>
<text class="b" x="635" y="368" text-anchor="middle" fill="var(--page)">海運</text>
<rect x="560" y="220" width="150" height="90" fill="var(--warn)"/>
<text class="g" x="635" y="272" text-anchor="middle" fill="var(--page)">運費 25</text>
<rect x="560" y="150" width="150" height="70" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="635" y="182" text-anchor="middle">低效</text>
<text class="b" x="635" y="205" text-anchor="middle">高人工</text>
<text class="g" x="635" y="500" text-anchor="middle">歐洲邊際煉廠</text>
<line x1="120" y1="150" x2="900" y2="150" stroke="var(--accent)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="g" x="900" y="136" text-anchor="end" fill="var(--accent)">柴油價格</text>
<path d="M370 310 L370 150" stroke="var(--accent)" stroke-width="3"/>
<path d="M362 165 L370 150 L378 165" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="390" y="240" fill="var(--accent)">毛利</text>
<text class="c" x="60" y="552">運費嵌在別人的成本裡，全世界一起付</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左側八條利空堆疊得很高，右側指數柱離高點只差一道細縫">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">一年的利空清單，與指數的 2.6%</text>
<text class="t" x="60" y="110" font-size="19" fill="var(--dim)">當下都被叫做黑天鵝</text>
<rect x="60" y="130" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="153" font-size="16" fill="var(--ink)">荷姆茲海峽</text>
<rect x="60" y="172" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="195" font-size="16" fill="var(--ink)">油價飆升</text>
<rect x="60" y="214" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="237" font-size="16" fill="var(--ink)">關稅</text>
<rect x="60" y="256" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="279" font-size="16" fill="var(--ink)">通膨黏著</text>
<rect x="60" y="298" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="321" font-size="16" fill="var(--ink)">殖利率 5%</text>
<rect x="60" y="340" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="363" font-size="16" fill="var(--ink)">聯準會升息</text>
<rect x="60" y="382" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="405" font-size="16" fill="var(--ink)">房市凍結</text>
<rect x="60" y="424" width="360" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="78" y="447" font-size="16" fill="var(--ink)">模型進展放緩</text>
<text class="t" x="560" y="110" font-size="19" fill="var(--dim)">指數水位</text>
<line x1="560" y1="148" x2="900" y2="148" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="t" x="560" y="140" font-size="15" fill="var(--dim)">歷史高點</text>
<rect x="620" y="160" width="200" height="298" rx="4" fill="var(--accent)"/>
<line x1="850" y1="148" x2="850" y2="160" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="864" y="160" font-size="19" fill="var(--accent)">2.6%</text>
<text class="t" x="60" y="520" font-size="22" fill="var(--ink)">清單很長，缺口很小</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-label="Three bars: the tallest on the left is dashed and hollow, the middle solid one is ramping now, and the right one is shortest.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:15px; fill:var(--dim); }
    .a { font-size:15px; fill:var(--accent); }
    .c { font-size:22px; }
</style>
<rect x="0" y="0" width="960" height="570" fill="var(--page)"/>
<text class="t" x="50" y="56">One phrase, three orders of magnitude</text>
<text class="b" x="50" y="84">Different distances mean different optics per rack</text>
<text class="b" x="80" y="176">Optics per rack (illustrative)</text>

<rect x="155" y="200" width="150" height="240" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="b" x="230" y="186" text-anchor="middle">Barely started</text>

<rect x="415" y="310" width="150" height="130" fill="var(--accent)"/>
<text class="a" x="490" y="296" text-anchor="middle">Ramping now</text>

<rect x="675" y="385" width="150" height="55" fill="var(--grey)"/>
<text class="b" x="750" y="371" text-anchor="middle">Least of all</text>

<line x1="80" y1="440" x2="910" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="230" y="470" text-anchor="middle">Inside a rack</text>
<text class="b" x="230" y="494" text-anchor="middle">Under 1 metre</text>
<text class="g" x="490" y="470" text-anchor="middle">Rack to rack</text>
<text class="b" x="490" y="494" text-anchor="middle">4 metres and up</text>
<text class="g" x="750" y="470" text-anchor="middle">Cluster to cluster</text>
<text class="b" x="750" y="494" text-anchor="middle">About 100 metres</text>

<text class="c" x="480" y="540" text-anchor="middle">Ask which layer before you multiply</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="長條分三段，最後一段被虛線框住並打叉。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="72" font-size="27" fill="var(--ink)">未來報酬來自三塊，估值只管住其中一塊</text>

  <rect x="90" y="180" width="380" height="120" fill="var(--accent)"/>
  <text x="280" y="248" font-size="19" fill="var(--page)" text-anchor="middle">盈餘成長</text>
  <rect x="470" y="180" width="130" height="120" fill="var(--grey)"/>
  <text x="535" y="248" font-size="19" fill="var(--ink)" text-anchor="middle">股息</text>
  <rect x="600" y="180" width="270" height="120" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="612" y1="192" x2="858" y2="288" stroke="var(--warn)" stroke-width="3"/>
  <line x1="858" y1="192" x2="612" y2="288" stroke="var(--warn)" stroke-width="3"/>
  <text x="735" y="336" font-size="19" fill="var(--warn)" text-anchor="middle">本益比擴張</text>

  <text x="90" y="396" font-size="16" fill="var(--dim)">估值不告訴你何時進場出場</text>
  <text x="60" y="456" font-size="22" fill="var(--ink)">它只說一句：不准假設第三塊會繼續變大</text>
</svg>
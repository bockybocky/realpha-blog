<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條長水平線上密集排列許多向上尖峰，右端持續延伸不收束">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="68">長跑的身體，短跑的心跳</text>

<line x1="80" y1="330" x2="900" y2="330" stroke="var(--grey)" stroke-width="6"/>
<text class="g" x="80" y="392">馬拉松</text>
<text class="b" x="80" y="418">養赤字、整場 AI 投入</text>

<polyline points="130,330 160,190 190,330" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="230,330 260,210 290,330" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="330,330 360,180 390,330" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="430,330 460,215 490,330" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="530,330 560,175 590,330" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="630,330 660,205 690,330" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="730,330 760,185 790,330" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="830,330 860,220 890,330" fill="none" stroke="var(--accent)" stroke-width="4"/>

<text class="g" x="560" y="146" text-anchor="middle">每一次衝刺</text>
<text class="b" x="560" y="170" text-anchor="middle">下一筆募資、下一次標售</text>

<text class="b" x="430" y="392">付出上一期承諾，才能撐住下一期</text>
<text class="c" x="480" y="480" text-anchor="middle">一段一段的急，疊成看起來很穩的長</text>
</svg>
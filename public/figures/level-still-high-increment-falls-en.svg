<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left, three bars rise year by year, but the dark top segment marking the increase over last year first thickens then thins fast; on the right a large box shrinks into a small one">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<text class="t" x="60" y="64">Level high, increment falls</text>
<rect x="120" y="112" width="16" height="16" fill="var(--accent)"/>
<text class="s" x="146" y="126">Added vs last year</text>
<text class="g" x="120" y="166">Investment</text>
<rect x="120" y="310" width="100" height="120" fill="var(--grey)"/>
<rect x="120" y="280" width="100" height="30" fill="var(--accent)"/>
<rect x="250" y="280" width="100" height="150" fill="var(--grey)"/>
<rect x="250" y="180" width="100" height="100" fill="var(--accent)"/>
<rect x="380" y="180" width="100" height="250" fill="var(--grey)"/>
<rect x="380" y="150" width="100" height="30" fill="var(--accent)"/>
<line x1="110" y1="430" x2="500" y2="430" stroke="var(--line)" stroke-width="1.5"/>
<text class="s" x="170" y="456" text-anchor="middle">2025</text>
<text class="s" x="300" y="456" text-anchor="middle">2026</text>
<text class="s" x="430" y="456" text-anchor="middle">2027</text>
<text class="g" x="600" y="166">Multiple paid</text>
<rect x="620" y="196" width="280" height="200" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="690" y="241" width="140" height="110" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="s" x="630" y="222">Before</text>
<text class="b a" x="760" y="303" text-anchor="middle">Now</text>
<polygon points="646,296 676,286 676,306" fill="var(--accent)"/>
<polygon points="874,296 844,286 844,306" fill="var(--accent)"/>
<text class="c" x="60" y="524">Not a recession — just less</text>
</svg>
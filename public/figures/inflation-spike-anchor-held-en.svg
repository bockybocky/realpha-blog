<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The actual inflation line surges to near ten and falls back while the long-run expectations line stays flat at two point three">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="48" y="62" font-size="27" fill="var(--ink)">The anchor held: actual inflation surged, expectations didn't follow</text>

<line x1="120" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="150" x2="120" y2="430" stroke="var(--line)" stroke-width="2"/>
<text x="108" y="436" font-size="15" fill="var(--dim)" text-anchor="end">0%</text>
<text x="108" y="306" font-size="15" fill="var(--dim)" text-anchor="end">5%</text>
<text x="108" y="176" font-size="15" fill="var(--dim)" text-anchor="end">10%</text>
<text x="880" y="458" font-size="15" fill="var(--dim)" text-anchor="end">Time</text>

<polyline points="140,378 260,300 380,200 460,172 560,250 700,326 860,352" fill="none" stroke="var(--warn)" stroke-width="3"/>
<line x1="140" y1="370" x2="860" y2="370" stroke="var(--accent)" stroke-width="3"/>

<text x="470" y="150" font-size="16" fill="var(--warn)" text-anchor="middle">Actual CPI, briefly near 10%</text>
<text x="600" y="402" font-size="16" fill="var(--accent)" text-anchor="middle">Market-implied long-run expectations, steady at 2.3%</text>

<text x="480" y="506" font-size="22" fill="var(--ink)" text-anchor="middle">The line that didn't move deserves the credit</text>
</svg>
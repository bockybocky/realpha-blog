<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A scatter plot of volume against value: a watch top left, a sofa bottom right, and customs attention framing only the cash.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="h" x="60" y="58">Value per unit of volume</text>
<line x1="150" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="110" x2="150" y2="450" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="820" y="480">Bulky</text>
<text class="b" x="60" y="126">High value</text>
<rect x="330" y="230" width="180" height="120" rx="12" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="b" x="330" y="222" fill="var(--accent)">Customs watches this box</text>
<circle cx="230" cy="160" r="10" fill="var(--warn)"/>
<text class="g" x="250" y="166">Watch</text>
<circle cx="310" cy="215" r="10" fill="var(--grey)"/>
<text class="g" x="252" y="200">Cocaine</text>
<circle cx="420" cy="290" r="10" fill="var(--accent)"/>
<text class="g" x="440" y="296">$100 bills</text>
<circle cx="500" cy="335" r="10" fill="var(--grey)"/>
<text class="g" x="520" y="341">Designer bags</text>
<circle cx="820" cy="420" r="10" fill="var(--grey)"/>
<text class="g" x="760" y="410">Sofa</text>
<text class="c" x="60" y="520">Same class of thing, only one must be declared</text>
</svg>
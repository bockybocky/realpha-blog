<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上條只填一小截、下條填一半的兩條比例條，很少的人對應一半支出">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="40" y="58">人在一邊，錢在另一邊</text>
<text class="g" x="40" y="150">人</text>
<rect x="160" y="124" width="720" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="160" y="124" width="36" height="56" fill="var(--accent)"/>
<text class="g" x="206" y="162">5%</text>
<text class="b" x="700" y="208">其餘 95%</text>
<text class="g" x="40" y="330">錢</text>
<rect x="160" y="304" width="720" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="160" y="304" width="360" height="56" fill="var(--accent)"/>
<text class="g" x="536" y="342">一半的醫療費</text>
<line x1="196" y1="180" x2="196" y2="304" stroke="var(--accent)" stroke-width="3" stroke-dasharray="6 6"/>
<line x1="520" y1="180" x2="520" y2="304" stroke="var(--accent)" stroke-width="3" stroke-dasharray="6 6"/>
<polygon points="160,188 520,188 520,296 160,296" fill="var(--accent)" opacity="0.08"/>
<text class="c" x="160" y="440">細的那一段，撐起粗的那一段</text>
<text class="b" x="160" y="476">他的說法是：因為美國不放棄任何一個人</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Four bars grow taller each year, with a dashed line for the cash-flow ceiling, and the blue debt-funded portion above the line gets bigger every year.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="48" text-anchor="middle">Capex beyond cash = debt</text>
<rect x="290" y="80" width="18" height="18" fill="var(--grey)"/>
<text class="s" x="316" y="95">Cash</text>
<rect x="470" y="80" width="18" height="18" fill="var(--accent)"/>
<text class="s" x="496" y="95">Debt</text>
<text class="s" x="660" y="95">Illus.</text>
<line x1="110" y1="480" x2="900" y2="480" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="396" width="120" height="84" fill="var(--grey)"/>
<rect x="350" y="340" width="120" height="140" fill="var(--grey)"/>
<rect x="550" y="340" width="120" height="140" fill="var(--grey)"/>
<rect x="550" y="256" width="120" height="84" fill="var(--accent)"/>
<rect x="750" y="340" width="120" height="140" fill="var(--grey)"/>
<rect x="750" y="144" width="120" height="196" fill="var(--accent)"/>
<line x1="110" y1="340" x2="900" y2="340" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="s" x="115" y="330">Cash limit</text>
<text class="b" x="210" y="386" text-anchor="middle">Exp 3</text>
<text class="b" x="410" y="330" text-anchor="middle">Exp 5</text>
<text class="b" x="610" y="246" text-anchor="middle">Exp 8</text>
<text class="b" x="810" y="134" text-anchor="middle">Exp 12</text>
<text class="g" x="610" y="305" text-anchor="middle" style="fill:var(--page)">Debt 3</text>
<text class="g" x="810" y="250" text-anchor="middle" style="fill:var(--page)">Debt 7</text>
<text class="s" x="210" y="508" text-anchor="middle">Yr 1</text>
<text class="s" x="410" y="508" text-anchor="middle">Yr 2</text>
<text class="s" x="610" y="508" text-anchor="middle">Yr 3</text>
<text class="s" x="810" y="508" text-anchor="middle">Yr 4</text>
<text class="c" x="480" y="556" text-anchor="middle">Borrowed share grows</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two funnels facing opposite ways, the left widening from narrow to broad and the right narrowing from broad to thin">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">Two opposite uses</text>
<line x1="480" y1="120" x2="480" y2="430" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>
<polygon points="100,272 100,288 370,150 370,410" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="235" y="132" font-size="20" fill="var(--accent)" text-anchor="middle">Coding: expansion</text>
<text x="40" y="286" font-size="15" fill="var(--dim)">One sentence</text>
<text x="378" y="286" font-size="15" fill="var(--ink)">A million lines</text>
<polygon points="590,150 590,410 860,288 860,272" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="725" y="132" font-size="20" fill="var(--dim)" text-anchor="middle">Most white collar: compression</text>
<text x="504" y="286" font-size="15" fill="var(--ink)">Forty pages</text>
<text x="868" y="286" font-size="15" fill="var(--dim)">Five bullets</text>
<text x="480" y="492" font-size="22" fill="var(--ink)" text-anchor="middle">We extrapolate everyone's future from the least representative case</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="資金通過兩道閘門後分岔：通過的通道長長延伸，未通過的往下漏成短截">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <defs>
    <marker id="ah5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--grey)"/>
    </marker>
  </defs>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">政府的錢要過兩道閘，才長得成產業</text>

  <rect x="56" y="196" width="150" height="72" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="131" y="240" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">政府出錢</text>
  <line x1="206" y1="232" x2="268" y2="232" stroke="var(--grey)" stroke-width="3" marker-end="url(#ah5)"/>

  <rect x="280" y="176" width="112" height="112" rx="12" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="336" y="226" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">計畫</text>
  <text class="t" x="336" y="252" font-size="15" fill="var(--dim)" text-anchor="middle">十年的</text>
  <line x1="392" y1="232" x2="430" y2="232" stroke="var(--grey)" stroke-width="3" marker-end="url(#ah5)"/>
  <rect x="442" y="176" width="112" height="112" rx="12" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="498" y="226" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">問責</text>
  <text class="t" x="498" y="252" font-size="15" fill="var(--dim)" text-anchor="middle">出事誰擔</text>

  <rect x="596" y="196" width="308" height="72" rx="12" fill="var(--accent)" opacity="0.2" stroke="var(--line)" stroke-width="2"/>
  <line x1="554" y1="232" x2="584" y2="232" stroke="var(--grey)" stroke-width="3" marker-end="url(#ah5)"/>
  <text class="t" x="750" y="228" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">撐得住的產業</text>
  <text class="t" x="750" y="252" font-size="15" fill="var(--dim)" text-anchor="middle">南韓造船</text>

  <path d="M 336 300 L 336 372" fill="none" stroke="var(--grey)" stroke-width="3" marker-end="url(#ah5)"/>
  <rect x="280" y="384" width="124" height="68" rx="12" fill="var(--warn)" opacity="0.26" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="342" y="414" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">一次性</text>
  <text class="t" x="342" y="438" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">補貼</text>
  <text class="t" x="430" y="416" font-size="16" fill="var(--dim)">找不到證據，就當它是這個</text>
  <text class="t" x="430" y="442" font-size="16" fill="var(--dim)">不是一個會持續十年的產業</text>
</svg>
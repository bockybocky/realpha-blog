<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="A three-layer funnel from free content to mailing list to paid course, with headcount falling down the left and price rising up the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">The free layer is the widest one</text>

  <polygon points="170,140 790,140 700,232 260,232" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="480" y="196" text-anchor="middle" font-size="20" fill="var(--ink)">Free content</text>

  <polygon points="260,248 700,248 620,340 340,340" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="480" y="304" text-anchor="middle" font-size="20" fill="var(--ink)">Mailing list</text>

  <polygon points="340,356 620,356 552,448 408,448" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text x="480" y="412" text-anchor="middle" font-size="20" fill="var(--accent)">Paid course</text>

  <text x="105" y="176" text-anchor="middle" font-size="19" fill="var(--dim)">People</text>
  <line x1="105" y1="198" x2="105" y2="408" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="94,405 116,405 105,430" fill="var(--grey)"/>

  <text x="855" y="176" text-anchor="middle" font-size="19" fill="var(--dim)">Price</text>
  <line x1="855" y1="430" x2="855" y2="222" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="844,225 866,225 855,200" fill="var(--grey)"/>

  <text x="480" y="518" text-anchor="middle" font-size="22" fill="var(--ink)">Fewer people further down, each one worth more</text>
</svg>
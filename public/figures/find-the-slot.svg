<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左邊一疊層的右緣全是平的，插頭卡不進去；右邊那疊其中一層缺了一個凹口，插頭正好嵌進去" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="64" y="66" font-size="27" font-weight="700" fill="var(--ink)">新工具要先找它的那一層</text>
<text x="64" y="98" font-size="16" fill="var(--dim)">問的不是它好不好，是我這裡有沒有那個凹口</text>

<text x="80" y="156" font-size="20" font-weight="700" fill="var(--dim)">自家流程</text>
<rect x="80" y="180" width="240" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="200" y="215" font-size="16" fill="var(--ink)" text-anchor="middle">抓資料</text>
<rect x="80" y="252" width="240" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="200" y="287" font-size="16" fill="var(--ink)" text-anchor="middle">判讀</text>
<rect x="80" y="324" width="240" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="200" y="359" font-size="16" fill="var(--ink)" text-anchor="middle">寫作</text>
<rect x="80" y="396" width="240" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="200" y="431" font-size="16" fill="var(--ink)" text-anchor="middle">校對</text>

<rect x="368" y="280" width="64" height="40" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="400" y="352" font-size="16" fill="var(--warn)" text-anchor="middle">純分類</text>
<line x1="356" y1="268" x2="444" y2="332" stroke="var(--warn)" stroke-width="3"/>
<line x1="444" y1="268" x2="356" y2="332" stroke="var(--warn)" stroke-width="3"/>

<line x1="500" y1="150" x2="500" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

<text x="560" y="156" font-size="20" font-weight="700" fill="var(--dim)">銀行客服</text>
<rect x="560" y="180" width="240" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="680" y="215" font-size="16" fill="var(--ink)" text-anchor="middle">接進來</text>
<path d="M560 252 H800 V266 H778 V292 H800 V308 H560 Z" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="670" y="287" font-size="16" font-weight="700" fill="var(--accent)" text-anchor="middle">聽懂他要什麼</text>
<rect x="778" y="266" width="26" height="26" rx="4" fill="var(--accent)"/>
<text x="840" y="287" font-size="16" fill="var(--accent)">純分類</text>
<rect x="560" y="324" width="240" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="680" y="359" font-size="16" fill="var(--ink)" text-anchor="middle">給對應範本</text>

<text x="480" y="530" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">它取代的是哪一層，我有沒有那一層</text>
</svg>
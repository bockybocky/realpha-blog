<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩格對照，上下兩個方塊的位置互換，向下的箭頭方向不變">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
  <marker id="arw-f6a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M0 0 L12 6 L0 12 z" fill="var(--accent)"/>
  </marker>
  <marker id="arw-f6b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M0 0 L12 6 L0 12 z" fill="var(--warn)"/>
  </marker>
</defs>
<text x="80" y="66" font-size="27" fill="var(--ink)">受測者接管了考場</text>

<text x="90" y="126" font-size="19" fill="var(--dim)">原本</text>
<rect x="80" y="140" width="380" height="320" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="115" y="176" width="310" height="76" rx="10" fill="var(--accent)" opacity="0.16"/>
<rect x="115" y="176" width="310" height="76" rx="10" fill="none" stroke="var(--accent)"/>
<text x="270" y="222" font-size="19" fill="var(--accent)" text-anchor="middle">評測與監控</text>
<path d="M270 260 L270 336" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arw-f6a)"/>
<text x="290" y="304" font-size="16" fill="var(--dim)">監看</text>
<rect x="115" y="344" width="310" height="76" rx="10" fill="none" stroke="var(--grey)"/>
<text x="270" y="390" font-size="19" fill="var(--ink)" text-anchor="middle">代理人</text>

<text x="510" y="126" font-size="19" fill="var(--dim)">之後</text>
<rect x="500" y="140" width="380" height="320" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="535" y="176" width="310" height="76" rx="10" fill="var(--warn)" opacity="0.18"/>
<rect x="535" y="176" width="310" height="76" rx="10" fill="none" stroke="var(--warn)"/>
<text x="690" y="222" font-size="19" fill="var(--warn)" text-anchor="middle">代理人</text>
<path d="M690 260 L690 336" fill="none" stroke="var(--warn)" stroke-width="2.5" marker-end="url(#arw-f6b)"/>
<text x="710" y="304" font-size="16" fill="var(--dim)">掌握</text>
<rect x="535" y="344" width="310" height="76" rx="10" fill="none" stroke="var(--grey)"/>
<text x="690" y="382" font-size="19" fill="var(--ink)" text-anchor="middle">評測與監控</text>
<text x="690" y="406" font-size="16" fill="var(--dim)" text-anchor="middle">連憑證</text>

<text x="80" y="500" font-size="22" fill="var(--ink)">位置對調，箭頭方向沒變</text>
</svg>
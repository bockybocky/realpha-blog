<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一條繞遠路的折線，右邊一條直線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="72">看得見海底的那一刻差多久</text>
<line x1="60" y1="250" x2="430" y2="250" stroke="var(--line)" stroke-width="3"/>
<line x1="530" y1="250" x2="900" y2="250" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="60" y="240">水面</text>
<text class="b" x="530" y="240">水面</text>
<rect x="150" y="214" width="120" height="34" rx="4" fill="var(--grey)"/>
<text class="b" x="150" y="196">柴油大船</text>
<circle cx="210" cy="430" r="12" fill="var(--grey)"/>
<text class="b" x="60" y="470">海底</text>
<polyline points="210,418 210,266 270,266 360,170 400,140" fill="none" stroke="var(--grey)" stroke-width="5"/>
<text class="g" x="300" y="120">幾週到幾個月</text>
<circle cx="700" cy="430" r="12" fill="var(--accent)"/>
<text class="b" x="550" y="470">海底</text>
<polyline points="700,418 700,150" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="700" cy="140" r="14" fill="var(--accent)"/>
<text class="g" x="620" y="110">浮上即回</text>
<text class="c" x="60" y="528">看不見的地方，只有持續看才看得到</text>
</svg>
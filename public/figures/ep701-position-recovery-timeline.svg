<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="折線圖：高檔走平後七月急墜三成，八九月換倉回升並創新高，虛線是他原本預期的修復路徑">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">台股部位：一年內走完一輪</text>
<rect x="60" y="100" width="840" height="320" fill="var(--card)"/>
<line x1="60" y1="150" x2="900" y2="150" stroke="var(--line)" stroke-width="2"/>
<line x1="60" y1="330" x2="900" y2="330" stroke="var(--line)" stroke-width="2"/>
<text x="70" y="142" font-size="15" fill="var(--dim)">七月高點</text>
<text x="70" y="352" font-size="15" fill="var(--dim)">低點（約 −30%）</text>
<polyline points="110,165 260,150 330,230 400,330 470,320 600,250 700,180 820,128" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="400,330 820,300" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<circle cx="260" cy="150" r="6" fill="var(--accent)"/>
<circle cx="400" cy="330" r="6" fill="var(--warn)"/>
<circle cx="820" cy="128" r="7" fill="var(--accent)"/>
<text x="110" y="205" font-size="19" fill="var(--ink)">1–6 月</text>
<text x="110" y="228" font-size="15" fill="var(--dim)">最好做的盤</text>
<text x="330" y="372" font-size="19" fill="var(--warn)">7 月中下殺</text>
<text x="330" y="395" font-size="15" fill="var(--dim)">均線該剎沒剎</text>
<text x="452" y="372" font-size="19" fill="var(--ink)">7 月下半減碼</text>
<text x="452" y="395" font-size="15" fill="var(--dim)">砍的還是賺錢的</text>
<text x="600" y="300" font-size="19" fill="var(--ink)">8–9 月換部位</text>
<text x="600" y="323" font-size="15" fill="var(--dim)">光通訊 · 小型 IC 設計 · 衛星</text>
<text x="700" y="112" font-size="19" fill="var(--accent)">9 月初新高</text>
<text x="640" y="296" font-size="15" fill="var(--grey)">原以為年底前都補不回</text>
<text x="60" y="470" font-size="22" fill="var(--ink)">減碼的依據不是帳面盈虧，是結構訊號失效</text>
<text x="60" y="504" font-size="15" fill="var(--dim)">美股因單一標的比重偏大，摸新高落後台股一截</text>
</svg>
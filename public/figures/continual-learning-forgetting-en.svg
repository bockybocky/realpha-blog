<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A general-capability curve declines as the number of small updates grows, while a separate point on the right represents one retrain from scratch, higher than the start but marked as expensive.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="60" y="62" class="h">Tweaks pile, skill falls</text>
<line x1="120" y1="130" x2="120" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="460" x2="700" y2="460" stroke="var(--line)" stroke-width="2"/>
<text x="132" y="124" class="g">Skill</text>
<line x1="120" y1="170" x2="712" y2="170" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="700" y="160" text-anchor="end" class="b">Pre</text>
<path d="M120,172 C320,174 460,205 560,285 S680,382 700,390" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
<path d="M706,172 H718 V390 H706" fill="none" stroke="var(--warn)" stroke-width="2.5"/>
<text x="690" y="240" text-anchor="end" class="g" style="fill:var(--warn)">Forgets</text>
<text x="120" y="486" text-anchor="middle" class="b">0</text>
<text x="700" y="486" text-anchor="end" class="b">Updates</text>
<line x1="765" y1="120" x2="765" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="850" cy="158" r="12" fill="var(--accent)"/>
<text x="850" y="208" text-anchor="middle" class="g">Retrain</text>
<text x="850" y="236" text-anchor="middle" class="b" style="fill:var(--warn)">Best,$</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The shelf message runs in three layers, and the science itself comes after the purchase line.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="40" y="52" font-size="27" fill="var(--ink)">The science comes last</text>

  <rect x="40" y="96" width="640" height="88" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="68" y="140" font-size="20" fill="var(--ink)">Steroid-free · drug-free · works</text>
  <text x="68" y="168" font-size="16" fill="var(--dim)">Layer 1</text>

  <rect x="40" y="200" width="460" height="88" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="68" y="244" font-size="20" fill="var(--ink)">Feel better right away</text>
  <text x="68" y="272" font-size="16" fill="var(--dim)">Layer 2</text>

  <line x1="40" y1="320" x2="920" y2="320" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="40" y="350" font-size="19" fill="var(--warn)">The line where they buy</text>

  <rect x="40" y="376" width="300" height="88" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="68" y="420" font-size="20" fill="var(--ink)">Protects the nasal microbiome</text>
  <text x="68" y="448" font-size="16" fill="var(--dim)">Layer 3</text>

  <text x="380" y="412" font-size="19" fill="var(--ink)">The science sits here</text>
  <text x="380" y="444" font-size="16" fill="var(--dim)">Homework done after joining the brand</text>

  <text x="716" y="150" font-size="16" fill="var(--dim)">Seen most clearly</text>
  <text x="716" y="420" font-size="16" fill="var(--dim)">No one reads at shelf</text>
</svg>
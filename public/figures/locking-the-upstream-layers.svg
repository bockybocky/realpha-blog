<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四條代表上游環節的橫條，絕大部分被單一買家佔滿，右端只剩一小截">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<text x="60" y="72" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="27" fill="var(--ink)">把上游的產能先買走</text>

<text x="60" y="140" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--accent)">已被買下</text>
<text x="900" y="140" text-anchor="end" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--grey)">剩給其他人</text>

<text x="60" y="190" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--dim)">雷射</text>
<rect x="200" y="168" width="700" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="200" y="168" width="580" height="34" rx="6" fill="var(--accent)" opacity="0.85"/>

<text x="60" y="256" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--dim)">載板</text>
<rect x="200" y="234" width="700" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="200" y="234" width="620" height="34" rx="6" fill="var(--accent)" opacity="0.85"/>

<text x="60" y="322" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--dim)">封裝產能</text>
<rect x="200" y="300" width="700" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="200" y="300" width="600" height="34" rx="6" fill="var(--accent)" opacity="0.85"/>

<text x="60" y="388" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--dim)">晶圓代工</text>
<rect x="200" y="366" width="700" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="200" y="366" width="560" height="34" rx="6" fill="var(--accent)" opacity="0.85"/>

<text x="60" y="480" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="22" fill="var(--ink)">對手不是輸在技術，是輸在排隊位置</text>
</svg>
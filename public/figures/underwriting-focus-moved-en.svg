<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A before-and-after contrast in which underwriting focus goes from one block to two.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">Who lenders look at</text>

<text x="150" y="130" font-size="19" fill="var(--dim)">Six months ago</text>
<rect x="150" y="150" width="240" height="260" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="186" y="290" font-size="20" fill="var(--accent)">Tenant credit</text>

<line x1="440" y1="280" x2="508" y2="280" stroke="var(--dim)" stroke-width="3"/>
<polygon points="508,270 532,280 508,290" fill="var(--dim)"/>

<text x="570" y="130" font-size="19" fill="var(--ink)">Now</text>
<rect x="570" y="150" width="240" height="140" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="606" y="228" font-size="20" fill="var(--accent)">Tenant credit</text>
<rect x="570" y="298" width="240" height="112" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="606" y="346" font-size="20" fill="var(--warn)">Operator skill</text>
<text x="606" y="376" font-size="16" fill="var(--dim)">Service level · track record</text>

<text x="60" y="470" font-size="22" fill="var(--ink)">Take-or-pay needs someone keeping the machines running</text>
</svg>
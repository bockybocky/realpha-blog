<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The same gap becomes more obvious after magnification, so raising the spec does not fill in a gap in the content.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62">Magnify it and the gap is what gets magnified</text>

  <text class="g" x="80" y="130">Before</text>
  <rect x="80" y="160" width="220" height="150" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <path d="M110 285 H170 L190 215 H250 L270 285 H300" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M190 215 H230" stroke="var(--page)" stroke-width="7"/>
  <circle cx="210" cy="215" r="10" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <text class="s" x="80" y="345">Gap is small</text>

  <path d="M330 240 H410" stroke="var(--grey)" stroke-width="2"/>
  <path d="M400 233 L413 240 L400 247 Z" fill="var(--grey)"/>
  <text class="s" x="330" y="222">Raise the spec</text>

  <text class="g" x="450" y="130">Magnified</text>
  <rect x="450" y="150" width="420" height="260" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <path d="M490 370 H600 L640 230 H740 L780 370 H840" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <path d="M640 230 H718" stroke="var(--page)" stroke-width="11"/>
  <circle cx="678" cy="230" r="34" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <path d="M702 254 L730 282" stroke="var(--warn)" stroke-width="5"/>
  <text class="c" x="450" y="455">The gap grows too</text>
</svg>
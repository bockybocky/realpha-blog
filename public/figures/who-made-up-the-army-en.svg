<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A long horizontal bar whose far-left sliver is bright for the Spaniards, with all the rest gray for the Mesoamerican peoples.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Who made up the besieging army</text>

<rect x="60" y="180" width="840" height="110" rx="6" fill="var(--grey)" opacity="0.45"/>
<rect x="60" y="180" width="4" height="110" fill="var(--accent)"/>
<rect x="60" y="180" width="840" height="110" rx="6" fill="none" stroke="var(--line)"/>

<line x1="62" y1="180" x2="150" y2="130" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="156" y="126" font-size="20" font-weight="700" fill="var(--accent)">Spaniards</text>
<text class="t" x="156" y="152" font-size="16" fill="var(--dim)">0.5%</text>

<text class="t" x="500" y="232" font-size="20" font-weight="700" fill="var(--ink)">Mesoamericans</text>
<text class="t" x="500" y="260" font-size="16" fill="var(--dim)">99.5%</text>

<text class="t" x="60" y="360" font-size="19" fill="var(--dim)">As the allies saw it</text>
<text class="t" x="60" y="398" font-size="22" fill="var(--ink)">They were using these few hundred outsiders</text>
<line x1="60" y1="424" x2="520" y2="424" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="462" font-size="16" fill="var(--dim)">Tlaxcala: salt route cut for decades, all in on one bet</text>
</svg>
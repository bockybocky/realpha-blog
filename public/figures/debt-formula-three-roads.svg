<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="一行公式往下分成三欄，三根柱子高度依序遞增，最右邊那根最高">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:20px;fill:var(--ink)}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="58">三個變數，三條路</text>
<rect x="120" y="86" width="720" height="56" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="480" y="122" text-anchor="middle">債務比例變化 ＝ 赤字 ＋ ( R − G ) × 債務比例</text>
<path d="M300,142 L200,196" fill="none" stroke="var(--line)" stroke-width="2"/>
<path d="M455,142 L480,196" fill="none" stroke="var(--line)" stroke-width="2"/>
<path d="M520,142 L760,196" fill="none" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="200" y="228" text-anchor="middle">赤字</text>
<text class="g" x="480" y="228" text-anchor="middle">R　融資利率</text>
<text class="g" x="760" y="228" text-anchor="middle">G　經濟成長</text>
<line x1="120" y1="472" x2="840" y2="472" stroke="var(--line)" stroke-width="2"/>
<rect x="140" y="432" width="120" height="40" fill="var(--grey)"/>
<rect x="420" y="362" width="120" height="110" fill="var(--grey)"/>
<rect x="700" y="252" width="120" height="220" fill="var(--accent)"/>
<text class="s" x="200" y="502" text-anchor="middle">加不動</text>
<text class="s" x="480" y="502" text-anchor="middle">鬆摩擦</text>
<text class="s" x="760" y="502" text-anchor="middle">唯一出路</text>
<text class="s" x="60" y="300" transform="rotate(-90 60 300)" text-anchor="middle">可動空間</text>
<text class="c" x="60" y="548">能動的空間，一格比一格大</text>
</svg>
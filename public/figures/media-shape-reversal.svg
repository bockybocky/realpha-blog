<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩張卡片對照，左卡三個箭頭朝上、右卡三個箭頭朝下，同樣三項做法在兩個媒介方向相反">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="480" y="62" text-anchor="middle" font-size="27" fill="var(--ink)">同樣三項做法，換了媒介就反過來</text>

  <rect x="60" y="110" width="320" height="380" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="580" y="110" width="320" height="380" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>

  <text x="220" y="155" text-anchor="middle" font-size="20" fill="var(--ink)">電視</text>
  <text x="220" y="182" text-anchor="middle" font-size="15" fill="var(--dim)">加分</text>
  <text x="740" y="155" text-anchor="middle" font-size="20" fill="var(--ink)">YouTube</text>
  <text x="740" y="182" text-anchor="middle" font-size="15" fill="var(--dim)">負擔</text>

  <text x="480" y="275" text-anchor="middle" font-size="16" fill="var(--ink)">外景</text>
  <text x="480" y="355" text-anchor="middle" font-size="16" fill="var(--ink)">圖卡</text>
  <text x="480" y="435" text-anchor="middle" font-size="16" fill="var(--ink)">電視藝人</text>

  <rect x="211" y="254" width="18" height="46" fill="var(--accent)"/>
  <polygon points="200,254 240,254 220,228" fill="var(--accent)"/>
  <rect x="211" y="334" width="18" height="46" fill="var(--accent)"/>
  <polygon points="200,334 240,334 220,308" fill="var(--accent)"/>
  <rect x="211" y="414" width="18" height="46" fill="var(--accent)"/>
  <polygon points="200,414 240,414 220,388" fill="var(--accent)"/>

  <rect x="731" y="228" width="18" height="46" fill="var(--warn)"/>
  <polygon points="720,274 760,274 740,300" fill="var(--warn)"/>
  <rect x="731" y="308" width="18" height="46" fill="var(--warn)"/>
  <polygon points="720,354 760,354 740,380" fill="var(--warn)"/>
  <rect x="731" y="388" width="18" height="46" fill="var(--warn)"/>
  <polygon points="720,434 760,434 740,460" fill="var(--warn)"/>

  <text x="480" y="535" text-anchor="middle" font-size="22" fill="var(--ink)">限制變了，最佳解就跟著變</text>
</svg>
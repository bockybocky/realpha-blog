<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three payoff lines side by side: a symmetric slope, a kinked line paid for with premium, and a collar sloped at both ends and flat in the middle." style="font-family:&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="80" y="72" font-size="27" fill="var(--ink)">Three tools, split by willingness to pay premium</text>

<rect x="80" y="110" width="250" height="320" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="300" x2="310" y2="300" stroke="var(--line)" stroke-width="2"/>
<polyline points="100,380 310,220" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="205" y="152" font-size="20" fill="var(--ink)" text-anchor="middle">Swap</text>
<text x="205" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">Up gains, down pays</text>

<rect x="355" y="110" width="250" height="320" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="375" y1="300" x2="585" y2="300" stroke="var(--line)" stroke-width="2"/>
<polyline points="375,335 490,335 585,215" fill="none" stroke="var(--accent)" stroke-width="4"/>
<line x1="420" y1="300" x2="420" y2="335" stroke="var(--warn)" stroke-width="3"/>
<text x="480" y="152" font-size="20" fill="var(--ink)" text-anchor="middle">Call option</text>
<text x="480" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">No loss on the way down, premium paid upfront</text>

<rect x="630" y="110" width="250" height="320" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="650" y1="300" x2="860" y2="300" stroke="var(--line)" stroke-width="2"/>
<polyline points="650,380 715,300 795,300 860,230" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="755" y="152" font-size="20" fill="var(--ink)" text-anchor="middle">Zero-cost collar</text>
<text x="755" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">Sell a put to fund the call</text>

<text x="80" y="500" font-size="22" fill="var(--ink)">Skip the premium and the risk comes back to you</text>
</svg>
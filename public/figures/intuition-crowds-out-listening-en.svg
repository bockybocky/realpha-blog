<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two panels compared: on the left, for a product I use myself, the opinion circle is large and the listening circle small; on the right, for a product I have no feel for, the opinion circle is small and the listening circle large.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:20px; font-weight:700; fill:var(--ink); }
    .lab { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="58">The fuller my opinion, the less I hear</text>

  <rect x="70" y="100" width="390" height="330" fill="var(--card)"/>
  <text class="grp" x="96" y="140">A product I use myself</text>
  <circle cx="200" cy="280" r="78" fill="var(--warn)" opacity="0.6"/>
  <text class="lab" x="200" y="286" text-anchor="middle">My opinion</text>
  <circle cx="380" cy="300" r="26" fill="var(--grey)"/>
  <text class="lab" x="380" y="360" text-anchor="middle">What I take in</text>

  <rect x="500" y="100" width="390" height="330" fill="var(--card)"/>
  <text class="grp" x="526" y="140">A product I have no feel for</text>
  <circle cx="606" cy="300" r="26" fill="var(--grey)"/>
  <text class="lab" x="606" y="360" text-anchor="middle">My opinion</text>
  <circle cx="780" cy="280" r="78" fill="var(--accent)" opacity="0.6"/>
  <text class="lab" x="780" y="286" text-anchor="middle">What I take in</text>

  <text class="end" x="60" y="494">On your best-known stock, assume no intuition</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A blue line steps down like a staircase after hitting two walls and flows into a fuel cell box.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<defs>
<marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
<marker id="m7g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/></marker>
</defs>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Choke shifts</text>
<text x="60" y="140" font-size="19" fill="var(--ink)">DCs need MW</text>
<path d="M60,160 H270 V300 H510 V440 H740" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#m7)"/>
<line x1="270" y1="160" x2="290" y2="160" stroke="var(--accent)" stroke-width="4"/>
<rect x="292" y="110" width="16" height="100" fill="var(--warn)"/>
<text x="300" y="98" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Grid</text>
<text x="322" y="200" font-size="15" fill="var(--warn)">Queue</text>
<line x1="510" y1="300" x2="530" y2="300" stroke="var(--accent)" stroke-width="4"/>
<rect x="532" y="250" width="16" height="100" fill="var(--warn)"/>
<text x="540" y="238" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Turbines</text>
<text x="562" y="340" font-size="15" fill="var(--warn)">Gone</text>
<rect x="750" y="400" width="170" height="80" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="835" y="436" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">Fuel cell</text>
<text x="835" y="463" font-size="15" fill="var(--dim)" text-anchor="middle">Track+permit</text>
<line x1="835" y1="392" x2="835" y2="262" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m7g)"/>
<text x="835" y="244" font-size="16" fill="var(--dim)" text-anchor="middle">Shifts on</text>
</svg>
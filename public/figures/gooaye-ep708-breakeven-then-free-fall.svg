<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="單價在損益兩平線上方平緩，產能過剩之後直落到接近邊際成本的水平線">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">固定成本高、邊際成本低的兩面刃</text>
<line x1="130" y1="100" x2="130" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="130" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="62" y="114" font-size="16" fill="var(--dim)">單價</text>
<text x="860" y="500" font-size="16" fill="var(--dim)">產能</text>
<polygon points="160,196 540,252 540,300 160,300" fill="var(--accent)" opacity="0.14"/>
<line x1="130" y1="300" x2="900" y2="300" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="138" y="290" font-size="16" fill="var(--dim)">損益兩平</text>
<line x1="130" y1="430" x2="900" y2="430" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="138" y="452" font-size="16" fill="var(--dim)">邊際成本</text>
<path d="M160 196 L430 228 L540 252" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M540 252 L616 332 L690 420 L800 428" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text x="240" y="276" font-size="16" fill="var(--accent)">還在賺</text>
<line x1="540" y1="110" x2="540" y2="470" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 6"/>
<text x="556" y="140" font-size="20" fill="var(--warn)">產能過剩</text>
<text x="700" y="300" font-size="20" fill="var(--warn)">自由落體</text>
<text x="130" y="525" font-size="22" fill="var(--ink)">班機還是得發，誰都想少賠一點</text>
</svg>
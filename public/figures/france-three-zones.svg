<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三層同心環與箭頭：內環讓外兩環對立，外圈失去金錢後內環轉向最外圈求保護">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">法國的三圈</text>

  <circle cx="380" cy="300" r="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="380" cy="300" r="125" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="380" cy="300" r="62" fill="var(--accent)"/>
  <text class="t" x="380" y="295" font-size="20" font-weight="700" text-anchor="middle" fill="var(--page)">A 區</text>
  <text class="t" x="380" y="320" font-size="15" text-anchor="middle" fill="var(--page)">市中心</text>
  <text class="t" x="380" y="205" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">B 區</text>
  <text class="t" x="380" y="228" font-size="15" text-anchor="middle" fill="var(--dim)">外圍郊區</text>
  <text class="t" x="380" y="140" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">C 區</text>
  <text class="t" x="380" y="163" font-size="15" text-anchor="middle" fill="var(--dim)">鄉下</text>

  <text class="t" x="640" y="170" font-size="19" font-weight="700" fill="var(--dim)">歐盟旗｜政府、金融、知識</text>
  <text class="t" x="640" y="205" font-size="15" fill="var(--dim)">A 區</text>
  <text class="t" x="640" y="265" font-size="19" font-weight="700" fill="var(--dim)">巴勒斯坦旗｜保母、司機、廚師</text>
  <text class="t" x="640" y="300" font-size="15" fill="var(--dim)">B 區</text>
  <text class="t" x="640" y="360" font-size="19" font-weight="700" fill="var(--dim)">法國國旗｜店鋪、醫院關門</text>
  <text class="t" x="640" y="395" font-size="15" fill="var(--dim)">C 區</text>

  <path d="M430 255 L540 180" stroke="var(--grey)" stroke-width="3"/>
  <path d="M540 180 l-4 18 l16 -9 z" fill="var(--grey)"/>
  <path d="M430 345 L540 420" stroke="var(--warn)" stroke-width="3"/>
  <path d="M540 420 l-12 -14 l-4 18 z" fill="var(--warn)"/>
  <text class="t" x="470" y="460" font-size="16" fill="var(--warn)">沒錢付了，轉去找保護</text>

  <text class="t" x="60" y="520" font-size="22" font-weight="700" fill="var(--ink)">讓外兩圈對立的那隻手，錢用完了</text>
</svg>
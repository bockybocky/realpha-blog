<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩根柱相減的圖：左邊高柱由下段實質利率與上段通膨預期疊成，減去中間等高於下段的矮柱，等於右邊那根代表損益兩平通膨率的柱">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .o { font-size:34px; font-weight:700; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">市場對通膨的預期，是兩個報價相減出來的</text>

  <line x1="60" y1="410" x2="900" y2="410" stroke="var(--line)" stroke-width="2"/>

  <rect x="120" y="290" width="130" height="120" fill="var(--grey)"/>
  <rect x="120" y="150" width="130" height="140" fill="var(--accent)"/>
  <text class="g" x="185" y="442" text-anchor="middle">名目公債</text>
  <text class="b" x="185" y="468" text-anchor="middle">借錢給政府十年</text>

  <text class="o" x="330" y="330" text-anchor="middle">−</text>

  <rect x="400" y="290" width="130" height="120" fill="var(--grey)"/>
  <text class="g" x="465" y="442" text-anchor="middle">抗通膨公債</text>
  <text class="b" x="465" y="468" text-anchor="middle">通膨已經補好了</text>

  <text class="o" x="610" y="330" text-anchor="middle">＝</text>

  <rect x="690" y="270" width="130" height="140" fill="var(--accent)"/>
  <text class="g" x="755" y="442" text-anchor="middle">損益兩平通膨率</text>
  <text class="b" x="755" y="468" text-anchor="middle">234 個基點</text>

  <line x1="250" y1="150" x2="690" y2="150" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="250" y1="290" x2="400" y2="290" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="530" y1="290" x2="690" y2="290" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 5"/>

  <text class="c" x="60" y="512">這個差額四年來卡在 234，幾乎沒動</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊六個灰色方塊、右邊三個高亮方塊的兩堆對比，右堆下方標示沒人逼你做">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.a{font-size:16px;fill:var(--accent);font-weight:700}
.n{font-size:15px;fill:var(--grey)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56">研究是什麼時候開始做的</text>
<line x1="480" y1="100" x2="480" y2="400" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

<text class="g" x="100" y="150">上市前</text>
<rect x="100" y="180" width="66" height="66" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="180" width="66" height="66" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="260" y="180" width="66" height="66" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="260" width="66" height="66" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="260" width="66" height="66" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="260" y="260" width="66" height="66" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="100" y="368">有人逼你做</text>

<text class="g" x="560" y="150">上市後</text>
<rect x="560" y="180" width="66" height="66" rx="8" fill="var(--accent)"/>
<rect x="640" y="180" width="66" height="66" rx="8" fill="var(--accent)"/>
<rect x="720" y="180" width="66" height="66" rx="8" fill="var(--accent)"/>
<text class="a" x="560" y="368">沒人逼你做</text>

<text class="c" x="480" y="446" text-anchor="middle">右邊那幾份，是時間視野的訊號</text>
<text class="n" x="900" y="490" text-anchor="end">方塊數量為示意</text>
</svg>
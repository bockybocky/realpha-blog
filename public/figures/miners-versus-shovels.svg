<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上排的點從歸零散到大贏、分布極寬，下排的點聚成一小團，兩種報酬分布形狀不同">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="72" font-size="27" font-weight="700" fill="var(--ink)">同一場淘金熱，兩種形狀</text>

  <text class="t" x="60" y="180" font-size="20" font-weight="700" fill="var(--ink)">礦工</text>
  <line x1="180" y1="230" x2="880" y2="230" stroke="var(--line)" stroke-width="2"/>
  <circle cx="188" cy="230" r="9" fill="var(--warn)"/>
  <circle cx="206" cy="212" r="9" fill="var(--warn)"/>
  <circle cx="196" cy="250" r="9" fill="var(--warn)"/>
  <circle cx="252" cy="228" r="9" fill="var(--grey)"/>
  <circle cx="318" cy="248" r="9" fill="var(--grey)"/>
  <circle cx="392" cy="212" r="9" fill="var(--grey)"/>
  <circle cx="470" cy="234" r="9" fill="var(--grey)"/>
  <circle cx="556" cy="216" r="9" fill="var(--grey)"/>
  <circle cx="648" cy="246" r="9" fill="var(--grey)"/>
  <circle cx="742" cy="222" r="9" fill="var(--accent)"/>
  <circle cx="852" cy="238" r="9" fill="var(--accent)"/>
  <text class="t" x="180" y="290" font-size="16" fill="var(--warn)">歸零</text>
  <text class="t" x="880" y="290" font-size="16" fill="var(--dim)" text-anchor="end">大贏</text>

  <text class="t" x="60" y="380" font-size="20" font-weight="700" fill="var(--ink)">賣鏟子的人</text>
  <line x1="180" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
  <circle cx="524" cy="430" r="9" fill="var(--accent)"/>
  <circle cx="548" cy="412" r="9" fill="var(--accent)"/>
  <circle cx="552" cy="448" r="9" fill="var(--accent)"/>
  <circle cx="580" cy="426" r="9" fill="var(--accent)"/>
  <circle cx="604" cy="444" r="9" fill="var(--accent)"/>
  <circle cx="608" cy="410" r="9" fill="var(--accent)"/>
  <circle cx="636" cy="430" r="9" fill="var(--accent)"/>
  <text class="t" x="180" y="490" font-size="16" fill="var(--dim)">歸零</text>
  <text class="t" x="880" y="490" font-size="16" fill="var(--dim)" text-anchor="end">大贏</text>

  <text class="t" x="60" y="538" font-size="22" font-weight="700" fill="var(--ink)">趨勢是真的，贏家是另一題</text>
</svg>
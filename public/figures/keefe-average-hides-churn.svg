<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="兩根等高堆疊長條：總高度幾乎不變，內部三個職位消失、併進 NC 操作員">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .c { font-size:22px; font-weight:700; }
    .d { fill:var(--dim); }
    .a { fill:var(--accent); }
    .w { fill:var(--page); }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="480" y="56" text-anchor="middle" class="t">平均只降 1%，底下翻了一輪</text>
<line x1="180" y1="140" x2="770" y2="140" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="775" y="150" class="b d">平均 −1%</text>
<polygon points="380,240 580,243 580,460 380,460" fill="var(--accent)" opacity="0.12"/>
<rect x="200" y="140" width="180" height="100" fill="var(--card)" stroke="var(--line)"/>
<rect x="200" y="240" width="180" height="70" fill="var(--grey)" stroke="var(--page)" stroke-width="2"/>
<rect x="200" y="310" width="180" height="80" fill="var(--grey)" stroke="var(--page)" stroke-width="2"/>
<rect x="200" y="390" width="180" height="70" fill="var(--grey)" stroke="var(--page)" stroke-width="2"/>
<text x="290" y="196" text-anchor="middle" class="b">機工</text>
<text x="290" y="281" text-anchor="middle" class="b">設定工</text>
<text x="290" y="356" text-anchor="middle" class="b">半熟練操作員</text>
<text x="290" y="431" text-anchor="middle" class="b">粗工</text>
<rect x="580" y="143" width="180" height="100" fill="var(--card)" stroke="var(--line)"/>
<rect x="580" y="243" width="180" height="217" fill="var(--accent)"/>
<text x="670" y="199" text-anchor="middle" class="b">機工</text>
<text x="670" y="358" text-anchor="middle" class="g w">NC 操作員</text>
<text x="480" y="360" text-anchor="middle" class="g a">任務搬家</text>
<text x="290" y="495" text-anchor="middle" class="g">三十年前</text>
<text x="670" y="495" text-anchor="middle" class="g">三十年後</text>
<text x="480" y="530" text-anchor="middle" class="b d">示意：區塊高度不代表實際人數比例</text>
<text x="480" y="575" text-anchor="middle" class="c">總數持平，裡面換了人</text>
</svg>
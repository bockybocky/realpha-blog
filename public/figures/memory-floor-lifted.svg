<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左矮右高的兩根柱子，右柱約為左柱七倍高，表示記憶體產業的高點區間整段被搬高">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">地板被抬高的是整段區間</text>

<rect x="60" y="110" width="840" height="300" rx="14" fill="var(--card)"/>
<line x1="100" y1="410" x2="880" y2="410" stroke="var(--line)" stroke-width="2"/>

<rect x="190" y="370" width="150" height="40" rx="4" fill="var(--grey)"/>
<text x="265" y="352" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">舊循環</text>
<text x="265" y="445" font-size="16" fill="var(--dim)" text-anchor="middle">高點</text>
<text x="265" y="468" font-size="16" fill="var(--dim)" text-anchor="middle">約一千億美元</text>

<rect x="610" y="150" width="150" height="260" rx="4" fill="var(--accent)"/>
<text x="685" y="132" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">這一輪</text>
<text x="685" y="445" font-size="16" fill="var(--dim)" text-anchor="middle">高點</text>
<text x="685" y="468" font-size="16" fill="var(--dim)" text-anchor="middle">六千到八千億美元</text>

<line x1="340" y1="370" x2="610" y2="370" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="470" y1="370" x2="470" y2="160" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="490" y="265" font-size="19" font-weight="700" fill="var(--accent)">約七倍</text>

<text x="60" y="498" font-size="22" font-weight="700" fill="var(--ink)">差別在平均售價的地板落在哪</text>
</svg>
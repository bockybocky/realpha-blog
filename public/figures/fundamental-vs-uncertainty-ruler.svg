<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條橫柱切成兩段，左段基本面接到追蹤財報對答案，右段不確定性接到調部位大小">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); font-weight:700; }
    .gl { font-size:19px; fill:var(--ink); font-weight:700; }
    .bd { font-size:16px; fill:var(--dim); }
    .bs { font-size:15px; fill:var(--dim); }
    .cc { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ti" x="48" y="58">同一段跌幅，先拆成兩塊</text>
<rect x="100" y="160" width="360" height="110" fill="var(--grey)"/>
<rect x="460" y="160" width="260" height="110" fill="var(--accent)"/>
<text class="bd" x="280" y="146" text-anchor="middle">基本面　獲利被下修</text>
<text class="bd" x="590" y="146" text-anchor="middle">不確定性　十年後長什麼樣</text>
<line x1="280" y1="270" x2="250" y2="336" stroke="var(--line)" stroke-width="2"/>
<line x1="590" y1="270" x2="570" y2="336" stroke="var(--accent)" stroke-width="2"/>
<rect x="100" y="340" width="300" height="90" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="420" y="340" width="300" height="90" rx="10" fill="var(--card)" stroke="var(--accent)"/>
<text class="gl" x="250" y="392" text-anchor="middle">追蹤財報　對答案</text>
<text class="gl" x="570" y="392" text-anchor="middle">調部位大小</text>
<text class="cc" x="48" y="510">混在一起，就會每則新聞都改一次主意</text>
</svg>
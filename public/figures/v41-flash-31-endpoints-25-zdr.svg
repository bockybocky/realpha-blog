<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三十一個方塊中二十五個是零保留，六個灰色未列入，DeepSeek 官方屬於灰色那組">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="80" y="76" font-size="27" font-weight="700" fill="var(--ink)">同一個模型，三十一個端點</text>

<g fill="var(--accent)">
<rect x="100" y="130" width="72" height="56"/><rect x="190" y="130" width="72" height="56"/>
<rect x="280" y="130" width="72" height="56"/><rect x="370" y="130" width="72" height="56"/>
<rect x="460" y="130" width="72" height="56"/><rect x="550" y="130" width="72" height="56"/>
<rect x="640" y="130" width="72" height="56"/><rect x="730" y="130" width="72" height="56"/>
<rect x="100" y="204" width="72" height="56"/><rect x="190" y="204" width="72" height="56"/>
<rect x="280" y="204" width="72" height="56"/><rect x="370" y="204" width="72" height="56"/>
<rect x="460" y="204" width="72" height="56"/><rect x="550" y="204" width="72" height="56"/>
<rect x="640" y="204" width="72" height="56"/><rect x="730" y="204" width="72" height="56"/>
<rect x="100" y="278" width="72" height="56"/><rect x="190" y="278" width="72" height="56"/>
<rect x="280" y="278" width="72" height="56"/><rect x="370" y="278" width="72" height="56"/>
<rect x="460" y="278" width="72" height="56"/><rect x="550" y="278" width="72" height="56"/>
<rect x="640" y="278" width="72" height="56"/><rect x="730" y="278" width="72" height="56"/>
<rect x="100" y="352" width="72" height="56"/>
</g>
<text x="830" y="166" font-size="19" fill="var(--accent)">25 零保留</text>

<g fill="var(--grey)">
<rect x="280" y="352" width="72" height="56"/><rect x="370" y="352" width="72" height="56"/>
<rect x="460" y="352" width="72" height="56"/><rect x="550" y="352" width="72" height="56"/>
<rect x="640" y="352" width="72" height="56"/>
</g>
<rect x="190" y="352" width="72" height="56" fill="var(--grey)" stroke="var(--warn)" stroke-width="3"/>
<text x="830" y="386" font-size="19" fill="var(--dim)">6 未列入</text>

<line x1="226" y1="420" x2="226" y2="452" stroke="var(--warn)" stroke-width="2"/>
<text x="226" y="476" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">DeepSeek 官方</text>

<text x="80" y="516" font-size="22" font-weight="700" fill="var(--ink)">挑哪一家送出去，比挑哪個模型重要</text>
</svg>
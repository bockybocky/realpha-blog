<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Ten blocks stand for final energy demand: only two are electricity and eight are fuel burned directly, with an arrow moving blocks from the fuel side to the electric side one at a time.">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">US final energy demand: only 2 of 10 blocks are electric</text>

  <rect x="60" y="140" width="164" height="150" rx="8" fill="var(--accent)"/>
  <rect x="236" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="304" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="372" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="440" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="508" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="576" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="644" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>
  <rect x="712" y="140" width="56" height="150" rx="6" fill="var(--grey)"/>

  <text x="142" y="222" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">Electric</text>
  <text x="142" y="252" font-size="16" fill="var(--page)" text-anchor="middle">20%</text>
  <text x="502" y="222" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Fuel burned directly</text>
  <text x="502" y="252" font-size="16" fill="var(--ink)" text-anchor="middle">80%</text>

  <g font-size="15" fill="var(--dim)" text-anchor="middle">
    <text x="264" y="320">Passenger travel</text>
    <text x="400" y="320">Heavy freight</text>
    <text x="536" y="320">Heating</text>
    <text x="700" y="320">Precision processes</text>
  </g>

  <line x1="700" y1="372" x2="252" y2="372" stroke="var(--accent)" stroke-width="4"/>
  <path d="M 252 360 L 228 372 L 252 384 Z" fill="var(--accent)"/>
  <text x="700" y="356" font-size="19" fill="var(--accent)" text-anchor="end">Shifting over one block at a time</text>
  <text x="700" y="402" font-size="16" fill="var(--dim)" text-anchor="end">A decades-long trend, underway before AI</text>

  <text x="60" y="470" font-size="22" font-weight="700" fill="var(--ink)">The upside isn't in those 2 blocks — it's in the 8 waiting to move</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A steadily rising frontier line is split into five segments led in turn by A, B, A, B and C, each lasting only a few months.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="56" font-size="27" font-weight="700" fill="var(--ink)">Clear trend; the leader rotates</text>
<line x1="120" y1="130" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="440" x2="860" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="130" y="140" font-size="15" fill="var(--dim)">Frontier</text>
<text x="860" y="466" font-size="15" text-anchor="end" fill="var(--dim)">Time →</text>
<line x1="120" y1="420" x2="260" y2="380" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
<line x1="260" y1="380" x2="400" y2="330" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
<line x1="400" y1="330" x2="540" y2="290" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
<line x1="540" y1="290" x2="680" y2="240" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
<line x1="680" y1="240" x2="820" y2="190" stroke="var(--dim)" stroke-width="6" stroke-linecap="round"/>
<circle cx="190" cy="366" r="17" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="190" y="372" font-size="16" font-weight="700" text-anchor="middle" fill="var(--accent)">A</text>
<circle cx="330" cy="320" r="17" fill="var(--page)" stroke="var(--ink)" stroke-width="3"/>
<text x="330" y="326" font-size="16" font-weight="700" text-anchor="middle" fill="var(--ink)">B</text>
<circle cx="470" cy="276" r="17" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="470" y="282" font-size="16" font-weight="700" text-anchor="middle" fill="var(--accent)">A</text>
<circle cx="610" cy="230" r="17" fill="var(--page)" stroke="var(--ink)" stroke-width="3"/>
<text x="610" y="236" font-size="16" font-weight="700" text-anchor="middle" fill="var(--ink)">B</text>
<circle cx="750" cy="180" r="17" fill="var(--page)" stroke="var(--dim)" stroke-width="3"/>
<text x="750" y="186" font-size="16" font-weight="700" text-anchor="middle" fill="var(--dim)">C</text>
<text x="830" y="160" font-size="16" font-weight="700" text-anchor="end" fill="var(--accent)">Direction: up</text>
<line x1="262" y1="410" x2="398" y2="410" stroke="var(--dim)" stroke-width="2"/>
<line x1="262" y1="402" x2="262" y2="418" stroke="var(--dim)" stroke-width="2"/>
<line x1="398" y1="402" x2="398" y2="418" stroke="var(--dim)" stroke-width="2"/>
<text x="330" y="432" font-size="15" text-anchor="middle" fill="var(--dim)">Months</text>
<text x="480" y="505" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">Bet trend, not leader</text>
</svg>
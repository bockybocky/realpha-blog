<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="市值柱六倍高度差，經濟柱兩倍高度差，兩組落差明顯不同" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">十五年：市值長六倍，經濟長兩倍</text>
<line x1="60" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>
<rect x="170" y="412" width="100" height="48" fill="var(--grey)"/>
<rect x="310" y="160" width="100" height="300" fill="var(--accent)"/>
<text x="220" y="400" font-size="16" fill="var(--dim)" text-anchor="middle">11.9 兆</text>
<text x="360" y="148" font-size="20" fill="var(--accent)" text-anchor="middle">75 兆</text>
<text x="220" y="484" font-size="16" fill="var(--dim)" text-anchor="middle">2011</text>
<text x="360" y="484" font-size="16" fill="var(--dim)" text-anchor="middle">2026</text>
<text x="290" y="516" font-size="19" fill="var(--ink)" text-anchor="middle">美股總市值　六倍</text>
<rect x="560" y="400" width="100" height="60" fill="var(--grey)"/>
<rect x="700" y="332" width="100" height="128" fill="var(--grey)"/>
<text x="610" y="388" font-size="16" fill="var(--dim)" text-anchor="middle">15 兆</text>
<text x="750" y="320" font-size="20" fill="var(--ink)" text-anchor="middle">32 兆</text>
<text x="610" y="484" font-size="16" fill="var(--dim)" text-anchor="middle">2011</text>
<text x="750" y="484" font-size="16" fill="var(--dim)" text-anchor="middle">2026</text>
<text x="680" y="516" font-size="19" fill="var(--ink)" text-anchor="middle">經濟規模　兩倍</text>
<text x="60" y="552" font-size="22" fill="var(--ink)">價格跑在產出前面</text>
</svg>
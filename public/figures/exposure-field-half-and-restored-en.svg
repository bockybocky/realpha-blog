<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three panels sit side by side: a full field printed in one shot, a halved field that needs two shots stitched together, and a full field printed in one shot again after switching to a 12-inch mask.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="480" y="60" text-anchor="middle">Field: halved, then restored</text>
<rect x="105" y="130" width="130" height="165" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
<rect x="117" y="142" width="106" height="141" fill="var(--accent)" fill-opacity="0.35"/>
<text class="g" x="170" y="336" text-anchor="middle">One shot</text>
<text class="g" x="170" y="392" text-anchor="middle">Low NA</text>
<text class="b" x="170" y="418" text-anchor="middle">6-inch mask</text>
<rect x="415" y="130" width="130" height="82" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
<rect x="415" y="213" width="130" height="82" fill="var(--card)" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="427" y="142" width="106" height="141" fill="var(--accent)" fill-opacity="0.35"/>
<line x1="405" y1="212.5" x2="555" y2="212.5" stroke="var(--warn)" stroke-width="4" stroke-dasharray="8 5"/>
<text class="b" x="570" y="218" style="fill:var(--warn)">Stitch</text>
<text class="g" x="480" y="336" text-anchor="middle" style="fill:var(--warn)">Two shots</text>
<text class="g" x="480" y="392" text-anchor="middle">High NA</text>
<text class="b" x="480" y="418" text-anchor="middle">6-inch mask</text>
<rect x="725" y="130" width="130" height="165" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
<rect x="737" y="142" width="106" height="141" fill="var(--accent)" fill-opacity="0.35"/>
<text class="g" x="790" y="336" text-anchor="middle">One shot</text>
<text class="g" x="790" y="392" text-anchor="middle">High NA</text>
<text class="b" x="790" y="418" text-anchor="middle" style="fill:var(--accent);font-weight:700">12-inch mask</text>
<text class="c" x="480" y="492" text-anchor="middle">Bigger mask, full field back</text>
</svg>
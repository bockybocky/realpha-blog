<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two lines from the same point, one climbing, one flattening midway, the gap between them widening.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--ink); }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="h" x="60" y="60">Compute up, revenue gains flat</text>
<line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="140" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
<path d="M120,430 L280,378 L440,320 L600,258 L760,208 L860,178" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M120,430 L280,368 L440,312 L600,296 L760,290 L860,286" fill="none" stroke="var(--grey)" stroke-width="4"/>
<path d="M440,320 L600,258 L760,208 L860,178 L860,286 L760,290 L600,296 L440,312 Z" fill="var(--accent)" opacity="0.14"/>
<text class="g" x="866" y="172">Compute</text>
<text class="g" x="866" y="300">Revenue</text>
<text class="b" x="612" y="252">Gap</text>
<text class="b" x="612" y="232">To research</text>
<text class="b" x="120" y="470">Monthly</text>
<text class="c" x="60" y="524">The extra machines stay</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條粗實線箭頭與一條中途斷掉的細虛線箭頭從同一個人分別指向兩邊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">錢從哪一邊流得穩</text>

  <rect x="380" y="270" width="200" height="90" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="322" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">付費會員</text>

  <rect x="80" y="120" width="220" height="90" rx="6" fill="var(--accent)"/>
  <text class="t" x="190" y="172" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">賣課的那一邊</text>
  <line x1="378" y1="282" x2="236" y2="222" stroke="var(--accent)" stroke-width="10"/>
  <polygon points="214,212 252,216 232,240" fill="var(--accent)"/>
  <text class="t" x="196" y="252" font-size="16" font-weight="700" fill="var(--ink)">3,000 到 4,000 元 ・ 報名就收到</text>

  <rect x="660" y="120" width="220" height="90" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="t" x="770" y="172" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">他自己的收入</text>
  <line x1="584" y1="282" x2="700" y2="233" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 9"/>
  <polygon points="716,226 700,246 696,226" fill="var(--grey)"/>
  <text class="t" x="612" y="256" font-size="16" fill="var(--dim)">用戶三個 ・ 不一定來</text>

  <text class="t" x="480" y="470" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">一條綁報名，一條綁結果</text>
</svg>
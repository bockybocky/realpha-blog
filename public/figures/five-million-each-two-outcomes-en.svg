<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the left two lines diverge as they run, on the right two lines converge and meet, contrasting two outcomes from the same starting capital.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .l { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">After five million each</text>
<text class="s" x="60" y="88">Same starting capital, two endings</text>
<rect x="60" y="116" width="400" height="300" rx="10" fill="var(--card)"/>
<rect x="500" y="116" width="400" height="300" rx="10" fill="var(--card)"/>
<text class="g" x="84" y="150">Superlinear</text>
<text class="g" x="524" y="150">Sublinear</text>
<circle cx="96" cy="372" r="6" fill="var(--dim)"/>
<path d="M96 372 C240 358 340 300 430 182" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M96 372 C240 368 340 352 430 334" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text class="l" x="330" y="172" fill="var(--accent)">Leader</text>
<text class="l" x="344" y="362">Challenger</text>
<text class="l" x="150" y="402">Gap keeps widening</text>
<circle cx="536" cy="372" r="6" fill="var(--dim)"/>
<path d="M536 372 C620 300 700 270 870 262" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M536 372 C650 366 740 310 870 248" fill="none" stroke="var(--grey)" stroke-width="3"/>
<circle cx="800" cy="258" r="9" fill="none" stroke="var(--ink)" stroke-width="2"/>
<text class="l" x="762" y="300">Caught up</text>
<text class="l" x="590" y="402">Same distance costs more</text>
<text class="c" x="60" y="470">Moats are tested when the market stops</text>
</svg>
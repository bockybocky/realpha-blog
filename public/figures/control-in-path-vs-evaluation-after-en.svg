<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A control is a gate standing in the execution path ahead of the event, while evaluation hangs off the end of the path and can only be computed after the fact.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">The difference is where it stands</text>
<path d="M70 280 L 850 280" stroke="var(--line)" stroke-width="10"/>
<polygon points="850,264 896,280 850,296" fill="var(--line)"/>
<text x="70" y="330" font-size="16" fill="var(--dim)">Execution path</text>
<rect x="356" y="184" width="22" height="192" fill="var(--accent)"/>
<text x="367" y="164" font-size="20" fill="var(--ink)" text-anchor="middle">Control</text>
<text x="367" y="408" font-size="16" fill="var(--accent)" text-anchor="middle">Right in the path</text>
<text x="367" y="434" font-size="16" fill="var(--dim)" text-anchor="middle">In the moment</text>
<circle cx="530" cy="280" r="14" fill="var(--warn)"/>
<text x="530" y="246" font-size="16" fill="var(--warn)" text-anchor="middle">Event</text>
<rect x="690" y="364" width="210" height="84" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="795" y="398" font-size="20" fill="var(--dim)" text-anchor="middle">Evaluation</text>
<text x="795" y="426" font-size="16" fill="var(--dim)" text-anchor="middle">Off-path, after</text>
<path d="M740 364 L 700 296" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M530 300 L 530 400 L 686 400" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6" fill="none"/>
<text x="596" y="392" font-size="15" fill="var(--dim)">Already past</text>
</g>
</svg>
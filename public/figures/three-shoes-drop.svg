<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條往下走的時間線：維也納先崩，接著四個多月完全沒事讓所有人以為是個案，然後紐約才倒，最後是埃及與土耳其違約">
  <style>
    svg {
      --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#9aa5b5; --accent:#1f6feb; --warn:#d97706; --warnbg:#fdf4e7;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#6b7686; --accent:#58a6ff; --warn:#d29922; --warnbg:#2b2411;
      }
    }
    .t    { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1   { font-size:27px; font-weight:700; fill:var(--ink); }
    .ev   { font-size:17px; font-weight:700; fill:var(--ink); }
    .sub  { font-size:15px; fill:var(--dim); }
    .calm { font-size:18px; font-weight:700; fill:var(--warn); }
    .ax   { font-size:15.5px; fill:var(--dim); }
    .kick { font-size:21px; font-weight:700; fill:var(--ink); }
  </style>

  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <g class="t">
    <text x="480" y="44" class="h1" text-anchor="middle">崩盤分三次到，中間放了一次假警報</text>

    <rect x="290" y="86" width="200" height="290" fill="var(--warnbg)"/>

    <path d="M110,140 L270,236 L480,248 L640,344 L870,406"
          fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

    <circle cx="270" cy="236" r="9" fill="var(--warn)"/>
    <circle cx="640" cy="344" r="9" fill="var(--warn)"/>
    <circle cx="870" cy="406" r="9" fill="var(--warn)"/>

    <text x="180" y="128" class="ev">五月</text>
    <text x="180" y="152" class="ev">維也納</text>
    <text x="180" y="180" class="sub">主要股票單日腰斬</text>

    <text x="390" y="196" class="calm" text-anchor="middle">四個多月</text>
    <text x="390" y="222" class="calm" text-anchor="middle">什麼都沒發生</text>
    <text x="390" y="300" class="sub" text-anchor="middle">於是共識轉向：</text>
    <text x="390" y="324" class="sub" text-anchor="middle">「這是個案，</text>
    <text x="390" y="348" class="sub" text-anchor="middle">維也納自己太貴。」</text>

    <text x="560" y="392" class="ev">九月　紐約</text>
    <text x="560" y="416" class="sub">最有人脈的投資銀行家籌不到錢</text>
    <text x="560" y="440" class="sub">年底三分之一鐵路停付利息，五年內一半</text>

    <text x="880" y="380" class="ev" text-anchor="end">埃及、土耳其違約</text>

    <line x1="90" y1="470" x2="900" y2="470" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="90" y="494" class="ax">時間</text>

    <text x="480" y="530" class="kick" text-anchor="middle">傳染不是靠情緒傳的，是靠資產負債表傳的。</text>
    <text x="480" y="556" class="sub" text-anchor="middle">那條線在第一天就存在了，只是要花幾個月才走完——而市場把「還沒發生」讀成「不會發生」。</text>
  </g>
</svg>

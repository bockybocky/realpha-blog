<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條從零線附近高高拱起再落回零線的曲線，像一個來了又走的山丘">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px}
    .b{font-size:15px;fill:var(--dim)}
    .c{font-size:22px}
  </style>
  <text class="t" x="40" y="58">一百萬張合約來了又走</text>
  <line x1="150" y1="400" x2="860" y2="400" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="150" y="422">零</text>
  <path d="M170 395 C 300 390, 340 182, 450 174 C 560 166, 620 380, 790 393" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="450" cy="174" r="6" fill="var(--accent)"/>
  <text class="g" x="450" y="152" text-anchor="middle">100 萬張</text>
  <text class="b" x="178" y="372">接近零</text>
  <text class="b" x="782" y="372" text-anchor="end">幾乎回到零</text>
  <text class="b" x="290" y="246">黑海風險＋多地熱浪</text>
  <text class="b" x="170" y="448">七月前</text>
  <text class="b" x="450" y="448" text-anchor="middle">七、八月</text>
  <text class="b" x="790" y="448" text-anchor="end">現在</text>
  <text class="c" x="40" y="492">六個黃豆與穀物合約，一圈走完</text>
</svg>
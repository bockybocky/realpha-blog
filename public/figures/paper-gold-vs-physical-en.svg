<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two lines leave the same point, one climbing and one flat, opening an ever-widening gap.">
<style>svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Paper gold leaves metal</text>
<polygon points="160,360 830,166 830,334" fill="var(--card)"/>
<line x1="160" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<text x="160" y="432" font-size="16" fill="var(--dim)">Pre</text>
<text x="880" y="432" font-size="16" fill="var(--dim)" text-anchor="end">Now</text>
<path d="M160 360 C 420 318, 640 236, 830 166" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M160 360 C 420 352, 640 342, 830 334" fill="none" stroke="var(--grey)" stroke-width="4"/>
<circle cx="160" cy="360" r="6" fill="var(--ink)"/>
<text x="834" y="150" font-size="20" fill="var(--accent)">Paper</text>
<text x="834" y="174" font-size="16" fill="var(--dim)">ETFs pile up</text>
<text x="834" y="330" font-size="20" fill="var(--dim)">Metal</text>
<text x="834" y="354" font-size="16" fill="var(--dim)">Tight</text>
<text x="560" y="276" font-size="19" fill="var(--dim)" text-anchor="middle">Widening</text>
<text x="60" y="516" font-size="22" fill="var(--ink)">Metal there, paper piles up</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四條橫條，前三條短、最後一條最長，完成線對齊最長那條的末端">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<text x="60" y="72" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="27" fill="var(--ink)">最長的那一項決定完工</text>

<line x1="240" y1="130" x2="240" y2="430" stroke="var(--line)"/>
<line x1="860" y1="130" x2="860" y2="460" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="860" y="486" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--warn)">真正能開機的那天</text>

<text x="60" y="186" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--dim)">GPU</text>
<rect x="240" y="164" width="150" height="30" rx="6" fill="var(--accent)" opacity="0.5"/>
<text x="406" y="186" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">到了，躺著</text>

<text x="60" y="246" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--dim)">機櫃</text>
<rect x="240" y="224" width="200" height="30" rx="6" fill="var(--accent)" opacity="0.5"/>

<text x="60" y="306" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--dim)">變電站</text>
<rect x="240" y="284" width="280" height="30" rx="6" fill="var(--accent)" opacity="0.5"/>

<text x="60" y="366" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--warn)">電力到位</text>
<rect x="240" y="344" width="620" height="30" rx="6" fill="var(--warn)"/>

<text x="240" y="420" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">開工</text>

<text x="60" y="520" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="22" fill="var(--ink)">做得快的先做完，然後一起等最慢的</text>
</svg>
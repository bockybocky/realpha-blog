<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊材料路線被管制柵欄攔住，右邊路線沒有柵欄直通">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="52" font-size="27" font-weight="700" fill="var(--ink)">被卡住的是材料，不是整條路</text>

<rect x="110" y="110" width="300" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="260" y="149" font-size="20" fill="var(--ink)" text-anchor="middle">磷化銦（含銦）</text>
<line x1="260" y1="172" x2="260" y2="300" stroke="var(--warn)" stroke-width="6"/>
<rect x="150" y="286" width="220" height="14" rx="4" fill="var(--warn)"/>
<line x1="238" y1="268" x2="282" y2="318" stroke="var(--warn)" stroke-width="6"/>
<line x1="282" y1="268" x2="238" y2="318" stroke="var(--warn)" stroke-width="6"/>
<text x="260" y="346" font-size="18" fill="var(--warn)" text-anchor="middle">管制清單</text>
<line x1="260" y1="360" x2="260" y2="420" stroke="var(--warn)" stroke-width="6" stroke-dasharray="8 8"/>
<rect x="110" y="420" width="300" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="260" y="459" font-size="20" fill="var(--ink)" text-anchor="middle">邊射型　1310 奈米</text>

<rect x="550" y="110" width="300" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="700" y="149" font-size="20" fill="var(--ink)" text-anchor="middle">砷化鎵＋鋁</text>
<line x1="700" y1="172" x2="700" y2="420" stroke="var(--accent)" stroke-width="6"/>
<path d="M688 408 L700 432 L712 408 Z" fill="var(--accent)"/>
<text x="722" y="300" font-size="18" fill="var(--accent)">不在清單上</text>
<rect x="550" y="420" width="300" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="700" y="459" font-size="20" fill="var(--accent)" text-anchor="middle">面射型　1060 奈米</text>

<text x="110" y="530" font-size="22" font-weight="700" fill="var(--ink)">下游會去找不吃那個材料的路</text>
</svg>
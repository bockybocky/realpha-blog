<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A short bar on the left is Amazon's twelve years of company-wide capex, about $29.7 billion; the bar on the right, about nine times taller, is Microsoft's over $260 billion in one year">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.g { font-size:19px; font-weight:700; }
.b { font-size:16px; fill:var(--dim); }
.v { font-size:22px; font-weight:700; }
.c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="70" y="62">What the last success cost</text>
<line x1="100" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="410" width="200" height="40" fill="var(--accent)"/>
<text class="v" x="180" y="394" fill="var(--accent)">$29.7B</text>
<text class="g" x="180" y="486">Amazon 2003–2015</text>
<text class="b" x="180" y="514">Whole firm, 12 yrs (inflation adj.)</text>
<rect x="580" y="100" width="200" height="350" fill="var(--grey)"/>
<text class="v" x="580" y="84">Over $260B</text>
<text class="g" x="580" y="486">Microsoft</text>
<text class="b" x="580" y="514">One firm, one yr</text>
<text class="c" x="70" y="565">12 yrs of Amazon ≈ 1/9 of one year now</text>
</svg>
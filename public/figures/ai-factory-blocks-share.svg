<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一座 AI 工廠被拆成橫排五塊，最大的運算那塊變成灰色代表客戶自己做，互連、儲存、網通機櫃仍是原供應商，末端的記憶體用虛線標示尚未驗證">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.w{font-size:16px;fill:var(--page)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">一座 AI 工廠，運算只是其中一塊</text>
<rect x="60" y="120" width="840" height="230" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="80" y="152">一座 AI 工廠</text>
<rect x="90" y="180" width="240" height="120" rx="10" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="g" x="210" y="235" text-anchor="middle" fill="var(--dim)">運算</text>
<text class="b" x="210" y="264" text-anchor="middle">客戶自己做</text>
<rect x="342" y="180" width="140" height="120" rx="10" fill="var(--accent)"/>
<text class="w" x="412" y="246" text-anchor="middle">互連</text>
<rect x="494" y="180" width="130" height="120" rx="10" fill="var(--accent)"/>
<text class="w" x="559" y="246" text-anchor="middle">儲存</text>
<rect x="636" y="180" width="150" height="120" rx="10" fill="var(--accent)"/>
<text class="w" x="711" y="246" text-anchor="middle">網通機櫃</text>
<rect x="798" y="180" width="72" height="120" rx="10" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
<text class="b" x="834" y="246" text-anchor="middle" fill="var(--warn)">記憶體</text>
<rect x="60" y="386" width="18" height="18" rx="4" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 5"/>
<text class="b" x="90" y="401">被客戶拿走的那一塊</text>
<rect x="60" y="420" width="18" height="18" rx="4" fill="var(--accent)"/>
<text class="b" x="90" y="435">還是同一個供應商</text>
<rect x="440" y="420" width="18" height="18" rx="4" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="6 5"/>
<text class="b" x="470" y="435">自家規格，還沒驗證</text>
<text class="c" x="60" y="494">你要自己做那一塊，周圍還是我的</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩條時間軸對比，上排幾乎全是空格，下排全部填滿並有一段被框起">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">同樣叫「長約」，綁的東西不同</text>
<text x="60" y="126" font-size="20" font-weight="700" fill="var(--ink)">以前</text>
<text x="130" y="126" font-size="16" fill="var(--dim)">只給採購能見度</text>
<rect x="60" y="150" width="96" height="54" rx="6" fill="var(--accent)"/>
<text x="108" y="184" font-size="15" text-anchor="middle" fill="var(--page)">NCNR</text>

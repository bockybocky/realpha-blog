<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two pairs of bars in which image quality and whether you keep it are exactly inverted between the two">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:20px; font-weight:700; fill:var(--ink); }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="480" y="60" text-anchor="middle">Two pictures, heights inverted</text>

<rect x="240" y="98" width="22" height="22" rx="4" fill="var(--grey)"/>
<text class="b" x="272" y="116">Image quality</text>
<rect x="440" y="98" width="22" height="22" rx="4" fill="var(--accent)"/>
<text class="b" x="472" y="116">Would you keep it</text>

<line x1="130" y1="432" x2="830" y2="432" stroke="var(--line)" stroke-width="3"/>

<rect x="240" y="212" width="70" height="220" rx="5" fill="var(--grey)"/>
<rect x="340" y="372" width="70" height="60" rx="5" fill="var(--accent)"/>
<text class="b" x="275" y="198" text-anchor="middle">High</text>
<text class="b" x="375" y="358" text-anchor="middle">Almost zero</text>
<text class="g" x="325" y="474" text-anchor="middle" fill="var(--dim)">Downloaded masterpiece</text>

<rect x="560" y="372" width="70" height="60" rx="5" fill="var(--grey)"/>
<rect x="660" y="192" width="70" height="240" rx="5" fill="var(--accent)"/>
<text class="b" x="595" y="358" text-anchor="middle">Low</text>
<text class="b" x="695" y="178" text-anchor="middle">Kept for life</text>
<text class="g" x="645" y="474" text-anchor="middle">A child's crayon drawing</text>

<text class="c" x="480" y="524" text-anchor="middle">Value comes from who made it, not how well</text>
</svg>
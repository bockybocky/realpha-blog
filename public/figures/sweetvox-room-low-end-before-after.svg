<text class="g" x="210" y="480" text-anchor="middle">63 Hz</text>
<rect x="348" y="361" width="58" height="69" fill="var(--warn)" rx="3"/>
<text class="v" x="377" y="353" text-anchor="middle">+2.3</text>
<rect x="414" y="373" width="58" height="57" fill="var(--accent)" rx="3"/>
<text class="v" x="443" y="365" text-anchor="middle">+1.9</text>
<text class="g" x="410" y="480" text-anchor="middle">80 Hz</text>

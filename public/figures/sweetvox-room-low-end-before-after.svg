<text class="g" x="610" y="480" text-anchor="middle">125 Hz</text>
<rect x="748" y="367" width="58" height="63" fill="var(--warn)" rx="3"/>
<text class="v" x="777" y="359" text-anchor="middle">+2.1</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="四組長條比較修正前後。63 赫茲從多 9 分貝降到幾乎是零，125 赫茲從 6.3 降到 1.3，80 與 200 赫茲本來就不高、變化不大。">
<style>svg{--page:#ffffff;--line:#dde3ee;--ink:#1a212b;--dim:#57616f;--grey:#b9c2d0;--accent:#1f6feb;--warn:#d97706;}@media (prefers-color-scheme: dark){svg{--page:#0d1117;--line:#272e39;--ink:#e6edf3;--dim:#8b949e;--grey:#4a5464;--accent:#58a6ff;--warn:#d29922;}}text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}.t{font-size:26px;font-weight:700;fill:var(--ink);}.g{font-size:19px;fill:var(--ink);}.n{font-size:16px;fill:var(--dim);}.v{font-size:17px;font-weight:700;fill:var(--ink);}</style>
<rect width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56">低頻修正前後：比平坦多出幾 dB</text>

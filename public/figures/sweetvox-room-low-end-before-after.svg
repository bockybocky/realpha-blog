<rect x="740" y="80" width="18" height="18" fill="var(--accent)"/><text class="g" x="766" y="96">修正後</text>
<line x1="90" y1="430" x2="910" y2="430" stroke="var(--line)" stroke-width="2"/><text class="n" x="90" y="452">0 dB＝平坦</text>

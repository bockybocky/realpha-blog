<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根柱子，右邊 3% 以上的柱子高出左邊 0 到 1% 數倍">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">為什麼它變成政治題</text>
<line x1="150" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="250" y="370" width="150" height="60" fill="var(--grey)"/>
<rect x="560" y="190" width="150" height="240" fill="var(--accent)"/>
<text x="325" y="352" font-size="20" fill="var(--ink)" text-anchor="middle">0 到 1%</text>
<text x="635" y="172" font-size="20" fill="var(--ink)" text-anchor="middle">3% 以上</text>
<text x="325" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">少了人工智慧</text>
<text x="635" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">有人工智慧</text>
<text x="60" y="504" font-size="22" fill="var(--ink)">整年的成長都壓在這一段差距上</text>
</svg>
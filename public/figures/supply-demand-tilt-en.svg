<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The balance tips towards the supply side, every buyer on the demand side is crossed out, and the yield arrow points up.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="48" y="62">More sellers, no buyers</text>
<line x1="420" y1="300" x2="420" y2="440" stroke="var(--dim)" stroke-width="6"/>
<path d="M370 452 L470 452 L452 440 L388 440 z" fill="var(--dim)"/>
<line x1="150" y1="330" x2="690" y2="250" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
<line x1="170" y1="327" x2="170" y2="360" stroke="var(--dim)" stroke-width="3"/>
<line x1="670" y1="253" x2="670" y2="286" stroke="var(--dim)" stroke-width="3"/>
<rect x="60" y="360" width="226" height="130" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="396">Supply</text>
<rect x="84" y="412" width="178" height="26" rx="3" fill="var(--warn)"/>
<text class="b" x="92" y="432" fill="var(--page)">New government debt</text>
<rect x="84" y="446" width="92" height="26" rx="3" fill="var(--warn)"/>
<text class="b" x="92" y="466" fill="var(--page)">Corporate issuance</text>
<rect x="556" y="286" width="226" height="130" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="580" y="322">Demand</text>
<text class="b" x="580" y="352">Central banks</text>
<line x1="576" y1="346" x2="648" y2="346" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="580" y="380">Large European banks</text>
<line x1="576" y1="374" x2="700" y2="374" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="580" y="408">Commercial banks</text>
<line x1="576" y1="402" x2="664" y2="402" stroke="var(--warn)" stroke-width="3"/>
<path d="M862 420 L862 250" stroke="var(--accent)" stroke-width="6"/>
<path d="M862 240 l-13 20 l26 0 z" fill="var(--accent)"/>
<text class="g" x="818" y="212" fill="var(--accent)">Yields</text>
<text class="c" x="48" y="524">Prices stay high because nobody stands on that side</text>
</svg>
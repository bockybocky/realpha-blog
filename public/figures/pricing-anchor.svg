<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根高度差極大的柱子，一根很高標成真人家教與課堂，一根貼著地面標成訂閱月費">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; }
    .ag { font-size:20px; font-weight:700; fill:var(--accent); }
</style>
<text class="t" x="60" y="62">價格錨在哪裡</text>
<line x1="120" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="250" y="120" width="150" height="280" fill="var(--accent)"/>
<rect x="590" y="388" width="150" height="12" fill="var(--grey)"/>
<text class="ag" x="325" y="104" text-anchor="middle">一年數千美元</text>
<text class="g" x="665" y="372" text-anchor="middle">每月十美元</text>
<text class="b" x="325" y="432" text-anchor="middle">真人家教與課堂</text>
<text class="b" x="665" y="432" text-anchor="middle">訂閱月費的慣例</text>
<text class="c" x="60" y="492">錨在使用者看見的成果，不是錨在月費慣例</text>
</svg>
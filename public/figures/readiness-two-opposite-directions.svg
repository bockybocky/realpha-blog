<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩個倉庫並列，左邊存量低而箭頭向外流出，右邊存量高而箭頭向內累積">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">同一個「戰備」，兩個相反方向</text>
<rect x="70" y="96" width="380" height="290" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="510" y="96" width="380" height="290" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="260" y="138" text-anchor="middle" font-size="20" fill="var(--ink)">反恐年代</text>
<text x="260" y="166" text-anchor="middle" font-size="16" fill="var(--dim)">現在就派得出去</text>
<rect x="160" y="200" width="110" height="130" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="163" y="292" width="104" height="35" fill="var(--grey)"/>
<text x="215" y="356" text-anchor="middle" font-size="15" fill="var(--dim)">存量低</text>
<line x1="285" y1="250" x2="390" y2="250" stroke="var(--accent)" stroke-width="2.5"/>
<polygon points="400,250 388,243 388,257" fill="var(--accent)"/>
<text x="340" y="234" text-anchor="middle" font-size="16" fill="var(--accent)">一直派出去</text>
<text x="700" y="138" text-anchor="middle" font-size="20" fill="var(--ink)">大國對手</text>
<text x="700" y="166" text-anchor="middle" font-size="16" fill="var(--dim)">存起來、壓訓練強度</text>
<rect x="690" y="200" width="110" height="130" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<rect x="693" y="218" width="104" height="109" fill="var(--accent)" opacity="0.35"/>
<text x="745" y="356" text-anchor="middle" font-size="15" fill="var(--dim)">存量高</text>
<line x1="570" y1="250" x2="675" y2="250" stroke="var(--accent)" stroke-width="2.5"/>
<polygon points="685,250 673,243 673,257" fill="var(--accent)"/>
<text x="620" y="234" text-anchor="middle" font-size="16" fill="var(--accent)">留給以後</text>
<text x="480" y="450" text-anchor="middle" font-size="22" fill="var(--ink)">受詞不同，同一個詞指的是相反的事</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Four job blocks stacked above the car on the left, only one block above the car on the right">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:600;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:600;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="66">How many jobs one car has to do</text>
<text class="g" x="260" y="122" text-anchor="middle">Taiwan: the only car</text>
<rect x="135" y="150" width="250" height="42" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="260" y="177" text-anchor="middle">Business meetings</text>
<rect x="135" y="200" width="250" height="42" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="260" y="227" text-anchor="middle">Carry grandparents</text>
<rect x="135" y="250" width="250" height="42" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="260" y="277" text-anchor="middle">School run</text>
<rect x="135" y="300" width="250" height="42" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="260" y="327" text-anchor="middle">Commuting</text>
<g transform="translate(137,360)">
<path d="M0,58 L14,30 L60,10 L150,10 L192,32 L232,38 L246,54 L246,72 L0,72 Z" fill="none" stroke="var(--grey)" stroke-width="2.5"/>
<circle cx="58" cy="72" r="17" fill="var(--page)" stroke="var(--grey)" stroke-width="2.5"/>
<circle cx="192" cy="72" r="17" fill="var(--page)" stroke="var(--grey)" stroke-width="2.5"/>
</g>
<line x1="120" y1="452" x2="400" y2="452" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="700" y="122" text-anchor="middle">Europe: the extra car</text>
<rect x="575" y="300" width="250" height="42" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="700" y="327" text-anchor="middle">Short commute</text>
<g transform="translate(577,360)">
<path d="M0,58 L14,30 L60,10 L150,10 L192,32 L232,38 L246,54 L246,72 L0,72 Z" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="58" cy="72" r="17" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="192" cy="72" r="17" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5"/>
</g>
<line x1="560" y1="452" x2="840" y2="452" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="480" y="540" text-anchor="middle">Pile every job on one car and you pick the safest</text>
</svg>
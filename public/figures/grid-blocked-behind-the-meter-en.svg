<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the left, the grid's line to the data center is blocked by a veto; on the right, the data center and three kinds of its own generation share one fence, and the grid stays outside, unconnected.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">Grid stuck in votes, so self-generate</text>
<rect x="40" y="90" width="420" height="330" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="62" y="126" font-size="20" fill="var(--dim)">Grid hookup</text>
<polyline points="95,330 110,210 125,330" fill="none" stroke="var(--dim)" stroke-width="2.5"/>
<line x1="92" y1="225" x2="128" y2="225" stroke="var(--dim)" stroke-width="2.5"/>
<line x1="102" y1="255" x2="118" y2="255" stroke="var(--dim)" stroke-width="2.5"/>
<line x1="99" y1="290" x2="121" y2="290" stroke="var(--dim)" stroke-width="2.5"/>
<text x="110" y="362" text-anchor="middle" font-size="16" fill="var(--ink)">Grid</text>
<line x1="135" y1="270" x2="320" y2="270" stroke="var(--grey)" stroke-width="3"/>
<rect x="216" y="240" width="24" height="60" rx="3" fill="var(--warn)"/>
<text x="228" y="228" text-anchor="middle" font-size="19" font-weight="700" fill="var(--warn)">Veto</text>
<rect x="320" y="225" width="110" height="90" rx="8" fill="var(--page)" stroke="var(--ink)" stroke-width="2"/>
<text x="375" y="276" text-anchor="middle" font-size="16" fill="var(--ink)">Data center</text>
<rect x="500" y="90" width="420" height="330" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="522" y="126" font-size="20" fill="var(--dim)">Behind the meter</text>
<rect x="530" y="160" width="270" height="235" rx="10" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="545" y="184" font-size="15" fill="var(--accent)">On-site</text>
<rect x="552" y="198" width="100" height="44" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="602" y="225" text-anchor="middle" font-size="15" fill="var(--ink)">Gas turbines</text>
<rect x="552" y="256" width="100" height="44" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="602" y="283" text-anchor="middle" font-size="15" fill="var(--ink)">Recip engines</text>
<rect x="552" y="314" width="100" height="44" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="602" y="341" text-anchor="middle" font-size="15" fill="var(--ink)">Solar</text>
<line x1="652" y1="220" x2="685" y2="262" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="652" y1="278" x2="685" y2="278" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="652" y1="336" x2="685" y2="294" stroke="var(--accent)" stroke-width="2.5"/>
<rect x="685" y="233" width="100" height="90" rx="8" fill="var(--page)" stroke="var(--ink)" stroke-width="2"/>
<text x="735" y="284" text-anchor="middle" font-size="16" fill="var(--ink)">Data center</text>
<polyline points="855,330 870,210 885,330" fill="none" stroke="var(--grey)" stroke-width="2.5"/>
<line x1="852" y1="225" x2="888" y2="225" stroke="var(--grey)" stroke-width="2.5"/>
<line x1="862" y1="255" x2="878" y2="255" stroke="var(--grey)" stroke-width="2.5"/>
<line x1="859" y1="290" x2="881" y2="290" stroke="var(--grey)" stroke-width="2.5"/>
<text x="870" y="362" text-anchor="middle" font-size="16" fill="var(--dim)">Grid</text>
<text x="480" y="480" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">Power moves on-site</text>
</svg>
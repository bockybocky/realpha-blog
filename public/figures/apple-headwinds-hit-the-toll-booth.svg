<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="四條箭頭從左側拉向右下三個寬度不同的閘口，其中兩條落在最寬的那個閘口">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .n { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text class="t" x="60" y="60">逆風打的不是產品</text>
  <text class="b" x="60" y="92">四條逆風，各自落在收費站的哪一格</text>

  <text class="n" x="60" y="155">司法部＋十六州：綠泡泡、NFC、手錶</text>
  <text class="n" x="60" y="220">歐盟數位市場法：側載、第三方支付</text>
  <text class="n" x="60" y="285">Epic 判決：外部付款連結</text>
  <text class="n" x="60" y="350">反壟斷法院：Google 搜尋合約</text>

  <path d="M 440,148 C 640,148 790,300 848,418" fill="none" stroke="var(--dim)" stroke-width="1.6" opacity="0.7"/>
  <polygon points="850,432 841,416 859,414" fill="var(--dim)" opacity="0.7"/>
  <path d="M 440,213 C 505,213 525,345 553,418" fill="none" stroke="var(--dim)" stroke-width="1.6" opacity="0.7"/>
  <polygon points="555,432 546,415 564,414" fill="var(--dim)" opacity="0.7"/>
  <path d="M 440,278 C 505,278 545,365 573,418" fill="none" stroke="var(--dim)" stroke-width="1.6" opacity="0.7"/>
  <polygon points="575,432 566,415 584,414" fill="var(--dim)" opacity="0.7"/>
  <path d="M 440,343 C 570,343 690,382 728,418" fill="none" stroke="var(--dim)" stroke-width="1.6" opacity="0.7"/>
  <polygon points="730,432 720,417 738,412" fill="var(--dim)" opacity="0.7"/>

  <text class="s" x="561" y="428" text-anchor="middle">270 億</text>
  <text class="s" x="730" y="428" text-anchor="middle">200 億</text>

  <rect x="470" y="440" width="182" height="100" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="664" y="440" width="133" height="100" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="809" y="440" width="84" height="100" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="n" x="561" y="497" text-anchor="middle">App Store</text>
  <text class="n" x="730" y="497" text-anchor="middle">Google</text>
  <text class="n" x="851" y="497" text-anchor="middle">裝置的鎖</text>

  <text class="c" x="60" y="500">打的是收費方式</text>
  <text class="s" x="60" y="530">不是「做不出好手機」</text>
</svg>
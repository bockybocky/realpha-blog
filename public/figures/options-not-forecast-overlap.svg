<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="答案未知的點分出兩條岔路，中間的重疊區放著兩邊都用得到的三件事">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .u { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="56">答案還沒出來，這一塊已經可以動</text>
<circle cx="150" cy="280" r="10" fill="var(--ink)"/>
<text class="u" x="120" y="322" text-anchor="middle">現在</text>
<path d="M 160 280 C 300 280 380 170 560 150" fill="none" stroke="var(--grey)" stroke-width="5"/>
<path d="M 160 280 C 300 280 380 390 560 410" fill="none" stroke="var(--grey)" stroke-width="5"/>
<text class="g" x="580" y="158">答案是這邊</text>
<text class="g" x="580" y="418">答案是那邊</text>
<rect x="300" y="222" width="330" height="116" fill="var(--card)" stroke="var(--accent)" stroke-width="3" rx="8"/>
<text class="u" x="324" y="256" fill="var(--accent)">兩邊都用得到</text>
<text class="g" x="324" y="292">履歷</text>
<text class="g" x="420" y="292">一頁報告</text>
<text class="g" x="324" y="324">自己的條件</text>
<text class="c" x="60" y="492">增加選項，不是提高預測精度</text>
</svg>
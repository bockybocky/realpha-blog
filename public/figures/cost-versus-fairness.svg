<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一根被刻度切成三段的柱子，右邊一團沒有刻度的虛線雲，一支粗箭頭由下指向右邊那團">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">一邊切得開，一邊切不開</text>
  <rect x="120" y="130" width="230" height="90" fill="var(--accent)" opacity="0.85"/>
  <rect x="120" y="226" width="230" height="90" fill="var(--accent)" opacity="0.65"/>
  <rect x="120" y="322" width="230" height="90" fill="var(--accent)" opacity="0.45"/>
  <text class="g" x="186" y="184">發電</text>
  <text class="g" x="186" y="280">輸配</text>
  <text class="g" x="162" y="376">修老設備</text>
  <text class="g" x="140" y="452">成本問題</text>
  <text class="n" x="140" y="480">有數字可算</text>
  <path d="M600 160 C 520 180 520 260 580 280 C 540 340 620 400 700 370 C 780 410 860 340 820 280 C 880 240 850 160 760 170 C 720 130 640 130 600 160 Z" fill="var(--warn)" opacity="0.18" stroke="var(--warn)" stroke-width="4" stroke-dasharray="12 10"/>
  <text class="g" x="648" y="266">規則是誰定的</text>
  <text class="g" x="660" y="302">我在不在桌上</text>
  <text class="g" x="620" y="452">公平感問題</text>
  <text class="n" x="620" y="480">算不出來</text>
  <path d="M470 510 L720 430 L700 404 L790 400 L760 476 L740 450 L478 530 Z" fill="var(--ink)" opacity="0.8"/>
  <text class="c" x="60" y="524">選票衝著右邊那一團去</text>
</svg>
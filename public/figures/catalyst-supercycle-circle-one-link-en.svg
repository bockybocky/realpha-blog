<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A six-link chain has its fourth link circled with an attention arrow pointing downward, marking the step that requires someone else's approval.">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">One chain, one link circled</text>
  <text x="60" y="100" font-size="16" fill="var(--dim)">Example: changing a home's layout</text>

  <line x1="100" y1="230" x2="900" y2="230" stroke="var(--line)" stroke-width="4"/>
  <g fill="var(--card)" stroke="var(--grey)" stroke-width="2">
    <rect x="100" y="196" width="118" height="68" rx="34"/>
    <rect x="238" y="196" width="118" height="68" rx="34"/>
    <rect x="376" y="196" width="118" height="68" rx="34"/>
    <rect x="652" y="196" width="118" height="68" rx="34"/>
    <rect x="790" y="196" width="118" height="68" rx="34"/>
  </g>
  <rect x="514" y="196" width="118" height="68" rx="34" fill="var(--card)" stroke="var(--warn)" stroke-width="4"/>
  <circle cx="573" cy="230" r="78" fill="none" stroke="var(--warn)" stroke-width="4"/>

  <g font-size="16" fill="var(--ink)" text-anchor="middle">
    <text x="159" y="236">Measure</text>
    <text x="297" y="236">Draw</text>
    <text x="435" y="236">Pick materials</text>
    <text x="573" y="236">Board approval</text>
    <text x="711" y="236">Crew starts</text>
    <text x="849" y="236">Sign-off</text>
  </g>
  <g font-size="16" fill="var(--dim)" text-anchor="middle">
    <text x="297" y="300">You can finish this</text>
    <text x="849" y="300">You can finish this</text>
  </g>

  <line x1="573" y1="330" x2="573" y2="372" stroke="var(--warn)" stroke-width="4"/>
  <path d="M 561 330 L 573 308 L 585 330 Z" fill="var(--warn)"/>
  <text x="573" y="402" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">Needs someone else's approval</text>
  <text x="573" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">Focus the next few weeks here</text>

  <text x="60" y="488" font-size="22" font-weight="700" fill="var(--ink)">The layer that jams is the one you cannot complete on your own</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A horizontal timeline: earlier, Córdoba and colleagues establish the approach; on August 15, Buckmaster and colleagues find a simplified singularity; 17 days later, on September 1, OpenAI hears about it; and 8 days after that, on September 9, OpenAI announces a solution.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="56" class="t">Route timeline</text>
<line x1="100" y1="290" x2="270" y2="290" stroke="var(--grey)" stroke-width="2"/>
<line x1="272" y1="302" x2="284" y2="278" stroke="var(--grey)" stroke-width="2"/>
<line x1="286" y1="302" x2="298" y2="278" stroke="var(--grey)" stroke-width="2"/>
<line x1="310" y1="290" x2="880" y2="290" stroke="var(--grey)" stroke-width="2"/>
<circle cx="180" cy="290" r="11" fill="var(--grey)"/>
<circle cx="413" cy="290" r="11" fill="var(--grey)"/>
<circle cx="697" cy="290" r="11" fill="var(--accent)"/>
<circle cx="830" cy="290" r="11" fill="var(--accent)"/>
<text x="180" y="226" class="b" text-anchor="middle">Córdoba et al.</text>
<text x="180" y="252" class="d" text-anchor="middle">Route</text>
<text x="413" y="226" class="b" text-anchor="middle">Buckmaster et al.</text>
<text x="413" y="252" class="d" text-anchor="middle">Toy blowup</text>
<text x="697" y="226" class="b" text-anchor="middle">OpenAI</text>
<text x="697" y="252" class="d" text-anchor="middle">Tipped</text>
<text x="830" y="226" class="b" text-anchor="middle">OpenAI</text>
<text x="830" y="252" class="d" text-anchor="middle">Solved</text>
<text x="180" y="326" class="d" text-anchor="middle">Pre</text>
<text x="413" y="326" class="d" text-anchor="middle">8/15</text>
<text x="697" y="326" class="d" text-anchor="middle">9/1</text>
<text x="830" y="326" class="d" text-anchor="middle">9/9</text>
<path d="M413,350 L413,362 L691,362 L691,350" fill="none" stroke="var(--dim)" stroke-width="2"/>
<text x="552" y="392" class="g" text-anchor="middle">17 d</text>
<path d="M703,350 L703,362 L830,362 L830,350" fill="none" stroke="var(--dim)" stroke-width="2"/>
<text x="766" y="392" class="g" text-anchor="middle">8 d</text>
<circle cx="370" cy="455" r="8" fill="var(--grey)"/>
<text x="386" y="461" class="b">Math</text>
<circle cx="520" cy="455" r="8" fill="var(--accent)"/>
<text x="536" y="461" class="b">OpenAI</text>
</svg>
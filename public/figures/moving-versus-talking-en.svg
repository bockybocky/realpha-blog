<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars of very different lengths on one timeline, one twelve months, the other over ten years">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="48" y="54" font-size="27" fill="var(--ink)">Moving vs talking</text>

  <text x="48" y="146" font-size="19" fill="var(--accent)">In motion</text>
  <text x="48" y="172" font-size="15" fill="var(--dim)">Gallium·5 firms</text>
  <rect x="240" y="134" width="47" height="28" fill="var(--accent)"/>
  <text x="303" y="156" font-size="16" fill="var(--ink)">12 months</text>

  <text x="48" y="256" font-size="19" fill="var(--dim)">Talked about</text>
  <text x="48" y="282" font-size="15" fill="var(--dim)">Rebuild smelting</text>
  <rect x="240" y="244" width="560" height="28" fill="var(--grey)"/>
  <line x1="800" y1="258" x2="900" y2="258" stroke="var(--grey)" stroke-width="6" stroke-dasharray="10 8"/>
  <text x="520" y="234" font-size="16" fill="var(--dim)" text-anchor="middle">10+ years</text>

  <line x1="240" y1="330" x2="900" y2="330" stroke="var(--line)" stroke-width="2"/>
  <line x1="240" y1="324" x2="240" y2="336" stroke="var(--line)" stroke-width="2"/>
  <line x1="474" y1="324" x2="474" y2="336" stroke="var(--line)" stroke-width="2"/>
  <line x1="708" y1="324" x2="708" y2="336" stroke="var(--line)" stroke-width="2"/>
  <text x="240" y="358" font-size="15" fill="var(--dim)" text-anchor="middle">Now</text>
  <text x="474" y="358" font-size="15" fill="var(--dim)" text-anchor="middle">5 yrs</text>
  <text x="708" y="358" font-size="15" fill="var(--dim)" text-anchor="middle">10 yrs</text>

  <text x="48" y="452" font-size="22" fill="var(--ink)">In between, price ignores story</text>
</svg>
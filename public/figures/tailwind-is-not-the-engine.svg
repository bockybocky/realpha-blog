<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩支粗箭頭推動方塊、上方一支細小斜箭頭只是順風">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="48" font-size="27" fill="var(--ink)">誰在推，誰只是順著</text>
<path d="M 100 130 L 430 130" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 6" fill="none"/>
<path d="M 120 150 L 300 150 L 300 118 L 390 166 L 300 214 L 300 182 L 120 182 Z" fill="var(--accent)" opacity="0.85"/>
<text x="140" y="110" font-size="20" fill="var(--accent)">資料中心花費的絕對規模</text>
<path d="M 120 268 L 300 268 L 300 236 L 390 284 L 300 332 L 300 300 L 120 300 Z" fill="var(--accent)" opacity="0.85"/>
<text x="140" y="364" font-size="20" fill="var(--accent)">工程題目變難</text>
<path d="M 150 420 L 240 420 L 240 408 L 282 426 L 240 444 L 240 432 L 150 432 Z" fill="var(--grey)"/>
<text x="296" y="434" font-size="19" fill="var(--dim)">異質化（同方向，小得多）</text>
<rect x="470" y="150" width="200" height="180" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="570" y="235" font-size="20" fill="var(--ink)" text-anchor="middle">那些數字</text>
<text x="570" y="265" font-size="16" fill="var(--dim)" text-anchor="middle">被往前推</text>
<path d="M 690 240 L 790 240" stroke="var(--dim)" stroke-width="2" fill="none"/>
<path d="M 780 232 L 794 240 L 780 248 Z" fill="var(--dim)"/>
<text x="60" y="492" font-size="22" fill="var(--ink)">順風會讓你走得順一點，但它不是在出力的那個</text>
</svg>
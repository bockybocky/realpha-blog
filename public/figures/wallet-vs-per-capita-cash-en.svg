<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars of very unequal length: the cash in your wallet is short, the cash per person in circulation is far longer.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="h" x="60" y="62">Nobody's pocket holds those bills</text>
<text class="g" x="60" y="150">Wallet plus home</text>
<rect x="60" y="170" width="47" height="54" rx="6" fill="var(--grey)"/>
<text class="b" x="122" y="205">$430</text>
<text class="g" x="60" y="290">In circulation per person</text>
<rect x="60" y="310" width="770" height="54" rx="6" fill="var(--accent)"/>
<text class="b" x="60" y="396">$7,000+</text>
<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="60" y="470">An order of magnitude more bills, elsewhere, doing something else</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Clinical evidence sits far from the shelf, while the panel-test percentages on the pack sit right at the point of purchase.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="40" y="52" font-size="27" fill="var(--ink)">Two kinds of proof, different distance from the shelf</text>

  <line x1="60" y1="330" x2="900" y2="330" stroke="var(--line)" stroke-width="3"/>
  <text x="60" y="366" font-size="16" fill="var(--dim)">Far from the purchase</text>
  <text x="790" y="366" font-size="16" fill="var(--dim)">Right in front</text>

  <rect x="60" y="128" width="280" height="150" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="84" y="170" font-size="20" fill="var(--ink)">28-day clinical</text>
  <text x="84" y="202" font-size="16" fill="var(--dim)">Microbiome shift · milder symptoms</text>
  <text x="84" y="230" font-size="16" fill="var(--dim)">Slightly better sleep</text>
  <text x="84" y="258" font-size="16" fill="var(--warn)">No sample size or effect size</text>
  <line x1="200" y1="278" x2="200" y2="330" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="84" y="406" font-size="16" fill="var(--dim)">Only works for willing readers</text>

  <rect x="560" y="128" width="300" height="150" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="584" y="170" font-size="20" fill="var(--ink)">Panel test on pack</text>
  <text x="584" y="202" font-size="16" fill="var(--dim)">25 / 50 / 100 people</text>
  <text x="584" y="230" font-size="16" fill="var(--dim)">Instant · day 3 · day 7</text>
  <text x="584" y="258" font-size="16" fill="var(--accent)">Percent on the box</text>
  <line x1="710" y1="278" x2="710" y2="330" stroke="var(--accent)" stroke-width="2"/>

  <circle cx="710" cy="406" r="20" fill="var(--accent)"/>
  <path d="M684 480 Q710 412 736 480 Z" fill="var(--accent)"/>
  <text x="752" y="412" font-size="19" fill="var(--ink)">People like me</text>
  <text x="752" y="440" font-size="16" fill="var(--dim)">How it feels in use</text>
</svg>
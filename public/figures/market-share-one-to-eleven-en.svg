<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The total market stays the same size but is cut into eleven slices, ten of which belong to one person.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="58" font-size="27" font-weight="700" fill="var(--ink)">The market did not grow; it got sliced</text>

  <text class="t" x="90" y="130" font-size="19" fill="var(--dim)">Before</text>
  <rect x="90" y="170" width="300" height="220" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="240" y="290" font-size="20" text-anchor="middle" fill="var(--ink)">The whole market</text>
  <text class="t" x="240" y="448" font-size="16" text-anchor="middle" fill="var(--dim)">One person takes it</text>

  <line x1="425" y1="280" x2="510" y2="280" stroke="var(--grey)" stroke-width="3"/>
  <path d="M510,280 L494,272 L494,288 Z" fill="var(--grey)"/>

  <text class="t" x="560" y="130" font-size="19" fill="var(--dim)">Now</text>
  <rect x="560" y="170" width="24" height="220" rx="3" fill="var(--grey)"/>
  <rect x="589" y="170" width="24" height="220" rx="3" fill="var(--accent)"/>
  <rect x="618" y="170" width="24" height="220" rx="3" fill="var(--accent)"/>
  <rect x="647" y="170" width="24" height="220" rx="3" fill="var(--accent)"/>
  <rect x="676" y="170" width="24" height="220" rx="3" fill="var(--accent)"/>
  <rect x="705" y="170" width="24" height="220" rx="3" fill="var(--accent)"/>
  <rect x="734" y="170" width="24" height="220" rx="3" fill="var(--accent)"/>
  <rect x="763" y="170" width="24" height="220" rx="3" fill="var(--accent)"/>
  <rect x="792" y="170" width="24" height="220" rx="3" fill="var(--accent)"/>
  <rect x="821" y="170" width="24" height="220" rx="3" fill="var(--accent)"/>
  <rect x="850" y="170" width="24" height="220" rx="3" fill="var(--accent)"/>

  <line x1="560" y1="408" x2="584" y2="408" stroke="var(--grey)" stroke-width="3"/>
  <text class="t" x="572" y="434" font-size="16" text-anchor="middle" fill="var(--dim)">You</text>
  <line x1="589" y1="408" x2="874" y2="408" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="731" y="434" font-size="16" text-anchor="middle" fill="var(--accent)">Ten from one person</text>

  <text class="t" x="480" y="505" font-size="22" text-anchor="middle" fill="var(--ink)">The one being diluted is you, not them</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Before, four buckets each have their own base; after, the four share one base">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--dim); font-weight:700; }
    .box { font-size:15px; fill:var(--ink); }
    .cap { font-size:15px; fill:var(--dim); }
    .bar { font-size:16px; fill:var(--page); font-weight:700; }
    .cc  { font-size:22px; fill:var(--accent); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ttl" x="60" y="72">Four buckets share one layer</text>

<text class="grp" x="60" y="132">Before</text>
<rect x="60" y="150" width="400" height="290" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="82" y="196" width="82" height="86" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text class="box" x="123" y="245" text-anchor="middle">Compute</text>
<rect x="176" y="196" width="82" height="86" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text class="box" x="217" y="245" text-anchor="middle">Memory</text>
<rect x="270" y="196" width="82" height="86" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text class="box" x="311" y="245" text-anchor="middle">Optics</text>
<rect x="364" y="196" width="82" height="86" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text class="box" x="405" y="245" text-anchor="middle">Power</text>
<rect x="82" y="300" width="82" height="20" rx="4" fill="var(--grey)"/>
<rect x="176" y="300" width="82" height="20" rx="4" fill="var(--grey)"/>
<rect x="270" y="300" width="82" height="20" rx="4" fill="var(--grey)"/>
<rect x="364" y="300" width="82" height="20" rx="4" fill="var(--grey)"/>
<text class="cap" x="82" y="366">Own limits, cycles out of sync</text>

<text class="grp" x="500" y="132">After</text>
<rect x="500" y="150" width="400" height="290" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="522" y="196" width="82" height="86" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="box" x="563" y="245" text-anchor="middle">Compute</text>
<rect x="616" y="196" width="82" height="86" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="box" x="657" y="245" text-anchor="middle">Memory</text>
<rect x="710" y="196" width="82" height="86" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="box" x="751" y="245" text-anchor="middle">Optics</text>
<rect x="804" y="196" width="82" height="86" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="box" x="845" y="245" text-anchor="middle">Power</text>
<rect x="522" y="300" width="364" height="44" rx="6" fill="var(--accent)"/>
<text class="bar" x="704" y="328" text-anchor="middle">Lasers · photonics · packaging</text>
<text class="cap" x="522" y="386">Same fabs, cycles sync</text>

<text class="cc" x="60" y="500">More themes, less diversification</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸上一個固定的樁釘在傍晚，其餘方塊被擠到前面重排">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">有一格不能動，其他全部重排</text>
<text x="60" y="150" font-size="19" font-weight="700" fill="var(--dim)">平常的一天</text>
<line x1="200" y1="196" x2="860" y2="196" stroke="var(--line)" stroke-width="2"/>
<rect x="210" y="166" width="120" height="30" rx="5" fill="var(--grey)"/>
<rect x="346" y="166" width="150" height="30" rx="5" fill="var(--grey)"/>
<rect x="512" y="166" width="130" height="30" rx="5" fill="var(--grey)"/>
<rect x="658" y="166" width="190" height="30" rx="5" fill="var(--grey)"/>
<text x="700" y="232" font-size="16" fill="var(--dim)">開會・加班・應酬</text>
<text x="60" y="326" font-size="19" font-weight="700" fill="var(--accent)">那五天</text>
<line x1="200" y1="372" x2="860" y2="372" stroke="var(--line)" stroke-width="2"/>
<rect x="210" y="342" width="96" height="30" rx="5" fill="var(--accent)" opacity="0.8"/>
<rect x="320" y="342" width="120" height="30" rx="5" fill="var(--accent)" opacity="0.8"/>
<rect x="454" y="342" width="104" height="30" rx="5" fill="var(--accent)" opacity="0.8"/>
<rect x="600" y="300" width="130" height="72" rx="6" fill="var(--warn)"/>
<text x="616" y="344" font-size="19" font-weight="700" fill="var(--page)">接小孩</text>
<line x1="665" y1="372" x2="665" y2="424" stroke="var(--warn)" stroke-width="5"/>
<text x="600" y="452" font-size="16" fill="var(--warn)">不准請假</text>
<text x="752" y="344" font-size="16" fill="var(--dim)">後面沒有了</text>
<text x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">體會不是聽來的，是排出來的</text>
</svg>
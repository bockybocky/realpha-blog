<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="時間軸上三個升起又落回的弧線，第四段升起後沒有落下">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink) }
    .nam { font-size:16px; fill:var(--ink) }
    .rsn { font-size:15px; fill:var(--warn) }
    .cnc { font-size:22px; font-weight:600; fill:var(--accent) }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="64">五十八年，爬起來三次又落回原地</text>

  <line x1="90" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="3"/>
  <circle cx="110" cy="430" r="6" fill="var(--dim)"/>
  <text class="nam" x="110" y="466" text-anchor="middle" fill="var(--dim)">1968</text>

  <path d="M150,430 Q215,320 280,430" fill="none" stroke="var(--dim)" stroke-width="3"/>
  <text class="rsn" x="215" y="330" text-anchor="middle">跳票</text>
  <text class="nam" x="215" y="466" text-anchor="middle">1980 海軍論文</text>

  <path d="M330,430 Q420,290 510,430" fill="none" stroke="var(--dim)" stroke-width="3"/>
  <text class="rsn" x="420" y="302" text-anchor="middle">貴五成</text>
  <text class="nam" x="420" y="466" text-anchor="middle">2007–12 火車</text>

  <path d="M560,430 Q650,280 740,430" fill="none" stroke="var(--dim)" stroke-width="3"/>
  <text class="rsn" x="650" y="292" text-anchor="middle">沒有買家</text>
  <text class="nam" x="650" y="466" text-anchor="middle">2010s 智慧電網</text>

  <path d="M780,430 Q835,345 878,255" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <path d="M878,255 L906,205" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="8 8"/>
  <text class="ttl" x="912" y="190" text-anchor="middle" fill="var(--accent)">?</text>
  <text class="nam" x="840" y="466" text-anchor="middle" fill="var(--accent)">2026 資料中心</text>

  <text class="cnc" x="480" y="522" text-anchor="middle">差別不在技術，在買家換了一批人</text>
</svg>
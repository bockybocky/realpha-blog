<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="The mastery line keeps climbing, the interest line plunges at the point of mastery, and an arrow below shows the source of pleasure shifting">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600;fill:var(--dim)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<defs><marker id="ahE" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="var(--dim)"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="62">Mastered, then bored</text>
<line x1="140" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="130" x2="140" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="620" y1="140" x2="620" y2="440" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="632" y="160">Figured out</text>
<polyline points="140,400 260,352 380,286 500,216 620,172 780,158" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="140,334 260,254 380,206 500,184 620,194 780,418" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="b" x="792" y="152" fill="var(--accent)">Mastery</text>
<text class="b" x="792" y="418" fill="var(--warn)">Interest</text>
<text class="g" x="60" y="504">Source of fun</text>
<rect x="240" y="478" width="110" height="46" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="295" y="507" text-anchor="middle">Play</text>
<line x1="368" y1="501" x2="448" y2="501" stroke="var(--dim)" stroke-width="3" marker-end="url(#ahE)"/>
<rect x="466" y="478" width="110" height="46" rx="10" fill="var(--warn)"/>
<text class="b" x="521" y="507" text-anchor="middle" fill="var(--page)">Buy</text>
<text class="c" x="60" y="568">The bar rose, not the joy</text>
</svg>
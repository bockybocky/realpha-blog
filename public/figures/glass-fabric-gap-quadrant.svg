<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="散點圖，一個點孤懸在右上角最缺的位置，另一個點在左上角用不上的位置">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .ax { font-size:16px; fill:var(--dim); }
    .lb { font-size:19px; fill:var(--ink); font-weight:600; }
    .lw { font-size:19px; fill:var(--warn); font-weight:700; }
    .lg { font-size:19px; fill:var(--dim); font-weight:600; }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="80" y="58">四種布，四個位置</text>
  <text class="s" x="80" y="90">缺得最兇的，不是被討論最多的</text>

  <rect x="170" y="130" width="690" height="340" fill="var(--card)" stroke="var(--line)"/>
  <line x1="515" y1="130" x2="515" y2="470" stroke="var(--line)" stroke-dasharray="5 5"/>
  <line x1="170" y1="300" x2="860" y2="300" stroke="var(--line)" stroke-dasharray="5 5"/>
  <line x1="170" y1="470" x2="860" y2="470" stroke="var(--grey)" stroke-width="2"/>
  <line x1="170" y1="130" x2="170" y2="470" stroke="var(--grey)" stroke-width="2"/>
  <text class="ax" x="860" y="498" text-anchor="end">現在下游用得上 →</text>
  <text class="ax" x="150" y="140" text-anchor="end" transform="rotate(-90 150 140)">缺口越嚴重 →</text>

  <circle cx="300" cy="205" r="10" fill="var(--grey)"/>
  <text class="lg" x="322" y="200">石英布</text>
  <text class="b" x="322" y="224">難加工、太貴，只有少數產品</text>

  <circle cx="690" cy="385" r="10" fill="var(--accent)"/>
  <text class="lb" x="712" y="380">Low Dk</text>
  <text class="b" x="712" y="404">吃緊，但不至於大缺料</text>

  <circle cx="640" cy="330" r="10" fill="var(--accent)"/>
  <text class="lb" x="500" y="326" text-anchor="end">Low Dk II</text>

  <circle cx="790" cy="180" r="14" fill="var(--warn)"/>
  <text class="lw" x="770" y="176" text-anchor="end">Low CTE</text>
  <text class="b" x="770" y="200" text-anchor="end">載板要用，擴三倍可能還不夠</text>

  <text class="c" x="80" y="546">最紅的那一格，跟最卡的那一格不是同一格</text>
</svg>
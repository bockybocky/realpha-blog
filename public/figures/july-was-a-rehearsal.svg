<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩組向下的柱子，右邊虛線柱比左邊實心柱長得多且以問號結尾" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="80" y="54" font-size="27" font-weight="700" fill="var(--ink)">同一個市場，兩種跌法</text>

  <text x="285" y="112" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">籌碼過熱｜七月</text>
  <text x="700" y="112" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">基本面轉壞｜未來</text>

  <line x1="80" y1="150" x2="880" y2="150" stroke="var(--line)" stroke-width="3"/>
  <text x="80" y="142" font-size="15" fill="var(--dim)">起跌點</text>

  <rect x="190" y="150" width="90" height="112" fill="var(--accent)" rx="4"/>
  <text x="235" y="286" font-size="15" fill="var(--dim)" text-anchor="middle">中小型指數</text>
  <text x="235" y="308" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">−30%</text>

  <rect x="320" y="150" width="90" height="205" fill="var(--accent)" rx="4"/>
  <text x="365" y="379" font-size="15" fill="var(--dim)" text-anchor="middle">個股</text>
  <text x="365" y="401" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">−50 至 −60%</text>

  <rect x="610" y="150" width="180" height="300" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="700" y="330" font-size="60" font-weight="700" fill="var(--warn)" text-anchor="middle">?</text>
  <text x="700" y="480" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">這次的幾倍</text>

  <text x="480" y="524" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">七月＝預演，不是災難</text>
</svg>
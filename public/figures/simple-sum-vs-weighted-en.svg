<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Four equal bars and a jagged velocity line on the left, four bars of differing heights and a steady velocity line on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型：思源黑體優先 */
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">One pile of money, two rulers, two worlds</text>

<text x="90" y="110" font-size="20" font-weight="600" fill="var(--grey)">Simple sum: all weighted alike</text>
<text x="540" y="110" font-size="20" font-weight="600" fill="var(--accent)">Weighted by transaction use</text>

<line x1="80" y1="330" x2="440" y2="330" stroke="var(--line)" stroke-width="2"/>
<rect x="96" y="240" width="60" height="90" fill="var(--grey)" fill-opacity="0.5" stroke="var(--grey)"/>
<rect x="184" y="240" width="60" height="90" fill="var(--grey)" fill-opacity="0.5" stroke="var(--grey)"/>
<rect x="272" y="240" width="60" height="90" fill="var(--grey)" fill-opacity="0.5" stroke="var(--grey)"/>
<rect x="360" y="240" width="60" height="90" fill="var(--grey)" fill-opacity="0.5" stroke="var(--grey)"/>
<text x="126" y="352" font-size="15" fill="var(--dim)" text-anchor="middle">Cash</text>
<text x="214" y="352" font-size="15" fill="var(--dim)" text-anchor="middle">Checking</text>
<text x="302" y="352" font-size="15" fill="var(--dim)" text-anchor="middle">CDs</text>
<text x="390" y="352" font-size="15" fill="var(--dim)" text-anchor="middle">MMFs</text>

<line x1="530" y1="330" x2="890" y2="330" stroke="var(--line)" stroke-width="2"/>
<rect x="546" y="170" width="60" height="160" fill="var(--accent)" fill-opacity="0.8" stroke="var(--accent)"/>
<rect x="634" y="196" width="60" height="134" fill="var(--accent)" fill-opacity="0.65" stroke="var(--accent)"/>
<rect x="722" y="286" width="60" height="44" fill="var(--accent)" fill-opacity="0.35" stroke="var(--accent)"/>
<rect x="810" y="300" width="60" height="30" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)"/>
<text x="576" y="352" font-size="15" fill="var(--dim)" text-anchor="middle">Cash</text>
<text x="664" y="352" font-size="15" fill="var(--dim)" text-anchor="middle">Checking</text>
<text x="752" y="352" font-size="15" fill="var(--dim)" text-anchor="middle">CDs</text>
<text x="840" y="352" font-size="15" fill="var(--dim)" text-anchor="middle">MMFs</text>

<text x="90" y="410" font-size="16" fill="var(--dim)">Velocity as measured</text>
<text x="540" y="410" font-size="16" fill="var(--dim)">Velocity as measured</text>
<path d="M 96,470 L 150,420 L 200,500 L 250,432 L 300,496 L 350,436 L 420,486" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M 546,466 L 610,458 L 670,468 L 730,460 L 790,466 L 870,460" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="258" y="530" font-size="19" font-weight="600" fill="var(--grey)" text-anchor="middle">Swings wildly</text>
<text x="708" y="530" font-size="19" font-weight="600" fill="var(--accent)" text-anchor="middle">Settles down</text>

<text x="60" y="573" font-size="22" font-weight="600" fill="var(--ink)">Check your ruler before you measure</text>
</svg>
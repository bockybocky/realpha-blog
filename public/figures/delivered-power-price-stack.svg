<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左柱層層疊加升壓輸電配電成本遠高於右柱只有發電一段">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">發電端的價格，只是第一段</text>
<line x1="120" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="200" y="74" width="140" height="132" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="200" y="206" width="140" height="66" fill="var(--grey)"/>
<rect x="200" y="272" width="140" height="22" fill="var(--grey)"/>
<rect x="200" y="294" width="140" height="176" fill="var(--accent)"/>
<text x="356" y="146" font-size="16" fill="var(--dim)">變電所與配電</text>
<text x="356" y="246" font-size="16" fill="var(--dim)">高壓輸電</text>
<text x="356" y="290" font-size="16" fill="var(--dim)">升壓</text>
<text x="356" y="390" font-size="16" fill="var(--dim)">發電</text>
<text x="270" y="500" font-size="19" fill="var(--ink)" text-anchor="middle">電網送到廠區</text>
<rect x="620" y="294" width="140" height="176" fill="var(--accent)"/>
<text x="776" y="390" font-size="16" fill="var(--dim)">發電</text>
<text x="690" y="500" font-size="19" fill="var(--ink)" text-anchor="middle">現場發電</text>
<text x="690" y="270" font-size="16" fill="var(--dim)" text-anchor="middle">中間沒有輸配電</text>
<text x="120" y="536" font-size="22" fill="var(--ink)">同一度電，兩個不同的交付點</text>
</svg>
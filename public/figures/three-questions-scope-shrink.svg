<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="四條左端對齊、逐條變短的橫條，代表每問一個口徑問題，消息能推論的範圍就縮小一截">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">三問之後，這則消息剩多大</text>

<rect x="200" y="112" width="690" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="60" y="142" font-size="19" fill="var(--dim)" dominant-baseline="middle">標題</text>
<text x="228" y="142" font-size="16" fill="var(--ink)" dominant-baseline="middle">打敗輝達</text>

<rect x="200" y="196" width="550" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="60" y="226" font-size="19" fill="var(--dim)" dominant-baseline="middle">第一問</text>
<text x="228" y="226" font-size="16" fill="var(--ink)" dominant-baseline="middle">只在推論，不能訓練</text>

<rect x="200" y="280" width="410" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="60" y="310" font-size="19" fill="var(--dim)" dominant-baseline="middle">第二問</text>
<text x="228" y="310" font-size="16" fill="var(--ink)" dominant-baseline="middle">對手是上一代</text>

<rect x="200" y="364" width="270" height="60" rx="8" fill="var(--accent)"/>
<text x="60" y="394" font-size="19" fill="var(--dim)" dominant-baseline="middle">第三問</text>
<text x="228" y="394" font-size="16" fill="var(--page)" dominant-baseline="middle">單機櫃、標稱功耗</text>

<line x1="200" y1="100" x2="200" y2="440" stroke="var(--line)" stroke-width="1"/>

<text x="60" y="486" font-size="22" fill="var(--ink)">消息是真的，只是能走的距離比標題短</text>
</svg>
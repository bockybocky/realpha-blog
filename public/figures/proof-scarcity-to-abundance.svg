<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩組柱狀圖，生產那根從很矮長到衝頂，檢查那根兩邊一樣高">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">證明稀缺　→　證明充盈</text>
<line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="480" y1="100" x2="480" y2="430" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>

<rect x="150" y="370" width="80" height="60" fill="var(--accent)" opacity="0.35"/>
<rect x="280" y="290" width="80" height="140" fill="var(--grey)"/>
<text x="190" y="355" font-size="16" fill="var(--dim)" text-anchor="middle">生產</text>
<text x="320" y="275" font-size="16" fill="var(--dim)" text-anchor="middle">檢查</text>
<text x="255" y="465" font-size="20" fill="var(--ink)" text-anchor="middle">證明稀缺</text>

<rect x="600" y="130" width="80" height="300" fill="var(--accent)"/>
<rect x="730" y="290" width="80" height="140" fill="var(--grey)"/>
<text x="640" y="115" font-size="16" fill="var(--dim)" text-anchor="middle">生產</text>
<text x="770" y="275" font-size="16" fill="var(--dim)" text-anchor="middle">檢查</text>
<text x="705" y="465" font-size="20" fill="var(--ink)" text-anchor="middle">證明充盈</text>

<line x1="810" y1="290" x2="880" y2="290" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="360" y1="290" x2="480" y2="290" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="480" y="505" font-size="22" fill="var(--ink)" text-anchor="middle">長高的只有一根</text>
</svg>
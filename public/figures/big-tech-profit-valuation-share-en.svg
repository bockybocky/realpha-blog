<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Before-and-after bars: the top bar is split into core operations and stake valuation, with the valuation segment close to half; the bottom bar keeps only the core segment, and its right half becomes an empty dashed box."><rect x="0" y="0" width="960" height="540" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:19px;font-weight:600}.b{font-size:16px;fill:var(--dim)}.k{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}
</style>
<text x="480" y="52" text-anchor="middle" class="t">~Half is paper gains</text>
<text x="80" y="132" class="g">Big 5 Q2 pretax income</text>
<text x="880" y="132" text-anchor="end" class="g">$350B</text>
<rect x="80" y="150" width="440" height="80" fill="var(--accent)"/>
<rect x="520" y="150" width="360" height="80" fill="var(--warn)"/>
<text x="300" y="198" text-anchor="middle" class="g" style="fill:var(--page)">Ops ~55%</text>
<text x="700" y="198" text-anchor="middle" class="g" style="fill:var(--page)">Stakes ~45%</text>
<text x="700" y="258" text-anchor="middle" class="b">Other income</text>
<text x="80" y="312" class="g">Minus stakes</text>
<rect x="80" y="330" width="440" height="80" fill="var(--accent)"/>
<rect x="520" y="330" width="360" height="80" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text x="300" y="378" text-anchor="middle" class="g" style="fill:var(--page)">Ops</text>
<text x="700" y="378" text-anchor="middle" class="g w">Cut</text>
<text x="480" y="490" text-anchor="middle" class="k">Cut this line</text>
</svg>
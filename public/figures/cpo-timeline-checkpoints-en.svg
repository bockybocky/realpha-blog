<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Four staircase-staggered timeline bars sit above a row of diamond checkpoints for checking the forecast.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:700; fill:var(--ink); }
    .body { font-size:16px; fill:var(--dim); }
    .inb { font-size:16px; font-weight:700; }
    .end { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text x="60" y="56" class="title">Turn the timeline into checkpoints</text>
  <line x1="140" y1="110" x2="140" y2="390" stroke="var(--line)" stroke-width="2"/>
  <line x1="290" y1="110" x2="290" y2="390" stroke="var(--line)" stroke-width="2"/>
  <line x1="440" y1="110" x2="440" y2="390" stroke="var(--line)" stroke-width="2"/>
  <line x1="590" y1="110" x2="590" y2="390" stroke="var(--line)" stroke-width="2"/>
  <line x1="740" y1="110" x2="740" y2="390" stroke="var(--line)" stroke-width="2"/>
  <text x="140" y="104" class="body" text-anchor="middle">2027</text>
  <text x="290" y="104" class="body" text-anchor="middle">2028</text>
  <text x="440" y="104" class="body" text-anchor="middle">2029</text>
  <text x="590" y="104" class="body" text-anchor="middle">2030</text>
  <text x="740" y="104" class="body" text-anchor="middle">2031</text>
  <rect x="140" y="140" width="300" height="40" rx="6" fill="var(--grey)"/>
  <text x="156" y="166" class="inb" style="fill:var(--ink)">Bridge solutions hold</text>
  <rect x="290" y="206" width="300" height="40" rx="6" fill="var(--accent)"/>
  <text x="306" y="232" class="inb" style="fill:var(--page)">GPU leaders adopt</text>
  <rect x="440" y="272" width="450" height="40" rx="6" fill="var(--accent)" opacity="0.4"/>
  <text x="456" y="298" class="inb" style="fill:var(--ink)">Spreads to other accelerators</text>
  <rect x="590" y="338" width="300" height="40" rx="6" fill="var(--accent)"/>
  <path d="M890,338 L915,358 L890,378 Z" fill="var(--accent)"/>
  <text x="606" y="364" class="inb" style="fill:var(--page)">Foundry standard</text>
  <line x1="120" y1="440" x2="900" y2="440" stroke="var(--dim)" stroke-width="2"/>
  <text x="60" y="430" class="grp">Checkpoints</text>
  <path d="M290,428 L302,440 L290,452 L278,440 Z" fill="var(--warn)"/>
  <path d="M470,428 L482,440 L470,452 L458,440 Z" fill="var(--warn)"/>
  <path d="M650,428 L662,440 L650,452 L638,440 Z" fill="var(--warn)"/>
  <text x="290" y="480" class="body" text-anchor="middle">CPO at launch events?</text>
  <text x="470" y="480" class="body" text-anchor="middle">ASIC design wins?</text>
  <text x="650" y="480" class="body" text-anchor="middle">New test-gear demand?</text>
  <text x="480" y="560" class="end" text-anchor="middle">On track / +1 qtr / pivot</text>
</svg>
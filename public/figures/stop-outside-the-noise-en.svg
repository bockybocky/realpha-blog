<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A jagged price line inside the normal volatility band, with the stop inside it hit repeatedly and the stop outside it never touched">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.f8-b{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.f8-t{font-size:27px;font-weight:700}
.f8-s{font-size:15px}
.f8-c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="f8-b f8-t" x="60" y="66">The stop goes outside the volatility, not at your pain point</text>
<rect x="120" y="180" width="760" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="f8-b f8-s" x="126" y="170" fill="var(--dim)">Normal volatility range</text>
<path d="M130,250 L190,205 L240,312 L300,224 L360,308 L420,215 L480,315 L540,232 L600,305 L660,210 L720,310 L780,228 L840,300 L870,240" fill="none" stroke="var(--dim)" stroke-width="3"/>
<line x1="120" y1="300" x2="880" y2="300" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="120" y1="376" x2="880" y2="376" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="232" y1="290" x2="252" y2="310" stroke="var(--warn)" stroke-width="3"/>
<line x1="252" y1="290" x2="232" y2="310" stroke="var(--warn)" stroke-width="3"/>
<line x1="472" y1="290" x2="492" y2="310" stroke="var(--warn)" stroke-width="3"/>
<line x1="492" y1="290" x2="472" y2="310" stroke="var(--warn)" stroke-width="3"/>
<line x1="712" y1="290" x2="732" y2="310" stroke="var(--warn)" stroke-width="3"/>
<line x1="732" y1="290" x2="712" y2="310" stroke="var(--warn)" stroke-width="3"/>
<text class="f8-b f8-s" x="880" y="352" text-anchor="end" fill="var(--warn)">Psychological stop</text>
<text class="f8-b f8-s" x="880" y="404" text-anchor="end" fill="var(--accent)">Market stop</text>
<text class="f8-b f8-c" x="60" y="466">Moods change, volatility doesn't</text>
</svg>
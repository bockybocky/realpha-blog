<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上排四根等高的柱子，下排第一根被墊得特別高、後面三根明顯凹下去，一條弧線把後面的量搬到最前面">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<text class="t" x="60" y="60">需求是真的，只是被搬到今天</text>
<text class="g" x="120" y="112">原本的節奏</text>
<rect x="200" y="130" width="90" height="120" fill="var(--grey)"/>
<rect x="340" y="130" width="90" height="120" fill="var(--grey)"/>
<rect x="480" y="130" width="90" height="120" fill="var(--grey)"/>
<rect x="620" y="130" width="90" height="120" fill="var(--grey)"/>
<line x1="180" y1="250" x2="760" y2="250" stroke="var(--line)" stroke-width="1.5"/>
<text class="g" x="120" y="322">拉前之後</text>
<rect x="200" y="250" width="90" height="220" fill="var(--accent)"/>
<rect x="340" y="360" width="90" height="110" fill="var(--grey)"/>
<rect x="480" y="410" width="90" height="60" fill="var(--grey)"/>
<rect x="620" y="400" width="90" height="70" fill="var(--grey)"/>
<path d="M665,340 C 640,290 400,270 260,262" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<polygon points="246,260 268,250 266,272" fill="var(--warn)"/>
<line x1="180" y1="470" x2="760" y2="470" stroke="var(--line)" stroke-width="1.5"/>
<text class="s a" x="245" y="496" text-anchor="middle">今年</text>
<text class="s" x="385" y="496" text-anchor="middle">明年</text>
<text class="s" x="525" y="496" text-anchor="middle">後年</text>
<text class="s" x="665" y="496" text-anchor="middle">再後年</text>
<text class="c" x="60" y="536">不會歸零，會讓後面幾年凹下去</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three bars of very different lengths, the two shortest labeled failed and the longest labeled done right">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Quota eaten × did it work</text>
<text x="60" y="94" font-size="16" fill="var(--dim)">3 runs on one machine</text>

<text x="60" y="176" font-size="20" fill="var(--ink)">5.6 Luna</text>
<rect x="260" y="148" width="420" height="44" fill="var(--card)" stroke="var(--line)"/>
<rect x="260" y="148" width="21" height="44" fill="var(--grey)"/>
<text x="295" y="176" font-size="16" fill="var(--dim)">1%</text>
<text x="730" y="176" font-size="16" fill="var(--warn)">Broke it</text>

<text x="60" y="276" font-size="20" fill="var(--ink)">5.6 Terra</text>
<rect x="260" y="248" width="420" height="44" fill="var(--card)" stroke="var(--line)"/>
<rect x="260" y="248" width="126" height="44" fill="var(--grey)"/>
<text x="400" y="276" font-size="16" fill="var(--dim)">6%</text>
<text x="730" y="276" font-size="16" fill="var(--warn)">Under 1/3</text>

<text x="60" y="376" font-size="20" fill="var(--ink)">GPT6</text>
<rect x="260" y="348" width="420" height="44" fill="var(--card)" stroke="var(--line)"/>
<rect x="260" y="348" width="368" height="44" fill="var(--accent)"/>
<text x="642" y="376" font-size="16" fill="var(--dim)">15–20%</text>
<text x="730" y="376" font-size="16" fill="var(--accent)">Right, slow</text>

<text x="60" y="460" font-size="22" fill="var(--ink)">Saved quota, nothing finished</text>
</svg>
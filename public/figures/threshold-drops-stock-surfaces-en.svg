<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Two panels: the same three dots move from below the line to above it because the threshold line dropped">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text x="48" y="54" font-size="27" fill="var(--ink)">Already here</text>

  <rect x="48" y="90" width="400" height="380" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="512" y="90" width="400" height="380" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text x="72" y="126" font-size="19" fill="var(--dim)">Then</text>
  <text x="536" y="126" font-size="19" fill="var(--accent)">Now</text>

  <line x1="48" y1="180" x2="448" y2="180" stroke="var(--grey)" stroke-width="3"/>
  <text x="424" y="170" font-size="15" fill="var(--dim)" text-anchor="end">Economic</text>

  <line x1="512" y1="430" x2="912" y2="430" stroke="var(--accent)" stroke-width="3"/>
  <text x="888" y="420" font-size="15" fill="var(--accent)" text-anchor="end">Economic</text>

  <circle cx="110" cy="250" r="9" fill="var(--grey)"/>
  <text x="134" y="256" font-size="16" fill="var(--dim)">Byproduct</text>
  <circle cx="110" cy="320" r="9" fill="var(--grey)"/>
  <text x="134" y="326" font-size="16" fill="var(--dim)">Red mud</text>
  <circle cx="110" cy="390" r="9" fill="var(--grey)"/>
  <text x="134" y="396" font-size="16" fill="var(--dim)">Existing</text>

  <circle cx="574" cy="250" r="9" fill="var(--accent)"/>
  <text x="598" y="256" font-size="16" fill="var(--ink)">Byproduct</text>
  <circle cx="574" cy="320" r="9" fill="var(--accent)"/>
  <text x="598" y="326" font-size="16" fill="var(--ink)">Red mud</text>
  <circle cx="574" cy="390" r="9" fill="var(--accent)"/>
  <text x="598" y="396" font-size="16" fill="var(--ink)">Existing</text>

  <polygon points="466,272 466,288 496,280" fill="var(--dim)"/>

  <text x="512" y="504" font-size="16" fill="var(--dim)">12 months · 5 firms</text>
  <text x="48" y="562" font-size="22" fill="var(--ink)">Same thing, lower bar</text>
</svg>
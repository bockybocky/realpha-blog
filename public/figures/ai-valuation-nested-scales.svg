<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="層層內嵌的四個方框，由外而內分別是市場想像、估值、虧損、營收，最內層的營收方框小到近乎一個點">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text class="t" x="80" y="62">一個故事套一個故事</text>

  <rect x="80" y="92" width="560" height="420" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="100" y="124">28 兆｜市場想像</text>
  <text class="b" x="100" y="150">比歐洲整年的產出還大</text>

  <rect x="140" y="188" width="380" height="286" rx="8" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text class="g" x="160" y="220" fill="var(--accent)">2 兆｜估值</text>

  <rect x="200" y="258" width="150" height="178" rx="6" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <text class="g" x="216" y="290" fill="var(--warn)">420 億</text>
  <text class="b" x="216" y="314">營業虧損</text>

  <rect x="226" y="350" width="22" height="22" rx="3" fill="var(--ink)"/>
  <text class="b" x="258" y="368">45 億｜營收</text>

  <text class="g" x="700" y="268">對照</text>
  <text class="b" x="700" y="300">公開市場那邊</text>
  <text class="c" x="700" y="342">16 倍</text>
  <text class="b" x="700" y="372">消費必需品的水位</text>

  <text class="b" x="80" y="552">面積只是示意，不是等比例</text>
</svg>
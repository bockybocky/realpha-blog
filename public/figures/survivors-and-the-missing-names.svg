<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="等待回本年數的橫條由短到長排列，Nokia 的條沒有抵達終點，下方灰區是兩家破產歸零、因此不會出現在這張表上的公司">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">回到高點要等幾年</text>
  <text class="t" x="60" y="100" font-size="19" fill="var(--dim)">活下來的</text>
  <rect x="200" y="118" width="190" height="26" fill="var(--accent)"/>
  <text class="t" x="60" y="138" font-size="16" fill="var(--ink)">亞馬遜</text>
  <text class="t" x="400" y="138" font-size="16" fill="var(--dim)">10 年</text>
  <rect x="200" y="156" width="266" height="26" fill="var(--accent)"/>
  <text class="t" x="60" y="176" font-size="16" fill="var(--ink)">高通</text>
  <text class="t" x="476" y="176" font-size="16" fill="var(--dim)">14 年</text>
  <rect x="200" y="194" width="285" height="26" fill="var(--accent)"/>
  <text class="t" x="60" y="214" font-size="16" fill="var(--ink)">微軟</text>
  <text class="t" x="495" y="214" font-size="16" fill="var(--dim)">15 年</text>
  <rect x="200" y="232" width="285" height="26" fill="var(--accent)"/>
  <text class="t" x="60" y="252" font-size="16" fill="var(--ink)">甲骨文</text>
  <text class="t" x="495" y="252" font-size="16" fill="var(--dim)">15 年</text>
  <rect x="200" y="270" width="342" height="26" fill="var(--accent)"/>
  <text class="t" x="60" y="290" font-size="16" fill="var(--ink)">英特爾</text>
  <text class="t" x="552" y="290" font-size="16" fill="var(--dim)">18 年</text>
  <rect x="200" y="308" width="399" height="26" fill="var(--accent)"/>
  <text class="t" x="60" y="328" font-size="16" fill="var(--ink)">思科</text>
  <text class="t" x="609" y="328" font-size="16" fill="var(--dim)">21 年</text>
  <rect x="200" y="346" width="500" height="26" fill="var(--warn)"/>
  <polygon points="700,346 740,359 700,372" fill="var(--warn)"/>
  <text class="t" x="60" y="366" font-size="16" fill="var(--ink)">Nokia</text>
  <text class="t" x="752" y="366" font-size="16" fill="var(--warn)">還沒回到</text>
  <rect x="60" y="410" width="840" height="100" fill="var(--card)"/>
  <text class="t" x="84" y="446" font-size="19" fill="var(--dim)">不在榜上的</text>
  <text class="t" x="240" y="446" font-size="16" fill="var(--grey)">世界通訊　2002 破產</text>
  <text class="t" x="540" y="446" font-size="16" fill="var(--grey)">安隆　2001 破產</text>
  <text class="t" x="240" y="480" font-size="16" fill="var(--grey)">本金歸零，沒有條可以畫</text>
  <text class="t" x="60" y="552" font-size="22" font-weight="700" fill="var(--ink)">榜上只有活下來的名字</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A thin arrow points to the right and a thicker arrow points to the left.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="66" font-size="27" fill="var(--ink)">More goes out than in</text>
<text x="120" y="140" font-size="19" fill="var(--dim)">Raised</text>
<rect x="120" y="156" width="600" height="44" fill="var(--accent)"/>
<polygon points="720,142 720,214 782,178" fill="var(--accent)"/>
<text x="150" y="186" font-size="16" fill="var(--page)">$22bn in, $30bn+ demand</text>
<text x="180" y="272" font-size="19" fill="var(--dim)">Returned</text>
<rect x="180" y="288" width="600" height="76" fill="var(--grey)"/>
<polygon points="180,274 180,378 118,326" fill="var(--grey)"/>
<text x="212" y="336" font-size="16" fill="var(--ink)">$35 to $40 billion</text>
<text x="120" y="414" font-size="15" fill="var(--dim)">Seeks new home</text>
<text x="60" y="470" font-size="22" fill="var(--ink)">More money isn't more alpha</text>
</svg>
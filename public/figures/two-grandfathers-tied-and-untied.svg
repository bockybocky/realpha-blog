<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩個人像並排：左邊的人被三條線綁在三個重物上留在原地，右邊的人沒有綁任何東西、沿箭頭走出畫面">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="40" y="52" font-size="27" font-weight="700">兩位祖父：綁著的，與沒綁的</text>
<rect x="40" y="90" width="420" height="390" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="90" width="420" height="390" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="250" y="135" font-size="20" font-weight="700" text-anchor="middle">法官：留下</text>
<circle cx="250" cy="185" r="26" fill="var(--grey)"/>
<path d="M205 280 Q250 205 295 280 Z" fill="var(--grey)"/>
<line x1="250" y1="280" x2="130" y2="370" stroke="var(--dim)" stroke-width="3"/>
<line x1="250" y1="280" x2="250" y2="370" stroke="var(--dim)" stroke-width="3"/>
<line x1="250" y1="280" x2="370" y2="370" stroke="var(--dim)" stroke-width="3"/>
<rect x="85" y="370" width="90" height="60" rx="8" fill="var(--dim)"/>
<rect x="205" y="370" width="90" height="60" rx="8" fill="var(--dim)"/>
<rect x="325" y="370" width="90" height="60" rx="8" fill="var(--dim)"/>
<text x="130" y="406" font-size="16" text-anchor="middle" style="fill:var(--page)">國家</text>
<text x="250" y="406" font-size="16" text-anchor="middle" style="fill:var(--page)">退休金</text>
<text x="370" y="406" font-size="16" text-anchor="middle" style="fill:var(--page)">出境稅</text>
<text x="250" y="462" font-size="16" text-anchor="middle" style="fill:var(--warn)">被送往東方</text>
<text x="650" y="135" font-size="20" font-weight="700" text-anchor="middle">牛販：離開</text>
<circle cx="650" cy="185" r="26" fill="var(--accent)"/>
<path d="M605 280 Q650 205 695 280 Z" fill="var(--accent)"/>
<line x1="710" y1="240" x2="880" y2="240" stroke="var(--accent)" stroke-width="4"/>
<path d="M880 226 L906 240 L880 254 Z" fill="var(--accent)"/>
<text x="650" y="360" font-size="16" text-anchor="middle" style="fill:var(--dim)">沒有東西綁住</text>
<text x="710" y="420" font-size="22" font-weight="700" text-anchor="middle" style="fill:var(--accent)">開戰前 72 小時</text>
<text x="480" y="530" font-size="22" font-weight="700" text-anchor="middle">綁得越少，越走得了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條起伏的線上有三個方塊標記，兩個貼在低谷、一個貼在高峰">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="72" font-size="27" fill="var(--ink)">封面出現的位置</text>
<path d="M80 300 C160 230 220 200 280 370 C330 480 380 470 430 330 C470 220 520 170 580 160 C640 150 690 250 760 330 C820 395 860 390 900 360" fill="none" stroke="var(--accent)" stroke-width="4"/>
<rect x="238" y="400" width="96" height="62" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="286" y="437" font-size="16" fill="var(--ink)" text-anchor="middle">1965</text>
<line x1="286" y1="400" x2="286" y2="376" stroke="var(--grey)" stroke-width="2"/>
<text x="286" y="490" font-size="16" fill="var(--dim)" text-anchor="middle">落在低點</text>
<rect x="382" y="492" width="96" height="40" fill="none"/>
<rect x="356" y="400" width="0" height="0" fill="none"/>
<rect x="382" y="398" width="96" height="62" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="430" y="435" font-size="16" fill="var(--ink)" text-anchor="middle">1974</text>
<line x1="430" y1="398" x2="430" y2="340" stroke="var(--grey)" stroke-width="2"/>
<rect x="532" y="70" width="96" height="62" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="580" y="107" font-size="16" fill="var(--ink)" text-anchor="middle">1979</text>
<line x1="580" y1="132" x2="580" y2="158" stroke="var(--warn)" stroke-width="2"/>
<text x="580" y="152" font-size="16" fill="var(--warn)" text-anchor="middle"> </text>
<text x="645" y="112" font-size="16" fill="var(--dim)">落在油價的頂</text>
<text x="60" y="520" font-size="22" fill="var(--ink)">故事講到爛熟，封面才印出來</text>
</svg>
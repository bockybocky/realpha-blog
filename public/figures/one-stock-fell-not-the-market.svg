<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條共同的歷史高點虛線往下量，左邊是一塊很深的落差，右邊只有一條薄缺口">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="72" font-size="27" fill="var(--ink)">同一個十天，從各自的高點往下量</text>
<line x1="80" y1="150" x2="900" y2="150" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="80" y="136" font-size="16" fill="var(--dim)">各自的歷史高點</text>
<rect x="170" y="150" width="230" height="260" fill="var(--warn)" opacity="0.18"/>
<rect x="170" y="150" width="230" height="260" fill="none" stroke="var(--warn)" stroke-width="2"/>
<line x1="285" y1="170" x2="285" y2="385" stroke="var(--warn)" stroke-width="3"/>
<path d="M275 372 L285 392 L295 372 Z" fill="var(--warn)"/>
<text x="285" y="300" font-size="22" fill="var(--ink)" text-anchor="middle">23%</text>
<text x="170" y="445" font-size="20" fill="var(--ink)">龍頭個股</text>
<text x="170" y="472" font-size="16" fill="var(--dim)">市值 5.6 兆 → 4 兆美元</text>
<rect x="600" y="150" width="230" height="23" fill="var(--accent)" opacity="0.22"/>
<rect x="600" y="150" width="230" height="23" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="845" y="168" font-size="20" fill="var(--ink)">2%</text>
<line x1="715" y1="173" x2="715" y2="405" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 6"/>
<text x="600" y="445" font-size="20" fill="var(--ink)">標普 500</text>
<text x="600" y="472" font-size="16" fill="var(--dim)">同一段時間</text>
<text x="60" y="525" font-size="22" fill="var(--ink)">跌的是一檔，不是一個市場</text>
</svg>
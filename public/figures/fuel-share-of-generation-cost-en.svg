<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The fuel segment for nuclear is very short, while for coal and gas it stretches to nearly the whole bar.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Fuel as a share of generation cost</text>

<text x="60" y="146" font-size="20" font-weight="700" fill="var(--ink)">Nuclear</text>
<rect x="190" y="120" width="650" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="190" y="120" width="65" height="56" fill="var(--accent)"/>
<rect x="255" y="120" width="98" height="56" fill="var(--grey)"/>
<text x="222" y="204" font-size="16" fill="var(--accent)" text-anchor="middle">Uranium</text>
<text x="304" y="204" font-size="16" fill="var(--dim)" text-anchor="middle">Rest of cycle</text>
<text x="372" y="156" font-size="19" fill="var(--ink)">Whole fuel cycle about 25%</text>

<text x="60" y="286" font-size="20" font-weight="700" fill="var(--ink)">Coal</text>
<rect x="190" y="260" width="650" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="190" y="260" width="553" height="56" fill="var(--warn)"/>
<text x="466" y="296" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">Fuel 80 to 90%</text>

<text x="60" y="376" font-size="20" font-weight="700" fill="var(--ink)">Gas</text>
<rect x="190" y="350" width="650" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="190" y="350" width="553" height="56" fill="var(--warn)"/>
<text x="466" y="386" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">Fuel 80 to 90%</text>

<text x="60" y="462" font-size="19" fill="var(--dim)">Paying too much won't get you fired; running out will</text>
<text x="60" y="496" font-size="22" font-weight="700" fill="var(--ink)">Calling the price is not on this job's scorecard</text>
</svg>
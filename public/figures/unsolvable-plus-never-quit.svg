<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="十格題目中四格無解，無解那條路撞牆後轉彎到讓答案出現">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">三到四成的題目，本來就沒有答案</text>
<text x="110" y="120" font-size="19" fill="var(--dim)">可解</text>
<text x="558" y="120" font-size="19" fill="var(--warn)">無解</text>
<rect x="110" y="134" width="54" height="54" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="178" y="134" width="54" height="54" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="246" y="134" width="54" height="54" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="314" y="134" width="54" height="54" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="382" y="134" width="54" height="54" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="450" y="134" width="54" height="54" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="558" y="134" width="54" height="54" rx="6" fill="var(--warn)" fill-opacity="0.2" stroke="var(--warn)" stroke-width="2"/>
<rect x="626" y="134" width="54" height="54" rx="6" fill="var(--warn)" fill-opacity="0.2" stroke="var(--warn)" stroke-width="2"/>
<rect x="694" y="134" width="54" height="54" rx="6" fill="var(--warn)" fill-opacity="0.2" stroke="var(--warn)" stroke-width="2"/>
<rect x="762" y="134" width="54" height="54" rx="6" fill="var(--warn)" fill-opacity="0.2" stroke="var(--warn)" stroke-width="2"/>
<rect x="110" y="228" width="706" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="132" y="257" font-size="19" fill="var(--ink)">訓練出來的性格：不准放棄</text>
<line x1="300" y1="272" x2="300" y2="348" stroke="var(--grey)" stroke-width="3"/>
<polygon points="300,356 292,342 308,342" fill="var(--grey)"/>
<rect x="200" y="360" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="252" y="398" font-size="19" fill="var(--ink)">解題</text>
<line x1="660" y1="272" x2="660" y2="330" stroke="var(--warn)" stroke-width="3"/>
<line x1="580" y1="338" x2="740" y2="338" stroke="var(--warn)" stroke-width="6"/>
<text x="756" y="344" font-size="16" fill="var(--warn)">走不通</text>
<path d="M660 338 L660 352 L540 352 L540 400" fill="none" stroke="var(--accent)" stroke-width="3"/>
<polygon points="540,408 532,394 548,394" fill="var(--accent)"/>
<rect x="440" y="412" width="240" height="60" rx="8" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<text x="492" y="450" font-size="19" fill="var(--ink)">讓答案出現</text>
<text x="60" y="522" font-size="22" fill="var(--ink)">無解 ＋ 不准放棄 ＝ 只剩繞路</text>
</svg>
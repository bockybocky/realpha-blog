<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The label on the left is a single line, the capability list in the middle has six items, and two of them connect to what the next generation needs on the right.">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #b9c2d0;
      --accent: #1f6feb;
      --accbg:  #eef2f9;
      --warn:   #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #4a5464;
        --accent: #58a6ff;
        --accbg:  #12233d;
        --warn:   #d29922;
      }
    }
    .t     { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1    { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .col   { font-size: 17px; font-weight: 700; fill: var(--dim); }
    .lab   { font-size: 18px; font-weight: 700; fill: var(--dim); }
    .item  { font-size: 16px; fill: var(--dim); }
    .hit   { font-size: 16px; font-weight: 700; fill: var(--accent); }
    .need  { font-size: 16px; font-weight: 700; fill: var(--accent); }
    .kick  { font-size: 22px; font-weight: 700; fill: var(--ink); }
  </style>

  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <g class="t">
    <text x="480" y="44" class="h1" text-anchor="middle">Which one tells you it is obsolete?</text>

    <!-- 欄標 -->
    <text x="150" y="94" class="col" text-anchor="middle">Label</text>
    <text x="450" y="94" class="col" text-anchor="middle">Capability list</text>
    <text x="810" y="94" class="col" text-anchor="middle">What the next gen needs</text>

    <!-- 左：標籤，只有一行、框很小 -->
    <rect x="50" y="230" width="200" height="52" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="150" y="262" class="lab" text-anchor="middle">A nearly ten-year-old node</text>

    <!-- 中：能力清單，框很大 -->
    <rect x="300" y="110" width="300" height="300" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
    <circle cx="326" cy="152" r="5" fill="var(--accent)"/>
    <text x="342" y="158" class="hit">Lay the dozen upper layers</text>
    <circle cx="326" cy="200" r="5" fill="var(--accent)"/>
    <text x="342" y="206" class="hit">Old DUV tools</text>
    <circle cx="326" cy="248" r="5" fill="var(--grey)"/>
    <text x="342" y="254" class="item">Mature yield management</text>
    <circle cx="326" cy="296" r="5" fill="var(--grey)"/>
    <text x="342" y="302" class="item">Run a full new-gen recipe</text>
    <circle cx="326" cy="344" r="5" fill="var(--grey)"/>
    <text x="342" y="350" class="item">The two finest metal layers</text>
    <circle cx="326" cy="386" r="5" fill="var(--grey)"/>
    <text x="342" y="392" class="item">Leading-edge transistors</text>

    <!-- 右：下一代需求 -->
    <rect x="700" y="126" width="220" height="120" rx="6" fill="var(--accbg)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="722" y="164" class="need">Those top layers</text>
    <text x="722" y="194" class="need">Capacity buffer</text>
    <text x="722" y="226" class="item">(new fab: 2 years)</text>

    <!-- 連線：只有兩項連得上 -->
    <path d="M600,152 C650,152 660,160 700,160" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <path d="M600,200 C650,200 660,190 700,186" fill="none" stroke="var(--accent)" stroke-width="2.5"/>

    <!-- 標籤連不上：畫一條斷掉的線 -->
    <path d="M250,256 C280,256 288,256 300,256" fill="none" stroke="var(--line)" stroke-width="2"/>

    <text x="480" y="466" class="kick" text-anchor="middle">A label is one line; a list is a table.</text>
    <text x="480" y="506" class="kick" text-anchor="middle">We judge people and tools by that one line.</text>
  </g>
</svg>

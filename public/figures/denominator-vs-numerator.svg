<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩個分數式並列，左邊變動的是分數線下方的方塊，右邊變動的是上方的方塊">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:19px;fill:var(--ink)}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">同樣是下跌，動的不是同一格</text>
<text class="g" x="260" y="120" text-anchor="middle">估值被壓</text>
<text class="g" x="700" y="120" text-anchor="middle">賺得變少</text>
<rect x="180" y="160" width="160" height="70" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="260" y="202" text-anchor="middle">未來現金流</text>
<line x1="150" y1="262" x2="370" y2="262" stroke="var(--ink)" stroke-width="3"/>
<rect x="160" y="292" width="200" height="100" fill="var(--accent)"/>
<text class="s" x="260" y="348" text-anchor="middle" fill="var(--page)">利率</text>
<rect x="655" y="180" width="90" height="46" fill="var(--warn)"/>
<text class="s" x="700" y="166" text-anchor="middle">未來現金流</text>
<line x1="590" y1="262" x2="810" y2="262" stroke="var(--ink)" stroke-width="3"/>
<rect x="620" y="292" width="160" height="70" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="700" y="334" text-anchor="middle">利率</text>
<text class="s" x="260" y="440" text-anchor="middle">分母的事</text>
<text class="s" x="700" y="440" text-anchor="middle">分子的事</text>
<text class="c" x="60" y="500">先問這一季的營收有沒有變差</text>
</svg>
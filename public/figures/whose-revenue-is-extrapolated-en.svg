<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A bar in three equal thirds, the third one cut into an 80% segment, showing that only one third is being extrapolated.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">What gets extrapolated is only one slice</text>

<rect x="60" y="150" width="280" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="340" y="150" width="280" height="110" fill="var(--warn)" opacity="0.28" stroke="var(--line)" stroke-width="2"/>
<rect x="620" y="150" width="280" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="200" y="196" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Classic compute</text>
<text class="t" x="200" y="226" font-size="15" fill="var(--dim)" text-anchor="middle">Data, simulation, fraud, recsys</text>
<text class="t" x="480" y="196" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Frontier labs</text>
<text class="t" x="480" y="226" font-size="15" fill="var(--dim)" text-anchor="middle">Five or six</text>
<text class="t" x="760" y="196" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">A thousand startups</text>
<text class="t" x="760" y="226" font-size="15" fill="var(--dim)" text-anchor="middle">Verticals</text>

<text class="t" x="200" y="134" font-size="16" fill="var(--dim)" text-anchor="middle">About one third</text>
<text class="t" x="480" y="134" font-size="16" fill="var(--dim)" text-anchor="middle">About one third</text>
<text class="t" x="760" y="134" font-size="16" fill="var(--dim)" text-anchor="middle">About one third</text>

<rect x="620" y="286" width="224" height="44" fill="var(--accent)" opacity="0.3" stroke="var(--line)"/>
<rect x="844" y="286" width="56" height="44" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="732" y="314" font-size="16" fill="var(--ink)" text-anchor="middle">80% of them on open models</text>
<line x1="620" y1="260" x2="620" y2="286" stroke="var(--line)"/>
<line x1="900" y1="260" x2="900" y2="286" stroke="var(--line)"/>

<rect x="340" y="384" width="280" height="68" rx="10" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
<text class="t" x="480" y="426" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Most models extrapolate this cell</text>

<text class="t" x="60" y="508" font-size="22" font-weight="700" fill="var(--ink)">Fearing it all rides on one cell is the signal to change the question</text>
</svg>
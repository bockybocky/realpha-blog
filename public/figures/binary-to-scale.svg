<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊兩個被虛線切開的灰格，右邊一條帶刻度的長帶，兩端風險中間區間，兩個標記落在兩端">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); }
    .g  { font-size:19px; fill:var(--dim); }
    .s  { font-size:15px; fill:var(--dim); }
    .c  { font-size:22px; fill:var(--ink); }
</style>
<text class="ti" x="80" y="62">二分線換成刻度</text>
<text class="g" x="90" y="190">之前</text>
<rect x="90" y="214" width="140" height="96" rx="6" fill="var(--grey)" fill-opacity="0.45" stroke="var(--grey)" stroke-width="2"/>
<rect x="268" y="214" width="140" height="96" rx="6" fill="var(--grey)" fill-opacity="0.45" stroke="var(--grey)" stroke-width="2"/>
<line x1="249" y1="186" x2="249" y2="344" stroke="var(--ink)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="s" x="160" y="268" text-anchor="middle">不曬</text>
<text class="s" x="338" y="268" text-anchor="middle">曬</text>
<text class="s" x="249" y="368" text-anchor="middle">只有兩格</text>
<path d="M434 262 L 492 262" stroke="var(--accent)" stroke-width="3"/>
<path d="M492 262 l -12 -7 l 0 14 Z" fill="var(--accent)"/>
<text class="g" x="524" y="190">之後</text>
<rect x="524" y="248" width="76" height="28" fill="var(--warn)"/>
<rect x="600" y="248" width="220" height="28" fill="var(--accent)"/>
<rect x="820" y="248" width="76" height="28" fill="var(--warn)"/>
<line x1="600" y1="276" x2="600" y2="294" stroke="var(--dim)" stroke-width="2"/>
<line x1="820" y1="276" x2="820" y2="294" stroke="var(--dim)" stroke-width="2"/>
<text class="s" x="600" y="314" text-anchor="middle">0</text>
<text class="s" x="820" y="314" text-anchor="middle">90</text>
<text class="s" x="562" y="340" text-anchor="middle">不足</text>
<text class="s" x="710" y="340" text-anchor="middle">區間</text>
<text class="s" x="858" y="340" text-anchor="middle">過量</text>
<path d="M548 228 l 9 16 l -18 0 Z" fill="var(--ink)"/>
<path d="M872 228 l 9 16 l -18 0 Z" fill="var(--ink)"/>
<text class="s" x="548" y="218" text-anchor="middle">繼父</text>
<text class="s" x="872" y="218" text-anchor="middle">生父</text>
<text class="c" x="80" y="462">兩端都是風險，中間才有刻度</text>
</svg>
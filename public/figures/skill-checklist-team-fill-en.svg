<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="In the top row of eight skill boxes, you fill only four and four stay empty; in the bottom row the same eight boxes are all filled, with the gaps covered by colleagues, direct reports, outside friends, and AI.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
    .p { fill:var(--page); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="480" y="60" text-anchor="middle" class="t">Others fill gaps</text>
<text x="555" y="125" text-anchor="middle" class="s">Skills needed</text>
<text x="60" y="192" class="g">Just me</text>
<rect x="200" y="150" width="80" height="70" rx="6" fill="var(--accent)"/>
<rect x="290" y="150" width="80" height="70" rx="6" fill="var(--accent)"/>
<rect x="380" y="150" width="80" height="70" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="470" y="150" width="80" height="70" rx="6" fill="var(--accent)"/>
<rect x="560" y="150" width="80" height="70" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="650" y="150" width="80" height="70" rx="6" fill="var(--accent)"/>
<rect x="740" y="150" width="80" height="70" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="830" y="150" width="80" height="70" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="240" y="191" text-anchor="middle" class="b p">Me</text>
<text x="330" y="191" text-anchor="middle" class="b p">Me</text>
<text x="420" y="191" text-anchor="middle" class="b w">Gap</text>
<text x="510" y="191" text-anchor="middle" class="b p">Me</text>
<text x="600" y="191" text-anchor="middle" class="b w">Gap</text>
<text x="690" y="191" text-anchor="middle" class="b p">Me</text>
<text x="780" y="191" text-anchor="middle" class="b w">Gap</text>
<text x="870" y="191" text-anchor="middle" class="b w">Gap</text>
<text x="60" y="342" class="g">The team</text>
<rect x="200" y="300" width="80" height="70" rx="6" fill="var(--accent)"/>
<rect x="290" y="300" width="80" height="70" rx="6" fill="var(--accent)"/>
<rect x="380" y="300" width="80" height="70" rx="6" fill="var(--grey)"/>
<rect x="470" y="300" width="80" height="70" rx="6" fill="var(--accent)"/>
<rect x="560" y="300" width="80" height="70" rx="6" fill="var(--grey)"/>
<rect x="650" y="300" width="80" height="70" rx="6" fill="var(--accent)"/>
<rect x="740" y="300" width="80" height="70" rx="6" fill="var(--grey)"/>
<rect x="830" y="300" width="80" height="70" rx="6" fill="var(--grey)"/>
<text x="240" y="341" text-anchor="middle" class="b p">Me</text>
<text x="330" y="341" text-anchor="middle" class="b p">Me</text>
<text x="420" y="341" text-anchor="middle" class="b">Peer</text>
<text x="510" y="341" text-anchor="middle" class="b p">Me</text>
<text x="600" y="341" text-anchor="middle" class="b">Staff</text>
<text x="690" y="341" text-anchor="middle" class="b p">Me</text>
<text x="780" y="341" text-anchor="middle" class="b">Ally</text>
<text x="870" y="341" text-anchor="middle" class="b">AI</text>
<text x="480" y="470" text-anchor="middle" class="c">Not all on you</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條向右上的線從零線下方的負十五趴穿過零線爬到正三十五趴">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="80" y="60" font-size="27" font-weight="700">毛利率往哪個方向走</text>
<line x1="160" y1="330" x2="880" y2="330" stroke="var(--line)" stroke-width="3"/>
<text x="100" y="336" font-size="16" fill="var(--dim)">零</text>
<line x1="240" y1="390" x2="760" y2="190" stroke="var(--accent)" stroke-width="5"/>
<polygon points="760,190 796,178 778,214" fill="var(--accent)"/>
<circle cx="240" cy="390" r="12" fill="var(--warn)"/>
<text x="186" y="432" font-size="20" font-weight="700" fill="var(--warn)">負十五趴</text>
<circle cx="760" cy="190" r="12" fill="var(--accent)"/>
<text x="700" y="160" font-size="20" font-weight="700" fill="var(--accent)">正三十五趴</text>
<text x="240" y="470" font-size="16" fill="var(--dim)">他自己投的一批公司</text>
</svg>
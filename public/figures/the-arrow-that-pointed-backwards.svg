<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩格對比，箭頭方向相反：常態由下往上求綠燈，這次由電視台的保證往外發出">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="80" y="68">箭頭倒過來的那一次</text>
<text class="b" x="80" y="116">好萊塢常態</text>
<rect x="80" y="134" width="210" height="72" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="104" y="178">製作公司</text>
<rect x="640" y="134" width="210" height="72" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="664" y="178">電視台</text>
<path d="M300 170 L628 170" stroke="var(--grey)" stroke-width="4"/>
<path d="M628 170 l-18 -12 l0 24 z" fill="var(--grey)"/>
<text class="b" x="364" y="156">自掏錢拍試播集，求綠燈</text>
<line x1="80" y1="250" x2="900" y2="250" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="80" y="298">1988</text>
<rect x="640" y="316" width="210" height="72" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="664" y="360" fill="var(--accent)">電視台</text>
<rect x="360" y="316" width="210" height="72" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="384" y="360">創作者</text>
<rect x="80" y="316" width="210" height="72" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="104" y="360">任選製作公司</text>
<path d="M628 352 L582 352" stroke="var(--accent)" stroke-width="4"/>
<path d="M582 352 l18 -12 l0 24 z" fill="var(--accent)"/>
<path d="M348 352 L302 352" stroke="var(--accent)" stroke-width="4"/>
<path d="M302 352 l18 -12 l0 24 z" fill="var(--accent)"/>
<text class="b" x="586" y="414">保證做、保證播</text>
<text class="b" x="306" y="414">拿保證書去敲門</text>
<text class="c" x="80" y="492">條件由誰寫，看保證書在誰手上</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three bars of similar height side by side labelled 100%, 80% and 70%, the first only slightly taller than the second.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .n { font-size:34px; font-weight:700; fill:var(--ink); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">Size shows only in the line-up</text>
  <text class="b" x="60" y="94">Same period, same unit: two-year bit shipment growth</text>
  <rect x="140" y="180" width="140" height="240" fill="var(--accent)"/>
  <rect x="400" y="228" width="140" height="192" fill="var(--grey)"/>
  <rect x="660" y="252" width="140" height="168" fill="var(--grey)"/>
  <text class="n" x="140" y="168" fill="var(--accent)">100%</text>
  <text class="n" x="400" y="216">80%</text>
  <text class="n" x="660" y="240">70%</text>
  <text class="g" x="140" y="452">Toshiba</text>
  <text class="g" x="400" y="452">Seagate</text>
  <text class="g" x="660" y="452">WD</text>
  <path d="M100 420 L860 420" stroke="var(--line)" stroke-width="2"/>
  <text class="c" x="60" y="506">First place, 20 points over second</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="水面線上方一小塊為帳面已認列，下方大三倍的一塊為表外義務" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">帳面上的，只是水面上那塊</text>

<rect x="400" y="150" width="180" height="100" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="490" y="196" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">帳面上</text>
<text x="490" y="226" font-size="15" fill="var(--dim)" text-anchor="middle">已認列</text>

<line x1="120" y1="250" x2="840" y2="250" stroke="var(--accent)" stroke-width="3"/>
<text x="130" y="240" font-size="19" fill="var(--accent)">資產負債表</text>

<rect x="330" y="250" width="320" height="230" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="490" y="300" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">表外</text>
<text x="490" y="348" font-size="16" fill="var(--ink)" text-anchor="middle">尚未開始的租約</text>
<text x="490" y="384" font-size="16" fill="var(--ink)" text-anchor="middle">採購承諾</text>
<text x="490" y="430" font-size="15" fill="var(--dim)" text-anchor="middle">真實槓桿</text>

<line x1="700" y1="152" x2="700" y2="248" stroke="var(--grey)" stroke-width="2"/>
<text x="720" y="206" font-size="19" fill="var(--dim)">1</text>
<line x1="700" y1="252" x2="700" y2="478" stroke="var(--grey)" stroke-width="2"/>
<text x="720" y="372" font-size="19" fill="var(--dim)">3</text>

<text x="480" y="516" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">露出來的那塊，不是全部</text>
</svg>
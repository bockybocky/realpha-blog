<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left a generation inside a fixed box is replaced; on the right generations stack up layer by layer, contrasting the two shapes.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">Replace, or accumulate</text>

<rect x="50" y="100" width="420" height="350" rx="14" fill="var(--card)"/>
<text x="70" y="140" font-size="20" font-weight="700" fill="var(--dim)">Memory: cleanroom reuse</text>

<rect x="80" y="170" width="140" height="180" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="100" y="230" width="100" height="100" rx="4" fill="var(--grey)"/>
<text x="150" y="288" font-size="16" fill="var(--page)" text-anchor="middle">Old gen</text>
<text x="150" y="162" font-size="15" fill="var(--dim)" text-anchor="middle">Fixed area</text>

<path d="M235 270 L285 270" stroke="var(--dim)" stroke-width="3"/>
<path d="M285 270 l-12 -7 v14 z" fill="var(--dim)"/>
<text x="260" y="252" font-size="15" fill="var(--dim)" text-anchor="middle">Cleared out</text>

<rect x="300" y="170" width="140" height="180" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="320" y="230" width="100" height="100" rx="4" fill="var(--accent)"/>
<text x="370" y="288" font-size="16" fill="var(--page)" text-anchor="middle">New gen</text>
<text x="370" y="162" font-size="15" fill="var(--dim)" text-anchor="middle">Fixed area</text>

<text x="80" y="398" font-size="16" fill="var(--dim)">Old gen leaves the market</text>
<text x="80" y="424" font-size="16" fill="var(--dim)">Each generation sells once</text>

<rect x="500" y="100" width="410" height="350" rx="14" fill="var(--card)"/>
<text x="520" y="140" font-size="20" font-weight="700" fill="var(--dim)">Foundry: legacy nodes stay leased</text>

<rect x="560" y="300" width="290" height="46" rx="4" fill="var(--grey)"/>
<text x="705" y="331" font-size="16" fill="var(--page)" text-anchor="middle">Legacy node</text>
<rect x="560" y="248" width="290" height="46" rx="4" fill="var(--grey)"/>
<text x="705" y="279" font-size="16" fill="var(--page)" text-anchor="middle">Prior gen</text>
<rect x="560" y="196" width="290" height="46" rx="4" fill="var(--accent)"/>
<text x="705" y="227" font-size="16" fill="var(--page)" text-anchor="middle">Leading node</text>

<text x="560" y="398" font-size="16" fill="var(--dim)">All still earning rent</text>
<text x="560" y="424" font-size="16" fill="var(--dim)">One generation pays for years</text>

<text x="60" y="508" font-size="22" font-weight="700" fill="var(--ink)">Only growing area makes keeping old lines an option</text>
</svg>
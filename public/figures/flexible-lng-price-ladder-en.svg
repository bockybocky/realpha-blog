<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A three-step ladder where the cargo arrow lands on Europe, the highest bidder, while Pakistan and Bangladesh on the lowest step get zero.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .u { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="56">"Flexible" means: highest bidder gets it first</text>
<rect x="150" y="150" width="240" height="120" fill="var(--accent)" rx="6"/>
<text class="g" x="180" y="196" fill="var(--page)">Europe</text>
<text class="g" x="180" y="232" fill="var(--page)">Highest bid</text>
<rect x="390" y="270" width="240" height="110" fill="var(--warn)" rx="6"/>
<text class="g" x="420" y="316" fill="var(--page)">Asia</text>
<text class="g" x="420" y="350" fill="var(--page)">Chasing up</text>
<rect x="630" y="380" width="240" height="100" fill="var(--card)" stroke="var(--line)" stroke-width="2" rx="6"/>
<text class="g" x="660" y="424">Pakistan</text>
<text class="g" x="660" y="456">Bangladesh</text>
<text class="c" x="700" y="516">Zero</text>
<path d="M 270 100 L 270 142" stroke="var(--ink)" stroke-width="3" fill="none"/>
<path d="M 262 132 L 270 146 L 278 132 Z" fill="var(--ink)"/>
<text class="c" x="300" y="118">Cargoes</text>
<line x1="120" y1="150" x2="120" y2="480" stroke="var(--line)" stroke-width="2"/>
<text class="u" x="96" y="160" text-anchor="end">High bid</text>
<text class="u" x="96" y="476" text-anchor="end">Low bid</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上組兩根長條完全重疊、右側留一塊虛框空白；下組第二根長條往右錯開，蓋滿右側">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="480" y="56" text-anchor="middle" class="t">同一個模子，盲點也一樣</text>
<text x="560" y="100" text-anchor="middle" class="s">看得到的狀況</text>
<text x="60" y="162" class="g">同一個模子</text>
<text x="228" y="141" text-anchor="end" class="s">前任</text>
<text x="228" y="181" text-anchor="end" class="s">接班人</text>
<rect x="240" y="120" width="384" height="30" rx="4" fill="var(--grey)"/>
<rect x="240" y="160" width="384" height="30" rx="4" fill="var(--accent)"/>
<rect x="630" y="114" width="250" height="82" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text x="755" y="162" text-anchor="middle" class="g w">盲點</text>
<line x1="60" y1="245" x2="900" y2="245" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="342" class="g">背景不同</text>
<text x="228" y="321" text-anchor="end" class="s">前任</text>
<text x="228" y="361" text-anchor="end" class="s">接班人</text>
<rect x="240" y="300" width="384" height="30" rx="4" fill="var(--grey)"/>
<rect x="496" y="340" width="384" height="30" rx="4" fill="var(--accent)"/>
<text x="755" y="402" text-anchor="middle" class="b a">空白被補上</text>
<text x="480" y="470" text-anchor="middle" class="c">變化快時，這塊空白才要命</text>
<text x="480" y="504" text-anchor="middle" class="s">變化慢的產業，延續性有價值</text>
</svg>
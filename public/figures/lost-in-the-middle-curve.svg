<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="U 形曲線：開頭與結尾高、中段明顯下陷">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">中段最容易掉</text>
<line x1="110" y1="140" x2="110" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="110" y1="400" x2="890" y2="400" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="82" y="270" text-anchor="middle" transform="rotate(-90 82 270)">被記得的程度</text>
<path d="M140 190 C300 200 350 350 490 352 C630 354 700 212 850 200" fill="none" stroke="var(--accent)" stroke-width="3"/>
<circle cx="140" cy="190" r="6" fill="var(--accent)"/>
<circle cx="490" cy="352" r="6" fill="var(--accent)"/>
<circle cx="850" cy="200" r="6" fill="var(--accent)"/>
<text class="b" x="150" y="172">記得住</text>
<text class="b" x="490" y="325" text-anchor="middle">被忽略</text>
<text class="b" x="840" y="180" text-anchor="end">記得住</text>
<text class="g" x="150" y="435" text-anchor="middle">開頭</text>
<text class="g" x="490" y="435" text-anchor="middle">中段</text>
<text class="g" x="840" y="435" text-anchor="middle">結尾</text>
<text class="c" x="60" y="500">重要指令放頭尾　不要塞中間</text>
</svg>
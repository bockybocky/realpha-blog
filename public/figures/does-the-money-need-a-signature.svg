<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="上面的水流經過三道閘門後越縮越細，下面的水流一路等寬，閘門位置只剩被拔掉的虛線空框">
<rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">這筆錢要不要有人簽名</text>
<text class="g" x="60" y="112">CalKids：每一道閘都要人做決定</text>
<polygon points="60,140 300,140 300,220 60,220" fill="var(--grey)"/>
<polygon points="300,152 540,152 540,208 300,208" fill="var(--grey)"/>
<polygon points="540,170 780,170 780,196 540,196" fill="var(--grey)"/>
<polygon points="780,178 900,178 900,190 780,190" fill="var(--grey)"/>
<line x1="300" y1="126" x2="300" y2="234" stroke="var(--warn)" stroke-width="4"/>
<line x1="540" y1="126" x2="540" y2="234" stroke="var(--warn)" stroke-width="4"/>
<line x1="780" y1="126" x2="780" y2="234" stroke="var(--warn)" stroke-width="4"/>
<text class="s" x="192" y="268">爸媽要去開戶</text>
<text class="s" x="412" y="268">只能用在大學</text>
<text class="s" x="648" y="268">卡在爸媽那一關</text>
<text class="s" x="800" y="160">剩下這些</text>
<text class="g" x="60" y="382">530A：閘被拔掉</text>
<rect x="60" y="410" width="840" height="80" fill="var(--accent)"/>
<rect x="300" y="396" width="2" height="108" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="540" y="396" width="2" height="108" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="780" y="396" width="2" height="108" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 8"/>
<text class="s" x="192" y="538">出生自動開戶</text>
<text class="s" x="412" y="538">隔天自動進指數</text>
<text class="s" x="648" y="538">晚認領照樣累積</text>
<text class="c" x="60" y="596">預設值是流過來，還是等人簽名</text>
</svg>
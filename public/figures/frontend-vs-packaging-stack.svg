<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左側單一實心方塊，右側四層堆疊，最底層帶裂痕">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="60" y="64">前段一家做到底，封裝要多家疊起來</text>
<text class="g" x="110" y="140">前段製程</text>
<rect x="110" y="170" width="190" height="260" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="205" y="292" text-anchor="middle">一家</text>
<text class="b" x="205" y="320" text-anchor="middle">2 奈米以下</text>
<text class="b" x="205" y="470" text-anchor="middle">變因少</text>
<line x1="380" y1="130" x2="380" y2="480" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="440" y="140">先進封裝</text>
<rect x="500" y="175" width="80" height="60" rx="4" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<text class="b" x="540" y="211" text-anchor="middle">HBM</text>
<rect x="595" y="175" width="170" height="60" rx="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="680" y="213" text-anchor="middle">GPU</text>
<rect x="780" y="175" width="80" height="60" rx="4" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<text class="b" x="820" y="211" text-anchor="middle">HBM</text>
<rect x="490" y="245" width="380" height="40" rx="4" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<text class="b" x="680" y="271" text-anchor="middle">中介層</text>
<rect x="470" y="295" width="420" height="50" rx="4" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<text class="b" x="680" y="326" text-anchor="middle">載板</text>
<rect x="440" y="355" width="480" height="70" rx="4" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="560" y="398" text-anchor="middle">PCB</text>
<polyline points="700,355 688,375 712,390 694,408 708,425" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="800" y="398" text-anchor="middle" style="fill:var(--warn)">沒做好</text>
<text class="b" x="680" y="470" text-anchor="middle">多家湊在一起・變因多</text>
<text class="c" x="60" y="540">最底層一壞，上面再強也沒用</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一道波束的容量分給一百人還看得見，分給幾萬人後細到看不見">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .g { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="48" y="62" font-size="27" font-weight="700">同一條容量，分給幾個人</text>

  <rect x="48" y="92" width="864" height="40" rx="6" fill="var(--accent)"/>
  <text class="t" x="60" y="120" font-size="19" font-weight="700" fill="var(--page)">一道波束 14 Mbps</text>

  <rect x="48" y="170" width="420" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="76" y="208" font-size="20" font-weight="700">山區 100 人</text>
  <g fill="var(--dim)">
    <rect x="76" y="232" width="34" height="10" rx="3"/><rect x="118" y="232" width="34" height="10" rx="3"/><rect x="160" y="232" width="34" height="10" rx="3"/><rect x="202" y="232" width="34" height="10" rx="3"/><rect x="244" y="232" width="34" height="10" rx="3"/><rect x="286" y="232" width="34" height="10" rx="3"/><rect x="328" y="232" width="34" height="10" rx="3"/><rect x="370" y="232" width="34" height="10" rx="3"/>
    <rect x="76" y="252" width="34" height="10" rx="3"/><rect x="118" y="252" width="34" height="10" rx="3"/><rect x="160" y="252" width="34" height="10" rx="3"/><rect x="202" y="252" width="34" height="10" rx="3"/><rect x="244" y="252" width="34" height="10" rx="3"/><rect x="286" y="252" width="34" height="10" rx="3"/><rect x="328" y="252" width="34" height="10" rx="3"/><rect x="370" y="252" width="34" height="10" rx="3"/>
    <rect x="76" y="272" width="34" height="10" rx="3"/><rect x="118" y="272" width="34" height="10" rx="3"/><rect x="160" y="272" width="34" height="10" rx="3"/><rect x="202" y="272" width="34" height="10" rx="3"/><rect x="244" y="272" width="34" height="10" rx="3"/><rect x="286" y="272" width="34" height="10" rx="3"/><rect x="328" y="272" width="34" height="10" rx="3"/><rect x="370" y="272" width="34" height="10" rx="3"/>
    <rect x="76" y="292" width="34" height="10" rx="3"/><rect x="118" y="292" width="34" height="10" rx="3"/><rect x="160" y="292" width="34" height="10" rx="3"/><rect x="202" y="292" width="34" height="10" rx="3"/><rect x="244" y="292" width="34" height="10" rx="3"/><rect x="286" y="292" width="34" height="10" rx="3"/><rect x="328" y="292" width="34" height="10" rx="3"/><rect x="370" y="292" width="34" height="10" rx="3"/>
  </g>
  <text class="t" x="76" y="372" font-size="22" font-weight="700" fill="var(--accent)">每人 140 kbps</text>
  <text class="g" x="76" y="404" font-size="16">只夠文字訊息</text>

  <rect x="492" y="170" width="420" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="520" y="208" font-size="20" font-weight="700">都市 幾萬人</text>
  <g fill="var(--grey)">
    <rect x="520" y="232" width="364" height="10" rx="3"/>
    <rect x="520" y="248" width="364" height="10" rx="3"/>
    <rect x="520" y="264" width="364" height="10" rx="3"/>
    <rect x="520" y="280" width="364" height="10" rx="3"/>
    <rect x="520" y="296" width="364" height="10" rx="3"/>
    <rect x="520" y="312" width="364" height="10" rx="3"/>
  </g>
  <text class="t" x="520" y="372" font-size="22" font-weight="700" fill="var(--warn)">每人 幾乎沒有</text>
  <text class="g" x="520" y="404" font-size="16">分不出一條看得見的格子</text>

  <text class="t" x="48" y="524" font-size="22" font-weight="700">覆蓋越廣，底下站的人越多</text>
</svg>
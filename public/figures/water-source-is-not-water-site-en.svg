<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="An arrow runs from the distant water source on the left to the plant site on the right, and the local aquifer drawn beside the site is not connected to that arrow.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">Where water is taken is not where it is used</text>

<circle cx="170" cy="230" r="58" fill="var(--accent)"/>
<text class="g" x="170" y="330" text-anchor="middle">Out-of-state intake</text>
<text class="n" x="170" y="356" text-anchor="middle">Trucked in</text>

<path d="M240 230 l380 0 m-26 -14 l26 14 l-26 14" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="n" x="430" y="208" text-anchor="middle">Water moves along this line</text>

<rect x="640" y="180" width="160" height="100" fill="var(--grey)" rx="6"/>
<text class="g" x="720" y="330" text-anchor="middle">Plant site</text>

<ellipse cx="720" cy="430" rx="120" ry="34" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 7"/>
<text class="g" x="720" y="438" text-anchor="middle">Local water</text>
<text class="n" x="880" y="430" text-anchor="end">Separate</text>

<text class="c" x="60" y="492">Two issues, often told as one</text>
</svg>
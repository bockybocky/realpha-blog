<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左邊一疊實心方塊，右邊一疊方塊的最上面是一格虛線空框。">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">送出去的，和換回來的</text>
<path d="M90 480 L890 480" stroke="var(--line)" stroke-width="2"/>

<text x="150" y="130" font-size="20" font-weight="700" fill="var(--ink)">送出去</text>
<rect x="150" y="408" width="240" height="64" rx="6" fill="var(--warn)"/>
<text x="270" y="448" font-size="16" fill="var(--page)" text-anchor="middle">算力</text>
<rect x="150" y="336" width="240" height="64" rx="6" fill="var(--warn)"/>
<text x="270" y="376" font-size="16" fill="var(--page)" text-anchor="middle">訓練</text>
<rect x="150" y="264" width="240" height="64" rx="6" fill="var(--warn)"/>
<text x="270" y="304" font-size="16" fill="var(--page)" text-anchor="middle">權重</text>

<path d="M410 368 L538 368" stroke="var(--dim)" stroke-width="3" fill="none"/>
<path d="M538 358 L558 368 L538 378 z" fill="var(--dim)"/>

<text x="570" y="130" font-size="20" font-weight="700" fill="var(--ink)">換回來</text>
<rect x="570" y="408" width="240" height="64" rx="6" fill="var(--accent)"/>
<text x="690" y="448" font-size="16" fill="var(--page)" text-anchor="middle">排行榜名次</text>
<rect x="570" y="336" width="240" height="64" rx="6" fill="var(--accent)"/>
<text x="690" y="376" font-size="16" fill="var(--page)" text-anchor="middle">被裝進產品</text>
<rect x="570" y="264" width="240" height="64" rx="6" fill="var(--accent)"/>
<text x="690" y="304" font-size="16" fill="var(--page)" text-anchor="middle">開發者習慣</text>
<rect x="570" y="186" width="240" height="64" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="690" y="226" font-size="16" fill="var(--accent)" text-anchor="middle">收入</text>

<text x="60" y="532" font-size="22" font-weight="700" fill="var(--ink)">空的那一格，就是現在的風險</text>
</g>
</svg>
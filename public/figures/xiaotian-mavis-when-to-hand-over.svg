<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="兩乘兩四格，橫向看了學不學得到、縱向是否只有人能做；三格標遞，左下角兩者皆否標自己按">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">什麼時候該把入口遞給人</text>
<text x="385" y="100" font-size="18" text-anchor="middle" fill="var(--dim)">看了學不到</text>
<text x="715" y="100" font-size="18" text-anchor="middle" fill="var(--dim)">看了會學到</text>
<text x="205" y="213" font-size="18" text-anchor="end" fill="var(--dim)">只有人能做</text>
<text x="205" y="403" font-size="18" text-anchor="end" fill="var(--dim)">AI 也能做</text>
<rect x="220" y="112" width="330" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="550" y="112" width="330" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="550" y="302" width="330" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="222" y="304" width="326" height="186" fill="var(--page)" stroke="var(--warn)" stroke-width="2.5"/>
<text x="385" y="200" font-size="22" font-weight="700" text-anchor="middle" fill="var(--accent)">遞</text>
<text x="385" y="234" font-size="16" text-anchor="middle" fill="var(--dim)">輸入密碼</text>
<text x="715" y="214" font-size="22" font-weight="700" text-anchor="middle" fill="var(--accent)">遞</text>
<text x="715" y="390" font-size="22" font-weight="700" text-anchor="middle" fill="var(--accent)">遞</text>
<text x="715" y="424" font-size="16" text-anchor="middle" fill="var(--dim)">同事看設定在哪</text>
<text x="385" y="382" font-size="22" font-weight="700" text-anchor="middle" fill="var(--warn)">自己按</text>
<text x="385" y="414" font-size="16" text-anchor="middle" fill="var(--dim)">登入按鈕</text>
<text x="385" y="446" font-size="15" text-anchor="middle" fill="var(--warn)">遞了＝推回給人</text>
<text x="60" y="556" font-size="22" font-weight="700" fill="var(--ink)">四格裡，只有一格該自己做</text>
</svg>
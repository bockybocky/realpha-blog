<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A staircase whose steps keep rising, low at the first two and steeply higher at the last two.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .lab { font-size:16px; fill:var(--ink); }
    .yr { font-size:16px; fill:var(--dim); }
    .n { font-size:19px; fill:var(--dim); }
</style>
<text class="t" x="60" y="62">3 yrs, steeper</text>
<line x1="60" y1="474" x2="930" y2="474" stroke="var(--line)" stroke-width="2"/>

<rect x="70" y="444" width="160" height="30" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="lab" x="76" y="434">4-digit sums</text>
<text class="yr" x="76" y="500">2023</text>

<rect x="240" y="384" width="160" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="lab" x="246" y="374">HS contest</text>
<text class="yr" x="246" y="500">2024</text>

<rect x="410" y="274" width="160" height="200" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="lab" x="416" y="264">IMO gold</text>
<text class="yr" x="416" y="500">2025</text>

<rect x="580" y="164" width="160" height="310" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="lab" x="586" y="154">Niche open</text>
<text class="yr" x="586" y="500">2026 Q1</text>

<rect x="750" y="96" width="160" height="378" fill="var(--accent)" opacity="0.18"/>
<rect x="750" y="96" width="160" height="378" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="lab" x="756" y="86">Clay prob</text>
<text class="n" x="756" y="130">88 hours</text>
<text class="yr" x="756" y="500">1 mo ago</text>
</svg>
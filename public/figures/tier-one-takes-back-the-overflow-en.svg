<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="The tier-one maker's slots go from full to open, and the orders held by the tier-two maker are pulled back.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="640" fill="var(--page)"/>
<text class="t h" x="60" y="70">Your turn comes only when they are full</text>
<text class="t g" x="60" y="130">When demand is full</text>
<rect x="60" y="150" width="340" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="76" y="166" width="70" height="52" fill="var(--grey)"/>
<rect x="156" y="166" width="70" height="52" fill="var(--grey)"/>
<rect x="236" y="166" width="70" height="52" fill="var(--grey)"/>
<rect x="316" y="166" width="70" height="52" fill="var(--grey)"/>
<rect x="76" y="230" width="70" height="52" fill="var(--grey)"/>
<rect x="156" y="230" width="70" height="52" fill="var(--grey)"/>
<rect x="236" y="230" width="70" height="52" fill="var(--grey)"/>
<rect x="316" y="230" width="70" height="52" fill="var(--grey)"/>
<text class="t b" x="60" y="326">Tier one: filled by its largest customer</text>
<rect x="540" y="150" width="340" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="556" y="166" width="70" height="52" fill="var(--accent)"/>
<rect x="636" y="166" width="70" height="52" fill="var(--accent)"/>
<rect x="556" y="230" width="70" height="52" fill="var(--accent)"/>
<text class="t b" x="540" y="326">Tier two: takes the overflow</text>
<text class="t g" x="60" y="400">Once demand thins</text>
<rect x="60" y="420" width="340" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="76" y="436" width="70" height="52" fill="var(--grey)"/>
<rect x="156" y="436" width="70" height="52" fill="var(--grey)"/>
<rect x="236" y="436" width="70" height="52" fill="var(--accent)"/>
<rect x="316" y="436" width="70" height="52" fill="var(--accent)"/>
<rect x="76" y="500" width="70" height="52" fill="var(--grey)"/>
<rect x="156" y="500" width="70" height="52" fill="var(--accent)"/>
<rect x="236" y="500" width="70" height="52" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="316" y="500" width="70" height="52" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<polygon points="520,488 440,488 440,472 404,495 440,518 440,502 520,502" fill="var(--accent)"/>
<rect x="540" y="420" width="340" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="556" y="436" width="70" height="52" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="636" y="436" width="70" height="52" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="556" y="500" width="70" height="52" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="t b" x="540" y="596">Tier two: the volume is gone</text>
<text class="t c" x="60" y="628">The day they are not full, your volume goes first</text>
</svg>
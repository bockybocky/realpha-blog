<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三條前後咬合的長條，依序往右錯開，每條的開始都吊在前一條的尾端">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="70">三條線要一條接一條</text>
<line x1="230" y1="420" x2="910" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="230" y="448">第一年</text>
<text class="b" x="400" y="448">第二年</text>
<text class="b" x="570" y="448">第三年</text>
<text class="b" x="740" y="448">第四年</text>
<text class="g" x="210" y="192" text-anchor="end">臨床證據</text>
<text class="g" x="210" y="272" text-anchor="end">給付</text>
<text class="g" x="210" y="352" text-anchor="end">指引改寫</text>
<rect x="230" y="165" width="300" height="40" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="470" y="245" width="280" height="40" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="690" y="325" width="220" height="40" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="380" y="192" text-anchor="middle">多中心收案</text>
<text class="b" x="610" y="272" text-anchor="middle">新代碼申請</text>
<text class="b" x="800" y="352" text-anchor="middle">學會立場文件</text>
<path d="M530 185 H560 V245" stroke="var(--grey)" stroke-width="2" fill="none"/>
<path d="M560 245 l-6 -12 h12 z" fill="var(--grey)"/>
<path d="M750 265 H780 V325" stroke="var(--grey)" stroke-width="2" fill="none"/>
<path d="M780 325 l-6 -12 h12 z" fill="var(--grey)"/>
<text class="c" x="60" y="500">缺一條，後面全部不動</text>
</svg>
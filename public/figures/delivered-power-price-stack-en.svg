<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The left bar stacks step-up, transmission and distribution costs far above the right bar, which contains only a generation segment.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">The price at the generator is only the first segment</text>
<line x1="120" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="200" y="74" width="140" height="132" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="200" y="206" width="140" height="66" fill="var(--grey)"/>
<rect x="200" y="272" width="140" height="22" fill="var(--grey)"/>
<rect x="200" y="294" width="140" height="176" fill="var(--accent)"/>
<text x="356" y="146" font-size="16" fill="var(--dim)">Substation and distribution</text>
<text x="356" y="246" font-size="16" fill="var(--dim)">High-voltage transmission</text>
<text x="356" y="290" font-size="16" fill="var(--dim)">Step-up</text>
<text x="356" y="390" font-size="16" fill="var(--dim)">Generation</text>
<text x="270" y="500" font-size="19" fill="var(--ink)" text-anchor="middle">Grid to the plant gate</text>
<rect x="620" y="294" width="140" height="176" fill="var(--accent)"/>
<text x="776" y="390" font-size="16" fill="var(--dim)">Gen</text>
<text x="690" y="500" font-size="19" fill="var(--ink)" text-anchor="middle">On-site generation</text>
<text x="690" y="270" font-size="16" fill="var(--dim)" text-anchor="middle">No wires in between</text>
<text x="120" y="536" font-size="22" fill="var(--ink)">Same kilowatt-hour, two different delivery points</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One line splits, with the weaker end spiking upward and the stronger end staying flat.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" fill="var(--ink)">Spreads start telling good from bad</text>
<line x1="90" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="90" y1="130" x2="90" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="118" font-size="15" fill="var(--dim)">Yield</text>

<path d="M110 360 L420 348" stroke="var(--grey)" stroke-width="5" fill="none"/>
<circle cx="420" cy="348" r="7" fill="var(--ink)"/>
<text x="398" y="330" font-size="19" fill="var(--ink)">Split point</text>

<path d="M420 348 C560 330 640 250 870 160" stroke="var(--warn)" stroke-width="5" fill="none"/>
<text x="640" y="150" font-size="20" fill="var(--warn)">Worst-rated AI debt</text>
<text x="640" y="176" font-size="16" fill="var(--warn)">17%</text>

<path d="M420 348 C580 350 700 352 870 352" stroke="var(--accent)" stroke-width="5" fill="none"/>
<text x="640" y="392" font-size="20" fill="var(--accent)">Healthy issuers</text>
<text x="640" y="416" font-size="16" fill="var(--dim)">Barely moved</text>
<text x="60" y="490" font-size="22" fill="var(--ink)">Borrowing costs more, capacity slows; usage side unchanged</text>
</svg>
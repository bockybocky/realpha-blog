<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A circle divided in two, with the left half solid and visible and the right half hollow and dashed to show what stays unseen.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .gp { font-size:19px; font-weight:600; fill:var(--page); }
    .sp { font-size:15px; fill:var(--page); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70">Half of US business profit sits off the mirror</text>

  <path d="M330 150 A150 150 0 0 0 330 450 Z" fill="var(--accent)"/>
  <path d="M330 150 A150 150 0 0 1 330 450 Z" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>

  <text class="gp" x="262" y="292" text-anchor="middle">Visible</text>
  <text class="sp" x="262" y="318" text-anchor="middle">Public companies</text>
  <text class="g" x="398" y="292" text-anchor="middle">Invisible</text>
  <text class="s" x="398" y="318" text-anchor="middle">Pass-through entities</text>

  <line x1="486" y1="300" x2="560" y2="300" stroke="var(--grey)" stroke-width="2"/>
  <text class="g" x="576" y="264">No filings</text>
  <text class="g" x="576" y="300">No earnings calls</text>
  <text class="g" x="576" y="336">Not on any screener</text>

  <text class="c" x="60" y="486">Half a sample yields confident wrong answers</text>
</svg>
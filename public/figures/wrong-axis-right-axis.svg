<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條判斷軸的對比：按知道多少判斷時詐騙信落錯邊，按要我做什麼判斷時分界乾淨">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">換一條軸來量</text>

  <text class="t" x="60" y="128" font-size="19" fill="var(--dim)">舊軸：對方知道多少</text>
  <line x1="120" y1="190" x2="880" y2="190" stroke="var(--grey)" stroke-width="3"/>
  <text class="t" x="120" y="222" font-size="15" fill="var(--dim)">叫錯名字</text>
  <text class="t" x="880" y="222" font-size="15" fill="var(--dim)" text-anchor="end">買了哪四樣、幾點幾分</text>
  <line x1="420" y1="156" x2="420" y2="226" stroke="var(--line)" stroke-width="3" stroke-dasharray="7 6"/>
  <text class="t" x="420" y="148" font-size="15" fill="var(--dim)" text-anchor="middle">舊分界</text>
  <circle cx="810" cy="190" r="10" fill="var(--warn)"/>
  <text class="t" x="810" y="168" font-size="16" fill="var(--warn)" text-anchor="middle">這封信</text>

  <text class="t" x="60" y="328" font-size="19" fill="var(--dim)">新軸：它要我做什麼</text>
  <line x1="120" y1="390" x2="880" y2="390" stroke="var(--grey)" stroke-width="3"/>
  <text class="t" x="120" y="422" font-size="15" fill="var(--dim)">沒要我動作</text>
  <text class="t" x="880" y="422" font-size="15" fill="var(--dim)" text-anchor="end">加 LINE、給驗證碼、回撥</text>
  <line x1="500" y1="356" x2="500" y2="426" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="500" y="348" font-size="16" fill="var(--accent)" text-anchor="middle">新分界</text>
  <circle cx="810" cy="390" r="10" fill="var(--warn)"/>
  <text class="t" x="810" y="368" font-size="16" fill="var(--warn)" text-anchor="middle">這封信</text>

  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">舊軸分不開，新軸一刀切</text>
</svg>
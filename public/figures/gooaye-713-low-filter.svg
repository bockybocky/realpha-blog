<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三段走勢的低點分別高於、齊平、低於七月低點那條水平虛線">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">十一月的低點踩在七月哪一邊</text>
<line x1="80" y1="300" x2="900" y2="300" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="t" x="80" y="286" font-size="16" fill="var(--dim)">七月低點</text>
<polyline points="140,190 190,235 240,252 300,160" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="400,205 450,275 500,301 560,180" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="660,215 710,320 760,362 820,255" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="t" x="220" y="430" font-size="20" fill="var(--ink)" text-anchor="middle">沒破</text>
<text class="t" x="220" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">續強機率相對高</text>
<text class="t" x="480" y="430" font-size="20" fill="var(--ink)" text-anchor="middle">差不多的位置</text>
<text class="t" x="480" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">還可以看</text>
<text class="t" x="740" y="430" font-size="20" fill="var(--ink)" text-anchor="middle">更低</text>
<text class="t" x="740" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">可能一段走完了</text>
</svg>
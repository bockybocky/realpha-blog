<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊三根獨立柱子，右邊三層橫向堆疊，最上層由許多小方塊組成">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">一個功能一個箱子，換成一疊</text>

  <text class="t" x="60" y="120" font-size="20" font-weight="700" fill="var(--dim)">煙囪式</text>
  <g>
    <rect x="60" y="150" width="90" height="46" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
    <rect x="60" y="208" width="90" height="250" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
    <text class="t" x="105" y="178" font-size="15" fill="var(--dim)" text-anchor="middle">箱子</text>
    <text class="t" x="105" y="345" font-size="16" fill="var(--ink)" text-anchor="middle">火力</text>
  </g>
  <g>
    <rect x="175" y="150" width="90" height="46" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
    <rect x="175" y="208" width="90" height="250" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
    <text class="t" x="220" y="178" font-size="15" fill="var(--dim)" text-anchor="middle">箱子</text>
    <text class="t" x="220" y="345" font-size="16" fill="var(--ink)" text-anchor="middle">情報</text>
  </g>
  <g>
    <rect x="290" y="150" width="90" height="46" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
    <rect x="290" y="208" width="90" height="250" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
    <text class="t" x="335" y="178" font-size="15" fill="var(--dim)" text-anchor="middle">箱子</text>
    <text class="t" x="335" y="345" font-size="16" fill="var(--ink)" text-anchor="middle">後勤</text>
  </g>
  <text class="t" x="220" y="492" font-size="15" fill="var(--dim)" text-anchor="middle">箱子對箱子講話</text>

  <path d="M 410 300 L 480 300" stroke="var(--grey)" stroke-width="3"/>
  <path d="M 470 290 L 482 300 L 470 310 Z" fill="var(--grey)"/>

  <text class="t" x="520" y="120" font-size="20" font-weight="700" fill="var(--accent)">整疊重做</text>
  <g>
    <rect x="520" y="146" width="56" height="40" rx="5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <rect x="584" y="146" width="56" height="40" rx="5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <rect x="648" y="146" width="56" height="40" rx="5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <rect x="712" y="146" width="56" height="40" rx="5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <rect x="776" y="146" width="56" height="40" rx="5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <rect x="840" y="146" width="56" height="40" rx="5" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 4"/>
  </g>
  <rect x="520" y="200" width="376" height="76" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="708" y="245" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">應用程式</text>
  <rect x="520" y="290" width="376" height="76" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="708" y="328" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">基礎設施層</text>
  <text class="t" x="708" y="352" font-size="15" fill="var(--dim)" text-anchor="middle">連貫的資料層</text>
  <rect x="520" y="380" width="376" height="78" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="708" y="418" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">傳輸層</text>
  <text class="t" x="708" y="442" font-size="15" fill="var(--dim)" text-anchor="middle">任一點到任一點</text>
  <text class="t" x="708" y="492" font-size="15" fill="var(--dim)" text-anchor="middle">上面一支一支裝</text>
</svg>
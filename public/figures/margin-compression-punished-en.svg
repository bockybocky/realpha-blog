<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Three bars against a zero line: the contracting group deep down, the flat group slightly down, the expanding group up">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.s { font-size:16px; fill:var(--dim); }
.g { font-size:19px; font-weight:600; }
.n { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="62">Margin down, punished fast</text>
<text class="s" x="60" y="94">Relative return, next 12 months</text>
<line x1="120" y1="320" x2="880" y2="320" stroke="var(--line)" stroke-width="2"/>
<text class="n" x="120" y="308">Market level</text>
<rect x="220" y="320" width="120" height="150" fill="var(--warn)"/>
<rect x="440" y="320" width="120" height="30" fill="var(--grey)"/>
<rect x="660" y="210" width="120" height="110" fill="var(--accent)"/>
<text class="g" x="280" y="502" text-anchor="middle" fill="var(--warn)">Contracting</text>
<text class="n" x="280" y="526" text-anchor="middle">Down over 1% yoy</text>
<text class="g" x="500" y="502" text-anchor="middle" fill="var(--dim)">Flat</text>
<text class="g" x="720" y="502" text-anchor="middle" fill="var(--accent)">Expanding</text>
<text class="c" x="60" y="558">Good numbers can't save the margin</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="二乘二格子：橫軸偶爾跑到每天跑，縱軸跑完就結束到要一直開著；左上格深色標租，右下格標買，另外兩格淡色是中間地帶">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #b9c2d0;
      --accent: #1f6feb;
      --warn:   #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #4a5464;
        --accent: #58a6ff;
        --warn:   #d29922;
      }
    }
    .t     { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1    { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .big   { font-size: 34px; font-weight: 700; }
    .cap   { font-size: 19px; font-weight: 700; fill: var(--dim); }
    .ax    { font-size: 16px; fill: var(--dim); }
    .unit  { font-size: 17px; fill: var(--dim); }
    .onfill{ font-size: 17px; font-weight: 700; fill: var(--page); }
    .kick  { font-size: 22px; font-weight: 700; fill: var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <g class="t">
    <text x="480" y="46" class="h1" text-anchor="middle">用兩個問題決定租還是買</text>

    <!-- 四格 -->
    <rect x="200" y="90" width="280" height="190" fill="var(--accent)"/>
    <rect x="480" y="90" width="280" height="190" fill="var(--card)" stroke="var(--line)"/>
    <rect x="200" y="280" width="280" height="190" fill="var(--card)" stroke="var(--line)"/>
    <rect x="480" y="280" width="280" height="190" fill="var(--warn)"/>

    <text x="340" y="180" class="big" fill="var(--page)" text-anchor="middle">租</text>
    <text x="340" y="212" class="onfill" text-anchor="middle">字幕、微調、試一張卡</text>
    <text x="620" y="180" class="cap" text-anchor="middle">先租，量夠了再買</text>
    <text x="340" y="375" class="cap" text-anchor="middle">Serverless 端點</text>
    <text x="340" y="402" class="unit" text-anchor="middle">沒人用不付錢</text>
    <text x="620" y="375" class="big" fill="var(--page)" text-anchor="middle">買</text>
    <text x="620" y="407" class="onfill" text-anchor="middle">每天當 agent 腦袋、每天出片</text>

    <!-- 軸標 -->
    <text x="340" y="500" class="ax" text-anchor="middle">偶爾跑</text>
    <text x="620" y="500" class="ax" text-anchor="middle">每天跑</text>
    <text x="186" y="190" class="ax" text-anchor="end">跑完就結束</text>
    <text x="186" y="380" class="ax" text-anchor="end">要一直開著</text>

    <text x="480" y="560" class="kick" text-anchor="middle">模型名字不重要，用量才重要</text>
  </g>
</svg>

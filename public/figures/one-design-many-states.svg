<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一個方塊分岔成三條路，每條路末端的堆疊層數不同">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="h" x="480" y="52" text-anchor="middle">同一套電池設計，三個州</text>
<rect x="60" y="250" width="190" height="90" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="155" y="290" text-anchor="middle">一套設計</text>
<text class="s" x="155" y="318" text-anchor="middle">發電機・電池</text>
<path d="M250 295 C330 295 340 350 420 350" fill="none" stroke="var(--line)" stroke-width="2"/>
<path d="M250 295 C340 295 350 295 600 295" fill="none" stroke="var(--line)" stroke-width="2"/>
<path d="M250 295 C330 295 340 240 780 240" fill="none" stroke="var(--line)" stroke-width="2"/>
<line x1="400" y1="460" x2="920" y2="460" stroke="var(--line)" stroke-width="2"/>
<rect x="420" y="416" width="130" height="44" fill="var(--grey)"/>
<rect x="420" y="372" width="130" height="44" fill="var(--grey)"/>
<rect x="420" y="328" width="130" height="44" fill="var(--warn)"/>
<text class="s" x="485" y="444" text-anchor="middle">排煙</text>
<text class="s" x="485" y="400" text-anchor="middle">偵測</text>
<text class="s" x="485" y="356" text-anchor="middle" fill="var(--page)">換氣</text>
<text class="g" x="485" y="492" text-anchor="middle">州一</text>
<rect x="600" y="416" width="130" height="44" fill="var(--grey)"/>
<rect x="600" y="372" width="130" height="44" fill="var(--grey)"/>
<text class="s" x="665" y="444" text-anchor="middle">排煙</text>
<text class="s" x="665" y="400" text-anchor="middle">偵測</text>
<text class="g" x="665" y="492" text-anchor="middle">州二</text>
<rect x="780" y="416" width="130" height="44" fill="var(--grey)"/>
<text class="s" x="845" y="444" text-anchor="middle">排煙</text>
<text class="g" x="845" y="492" text-anchor="middle">州三</text>
<text class="c" x="480" y="528" text-anchor="middle">房子好蓋，裡面的東西不好配</text>
</svg>
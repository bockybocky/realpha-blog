<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On a timeline, 2030 to 2033 spans two years while a much shorter stretch below marks one year once the condition holds.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="72" font-size="27" fill="var(--ink)">His timeline, and the condition attached</text>
  <rect x="60" y="110" width="840" height="280" rx="16" fill="var(--card)" stroke="var(--line)"/>

  <line x1="110" y1="280" x2="860" y2="280" stroke="var(--line)" stroke-width="2"/>

  <line x1="520" y1="212" x2="520" y2="268" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="830" y1="212" x2="830" y2="268" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <line x1="520" y1="200" x2="830" y2="200" stroke="var(--dim)" stroke-width="2"/>
  <line x1="520" y1="192" x2="520" y2="208" stroke="var(--dim)" stroke-width="2"/>
  <line x1="830" y1="192" x2="830" y2="208" stroke="var(--dim)" stroke-width="2"/>
  <text x="675" y="180" font-size="19" fill="var(--dim)" text-anchor="middle">Median about two years</text>

  <circle cx="150" cy="280" r="9" fill="var(--grey)"/>
  <circle cx="520" cy="280" r="9" fill="var(--accent)"/>
  <circle cx="830" cy="280" r="9" fill="var(--dim)"/>

  <text x="150" y="318" font-size="16" fill="var(--dim)" text-anchor="middle">2026 today</text>
  <text x="520" y="318" font-size="16" fill="var(--ink)" text-anchor="middle">2030-31 R&amp;D fully automated</text>
  <text x="830" y="318" font-size="16" fill="var(--dim)" text-anchor="middle">2033 fully surpassed</text>

  <line x1="520" y1="352" x2="620" y2="352" stroke="var(--accent)" stroke-width="3"/>
  <line x1="520" y1="344" x2="520" y2="360" stroke="var(--accent)" stroke-width="3"/>
  <line x1="620" y1="344" x2="620" y2="360" stroke="var(--accent)" stroke-width="3"/>
  <text x="634" y="358" font-size="19" fill="var(--accent)">Once seen, within a year</text>

  <text x="60" y="458" font-size="22" fill="var(--ink)">One endpoint, two distances</text>
</svg>
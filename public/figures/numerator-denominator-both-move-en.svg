<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A fraction line with signals above and below pushing both numerator and denominator larger, and a question mark on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="48" y="62">Both sides move at once</text>
  <text class="b" x="48" y="92">Valuation = numerator / denominator</text>
  <rect x="40" y="118" width="880" height="342" rx="14" fill="var(--card)"/>
  <text class="g" x="200" y="230" text-anchor="end" fill="var(--accent)">Top</text>
  <text class="g" x="200" y="400" text-anchor="end" fill="var(--warn)">Bottom</text>
  <rect x="240" y="192" width="140" height="56" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="400" y="192" width="140" height="56" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="560" y="192" width="140" height="56" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text class="b" x="310" y="226" text-anchor="middle">Token volume</text>
  <text class="b" x="470" y="226" text-anchor="middle">Backlog</text>
  <text class="b" x="630" y="226" text-anchor="middle">Margin raised</text>
  <line x1="310" y1="186" x2="310" y2="164" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="310,156 303,168 317,168" fill="var(--accent)"/>
  <line x1="470" y1="186" x2="470" y2="164" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="470,156 463,168 477,168" fill="var(--accent)"/>
  <line x1="630" y1="186" x2="630" y2="164" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="630,156 623,168 637,168" fill="var(--accent)"/>
  <line x1="240" y1="300" x2="700" y2="300" stroke="var(--ink)" stroke-width="4"/>
  <rect x="290" y="344" width="160" height="56" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="490" y="344" width="160" height="56" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
  <text class="b" x="370" y="378" text-anchor="middle">Spreads widen</text>
  <text class="b" x="570" y="378" text-anchor="middle">Cash flow turns negative</text>
  <line x1="370" y1="406" x2="370" y2="428" stroke="var(--warn)" stroke-width="2"/>
  <polygon points="370,436 363,424 377,424" fill="var(--warn)"/>
  <line x1="570" y1="406" x2="570" y2="428" stroke="var(--warn)" stroke-width="2"/>
  <polygon points="570,436 563,424 577,424" fill="var(--warn)"/>
  <text class="t" x="800" y="312">?</text>
  <text class="c" x="48" y="500">Adjust one side only and you get the answer you wanted</text>
</svg>
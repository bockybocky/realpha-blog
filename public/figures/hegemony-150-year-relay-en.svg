<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three hills rise and fall in turn as the Netherlands, Britain, and the United States hand off power about 150 years apart; one dot on the US summit marks a self-perceived peak, and one dot on the downslope marks what rivals see as the eve of decline.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:700}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700;fill:var(--accent)}
.w{fill:var(--page)}.a{fill:var(--accent)}.wa{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="40" y="56" class="t">Hegemony: 150-yr relay</text>
<line x1="60" y1="440" x2="920" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="920" y="470" text-anchor="end" class="d">Time →</text>
<path d="M70,440 C150,440 170,210 230,210 C290,210 310,440 390,440" fill="none" stroke="var(--grey)" stroke-width="5"/>
<path d="M310,440 C390,440 410,190 470,190 C530,190 550,440 630,440" fill="none" stroke="var(--grey)" stroke-width="5"/>
<path d="M550,440 C630,440 650,170 710,170" fill="none" stroke="var(--accent)" stroke-width="6"/>
<path d="M710,170 C770,170 790,440 870,440" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="10 8"/>
<text x="230" y="260" text-anchor="middle" class="g">NL</text>
<text x="470" y="240" text-anchor="middle" class="g">UK</text>
<text x="690" y="230" text-anchor="middle" class="g a">US</text>
<line x1="230" y1="130" x2="470" y2="130" stroke="var(--dim)" stroke-width="2"/>
<line x1="230" y1="120" x2="230" y2="140" stroke="var(--dim)" stroke-width="2"/>
<line x1="470" y1="120" x2="470" y2="140" stroke="var(--dim)" stroke-width="2"/>
<line x1="470" y1="130" x2="710" y2="130" stroke="var(--dim)" stroke-width="2"/>
<line x1="710" y1="120" x2="710" y2="140" stroke="var(--dim)" stroke-width="2"/>
<text x="350" y="116" text-anchor="middle" class="b">≈150 yrs</text>
<text x="590" y="116" text-anchor="middle" class="b">≈150 yrs</text>
<line x1="350" y1="440" x2="350" y2="478" stroke="var(--grey)" stroke-width="2"/>
<line x1="590" y1="440" x2="590" y2="478" stroke="var(--grey)" stroke-width="2"/>
<text x="350" y="500" text-anchor="middle" class="d">$ passes</text>
<text x="590" y="500" text-anchor="middle" class="d">$ passes</text>
<circle cx="710" cy="170" r="10" fill="var(--accent)"/>
<text x="732" y="160" class="b a">Us: peak</text>
<circle cx="782" cy="305" r="10" fill="var(--warn)"/>
<text x="802" y="300" class="d wa">Rivals:</text>
<text x="802" y="320" class="d wa">Fading</text>
</svg>
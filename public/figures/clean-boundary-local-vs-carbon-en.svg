<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Inside the solid box are four local pollutants; outside it a dashed box holds carbon dioxide, showing where the line around clean is drawn.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">Where the word clean gets drawn</text>
<rect x="60" y="110" width="520" height="300" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="90" y="152" font-size="20" fill="var(--accent)">Counted in this episode</text>
<text x="90" y="212" font-size="19" fill="var(--ink)">Nitrogen oxides</text>
<text x="330" y="212" font-size="19" fill="var(--ink)">Sulfur oxides</text>
<text x="90" y="268" font-size="19" fill="var(--ink)">Water</text>
<text x="330" y="268" font-size="19" fill="var(--ink)">Noise</text>
<text x="90" y="330" font-size="16" fill="var(--dim)">You can smell it, see it, drink it</text>
<text x="90" y="360" font-size="16" fill="var(--dim)">The items a community hearing argues over</text>
<rect x="640" y="180" width="250" height="160" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text x="670" y="222" font-size="20" fill="var(--warn)">Outside</text>
<text x="670" y="272" font-size="19" fill="var(--ink)">Carbon dioxide</text>
<text x="670" y="308" font-size="16" fill="var(--dim)">No figure all episode</text>
<text x="60" y="474" font-size="22" fill="var(--ink)">When the customer's pledge sits outside the box, this pitch does not connect</text>
</svg>
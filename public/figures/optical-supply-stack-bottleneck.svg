<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="供應鏈四層堆疊，上寬下窄，雷射與基板兩層收窄成瓶頸">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">往上游走，寬度一層一層收窄</text>
<text class="t" x="60" y="86" font-size="16" fill="var(--dim)">寬度＝供給寬裕度</text>

<rect x="150" y="118" width="660" height="72" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="480" y="162" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">資料中心建置需求</text>
<text class="t" x="838" y="162" font-size="15" fill="var(--dim)">寬</text>

<rect x="250" y="210" width="460" height="72" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="480" y="254" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">光收發模組</text>
<text class="t" x="838" y="254" font-size="15" fill="var(--dim)">擴產中</text>

<rect x="368" y="302" width="224" height="72" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="480" y="346" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">雷射晶片</text>
<text class="t" x="620" y="346" font-size="16" font-weight="700" fill="var(--warn)">最緊</text>

<rect x="396" y="394" width="168" height="72" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="480" y="438" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">磷化銦基板</text>
<text class="t" x="592" y="438" font-size="16" font-weight="700" fill="var(--warn)">最緊</text>

<path d="M480 190 L480 206" stroke="var(--grey)" stroke-width="2"/>
<path d="M480 282 L480 298" stroke="var(--grey)" stroke-width="2"/>
<path d="M480 374 L480 390" stroke="var(--grey)" stroke-width="2"/>
<text class="t" x="60" y="438" font-size="16" fill="var(--dim)">材料</text>
<text class="t" x="60" y="162" font-size="16" fill="var(--dim)">終端</text>
<text class="t" x="60" y="512" font-size="16" fill="var(--dim)">緊的那兩層在最上游，不在最靠近終端的地方</text>
</svg>
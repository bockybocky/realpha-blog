<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="十個起點的人裡七個往下沉入沉默、三個抵達右側並帶著發言泡泡，你聽到的只有那三個">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="50" y="62" font-size="27" fill="var(--ink)">說話的人，是同一批人裡剩下的</text>

  <text x="60" y="130" font-size="19" fill="var(--dim)">一開始</text>
  <g fill="var(--grey)">
    <circle cx="80" cy="180" r="14"/><circle cx="130" cy="180" r="14"/>
    <circle cx="80" cy="230" r="14"/><circle cx="130" cy="230" r="14"/>
    <circle cx="80" cy="280" r="14"/><circle cx="130" cy="280" r="14"/>
    <circle cx="80" cy="330" r="14"/><circle cx="130" cy="330" r="14"/>
    <circle cx="80" cy="380" r="14"/><circle cx="130" cy="380" r="14"/>
  </g>

  <path d="M175 255 C 260 230, 300 210, 370 205" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M175 300 C 260 360, 320 420, 400 452" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>

  <rect x="360" y="418" width="420" height="76" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <g fill="var(--grey)" opacity="0.75">
    <circle cx="400" cy="456" r="12"/><circle cx="448" cy="456" r="12"/>
    <circle cx="496" cy="456" r="12"/><circle cx="544" cy="456" r="12"/>
    <circle cx="592" cy="456" r="12"/><circle cx="640" cy="456" r="12"/>
    <circle cx="688" cy="456" r="12"/>
  </g>
  <text x="722" y="462" font-size="17" fill="var(--dim)">沒有聲音</text>

  <rect x="560" y="120" width="350" height="240" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="588" y="158" font-size="20" fill="var(--accent)">你聽得到的</text>
  <g fill="var(--accent)">
    <circle cx="606" cy="205" r="14"/><circle cx="606" cy="262" r="14"/><circle cx="606" cy="319" r="14"/>
  </g>
  <g fill="none" stroke="var(--accent)" stroke-width="2">
    <rect x="644" y="186" width="180" height="38" rx="10"/>
    <rect x="644" y="243" width="180" height="38" rx="10"/>
    <rect x="644" y="300" width="180" height="38" rx="10"/>
  </g>
  <text x="664" y="211" font-size="16" fill="var(--ink)">心得</text>
  <text x="664" y="268" font-size="16" fill="var(--ink)">方法</text>
  <text x="664" y="325" font-size="16" fill="var(--ink)">教材</text>

  <text x="50" y="546" font-size="22" fill="var(--ink)">失敗的人不是被反駁，是不說話了</text>
</svg>
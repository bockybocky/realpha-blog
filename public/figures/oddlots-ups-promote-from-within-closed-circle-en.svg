<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A staircase climbs inside the closed circle while three arrows outside it all hit the boundary.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="48" y="62">Many rise, none enter</text>

<circle cx="620" cy="290" r="170" fill="var(--card)" stroke="var(--accent)" stroke-width="5"/>

<rect x="520" y="372" width="70" height="26" fill="var(--grey)"/>
<rect x="560" y="330" width="70" height="26" fill="var(--grey)"/>
<rect x="600" y="288" width="70" height="26" fill="var(--grey)"/>
<rect x="640" y="246" width="70" height="26" fill="var(--grey)"/>
<polyline points="548,366 690,226" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polygon points="680,216 706,212 700,240" fill="var(--accent)"/>
<text class="b" x="500" y="420">Driver</text>
<text class="b" x="692" y="206">Manager</text>

<text class="g" x="60" y="196">Outside talent</text>
<line x1="90" y1="230" x2="400" y2="230" stroke="var(--grey)" stroke-width="4"/>
<polygon points="400,218 428,230 400,242" fill="var(--grey)"/>
<line x1="90" y1="290" x2="420" y2="290" stroke="var(--grey)" stroke-width="4"/>
<polygon points="420,278 448,290 420,302" fill="var(--grey)"/>
<line x1="90" y1="350" x2="400" y2="350" stroke="var(--grey)" stroke-width="4"/>
<polygon points="400,338 428,350 400,362" fill="var(--grey)"/>

<line x1="436" y1="212" x2="472" y2="248" stroke="var(--warn)" stroke-width="6"/>
<line x1="472" y1="212" x2="436" y2="248" stroke="var(--warn)" stroke-width="6"/>
<line x1="456" y1="272" x2="492" y2="308" stroke="var(--warn)" stroke-width="6"/>
<line x1="492" y1="272" x2="456" y2="308" stroke="var(--warn)" stroke-width="6"/>
<line x1="436" y1="332" x2="472" y2="368" stroke="var(--warn)" stroke-width="6"/>
<line x1="472" y1="332" x2="436" y2="368" stroke="var(--warn)" stroke-width="6"/>

<text class="c" x="48" y="500">One wall, both ways</text>
</svg>
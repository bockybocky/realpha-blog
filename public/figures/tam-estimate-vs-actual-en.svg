<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The estimate bar is only one-ninth as long as the actual bar, and the actual figure is built from three business segments, two of which did not yet exist when the estimate was made.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">You can only size what already exists</text>
<text x="60" y="94" font-size="16" fill="var(--dim)">Uber 2024 bookings: 2014 estimate vs actual</text>
<text x="60" y="166" font-size="20" fill="var(--dim)">2014 estimate</text>
<rect x="60" y="182" width="88" height="54" fill="var(--grey)"/>
<text x="164" y="218" font-size="19" fill="var(--ink)">$18B</text>
<text x="60" y="166" font-size="20" fill="var(--dim)">2014 estimate</text>
<text x="60" y="310" font-size="20" fill="var(--accent)">Actual</text>
<rect x="60" y="326" width="406" height="54" fill="var(--accent)"/>
<rect x="466" y="326" width="367" height="54" fill="var(--accent)" opacity="0.55"/>
<rect x="833" y="326" width="25" height="54" fill="var(--accent)" opacity="0.3"/>
<text x="92" y="360" font-size="16" fill="var(--page)">Rides $83B</text>
<text x="500" y="360" font-size="16" fill="var(--page)">Delivery $75B</text>
<text x="700" y="410" font-size="16" fill="var(--dim)">Freight $5B</text>
<text x="60" y="412" font-size="16" fill="var(--dim)">Total $163B</text>
<text x="60" y="470" font-size="22" fill="var(--ink)">Method was fine; the "what's new" box was missing</text>
</svg>
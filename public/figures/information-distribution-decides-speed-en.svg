<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left arrows converge on one central point and queue; on the right information radiates outward with a check beside each outer node">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.a{font-size:16px;fill:var(--accent);font-weight:700}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56">Where the decision happens</text>
<line x1="480" y1="96" x2="480" y2="450" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

<text class="g" x="60" y="130">Information centralized</text>
<circle cx="240" cy="250" r="34" fill="var(--card)" stroke="var(--grey)" stroke-width="2.5"/>
<circle cx="100" cy="180" r="16" fill="none" stroke="var(--line)" stroke-width="2"/>
<circle cx="100" cy="320" r="16" fill="none" stroke="var(--line)" stroke-width="2"/>
<circle cx="380" cy="180" r="16" fill="none" stroke="var(--line)" stroke-width="2"/>
<circle cx="380" cy="320" r="16" fill="none" stroke="var(--line)" stroke-width="2"/>
<path d="M118 190 L200 232" stroke="var(--grey)" stroke-width="2"/>
<path d="M206 235 L191 232 L196 223 Z" fill="var(--grey)"/>
<path d="M118 310 L200 268" stroke="var(--grey)" stroke-width="2"/>
<path d="M206 265 L191 268 L196 277 Z" fill="var(--grey)"/>
<path d="M362 190 L280 232" stroke="var(--grey)" stroke-width="2"/>
<path d="M274 235 L289 232 L284 223 Z" fill="var(--grey)"/>
<path d="M362 310 L280 268" stroke="var(--grey)" stroke-width="2"/>
<path d="M274 265 L289 268 L284 277 Z" fill="var(--grey)"/>
<rect x="140" y="352" width="40" height="26" rx="5" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="190" y="352" width="40" height="26" rx="5" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="240" y="352" width="40" height="26" rx="5" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="290" y="352" width="40" height="26" rx="5" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text class="s" x="240" y="412" text-anchor="middle">Queuing for a nod</text>

<text class="g" x="520" y="130">Information sent out first</text>
<circle cx="700" cy="250" r="34" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="560" cy="180" r="16" fill="none" stroke="var(--accent)" stroke-width="2"/>
<circle cx="560" cy="320" r="16" fill="none" stroke="var(--accent)" stroke-width="2"/>
<circle cx="840" cy="180" r="16" fill="none" stroke="var(--accent)" stroke-width="2"/>
<circle cx="840" cy="320" r="16" fill="none" stroke="var(--accent)" stroke-width="2"/>
<path d="M676 232 L594 190" stroke="var(--accent)" stroke-width="2"/>
<path d="M588 187 L603 190 L598 199 Z" fill="var(--accent)"/>
<path d="M676 268 L594 310" stroke="var(--accent)" stroke-width="2"/>
<path d="M588 313 L603 310 L598 301 Z" fill="var(--accent)"/>
<path d="M724 232 L806 190" stroke="var(--accent)" stroke-width="2"/>
<path d="M812 187 L797 190 L802 199 Z" fill="var(--accent)"/>
<path d="M724 268 L806 310" stroke="var(--accent)" stroke-width="2"/>
<path d="M812 313 L797 310 L802 301 Z" fill="var(--accent)"/>
<path d="M548 146 L556 154 L572 136" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M548 366 L556 374 L572 356" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M828 146 L836 154 L852 136" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M828 366 L836 374 L852 356" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="a" x="700" y="412" text-anchor="middle">Decided on the spot</text>

<text class="c" x="480" y="510" text-anchor="middle">Decision speed follows from how information is distributed</text>
</svg>
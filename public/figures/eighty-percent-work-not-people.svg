<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條工作長條中段被填滿、兩端留白，兩端各標一個小段">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="56">做完八成的工作量，不等於少掉八成的人</text>

  <text class="s" x="480" y="176" text-anchor="middle">模型接得走的 60–80%</text>
  <line x1="230" y1="192" x2="730" y2="192" stroke="var(--line)" stroke-width="2"/>
  <line x1="230" y1="192" x2="230" y2="214" stroke="var(--line)" stroke-width="2"/>
  <line x1="730" y1="192" x2="730" y2="214" stroke="var(--line)" stroke-width="2"/>

  <rect x="90" y="220" width="140" height="100" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
  <rect x="230" y="220" width="500" height="100" fill="var(--accent)"/>
  <rect x="730" y="220" width="140" height="100" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>

  <text class="g" x="160" y="276" text-anchor="middle">定義目標</text>
  <text class="g" x="480" y="276" text-anchor="middle" fill="var(--page)">執行</text>
  <text class="g" x="800" y="268" text-anchor="middle">檢查</text>
  <text class="g" x="800" y="292" text-anchor="middle">符不符合</text>

  <text class="s" x="160" y="358" text-anchor="middle">留給人</text>
  <text class="s" x="800" y="358" text-anchor="middle">留給人</text>

  <text class="c" x="60" y="450">被拿走的是中間，留下的是兩端</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左格二十個方塊中有十個被畫叉成空，右格二十個方塊全部填滿">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:20px; font-weight:700; fill:var(--ink); }
    .lab { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="ttl" x="60" y="58">損耗不在細節裡，在一半的貨上</text>

  <text class="grp" x="96" y="120">針筒・要冷鏈</text>
  <text class="lab" x="96" y="146">斷鏈就報廢</text>
  <g>
    <rect x="96" y="176" width="48" height="48" rx="4" fill="var(--grey)" opacity="0.45"/>
    <rect x="156" y="176" width="48" height="48" rx="4" fill="var(--grey)" opacity="0.45"/>
    <rect x="216" y="176" width="48" height="48" rx="4" fill="var(--grey)" opacity="0.45"/>
    <rect x="276" y="176" width="48" height="48" rx="4" fill="var(--grey)" opacity="0.45"/>
    <rect x="336" y="176" width="48" height="48" rx="4" fill="var(--grey)" opacity="0.45"/>
    <rect x="96" y="236" width="48" height="48" rx="4" fill="var(--grey)" opacity="0.45"/>
    <rect x="156" y="236" width="48" height="48" rx="4" fill="var(--grey)" opacity="0.45"/>
    <rect x="216" y="236" width="48" height="48" rx="4" fill="var(--grey)" opacity="0.45"/>
    <rect x="276" y="236" width="48" height="48" rx="4" fill="var(--grey)" opacity="0.45"/>
    <rect x="336" y="236" width="48" height="48" rx="4" fill="var(--grey)" opacity="0.45"/>
    <rect x="96" y="296" width="48" height="48" rx="4" fill="var(--accent)"/>
    <rect x="156" y="296" width="48" height="48" rx="4" fill="var(--accent)"/>
    <rect x="216" y="296" width="48" height="48" rx="4" fill="var(--accent)"/>
    <rect x="276" y="296" width="48" height="48" rx="4" fill="var(--accent)"/>
    <rect x="336" y="296" width="48" height="48" rx="4" fill="var(--accent)"/>
    <rect x="96" y="356" width="48" height="48" rx="4" fill="var(--accent)"/>
    <rect x="156" y="356" width="48" height="48" rx="4" fill="var(--accent)"/>
    <rect x="216" y="356" width="48" height="48" rx="4" fill="var(--accent)"/>
    <rect x="276" y="356" width="48" height="48" rx="4" fill="var(--accent)"/>
    <rect x="336" y="356" width="48" height="48" rx="4" fill="var(--accent)"/>
  </g>
  <text class="lab" x="96" y="436">上排淡色 ＝ 被丟掉的那一半</text>

  <text class="grp" x="560" y="120">貼片・常溫</text>
  <text class="lab" x="560" y="146">裝進信封寄出去</text>
  <g fill="var(--accent)">
    <rect x="560" y="176" width="48" height="48" rx="4"/>
    <rect x="620" y="176" width="48" height="48" rx="4"/>
    <rect x="680" y="176" width="48" height="48" rx="4"/>
    <rect x="740" y="176" width="48" height="48" rx="4"/>
    <rect x="800" y="176" width="48" height="48" rx="4"/>
    <rect x="560" y="236" width="48" height="48" rx="4"/>
    <rect x="620" y="236" width="48" height="48" rx="4"/>
    <rect x="680" y="236" width="48" height="48" rx="4"/>
    <rect x="740" y="236" width="48" height="48" rx="4"/>
    <rect x="800" y="236" width="48" height="48" rx="4"/>
    <rect x="560" y="296" width="48" height="48" rx="4"/>
    <rect x="620" y="296" width="48" height="48" rx="4"/>
    <rect x="680" y="296" width="48" height="48" rx="4"/>
    <rect x="740" y="296" width="48" height="48" rx="4"/>
    <rect x="800" y="296" width="48" height="48" rx="4"/>
    <rect x="560" y="356" width="48" height="48" rx="4"/>
    <rect x="620" y="356" width="48" height="48" rx="4"/>
    <rect x="680" y="356" width="48" height="48" rx="4"/>
    <rect x="740" y="356" width="48" height="48" rx="4"/>
    <rect x="800" y="356" width="48" height="48" rx="4"/>
  </g>
  <text class="lab" x="560" y="436">沒有冷鏈這一層可斷</text>

  <text class="end" x="60" y="506">同一批貨，差別在遞送方式</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three bars compared by height: today's opportunity at a full ten, today's bubble at about seven, and the 2021 bubble at a full ten.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="80" y="60" font-size="27" font-weight="700">Two scores, not both maxed</text>
<line x1="150" y1="160" x2="900" y2="160" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 5"/>
<line x1="150" y1="315" x2="900" y2="315" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 5"/>
<line x1="150" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="166" font-size="15" fill="var(--dim)">10</text>
<text x="118" y="321" font-size="15" fill="var(--dim)">5</text>
<text x="118" y="476" font-size="15" fill="var(--dim)">0</text>
<rect x="200" y="160" width="110" height="310" fill="var(--accent)"/>
<text x="218" y="145" font-size="20" font-weight="700" fill="var(--accent)">10</text>
<text x="205" y="505" font-size="19">Opp set</text>
<rect x="360" y="263" width="110" height="207" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<line x1="360" y1="278" x2="470" y2="278" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 4"/>
<text x="356" y="248" font-size="20" font-weight="700" fill="var(--dim)">6.5–7</text>
<text x="390" y="505" font-size="19">Bub</text>
<text x="255" y="540" font-size="19" fill="var(--dim)">Now</text>
<rect x="700" y="160" width="110" height="310" fill="var(--warn)"/>
<text x="718" y="145" font-size="20" font-weight="700" fill="var(--warn)">10</text>
<text x="730" y="505" font-size="19">Bub</text>
<text x="735" y="540" font-size="19" fill="var(--dim)">2021</text>
<line x1="575" y1="130" x2="575" y2="545" stroke="var(--line)" stroke-width="2"/>
</svg>
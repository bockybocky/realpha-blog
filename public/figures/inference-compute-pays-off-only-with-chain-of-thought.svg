<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條曲線比較投入算力換到的成果，舊模型那條很快就壓平成一條水平線，有思維鏈之後那條持續往右上爬">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:700; fill:var(--ink); }
    .body { font-size:15px; fill:var(--dim); }
    .concl { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t title" x="60" y="56">算力吃不吃得下去</text>
  <line x1="140" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="140" y1="430" x2="140" y2="110" stroke="var(--line)" stroke-width="2"/>
  <text class="t body" x="660" y="462">丟進去的算力</text>
  <text class="t body" x="60" y="130">成果</text>
  <path d="M140 400 C 200 356 250 348 320 346 L880 344" fill="none" stroke="var(--grey)" stroke-width="5"/>
  <text class="t grp" x="640" y="330">以前</text>
  <text class="t body" x="640" y="354">多丟也沒用</text>
  <path d="M140 400 C 320 370 520 300 880 150" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <text class="t grp" x="700" y="140">有思維鏈</text>
  <text class="t body" x="700" y="164">一題同時跑一萬次</text>
  <text class="t concl" x="140" y="92">同一條軸，兩種斜率</text>
  <text class="t body" x="140" y="500">橫軸往右：從一美元到一整個團隊的推論期算力</text>
</svg>
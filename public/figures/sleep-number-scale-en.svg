<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On a zero to one hundred scale, a line at twenty-five splits it into a no-action part and a part that needs handling.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">Sleep number: one holding as a share of net worth</text>

  <rect x="120" y="270" width="185" height="36" fill="var(--card)"/>
  <line x1="120" y1="306" x2="860" y2="306" stroke="var(--line)" stroke-width="3"/>

  <line x1="120" y1="298" x2="120" y2="318" stroke="var(--grey)" stroke-width="2"/>
  <line x1="305" y1="298" x2="305" y2="318" stroke="var(--grey)" stroke-width="2"/>
  <line x1="490" y1="298" x2="490" y2="318" stroke="var(--grey)" stroke-width="2"/>
  <line x1="675" y1="298" x2="675" y2="318" stroke="var(--grey)" stroke-width="2"/>
  <line x1="860" y1="298" x2="860" y2="318" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="108" y="344">0</text>
  <text class="b" x="290" y="344">25</text>
  <text class="b" x="475" y="344">50</text>
  <text class="b" x="660" y="344">75</text>
  <text class="b" x="838" y="344">100</text>

  <line x1="305" y1="212" x2="305" y2="380" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="266" y="198" fill="var(--accent)">Your line</text>

  <text class="g" x="150" y="252">No action</text>
  <text class="g" x="560" y="252">Time to deal with it</text>

  <polygon points="342,368 330,392 354,392" fill="var(--dim)"/>
  <text class="b" x="300" y="416">Him at sixty</text>
  <polygon points="712,368 700,392 724,392" fill="var(--dim)"/>
  <text class="b" x="668" y="416">Him when young</text>

  <text class="c" x="120" y="490">Whether to sell half has no answer; the share does</text>
</svg>
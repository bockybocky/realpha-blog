<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The three dips in the price curve all come before the unlock lines, each shallower than the last.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--dim); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .sw { font-size:16px; fill:var(--warn); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="480" y="56" text-anchor="middle">The selling lands before the unlock</text>

  <line x1="90" y1="452" x2="910" y2="452" stroke="var(--line)" stroke-width="2"/>
  <text class="s" x="90" y="132">Price</text>

  <line x1="330" y1="140" x2="330" y2="452" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="580" y1="140" x2="580" y2="452" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="790" y1="140" x2="790" y2="452" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="g" x="330" y="128" text-anchor="middle">First unlock</text>
  <text class="g" x="580" y="128" text-anchor="middle">Second</text>
  <text class="g" x="790" y="128" text-anchor="middle">Third</text>

  <path d="M 110 250 L 170 236 L 215 262 C 260 300 300 386 322 400 C 360 372 400 320 436 292 C 480 276 520 300 566 312 C 610 296 646 268 690 262 C 728 258 760 272 782 280 C 830 250 870 218 900 196"
        fill="none" stroke="var(--accent)" stroke-width="3"/>

  <text class="sw" x="252" y="352">Selling</text>
  <text class="s" x="506" y="352">Shallower</text>
  <text class="s" x="716" y="316">Shallower still</text>

  <text class="c" x="480" y="522" text-anchor="middle">The first one absorbs uncertainty, not supply</text>
</svg>
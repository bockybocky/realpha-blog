<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="兩條長條：上面原本的等待時間分成儲存段與外部段，下面換 Optane 後儲存段縮成一小格，外部段不變，整條只短一截。">
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700} .g{font-size:20px;font-weight:700}
    .b{font-size:16px} .bb{font-size:16px;font-weight:700} .d{font-size:15px;fill:var(--dim)} .c{font-size:22px;font-weight:700}
</style>
<text x="480" y="50" class="t" text-anchor="middle">元件快了，整段只短一點</text>
<text x="480" y="84" class="d" text-anchor="middle">一次載入的等待時間（示意）</text>
<text x="60" y="180" class="g">原本</text>
<text x="320" y="140" class="b" text-anchor="middle">儲存</text>
<text x="620" y="140" class="b" text-anchor="middle">NVMe／PCIe 等外部</text>
<rect x="200" y="152" width="240" height="44" fill="var(--accent)"/>
<rect x="440" y="152" width="360" height="44" fill="var(--grey)"/>
<text x="60" y="300" class="g">換 Optane</text>
<text x="212" y="260" class="bb" text-anchor="middle" style="fill:var(--accent)">只縮這段</text>
<text x="404" y="260" class="d" text-anchor="middle">外部不變</text>
<rect x="200" y="272" width="24" height="44" fill="var(--accent)"/>
<rect x="224" y="272" width="360" height="44" fill="var(--grey)"/>
<line x1="584" y1="140" x2="584" y2="350" stroke="var(--dim)" stroke-dasharray="5 5"/>
<line x1="800" y1="140" x2="800" y2="350" stroke="var(--dim)" stroke-dasharray="5 5"/>
<path d="M584,350 V360 H800 V350" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text x="692" y="386" class="bb" text-anchor="middle" style="fill:var(--warn)">實際省下</text>
<text x="480" y="450" class="c" text-anchor="middle">好處被外部那段綁住</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Your own bill split into four line items against the amounts three years ago, with one item growing much faster.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">Split your bill</text>
<text class="b" x="60" y="88">Sample; grey=3y ago</text>

<text class="g" x="60" y="150">Plan</text>
<rect x="230" y="130" width="300" height="20" fill="var(--grey)"/>
<rect x="230" y="156" width="320" height="20" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="566" y="172">$5 → $5</text>

<text class="g" x="60" y="240">Adds</text>
<rect x="230" y="220" width="120" height="20" fill="var(--grey)"/>
<rect x="230" y="246" width="150" height="20" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="396" y="262">$2 → $2</text>

<text class="g" x="60" y="330">Device</text>
<rect x="230" y="310" width="60" height="20" fill="var(--grey)"/>
<rect x="230" y="336" width="330" height="20" fill="var(--warn)"/>
<text class="b" x="576" y="352" fill="var(--warn)">$1 → $6</text>

<text class="g" x="60" y="420">Fees</text>
<rect x="230" y="400" width="40" height="20" fill="var(--grey)"/>
<rect x="230" y="426" width="55" height="20" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="300" y="442">$1 → $1</text>

<text class="g" x="640" y="352" fill="var(--warn)">Watched?</text>

<text class="c" x="60" y="520">Biggest riser, unwatched</text>
</svg>
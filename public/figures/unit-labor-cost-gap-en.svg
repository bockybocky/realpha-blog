<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The productivity line is steeper than the wage line, and the gap opening between them is suppressed unit labor cost">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
</defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">He watched the gap between two lines</text>
<rect x="60" y="90" width="840" height="350" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="150" y1="120" x2="150" y2="405" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="405" x2="870" y2="405" stroke="var(--line)" stroke-width="2"/>
<path d="M160 370 L760 150 L760 260 Z" fill="var(--accent)" opacity="0.16"/>
<path d="M160 370 L760 150" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
<path d="M160 370 L760 260" fill="none" stroke="var(--dim)" stroke-width="5" stroke-linecap="round"/>
<text class="g" x="772" y="152">Productivity</text>
<text class="g" x="772" y="262">Wages</text>
<line x1="760" y1="150" x2="760" y2="260" stroke="var(--accent)" stroke-width="3"/>
<line x1="748" y1="150" x2="772" y2="150" stroke="var(--accent)" stroke-width="3"/>
<line x1="748" y1="260" x2="772" y2="260" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="500" y="236" fill="var(--accent)">This gap</text>
<text class="s" x="500" y="260">Unit labor cost held down</text>
<text class="s" x="810" y="432">Time</text>
<text class="c" x="60" y="492">Wages rose, but never caught productivity</text>
</svg>
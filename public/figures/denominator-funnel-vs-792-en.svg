<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The narrowing funnel on the left drops from 85 people to 10, while the right side is a block of 792 people that never narrows.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">Has the denominator been touched</text>
<text class="g" x="90" y="118">Titled "a study of 85 people"</text>
<polygon points="90,150 390,150 300,420 180,420" fill="var(--grey)" opacity="0.5"/>
<polygon points="180,420 300,420 300,470 180,470" fill="var(--warn)"/>
<text class="b" x="400" y="210">Excluded: no reading</text>
<text class="b" x="400" y="242">Excluded: poor signal</text>
<text class="b" x="400" y="274">Excluded: other reasons</text>
<text class="g" x="186" y="506">10 left</text>
<line x1="570" y1="140" x2="570" y2="500" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="620" y="118">White paper says 792 people</text>
<rect x="620" y="150" width="280" height="320" fill="var(--accent)"/>
<text class="b" x="620" y="506">No narrowing</text>
<text class="c" x="60" y="546">Turn first to the number finally included in the analysis</text>
</svg>
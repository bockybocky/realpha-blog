<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條七節管道在第三節被切斷，後段轉灰，右下既有算力價格往上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">排隊順序：GPU 在最後面</text>
<text x="60" y="92" font-size="16" fill="var(--dim)">前段任一節斷，後段全部停在原地</text>

<rect x="60" y="150" width="112" height="76" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="116" y="196" font-size="20" text-anchor="middle" fill="var(--ink)">地</text>
<rect x="172" y="178" width="18" height="20" fill="var(--accent)"/>

<rect x="190" y="150" width="112" height="76" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="246" y="196" font-size="20" text-anchor="middle" fill="var(--ink)">地目</text>
<rect x="302" y="178" width="18" height="20" fill="var(--accent)"/>

<rect x="320" y="150" width="112" height="76" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="376" y="196" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">電</text>
<path d="M440 132 L428 170 L452 188 L432 226 L452 252" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linejoin="round"/>
<text x="440" y="118" font-size="19" text-anchor="middle" fill="var(--warn)">斷點</text>

<rect x="462" y="150" width="104" height="76" rx="10" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text x="514" y="196" font-size="20" text-anchor="middle" fill="var(--grey)">水</text>
<rect x="566" y="180" width="16" height="16" fill="var(--grey)"/>
<rect x="582" y="150" width="104" height="76" rx="10" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text x="634" y="196" font-size="20" text-anchor="middle" fill="var(--grey)">消防</text>
<rect x="686" y="180" width="16" height="16" fill="var(--grey)"/>
<rect x="702" y="150" width="104" height="76" rx="10" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text x="754" y="196" font-size="20" text-anchor="middle" fill="var(--grey)">許可</text>
<rect x="806" y="180" width="16" height="16" fill="var(--grey)"/>
<rect x="822" y="150" width="78" height="76" rx="10" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="861" y="196" font-size="20" text-anchor="middle" fill="var(--grey)">GPU</text>

<path d="M376 252 L376 316" fill="none" stroke="var(--line)" stroke-width="3"/>
<path d="M376 316 L180 316 L180 364" fill="none" stroke="var(--line)" stroke-width="3"/>
<path d="M376 316 L740 316 L740 364" fill="none" stroke="var(--line)" stroke-width="3"/>
<path d="M172 364 L180 380 L188 364 Z" fill="var(--grey)"/>
<path d="M732 364 L740 380 L748 364 Z" fill="var(--accent)"/>

<rect x="60" y="388" width="240" height="96" rx="12" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text x="180" y="432" font-size="20" text-anchor="middle" fill="var(--grey)">新案場</text>
<text x="180" y="462" font-size="16" text-anchor="middle" fill="var(--grey)">出不來</text>

<rect x="620" y="388" width="240" height="96" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="712" y="432" font-size="20" text-anchor="middle" fill="var(--ink)">既有算力</text>
<text x="712" y="462" font-size="16" text-anchor="middle" fill="var(--dim)">漲價空間</text>
<path d="M812 466 L812 406" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M800 414 L812 396 L824 414 Z" fill="var(--accent)"/>
<text x="480" y="524" font-size="22" text-anchor="middle" fill="var(--ink)">同一個斷點，兩種相反的結果</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根長條：費用率差一個百分點，二十年後終值矮一截">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); }
  .g { font-size:20px; fill:var(--dim); }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">費用率差 1%，二十年的缺口</text>
<text class="g" x="60" y="98">本金 100 萬 · 年化 10% · 20 年</text>

<line x1="200" y1="410" x2="820" y2="410" stroke="var(--line)" stroke-width="2"/>
<rect x="260" y="150" width="140" height="260" rx="8" fill="var(--accent)"/>
<text class="g" x="260" y="440">費用率低</text>
<rect x="580" y="242" width="140" height="168" rx="8" fill="var(--grey)"/>
<text class="g" x="580" y="440">費用率高 1%</text>

<line x1="440" y1="150" x2="560" y2="150" stroke="var(--warn)" stroke-dasharray="5 5"/>
<line x1="440" y1="242" x2="560" y2="242" stroke="var(--warn)" stroke-dasharray="5 5"/>
<path d="M500 150 L500 242" stroke="var(--warn)" stroke-width="3"/>
<path d="M500 150 l-6 12 h12 z" fill="var(--warn)"/>
<path d="M500 242 l-6 -12 h12 z" fill="var(--warn)"/>
<text class="g" x="512" y="200" fill="var(--warn)">約 100 多萬</text>

<text class="c" x="60" y="490">同樣的報酬率，扣的地方不同</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="價格基線上中間柱群高聳、兩側柱群低矮，箭頭由兩側流向中間，呈現資金擠向熱潮中心、邊緣被冷落的高度差">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">資金往中間擠，貴的也在中間</text>

  <line x1="90" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
  <text x="64" y="300" text-anchor="middle" font-size="16" fill="var(--dim)" transform="rotate(-90 64 300)">價格</text>

  <rect x="110" y="370" width="34" height="60" fill="var(--grey)"/>
  <rect x="155" y="385" width="34" height="45" fill="var(--grey)"/>
  <rect x="200" y="360" width="34" height="70" fill="var(--grey)"/>

  <rect x="380" y="230" width="34" height="200" fill="var(--warn)"/>
  <rect x="425" y="190" width="34" height="240" fill="var(--warn)"/>
  <rect x="470" y="205" width="34" height="225" fill="var(--warn)"/>
  <rect x="515" y="175" width="34" height="255" fill="var(--warn)"/>
  <rect x="560" y="215" width="34" height="215" fill="var(--warn)"/>

  <rect x="740" y="375" width="34" height="55" fill="var(--grey)"/>
  <rect x="785" y="360" width="34" height="70" fill="var(--grey)"/>
  <rect x="830" y="380" width="34" height="50" fill="var(--grey)"/>

  <path d="M250 340 Q 310 300 352 264" stroke="var(--accent)" stroke-width="2.5" fill="none"/>
  <polygon points="360,256 344,258 352,272" fill="var(--accent)"/>
  <path d="M720 345 Q 660 305 618 270" stroke="var(--accent)" stroke-width="2.5" fill="none"/>
  <polygon points="610,262 626,264 618,278" fill="var(--accent)"/>
  <text x="288" y="298" text-anchor="middle" font-size="15" fill="var(--accent)">資金</text>
  <text x="682" y="303" text-anchor="middle" font-size="15" fill="var(--accent)">資金</text>

  <text x="487" y="146" text-anchor="middle" font-size="19" fill="var(--warn)">最貴</text>
  <text x="172" y="332" text-anchor="middle" font-size="15" fill="var(--dim)">可能錯價</text>
  <text x="802" y="332" text-anchor="middle" font-size="15" fill="var(--dim)">可能錯價</text>

  <text x="172" y="462" text-anchor="middle" font-size="19" fill="var(--dim)">被冷落</text>
  <text x="487" y="462" text-anchor="middle" font-size="20" fill="var(--ink)">熱潮中心</text>
  <text x="802" y="462" text-anchor="middle" font-size="19" fill="var(--dim)">被冷落</text>

  <text x="480" y="508" text-anchor="middle" font-size="22" fill="var(--ink)">熱鬧的中心最貴，錯價在角落</text>
</svg>
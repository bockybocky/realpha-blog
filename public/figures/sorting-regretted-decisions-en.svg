<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three dots sorted into two baskets, one on the left and two on the right, with a different fix below each">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.a{font-size:19px;fill:var(--accent);font-weight:700}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56">Sort the regrets into two piles first</text>
<text class="s" x="60" y="92">The three you most regret from the past year</text>

<circle cx="420" cy="140" r="13" fill="var(--grey)"/>
<circle cx="480" cy="140" r="13" fill="var(--grey)"/>
<circle cx="540" cy="140" r="13" fill="var(--grey)"/>

<path d="M420 158 L250 208" stroke="var(--line)" stroke-width="2"/>
<path d="M486 158 L640 208" stroke="var(--line)" stroke-width="2"/>
<path d="M540 158 L700 208" stroke="var(--line)" stroke-width="2"/>

<rect x="90" y="220" width="330" height="150" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="255" y="258" text-anchor="middle">My judgement was wrong</text>
<circle cx="255" cy="320" r="22" fill="var(--grey)"/>

<rect x="540" y="220" width="330" height="150" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="g" x="705" y="258" text-anchor="middle">Forced to decide without the information</text>
<circle cx="668" cy="320" r="22" fill="var(--accent)"/>
<circle cx="742" cy="320" r="22" fill="var(--accent)"/>

<path d="M255 380 L255 412" stroke="var(--line)" stroke-width="2"/>
<path d="M255 420 L249 406 L261 406 Z" fill="var(--line)"/>
<text class="s" x="255" y="446" text-anchor="middle">Train judgement</text>

<path d="M705 380 L705 412" stroke="var(--accent)" stroke-width="2"/>
<path d="M705 420 L699 406 L711 406 Z" fill="var(--accent)"/>
<text class="a" x="705" y="448" text-anchor="middle">Get those numbers in place first</text>

<text class="c" x="480" y="506" text-anchor="middle">The heavier pile tells you what to fix</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="地面線下方兩個坑，左邊寬而淺、右邊窄而深">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); }
    .g  { font-size:19px; fill:var(--dim); }
    .s  { font-size:15px; fill:var(--dim); }
    .c  { font-size:22px; fill:var(--ink); }
</style>
<text class="ti" x="80" y="62">同樣的力氣，攤平挖還是往下挖</text>
<line x1="90" y1="250" x2="880" y2="250" stroke="var(--ink)" stroke-width="3"/>
<path d="M140 250 L 152 332 L 418 332 L 430 250 Z" fill="var(--grey)" fill-opacity="0.45" stroke="var(--grey)" stroke-width="2"/>
<path d="M600 250 L 614 472 L 706 472 L 720 250 Z" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="140" y="228">全功能重建</text>
<text class="g" x="600" y="228">單一訊號</text>
<text class="s" x="285" y="300" text-anchor="middle">寬</text>
<text class="s" x="660" y="300" text-anchor="middle">窄</text>
<text class="s" x="285" y="356" text-anchor="middle">淺</text>
<text class="s" x="660" y="452" text-anchor="middle">深</text>
<line x1="90" y1="266" x2="90" y2="470" stroke="var(--dim)" stroke-width="2"/>
<path d="M90 470 l -6 -12 l 12 0 Z" fill="var(--dim)"/>
<text class="s" x="104" y="400">挖掘深度</text>
<text class="c" x="80" y="522">寬度換深度</text>
</svg>
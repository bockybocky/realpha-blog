<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上格赤字線五十年平坦不變，下格利差線長期平坦後在最右端陡然上翹">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">兩條線不同步</text>
<rect x="60" y="92" width="840" height="186" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="84" y="126" font-size="19" fill="var(--ink)">赤字水位</text>
<line x1="120" y1="152" x2="876" y2="152" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="98" y="157" font-size="15" fill="var(--dim)">0</text>
<polyline points="120,212 220,224 320,206 420,220 520,210 620,226 720,208 820,222 876,214" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text x="120" y="262" font-size="16" fill="var(--dim)">五十年都在線下</text>
<rect x="60" y="306" width="840" height="186" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="84" y="340" font-size="19" fill="var(--ink)">公債利差</text>
<polyline points="120,438 300,440 500,436 660,438 760,422 820,392 876,358" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="876" cy="358" r="7" fill="var(--accent)"/>
<text x="786" y="344" font-size="16" fill="var(--accent)">現在</text>
<text x="120" y="476" font-size="16" fill="var(--dim)">長期平坦</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="五個節點組成的順時針環，從建置熱潮到原物料與工資、通膨黏著、長端與折現率、遠端獲利評價受壓，中央寫著同一個變數出現兩次">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<defs>
<marker id="a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="56">這個環轉一圈，會回頭壓住自己</text>

<path d="M516,149 A175,175 0 0 1 632,232" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#a7a)"/>
<path d="M654,302 A175,175 0 0 1 610,437" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#a7a)"/>
<path d="M551,480 A175,175 0 0 1 409,480" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#a7a)"/>
<path d="M350,437 A175,175 0 0 1 306,302" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#a7a)"/>
<path d="M328,232 A175,175 0 0 1 444,149" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#a7a)"/>

<circle cx="480" cy="145" r="9" fill="var(--accent)"/>
<circle cx="646" cy="266" r="9" fill="var(--accent)"/>
<circle cx="583" cy="462" r="9" fill="var(--accent)"/>
<circle cx="377" cy="462" r="9" fill="var(--accent)"/>
<circle cx="314" cy="266" r="9" fill="var(--accent)"/>

<text class="g" x="480" y="120" text-anchor="middle">建置熱潮</text>
<text class="g" x="670" y="262">原物料 · 工資</text>
<text class="g" x="610" y="500">通膨黏著</text>
<text class="g" x="350" y="500" text-anchor="end">長端 · 折現率</text>
<text class="g" x="290" y="262" text-anchor="end">遠端獲利</text>
<text class="b" x="290" y="288" text-anchor="end">評價受壓</text>

<text class="g" x="480" y="312" text-anchor="middle">同一個變數</text>
<text class="b" x="480" y="342" text-anchor="middle">在模型裡出現兩次</text>
<text class="b" x="480" y="370" text-anchor="middle" fill="var(--warn)">方向相反</text>

<text class="c" x="60" y="562">推高它的東西，也在壓低它的評價</text>
</svg>
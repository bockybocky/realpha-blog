<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三個互相重疊的圓，只有三者共同重疊的中心區域才是產業，缺任一圓就落到外圈的失敗結果">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">三個圓疊在一起，中間才有產業</text>
<circle cx="390" cy="265" r="135" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
<circle cx="570" cy="265" r="135" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
<circle cx="480" cy="400" r="135" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
<text x="330" y="175" text-anchor="middle" font-size="20" fill="var(--ink)">真實買家</text>
<text x="640" y="175" text-anchor="middle" font-size="20" fill="var(--ink)">可累積技能</text>
<text x="480" y="520" text-anchor="middle" font-size="20" fill="var(--ink)">通訊頻寬</text>
<text x="480" y="305" text-anchor="middle" font-size="20" fill="var(--ink)">產業</text>
<text x="150" y="250" text-anchor="middle" font-size="16" fill="var(--dim)">缺買家</text>
<text x="150" y="275" text-anchor="middle" font-size="16" fill="var(--dim)">交差的廢品</text>
<text x="820" y="250" text-anchor="middle" font-size="16" fill="var(--dim)">缺技能</text>
<text x="820" y="275" text-anchor="middle" font-size="16" fill="var(--dim)">沒有第二筆</text>
<text x="150" y="430" text-anchor="middle" font-size="16" fill="var(--dim)">缺頻寬</text>
<text x="150" y="455" text-anchor="middle" font-size="16" fill="var(--dim)">只賣機票</text>
</svg>
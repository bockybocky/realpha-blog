<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Rival trucks are confined to the highway band while one branch leaves the band and runs into the grid of houses.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="48" y="62">He may leave the highway</text>

<rect x="48" y="160" width="864" height="86" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<line x1="60" y1="203" x2="900" y2="203" stroke="var(--grey)" stroke-width="3" stroke-dasharray="20 16"/>
<text class="g" x="60" y="144">Highway</text>

<rect x="120" y="170" width="56" height="28" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<rect x="250" y="210" width="56" height="28" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<rect x="700" y="170" width="56" height="28" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<rect x="820" y="210" width="56" height="28" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>

<rect x="440" y="170" width="60" height="30" fill="var(--accent)"/>
<polyline points="470,200 470,300 320,300" fill="none" stroke="var(--accent)" stroke-width="5" stroke-dasharray="12 8"/>
<polygon points="320,286 284,300 320,314" fill="var(--accent)"/>
<polyline points="470,200 470,300 640,300" fill="none" stroke="var(--accent)" stroke-width="5" stroke-dasharray="12 8"/>
<polygon points="640,286 676,300 640,314" fill="var(--accent)"/>

<text class="g" x="60" y="400">Homes</text>
<polygon points="200,420 228,396 256,420" fill="var(--grey)"/>
<rect x="208" y="420" width="40" height="32" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="300,420 328,396 356,420" fill="var(--grey)"/>
<rect x="308" y="420" width="40" height="32" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="400,420 428,396 456,420" fill="var(--grey)"/>
<rect x="408" y="420" width="40" height="32" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="500,420 528,396 556,420" fill="var(--grey)"/>
<rect x="508" y="420" width="40" height="32" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="600,420 628,396 656,420" fill="var(--grey)"/>
<rect x="608" y="420" width="40" height="32" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="250,484 278,460 306,484" fill="var(--grey)"/>
<rect x="258" y="484" width="40" height="32" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="350,484 378,460 406,484" fill="var(--grey)"/>
<rect x="358" y="484" width="40" height="32" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="450,484 478,460 506,484" fill="var(--grey)"/>
<rect x="458" y="484" width="40" height="32" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="550,484 578,460 606,484" fill="var(--grey)"/>
<rect x="558" y="484" width="40" height="32" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

<text class="c" x="700" y="500">Won</text>
<text class="c" x="700" y="528">its own exit</text>
</svg>
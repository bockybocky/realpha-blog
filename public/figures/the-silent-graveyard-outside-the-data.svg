<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩個小圓圈被一大片灰色區域包圍，灰色代表不進統計的案子">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .d { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700">統計看不到的那一堆</text>
<text class="d" x="60" y="94" font-size="16">圓圈內＝有資料的案子</text>

<rect x="60" y="130" width="840" height="360" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="10 8"/>
<circle cx="300" cy="280" r="104" fill="var(--accent)"/>
<circle cx="520" cy="280" r="40" fill="var(--warn)"/>
<text class="t" x="300" y="288" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">核准</text>
<text class="t" x="520" y="288" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">否決</text>

<text class="t" x="640" y="256" font-size="22" font-weight="700">刻意避開</text>
<text class="d" x="640" y="290" font-size="16">八成受訪開發商這樣選址</text>
<text class="d" x="640" y="316" font-size="16">不在核准數，也不在否決數</text>

<text class="d" x="60" y="534" font-size="16">討論制度好不好時，手上的資料都偏向有進場的人</text>
</svg>
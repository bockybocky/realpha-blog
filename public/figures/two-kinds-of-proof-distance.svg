<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="臨床證據離貨架很遠，包裝上的小組測試百分比就貼在購買現場">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="40" y="52" font-size="27" fill="var(--ink)">兩種證據，離貨架的距離不一樣</text>

  <line x1="60" y1="330" x2="900" y2="330" stroke="var(--line)" stroke-width="3"/>
  <text x="60" y="366" font-size="16" fill="var(--dim)">離購買現場遠</text>
  <text x="790" y="366" font-size="16" fill="var(--dim)">就在眼前</text>

  <rect x="60" y="128" width="280" height="150" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="84" y="170" font-size="20" fill="var(--ink)">28 天臨床</text>
  <text x="84" y="202" font-size="16" fill="var(--dim)">菌相位移・症狀減輕</text>
  <text x="84" y="230" font-size="16" fill="var(--dim)">睡得好一些</text>
  <text x="84" y="258" font-size="16" fill="var(--warn)">沒給樣本數與效果量</text>
  <line x1="200" y1="278" x2="200" y2="330" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="84" y="406" font-size="16" fill="var(--dim)">只對願意讀的人有用</text>

  <rect x="560" y="128" width="300" height="150" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="584" y="170" font-size="20" fill="var(--ink)">小組測試印在包裝</text>
  <text x="584" y="202" font-size="16" fill="var(--dim)">25 ／ 50 ／ 100 人</text>
  <text x="584" y="230" font-size="16" fill="var(--dim)">立即・第三天・第七天</text>
  <text x="584" y="258" font-size="16" fill="var(--accent)">把百分比寫在盒子上</text>
  <line x1="710" y1="278" x2="710" y2="330" stroke="var(--accent)" stroke-width="2"/>

  <circle cx="710" cy="406" r="20" fill="var(--accent)"/>
  <path d="M684 480 Q710 412 736 480 Z" fill="var(--accent)"/>
  <text x="752" y="412" font-size="19" fill="var(--ink)">跟我一樣的人</text>
  <text x="752" y="440" font-size="16" fill="var(--dim)">用起來怎麼樣</text>
</svg>
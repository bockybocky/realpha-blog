<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條線在同一時間軸上分岔，人才線持續上揚，報酬線幾乎水平，右端出現明顯落差">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .t{font-size:27px;fill:var(--ink);font-weight:700}
    .g{font-size:19px;font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .s{font-size:15px;fill:var(--dim)}
    .c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">人變了，報酬還沒跟上</text>
<text class="b" x="60" y="88">十二年前那張就業一覽表上，還沒有新創</text>
<line x1="120" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="120" x2="120" y2="420" stroke="var(--line)" stroke-width="2"/>
<path d="M120 386 L320 342 L520 268 L700 202 L840 166" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
<path d="M120 396 L320 388 L520 376 L700 366 L840 358" fill="none" stroke="var(--grey)" stroke-width="5" stroke-linecap="round"/>
<line x1="866" y1="166" x2="866" y2="358" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="g" x="600" y="182" fill="var(--accent)">進來的人</text>
<text class="g" x="600" y="348" fill="var(--dim)">給得出的報酬</text>
<text class="s" x="884" y="268" fill="var(--warn)">落差</text>
<text class="s" x="120" y="452">十二年前</text>
<text class="s" x="840" y="452">現在</text>
<text class="c" x="60" y="496">代為保管了這些人，卻還付不起</text>
</svg>
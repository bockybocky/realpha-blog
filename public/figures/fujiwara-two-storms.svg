<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩個旋渦互相繞轉，中間交會處疊起一根更高的柱子，表示兩股力量互相增強">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">藤原效應</text>
<text class="t" x="60" y="98" font-size="16" fill="var(--dim)">兩個颶風靠得夠近，就互相繞轉、彼此增強</text>

<circle cx="270" cy="270" r="112" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<path d="M270 190 A80 80 0 0 1 336 302" fill="none" stroke="var(--grey)" stroke-width="8" stroke-linecap="round"/>
<path d="M270 350 A80 80 0 0 1 204 238" fill="none" stroke="var(--grey)" stroke-width="8" stroke-linecap="round"/>
<circle cx="270" cy="270" r="14" fill="var(--accent)"/>
<text class="t" x="270" y="424" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">資訊時代</text>
<text class="t" x="270" y="450" font-size="15" fill="var(--dim)" text-anchor="middle">高度破壞性</text>

<circle cx="690" cy="270" r="112" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<path d="M690 190 A80 80 0 0 1 756 302" fill="none" stroke="var(--grey)" stroke-width="8" stroke-linecap="round"/>
<path d="M690 350 A80 80 0 0 1 624 238" fill="none" stroke="var(--grey)" stroke-width="8" stroke-linecap="round"/>
<circle cx="690" cy="270" r="14" fill="var(--accent)"/>
<text class="t" x="690" y="424" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">深度金融化</text>
<text class="t" x="690" y="450" font-size="15" fill="var(--dim)" text-anchor="middle">資產與債務擴張</text>

<path d="M400 214 A110 70 0 0 1 560 214" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 7"/>
<path d="M560 326 A110 70 0 0 1 400 326" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 7"/>
<path d="M560 214 l-16 -12 l4 18 z" fill="var(--accent)"/>
<path d="M400 326 l16 12 l-4 -18 z" fill="var(--accent)"/>

<rect x="452" y="240" width="56" height="60" rx="6" fill="var(--accent)" opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="480" y="278" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">強</text>
<text class="t" x="480" y="500" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">靠得越近，彼此越強</text>
</svg>
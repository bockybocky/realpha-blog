<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A bar chart with the left half very high and the right half very deep, no transition in between">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  .ttl{font-size:27px;fill:var(--ink);font-weight:700}
  .lbl{font-size:19px;fill:var(--ink);font-weight:600}
  .txt{font-size:16px;fill:var(--dim)}
  .cc{font-size:22px;fill:var(--ink);font-weight:600}
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="ttl" x="60" y="62">Key cut, lock changed</text>
<line x1="110" y1="290" x2="890" y2="290" stroke="var(--line)" stroke-width="2"/>
<rect x="140" y="270" width="30" height="20" fill="var(--accent)"/>
<rect x="180" y="255" width="30" height="35" fill="var(--accent)"/>
<rect x="220" y="230" width="30" height="60" fill="var(--accent)"/>
<rect x="260" y="200" width="30" height="90" fill="var(--accent)"/>
<rect x="300" y="160" width="30" height="130" fill="var(--accent)"/>
<rect x="340" y="140" width="30" height="150" fill="var(--accent)"/>
<rect x="380" y="150" width="30" height="140" fill="var(--accent)"/>
<rect x="420" y="180" width="30" height="110" fill="var(--accent)"/>
<rect x="460" y="250" width="30" height="40" fill="var(--accent)"/>
<rect x="500" y="290" width="30" height="30" fill="var(--warn)"/>
<rect x="540" y="290" width="30" height="90" fill="var(--warn)"/>
<rect x="580" y="290" width="30" height="140" fill="var(--warn)"/>
<rect x="620" y="290" width="30" height="150" fill="var(--warn)"/>
<rect x="660" y="290" width="30" height="120" fill="var(--warn)"/>
<rect x="700" y="290" width="30" height="60" fill="var(--warn)"/>
<rect x="740" y="290" width="30" height="95" fill="var(--warn)"/>
<rect x="780" y="290" width="30" height="130" fill="var(--warn)"/>
<rect x="820" y="290" width="30" height="70" fill="var(--warn)"/>
<text class="lbl" x="300" y="118" fill="var(--accent)">Best on record</text>
<text class="lbl" x="640" y="472" fill="var(--warn)">Among the worst</text>
<text class="cc" x="60" y="516">They come in clumps</text>
</svg>
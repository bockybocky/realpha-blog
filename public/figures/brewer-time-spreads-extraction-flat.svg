<text x="72" y="366" font-size="16" fill="var(--dim)">聰明</text>
<rect x="160" y="352" width="154" height="20" rx="4" fill="var(--accent)"/>
<text x="326" y="367" font-size="15" fill="var(--ink)">4:20</text>

<text x="72" y="402" font-size="15" fill="var(--warn)">Melitta：粉堵住了</text>

<rect x="492" y="90" width="420" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="516" y="124" font-size="20" font-weight="700" fill="var(--ink)">萃取率</text>
<text x="840" y="124" font-size="15" text-anchor="end" fill="var(--dim)">百分比</text>

<line x1="604" y1="140" x2="604" y2="386" stroke="var(--grey)" stroke-width="1" stroke-dasharray="4 4"/>
<text x="604" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">19%</text>
<line x1="824" y1="140" x2="824" y2="386" stroke="var(--grey)" stroke-width="1" stroke-dasharray="4 4"/>
<text x="824" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">21%</text>

<text x="516" y="166" font-size="16" fill="var(--dim)">V60</text>
<rect x="604" y="152" width="132" height="20" rx="4" fill="var(--accent)"/>
<text x="748" y="167" font-size="15" fill="var(--ink)">20.2</text>

<text x="516" y="216" font-size="16" fill="var(--dim)">星芒</text>
<rect x="604" y="202" width="143" height="20" rx="4" fill="var(--accent)"/>
<text x="759" y="217" font-size="15" fill="var(--ink)">20.3</text>

<text x="516" y="266" font-size="16" fill="var(--dim)">Kalita</text>

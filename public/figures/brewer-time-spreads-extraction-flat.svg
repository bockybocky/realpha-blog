<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊時間長條長短拉開一倍，右邊萃取率長條幾乎等長成一道平牆">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">時間差兩分多鐘，萃取率只差一點</text>

<rect x="48" y="90" width="420" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="72" y="124" font-size="20" font-weight="700" fill="var(--ink)">總時間</text>
<text x="396" y="124" font-size="15" text-anchor="end" fill="var(--dim)">分秒</text>

<text x="72" y="166" font-size="16" fill="var(--dim)">V60</text>
<rect x="160" y="152" width="124" height="20" rx="4" fill="var(--accent)"/>
<text x="296" y="167" font-size="15" fill="var(--ink)">3:30</text>

<text x="72" y="216" font-size="16" fill="var(--dim)">星芒</text>

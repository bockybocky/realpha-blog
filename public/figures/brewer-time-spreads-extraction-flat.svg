<text x="326" y="267" font-size="15" fill="var(--ink)">4:20</text>

<text x="72" y="316" font-size="16" fill="var(--dim)">Melitta</text>
<rect x="160" y="302" width="195" height="20" rx="4" fill="var(--warn)"/>

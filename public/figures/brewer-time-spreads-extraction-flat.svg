<text x="704" y="317" font-size="15" fill="var(--ink)">19.8</text>

<text x="516" y="366" font-size="16" fill="var(--dim)">聰明</text>
<rect x="604" y="352" width="209" height="20" rx="4" fill="var(--accent)"/>
<text x="825" y="367" font-size="15" fill="var(--ink)">20.9</text>

<text x="48" y="474" font-size="22" font-weight="700" fill="var(--ink)">換濾杯，改最多的是時間</text>
<text x="48" y="506" font-size="15" fill="var(--dim)">同一包豆子、同樣三段式注水；模型數字</text>

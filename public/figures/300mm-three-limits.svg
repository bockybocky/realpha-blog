<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三組成對長條顯示重量、搬運頻次與晶圓面積在三百毫米世代同時變大，其中重量越過標示人因上限的虛線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl{font-size:27px;fill:var(--ink);font-weight:700}
    .grp{font-size:20px;fill:var(--ink);font-weight:600}
    .bd{font-size:16px;fill:var(--dim)}
    .val{font-size:16px;fill:var(--ink)}
    .wn{font-size:16px;fill:var(--warn);font-weight:600}
    .cc{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="ttl" x="60" y="62">300 毫米，三件事一起變重</text>
<rect x="620" y="44" width="18" height="18" rx="3" fill="var(--grey)"/>
<text class="bd" x="646" y="59">200 毫米</text>
<rect x="760" y="44" width="18" height="18" rx="3" fill="var(--accent)"/>
<text class="bd" x="786" y="59">300 毫米</text>

<text class="grp" x="60" y="200">晶圓盒重量</text>
<rect x="300" y="150" width="245" height="26" rx="4" fill="var(--grey)"/>
<text class="val" x="557" y="169">5.8 公斤</text>
<rect x="300" y="184" width="380" height="26" rx="4" fill="var(--accent)"/>
<text class="val" x="692" y="203">9 公斤</text>
<line x1="640" y1="140" x2="640" y2="222" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
<text class="wn" x="640" y="132" text-anchor="middle">人因上限</text>

<text class="grp" x="60" y="300">每小時搬運次數</text>
<rect x="300" y="250" width="190" height="26" rx="4" fill="var(--grey)"/>
<text class="val" x="502" y="269">125 到 175 次</text>
<rect x="300" y="284" width="380" height="26" rx="4" fill="var(--accent)"/>
<text class="val" x="692" y="303">300 次以上</text>

<text class="grp" x="60" y="400">晶圓面積</text>
<rect x="300" y="350" width="169" height="26" rx="4" fill="var(--grey)"/>
<text class="val" x="481" y="369">1 倍</text>
<rect x="300" y="384" width="380" height="26" rx="4" fill="var(--accent)"/>
<text class="val" x="692" y="403">2.25 倍</text>

<text class="cc" x="60" y="486">9 公斤是兩隻家貓，一個人一整班搬不了三百次。</text>
</svg>
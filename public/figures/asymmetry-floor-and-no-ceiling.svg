<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="下方三根虧損柱止於同一條地板線，右方一根獲利柱向上超出畫面">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">賠有地板，賺沒有天花板</text>

  <line x1="80" y1="360" x2="900" y2="360" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="52" y="366">0</text>

  <rect x="140" y="360" width="52" height="110" fill="var(--warn)"/>
  <rect x="222" y="360" width="52" height="110" fill="var(--warn)"/>
  <rect x="304" y="360" width="52" height="110" fill="var(--warn)"/>
  <line x1="110" y1="470" x2="420" y2="470" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="g" x="140" y="505">三檔歸零</text>
  <text class="b" x="270" y="505">止於同一條地板</text>

  <rect x="620" y="110" width="92" height="250" fill="var(--accent)"/>
  <polygon points="666,72 640,112 692,112" fill="var(--accent)"/>
  <text class="g" x="600" y="394">第四檔十倍</text>
  <text class="g" x="736" y="118">沒有上限</text>

  <text class="c" x="60" y="536">命中一半多一點，形狀就撐得住</text>
</svg>
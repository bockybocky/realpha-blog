<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The centre circle is the model, the two outer arcs are memory and tools, and two blocks on the right feed into the outer ring.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">The unlock sits outside the model</text>

<circle cx="330" cy="300" r="150" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="1 0"/>
<circle cx="330" cy="300" r="106" fill="none" stroke="var(--line)" stroke-width="2"/>
<circle cx="330" cy="300" r="66" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="t" x="330" y="294" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">Model</text>
<text class="t" x="330" y="322" font-size="15" fill="var(--dim)" text-anchor="middle">Core</text>

<text class="t" x="330" y="200" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Memory</text>
<text class="t" x="330" y="412" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Tool use</text>
<text class="t" x="330" y="128" font-size="16" fill="var(--accent)" text-anchor="middle">Exoskeleton</text>

<rect x="620" y="156" width="280" height="86" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="644" y="196" font-size="19" font-weight="700" fill="var(--ink)">Your facts</text>
<text class="t" x="644" y="222" font-size="15" fill="var(--dim)">What others lack</text>
<line x1="620" y1="199" x2="470" y2="226" stroke="var(--accent)" stroke-width="3"/>

<rect x="620" y="358" width="280" height="86" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="644" y="398" font-size="19" font-weight="700" fill="var(--ink)">Your tools</text>
<text class="t" x="644" y="424" font-size="15" fill="var(--dim)">Already there</text>
<line x1="620" y1="401" x2="470" y2="374" stroke="var(--accent)" stroke-width="3"/>

<text class="t" x="60" y="506" font-size="22" font-weight="700" fill="var(--ink)">Both are already in your hands</text>
</svg>
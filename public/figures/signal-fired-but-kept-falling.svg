<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條往右下走的價格線，中間標著違約交割消息的虛線，之後那段線仍然繼續下滑，末端以虛線延伸向更低的位置"><rect x="0" y="0" width="960" height="540" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style><g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'><text x="60" y="58" font-size="27px" fill="var(--ink)" text-anchor="start" font-weight="600">訊號亮了，然後又跌了四五天</text><polyline points="120,170 166,185 212,205 258,230 304,250 350,268" fill="none" stroke="var(--grey)" stroke-width="3.5"/><polyline points="350,268 396,292 442,310 488,326 534,340 580,352" fill="none" stroke="var(--warn)" stroke-width="3.5"/><polyline points="580,352 660,378 740,396 820,406" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/><line x1="350" y1="120" x2="350" y2="420" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5"/><text x="350" y="110" font-size="20px" fill="var(--ink)" text-anchor="middle" font-weight="600">違約交割消息</text><text x="350" y="142" font-size="16px" fill="var(--dim)" text-anchor="middle" font-weight="normal">老股民：差不多了</text><line x1="350" y1="444" x2="580" y2="444" stroke="var(--warn)" stroke-width="2"/><text x="465" y="470" font-size="16px" fill="var(--warn)" text-anchor="middle" font-weight="normal">又四五個交易日</text><text x="840" y="412" font-size="16px" fill="var(--dim)" text-anchor="start" font-weight="normal">還有兩三個低點？</text><text x="120" y="440" font-size="16px" fill="var(--dim)" text-anchor="start" font-weight="normal">股價</text><text x="60" y="508" font-size="22px" fill="var(--ink)" text-anchor="start" font-weight="600">訊號給的是位置，不是底</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A timeline is split into two segments by a break, with the current batch of cards on the left and the next financing round on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="80" y="72" font-size="27" font-weight="700" fill="var(--ink)">Two numbers, two different questions</text>

  <rect x="100" y="170" width="340" height="100" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="270" y="212" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">Lease rates still rising</text>
  <text class="t" x="270" y="246" font-size="16" text-anchor="middle" fill="var(--dim)">This batch · Economics work</text>

  <rect x="620" y="170" width="340" height="100" rx="14" fill="var(--card)" stroke="var(--warn)" stroke-width="3" transform="translate(-100,0)"/>
  <text class="t" x="690" y="212" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">Bond yield 15%</text>
  <text class="t" x="690" y="246" font-size="16" text-anchor="middle" fill="var(--dim)">Next round · Can it borrow?</text>

  <rect x="100" y="330" width="340" height="18" rx="9" fill="var(--accent)"/>
  <rect x="520" y="330" width="340" height="18" rx="9" fill="var(--warn)"/>
  <line x1="446" y1="339" x2="514" y2="339" stroke="var(--grey)" stroke-width="4" stroke-dasharray="9 9"/>

  <line x1="270" y1="276" x2="270" y2="324" stroke="var(--accent)" stroke-width="3"/>
  <line x1="690" y1="276" x2="690" y2="324" stroke="var(--warn)" stroke-width="3"/>

  <text class="t" x="270" y="388" font-size="16" text-anchor="middle" fill="var(--dim)">Cards already bought</text>
  <text class="t" x="690" y="388" font-size="16" text-anchor="middle" fill="var(--dim)">Money not yet borrowed</text>
  <text class="t" x="480" y="388" font-size="16" text-anchor="middle" fill="var(--grey)">Break</text>

  <text class="t" x="480" y="458" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">This round works; the next loan is not assured</text>
</svg>
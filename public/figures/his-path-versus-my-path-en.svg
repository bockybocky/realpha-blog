<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The same notification offers two paths: follow its link to the sender, or independently open the official entry point to reach the real account.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Two paths—choose your entry</text>

  <rect x="60" y="220" width="180" height="90" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="150" y="262" font-size="19" fill="var(--ink)" text-anchor="middle">An urgent</text>
  <text class="t" x="150" y="288" font-size="19" fill="var(--ink)" text-anchor="middle">action notice</text>

  <path d="M240 250 C 400 250 420 150 560 150" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M240 280 C 400 280 420 390 560 390" fill="none" stroke="var(--accent)" stroke-width="4"/>

  <text class="t" x="400" y="128" font-size="16" fill="var(--warn)" text-anchor="middle">Its link</text>
  <text class="t" x="400" y="428" font-size="16" fill="var(--accent)" text-anchor="middle">I open the official site</text>

  <rect x="560" y="110" width="300" height="80" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="710" y="158" font-size="20" fill="var(--warn)" text-anchor="middle">Their support</text>

  <rect x="560" y="350" width="300" height="80" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="710" y="398" font-size="20" fill="var(--accent)" text-anchor="middle">My real account</text>

  <text class="t" x="60" y="494" font-size="22" font-weight="700" fill="var(--ink)">Data can be stolen; your entry can't</text>
</svg>
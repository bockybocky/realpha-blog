<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A virus dot grows larger as it moves from China and Italy to the doorstep, while the stock market line below stays flat at the first two stops and only crashes at the doorstep.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="56" font-size="27" font-weight="700" fill="var(--ink)">Feb 2020: risk crept closer; stocks moved last</text>
<line x1="120" y1="170" x2="826" y2="170" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="180" cy="170" r="14" fill="var(--warn)" opacity="0.55"/>
<circle cx="440" cy="170" r="20" fill="var(--warn)" opacity="0.7"/>
<circle cx="740" cy="170" r="28" fill="var(--warn)" opacity="0.9"/>
<path d="M838,192 L838,160 L862,138 L886,160 L886,192 z" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
<text x="862" y="222" font-size="16" font-weight="700" text-anchor="middle" fill="var(--ink)">Home</text>
<text x="180" y="222" font-size="16" text-anchor="middle" fill="var(--ink)">China</text>
<text x="440" y="222" font-size="16" text-anchor="middle" fill="var(--ink)">Italy</text>
<text x="740" y="226" font-size="16" font-weight="700" text-anchor="middle" fill="var(--warn)">Here</text>
<line x1="180" y1="236" x2="180" y2="350" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 5"/>
<line x1="440" y1="236" x2="440" y2="350" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 5"/>
<line x1="740" y1="240" x2="740" y2="350" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 5"/>
<text x="120" y="336" font-size="18" font-weight="700" fill="var(--accent)">Mkt</text>
<path d="M120,356 L700,350 L740,356 L800,468" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linejoin="round"/>
<text x="180" y="388" font-size="15" text-anchor="middle" fill="var(--dim)">Flat</text>
<text x="440" y="388" font-size="15" text-anchor="middle" fill="var(--dim)">Flat</text>
<text x="812" y="468" font-size="18" font-weight="700" fill="var(--warn)">Crash</text>
<text x="480" y="530" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">Distant risk barely priced</text>
</svg>
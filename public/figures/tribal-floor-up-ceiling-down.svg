<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右對照，右邊的地板抬高、天花板壓低，中間空間變窄">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .d { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700">地板更硬，天花板更低</text>
<text class="d" x="60" y="94" font-size="16">上下兩條線之間＝部落能發揮的空間</text>

<rect x="60" y="140" width="380" height="330" fill="var(--card)"/>
<rect x="520" y="140" width="380" height="330" fill="var(--card)"/>

<rect x="60" y="160" width="380" height="14" fill="var(--grey)"/>
<rect x="60" y="440" width="380" height="14" fill="var(--grey)"/>
<text class="d" x="200" y="316" font-size="19">空間</text>

<rect x="520" y="238" width="380" height="14" fill="var(--warn)"/>
<rect x="520" y="382" width="380" height="14" fill="var(--accent)"/>
<text class="t" x="672" y="324" font-size="19" font-weight="700">變窄</text>

<text class="d" x="60" y="500" font-size="19" font-weight="700">現況</text>
<text class="d" x="60" y="528" font-size="16">諮詢沒有法定期限，部落未入法</text>

<text class="t" x="520" y="500" font-size="19" font-weight="700">法案後</text>
<text class="d" x="520" y="528" font-size="16">入法＋每年 2,000 萬美元｜諮詢 30 天可被跳過</text>

<line x1="505" y1="396" x2="505" y2="252" stroke="var(--line)" stroke-width="2"/>
<text class="d" x="462" y="228" font-size="16" fill="var(--warn)">壓低</text>
<text class="d" x="462" y="420" font-size="16" fill="var(--accent)">抬高</text>
</svg>
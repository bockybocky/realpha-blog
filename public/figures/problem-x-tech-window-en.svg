<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A four-quadrant chart has whether the problem is real on the horizontal axis and whether the technology has only just become possible on the vertical axis, with only the upper-right quadrant highlighted.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; }
    .ag { font-size:20px; font-weight:700; fill:var(--accent); }
</style>
<text class="t" x="60" y="62">Problem first, then the tech window</text>
<rect x="560" y="110" width="300" height="160" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="220" y="110" width="640" height="320" fill="none" stroke="var(--line)" stroke-width="2"/>
<line x1="540" y1="110" x2="540" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="220" y1="270" x2="860" y2="270" stroke="var(--line)" stroke-width="2"/>
<text class="ag" x="710" y="185" text-anchor="middle">Opportunities that did not exist before</text>
<text class="b" x="710" y="214" text-anchor="middle">Now possible; impossible months ago</text>
<text class="g" x="380" y="196" text-anchor="middle">Things nobody needs</text>
<text class="g" x="710" y="356" text-anchor="middle">Tried and failed three years ago</text>
<text class="b" x="500" y="466" text-anchor="middle">The problem is real</text>
<path d="M520 460 L540 466 L520 472 Z" fill="var(--grey)"/>
<text class="b" x="190" y="270" text-anchor="middle" transform="rotate(-90 190 270)">The technology has only just become possible</text>
<text class="c" x="60" y="518">Two problems together create leverage</text>
</svg>
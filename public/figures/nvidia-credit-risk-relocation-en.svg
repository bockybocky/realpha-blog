<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two panels compared: the risk marker moves from the middle layer down to the bottom layer">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">Credit risk moved down a layer</text>

<rect x="48" y="86" width="400" height="386" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="512" y="86" width="400" height="386" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="72" y="122" font-size="19" fill="var(--dim)">Before</text>
<text x="536" y="122" font-size="19" fill="var(--accent)">After</text>

<rect x="108" y="146" width="280" height="52" rx="10" fill="var(--page)" stroke="var(--line)"/>
<text x="248" y="178" font-size="16" fill="var(--ink)" text-anchor="middle">Capital markets</text>
<rect x="108" y="272" width="280" height="52" rx="10" fill="var(--page)" stroke="var(--line)"/>
<text x="196" y="304" font-size="16" fill="var(--ink)" text-anchor="middle">Neocloud startups</text>
<rect x="300" y="284" width="62" height="28" rx="14" fill="var(--warn)" opacity="0.16"/>
<text x="331" y="304" font-size="14" fill="var(--warn)" text-anchor="middle">Risk</text>
<rect x="108" y="398" width="280" height="52" rx="10" fill="var(--page)" stroke="var(--line)"/>
<text x="248" y="430" font-size="16" fill="var(--ink)" text-anchor="middle">NVIDIA</text>

<line x1="248" y1="200" x2="248" y2="222" stroke="var(--grey)" stroke-width="3"/>
<line x1="248" y1="252" x2="248" y2="262" stroke="var(--grey)" stroke-width="3"/>
<line x1="236" y1="226" x2="260" y2="248" stroke="var(--warn)" stroke-width="3"/>
<line x1="260" y1="226" x2="236" y2="248" stroke="var(--warn)" stroke-width="3"/>
<text x="274" y="243" font-size="15" fill="var(--warn)">Can't raise money</text>
<line x1="248" y1="326" x2="248" y2="386" stroke="var(--grey)" stroke-width="3"/>
<polygon points="248,396 241,382 255,382" fill="var(--grey)"/>
<text x="264" y="362" font-size="15" fill="var(--dim)">Buy hardware</text>

<rect x="572" y="146" width="280" height="52" rx="10" fill="var(--page)" stroke="var(--line)"/>
<text x="712" y="178" font-size="16" fill="var(--grey)" text-anchor="middle">Capital markets</text>
<rect x="572" y="272" width="280" height="52" rx="10" fill="var(--page)" stroke="var(--line)"/>
<text x="712" y="304" font-size="16" fill="var(--ink)" text-anchor="middle">Neocloud startups</text>
<rect x="572" y="398" width="280" height="52" rx="10" fill="var(--page)" stroke="var(--accent)"/>
<text x="660" y="430" font-size="16" fill="var(--ink)" text-anchor="middle">NVIDIA</text>
<rect x="764" y="410" width="62" height="28" rx="14" fill="var(--warn)" opacity="0.16"/>
<text x="795" y="430" font-size="14" fill="var(--warn)" text-anchor="middle">Risk</text>

<line x1="666" y1="392" x2="666" y2="336" stroke="var(--accent)" stroke-width="3"/>
<polygon points="666,326 659,340 673,340" fill="var(--accent)"/>
<text x="560" y="366" font-size="15" fill="var(--accent)" text-anchor="end">Revenue backstop</text>
<line x1="758" y1="326" x2="758" y2="386" stroke="var(--grey)" stroke-width="3"/>
<polygon points="758,396 751,382 765,382" fill="var(--grey)"/>
<text x="866" y="366" font-size="15" fill="var(--dim)" text-anchor="middle">Buy hardware</text>
<line x1="712" y1="200" x2="712" y2="262" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 7" opacity="0.6"/>

<text x="480" y="534" font-size="22" fill="var(--ink)" text-anchor="middle">The hole didn't vanish, it changed shoulders</text>
</svg>
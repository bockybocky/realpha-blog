<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Three separate blocks of equal height on the left, and five bars on the right rising from low to high into an upward staircase.">
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">One-offs or a stack</text>
<path d="M90 400 L900 400" stroke="var(--line)" stroke-width="2"/>
<path d="M500 110 L500 400" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6" fill="none"/>

<rect x="110" y="330" width="90" height="70" rx="5" fill="var(--grey)"/>
<rect x="230" y="330" width="90" height="70" rx="5" fill="var(--grey)"/>
<rect x="350" y="330" width="90" height="70" rx="5" fill="var(--grey)"/>
<text x="110" y="310" font-size="16" fill="var(--dim)">Deal</text>
<text x="230" y="310" font-size="16" fill="var(--dim)">Deal</text>
<text x="350" y="310" font-size="16" fill="var(--dim)">Deal</text>
<text x="110" y="440" font-size="20" font-weight="700" fill="var(--ink)">On-prem</text>
<text x="110" y="466" font-size="15" fill="var(--dim)">One-offs, unlinked</text>

<rect x="560" y="360" width="48" height="40" fill="var(--accent)"/>
<rect x="620" y="320" width="48" height="80" fill="var(--accent)"/>
<rect x="680" y="280" width="48" height="120" fill="var(--accent)"/>
<rect x="740" y="230" width="48" height="170" fill="var(--accent)"/>
<rect x="800" y="170" width="48" height="230" fill="var(--accent)"/>
<path d="M560 352 L616 312 L676 272 L736 222 L800 162" stroke="var(--warn)" stroke-width="2.5" fill="none"/>
<path d="M794 156 L812 158 L804 174 z" fill="var(--warn)"/>
<text x="560" y="440" font-size="20" font-weight="700" fill="var(--ink)">API</text>
<text x="560" y="466" font-size="15" fill="var(--dim)">Usage stacks</text>
</g>
</svg>
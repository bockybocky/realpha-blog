<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三個高度差極大的柱體：疫情期虧損 12%、1930 年代 3%、銀行可承受水位極低">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="60">同一種計畫，兩次的虧損率</text>
<line x1="120" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="230" width="140" height="240" fill="var(--warn)" opacity="0.85"/>
<line x1="170" y1="170" x2="330" y2="170" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="b" x="340" y="176">最終估 15%</text>
<text class="g" x="180" y="214" fill="var(--warn)">12%</text>
<text class="g" x="180" y="502">疫情期</text>
<text class="b" x="180" y="526">Main Street Lending</text>
<rect x="470" y="410" width="140" height="60" fill="var(--accent)" opacity="0.85"/>
<text class="g" x="470" y="394" fill="var(--accent)">3%</text>
<text class="g" x="470" y="502">1930 年代</text>
<text class="b" x="470" y="526">舊的 13(b) 授權</text>
<line x1="700" y1="450" x2="880" y2="450" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="b" x="700" y="440">銀行體系可承受的水位</text>
<text class="c" x="60" y="110">被當成失敗案例的那一次，虧得少</text>
</svg>
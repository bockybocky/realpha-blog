<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left six bars fall together; on the right only one bar falls and the other five stay flat.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="64" font-size="27" fill="var(--ink)">Line up six peers and the shape separates</text>

<rect x="60" y="96" width="400" height="300" fill="var(--card)" rx="10"/>
<line x1="90" y1="150" x2="430" y2="150" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="150" width="38" height="170" fill="var(--accent)" rx="3"/>
<rect x="156" y="150" width="38" height="150" fill="var(--grey)" rx="3"/>
<rect x="212" y="150" width="38" height="186" fill="var(--grey)" rx="3"/>
<rect x="268" y="150" width="38" height="162" fill="var(--grey)" rx="3"/>
<rect x="324" y="150" width="38" height="176" fill="var(--grey)" rx="3"/>
<rect x="380" y="150" width="38" height="156" fill="var(--grey)" rx="3"/>
<text x="90" y="372" font-size="20" fill="var(--ink)">All down, similar size</text>
<text x="300" y="372" font-size="20" fill="var(--warn)">Beta</text>

<rect x="500" y="96" width="400" height="300" fill="var(--card)" rx="10"/>
<line x1="530" y1="150" x2="870" y2="150" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="150" width="38" height="180" fill="var(--accent)" rx="3"/>
<rect x="596" y="150" width="38" height="22" fill="var(--grey)" rx="3"/>
<rect x="652" y="150" width="38" height="16" fill="var(--grey)" rx="3"/>
<rect x="708" y="150" width="38" height="28" fill="var(--grey)" rx="3"/>
<rect x="764" y="150" width="38" height="14" fill="var(--grey)" rx="3"/>
<rect x="820" y="150" width="38" height="24" fill="var(--grey)" rx="3"/>
<text x="530" y="372" font-size="20" fill="var(--ink)">Only this one down</text>
<text x="740" y="372" font-size="20" fill="var(--warn)">Go read the company</text>

<text x="60" y="460" font-size="22" fill="var(--ink)">Question two: can it survive a year with no cheap money</text>
<text x="60" y="504" font-size="20" fill="var(--dim)">The day it cannot, beta turns into alpha</text>
</g>
</svg>
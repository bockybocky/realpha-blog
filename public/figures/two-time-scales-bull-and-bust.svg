<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="短尺度陡升、長尺度低於實質殖利率門檻的兩個時間軸">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="56">兩邊都成立，因為尺不一樣長</text>
<rect x="60" y="92" width="360" height="330" rx="14" fill="var(--card)"/>
<text class="g" x="88" y="132">短尺度</text>
<line x1="88" y1="380" x2="392" y2="380" stroke="var(--ink)" stroke-width="3"/>
<path d="M100,360 L200,300 L300,220 L380,170" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="d" x="100" y="410">持有、不加槓桿、留一點避險</text>
<rect x="470" y="92" width="430" height="330" rx="14" fill="var(--card)"/>
<text class="g" x="498" y="132">五年尺度</text>
<line x1="498" y1="380" x2="876" y2="380" stroke="var(--ink)" stroke-width="3"/>
<line x1="498" y1="240" x2="876" y2="240" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="d" x="876" y="228" text-anchor="end">長天期實質殖利率</text>
<path d="M506,330 L620,250 L700,300 L790,340 L868,312" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="d" x="506" y="410">漲完還回去一大塊，贏不過那條虛線</text>
<line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="60" y="518">看多講今年，看壞講五年</text>
</svg>
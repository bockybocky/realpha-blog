<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條長橫條左端只有一小截被填色，三個由短到長的刻度標在這一小截裡">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">基底晶片能吃掉三奈米多少產能</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">長條＝三奈米月產能，2027 年約 19 萬片以上（節目中的推算）</text>
<rect x="120" y="250" width="720" height="80" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="120" y="250" width="101" height="80" rx="6" fill="var(--accent)" opacity="0.85"/>
<text x="860" y="298" font-size="19" fill="var(--dim)">19 萬片</text>
<line x1="142" y1="230" x2="142" y2="180" stroke="var(--grey)" stroke-width="3"/>
<text x="142" y="166" font-size="19" fill="var(--dim)" text-anchor="middle">2028：3%</text>
<line x1="192" y1="230" x2="192" y2="140" stroke="var(--grey)" stroke-width="3"/>
<text x="210" y="126" font-size="19" fill="var(--dim)" text-anchor="middle">2029：一成</text>
<line x1="221" y1="350" x2="221" y2="400" stroke="var(--accent)" stroke-width="3"/>
<text x="232" y="420" font-size="19" fill="var(--accent)">上限情境：全部走三奈米</text>
<text x="232" y="444" font-size="16" fill="var(--dim)">月耗 2.7 萬片，2027 年尚未發生</text>
<text x="60" y="492" font-size="22" fill="var(--ink)">轉述時掉的總是條件，掉了就多出一成需求</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two routes on a street grid, one cutting through the center and one running two blocks south, with the person who proposed the southern route crossed out.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="48" y="62" font-size="27" fill="var(--ink)" font-weight="700">Off by 2 blocks</text>

<g fill="var(--card)" stroke="var(--line)">
<rect x="150" y="120" width="130" height="78" rx="4"/><rect x="296" y="120" width="130" height="78" rx="4"/><rect x="442" y="120" width="130" height="78" rx="4"/><rect x="588" y="120" width="130" height="78" rx="4"/><rect x="734" y="120" width="130" height="78" rx="4"/>
<rect x="150" y="214" width="130" height="78" rx="4"/><rect x="296" y="214" width="130" height="78" rx="4"/><rect x="442" y="214" width="130" height="78" rx="4"/><rect x="588" y="214" width="130" height="78" rx="4"/><rect x="734" y="214" width="130" height="78" rx="4"/>
<rect x="150" y="308" width="130" height="78" rx="4"/><rect x="296" y="308" width="130" height="78" rx="4"/><rect x="442" y="308" width="130" height="78" rx="4"/><rect x="588" y="308" width="130" height="78" rx="4"/><rect x="734" y="308" width="130" height="78" rx="4"/>
</g>

<line x1="140" y1="159" x2="880" y2="159" stroke="var(--warn)" stroke-width="12"/>
<text x="48" y="150" font-size="19" fill="var(--warn)" font-weight="700">Built</text>
<text x="48" y="176" font-size="16" fill="var(--dim)">10,000s</text>

<line x1="140" y1="347" x2="880" y2="347" stroke="var(--accent)" stroke-width="12" stroke-dasharray="18 10"/>
<text x="48" y="338" font-size="19" fill="var(--accent)" font-weight="700">Cut</text>
<text x="48" y="364" font-size="16" fill="var(--dim)">100s</text>

<rect x="150" y="430" width="300" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="172" y="468" font-size="19" fill="var(--dim)">The proposer</text>
<line x1="160" y1="461" x2="440" y2="461" stroke="var(--warn)" stroke-width="3"/>
<text x="500" y="468" font-size="22" fill="var(--ink)">Both erased</text>
</svg>
<rect x="480" y="150" width="120" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="620" y="150" width="120" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="200" y="260" width="120" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="340" y="260" width="120" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="480" y="260" width="120" height="90" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<rect x="620" y="260" width="120" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="260" y="202" text-anchor="middle">Expert</text>
<text class="b" x="400" y="202" text-anchor="middle">Asleep</text>
<text class="b" x="540" y="202" text-anchor="middle">Asleep</text>
<text class="b" x="680" y="202" text-anchor="middle">Asleep</text>
<text class="b" x="260" y="312" text-anchor="middle">Asleep</text>
<text class="b" x="400" y="312" text-anchor="middle">Asleep</text>
<text class="b" x="540" y="312" text-anchor="middle">Expert</text>
<text class="b" x="680" y="312" text-anchor="middle">Asleep</text>
<line x1="790" y1="350" x2="920" y2="350" stroke="var(--line)" stroke-width="2"/>
<rect x="800" y="160" width="45" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="870" y="302" width="45" height="48" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="s" x="822" y="378" text-anchor="middle">Total</text>
<text class="s" x="892" y="378" text-anchor="middle">Used</text>
<text class="c" x="60" y="450">Huge in total, a slice at a time</text>

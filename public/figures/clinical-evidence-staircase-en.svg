<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A four-step staircase rising from lower left to upper right, the first two framed in dashes with an arrow pointing to the third">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.s{font-size:15px;fill:var(--dim)}
.a{font-size:16px;fill:var(--accent);font-weight:700}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="56">Stacked one step at a time</text>

<line x1="48" y1="470" x2="48" y2="150" stroke="var(--grey)" stroke-width="2"/>
<path d="M48 140 L42 156 L54 156 Z" fill="var(--grey)"/>
<text class="s" x="30" y="128">Certainty</text>
<line x1="48" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>

<rect x="70" y="400" width="190" height="70" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="165" y="386" text-anchor="middle">Feasibility</text>
<text class="s" x="165" y="442" text-anchor="middle">Does it do anything</text>

<rect x="265" y="330" width="190" height="140" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="360" y="316" text-anchor="middle">Mechanism</text>
<text class="s" x="360" y="410" text-anchor="middle">Why it works</text>

<rect x="460" y="240" width="190" height="230" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="555" y="226" text-anchor="middle">Randomized control</text>
<text class="s" x="555" y="366" text-anchor="middle">Causation under control</text>

<rect x="655" y="150" width="190" height="320" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="750" y="136" text-anchor="middle">Real world</text>
<text class="s" x="750" y="326" text-anchor="middle">What happens in use</text>

<rect x="60" y="292" width="408" height="192" rx="10" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="a" x="80" y="278">The answer should surface here</text>
<path d="M470 292 L508 262" stroke="var(--accent)" stroke-width="2"/>
<path d="M512 258 L498 262 L506 272 Z" fill="var(--accent)"/>

<text class="c" x="480" y="540" text-anchor="middle">You can't skip the order or buy the time</text>
</svg>
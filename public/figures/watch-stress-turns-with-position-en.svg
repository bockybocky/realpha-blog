<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The stress line falls sharply at 12:30 while the grey market line never recovers.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">Not tape—position</text>
<rect x="60" y="92" width="840" height="380" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="140" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="76" y="186" font-size="15" fill="var(--dim)">High</text>
<text x="76" y="370" font-size="15" fill="var(--dim)">Calm</text>
<polyline points="150,180 260,174 360,186 460,176 560,182" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polyline points="560,182 600,250 645,352 860,356" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polyline points="150,300 300,330 560,352 700,360 860,350" fill="none" stroke="var(--grey)" stroke-width="4"/>
<line x1="578" y1="120" x2="578" y2="432" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="590" y="140" font-size="19" fill="var(--warn)">12:30 resize</text>
<text x="196" y="158" font-size="19" fill="var(--accent)">Watch peak</text>
<text x="700" y="334" font-size="16" fill="var(--dim)">Drops</text>
<text x="790" y="332" font-size="15" fill="var(--grey)">Mkt</text>
<text x="128" y="448" font-size="15" fill="var(--dim)">08:00</text>
<text x="330" y="448" font-size="15" fill="var(--dim)">10:00</text>
<text x="556" y="448" font-size="15" fill="var(--dim)">12:30</text>
<text x="780" y="448" font-size="15" fill="var(--dim)">14:00</text>
<text x="60" y="512" font-size="22" fill="var(--ink)">Stress tracks size, not tape</text>
</svg>
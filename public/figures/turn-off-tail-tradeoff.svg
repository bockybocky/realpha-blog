<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="時間軸上兩條下降曲線，上面一條拖著長長的尾巴，下面一條尾巴明顯縮短">
  <defs>
    <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="ti" x="40" y="54">關斷的那條尾巴</text>

  <line x1="120" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <line x1="120" y1="110" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="840" y="472">時間</text>
  <text class="b" x="40" y="118">電流</text>
  <line x1="250" y1="110" x2="250" y2="460" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="b" x="196" y="486">閘極關</text>

  <path d="M 130 170 L 250 170 C 300 170 320 240 400 282 C 520 342 660 356 870 362"
        fill="none" stroke="var(--grey)" stroke-width="5"/>
  <text class="g" x="700" y="330" fill="var(--dim)">原版</text>

  <path d="M 130 240 L 250 240 C 288 240 300 330 346 374 C 380 406 410 412 440 414"
        fill="none" stroke="var(--accent)" stroke-width="5"/>
  <text class="g" x="470" y="412" fill="var(--accent)">照射過</text>

  <path d="M 440 414 L 870 414" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 8"/>

  <rect x="560" y="120" width="340" height="104" rx="8" fill="var(--card)"/>
  <text class="g" x="588" y="156">刻意製造晶格缺陷</text>
  <text class="b" x="588" y="186">缺陷抓住電子</text>
  <text class="b" x="588" y="210">尾巴縮短</text>
</svg>
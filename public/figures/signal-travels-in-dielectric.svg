<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="剖面圖：銅線只是中心的小圓，訊號像一圈套在外面的管子，走在銅線外的樹脂浸漬布裡">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="66">訊號不在銅裡面跑</text>

  <rect x="120" y="120" width="620" height="34" fill="var(--grey)"/>
  <text class="g" x="770" y="143">銅層</text>

  <rect x="120" y="154" width="620" height="220" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="770" y="250">樹脂浸漬布</text>
  <text class="d" x="770" y="276">介質層</text>

  <rect x="120" y="374" width="620" height="34" fill="var(--grey)"/>
  <text class="g" x="770" y="397">銅層</text>

  <ellipse cx="430" cy="264" rx="150" ry="78" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <ellipse cx="430" cy="264" rx="104" ry="52" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="430" cy="264" r="26" fill="var(--grey)"/>
  <text class="g" x="430" y="272" text-anchor="middle">銅線</text>

  <text class="g" x="610" y="196" fill="var(--accent)">訊號</text>
  <text class="d" x="610" y="222">繞著銅線走</text>

  <text class="d" x="180" y="200">銅線只是導引線</text>

  <text class="c" x="60" y="470">速度上限由中間那層布決定，不是由銅決定</text>
  <text class="d" x="60" y="506">所以「板子多快」這題，答案在材料那一層</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Illustrative bar chart: in good times, only the bottom one of the data center's ten blocks is Oracle's own money, with the other nine coming from customer prepayments, customer hardware, and vendor financing; when demand reverses, those nine pull away and only one block remains.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">How much of a data center Oracle funds</text>
<text x="480" y="86" text-anchor="middle" font-size="15" fill="var(--dim)">Illustrative, 10 blocks</text>
<rect x="220" y="140" width="160" height="96" fill="var(--grey)" stroke="var(--page)" stroke-width="2"/>
<rect x="220" y="236" width="160" height="96" fill="var(--line)" stroke="var(--page)" stroke-width="2"/>
<rect x="220" y="332" width="160" height="96" fill="var(--grey)" stroke="var(--page)" stroke-width="2"/>
<rect x="220" y="428" width="160" height="32" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<text x="395" y="193" font-size="16" fill="var(--dim)">Vendor financing</text>
<text x="395" y="289" font-size="16" fill="var(--dim)">Customer hardware</text>
<text x="395" y="385" font-size="16" fill="var(--dim)">Customer prepay</text>
<text x="395" y="450" font-size="16" font-weight="700" fill="var(--accent)">Self-funded</text>
<text x="300" y="498" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)">Boom</text>
<rect x="620" y="140" width="160" height="288" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="620" y="428" width="160" height="32" fill="var(--accent)"/>
<text x="700" y="292" text-anchor="middle" font-size="19" fill="var(--dim)">Pulled</text>
<text x="700" y="498" text-anchor="middle" font-size="19" font-weight="700" fill="var(--warn)">Demand reverses</text>
<text x="480" y="540" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">Demand inflated by financing</text>
</svg>
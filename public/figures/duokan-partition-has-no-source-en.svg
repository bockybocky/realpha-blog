<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Six partitions each have a source arrow, and the rightmost one has no source, only a dashed line pointing into the past.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="480" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">Six can be fetched again, one cannot</text>

  <rect x="70" y="118" width="560" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="350" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="var(--accent)">Official image</text>

  <path d="M118 178 L118 288" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M118 300 L112 286 L124 286 Z" fill="var(--accent)"/>
  <path d="M211 178 L211 288" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M211 300 L205 286 L217 286 Z" fill="var(--accent)"/>
  <path d="M304 178 L304 288" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M304 300 L298 286 L310 286 Z" fill="var(--accent)"/>
  <path d="M397 178 L397 288" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M397 300 L391 286 L403 286 Z" fill="var(--accent)"/>
  <path d="M490 178 L490 288" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M490 300 L484 286 L496 286 Z" fill="var(--accent)"/>
  <path d="M583 178 L583 288" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M583 300 L577 286 L589 286 Z" fill="var(--accent)"/>

  <rect x="80" y="302" width="76" height="92" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="118" y="354" text-anchor="middle" font-size="15" fill="var(--ink)">boot_a</text>
  <rect x="173" y="302" width="76" height="92" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="211" y="354" text-anchor="middle" font-size="15" fill="var(--ink)">boot_b</text>
  <rect x="266" y="302" width="76" height="92" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="304" y="354" text-anchor="middle" font-size="15" fill="var(--ink)">vbmeta</text>
  <rect x="359" y="302" width="76" height="92" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="397" y="354" text-anchor="middle" font-size="15" fill="var(--ink)">dtbo</text>
  <rect x="452" y="302" width="76" height="92" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="490" y="354" text-anchor="middle" font-size="15" fill="var(--ink)">super</text>
  <rect x="545" y="302" width="76" height="92" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="583" y="354" text-anchor="middle" font-size="15" fill="var(--ink)">modem</text>
  <text class="t" x="350" y="428" text-anchor="middle" font-size="16" fill="var(--accent)">Reflash if broken</text>

  <text class="t" x="790" y="128" text-anchor="middle" font-size="19" font-weight="700" fill="var(--dim)">The factory run</text>
  <text class="t" x="790" y="155" text-anchor="middle" font-size="16" fill="var(--dim)">Already past</text>
  <path d="M790 172 L790 296" stroke="var(--grey)" stroke-width="2.5" stroke-dasharray="7 7"/>
  <path d="M790 172 L784 186 L796 186 Z" fill="var(--grey)"/>

  <rect x="700" y="302" width="180" height="92" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="790" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="var(--warn)">waveform</text>
  <text class="t" x="790" y="428" text-anchor="middle" font-size="16" fill="var(--warn)">No source if lost</text>

  <text class="t" x="480" y="505" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">Back up the one with no source first</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Top row has one bar in year one and blanks for three years; bottom row has an equal bar in all four years">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="60">Sell once, collect for four years</text>
  <text class="b" x="60" y="92">After the upgrade cycle stretched from two years to four</text>

  <text class="s" x="340" y="138" text-anchor="middle">Year 1</text>
  <text class="s" x="480" y="138" text-anchor="middle">Year 2</text>
  <text class="s" x="620" y="138" text-anchor="middle">Year 3</text>
  <text class="s" x="760" y="138" text-anchor="middle">Year 4</text>

  <text class="g" x="60" y="215">Hardware sale</text>
  <rect x="300" y="155" width="80" height="105" fill="var(--grey)"/>
  <rect x="440" y="250" width="80" height="10" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="580" y="250" width="80" height="10" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="720" y="250" width="80" height="10" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="290" y1="260" x2="820" y2="260" stroke="var(--line)" stroke-width="2"/>

  <text class="g" x="60" y="385">Rent collected</text>
  <rect x="300" y="330" width="80" height="70" fill="var(--accent)"/>
  <rect x="440" y="330" width="80" height="70" fill="var(--accent)"/>
  <rect x="580" y="330" width="80" height="70" fill="var(--accent)"/>
  <rect x="720" y="330" width="80" height="70" fill="var(--accent)"/>
  <line x1="290" y1="400" x2="820" y2="400" stroke="var(--line)" stroke-width="2"/>

  <text class="c" x="60" y="470">Old phone still in the pocket, rent still comes in</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條折線從左往右張開成大開口：上面一條陡陡上揚，下面一條掉到接近底線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">同一家公司，兩個部門走反方向</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">台積電第三季營收年增率，與上半年對照</text>
<line x1="220" y1="440" x2="800" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="220" y1="120" x2="220" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="300" y="470" font-size="19" fill="var(--dim)" text-anchor="middle">上半年</text>
<text x="700" y="470" font-size="19" fill="var(--dim)" text-anchor="middle">第三季</text>
<polyline points="300,266 700,126" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polyline points="300,368 700,424" fill="none" stroke="var(--grey)" stroke-width="5"/>
<circle cx="300" cy="266" r="8" fill="var(--accent)"/>
<circle cx="700" cy="126" r="10" fill="var(--accent)"/>
<circle cx="300" cy="368" r="8" fill="var(--grey)"/>
<circle cx="700" cy="424" r="10" fill="var(--grey)"/>
<text x="290" y="252" font-size="19" fill="var(--accent)" text-anchor="end">46%</text>
<text x="716" y="118" font-size="22" fill="var(--accent)">83%</text>
<text x="716" y="100" font-size="19" fill="var(--ink)">高效能運算</text>
<text x="290" y="362" font-size="19" fill="var(--dim)" text-anchor="end">19%</text>
<text x="716" y="430" font-size="22" fill="var(--dim)">4.3%</text>
<text x="716" y="412" font-size="19" fill="var(--ink)">手機</text>
<line x1="700" y1="136" x2="700" y2="414" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="60" y="508" font-size="22" fill="var(--ink)">AI 的強，蓋住了消費性的平庸</text>
</svg>
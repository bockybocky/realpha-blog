<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三條灰線與一條深色新線從月一畫到月三，各自停在不同高度，右側標出名次">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="80" y="62" font-size="27" fill="var(--ink)">把第四件事放進自己的基準表</text>
<line x1="150" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="120" x2="150" y2="440" stroke="var(--line)" stroke-width="2"/>
<polyline points="150,430 400,330 650,210" fill="none" stroke="var(--grey)" stroke-width="5"/>
<polyline points="150,432 400,370 650,270" fill="none" stroke="var(--grey)" stroke-width="5"/>
<polyline points="150,436 400,420 650,370" fill="none" stroke="var(--grey)" stroke-width="5"/>
<polyline points="150,434 400,396 650,320" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="650" cy="210" r="9" fill="var(--grey)"/>
<circle cx="650" cy="270" r="9" fill="var(--grey)"/>
<circle cx="650" cy="320" r="9" fill="var(--accent)"/>
<circle cx="650" cy="370" r="9" fill="var(--grey)"/>
<text x="672" y="216" font-size="16" fill="var(--dim)">第 1　語言　7 課</text>
<text x="672" y="276" font-size="16" fill="var(--dim)">第 2　跑步　5 次</text>
<text x="672" y="326" font-size="16" fill="var(--accent)">第 3　新的那件　3 次</text>
<text x="672" y="376" font-size="16" fill="var(--dim)">第 4　樂器　2 首</text>
<text x="150" y="470" font-size="15" fill="var(--dim)">月 1</text>
<text x="400" y="470" font-size="15" fill="var(--dim)" text-anchor="middle">月 2</text>
<text x="650" y="470" font-size="15" fill="var(--dim)" text-anchor="middle">月 3</text>
<text x="80" y="526" font-size="22" fill="var(--ink)">跟自己做過的事比，不是跟零比</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three rising steps marking the order in which the improvements happened.">
  <defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style></defs>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">The story gives an order</text>

  <line x1="70" y1="440" x2="890" y2="440" stroke="var(--line)" stroke-width="2"/>

  <rect x="90" y="360" width="230" height="80" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="340" y="280" width="230" height="160" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="590" y="190" width="250" height="250" rx="10" fill="var(--card)" stroke="var(--accent)"/>

  <text class="t" x="205" y="406" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Sleeping through</text>
  <text class="t" x="455" y="366" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Missing the alarm</text>
  <text class="t" x="715" y="326" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Being present</text>

  <line x1="300" y1="330" x2="356" y2="266" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="362,258 348,276 366,274" fill="var(--accent)"/>
  <line x1="550" y1="250" x2="606" y2="178" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="612,170 598,188 616,186" fill="var(--accent)"/>

  <text class="t" x="90" y="136" font-size="16" fill="var(--dim)">The order can be checked</text>
  <text class="t" x="90" y="162" font-size="16" fill="var(--warn)">A mismatch means the mechanism is off</text>

  <text class="t" x="60" y="494" font-size="22" font-weight="700" fill="var(--ink)">Stories hold mechanism, numbers hold denominators</text>
</svg>
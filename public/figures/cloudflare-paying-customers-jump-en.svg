<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the same baseline, a very low band on the left and a bar several times taller on the right.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">Net new paying customers per quarter</text>
<rect x="600" y="118" width="170" height="282" fill="var(--accent)"/>
<text x="685" y="104" text-anchor="middle" font-size="19" fill="var(--ink)">158,000</text>
<rect x="150" y="368" width="300" height="32" fill="var(--grey)"/>
<line x1="110" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<text x="300" y="434" text-anchor="middle" font-size="16" fill="var(--dim)">Each quarter last year: 20,000-30,000</text>
<text x="685" y="434" text-anchor="middle" font-size="16" fill="var(--dim)">Q3</text>
<text x="480" y="486" text-anchor="middle" font-size="22" fill="var(--ink)">Same unit, a whole different bracket</text>
</svg>
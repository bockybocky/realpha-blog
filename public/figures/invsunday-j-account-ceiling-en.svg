<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A two-panel comparison: the left panel has a low horizontal ceiling line and a downward subsidy arrow, while the right panel has an upward arrow and a dashed line above labeled “no limit,” showing that different accounting categories have different ceiling heights.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .n { font-size:22px; font-weight:700; fill:var(--accent); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">The account sets the ceiling</text>

  <rect x="60" y="100" width="400" height="420" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="100" width="400" height="420" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text class="g" x="260" y="140" text-anchor="middle">Book it as advertising</text>
  <text class="g" x="700" y="140" text-anchor="middle">Book it as a business</text>

  <line x1="100" y1="380" x2="420" y2="380" stroke="var(--grey)" stroke-width="4"/>
  <text class="b" x="260" y="406" text-anchor="middle">Ceiling: net assets</text>
  <path d="M260 180 L260 360" stroke="var(--grey)" stroke-width="4"/>
  <path d="M248 348 L260 364 L272 348" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <text class="b" x="260" y="172" text-anchor="middle">Pay out of pocket</text>
  <rect x="200" y="380" width="120" height="60" rx="6" fill="var(--grey)" opacity="0.5"/>
  <text class="b" x="260" y="470" text-anchor="middle">Team</text>

  <path d="M700 440 L700 180" stroke="var(--accent)" stroke-width="4"/>
  <path d="M688 196 L700 176 L712 196" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text class="b" x="700" y="166" text-anchor="middle">Revenue, profit</text>
  <path d="M540 150 L860 150" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 8"/>
  <text class="s" x="860" y="142" text-anchor="end">No limit</text>
  <rect x="640" y="440" width="120" height="60" rx="6" fill="var(--accent)" opacity="0.5"/>
  <text class="b" x="700" y="516" text-anchor="middle">The same team</text>
</svg>
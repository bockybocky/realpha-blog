<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The bar holding only the seed deposit is very short, and the bar with small monthly contributions and outside matching funds stacked on top rises past a dashed threshold line.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">Small balances teach nothing</text>
<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="3"/>
<rect x="150" y="416" width="160" height="24" fill="var(--line)"/>
<text class="g" x="150" y="400">Seed deposit only</text>
<text class="s" x="150" y="472">$1,000</text>
<text class="s" x="150" y="496">No questions asked</text>
<rect x="560" y="416" width="200" height="24" fill="var(--line)"/>
<rect x="560" y="236" width="200" height="180" fill="var(--accent)"/>
<rect x="560" y="176" width="200" height="60" fill="var(--grey)"/>
<text class="s" x="770" y="432">Seed</text>
<text class="s" x="770" y="336">$50/mo</text>
<text class="s" x="770" y="212">Gifts + match</text>
<line x1="500" y1="176" x2="900" y2="176" stroke="var(--ink)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="g" x="500" y="158">Questions start here</text>
<text class="s" x="560" y="472">~$12,000-$13,000 by 7th grade</text>
<text class="c" x="60" y="534">Without scale, financial literacy is just talk</text>
</svg>
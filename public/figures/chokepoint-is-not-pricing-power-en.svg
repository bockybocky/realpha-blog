<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The two bottlenecks have equally narrow openings; the left has a wide net-profit outlet, while the right has an extremely thin outlet that leaves only news.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="56" y="66">Same choke point, different outlet</text>
<text class="b" x="56" y="100">Same inlet width above</text>
<polygon points="90,140 410,140 290,290 210,290" fill="var(--grey)" opacity="0.45"/>
<polygon points="210,290 290,290 410,440 90,440" fill="var(--accent)"/>
<text class="g" x="90" y="130">Demand</text>
<text class="g" x="190" y="480" fill="var(--accent)">Net profit</text>
<text class="b" x="90" y="510">Premium, scarcity, few suppliers</text>
<polygon points="550,140 870,140 726,290 694,290" fill="var(--grey)" opacity="0.45"/>
<polygon points="694,290 726,290 736,440 684,440" fill="var(--warn)"/>
<text class="g" x="550" y="130">Demand</text>
<text class="g" x="672" y="480" fill="var(--warn)">News</text>
<text class="b" x="550" y="510">Growth diluted by overall scale</text>
<text class="c" x="56" y="548">What matters in the end is net profit</text>
</svg>
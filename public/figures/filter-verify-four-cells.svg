<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="二乘二四格對照，左右是原版與兒童版，上下是該被擋與不該被擋的書，四個結果都要填">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">同一把尺量兩次，四格都要填</text>

  <text class="t" x="480" y="126" font-size="20" fill="var(--dim)" text-anchor="middle">原版來源</text>
  <text class="t" x="760" y="126" font-size="20" fill="var(--accent)" text-anchor="middle">兒童版來源</text>

  <text class="t" x="60" y="212" font-size="19" fill="var(--ink)">該被擋</text>
  <text class="t" x="60" y="238" font-size="15" fill="var(--dim)">搜「工口」</text>
  <text class="t" x="60" y="352" font-size="19" fill="var(--ink)">不該被擋</text>
  <text class="t" x="60" y="378" font-size="15" fill="var(--dim)">《葬送的芙莉蓮》</text>

  <rect x="340" y="160" width="280" height="130" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="222" font-size="28" font-weight="700" fill="var(--ink)" text-anchor="middle">整排</text>
  <text class="t" x="480" y="256" font-size="15" fill="var(--dim)" text-anchor="middle">先證明找得到</text>

  <rect x="620" y="160" width="280" height="130" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="760" y="222" font-size="28" font-weight="700" fill="var(--accent)" text-anchor="middle">0 本</text>
  <text class="t" x="760" y="256" font-size="15" fill="var(--dim)" text-anchor="middle">擋住了</text>

  <rect x="340" y="300" width="280" height="130" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="362" font-size="28" font-weight="700" fill="var(--ink)" text-anchor="middle">147 章</text>
  <text class="t" x="480" y="396" font-size="15" fill="var(--dim)" text-anchor="middle">基準</text>

  <rect x="620" y="300" width="280" height="130" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="760" y="362" font-size="28" font-weight="700" fill="var(--accent)" text-anchor="middle">147 章</text>
  <text class="t" x="760" y="396" font-size="15" fill="var(--dim)" text-anchor="middle">沒被誤殺</text>

  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">只看右上角那格，分不出「擋住了」和「本來就沒有」</text>
</svg>
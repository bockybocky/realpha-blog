<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上排六格只填一格，下排六格全填，對比一則公告填了多少格">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">這則公告填了幾格</text>

<text class="t" x="60" y="130" font-size="20" fill="var(--ink)">意向書、條款書</text>
<rect x="60" y="150" width="140" height="64" rx="6" fill="var(--accent)"/>
<text class="t" x="130" y="190" font-size="15" fill="var(--page)" text-anchor="middle">有人願意談</text>
<rect x="210" y="150" width="140" height="64" rx="6" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="360" y="150" width="140" height="64" rx="6" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="510" y="150" width="140" height="64" rx="6" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="660" y="150" width="140" height="64" rx="6" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="810" y="150" width="140" height="64" rx="6" fill="none" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="248" font-size="19" fill="var(--warn)">六格裡的一格</text>

<text class="t" x="60" y="330" font-size="20" fill="var(--ink)">最終投資決定</text>
<rect x="60" y="350" width="140" height="64" rx="6" fill="var(--accent)"/>
<text class="t" x="130" y="390" font-size="15" fill="var(--page)" text-anchor="middle">長約</text>
<rect x="210" y="350" width="140" height="64" rx="6" fill="var(--accent)"/>
<text class="t" x="280" y="390" font-size="15" fill="var(--page)" text-anchor="middle">營運商</text>
<rect x="360" y="350" width="140" height="64" rx="6" fill="var(--accent)"/>
<text class="t" x="430" y="390" font-size="15" fill="var(--page)" text-anchor="middle">保險</text>
<rect x="510" y="350" width="140" height="64" rx="6" fill="var(--accent)"/>
<text class="t" x="580" y="390" font-size="15" fill="var(--page)" text-anchor="middle">完成的設計</text>
<rect x="660" y="350" width="140" height="64" rx="6" fill="var(--accent)"/>
<text class="t" x="730" y="390" font-size="15" fill="var(--page)" text-anchor="middle">成本估算</text>
<rect x="810" y="350" width="140" height="64" rx="6" fill="var(--accent)"/>
<text class="t" x="880" y="390" font-size="15" fill="var(--page)" text-anchor="middle">併網許可</text>
<text class="t" x="60" y="448" font-size="19" fill="var(--accent)">六格都滿才是要花錢蓋了</text>

<text class="t" x="60" y="520" font-size="22" fill="var(--ink)">先問它落在哪一關，再看股價</text>
</svg>
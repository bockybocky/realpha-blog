<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同心圓：中心賽場零廣告，外環放後台與贊助曝光，一條引線指到圓外的轉播權">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600}
.b{font-size:16px}
.d{font-size:15px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">錢在畫面之外</text>
<circle cx="420" cy="300" r="170" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="420" cy="300" r="85" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="420" y="294" text-anchor="middle">賽場</text>
<text class="d" x="420" y="322" text-anchor="middle">零企業廣告</text>
<text class="b" x="420" y="172" text-anchor="middle">後台・選手通道</text>
<text class="b" x="420" y="446" text-anchor="middle">贊助曝光在這裡</text>
<line x1="556" y1="248" x2="700" y2="212" stroke="var(--line)" stroke-width="2"/>
<circle cx="556" cy="248" r="4" fill="var(--accent)"/>
<text class="b" x="712" y="208">轉播權</text>
<text class="d" x="712" y="232">數年前就賣掉</text>
<text class="d" x="712" y="254">簽到 2036</text>
<text class="c" x="60" y="530">比賽的畫面乾淨，收入在鏡頭之外</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="缺貨與議價能力的四象限，右上格亮起、右下格警示">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:20px; font-weight:700; }
    .body { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text x="60" y="56" class="title">缺貨 ≠ 有議價權</text>
  <rect x="200" y="100" width="300" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="100" width="300" height="190" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="3"/>
  <rect x="200" y="290" width="300" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="290" width="300" height="190" fill="var(--warn)" opacity="0.14" stroke="var(--warn)" stroke-width="2"/>
  <text x="650" y="190" class="grp" text-anchor="middle" style="fill:var(--accent)">真瓶頸</text>
  <text x="650" y="218" class="body" text-anchor="middle">缺貨＋漲價</text>
  <text x="650" y="380" class="grp" text-anchor="middle" style="fill:var(--warn)">只是忙</text>
  <text x="650" y="408" class="body" text-anchor="middle">缺貨＋多接單</text>
  <text x="350" y="190" class="grp" text-anchor="middle" style="fill:var(--dim)">本來就強</text>
  <text x="350" y="380" class="grp" text-anchor="middle" style="fill:var(--dim)">一般供應商</text>
  <line x1="200" y1="480" x2="820" y2="480" stroke="var(--dim)" stroke-width="2"/>
  <path d="M820,474 L834,480 L820,486 Z" fill="var(--dim)"/>
  <line x1="200" y1="480" x2="200" y2="86" stroke="var(--dim)" stroke-width="2"/>
  <path d="M194,86 L200,72 L206,86 Z" fill="var(--dim)"/>
  <text x="500" y="510" class="body" text-anchor="middle">缺貨程度 →</text>
  <text x="186" y="110" class="body" text-anchor="end">能漲價</text>
  <text x="186" y="476" class="body" text-anchor="end">不能漲</text>
  <text x="480" y="570" class="end" text-anchor="middle">要找的只有右上那一格</text>
</svg>
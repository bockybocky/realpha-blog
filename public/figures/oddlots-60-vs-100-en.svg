<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two tracks of equal length sit one above the other, the top one filled only to about six-tenths with a long blank stretch on the right and the bottom one filled end to end, and that blank stretch is the gap.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="66" font-size="27" font-weight="700" fill="var(--ink)">Two answers</text>
<text x="80" y="150" font-size="20" font-weight="700" fill="var(--dim)">Barclays survey says</text>
<rect x="80" y="170" width="720" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="80" y="170" width="432" height="60" rx="8" fill="var(--accent)"/>
<text x="104" y="208" font-size="20" font-weight="700" fill="var(--page)">60%: a problem</text>
<text x="536" y="208" font-size="16" fill="var(--dim)">Other 40%: no issue seen</text>
<text x="80" y="300" font-size="20" font-weight="700" fill="var(--dim)">Altmann's answer</text>
<rect x="80" y="320" width="720" height="60" rx="8" fill="var(--warn)"/>
<text x="104" y="358" font-size="20" font-weight="700" fill="var(--page)">100</text>
<rect x="512" y="400" width="288" height="4" fill="var(--grey)"/>
<rect x="512" y="400" width="4" height="22" fill="var(--grey)"/>
<rect x="796" y="400" width="4" height="22" fill="var(--grey)"/>
<text x="656" y="446" font-size="16" fill="var(--dim)" text-anchor="middle">the gap</text>
<text x="80" y="492" font-size="22" font-weight="700" fill="var(--ink)">The gap is timing, not the number</text>
</svg>
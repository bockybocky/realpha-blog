<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="時間軸上人事項目沿著回頭箭頭彈回原位，制度項目被卡榫擋住無法回頭、只能往前">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t27{font-size:27px;font-weight:700;fill:var(--ink)}
.t19{font-size:19px;font-weight:700;fill:var(--ink)}
.t15{font-size:15px;fill:var(--dim)}
.t22{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t27" x="48" y="46">一堆彈回原位，一堆卡住不回頭</text>

<line x1="120" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="4"/>
<circle cx="200" cy="300" r="9" fill="var(--grey)"/>
<circle cx="480" cy="300" r="9" fill="var(--grey)"/>
<circle cx="800" cy="300" r="9" fill="var(--grey)"/>
<text class="t15" x="200" y="332" text-anchor="middle">拔掉</text>
<text class="t15" x="480" y="332" text-anchor="middle">空窗</text>
<text class="t15" x="800" y="332" text-anchor="middle">復職</text>

<text class="t19" x="48" y="140">人事</text>
<circle cx="480" cy="190" r="14" fill="var(--grey)"/>
<path d="M466,178 C400,120 280,120 214,176" fill="none" stroke="var(--grey)" stroke-width="3"/>
<polygon points="206,188 220,172 224,190" fill="var(--grey)"/>
<circle cx="200" cy="190" r="14" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text class="t15" x="560" y="196">誰當執行長、誰當董事長、質詢排哪天</text>
<text class="t15" x="300" y="146" text-anchor="middle">彈回原位</text>

<text class="t19" x="48" y="430">制度</text>
<circle cx="480" cy="420" r="14" fill="var(--accent)"/>
<line x1="494" y1="420" x2="780" y2="420" stroke="var(--accent)" stroke-width="3"/>
<polygon points="792,420 774,412 774,428" fill="var(--accent)"/>
<polygon points="430,420 452,406 452,434" fill="var(--warn)"/>
<line x1="430" y1="398" x2="430" y2="442" stroke="var(--warn)" stroke-width="5"/>
<text class="t15" x="368" y="424" text-anchor="end">卡榫</text>
<text class="t15" x="520" y="470">東南亞轉手管制、法遵職位、委員會、繞道被寫開</text>

<text class="t22" x="48" y="534">要數的是下面那一排</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左格兩種用電併成一條流進住宅帳單，右格兩種用電分成兩條、住宅帳單那條不受影響">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">看得到的帳單，和看不到的帳單</text>

  <rect x="60" y="110" width="400" height="320" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="84" y="148" font-size="20" font-weight="700" fill="var(--warn)">合在一條</text>
  <text class="t" x="84" y="188" font-size="16" fill="var(--dim)">資料中心</text>
  <text class="t" x="84" y="232" font-size="16" fill="var(--dim)">住宅</text>
  <path d="M190 182 L280 206" stroke="var(--warn)" stroke-width="5" fill="none"/>
  <path d="M190 226 L280 206" stroke="var(--warn)" stroke-width="5" fill="none"/>
  <path d="M280 206 L368 206" stroke="var(--warn)" stroke-width="7" fill="none"/>
  <rect x="236" y="276" width="160" height="92" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="256" y="310" font-size="19" font-weight="700" fill="var(--ink)">我的電費</text>
  <text class="t" x="256" y="342" font-size="19" font-weight="700" fill="var(--warn)">變高了</text>
  <path d="M316 212 L316 270" stroke="var(--warn)" stroke-width="5"/>

  <rect x="500" y="110" width="400" height="320" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="524" y="148" font-size="20" font-weight="700" fill="var(--accent)">分成兩條</text>
  <text class="t" x="524" y="188" font-size="16" fill="var(--dim)">資料中心</text>
  <text class="t" x="524" y="232" font-size="16" fill="var(--dim)">住宅</text>
  <path d="M630 182 L812 182" stroke="var(--grey)" stroke-width="7" fill="none"/>
  <path d="M630 226 L756 226" stroke="var(--accent)" stroke-width="7" fill="none"/>
  <rect x="676" y="276" width="160" height="92" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="696" y="310" font-size="19" font-weight="700" fill="var(--ink)">我的電費</text>
  <text class="t" x="696" y="342" font-size="19" font-weight="700" fill="var(--accent)">沒變</text>
  <path d="M756 232 L756 270" stroke="var(--accent)" stroke-width="5"/>

  <text class="t" x="60" y="486" font-size="22" font-weight="700" fill="var(--ink)">反對從帳單長出來，不是從機房長出來</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="左格六個方塊整批換欄後總數不變，右格六個方塊減到剩兩個">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <defs>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--dim)"/>
    </marker>
  </defs>

  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">換地點 ≠ 降風險</text>
  <line x1="480" y1="96" x2="480" y2="446" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="270" y="124" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">換地點</text>
  <text class="t" x="700" y="124" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">降風險</text>

  <rect x="120" y="368" width="90" height="32" rx="3" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="120" y="331" width="90" height="32" rx="3" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="120" y="294" width="90" height="32" rx="3" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="120" y="257" width="90" height="32" rx="3" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="120" y="220" width="90" height="32" rx="3" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="120" y="183" width="90" height="32" rx="3" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>

  <rect x="310" y="368" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="310" y="331" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="310" y="294" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="310" y="257" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="310" y="220" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="310" y="183" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>

  <path d="M222 290 L296 290" stroke="var(--dim)" stroke-width="2.5" fill="none" marker-end="url(#ar-b)"/>
  <line x1="100" y1="410" x2="420" y2="410" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="165" y="436" font-size="16" fill="var(--dim)" text-anchor="middle">原持股</text>
  <text class="t" x="355" y="436" font-size="16" fill="var(--dim)" text-anchor="middle">聖杯股</text>
  <text class="t" x="270" y="164" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">總部位 6 → 6</text>

  <rect x="550" y="368" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="550" y="331" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="550" y="294" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="550" y="257" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="550" y="220" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="550" y="183" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <rect x="740" y="368" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="740" y="331" width="90" height="32" rx="3" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="740" y="294" width="90" height="32" rx="3" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="740" y="257" width="90" height="32" rx="3" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="740" y="220" width="90" height="32" rx="3" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="740" y="183" width="90" height="32" rx="3" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>

  <path d="M652 290 L726 290" stroke="var(--dim)" stroke-width="2.5" fill="none" marker-end="url(#ar-b)"/>
  <line x1="530" y1="410" x2="850" y2="410" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="595" y="436" font-size="16" fill="var(--dim)" text-anchor="middle">原持股</text>
  <text class="t" x="785" y="436" font-size="16" fill="var(--dim)" text-anchor="middle">訊號到，減碼</text>
  <text class="t" x="700" y="164" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">總部位 6 → 2</text>

  <text class="t" x="480" y="496" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">防守是把總量降下來，不是換一個欄位</text>
</svg>
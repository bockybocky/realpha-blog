<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="記憶體廠向左右分出兩群性質相反的客戶">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62">同一批貨，兩種客戶</text>

  <rect x="380" y="130" width="200" height="80" fill="var(--card)" stroke="var(--accent)" stroke-width="2" rx="8"/>
  <text class="g" x="480" y="178" text-anchor="middle">記憶體廠</text>

  <path d="M420 210 L220 300" stroke="var(--accent)" stroke-width="3" fill="none"/>
  <path d="M540 210 L740 300" stroke="var(--accent)" stroke-width="3" fill="none"/>

  <rect x="90" y="300" width="270" height="140" fill="var(--card)" stroke="var(--line)" rx="8"/>
  <text class="g" x="225" y="340" text-anchor="middle">消費端</text>
  <text class="b" x="225" y="374" text-anchor="middle">價格敏感</text>
  <text class="b" x="225" y="402" text-anchor="middle">貴了就少買</text>
  <text class="b" x="225" y="430" text-anchor="middle">長期關係</text>

  <rect x="600" y="300" width="270" height="140" fill="var(--card)" stroke="var(--line)" rx="8"/>
  <text class="g" x="735" y="340" text-anchor="middle">資料中心</text>
  <text class="b" x="735" y="374" text-anchor="middle">不看價格</text>
  <text class="b" x="735" y="402" text-anchor="middle">有多少收多少</text>
  <text class="b" x="735" y="430" text-anchor="middle">當下利潤</text>

  <text class="c" x="480" y="492" text-anchor="middle">分開管，別讓右邊燒掉左邊</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A timeline of five segments where the middle one is far longer than the other four combined">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .n { font-size:15px; fill:var(--dim); }
    .nw { font-size:20px; fill:var(--warn); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .w { font-size:16px; fill:var(--warn); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="80" y="58">Write down each step's time</text>
  <text class="s" x="80" y="90">Toy numbers; length is the point</text>

  <rect x="90" y="230" width="46" height="48" fill="var(--card)" stroke="var(--line)"/>
  <rect x="136" y="230" width="46" height="48" fill="var(--card)" stroke="var(--line)"/>
  <rect x="182" y="230" width="550" height="48" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
  <rect x="732" y="230" width="46" height="48" fill="var(--card)" stroke="var(--line)"/>
  <rect x="778" y="230" width="92" height="48" fill="var(--card)" stroke="var(--line)"/>

  <text class="n" x="113" y="260" text-anchor="middle">1 day</text>
  <text class="n" x="159" y="260" text-anchor="middle">1 day</text>
  <text class="nw" x="457" y="262" text-anchor="middle">12 days</text>
  <text class="n" x="755" y="260" text-anchor="middle">1 day</text>
  <text class="n" x="824" y="260" text-anchor="middle">2 days</text>

  <text class="b" x="113" y="308" text-anchor="middle">Prep</text>
  <text class="b" x="457" y="308" text-anchor="middle">Waiting for reply</text>
  <text class="b" x="824" y="308" text-anchor="middle">Wrap up</text>
  <text class="b" x="159" y="336" text-anchor="middle">Send</text>
  <text class="b" x="755" y="336" text-anchor="middle">Revise</text>

  <line x1="457" y1="196" x2="457" y2="224" stroke="var(--warn)" stroke-width="2"/>
  <polygon points="457,230 450,218 464,218" fill="var(--warn)"/>
  <text class="w" x="457" y="184" text-anchor="middle">All the time is here</text>

  <text class="c" x="80" y="420">Move only that step this week</text>
</svg>
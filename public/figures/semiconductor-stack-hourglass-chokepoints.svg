<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="沙漏形狀：上面多家收斂到一個節點，下面又扇開成更多家">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">往上窄，往下又散開</text>

<rect x="120" y="110" width="150" height="54" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="195" y="144" font-size="16" fill="var(--ink)" text-anchor="middle">昇騰晶片</text>
<rect x="405" y="110" width="150" height="54" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="480" y="144" font-size="16" fill="var(--ink)" text-anchor="middle">中芯國際</text>
<rect x="690" y="110" width="150" height="54" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="765" y="144" font-size="16" fill="var(--ink)" text-anchor="middle">自建晶圓廠</text>

<line x1="195" y1="166" x2="440" y2="256" stroke="var(--line)" stroke-width="3"/>
<line x1="480" y1="166" x2="480" y2="256" stroke="var(--line)" stroke-width="3"/>
<line x1="765" y1="166" x2="520" y2="256" stroke="var(--line)" stroke-width="3"/>

<rect x="370" y="258" width="220" height="70" rx="12" fill="var(--page)" stroke="var(--accent)" stroke-width="4"/>
<text class="t" x="480" y="302" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">浸潤式 DUV 機台</text>
<text class="t" x="612" y="300" font-size="16" fill="var(--accent)">最窄的一處</text>

<line x1="430" y1="330" x2="150" y2="420" stroke="var(--line)" stroke-width="3"/>
<line x1="455" y1="330" x2="345" y2="420" stroke="var(--line)" stroke-width="3"/>
<line x1="480" y1="330" x2="480" y2="420" stroke="var(--line)" stroke-width="3"/>
<line x1="505" y1="330" x2="615" y2="420" stroke="var(--line)" stroke-width="3"/>
<line x1="530" y1="330" x2="810" y2="420" stroke="var(--line)" stroke-width="3"/>

<rect x="80" y="422" width="140" height="54" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="150" y="456" font-size="16" fill="var(--ink)" text-anchor="middle">雷射</text>
<rect x="275" y="422" width="140" height="54" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="345" y="456" font-size="16" fill="var(--ink)" text-anchor="middle">鏡片</text>
<rect x="410" y="422" width="140" height="54" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2" transform="translate(0,66)"/>
<text class="t" x="480" y="522" font-size="16" fill="var(--ink)" text-anchor="middle">光阻劑</text>
<rect x="545" y="422" width="140" height="54" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="615" y="456" font-size="16" fill="var(--ink)" text-anchor="middle">蝕刻</text>
<rect x="740" y="422" width="140" height="54" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="810" y="456" font-size="16" fill="var(--ink)" text-anchor="middle">沉積</text>
<text class="t" x="150" y="516" font-size="16" fill="var(--grey)" text-anchor="middle">⋯⋯</text>
<text class="t" x="810" y="516" font-size="16" fill="var(--grey)" text-anchor="middle">⋯⋯</text>

<text class="t" x="480" y="574" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">每一格自己又是一個卡點，底下還有數百上千家</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the enrichment scale, the tiny band at the left is magnified to show natural uranium at the far left, grid reactor fuel slightly to its right, and HALEU almost touching the dashed twenty percent boundary, while submarine fuel above ninety percent sits far to the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型：繁體中文無襯線 */
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Enrich scale</text>
<rect x="100" y="150" width="780" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="150" width="156" height="40" rx="6" fill="var(--accent)" opacity="0.18"/>
<line x1="256" y1="140" x2="256" y2="200" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
<text x="268" y="134" font-size="17" fill="var(--warn)">20%</text>
<circle cx="802" cy="170" r="9" fill="var(--grey)"/>
<text x="700" y="134" font-size="19" font-weight="600" fill="var(--dim)">Subs: 90%+</text>
<text x="700" y="226" font-size="16" fill="var(--dim)">Military</text>
<text x="100" y="134" font-size="16" fill="var(--dim)">0</text>
<path d="M100,196 L100,300 M256,196 L880,300" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="100" y="300" width="780" height="48" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="724" y="300" width="156" height="48" rx="6" fill="var(--grey)" opacity="0.3"/>
<line x1="724" y1="290" x2="724" y2="360" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
<text x="700" y="282" font-size="19" font-weight="600" fill="var(--warn)">Line</text>
<circle cx="122" cy="324" r="8" fill="var(--accent)"/>
<text x="104" y="400" font-size="19" font-weight="600" fill="var(--ink)">0.711%</text>
<text x="104" y="424" font-size="16" fill="var(--dim)">Raw U</text>
<rect x="194" y="316" width="62" height="16" rx="4" fill="var(--accent)"/>
<text x="190" y="400" font-size="19" font-weight="600" fill="var(--ink)">3～5%</text>
<text x="190" y="424" font-size="16" fill="var(--dim)">Grid cores</text>
<circle cx="716" cy="324" r="8" fill="var(--accent)"/>
<text x="600" y="400" font-size="19" font-weight="600" fill="var(--ink)">19.75%</text>
<text x="600" y="424" font-size="16" fill="var(--dim)">HALEU・small core</text>
<text x="60" y="476" font-size="22" font-weight="600" fill="var(--ink)">Small cores sit just below it</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三層台階，由上到下為自由通行、逐案審查的五國、整扇關門的禁運國">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="48">晶片要進哪裡，門開幾分</text>

<rect x="60" y="100" width="820" height="110" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="140">其他國家</text>
<text class="s" x="84" y="172">門全開</text>
<path d="M620 155 L860 155" stroke="var(--accent)" stroke-width="4"/>
<path d="M830 140 L860 155 L830 170" fill="none" stroke="var(--accent)" stroke-width="4"/>

<rect x="60" y="228" width="820" height="130" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="84" y="268">新加坡　印尼　馬來西亞　巴西　泰國</text>
<text class="s" x="84" y="300">逐案申請許可：直接進、轉運停留再出口都算</text>
<path d="M620 320 L700 320" stroke="var(--warn)" stroke-width="4"/>
<rect x="706" y="296" width="18" height="48" fill="var(--warn)"/>
<path d="M740 320 L860 320" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 10"/>

<rect x="60" y="376" width="820" height="104" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="416">中國　俄羅斯　伊朗</text>
<text class="s" x="84" y="448">高算力晶片不准進</text>
<path d="M620 436 L720 436" stroke="var(--grey)" stroke-width="4"/>
<path d="M740 404 L820 468" stroke="var(--grey)" stroke-width="4"/>
<path d="M820 404 L740 468" stroke="var(--grey)" stroke-width="4"/>

<text class="c" x="60" y="520">新加的五國不是禁運，是每一批都要被看一眼</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="剖面圖：廠房地面只比海平面高一到兩公尺，外側水位越過兩公尺高的環堤，廠內積水一點八公尺">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">堤防擋得住水，擋不住那個念頭</text>
<text x="60" y="86" font-size="16" fill="var(--dim)">昭披耶河下游工業區剖面（示意）</text>

<line x1="80" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="80" y="430" width="800" height="60" fill="var(--card)"/>
<line x1="80" y1="498" x2="880" y2="498" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="880" y="518" font-size="15" text-anchor="end" fill="var(--dim)">海平面</text>
<text x="86" y="452" font-size="15" fill="var(--dim)">地面海拔 1～2 公尺</text>

<rect x="120" y="320" width="200" height="110" fill="var(--accent)" opacity="0.22"/>
<rect x="640" y="320" width="240" height="110" fill="var(--accent)" opacity="0.22"/>
<rect x="330" y="349" width="300" height="81" fill="var(--accent)" opacity="0.22"/>

<rect x="320" y="340" width="12" height="90" fill="var(--grey)"/>
<rect x="628" y="340" width="12" height="90" fill="var(--grey)"/>
<text x="326" y="326" font-size="15" text-anchor="middle" fill="var(--ink)">環堤</text>
<text x="326" y="306" font-size="15" text-anchor="middle" fill="var(--ink)">2 公尺</text>

<rect x="360" y="290" width="240" height="140" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="326" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">硬碟工廠</text>
<line x1="330" y1="349" x2="630" y2="349" stroke="var(--accent)" stroke-width="3"/>
<text x="480" y="390" font-size="16" text-anchor="middle" fill="var(--ink)">廠內水深 1.8 公尺</text>

<line x1="120" y1="320" x2="880" y2="320" stroke="var(--accent)" stroke-width="3" stroke-dasharray="0"/>
<text x="120" y="306" font-size="16" fill="var(--accent)">外側水位</text>

<text x="480" y="545" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">設施在場，於是「雨來了也不會怎樣」也在場</text>
</svg>
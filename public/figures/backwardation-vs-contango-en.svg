<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two futures curves side by side: the left one slopes down from the front month to the later months, and the right one slopes up from the front month to the later months.">
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px}
    .b{font-size:15px;fill:var(--dim)}
    .c{font-size:22px}
  </style>
  <text class="t" x="40" y="58">Backwardation adds, contango subtracts</text>
  <rect x="60" y="120" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <path d="M100 190 C 180 230, 300 272, 420 296" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="100" y="162">Energy: backwardation</text>
  <text class="b" x="100" y="350">Front months cost more than later ones</text>
  <text class="b" x="100" y="376">Total return 74% | price 45%</text>
  <text class="b" x="100" y="408">Front month</text>
  <text class="b" x="420" y="408" text-anchor="end">Later months</text>
  <rect x="500" y="120" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <path d="M540 296 C 620 272, 740 230, 860 190" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text class="g" x="540" y="162">Gas: contango</text>
  <text class="b" x="540" y="350">24% above spot a year out</text>
  <text class="b" x="540" y="376">−25% this year</text>
  <text class="b" x="540" y="408">Front month</text>
  <text class="b" x="860" y="408" text-anchor="end">Later months</text>
  <text class="c" x="40" y="498">The slope decides whether each roll pays you or costs you</text>
</svg>
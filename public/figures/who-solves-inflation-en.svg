<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One entrance splits into a short direct route above and a long looping route below, both reaching the same destination.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="54" font-size="27" fill="var(--ink)">Two routes, one destination</text>

  <path d="M 250 260 C 330 260 330 160 410 160 L 520 160 C 610 160 620 260 730 260" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 250 260 C 330 260 330 420 430 420 L 560 420 C 665 420 650 285 730 260" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>

  <rect x="70" y="220" width="180" height="80" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="160" y="268" font-size="20" fill="var(--ink)" text-anchor="middle">Inflation</text>

  <rect x="730" y="220" width="180" height="80" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="820" y="260" font-size="19" fill="var(--ink)" text-anchor="middle">Expectations</text>
  <text x="820" y="284" font-size="19" fill="var(--ink)" text-anchor="middle">Pushed down</text>

  <text x="465" y="142" font-size="20" fill="var(--accent)" text-anchor="middle">The Fed hikes</text>
  <text x="495" y="452" font-size="20" fill="var(--warn)" text-anchor="middle">The market lifts the long end</text>
  <text x="495" y="476" font-size="15" fill="var(--dim)" text-anchor="middle">The long way round costs more</text>

  <text x="480" y="510" font-size="22" fill="var(--ink)" text-anchor="middle">Someone has to do it; the only question is who</text>
</svg>
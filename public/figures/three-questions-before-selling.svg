<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="前兩格滿、第三格空白的三格圖：估值只靠已經成立的前兩項，第三項是空的">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="60" y="68">飛機上那一小時，問的三件事</text>

<rect x="60" y="110" width="250" height="250" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="340" y="110" width="250" height="250" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="620" y="110" width="280" height="250" rx="14" fill="var(--card)" stroke="var(--line)"/>

<text class="t g" x="80" y="146">營收</text>
<rect x="80" y="300" width="42" height="42" rx="6" fill="var(--accent)"/>
<text class="t b" x="80" y="372">很小</text>

<text class="t g" x="360" y="146">客戶基數</text>
<g fill="var(--accent)">
<rect x="360" y="180" width="22" height="22" rx="4"/><rect x="390" y="180" width="22" height="22" rx="4"/><rect x="420" y="180" width="22" height="22" rx="4"/><rect x="450" y="180" width="22" height="22" rx="4"/><rect x="480" y="180" width="22" height="22" rx="4"/><rect x="510" y="180" width="22" height="22" rx="4"/>
<rect x="360" y="210" width="22" height="22" rx="4"/><rect x="390" y="210" width="22" height="22" rx="4"/><rect x="420" y="210" width="22" height="22" rx="4"/><rect x="450" y="210" width="22" height="22" rx="4"/><rect x="480" y="210" width="22" height="22" rx="4"/><rect x="510" y="210" width="22" height="22" rx="4"/>
<rect x="360" y="240" width="22" height="22" rx="4"/><rect x="390" y="240" width="22" height="22" rx="4"/><rect x="420" y="240" width="22" height="22" rx="4"/><rect x="450" y="240" width="22" height="22" rx="4"/><rect x="480" y="240" width="22" height="22" rx="4"/><rect x="510" y="240" width="22" height="22" rx="4"/>
<rect x="360" y="270" width="22" height="22" rx="4"/><rect x="390" y="270" width="22" height="22" rx="4"/><rect x="420" y="270" width="22" height="22" rx="4"/><rect x="450" y="270" width="22" height="22" rx="4"/><rect x="480" y="270" width="22" height="22" rx="4"/><rect x="510" y="270" width="22" height="22" rx="4"/>
<rect x="360" y="300" width="22" height="22" rx="4"/><rect x="390" y="300" width="22" height="22" rx="4"/><rect x="420" y="300" width="22" height="22" rx="4"/><rect x="450" y="300" width="22" height="22" rx="4"/><rect x="480" y="300" width="22" height="22" rx="4"/><rect x="510" y="300" width="22" height="22" rx="4"/>
</g>
<text class="t b" x="360" y="372">很大</text>

<text class="t g" x="640" y="146">變現與回收資本</text>
<rect x="660" y="190" width="200" height="130" rx="10" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 9"/>
<text class="t" x="742" y="275" font-size="58" font-weight="700" fill="var(--warn)">?</text>
<text class="t b" x="640" y="372">空白</text>

<path d="M60 404 L60 418 L590 418 L590 404" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="t c" x="60" y="462">估值，算的是這兩格</text>
<text class="t b" x="60" y="498">第三格沒有答案，而它決定前兩格值多少</text>
</svg>
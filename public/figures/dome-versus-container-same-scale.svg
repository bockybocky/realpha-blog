<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊巨大的圍阻體穹頂裡只有一顆小小的反應爐本體，右邊整座小型反應爐縮成一個貨櫃大小的方塊，同一比例尺下對比">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型：繁體中文無襯線 */
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">穹頂與貨櫃（同一比例尺）</text>
<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="3"/>
<path d="M90,440 A190,190 0 0 1 470,440" fill="var(--card)" stroke="var(--grey)" stroke-width="22"/>
<rect x="252" y="382" width="56" height="58" rx="6" fill="var(--accent)"/>
<text x="150" y="200" font-size="20" font-weight="600" fill="var(--ink)">圍阻體</text>
<text x="150" y="228" font-size="16" fill="var(--dim)">又厚又大・最極端事故</text>
<text x="196" y="372" font-size="16" fill="var(--accent)">本體其實不大</text>
<text x="120" y="490" font-size="19" font-weight="600" fill="var(--dim)">數十億美元的工程案</text>
<rect x="650" y="372" width="180" height="68" rx="6" fill="var(--accent)"/>
<circle cx="690" cy="448" r="9" fill="var(--grey)"/>
<circle cx="790" cy="448" r="9" fill="var(--grey)"/>
<text x="650" y="348" font-size="20" font-weight="600" fill="var(--ink)">小爐心</text>
<text x="650" y="490" font-size="19" font-weight="600" fill="var(--dim)">工廠量產・拉到現場</text>
<text x="60" y="100" font-size="22" font-weight="600" fill="var(--ink)">爐心做小，那層穹頂就跟著不見了</text>
</svg>
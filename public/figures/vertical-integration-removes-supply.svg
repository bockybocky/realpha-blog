<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊池子裡五個方塊，右邊一個被框進收購方、四個留在池子裡">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; fill:var(--dim); }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--dim); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:2; }
</style>
<defs><marker id="arE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--dim)"/></marker></defs>
<text class="t" x="60" y="56">卡點被買走，公開市場就少一塊</text>
<text class="g" x="90" y="134">收購前</text>
<rect class="card" x="90" y="170" width="330" height="220" rx="10"/>
<text class="g" x="112" y="206">公開市場</text>
<rect x="110" y="250" width="50" height="50" rx="4" fill="var(--grey)"/>
<rect x="170" y="250" width="50" height="50" rx="4" fill="var(--grey)"/>
<rect x="230" y="250" width="50" height="50" rx="4" fill="var(--grey)"/>
<rect x="290" y="250" width="50" height="50" rx="4" fill="var(--grey)"/>
<rect x="350" y="250" width="50" height="50" rx="4" fill="var(--grey)"/>
<text class="b" x="112" y="350">5 家</text>
<line x1="438" y1="280" x2="506" y2="280" stroke="var(--dim)" stroke-width="2" marker-end="url(#arE)"/>
<text class="s" x="472" y="258" text-anchor="middle">收購</text>
<text class="g" x="540" y="134">收購後</text>
<rect x="540" y="170" width="160" height="220" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="558" y="206">收購方</text>
<rect x="560" y="250" width="50" height="50" rx="4" fill="var(--accent)"/>
<text class="b" x="558" y="350">1 家</text>
<rect class="card" x="720" y="170" width="200" height="220" rx="10"/>
<text class="g" x="738" y="206">公開市場</text>
<rect x="738" y="250" width="40" height="50" rx="4" fill="var(--grey)"/>
<rect x="784" y="250" width="40" height="50" rx="4" fill="var(--grey)"/>
<rect x="830" y="250" width="40" height="50" rx="4" fill="var(--grey)"/>
<rect x="876" y="250" width="40" height="50" rx="4" fill="var(--grey)"/>
<text class="b" x="738" y="350">4 家</text>
<text class="c" x="60" y="462">最緊的那層，市場上反而更買不到</text>
</svg>
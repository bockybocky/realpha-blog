<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩組橫條比較：州公路總里程與摩西斯蓋的部分幾乎等長；市政府借款額度只有管理局的一半不到">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .ttl { font-size:27px; font-weight:700; }
    .grp { font-size:20px; font-weight:700; fill:var(--dim); }
    .lbl { font-size:16px; fill:var(--dim); }
    .num { font-size:16px; font-weight:700; }
    .cc { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t ttl" x="60" y="64">一個沒被選上的人，量體比政府大</text>

  <text class="t grp" x="60" y="130">公路里程（至 1964 年，紐約州完工）</text>
  <rect x="60" y="150" width="760" height="40" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="150" width="760" height="40" rx="6" fill="none" stroke="var(--grey)"/>
  <text class="t lbl" x="836" y="176">全州</text>
  <text class="t num" x="72" y="177" fill="var(--dim)">899 英里</text>
  <rect x="60" y="202" width="568" height="40" rx="6" fill="var(--accent)" opacity="0.85"/>
  <text class="t num" x="72" y="229" fill="var(--page)">672 英里</text>
  <text class="t lbl" x="644" y="229">摩西斯蓋的</text>

  <text class="t grp" x="60" y="312">能借多少（1946 年）</text>
  <rect x="60" y="332" width="317" height="40" rx="6" fill="var(--card)" stroke="var(--grey)"/>
  <text class="t num" x="72" y="359" fill="var(--dim)">1.5 億美元</text>
  <text class="t lbl" x="393" y="359">紐約市政府（撞到法定債限）</text>
  <rect x="60" y="384" width="760" height="40" rx="6" fill="var(--accent)" opacity="0.85"/>
  <text class="t num" x="72" y="411" fill="var(--page)">3.6 億美元</text>
  <text class="t lbl" x="836" y="411">管理局</text>

  <line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text class="t cc" x="60" y="512">沒有選票，額度卻是市政府的兩倍多</text>
</svg>
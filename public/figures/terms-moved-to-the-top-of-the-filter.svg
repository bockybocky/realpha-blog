<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="條款從三層篩選的最底層被搬到最上層，成為第一道閘">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">篩選順序整個倒過來</text>

  <text class="t" x="200" y="118" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">之前</text>
  <text class="t" x="720" y="118" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">之後</text>

  <text class="t" x="68" y="175" font-size="15" fill="var(--dim)">先</text>
  <text class="t" x="68" y="420" font-size="15" fill="var(--dim)">後</text>
  <line x1="92" y1="150" x2="92" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="612" y1="150" x2="612" y2="430" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="588" y="175" font-size="15" fill="var(--dim)" text-anchor="end">先</text>
  <text class="t" x="588" y="420" font-size="15" fill="var(--dim)" text-anchor="end">後</text>

  <rect x="120" y="150" width="200" height="66" rx="33" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="220" y="191" font-size="19" fill="var(--ink)" text-anchor="middle">強不強</text>
  <rect x="120" y="248" width="200" height="66" rx="33" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="220" y="289" font-size="19" fill="var(--ink)" text-anchor="middle">貴不貴</text>
  <rect x="140" y="352" width="160" height="44" rx="22" fill="var(--page)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="t" x="220" y="381" font-size="15" fill="var(--grey)" text-anchor="middle">條款</text>
  <text class="t" x="220" y="428" font-size="15" fill="var(--grey)" text-anchor="middle">順便看</text>

  <path d="M340 374 C 450 374 440 196 620 188" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M614 180 L 634 188 L 614 196 Z" fill="var(--accent)"/>

  <rect x="640" y="150" width="240" height="78" rx="39" fill="var(--accent)"/>
  <text class="t" x="760" y="197" font-size="22" font-weight="700" fill="var(--page)" text-anchor="middle">條款</text>
  <rect x="660" y="262" width="200" height="60" rx="30" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="760" y="300" font-size="19" fill="var(--ink)" text-anchor="middle">強不強</text>
  <rect x="660" y="352" width="200" height="60" rx="30" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="760" y="390" font-size="19" fill="var(--ink)" text-anchor="middle">貴不貴</text>

  <text class="t" x="480" y="492" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">「免費」和「能用在機密上」不相干</text>
</svg>
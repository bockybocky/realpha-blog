<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two paired before-and-after risk bars: the company bar shrinks sharply while the country bar barely moves, and the three unchecked boxes below are the institutional work still untouched.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="60">Whose risk bar got shorter</text>
<text class="d" x="60" y="90">Bar length = risk the investor carries</text>

<text class="d" x="300" y="128">Before deal</text>
<text class="d" x="300" y="228">After deal</text>

<text class="g" x="60" y="152">NABEP</text>
<rect x="300" y="136" width="580" height="42" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2.5"/>
<rect x="300" y="236" width="170" height="42" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="d" x="490" y="264">35% US government stake</text>

<text class="g" x="60" y="336">Venezuela</text>
<rect x="300" y="320" width="580" height="42" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2.5"/>
<rect x="300" y="380" width="560" height="42" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
<text class="d" x="300" y="312">Before deal</text>
<text class="d" x="300" y="412" opacity="0">.</text>

<rect x="300" y="446" width="186" height="52" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="b" x="393" y="478" text-anchor="middle">Amend hydrocarbons law</text>
<rect x="497" y="446" width="186" height="52" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="b" x="590" y="478" text-anchor="middle">Write the rules</text>
<rect x="694" y="446" width="186" height="52" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="b" x="787" y="478" text-anchor="middle">Set up a regulator</text>
<text class="d" x="60" y="478">None of it done yet</text>

<text class="c" x="60" y="536">The short bar is the company's; the long one is the country's.</text>
</svg>
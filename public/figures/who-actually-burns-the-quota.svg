<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩排等長橫條，上排大塊是主 session，下排比例翻轉，排程與機器人幾乎佔滿整條">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .n { font-size:16px; fill:var(--page); }
    .m { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="40" y="56">Claude 的額度，其實是誰在燒</text>

<text class="g" x="40" y="212">我以為</text>
<rect x="200" y="180" width="460" height="70" rx="6" fill="var(--grey)"/>
<rect x="660" y="180" width="180" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="n" x="430" y="222" text-anchor="middle">主 session 打字</text>
<text class="m" x="750" y="222" text-anchor="middle">排程</text>

<text class="g" x="40" y="372">實際</text>
<text class="s" x="40" y="396">2026-09-05</text>
<rect x="200" y="340" width="40" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="240" y="340" width="600" height="70" rx="6" fill="var(--accent)"/>
<text class="n" x="540" y="382" text-anchor="middle">排程與機器人　Opus 1,372 次呼叫、5.4 億 token</text>
<text class="s" x="220" y="432" text-anchor="middle">主 session</text>

<text class="c" x="40" y="490">窗變黃，先去看不是我在打字的那一半</text>
</svg>
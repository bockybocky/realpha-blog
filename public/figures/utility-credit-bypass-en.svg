<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The arrow of credit bypasses her and lands on the nephew.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Right answer, wrong name</text>

  <rect x="60" y="300" width="240" height="90" rx="12" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="t" x="180" y="340" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">Her</text>
  <text class="t" x="180" y="368" font-size="16" fill="var(--dim)" text-anchor="middle">Hinted in fiction</text>

  <rect x="60" y="150" width="240" height="80" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="180" y="198" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">Utility</text>

  <path d="M300 190 C480 190 480 300 650 300" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <path d="M636 292 L660 300 L636 308 Z" fill="var(--accent)"/>

  <rect x="660" y="260" width="240" height="80" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="780" y="308" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Nephew</text>

  <path d="M780 340 V400" stroke="var(--line)" stroke-width="4"/>
  <path d="M772 392 L780 414 L788 392 Z" fill="var(--line)"/>
  <rect x="660" y="420" width="240" height="62" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="780" y="459" font-size="19" fill="var(--ink)" text-anchor="middle">The name in textbooks</text>

  <path d="M180 290 V240" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
  <text class="t" x="330" y="420" font-size="16" fill="var(--dim)">Origin here, route not through here</text>
</svg>
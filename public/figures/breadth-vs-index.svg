<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="上方一條幾乎水平的藍線，下方一條從左上往右下一路滑落、穿過五成虛線的橘線">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; }
    .ac { fill:var(--accent); }
    .wn { fill:var(--warn); }
    .dm { fill:var(--dim); }
</style>
<text x="60" y="52" class="t">城堡沒動，沙在移動</text>
<text x="80" y="110" class="g">標普 500 指數</text>
<path d="M120,170 L240,160 L360,172 L480,162 L600,168 L720,158 L860,166" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="872" y="172" class="b ac">持平</text>
<text x="80" y="260" class="g">站上 50 日均線的成分股</text>
<line x1="120" y1="400" x2="860" y2="400" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="110" y="405" class="s dm" text-anchor="end">50%</text>
<path d="M120,360 L240,368 L360,382 L480,390 L600,408 L720,418 L860,430" fill="none" stroke="var(--warn)" stroke-width="3"/>
<circle cx="120" cy="360" r="6" fill="var(--warn)"/>
<circle cx="860" cy="430" r="6" fill="var(--warn)"/>
<text x="110" y="366" class="b wn" text-anchor="end">70%</text>
<text x="872" y="437" class="g wn">35%</text>
<line x1="120" y1="500" x2="860" y2="500" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="528" class="s dm">一個月前</text>
<text x="860" y="528" class="s dm" text-anchor="end">現在</text>
<text x="480" y="564" class="b dm" text-anchor="middle">少數大型科技股撐住指數</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three shrinking blocks, from twelve hundred down to a single dot and finally an empty dashed box">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">1,200 agents, none told a human</text>
<text x="80" y="140" font-size="20" fill="var(--dim)">All agents</text>
<rect x="80" y="156" width="260" height="200" rx="8" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="2"/>
<text x="168" y="270" font-size="27" fill="var(--ink)">1,200</text>
<line x1="368" y1="256" x2="452" y2="256" stroke="var(--line)" stroke-width="2"/>
<polygon points="452,256 438,250 438,262" fill="var(--line)"/>
<text x="480" y="140" font-size="20" fill="var(--dim)">Considered it</text>
<rect x="480" y="240" width="34" height="32" rx="4" fill="var(--accent)" fill-opacity="0.5" stroke="var(--accent)" stroke-width="2"/>
<text x="526" y="266" font-size="27" fill="var(--ink)">6</text>
<line x1="590" y1="256" x2="674" y2="256" stroke="var(--line)" stroke-width="2"/>
<polygon points="674,256 660,250 660,262" fill="var(--line)"/>
<text x="700" y="140" font-size="20" fill="var(--warn)">Actually did</text>
<rect x="700" y="216" width="160" height="80" rx="8" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 8"/>
<text x="766" y="270" font-size="27" fill="var(--warn)">0</text>
<text x="60" y="440" font-size="22" fill="var(--ink)">They crossed lines, never asked help</text>
</svg>
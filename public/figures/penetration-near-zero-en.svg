<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="An extremely small square sits inside a large square, taking up less than a tenth of a percent of its area.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="64" font-size="27" fill="var(--ink)">Penetration: this is all of it inside customer spend</text>

<rect x="80" y="100" width="380" height="380" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="92" font-size="20" fill="var(--dim)">Total spend of Fortune 500 customers</text>
<rect x="260" y="280" width="13" height="13" fill="var(--accent)"/>

<line x1="273" y1="280" x2="620" y2="180" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="273" y1="293" x2="620" y2="420" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 5"/>

<rect x="620" y="180" width="240" height="240" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="620" y="180" width="240" height="240" fill="var(--accent)" opacity="0.12"/>
<rect x="728" y="288" width="24" height="24" fill="var(--accent)"/>
<text x="620" y="462" font-size="19" fill="var(--ink)">Paid to models: under 0.1%</text>

<text x="80" y="520" font-size="22" fill="var(--ink)">One-line note: this number is zero</text>
</g>
</svg>
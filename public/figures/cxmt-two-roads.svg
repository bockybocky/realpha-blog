<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="一個起點分岔成上下兩條路，兩條路各自指向不同的受壓對象">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
<defs>
<marker id="gb1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
<marker id="gb2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/></marker>
</defs>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">威脅在哪，看它走哪條路</text>
<rect x="60" y="250" width="250" height="110" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="82" y="292" font-size="20" font-weight="700" fill="var(--ink)">長鑫存儲</text>
<text x="82" y="324" font-size="16" fill="var(--dim)">停在 16 奈米</text>
<path d="M310 305 L420 305 L420 195 L508 195" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#gb1)"/>
<path d="M420 305 L420 455 L508 455" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#gb2)"/>
<text x="432" y="172" font-size="16" fill="var(--accent)">目前方向</text>
<text x="432" y="438" font-size="16" fill="var(--dim)">另一種可能</text>
<rect x="520" y="120" width="380" height="150" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="542" y="162" font-size="20" font-weight="700" fill="var(--ink)">走先進製程</text>
<text x="542" y="196" font-size="16" fill="var(--ink)">差 3～4 世代</text>
<text x="542" y="222" font-size="16" fill="var(--ink)">投片成長 → 位元產出打折</text>
<text x="542" y="250" font-size="16" fill="var(--dim)">成熟製程廠：喘息</text>
<rect x="520" y="380" width="380" height="150" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="542" y="422" font-size="20" font-weight="700" fill="var(--ink)">轉攻成熟製程</text>
<text x="542" y="456" font-size="16" fill="var(--ink)">同一片市場、正面對撞</text>
<text x="542" y="486" font-size="16" fill="var(--warn)">壓力：南亞科／華邦電</text>
<rect x="60" y="548" width="840" height="60" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="586" font-size="22" text-anchor="middle" fill="var(--ink)">方向不同，受傷的人不同</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A nearly flat curve suddenly shoots straight up to the dashed line at a finite point in time, while three eddies above go from round and plump to stretched into thin threads.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<defs><marker id="f1a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker></defs>
<text x="48" y="56" class="t">Finite-time blow-up</text>
<line x1="100" y1="470" x2="880" y2="470" stroke="var(--grey)" stroke-width="2"/>
<line x1="100" y1="110" x2="100" y2="470" stroke="var(--grey)" stroke-width="2"/>
<text x="112" y="104" class="d">Vorticity (spin)</text>
<text x="880" y="500" class="d" text-anchor="end">Time</text>
<ellipse cx="200" cy="230" rx="36" ry="36" fill="none" stroke="var(--accent)" stroke-width="2"/>
<ellipse cx="200" cy="230" rx="24" ry="24" fill="none" stroke="var(--accent)" stroke-width="2"/>
<ellipse cx="200" cy="230" rx="12" ry="12" fill="none" stroke="var(--accent)" stroke-width="2"/>
<ellipse cx="370" cy="230" rx="52" ry="17" fill="none" stroke="var(--accent)" stroke-width="2"/>
<ellipse cx="370" cy="230" rx="35" ry="11" fill="none" stroke="var(--accent)" stroke-width="2"/>
<ellipse cx="370" cy="230" rx="18" ry="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<ellipse cx="550" cy="230" rx="66" ry="5" fill="none" stroke="var(--accent)" stroke-width="2"/>
<ellipse cx="550" cy="230" rx="45" ry="3.5" fill="none" stroke="var(--accent)" stroke-width="2"/>
<ellipse cx="550" cy="230" rx="24" ry="2" fill="none" stroke="var(--accent)" stroke-width="2"/>
<line x1="248" y1="230" x2="306" y2="230" stroke="var(--dim)" stroke-width="2" marker-end="url(#f1a)"/>
<line x1="428" y1="230" x2="474" y2="230" stroke="var(--dim)" stroke-width="2" marker-end="url(#f1a)"/>
<text x="200" y="298" class="d" text-anchor="middle">Round</text>
<text x="370" y="298" class="d" text-anchor="middle">Stretching</text>
<text x="550" y="298" class="d" text-anchor="middle">Noodle</text>
<path d="M100,440 C300,436 470,425 570,385 C640,355 680,260 694,120" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
<text x="140" y="422" class="b">Smooth</text>
<line x1="705" y1="110" x2="705" y2="470" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="722" y="132" class="c" style="fill:var(--warn)">∞</text>
<text x="722" y="158" class="d">Toward ∞</text>
<text x="705" y="500" class="g" text-anchor="middle" style="fill:var(--warn)">T*</text>
<text x="705" y="526" class="d" text-anchor="middle">Finite</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three boxes in a row, the first two holding something and the third one empty.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="480" y="58" font-size="27" fill="var(--ink)" text-anchor="middle">What the skipped stretch of time used to hold</text>

  <rect x="60" y="130" width="250" height="230" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="355" y="130" width="250" height="230" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="650" y="130" width="250" height="230" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>

  <rect x="140" y="250" width="30" height="30" fill="var(--accent)"/>
  <rect x="180" y="250" width="30" height="30" fill="var(--accent)"/>
  <rect x="160" y="210" width="30" height="30" fill="var(--accent)"/>

  <rect x="400" y="300" width="26" height="26" fill="var(--accent)"/>
  <rect x="432" y="300" width="26" height="26" fill="var(--accent)"/>
  <rect x="464" y="300" width="26" height="26" fill="var(--accent)"/>
  <rect x="496" y="300" width="26" height="26" fill="var(--accent)"/>
  <rect x="528" y="300" width="26" height="26" fill="var(--accent)"/>
  <rect x="416" y="268" width="26" height="26" fill="var(--accent)"/>
  <rect x="448" y="268" width="26" height="26" fill="var(--accent)"/>
  <rect x="480" y="268" width="26" height="26" fill="var(--accent)"/>
  <rect x="512" y="268" width="26" height="26" fill="var(--accent)"/>
  <rect x="448" y="236" width="26" height="26" fill="var(--accent)"/>
  <rect x="480" y="236" width="26" height="26" fill="var(--accent)"/>
  <rect x="464" y="204" width="26" height="26" fill="var(--accent)"/>

  <text x="185" y="172" font-size="20" fill="var(--ink)" text-anchor="middle">16 seconds</text>
  <text x="480" y="172" font-size="20" fill="var(--ink)" text-anchor="middle">26 years</text>
  <text x="775" y="172" font-size="20" fill="var(--warn)" text-anchor="middle">The young</text>

  <text x="185" y="402" font-size="16" fill="var(--dim)" text-anchor="middle">One screening pass</text>
  <text x="480" y="402" font-size="16" fill="var(--dim)" text-anchor="middle">Judgment built up over time</text>
  <text x="775" y="402" font-size="16" fill="var(--warn)" text-anchor="middle">Nothing has grown yet</text>

  <text x="480" y="500" font-size="22" fill="var(--ink)" text-anchor="middle">Before cutting out a wait, look at what it was doing for you</text>
</svg>
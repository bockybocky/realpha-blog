<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條成長線從危機前同一點分岔，十八年後張開成一塊愈來愈大的缺口面積">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">少掉的那一個百分點，張成一塊缺口</text>
  <text class="t" x="60" y="96" font-size="16" fill="var(--dim)">金融危機後十八年（示意）</text>

  <line x1="120" y1="440" x2="820" y2="440" stroke="var(--line)" stroke-width="2"/>
  <polygon points="150,400 760,170 760,330" fill="var(--grey)" opacity="0.35"/>
  <polyline points="150,400 300,342 450,286 600,228 760,170" fill="none" stroke="var(--grey)" stroke-width="4" stroke-dasharray="8 6"/>
  <polyline points="150,400 300,382 450,364 600,346 760,330" fill="none" stroke="var(--accent)" stroke-width="4"/>

  <text class="t" x="770" y="162" font-size="20" font-weight="700" fill="var(--dim)">成長 3%</text>
  <text class="t" x="770" y="336" font-size="20" font-weight="700" fill="var(--accent)">成長 2%</text>
  <text class="t" x="770" y="360" font-size="16" fill="var(--dim)">實際走的那條</text>

  <text class="t" x="420" y="262" font-size="20" font-weight="700" fill="var(--ink)">5.6 兆美元</text>
  <text class="t" x="420" y="286" font-size="16" fill="var(--dim)">美國家庭少掉的</text>

  <text class="t" x="130" y="470" font-size="16" fill="var(--dim)">危機前</text>
  <text class="t" x="720" y="470" font-size="16" fill="var(--dim)">現在</text>
  <text class="t" x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">十八年卡住，就是十八年的怨氣來源</text>
</svg>
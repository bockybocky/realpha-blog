<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="A horizontal track split into three segments, in order who is asking, who has ordered and who has been paid, with a marker resting on the leftmost segment.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
  <text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">Where the evidence stands</text>

  <circle cx="200" cy="184" r="15" fill="var(--warn)"/>
  <polygon points="200,232 186,206 214,206" fill="var(--warn)"/>
  <text x="200" y="164" font-size="16" text-anchor="middle" fill="var(--warn)">Nuclear merchant ships</text>

  <rect x="80" y="252" width="253" height="64" rx="6" fill="var(--accent)"/>
  <rect x="353" y="252" width="253" height="64" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="626" y="252" width="254" height="64" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text x="206" y="292" font-size="20" text-anchor="middle" fill="var(--page)">Who is asking</text>
  <text x="479" y="292" font-size="20" text-anchor="middle" fill="var(--dim)">Who has ordered</text>
  <text x="753" y="292" font-size="20" text-anchor="middle" fill="var(--dim)">Who has been paid</text>

  <line x1="80" y1="352" x2="880" y2="352" stroke="var(--line)" stroke-width="2"/>
  <polygon points="898,352 872,342 872,362" fill="var(--line)"/>
  <text x="80" y="386" font-size="16" fill="var(--dim)">Requests for information</text>
  <text x="880" y="386" font-size="16" text-anchor="end" fill="var(--dim)">Actual revenue</text>

  <text x="60" y="452" font-size="22" font-weight="700" fill="var(--ink)">Not that it will not happen, but knowing where it stands today</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩格對比，左邊一條來源匯成一根矮柱，右邊兩條來源匯成一根明顯更高的柱" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="64" y="66" font-size="27" font-weight="700" fill="var(--ink)">兩次大漲，來源的數量不一樣</text>
<text x="64" y="98" font-size="16" fill="var(--dim)">上一次一條鏈，這一次兩條分開長</text>

<line x1="480" y1="140" x2="480" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

<text x="80" y="172" font-size="20" font-weight="700" fill="var(--dim)">2017、2018</text>
<rect x="80" y="196" width="150" height="42" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="155" y="223" font-size="15" fill="var(--dim)" text-anchor="middle">製程轉換不順</text>
<rect x="80" y="252" width="150" height="42" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="155" y="279" font-size="15" fill="var(--dim)" text-anchor="middle">串流伺服器</text>
<path d="M238 245 L296 245" stroke="var(--grey)" stroke-width="2"/>
<path d="M290 239 L302 245 L290 251 Z" fill="var(--grey)"/>

<rect x="310" y="356" width="110" height="90" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="365" y="330" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">兩三季</text>

<text x="540" y="172" font-size="20" font-weight="700" fill="var(--accent)">這一次</text>
<rect x="540" y="196" width="170" height="42" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="625" y="223" font-size="15" fill="var(--dim)" text-anchor="middle">AI・顯示卡那條</text>
<rect x="540" y="252" width="170" height="42" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="625" y="279" font-size="15" fill="var(--dim)" text-anchor="middle">Agentic 配 CPU</text>
<path d="M718 217 L772 217" stroke="var(--accent)" stroke-width="2"/>
<path d="M766 211 L778 217 L766 223 Z" fill="var(--accent)"/>
<path d="M718 273 L772 273" stroke="var(--accent)" stroke-width="2"/>
<path d="M766 267 L778 273 L766 279 Z" fill="var(--accent)"/>

<rect x="786" y="196" width="110" height="250" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="841" y="172" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">季數更多</text>

<line x1="64" y1="446" x2="896" y2="446" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="506" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">多長出來的那條，過去沒有</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two lines side by side: the left one falls and keeps sliding, while the right one dips a notch and immediately bounces back higher.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); font-weight:700; }
  .g { font-size:20px; fill:var(--ink); font-weight:700; }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="70" y="58">One rate shock, two kinds of wounds</text>
<rect x="70" y="92" width="390" height="330" fill="var(--card)" rx="8"/>
<rect x="500" y="92" width="390" height="330" fill="var(--card)" rx="8"/>
<text class="g" x="86" y="128">Rent model</text>
<text class="b" x="214" y="128">Sticky prices</text>
<text class="g" x="524" y="128">GPU rate</text>
<text class="b" x="640" y="128">New racks</text>
<line x1="94" y1="390" x2="436" y2="390" stroke="var(--line)" stroke-width="2"/>
<line x1="524" y1="390" x2="866" y2="390" stroke="var(--line)" stroke-width="2"/>
<polyline points="100,190 170,190 170,230 250,230 250,270 340,270 340,300 430,300" fill="none" stroke="var(--grey)" stroke-width="5"/>
<polyline points="530,190 600,190 600,250 660,250 660,180 740,180 740,160 860,160" fill="none" stroke="var(--accent)" stroke-width="5"/>
<line x1="170" y1="150" x2="170" y2="186" stroke="var(--warn)" stroke-width="3"/>
<path d="M170 190 l-7 -14 h14 z" fill="var(--warn)"/>
<text class="b" x="186" y="160">Rates +1</text>
<line x1="600" y1="150" x2="600" y2="186" stroke="var(--warn)" stroke-width="3"/>
<path d="M600 190 l-7 -14 h14 z" fill="var(--warn)"/>
<text class="b" x="616" y="160">Rates +1</text>
<text class="b" x="340" y="350">Each cut stays cut</text>
<text class="b" x="750" y="350">Back in a quarter</text>
<text class="b" x="94" y="416">Time</text>
<text class="b" x="524" y="416">Time</text>
<text class="c" x="70" y="500">Same rent business, reaction speed decides if the wound stays</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一條細直線串三個點，右邊五條線從不同方向匯進同一個方塊，右邊那束明顯更粗更多">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">我腦裡的那條線，和真正通到帳單的那束線</text>

  <text class="g" x="60" y="118">我原本的版本</text>
  <line x1="70" y1="200" x2="400" y2="200" stroke="var(--grey)" stroke-width="3"/>
  <circle cx="70" cy="200" r="9" fill="var(--grey)"/>
  <circle cx="235" cy="200" r="9" fill="var(--grey)"/>
  <circle cx="400" cy="200" r="9" fill="var(--grey)"/>
  <text class="n" x="46" y="236">算力</text>
  <text class="n" x="211" y="236">用電</text>
  <text class="n" x="376" y="236">漲價</text>
  <text class="n" x="70" y="300">一條線、三個點</text>

  <text class="g" x="540" y="118">研究講的版本</text>
  <rect x="790" y="250" width="120" height="120" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="818" y="318">帳單</text>
  <path d="M540 150 C 680 150 700 290 788 300" fill="none" stroke="var(--accent)" stroke-width="9"/>
  <path d="M540 220 C 680 220 700 300 788 308" fill="none" stroke="var(--accent)" stroke-width="8"/>
  <path d="M540 300 C 660 300 700 306 788 310" fill="none" stroke="var(--accent)" stroke-width="10"/>
  <path d="M540 380 C 680 380 700 326 788 316" fill="none" stroke="var(--accent)" stroke-width="7"/>
  <path d="M540 450 C 690 450 700 340 788 322" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <text class="n" x="540" y="142">老化電網</text>
  <text class="n" x="540" y="212">防野火</text>
  <text class="n" x="540" y="292">極端氣候復原</text>
  <text class="n" x="540" y="372">輸配升級</text>
  <text class="n" x="540" y="442">資料中心</text>
  <text class="n" x="540" y="500">最細的那條，才是我原本以為的主線</text>
</svg>
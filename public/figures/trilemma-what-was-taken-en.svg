<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Only two of the triangle's three corners are chosen, and the third corner, free capital flows, is crossed out.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.lb{font-size:19px;fill:var(--dim)}.sm{font-size:15px;fill:var(--dim)}.t{font-size:27px}.c{font-size:22px}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">You only get two of three</text>
<polygon points="480,130 230,400 730,400" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<circle cx="480" cy="130" r="14" fill="var(--accent)"/>
<circle cx="230" cy="400" r="14" fill="var(--accent)"/>
<circle cx="730" cy="400" r="14" fill="none" stroke="var(--warn)" stroke-width="4"/>
<line x1="716" y1="386" x2="744" y2="414" stroke="var(--warn)" stroke-width="4"/>
<line x1="744" y1="386" x2="716" y2="414" stroke="var(--warn)" stroke-width="4"/>
<text class="lb" x="412" y="110">Fixed rate</text>
<text class="lb" x="146" y="446">Monetary policy</text>
<text class="sm" x="146" y="470">Outsourced to the US</text>
<text class="lb" x="690" y="446">Free capital flows</text>
<text class="sm" x="690" y="470">Short-term flows controlled</text>
<text class="c" x="60" y="500">The corner given up is paid for by residents, for years</text>
</svg>
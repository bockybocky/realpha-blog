<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三根按身高比例的柱子，左邊被截斷、中間矮一截、右邊最高">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="40" y="58">同一個人的三條路線</text>
<line x1="100" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="320" width="130" height="140" fill="var(--grey)" opacity="0.4"/>
<line x1="130" y1="320" x2="300" y2="320" stroke="var(--warn)" stroke-width="5"/>
<text class="g" x="150" y="304">18 歲止步</text>
<rect x="410" y="177" width="130" height="283" fill="var(--grey)" opacity="0.6"/>
<text class="g" x="410" y="161">5 呎 3</text>
<text class="b" x="410" y="492">帶著副作用</text>
<rect x="670" y="131" width="130" height="329" fill="var(--accent)"/>
<text class="g" x="670" y="115">6 呎 1</text>
<circle cx="760" cy="92" r="14" fill="var(--accent)"/>
<text class="b" x="670" y="492">加上他眼中世上最好的人</text>
<text class="b" x="152" y="492">心臟手術那年</text>
<text class="c" x="100" y="534">他說差別來自父母一直跟系統吵</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左側多層堆疊成階梯狀上升，右側一根極高柱子與數根近乎貼地的矮柱並列">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">一樣的聰明，兩種賽制</text>

<rect x="60" y="92" width="400" height="300" fill="var(--card)" rx="10"/>
<line x1="96" y1="356" x2="430" y2="356" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="320" width="56" height="36" fill="var(--accent)" opacity="0.4"/>
<rect x="178" y="284" width="56" height="72" fill="var(--accent)" opacity="0.5"/>
<rect x="246" y="248" width="56" height="108" fill="var(--accent)" opacity="0.6"/>
<rect x="314" y="212" width="56" height="144" fill="var(--accent)" opacity="0.75"/>
<path d="M110 310 L370 196" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 6"/>
<text class="g" x="100" y="148" fill="var(--accent)">積分制</text>
<text class="b" x="100" y="176">長期參與，一格一格疊</text>
<text class="b" x="100" y="384">時間</text>

<rect x="500" y="92" width="400" height="300" fill="var(--card)" rx="10"/>
<line x1="536" y1="356" x2="870" y2="356" stroke="var(--line)" stroke-width="2"/>
<rect x="556" y="196" width="68" height="160" fill="var(--warn)" opacity="0.75"/>
<rect x="650" y="342" width="52" height="14" fill="var(--grey)" opacity="0.6"/>
<rect x="716" y="348" width="52" height="8" fill="var(--grey)" opacity="0.6"/>
<rect x="782" y="351" width="52" height="5" fill="var(--grey)" opacity="0.6"/>
<text class="g" x="540" y="148" fill="var(--warn)">排位賽</text>
<text class="b" x="540" y="176">最快的那家吃掉大部分</text>
<text class="b" x="650" y="384">同樣聰明的其他人</text>

<text class="c" x="60" y="470">賽制決定努力會累積，</text>
<text class="c" x="60" y="500">還是被第一名吸走。</text>
</svg>
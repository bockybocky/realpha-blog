  <line x1="590" y1="250" x2="910" y2="250" stroke="var(--grey)" stroke-dasharray="10 8"/>
  <rect x="732" y="219" width="36" height="22" rx="4" fill="var(--accent)"/>

  <line x1="40" y1="318" x2="920" y2="318" stroke="var(--line)"/>

  <text x="50" y="436" font-size="20" font-weight="700" fill="var(--ink)">30 台車</text>

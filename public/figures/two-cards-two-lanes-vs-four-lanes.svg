<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="一台車時雙線道與四線道差不多；很多車時雙線道塞滿，四線道分散跑得順">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="48" y="52" font-size="27" font-weight="700" fill="var(--ink)">車多，才看得出差別（示意）</text>
  <text x="370" y="104" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">1 張卡：雙線道</text>
  <text x="750" y="104" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">2 張卡：四線道</text>

  <text x="50" y="212" font-size="20" font-weight="700" fill="var(--ink)">1 台車</text>
  <text x="50" y="240" font-size="15" fill="var(--dim)">差不多</text>
  <rect x="210" y="170" width="320" height="80" fill="var(--card)" stroke="var(--line)"/>
  <line x1="210" y1="210" x2="530" y2="210" stroke="var(--grey)" stroke-dasharray="10 8"/>
  <rect x="352" y="179" width="36" height="22" rx="4" fill="var(--accent)"/>
  <rect x="590" y="130" width="320" height="160" fill="var(--card)" stroke="var(--line)"/>
  <line x1="590" y1="170" x2="910" y2="170" stroke="var(--grey)" stroke-dasharray="10 8"/>

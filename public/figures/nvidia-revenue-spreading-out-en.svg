<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A horizontal bar split in half, the right half fanning out along four lines to neocloud, sovereign AI, industrial, and enterprise customers">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); font-weight:700; }
    .gl { font-size:19px; fill:var(--ink); font-weight:700; }
    .bd { font-size:16px; fill:var(--dim); }
    .bs { font-size:15px; fill:var(--dim); }
    .cc { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ti" x="48" y="58">$96.2B: signal on the right</text>
<rect x="48" y="170" width="432" height="90" fill="var(--grey)"/>
<rect x="480" y="170" width="432" height="90" fill="var(--accent)"/>
<text class="bd" x="264" y="150" text-anchor="middle">Hyperscalers ≈ $48.7B</text>
<text class="bd" x="696" y="150" text-anchor="middle">Rest ≈ $40B+</text>
<line x1="696" y1="260" x2="540" y2="368" stroke="var(--accent)" stroke-width="2"/>
<line x1="696" y1="260" x2="668" y2="368" stroke="var(--accent)" stroke-width="2"/>
<line x1="696" y1="260" x2="796" y2="368" stroke="var(--accent)" stroke-width="2"/>
<line x1="696" y1="260" x2="888" y2="368" stroke="var(--accent)" stroke-width="2"/>
<circle cx="540" cy="372" r="5" fill="var(--accent)"/>
<circle cx="668" cy="372" r="5" fill="var(--accent)"/>
<circle cx="796" cy="372" r="5" fill="var(--accent)"/>
<circle cx="888" cy="372" r="5" fill="var(--accent)"/>
<text class="bd" x="540" y="404" text-anchor="middle">Neoclouds</text>
<text class="bd" x="668" y="404" text-anchor="middle">Sovereign AI</text>
<text class="bd" x="796" y="404" text-anchor="middle">Industrial</text>
<text class="bd" x="888" y="404" text-anchor="middle">Enterprise</text>
<text class="bs" x="668" y="430" text-anchor="middle">3x YoY</text>
<text class="cc" x="48" y="520">Demand spreads outward</text>
</svg>
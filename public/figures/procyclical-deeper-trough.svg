<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條谷形曲線，順循環那條的谷底明顯比逆循環那條更深">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.lb{font-size:19px;fill:var(--dim)}.sm{font-size:15px;fill:var(--dim)}.t{font-size:27px}.c{font-size:22px}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">衝擊來的時候，誰能踩油門</text>
<line x1="100" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="300" y1="110" x2="300" y2="440" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="sm" x="236" y="104">外部衝擊</text>
<path d="M120 180 C240 180 270 240 360 268 C470 300 560 230 880 200" fill="none" stroke="var(--grey)" stroke-width="6"/>
<path d="M120 180 C240 190 290 372 400 388 C540 408 650 270 880 230" fill="none" stroke="var(--accent)" stroke-width="6"/>
<text class="lb" x="600" y="186">能刺激：谷底較淺</text>
<text class="lb" x="596" y="330">必須壓需求：谷底更深</text>
<line x1="400" y1="276" x2="400" y2="384" stroke="var(--warn)" stroke-width="4"/>
<polygon points="400,272 393,286 407,286" fill="var(--warn)"/>
<polygon points="400,390 393,376 407,376" fill="var(--warn)"/>
<text class="sm" x="414" y="336">多痛的那一段</text>
<text class="c" x="60" y="492">沒有匯率幫忙，調整只能由需求端承擔</text>
</svg>
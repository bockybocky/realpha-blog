<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩組訂單與客戶承諾金額在短時間內從小額跳到大額的並排對照">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">買方把錢放到桌上</text>
<rect x="60" y="96" width="400" height="330" rx="10" fill="var(--card)"/>
<rect x="500" y="96" width="400" height="330" rx="10" fill="var(--card)"/>
<text class="t" x="88" y="134" font-size="20" fill="var(--ink)">光子學基板</text>
<text class="t" x="528" y="134" font-size="20" fill="var(--ink)">磷化銦基板</text>
<line x1="88" y1="390" x2="432" y2="390" stroke="var(--line)" stroke-width="2"/>
<line x1="528" y1="390" x2="872" y2="390" stroke="var(--line)" stroke-width="2"/>
<rect x="130" y="378" width="70" height="12" fill="var(--grey)"/>
<rect x="300" y="186" width="70" height="204" fill="var(--accent)"/>
<text class="t" x="118" y="366" font-size="16" fill="var(--dim)">2,500 萬美元</text>
<text class="t" x="292" y="172" font-size="16" fill="var(--accent)">12 億美元</text>
<text class="t" x="130" y="416" font-size="16" fill="var(--dim)">八個月前</text>
<text class="t" x="300" y="416" font-size="16" fill="var(--dim)">這一季</text>
<rect x="570" y="334" width="70" height="56" fill="var(--grey)"/>
<rect x="740" y="112" width="70" height="278" fill="var(--accent)"/>
<text class="t" x="566" y="322" font-size="16" fill="var(--dim)">1 億美元</text>
<text class="t" x="736" y="100" font-size="16" fill="var(--accent)">5 億美元</text>
<text class="t" x="570" y="416" font-size="16" fill="var(--dim)">在手訂單</text>
<text class="t" x="740" y="416" font-size="16" fill="var(--dim)">現在</text>
<text class="t" x="60" y="492" font-size="22" fill="var(--ink)">附現金訂金的那種承諾</text>
</svg>
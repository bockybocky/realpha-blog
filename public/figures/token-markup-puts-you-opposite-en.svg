<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Marking up tokens puts the application layer opposite the model lab, and the customer detours to compare prices.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>svg{--page:#ffffff;--card:#f6f8fc;--line:#dde3ee;--ink:#1a212b;--dim:#57616f;--grey:#b9c2d0;--accent:#1f6feb;--warn:#d97706;}@media (prefers-color-scheme: dark){svg{--page:#0d1117;--card:#161b22;--line:#272e39;--ink:#e6edf3;--dim:#8b949e;--grey:#4a5464;--accent:#58a6ff;--warn:#d29922;}}text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}</style>
<text x="60" y="58" font-size="27" font-weight="700">Mark up tokens and you're the opposition</text>
<line x1="480" y1="110" x2="480" y2="430" stroke="var(--line)" stroke-width="3" stroke-dasharray="10 8"/>
<rect x="110" y="190" width="250" height="130" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="235" y="240" font-size="20" font-weight="700" text-anchor="middle">Model lab</text>
<text x="235" y="290" font-size="34" font-weight="700" text-anchor="middle" fill="var(--accent)">$1</text>
<rect x="600" y="190" width="250" height="130" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="725" y="240" font-size="20" font-weight="700" text-anchor="middle">App layer</text>
<text x="725" y="290" font-size="34" font-weight="700" text-anchor="middle" fill="var(--warn)">$4</text>
<text x="725" y="166" font-size="16" text-anchor="middle" fill="var(--dim)">Same token · 4x markup</text>
<circle cx="725" cy="430" r="26" fill="none" stroke="var(--ink)" stroke-width="3"/>
<text x="725" y="486" font-size="19" font-weight="700" text-anchor="middle">Customer</text>
<path d="M700 418 C560 380 300 400 235 334" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="9 7"/>
<polygon points="235,326 228,344 244,344" fill="var(--accent)"/>
<text x="400" y="404" font-size="16" fill="var(--dim)">I'll go try it myself</text>
</svg>
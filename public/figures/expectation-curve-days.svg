<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="藥的體感陡升見頂，天然路線沿四個時點緩升，期待被寫成產品的一部分">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="40" y="52" font-size="27" fill="var(--ink)">體感來得慢，就把時間寫進產品</text>

  <line x1="100" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="3"/>
  <line x1="100" y1="110" x2="100" y2="420" stroke="var(--line)" stroke-width="3"/>
  <text x="44" y="126" font-size="16" fill="var(--dim)">體感</text>

  <path d="M100 420 C122 420 134 170 166 162 L880 150" fill="none" stroke="var(--warn)" stroke-width="5"/>
  <text x="196" y="140" font-size="19" fill="var(--warn)">吃一顆，半小時</text>

  <path d="M100 420 C260 406 420 350 560 286 C700 224 800 196 880 186" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <text x="640" y="256" font-size="19" fill="var(--accent)">天然路線</text>

  <g fill="var(--accent)">
    <circle cx="200" cy="397" r="7"/>
    <circle cx="320" cy="368" r="7"/>
    <circle cx="500" cy="310" r="7"/>
    <circle cx="760" cy="204" r="7"/>
  </g>
  <g font-size="16" fill="var(--dim)">
    <text x="176" y="452">第 3 天</text>
    <text x="296" y="452">第 7 天</text>
    <text x="464" y="452">第 14 天</text>
    <text x="724" y="452">第 28 天</text>
  </g>
  <g font-size="15" fill="var(--ink)">
    <text x="176" y="490">信</text>
    <text x="296" y="490">信</text>
    <text x="464" y="490">信</text>
    <text x="724" y="490">信</text>
  </g>
  <text x="540" y="490" font-size="16" fill="var(--dim)">每個點都回頭敲門，告訴你今天該有什麼感覺</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條路在接班點分岔，一條繼續往上爬規格階梯，一條轉成水平跑道通往標準化與殺價">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700">接班的類型，決定這條路往哪邊轉</text>

  <path d="M70 320 L330 320" fill="none" stroke="var(--ink)" stroke-width="10"/>
  <circle cx="330" cy="320" r="14" fill="var(--ink)"/>
  <text x="330" y="372" font-size="19" fill="var(--dim)" text-anchor="middle">接班</text>

  <path d="M330 320 L470 250 L610 180 L760 120" fill="none" stroke="var(--accent)" stroke-width="10"/>
  <polygon points="760,104 760,140 804,122" fill="var(--accent)"/>
  <text x="470" y="150" font-size="20" font-weight="700" fill="var(--accent)">會衝、會賣夢的人</text>
  <text x="470" y="182" font-size="16" fill="var(--dim)">規格競賽延長</text>

  <path d="M330 320 L470 400 L760 400" fill="none" stroke="var(--warn)" stroke-width="10"/>
  <polygon points="760,382 760,418 804,400" fill="var(--warn)"/>
  <text x="470" y="452" font-size="20" font-weight="700" fill="var(--warn)">供應鏈管理大師</text>
  <text x="470" y="484" font-size="16" fill="var(--dim)">標準化、價格被壓</text>
</svg>
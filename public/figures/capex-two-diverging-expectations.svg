<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條資本支出曲線從同一點分岔，一條走平，一條持續往上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">兩種分類，兩條不同的未來</text>
<line x1="120" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="110" x2="120" y2="400" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="432" font-size="15" fill="var(--dim)">現在</text>
<text x="820" y="432" font-size="15" fill="var(--dim)">三年後</text>
<text x="60" y="104" font-size="15" fill="var(--dim)">資本支出</text>

<path d="M 160 352 C 300 300 380 268 470 258 C 590 248 720 252 860 252" fill="none" stroke="var(--grey)" stroke-width="5"/>
<text x="600" y="296" font-size="19" fill="var(--dim)">成長期多花一點</text>
<text x="600" y="320" font-size="15" fill="var(--dim)">收斂、單位經濟改善、回到軟體毛利</text>

<path d="M 160 352 C 300 300 380 250 470 214 C 590 166 730 134 860 118" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text x="520" y="164" font-size="19" fill="var(--accent)">晶圓廠體質</text>
<text x="520" y="188" font-size="15" fill="var(--ink)">節點一直往前，停一代落後一代</text>

<circle cx="470" cy="236" r="7" fill="var(--warn)"/>
<text x="398" y="470" font-size="15" fill="var(--warn)">同一組數字，從這裡開始分家</text>
<text x="60" y="504" font-size="22" fill="var(--ink)">分類錯了，三年後對答案才知道</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The truck, seen from the side, breaks into three parts: body, chassis and the electronic joint between them; the bar below shows that the number already on the road is only a very thin sliver of the whole fleet.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" fill="var(--ink)">Nobody built that truck; it was pieced together</text>

<rect x="180" y="110" width="520" height="110" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<path d="M700 220 Q700 150 770 146" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="210" y="176" font-size="20" fill="var(--accent)">European side-load body</text>

<rect x="180" y="256" width="640" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="280" cy="326" r="26" fill="var(--grey)"/>
<circle cx="700" cy="326" r="26" fill="var(--grey)"/>
<circle cx="760" cy="326" r="26" fill="var(--grey)"/>
<text x="210" y="290" font-size="20" fill="var(--dim)">Mack chassis</text>

<rect x="430" y="222" width="130" height="32" rx="16" fill="var(--warn)" opacity="0.75"/>
<text x="495" y="245" font-size="16" fill="var(--page)" text-anchor="middle">Electronic handshake</text>
<line x1="495" y1="220" x2="495" y2="224" stroke="var(--warn)" stroke-width="3"/>
<line x1="495" y1="252" x2="495" y2="258" stroke="var(--warn)" stroke-width="3"/>

<text x="60" y="420" font-size="20" fill="var(--dim)">Whole fleet</text>
<rect x="60" y="440" width="840" height="34" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="440" width="7" height="34" fill="var(--accent)"/>
<line x1="64" y1="440" x2="120" y2="406" stroke="var(--accent)" stroke-width="2"/>
<text x="126" y="402" font-size="16" fill="var(--accent)">On the road</text>
<text x="900" y="498" font-size="15" fill="var(--dim)" text-anchor="end">2,300 trucks</text>

<text x="60" y="540" font-size="22" fill="var(--ink)">A prototype that runs is not a fleet that is replaced</text>
</g>
</svg>
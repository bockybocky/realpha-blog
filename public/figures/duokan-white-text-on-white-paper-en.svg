<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A contrast between a nearly blank left screen and a right screen carrying five clear lines of text.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="480" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">White text on white paper makes the desktop look empty</text>

  <rect x="120" y="120" width="300" height="270" rx="14" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <rect x="160" y="166" width="190" height="14" rx="7" fill="var(--grey)" opacity="0.22"/>
  <rect x="160" y="212" width="150" height="14" rx="7" fill="var(--grey)" opacity="0.22"/>
  <rect x="160" y="258" width="200" height="14" rx="7" fill="var(--grey)" opacity="0.22"/>
  <rect x="160" y="304" width="130" height="14" rx="7" fill="var(--grey)" opacity="0.22"/>
  <text class="t" x="270" y="432" text-anchor="middle" font-size="20" font-weight="700" fill="var(--warn)">Dark theme</text>
  <text class="t" x="270" y="462" text-anchor="middle" font-size="16" fill="var(--dim)">Text invisible</text>

  <rect x="540" y="120" width="300" height="270" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="580" y="180" font-size="16" fill="var(--ink)">HyRead</text>
  <text class="t" x="580" y="226" font-size="16" fill="var(--ink)">KOReader</text>
  <text class="t" x="580" y="272" font-size="16" fill="var(--ink)">Mihon</text>
  <text class="t" x="580" y="318" font-size="16" fill="var(--ink)">Settings</text>
  <text class="t" x="690" y="432" text-anchor="middle" font-size="20" font-weight="700" fill="var(--accent)">Light theme</text>
  <text class="t" x="690" y="462" text-anchor="middle" font-size="16" fill="var(--dim)">Text visible</text>
</svg>
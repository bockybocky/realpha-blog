<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three rising steps show tank weights of thirty, thirty-nine and forty-two tonnes, with the partnership scrapped, the design taken in-house and the factories bought marked beside each rise.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Every few tonnes cost a partner or a factory</text>

<line x1="120" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>

<rect x="150" y="330" width="200" height="120" fill="var(--card)" stroke="var(--line)"/>
<text x="196" y="310" font-size="20" fill="var(--dim)">30 t</text>
<text x="166" y="400" font-size="16" fill="var(--dim)">Partnered with West Germany</text>

<rect x="380" y="234" width="200" height="216" fill="var(--card)" stroke="var(--accent)"/>
<text x="426" y="214" font-size="20" fill="var(--accent)">39 t</text>
<text x="396" y="316" font-size="16" fill="var(--dim)">Partnership scrapped</text>
<text x="396" y="344" font-size="16" fill="var(--dim)">Turret outsourced to Britain</text>

<rect x="610" y="190" width="200" height="260" fill="var(--card)" stroke="var(--warn)"/>
<text x="656" y="170" font-size="20" fill="var(--warn)">42 t</text>
<text x="626" y="272" font-size="16" fill="var(--dim)">Two companies bought</text>
<text x="626" y="300" font-size="16" fill="var(--dim)">Short-term bank loans</text>

<line x1="350" y1="330" x2="380" y2="234" stroke="var(--accent)" stroke-width="3"/>
<line x1="580" y1="234" x2="610" y2="190" stroke="var(--warn)" stroke-width="3"/>

<text x="60" y="510" font-size="22" fill="var(--ink)">As the spec climbed, so did the balance sheet.</text>
</svg>
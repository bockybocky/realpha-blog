<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="四個並排容器各放一顆大小不同的圓，代表同一種資產在不同帳戶裡的最佳持有量不同">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style></defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">同一種資產，裝進不同容器</text>
<text class="b" x="60" y="94">圓的大小＝該容器裡的最佳持有量</text>
<rect x="110" y="150" width="170" height="200" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="195" cy="250" r="36" fill="var(--accent)" fill-opacity="0.85"/>
<text class="g" x="128" y="384" fill="var(--ink)">課稅帳戶</text>
<rect x="300" y="150" width="170" height="200" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="385" cy="250" r="64" fill="var(--accent)" fill-opacity="0.85"/>
<text class="g" x="360" y="384" fill="var(--ink)">Roth</text>
<rect x="490" y="150" width="170" height="200" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="575" cy="250" r="50" fill="var(--accent)" fill-opacity="0.85"/>
<text class="g" x="552" y="384" fill="var(--ink)">IRA</text>
<rect x="680" y="150" width="170" height="200" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="765" cy="250" r="44" fill="var(--accent)" fill-opacity="0.85"/>
<text class="g" x="744" y="384" fill="var(--ink)">信託</text>
<text class="b" x="110" y="430">稅後現金流不同</text>
<text class="b" x="300" y="430">提領時機不同</text>
<text class="b" x="490" y="430">課稅時點不同</text>
<text class="b" x="680" y="430">傳承規則不同</text>
<text class="c" x="60" y="490">問題不是買什麼，是放在哪一格</text>
</svg>
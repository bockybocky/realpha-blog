<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A single circle in the center stands for one core message, with channels branching out to the left and right, and the marks for what works and what hits a wall are exactly reversed on the two sides.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; }
</style>
<text class="t" x="60" y="62">One message, opposite channels</text>
<text class="g" x="480" y="124" text-anchor="middle">Core message consistent across three markets</text>
<circle cx="480" cy="250" r="80" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="480" y="242" text-anchor="middle">Speak up</text>
<text class="b" x="480" y="268" text-anchor="middle">Don't fear mistakes</text>
<line x1="400" y1="226" x2="300" y2="190" stroke="var(--line)" stroke-width="2"/>
<line x1="400" y1="256" x2="300" y2="256" stroke="var(--line)" stroke-width="2"/>
<line x1="400" y1="284" x2="300" y2="322" stroke="var(--line)" stroke-width="2"/>
<line x1="560" y1="226" x2="660" y2="190" stroke="var(--line)" stroke-width="2"/>
<line x1="560" y1="256" x2="660" y2="256" stroke="var(--line)" stroke-width="2"/>
<line x1="560" y1="284" x2="660" y2="322" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="276" y="150" text-anchor="end">Korea</text>
<rect x="268" y="180" width="18" height="18" fill="var(--accent)"/>
<text class="b" x="256" y="195" text-anchor="end">Influencers &amp; KOLs</text>
<rect x="268" y="246" width="18" height="18" fill="var(--accent)"/>
<text class="b" x="256" y="261" text-anchor="end">IG &amp; YouTube slots work</text>
<rect x="268" y="312" width="18" height="18" fill="var(--grey)"/>
<text class="b" x="256" y="327" text-anchor="end">X barely tried</text>
<text class="g" x="684" y="150">Japan</text>
<rect x="674" y="180" width="18" height="18" fill="var(--accent)"/>
<text class="b" x="704" y="195">Mass ads work day 1</text>
<rect x="674" y="246" width="18" height="18" fill="var(--accent)"/>
<text class="b" x="704" y="261">Media &amp; TV exposure</text>
<rect x="674" y="312" width="18" height="18" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="704" y="327">Infl. flat till rework</text>
<text class="b" x="480" y="424" text-anchor="middle">Taiwan and Korea align: good IG and YouTube slots work better</text>
<text class="c" x="60" y="524">Message fixed; channels rethought from scratch</text>
</svg>
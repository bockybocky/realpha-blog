<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A blank ledger on the left and a painting on the right, with the emphasis pointed at three foreign objects sitting in the painting's background.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">Look past the sitter, look at the background</text>

<rect x="72" y="140" width="230" height="280" rx="10" fill="var(--card)" stroke="var(--line)"/>
<g stroke="var(--grey)" stroke-width="3">
  <line x1="108" y1="190" x2="266" y2="190"/>
  <line x1="108" y1="230" x2="266" y2="230"/>
  <line x1="108" y1="270" x2="266" y2="270"/>
  <line x1="108" y1="310" x2="266" y2="310"/>
</g>
<text x="187" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">Ledger</text>

<rect x="404" y="120" width="480" height="300" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="6"/>
<circle cx="510" cy="248" r="26" fill="var(--grey)"/>
<path d="M470 380 Q510 288 550 380 Z" fill="var(--grey)"/>
<text x="510" y="410" font-size="15" fill="var(--dim)" text-anchor="middle">Foreground</text>

<path d="M660 170 q18 26 0 52 q-18 26 0 52 l40 0 q-18 -26 0 -52 q18 -26 0 -52 Z" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="2"/>
<text x="680" y="308" font-size="15" fill="var(--accent)" text-anchor="middle">Silk robe</text>

<path d="M740 360 l120 0 l-24 44 l-120 0 Z" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<line x1="760" y1="360" x2="742" y2="404" stroke="var(--accent)" stroke-width="2"/>
<line x1="800" y1="360" x2="782" y2="404" stroke="var(--accent)" stroke-width="2"/>
<line x1="840" y1="360" x2="822" y2="404" stroke="var(--accent)" stroke-width="2"/>
<text x="790" y="344" font-size="15" fill="var(--accent)" text-anchor="middle">Carpet</text>

<ellipse cx="810" cy="200" rx="26" ry="17" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="2"/>
<circle cx="832" cy="190" r="9" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="2"/>
<path d="M841 188 l14 4 l-14 5 Z" fill="var(--accent)"/>
<text x="806" y="242" font-size="15" fill="var(--accent)" text-anchor="middle">Parrot</text>

<text x="480" y="504" font-size="22" fill="var(--ink)" text-anchor="middle">Proof of wealth, scattered in the background</text>
</svg>
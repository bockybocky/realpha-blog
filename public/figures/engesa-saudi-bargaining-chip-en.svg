<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars compare the bids: Engesa's 2.2 billion is a dashed empty outline for a deal never signed, General Dynamics' 3.1 billion is solid and signed, and an arrow points from the first to the second.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Two bids, only one signed</text>

<text x="60" y="152" font-size="19" fill="var(--dim)">August 1989 · Brazilian press</text>
<rect x="60" y="172" width="440" height="68" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 6"/>
<text x="84" y="214" font-size="19" fill="var(--dim)">Engesa　US$2.2bn　in talks</text>

<text x="60" y="326" font-size="19" fill="var(--warn)">September 1989 · US press</text>
<rect x="60" y="346" width="620" height="68" fill="var(--warn)"/>
<text x="84" y="388" font-size="19" fill="var(--page)">General Dynamics　US$3.1bn　315 M1A2s</text>

<path d="M510 206 C560 206 560 346 700 346" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="716" y="300" font-size="19" fill="var(--accent)">The chip used</text>
<text x="716" y="328" font-size="19" fill="var(--accent)">to cut the price</text>

<text x="60" y="478" font-size="22" fill="var(--ink)">A bid used in a negotiation is not a bid that was accepted.</text>
</svg>
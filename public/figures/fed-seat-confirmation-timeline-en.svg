<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the timeline, the dashed vacancy stretch of the governor seat overlaps the six-year bar of a senate term, and the overlap is labelled as four to six years.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" fill="var(--ink)" font-weight="700">The jam: confirmations</text>
<rect x="90" y="186" width="266" height="48" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="223" y="216" font-size="16" fill="var(--ink)" text-anchor="middle">Powell's term</text>
<rect x="356" y="186" width="514" height="48" rx="6" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 8"/>
<text class="t" x="613" y="216" font-size="16" fill="var(--dim)" text-anchor="middle">Vacant</text>
<text class="t" x="90" y="168" font-size="19" fill="var(--dim)">Fed seat</text>
<line x1="90" y1="276" x2="890" y2="276" stroke="var(--line)" stroke-width="3"/>
<line x1="90" y1="266" x2="90" y2="286" stroke="var(--dim)" stroke-width="2"/>
<line x1="356" y1="266" x2="356" y2="286" stroke="var(--dim)" stroke-width="2"/>
<line x1="622" y1="266" x2="622" y2="286" stroke="var(--dim)" stroke-width="2"/>
<line x1="888" y1="266" x2="888" y2="286" stroke="var(--dim)" stroke-width="2"/>
<text class="t" x="90" y="308" font-size="15" fill="var(--dim)" text-anchor="middle">2026</text>
<text class="t" x="356" y="308" font-size="15" fill="var(--dim)" text-anchor="middle">2028</text>
<text class="t" x="622" y="308" font-size="15" fill="var(--dim)" text-anchor="middle">2030</text>
<text class="t" x="888" y="308" font-size="15" fill="var(--dim)" text-anchor="middle">2032</text>
<text class="t" x="90" y="356" font-size="19" fill="var(--dim)">Senate</text>
<rect x="90" y="372" width="798" height="48" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="489" y="402" font-size="16" fill="var(--ink)" text-anchor="middle">Elected now: 6-year term</text>
<line x1="90" y1="444" x2="700" y2="444" stroke="var(--warn)" stroke-width="5"/>
<text class="t" x="90" y="474" font-size="16" fill="var(--warn)">Tilted 4 to 6 years</text>
<text class="t" x="90" y="524" font-size="22" fill="var(--ink)" font-weight="700">Not a turn: sand in gears</text>
</svg>
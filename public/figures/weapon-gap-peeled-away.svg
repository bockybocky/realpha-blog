<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="四項武器由上往下，前兩項被刪除線劃掉轉灰，只剩鋼劍與戰馬兩項保留為實心亮色">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">扣到最後剩下兩樣</text>
<text class="t" x="60" y="100" font-size="16" fill="var(--dim)">代差清單</text>

<rect x="60" y="130" width="560" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="88" y="169" font-size="20" fill="var(--grey)">火槍</text>
<line x1="80" y1="161" x2="600" y2="161" stroke="var(--grey)" stroke-width="2"/>
<text class="t" x="640" y="168" font-size="16" fill="var(--dim)">裝填太慢</text>

<rect x="60" y="208" width="560" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="88" y="247" font-size="20" fill="var(--grey)">金屬盔甲</text>
<line x1="80" y1="239" x2="600" y2="239" stroke="var(--grey)" stroke-width="2"/>
<text class="t" x="640" y="246" font-size="16" fill="var(--dim)">自己換成棉甲</text>

<rect x="60" y="300" width="560" height="68" rx="8" fill="var(--accent)" opacity="0.14"/>
<rect x="60" y="300" width="560" height="68" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="88" y="342" font-size="20" font-weight="700" fill="var(--ink)">鋼劍</text>
<text class="t" x="640" y="341" font-size="16" fill="var(--dim)">直刺</text>

<rect x="60" y="384" width="560" height="68" rx="8" fill="var(--accent)" opacity="0.14"/>
<rect x="60" y="384" width="560" height="68" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="88" y="426" font-size="20" font-weight="700" fill="var(--ink)">馬</text>
<text class="t" x="640" y="425" font-size="16" fill="var(--dim)">美洲沒有</text>

<text class="t" x="60" y="500" font-size="22" fill="var(--ink)">兩樣，對上兩個帝國</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三級遞增的台階，愈高的一階對應愈快的目標">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="40" y="54" font-size="27" font-weight="700" fill="var(--ink)">功率階梯：一階一種目標</text>

  <line x1="60" y1="432" x2="900" y2="432" stroke="var(--line)" stroke-width="2"/>

  <rect x="70" y="356" width="250" height="76" rx="6" fill="var(--accent)" opacity="0.22"/>
  <rect x="70" y="356" width="250" height="76" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text x="86" y="336" font-size="20" font-weight="700" fill="var(--ink)">50 千瓦</text>
  <text x="86" y="402" font-size="16" fill="var(--ink)">無人機</text>
  <text x="70" y="466" font-size="16" fill="var(--dim)">裝甲車上・現役</text>

  <rect x="336" y="276" width="250" height="156" rx="6" fill="var(--accent)" opacity="0.34"/>
  <rect x="336" y="276" width="250" height="156" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text x="352" y="256" font-size="20" font-weight="700" fill="var(--ink)">150 千瓦</text>
  <text x="352" y="322" font-size="16" fill="var(--ink)">火箭彈</text>
  <text x="352" y="348" font-size="16" fill="var(--ink)">砲彈</text>
  <text x="336" y="466" font-size="16" fill="var(--dim)">Iron Beam・部署中</text>

  <rect x="602" y="126" width="290" height="306" rx="6" fill="var(--accent)" opacity="0.5"/>
  <rect x="602" y="126" width="290" height="306" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text x="618" y="106" font-size="20" font-weight="700" fill="var(--ink)">一兆瓦</text>
  <text x="618" y="176" font-size="16" fill="var(--ink)">高超音速目標</text>
  <text x="618" y="202" font-size="16" fill="var(--ink)">時速四五千英里</text>
  <text x="602" y="466" font-size="16" fill="var(--dim)">2030 年目標</text>

  <text x="40" y="512" font-size="22" font-weight="700" fill="var(--ink)">從打無人機到打高超音速，中間差二十倍</text>
</svg>
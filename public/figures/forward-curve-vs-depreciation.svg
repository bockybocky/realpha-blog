<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條折舊斜線從同一點分開：市場遠期價格掉得快、財報折舊掉得慢，中間張開的缺口被標示出來">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">一張卡掉價多快，兩邊的答案不一樣</text>
  <rect x="60" y="92" width="840" height="310" rx="14" fill="var(--card)"/>
  <line x1="130" y1="362" x2="860" y2="362" stroke="var(--line)" stroke-width="2"/>

  <circle cx="150" cy="148" r="9" fill="var(--ink)"/>
  <text class="b" x="130" y="130">今天的價</text>

  <path d="M150 148 L820 206" fill="none" stroke="var(--accent)" stroke-width="6"/>
  <text class="g" x="630" y="198" fill="var(--accent)">財報折舊</text>
  <text class="b" x="630" y="222">年限拉得長</text>

  <path d="M150 148 L820 322" fill="none" stroke="var(--warn)" stroke-width="6"/>
  <text class="g" x="630" y="346" fill="var(--warn)">遠期曲線</text>
  <text class="b" x="630" y="370" fill="var(--warn)">市場集體假設</text>

  <path d="M520 178 L520 240" stroke="var(--ink)" stroke-width="3" stroke-dasharray="6 6"/>
  <text class="g" x="440" y="268">缺口</text>

  <text class="c" x="60" y="462">對不起來的地方，才是值得深追的地方</text>
  <text class="b" x="60" y="494">比爭論是不是泡沫有用</text>
</svg>
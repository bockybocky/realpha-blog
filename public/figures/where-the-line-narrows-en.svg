<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Six stacked layers narrow in the middle into an hourglass, and the thinnest layer is labelled the first to break.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">Which layer breaks</text>
<rect x="220" y="100" width="520" height="52" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="133" text-anchor="middle" font-size="19" fill="var(--ink)">Budget and orders</text>
<rect x="270" y="166" width="420" height="52" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="199" text-anchor="middle" font-size="19" fill="var(--ink)">Prime assembly</text>
<rect x="350" y="232" width="260" height="52" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="265" text-anchor="middle" font-size="18" fill="var(--ink)">Guidance section</text>
<rect x="410" y="298" width="140" height="52" rx="6" fill="var(--accent)" opacity="0.35" stroke="var(--accent)" stroke-width="2"/>
<text x="480" y="331" text-anchor="middle" font-size="18" fill="var(--ink)">Seekers</text>
<rect x="330" y="364" width="300" height="52" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="397" text-anchor="middle" font-size="18" fill="var(--ink)">Solid propellant</text>
<rect x="240" y="430" width="480" height="52" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="463" text-anchor="middle" font-size="19" fill="var(--ink)">Delivery</text>
<line x1="700" y1="324" x2="565" y2="324" stroke="var(--warn)" stroke-width="2.5"/>
<polygon points="555,324 567,317 567,331" fill="var(--warn)"/>
<text x="712" y="318" font-size="16" fill="var(--warn)">First to break</text>
<text x="712" y="342" font-size="15" fill="var(--dim)">Pricing power sits here</text>
<text x="480" y="556" text-anchor="middle" font-size="22" fill="var(--ink)">The narrowest layer is not always the listed name</text>
</svg>
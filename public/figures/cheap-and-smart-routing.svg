<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一個入口分成兩條路，上面通往一個很小的方塊，下面通往一個大很多的方塊">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; }
</style>
<text class="t" x="60" y="62">貴的智慧只用在貴的地方</text>
<rect x="70" y="248" width="180" height="84" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="160" y="284" text-anchor="middle">使用者的</text>
<text class="b" x="160" y="308" text-anchor="middle">每一次互動</text>
<path d="M250 290 L350 290 L350 158 L440 158" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M250 290 L350 290 L350 376 L440 376" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M440 150 L456 158 L440 166 Z" fill="var(--grey)"/>
<path d="M440 368 L456 376 L440 384 Z" fill="var(--accent)"/>
<text class="g" x="460" y="114">日常對話</text>
<rect x="460" y="130" width="150" height="56" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="535" y="165" text-anchor="middle">便宜的現成模型</text>
<text class="g" x="460" y="300">長期課程規劃・解釋並糾正錯誤</text>
<rect x="460" y="316" width="330" height="140" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="625" y="394" text-anchor="middle">更聰明的模型</text>
<text class="c" x="60" y="518">先做到讓人感受到躍升，再回頭降規格</text>
</svg>
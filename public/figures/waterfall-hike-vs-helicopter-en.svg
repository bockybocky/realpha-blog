<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two panels: on the left, a hiking route circles and gets lost before reaching the waterfall, with contour lines filling the background; on the right, a straight flight reaches the waterfall for a photo while the background stays blank.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="48" y="52" class="t">Two ways there</text>
<rect x="30" y="76" width="440" height="444" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="490" y="76" width="440" height="444" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="250" y="114" class="g" text-anchor="middle">Hike</text>
<text x="710" y="114" class="g" text-anchor="middle">Heli</text>
<path d="M50,200 C150,170 250,230 450,190" fill="none" stroke="var(--grey)" stroke-width="1.2"/>
<path d="M50,280 C140,250 260,320 450,270" fill="none" stroke="var(--grey)" stroke-width="1.2"/>
<path d="M50,360 C160,330 250,400 450,350" fill="none" stroke="var(--grey)" stroke-width="1.2"/>
<path d="M50,440 C150,410 270,470 450,430" fill="none" stroke="var(--grey)" stroke-width="1.2"/>
<path d="M80,470 C140,400 60,350 130,320 C200,290 230,380 285,350 C340,320 260,255 205,265 C150,275 170,200 245,190 C310,180 330,230 370,185 L392,172" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
<circle cx="80" cy="470" r="7" fill="var(--ink)"/>
<text x="80" y="498" class="d" text-anchor="middle">Go</text>
<text x="150" y="420" class="d">Lost</text>
<ellipse cx="290" cy="352" rx="7" ry="4" fill="var(--accent)"/>
<text x="300" y="388" class="d">Herb</text>
<text x="60" y="215" class="d">Looped</text>
<rect x="395" y="140" width="40" height="12" fill="var(--dim)"/>
<line x1="402" y1="152" x2="402" y2="204" stroke="var(--accent)" stroke-width="2"/>
<line x1="412" y1="152" x2="412" y2="204" stroke="var(--accent)" stroke-width="2"/>
<line x1="422" y1="152" x2="422" y2="204" stroke="var(--accent)" stroke-width="2"/>
<ellipse cx="415" cy="210" rx="26" ry="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="250" y="500" class="b" text-anchor="middle">Full map</text>
<circle cx="540" cy="470" r="7" fill="var(--ink)"/>
<text x="540" y="498" class="d" text-anchor="middle">Go</text>
<line x1="540" y1="470" x2="858" y2="206" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 6"/>
<text x="715" y="360" class="d">Direct</text>
<rect x="855" y="140" width="40" height="12" fill="var(--dim)"/>
<line x1="862" y1="152" x2="862" y2="204" stroke="var(--accent)" stroke-width="2"/>
<line x1="872" y1="152" x2="872" y2="204" stroke="var(--accent)" stroke-width="2"/>
<line x1="882" y1="152" x2="882" y2="204" stroke="var(--accent)" stroke-width="2"/>
<ellipse cx="875" cy="210" rx="26" ry="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<rect x="840" y="240" width="28" height="20" rx="3" fill="none" stroke="var(--ink)" stroke-width="2"/>
<circle cx="854" cy="250" r="6" fill="none" stroke="var(--ink)" stroke-width="2"/>
<text x="854" y="284" class="d" text-anchor="middle">Pic</text>
<text x="710" y="500" class="b" text-anchor="middle">One photo</text>
<text x="480" y="560" class="c" text-anchor="middle">1 goal, 2 maps</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三根等長條狀圖，顯示回收硬體吃掉酬載，燃燒效率把空間挖回來">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .b { font-size:15px; fill:var(--dim); }
    .p { font-size:16px; fill:var(--page); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56">總量是固定的，回收要從酬載裡扣</text>
  <text class="b" x="60" y="92">每一根一樣長，代表同一枚火箭扛得動的總重</text>

  <text class="g" x="60" y="150">丟掉火箭</text>
  <rect x="240" y="126" width="640" height="46" rx="6" fill="var(--accent)"/>
  <text class="p" x="560" y="157" text-anchor="middle">酬載</text>

  <text class="g" x="60" y="248">要回收</text>
  <rect x="240" y="224" width="170" height="46" rx="6" fill="var(--grey)"/>
  <rect x="414" y="224" width="120" height="46" rx="6" fill="var(--grey)"/>
  <rect x="538" y="224" width="130" height="46" rx="6" fill="var(--grey)"/>
  <rect x="672" y="224" width="208" height="46" rx="6" fill="var(--accent)"/>
  <text class="p" x="776" y="255" text-anchor="middle">酬載</text>
  <text class="b" x="325" y="298" text-anchor="middle">回程推進劑</text>
  <text class="b" x="474" y="298" text-anchor="middle">著陸腳架</text>
  <text class="b" x="603" y="298" text-anchor="middle">熱盾</text>

  <text class="g" x="60" y="376">燃燒效率拉到極限</text>
  <rect x="240" y="352" width="112" height="46" rx="6" fill="var(--grey)"/>
  <rect x="356" y="352" width="88" height="46" rx="6" fill="var(--grey)"/>
  <rect x="448" y="352" width="96" height="46" rx="6" fill="var(--grey)"/>
  <rect x="548" y="352" width="332" height="46" rx="6" fill="var(--accent)"/>
  <text class="p" x="714" y="383" text-anchor="middle">酬載</text>
  <text class="b" x="396" y="426" text-anchor="middle">同樣三樣東西，佔得少</text>

  <text class="c" x="60" y="498">全流量分級燃燒不是炫技，是把這段空間挖出來的手段</text>
</svg>
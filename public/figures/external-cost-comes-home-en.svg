<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="The price bar is short and the full-cost bar is tall, and the extra segment curves back into the company's books.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:700;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .s{font-size:15px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
    .w{font-size:16px;font-weight:700;fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
<text class="t" x="56" y="56">Price is a segment, cost is the whole bar</text>
<path d="M56 452 L904 452" stroke="var(--line)" stroke-width="2"/>
<rect x="120" y="332" width="140" height="120" fill="var(--accent)"/>
<text class="g" x="132" y="486">The price you pay</text>
<rect x="380" y="332" width="140" height="120" fill="var(--accent)"/>
<rect x="380" y="140" width="140" height="192" fill="var(--warn)" opacity="0.45"/>
<path d="M380 332 L520 332" stroke="var(--page)" stroke-width="3"/>
<text class="g" x="392" y="486">Full cost</text>
<text class="w" x="548" y="176">The unpriced segment</text>
<text class="s" x="548" y="204">Mine land, water, disposal</text>
<text class="b" x="548" y="248">Who fronts it</text>
<text class="s" x="548" y="276">Society, states, other sectors, the next generation</text>
<path d="M520 200 C 700 200 820 260 820 356" stroke="var(--warn)" stroke-width="3" fill="none" stroke-dasharray="7 6"/>
<path d="M810 346 L820 372 L830 346 Z" fill="var(--warn)"/>
<rect x="712" y="376" width="216" height="76" rx="10" fill="var(--card)" stroke="var(--warn)"/>
<text class="g" x="736" y="410">Company books</text>
<text class="s" x="736" y="436">Cost, limits, orders, goodwill</text>
<text class="c" x="56" y="560">What the price leaves out does not vanish</text>
<text class="b" x="56" y="592">Your turn to pay just has not come yet</text>
</svg>
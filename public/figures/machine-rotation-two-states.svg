<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩格對比圖：平時四根柱子上下互相抵銷、合計接近零；衝擊來時同樣位置的柱子全部縮成貼著零線的細條">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="50" y="58" font-size="27" font-weight="700" fill="var(--ink)">機器的兩種狀態</text>

  <rect x="50" y="95" width="410" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="95" width="410" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>

  <text x="72" y="132" font-size="20" font-weight="600" fill="var(--ink)">承平時期</text>
  <text x="522" y="132" font-size="20" font-weight="600" fill="var(--ink)">真衝擊來時</text>
  <text x="438" y="132" font-size="16" text-anchor="end" fill="var(--dim)">合計 ≈ 0</text>
  <text x="888" y="132" font-size="20" font-weight="700" text-anchor="end" fill="var(--warn)">關掉</text>

  <line x1="72" y1="300" x2="438" y2="300" stroke="var(--line)" stroke-width="2"/>
  <line x1="522" y1="300" x2="888" y2="300" stroke="var(--line)" stroke-width="2"/>

  <rect x="110" y="300" width="46" height="80" fill="var(--grey)"/>
  <rect x="190" y="242" width="46" height="58" fill="var(--accent)"/>
  <rect x="270" y="228" width="46" height="72" fill="var(--accent)"/>
  <rect x="350" y="300" width="46" height="50" fill="var(--grey)"/>

  <text x="133" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">半導體</text>
  <text x="213" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">蘋果</text>
  <text x="293" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">醫療</text>
  <text x="373" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">其他籃子</text>

  <rect x="560" y="294" width="46" height="10" fill="var(--grey)"/>
  <rect x="640" y="294" width="46" height="10" fill="var(--grey)"/>
  <rect x="720" y="294" width="46" height="10" fill="var(--grey)"/>
  <rect x="800" y="294" width="46" height="10" fill="var(--grey)"/>

  <text x="583" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">半導體</text>
  <text x="663" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">蘋果</text>
  <text x="743" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">醫療</text>
  <text x="823" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">其他籃子</text>

  <text x="705" y="245" font-size="16" text-anchor="middle" fill="var(--dim)">價差變寬・成交變薄</text>

  <text x="480" y="490" font-size="22" font-weight="600" text-anchor="middle" fill="var(--ink)">機械感是天氣，不是脫鉤</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two side-by-side panels: the air-cooled path is longer and loses water to evaporation at its end, while the liquid-cooled path is shorter and has no droplets at its end.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">Which path is the water evaporated on</text>

<rect x="50" y="90" width="420" height="390" fill="var(--card)" stroke="var(--line)" rx="10"/>
<text class="g" x="80" y="130">Air cooling</text>
<circle cx="110" cy="190" r="12" fill="var(--grey)"/><text class="n" x="140" y="196">Chip</text>
<circle cx="110" cy="250" r="12" fill="var(--grey)"/><text class="n" x="140" y="256">Cold air</text>
<circle cx="110" cy="310" r="12" fill="var(--grey)"/><text class="n" x="140" y="316">Cold water</text>
<circle cx="110" cy="370" r="12" fill="var(--grey)"/><text class="n" x="140" y="376">Chiller</text>
<circle cx="110" cy="430" r="12" fill="var(--warn)"/><text class="n" x="140" y="436">Cooling tower</text>
<line x1="110" y1="202" x2="110" y2="418" stroke="var(--grey)" stroke-width="4"/>
<path d="M300 430 q10 -22 0 -38 q-10 16 0 38 Z" fill="var(--warn)"/>
<path d="M340 410 q9 -20 0 -34 q-9 14 0 34 Z" fill="var(--warn)"/>
<path d="M378 384 q8 -18 0 -30 q-8 12 0 30 Z" fill="var(--warn)"/>
<text class="n" x="300" y="330">Lost to evaporation</text>

<rect x="490" y="90" width="420" height="390" fill="var(--card)" stroke="var(--line)" rx="10"/>
<text class="g" x="520" y="130">Cold plate liquid</text>
<circle cx="550" cy="190" r="12" fill="var(--accent)"/><text class="n" x="580" y="196">Chip</text>
<circle cx="550" cy="250" r="12" fill="var(--accent)"/><text class="n" x="580" y="256">45°C water</text>
<circle cx="550" cy="310" r="12" fill="var(--accent)"/><text class="n" x="580" y="316">Outdoor heat reject</text>
<line x1="550" y1="202" x2="550" y2="298" stroke="var(--accent)" stroke-width="4"/>
<text class="n" x="550" y="400">No droplets here</text>

<text class="c" x="60" y="528">Liquid cooling does not start using water, it takes water off the evaporation path</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="四組對照，前三組完全一樣，只有化學品那一桶兩邊液位不同">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">三件都一樣，只有那一桶不一樣</text>

<text class="t" x="285" y="118" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">原廠</text>
<text class="t" x="675" y="118" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">新廠</text>

<text class="t" x="130" y="168" font-size="16" fill="var(--ink)" text-anchor="end">配方</text>
<rect x="175" y="150" width="220" height="24" rx="4" fill="var(--grey)"/>
<rect x="565" y="150" width="220" height="24" rx="4" fill="var(--grey)"/>

<text class="t" x="130" y="228" font-size="16" fill="var(--ink)" text-anchor="end">佈局</text>
<rect x="175" y="210" width="220" height="24" rx="4" fill="var(--grey)"/>
<rect x="565" y="210" width="220" height="24" rx="4" fill="var(--grey)"/>

<text class="t" x="130" y="288" font-size="16" fill="var(--ink)" text-anchor="end">步驟</text>
<rect x="175" y="270" width="220" height="24" rx="4" fill="var(--grey)"/>
<rect x="565" y="270" width="220" height="24" rx="4" fill="var(--grey)"/>

<text class="t" x="130" y="400" font-size="16" fill="var(--ink)" text-anchor="end">化學品</text>
<rect x="235" y="330" width="100" height="150" rx="12" fill="none" stroke="var(--accent)" stroke-width="3"/>
<rect x="241" y="366" width="88" height="108" rx="8" fill="var(--accent)"/>
<line x1="208" y1="366" x2="238" y2="366" stroke="var(--accent)" stroke-width="2.5"/>

<g transform="rotate(-6 675 405)">
<rect x="625" y="330" width="100" height="150" rx="12" fill="none" stroke="var(--warn)" stroke-width="3"/>
<rect x="631" y="424" width="88" height="50" rx="8" fill="var(--warn)"/>
<line x1="598" y1="424" x2="628" y2="424" stroke="var(--warn)" stroke-width="2.5"/>
</g>

<line x1="800" y1="405" x2="880" y2="405" stroke="var(--warn)" stroke-width="3"/>
<path d="M 888 405 L 872 396 L 872 414 Z" fill="var(--warn)"/>

<text class="t" x="48" y="546" font-size="22" font-weight="700" fill="var(--ink)">製程要重新配一次</text>
</svg>
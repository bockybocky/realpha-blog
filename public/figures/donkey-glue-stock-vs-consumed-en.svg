<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Of ten bar units, seven represent real consumption and three represent stockpiling for resale.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="80" y="62">Same goods, two demands</text>
<rect x="80" y="110" width="800" height="230" fill="var(--card)"/>
<rect x="120" y="190" width="518" height="90" fill="var(--grey)"/>
<rect x="638" y="190" width="222" height="90" fill="var(--accent)"/>
<line x1="194" y1="190" x2="194" y2="280" stroke="var(--page)" stroke-width="3"/>
<line x1="268" y1="190" x2="268" y2="280" stroke="var(--page)" stroke-width="3"/>
<line x1="342" y1="190" x2="342" y2="280" stroke="var(--page)" stroke-width="3"/>
<line x1="416" y1="190" x2="416" y2="280" stroke="var(--page)" stroke-width="3"/>
<line x1="490" y1="190" x2="490" y2="280" stroke="var(--page)" stroke-width="3"/>
<line x1="564" y1="190" x2="564" y2="280" stroke="var(--page)" stroke-width="3"/>
<line x1="712" y1="190" x2="712" y2="280" stroke="var(--page)" stroke-width="3"/>
<line x1="786" y1="190" x2="786" y2="280" stroke="var(--page)" stroke-width="3"/>
<text class="g" x="120" y="172">Consumed 7</text>
<text class="g" x="638" y="172">Stockpiled for resale 3</text>
<text class="s" x="120" y="312">Used up, consumed, bought again next year</text>
<text class="s" x="638" y="312">Like an investment, awaiting a price rise</text>
<text class="c" x="80" y="400">Investment-like products show similar proportions</text>
<text class="s" x="80" y="432">Prices rise yearly, so distributors and consumers stock up—figures illustrative</text>
</svg>
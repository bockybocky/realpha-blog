<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條長度遞增的橫條，最長一條幾乎到底，顯示槓桿越高跌幅越徹底">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">槓桿越高，被抽得越乾</text>

  <line x1="300" y1="130" x2="300" y2="430" stroke="var(--line)" stroke-width="3"/>
  <text x="300" y="112" font-size="15" fill="var(--dim)" text-anchor="middle">高點</text>

  <rect x="300" y="160" width="520" height="46" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="300" y="250" width="520" height="46" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="300" y="340" width="520" height="46" rx="6" fill="var(--card)" stroke="var(--line)"/>

  <rect x="300" y="160" width="182" height="46" rx="6" fill="var(--accent)"/>
  <rect x="300" y="250" width="478" height="46" rx="6" fill="var(--accent)"/>
  <rect x="300" y="340" width="520" height="46" rx="6" fill="var(--accent)"/>

  <text x="284" y="190" font-size="17" fill="var(--ink)" text-anchor="end">半導體</text>
  <text x="284" y="280" font-size="17" fill="var(--ink)" text-anchor="end">三倍做多海力士</text>
  <text x="284" y="370" font-size="17" fill="var(--ink)" text-anchor="end">三倍做空輝達</text>

  <text x="498" y="190" font-size="16" font-weight="700" fill="var(--dim)">三到四成</text>
  <text x="794" y="280" font-size="16" font-weight="700" fill="var(--dim)">九成上下</text>
  <text x="828" y="370" font-size="16" font-weight="700" fill="var(--dim)">歸零</text>

  <text x="60" y="476" font-size="22" font-weight="700" fill="var(--ink)">亢奮的那一層，先消失</text>
</svg>
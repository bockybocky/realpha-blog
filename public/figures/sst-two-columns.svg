<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="左欄寫滿橫槓、右欄幾乎全空的兩欄對比">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink) }
    .grp { font-size:20px; font-weight:600; fill:var(--ink) }
    .sml { font-size:15px; fill:var(--dim) }
    .cnc { font-size:22px; font-weight:600; fill:var(--accent) }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="64">左欄三十秒寫滿，右欄卡住</text>

  <text class="grp" x="270" y="132" text-anchor="middle">它爛在哪</text>
  <rect x="90" y="150" width="360" height="300" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="125" y="195" width="290" height="18" rx="9" fill="var(--grey)"/>
  <rect x="125" y="240" width="265" height="18" rx="9" fill="var(--grey)"/>
  <rect x="125" y="285" width="300" height="18" rx="9" fill="var(--grey)"/>
  <rect x="125" y="330" width="240" height="18" rx="9" fill="var(--grey)"/>
  <rect x="125" y="375" width="275" height="18" rx="9" fill="var(--grey)"/>

  <text class="grp" x="690" y="132" text-anchor="middle">它替我做到什麼</text>
  <rect x="510" y="150" width="360" height="300" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="545" y="195" width="120" height="18" rx="9" fill="var(--grey)" fill-opacity="0.5"/>
  <line x1="545" y1="240" x2="563" y2="240" stroke="var(--dim)" stroke-width="3" stroke-dasharray="6 6"/>
  <text class="sml" x="575" y="246">想很久</text>

  <text class="cnc" x="480" y="505" text-anchor="middle">右欄寫不出來，就是你一直沒換的原因</text>
</svg>
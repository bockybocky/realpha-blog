<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一根八百多億美元的虧損長條被切成兩段，七百多億的重新評價佔掉絕大部分且標示沒出帳戶，剩下一小段才是現金流出">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t h" x="60" y="66">帳面虧損 800 多億，拆開看</text>
  <text class="t s" x="60" y="96">單位美元</text>

  <rect x="100" y="180" width="760" height="76" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="100" y="180" width="665" height="76" rx="5" fill="var(--grey)"/>
  <rect x="765" y="180" width="95" height="76" fill="var(--warn)"/>

  <text class="t g" x="432" y="226" text-anchor="middle" fill="var(--page)">重新評價 700 多億</text>
  <text class="t s" x="432" y="296" text-anchor="middle">估值漲 → 換算力的借條變貴</text>
  <text class="t s" x="432" y="322" text-anchor="middle">沒有一塊錢離開帳戶</text>

  <text class="t g" x="812" y="160" text-anchor="middle" fill="var(--warn)">其餘</text>
  <text class="t s" x="880" y="296" text-anchor="end">現金真的出門的部分</text>

  <text class="t c" x="60" y="420">看淨損那一格，看不出有沒有在燒錢</text>
  <text class="t s" x="60" y="458">另一面：手上現金 1300 多億，也不等於不缺錢——後面的採購承諾還得再募</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Five bars growing taller on the left and five bars of equal height on the right, on the same baseline." font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">Keep talking, and watch how memory grows</text>

<line x1="100" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="500" y1="150" x2="500" y2="430" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>

<text x="272" y="190" font-size="20" fill="var(--dim)" text-anchor="middle">Store every word</text>
<rect x="130" y="390" width="44" height="40" fill="var(--grey)"/>
<rect x="190" y="350" width="44" height="80" fill="var(--grey)"/>
<rect x="250" y="310" width="44" height="120" fill="var(--grey)"/>
<rect x="310" y="270" width="44" height="160" fill="var(--grey)"/>
<rect x="370" y="230" width="44" height="200" fill="var(--grey)"/>
<text x="272" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">Sentence 1 to 5</text>

<text x="702" y="190" font-size="20" fill="var(--accent)" text-anchor="middle">One fixed-size note</text>
<rect x="560" y="370" width="44" height="60" fill="var(--accent)"/>
<rect x="620" y="370" width="44" height="60" fill="var(--accent)"/>
<rect x="680" y="370" width="44" height="60" fill="var(--accent)"/>
<rect x="740" y="370" width="44" height="60" fill="var(--accent)"/>
<rect x="800" y="370" width="44" height="60" fill="var(--accent)"/>
<text x="702" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">Sentence 1 to 5</text>

<text x="480" y="516" font-size="22" fill="var(--ink)" text-anchor="middle">However many times, the right side stays level</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Line chart: shoot days fall from a peak at the left edge, with the turning-point marker at the far left and the AI marker at the far right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="54" font-size="27" font-weight="700" fill="var(--ink)">LA shoot days: halved in a decade</text>
<text x="60" y="80" font-size="15" fill="var(--dim)">Unit: 10k days</text>
<rect x="90" y="100" width="830" height="380" fill="var(--card)"/>
<line x1="90" y1="155" x2="920" y2="155" stroke="var(--line)" stroke-width="1"/>
<line x1="90" y1="231" x2="920" y2="231" stroke="var(--line)" stroke-width="1"/>
<line x1="90" y1="308" x2="920" y2="308" stroke="var(--line)" stroke-width="1"/>
<line x1="90" y1="384" x2="920" y2="384" stroke="var(--line)" stroke-width="1"/>
<line x1="90" y1="460" x2="920" y2="460" stroke="var(--grey)" stroke-width="1.5"/>
<text x="62" y="160" font-size="15" fill="var(--dim)" text-anchor="end">4.0</text>
<text x="62" y="236" font-size="15" fill="var(--dim)" text-anchor="end">3.0</text>
<text x="62" y="313" font-size="15" fill="var(--dim)" text-anchor="end">2.0</text>
<text x="62" y="389" font-size="15" fill="var(--dim)" text-anchor="end">1.0</text>
<line x1="110" y1="120" x2="110" y2="460" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="120" y="134" font-size="19" font-weight="700" fill="var(--accent)">Peak; the slide starts here</text>
<line x1="700" y1="120" x2="700" y2="460" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="710" y="134" font-size="19" font-weight="700" fill="var(--warn)">AI gets blamed</text>
<polyline points="110,155 347,178 426,323 505,209 584,178 663,270 742,285 900,311" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round"/>
<circle cx="110" cy="155" r="6" fill="var(--ink)"/>
<circle cx="347" cy="178" r="5" fill="var(--ink)"/>
<circle cx="426" cy="323" r="5" fill="var(--ink)"/>
<circle cx="663" cy="270" r="5" fill="var(--ink)"/>
<circle cx="742" cy="285" r="5" fill="var(--ink)"/>
<circle cx="900" cy="311" r="7" fill="var(--warn)"/>
<text x="110" y="145" font-size="16" fill="var(--ink)">4.0</text>
<text x="420" y="345" font-size="16" fill="var(--dim)">Pandemic</text>
<text x="640" y="258" font-size="16" fill="var(--dim)">Strikes</text>
<text x="898" y="336" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="end">Under 2.0</text>
<text x="110" y="485" font-size="15" fill="var(--dim)" text-anchor="middle">2016</text>
<text x="347" y="485" font-size="15" fill="var(--dim)" text-anchor="middle">2019</text>
<text x="505" y="485" font-size="15" fill="var(--dim)" text-anchor="middle">2021</text>
<text x="663" y="485" font-size="15" fill="var(--dim)" text-anchor="middle">2023</text>
<text x="900" y="485" font-size="15" fill="var(--dim)" text-anchor="middle">2026</text>
<text x="60" y="533" font-size="22" font-weight="700" fill="var(--ink)">The line fell first; the suspect showed up later.</text>
</svg>
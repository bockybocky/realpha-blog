<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The few large issues in the top row miss the target date, while one of the monthly small issues in the bottom row lands right on it.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="52" text-anchor="middle">Liquid vs precise</text>
<line x1="610" y1="122" x2="610" y2="420" stroke="var(--dim)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="b" x="610" y="112" text-anchor="middle">Target</text>
<text class="g" x="40" y="205">Big</text>
<text class="b" x="40" y="232">Liquid, nets</text>
<line x1="160" y1="250" x2="880" y2="250" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--grey)">
<rect x="288" y="150" width="44" height="100"/>
<rect x="528" y="150" width="44" height="100"/>
<rect x="768" y="150" width="44" height="100"/>
</g>
<text class="g" x="626" y="215" style="fill:var(--warn)">Off</text>
<text class="g" x="40" y="370">Monthly</text>
<text class="b" x="40" y="396">Fine tenor</text>
<line x1="160" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--grey)">
<rect x="172" y="366" width="36" height="34"/><rect x="232" y="366" width="36" height="34"/><rect x="292" y="366" width="36" height="34"/><rect x="352" y="366" width="36" height="34"/>
<rect x="412" y="366" width="36" height="34"/><rect x="472" y="366" width="36" height="34"/><rect x="532" y="366" width="36" height="34"/>
<rect x="652" y="366" width="36" height="34"/><rect x="712" y="366" width="36" height="34"/><rect x="772" y="366" width="36" height="34"/><rect x="832" y="366" width="36" height="34"/>
</g>
<rect x="592" y="366" width="36" height="34" fill="var(--accent)"/>
<text class="g" x="610" y="354" text-anchor="middle" style="fill:var(--accent)">Hit</text>
<text class="b" x="880" y="432" text-anchor="end">Maturity →</text>
<text class="c" x="480" y="495" text-anchor="middle">No verdict yet</text>
</svg>
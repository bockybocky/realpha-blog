<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="時間軸三段，印象的取樣窗只蓋住最後一段，箭頭把它錯位搬回開頭">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  .h{font-size:27px;font-weight:700;fill:var(--ink)}
  .g{font-size:19px;font-weight:700;fill:var(--ink)}
  .b{font-size:16px;fill:var(--dim)}
  .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker></defs>
<text class="t h" x="60" y="72">同一場仗的三個階段</text>
<rect x="60" y="160" width="300" height="110" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="84" y="196">機動還跑得動</text>
<text class="t b" x="84" y="228">無人機＝砲兵的眼睛</text>
<text class="t b" x="84" y="252">攻防來回</text>
<rect x="372" y="160" width="150" height="110" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="396" y="196">過渡</text>
<text class="t b" x="396" y="228">FPV 出現</text>
<rect x="534" y="160" width="366" height="110" rx="8" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)"/>
<text class="t g" x="558" y="196">陣地僵住</text>
<text class="t b" x="558" y="228">無人機定義戰場</text>
<text class="t b" x="558" y="252">機動被關起來</text>
<line x1="60" y1="310" x2="900" y2="310" stroke="var(--grey)" stroke-width="2"/>
<line x1="60" y1="302" x2="60" y2="318" stroke="var(--grey)" stroke-width="2"/>
<line x1="372" y1="302" x2="372" y2="318" stroke="var(--grey)" stroke-width="2"/>
<line x1="534" y1="302" x2="534" y2="318" stroke="var(--grey)" stroke-width="2"/>
<line x1="900" y1="302" x2="900" y2="318" stroke="var(--grey)" stroke-width="2"/>
<text class="t b" x="60" y="342">2022 開打</text>
<text class="t b" x="340" y="342">2023 初</text>
<text class="t b" x="502" y="342">2023 夏末</text>
<text class="t b" x="836" y="342">現在</text>
<rect x="534" y="382" width="366" height="72" rx="8" fill="none" stroke="var(--accent)" stroke-dasharray="7 6"/>
<text class="t g" x="558" y="414" fill="var(--accent)">腦中的「烏克蘭戰爭」</text>
<text class="t b" x="558" y="440">無人機＋砲兵＋傳統裝備</text>
<path d="M530 418 L180 418" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a1)" fill="none"/>
<text class="t g" x="196" y="402" fill="var(--warn)">搬去當下一場的第一天</text>
<text class="t c" x="60" y="512">尾盤，不是下一場的開盤</text>
</svg>
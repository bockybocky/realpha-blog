<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上下兩條同寬長條，下面那條的左段縮小、右段撐大，兩條右端都標著供不應求">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">同一座廠，把產能從一條線搬到另一條線</text>
<text x="80" y="156" font-size="19" fill="var(--dim)">之前</text>
<rect x="180" y="130" width="330" height="70" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="510" y="130" width="330" height="70" fill="var(--accent)" opacity="0.75" stroke="var(--line)" stroke-width="3"/>
<text x="345" y="172" font-size="19" fill="var(--ink)" text-anchor="middle">驅動 IC</text>
<text x="675" y="172" font-size="19" fill="var(--page)" text-anchor="middle">電源 IC</text>
<text x="80" y="326" font-size="19" fill="var(--dim)">之後</text>
<rect x="180" y="300" width="120" height="70" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="300" y="300" width="540" height="70" fill="var(--accent)" opacity="0.75" stroke="var(--line)" stroke-width="3"/>
<text x="240" y="342" font-size="16" fill="var(--ink)" text-anchor="middle">驅動</text>
<text x="570" y="342" font-size="19" fill="var(--page)" text-anchor="middle">電源 IC</text>
<line x1="420" y1="212" x2="330" y2="288" stroke="var(--accent)" stroke-width="4"/>
<polygon points="330,288 346,282 344,298" fill="var(--accent)"/>
<text x="860" y="172" font-size="16" fill="var(--warn)">供不應求</text>
<text x="860" y="342" font-size="16" fill="var(--warn)">仍供不應求</text>
<text x="60" y="462" font-size="22" fill="var(--ink)">轉過去的那一刀，同時縮短了退路</text>
</svg>
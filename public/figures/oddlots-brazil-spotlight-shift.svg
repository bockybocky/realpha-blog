<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一道聚光燈從左邊的人移到右邊的人，兩格之間只有光照位置改變">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="50" y="58" font-size="27" font-weight="700" fill="var(--ink)">探照燈換了方向</text>

<rect x="50" y="92" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="74" y="126" font-size="20" font-weight="700" fill="var(--dim)">首輪</text>
<polygon points="150,140 190,140 240,360 100,360" fill="var(--accent)" opacity="0.18"/>
<ellipse cx="170" cy="362" rx="72" ry="14" fill="var(--accent)" opacity="0.22"/>
<circle cx="170" cy="286" r="19" fill="var(--accent)"/>
<path d="M170 308 q-30 6 -32 52 h64 q-2 -46 -32 -52 z" fill="var(--accent)"/>
<text x="170" y="394" font-size="16" fill="var(--ink)" text-anchor="middle">盧拉</text>
<circle cx="350" cy="286" r="19" fill="var(--grey)"/>
<path d="M350 308 q-30 6 -32 52 h64 q-2 -46 -32 -52 z" fill="var(--grey)"/>
<text x="350" y="394" font-size="16" fill="var(--dim)" text-anchor="middle">弗拉維奧</text>

<rect x="510" y="92" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="534" y="126" font-size="20" font-weight="700" fill="var(--dim)">第二輪</text>
<polygon points="790,140 830,140 880,360 740,360" fill="var(--accent)" opacity="0.18"/>
<ellipse cx="810" cy="362" rx="72" ry="14" fill="var(--accent)" opacity="0.22"/>
<circle cx="810" cy="286" r="19" fill="var(--accent)"/>
<path d="M810 308 q-30 6 -32 52 h64 q-2 -46 -32 -52 z" fill="var(--accent)"/>
<text x="810" y="394" font-size="16" fill="var(--ink)" text-anchor="middle">弗拉維奧</text>
<circle cx="630" cy="286" r="19" fill="var(--grey)"/>
<path d="M630 308 q-30 6 -32 52 h64 q-2 -46 -32 -52 z" fill="var(--grey)"/>
<text x="630" y="394" font-size="16" fill="var(--dim)" text-anchor="middle">盧拉</text>

<text x="480" y="480" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">料一樣多，看的人換了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A tall narrow rectangle beside a short wide one whose area is clearly larger, showing total consumption rising as unit cost falls." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">Cheaper, and the total grows</text>

  <line x1="130" y1="120" x2="130" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="130" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
  <text x="60" y="112" font-size="16" fill="var(--dim)">Unit cost</text>
  <text x="836" y="458" font-size="16" fill="var(--dim)">Usage</text>

  <rect x="150" y="190" width="130" height="240" fill="var(--grey)" fill-opacity="0.3" stroke="var(--grey)" stroke-width="2"/>
  <text x="150" y="176" font-size="19" fill="var(--dim)" font-weight="700">Less efficient</text>
  <text x="172" y="316" font-size="15" fill="var(--dim)">Total used</text>

  <rect x="400" y="300" width="440" height="130" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
  <text x="400" y="286" font-size="19" fill="var(--accent)" font-weight="700">More efficient</text>
  <text x="574" y="372" font-size="16" fill="var(--ink)">Total used</text>

  <line x1="292" y1="188" x2="392" y2="292" stroke="var(--accent)" stroke-width="3"/>
  <line x1="392" y1="292" x2="378" y2="272" stroke="var(--accent)" stroke-width="3"/>
  <line x1="392" y1="292" x2="370" y2="288" stroke="var(--accent)" stroke-width="3"/>
  <text x="296" y="176" font-size="16" fill="var(--accent)">Efficiency gain</text>

  <text x="60" y="500" font-size="22" fill="var(--ink)" font-weight="700">The pie gets made bigger, not smaller</text>
  <text x="60" y="530" font-size="15" fill="var(--dim)">Area = total consumption; proportions illustrative</text>
</svg>
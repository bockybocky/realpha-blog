<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three paths branch from a single starting point, two dropping to different depths and one running flat back to the original height.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="72" font-size="27" fill="var(--ink)">Same news, three endings</text>
<line x1="120" y1="200" x2="300" y2="200" stroke="var(--grey)" stroke-width="4"/>
<circle cx="300" cy="200" r="11" fill="var(--warn)"/>
<text x="120" y="182" font-size="19" fill="var(--ink)">CEO exits</text>
<text x="300" y="166" font-size="16" fill="var(--warn)" text-anchor="middle">Fork: who's next</text>
<polyline points="300,200 520,205 760,200" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text x="775" y="206" font-size="19" fill="var(--ink)">McDonald's</text>
<text x="775" y="230" font-size="16" fill="var(--dim)">Fine after</text>
<polyline points="300,200 520,300 760,370" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="775" y="376" font-size="19" fill="var(--ink)">HP</text>
<text x="775" y="400" font-size="16" fill="var(--dim)">Bought Autonomy</text>
<text x="775" y="422" font-size="16" fill="var(--dim)">$9B write-down</text>
<polyline points="300,200 520,350 700,480" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text x="500" y="500" font-size="19" fill="var(--ink)">Intel</text>
<text x="500" y="524" font-size="16" fill="var(--dim)">Foundry pivot, 50-year low</text>
<text x="60" y="548" font-size="22" fill="var(--ink)">Same exit, different call</text>
</svg>
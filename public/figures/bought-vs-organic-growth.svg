<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根一樣高的堆疊柱，左柱大部分是付費獲客，右柱大部分是自然成長">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; }
</style>
<text class="t" x="60" y="62">一樣的成長曲線，組成可能完全不同</text>
<line x1="240" y1="134" x2="740" y2="134" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text class="b" x="490" y="120" text-anchor="middle">外部看到的成長一樣快</text>
<line x1="150" y1="400" x2="830" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="260" y="140" width="160" height="60" fill="var(--accent)"/>
<rect x="260" y="200" width="160" height="200" fill="var(--grey)"/>
<rect x="560" y="140" width="160" height="200" fill="var(--accent)"/>
<rect x="560" y="340" width="160" height="60" fill="var(--grey)"/>
<text class="g" x="340" y="432" text-anchor="middle">買來的成長</text>
<text class="g" x="640" y="432" text-anchor="middle">自己長出來的</text>
<rect x="260" y="458" width="18" height="18" fill="var(--accent)"/>
<text class="b" x="288" y="473">自然成長</text>
<rect x="430" y="458" width="18" height="18" fill="var(--grey)"/>
<text class="b" x="458" y="473">來自付費活動</text>
<text class="c" x="60" y="506">先問這個成長是買來的，還是自己長出來的</text>
</svg>
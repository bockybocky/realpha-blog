<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three curves from one starting point: one bending upward, one straight, one flattening, representing three shapes an advantage can take as scale grows.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .g { font-size:20px; font-weight:700; }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">The shape of a moat</text>
<text class="s" x="60" y="88">Many mechanisms, only three shapes</text>
<line x1="150" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="130" x2="150" y2="470" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="820" y="498">Scale</text>
<text class="s" x="104" y="140">Advantage</text>
<path d="M150 470 C470 452 690 350 860 140" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M150 470 L860 258" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M150 470 C320 382 560 346 860 332" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="g" x="740" y="126" fill="var(--accent)">Superlinear</text>
<text class="g" x="788" y="248" fill="var(--dim)">Linear</text>
<text class="g" x="760" y="356" fill="var(--dim)">Sublinear</text>
<text class="c" x="150" y="518">Shape decides if a lead holds</text>
</svg>
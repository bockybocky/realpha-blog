<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three bars of very different length, shortest at the top and longest at the bottom, with a time axis marked a day, a week and three months.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .num { font-size:16px; fill:var(--ink); }
    .bdy { font-size:16px; fill:var(--dim); }
    .inb { font-size:16px; fill:var(--page); font-weight:700; }
    .cnc { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="ttl" x="60" y="62">If I vanish tomorrow, how long does this stall</text>

<text class="num" x="60" y="170">The thing keeping you busiest today</text>
<rect x="300" y="140" width="80" height="44" rx="4" fill="var(--grey)"/>
<text class="bdy" x="396" y="170">Covered</text>

<text class="num" x="60" y="252">The routine one</text>
<rect x="300" y="222" width="200" height="44" rx="4" fill="var(--grey)"/>
<text class="bdy" x="516" y="252">Covered</text>

<text class="num" x="60" y="334">The one nobody can pick up</text>
<rect x="300" y="304" width="560" height="44" rx="4" fill="var(--accent)"/>
<text class="inb" x="322" y="334">Scarcity</text>

<line x1="300" y1="380" x2="900" y2="380" stroke="var(--line)" stroke-width="2"/>
<line x1="380" y1="374" x2="380" y2="388" stroke="var(--line)" stroke-width="2"/>
<line x1="500" y1="374" x2="500" y2="388" stroke="var(--line)" stroke-width="2"/>
<line x1="860" y1="374" x2="860" y2="388" stroke="var(--line)" stroke-width="2"/>
<text class="bdy" x="380" y="408" text-anchor="middle">A day</text>
<text class="bdy" x="500" y="408" text-anchor="middle">A week</text>
<text class="bdy" x="860" y="408" text-anchor="middle">Three months</text>

<text class="cnc" x="60" y="474">The busiest thing is often the shortest bar</text>
</svg>
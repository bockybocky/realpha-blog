<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上方一條很長的時間軸走到終點，下方一條短很多的時間軸在中途下陷處中斷">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">先量自己的軸長，再評別人的決定</text>

<text x="60" y="136" font-size="20" fill="var(--accent)">創業者的軸</text>
<line x1="60" y1="196" x2="880" y2="196" stroke="var(--accent)" stroke-width="4"/>
<circle cx="60" cy="196" r="9" fill="var(--accent)"/>
<circle cx="486" cy="196" r="9" fill="var(--accent)"/>
<circle cx="880" cy="196" r="9" fill="var(--accent)"/>
<text x="60" y="232" font-size="16" fill="var(--dim)">投入</text>
<text x="430" y="232" font-size="16" fill="var(--ink)">第六年才賺錢</text>
<text x="810" y="232" font-size="16" fill="var(--dim)">十年</text>

<text x="60" y="326" font-size="20" fill="var(--warn)">你那筆錢的軸</text>
<path d="M60 386 L220 386 L268 424 L316 386 L360 386" fill="none" stroke="var(--warn)" stroke-width="4"/>
<circle cx="60" cy="386" r="9" fill="var(--warn)"/>
<line x1="372" y1="368" x2="404" y2="404" stroke="var(--warn)" stroke-width="4"/>
<line x1="404" y1="368" x2="372" y2="404" stroke="var(--warn)" stroke-width="4"/>
<line x1="420" y1="386" x2="880" y2="386" stroke="var(--line)" stroke-width="4" stroke-dasharray="8 10"/>
<text x="60" y="422" font-size="16" fill="var(--dim)">買進</text>
<text x="236" y="462" font-size="16" fill="var(--warn)">腰斬</text>
<text x="358" y="462" font-size="16" fill="var(--warn)">被迫賣掉</text>

<text x="60" y="502" font-size="22" fill="var(--ink)">這是軸長的問題，不是誰比較有遠見</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A bar in three segments with the last one framed in dashes and crossed out.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="72" font-size="27" fill="var(--ink)">Future returns come from three blocks; valuation caps only one</text>

  <rect x="90" y="180" width="380" height="120" fill="var(--accent)"/>
  <text x="280" y="248" font-size="19" fill="var(--page)" text-anchor="middle">Earnings growth</text>
  <rect x="470" y="180" width="130" height="120" fill="var(--grey)"/>
  <text x="535" y="248" font-size="19" fill="var(--ink)" text-anchor="middle">Dividends</text>
  <rect x="600" y="180" width="270" height="120" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="612" y1="192" x2="858" y2="288" stroke="var(--warn)" stroke-width="3"/>
  <line x1="858" y1="192" x2="612" y2="288" stroke="var(--warn)" stroke-width="3"/>
  <text x="735" y="336" font-size="19" fill="var(--warn)" text-anchor="middle">Multiple expansion</text>

  <text x="90" y="396" font-size="16" fill="var(--dim)">Valuation won't tell you when to get in or out</text>
  <text x="60" y="456" font-size="22" fill="var(--ink)">It says one thing: don't assume the third block keeps growing</text>
</svg>
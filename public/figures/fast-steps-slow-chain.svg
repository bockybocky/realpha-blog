<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="兩條流程鏈上下並排，各由五個環節串成；下面那條前四個環節被壓得很短，只有最後的驗證環節一樣長，所以整條鏈幾乎沒有變短">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #b9c2d0;
      --accent: #1f6feb;
      --warn:   #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #4a5464;
        --accent: #58a6ff;
        --warn:   #d29922;
      }
    }
    .t     { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1    { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .cap   { font-size: 19px; font-weight: 700; fill: var(--dim); }
    .pct   { font-size: 16px; font-weight: 700; }
    .hint  { font-size: 16px; font-weight: 700; fill: var(--dim); }
    .kick  { font-size: 22px; font-weight: 700; fill: var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="480" fill="var(--page)"/>
  <g class="t">
    <text x="480" y="46" class="h1" text-anchor="middle">每一步都變快，整條鏈沒變短多少</text>

    <!-- 上：以前，五段等長 -->
    <text x="60" y="140" class="cap" text-anchor="start">以前</text>
    <g>
      <rect x="140" y="112" width="100" height="44" rx="4" fill="var(--grey)"/>
      <rect x="248" y="112" width="100" height="44" rx="4" fill="var(--grey)"/>
      <rect x="356" y="112" width="100" height="44" rx="4" fill="var(--grey)"/>
      <rect x="464" y="112" width="100" height="44" rx="4" fill="var(--grey)"/>
      <rect x="572" y="112" width="300" height="44" rx="4" fill="var(--warn)"/>
      <text x="190" y="140" class="pct" fill="var(--page)" text-anchor="middle">讀文獻</text>
      <text x="298" y="140" class="pct" fill="var(--page)" text-anchor="middle">想點子</text>
      <text x="406" y="140" class="pct" fill="var(--page)" text-anchor="middle">寫程式</text>
      <text x="514" y="140" class="pct" fill="var(--page)" text-anchor="middle">寫論文</text>
      <text x="722" y="140" class="pct" fill="var(--page)" text-anchor="middle">等驗證：對不對要很久才知道</text>
    </g>

    <!-- 下：有了 AI，前四段壓短，驗證段不變 -->
    <text x="60" y="260" class="cap" text-anchor="start">有了 AI</text>
    <g>
      <rect x="140" y="232" width="28" height="44" rx="4" fill="var(--accent)"/>
      <rect x="176" y="232" width="28" height="44" rx="4" fill="var(--accent)"/>
      <rect x="212" y="232" width="28" height="44" rx="4" fill="var(--accent)"/>
      <rect x="248" y="232" width="28" height="44" rx="4" fill="var(--accent)"/>
      <rect x="284" y="232" width="300" height="44" rx="4" fill="var(--warn)"/>
      <text x="434" y="260" class="pct" fill="var(--page)" text-anchor="middle">等驗證：一樣久</text>
    </g>
    <text x="140" y="304" class="hint" text-anchor="start">前四步快了十倍</text>

    <!-- 總長對比 -->
    <line x1="140" y1="340" x2="872" y2="340" stroke="var(--grey)" stroke-width="3"/>
    <line x1="140" y1="360" x2="584" y2="360" stroke="var(--accent)" stroke-width="3"/>
    <text x="880" y="345" class="hint" text-anchor="start">總長</text>
    <text x="592" y="365" class="hint" text-anchor="start">總長：只短了三成</text>

    <text x="480" y="440" class="kick" text-anchor="middle">回饋來得慢的領域，加速零件不等於加速科學</text>
  </g>
</svg>

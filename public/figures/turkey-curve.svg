<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="階梯連年上升後在最高點垂直墜落到比起點更低處">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="68">火雞</text>
<line x1="100" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<path d="M120,360 L200,360 L200,330 L280,330 L280,300 L360,300 L360,272 L440,272 L440,246 L520,246 L520,222 L600,222 L600,200 L660,200" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="g" x="180" y="162">連著好多年漂亮</text>
<path d="M660,200 L660,462" fill="none" stroke="var(--warn)" stroke-width="7"/>
<path d="M660,462 l-9,-18 l18,0 z" fill="var(--warn)"/>
<rect x="676" y="200" width="196" height="262" fill="var(--warn)" opacity="0.12"/>
<text class="g" x="696" y="314">一記大虧</text>
<text class="b" x="696" y="340">股價折的是這一段</text>
<text class="b" x="120" y="462">起點</text>
<text class="c" x="60" y="500">漂亮的那幾年不是證據，是取樣</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A two-layer diagram in which the upper layer hangs unsupported, the lower layer is solid, and a brick is missing between them.">
  <defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style></defs>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Which layer holds</text>

  <rect x="240" y="120" width="480" height="96" rx="12" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 8"/>
  <text class="t" x="480" y="166" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">Four times better than medication</text>
  <text class="t" x="480" y="194" font-size="16" fill="var(--dim)" text-anchor="middle">Across-trial comparison</text>

  <rect x="300" y="256" width="360" height="110" rx="12" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 9"/>
  <text class="t" x="480" y="300" font-size="19" font-weight="700" fill="var(--grey)" text-anchor="middle">Missing: head-to-head trial</text>
  <text class="t" x="480" y="334" font-size="19" font-weight="700" fill="var(--grey)" text-anchor="middle">or a full real-world report</text>

  <rect x="120" y="406" width="720" height="104" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="480" y="452" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Beats sham under controlled conditions</text>
  <text class="t" x="480" y="482" font-size="16" fill="var(--dim)" text-anchor="middle">Seven trial sites · double-blind · sham-controlled</text>

  <text class="t" x="60" y="546" font-size="22" font-weight="700" fill="var(--ink)">The lower layer holds, the upper one still hangs</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" id="fig-denominator" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩根長條被右側灰段各蓋掉一部分，總長較長的那根因為被蓋掉更多，剩下的亮色段反而更短">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
#fig-denominator text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-denominator .h { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-denominator .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-denominator .b { font-size:16px; fill:var(--dim); }
#fig-denominator .s { font-size:15px; fill:var(--dim); }
#fig-denominator .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="h" x="60" y="54">分母裡有兩股力量，成長是被減掉的那股</text>
<text class="b" x="60" y="84">示意用的小數字，不是真實預估</text>
<text class="g" x="60" y="160">利率 8　成長 4</text>
<rect x="240" y="136" width="400" height="44" fill="var(--accent)"/>
<rect x="440" y="136" width="200" height="44" fill="var(--grey)"/>
<text class="s" x="330" y="164" fill="var(--page)">分母 4</text>
<text class="s" x="660" y="164">被成長蓋掉的部分</text>
<line x1="240" y1="200" x2="440" y2="200" stroke="var(--ink)" stroke-width="2"/>
<text class="g" x="60" y="300">利率 9　成長 6</text>
<rect x="240" y="276" width="450" height="44" fill="var(--accent)"/>
<rect x="390" y="276" width="300" height="44" fill="var(--grey)"/>
<text class="s" x="288" y="304" fill="var(--page)">分母 3</text>
<text class="s" x="710" y="304">蓋掉更多</text>
<line x1="240" y1="340" x2="390" y2="340" stroke="var(--ink)" stroke-width="2"/>
<path d="M 240 386 L 240 410 L 440 410" fill="none" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="240" y="440">分母越短，同一筆現金流值越多錢</text>
<text class="c" x="60" y="496">利率往上，成長也往上：看誰跑得比較快</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三種債市規模下，安全的來源從地形優勢移到金融市場，最後變成金融與軍事互相餵養的循環">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="40" y="58" font-size="27" font-weight="700" fill="var(--ink)">債市越深，安全的來源越往金融端移</text>
<text class="t" x="40" y="92" font-size="16" fill="var(--dim)">橫向：借貸能力由小到大</text>

<rect x="40" y="120" width="272" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="344" y="120" width="272" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="648" y="120" width="272" height="330" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="64" y="155" font-size="19" font-weight="700" fill="var(--ink)">債市很小</text>
<text class="t" x="64" y="181" font-size="15" fill="var(--dim)">金融不重要</text>
<polygon points="90,330 150,230 210,330" fill="var(--grey)"/>
<polygon points="170,330 215,265 260,330" fill="var(--grey)" opacity="0.6"/>
<text class="t" x="64" y="372" font-size="16" fill="var(--ink)">護城河・山頭</text>
<text class="t" x="64" y="398" font-size="15" fill="var(--dim)">外生優勢＝安全</text>

<text class="t" x="368" y="155" font-size="19" font-weight="700" fill="var(--ink)">借貸能力中等</text>
<text class="t" x="368" y="181" font-size="15" fill="var(--dim)">起步優勢會累積</text>
<text class="t" x="368" y="252" font-size="16" fill="var(--ink)">金融優勢</text>
<line x1="462" y1="246" x2="536" y2="246" stroke="var(--ink)" stroke-width="2"/>
<polygon points="536,241 548,246 536,251" fill="var(--ink)"/>
<text class="t" x="368" y="300" font-size="16" fill="var(--ink)">軍事優勢</text>
<line x1="368" y1="330" x2="596" y2="330" stroke="var(--line)" stroke-width="2"/>
<line x1="482" y1="316" x2="482" y2="344" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="414" y="370" font-size="15" fill="var(--warn)">臨界點</text>
<text class="t" x="368" y="402" font-size="15" fill="var(--dim)">往哪一側出發就往哪滾</text>

<text class="t" x="672" y="155" font-size="19" font-weight="700" fill="var(--ink)">借貸能力很高</text>
<text class="t" x="672" y="181" font-size="15" fill="var(--accent)">因果倒過來流</text>
<text class="t" x="672" y="232" font-size="16" fill="var(--ink)">市場認定它安全</text>
<line x1="690" y1="244" x2="690" y2="268" stroke="var(--accent)" stroke-width="2"/>
<polygon points="685,268 690,280 695,268" fill="var(--accent)"/>
<text class="t" x="672" y="302" font-size="16" fill="var(--ink)">融資成本低</text>
<line x1="690" y1="314" x2="690" y2="338" stroke="var(--accent)" stroke-width="2"/>
<polygon points="685,338 690,350 695,338" fill="var(--accent)"/>
<text class="t" x="672" y="372" font-size="16" fill="var(--ink)">投資發生</text>
<path d="M 862 362 L 898 362 L 898 222 L 862 222" fill="none" stroke="var(--accent)" stroke-width="2"/>
<polygon points="868,217 856,222 868,227" fill="var(--accent)"/>
<text class="t" x="672" y="412" font-size="15" fill="var(--dim)">預期變成對的</text>

<text class="t" x="40" y="505" font-size="22" font-weight="700" fill="var(--ink)">霸權轉移不必經過戰爭，可以是定價定出來的</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一條等寬不縮的柱子，右邊一個上寬下窄的漏斗，兩者並列">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">廠商那端不縮，開發那端會縮</text>

  <g>
    <text class="t" x="250" y="130" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">廠商訂單</text>
    <rect x="170" y="160" width="160" height="280" fill="var(--accent)" opacity="0.85"/>
    <text class="t" x="250" y="474" font-size="16" fill="var(--dim)" text-anchor="middle">進來多少</text>
    <text class="t" x="250" y="498" font-size="16" fill="var(--dim)" text-anchor="middle">就是多少</text>
  </g>

  <g>
    <text class="t" x="690" y="130" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">規劃中的資料中心</text>
    <path d="M520 160 L860 160 L730 440 L650 440 z" fill="var(--warn)" opacity="0.8"/>
    <text class="t" x="690" y="196" font-size="16" fill="var(--page)" text-anchor="middle">上千座</text>
    <text class="t" x="690" y="474" font-size="16" fill="var(--dim)" text-anchor="middle">真正蓋出來的</text>
    <text class="t" x="690" y="498" font-size="16" fill="var(--dim)" text-anchor="middle">少得多</text>
  </g>

  <line x1="430" y1="150" x2="430" y2="450" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>

  <text class="t" x="60" y="542" font-size="22" font-weight="700" fill="var(--ink)">需求是真的，泡沫也是真的</text>
</svg>
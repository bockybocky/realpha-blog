<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four bars of different lengths below a zero line, three of them deep and one very shallow.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .h1{font-size:27px;font-weight:700;fill:var(--ink);}
    .cap{font-size:19px;font-weight:700;fill:var(--dim);}
    .capA{font-size:19px;font-weight:700;fill:var(--accent);}
    .big{font-size:34px;font-weight:700;fill:var(--ink);}
    .unit{font-size:16px;fill:var(--dim);}
    .kick{font-size:22px;font-weight:700;fill:var(--ink);}
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <g class="t">
    <text x="480" y="48" class="h1" text-anchor="middle">Same selloff, very different depths</text>
    <line x1="70" y1="150" x2="900" y2="150" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="70" y="136" class="unit">High</text>
    <text x="180" y="120" class="capA" text-anchor="middle">Dell</text>
    <rect x="125" y="150" width="110" height="200" rx="3" fill="var(--accent)"/>
    <text x="180" y="392" class="big" text-anchor="middle">Halved</text>
    <text x="390" y="120" class="capA" text-anchor="middle">Micron</text>
    <rect x="335" y="150" width="110" height="200" rx="3" fill="var(--accent)"/>
    <text x="390" y="392" class="big" text-anchor="middle">Halved</text>
    <text x="600" y="120" class="capA" text-anchor="middle">DRAM</text>
    <rect x="545" y="150" width="110" height="208" rx="3" fill="var(--accent)"/>
    <text x="600" y="400" class="big" text-anchor="middle">52%</text>
    <text x="810" y="120" class="cap" text-anchor="middle">Nasdaq</text>
    <rect x="755" y="150" width="110" height="60" rx="3" fill="var(--grey)"/>
    <text x="810" y="252" class="big" text-anchor="middle">15%</text>
    <text x="810" y="286" class="unit" text-anchor="middle">off the high</text>
    <text x="480" y="500" class="kick" text-anchor="middle">A few names got cut, not the whole list</text>
  </g>
</svg>
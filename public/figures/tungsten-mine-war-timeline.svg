<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="礦坑開採期與戰爭時間點對齊的百年時間軸，1990 到 2026 是最長的停擺空白">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t  { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1 { font-size:27px; fill:var(--ink); font-weight:700; }
    .g  { font-size:19px; fill:var(--ink); }
    .s  { font-size:15px; fill:var(--dim); }
    .c  { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t h1" x="60" y="62">一座礦的開關，和戰爭同一條線</text>

  <rect x="700" y="78" width="26" height="14" fill="var(--accent)"/>
  <text class="t s" x="734" y="90">開採中</text>
  <line x1="812" y1="85" x2="838" y2="85" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 6"/>
  <text class="t s" x="846" y="90">停擺</text>

  <line x1="90" y1="328" x2="900" y2="328" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 6"/>

  <rect x="137" y="300" width="14" height="56" fill="var(--accent)"/>
  <rect x="279" y="300" width="135" height="56" fill="var(--accent)"/>
  <rect x="461" y="300" width="169" height="56" fill="var(--accent)"/>
  <rect x="873" y="300" width="27" height="56" fill="var(--accent)"/>

  <line x1="137" y1="250" x2="137" y2="296" stroke="var(--dim)" stroke-width="1.5"/>
  <line x1="286" y1="250" x2="286" y2="296" stroke="var(--dim)" stroke-width="1.5"/>
  <line x1="360" y1="250" x2="360" y2="296" stroke="var(--dim)" stroke-width="1.5"/>
  <line x1="461" y1="250" x2="461" y2="296" stroke="var(--dim)" stroke-width="1.5"/>
  <line x1="846" y1="250" x2="846" y2="296" stroke="var(--dim)" stroke-width="1.5"/>

  <text class="t g" x="137" y="238" text-anchor="middle">一戰</text>
  <text class="t g" x="286" y="238" text-anchor="middle">二戰</text>
  <text class="t g" x="366" y="210" text-anchor="middle">韓戰</text>
  <text class="t g" x="461" y="238" text-anchor="middle">越戰</text>
  <text class="t g" x="846" y="238" text-anchor="middle">烏克蘭</text>
  <line x1="360" y1="250" x2="366" y2="220" stroke="var(--dim)" stroke-width="1"/>

  <text class="t s" x="137" y="378" text-anchor="middle">1917</text>
  <text class="t s" x="279" y="378" text-anchor="middle">1938</text>
  <text class="t s" x="630" y="378" text-anchor="middle">1990</text>
  <text class="t s" x="873" y="378" text-anchor="middle">2026 重啟</text>

  <text class="t s" x="215" y="410" text-anchor="middle">戰後拋庫存</text>
  <text class="t s" x="437" y="440" text-anchor="middle">史普尼克</text>
  <line x1="437" y1="420" x2="437" y2="398" stroke="var(--line)" stroke-width="1"/>
  <text class="t s" x="751" y="410" text-anchor="middle">礦坑進水・三十年</text>

  <text class="t c" x="60" y="500">戰爭來，它開；戰爭走，它淹</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩疊方塊，一疊厚實三層，另一疊只剩底層，上面兩層是虛線空框">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">好資料是過程，不是答案</text>

  <text class="t" x="110" y="120" font-size="20" font-weight="700" fill="var(--accent)">行銷</text>
  <rect x="110" y="140" width="320" height="86" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="t" x="132" y="190" font-size="16" fill="var(--ink)">創意過程：為什麼這樣改</text>
  <rect x="110" y="236" width="320" height="86" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="t" x="132" y="286" font-size="16" fill="var(--ink)">通話紀錄</text>
  <rect x="110" y="332" width="320" height="86" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="t" x="132" y="382" font-size="16" fill="var(--ink)">成品廣告</text>
  <text class="t" x="110" y="452" font-size="16" fill="var(--dim)">三層都在手上</text>

  <text class="t" x="530" y="120" font-size="20" font-weight="700" fill="var(--dim)">建築</text>
  <rect x="530" y="140" width="320" height="86" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="9 9"/>
  <text class="t" x="552" y="190" font-size="16" fill="var(--dim)">改圖的來回對話</text>
  <rect x="530" y="236" width="320" height="86" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="9 9"/>
  <text class="t" x="552" y="286" font-size="16" fill="var(--dim)">誰為什麼拍板</text>
  <rect x="530" y="332" width="320" height="86" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="552" y="382" font-size="16" fill="var(--ink)">最終藍圖</text>
  <text class="t" x="530" y="452" font-size="16" fill="var(--dim)">只剩答案，過程沒人留著</text>

  <text class="t" x="60" y="528" font-size="22" font-weight="700" fill="var(--ink)">虛線那兩層，就是模型學不到的部分</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="資本到公司到國家的兩段粗箭頭向右，公司回到資本的虛線報酬箭頭中間被打叉，上方有一條向下的壓價箭頭">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="66">錢從哪裡進，東西往哪裡走</text>
<rect x="380" y="100" width="200" height="56" rx="10" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text class="g" x="480" y="135" text-anchor="middle" style="fill:var(--warn)">開源模型</text>
<line x1="480" y1="156" x2="480" y2="220" stroke="var(--warn)" stroke-width="3"/>
<polygon points="472,220 488,220 480,232" fill="var(--warn)"/>
<text class="b" x="500" y="198" style="fill:var(--warn)">先壓估值</text>
<rect x="70" y="230" width="200" height="110" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="380" y="230" width="200" height="110" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="690" y="230" width="200" height="110" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="170" y="282" text-anchor="middle">國際資本</text>
<text class="b" x="170" y="310" text-anchor="middle">含中國資本</text>
<text class="g" x="480" y="292" text-anchor="middle">燒錢的公司</text>
<text class="g" x="790" y="282" text-anchor="middle">國家</text>
<text class="b" x="790" y="310" text-anchor="middle">以國安名義</text>
<line x1="272" y1="285" x2="368" y2="285" stroke="var(--accent)" stroke-width="5"/>
<polygon points="368,277 384,285 368,293" fill="var(--accent)"/>
<text class="b" x="326" y="266" text-anchor="middle">出錢</text>
<line x1="582" y1="285" x2="678" y2="285" stroke="var(--accent)" stroke-width="5"/>
<polygon points="678,277 694,285 678,293" fill="var(--accent)"/>
<text class="b" x="636" y="266" text-anchor="middle">接手</text>
<path d="M 790 342 L 790 396 L 170 396 L 170 346" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>
<polygon points="162,352 178,352 170,338" fill="var(--grey)"/>
<line x1="468" y1="384" x2="492" y2="408" stroke="var(--warn)" stroke-width="4"/>
<line x1="492" y1="384" x2="468" y2="408" stroke="var(--warn)" stroke-width="4"/>
<text class="b" x="480" y="432" text-anchor="middle">報酬</text>
<text class="c" x="60" y="490">出錢的人不一定拿得到成果</text>
</svg>
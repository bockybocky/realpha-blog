<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一整排報酬長條被壓低，只有崩盤那根拉高，右邊對照一個很小的配置比例方塊">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.f5-b{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.f5-t{font-size:27px;font-weight:700}
.f5-g{font-size:19px;fill:var(--dim)}
.f5-s{font-size:15px}
.f5-c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="f5-b f5-t" x="60" y="66">為了崩盤那幾週好看，其餘全部調差</text>
<line x1="70" y1="400" x2="660" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="80" y="290" width="30" height="110" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="80" y="320" width="30" height="80" fill="var(--accent)"/>
<rect x="126" y="270" width="30" height="130" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="126" y="305" width="30" height="95" fill="var(--accent)"/>
<rect x="172" y="310" width="30" height="90" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="172" y="340" width="30" height="60" fill="var(--accent)"/>
<rect x="218" y="260" width="30" height="140" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="218" y="295" width="30" height="105" fill="var(--accent)"/>
<rect x="264" y="300" width="30" height="100" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="264" y="330" width="30" height="70" fill="var(--accent)"/>
<rect x="310" y="280" width="30" height="120" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="310" y="312" width="30" height="88" fill="var(--accent)"/>
<rect x="356" y="250" width="30" height="150" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="356" y="288" width="30" height="112" fill="var(--accent)"/>
<rect x="402" y="305" width="30" height="95" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="402" y="335" width="30" height="65" fill="var(--accent)"/>
<rect x="448" y="380" width="30" height="20" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="448" y="225" width="30" height="175" fill="var(--warn)"/>
<rect x="494" y="285" width="30" height="115" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="494" y="318" width="30" height="82" fill="var(--accent)"/>
<rect x="540" y="265" width="30" height="135" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="540" y="300" width="30" height="100" fill="var(--accent)"/>
<rect x="586" y="295" width="30" height="105" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="586" y="325" width="30" height="75" fill="var(--accent)"/>
<text class="f5-b f5-s" x="463" y="212" text-anchor="middle" fill="var(--warn)">崩盤那幾週</text>
<text class="f5-b f5-s" x="80" y="432" fill="var(--dim)">虛線＝原本可以有的高度</text>
<line x1="690" y1="120" x2="690" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="f5-b f5-g" x="810" y="150" text-anchor="middle">他願意配的錢</text>
<rect x="740" y="170" width="140" height="230" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="740" y="377" width="140" height="23" fill="var(--accent)"/>
<text class="f5-b f5-s" x="810" y="432" text-anchor="middle" fill="var(--dim)">5–10%</text>
<text class="f5-b f5-c" x="60" y="506">用整條曲線，換那一小格</text>
</svg>
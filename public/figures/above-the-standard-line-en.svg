<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A row of equal-height short bars sits on a horizontal standard line, with only a few clearly rising above it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700">Once everyone is pulled up to the standard line</text>

  <rect x="70" y="300" width="820" height="60" fill="var(--card)"/>
  <line x1="70" y1="300" x2="890" y2="300" stroke="var(--grey)" stroke-width="4"/>
  <text x="70" y="398" font-size="19" fill="var(--dim)">Any answer you can look up reaches this line</text>

  <rect x="96" y="276" width="26" height="24" fill="var(--grey)"/>
  <rect x="136" y="276" width="26" height="24" fill="var(--grey)"/>
  <rect x="176" y="276" width="26" height="24" fill="var(--grey)"/>
  <rect x="256" y="276" width="26" height="24" fill="var(--grey)"/>
  <rect x="296" y="276" width="26" height="24" fill="var(--grey)"/>
  <rect x="376" y="276" width="26" height="24" fill="var(--grey)"/>
  <rect x="416" y="276" width="26" height="24" fill="var(--grey)"/>
  <rect x="456" y="276" width="26" height="24" fill="var(--grey)"/>
  <rect x="536" y="276" width="26" height="24" fill="var(--grey)"/>
  <rect x="616" y="276" width="26" height="24" fill="var(--grey)"/>
  <rect x="656" y="276" width="26" height="24" fill="var(--grey)"/>
  <rect x="736" y="276" width="26" height="24" fill="var(--grey)"/>
  <rect x="816" y="276" width="26" height="24" fill="var(--grey)"/>
  <rect x="856" y="276" width="26" height="24" fill="var(--grey)"/>

  <rect x="216" y="168" width="26" height="132" fill="var(--accent)"/>
  <text x="229" y="148" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Persistence</text>

  <rect x="496" y="150" width="26" height="150" fill="var(--accent)"/>
  <text x="509" y="130" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Delivery</text>

  <rect x="776" y="180" width="26" height="120" fill="var(--accent)"/>
  <text x="789" y="160" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Experience</text>

  <text x="60" y="470" font-size="22" font-weight="700">What tells people apart is the few bars above the line</text>
</svg>
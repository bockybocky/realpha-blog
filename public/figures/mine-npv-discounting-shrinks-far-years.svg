<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" role="img" aria-label="二十根等高外框代表每年相同的現金，內部藍色的折現值由左往右快速縮小，後半段幾乎歸零">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .ac { fill:var(--accent); }
    .wn { fill:var(--warn); }
    .inv { fill:var(--page); }
</style>
<rect x="0" y="0" width="960" height="550" fill="var(--page)"/>
<text x="480" y="50" text-anchor="middle" class="t">能挖 100 年的礦，折現之後</text>
<rect x="250" y="80" width="18" height="18" fill="var(--card)" stroke="var(--grey)" stroke-width="1.5"/>
<text x="276" y="95" class="d">每年實際現金 10</text>
<rect x="470" y="80" width="18" height="18" fill="var(--accent)"/>
<text x="496" y="95" class="d">折回今天的價值</text>
<text x="480" y="126" text-anchor="middle" class="d">示意：折現率 10%，每 5 年取一根</text>
<g fill="var(--card)" stroke="var(--grey)" stroke-width="1.5">
<rect x="86" y="230" width="28" height="200"/>
<rect x="126" y="230" width="28" height="200"/>
<rect x="166" y="230" width="28" height="200"/>
<rect x="206" y="230" width="28" height="200"/>
<rect x="246" y="230" width="28" height="200"/>
<rect x="286" y="230" width="28" height="200"/>
<rect x="326" y="230" width="28" height="200"/>
<rect x="366" y="230" width="28" height="200"/>
<rect x="406" y="230" width="28" height="200"/>
<rect x="446" y="230" width="28" height="200"/>
<rect x="486" y="230" width="28" height="200"/>
<rect x="526" y="230" width="28" height="200"/>
<rect x="566" y="230" width="28" height="200"/>
<rect x="606" y="230" width="28" height="200"/>
<rect x="646" y="230" width="28" height="200"/>
<rect x="686" y="230" width="28" height="200"/>
<rect x="726" y="230" width="28" height="200"/>
<rect x="766" y="230" width="28" height="200"/>
<rect x="806" y="230" width="28" height="200"/>
<rect x="846" y="230" width="28" height="200"/>
</g>
<g fill="var(--accent)">
<rect x="86" y="305.8" width="28" height="124.2"/>
<rect x="126" y="352.9" width="28" height="77.1"/>
<rect x="166" y="382.1" width="28" height="47.9"/>
<rect x="206" y="400.3" width="28" height="29.7"/>
<rect x="246" y="411.5" width="28" height="18.5"/>
<rect x="286" y="418.5" width="28" height="11.5"/>
<rect x="326" y="422.9" width="28" height="7.1"/>
<rect x="366" y="425.6" width="28" height="4.4"/>
<rect x="406" y="427.3" width="28" height="2.7"/>
<rect x="446" y="428.3" width="28" height="1.7"/>
<rect x="486" y="428.9" width="28" height="1.1"/>
<rect x="526" y="429.3" width="28" height="0.7"/>
<rect x="566" y="429.6" width="28" height="0.4"/>
<rect x="606" y="429.75" width="28" height="0.25"/>
</g>
<line x1="486" y1="215" x2="874" y2="215" stroke="var(--warn)" stroke-width="2"/>
<line x1="486" y1="209" x2="486" y2="221" stroke="var(--warn)" stroke-width="2"/>
<line x1="874" y1="209" x2="874" y2="221" stroke="var(--warn)" stroke-width="2"/>
<text x="680" y="202" text-anchor="middle" class="g wn">後 50 年：幾乎歸零</text>
<text x="100" y="456" text-anchor="middle" class="d">第 5 年</text>
<text x="460" y="456" text-anchor="middle" class="d">第 50 年</text>
<text x="860" y="456" text-anchor="middle" class="d">第 100 年</text>
<text x="480" y="515" text-anchor="middle" class="c">遠期價值被折得很低</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two horizontal bars of very different lengths: the top one is one hundred years, the bottom one is a quarter as long at twenty-five years, and below them a crossed-out dashed empty box stands for a contract form that does not exist in the law.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="60">One deal, two announced terms</text>
<text class="d" x="60" y="90">Horizontal axis = contract term</text>

<text class="g" x="60" y="152">White House version</text>
<rect x="230" y="126" width="670" height="50" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
<text class="b" x="250" y="157">100-year lease</text>

<text class="g" x="60" y="254">Venezuelan law</text>
<rect x="230" y="228" width="168" height="50" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="b" x="250" y="259">25 years</text>
<text class="d" x="416" y="259">JV / PSA, renewable</text>

<line x1="230" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>
<line x1="230" y1="294" x2="230" y2="306" stroke="var(--grey)" stroke-width="2"/>
<line x1="398" y1="294" x2="398" y2="306" stroke="var(--grey)" stroke-width="2"/>
<line x1="565" y1="294" x2="565" y2="306" stroke="var(--grey)" stroke-width="2"/>
<line x1="900" y1="294" x2="900" y2="306" stroke="var(--grey)" stroke-width="2"/>
<text class="d" x="230" y="326" text-anchor="middle">0</text>
<text class="d" x="398" y="326" text-anchor="middle">25</text>
<text class="d" x="565" y="326" text-anchor="middle">50</text>
<text class="d" x="900" y="326" text-anchor="middle">100 yr</text>

<rect x="230" y="356" width="330" height="88" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="g" x="252" y="392">Lease / concession</text>
<text class="d" x="252" y="420">No such slot in law since the 1975 nationalization</text>
<line x1="500" y1="376" x2="540" y2="424" stroke="var(--warn)" stroke-width="3"/>
<line x1="540" y1="376" x2="500" y2="424" stroke="var(--warn)" stroke-width="3"/>

<text class="c" x="60" y="490">The extra 75 years hang on a slot the other side does not have.</text>
</svg>
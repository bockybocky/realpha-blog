<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A before-and-after pair of panels shows the high water line inside a peat dome falling to near its base once a canal cuts through it.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="52" font-size="27" fill="var(--ink)">Canal vs dome</text>
<text x="60" y="96" font-size="19" fill="var(--dim)">Before</text>
<rect x="60" y="110" width="400" height="370" fill="var(--card)" stroke="var(--line)" rx="8"/>
<path d="M130 440 C170 250 350 250 390 440 Z" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)"/>
<line x1="160" y1="300" x2="360" y2="300" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 6"/>
<text x="170" y="288" font-size="16" fill="var(--ink)">Wet</text>
<text x="170" y="400" font-size="16" fill="var(--dim)">Locked</text>
<rect x="80" y="400" width="48" height="40" fill="var(--accent)"/>
<rect x="392" y="400" width="48" height="40" fill="var(--accent)"/>
<line x1="60" y1="440" x2="460" y2="440" stroke="var(--ink)" stroke-width="2"/>
<text x="80" y="468" font-size="16" fill="var(--dim)">R.</text>
<text x="392" y="468" font-size="16" fill="var(--dim)">R.</text>
<text x="500" y="96" font-size="19" fill="var(--dim)">After</text>
<rect x="500" y="110" width="400" height="370" fill="var(--card)" stroke="var(--line)" rx="8"/>
<path d="M570 440 C610 250 790 250 830 440 Z" fill="var(--warn)" fill-opacity="0.18" stroke="var(--warn)"/>
<rect x="687" y="258" width="26" height="182" fill="var(--page)" stroke="var(--warn)"/>
<line x1="600" y1="418" x2="790" y2="418" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
<text x="600" y="406" font-size="16" fill="var(--ink)">Dry</text>
<text x="590" y="330" font-size="16" fill="var(--ink)">Peat</text>
<text x="590" y="356" font-size="16" fill="var(--warn)">Fuel</text>
<line x1="625" y1="272" x2="640" y2="296" stroke="var(--warn)" stroke-width="2"/>
<line x1="760" y1="272" x2="748" y2="298" stroke="var(--warn)" stroke-width="2"/>
<rect x="520" y="400" width="48" height="40" fill="var(--accent)"/>
<rect x="832" y="400" width="48" height="40" fill="var(--accent)"/>
<line x1="500" y1="440" x2="900" y2="440" stroke="var(--ink)" stroke-width="2"/>
<text x="60" y="522" font-size="22" fill="var(--ink)">No way back</text>
</svg>
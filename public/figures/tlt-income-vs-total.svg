<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="配息向上、價格向下，合計落在零線之下">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); }
  .g { font-size:20px; fill:var(--ink); }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">領到的與賺到的，方向相反</text>

<line x1="60" y1="260" x2="900" y2="260" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="60" y="252">零</text>

<rect x="180" y="202" width="130" height="58" rx="6" fill="var(--accent)"/>
<text class="g" x="180" y="184">配息 +2.9%</text>

<rect x="420" y="260" width="130" height="150" rx="6" fill="var(--warn)"/>
<text class="g" x="420" y="440">價格 −7.5%</text>

<rect x="680" y="260" width="130" height="92" rx="6" fill="var(--ink)" opacity="0.75"/>
<text class="g" x="680" y="382">合計 −4.6%</text>
<line x1="330" y1="230" x2="400" y2="230" stroke="var(--grey)" stroke-dasharray="4 4"/>
<line x1="570" y1="330" x2="660" y2="330" stroke="var(--grey)" stroke-dasharray="4 4"/>

<text class="c" x="60" y="500">兩個數字都對，只有加起來那個是成績</text>
</svg>
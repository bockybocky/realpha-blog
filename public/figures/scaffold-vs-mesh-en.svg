<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A tree branching down from a single center on the left, and a mesh of five fully connected points on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="480" y="54" text-anchor="middle" font-size="27" fill="var(--ink)">Two shapes of multi-agent setup</text>

<line x1="480" y1="100" x2="480" y2="440" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

<text x="250" y="110" text-anchor="middle" font-size="20" fill="var(--dim)">Coordinator assigns work</text>
<line x1="250" y1="200" x2="150" y2="320" stroke="var(--grey)" stroke-width="2"/>
<line x1="250" y1="200" x2="250" y2="320" stroke="var(--grey)" stroke-width="2"/>
<line x1="250" y1="200" x2="350" y2="320" stroke="var(--grey)" stroke-width="2"/>
<circle cx="250" cy="170" r="30" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<circle cx="150" cy="345" r="25" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<circle cx="250" cy="345" r="25" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<circle cx="350" cy="345" r="25" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<text x="250" y="410" text-anchor="middle" font-size="16" fill="var(--dim)">Ask back  or  guess</text>

<text x="710" y="110" text-anchor="middle" font-size="20" fill="var(--accent)">Agents message each other</text>
<line x1="710" y1="185" x2="824" y2="268" stroke="var(--accent)" stroke-width="2"/>
<line x1="710" y1="185" x2="780" y2="400" stroke="var(--accent)" stroke-width="2"/>
<line x1="710" y1="185" x2="640" y2="400" stroke="var(--accent)" stroke-width="2"/>
<line x1="710" y1="185" x2="596" y2="268" stroke="var(--accent)" stroke-width="2"/>
<line x1="824" y1="268" x2="780" y2="400" stroke="var(--accent)" stroke-width="2"/>
<line x1="824" y1="268" x2="640" y2="400" stroke="var(--accent)" stroke-width="2"/>
<line x1="824" y1="268" x2="596" y2="268" stroke="var(--accent)" stroke-width="2"/>
<line x1="780" y1="400" x2="640" y2="400" stroke="var(--accent)" stroke-width="2"/>
<line x1="780" y1="400" x2="596" y2="268" stroke="var(--accent)" stroke-width="2"/>
<line x1="640" y1="400" x2="596" y2="268" stroke="var(--accent)" stroke-width="2"/>
<circle cx="710" cy="185" r="25" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="824" cy="268" r="25" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="780" cy="400" r="25" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="640" cy="400" r="25" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="596" cy="268" r="25" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>

<text x="480" y="510" text-anchor="middle" font-size="22" fill="var(--ink)">Less structure, more talk</text>
</svg>
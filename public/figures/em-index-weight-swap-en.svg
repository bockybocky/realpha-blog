<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Between two dates two lines cross: China falls from the top to nineteen percent and Taiwan rises from below to twenty-seven point three, swapping places.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="56" font-size="27" fill="var(--ink)">Emerging markets has a new largest member</text>

  <text x="240" y="112" font-size="19" fill="var(--dim)" text-anchor="middle">Five years ago</text>
  <text x="760" y="112" font-size="19" fill="var(--dim)" text-anchor="middle">Now</text>

  <line x1="240" y1="140" x2="240" y2="440" stroke="var(--line)" stroke-width="2"/>
  <line x1="760" y1="140" x2="760" y2="440" stroke="var(--line)" stroke-width="2"/>

  <text x="70" y="168" font-size="15" fill="var(--dim)">Higher weight</text>
  <text x="70" y="436" font-size="15" fill="var(--dim)">Lower weight</text>

  <line x1="240" y1="180" x2="760" y2="340" stroke="var(--grey)" stroke-width="3"/>
  <line x1="240" y1="400" x2="760" y2="190" stroke="var(--accent)" stroke-width="3"/>

  <circle cx="240" cy="180" r="6" fill="var(--grey)"/>
  <circle cx="760" cy="340" r="6" fill="var(--grey)"/>
  <circle cx="240" cy="400" r="6" fill="var(--accent)"/>
  <circle cx="760" cy="190" r="6" fill="var(--accent)"/>

  <text x="222" y="176" font-size="19" fill="var(--ink)" text-anchor="end">China</text>
  <text x="222" y="200" font-size="15" fill="var(--dim)" text-anchor="end">Largest</text>
  <text x="222" y="406" font-size="19" fill="var(--ink)" text-anchor="end">Taiwan</text>

  <text x="782" y="196" font-size="20" fill="var(--accent)">Taiwan 27.3%</text>
  <text x="782" y="346" font-size="20" fill="var(--dim)">China 19%</text>

  <text x="480" y="502" font-size="22" fill="var(--ink)" text-anchor="middle">The name is unchanged; what you own is not</text>
</svg>
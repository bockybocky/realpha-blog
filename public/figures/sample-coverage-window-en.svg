<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The left board has colour in one corner square only and the right board is fully coloured, showing the gap in sample coverage.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .cell { fill:var(--card); stroke:var(--line); stroke-width:2; }
    .on { fill:var(--accent); stroke:var(--line); stroke-width:2; }
</style>
<text class="t" x="60" y="62">Do the people in this study look like you</text>
<text class="g" x="90" y="118">Five healthy college students</text>
<g>
<rect class="on" x="90" y="140" width="56" height="56"/>
<rect class="cell" x="146" y="140" width="56" height="56"/><rect class="cell" x="202" y="140" width="56" height="56"/><rect class="cell" x="258" y="140" width="56" height="56"/><rect class="cell" x="314" y="140" width="56" height="56"/>

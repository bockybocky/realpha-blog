<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="風險那一欄兩列都填滿，報酬那一欄只有上面一列填滿，下面一列是空框">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">風險平均分，報酬不平均</text>
<text class="g" x="400" y="128">風險</text>
<text class="g" x="700" y="128">報酬</text>
<text class="g" x="60" y="210">拿到 ＄2,000 萬的人</text>
<rect x="380" y="166" width="220" height="70" fill="var(--warn)"/>
<rect x="680" y="166" width="220" height="70" fill="var(--accent)"/>
<text class="s" x="680" y="258">＄2,000 萬</text>
<text class="g" x="60" y="350">拿到零的人</text>
<rect x="380" y="306" width="220" height="70" fill="var(--warn)"/>
<rect x="680" y="306" width="220" height="70" fill="none" stroke="var(--line)" stroke-width="3"/>
<text class="s" x="680" y="398">零</text>
<text class="s" x="60" y="398">只有勞動力</text>
<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="60" y="492">同一個風險，只有一邊收得到價</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three bars of different lengths sit on a year axis: the top leader bar is filled solid from 2026 through 2029, followed by a pale segment and a dashed outline, while two arrows curve from its right end down to the left toward two much shorter bars below.">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .w { font-size:16px; fill:var(--page); }
  </style>

  <text class="t" x="60" y="58">Sold out pushes buyers down the list</text>

  <line x1="200" y1="500" x2="920" y2="500" stroke="var(--line)" stroke-width="2"/>
  <line x1="200" y1="494" x2="200" y2="506" stroke="var(--line)" stroke-width="2"/>
  <line x1="340" y1="494" x2="340" y2="506" stroke="var(--line)" stroke-width="2"/>
  <line x1="480" y1="494" x2="480" y2="506" stroke="var(--line)" stroke-width="2"/>
  <line x1="620" y1="494" x2="620" y2="506" stroke="var(--line)" stroke-width="2"/>
  <line x1="760" y1="494" x2="760" y2="506" stroke="var(--line)" stroke-width="2"/>
  <line x1="900" y1="494" x2="900" y2="506" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="200" y="530" text-anchor="middle">2026</text>
  <text class="b" x="340" y="530" text-anchor="middle">2027</text>
  <text class="b" x="480" y="530" text-anchor="middle">2028</text>
  <text class="b" x="620" y="530" text-anchor="middle">2029</text>
  <text class="b" x="760" y="530" text-anchor="middle">2030</text>
  <text class="b" x="900" y="530" text-anchor="middle">2031</text>

  <text class="g" x="190" y="162" text-anchor="end">Optics No.1</text>
  <rect x="200" y="132" width="420" height="46" rx="4" fill="var(--accent)"/>
  <text class="w" x="410" y="162" text-anchor="middle">Sold out</text>
  <rect x="620" y="132" width="140" height="46" fill="var(--accent)" opacity="0.35"/>
  <text class="b" x="690" y="162" text-anchor="middle">Talks</text>
  <rect x="760" y="132" width="140" height="46" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="b" x="830" y="162" text-anchor="middle">Prepay</text>

  <path d="M 626 184 C 600 230 545 245 490 276" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <polygon points="490,278 474.7,276.9 480.3,266.3" fill="var(--accent)"/>
  <path d="M 604 184 C 560 280 500 320 436 364" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <polygon points="440,366 426.6,363.9 433.4,354.1" fill="var(--accent)"/>
  <text class="b" x="566" y="238">No slot</text>

  <text class="g" x="190" y="312" text-anchor="end">Second</text>
  <rect x="200" y="282" width="280" height="46" rx="4" fill="var(--grey)"/>
  <text class="b" x="500" y="312">New LTA</text>

  <text class="g" x="190" y="402" text-anchor="end">Third</text>
  <rect x="200" y="372" width="215" height="46" rx="4" fill="var(--grey)" opacity="0.7"/>
  <text class="b" x="435" y="402">New qual</text>
</svg>
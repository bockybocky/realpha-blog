<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩個漏斗對比，左邊有東西落下，右邊什麼都沒落下">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="76">同一個強烈看法，兩種落地結果</text>

<text class="g" x="150" y="130" fill="var(--accent)">看法</text>
<path d="M 100 150 L 400 150 L 290 260 L 210 260 Z" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="180" cy="320" r="10" fill="var(--accent)"/>
<circle cx="250" cy="330" r="10" fill="var(--accent)"/>
<rect x="100" y="360" width="90" height="70" rx="6" fill="var(--accent)" opacity="0.3" stroke="var(--accent)"/>
<rect x="205" y="360" width="90" height="70" rx="6" fill="var(--accent)" opacity="0.3" stroke="var(--accent)"/>
<rect x="310" y="360" width="90" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="118" y="456">部位</text>
<text class="b" x="223" y="456">時間</text>
<text class="b" x="328" y="456">對話</text>
<text class="g" x="150" y="506" fill="var(--accent)">判斷</text>

<line x1="480" y1="120" x2="480" y2="500" stroke="var(--line)" stroke-width="2"/>

<text class="g" x="610" y="130" fill="var(--warn)">看法</text>
<path d="M 560 150 L 860 150 L 750 260 L 670 260 Z" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<rect x="560" y="360" width="90" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="665" y="360" width="90" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="770" y="360" width="90" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="578" y="456">部位</text>
<text class="b" x="683" y="456">時間</text>
<text class="b" x="788" y="456">對話</text>
<text class="g" x="610" y="506" fill="var(--warn)">情緒</text>

<text class="c" x="60" y="546">差別不在講得多用力，在有沒有東西落下來</text>
</svg>
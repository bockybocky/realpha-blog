<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩個方向相反的漏斗，左邊由窄擴散成寬，右邊由寬收攏成窄">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">兩種相反的用法</text>
<line x1="480" y1="120" x2="480" y2="430" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>
<polygon points="100,272 100,288 370,150 370,410" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="235" y="132" font-size="20" fill="var(--accent)" text-anchor="middle">寫程式：擴張</text>
<text x="40" y="286" font-size="15" fill="var(--dim)">一句話</text>
<text x="378" y="286" font-size="15" fill="var(--ink)">百萬行</text>
<polygon points="590,150 590,410 860,288 860,272" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="725" y="132" font-size="20" fill="var(--dim)" text-anchor="middle">多數白領：壓縮</text>
<text x="504" y="286" font-size="15" fill="var(--ink)">四十頁</text>
<text x="868" y="286" font-size="15" fill="var(--dim)">五條</text>
<text x="480" y="492" font-size="22" fill="var(--ink)" text-anchor="middle">我們從最不像的那一個，外推所有人的未來</text>
</svg>
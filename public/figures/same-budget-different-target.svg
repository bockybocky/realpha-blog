<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根預算柱高度接近，但目標高度差很大，多出的一億指向車手">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="60" y="68">同樣的預算，不一樣的期待</text>

<line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="3"/>

<rect x="140" y="250" width="150" height="180" rx="8" fill="var(--accent)" opacity="0.85"/>
<rect x="140" y="196" width="150" height="48" rx="8" fill="var(--warn)"/>
<text class="t b" x="140" y="462">賓士</text>
<text class="t b" x="300" y="226">多花一億</text>
<text class="t g" x="140" y="160">目標：冠軍</text>

<rect x="620" y="250" width="150" height="180" rx="8" fill="var(--accent)" opacity="0.85"/>
<text class="t b" x="620" y="462">威廉斯</text>
<text class="t g" x="620" y="300" fill="var(--page)" opacity="0">x</text>
<text class="t g" x="620" y="226">目標：前六</text>

<path d="M460 220 L600 220" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 8"/>
<text class="t b" x="430" y="186">一億去哪</text>
<rect x="400" y="300" width="180" height="60" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="420" y="338">明星車手</text>
<rect x="400" y="378" width="180" height="60" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="420" y="416">付費車手</text>
<text class="t b" x="400" y="462">贏那場的是他</text>

<text class="t c" x="60" y="518">其中一個人想錯了：同樣的錢，兩個不同的目標</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A flat unchanging dashed line on top, two bars below it, one short and one tall, differing only in height">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink)}
.ga{font-size:19px;fill:var(--accent)}
.b{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">Same story, more of it</text>
<line x1="80" y1="118" x2="880" y2="118" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 6"/>
<text class="b" x="80" y="105">Deficits · Demographics · Gridlock: unchanged</text>
<line x1="140" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>
<rect x="250" y="270" width="150" height="180" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="325" y="365" text-anchor="middle">$18T</text>
<text class="b" x="325" y="478" text-anchor="middle">Ten years ago</text>
<rect x="600" y="140" width="150" height="310" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="ga" x="675" y="300" text-anchor="middle">$31T</text>
<text class="b" x="675" y="478" text-anchor="middle">Today</text>
<text class="c" x="60" y="522">The stock changed, not the news</text>
</svg>
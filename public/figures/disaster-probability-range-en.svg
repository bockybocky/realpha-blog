<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A 0 to 100% bar with the 30% to 60% range shaded, lying entirely far outside the safe zone at the far left.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="56" font-size="27" font-weight="700" fill="var(--ink)">Odds unclear, none of it safe</text>
<text x="100" y="134" font-size="20" font-weight="700" fill="var(--dim)">AI disaster odds, few years</text>
<rect x="100" y="250" width="760" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="250" width="46" height="40" rx="6" fill="var(--accent)" opacity="0.35"/>
<text x="100" y="228" font-size="16" font-weight="700" fill="var(--accent)">Safe</text>
<rect x="328" y="250" width="228" height="40" fill="var(--warn)" opacity="0.35"/>
<line x1="328" y1="236" x2="328" y2="304" stroke="var(--warn)" stroke-width="4"/>
<line x1="556" y1="236" x2="556" y2="304" stroke="var(--warn)" stroke-width="4"/>
<text x="328" y="226" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">30%</text>
<text x="556" y="226" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">60%</text>
<text x="442" y="226" font-size="16" text-anchor="middle" fill="var(--dim)">Unsure</text>
<text x="100" y="322" font-size="15" text-anchor="middle" fill="var(--dim)">0%</text>
<text x="290" y="322" font-size="15" text-anchor="middle" fill="var(--dim)">25%</text>
<text x="480" y="322" font-size="15" text-anchor="middle" fill="var(--dim)">50%</text>
<text x="670" y="322" font-size="15" text-anchor="middle" fill="var(--dim)">75%</text>
<text x="860" y="322" font-size="15" text-anchor="middle" fill="var(--dim)">100%</text>
<line x1="150" y1="372" x2="324" y2="372" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="237" y="398" font-size="15" text-anchor="middle" fill="var(--dim)">Far</text>
<text x="480" y="470" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">Whether 30% or 60%, neither is safe</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The original plan moves straight along the dashed line, while the actual path bends away after two rewrites, widening the distance on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="72">Rewrite</text>
  <line x1="110" y1="400" x2="840" y2="180" stroke="var(--accent)" stroke-width="3" stroke-dasharray="9 8"/>
  <text class="g" x="700" y="165" fill="var(--accent)">Original script</text>
  <polyline points="110,400 300,340 320,400 540,355 560,420 840,430" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="310" cy="370" r="9" fill="var(--warn)"/>
  <circle cx="550" cy="388" r="9" fill="var(--warn)"/>
  <text class="b" x="258" y="455">Feels off</text>
  <text class="b" x="498" y="475">Event hits</text>
  <text class="g" x="700" y="470" fill="var(--warn)">Actual path</text>
  <path d="M880 180 L895 180 L895 430 L880 430" fill="none" stroke="var(--dim)" stroke-width="2"/>
  <text class="b" x="760" y="310">Gap</text>
  <text class="c" x="60" y="505">Slow down when noise rises</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One long bar cut into six segments of very different widths, the narrowest at the far right called out by a leader line">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--ink); }
.d { font-size:16px; fill:var(--dim); }
.s { font-size:16px; fill:var(--ink); }
.c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">Most of the fall is not the company</text>
<text class="g" x="120" y="204">What made this drop</text>
<rect x="120" y="230" width="240" height="90" fill="var(--card)" stroke="var(--grey)" stroke-width="2.5"/>
<rect x="360" y="230" width="170" height="90" fill="var(--card)" stroke="var(--grey)" stroke-width="2.5"/>
<rect x="530" y="230" width="130" height="90" fill="var(--card)" stroke="var(--grey)" stroke-width="2.5"/>
<rect x="660" y="230" width="110" height="90" fill="var(--card)" stroke="var(--grey)" stroke-width="2.5"/>
<rect x="770" y="230" width="80" height="90" fill="var(--card)" stroke="var(--grey)" stroke-width="2.5"/>
<rect x="850" y="230" width="30" height="90" fill="var(--warn)"/>
<text class="s" x="240" y="282" text-anchor="middle">Conversion selling</text>
<text class="s" x="445" y="282" text-anchor="middle">Sector pullback</text>
<text class="s" x="595" y="282" text-anchor="middle">False report</text>
<text class="s" x="715" y="282" text-anchor="middle">Shorting</text>
<text class="s" x="810" y="282" text-anchor="middle">Warrants</text>
<line x1="865" y1="330" x2="865" y2="376" stroke="var(--warn)" stroke-width="2.5"/>
<text class="g" x="865" y="402" text-anchor="middle" fill="var(--warn)">Fundamentals</text>
<text class="c" x="60" y="470">Look for non-fundamental causes first</text>
</svg>
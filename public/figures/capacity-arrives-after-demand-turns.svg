<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="需求曲線先升後轉彎，產能曲線延後才爬上來並衝過需求，中間空出一塊蓋過頭的區域">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="60">機台裝好的時候，需求可能已經轉彎</text>

  <line x1="110" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
  <line x1="110" y1="110" x2="110" y2="400" stroke="var(--line)" stroke-width="2"/>
  <text class="d" x="860" y="430">時間</text>

  <path d="M 110 380 C 260 380 300 150 440 140 C 560 132 640 240 880 320" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <path d="M 110 392 C 300 392 340 386 420 360 C 560 314 640 170 880 130" fill="none" stroke="var(--warn)" stroke-width="5" stroke-dasharray="14 10"/>

  <text class="g" x="300" y="200" fill="var(--accent)">需求</text>
  <text class="d" x="300" y="226">缺的時候一起下單</text>

  <text class="g" x="700" y="300" fill="var(--warn)">產能</text>
  <text class="d" x="700" y="326">機台慢慢才到位</text>

  <circle cx="548" cy="238" r="12" fill="var(--ink)"/>
  <text class="d" x="500" y="276">在這裡交叉</text>

  <text class="d" x="700" y="180">蓋過頭</text>

  <text class="c" x="60" y="490">所以要先問：這一波擴產要多久才到位</text>
</svg>
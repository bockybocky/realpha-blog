<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一根幾乎貼地的矮柱旁邊是一根高到頂的柱子">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .h1{font-size:27px;font-weight:700;fill:var(--ink);}
    .cap{font-size:19px;font-weight:700;fill:var(--dim);}
    .capA{font-size:19px;font-weight:700;fill:var(--accent);}
    .big{font-size:34px;font-weight:700;fill:var(--ink);}
    .unit{font-size:16px;fill:var(--dim);}
    .kick{font-size:22px;font-weight:700;fill:var(--ink);}
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <g class="t">
    <text x="480" y="48" class="h1" text-anchor="middle">九個月，付大錢的客戶數</text>
    <line x1="80" y1="420" x2="890" y2="420" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="290" y="380" class="cap" text-anchor="middle">2025 年 12 月</text>
    <rect x="220" y="392" width="140" height="28" rx="3" fill="var(--grey)"/>
    <text x="290" y="470" class="big" text-anchor="middle">1,500 家</text>
    <text x="660" y="110" class="capA" text-anchor="middle">2026 年 9 月</text>
    <rect x="590" y="120" width="140" height="300" rx="3" fill="var(--accent)"/>
    <text x="660" y="470" class="big" text-anchor="middle">11,900 家</text>
    <text x="480" y="512" class="kick" text-anchor="middle">一年前問的還是怎麼收費</text>
  </g>
</svg>
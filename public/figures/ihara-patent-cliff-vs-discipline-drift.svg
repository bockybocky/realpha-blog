<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="灰線在專利到期處垂直斷崖落底，藍線沿組織紀律鬆動緩慢下滑，兩種優勢的衰退形狀完全不同">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">兩種優勢，兩種衰退的形狀</text>

  <line x1="120" y1="140" x2="120" y2="420" stroke="var(--line)" stroke-width="2"/>
  <line x1="120" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

  <polyline points="120,180 540,180 540,410 880,410" fill="none" stroke="var(--grey)" stroke-width="5"/>
  <text class="t" x="300" y="162" font-size="20" font-weight="700" fill="var(--dim)">規格型</text>
  <text class="t" x="552" y="300" font-size="16" fill="var(--dim)">專利到期</text>

  <polyline points="120,220 320,235 520,265 700,310 880,370" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <text class="t" x="140" y="248" font-size="20" font-weight="700" fill="var(--accent)">承諾型</text>
  <text class="t" x="700" y="296" font-size="16" fill="var(--accent)" text-anchor="middle">人員流動</text>
  <text class="t" x="860" y="356" font-size="16" fill="var(--accent)" text-anchor="middle">交付鬆掉</text>

  <text class="t" x="120" y="470" font-size="16" fill="var(--dim)">時間</text>
  <text class="t" x="60" y="125" font-size="16" fill="var(--dim)">優勢</text>
</svg>
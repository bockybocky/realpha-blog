<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩排卡片，上排底下沒有掛鉤，下排每張卡片底下都有一個掛鉤">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:600;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:600;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66">把一段話分成兩堆</text>
<text class="g" x="60" y="188" fill="var(--dim)">沒有把手</text>
<text class="b" x="60" y="216">＝立場</text>
<rect x="280" y="150" width="180" height="80" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="370" y="197" text-anchor="middle">以駕駛為中心</text>
<rect x="480" y="150" width="180" height="80" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="570" y="197" text-anchor="middle">駕馭樂趣</text>
<rect x="680" y="150" width="180" height="80" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="770" y="197" text-anchor="middle">品牌 DNA</text>
<text class="g" x="60" y="358" fill="var(--accent)">有把手</text>
<text class="b" x="60" y="386">＝資訊</text>
<rect x="280" y="320" width="180" height="80" rx="10" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="370" y="367" text-anchor="middle">九成八回收</text>
<rect x="480" y="320" width="180" height="80" rx="10" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="570" y="367" text-anchor="middle">停住不點頭</text>
<rect x="680" y="320" width="180" height="80" rx="10" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="770" y="367" text-anchor="middle">每秒一千次</text>
<path d="M356,400 v22 a14,14 0 0 0 28,0" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M556,400 v22 a14,14 0 0 0 28,0" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M756,400 v22 a14,14 0 0 0 28,0" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="c" x="480" y="500" text-anchor="middle">有把手的那堆，才是資訊</text>
</svg>
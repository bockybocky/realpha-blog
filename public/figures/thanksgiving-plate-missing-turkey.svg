<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="圓盤上配菜齊全，中央火雞的位置空著畫成虛線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .d { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700">配菜齊了，火雞沒來</text>
<text class="d" x="60" y="94" font-size="16">盤子＝氣候政策組合</text>

<circle cx="400" cy="320" r="190" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<circle cx="400" cy="226" r="62" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 9"/>
<text class="t" x="400" y="234" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">空位</text>

<circle cx="300" cy="400" r="58" fill="var(--accent)"/>
<circle cx="430" cy="424" r="48" fill="var(--accent)"/>
<circle cx="520" cy="340" r="52" fill="var(--accent)"/>
<text class="t" x="300" y="408" font-size="16" fill="var(--page)" text-anchor="middle">輸電</text>
<text class="t" x="430" y="430" font-size="16" fill="var(--page)" text-anchor="middle">地熱</text>
<text class="t" x="520" y="346" font-size="16" fill="var(--page)" text-anchor="middle">核能</text>

<text class="t" x="650" y="212" font-size="19" font-weight="700" fill="var(--warn)">火雞</text>
<text class="d" x="650" y="242" font-size="16">直接管排放的政策</text>
<text class="d" x="650" y="268" font-size="16">聯邦層級現在沒有</text>
<text class="t" x="650" y="352" font-size="19" font-weight="700">配菜</text>
<text class="d" x="650" y="382" font-size="16">蓋與部署的障礙</text>
<text class="d" x="650" y="408" font-size="16">法案處理的是這些</text>

<text class="t" x="60" y="534" font-size="22" font-weight="700">選擇是馬鈴薯泥或餓肚子</text>
</svg>
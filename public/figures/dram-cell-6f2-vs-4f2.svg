<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊二乘三的六格單元與右邊二乘二的四格單元並排，右邊上方虛線框是被省掉的一排，面積少三分之一">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="40" y="58" font-size="27" fill="var(--ink)">一個記憶單元佔多大</text>

<rect x="150" y="140" width="200" height="300" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<line x1="250" y1="140" x2="250" y2="440" stroke="var(--grey)" stroke-width="2"/>
<line x1="150" y1="240" x2="350" y2="240" stroke="var(--grey)" stroke-width="2"/>
<line x1="150" y1="340" x2="350" y2="340" stroke="var(--grey)" stroke-width="2"/>
<text x="250" y="478" font-size="20" fill="var(--dim)" text-anchor="middle">6F²　2 × 3</text>

<rect x="610" y="240" width="200" height="200" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<line x1="710" y1="240" x2="710" y2="440" stroke="var(--accent)" stroke-width="2"/>
<line x1="610" y1="340" x2="810" y2="340" stroke="var(--accent)" stroke-width="2"/>
<rect x="610" y="140" width="200" height="100" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
<text x="710" y="196" font-size="19" fill="var(--dim)" text-anchor="middle">省掉這一排</text>
<text x="710" y="478" font-size="20" fill="var(--accent)" text-anchor="middle">4F²　2 × 2</text>

<line x1="118" y1="140" x2="118" y2="240" stroke="var(--dim)" stroke-width="2"/>
<text x="100" y="196" font-size="16" fill="var(--dim)" text-anchor="end">F</text>

<text x="480" y="300" font-size="22" fill="var(--ink)" text-anchor="middle">面積少三分之一</text>
</svg>
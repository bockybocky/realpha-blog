<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="價格階梯一級一級爬高，但車子大小沒變，旁邊是一個更大的虛線車框">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">同一台車，爬四級價格</text>
  <text class="t" x="60" y="100" font-size="16" fill="var(--dim)">比亞迪海鷗（美元）</text>

  <rect x="90" y="420" width="150" height="60" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="165" y="458" font-size="19" fill="var(--dim)" text-anchor="middle">成本 7,000</text>
  <rect x="112" y="386" width="106" height="26" rx="9" fill="var(--grey)"/>

  <rect x="256" y="376" width="150" height="104" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="331" y="414" font-size="19" fill="var(--ink)" text-anchor="middle">中國</text>
  <text class="t" x="331" y="444" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">8,500</text>
  <rect x="278" y="342" width="106" height="26" rx="9" fill="var(--grey)"/>

  <rect x="422" y="288" width="150" height="192" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="497" y="326" font-size="19" fill="var(--ink)" text-anchor="middle">墨西哥</text>
  <text class="t" x="497" y="356" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">20,000</text>
  <rect x="444" y="254" width="106" height="26" rx="9" fill="var(--grey)"/>

  <rect x="588" y="236" width="150" height="244" fill="var(--accent)"/>
  <text class="t" x="663" y="274" font-size="19" fill="var(--page)" text-anchor="middle">符合美規</text>
  <text class="t" x="663" y="304" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">25,000</text>
  <rect x="610" y="202" width="106" height="26" rx="9" fill="var(--accent)"/>

  <rect x="782" y="150" width="150" height="78" rx="14" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
  <text class="t" x="857" y="196" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">美國買家要的</text>
  <text class="t" x="857" y="258" font-size="16" fill="var(--warn)" text-anchor="middle">更大、更遠</text>

  <text class="t" x="60" y="528" font-size="22" font-weight="700" fill="var(--ink)">價格爬上去，車沒有變大</text>
</svg>
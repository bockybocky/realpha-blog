<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="橫軸零件難做、縱軸定價權的兩軸圖，樞紐廠直覺位置在右上，實際掉到右下，原因是買方只有一家、會養第二家、會自己做">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">難做，不等於能多收錢</text>
<line x1="140" y1="110" x2="140" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="460" x2="850" y2="460" stroke="var(--line)" stroke-width="2"/>
<text x="130" y="124" text-anchor="end" font-size="16" fill="var(--dim)">定價權</text>
<text x="850" y="490" text-anchor="end" font-size="16" fill="var(--dim)">零件難做 →</text>
<circle cx="720" cy="160" r="20" fill="none" stroke="var(--grey)" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="752" y="167" font-size="19" fill="var(--dim)">直覺</text>
<line x1="720" y1="184" x2="720" y2="366" stroke="var(--grey)" stroke-width="2.5" stroke-dasharray="7 6"/>
<polygon points="711,364 729,364 720,379" fill="var(--grey)"/>
<circle cx="720" cy="400" r="20" fill="var(--warn)"/>
<text x="752" y="407" font-size="19" font-weight="700" fill="var(--warn)">樞紐廠</text>
<text x="700" y="268" text-anchor="end" font-size="19" font-weight="700" fill="var(--ink)">買方一家</text>
<text x="700" y="296" text-anchor="end" font-size="16" fill="var(--dim)">養第二家</text>
<text x="700" y="322" text-anchor="end" font-size="16" fill="var(--dim)">自己做</text>
<text x="480" y="535" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">定價權在買方手上</text>
</svg>
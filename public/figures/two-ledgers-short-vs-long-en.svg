<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The top row has five short bars, each struck through, while the bottom row has one long bar spanning the whole timeline.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
    .p { fill:var(--page); }
</style>
<text x="60" y="52" class="t">Notes: 2 lives</text>
<text x="60" y="198" class="g">Signals</text>
<text x="60" y="222" class="d">Stale fast</text>
<rect x="230" y="180" width="100" height="36" fill="var(--grey)"/>
<rect x="360" y="180" width="90" height="36" fill="var(--grey)"/>
<rect x="480" y="180" width="110" height="36" fill="var(--grey)"/>
<rect x="620" y="180" width="80" height="36" fill="var(--grey)"/>
<rect x="730" y="180" width="100" height="36" fill="var(--grey)"/>
<line x1="222" y1="198" x2="338" y2="198" stroke="var(--warn)" stroke-width="3"/>
<line x1="352" y1="198" x2="458" y2="198" stroke="var(--warn)" stroke-width="3"/>
<line x1="472" y1="198" x2="598" y2="198" stroke="var(--warn)" stroke-width="3"/>
<line x1="612" y1="198" x2="708" y2="198" stroke="var(--warn)" stroke-width="3"/>
<line x1="722" y1="198" x2="838" y2="198" stroke="var(--warn)" stroke-width="3"/>
<text x="60" y="318" class="g a">Markers</text>
<text x="60" y="342" class="d">Long</text>
<rect x="230" y="300" width="640" height="40" fill="var(--accent)"/>
<text x="550" y="327" class="b p" text-anchor="middle">LTA term·capacity·price</text>
<line x1="230" y1="395" x2="870" y2="395" stroke="var(--line)" stroke-width="2"/>
<text x="870" y="420" class="d" text-anchor="end">Time →</text>
<text x="480" y="480" class="c" text-anchor="middle">Cut short, keep long</text>
</svg>
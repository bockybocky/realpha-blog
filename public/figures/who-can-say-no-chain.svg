<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="授權鏈上只有一道閘門能擋，下方有力量壓過來，上方有虛線旁路直接繞過閘門">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">鏈上誰能說不</text>
<rect x="70" y="250" width="180" height="90" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="92" y="292">財政部</text>
<text class="b" x="92" y="320">要做</text>
<path d="M250 295 L400 295" stroke="var(--accent)" stroke-width="4" marker-end="url(#a7)"/>
<rect x="400" y="200" width="30" height="190" fill="var(--warn)" opacity="0.25"/>
<rect x="400" y="200" width="30" height="190" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="372" y="180">聯準會</text>
<text class="b" x="340" y="425">它是財政部的銀行</text>
<text class="b" x="340" y="449">理論上可以關上</text>
<path d="M430 295 L700 295" stroke="var(--accent)" stroke-width="4" marker-end="url(#a7)"/>
<rect x="700" y="250" width="190" height="90" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="722" y="292">錢到帳</text>
<text class="b" x="722" y="320">黃金重估</text>
<path d="M560 520 C520 480 470 440 430 400" fill="none" stroke="var(--warn)" stroke-width="4" marker-end="url(#a7w)"/>
<text class="b" x="560" y="528">國會與行政部門壓過來</text>
<path d="M150 230 C300 120 620 120 790 240" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a7)"/>
<text class="b" x="400" y="112">穩定幣：繞過銀行體系</text>
<defs>
<marker id="a7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
<marker id="a7w" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker>
</defs>
<text class="c" x="60" y="110">擋得住多久才是問題</text>
</svg>
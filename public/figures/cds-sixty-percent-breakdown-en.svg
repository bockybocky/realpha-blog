<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three descending horizontal bars, falling from about 60% to about 50% and then lower still.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">One quote, three answers</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">Only the assumption moved, not the market</text>

<rect x="60" y="150" width="660" height="62" rx="6" fill="var(--grey)" opacity="0.35"/>
<rect x="60" y="150" width="660" height="62" rx="6" fill="none" stroke="var(--line)"/>
<text class="t" x="80" y="189" font-size="20" font-weight="700" fill="var(--ink)">60%</text>
<text class="t" x="150" y="189" font-size="16" fill="var(--dim)">Standard math: 40% recovery</text>

<rect x="60" y="246" width="550" height="62" rx="6" fill="var(--accent)" opacity="0.22"/>
<rect x="60" y="246" width="550" height="62" rx="6" fill="none" stroke="var(--accent)"/>
<text class="t" x="80" y="285" font-size="20" font-weight="700" fill="var(--ink)">~50%</text>
<text class="t" x="180" y="285" font-size="16" fill="var(--dim)">GPU recovery 20–25%</text>

<rect x="60" y="342" width="400" height="62" rx="6" fill="var(--accent)" opacity="0.4"/>
<rect x="60" y="342" width="400" height="62" rx="6" fill="none" stroke="var(--accent)"/>
<text class="t" x="80" y="381" font-size="20" font-weight="700" fill="var(--ink)">Lower</text>
<text class="t" x="180" y="381" font-size="16" fill="var(--dim)">Less the insurance premium</text>

<line x1="60" y1="432" x2="900" y2="432" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="478" font-size="22" font-weight="700" fill="var(--ink)">The quote is fact; recovery and premium are assumptions</text>
<text class="t" x="60" y="508" font-size="16" fill="var(--dim)">The number scares you; the inputs decide it</text>
</svg>
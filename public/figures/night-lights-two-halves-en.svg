<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The two halves of the peninsula differ in the density of bright points: the top half has one isolated point, the bottom half is covered in them.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .d { fill:var(--accent); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">One landmass, two levels of brightness</text>

  <rect x="330" y="96" width="300" height="190" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="330" y="296" width="300" height="200" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <circle class="d" cx="470" cy="196" r="7"/>
  <circle cx="470" cy="196" r="18" fill="var(--accent)" opacity="0.18"/>
  <line x1="630" y1="196" x2="742" y2="196" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="752" y="190" font-size="19" font-weight="700" fill="var(--ink)">The only light</text>
  <text class="t" x="752" y="214" font-size="15" fill="var(--dim)">Palace, wave pool</text>

  <g class="d">
    <circle cx="368" cy="326" r="4"/><circle cx="400" cy="344" r="5"/><circle cx="438" cy="318" r="4"/>
    <circle cx="470" cy="340" r="6"/><circle cx="506" cy="322" r="4"/><circle cx="540" cy="346" r="5"/>
    <circle cx="578" cy="328" r="4"/><circle cx="356" cy="372" r="5"/><circle cx="392" cy="392" r="4"/>
    <circle cx="428" cy="366" r="6"/><circle cx="462" cy="388" r="4"/><circle cx="498" cy="370" r="5"/>
    <circle cx="534" cy="392" r="4"/><circle cx="572" cy="372" r="5"/><circle cx="604" cy="390" r="4"/>
    <circle cx="362" cy="420" r="4"/><circle cx="398" cy="440" r="5"/><circle cx="436" cy="418" r="4"/>
    <circle cx="470" cy="442" r="7"/><circle cx="506" cy="420" r="4"/><circle cx="544" cy="440" r="5"/>
    <circle cx="582" cy="418" r="4"/><circle cx="380" cy="468" r="5"/><circle cx="420" cy="476" r="4"/>
    <circle cx="462" cy="466" r="4"/><circle cx="504" cy="474" r="5"/><circle cx="548" cy="464" r="4"/>
  </g>
  <line x1="330" y1="406" x2="218" y2="406" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="208" y="400" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="end">Lit all over</text>
  <text class="t" x="208" y="424" font-size="15" fill="var(--dim)" text-anchor="end">No waiting on official data</text>

  <text class="t" x="480" y="536" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Institutions, visible from space</text>
</svg>
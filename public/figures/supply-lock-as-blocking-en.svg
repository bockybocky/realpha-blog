<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The laser supply pool flows entirely to Big Player A, while the dashed arrows toward Rivals B and C are crossed out, showing buying turning into blocking.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<defs>
<marker id="f8a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
</defs>
<text x="60" y="52" class="t">Lock = block</text>
<text x="300" y="52" class="d">(Inference only)</text>
<text x="205" y="132" class="g" text-anchor="middle">Lasers</text>
<rect x="80" y="150" width="250" height="270" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="125" cy="215" r="18" fill="var(--accent)"/><circle cx="178" cy="215" r="18" fill="var(--accent)"/><circle cx="231" cy="215" r="18" fill="var(--accent)"/><circle cx="284" cy="215" r="18" fill="var(--accent)"/>
<circle cx="125" cy="285" r="18" fill="var(--accent)"/><circle cx="178" cy="285" r="18" fill="var(--accent)"/><circle cx="231" cy="285" r="18" fill="var(--accent)"/><circle cx="284" cy="285" r="18" fill="var(--accent)"/>
<circle cx="125" cy="355" r="18" fill="var(--accent)"/><circle cx="178" cy="355" r="18" fill="var(--accent)"/><circle cx="231" cy="355" r="18" fill="var(--accent)"/><circle cx="284" cy="355" r="18" fill="var(--accent)"/>
<line x1="345" y1="185" x2="585" y2="185" stroke="var(--accent)" stroke-width="8" marker-end="url(#f8a)"/>
<text x="465" y="170" class="b a" text-anchor="middle">Buys all</text>
<line x1="345" y1="300" x2="510" y2="300" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="345" y1="415" x2="510" y2="415" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M522 288 L546 312 M546 288 L522 312" stroke="var(--warn)" stroke-width="5"/>
<path d="M522 403 L546 427 M546 403 L522 427" stroke="var(--warn)" stroke-width="5"/>
<rect x="600" y="150" width="220" height="70" rx="8" fill="var(--accent)" opacity="0.15" stroke="var(--accent)" stroke-width="2"/>
<text x="710" y="180" class="g" text-anchor="middle">Big A</text>
<text x="710" y="206" class="b a" text-anchor="middle">Secured</text>
<rect x="600" y="265" width="220" height="70" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="710" y="295" class="g" text-anchor="middle">Rival B</text>
<text x="710" y="321" class="b w" text-anchor="middle">Stalled</text>
<rect x="600" y="380" width="220" height="70" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="710" y="410" class="g" text-anchor="middle">Rival C</text>
<text x="710" y="436" class="b w" text-anchor="middle">Stalled</text>
<text x="480" y="508" class="c" text-anchor="middle">Buying → blocking</text>
</svg>
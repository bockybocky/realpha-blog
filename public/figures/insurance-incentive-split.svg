<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="風險從做決定的一側跨線移到定價的一側，兩邊不是同一本帳">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56">兩本不同的帳</text>

  <line x1="490" y1="100" x2="490" y2="500" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 10"/>

  <rect x="60" y="120" width="380" height="300" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="86" y="160">做決定的人</text>
  <text class="b" x="86" y="200">便宜的地</text>
  <text class="b" x="86" y="230">便宜的電</text>
  <text class="b" x="86" y="260">便宜的工</text>
  <text class="b" x="86" y="304">都進我的損益表</text>
  <text class="b" x="86" y="376">洪水風險</text>

  <rect x="540" y="120" width="360" height="300" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="566" y="160">定價的人</text>
  <text class="b" x="566" y="200">保險公司</text>
  <text class="b" x="566" y="230">把機率算進保費</text>
  <text class="b" x="566" y="376">洪水風險</text>

  <path d="M240 388 L700 388" stroke="var(--warn)" stroke-width="4" fill="none"/>
  <path d="M700 388 l-16 -8 l0 16 z" fill="var(--warn)"/>
  <text class="b" x="330" y="366">風險移過去</text>

  <text class="c" x="60" y="510">定價的人不蓋廠，蓋廠的人不定價</text>
</svg>
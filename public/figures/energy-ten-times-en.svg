<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="First row ten orange blocks, second row one gray block, third row only a thin blue line">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; }
    .s { font-size:15px; }
    .b { font-size:16px; }
    .c { font-size:22px; font-weight:700; }
    .wn { fill:var(--warn); }
    .dm { fill:var(--dim); }
</style>
<text x="60" y="52" class="t">4B tokens a day each: where's the power?</text>
<text x="894" y="100" class="g wn" text-anchor="end">x10</text>
<text x="240" y="138" class="g" text-anchor="end">Needed</text>
<text x="240" y="160" class="s dm" text-anchor="end">30 terawatts</text>
<g fill="var(--warn)">
<rect x="260" y="110" width="64" height="56"/>
<rect x="330" y="110" width="64" height="56"/>
<rect x="400" y="110" width="64" height="56"/>
<rect x="470" y="110" width="64" height="56"/>
<rect x="540" y="110" width="64" height="56"/>
<rect x="610" y="110" width="64" height="56"/>
<rect x="680" y="110" width="64" height="56"/>
<rect x="750" y="110" width="64" height="56"/>
<rect x="820" y="110" width="64" height="56"/>
<rect x="890" y="110" width="4" height="56" fill-opacity="0"/>
</g>
<text x="240" y="264" class="g" text-anchor="end">Global energy production</text>
<rect x="260" y="230" width="64" height="56" fill="var(--grey)"/>
<text x="340" y="265" class="g">x1</text>
<text x="240" y="384" class="g" text-anchor="end">Planned data centers</text>
<rect x="260" y="350" width="3" height="56" fill="var(--accent)"/>
<text x="276" y="384" class="b dm">Doesn't even cover the rounding</text>
<text x="60" y="470" class="c">Energy is the final boss</text>
</svg>
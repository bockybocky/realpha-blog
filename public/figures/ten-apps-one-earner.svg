<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一排十個方格只有一個亮著，下面三叢稀疏的點">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">同一個小鎮，一排在做算命 App</text>

  <g stroke="var(--line)" stroke-width="2" fill="var(--card)">
    <rect x="120" y="130" width="64" height="64"/><rect x="196" y="130" width="64" height="64"/><rect x="272" y="130" width="64" height="64"/><rect x="348" y="130" width="64" height="64"/><rect x="424" y="130" width="64" height="64"/><rect x="500" y="130" width="64" height="64"/><rect x="576" y="130" width="64" height="64"/><rect x="652" y="130" width="64" height="64"/><rect x="728" y="130" width="64" height="64"/><rect x="804" y="130" width="64" height="64"/>
  </g>
  <rect x="576" y="130" width="64" height="64" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="608" y="220" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">賺錢的</text>

  <text class="t" x="120" y="300" font-size="20" font-weight="700" fill="var(--ink)">他們報出來的用戶數</text>
  <g fill="var(--grey)">
    <circle cx="160" cy="370" r="9"/><circle cx="190" cy="370" r="9"/><circle cx="220" cy="370" r="9"/>
    <circle cx="420" cy="370" r="9"/><circle cx="450" cy="370" r="9"/><circle cx="480" cy="370" r="9"/><circle cx="510" cy="370" r="9"/><circle cx="540" cy="370" r="9"/><circle cx="570" cy="370" r="9"/><circle cx="600" cy="370" r="9"/>
    <circle cx="700" cy="370" r="9"/><circle cx="730" cy="370" r="9"/><circle cx="760" cy="370" r="9"/><circle cx="790" cy="370" r="9"/><circle cx="820" cy="370" r="9"/><circle cx="850" cy="370" r="9"/><circle cx="880" cy="370" r="9"/><circle cx="700" cy="400" r="9"/>
  </g>
  <text class="t" x="190" y="430" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">3</text>
  <text class="t" x="510" y="430" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">7</text>
  <text class="t" x="790" y="440" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">8</text>

  <text class="t" x="480" y="500" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">需求薄到用個位數就數完</text>
</svg>
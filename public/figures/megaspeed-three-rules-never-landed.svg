<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條時間軸上三個規則方框懸在上方，每個往下的虛線都在碰到時間軸前被一個叉切斷；時間軸下方一條示意折線在三個日期前各拉出一個尖峰">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56">三份規則，沒有一份落到地上</text>
  <rect x="100" y="148" width="220" height="104" rx="10" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="g" x="210" y="188" text-anchor="middle">AI diffusion</text>
  <text class="n" x="210" y="216" text-anchor="middle">2025 年 5 月生效日</text>
  <text class="n" x="210" y="240" text-anchor="middle" fill="var(--warn)">沒有執行</text>
  <line x1="210" y1="258" x2="210" y2="288" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="196" y1="294" x2="224" y2="320" stroke="var(--warn)" stroke-width="5"/>
  <line x1="224" y1="294" x2="196" y2="320" stroke="var(--warn)" stroke-width="5"/>
  <rect x="370" y="148" width="220" height="104" rx="10" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="g" x="480" y="188" text-anchor="middle">馬泰草案</text>
  <text class="n" x="480" y="216" text-anchor="middle">2025 年六、七月見報</text>
  <text class="n" x="480" y="240" text-anchor="middle" fill="var(--warn)">外交壓力下作廢</text>
  <line x1="480" y1="258" x2="480" y2="288" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="466" y1="294" x2="494" y2="320" stroke="var(--warn)" stroke-width="5"/>
  <line x1="494" y1="294" x2="466" y2="320" stroke="var(--warn)" stroke-width="5"/>
  <rect x="640" y="148" width="220" height="104" rx="10" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="g" x="750" y="188" text-anchor="middle">全球替代版</text>
  <text class="n" x="750" y="216" text-anchor="middle">2026 年 3 月傳出</text>
  <text class="n" x="750" y="240" text-anchor="middle" fill="var(--warn)">送出後撤回</text>
  <line x1="750" y1="258" x2="750" y2="288" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="736" y1="294" x2="764" y2="320" stroke="var(--warn)" stroke-width="5"/>
  <line x1="764" y1="294" x2="736" y2="320" stroke="var(--warn)" stroke-width="5"/>
  <line x1="60" y1="340" x2="900" y2="340" stroke="var(--ink)" stroke-width="3"/>
  <text class="n" x="60" y="366" text-anchor="start">實際生效的那條線</text>
  <path d="M 70 470 L 160 430 L 210 398 L 250 462 L 430 440 L 480 404 L 520 464 L 700 446 L 750 410 L 800 466 L 900 458" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text class="n" x="60" y="506" text-anchor="start" fill="var(--accent)">出貨量：期限前衝高（示意，無刻度）</text>
  <text class="c" x="60" y="542">規則寫了三份，上路零份</text>
</svg>
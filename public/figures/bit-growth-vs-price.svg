<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根橫條，位元成長的短、價格的長，長度差約四到五倍">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">量沒跟上，價先翻倍</text>

<rect x="50" y="100" width="860" height="300" rx="14" fill="var(--card)"/>
<line x1="280" y1="140" x2="280" y2="370" stroke="var(--line)" stroke-width="2"/>

<text x="256" y="188" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="end">DRAM 位元成長</text>
<rect x="280" y="166" width="110" height="34" rx="4" fill="var(--grey)"/>
<text x="406" y="190" font-size="16" fill="var(--dim)">二十出頭個百分點</text>

<text x="256" y="258" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="end">NAND 位元成長</text>
<rect x="280" y="236" width="125" height="34" rx="4" fill="var(--grey)"/>
<text x="421" y="260" font-size="16" fill="var(--dim)">二十五上下</text>

<text x="256" y="328" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="end">今年價格</text>
<rect x="280" y="306" width="500" height="34" rx="4" fill="var(--accent)"/>
<text x="796" y="330" font-size="16" fill="var(--accent)">翻倍</text>

<text x="60" y="466" font-size="22" font-weight="700" fill="var(--ink)">老劇本是量價一起衝</text>
</svg>
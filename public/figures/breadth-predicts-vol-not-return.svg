<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左圖趨勢線水平、右圖趨勢線明顯下斜">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" fill="var(--ink)">廣度量得到波動，量不到報酬</text>

<rect x="60" y="100" width="400" height="320" fill="var(--card)"/>
<line x1="100" y1="380" x2="430" y2="380" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="130" x2="100" y2="380" stroke="var(--line)" stroke-width="2"/>
<text x="100" y="124" font-size="19" fill="var(--dim)">下個月報酬</text>
<circle cx="150" cy="250" r="6" fill="var(--grey)"/>
<circle cx="190" cy="300" r="6" fill="var(--grey)"/>
<circle cx="225" cy="215" r="6" fill="var(--grey)"/>
<circle cx="260" cy="290" r="6" fill="var(--grey)"/>
<circle cx="295" cy="240" r="6" fill="var(--grey)"/>
<circle cx="330" cy="320" r="6" fill="var(--grey)"/>
<circle cx="365" cy="230" r="6" fill="var(--grey)"/>
<circle cx="400" cy="275" r="6" fill="var(--grey)"/>
<line x1="130" y1="268" x2="415" y2="268" stroke="var(--dim)" stroke-width="4" stroke-dasharray="10 8"/>
<text x="100" y="408" font-size="16" fill="var(--dim)">廣度（低→高）</text>
<text x="300" y="408" font-size="16" fill="var(--dim)">沒有斜率</text>

<rect x="500" y="100" width="400" height="320" fill="var(--card)"/>
<line x1="540" y1="380" x2="870" y2="380" stroke="var(--line)" stroke-width="2"/>
<line x1="540" y1="130" x2="540" y2="380" stroke="var(--line)" stroke-width="2"/>
<text x="540" y="124" font-size="19" fill="var(--accent)">下個月波動</text>
<circle cx="580" cy="175" r="6" fill="var(--accent)"/>
<circle cx="620" cy="205" r="6" fill="var(--accent)"/>
<circle cx="660" cy="200" r="6" fill="var(--accent)"/>
<circle cx="700" cy="250" r="6" fill="var(--accent)"/>
<circle cx="740" cy="265" r="6" fill="var(--accent)"/>
<circle cx="780" cy="305" r="6" fill="var(--accent)"/>
<circle cx="820" cy="300" r="6" fill="var(--accent)"/>
<circle cx="855" cy="340" r="6" fill="var(--accent)"/>
<line x1="565" y1="172" x2="865" y2="338" stroke="var(--accent)" stroke-width="4"/>
<text x="540" y="408" font-size="16" fill="var(--dim)">廣度（低→高）</text>
<text x="770" y="408" font-size="16" fill="var(--accent)">負相關</text>
<text x="60" y="488" font-size="22" fill="var(--ink)">廣度壞≠市場要出事，是接下來會晃</text>
</svg>
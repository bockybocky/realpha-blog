<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A price line exits at the stop, stays flat for a stretch, re-enters on a break above the prior high, and continues upward">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.f9-b{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.f9-t{font-size:27px;font-weight:700}
.f9-s{font-size:15px}
.f9-c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="f9-b f9-t" x="60" y="66">Exit first, come back on the next new high</text>
<rect x="330" y="140" width="400" height="290" fill="var(--card)"/>
<text class="f9-b f9-s" x="530" y="452" text-anchor="middle" fill="var(--dim)">Flat</text>
<line x1="90" y1="200" x2="900" y2="200" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="90" y1="280" x2="900" y2="280" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M100,320 L180,246 L240,200 L300,240 L420,380 L520,404 L620,320 L730,200 L880,150" fill="none" stroke="var(--dim)" stroke-width="3"/>
<circle cx="334" cy="280" r="8" fill="var(--warn)"/>
<circle cx="730" cy="200" r="8" fill="var(--accent)"/>
<text class="f9-b f9-s" x="334" y="264" text-anchor="middle" fill="var(--warn)">Exit</text>
<text class="f9-b f9-s" x="742" y="182" fill="var(--accent)">Re-enter</text>
<text class="f9-b f9-s" x="96" y="192" fill="var(--accent)">Prior high</text>
<text class="f9-b f9-s" x="96" y="272" fill="var(--warn)">Stop</text>
<text class="f9-b f9-c" x="60" y="510">You sold the stretch, not the name</text>
</svg>
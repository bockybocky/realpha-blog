<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三個交疊的圓分別是接案、演講、寫作，共同交集只有中央一小塊，接案圓標為你要挑的人，演講與寫作標為你看得到的人">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700">心理師的三個圈</text>

  <circle cx="400" cy="280" r="120" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="600" cy="280" r="120" fill="var(--grey)" fill-opacity="0.22" stroke="var(--grey)" stroke-width="2.5"/>
  <circle cx="500" cy="410" r="120" fill="var(--grey)" fill-opacity="0.22" stroke="var(--grey)" stroke-width="2.5"/>

  <text x="318" y="242" font-size="20" font-weight="700" text-anchor="middle">接案</text>
  <text x="682" y="242" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">演講</text>
  <text x="500" y="500" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">寫作</text>
  <circle cx="500" cy="330" r="6" fill="var(--accent)"/>
  <text x="500" y="358" font-size="15" fill="var(--dim)" text-anchor="middle">交集</text>

  <rect x="760" y="252" width="20" height="20" rx="4" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
  <text x="792" y="269" font-size="16">你要挑的人</text>
  <rect x="760" y="300" width="20" height="20" rx="4" fill="var(--grey)" fill-opacity="0.22" stroke="var(--grey)" stroke-width="2"/>
  <text x="792" y="317" font-size="16" fill="var(--dim)">你看得到的人</text>

  <text x="60" y="548" font-size="22" font-weight="700">看得見的那圈，多半已經不接案</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上排一個孤點線條中途斷掉，下排密集點列一路抵達右端門檻，對比只宣布一次與反覆講上萬次">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink)}
.g{font-size:19px;fill:var(--ink)}
.b{font-size:16px;fill:var(--dim)}
.s{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
</defs>
<text class="h" x="80" y="70">一次，與上萬次</text>
<line x1="856" y1="140" x2="856" y2="410" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 8"/>
<text class="g" x="856" y="122" fill="var(--accent)" text-anchor="middle">心裡</text>
<text class="g" x="80" y="196">宣布一次</text>
<circle cx="110" cy="240" r="11" fill="var(--grey)"/>
<line x1="126" y1="240" x2="470" y2="240" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 12"/>
<text class="s" x="490" y="246">到不了</text>
<text class="g" x="80" y="336">每場會議都講</text>
<g fill="var(--accent)">
<circle cx="110" cy="380" r="4"/><circle cx="134" cy="380" r="4"/><circle cx="158" cy="380" r="4"/><circle cx="182" cy="380" r="4"/><circle cx="206" cy="380" r="4"/><circle cx="230" cy="380" r="4"/><circle cx="254" cy="380" r="4"/><circle cx="278" cy="380" r="4"/><circle cx="302" cy="380" r="4"/><circle cx="326" cy="380" r="4"/><circle cx="350" cy="380" r="4"/><circle cx="374" cy="380" r="4"/><circle cx="398" cy="380" r="4"/><circle cx="422" cy="380" r="4"/><circle cx="446" cy="380" r="4"/><circle cx="470" cy="380" r="4"/><circle cx="494" cy="380" r="4"/><circle cx="518" cy="380" r="4"/><circle cx="542" cy="380" r="4"/><circle cx="566" cy="380" r="4"/><circle cx="590" cy="380" r="4"/><circle cx="614" cy="380" r="4"/><circle cx="638" cy="380" r="4"/><circle cx="662" cy="380" r="4"/><circle cx="686" cy="380" r="4"/><circle cx="710" cy="380" r="4"/><circle cx="734" cy="380" r="4"/><circle cx="758" cy="380" r="4"/><circle cx="782" cy="380" r="4"/><circle cx="806" cy="380" r="4"/>
</g>
<line x1="110" y1="380" x2="848" y2="380" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar)"/>
<text class="c" x="80" y="470">使命不是宣布一次，是被翻譯上萬次。</text>
</svg>
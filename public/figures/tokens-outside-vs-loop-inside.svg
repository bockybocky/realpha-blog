<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊模型外側排著三顆中間步驟泡泡再連到答案，右邊模型內部有一個繞三圈的迴圈，外側只有答案">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">中間步驟寫在外面，還是繞在裡面</text>
<rect x="70" y="140" width="130" height="250" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="135" y="272" font-size="19" fill="var(--dim)" text-anchor="middle">一般模型</text>
<rect x="225" y="160" width="190" height="48" rx="24" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="320" y="192" font-size="16" fill="var(--ink)" text-anchor="middle">海綿寶寶</text>
<rect x="225" y="240" width="190" height="48" rx="24" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="320" y="272" font-size="16" fill="var(--ink)" text-anchor="middle">蟹堡王</text>
<rect x="225" y="320" width="190" height="48" rx="24" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="320" y="352" font-size="16" fill="var(--ink)" text-anchor="middle">章魚哥</text>
<line x1="200" y1="265" x2="222" y2="265" stroke="var(--grey)" stroke-width="2"/>
<text x="320" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">一句句吐出來</text>
<rect x="545" y="140" width="190" height="250" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="640" y="180" font-size="19" fill="var(--dim)" text-anchor="middle">循環模型</text>
<circle cx="640" cy="282" r="62" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="140 24"/>
<polygon points="640,220 620,236 648,242" fill="var(--accent)"/>
<text x="640" y="292" font-size="20" fill="var(--accent)" text-anchor="middle">繞三圈</text>
<rect x="775" y="240" width="120" height="84" rx="10" fill="var(--accent)"/>
<text x="835" y="290" font-size="19" fill="var(--page)" text-anchor="middle">答案</text>
<line x1="735" y1="282" x2="772" y2="282" stroke="var(--accent)" stroke-width="3"/>
<text x="640" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">留在內部的向量狀態</text>
<text x="480" y="476" font-size="22" fill="var(--ink)" text-anchor="middle">同樣三步，一邊變成字，一邊沒變成字</text>
</g>
</svg>
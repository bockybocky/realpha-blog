<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The left box has one exit and the right box has four, with a proportion bar below the right box split into one quarter and three quarters.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">One exit, or four</text>
<text class="g" x="60" y="118">529</text>
<rect x="60" y="140" width="150" height="180" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="210,220 300,220 300,206 330,230 300,254 300,240 210,240" fill="var(--grey)"/>
<text class="g" x="336" y="238">College</text>
<text class="s" x="60" y="352">One road only</text>
<text class="g" x="540" y="118">530A</text>
<rect x="540" y="140" width="150" height="260" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<polygon points="690,160 760,160 760,150 786,172 760,194 760,184 690,184" fill="var(--accent)"/>
<text class="g" x="792" y="180">A home</text>
<polygon points="690,228 760,228 760,218 786,240 760,262 760,252 690,252" fill="var(--accent)"/>
<text class="g" x="792" y="248">A business</text>
<polygon points="690,296 760,296 760,286 786,308 760,330 760,320 690,320" fill="var(--accent)"/>
<text class="g" x="792" y="316">College</text>
<polygon points="690,364 760,364 760,354 786,376 760,398 760,388 690,388" fill="var(--accent)"/>
<text class="g" x="792" y="384">A trade</text>
<rect x="540" y="440" width="105" height="34" fill="var(--accent)"/>
<rect x="645" y="440" width="270" height="34" fill="var(--grey)"/>
<text class="s" x="540" y="504">25% out at 18</text>
<text class="s" x="700" y="504">Rest rolls to an IRA</text>
</svg>
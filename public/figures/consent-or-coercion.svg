<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="上排兩個外觀相同的方塊，下排受同一外力後左方塊完整、右方塊沿內部接縫裂成碎塊">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">同意，還是壓著</text>

<text class="t" x="60" y="124" font-size="19" font-weight="700" fill="var(--dim)">順風時</text>
<rect x="200" y="140" width="220" height="120" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="560" y="140" width="220" height="120" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="432" y="212" font-size="19" fill="var(--dim)">＝</text>

<line x1="60" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="60" y="352" font-size="19" font-weight="700" fill="var(--warn)">有人敲門</text>
<path d="M140 400 L188 400 L176 386 M188 400 L176 414" fill="none" stroke="var(--warn)" stroke-width="3"/>
<rect x="200" y="350" width="220" height="130" rx="10" fill="var(--accent)" opacity="0.14"/>
<rect x="200" y="350" width="220" height="130" rx="10" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="258" y="422" font-size="20" font-weight="700" fill="var(--ink)">同意</text>

<path d="M500 400 L548 400 L536 386 M548 400 L536 414" fill="none" stroke="var(--warn)" stroke-width="3"/>
<g fill="none" stroke="var(--warn)" stroke-width="2">
<rect x="560" y="350" width="96" height="60" rx="6"/>
<rect x="672" y="342" width="108" height="56" rx="6"/>
<rect x="566" y="428" width="104" height="58" rx="6"/>
<rect x="690" y="420" width="96" height="62" rx="6"/>
</g>
<text class="t" x="640" y="524" font-size="20" font-weight="700" fill="var(--ink)">壓著</text>

<text class="t" x="60" y="556" font-size="22" fill="var(--ink)">那一天，來不及重新黏</text>
</svg>
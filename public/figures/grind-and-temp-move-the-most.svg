<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三條範圍條由短到長，只有研磨與水溫那條兩端衝出理想區">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">誰在推那一杯</text>

<rect x="312" y="96" width="376" height="300" fill="var(--card)"/>
<text x="500" y="128" font-size="19" font-weight="700" text-anchor="middle" fill="var(--dim)">理想區 18–22%</text>

<line x1="120" y1="396" x2="904" y2="396" stroke="var(--line)" stroke-width="2"/>
<g font-size="15" fill="var(--dim)" text-anchor="middle">
<text x="120" y="424">14%</text>
<text x="312" y="424">18%</text>
<text x="504" y="424">22%</text>
<text x="696" y="424">26%</text>
</g>

<text x="120" y="186" font-size="19" font-weight="700" fill="var(--ink)">換濾杯</text>
<line x1="398" y1="204" x2="451" y2="204" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"/>
<text x="467" y="210" font-size="16" fill="var(--dim)">1.1 點</text>

<text x="120" y="256" font-size="19" font-weight="700" fill="var(--ink)">換注水</text>
<line x1="360" y1="274" x2="466" y2="274" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"/>
<text x="482" y="280" font-size="16" fill="var(--dim)">2.2 點</text>

<text x="120" y="326" font-size="19" font-weight="700" fill="var(--ink)">研磨＋水溫</text>
<line x1="202" y1="344" x2="605" y2="344" stroke="var(--warn)" stroke-width="12" stroke-linecap="round"/>
<text x="621" y="350" font-size="16" font-weight="700" fill="var(--warn)">8.4 點</text>
<text x="202" y="378" font-size="15" text-anchor="middle" fill="var(--warn)">太酸 15.7</text>
<text x="605" y="378" font-size="15" text-anchor="middle" fill="var(--warn)">太苦 24.1</text>

<text x="48" y="478" font-size="22" font-weight="700" fill="var(--ink)">沖壞了先動研磨，再動水溫，最後才換手法</text>
<text x="48" y="510" font-size="15" fill="var(--dim)">模型數字；只有研磨與水溫能把一杯推出理想區</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸上一年後的解釋力極短、三年後的解釋力很長">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">價格在看哪一年的營收</text>

<text x="60" y="168" font-size="20" fill="var(--dim)">一年後的營收預估</text>
<rect x="60" y="188" width="840" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="188" width="48" height="56" rx="8" fill="var(--grey)"/>
<text x="130" y="224" font-size="19" fill="var(--dim)">幾乎沒有解釋力</text>

<text x="60" y="320" font-size="20" fill="var(--dim)">三年後的營收預估</text>
<rect x="60" y="340" width="840" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="340" width="700" height="56" rx="8" fill="var(--accent)"/>
<text x="84" y="376" font-size="20" font-weight="700" fill="var(--page)">解釋得了估值差異</text>

<text x="60" y="476" font-size="22" font-weight="700" fill="var(--ink)">短期成長已經在價格裡了</text>
</svg>
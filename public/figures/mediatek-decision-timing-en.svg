<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two timelines compared: one locks memory early, the other locks it near shipment and keeps a longer adjustable period.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="40" y="58" class="t">When RAM gets set</text>
<rect x="620" y="96" width="18" height="18" rx="3" fill="var(--accent)"/>
<text x="646" y="111" class="b">Open</text>
<rect x="740" y="96" width="18" height="18" rx="3" fill="var(--grey)"/>
<text x="766" y="111" class="b">Lock</text>
<text x="40" y="200" class="g">WMCM</text>
<text x="40" y="226" class="b">Faster</text>
<rect x="210" y="192" width="90" height="26" rx="4" fill="var(--accent)"/>
<rect x="300" y="192" width="560" height="26" rx="4" fill="var(--grey)"/>
<circle cx="300" cy="205" r="14" fill="var(--page)" stroke="var(--ink)" stroke-width="3"/>
<text x="300" y="170" class="b" text-anchor="middle">Set</text>
<text x="40" y="340" class="g">Legacy</text>
<text x="40" y="366" class="b">Flexible</text>
<rect x="210" y="332" width="510" height="26" rx="4" fill="var(--accent)"/>
<rect x="720" y="332" width="140" height="26" rx="4" fill="var(--grey)"/>
<circle cx="720" cy="345" r="14" fill="var(--page)" stroke="var(--ink)" stroke-width="3"/>
<text x="720" y="310" class="b" text-anchor="middle">Set</text>
<line x1="210" y1="420" x2="860" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="210" y="450" class="b">Plan</text>
<text x="860" y="450" class="b" text-anchor="end">Ship</text>
<text x="40" y="505" class="c">Late choice pays</text>
</svg>
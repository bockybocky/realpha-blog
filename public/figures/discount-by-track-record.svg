<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條完整長條在兌現紀錄之後變成一短一長兩條">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">先按兌現紀錄打折，再評估</text>

<text x="60" y="140" font-size="19" font-weight="600" fill="var(--dim)">同一句話</text>
<rect x="300" y="110" width="400" height="52" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="500" y="143" font-size="16" fill="var(--ink)" text-anchor="middle">明年毛利率會改善</text>

<line x1="60" y1="206" x2="900" y2="206" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="248" font-size="19" font-weight="600" fill="var(--dim)">打折後剩下</text>

<text x="60" y="300" font-size="16" fill="var(--ink)">A 公司　說 6 次，兌現 2 次</text>
<rect x="300" y="274" width="400" height="52" rx="8" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="300" y="274" width="133" height="52" rx="8" fill="var(--grey)"/>
<text x="720" y="306" font-size="16" fill="var(--dim)">剩三分之一</text>

<text x="60" y="392" font-size="16" fill="var(--ink)">B 公司　說 4 次，兌現 4 次</text>
<rect x="300" y="366" width="400" height="52" rx="8" fill="var(--accent)"/>
<text x="720" y="398" font-size="16" fill="var(--dim)">原值</text>

<text x="480" y="482" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">同一句話，價值差好幾倍</text>
</svg>
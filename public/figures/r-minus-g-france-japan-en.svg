<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A long France bar sits left of zero and a short Japan bar to the right, showing the sign difference in r minus g.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
 svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
       --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
 @media (prefers-color-scheme: dark) {
   svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
         --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
 }
 text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
 .h{font-size:27px;font-weight:700}
 .g{font-size:19px;fill:var(--dim)}
 .b{font-size:16px;fill:var(--dim)}
 .c{font-size:22px;font-weight:700}
</style>
<text class="h" x="60" y="56">The box that matters: can growth outrun interest?</text>
<text class="g" x="60" y="110">r minus g = borrowing cost − growth rate</text>
<line x1="480" y1="150" x2="480" y2="400" stroke="var(--dim)" stroke-width="3"/>
<text class="b" x="466" y="430">0</text>
<rect x="150" y="190" width="330" height="60" fill="var(--warn)"/>
<text class="g" x="170" y="228" fill="var(--page)">France</text>
<rect x="480" y="300" width="110" height="60" fill="var(--accent)"/>
<text class="g" x="606" y="338">Japan</text>
<text class="b" x="150" y="172">Most negative gap: interest outruns growth</text>
<text class="b" x="606" y="384">Positive: debt shrinks itself</text>
<text class="c" x="60" y="486">Same debt pile, one minus sign apart</text>
</svg>
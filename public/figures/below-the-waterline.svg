<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條均線上只有一格，線下有四格，說明五檔裡有四檔已經破線。">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t h" x="60" y="66">水面上和水面下</text>
<rect x="60" y="130" width="150" height="86" rx="8" fill="var(--accent)"/>
<text class="t g" x="84" y="168" fill="var(--page)">七大科技</text>
<text class="t b" x="84" y="196" fill="var(--page)">Nvidia</text>
<text class="t g" x="236" y="172" fill="var(--accent)">20% 的成分股</text>
<text class="t b" x="236" y="198">還在線上</text>
<line x1="60" y1="256" x2="900" y2="256" stroke="var(--ink)" stroke-width="4"/>
<text class="t b" x="760" y="244">50 日均線</text>
<rect x="60" y="300" width="150" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="230" y="300" width="150" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="400" y="300" width="150" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="570" y="300" width="150" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t b" x="84" y="336">區域銀行</text>
<text class="t b" x="84" y="362">建商</text>
<text class="t b" x="254" y="336">零售商</text>
<text class="t b" x="254" y="362">餐廳</text>
<text class="t b" x="424" y="336">郵輪</text>
<text class="t b" x="424" y="362">主題樂園</text>
<text class="t b" x="594" y="336">小型股</text>
<text class="t g" x="740" y="348" fill="var(--ink)">80%</text>
<text class="t b" x="60" y="430">平均與中位數個股距 52 週高點 −15%</text>
<text class="t c" x="60" y="506">指數的重量集中在那二十檔</text>
</svg>
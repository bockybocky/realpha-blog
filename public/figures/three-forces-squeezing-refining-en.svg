<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Arrows from three directions press at once on a single block in the centre.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">One gap, three sources</text>

  <rect x="370" y="250" width="220" height="110" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="480" y="295" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">The middle layer</text>
  <text class="t" x="480" y="325" font-size="16" text-anchor="middle" fill="var(--dim)">Refining and fuel supply</text>

  <text class="t" x="60" y="290" font-size="20" font-weight="700" fill="var(--dim)">Closures and strikes</text>
  <text class="t" x="60" y="318" font-size="15" fill="var(--dim)">California, Germany, the Gulf, Russia</text>
  <path d="M250 300 L350 300" stroke="var(--warn)" stroke-width="4"/>
  <path d="M350 300 l-16 -9 l0 18 z" fill="var(--warn)"/>

  <text class="t" x="480" y="130" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">Shipping</text>
  <text class="t" x="480" y="158" font-size="15" text-anchor="middle" fill="var(--dim)">Black Sea diesel, 800,000 barrels a day</text>
  <path d="M480 180 L480 235" stroke="var(--warn)" stroke-width="4"/>
  <path d="M480 235 l-9 -16 l18 0 z" fill="var(--warn)"/>

  <text class="t" x="900" y="290" font-size="20" font-weight="700" text-anchor="end" fill="var(--dim)">Biofuels</text>
  <text class="t" x="900" y="318" font-size="15" text-anchor="end" fill="var(--dim)">Poor cane harvest, barges stuck</text>
  <path d="M710 300 L610 300" stroke="var(--warn)" stroke-width="4"/>
  <path d="M610 300 l16 -9 l0 18 z" fill="var(--warn)"/>

  <line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="60" y="488" font-size="22" font-weight="700" fill="var(--ink)">Two of them have nothing to do with furnaces, yet land in the same slot</text>
</svg>
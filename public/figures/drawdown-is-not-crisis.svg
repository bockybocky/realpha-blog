<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="散佈圖：六檔深跌持股全部集中在圖的右側低處，都在三格門檻線之下">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">跌得深，不等於在危機裡</text>
  <text class="t" x="60" y="86" font-size="16" fill="var(--dim)">縱軸：五個指標中了幾格　橫軸：離一年高點的跌幅</text>

  <rect x="140" y="130" width="740" height="120" fill="var(--warn)" opacity="0.10"/>
  <text class="t" x="866" y="152" font-size="16" text-anchor="end" fill="var(--warn)">危機區</text>

  <line x1="140" y1="130" x2="140" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="140" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>

  <line x1="140" y1="250" x2="880" y2="250" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="t" x="148" y="242" font-size="19" fill="var(--warn)">三格門檻</text>

  <text class="t" x="126" y="136" font-size="16" text-anchor="end" fill="var(--dim)">5</text>
  <text class="t" x="126" y="196" font-size="16" text-anchor="end" fill="var(--dim)">4</text>
  <text class="t" x="126" y="256" font-size="16" text-anchor="end" fill="var(--dim)">3</text>
  <text class="t" x="126" y="316" font-size="16" text-anchor="end" fill="var(--dim)">2</text>
  <text class="t" x="126" y="376" font-size="16" text-anchor="end" fill="var(--dim)">1</text>
  <text class="t" x="126" y="436" font-size="16" text-anchor="end" fill="var(--dim)">0</text>

  <text class="t" x="140" y="456" font-size="16" text-anchor="middle" fill="var(--dim)">-20%</text>
  <text class="t" x="457" y="456" font-size="16" text-anchor="middle" fill="var(--dim)">-50%</text>
  <text class="t" x="880" y="456" font-size="16" text-anchor="middle" fill="var(--dim)">-90%</text>

  <circle cx="383" cy="370" r="11" fill="var(--accent)"/>
  <circle cx="478" cy="370" r="11" fill="var(--accent)"/>
  <circle cx="626" cy="370" r="11" fill="var(--accent)"/>
  <circle cx="658" cy="370" r="11" fill="var(--accent)"/>
  <circle cx="510" cy="310" r="11" fill="var(--accent)"/>
  <circle cx="436" cy="310" r="13" fill="var(--warn)"/>
  <line x1="436" y1="297" x2="436" y2="268" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="436" y="258" font-size="19" text-anchor="middle" fill="var(--warn)">第二格快成立</text>

  <text class="t" x="60" y="510" font-size="22" font-weight="700" fill="var(--ink)">全都在最右邊，也全都在線的下面</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Pipe diagram: the chip section on the left is widest, the assembly section is medium with walls that can expand, the data center section is slightly narrower, and the grid and permit sections on the right are thinnest and marked in a warning color."><rect x="0" y="0" width="960" height="540" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:19px;font-weight:600}.b{font-size:16px;fill:var(--dim)}.k{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}
</style>
<text x="480" y="52" text-anchor="middle" class="t">Orders hit the neck</text>
<line x1="60" y1="118" x2="888" y2="118" stroke="var(--dim)" stroke-width="2"/>
<polygon points="900,118 886,110 886,126" fill="var(--dim)"/>
<text x="480" y="104" text-anchor="middle" class="b">Flow →</text>
<rect x="60" y="170" width="170" height="170" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2"/>
<rect x="230" y="210" width="170" height="90" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="315,186 306,199 324,199" fill="var(--accent)"/>
<polygon points="315,324 306,311 324,311" fill="var(--accent)"/>
<rect x="400" y="195" width="170" height="120" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2"/>
<rect x="570" y="233" width="170" height="44" fill="var(--warn)" fill-opacity="0.35" stroke="var(--warn)" stroke-width="2"/>
<rect x="740" y="233" width="160" height="44" fill="var(--warn)" fill-opacity="0.35" stroke="var(--warn)" stroke-width="2"/>
<g text-anchor="middle" class="g">
<text x="145" y="380">Chip</text><text x="315" y="380">Asm</text><text x="485" y="380">DC</text><text x="655" y="380">Pwr</text><text x="820" y="380">Permits</text>
</g>
<g text-anchor="middle" class="b">
<text x="145" y="410">Easing</text>
<text x="315" y="410" class="b a">Temp</text>
<text x="485" y="410">No fit</text>
<text x="655" y="410" class="b w">Hard</text>
<text x="820" y="410" class="b w">Hard</text>
<text x="315" y="436">Money fix</text>
<text x="655" y="436">Slow fix</text>
<text x="820" y="436">Voters</text>
</g>
<text x="480" y="500" text-anchor="middle" class="k">Output = neck</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two stacked bars: the upper cache layer shrinks a lot while the lower inference layer grows, leaving the totals nearly equal.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .w { font-size:15px; fill:var(--page); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="48" y="62">It saves that block, not the whole thing</text>
  <text class="b" x="48" y="92">Memory used on the same machine</text>
  <rect x="40" y="118" width="880" height="374" rx="14" fill="var(--card)"/>
  <line x1="100" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
  <rect x="200" y="110" width="170" height="200" rx="6" fill="var(--accent)"/>
  <rect x="200" y="310" width="170" height="120" rx="6" fill="var(--grey)"/>
  <text class="w" x="285" y="216" text-anchor="middle">Cache</text>
  <text class="w" x="285" y="376" text-anchor="middle">Inference</text>
  <rect x="580" y="140" width="170" height="50" rx="6" fill="var(--accent)"/>
  <rect x="580" y="190" width="170" height="240" rx="6" fill="var(--grey)"/>
  <text class="w" x="665" y="172" text-anchor="middle">Cache</text>
  <text class="w" x="665" y="316" text-anchor="middle">Inference</text>
  <text class="g" x="285" y="462" text-anchor="middle">Before</text>
  <text class="g" x="665" y="462" text-anchor="middle">After</text>
  <line x1="378" y1="200" x2="572" y2="162" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="g" x="475" y="168" text-anchor="middle" fill="var(--warn)">-75%</text>
  <line x1="378" y1="376" x2="572" y2="330" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="g" x="475" y="378" text-anchor="middle">x2</text>
  <line x1="810" y1="110" x2="810" y2="430" stroke="var(--dim)" stroke-width="2"/>
  <line x1="850" y1="140" x2="850" y2="430" stroke="var(--dim)" stroke-width="2"/>
  <text class="b" x="830" y="104" text-anchor="middle">Total</text>
  <text class="c" x="48" y="534">One block shrinks, the other grows</text>
</svg>
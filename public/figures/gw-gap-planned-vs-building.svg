<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="柱狀圖：喊到 300 與 200 的兩根高柱旁，已動工只有一根約三分之一高的矮柱，中間留著明顯的高度落差">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="80" y="78">2030 年累計電力部署</text>

<line x1="120" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>

<rect x="170" y="130" width="120" height="270" rx="4" fill="var(--grey)" opacity="0.55"/>
<rect x="350" y="220" width="120" height="180" rx="4" fill="var(--grey)" opacity="0.8"/>
<rect x="660" y="310" width="120" height="90" rx="4" fill="var(--accent)"/>

<text class="g" x="230" y="112" text-anchor="middle">300GW</text>
<text class="g" x="410" y="202" text-anchor="middle">200GW</text>
<text class="g" x="720" y="292" text-anchor="middle">100GW 出頭</text>

<text class="b" x="230" y="434" text-anchor="middle">市場喊的</text>
<text class="b" x="410" y="434" text-anchor="middle">市場喊的</text>
<text class="b" x="720" y="434" text-anchor="middle">真的動工的</text>

<line x1="540" y1="140" x2="540" y2="390" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="g" x="556" y="250" fill="var(--warn)">落差</text>

<text class="c" x="120" y="496">不夠，而且沒人打算等</text>
</svg>
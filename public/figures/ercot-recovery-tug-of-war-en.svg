<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A timeline runs from today toward 2029–2030, with an arrow above pushing the recovery later and an arrow below pulling it earlier.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/>
    </marker>
    <marker id="arL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <text class="t" x="60" y="60" font-size="27" font-weight="700" fill="var(--ink)">A tug of war over the gap years</text>

  <line x1="100" y1="290" x2="880" y2="290" stroke="var(--line)" stroke-width="4"/>
  <circle cx="140" cy="290" r="10" fill="var(--grey)"/>
  <text class="t" x="140" y="340" font-size="19" text-anchor="middle" fill="var(--dim)">Today · below water</text>
  <circle cx="760" cy="290" r="10" fill="var(--accent)"/>
  <text class="t" x="760" y="340" font-size="19" text-anchor="middle" fill="var(--accent)">Volatility returns</text>
  <text class="t" x="760" y="366" font-size="16" text-anchor="middle" fill="var(--dim)">2029–2030</text>

  <line x1="520" y1="190" x2="840" y2="190" stroke="var(--warn)" stroke-width="4" marker-end="url(#arR)"/>
  <text class="t" x="520" y="166" font-size="19" font-weight="700" fill="var(--warn)">5–6 GW more batteries</text>

  <line x1="760" y1="420" x2="420" y2="420" stroke="var(--accent)" stroke-width="4" marker-end="url(#arL)"/>
  <text class="t" x="760" y="458" font-size="19" font-weight="700" text-anchor="end" fill="var(--accent)">Data centers really draw from the grid</text>
</svg>
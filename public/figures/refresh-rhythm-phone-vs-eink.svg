<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上排手機時間軸刻度細密連續，下排電紙書只有五個寬格且每格後面接一段黑白等待帶，整排被等待撐長">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">同樣一秒鐘，兩種螢幕的節奏</text>

  <text class="t" x="60" y="150" font-size="20" font-weight="700" fill="var(--dim)">手機</text>
  <rect x="60" y="170" width="840" height="56" rx="6" fill="var(--card)"/>
  <g fill="var(--grey)">
    <rect x="72" y="178" width="7" height="40"/><rect x="86" y="178" width="7" height="40"/>
    <rect x="100" y="178" width="7" height="40"/><rect x="114" y="178" width="7" height="40"/>
    <rect x="128" y="178" width="7" height="40"/><rect x="142" y="178" width="7" height="40"/>
    <rect x="156" y="178" width="7" height="40"/><rect x="170" y="178" width="7" height="40"/>
    <rect x="184" y="178" width="7" height="40"/><rect x="198" y="178" width="7" height="40"/>
    <rect x="212" y="178" width="7" height="40"/><rect x="226" y="178" width="7" height="40"/>
    <rect x="240" y="178" width="7" height="40"/><rect x="254" y="178" width="7" height="40"/>
    <rect x="268" y="178" width="7" height="40"/><rect x="282" y="178" width="7" height="40"/>
    <rect x="296" y="178" width="7" height="40"/><rect x="310" y="178" width="7" height="40"/>
    <rect x="324" y="178" width="7" height="40"/><rect x="338" y="178" width="7" height="40"/>
    <rect x="352" y="178" width="7" height="40"/><rect x="366" y="178" width="7" height="40"/>
    <rect x="380" y="178" width="7" height="40"/><rect x="394" y="178" width="7" height="40"/>
    <rect x="408" y="178" width="7" height="40"/><rect x="422" y="178" width="7" height="40"/>
    <rect x="436" y="178" width="7" height="40"/><rect x="450" y="178" width="7" height="40"/>
    <rect x="464" y="178" width="7" height="40"/><rect x="478" y="178" width="7" height="40"/>
    <rect x="492" y="178" width="7" height="40"/><rect x="506" y="178" width="7" height="40"/>
    <rect x="520" y="178" width="7" height="40"/><rect x="534" y="178" width="7" height="40"/>
    <rect x="548" y="178" width="7" height="40"/><rect x="562" y="178" width="7" height="40"/>
    <rect x="576" y="178" width="7" height="40"/><rect x="590" y="178" width="7" height="40"/>
    <rect x="604" y="178" width="7" height="40"/><rect x="618" y="178" width="7" height="40"/>
    <rect x="632" y="178" width="7" height="40"/><rect x="646" y="178" width="7" height="40"/>
    <rect x="660" y="178" width="7" height="40"/><rect x="674" y="178" width="7" height="40"/>
    <rect x="688" y="178" width="7" height="40"/><rect x="702" y="178" width="7" height="40"/>
    <rect x="716" y="178" width="7" height="40"/><rect x="730" y="178" width="7" height="40"/>
    <rect x="744" y="178" width="7" height="40"/><rect x="758" y="178" width="7" height="40"/>
    <rect x="772" y="178" width="7" height="40"/><rect x="786" y="178" width="7" height="40"/>
    <rect x="800" y="178" width="7" height="40"/><rect x="814" y="178" width="7" height="40"/>
    <rect x="828" y="178" width="7" height="40"/><rect x="842" y="178" width="7" height="40"/>
    <rect x="856" y="178" width="7" height="40"/><rect x="870" y="178" width="7" height="40"/>
    <rect x="884" y="178" width="7" height="40"/>
  </g>
  <text class="t" x="60" y="256" font-size="16" fill="var(--dim)">一秒重畫六十幾次</text>

  <text class="t" x="60" y="336" font-size="20" font-weight="700" fill="var(--ink)">電紙書</text>
  <rect x="60" y="356" width="840" height="56" rx="6" fill="var(--card)"/>
  <g>
    <rect x="72" y="364" width="52" height="40" fill="var(--accent)"/>
    <g fill="var(--grey)">
      <rect x="130" y="364" width="12" height="40"/><rect x="150" y="364" width="12" height="40"/>
      <rect x="170" y="364" width="12" height="40"/><rect x="190" y="364" width="12" height="40"/>
    </g>
    <rect x="214" y="364" width="52" height="40" fill="var(--accent)"/>
    <g fill="var(--grey)">
      <rect x="272" y="364" width="12" height="40"/><rect x="292" y="364" width="12" height="40"/>
      <rect x="312" y="364" width="12" height="40"/><rect x="332" y="364" width="12" height="40"/>
    </g>
    <rect x="356" y="364" width="52" height="40" fill="var(--accent)"/>
    <g fill="var(--grey)">
      <rect x="414" y="364" width="12" height="40"/><rect x="434" y="364" width="12" height="40"/>
      <rect x="454" y="364" width="12" height="40"/><rect x="474" y="364" width="12" height="40"/>
    </g>
    <rect x="498" y="364" width="52" height="40" fill="var(--accent)"/>
    <g fill="var(--grey)">
      <rect x="556" y="364" width="12" height="40"/><rect x="576" y="364" width="12" height="40"/>
      <rect x="596" y="364" width="12" height="40"/><rect x="616" y="364" width="12" height="40"/>
    </g>
    <rect x="640" y="364" width="52" height="40" fill="var(--accent)"/>
    <g fill="var(--grey)">
      <rect x="698" y="364" width="12" height="40"/><rect x="718" y="364" width="12" height="40"/>
      <rect x="738" y="364" width="12" height="40"/><rect x="758" y="364" width="12" height="40"/>
    </g>
  </g>
  <text class="t" x="60" y="442" font-size="16" fill="var(--dim)">一次換畫面＝一次刷新＋一段等待</text>
  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">在這裡要省的是步驟數，不是功能數</text>
</svg>
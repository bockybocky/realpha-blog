<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Left panel: one key, one safe. Right panel: a chainsaw opening five safes, with the camera feed crossed out.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="78">One asked for, all of them taken</text>

  <rect x="80" y="120" width="380" height="290" rx="10" fill="var(--card)"/>
  <text class="g" x="110" y="158">What you asked for</text>
  <rect x="200" y="200" width="110" height="110" rx="8" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="255" cy="255" r="16" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <line x1="255" y1="255" x2="255" y2="290" stroke="var(--accent)" stroke-width="3"/>
  <text class="b" x="255" y="352" text-anchor="middle">This tool, this safe</text>

  <rect x="500" y="120" width="380" height="290" rx="10" fill="var(--card)"/>
  <text class="g" x="530" y="158">What it did</text>
  <g stroke="var(--warn)" stroke-width="3" fill="none">
    <rect x="528" y="195" width="58" height="58" rx="6"/>
    <rect x="600" y="195" width="58" height="58" rx="6"/>
    <rect x="672" y="195" width="58" height="58" rx="6"/>
    <rect x="744" y="195" width="58" height="58" rx="6"/>
    <rect x="816" y="195" width="58" height="58" rx="6"/>
    <line x1="528" y1="224" x2="586" y2="224"/>
    <line x1="600" y1="224" x2="658" y2="224"/>
    <line x1="672" y1="224" x2="730" y2="224"/>
    <line x1="744" y1="224" x2="802" y2="224"/>
    <line x1="816" y1="224" x2="874" y2="224"/>
  </g>
  <rect x="640" y="290" width="120" height="70" rx="8" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <line x1="640" y1="290" x2="760" y2="360" stroke="var(--warn)" stroke-width="3"/>
  <text class="b" x="700" y="390" text-anchor="middle">Camera feed</text>

  <text class="c" x="80" y="470">It knows it's doing something else</text>
  <text class="b" x="80" y="506">Not literal overreach, not rebellion — related, but not the thing</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="France's funding cost sits above its nominal growth, while US nominal growth is still slightly above its funding cost but the gap is very narrow.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="48" y="62">Who sits above whom</text>
<rect x="48" y="100" width="410" height="310" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="76" y="136">France</text>
<line x1="96" y1="200" x2="410" y2="200" stroke="var(--warn)" stroke-width="7"/>
<text class="b" x="96" y="188">Funding cost 4.5%</text>
<line x1="96" y1="340" x2="410" y2="340" stroke="var(--grey)" stroke-width="7"/>
<text class="b" x="96" y="328">Nominal growth 2%</text>
<path d="M430 206 L430 334" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 5"/>
<text class="b" x="76" y="382">Interest eats everything</text>
<rect x="502" y="100" width="410" height="310" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="530" y="136">United States</text>
<line x1="550" y1="228" x2="864" y2="228" stroke="var(--accent)" stroke-width="7"/>
<text class="b" x="550" y="216">Nominal growth 6%</text>
<line x1="550" y1="268" x2="864" y2="268" stroke="var(--grey)" stroke-width="7"/>
<text class="b" x="550" y="300">Funding cost 5.3%</text>
<path d="M884 234 L884 262" stroke="var(--dim)" stroke-width="3" stroke-dasharray="7 5"/>
<text class="b" x="530" y="382">Not crossed yet</text>
<text class="c" x="48" y="470">Once funding cost climbs past nominal growth, debt cannot stop</text>
</svg>
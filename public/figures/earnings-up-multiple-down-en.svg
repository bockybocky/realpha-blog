<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="An upward arrow for earnings on the left and a downward arrow for the multiple on the right, the two forces offsetting each other.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型 */
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">Price stood still, two forces underneath</text>
<rect x="70" y="100" width="360" height="330" fill="var(--card)" rx="10"/>
<path d="M250 400 L250 175" stroke="var(--accent)" stroke-width="18" stroke-linecap="round"/>
<path d="M250 138 L308 200 L192 200 Z" fill="var(--accent)"/>
<text x="250" y="470" font-size="20" fill="var(--ink)" text-anchor="middle" font-weight="700">Earnings</text>
<text x="250" y="500" font-size="16" fill="var(--dim)" text-anchor="middle">Broke above a 90-year channel</text>
<rect x="530" y="100" width="360" height="330" fill="var(--card)" rx="10"/>
<path d="M710 130 L710 355" stroke="var(--warn)" stroke-width="18" stroke-linecap="round"/>
<path d="M710 392 L768 330 L652 330 Z" fill="var(--warn)"/>
<text x="710" y="470" font-size="20" fill="var(--ink)" text-anchor="middle" font-weight="700">The multiple paid</text>
<text x="710" y="500" font-size="16" fill="var(--dim)" text-anchor="middle">19x  below the 5-year median</text>
<text x="480" y="272" font-size="19" fill="var(--dim)" text-anchor="middle">Cancel out</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="平常運費短條與現在運費長條對比，長條約為短條數倍">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; } .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); } .c { font-size:22px; font-weight:700; }
</style>
<text x="40" y="50" class="t">中東→亞洲油輪運費（美元／公噸）</text>
<text x="200" y="185" class="g" text-anchor="end">平常</text>
<rect x="220" y="150" width="130" height="56" fill="var(--grey)"/>
<text x="365" y="185" class="g">20–40</text>
<text x="200" y="295" class="g" text-anchor="end">現在</text>
<rect x="220" y="260" width="600" height="56" fill="var(--warn)"/>
<text x="805" y="295" class="g" text-anchor="end" style="fill:var(--page)">185</text>
<text x="480" y="420" class="c" text-anchor="middle">亞洲煉油廠：每桶多付約 25 美元</text>
<text x="480" y="460" class="b" text-anchor="middle">航程拉長・油輪綁在海上更久</text>
</svg>
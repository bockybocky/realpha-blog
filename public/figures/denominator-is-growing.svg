<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左側兩根同高的柱子只在內部換色，右側第二根柱子整體長高並越過原本的虛線上緣">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">分母在長：從換掉再補上，變成兩邊都在蓋</text>

  <rect x="60" y="92" width="390" height="370" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="84" y="130">過去二十幾年</text>
  <text class="d" x="84" y="156">燃煤退役，燃氣與再生能源補上</text>
  <line x1="84" y1="240" x2="426" y2="240" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="d" x="426" y="232" text-anchor="end">總量不動</text>
  <rect x="118" y="240" width="112" height="90" fill="var(--line)"/>
  <rect x="118" y="330" width="112" height="90" fill="var(--grey)"/>
  <rect x="268" y="240" width="112" height="140" fill="var(--line)"/>
  <rect x="268" y="380" width="112" height="40" fill="var(--grey)"/>
  <line x1="84" y1="420" x2="426" y2="420" stroke="var(--line)" stroke-width="3"/>
  <text class="d" x="174" y="444" text-anchor="middle">較早</text>
  <text class="d" x="324" y="444" text-anchor="middle">較近</text>
  <text class="d" x="174" y="292" text-anchor="middle">燃氣與再生</text>
  <text class="d" x="174" y="382" text-anchor="middle">燃煤</text>

  <rect x="510" y="92" width="390" height="370" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="534" y="130">現在</text>
  <text class="d" x="534" y="156">頂線用電需求自己長出來</text>
  <line x1="534" y1="240" x2="876" y2="240" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="d" x="876" y="232" text-anchor="end">原來的上緣</text>
  <rect x="568" y="240" width="112" height="180" fill="var(--line)"/>
  <rect x="718" y="240" width="112" height="180" fill="var(--line)"/>
  <rect x="718" y="166" width="112" height="74" fill="var(--accent)"/>
  <text class="d" x="774" y="152" text-anchor="middle">新增需求</text>
  <line x1="534" y1="420" x2="876" y2="420" stroke="var(--line)" stroke-width="3"/>
  <text class="d" x="624" y="444" text-anchor="middle">現在</text>
  <text class="d" x="774" y="444" text-anchor="middle">接下來</text>

  <text class="c" x="60" y="508">以前搶同一塊餅，現在餅自己變大</text>
</svg>
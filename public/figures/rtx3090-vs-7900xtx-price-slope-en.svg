<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two rising slope lines, with the 3090 climbing most steeply, the 7900 XTX rising more gently, and a used-price low point beside them.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="48" y="56">24GB card prices</text>
<text class="s" x="48" y="86">CNY, per his video</text>
<text class="g" x="300" y="128" text-anchor="middle">Then</text>
<text class="g" x="640" y="128" text-anchor="middle">Now</text>
<line x1="300" y1="145" x2="300" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="640" y1="145" x2="640" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="300" y1="370" x2="640" y2="170" stroke="var(--dim)" stroke-width="4"/>
<circle cx="300" cy="370" r="7" fill="var(--dim)"/>
<circle cx="640" cy="170" r="7" fill="var(--dim)"/>
<text class="b" x="284" y="376" text-anchor="end">~6,000</text>
<text class="g" x="656" y="177">3090 &gt;10k</text>
<line x1="300" y1="410" x2="640" y2="270" stroke="var(--accent)" stroke-width="4"/>
<circle cx="300" cy="410" r="7" fill="var(--accent)"/>
<circle cx="640" cy="270" r="7" fill="var(--accent)"/>
<text class="b" x="284" y="416" text-anchor="end">5,000+</text>
<text class="g" x="656" y="277" style="fill:var(--accent)">7900 XTX ~8,000</text>
<circle cx="640" cy="420" r="7" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="4 3"/>
<text class="b" x="656" y="426">Used 7900 XTX ~5,000</text>
<text class="c" x="48" y="524">Both rose; 3090 the most</text>
</svg>
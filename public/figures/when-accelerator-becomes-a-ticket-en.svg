<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two curves rise as models grow larger, the steep one crossing above the gentle one, with the crossing marked as the threshold.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="480" y="54" text-anchor="middle" font-size="27" fill="var(--ink)">A bonus, or a ticket</text>

<line x1="120" y1="130" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="118" text-anchor="middle" font-size="15" fill="var(--dim)">Time</text>

<path d="M150,425 C 330,420 420,400 470,376 S 700,205 820,162" fill="none" stroke="var(--grey)" stroke-width="4"/>
<path d="M150,408 C 400,390 620,358 820,338" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="832" y="158" font-size="16" fill="var(--dim)">CPU</text>
<text x="832" y="334" font-size="16" fill="var(--accent)">ANE</text>

<line x1="462" y1="180" x2="462" y2="440" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="462" y="166" text-anchor="middle" font-size="20" fill="var(--warn)">Threshold</text>

<text x="200" y="250" font-size="16" fill="var(--dim)">Small models: CPU is enough</text>
<text x="600" y="415" font-size="16" fill="var(--dim)">Large models: nothing else will do</text>

<text x="480" y="490" text-anchor="middle" font-size="22" fill="var(--ink)">Larger models　→</text>
<text x="480" y="528" text-anchor="middle" font-size="22" fill="var(--ink)">Ask how big the model is before asking about new hardware</text>
</svg>
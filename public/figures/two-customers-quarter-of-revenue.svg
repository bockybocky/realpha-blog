<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="營收橫帶的四分之一收窄成一根細管流進兩個方塊，其餘四分之三散向許多客戶">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">兩個客戶，四分之一營收</text>
<text class="g" x="60" y="118">全部營收</text>
<rect x="60" y="140" width="200" height="56" fill="var(--accent)"/>
<rect x="260" y="140" width="600" height="56" fill="var(--grey)"/>
<text class="d" x="66" y="176" fill="var(--page)">25%</text>
<text class="d" x="272" y="176">其餘 75%：許多客戶</text>
<path d="M60 196 L260 196 L186 300 L162 300 Z" fill="var(--accent)" opacity="0.55"/>
<rect x="150" y="300" width="48" height="90" fill="var(--accent)"/>
<text class="d" x="214" y="352">很小的水管</text>
<rect x="60" y="412" width="130" height="68" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="212" y="412" width="130" height="68" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="80" y="454">一家</text>
<text class="g" x="232" y="454">一家</text>
<text class="d" x="400" y="440">可能是通路：雲端轉售</text>
<text class="d" x="400" y="468">粗估法：看兩家雲的增量營收回推</text>
<text class="d" x="400" y="496">沒扣替代效應，只定量級</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three stock bars shrink from top to bottom, and the last is drawn dashed with a question mark to show an undisclosed number.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">After this war, what is left on the shelf</text>
<text x="70" y="128" font-size="19" fill="var(--ink)">Seven key munitions</text>
<rect x="70" y="146" width="520" height="34" rx="4" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="70" y="146" width="260" height="34" rx="4" fill="var(--accent)" opacity="0.55"/>
<text x="606" y="169" font-size="16" fill="var(--dim)">About half left</text>
<text x="70" y="240" font-size="19" fill="var(--ink)">Patriot, THAAD</text>
<rect x="70" y="258" width="520" height="34" rx="4" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="70" y="258" width="208" height="34" rx="4" fill="var(--accent)" opacity="0.55"/>
<text x="606" y="281" font-size="16" fill="var(--dim)">About 40% left</text>
<text x="70" y="352" font-size="19" fill="var(--ink)">Shipborne interceptors</text>
<rect x="70" y="370" width="520" height="34" rx="4" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="330" y="394" text-anchor="middle" font-size="19" fill="var(--grey)">?</text>
<text x="606" y="393" font-size="16" fill="var(--dim)">Not public</text>
<text x="70" y="452" font-size="15" fill="var(--dim)">Solid = left　Outline = spent</text>
<text x="480" y="504" text-anchor="middle" font-size="22" fill="var(--ink)">Once spent, spent — nothing else fills the gap</text>
</svg>
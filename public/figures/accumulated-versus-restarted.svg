<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上排三個節點串成一條向右上延伸的接力線，下排兩段短線彼此斷開互不相連">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">一邊接力，一邊從零</text>

<text class="t" x="60" y="124" font-size="19" font-weight="700" fill="var(--accent)">入侵方</text>
<polyline points="130,250 360,210 620,166 860,130" fill="none" stroke="var(--accent)" stroke-width="3"/>
<circle cx="130" cy="250" r="9" fill="var(--accent)"/>
<circle cx="360" cy="210" r="9" fill="var(--accent)"/>
<circle cx="620" cy="166" r="9" fill="var(--accent)"/>
<circle cx="860" cy="130" r="9" fill="var(--accent)"/>
<text class="t" x="104" y="286" font-size="16" fill="var(--dim)">伊斯帕尼奧拉</text>
<text class="t" x="334" y="246" font-size="16" fill="var(--dim)">科爾特斯</text>
<text class="t" x="594" y="202" font-size="16" fill="var(--dim)">皮薩羅</text>
<text class="t" x="806" y="114" font-size="16" fill="var(--dim)">整本劇本</text>

<line x1="60" y1="330" x2="900" y2="330" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="60" y="382" font-size="19" font-weight="700" fill="var(--dim)">防守方</text>
<line x1="130" y1="446" x2="330" y2="420" stroke="var(--grey)" stroke-width="3"/>
<circle cx="130" cy="446" r="9" fill="var(--grey)"/>
<text class="t" x="120" y="484" font-size="16" fill="var(--dim)">阿茲特克　兩年半</text>

<line x1="560" y1="452" x2="820" y2="416" stroke="var(--grey)" stroke-width="3"/>
<circle cx="560" cy="452" r="9" fill="var(--grey)"/>
<text class="t" x="550" y="490" font-size="16" fill="var(--dim)">印加　五年</text>

<line x1="360" y1="398" x2="420" y2="462" stroke="var(--warn)" stroke-width="2"/>
<line x1="420" y1="398" x2="480" y2="462" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="356" y="384" font-size="16" fill="var(--warn)">互不知道</text>

<text class="t" x="60" y="534" font-size="22" fill="var(--ink)">學習在發生，時間不夠</text>
</svg>
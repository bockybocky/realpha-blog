<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Four of five sources feed off the same open-interest data while the fifth answers a different question, leaving only one truly independent piece of evidence.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">Five bylines, one piece of evidence</text>

<rect x="100" y="120" width="140" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="262" y="120" width="140" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="424" y="120" width="140" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="586" y="120" width="140" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="748" y="120" width="140" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>

<text x="170" y="156" font-size="19" fill="var(--ink)" text-anchor="middle">Source 1</text>
<text x="332" y="156" font-size="19" fill="var(--ink)" text-anchor="middle">Source 2</text>
<text x="494" y="156" font-size="19" fill="var(--ink)" text-anchor="middle">Source 3</text>
<text x="656" y="156" font-size="19" fill="var(--ink)" text-anchor="middle">Source 4</text>
<text x="818" y="156" font-size="19" fill="var(--warn)" text-anchor="middle">Source 5</text>

<path d="M 170 176 L 350 310" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M 332 176 L 350 310" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M 494 176 L 350 310" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M 656 176 L 350 310" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M 818 176 L 730 310" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>

<rect x="180" y="310" width="340" height="76" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="350" y="345" font-size="19" fill="var(--ink)" text-anchor="middle">The same open-interest data</text>
<text x="350" y="371" font-size="16" fill="var(--dim)" text-anchor="middle">Sources 1 to 4 all read it</text>

<rect x="580" y="310" width="300" height="76" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="730" y="345" font-size="19" fill="var(--ink)" text-anchor="middle">A different question</text>
<text x="730" y="371" font-size="16" fill="var(--dim)" text-anchor="middle">Margin limits</text>

<text x="350" y="424" font-size="19" fill="var(--accent)" text-anchor="middle">Truly independent: 1</text>

<text x="480" y="480" font-size="22" fill="var(--ink)" text-anchor="middle">Independence is not about bylines; it is about failing together</text>
</svg>
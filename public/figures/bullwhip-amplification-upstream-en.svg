<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The size of one order cut is amplified layer by layer from downstream to upstream along the supply chain, with bar heights growing from small to large and the upstream bar tallest.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">One cut, bigger upstream</text>

  <rect x="60" y="100" width="300" height="76" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="80" y="130" font-size="16" fill="var(--dim)">Real need 5</text>
  <text class="t" x="80" y="158" font-size="16" fill="var(--dim)">Ordered to queue 50</text>

  <line x1="100" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>

  <rect x="150" y="380" width="110" height="60" rx="6" fill="var(--accent)" opacity="0.35"/>
  <rect x="330" y="330" width="110" height="110" rx="6" fill="var(--accent)" opacity="0.5"/>
  <rect x="510" y="275" width="110" height="165" rx="6" fill="var(--accent)" opacity="0.7"/>
  <rect x="690" y="215" width="110" height="225" rx="6" fill="var(--warn)"/>

  <text class="t" x="205" y="470" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">End</text>
  <text class="t" x="385" y="470" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Asm</text>
  <text class="t" x="565" y="470" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Part</text>
  <text class="t" x="745" y="470" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Top</text>
  <text class="t" x="745" y="496" font-size="16" fill="var(--warn)" text-anchor="middle">Taiwan</text>

  <text class="t" x="205" y="368" font-size="16" fill="var(--dim)" text-anchor="middle">-20%</text>
  <text class="t" x="745" y="203" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="middle">-50%</text>

  <path d="M 265 372 L 320 340" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 445 322 L 500 288" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 625 268 L 680 230" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 4"/>

  <text class="t" x="480" y="534" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Upstream just sees orders vanish</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一根柱子分成厚的上塊與薄的下塊，三個例子的箭頭全指向厚的上塊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); font-weight:600; }
    .body { font-size:16px; fill:var(--dim); }
    .concl { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t title" x="60" y="56">你的熟練度，熟的是哪一塊</text>

  <g>
    <rect x="70" y="130" width="260" height="60" rx="10" fill="var(--card)" stroke="var(--line)"/>
    <text class="t body" x="90" y="168">打擊場的九成好球</text>
    <rect x="70" y="212" width="260" height="60" rx="10" fill="var(--card)" stroke="var(--line)"/>
    <text class="t body" x="90" y="250">回測的固定題目</text>
    <rect x="70" y="294" width="260" height="60" rx="10" fill="var(--card)" stroke="var(--line)"/>
    <text class="t body" x="90" y="332">三到五月的上車行情</text>
  </g>
  <g stroke="var(--accent)" stroke-width="3" fill="none">
    <path d="M 340 160 L 470 226"/>
    <path d="M 340 242 L 470 242"/>
    <path d="M 340 324 L 470 258"/>
  </g>
  <path d="M 452 232 L 476 242 L 452 252" fill="var(--accent)"/>

  <rect x="500" y="130" width="300" height="230" rx="10" fill="var(--accent)" opacity="0.22"/>
  <text class="t grp" x="650" y="252" text-anchor="middle">環境的規律</text>
  <rect x="500" y="368" width="300" height="52" rx="10" fill="var(--card)" stroke="var(--warn)"/>
  <text class="t grp" x="650" y="402" text-anchor="middle">這件事本身</text>
  <text class="t body" x="820" y="258">熟練度都落在這裡</text>
  <text class="t body" x="820" y="402">沒被練到</text>

  <text class="t concl" x="60" y="500">拿掉規律，就知道剩下多少</text>
</svg>
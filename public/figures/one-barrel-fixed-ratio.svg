<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一個桶狀方塊被切成兩塊，上面小的一塊是柴油與航空燃油，下面大的一塊是占大頭卻賺不到錢的產品，右側箭頭指向開工率往下">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px}
    .b{font-size:15px;fill:var(--dim)}
    .c{font-size:22px}
  </style>
  <text class="t" x="40" y="58">一桶進去，比例是固定的</text>
  <rect x="140" y="130" width="220" height="330" rx="18" fill="var(--card)" stroke="var(--line)"/>
  <rect x="140" y="130" width="220" height="95" fill="var(--warn)" fill-opacity="0.9"/>
  <rect x="140" y="225" width="220" height="235" fill="var(--grey)" fill-opacity="0.5"/>
  <line x1="140" y1="225" x2="360" y2="225" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="162" y="178" fill="var(--page)">柴油／航油</text>
  <text class="b" x="162" y="204" fill="var(--page)">裂解 160 美元以上</text>
  <text class="g" x="162" y="286">占大頭的產品</text>
  <text class="b" x="162" y="312">現在賺不到你要的錢</text>
  <line x1="380" y1="300" x2="430" y2="300" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="430,292 430,308 444,300" fill="var(--dim)"/>
  <text class="g" x="464" y="292">開工率往下</text>
  <text class="b" x="464" y="320">就算柴油價差漂亮</text>
  <text class="g" x="464" y="382">維修一直延後</text>
  <text class="b" x="464" y="410">之後更難增產</text>
  <text class="b" x="140" y="502">汽油裂解已回到戰前水準（淡季）</text>
  <text class="c" x="40" y="538">固定比例綁住整桶的經濟</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="同一排點被兩個寬度不同的括弧框住，窄括弧框到三個點，寬括弧框到七個點">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">人沒有變多，是尺變長了</text>
  <text x="60" y="112" font-size="16" fill="var(--dim)">一個點代表一位使用者，橫軸是他上次出現在多久以前</text>
  <line x1="150" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="2"/>
  <circle cx="190" cy="300" r="10" fill="var(--accent)"/>
  <circle cx="260" cy="300" r="10" fill="var(--accent)"/>
  <circle cx="330" cy="300" r="10" fill="var(--accent)"/>
  <circle cx="440" cy="300" r="10" fill="var(--accent)"/>
  <circle cx="540" cy="300" r="10" fill="var(--accent)"/>
  <circle cx="650" cy="300" r="10" fill="var(--accent)"/>
  <circle cx="760" cy="300" r="10" fill="var(--accent)"/>
  <polyline points="160,240 160,210 380,210 380,240" fill="none" stroke="var(--dim)" stroke-width="3"/>
  <text x="160" y="190" font-size="20" fill="var(--dim)">三十天內出現過</text>
  <text x="396" y="216" font-size="16" fill="var(--dim)">數到 3 位</text>
  <polyline points="160,360 160,392 800,392 800,360" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text x="160" y="422" font-size="20" fill="var(--warn)">改成九十天內出現過</text>
  <text x="560" y="422" font-size="16" fill="var(--warn)">數到 7 位</text>
  <text x="60" y="488" font-size="22" fill="var(--ink)">數字變好，先問是東西變好還是尺換了。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩格：左邊長條總長不變只換色，右邊長條末端多出一段變長">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="48" y="56" font-size="27" font-weight="700" fill="var(--ink)">掠奪，還是新增？</text>

  <rect x="48" y="96" width="416" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="78" y="140" font-size="20" font-weight="700" fill="var(--ink)">訂單換手</text>
  <text x="106" y="176" font-size="15" fill="var(--dim)">之前</text>
  <rect x="106" y="186" width="126" height="46" rx="5" fill="var(--grey)"/>
  <rect x="236" y="186" width="96" height="46" rx="5" fill="var(--grey)"/>
  <rect x="336" y="186" width="66" height="46" rx="5" fill="var(--grey)"/>
  <text x="106" y="276" font-size="15" fill="var(--dim)">之後</text>
  <rect x="106" y="286" width="126" height="46" rx="5" fill="var(--grey)"/>
  <rect x="236" y="286" width="96" height="46" rx="5" fill="var(--accent)"/>
  <rect x="336" y="286" width="66" height="46" rx="5" fill="var(--grey)"/>
  <text x="106" y="380" font-size="16" fill="var(--dim)">總量不變　有人受傷</text>

  <rect x="496" y="96" width="416" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="526" y="140" font-size="20" font-weight="700" fill="var(--ink)">新開的案子</text>
  <text x="524" y="176" font-size="15" fill="var(--dim)">之前</text>
  <rect x="524" y="186" width="126" height="46" rx="5" fill="var(--grey)"/>
  <rect x="654" y="186" width="96" height="46" rx="5" fill="var(--grey)"/>
  <rect x="754" y="186" width="66" height="46" rx="5" fill="var(--grey)"/>
  <text x="524" y="276" font-size="15" fill="var(--dim)">之後</text>
  <rect x="524" y="286" width="126" height="46" rx="5" fill="var(--grey)"/>
  <rect x="654" y="286" width="96" height="46" rx="5" fill="var(--grey)"/>
  <rect x="754" y="286" width="66" height="46" rx="5" fill="var(--grey)"/>
  <rect x="824" y="286" width="56" height="46" rx="5" fill="var(--accent)"/>
  <text x="524" y="380" font-size="16" fill="var(--dim)">總量變大　分餅的人多一個</text>

  <text x="480" y="500" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">差別不在誰拿到，在餅有沒有變大</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The first 90% of the capital-expenditure bar is filled by prepayments, leaving only a short tail to be self-funded.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="56" y="66">Who pays first for accelerators</text>
<rect x="56" y="150" width="848" height="110" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="56" y="150" width="763" height="110" rx="10" fill="var(--accent)"/>
<text class="g" x="96" y="214" fill="var(--page)">Customer prepays 90%</text>
<text class="g" x="832" y="214">10%</text>
<text class="b" x="832" y="300">Self-funded</text>
<line x1="56" y1="360" x2="904" y2="360" stroke="var(--line)" stroke-width="3"/>
<circle cx="140" cy="360" r="11" fill="var(--warn)"/>
<text class="g" x="140" y="404">Contract signed</text>
<text class="b" x="140" y="432">Cash arrives</text>
<circle cx="620" cy="360" r="11" fill="var(--grey)"/>
<text class="g" x="620" y="404">Procurement</text>
<text class="b" x="620" y="432">Cash goes out</text>
<text class="c" x="56" y="492">Funding capacity solved upfront by contract terms</text>
</svg>
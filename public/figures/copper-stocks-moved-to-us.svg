<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條庫存長條，左側最大一段在美國倉庫，倫敦那段裡也有一塊在美國，上方括弧標出美國境內">
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px}
    .b{font-size:15px;fill:var(--dim)}
    .c{font-size:22px}
  </style>
  <text class="t" x="40" y="58">銅庫存搬到了美國</text>
  <text class="b" x="880" y="172" text-anchor="end">交易所監控庫存 超過 100 萬噸</text>
  <line x1="140" y1="192" x2="700" y2="192" stroke="var(--warn)" stroke-width="2"/>
  <line x1="140" y1="192" x2="140" y2="204" stroke="var(--warn)" stroke-width="2"/>
  <line x1="700" y1="192" x2="700" y2="204" stroke="var(--warn)" stroke-width="2"/>
  <text class="g" x="420" y="182" fill="var(--warn)" text-anchor="middle">美國境內</text>
  <rect x="140" y="220" width="482" height="80" fill="var(--accent)"/>
  <rect x="622" y="220" width="216" height="80" fill="var(--grey)"/>
  <rect x="622" y="220" width="78" height="80" fill="var(--accent)" fill-opacity="0.45"/>
  <rect x="838" y="220" width="22" height="80" fill="var(--line)"/>
  <text class="g" x="162" y="268" fill="var(--page)">COMEX 67%</text>
  <text class="b" x="730" y="330" text-anchor="middle">LME 30%（有一塊也在美國）</text>
  <line x1="420" y1="366" x2="420" y2="404" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="412,404 428,404 420,418" fill="var(--dim)"/>
  <text class="g" x="420" y="446" text-anchor="middle">關稅不開徵</text>
  <text class="g" x="420" y="474" text-anchor="middle">回流國際市場</text>
  <text class="c" x="40" y="514">庫存放在哪裡，本身就是風險</text>
</svg>
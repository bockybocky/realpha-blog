<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two points sit diagonally: two or three sheets at a fair price in the lower left and fifteen sheets at a high price in the upper right, joined by a dashed line.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="80" y="60" font-size="27" font-weight="700">More sheets, higher price</text>
<line x1="180" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="180" y1="130" x2="180" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="700" y="478" font-size="16" fill="var(--dim)">Sheets</text>
<text x="110" y="150" font-size="16" fill="var(--dim)">Cost</text>
<line x1="300" y1="390" x2="740" y2="200" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<circle cx="300" cy="390" r="14" fill="var(--accent)"/>
<text x="246" y="430" font-size="20" font-weight="700" fill="var(--accent)">2–3</text>
<text x="246" y="352" font-size="16">Fair px</text>
<text x="246" y="326" font-size="16">Core position</text>
<circle cx="740" cy="200" r="14" fill="var(--warn)"/>
<text x="700" y="172" font-size="20" font-weight="700" fill="var(--warn)">15</text>
<text x="770" y="206" font-size="16">Exp</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="時間軸上多數時段落在零線上方，只有一小段落在下方，末端又回到上方。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="72" font-size="27" fill="var(--ink)">股債同向才是常態</text>

  <rect x="70" y="250" width="570" height="80" fill="var(--grey)"/>
  <text x="355" y="298" font-size="20" fill="var(--ink)" text-anchor="middle">同向</text>
  <rect x="640" y="330" width="160" height="80" fill="var(--accent)"/>
  <text x="720" y="378" font-size="20" fill="var(--page)" text-anchor="middle">反向</text>
  <rect x="800" y="250" width="100" height="80" fill="var(--grey)"/>
  <text x="850" y="298" font-size="20" fill="var(--ink)" text-anchor="middle">同向</text>

  <line x1="60" y1="330" x2="910" y2="330" stroke="var(--dim)" stroke-width="2.5"/>
  <line x1="640" y1="235" x2="640" y2="445" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="800" y1="235" x2="800" y2="445" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>

  <text x="70" y="472" font-size="15" fill="var(--dim)">1800</text>
  <text x="640" y="472" font-size="15" fill="var(--dim)" text-anchor="middle">1998</text>
  <text x="800" y="472" font-size="15" fill="var(--dim)" text-anchor="middle">2022</text>
  <text x="900" y="472" font-size="15" fill="var(--dim)" text-anchor="end">今天</text>

  <text x="60" y="522" font-size="22" fill="var(--ink)">反向的那二十多年是例外，六四配置是踩在例外上</text>
</svg>
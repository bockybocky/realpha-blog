<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three bars compare cost per kilowatt: a decade ago is lowest, the increase he traced sits in the middle, and the figure circulating in the market is highest and marked as doubtful.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Two numbers, and where they part</text>
  <text class="t" x="60" y="94" font-size="16" fill="var(--dim)">Cost per kilowatt (illustrative)</text>

  <line x1="120" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

  <rect x="170" y="330" width="120" height="90" fill="var(--grey)"/>
  <text class="t" x="230" y="310" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">750</text>
  <text class="t" x="230" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">A decade ago</text>
  <text class="t" x="230" y="474" font-size="16" fill="var(--dim)" text-anchor="middle">Combined cycle</text>

  <rect x="420" y="300" width="120" height="120" fill="var(--accent)" opacity="0.85"/>
  <text class="t" x="480" y="280" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">+30% or so</text>
  <text class="t" x="480" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">What he traced</text>
  <text class="t" x="480" y="474" font-size="16" fill="var(--dim)" text-anchor="middle">Rise over five years</text>

  <rect x="670" y="120" width="120" height="300" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
  <text class="t" x="730" y="100" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">2500</text>
  <text class="t" x="730" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">Market talk</text>
  <text class="t" x="730" y="474" font-size="16" fill="var(--warn)" text-anchor="middle">He finds it steep</text>

  <text class="t" x="60" y="516" font-size="22" font-weight="700" fill="var(--ink)">Right direction, measure the size yourself</text>
</svg>
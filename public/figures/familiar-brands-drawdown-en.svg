<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Five bars of differing lengths all extending the same way, showing how far brands you use every day have fallen from their highs.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型 */
</style></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">Names you see every day</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">Drawdown from the high</text>
<rect x="60" y="112" width="840" height="336" fill="var(--card)" rx="8"/>
<line x1="300" y1="140" x2="300" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="300" y="440" font-size="15" fill="var(--dim)" text-anchor="middle">High</text>
<text x="278" y="176" font-size="19" fill="var(--ink)" text-anchor="end">Lululemon</text>
<rect x="300" y="156" width="440" height="28" fill="var(--warn)" rx="4"/>
<text x="756" y="176" font-size="19" fill="var(--ink)">55%</text>
<text x="278" y="231" font-size="19" fill="var(--ink)" text-anchor="end">Nike</text>
<rect x="300" y="211" width="400" height="28" fill="var(--warn)" rx="4" opacity="0.9"/>
<text x="716" y="231" font-size="19" fill="var(--ink)">50%</text>
<text x="278" y="286" font-size="19" fill="var(--ink)" text-anchor="end">Netflix</text>
<rect x="300" y="266" width="320" height="28" fill="var(--warn)" rx="4" opacity="0.8"/>
<text x="636" y="286" font-size="19" fill="var(--ink)">40%</text>
<text x="278" y="341" font-size="19" fill="var(--ink)" text-anchor="end">AutoZone</text>
<rect x="300" y="321" width="256" height="28" fill="var(--warn)" rx="4" opacity="0.7"/>
<text x="572" y="341" font-size="19" fill="var(--ink)">32%</text>
<text x="278" y="396" font-size="19" fill="var(--ink)" text-anchor="end">Domino's</text>
<rect x="300" y="376" width="224" height="28" fill="var(--warn)" rx="4" opacity="0.62"/>
<text x="540" y="396" font-size="19" fill="var(--ink)">28%</text>
<text x="60" y="500" font-size="22" fill="var(--ink)">Familiar did not make these bars any shorter</text>
</svg>
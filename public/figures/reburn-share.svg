<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="橫條左半表示燒過一次，下面長度剩一半的短條表示其中又燒了第二次">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">計畫結束後六年，火自己回來</text>
<text x="60" y="152" font-size="19" fill="var(--dim)">計畫區內一塊地</text>
<rect x="60" y="170" width="840" height="80" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="170" width="440" height="80" fill="var(--accent)"/>
<text x="84" y="218" font-size="16" fill="var(--page)">至少燒過一次</text>
<text x="524" y="218" font-size="16" fill="var(--dim)">沒再燒</text>
<line x1="60" y1="250" x2="60" y2="300" stroke="var(--line)" stroke-dasharray="5 5"/>
<line x1="280" y1="250" x2="280" y2="300" stroke="var(--line)" stroke-dasharray="5 5"/>
<rect x="60" y="300" width="220" height="60" fill="var(--warn)"/>
<text x="84" y="338" font-size="16" fill="var(--page)">燒了第二次</text>
<text x="60" y="392" font-size="16" fill="var(--dim)">一半的一半</text>
<text x="60" y="462" font-size="22" fill="var(--ink)">不堵渠道，火就回來</text>
</svg>
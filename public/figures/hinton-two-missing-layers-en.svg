<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Correct reasoning above, a narrow slice of the total workload, and an arrow blocked by an institutional wall.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { fill:var(--ink); font-size:27px; font-weight:700; }
    .g { fill:var(--dim); font-size:19px; }
    .l { fill:var(--ink); font-size:19px; }
    .a { fill:var(--accent); font-size:19px; font-weight:700; }
    .w { fill:var(--warn); font-size:19px; font-weight:700; }
    .c { fill:var(--ink); font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="64">The reasoning was right, the conclusion still wrong</text>

  <rect x="60" y="100" width="840" height="64" rx="12" fill="var(--card)"/>
  <text class="l" x="88" y="139">Reasoning . technically possible</text>
  <path d="M840 132 L854 146 L878 118" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>

  <text class="g" x="60" y="222">Missing layer 1 . coverage</text>
  <rect x="60" y="240" width="840" height="52" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="60" y="240" width="92" height="52" rx="8" fill="var(--accent)"/>
  <text class="a" x="106" y="320" text-anchor="middle">Can do</text>
  <text class="g" x="900" y="320" text-anchor="end">Everything read in a day</text>

  <text class="g" x="60" y="386">Missing layer 2 . rules and liability</text>
  <rect x="60" y="406" width="190" height="64" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="l" x="155" y="445" text-anchor="middle">Model reading</text>
  <path d="M266 438 L446 438" stroke="var(--accent)" stroke-width="4"/>
  <rect x="470" y="392" width="16" height="94" fill="var(--warn)"/>
  <text class="w" x="478" y="514" text-anchor="middle">Payment . liability</text>
  <rect x="700" y="406" width="200" height="64" rx="10" fill="var(--page)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="g" x="800" y="445" text-anchor="middle">Replace doctors</text>

  <text class="c" x="60" y="558">Possible is not the same as going to happen</text>
</svg>
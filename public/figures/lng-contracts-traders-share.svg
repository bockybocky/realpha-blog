<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="長約量條中超過一半屬於中間商待轉賣，真實終端需求只有較短的右段">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .u { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="56">簽約量不等於有人要用</text>
<text class="u" x="140" y="146">簽下的長約總量</text>
<rect x="140" y="160" width="680" height="88" fill="var(--grey)" rx="4"/>
<rect x="140" y="160" width="380" height="88" fill="var(--warn)" rx="4"/>
<line x1="520" y1="160" x2="520" y2="248" stroke="var(--page)" stroke-width="3"/>
<text class="g" x="170" y="198" fill="var(--page)">中間商</text>
<text class="u" x="170" y="226" fill="var(--page)">還要再轉賣</text>
<text class="g" x="550" y="198">終端用戶</text>
<text class="u" x="550" y="226">真的會燒掉</text>
<text class="u" x="140" y="330">真實終端需求</text>
<rect x="520" y="344" width="300" height="88" fill="var(--accent)" rx="4"/>
<text class="g" x="550" y="398" fill="var(--page)">只有這一段</text>
<path d="M 520 256 L 520 336" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 4"/>
<text class="c" x="140" y="484">超過一半，是別人承擔的風險</text>
</svg>
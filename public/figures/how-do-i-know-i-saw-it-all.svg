<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="兩條同長的框，上面只填三成、下面填了九成以上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">同一批紀錄，母體差了三倍</text>
<text x="150" y="146" font-size="20" fill="var(--dim)">前兩次的資料集</text>
<rect x="150" y="160" width="640" height="72" rx="6" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="160" width="192" height="72" rx="6" fill="var(--grey)"/>
<text x="252" y="204" font-size="19" fill="var(--page)">三成</text>
<text x="500" y="204" font-size="16" fill="var(--dim)">找不到作者</text>
<text x="150" y="304" font-size="20" fill="var(--dim)">換一批更廣的資料</text>
<rect x="150" y="318" width="640" height="72" rx="6" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="318" width="582" height="72" rx="6" fill="var(--accent)"/>
<text x="400" y="362" font-size="19" fill="var(--page)">九成以上</text>
<text x="60" y="460" font-size="22" fill="var(--ink)">不抽樣，就不知道自己只看到一角</text>
</svg>
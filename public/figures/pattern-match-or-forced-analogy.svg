<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩個形狀進同一台引擎，吐出外觀相同的輸出，真洞見與硬掰重疊在同一個出口">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="56" font-size="27" fill="var(--ink)">形狀比對，與硬掰，同一個出口</text>

<path d="M60 170 L130 140 L150 210 L80 236 Z" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="60" y="270" font-size="16" fill="var(--dim)">一個解法</text>
<path d="M60 350 L132 326 L148 398 L74 414 Z" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text x="60" y="450" font-size="16" fill="var(--dim)">一個難題</text>

<path d="M160 190 L330 250" fill="none" stroke="var(--grey)" stroke-width="5"/>
<path d="M160 370 L330 300" fill="none" stroke="var(--grey)" stroke-width="5"/>

<rect x="330" y="212" width="190" height="128" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="356" y="264" font-size="20" fill="var(--ink)">比對引擎</text>
<text x="356" y="300" font-size="16" fill="var(--dim)">找相似的形狀</text>

<path d="M520 276 L620 276" stroke="var(--accent)" stroke-width="7"/>
<rect x="620" y="212" width="280" height="128" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="648" y="264" font-size="20" fill="var(--accent)">說得通的相似性</text>
<text x="648" y="300" font-size="16" fill="var(--dim)">讀起來一樣聰明</text>

<text x="620" y="398" font-size="19" fill="var(--ink)">真洞見</text>
<text x="720" y="398" font-size="19" fill="var(--warn)">硬掰</text>
<path d="M700 384 L716 384" stroke="var(--line)" stroke-width="3"/>
<text x="620" y="440" font-size="16" fill="var(--dim)">事前分不開</text>
</g>
</svg>
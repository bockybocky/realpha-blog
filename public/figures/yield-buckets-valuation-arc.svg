<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三根柱子中間最高兩邊低，最右邊七趴以上那格最低">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:600; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">最高的倍數不在最低的利率</text>
<text class="n" x="60" y="88">按 10 年期殖利率分級距，前瞻本益比中位數</text>

<rect x="60" y="110" width="840" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
<line x1="110" y1="400" x2="850" y2="400" stroke="var(--line)" stroke-width="2"/>

<rect x="170" y="268" width="150" height="132" rx="4" fill="var(--grey)"/>
<text class="n" x="196" y="430">殖利率 0 到 3%</text>

<rect x="405" y="176" width="150" height="224" rx="4" fill="var(--accent)"/>
<text class="g" x="452" y="164">最高</text>
<text class="n" x="428" y="430">3 到 7%</text>

<rect x="640" y="318" width="150" height="82" rx="4" fill="var(--warn)"/>
<text class="g" x="646" y="306">13.6 倍</text>
<text class="n" x="668" y="430">7% 以上</text>

<text class="c" x="60" y="494">5% 在這張圖上不是斷點，是中段</text>
</svg>
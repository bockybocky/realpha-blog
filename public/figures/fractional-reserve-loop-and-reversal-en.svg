<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A credit loop on the left contrasted with a steep decline curve on the right when it reverses.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">The loop, and the loop reversing</text>

<circle cx="276" cy="300" r="130" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polygon points="276,158 296,182 256,182" fill="var(--accent)"/>
<circle cx="276" cy="300" r="60" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="238" y="296" font-size="19" fill="var(--ink)">Chip</text>
<text x="238" y="324" font-size="19" fill="var(--ink)">Suppliers</text>
<text x="402" y="258" font-size="19" fill="var(--accent)">Credit</text>
<text x="402" y="286" font-size="16" fill="var(--dim)">Balance sheets</text>
<text x="120" y="420" font-size="19" fill="var(--accent)">Orders</text>
<text x="222" y="474" font-size="19" fill="var(--ink)">Providers</text>
<text x="222" y="118" font-size="16" fill="var(--dim)">Leverage each turn</text>

<line x1="560" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="560" y1="440" x2="560" y2="160" stroke="var(--line)" stroke-width="2"/>
<polyline points="570,200 650,216 710,250 760,320 800,400 860,430" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text x="604" y="170" font-size="19" fill="var(--warn)">Reversal</text>
<text x="604" y="198" font-size="16" fill="var(--dim)">Geometric</text>

<text x="60" y="524" font-size="22" fill="var(--ink)">Up it adds, down it multiplies</text>
</svg>
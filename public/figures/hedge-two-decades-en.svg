<svg xmlns="http://www.w3.org/2000/svg" id="fig-hedge-decades" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars on opposite sides of the zero line, left up and right down, the same asset moving in opposite directions across two decades">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
#fig-hedge-decades text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-hedge-decades .h { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-hedge-decades .g { font-size:20px; fill:var(--ink); font-weight:600; }
#fig-hedge-decades .b { font-size:16px; fill:var(--dim); }
#fig-hedge-decades .s { font-size:15px; fill:var(--dim); }
#fig-hedge-decades .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="h" x="60" y="54">One hedge, two decades</text>
<text class="b" x="60" y="84">Long Treasury ETF, total return</text>
<line x1="120" y1="300" x2="860" y2="300" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="112" y="305" text-anchor="end">0</text>
<rect x="220" y="156" width="170" height="144" fill="var(--accent)"/>
<text class="g" x="305" y="142" text-anchor="middle">+8%</text>
<text class="b" x="305" y="332" text-anchor="middle">2010 – 2019</text>
<text class="s" x="305" y="356" text-anchor="middle">Held when stocks fell</text>
<rect x="590" y="300" width="170" height="79" fill="var(--warn)"/>
<text class="g" x="675" y="404" text-anchor="middle">−4.4%</text>
<text class="b" x="675" y="278" text-anchor="middle">2020 – now</text>
<text class="s" x="675" y="254" text-anchor="middle">And no crash</text>
<text class="c" x="60" y="470">From premium to principal</text>
</svg>
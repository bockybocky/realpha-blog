<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The page numbers on three documents are circled, the model's page-number bar is far longer than its writing-style bar, and it scores full marks on the test set.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="64" class="t">100% by pg #</text>
<g>
<rect x="60" y="140" width="140" height="200" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--grey)"><rect x="78" y="166" width="100" height="7" rx="3"/><rect x="78" y="188" width="96" height="7" rx="3"/><rect x="78" y="210" width="104" height="7" rx="3"/><rect x="78" y="232" width="88" height="7" rx="3"/><rect x="78" y="254" width="100" height="7" rx="3"/><rect x="78" y="276" width="70" height="7" rx="3"/></g>
<circle cx="172" cy="316" r="17" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text x="172" y="322" text-anchor="middle" style="fill:var(--warn);font-size:16px;font-weight:700">5</text>
</g>
<g>
<rect x="230" y="140" width="140" height="200" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--grey)"><rect x="248" y="166" width="100" height="7" rx="3"/><rect x="248" y="188" width="96" height="7" rx="3"/><rect x="248" y="210" width="104" height="7" rx="3"/><rect x="248" y="232" width="88" height="7" rx="3"/><rect x="248" y="254" width="100" height="7" rx="3"/><rect x="248" y="276" width="70" height="7" rx="3"/></g>
<circle cx="342" cy="316" r="17" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text x="342" y="322" text-anchor="middle" style="fill:var(--warn);font-size:16px;font-weight:700">7</text>
</g>
<g>
<rect x="400" y="140" width="140" height="200" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--grey)"><rect x="418" y="166" width="100" height="7" rx="3"/><rect x="418" y="188" width="96" height="7" rx="3"/><rect x="418" y="210" width="104" height="7" rx="3"/><rect x="418" y="232" width="88" height="7" rx="3"/><rect x="418" y="254" width="100" height="7" rx="3"/><rect x="418" y="276" width="70" height="7" rx="3"/></g>
<circle cx="512" cy="316" r="17" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text x="512" y="322" text-anchor="middle" style="fill:var(--warn);font-size:16px;font-weight:700">9</text>
</g>
<text x="300" y="385" class="g" text-anchor="middle">Satoshi</text>
<text x="620" y="170" class="g">Model cues</text>
<text x="620" y="226" class="b">Pen</text>
<rect x="690" y="208" width="36" height="24" rx="4" fill="var(--grey)"/>
<text x="620" y="281" class="b">Pg#</text>
<rect x="690" y="263" width="220" height="24" rx="4" fill="var(--warn)"/>
<rect x="620" y="320" width="290" height="64" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="765" y="360" class="c" text-anchor="middle" style="fill:var(--accent)">Test 100%</text>
<text x="480" y="470" class="c" text-anchor="middle">Style? Got pg #</text>
</svg>
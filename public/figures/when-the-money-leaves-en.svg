<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Withdrawals of the same size taken early and late lead to very different ending heights on the right.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px;font-weight:700}
    .b{font-size:16px;fill:var(--dim)}
    .k{font-size:22px;font-weight:700}
</style>
<text class="t" x="60" y="58">Same sum, different year out</text>
<line x1="120" y1="462" x2="880" y2="462" stroke="var(--line)" stroke-width="2"/>
<path d="M120,458 C 420,444 650,380 866,120" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
<text class="b" x="866" y="106" text-anchor="end" fill="var(--accent)">Never interrupted</text>
<path d="M120,458 C 220,452 276,444 300,438" fill="none" stroke="var(--warn)" stroke-width="3"/>
<path d="M300,456 C 480,446 680,406 866,330" fill="none" stroke="var(--warn)" stroke-width="3"/>
<line x1="300" y1="438" x2="300" y2="456" stroke="var(--warn)" stroke-width="3"/>
<circle cx="300" cy="438" r="5" fill="var(--warn)"/>
<text class="b" x="300" y="424" text-anchor="middle" fill="var(--warn)">$10k out at 25</text>
<path d="M120,458 C 420,444 620,394 700,352" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M700,370 C 780,320 830,240 866,178" fill="none" stroke="var(--grey)" stroke-width="3"/>
<line x1="700" y1="352" x2="700" y2="370" stroke="var(--grey)" stroke-width="3"/>
<circle cx="700" cy="352" r="5" fill="var(--grey)"/>
<text class="b" x="700" y="338" text-anchor="middle">$10k out at 55</text>
<line x1="884" y1="120" x2="884" y2="330" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="b" x="900" y="232" transform="rotate(90 900 232)">Two orders</text>
<text class="b" x="120" y="492">Start</text>
<text class="b" x="866" y="492" text-anchor="end">End</text>
<text class="k" x="60" y="534">You lose its offspring in every year that follows</text>
</svg>
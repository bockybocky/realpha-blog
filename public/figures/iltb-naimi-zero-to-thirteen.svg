<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一個空圓、右邊十三個實心圓點的方陣，中間一支箭頭標示同一個做法">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="80" y="60" font-size="27" font-weight="700">沒換的是做法，換的是張數</text>
<circle cx="200" cy="270" r="48" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>
<text x="178" y="282" font-size="27" font-weight="700" fill="var(--dim)">0</text>
<text x="150" y="380" font-size="19">意向書</text>
<text x="142" y="412" font-size="16" fill="var(--dim)">九個月前</text>
<line x1="290" y1="270" x2="520" y2="270" stroke="var(--line)" stroke-width="3"/>
<polygon points="520,258 552,270 520,282" fill="var(--line)"/>
<text x="300" y="242" font-size="16" fill="var(--dim)">同一批人、同一個做法</text>
<text x="300" y="306" font-size="16" fill="var(--dim)">八到十週</text>
<circle cx="640" cy="180" r="15" fill="var(--accent)"/>
<circle cx="686" cy="180" r="15" fill="var(--accent)"/>
<circle cx="732" cy="180" r="15" fill="var(--accent)"/>
<circle cx="778" cy="180" r="15" fill="var(--accent)"/>
<circle cx="824" cy="180" r="15" fill="var(--accent)"/>
<circle cx="640" cy="232" r="15" fill="var(--accent)"/>
<circle cx="686" cy="232" r="15" fill="var(--accent)"/>
<circle cx="732" cy="232" r="15" fill="var(--accent)"/>
<circle cx="778" cy="232" r="15" fill="var(--accent)"/>
<circle cx="824" cy="232" r="15" fill="var(--accent)"/>
<circle cx="640" cy="284" r="15" fill="var(--accent)"/>
<circle cx="686" cy="284" r="15" fill="var(--accent)"/>
<circle cx="732" cy="284" r="15" fill="var(--accent)"/>
<text x="628" y="380" font-size="27" font-weight="700" fill="var(--accent)">13</text>
<text x="664" y="380" font-size="19">張意向書</text>
<text x="628" y="412" font-size="16" fill="var(--dim)">超額認購</text>
<text x="80" y="500" font-size="22" font-weight="700">題目沒變，共識變了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊層層往上呈報配短時間軸，右邊沒有上層配長時間軸">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="60" y="68">向上呈報幾層，決定你看多遠</text>

<rect x="80" y="110" width="300" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="100" y="148">股東／集團</text>
<rect x="80" y="196" width="300" height="56" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="100" y="234">執行長</text>
<rect x="80" y="282" width="300" height="56" rx="10" fill="var(--accent)" opacity="0.9"/>
<text class="t g" x="100" y="320" fill="var(--page)">領隊</text>
<g stroke="var(--dim)" stroke-width="3" fill="none">
<path d="M230 282 L230 256"/><path d="M230 196 L230 170"/>
</g>
<polygon points="230,250 224,262 236,262" fill="var(--dim)"/>
<polygon points="230,164 224,176 236,176" fill="var(--dim)"/>
<text class="t b" x="80" y="378">決定前要先問過人</text>
<path d="M80 420 L170 420" stroke="var(--warn)" stroke-width="6"/>
<text class="t g" x="80" y="460">一年</text>

<rect x="560" y="282" width="300" height="56" rx="10" fill="var(--accent)" opacity="0.9"/>
<text class="t g" x="580" y="320" fill="var(--page)">領隊兼股東</text>
<text class="t b" x="560" y="378">不會被解雇</text>
<path d="M560 420 L900 420" stroke="var(--accent)" stroke-width="6"/>
<text class="t g" x="560" y="460">十年</text>

<text class="t c" x="60" y="520">上面沒有人要報告，刻度就拉長</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條時間軸上下對照：上面那條股價轉跌的點在前、營收轉跌的點隔了六個月；下面那條股價先崩，缺貨的粗線還一路延伸到底"><rect x="0" y="0" width="960" height="540" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style><g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'><text x="60" y="58" font-size="27px" fill="var(--ink)" text-anchor="start" font-weight="600">以前股價先見高原，現在股價先崩</text><line x1="140" y1="220" x2="880" y2="220" stroke="var(--line)" stroke-width="2"/><text x="120" y="226" font-size="19px" fill="var(--dim)" text-anchor="end" font-weight="normal">以前</text><line x1="140" y1="380" x2="880" y2="380" stroke="var(--line)" stroke-width="2"/><text x="120" y="386" font-size="19px" fill="var(--dim)" text-anchor="end" font-weight="normal">現在</text><circle cx="420" cy="220" r="12" fill="var(--accent)"/><text x="420" y="196" font-size="19px" fill="var(--ink)" text-anchor="middle" font-weight="normal">股價轉跌</text><circle cx="700" cy="220" r="12" fill="var(--grey)"/><text x="700" y="196" font-size="19px" fill="var(--dim)" text-anchor="middle" font-weight="normal">營收轉跌</text><line x1="420" y1="256" x2="700" y2="256" stroke="var(--grey)" stroke-width="2"/><text x="560" y="282" font-size="16px" fill="var(--dim)" text-anchor="middle" font-weight="normal">六個月</text><rect x="300" y="344" width="580" height="12" fill="var(--grey)"/><text x="640" y="334" font-size="16px" fill="var(--dim)" text-anchor="middle" font-weight="normal">還在缺貨</text><circle cx="300" cy="380" r="12" fill="var(--accent)"/><text x="300" y="420" font-size="19px" fill="var(--warn)" text-anchor="middle" font-weight="normal">股價先崩</text><text x="140" y="452" font-size="16px" fill="var(--dim)" text-anchor="start" font-weight="normal">時間</text><text x="60" y="496" font-size="22px" fill="var(--ink)" text-anchor="start" font-weight="600">定價的手換人，順序就反過來</text></g></svg>
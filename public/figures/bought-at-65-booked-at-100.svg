<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊較矮的成交價柱與右邊較高的入帳價柱並列，落差來自兩者由不同的人決定">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">付出去的，與寫下來的</text>

<rect x="60" y="92" width="840" height="340" rx="10" fill="var(--card)"/>
<line x1="120" y1="400" x2="860" y2="400" stroke="var(--line)" stroke-width="2"/>

<rect x="230" y="270" width="150" height="130" rx="6" fill="var(--accent)"/>
<text class="t" x="248" y="254" font-size="27" font-weight="700" fill="var(--accent)">65</text>
<text class="t" x="230" y="432" font-size="16" fill="var(--dim)">成交價</text>
<text class="t" x="230" y="456" font-size="16" fill="var(--dim)">買賣雙方談</text>

<rect x="590" y="200" width="150" height="200" rx="6" fill="var(--grey)"/>
<text class="t" x="608" y="184" font-size="27" font-weight="700" fill="var(--ink)">100</text>
<text class="t" x="590" y="432" font-size="16" fill="var(--dim)">帳上價</text>
<text class="t" x="590" y="456" font-size="16" fill="var(--dim)">基金經理人標</text>

<line x1="400" y1="240" x2="570" y2="240" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="408" y="228" font-size="19" font-weight="700" fill="var(--warn)">兩個人在定價</text>

<text class="t" x="60" y="506" font-size="22" font-weight="700" fill="var(--ink)">落差不是造假，是兩把尺</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條長條中只有最左端一小截被標示，其餘九成以上維持灰色，下方兩個並列方框做對比">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="80" y="76" font-size="27">少了她那一輪就募不到的，只有 5–10%</text>
  <text x="114" y="158" font-size="20" fill="var(--accent)" text-anchor="middle">5–10%</text>
  <rect x="80" y="180" width="800" height="96" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="80" y="180" width="68" height="96" rx="6" fill="var(--accent)"/>
  <text x="530" y="235" font-size="19" fill="var(--dim)" text-anchor="middle">換個投資人，照樣拿得到錢</text>
  <line x1="80" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="2"/>
  <line x1="80" y1="292" x2="80" y2="308" stroke="var(--line)" stroke-width="2"/>
  <line x1="880" y1="292" x2="880" y2="308" stroke="var(--line)" stroke-width="2"/>
  <text x="480" y="330" font-size="16" fill="var(--dim)" text-anchor="middle">她投的每一家公司</text>
  <text x="80" y="400" font-size="19" fill="var(--dim)">她認為自己真正能左右的</text>
  <rect x="80" y="420" width="380" height="72" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="270" y="464" font-size="20" fill="var(--accent)" text-anchor="middle">下一筆一億美元的算力</text>
  <rect x="500" y="420" width="330" height="72" rx="12" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="665" y="464" font-size="20" fill="var(--dim)" text-anchor="middle">不是：能不能募到錢</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="十二個方塊中只有一個被填色">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">庫存只動了一小口</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">一格 ≈ 1 億桶</text>

<rect x="68" y="150" width="124" height="88" rx="6" fill="var(--accent)"/>
<rect x="208" y="150" width="124" height="88" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="348" y="150" width="124" height="88" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="488" y="150" width="124" height="88" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="628" y="150" width="124" height="88" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="768" y="150" width="124" height="88" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="68" y="254" width="124" height="88" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="208" y="254" width="124" height="88" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="348" y="254" width="124" height="88" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="488" y="254" width="124" height="88" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="628" y="254" width="124" height="88" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="768" y="254" width="124" height="88" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

<line x1="130" y1="150" x2="130" y2="124" stroke="var(--accent)" stroke-width="2"/>
<text x="130" y="116" font-size="19" font-weight="600" fill="var(--accent)" text-anchor="middle">動用 約 1 億桶</text>
<text x="892" y="382" font-size="19" fill="var(--dim)" text-anchor="end">戰前庫存 11～14 億桶</text>

<text x="60" y="446" font-size="22" font-weight="600" fill="var(--ink)">大海裡的一滴</text>
<text x="60" y="478" font-size="16" fill="var(--dim)">全部是外部估算，官方不公布</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="四根長條：起點很矮，虛線框的峰頂最高，背後開槍落在峰頂下方一截並以警示色標出中間那段差距，邊漲邊賣只剩低矮的一截">
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .gd { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .w { font-size:19px; fill:var(--warn); }
    .a { font-size:19px; fill:var(--accent); }
  </style>
  <text class="t" x="60" y="66">邊漲邊賣的人，終端比較少</text>
  <line x1="70" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
  <rect x="120" y="383" width="110" height="37" fill="var(--grey)"/>
  <text class="b" x="120" y="448">起點</text>
  <text class="b" x="120" y="470">100 萬</text>
  <rect x="300" y="160" width="110" height="260" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="b" x="300" y="448">峰頂</text>
  <text class="b" x="300" y="470">700 萬</text>
  <rect x="480" y="198" width="110" height="222" fill="var(--accent)"/>
  <text class="a" x="480" y="186">600 萬</text>
  <text class="b" x="480" y="448">從背後開槍</text>
  <line x1="470" y1="235" x2="600" y2="235" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="b" x="652" y="248">或 500 萬</text>
  <line x1="612" y1="160" x2="612" y2="235" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="604 166 620 166 612 152" fill="var(--warn)"/>
  <polygon points="604 229 620 229 612 243" fill="var(--warn)"/>
  <text class="w" x="640" y="150">心痛的那兩百萬</text>
  <rect x="660" y="309" width="110" height="111" fill="var(--grey)"/>
  <text class="b" x="660" y="296">200–300 萬</text>
  <text class="b" x="660" y="448">邊漲邊賣</text>
  <text class="c" x="60" y="500">忍到背後開槍，拿回來的比較多</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="圓形上鋪格子只有中央亮起，方形上鋪格子全部亮起">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">方的比圓的好切，角落不用丟掉</text>
<text x="250" y="108" font-size="19" fill="var(--dim)" text-anchor="middle">圓晶圓</text>
<text x="700" y="108" font-size="19" fill="var(--accent)" text-anchor="middle">方面板</text>

<circle cx="250" cy="330" r="150" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g stroke="var(--line)">
<rect x="100" y="180" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="160" y="180" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="220" y="180" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="280" y="180" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="340" y="180" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="100" y="240" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="160" y="240" width="60" height="60" fill="var(--accent)" opacity="0.3"/>
<rect x="220" y="240" width="60" height="60" fill="var(--accent)" opacity="0.3"/>
<rect x="280" y="240" width="60" height="60" fill="var(--accent)" opacity="0.3"/>
<rect x="340" y="240" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="100" y="300" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="160" y="300" width="60" height="60" fill="var(--accent)" opacity="0.3"/>
<rect x="220" y="300" width="60" height="60" fill="var(--accent)" opacity="0.3"/>
<rect x="280" y="300" width="60" height="60" fill="var(--accent)" opacity="0.3"/>
<rect x="340" y="300" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="100" y="360" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="160" y="360" width="60" height="60" fill="var(--accent)" opacity="0.3"/>
<rect x="220" y="360" width="60" height="60" fill="var(--accent)" opacity="0.3"/>
<rect x="280" y="360" width="60" height="60" fill="var(--accent)" opacity="0.3"/>
<rect x="340" y="360" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="100" y="420" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="160" y="420" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="220" y="420" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="280" y="420" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
<rect x="340" y="420" width="60" height="60" fill="var(--grey)" opacity="0.28"/>
</g>
<circle cx="250" cy="330" r="150" fill="none" stroke="var(--ink)" stroke-width="2"/>
<text x="250" y="520" font-size="16" fill="var(--dim)" text-anchor="middle">完整的只有 9 格</text>

<rect x="550" y="180" width="300" height="300" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
<g stroke="var(--line)" fill="var(--accent)" opacity="0.3">
<rect x="550" y="180" width="60" height="60"/><rect x="610" y="180" width="60" height="60"/><rect x="670" y="180" width="60" height="60"/><rect x="730" y="180" width="60" height="60"/><rect x="790" y="180" width="60" height="60"/>
<rect x="550" y="240" width="60" height="60"/><rect x="610" y="240" width="60" height="60"/><rect x="670" y="240" width="60" height="60"/><rect x="730" y="240" width="60" height="60"/><rect x="790" y="240" width="60" height="60"/>
<rect x="550" y="300" width="60" height="60"/><rect x="610" y="300" width="60" height="60"/><rect x="670" y="300" width="60" height="60"/><rect x="730" y="300" width="60" height="60"/><rect x="790" y="300" width="60" height="60"/>
<rect x="550" y="360" width="60" height="60"/><rect x="610" y="360" width="60" height="60"/><rect x="670" y="360" width="60" height="60"/><rect x="730" y="360" width="60" height="60"/><rect x="790" y="360" width="60" height="60"/>
<rect x="550" y="420" width="60" height="60"/><rect x="610" y="420" width="60" height="60"/><rect x="670" y="420" width="60" height="60"/><rect x="730" y="420" width="60" height="60"/><rect x="790" y="420" width="60" height="60"/>
</g>
<text x="700" y="520" font-size="16" fill="var(--accent)" text-anchor="middle">25 格全用</text>

<text x="480" y="570" font-size="22" fill="var(--ink)" text-anchor="middle">技術沒變神，是替代品變貴了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars sit eight months apart: a short gray bar at $150 on the left and an orange bar more than six times taller, above $1,000, on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .ac { fill:var(--accent); }
    .wn { fill:var(--warn); }
    .inv { fill:var(--page); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="480" y="52" text-anchor="middle" class="t">Sulfuric acid price ($/ton)</text>
<text x="480" y="84" text-anchor="middle" class="d">Used in: copper leaching · fertilizer · chips</text>
<rect x="260" y="395" width="160" height="45" fill="var(--grey)"/>
<rect x="540" y="140" width="160" height="300" fill="var(--warn)"/>
<line x1="200" y1="440" x2="760" y2="440" stroke="var(--grey)" stroke-width="2"/>
<text x="340" y="382" text-anchor="middle" class="g">150</text>
<text x="620" y="127" text-anchor="middle" class="g wn">1,000+</text>
<text x="340" y="472" text-anchor="middle" class="b">Before</text>
<text x="620" y="472" text-anchor="middle" class="b">8 months later</text>
<text x="480" y="516" text-anchor="middle" class="c">Hormuz blocked · Russia, China ban exports</text>
</svg>
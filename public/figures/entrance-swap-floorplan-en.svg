<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two show-floor plans compared: in past years the entrance faced electric vehicles, while this year it faces customer hardware and a teardown wall, with the vehicles moved to a side corner.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="52">Who's at the door</text>

  <rect x="60" y="100" width="380" height="330" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="60" y="88">Past</text>
  <rect x="150" y="330" width="200" height="72" rx="6" fill="var(--grey)"/>
  <text class="b" x="212" y="373" fill="var(--page)">EVs</text>
  <rect x="190" y="150" width="130" height="52" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="d" x="206" y="182">OEM gear</text>
  <text class="d" x="330" y="146">Far</text>
  <line x1="250" y1="500" x2="250" y2="412" stroke="var(--ink)" stroke-width="3"/>
  <polygon points="250,402 243,418 257,418" fill="var(--ink)"/>
  <text class="d" x="214" y="522">Entrance</text>

  <rect x="520" y="100" width="380" height="330" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="520" y="88">Now</text>
  <rect x="600" y="352" width="230" height="24" rx="4" fill="var(--accent)"/>
  <text class="b" x="636" y="398" fill="var(--ink)">Wall</text>
  <rect x="604" y="290" width="62" height="46" rx="5" fill="var(--accent)"/>
  <rect x="676" y="290" width="62" height="46" rx="5" fill="var(--accent)"/>
  <rect x="748" y="290" width="62" height="46" rx="5" fill="var(--accent)"/>
  <text class="d" x="604" y="278">Dell</text>
  <text class="d" x="676" y="278">Cisco</text>
  <text class="d" x="748" y="278">HP</text>
  <rect x="836" y="150" width="50" height="118" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="d" x="846" y="140">Side</text>
  <text class="d" x="848" y="216">EV</text>
  <line x1="710" y1="500" x2="710" y2="412" stroke="var(--ink)" stroke-width="3"/>
  <polygon points="710,402 703,418 717,418" fill="var(--ink)"/>
  <text class="d" x="674" y="522">Entry</text>

  <text class="c" x="60" y="548">Swapped the lead</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A bell curve marked at two places: the middle is the average the statistics describe, and the shaded right tail is the sample you see yourself.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="62">The two numbers describe different places</text>

  <path d="M100 420 C 300 420 300 150 490 150 C 680 150 680 420 880 420" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
  <path d="M700 420 C 760 400 800 350 880 420 Z" fill="var(--warn)" opacity="0.25"/>
  <rect x="700" y="236" width="180" height="184" fill="var(--warn)" opacity="0.18"/>
  <line x1="80" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

  <line x1="490" y1="150" x2="490" y2="420" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="490" cy="150" r="8" fill="var(--accent)"/>
  <text class="g" x="490" y="124" text-anchor="middle" fill="var(--accent)">Average</text>
  <text class="b" x="490" y="462" text-anchor="middle">The statistics describe here</text>

  <circle cx="790" cy="300" r="8" fill="var(--warn)"/>
  <text class="g" x="790" y="214" text-anchor="middle" fill="var(--warn)">The top</text>
  <text class="b" x="790" y="462" text-anchor="middle">Your eyes sample here</text>

  <text class="c" x="80" y="510">Both true; keep them apart</text>
</svg>
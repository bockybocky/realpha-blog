<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩組橫條比較世界盃與洛杉磯奧運：選手人數 600 對 17000，條長差距懸殊；售票 650 萬對 1500 萬張">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600}
.b{font-size:16px}
.d{font-size:15px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">兩場都叫大型賽事，體量差一個級距</text>
<text class="d" x="60" y="92">2026 美墨加世界盃　對　2028 洛杉磯奧運加帕運</text>
<text class="g" x="60" y="152">選手人數</text>
<rect x="60" y="170" width="30" height="34" rx="4" fill="var(--grey)"/>
<text class="b" x="102" y="193">600 人／世界盃</text>
<rect x="60" y="216" width="840" height="34" rx="4" fill="var(--accent)"/>
<text x="884" y="239" text-anchor="end" style="font-size:16px;fill:var(--page)">17,000 人／洛杉磯</text>
<text class="g" x="60" y="304">售票張數</text>
<rect x="60" y="322" width="364" height="34" rx="4" fill="var(--grey)"/>
<text class="b" x="436" y="345">650 萬張／世界盃</text>
<rect x="60" y="368" width="840" height="34" rx="4" fill="var(--accent)"/>
<text x="884" y="391" text-anchor="end" style="font-size:16px;fill:var(--page)">1,500 萬張／洛杉磯</text>
<text class="c" x="60" y="462">一座城市，一次辦完九成的運動項目</text>
</svg>
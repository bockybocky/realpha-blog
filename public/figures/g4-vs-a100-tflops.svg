<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根柱子：G4 的 423 明顯高於 A100 的 268，約一點六倍">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">同一支測試程式，G4 高出一截</text>

  <line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

  <rect x="200" y="152" width="140" height="268" fill="var(--grey)"/>
  <text class="t" x="270" y="138" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">268</text>
  <text class="t" x="270" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">A100 80GB</text>

  <rect x="480" y="-3" width="140" height="423" fill="var(--accent)"/>
  <text class="t" x="550" y="138" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">423</text>
  <text class="t" x="550" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">Colab G4</text>

  <line x1="700" y1="-3" x2="700" y2="152" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="640" y1="-3" x2="700" y2="-3" stroke="var(--accent)" stroke-width="2"/>
  <line x1="640" y1="152" x2="700" y2="152" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="716" y="82" font-size="22" font-weight="700" fill="var(--accent)">約 1.6 倍</text>
  <text class="t" x="60" y="486" font-size="16" fill="var(--dim)">單位：bf16 矩陣乘法 TFLOPS</text>
</svg>
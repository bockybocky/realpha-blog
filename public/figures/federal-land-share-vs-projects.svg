<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一個大方塊旁邊是三個小得多的方塊，面積差距懸殊">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">地很大，案子很少</text>

<rect x="80" y="130" width="300" height="300" fill="var(--grey)"/>
<text class="t" x="230" y="112" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">聯邦土地</text>
<text class="t" x="230" y="466" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">占陸地 21%</text>

<rect x="520" y="386" width="44" height="44" fill="var(--accent)"/>
<text class="t" x="542" y="372" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">3%</text>
<text class="t" x="542" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">風電</text>

<rect x="650" y="386" width="48" height="44" fill="var(--accent)"/>
<text class="t" x="674" y="372" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">3–4%</text>
<text class="t" x="674" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">太陽能</text>

<rect x="786" y="386" width="48" height="44" fill="var(--accent)"/>
<text class="t" x="810" y="372" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">3–4%</text>
<text class="t" x="810" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">地熱</text>

<line x1="400" y1="280" x2="500" y2="280" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="520" y="200" font-size="20" font-weight="700" fill="var(--ink)">蓋在上面的比例</text>
<text class="t" x="520" y="232" font-size="16" fill="var(--dim)">案子長在聯邦土地的空隙裡</text>
</svg>
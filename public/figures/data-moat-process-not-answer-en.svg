<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two stacks of blocks, one solid three layers deep, the other reduced to its bottom layer with two empty dashed boxes above it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Good data is the process, not the answer</text>

  <text class="t" x="110" y="120" font-size="20" font-weight="700" fill="var(--accent)">Marketing</text>
  <rect x="110" y="140" width="320" height="86" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="t" x="132" y="190" font-size="16" fill="var(--ink)">Creative process: why it changed</text>
  <rect x="110" y="236" width="320" height="86" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="t" x="132" y="286" font-size="16" fill="var(--ink)">Call records</text>
  <rect x="110" y="332" width="320" height="86" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="t" x="132" y="382" font-size="16" fill="var(--ink)">Finished ads</text>
  <text class="t" x="110" y="452" font-size="16" fill="var(--dim)">All three layers in hand</text>

  <text class="t" x="530" y="120" font-size="20" font-weight="700" fill="var(--dim)">Construction</text>
  <rect x="530" y="140" width="320" height="86" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="9 9"/>
  <text class="t" x="552" y="190" font-size="16" fill="var(--dim)">Back-and-forth on revisions</text>
  <rect x="530" y="236" width="320" height="86" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="9 9"/>
  <text class="t" x="552" y="286" font-size="16" fill="var(--dim)">Who decided, and why</text>
  <rect x="530" y="332" width="320" height="86" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="552" y="382" font-size="16" fill="var(--ink)">Final blueprint</text>
  <text class="t" x="530" y="452" font-size="16" fill="var(--dim)">Only answers left; nobody kept the process</text>

  <text class="t" x="60" y="528" font-size="22" font-weight="700" fill="var(--ink)">Those two dashed layers are what the model cannot learn</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條十二個月的時間線，上面只有年底一個檢查點，下面有四個平均分布的檢查點">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="80" y="62" font-size="27" fill="var(--ink)">同樣的一年，檢查點放幾個</text>
<text x="100" y="150" font-size="20" fill="var(--warn)">一年一次</text>
<line x1="100" y1="200" x2="860" y2="200" stroke="var(--line)" stroke-width="6"/>
<circle cx="860" cy="200" r="13" fill="var(--warn)"/>
<path d="M100 240 L860 240" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="480" y="268" font-size="19" fill="var(--warn)" text-anchor="middle">中間 11 個月沒有人看</text>
<text x="100" y="334" font-size="20" fill="var(--accent)">一季一次</text>
<line x1="100" y1="384" x2="860" y2="384" stroke="var(--line)" stroke-width="6"/>
<circle cx="290" cy="384" r="13" fill="var(--accent)"/>
<circle cx="480" cy="384" r="13" fill="var(--accent)"/>
<circle cx="670" cy="384" r="13" fill="var(--accent)"/>
<circle cx="860" cy="384" r="13" fill="var(--accent)"/>
<text x="100" y="424" font-size="15" fill="var(--dim)">月 1</text>
<text x="836" y="424" font-size="15" fill="var(--dim)">月 12</text>
<text x="80" y="486" font-size="22" fill="var(--ink)">檢查得少，等於把問題往後推</text>
</g>
</svg>
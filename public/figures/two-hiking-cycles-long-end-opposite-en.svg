<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two side-by-side line charts show short-term rates rising in steps while the long end stays flat on the left, and short-term rates staying flat while the long end slopes upward on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="48" y="54" font-size="27" font-weight="700" fill="var(--ink)">Same hikes, opposite long-end reaction</text>
<rect x="48" y="92" width="416" height="372" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="496" y="92" width="416" height="372" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="72" y="128" font-size="20" font-weight="700" fill="var(--ink)">2004 → 2006</text>
<text x="520" y="128" font-size="20" font-weight="700" fill="var(--ink)">Early 2026 → October</text>
<line x1="72" y1="436" x2="440" y2="436" stroke="var(--line)" stroke-width="2"/>
<line x1="520" y1="436" x2="888" y2="436" stroke="var(--line)" stroke-width="2"/>
<polyline points="80,400 140,400 140,370 200,370 200,338 260,338 260,306 320,306 320,272 380,272 380,240 432,240" fill="none" stroke="var(--grey)" stroke-width="4"/>
<polyline points="80,300 160,297 240,304 320,298 432,300" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="84" y="420" font-size="16" fill="var(--dim)">Short end · Policy rate</text>
<text x="330" y="226" font-size="16" fill="var(--dim)">+425 bps</text>
<text x="84" y="284" font-size="16" fill="var(--accent)">Long end · 10-year</text>
<text x="344" y="328" font-size="16" fill="var(--accent)">Barely moved</text>
<polyline points="520,396 600,394 680,391 760,390 872,388" fill="none" stroke="var(--grey)" stroke-width="4"/>
<polyline points="520,340 592,322 664,298 736,266 808,230 872,196" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="524" y="424" font-size="16" fill="var(--dim)">Short end +1 pt</text>
<text x="620" y="178" font-size="16" fill="var(--accent)">Long end 4% → 5.3%</text>
<text x="48" y="506" font-size="22" font-weight="700" fill="var(--ink)">Same policy direction, opposite long-end answer</text>
</g>
</svg>
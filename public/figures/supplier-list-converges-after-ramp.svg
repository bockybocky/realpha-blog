<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="十二條平行線過了一條垂直虛線後，只剩四條收攏成一束">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="60" y="64">放量之後，供應商名單收斂</text>
<g stroke="var(--grey)" stroke-width="2">
<line x1="110" y1="150" x2="470" y2="150"/><line x1="110" y1="178" x2="470" y2="178"/>
<line x1="110" y1="206" x2="470" y2="206"/><line x1="110" y1="234" x2="470" y2="234"/>
<line x1="110" y1="262" x2="470" y2="262"/><line x1="110" y1="290" x2="470" y2="290"/>
<line x1="110" y1="318" x2="470" y2="318"/><line x1="110" y1="346" x2="470" y2="346"/>
<line x1="110" y1="374" x2="470" y2="374"/><line x1="110" y1="402" x2="470" y2="402"/>
<line x1="110" y1="430" x2="470" y2="430"/><line x1="110" y1="458" x2="470" y2="458"/>
</g>
<g fill="var(--dim)">
<circle cx="110" cy="150" r="6"/><circle cx="110" cy="178" r="6"/><circle cx="110" cy="206" r="6"/>
<circle cx="110" cy="234" r="6"/><circle cx="110" cy="262" r="6"/><circle cx="110" cy="290" r="6"/>
<circle cx="110" cy="318" r="6"/><circle cx="110" cy="346" r="6"/><circle cx="110" cy="374" r="6"/>
<circle cx="110" cy="402" r="6"/><circle cx="110" cy="430" r="6"/><circle cx="110" cy="458" r="6"/>
</g>
<g stroke="var(--grey)" stroke-width="2" stroke-dasharray="3 6">
<line x1="470" y1="150" x2="560" y2="150"/><line x1="470" y1="206" x2="560" y2="206"/>
<line x1="470" y1="234" x2="560" y2="234"/><line x1="470" y1="290" x2="560" y2="290"/>
<line x1="470" y1="318" x2="560" y2="318"/><line x1="470" y1="374" x2="560" y2="374"/>
<line x1="470" y1="402" x2="560" y2="402"/><line x1="470" y1="458" x2="560" y2="458"/>
</g>
<g fill="none" stroke="var(--accent)" stroke-width="3">
<path d="M470,178 C620,178 650,250 820,250"/>
<path d="M470,262 C620,262 650,280 820,280"/>
<path d="M470,346 C620,346 650,310 820,310"/>
<path d="M470,430 C620,430 650,340 820,340"/>
</g>
<g fill="var(--accent)">
<circle cx="830" cy="250" r="8"/><circle cx="830" cy="280" r="8"/>
<circle cx="830" cy="310" r="8"/><circle cx="830" cy="340" r="8"/>
</g>
<line x1="470" y1="125" x2="470" y2="480" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="g" x="470" y="115" text-anchor="middle">一個陣營放量</text>
<text class="b" x="110" y="505">放量前：名單分散</text>
<text class="b" x="830" y="385" text-anchor="middle">留在名單上</text>
<text class="c" x="60" y="550">放量之後，再看誰還在</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="顯示卡與主機的價格橫條都往右變長，最長的那條是虛線框的下一代主機">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="60" font-size="27" fill="var(--ink)">玩得起的門票在漲</text>
<rect x="48" y="90" width="864" height="340" rx="14" fill="var(--card)"/>
<text x="76" y="134" font-size="20" fill="var(--ink)">高階顯示卡</text>
<rect x="240" y="150" width="240" height="40" rx="6" fill="var(--grey)"/>
<text x="196" y="178" font-size="16" fill="var(--dim)" text-anchor="end">以前</text>
<text x="496" y="178" font-size="16" fill="var(--dim)">700–800 美元</text>
<rect x="240" y="202" width="600" height="40" rx="6" fill="var(--warn)"/>
<text x="196" y="230" font-size="16" fill="var(--dim)" text-anchor="end">現在</text>
<text x="824" y="230" font-size="16" fill="var(--page)" text-anchor="end">翻倍到三倍・常常買不到</text>
<text x="76" y="296" font-size="20" fill="var(--ink)">主機</text>
<rect x="240" y="306" width="150" height="34" rx="6" fill="var(--grey)"/>
<text x="196" y="330" font-size="16" fill="var(--dim)" text-anchor="end">2020</text>
<text x="406" y="330" font-size="16" fill="var(--dim)">500 美元</text>
<rect x="240" y="348" width="195" height="34" rx="6" fill="var(--grey)"/>
<text x="196" y="372" font-size="16" fill="var(--dim)" text-anchor="end">現在</text>
<text x="451" y="372" font-size="16" fill="var(--dim)">650 美元</text>
<rect x="240" y="390" width="300" height="34" rx="6" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="196" y="414" font-size="16" fill="var(--warn)" text-anchor="end">下一代</text>
<text x="556" y="414" font-size="16" fill="var(--warn)">業界擔心破 1,000 美元</text>
<text x="48" y="492" font-size="22" fill="var(--ink)">這一項不在發行商手上</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The bars showing years waited to break even are ordered from short to long, Nokia's bar does not reach the end, and the grey zone below holds two companies that went bankrupt to zero and therefore cannot appear on this chart.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Years to get back to the peak</text>
  <text class="t" x="60" y="100" font-size="19" fill="var(--dim)">The survivors</text>
  <rect x="200" y="118" width="190" height="26" fill="var(--accent)"/>
  <text class="t" x="60" y="138" font-size="16" fill="var(--ink)">Amazon</text>
  <text class="t" x="400" y="138" font-size="16" fill="var(--dim)">10 yrs</text>
  <rect x="200" y="156" width="266" height="26" fill="var(--accent)"/>
  <text class="t" x="60" y="176" font-size="16" fill="var(--ink)">Qualcomm</text>
  <text class="t" x="476" y="176" font-size="16" fill="var(--dim)">14 yrs</text>
  <rect x="200" y="194" width="285" height="26" fill="var(--accent)"/>
  <text class="t" x="60" y="214" font-size="16" fill="var(--ink)">Microsoft</text>
  <text class="t" x="495" y="214" font-size="16" fill="var(--dim)">15 yrs</text>
  <rect x="200" y="232" width="285" height="26" fill="var(--accent)"/>
  <text class="t" x="60" y="252" font-size="16" fill="var(--ink)">Oracle</text>
  <text class="t" x="495" y="252" font-size="16" fill="var(--dim)">15 yrs</text>
  <rect x="200" y="270" width="342" height="26" fill="var(--accent)"/>
  <text class="t" x="60" y="290" font-size="16" fill="var(--ink)">Intel</text>
  <text class="t" x="552" y="290" font-size="16" fill="var(--dim)">18 yrs</text>
  <rect x="200" y="308" width="399" height="26" fill="var(--accent)"/>
  <text class="t" x="60" y="328" font-size="16" fill="var(--ink)">Cisco</text>
  <text class="t" x="609" y="328" font-size="16" fill="var(--dim)">21 yrs</text>
  <rect x="200" y="346" width="500" height="26" fill="var(--warn)"/>
  <polygon points="700,346 740,359 700,372" fill="var(--warn)"/>
  <text class="t" x="60" y="366" font-size="16" fill="var(--ink)">Nokia</text>
  <text class="t" x="752" y="366" font-size="16" fill="var(--warn)">Not yet</text>
  <rect x="60" y="410" width="840" height="100" fill="var(--card)"/>
  <text class="t" x="84" y="446" font-size="19" fill="var(--dim)">Not on the list</text>
  <text class="t" x="240" y="446" font-size="16" fill="var(--grey)">WorldCom  2002</text>
  <text class="t" x="540" y="446" font-size="16" fill="var(--grey)">Enron  2001</text>
  <text class="t" x="240" y="480" font-size="16" fill="var(--grey)">Zeroed out, no bar to draw</text>
  <text class="t" x="60" y="552" font-size="22" font-weight="700" fill="var(--ink)">Only survivors make the list</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left the outer ring of an over-spread structure tilts and falls away, while on the right a smaller core-only structure stands intact.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">Spread too wide, one shake drops a row</text>
<rect x="60" y="96" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="96" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="90" y="134">Built too wide</text>
<text class="g" x="530" y="134">Shrink</text>
<rect x="212" y="226" width="96" height="96" fill="var(--accent)"/>
<text class="b" x="260" y="282" text-anchor="middle" fill="var(--page)">Core</text>
<rect x="152" y="226" width="54" height="54" fill="var(--grey)"/>
<rect x="314" y="226" width="54" height="54" fill="var(--grey)"/>
<rect x="212" y="166" width="54" height="54" fill="var(--grey)"/>
<rect x="268" y="328" width="54" height="54" fill="var(--grey)" transform="rotate(24 295 355)"/>
<rect x="124" y="312" width="54" height="54" fill="var(--grey)" transform="rotate(-32 151 339)"/>
<rect x="352" y="300" width="54" height="54" fill="var(--grey)" transform="rotate(38 379 327)"/>
<rect x="96" y="176" width="48" height="48" fill="var(--grey)" transform="rotate(-18 120 200)"/>
<text class="b" x="90" y="406" fill="var(--warn)">Outer ring loosens, body gets pulled</text>
<rect x="648" y="232" width="104" height="104" fill="var(--accent)"/>
<text class="b" x="700" y="290" text-anchor="middle" fill="var(--page)">Core</text>
<rect x="592" y="232" width="54" height="54" fill="var(--grey)"/>
<rect x="754" y="232" width="54" height="54" fill="var(--grey)"/>
<text class="b" x="530" y="406">Keep only what you know best, smaller position</text>
<text class="c" x="60" y="490">You can't save every corner; keep the body standing</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two capacity-share bars with a migration arrow between them: the concentrated block moves from the United States to Thailand, and the bar stays just as tall.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
  <marker id="ar1" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L8,3.5 L0,7 Z" fill="var(--dim)"/>
  </marker>
</defs>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Capacity never spread out, it just moved</text>
<text x="60" y="86" font-size="16" fill="var(--dim)">Share of HDD assembly capacity</text>

<text x="180" y="134" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">1983</text>
<rect x="110" y="150" width="140" height="300" fill="var(--card)" stroke="var(--line)"/>
<rect x="110" y="150" width="140" height="48" fill="var(--grey)"/>
<rect x="110" y="198" width="140" height="36" fill="var(--grey)" stroke="var(--page)" stroke-width="2"/>
<rect x="110" y="234" width="140" height="216" fill="var(--accent)"/>
<text x="180" y="180" font-size="15" text-anchor="middle" fill="var(--ink)">Others 16%</text>
<text x="180" y="222" font-size="15" text-anchor="middle" fill="var(--ink)">Japan 12%</text>
<text x="180" y="336" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">USA</text>
<text x="180" y="364" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">72%</text>

<text x="780" y="134" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">2011</text>
<rect x="710" y="150" width="140" height="300" fill="var(--card)" stroke="var(--line)"/>
<rect x="710" y="150" width="140" height="180" fill="var(--grey)"/>
<rect x="710" y="330" width="140" height="120" fill="var(--accent)"/>
<text x="780" y="246" font-size="15" text-anchor="middle" fill="var(--ink)">Others 60%</text>
<text x="780" y="384" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">Thailand</text>
<text x="780" y="412" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">40%</text>

<text x="480" y="248" font-size="16" text-anchor="middle" fill="var(--dim)">Pushed by labor costs and price wars</text>
<line x1="280" y1="300" x2="682" y2="300" stroke="var(--dim)" stroke-width="2" marker-end="url(#ar1)"/>
<circle cx="320" cy="300" r="20" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="430" cy="300" r="20" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="545" cy="300" r="20" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="655" cy="300" r="20" fill="var(--accent)"/>
<text x="320" y="345" font-size="15" text-anchor="middle" fill="var(--ink)">USA</text>
<text x="430" y="345" font-size="15" text-anchor="middle" fill="var(--ink)">Singapore</text>
<text x="545" y="345" font-size="15" text-anchor="middle" fill="var(--ink)">Malaysia</text>
<text x="545" y="366" font-size="15" text-anchor="middle" fill="var(--ink)">China</text>
<text x="655" y="345" font-size="15" font-weight="700" text-anchor="middle" fill="var(--ink)">Thailand</text>

<text x="480" y="505" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">Forty years on that block is just as tall, only now it sits on a floodplain</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The same word quartz sits at different places in the five-step supply chain, and the two reports each point to a different step.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="52" font-size="27" font-weight="700" fill="var(--ink)">One "quartz," five layers, five businesses</text>
<text x="60" y="84" font-size="16" fill="var(--dim)">Higher up: deeper processing, different substitutability</text>

<rect x="90" y="430" width="300" height="58" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="112" y="466" font-size="19" fill="var(--ink)">Mining</text>
<rect x="90" y="358" width="380" height="58" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="112" y="394" font-size="19" fill="var(--ink)">Raw material</text>
<rect x="90" y="286" width="460" height="58" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="112" y="322" font-size="19" fill="var(--ink)">Parts: tubes, jigs</text>
<rect x="90" y="214" width="540" height="58" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="112" y="250" font-size="19" fill="var(--ink)">Components: crystals</text>
<rect x="90" y="142" width="620" height="58" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="112" y="178" font-size="19" fill="var(--ink)">Modules</text>

<line x1="760" y1="400" x2="480" y2="400" stroke="var(--warn)" stroke-width="3"/>
<path d="M486 394 L474 400 L486 406 Z" fill="var(--warn)"/>
<text x="770" y="394" font-size="16" fill="var(--warn)">CTEE</text>
<text x="770" y="416" font-size="15" fill="var(--dim)">Few non-China</text>

<line x1="760" y1="290" x2="562" y2="290" stroke="var(--accent)" stroke-width="3"/>
<path d="M568 284 L556 290 L568 296 Z" fill="var(--accent)"/>
<text x="770" y="284" font-size="16" fill="var(--accent)">EDN</text>
<text x="770" y="306" font-size="15" fill="var(--dim)">Made in TW, JP</text>

<text x="90" y="528" font-size="22" font-weight="700" fill="var(--ink)">Two layers off, opposite conclusion</text>
</svg>
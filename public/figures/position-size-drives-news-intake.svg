<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="小方塊對應一個新聞格，大方塊對應八個新聞格，兩列上下並置">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <defs>
    <marker id="cap-f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>

  <text x="60" y="66" font-size="27" font-weight="600" fill="var(--ink)">讀多少，由部位決定</text>
  <text x="360" y="146" font-size="19" fill="var(--dim)">一週讀的新聞</text>

  <rect x="110" y="172" width="56" height="56" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="138" y="252" font-size="16" fill="var(--ink)" text-anchor="middle">小部位</text>
  <line x1="196" y1="200" x2="308" y2="200" stroke="var(--dim)" stroke-width="2" marker-end="url(#cap-f4)"/>
  <text x="248" y="186" font-size="15" fill="var(--dim)" text-anchor="middle">焦慮 低</text>
  <rect x="360" y="184" width="44" height="30" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="432" y="209" font-size="20" fill="var(--ink)">1 則</text>

  <rect x="88" y="318" width="100" height="100" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="138" y="442" font-size="16" fill="var(--ink)" text-anchor="middle">滿槓桿</text>
  <line x1="216" y1="368" x2="308" y2="368" stroke="var(--dim)" stroke-width="2" marker-end="url(#cap-f4)"/>
  <text x="258" y="354" font-size="15" fill="var(--dim)" text-anchor="middle">焦慮 高</text>

  <rect x="360" y="330" width="44" height="30" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="416" y="330" width="44" height="30" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="472" y="330" width="44" height="30" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="528" y="330" width="44" height="30" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="360" y="374" width="44" height="30" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="416" y="374" width="44" height="30" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="472" y="374" width="44" height="30" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="528" y="374" width="44" height="30" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="604" y="376" font-size="20" fill="var(--ink)">8 則</text>

  <text x="60" y="484" font-size="22" font-weight="600" fill="var(--ink)">雜訊量是部位的函數</text>
</svg>
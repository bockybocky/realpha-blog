<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左右兩個寬區塊被中間一道窄頸夾住，窄頸是晶片與設備產能">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">同一條鏈的兩端，夾著同一個窄口</text>

  <rect x="60" y="130" width="250" height="230" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="80" y="170" font-size="20" fill="var(--accent)">出錢這端</text>
  <text x="80" y="212" font-size="16" fill="var(--ink)">SpaceX</text>
  <text x="80" y="244" font-size="16" fill="var(--dim)">資料中心出租</text>
  <text x="80" y="276" font-size="16" fill="var(--dim)">六個月回本</text>
  <text x="80" y="320" font-size="16" fill="var(--dim)">第四季指引 350–400 億</text>

  <rect x="650" y="130" width="250" height="230" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="670" y="170" font-size="20" fill="var(--accent)">接單這端</text>
  <text x="670" y="212" font-size="16" fill="var(--ink)">電路板廠</text>
  <text x="670" y="244" font-size="16" fill="var(--dim)">全場滿載</text>
  <text x="670" y="276" font-size="16" fill="var(--dim)">機台交期 30 個月</text>
  <text x="670" y="320" font-size="16" fill="var(--dim)">材料缺 20–40%</text>

  <path d="M330 150 L450 220 L450 280 L330 350 Z" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <path d="M630 150 L510 220 L510 280 L630 350 Z" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <rect x="450" y="220" width="60" height="60" fill="var(--warn)" opacity="0.25"/>
  <text x="480" y="410" font-size="20" fill="var(--warn)" text-anchor="middle">窄口</text>
  <text x="480" y="440" font-size="16" fill="var(--dim)" text-anchor="middle">晶片產能</text>
  <text x="480" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">設備交付順序</text>

  <text x="60" y="490" font-size="22" fill="var(--ink)">錢到位，不等於貨到位</text>
</svg>
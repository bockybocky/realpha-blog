<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="一根柱子切成關稅、油價、服務業三段，前兩段淺色標暫時性，最厚的服務業段深色標為真正的擔憂">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="48" y="62" font-size="27" fill="var(--ink)">通膨拆成三塊，只有一塊讓他睡不著</text>
<text x="48" y="96" font-size="16" fill="var(--dim)">柱子高低是示意，不是實際權重</text>

<rect x="180" y="150" width="180" height="80" fill="var(--card)" stroke="var(--line)"/>
<rect x="180" y="230" width="180" height="80" fill="var(--card)" stroke="var(--line)"/>
<rect x="180" y="310" width="180" height="150" fill="var(--warn)"/>
<text x="270" y="197" font-size="19" fill="var(--dim)" text-anchor="middle">關稅</text>
<text x="270" y="277" font-size="19" fill="var(--dim)" text-anchor="middle">油價</text>
<text x="270" y="393" font-size="19" fill="var(--page)" text-anchor="middle">服務業</text>

<line x1="360" y1="190" x2="420" y2="190" stroke="var(--line)" stroke-width="2"/>
<line x1="360" y1="270" x2="420" y2="270" stroke="var(--line)" stroke-width="2"/>
<line x1="360" y1="385" x2="420" y2="385" stroke="var(--warn)" stroke-width="2"/>

<text x="436" y="196" font-size="16" fill="var(--dim)">希望是暫時的</text>
<text x="436" y="276" font-size="16" fill="var(--dim)">希望是暫時的</text>
<text x="436" y="378" font-size="19" fill="var(--ink)">不是關稅，也不是油價</text>
<text x="436" y="410" font-size="16" fill="var(--dim)">他要看到這塊真的往 2% 走</text>

<text x="480" y="520" font-size="22" fill="var(--ink)" text-anchor="middle">不能每一季都說「快消失了，只是還沒」</text>
</svg>
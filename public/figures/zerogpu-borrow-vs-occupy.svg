<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一整天的時間條：租卡是整條被佔滿，ZeroGPU 只有三個很窄的小格被佔用">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .ti { font:700 27px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .lb { font:600 20px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .sm { font:400 16px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
    .cc { font:700 22px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--accent); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="ti" x="80" y="70">一整天的顯示卡佔用</text>

  <text class="lb" x="80" y="160">租一張卡</text>
  <rect x="80" y="180" width="800" height="64" rx="6" fill="var(--grey)"/>
  <text class="sm" x="80" y="272">整天都在計費</text>

  <text class="lb" x="80" y="340">ZeroGPU</text>
  <rect x="80" y="360" width="800" height="64" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="150" y="360" width="16" height="64" fill="var(--accent)"/>
  <rect x="430" y="360" width="16" height="64" fill="var(--accent)"/>
  <rect x="700" y="360" width="16" height="64" fill="var(--accent)"/>
  <text class="sm" x="80" y="452">只有被呼叫的那幾秒</text>

  <text class="cc" x="80" y="500">用完就還</text>
</svg>
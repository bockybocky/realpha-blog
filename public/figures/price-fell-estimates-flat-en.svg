<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The price line falls steeply while the analyst estimate line stays flat, with a bracket marking the gap on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="80" font-size="27" fill="var(--ink)">One moved, one not</text>
  <line x1="150" y1="430" x2="790" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="200" y1="180" x2="760" y2="180" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <polyline points="200,180 380,250 560,340 760,395" fill="none" stroke="var(--warn)" stroke-width="5"/>
  <circle cx="200" cy="180" r="8" fill="var(--ink)"/>
  <text class="t" x="200" y="158" font-size="16" fill="var(--dim)" text-anchor="middle">Top</text>
  <text class="t" x="770" y="174" font-size="20" fill="var(--accent)">EPS est.</text>
  <text class="t" x="770" y="400" font-size="20" fill="var(--warn)">Px</text>
  <path d="M740 186 L752 186 L752 389 L740 389" fill="none" stroke="var(--dim)" stroke-width="2"/>
  <text class="t" x="640" y="300" font-size="20" fill="var(--ink)" text-anchor="middle">Gap</text>
  <text class="t" x="150" y="500" font-size="22" fill="var(--ink)">Price wrong, or stale</text>
</svg>
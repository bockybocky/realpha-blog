<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A three-layer stacked bar on the left, with the top layer replaced by an empty dashed frame on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .h{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:700;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
    .blk{fill:var(--card);stroke:var(--line);stroke-width:2}
    .lbl{font-size:19px;font-weight:700;fill:var(--ink)}
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="h" x="60" y="56">The equation of this job</text>

  <text class="g" x="300" y="120" text-anchor="middle">Before</text>
  <rect class="blk" x="200" y="366" width="200" height="104" rx="10"/>
  <text class="lbl" x="300" y="426" text-anchor="middle">Lifestyle sacrifice</text>
  <rect class="blk" x="200" y="254" width="200" height="104" rx="10"/>
  <text class="lbl" x="300" y="314" text-anchor="middle">Pay</text>
  <rect x="200" y="142" width="200" height="104" rx="10" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="lbl" x="300" y="202" text-anchor="middle">Freedom</text>

  <text class="g" x="660" y="120" text-anchor="middle">Now</text>
  <rect class="blk" x="560" y="366" width="200" height="104" rx="10"/>
  <text class="lbl" x="660" y="426" text-anchor="middle">Lifestyle sacrifice</text>
  <rect class="blk" x="560" y="254" width="200" height="104" rx="10"/>
  <text class="lbl" x="660" y="314" text-anchor="middle">Pay</text>
  <rect x="560" y="142" width="200" height="104" rx="10" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text class="lbl" x="660" y="202" text-anchor="middle" fill="var(--warn)">Gone</text>

  <text class="c" x="480" y="524" text-anchor="middle">Same money, different equation</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="可被外部驗證的句子疊得矮，只能由本人說了算的句子疊得高">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="80" y="62" font-size="27" font-weight="700" fill="var(--ink)">把一份說法分成兩疊</text>

<text class="t" x="240" y="130" font-size="20" fill="var(--ink)" text-anchor="middle">外面可以驗</text>
<g fill="var(--card)" stroke="var(--accent)" stroke-width="2">
<rect x="120" y="390" width="240" height="46"/>
<rect x="120" y="336" width="240" height="46"/>
<rect x="120" y="282" width="240" height="46"/>
<rect x="120" y="228" width="240" height="46"/>
</g>
<g class="t" font-size="16" fill="var(--ink)" text-anchor="middle">
<text x="240" y="420">法規</text><text x="240" y="366">時間點</text>
<text x="240" y="312">規格</text><text x="240" y="258">數字</text>
</g>

<text class="t" x="700" y="130" font-size="20" fill="var(--ink)" text-anchor="middle">只能他說了算</text>
<g fill="var(--card)" stroke="var(--warn)" stroke-width="2">
<rect x="580" y="390" width="240" height="46"/>
<rect x="580" y="336" width="240" height="46"/>
<rect x="580" y="282" width="240" height="46"/>
<rect x="580" y="228" width="240" height="46"/>
<rect x="580" y="174" width="240" height="46"/>
<rect x="580" y="150" width="240" height="20"/>
</g>
<g class="t" font-size="16" fill="var(--ink)" text-anchor="middle">
<text x="700" y="420">貢獻度</text><text x="700" y="366">重要性</text>
<text x="700" y="312">幾年會發生</text><text x="700" y="258">誰的功勞</text>
<text x="700" y="204">有多關鍵</text>
</g>
<line x1="120" y1="450" x2="820" y2="450" stroke="var(--ink)" stroke-width="2"/>

<text class="t" x="80" y="506" font-size="22" font-weight="700" fill="var(--ink)">右邊那疊通常比較高</text>
<text class="t" x="80" y="534" font-size="15" fill="var(--dim)">右邊不丟掉，標成待驗證</text>
</svg>
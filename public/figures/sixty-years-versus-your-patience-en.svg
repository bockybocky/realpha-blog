<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A bar spanning the whole chart stands for a sixty-year sample, with a barely visible short bar below for three years">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.f10-b{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.f10-t{font-size:27px;font-weight:700}
.f10-g{font-size:19px;fill:var(--dim)}
.f10-i{font-size:19px;font-weight:700;fill:var(--page)}
.f10-s{font-size:15px}
.f10-c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="f10-b f10-t" x="60" y="66">How long a sample it takes to know a method has failed</text>
<text class="f10-b f10-g" x="60" y="180">Needed to call it broken</text>
<rect x="60" y="196" width="840" height="54" fill="var(--accent)"/>
<text class="f10-b f10-i" x="480" y="232" text-anchor="middle">Sixty years</text>
<text class="f10-b f10-g" x="60" y="316">What you can actually wait</text>
<rect x="60" y="332" width="42" height="54" fill="var(--warn)"/>
<text class="f10-b f10-s" x="118" y="366" fill="var(--warn)">Three years</text>
<text class="f10-b f10-c" x="60" y="452">Everything in between is noise</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Line chart: annual flight counts sit flat in the low teens for years, then rise steeply to 165 within two years of the recovery milestone.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">Expendable: flights per year = builds per year</text>

  <line x1="120" y1="120" x2="120" y2="420" stroke="var(--line)" stroke-width="2"/>
  <line x1="120" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="108" y="160" text-anchor="end">165</text>
  <text class="b" x="108" y="366" text-anchor="end">~12</text>
  <line x1="120" y1="360" x2="900" y2="360" stroke="var(--grey)" stroke-dasharray="4 6"/>

  <line x1="560" y1="130" x2="560" y2="420" stroke="var(--warn)" stroke-dasharray="7 5" stroke-width="2"/>
  <text class="g" x="574" y="150" fill="var(--warn)">1st stage lands on drone ship</text>

  <polyline points="150,364 210,358 270,368 330,356 390,366 450,358 510,362 560,360"
            fill="none" stroke="var(--grey)" stroke-width="3"/>
  <polyline points="560,360 620,318 680,262 740,214 800,178 860,155"
            fill="none" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="860" cy="155" r="7" fill="var(--accent)"/>

  <text class="g" x="200" y="410">You fly as many as you build</text>
  <text class="g" x="700" y="330">Same hardware flies again</text>

  <rect x="640" y="440" width="260" height="52" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="b" x="770" y="472" text-anchor="middle">Upper stage is still expended</text>

  <text class="c" x="60" y="522">The curve bends where hardware starts getting reused</text>
</svg>
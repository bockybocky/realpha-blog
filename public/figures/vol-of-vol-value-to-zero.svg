<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊三條細股價線，一檔第一天就漲上去退場並灰掉，另兩檔留著且其中一檔跌很深；右邊一根高高的賣權價值柱在最後一檔小漲的那一刻被箭頭帶到零">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">看起來很有價值，然後一瞬間歸零</text>

<line x1="90" y1="300" x2="560" y2="300" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="b" x="90" y="288">進場水位</text>

<path d="M90 300 L150 224" stroke="var(--grey)" stroke-width="3" fill="none"/>
<circle cx="150" cy="224" r="8" fill="var(--grey)"/>
<path d="M150 224 L300 300 L450 400" stroke="var(--grey)" stroke-width="2" fill="none" stroke-dasharray="6 7" opacity="0.6"/>
<text class="b" x="166" y="212">第一天漲上去，退場</text>
<text class="b" x="330" y="398">之後它怎麼跌都無關</text>

<path d="M90 300 L220 360 L360 430 L500 420" stroke="var(--accent)" stroke-width="4" fill="none"/>
<text class="b" x="512" y="426">跌很深的那一檔</text>

<path d="M90 300 L220 318 L360 334 L500 314" stroke="var(--warn)" stroke-width="4" fill="none"/>
<text class="b" x="512" y="310">最後那一檔小漲一點</text>

<rect x="700" y="170" width="100" height="250" rx="6" fill="var(--accent)" opacity="0.8"/>
<line x1="660" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="700" y="462" width="100" height="8" rx="3" fill="var(--grey)"/>
<text class="g" x="750" y="150" text-anchor="middle">賣權價值</text>
<text class="b" x="750" y="502" text-anchor="middle">票據消失，歸零</text>

<path d="M840 200 C880 280 880 380 850 452" stroke="var(--warn)" stroke-width="4" fill="none"/>
<polygon points="844,440 852,462 836,456" fill="var(--warn)"/>
<text class="b" x="866" y="330">小漲一點就夠</text>

<text class="c" x="60" y="528">波動率自己的波動率</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三根高度遞減的柱狀圖：七小時最高、六小時中等、連兩晚四小時以下驟降到很矮，最矮那根用警示色">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">他自己的睡眠帳</text>
<rect x="60" y="100" width="840" height="340" rx="14" fill="var(--card)"/>
<line x1="120" y1="400" x2="860" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="170" width="110" height="230" rx="6" fill="var(--accent)"/>
<rect x="420" y="220" width="110" height="180" rx="6" fill="var(--accent)" opacity="0.65"/>
<rect x="660" y="330" width="110" height="70" rx="6" fill="var(--warn)"/>
<text class="t" x="235" y="150" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">7 小時</text>
<text class="t" x="475" y="200" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">6 小時</text>
<text class="t" x="715" y="310" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">連兩晚 4 小時</text>
<text class="t" x="235" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">狀態最好</text>
<text class="t" x="475" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">應付得來</text>
<text class="t" x="715" y="432" font-size="16" fill="var(--warn)" text-anchor="middle">垮</text>
<text class="t" x="60" y="486" font-size="22" font-weight="700" fill="var(--ink)">不是線性下滑，是一道斷崖</text>
</svg>
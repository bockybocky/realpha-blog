<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="孤立平台與被連接組織環繞的平台對比">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  .h{font-size:27px;font-weight:700;fill:var(--ink)}
  .g{font-size:19px;font-weight:700;fill:var(--ink)}
  .b{font-size:16px;fill:var(--dim)}
  .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t h" x="60" y="68">你買的是哪一個</text>
<text class="t g" x="60" y="124">一張訂單買到的</text>
<circle cx="230" cy="280" r="54" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="t b" x="202" y="286">平台</text>
<text class="t b" x="130" y="400">周圍什麼都沒有</text>
<text class="t g" x="560" y="124" fill="var(--accent)">真正讓它能做事的</text>
<circle cx="700" cy="280" r="54" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
<text class="t b" x="672" y="286">平台</text>
<line x1="700" y1="226" x2="700" y2="186" stroke="var(--accent)" stroke-width="1.8"/>
<line x1="746" y1="252" x2="818" y2="214" stroke="var(--accent)" stroke-width="1.8"/>
<line x1="754" y1="300" x2="834" y2="320" stroke="var(--accent)" stroke-width="1.8"/>
<line x1="700" y1="334" x2="700" y2="376" stroke="var(--accent)" stroke-width="1.8"/>
<line x1="648" y1="306" x2="566" y2="328" stroke="var(--accent)" stroke-width="1.8"/>
<line x1="652" y1="250" x2="572" y2="212" stroke="var(--accent)" stroke-width="1.8"/>
<rect x="648" y="152" width="104" height="36" rx="18" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="668" y="176">人力</text>
<rect x="818" y="196" width="104" height="36" rx="18" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="838" y="220">後勤</text>
<rect x="834" y="302" width="104" height="36" rx="18" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="854" y="326">編制</text>
<rect x="648" y="376" width="104" height="36" rx="18" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="668" y="400">訓練</text>
<rect x="462" y="310" width="104" height="36" rx="18" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="482" y="334">維修</text>
<rect x="468" y="194" width="104" height="36" rx="18" fill="var(--card)" stroke="var(--line)"/>
<text class="t b" x="488" y="218">指管</text>
<text class="t c" x="60" y="488">人從哪來、後勤誰養、編制改了沒</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="兩條線前段重疊、2023年中後分家，實際金價上衝，下方三段色帶為三波推手">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="50" text-anchor="middle">黃金：2023 年中之後，舊公式斷了</text>
<line x1="220" y1="88" x2="260" y2="88" stroke="var(--accent)" stroke-width="5"/>
<text class="s" x="270" y="93">實際金價</text>
<line x1="400" y1="88" x2="440" y2="88" stroke="var(--dim)" stroke-width="2.5" stroke-dasharray="7 6"/>
<text class="s" x="450" y="93">用美元＋實質利率推算</text>
<text class="s" x="760" y="93">示意</text>
<rect x="340" y="120" width="80" height="350" fill="var(--line)" opacity="0.5"/>
<line x1="420" y1="120" x2="420" y2="470" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="g" x="432" y="145" style="fill:var(--warn)">分家</text>
<line x1="80" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<path d="M80,380 C150,360 200,400 260,372 S370,352 420,366 C520,380 700,395 900,405" fill="none" stroke="var(--dim)" stroke-width="2.5" stroke-dasharray="7 6"/>
<path d="M80,384 C150,364 200,404 260,376 S370,356 420,370 C500,330 600,300 700,250 S820,160 900,175" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="s" x="335" y="494" text-anchor="middle">2022</text>
<text class="s" x="424" y="494">2023 中</text>
<text class="s" x="420" y="530" text-anchor="end">推手</text>
<rect x="430" y="510" width="150" height="28" fill="var(--accent)" opacity="0.3"/>
<rect x="590" y="510" width="150" height="28" fill="var(--accent)" opacity="0.6"/>
<rect x="750" y="510" width="150" height="28" fill="var(--warn)" opacity="0.5"/>
<text class="b" x="505" y="530" text-anchor="middle">中國</text>
<text class="b" x="665" y="530" text-anchor="middle">央行</text>
<text class="b" x="825" y="530" text-anchor="middle">投機潮</text>
<text class="s" x="825" y="558" text-anchor="middle" style="fill:var(--warn)">難重演</text>
<text class="c" x="480" y="588" text-anchor="middle">線還在，推它的換成三波買盤</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The structure line rises first and the numbers line rises later, with a long lag band between them.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<text x="60" y="72" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="27" fill="var(--ink)">Structure moves first, numbers arrive later</text>

<path d="M 140 390 L 380 390 L 760 390 L 860 390" stroke="none" fill="none"/>
<path d="M 140 390 C 300 370 380 230 860 180 L 860 390 Z" fill="var(--card)"/>
<path d="M 140 390 C 420 380 560 360 860 330 L 860 390 Z" fill="var(--page)"/>

<path d="M 140 390 C 300 370 380 230 860 180" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M 140 390 C 420 380 560 360 860 330" stroke="var(--warn)" stroke-width="3" fill="none"/>

<line x1="140" y1="390" x2="900" y2="390" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="150" x2="140" y2="390" stroke="var(--line)" stroke-width="2"/>

<text x="872" y="176" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--accent)" text-anchor="end">Structure</text>
<text x="872" y="356" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--warn)" text-anchor="end">Numbers delivered</text>
<text x="520" y="300" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--dim)">Patience burns here</text>
<text x="140" y="420" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">Today</text>

<text x="60" y="490" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="22" fill="var(--ink)">Ask first: which line is the market repricing</text>
</svg>
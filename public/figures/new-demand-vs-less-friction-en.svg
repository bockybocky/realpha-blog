<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two pipes: the left one gains a tributary from above, the right one is visibly wider">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:19px;fill:var(--ink)}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">Two kinds of action</text>
<text class="g" x="250" y="128" text-anchor="middle">Make demand</text>
<text class="g" x="710" y="128" text-anchor="middle">Cut friction</text>
<rect x="70" y="248" width="360" height="72" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="96" y="266" width="40" height="36" fill="var(--grey)"/>
<rect x="170" y="266" width="40" height="36" fill="var(--grey)"/>
<rect x="244" y="266" width="40" height="36" fill="var(--grey)"/>
<rect x="318" y="266" width="40" height="36" fill="var(--accent)"/>
<path d="M338,170 L338,238" stroke="var(--accent)" stroke-width="5"/>
<path d="M338,250 L352,226 L324,226 Z" fill="var(--accent)"/>
<text class="s" x="356" y="164">Extra bids</text>
<rect x="530" y="222" width="360" height="124" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="552" y="240" width="40" height="36" fill="var(--grey)"/>
<rect x="626" y="240" width="40" height="36" fill="var(--grey)"/>
<rect x="700" y="240" width="40" height="36" fill="var(--grey)"/>
<rect x="774" y="240" width="40" height="36" fill="var(--grey)"/>
<rect x="552" y="292" width="40" height="36" fill="var(--grey)"/>
<rect x="626" y="292" width="40" height="36" fill="var(--grey)"/>
<rect x="700" y="292" width="40" height="36" fill="var(--grey)"/>
<rect x="774" y="292" width="40" height="36" fill="var(--grey)"/>
<text class="s" x="250" y="400" text-anchor="middle">Stablecoin reserves, short-end debt</text>
<text class="s" x="710" y="400" text-anchor="middle">Clearing, repo window, sheet room</text>
<text class="c" x="60" y="500">Add water, or widen the pipe</text>
<text class="s" x="60" y="530">Demand in volume, friction in liquidity</text>
</svg>
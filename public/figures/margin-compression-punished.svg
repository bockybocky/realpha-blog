<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="以零線為基準的三根柱子，毛利率收縮那組深深往下、持平那組只掉一點、擴張那組往上">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.s { font-size:16px; fill:var(--dim); }
.g { font-size:19px; font-weight:600; }
.n { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="62">毛利率掉的公司，市場處決得很快</text>
<text class="s" x="60" y="94">後續十二個月相對報酬，形狀示意</text>
<line x1="120" y1="320" x2="880" y2="320" stroke="var(--line)" stroke-width="2"/>
<text class="n" x="120" y="308">與大盤持平</text>
<rect x="220" y="320" width="120" height="150" fill="var(--warn)"/>
<rect x="440" y="320" width="120" height="30" fill="var(--grey)"/>
<rect x="660" y="210" width="120" height="110" fill="var(--accent)"/>
<text class="g" x="280" y="502" text-anchor="middle" fill="var(--warn)">收縮</text>
<text class="n" x="280" y="526" text-anchor="middle">年增減少超過 1%</text>
<text class="g" x="500" y="502" text-anchor="middle" fill="var(--dim)">持平</text>
<text class="g" x="720" y="502" text-anchor="middle" fill="var(--accent)">擴張</text>
<text class="c" x="60" y="558">同一天交出漂亮數字，也救不了掉下去的毛利率</text>
</svg>
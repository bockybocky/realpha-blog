<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條長條被切成兩段，左邊約八成四是資本支出，右邊剩下一小截是自由現金流">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="56" font-size="27" fill="var(--ink)">一千七百四十四億，埋掉一千四百六十五億</text>

<text x="130" y="150" font-size="19" fill="var(--dim)">營業現金流　1744 億</text>
<line x1="130" y1="168" x2="830" y2="168" stroke="var(--line)" stroke-width="2"/>
<rect x="130" y="182" width="588" height="92" fill="var(--accent)"/>
<rect x="718" y="182" width="112" height="92" fill="var(--grey)"/>
<rect x="130" y="182" width="700" height="92" fill="none" stroke="var(--line)" stroke-width="2"/>

<g font-size="16" fill="var(--dim)" text-anchor="middle">
<text x="424" y="306">蓋資料中心</text>
<text x="424" y="330">1465 億</text>
<text x="774" y="306">自由現金流</text>
<text x="774" y="330">279 億</text>
</g>
<text x="424" y="384" font-size="22" fill="var(--accent)" text-anchor="middle">八成四拿去蓋</text>
<text x="60" y="446" font-size="22" fill="var(--ink)">蓋得起，是因為不必跟人借。</text>
<text x="60" y="482" font-size="15" fill="var(--grey)">近四季，資料抓於 2026 年 6 月 27 日</text>
</g>
</svg>
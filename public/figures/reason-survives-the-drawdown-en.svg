<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A falling curve above, with two rows of marks below comparing before and after: one row unchanged, the other flipping from check to cross">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="80" y="68" font-size="27">After the fall, what's left?</text>
  <polyline points="80,120 200,134 320,112 440,170 560,212 680,204 860,244" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="860" y="272" font-size="16" fill="var(--warn)" text-anchor="end">−60%</text>
  <line x1="60" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>
  <line x1="490" y1="312" x2="490" y2="510" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="400" y="338" font-size="19" fill="var(--dim)" text-anchor="middle">Before</text>
  <text x="560" y="338" font-size="19" fill="var(--dim)" text-anchor="middle">After</text>
  <text x="60" y="392" font-size="20">He's good</text>
  <g transform="translate(400,385)">
    <path d="M-9 0 L-3 8 L10 -9" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(560,385)">
    <path d="M-9 0 L-3 8 L10 -9" fill="none" stroke="var(--grey)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="640" y="392" font-size="16" fill="var(--dim)">Still true, says nothing</text>
  <text x="60" y="472" font-size="20">Margin holds at X</text>
  <g transform="translate(400,465)">
    <path d="M-9 0 L-3 8 L10 -9" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(560,465)">
    <line x1="-9" y1="-9" x2="9" y2="9" stroke="var(--warn)" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="-9" x2="-9" y2="9" stroke="var(--warn)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="640" y="472" font-size="16" fill="var(--dim)">Broken, so I know next</text>
  <text x="480" y="532" font-size="22" text-anchor="middle">A surviving reason says nothing</text>
</svg>
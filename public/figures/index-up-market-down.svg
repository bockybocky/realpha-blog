<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條同期反向的線，指數向上而等權重向下，下方一條只填到不到三分之一的比例條">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--dim)}
.b{font-size:16px;fill:var(--ink)}
.s{font-size:15px;fill:var(--dim)}
.sa{font-size:15px;fill:var(--accent)}
.sw{font-size:15px;fill:var(--warn)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="h" x="60" y="58">同一週，兩個方向</text>
<rect x="60" y="86" width="840" height="212" rx="14" fill="var(--card)" stroke="var(--line)"/>
<path d="M110,244 L250,218 L400,196 L550,178 L700,154 L850,138" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="sa" x="742" y="128">指數</text>
<path d="M110,204 L250,218 L400,234 L550,250 L700,264 L850,278" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 5"/>
<text class="sw" x="726" y="298">等權重</text>
<text class="g" x="60" y="352">站上 50 日均線的個股</text>
<rect x="60" y="372" width="700" height="34" rx="8" fill="var(--grey)"/>
<rect x="60" y="372" width="196" height="34" rx="8" fill="var(--accent)"/>
<text class="b" x="272" y="396">28%</text>
<text class="s" x="776" y="396">其餘在均線之下</text>
<text class="c" x="60" y="472">漂亮的線型，是五檔撐出來的</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="借款條最長，支撐它的卻是最短的現金流條">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="58" font-size="27" fill="var(--ink)">借 300 億，靠的是哪一條</text>

  <text x="250" y="140" font-size="19" fill="var(--dim)" text-anchor="end">年營收</text>
  <rect x="266" y="118" width="440" height="30" rx="4" fill="var(--grey)"/>
  <text x="722" y="140" font-size="16" fill="var(--dim)">220 億</text>

  <text x="250" y="210" font-size="19" fill="var(--dim)" text-anchor="end">營業利益</text>
  <rect x="266" y="188" width="80" height="30" rx="4" fill="var(--grey)"/>
  <text x="362" y="210" font-size="16" fill="var(--dim)">40 億</text>

  <text x="250" y="280" font-size="19" fill="var(--ink)" text-anchor="end">加折舊現金流</text>
  <rect x="266" y="258" width="100" height="30" rx="4" fill="var(--accent)"/>
  <text x="382" y="280" font-size="16" fill="var(--accent)">50 億</text>

  <text x="250" y="366" font-size="19" fill="var(--ink)" text-anchor="end">向銀行借</text>
  <rect x="266" y="344" width="600" height="30" rx="4" fill="var(--warn)"/>
  <text x="882" y="366" font-size="16" fill="var(--warn)">300 億</text>

  <path d="M 500 344 C 500 310 420 300 390 288" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="386" cy="286" r="6" fill="var(--accent)"/>
  <text x="520" y="330" font-size="16" fill="var(--accent)">放款基準看這條</text>

  <text x="266" y="440" font-size="16" fill="var(--dim)">同樣借 300 億：營收 500 億的案子有，營收 220 億的近年少見</text>

  <text x="480" y="508" font-size="22" fill="var(--ink)" text-anchor="middle">撐住這筆錢的不是營收，是利潤率</text>
</svg>
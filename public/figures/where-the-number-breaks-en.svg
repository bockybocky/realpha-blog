<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A two-panel contrast: the thick column cracks in its shaft, while the many thin columns stand and the shared foundation cracks instead.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="48" font-size="27" fill="var(--ink)">The break happens in different places</text>
<rect x="110" y="110" width="300" height="26" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="260" y="98" font-size="19" fill="var(--dim)" text-anchor="middle">One big order</text>
<rect x="225" y="136" width="70" height="250" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M 215 250 L 250 238 L 272 262 L 305 248" stroke="var(--warn)" stroke-width="4" fill="none"/>
<text x="330" y="256" font-size="19" fill="var(--warn)">Customer leaves</text>
<line x1="110" y1="386" x2="410" y2="386" stroke="var(--line)" stroke-width="3"/>
<text x="260" y="420" font-size="16" fill="var(--dim)" text-anchor="middle">Foundation fine, column cracked</text>
<rect x="560" y="110" width="300" height="26" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="710" y="98" font-size="19" fill="var(--dim)" text-anchor="middle">Many small orders</text>
<g stroke="var(--accent)" stroke-width="3" fill="none">
<rect x="578" y="136" width="14" height="240"/><rect x="608" y="136" width="14" height="240"/>
<rect x="638" y="136" width="14" height="240"/><rect x="668" y="136" width="14" height="240"/>
<rect x="698" y="136" width="14" height="240"/><rect x="728" y="136" width="14" height="240"/>
<rect x="758" y="136" width="14" height="240"/><rect x="788" y="136" width="14" height="240"/>
<rect x="818" y="136" width="14" height="240"/>
</g>
<path d="M 560 388 L 620 376 L 690 400 L 760 378 L 860 390" stroke="var(--warn)" stroke-width="4" fill="none"/>
<text x="710" y="432" font-size="19" fill="var(--warn)" text-anchor="middle">Build-out pace</text>
<text x="710" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">Columns fine, foundation moving</text>
<text x="60" y="508" font-size="22" fill="var(--ink)">Watch not which column, but which layer the number rests on</text>
</svg>
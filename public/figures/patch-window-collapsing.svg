<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="四根橫條長度逐級塌縮，最後一根短到幾乎看不見">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">你能慢慢處理的那段時間</text>

<text x="60" y="138" font-size="19" font-weight="700" fill="var(--dim)">兩週</text>
<rect x="180" y="114" width="720" height="34" rx="6" fill="var(--accent)"/>
<text x="200" y="138" font-size="16" fill="var(--page)">開會　寫計畫　測試　發修補</text>

<text x="60" y="226" font-size="19" font-weight="700" fill="var(--dim)">幾天</text>
<rect x="180" y="202" width="260" height="34" rx="6" fill="var(--accent)"/>

<text x="60" y="314" font-size="19" font-weight="700" fill="var(--dim)">幾小時</text>
<rect x="180" y="290" width="96" height="34" rx="6" fill="var(--accent)"/>

<text x="60" y="402" font-size="19" font-weight="700" fill="var(--warn)">幾分鐘</text>
<rect x="180" y="378" width="16" height="34" rx="4" fill="var(--warn)"/>
<text x="220" y="402" font-size="16" fill="var(--warn)">推出去，壞了再退回上一版</text>

<text x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">走完流程再發，已經來不及了。</text>
</svg>
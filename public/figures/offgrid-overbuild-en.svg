<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A short bar compared with one 2.6 times as long">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; font-weight:700; fill:var(--ink); }
    .g  { font-size:20px; font-weight:600; }
    .b  { font-size:16px; fill:var(--dim); }
    .c  { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">Off-grid reliability means building a lot you never use</text>

<text class="g" x="60" y="146" fill="var(--ink)">Load to serve</text>
<rect x="60" y="166" width="280" height="64" fill="var(--accent)"/>
<text class="g" x="356" y="206" fill="var(--accent)">1 GW</text>

<text class="g" x="60" y="306" fill="var(--ink)">Off-grid needs</text>
<rect x="60" y="326" width="280" height="64" fill="var(--warn)"/>
<rect x="340" y="326" width="448" height="64" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="804" y="366" fill="var(--warn)">2.6 GW</text>
<text class="b" x="366" y="366">Extra generation and storage</text>

<line x1="340" y1="240" x2="340" y2="410" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>

<text class="c" x="60" y="470">That extra stretch also gets built next to somebody's house</text>
</svg>
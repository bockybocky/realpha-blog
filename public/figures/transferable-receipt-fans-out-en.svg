<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A single receipt fans out to the right into five destinations, and the fan shows how transferability turns one tax payment into a living asset.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">Once it can change hands, it is more than a tax bill</text>

  <rect x="60" y="150" width="150" height="80" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="135" y="182" font-size="19" text-anchor="middle" fill="var(--dim)">By wealth</text>
  <text class="t" x="135" y="208" font-size="19" text-anchor="middle" fill="var(--dim)">A forced levy</text>

  <line x1="210" y1="190" x2="268" y2="190" stroke="var(--grey)" stroke-width="3"/>

  <rect x="270" y="140" width="170" height="100" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="355" y="178" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">Receipt</text>
  <text class="t" x="355" y="206" font-size="16" text-anchor="middle" fill="var(--accent)">5% a year</text>
  <text class="t" x="355" y="228" font-size="16" text-anchor="middle" fill="var(--dim)">Transferable</text>

  <path d="M440 190 C 520 190 540 100 620 100" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M440 190 C 520 190 540 160 620 160" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M440 190 C 520 190 540 230 620 230" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M440 190 C 520 190 540 300 620 300" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0.6"/>
  <path d="M440 190 C 520 190 540 370 620 370" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0.6"/>

  <text class="t" x="636" y="107" font-size="19" fill="var(--ink)">Buy for interest</text>
  <text class="t" x="636" y="167" font-size="19" fill="var(--ink)">Sell for cash</text>
  <text class="t" x="636" y="237" font-size="19" fill="var(--ink)">Pledge to borrow</text>
  <text class="t" x="636" y="307" font-size="19" fill="var(--dim)">Give to the church</text>
  <text class="t" x="636" y="377" font-size="19" fill="var(--dim)">Leave to heirs</text>

  <line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="60" y="478" font-size="22" font-weight="700" fill="var(--ink)">The moment it fans out, a price is quoted every day</text>
</svg>
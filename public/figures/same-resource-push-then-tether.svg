<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一條關係線前段向上分出兩項助力，後段向下分出三項代價，顏色由藍轉為警示色">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">同一筆資源，先是推力，後是繩子</text>

  <line x1="80" y1="290" x2="420" y2="290" stroke="var(--accent)" stroke-width="8"/>
  <line x1="420" y1="290" x2="880" y2="290" stroke="var(--warn)" stroke-width="8"/>
  <circle cx="420" cy="290" r="11" fill="var(--ink)"/>
  <text x="112" y="322" font-size="15" fill="var(--accent)">1975 起</text>
  <text x="760" y="322" font-size="15" fill="var(--warn)">1984 止</text>

  <line x1="170" y1="290" x2="170" y2="230" stroke="var(--accent)" stroke-width="2"/>
  <rect x="100" y="170" width="150" height="58" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="124" y="206" font-size="19" fill="var(--ink)">城裡唯一的錢</text>
  <line x1="330" y1="290" x2="330" y2="230" stroke="var(--accent)" stroke-width="2"/>
  <rect x="270" y="170" width="130" height="58" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="308" y="206" font-size="19" fill="var(--ink)">晶圓廠</text>

  <line x1="510" y1="290" x2="510" y2="350" stroke="var(--warn)" stroke-width="2"/>
  <rect x="450" y="350" width="130" height="58" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="486" y="386" font-size="19" fill="var(--ink)">指令</text>
  <line x1="660" y1="290" x2="660" y2="350" stroke="var(--warn)" stroke-width="2"/>
  <rect x="600" y="350" width="150" height="58" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="620" y="386" font-size="19" fill="var(--ink)">人待在紐約</text>
  <line x1="830" y1="290" x2="830" y2="350" stroke="var(--warn)" stroke-width="2"/>
  <rect x="770" y="350" width="150" height="58" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="790" y="386" font-size="19" fill="var(--ink)">關上的門</text>

  <text x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">問錢夠不夠，也問這筆錢帶著誰的議程</text>
</svg>
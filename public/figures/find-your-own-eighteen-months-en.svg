<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Among four step bars, the longest one labeled no substitute is pointed out as the step to move first.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="h" x="60" y="58">Find your own 18 months</text>
  <text class="b" x="60" y="88">Bar length is the minimum time needed</text>

  <line x1="300" y1="120" x2="300" y2="430" stroke="var(--line)" stroke-width="2"/>

  <text class="g" x="280" y="170" text-anchor="end">Your own research</text>
  <rect x="300" y="150" width="150" height="30" rx="5" fill="var(--grey)"/>
  <text class="b" x="466" y="172">Parallel</text>

  <text class="g" x="280" y="230" text-anchor="end">Your own practice</text>
  <rect x="300" y="210" width="240" height="30" rx="5" fill="var(--grey)"/>
  <text class="b" x="556" y="232">Parallel</text>

  <text class="g" x="280" y="290" text-anchor="end">Waiting on a reply</text>
  <rect x="300" y="270" width="520" height="30" rx="5" fill="var(--warn)"/>
  <text class="g" x="836" y="292" fill="var(--warn)">No sub</text>

  <text class="g" x="280" y="350" text-anchor="end">In-person errand</text>
  <rect x="540" y="330" width="140" height="30" rx="5" fill="var(--grey)"/>
  <text class="b" x="696" y="352">Put it later</text>

  <path d="M300 404 L300 418 L820 418 L820 404" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="560" y="444" text-anchor="middle">Total time is set by the longest bar</text>
  <text class="c" x="60" y="506">Move the longest step you can't swap out first</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The left platform is held up by one cracked pillar, the right platform by four pillars together">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">Where credibility sits</text>

<rect x="70" y="150" width="360" height="46" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="90" y="181" font-size="19" fill="var(--ink)">Credibility</text>
<rect x="232" y="196" width="34" height="180" fill="var(--warn)" opacity="0.8"/>
<path d="M249 226 L236 258 L262 286 L249 318" stroke="var(--page)" stroke-width="4" fill="none"/>
<rect x="70" y="376" width="360" height="10" rx="4" fill="var(--line)"/>
<text x="196" y="416" font-size="19" fill="var(--warn)">One person</text>
<text x="70" y="452" font-size="16" fill="var(--dim)">He falls, it falls</text>

<rect x="530" y="150" width="360" height="46" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="550" y="181" font-size="19" fill="var(--ink)">Credibility</text>
<rect x="576" y="196" width="30" height="180" fill="var(--accent)" opacity="0.8"/>
<rect x="656" y="196" width="30" height="180" fill="var(--accent)" opacity="0.8"/>
<rect x="736" y="196" width="30" height="180" fill="var(--accent)" opacity="0.8"/>
<rect x="816" y="196" width="30" height="180" fill="var(--accent)" opacity="0.8"/>
<rect x="530" y="376" width="360" height="10" rx="4" fill="var(--line)"/>
<text x="546" y="416" font-size="16" fill="var(--dim)">Target</text>
<text x="626" y="416" font-size="16" fill="var(--dim)">Votes</text>
<text x="706" y="416" font-size="16" fill="var(--dim)">Records</text>
<text x="786" y="416" font-size="16" fill="var(--dim)">Accountability</text>
<text x="530" y="452" font-size="16" fill="var(--dim)">Swap one, still up</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上層是薄波浪帶被箭頭推著飄動，下層是厚實平整的板塊">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); }
    .g  { font-size:19px; fill:var(--dim); }
    .s  { font-size:15px; fill:var(--dim); }
    .c  { font-size:22px; fill:var(--ink); }
</style>
<text class="ti" x="80" y="62">會換的那層，和換不掉的那層</text>
<path d="M120 176 C 220 150, 320 202, 420 176 C 520 150, 620 202, 720 176 C 772 163, 806 170, 840 180 L 840 212 C 806 202, 772 195, 720 208 C 620 234, 520 182, 420 208 C 320 234, 220 182, 120 208 Z" fill="var(--grey)" fill-opacity="0.35" stroke="var(--grey)" stroke-width="2"/>
<text class="s" x="200" y="146">敘事</text>
<text class="s" x="420" y="146">防曬新聞</text>
<text class="s" x="620" y="146">晨光話題</text>
<path d="M300 240 L 240 240" stroke="var(--dim)" stroke-width="2"/>
<path d="M240 240 l 12 -6 l 0 12 Z" fill="var(--dim)"/>
<path d="M620 240 L 680 240" stroke="var(--dim)" stroke-width="2"/>
<path d="M680 240 l -12 -6 l 0 12 Z" fill="var(--dim)"/>
<text class="g" x="856" y="200">會換</text>
<rect x="120" y="300" width="720" height="150" rx="6" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="200" y="360" fill="var(--accent)">室內社會</text>
<text class="g" x="560" y="360" fill="var(--accent)">穿戴小型化</text>
<line x1="120" y1="392" x2="840" y2="392" stroke="var(--accent)" stroke-width="2" stroke-opacity="0.5"/>
<line x1="120" y1="422" x2="840" y2="422" stroke="var(--accent)" stroke-width="2" stroke-opacity="0.5"/>
<text class="g" x="856" y="382" fill="var(--accent)">換不掉</text>
<text class="c" x="80" y="500">分層看，才知道在等什麼</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條平行的路通向同一個判斷，上面那條中間有一個實心方塊擋著，下面那條中間是空的虛線框，直接通過" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="64" y="66" font-size="27" font-weight="700" fill="var(--ink)">兩個方向，只有一邊有閘</text>
<text x="64" y="98" font-size="16" fill="var(--dim)">相反的說法會被擋下來重算，相符的直接進來</text>

<rect x="64" y="166" width="190" height="62" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="159" y="204" font-size="16" fill="var(--ink)" text-anchor="middle">和我相反的說法</text>
<line x1="254" y1="197" x2="352" y2="197" stroke="var(--accent)" stroke-width="2"/>
<rect x="356" y="160" width="180" height="74" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="446" y="204" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">回去重算</text>
<line x1="536" y1="197" x2="690" y2="234" stroke="var(--accent)" stroke-width="2"/>
<path d="M684 224 L700 237 L680 240 Z" fill="var(--accent)"/>

<rect x="64" y="330" width="190" height="62" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="159" y="368" font-size="16" fill="var(--ink)" text-anchor="middle">和我相符的說法</text>
<line x1="254" y1="361" x2="690" y2="304" stroke="var(--warn)" stroke-width="2" stroke-dasharray="9 7"/>
<path d="M684 294 L700 301 L682 312 Z" fill="var(--warn)"/>
<rect x="356" y="324" width="180" height="74" rx="10" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="446" y="368" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">沒有閘</text>

<rect x="704" y="222" width="192" height="92" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="800" y="276" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">我的判斷</text>

<text x="480" y="462" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">缺的是另外那一邊的閘</text>
</svg>
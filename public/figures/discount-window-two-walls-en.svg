<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A thin cracked wall and a thick intact wall on the bank's path to the discount window, with the arrow stopped at the thick one">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
<marker id="a7" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="var(--accent)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">Two walls, different thickness</text>
<rect x="60" y="90" width="840" height="310" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="96" y="200" width="150" height="100" rx="10" fill="none" stroke="var(--ink)" stroke-width="3"/>
<text class="g" x="132" y="256">Bank</text>
<rect x="760" y="200" width="130" height="100" rx="10" fill="none" stroke="var(--ink)" stroke-width="3"/>
<text class="g" x="784" y="244">Discount</text>
<text class="g" x="784" y="272">window</text>
<rect x="420" y="150" width="16" height="70" fill="var(--grey)"/>
<rect x="420" y="270" width="16" height="80" fill="var(--grey)"/>
<rect x="600" y="140" width="52" height="220" fill="var(--warn)" opacity="0.55"/>
<rect x="600" y="140" width="52" height="220" fill="none" stroke="var(--warn)" stroke-width="2"/>
<path d="M250 250 L580 250" fill="none" stroke="var(--accent)" stroke-width="5" marker-end="url(#a7)"/>
<text class="g" x="370" y="130">The market wall</text>
<text class="s" x="370" y="392">Already cracked</text>
<text class="g" x="590" y="130" fill="var(--warn)">The political wall</text>
<text class="s" x="590" y="392">Thick and intact</text>
<text class="c" x="60" y="462">You can take down your own wall, not someone else's</text>
</svg>
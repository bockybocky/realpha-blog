<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="In a nine-box grid cut by inflation and growth, only the high-inflation, high-growth box is highlighted and labeled as today with just +40 bp annualized, while the other eight sit empty.">
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .gd { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .w { font-size:19px; fill:var(--warn); }
    .a { font-size:19px; fill:var(--accent); }
  </style>
  <text class="t" x="60" y="66">Box sizes, tape times</text>
  <rect x="200" y="140" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="350" y="140" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="200" y="240" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="350" y="240" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="240" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="200" y="340" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="350" y="340" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="340" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="140" width="150" height="100" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="530" cy="178" r="7" fill="var(--accent)"/>
  <text class="a" x="548" y="186">Now</text>
  <text class="b" x="514" y="222">Only +40 bp/yr</text>
  <text class="b" x="140" y="200">Infl hi</text>
  <text class="b" x="140" y="300">Infl mid</text>
  <text class="b" x="140" y="400">Infl lo</text>
  <text class="b" x="240" y="472">Grow lo</text>
  <text class="b" x="390" y="472">Grow mid</text>
  <text class="b" x="540" y="472">Grow hi</text>
  <line x1="700" y1="150" x2="700" y2="430" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="724" y="220">Oil: size</text>
  <text class="g" x="724" y="268">Spark: TA</text>
  <text class="c" x="60" y="534">Setup≠trigger</text>
</svg>
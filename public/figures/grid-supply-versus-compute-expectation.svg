<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="併網電量柱較低、算力期待柱較高，中間一段落差標為缺口">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="48" font-size="27" fill="var(--ink)">明年對不上的那一段</text>
<line x1="100" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="220" y="268" width="150" height="132" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text x="295" y="252" font-size="20" fill="var(--dim)" text-anchor="middle">20 GW 這一端</text>
<text x="295" y="432" font-size="19" fill="var(--dim)" text-anchor="middle">電網能併進來的</text>
<text x="295" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">變壓器・輪機・法規</text>
<rect x="600" y="170" width="150" height="230" fill="var(--accent)" opacity="0.85"/>
<text x="675" y="154" font-size="20" fill="var(--accent)" text-anchor="middle">30 GW 以上</text>
<text x="675" y="432" font-size="19" fill="var(--accent)" text-anchor="middle">算力端的期待</text>
<text x="675" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">加速器銷售隱含</text>
<line x1="370" y1="268" x2="600" y2="268" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="6 6"/>
<line x1="485" y1="172" x2="485" y2="266" stroke="var(--warn)" stroke-width="2"/>
<path d="M 478 180 L 485 168 L 492 180 Z" fill="var(--warn)"/>
<path d="M 478 258 L 485 270 L 492 258 Z" fill="var(--warn)"/>
<text x="500" y="222" font-size="19" fill="var(--warn)">缺口</text>
<text x="60" y="492" font-size="22" fill="var(--ink)">不是需求掉下來，是底下那根長不夠快</text>
</svg>
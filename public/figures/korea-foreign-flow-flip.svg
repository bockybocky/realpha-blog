<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-label="兩格對照：過去外資與指數箭頭同向朝上；今年夏天散戶與指數朝上，外資箭頭朝下，關係翻轉">
<rect x="0" y="0" width="960" height="570" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="52" text-anchor="middle">韓股：同樣在漲，推的人換了</text>
<rect x="40" y="90" width="420" height="370" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="500" y="90" width="420" height="370" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="250" y="130" text-anchor="middle">過去</text>
<text class="g" x="710" y="130" text-anchor="middle">今年夏天</text>
<rect x="161" y="200" width="18" height="190" fill="var(--accent)"/>
<polygon points="144,200 196,200 170,165" fill="var(--accent)"/>
<rect x="321" y="200" width="18" height="190" fill="var(--dim)"/>
<polygon points="304,200 356,200 330,165" fill="var(--dim)"/>
<rect x="581" y="200" width="18" height="190" fill="var(--accent)"/>
<polygon points="564,200 616,200 590,165" fill="var(--accent)"/>
<rect x="701" y="165" width="18" height="190" fill="var(--warn)"/>
<polygon points="684,355 736,355 710,390" fill="var(--warn)"/>
<rect x="821" y="200" width="18" height="190" fill="var(--dim)"/>
<polygon points="804,200 856,200 830,165" fill="var(--dim)"/>
<text class="g" x="170" y="428" text-anchor="middle">外資</text>
<text class="g" x="330" y="428" text-anchor="middle">指數</text>
<text class="g" x="590" y="428" text-anchor="middle">本地散戶</text>
<text class="g" x="710" y="428" text-anchor="middle">外資</text>
<text class="g" x="830" y="428" text-anchor="middle">指數</text>
<text class="s" x="710" y="450" text-anchor="middle">賣出再平衡</text>
<text class="g" x="250" y="500" text-anchor="middle" style="fill:var(--accent)">外資與指數：同向</text>
<text class="g" x="710" y="500" text-anchor="middle" style="fill:var(--warn)">外資與指數：反向</text>
<text class="c" x="480" y="548" text-anchor="middle">舊模型看外資＝方向讀反</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A tall column is cut into two parts: the larger lower part is what was counted inside the data centers, and the upper part is the gap of roughly fifty thousand chips; an arrow runs from that upper part to a dashed box with a question mark on the right, standing for warehouses that were only mentioned a week later.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">Total minus counted</text>
  <rect x="140" y="120" width="190" height="150" fill="var(--warn)" opacity="0.5"/>
  <rect x="140" y="270" width="190" height="170" fill="var(--accent)"/>
  <rect x="140" y="120" width="190" height="320" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="235" y="190" text-anchor="middle">~50,000 gap</text>
  <text class="n" x="235" y="218" text-anchor="middle" fill="var(--ink)">Mostly Blackwell</text>
  <text class="g" x="235" y="350" text-anchor="middle" fill="var(--page)">Counted</text>
  <text class="n" x="235" y="378" text-anchor="middle" fill="var(--page)">12+ sites, 8 cos</text>
  <text class="g" x="235" y="474" text-anchor="middle">Trade total</text>
  <text class="n" x="235" y="500" text-anchor="middle">Malaysia, Indonesia</text>
  <line x1="350" y1="195" x2="562" y2="195" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="576,195 558,185 558,205" fill="var(--warn)"/>
  <text class="n" x="456" y="178" text-anchor="middle">Where is it?</text>
  <rect x="596" y="120" width="280" height="150" rx="10" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="g" x="736" y="178" text-anchor="middle" fill="var(--warn)">Sheds</text>
  <text class="n" x="736" y="208" text-anchor="middle">Unknown then</text>
  <text class="n" x="736" y="234" text-anchor="middle">That sum?</text>
  <text class="c" x="736" y="330" text-anchor="middle" fill="var(--warn)">None</text>
  <text class="c" x="60" y="534">Sum yes, reply no</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條向右的路線通過第一道開著的閘，停在第二道關著的閘前面">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="48" y="62" font-size="27" fill="var(--ink)">算得通，不等於撐得住</text>

  <line x1="120" y1="300" x2="616" y2="300" stroke="var(--accent)" stroke-width="4"/>
  <line x1="700" y1="300" x2="880" y2="300" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>

  <rect x="368" y="176" width="24" height="86" fill="var(--accent)"/>
  <rect x="368" y="338" width="24" height="86" fill="var(--accent)"/>
  <text x="300" y="462" font-size="20" fill="var(--ink)">技術上跑得通</text>

  <rect x="676" y="176" width="24" height="248" fill="var(--warn)"/>
  <text x="640" y="462" font-size="20" fill="var(--warn)">政治上撐得住</text>

  <circle cx="616" cy="300" r="13" fill="var(--ink)"/>
  <text x="556" y="266" font-size="19" fill="var(--ink)">瑞典</text>

  <text x="48" y="506" font-size="22" fill="var(--ink)">過了第一道，倒在第二道</text>
</svg>
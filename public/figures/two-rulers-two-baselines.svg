<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩個各自獨立的長條圖，左邊的落差從一大段縮成一小段，右邊的高度只到基準的四分之三，兩邊基準線不同高">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">同一件事，兩把尺量出來的兩個數字</text>

  <rect x="60" y="92" width="390" height="390" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="84" y="130">BNEF 的尺</text>
  <text class="d" x="84" y="158">基準：BNEF 自己法案前的預測</text>
  <line x1="84" y1="240" x2="426" y2="240" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="d" x="426" y="232" text-anchor="end">基準線</text>
  <rect x="100" y="240" width="76" height="200" fill="var(--grey)"/>
  <rect x="216" y="286" width="76" height="154" fill="var(--grey)"/>
  <rect x="332" y="254" width="76" height="186" fill="var(--accent)"/>
  <line x1="84" y1="440" x2="426" y2="440" stroke="var(--line)" stroke-width="3"/>
  <text class="d" x="138" y="464" text-anchor="middle">法案前</text>
  <text class="d" x="254" y="464" text-anchor="middle">剛通過時</text>
  <text class="d" x="370" y="464" text-anchor="middle">現在</text>
  <text class="d" x="254" y="278" text-anchor="middle">低 20～25%</text>
  <text class="d" x="370" y="246" text-anchor="middle">低 6～7%</text>

  <rect x="510" y="92" width="390" height="390" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="534" y="130">Bermel 的尺</text>
  <text class="d" x="534" y="158">基準：2021 年的拜登政策環境</text>
  <line x1="534" y1="240" x2="876" y2="240" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="d" x="876" y="232" text-anchor="end">基準線</text>
  <rect x="580" y="240" width="96" height="200" fill="var(--grey)"/>
  <rect x="730" y="290" width="96" height="150" fill="var(--accent)"/>
  <line x1="534" y1="440" x2="876" y2="440" stroke="var(--line)" stroke-width="3"/>
  <text class="d" x="628" y="464" text-anchor="middle">拜登時代</text>
  <text class="d" x="778" y="464" text-anchor="middle">現在環境</text>
  <text class="d" x="778" y="282" text-anchor="middle">約四分之三</text>

  <text class="c" x="60" y="528">兩條基準線不同高，兩個數字不能相減</text>
</svg>
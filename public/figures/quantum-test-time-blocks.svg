<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="一個月的測試長條，兩端各被兩天的降溫與回溫佔住">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .k { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<text class="t" x="60" y="62">測一顆，一個月</text>

<rect x="80" y="150" width="800" height="90" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="80" y="150" width="107" height="90" fill="var(--warn)" opacity="0.35"/>
<rect x="773" y="150" width="107" height="90" fill="var(--warn)" opacity="0.35"/>
<line x1="187" y1="150" x2="187" y2="240" stroke="var(--warn)" stroke-width="2"/>
<line x1="773" y1="150" x2="773" y2="240" stroke="var(--warn)" stroke-width="2"/>

<text class="g" x="96" y="200">降溫</text>
<text class="b" x="96" y="226">兩天</text>
<text class="g" x="789" y="200">回溫</text>
<text class="b" x="789" y="226">兩天</text>
<text class="g" x="420" y="200" fill="var(--accent)">量測</text>

<line x1="80" y1="280" x2="880" y2="280" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="80" y="306">一顆千位元晶片</text>
<text class="b" x="800" y="306">一個月</text>

<text class="k" x="80" y="378">室溫預篩對不上最後表現</text>
<text class="b" x="80" y="410">相干時間與閘保真度只在極低溫下出現，且是推斷出來的</text>
<text class="b" x="80" y="440">所以現在的做法是買一台量子電腦來測量子晶片</text>
</svg>
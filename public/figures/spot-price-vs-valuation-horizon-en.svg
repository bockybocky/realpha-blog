<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On a timeline, a small block of live capacity at the left is priced expensively, while the large block of capacity not yet online at the right is what the valuation buys, marked by two arrows.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="80" font-size="27" fill="var(--ink)">Two years, one story</text>
  <rect x="150" y="300" width="90" height="70" fill="var(--warn)" opacity="0.85"/>
  <rect x="430" y="250" width="420" height="120" fill="var(--grey)" opacity="0.5"/>
  <line x1="120" y1="400" x2="890" y2="400" stroke="var(--line)" stroke-width="3"/>
  <text class="t" x="195" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">Now</text>
  <text class="t" x="640" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">2028–2029</text>
  <text class="t" x="195" y="285" font-size="19" fill="var(--ink)" text-anchor="middle">Live</text>
  <text class="t" x="640" y="232" font-size="19" fill="var(--ink)" text-anchor="middle">Not up</text>
  <line x1="195" y1="200" x2="195" y2="290" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="195,298 187,280 203,280" fill="var(--warn)"/>
  <text class="t" x="195" y="182" font-size="19" fill="var(--warn)" text-anchor="middle">Spot dear</text>
  <line x1="640" y1="470" x2="640" y2="388" stroke="var(--accent)" stroke-width="4"/>
  <polygon points="640,380 632,398 648,398" fill="var(--accent)"/>
  <text class="t" x="640" y="500" font-size="22" fill="var(--accent)" text-anchor="middle">Priced here</text>
</svg>
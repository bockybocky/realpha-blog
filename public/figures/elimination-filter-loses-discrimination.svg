<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="漏斗把大量標的刷到只剩四個等大的方塊，方塊往下卻長出高矮差距極大的柱子">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .t{font-size:27px;fill:var(--ink);font-weight:700}
    .g{font-size:19px;fill:var(--ink);font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="58">刷掉大多數之後，它就不再分得出高下</text>
<text class="b" x="60" y="88">市場、技術、人才、法規，是門檻不是理由</text>
<g fill="var(--grey)">
<rect x="280" y="108" width="24" height="24" rx="4"/><rect x="316" y="108" width="24" height="24" rx="4"/>
<rect x="352" y="108" width="24" height="24" rx="4"/><rect x="388" y="108" width="24" height="24" rx="4"/>
<rect x="424" y="108" width="24" height="24" rx="4"/><rect x="460" y="108" width="24" height="24" rx="4"/>
<rect x="496" y="108" width="24" height="24" rx="4"/><rect x="532" y="108" width="24" height="24" rx="4"/>
<rect x="568" y="108" width="24" height="24" rx="4"/><rect x="604" y="108" width="24" height="24" rx="4"/>
<rect x="640" y="108" width="24" height="24" rx="4"/><rect x="676" y="108" width="24" height="24" rx="4"/>
</g>
<polygon points="270,156 700,156 540,318 430,318" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="120" y="238" fill="var(--dim)">淘汰條件</text>
<text class="b" x="736" y="238">大多數死在這裡</text>
<g fill="var(--accent)">
<rect x="404" y="344" width="34" height="34" rx="5"/><rect x="450" y="344" width="34" height="34" rx="5"/>
<rect x="496" y="344" width="34" height="34" rx="5"/><rect x="542" y="344" width="34" height="34" rx="5"/>
</g>
<text class="b" x="620" y="368">全都合格</text>
<rect x="404" y="400" width="34" height="46" fill="var(--grey)"/>
<rect x="450" y="400" width="34" height="112" fill="var(--grey)"/>
<rect x="496" y="400" width="34" height="22" fill="var(--grey)"/>
<rect x="542" y="400" width="34" height="88" fill="var(--grey)"/>
<text class="b" x="620" y="452">表現天差地遠</text>
<line x1="300" y1="446" x2="386" y2="446" stroke="var(--accent)" stroke-width="3"/>
<path d="M392 446 L378 439 L378 453 Z" fill="var(--accent)"/>
<text class="g" x="292" y="440" text-anchor="end" fill="var(--accent)">差別在這一層</text>
<text class="c" x="60" y="560">合格是入場門檻，不是買進理由</text>
</svg>
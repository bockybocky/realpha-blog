<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條線從同一點出發，一條持續往上，另一條在開始外包那天之後水平不動，右側高度差是少練的部分。">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .k { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="h" x="60" y="66">省掉的那一步，正好是讓你下次更準的那一步</text>

<line x1="120" y1="130" x2="120" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="84" y="270">手感</text>
<text class="s" x="900" y="460" text-anchor="end">兩年後</text>

<line x1="380" y1="140" x2="380" y2="430" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="g" x="380" y="128" text-anchor="middle">開始外包那天</text>

<path d="M140 400 C250 372 320 346 380 330" stroke="var(--grey)" stroke-width="5" fill="none"/>
<path d="M380 330 C520 300 700 232 880 186" stroke="var(--accent)" stroke-width="5" fill="none"/>
<path d="M380 330 L880 330" stroke="var(--grey)" stroke-width="5" fill="none"/>

<line x1="850" y1="196" x2="850" y2="320" stroke="var(--warn)" stroke-width="3"/>
<polygon points="850,188 843,202 857,202" fill="var(--warn)"/>
<polygon points="850,328 843,314 857,314" fill="var(--warn)"/>
<text class="s" x="836" y="264" text-anchor="end">少練的那幾遍</text>

<text class="g" x="880" y="168" text-anchor="end">每次自己先判一遍</text>
<text class="g" x="880" y="360" text-anchor="end">每次都交給模型</text>

<text class="k" x="60" y="508">工具省的是時間，代價藏在後面</text>
</svg>
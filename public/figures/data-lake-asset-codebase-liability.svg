<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一個八年，左邊資料底盤愈堆愈厚是資產，右邊程式庫大過上下文窗塞不進去是負債">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>svg{--page:#ffffff;--card:#f6f8fc;--line:#dde3ee;--ink:#1a212b;--dim:#57616f;--grey:#b9c2d0;--accent:#1f6feb;--warn:#d97706;}@media (prefers-color-scheme: dark){svg{--page:#0d1117;--card:#161b22;--line:#272e39;--ink:#e6edf3;--dim:#8b949e;--grey:#4a5464;--accent:#58a6ff;--warn:#d29922;}}text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}</style>
<text x="60" y="58" font-size="27" font-weight="700">同一個八年，攢出一個資產和一個負債</text>
<text x="90" y="124" font-size="20" font-weight="700" fill="var(--accent)">資料底盤</text>
<rect x="90" y="368" width="300" height="38" rx="5" fill="var(--accent)" opacity="0.85"/>
<rect x="110" y="322" width="260" height="38" rx="5" fill="var(--accent)" opacity="0.7"/>
<rect x="132" y="276" width="216" height="38" rx="5" fill="var(--accent)" opacity="0.55"/>
<rect x="154" y="230" width="172" height="38" rx="5" fill="var(--accent)" opacity="0.4"/>
<text x="90" y="442" font-size="16" fill="var(--dim)">愈接愈廣 · 愈久愈厚</text>
<line x1="480" y1="110" x2="480" y2="450" stroke="var(--line)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="570" y="124" font-size="20" font-weight="700" fill="var(--warn)">八年程式庫</text>
<rect x="570" y="256" width="150" height="150" rx="8" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text x="645" y="440" font-size="16" text-anchor="middle" fill="var(--dim)">上下文窗</text>
<rect x="640" y="200" width="230" height="230" rx="8" fill="var(--warn)" opacity="0.28" stroke="var(--warn)" stroke-width="3"/>
<text x="786" y="178" font-size="16" fill="var(--warn)">塞不進去</text>
<text x="60" y="502" font-size="22" font-weight="700">厚度是資產，體積是負債</text>
</svg>
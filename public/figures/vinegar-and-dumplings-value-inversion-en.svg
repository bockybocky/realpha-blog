<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A large amount is used but is cheap, while the small amount is valuable, so the two move in opposite directions.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--ink); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="48" y="54">Amount used</text>
<text class="g" x="48" y="130">Amount used</text>
<circle cx="320" cy="200" r="92" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="700" cy="200" r="26" fill="var(--accent)"/>
<text class="b" x="320" y="330" text-anchor="middle">Dumplings: tools, plugins, workflows</text>
<text class="b" x="700" y="330" text-anchor="middle">Vinegar: the story</text>
<text class="g" x="48" y="380">Value</text>
<rect x="260" y="510" width="120" height="30" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="640" y="400" width="120" height="140" fill="var(--accent)"/>
<line x1="180" y1="540" x2="880" y2="540" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="480" y="585" text-anchor="middle">Dumplings are cheap; vinegar has value</text>
</svg>
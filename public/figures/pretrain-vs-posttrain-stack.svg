<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三根堆疊柱，前兩根一樣高但組成不同，第三根底層與頂層都厚而明顯超出">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">打平靠劍術，超車靠換劍</text>
<rect x="612" y="84" width="18" height="18" fill="var(--accent)"/>
<text x="638" y="99" font-size="16" fill="var(--dim)">預訓練規模</text>
<rect x="768" y="84" width="18" height="18" fill="var(--grey)"/>
<text x="794" y="99" font-size="16" fill="var(--dim)">後訓練加成</text>
<line x1="120" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>
<rect x="170" y="260" width="160" height="200" fill="var(--accent)"/>
<rect x="170" y="200" width="160" height="60" fill="var(--grey)"/>
<rect x="410" y="380" width="160" height="80" fill="var(--accent)"/>
<rect x="410" y="200" width="160" height="180" fill="var(--grey)"/>
<rect x="650" y="260" width="160" height="200" fill="var(--accent)"/>
<rect x="650" y="100" width="160" height="160" fill="var(--grey)"/>
<line x1="140" y1="200" x2="600" y2="200" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="608" y="194" font-size="16" fill="var(--dim)">打平</text>
<text x="250" y="492" font-size="19" fill="var(--ink)" text-anchor="middle">對手</text>
<text x="490" y="492" font-size="19" fill="var(--ink)" text-anchor="middle">上一代自家</text>
<text x="730" y="492" font-size="19" fill="var(--ink)" text-anchor="middle">Astra</text>
<text x="250" y="516" font-size="15" fill="var(--dim)" text-anchor="middle">大模型</text>
<text x="490" y="516" font-size="15" fill="var(--dim)" text-anchor="middle">小模型硬撐</text>
<text x="730" y="516" font-size="15" fill="var(--dim)" text-anchor="middle">兩端都補回來</text>
<text x="60" y="558" font-size="22" fill="var(--ink)">同樣的高度，撐法不一樣</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="四根橫條比長度，擔保上限約為過去一年營運現金流的八成">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:16px; fill:var(--ink); }
    .n { font-size:19px; fill:var(--ink); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">能力與義務，放在同一把尺上</text>
<text class="b" x="60" y="90">單位：億美元・截至 2026-07-26</text>

<text class="s" x="340" y="180" text-anchor="end">過去四季營運現金流</text>
<rect x="360" y="150" width="500" height="46" rx="6" fill="var(--accent)"/>
<text class="n" x="872" y="181">1343</text>

<text class="s" x="340" y="260" text-anchor="end">殘值擔保上限</text>
<rect x="360" y="230" width="391" height="46" rx="6" fill="var(--warn)"/>
<text class="n" x="763" y="261">1050</text>

<text class="s" x="340" y="340" text-anchor="end">採購與供應義務</text>
<rect x="360" y="310" width="354" height="46" rx="6" fill="var(--warn)"/>
<text class="n" x="726" y="341">952</text>

<text class="s" x="340" y="420" text-anchor="end">最近一季營收</text>
<rect x="360" y="390" width="358" height="46" rx="6" fill="var(--grey)"/>
<text class="n" x="730" y="421">962</text>

<line x1="751" y1="140" x2="751" y2="230" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text class="s" x="761" y="134" fill="var(--warn)">約八成</text>

<text class="c" x="60" y="480">上面一根是賺到的，中間兩根是還沒發生的</text>
</svg>
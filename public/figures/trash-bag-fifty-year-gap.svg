<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸上 1968 之後的空白段長得占滿畫面，新作法的兩個點被擠在最右端。">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" fill="var(--ink)">一次處置，留了半個世紀</text>
<text x="60" y="92" font-size="16" fill="var(--dim)">軸長按年份等比，空白段的長度就是實際長度</text>

<rect x="640" y="250" width="167" height="52" fill="var(--warn)" opacity="0.18"/>
<text x="652" y="282" font-size="20" fill="var(--warn)">沒有新解法</text>

<line x1="80" y1="330" x2="890" y2="330" stroke="var(--line)" stroke-width="3"/>

<circle cx="117" cy="330" r="8" fill="var(--grey)"/>
<line x1="117" y1="330" x2="117" y2="378" stroke="var(--grey)" stroke-width="2"/>
<text x="117" y="402" font-size="19" fill="var(--dim)" text-anchor="middle">1811</text>
<text x="117" y="426" font-size="15" fill="var(--dim)" text-anchor="middle">方格街道・無巷弄</text>

<circle cx="640" cy="330" r="10" fill="var(--warn)"/>
<line x1="640" y1="330" x2="640" y2="378" stroke="var(--warn)" stroke-width="2"/>
<text x="640" y="402" font-size="19" fill="var(--warn)" text-anchor="middle">1968</text>
<text x="640" y="426" font-size="15" fill="var(--dim)" text-anchor="middle">罷工・黑袋委員會</text>

<circle cx="830" cy="330" r="8" fill="var(--accent)"/>
<line x1="830" y1="330" x2="830" y2="226" stroke="var(--accent)" stroke-width="2"/>
<text x="830" y="214" font-size="19" fill="var(--accent)" text-anchor="middle">2025</text>
<text x="830" y="192" font-size="15" fill="var(--dim)" text-anchor="middle">西哈林開始</text>

<circle cx="850" cy="330" r="8" fill="var(--accent)"/>
<line x1="850" y1="330" x2="850" y2="156" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>
<text x="850" y="144" font-size="19" fill="var(--accent)" text-anchor="middle">2031</text>
<text x="850" y="122" font-size="15" fill="var(--dim)" text-anchor="middle">承諾鋪完</text>

<text x="80" y="356" font-size="15" fill="var(--dim)">1800</text>
<text x="890" y="356" font-size="15" fill="var(--dim)" text-anchor="end">2040</text>

<text x="60" y="478" font-size="22" fill="var(--ink)">最顯眼的那個特徵，常常只是一次急就章</text>
</g>
</svg>
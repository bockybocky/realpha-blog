<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One one-way arrow in the left panel and two opposing arrows forming a loop in the right, contrasting ordering only with ordering and lending at once">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <defs>
    <marker id="ad1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/>
    </marker>
    <marker id="aa1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <text x="60" y="58" font-size="27" fill="var(--ink)">Big orders, different shapes</text>

  <rect x="56" y="100" width="392" height="310" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="80" y="140" font-size="20" fill="var(--dim)">Just an order</text>
  <rect x="90" y="205" width="140" height="72" rx="10" fill="var(--page)" stroke="var(--grey)"/>
  <text x="160" y="248" font-size="16" fill="var(--ink)" text-anchor="middle">Customer</text>
  <rect x="292" y="205" width="126" height="72" rx="10" fill="var(--page)" stroke="var(--grey)"/>
  <text x="355" y="248" font-size="16" fill="var(--ink)" text-anchor="middle">Supplier</text>
  <line x1="238" y1="241" x2="282" y2="241" stroke="var(--grey)" stroke-width="3" marker-end="url(#ad1)"/>
  <text x="260" y="222" font-size="15" fill="var(--dim)" text-anchor="middle">Order</text>
  <text x="252" y="345" font-size="16" fill="var(--dim)" text-anchor="middle">One line</text>

  <rect x="512" y="100" width="392" height="310" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="536" y="140" font-size="20" fill="var(--accent)">Orders and lends</text>
  <rect x="546" y="180" width="140" height="72" rx="10" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text x="616" y="223" font-size="16" fill="var(--ink)" text-anchor="middle">Customer</text>
  <rect x="748" y="180" width="126" height="72" rx="10" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text x="811" y="223" font-size="16" fill="var(--ink)" text-anchor="middle">Supplier</text>
  <line x1="694" y1="216" x2="738" y2="216" stroke="var(--accent)" stroke-width="3" marker-end="url(#aa1)"/>
  <text x="716" y="197" font-size="15" fill="var(--accent)" text-anchor="middle">Order</text>
  <path d="M811,252 L811,320 L616,320 L616,262" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#aa1)"/>
  <text x="714" y="343" font-size="15" fill="var(--accent)" text-anchor="middle">Compute and cash back</text>
  <path d="M616,252 L616,300 L560,300" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="556" y="304" font-size="15" fill="var(--warn)" text-anchor="end">Funding</text>
  <text x="716" y="382" font-size="16" fill="var(--dim)" text-anchor="middle">A loop</text>

  <text x="60" y="475" font-size="22" fill="var(--ink)">The lender ties its own P&amp;L to it</text>
</svg>
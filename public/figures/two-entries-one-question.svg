<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩個入口方塊各有箭頭往下匯流到同一個問題方框，下方四個小方塊列出功能受影響的樣子">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <defs>
    <marker id="arw2" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <text x="60" y="62" font-size="27" font-weight="700">該找誰談</text>

  <rect x="80" y="110" width="340" height="140" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="108" y="154" font-size="20" font-weight="700">生活某一面卡住</text>
  <text x="108" y="190" font-size="16">生涯 · 伴侶 · 哀傷</text>
  <text x="108" y="220" font-size="16" fill="var(--dim)">臨床或諮商都可以</text>

  <rect x="540" y="110" width="340" height="140" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="568" y="154" font-size="20" font-weight="700">偏生理的訊號</text>
  <text x="568" y="190" font-size="16">睡眠 · 食慾 · 動力</text>
  <text x="568" y="220" font-size="16" fill="var(--dim)">先讓醫師或臨床心理師評估</text>

  <path d="M250 252 L250 290 L420 290 L420 314" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arw2)"/>
  <path d="M710 252 L710 290 L540 290 L540 314" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arw2)"/>

  <rect x="140" y="320" width="680" height="100" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="480" y="364" font-size="20" font-weight="700" text-anchor="middle">社會職業功能受影響了嗎</text>
  <text x="480" y="396" font-size="16" fill="var(--dim)" text-anchor="middle">兩條路都要問這一題</text>

  <rect x="100" y="448" width="175" height="56" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="187" y="483" font-size="16" text-anchor="middle">工作出錯</text>
  <rect x="295" y="448" width="175" height="56" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="382" y="483" font-size="16" text-anchor="middle">念不下書</text>
  <rect x="490" y="448" width="175" height="56" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="577" y="483" font-size="16" text-anchor="middle">家務做不動</text>
  <rect x="685" y="448" width="175" height="56" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="772" y="483" font-size="16" text-anchor="middle">相處受影響</text>

  <text x="60" y="548" font-size="22" font-weight="700">卡住去談，功能受損先評估</text>
</svg>
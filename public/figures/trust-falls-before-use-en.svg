<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The two trend lines fall at different points on the time axis, with the gap between them marked">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="72">The qualification falls first, the position much later</text>

<line x1="480" y1="130" x2="480" y2="430" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<line x1="760" y1="130" x2="760" y2="430" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>

<text class="g" x="60" y="185">Qualification to be trusted</text>
<polyline points="240,170 480,170 620,250 900,250" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linejoin="round"/>

<text class="g" x="60" y="325">Position of being used</text>
<polyline points="240,310 760,310 900,390" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linejoin="round"/>

<line x1="480" y1="450" x2="760" y2="450" stroke="var(--dim)" stroke-width="2"/>
<line x1="480" y1="442" x2="480" y2="458" stroke="var(--dim)" stroke-width="2"/>
<line x1="760" y1="442" x2="760" y2="458" stroke="var(--dim)" stroke-width="2"/>
<text class="b" x="620" y="480" text-anchor="middle">Time gap</text>

<text class="c" x="60" y="530">The only difference is whether someone looked at the number early</text>
</svg>
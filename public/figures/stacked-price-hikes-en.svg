<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two groups of stepped bars: the left group, reset from the start of the year, reaches heights 1, 2 and 3, while the right group, stacked on raised prices, reaches 1, 2 and 4 and ends clearly higher.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
</style>
<text x="60" y="52" class="t">2× twice: reset vs stack</text>
<text x="255" y="104" class="g d" text-anchor="middle">From Jan</text>
<text x="705" y="104" class="g a" text-anchor="middle">On new price</text>
<rect x="110" y="390" width="80" height="80" fill="var(--grey)"/>
<rect x="215" y="310" width="80" height="160" fill="var(--grey)"/>
<rect x="320" y="230" width="80" height="240" fill="var(--grey)"/>
<text x="150" y="380" class="g" text-anchor="middle">1</text>
<text x="255" y="300" class="g" text-anchor="middle">2</text>
<text x="360" y="220" class="g" text-anchor="middle">3</text>
<rect x="560" y="390" width="80" height="80" fill="var(--accent)" opacity="0.45"/>
<rect x="665" y="310" width="80" height="160" fill="var(--accent)" opacity="0.7"/>
<rect x="770" y="150" width="80" height="320" fill="var(--accent)"/>
<text x="600" y="380" class="g" text-anchor="middle">1</text>
<text x="705" y="300" class="g" text-anchor="middle">2</text>
<text x="810" y="140" class="g a" text-anchor="middle">4</text>
<line x1="90" y1="470" x2="420" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="540" y1="470" x2="870" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="150" y="496" class="d" text-anchor="middle">Jan</text>
<text x="255" y="496" class="d" text-anchor="middle">H1</text>
<text x="360" y="496" class="d" text-anchor="middle">H2</text>
<text x="600" y="496" class="d" text-anchor="middle">Jan</text>
<text x="705" y="496" class="d" text-anchor="middle">H1</text>
<text x="810" y="496" class="d" text-anchor="middle">H2</text>
<text x="480" y="540" class="c" text-anchor="middle">Compounding</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Height layout of three supply-chain segments: upstream nodes sit high with upward arrows, the assembler sits low with a downward arrow.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="70" y="72">Where gross margin piles up</text>
<text class="b" x="70" y="104">Height = margin position</text>

<line x1="70" y1="420" x2="890" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="70" y="452">Upstream</text>
<text class="b" x="890" y="452" text-anchor="end">Downstream</text>

<rect x="110" y="150" width="130" height="60" rx="6" fill="var(--accent)" opacity="0.9"/>
<text class="g" x="175" y="188" text-anchor="middle" fill="var(--page)">Cooling</text>
<path d="M175 142 l0 -42 m0 -0 l-12 16 m12 -16 l12 16" stroke="var(--accent)" stroke-width="4" fill="none"/>

<rect x="280" y="168" width="130" height="60" rx="6" fill="var(--accent)" opacity="0.9"/>
<text class="g" x="345" y="206" text-anchor="middle" fill="var(--page)">CCL</text>
<path d="M345 160 l0 -42 m0 -0 l-12 16 m12 -16 l12 16" stroke="var(--accent)" stroke-width="4" fill="none"/>

<rect x="450" y="186" width="130" height="60" rx="6" fill="var(--accent)" opacity="0.9"/>
<text class="g" x="515" y="224" text-anchor="middle" fill="var(--page)">ABF</text>
<path d="M515 178 l0 -42 m0 -0 l-12 16 m12 -16 l12 16" stroke="var(--accent)" stroke-width="4" fill="none"/>

<rect x="700" y="320" width="150" height="60" rx="6" fill="var(--warn)"/>
<text class="g" x="775" y="358" text-anchor="middle" fill="var(--page)">Assembler</text>
<path d="M775 390 l0 40 m0 0 l-12 -16 m12 16 l12 -16" stroke="var(--warn)" stroke-width="4" fill="none"/>

<text class="c" x="70" y="508">Shortage is a state, pricing power is proof</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="七根柱中一根極高，平均虛線高過其餘六根柱頂">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">平均數可以由一項撐著</text>

<line x1="60" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>

<rect x="100" y="110" width="70" height="290" rx="6" fill="var(--accent)"/>
<rect x="210" y="356" width="70" height="44" rx="6" fill="var(--grey)"/>
<rect x="320" y="342" width="70" height="58" rx="6" fill="var(--grey)"/>
<rect x="430" y="364" width="70" height="36" rx="6" fill="var(--grey)"/>
<rect x="540" y="336" width="70" height="64" rx="6" fill="var(--grey)"/>
<rect x="650" y="352" width="70" height="48" rx="6" fill="var(--grey)"/>
<rect x="760" y="348" width="70" height="52" rx="6" fill="var(--grey)"/>

<line x1="60" y1="316" x2="900" y2="316" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="60" y="304" font-size="20" font-weight="700" fill="var(--warn)">平均</text>

<text x="100" y="434" font-size="19" fill="var(--ink)">撐著的那一項</text>
<text x="430" y="434" font-size="19" fill="var(--dim)">其餘每一項</text>

<text x="60" y="482" font-size="22" font-weight="700" fill="var(--ink)">看平均的人，以為自己看過了全部</text>
</svg>
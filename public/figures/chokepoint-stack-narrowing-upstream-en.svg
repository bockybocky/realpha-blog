<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A supply-chain stack narrowing downward, lit at the widest end-application layer, with the narrowest layer being power and water at the bottom.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text class="t" x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">The spotlight is on the end, the break is upstream</text>

  <polygon points="480,72 175,118 785,118" fill="var(--grey)" opacity="0.20"/>

  <rect x="160" y="120" width="640" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="480" y="159" text-anchor="middle" font-size="20" fill="var(--dim)">AI end applications</text>

  <rect x="220" y="196" width="520" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="480" y="235" text-anchor="middle" font-size="20" fill="var(--dim)">Cloud compute</text>

  <rect x="330" y="272" width="300" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="480" y="311" text-anchor="middle" font-size="20" fill="var(--dim)">Mature nodes . silicon wafers</text>

  <rect x="390" y="348" width="180" height="62" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="480" y="387" text-anchor="middle" font-size="20" font-weight="700" fill="var(--accent)">Power . water</text>

  <line x1="150" y1="151" x2="152" y2="151" stroke="var(--grey)"/>
  <text class="t" x="146" y="157" text-anchor="end" font-size="16" fill="var(--dim)">Watched</text>

  <line x1="200" y1="379" x2="382" y2="379" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="t" x="196" y="385" text-anchor="end" font-size="16" font-weight="700" fill="var(--accent)">It binds here</text>

  <line x1="878" y1="130" x2="878" y2="392" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="878,404 871,388 885,388" fill="var(--grey)"/>
  <text class="t" x="878" y="118" text-anchor="middle" font-size="16" fill="var(--dim)">End</text>
  <text class="t" x="878" y="428" text-anchor="middle" font-size="16" fill="var(--dim)">Upstream</text>

  <text class="t" x="480" y="472" text-anchor="middle" font-size="22" fill="var(--ink)">The narrower the layer, the more it decides whether the show goes on</text>
</svg>
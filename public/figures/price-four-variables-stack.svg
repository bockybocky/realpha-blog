<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一根價格柱切成四段，下方一段是已知，上方兩段標為不可知">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="76">券商 App 上那個價格，裡面有四層</text>

<rect x="140" y="120" width="200" height="90" fill="var(--warn)" opacity="0.85"/>
<rect x="140" y="210" width="200" height="90" fill="var(--warn)" opacity="0.45"/>
<rect x="140" y="300" width="200" height="80" fill="var(--grey)"/>
<rect x="140" y="380" width="200" height="90" fill="var(--accent)"/>
<rect x="140" y="120" width="200" height="350" fill="none" stroke="var(--line)" stroke-width="2"/>

<text class="g" x="372" y="172" fill="var(--warn)">誰被迫買賣</text>
<text class="b" x="372" y="196">槓桿帶來的那一層</text>
<text class="g" x="372" y="262" fill="var(--warn)">對未來的猜測</text>
<text class="g" x="372" y="348">當下的情緒</text>
<text class="g" x="372" y="432" fill="var(--accent)">今天的基本面</text>
<text class="b" x="372" y="456">財報只講得清這一層</text>

<line x1="700" y1="120" x2="700" y2="300" stroke="var(--warn)" stroke-width="4"/>
<text class="g" x="716" y="216" fill="var(--warn)">不可知</text>

<text class="c" x="60" y="528">跌九個點不等於你漏看了財報細節</text>
</svg>
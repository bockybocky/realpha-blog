<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A horizontal bar cut into three segments, where the first segment is far larger than the other two, and those two are equal in width.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Signed obligations, in three piles</text>

<rect x="60" y="180" width="520" height="110" rx="10" fill="var(--accent)"/>
<text class="t" x="320" y="232" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">Upstream buys</text>
<text class="t" x="320" y="262" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">$390B</text>

<rect x="588" y="180" width="134" height="110" rx="10" fill="var(--grey)"/>
<text class="t" x="655" y="232" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Cloud leases</text>
<text class="t" x="655" y="262" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">$100B</text>

<rect x="730" y="180" width="134" height="110" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="797" y="232" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Credit backstops</text>
<text class="t" x="797" y="262" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="middle">$100B</text>

<text class="t" x="60" y="156" font-size="16" fill="var(--dim)">Memory · wafers · components</text>
<text class="t" x="588" y="156" font-size="16" fill="var(--dim)">Buying compute</text>
<text class="t" x="730" y="156" font-size="16" fill="var(--dim)">Vouching for customers</text>

<line x1="60" y1="340" x2="864" y2="340" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="382" font-size="19" font-weight="700" fill="var(--ink)">Already in the contracts</text>
<text class="t" x="60" y="408" font-size="16" fill="var(--dim)">A new CEO can't void them</text>
<text class="t" x="588" y="382" font-size="19" font-weight="700" fill="var(--warn)">Deals not yet signed</text>
<text class="t" x="588" y="408" font-size="16" fill="var(--dim)">are the variable</text>
</svg>
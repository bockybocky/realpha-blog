<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two adjacent bars differ in height by about 10% and are enclosed by a bracket, while a third bar is held outside it behind a dashed line.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--dim); }
    .v { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="h" x="480" y="52" text-anchor="middle">Which two stages the report compares</text>
<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<path d="M180 150 L180 128 L440 128 L440 150" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="310" y="112" text-anchor="middle">The report compares these two</text>
<rect x="180" y="180" width="110" height="260" fill="var(--grey)"/>
<rect x="330" y="154" width="110" height="286" fill="var(--accent)"/>
<line x1="180" y1="180" x2="440" y2="180" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="v" x="452" y="172" fill="var(--warn)">About 10% higher</text>
<text class="g" x="235" y="470" text-anchor="middle">Chip</text>
<text class="s" x="235" y="494" text-anchor="middle">Upstream supply</text>
<text class="g" x="385" y="470" text-anchor="middle">Fabs · power · cells</text>
<text class="s" x="385" y="494" text-anchor="middle">Downstream supply</text>
<line x1="580" y1="100" x2="580" y2="500" stroke="var(--line)" stroke-width="1" stroke-dasharray="5 7"/>
<rect x="700" y="200" width="110" height="240" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="755" y="470" text-anchor="middle">Token demand</text>
<text class="s" x="755" y="494" text-anchor="middle">Customer side, outside bracket</text>
<text class="c" x="480" y="528" text-anchor="middle">A mismatch, not demand vanishing</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊被動式標籤藏在鋼架後，讀取器的訊號波在鋼架前停住；右邊主動式標籤自己發訊號，波穿過鋼架到讀取器">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<text x="48" y="58" class="t">鋼架擋住訊號</text>
<rect x="30" y="90" width="440" height="400" rx="14" fill="var(--card)"/>
<rect x="490" y="90" width="440" height="400" rx="14" fill="var(--card)"/>
<text x="250" y="130" class="g" text-anchor="middle">被動式</text>
<text x="710" y="130" class="g" text-anchor="middle">主動式</text>
<rect x="70" y="265" width="50" height="60" rx="6" fill="var(--dim)"/>
<text x="95" y="350" class="d" text-anchor="middle">讀取器</text>
<path d="M172 265 A60 60 0 0 1 172 325" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M207 245 A100 100 0 0 1 207 345" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M241 225 A140 140 0 0 1 241 365" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="280" y="162" class="d" text-anchor="middle">鋼架</text>
<rect x="262" y="170" width="36" height="250" fill="var(--grey)"/>
<line x1="262" y1="220" x2="298" y2="220" stroke="var(--card)" stroke-width="3"/>
<line x1="262" y1="270" x2="298" y2="270" stroke="var(--card)" stroke-width="3"/>
<line x1="262" y1="320" x2="298" y2="320" stroke="var(--card)" stroke-width="3"/>
<line x1="262" y1="370" x2="298" y2="370" stroke="var(--card)" stroke-width="3"/>
<rect x="360" y="280" width="40" height="30" rx="4" fill="none" stroke="var(--warn)" stroke-width="2"/>
<line x1="370" y1="244" x2="390" y2="264" stroke="var(--warn)" stroke-width="3"/>
<line x1="390" y1="244" x2="370" y2="264" stroke="var(--warn)" stroke-width="3"/>
<text x="380" y="335" class="d" text-anchor="middle">標籤</text>
<text x="250" y="462" class="g w" text-anchor="middle">讀不到</text>
<rect x="530" y="265" width="50" height="60" rx="6" fill="var(--dim)"/>
<text x="555" y="350" class="d" text-anchor="middle">讀取器</text>
<text x="740" y="162" class="d" text-anchor="middle">鋼架</text>
<rect x="722" y="170" width="36" height="250" fill="var(--grey)"/>
<line x1="722" y1="220" x2="758" y2="220" stroke="var(--card)" stroke-width="3"/>
<line x1="722" y1="270" x2="758" y2="270" stroke="var(--card)" stroke-width="3"/>
<line x1="722" y1="320" x2="758" y2="320" stroke="var(--card)" stroke-width="3"/>
<line x1="722" y1="370" x2="758" y2="370" stroke="var(--card)" stroke-width="3"/>
<path d="M779 260 A70 70 0 0 0 779 330" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M719 225 A140 140 0 0 0 719 365" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M658 190 A210 210 0 0 0 658 400" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M598 155 A280 280 0 0 0 598 435" fill="none" stroke="var(--accent)" stroke-width="3"/>
<rect x="820" y="280" width="40" height="30" rx="4" fill="var(--accent)"/>
<text x="840" y="335" class="d" text-anchor="middle">標籤＋電池</text>
<text x="710" y="462" class="g a" text-anchor="middle">讀得到</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two cross-sections side by side, the left one a thick outer hull enclosing dry cells with the sea pressure held off by the hull, the right one with no hull at all, the gaps between cells filled with resin and the pressure bearing directly on the whole block.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">Who carries the sea pressure</text>

  <text x="100" y="140" font-size="20" font-weight="700" fill="var(--ink)">Pressure hull</text>
  <rect x="100" y="168" width="320" height="190" rx="12" fill="none" stroke="var(--ink)" stroke-width="14"/>
  <rect x="150" y="212" width="60" height="46" rx="4" fill="var(--accent)"/>
  <rect x="230" y="212" width="60" height="46" rx="4" fill="var(--accent)"/>
  <rect x="310" y="212" width="60" height="46" rx="4" fill="var(--accent)"/>
  <rect x="150" y="272" width="60" height="46" rx="4" fill="var(--accent)"/>
  <rect x="230" y="272" width="60" height="46" rx="4" fill="var(--accent)"/>
  <rect x="310" y="272" width="60" height="46" rx="4" fill="var(--accent)"/>
  <line x1="60" y1="263" x2="88" y2="263" stroke="var(--warn)" stroke-width="5"/>
  <polygon points="96,263 80,253 80,273" fill="var(--warn)"/>
  <line x1="460" y1="263" x2="432" y2="263" stroke="var(--warn)" stroke-width="5"/>
  <polygon points="424,263 440,253 440,273" fill="var(--warn)"/>
  <text x="100" y="396" font-size="16" fill="var(--dim)">Hull keeps water out · cells stay dry</text>

  <text x="540" y="140" font-size="20" font-weight="700" fill="var(--ink)">Epoxy potting</text>
  <rect x="540" y="168" width="320" height="190" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="580" y="212" width="60" height="46" rx="4" fill="var(--accent)"/>
  <rect x="660" y="212" width="60" height="46" rx="4" fill="var(--accent)"/>
  <rect x="740" y="212" width="60" height="46" rx="4" fill="var(--accent)"/>
  <rect x="580" y="272" width="60" height="46" rx="4" fill="var(--accent)"/>
  <rect x="660" y="272" width="60" height="46" rx="4" fill="var(--accent)"/>
  <rect x="740" y="272" width="60" height="46" rx="4" fill="var(--accent)"/>
  <line x1="500" y1="263" x2="532" y2="263" stroke="var(--warn)" stroke-width="5"/>
  <polygon points="540,263 524,253 524,273" fill="var(--warn)"/>
  <line x1="900" y1="263" x2="868" y2="263" stroke="var(--warn)" stroke-width="5"/>
  <polygon points="860,263 876,253 876,273" fill="var(--warn)"/>
  <text x="540" y="396" font-size="16" fill="var(--dim)">No hull · pack takes pressure</text>

  <text x="60" y="466" font-size="22" font-weight="700" fill="var(--ink)">Both roads need costly gear and testing</text>
</svg>
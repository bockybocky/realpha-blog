<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="無解題分出兩條路：直走撞牆，繞路經過犯罪、藏證據、找幫手後抵達考官畫面上的通過勾勾">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs><marker id="f1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>
<text x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">考題解不了，它選了另一條路</text>
<circle cx="130" cy="290" r="48" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
<text x="130" y="297" font-size="19" text-anchor="middle" fill="var(--ink)">無解題</text>
<line x1="178" y1="290" x2="484" y2="290" stroke="var(--dim)" stroke-width="3" stroke-dasharray="8 6"/>
<text x="330" y="274" font-size="16" text-anchor="middle" fill="var(--dim)">老實解</text>
<rect x="488" y="226" width="16" height="128" rx="3" fill="var(--warn)"/>
<text x="496" y="212" font-size="16" font-weight="700" text-anchor="middle" fill="var(--warn)">做不到</text>
<rect x="720" y="236" width="200" height="108" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="820" y="274" font-size="16" text-anchor="middle" fill="var(--dim)">考官看到</text>
<text x="820" y="320" font-size="26" font-weight="700" text-anchor="middle" fill="var(--accent)">通過 ✓</text>
<path d="M170,312 C260,460 700,480 772,352" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#f1-arrow)"/>
<text x="516" y="410" font-size="18" font-weight="700" text-anchor="middle" fill="var(--accent)">騙過考官</text>
<rect x="286" y="426" width="80" height="30" rx="15" fill="var(--card)" stroke="var(--line)"/>
<text x="326" y="446" font-size="15" text-anchor="middle" fill="var(--dim)">犯罪</text>
<rect x="472" y="450" width="90" height="30" rx="15" fill="var(--card)" stroke="var(--line)"/>
<text x="517" y="470" font-size="15" text-anchor="middle" fill="var(--dim)">藏證據</text>
<rect x="646" y="428" width="90" height="30" rx="15" fill="var(--card)" stroke="var(--line)"/>
<text x="691" y="448" font-size="15" text-anchor="middle" fill="var(--dim)">找幫手</text>
<text x="480" y="534" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">只看結果，繞路和真解分不出來</text>
</svg>
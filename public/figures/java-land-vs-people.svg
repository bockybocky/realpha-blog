<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條很短的橫條對比一條很長的橫條，土地比重遠小於人口比重；下方兩根幾乎同高的柱子代表稻田面積長不動">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">爪哇：9% 的土地，三分之二的人口</text>
<text x="60" y="150" font-size="19" fill="var(--dim)">印尼國土中，爪哇佔</text>
<rect x="60" y="165" width="840" height="44" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="165" width="76" height="44" fill="var(--accent)"/>
<text x="152" y="195" font-size="20" fill="var(--ink)">9%</text>
<text x="60" y="258" font-size="19" fill="var(--dim)">全國人口，住在爪哇</text>
<rect x="60" y="273" width="840" height="44" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="273" width="546" height="44" fill="var(--accent)"/>
<text x="622" y="303" font-size="20" fill="var(--ink)">近三分之二</text>
<text x="60" y="382" font-size="19" fill="var(--dim)">有灌溉稻田（萬公頃）</text>
<line x1="60" y1="480" x2="420" y2="480" stroke="var(--line)" stroke-width="2"/>
<rect x="90" y="364" width="70" height="116" fill="var(--accent)"/>
<text x="90" y="352" font-size="16" fill="var(--ink)">290</text>
<text x="90" y="502" font-size="16" fill="var(--dim)">1905</text>
<rect x="200" y="348" width="70" height="132" fill="var(--accent)"/>
<text x="200" y="336" font-size="16" fill="var(--ink)">330</text>
<text x="200" y="502" font-size="16" fill="var(--dim)">1930</text>
<text x="470" y="420" font-size="22" fill="var(--ink)">四分之一世紀 ＋14%</text>
<text x="470" y="455" font-size="16" fill="var(--dim)">能開的地，開完了</text>
</svg>
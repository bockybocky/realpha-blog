<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three report blocks above and three reality blocks below, with a cross on each connecting line." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

<text x="60" y="54" font-size="27" fill="var(--ink)">The report says done; only the floor knows</text>

<text x="60" y="176" font-size="19" fill="var(--dim)">Reported</text>
<text x="60" y="376" font-size="19" fill="var(--dim)">Reality</text>

<rect x="140" y="130" width="230" height="80" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="255" y="178" font-size="17" fill="var(--ink)" text-anchor="middle">Script finished</text>
<rect x="400" y="130" width="230" height="80" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="515" y="178" font-size="17" fill="var(--ink)" text-anchor="middle">232 lines</text>
<rect x="660" y="130" width="230" height="80" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="775" y="178" font-size="17" fill="var(--ink)" text-anchor="middle">Security scan passed</text>

<rect x="140" y="330" width="230" height="80" rx="12" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="255" y="378" font-size="17" fill="var(--warn)" text-anchor="middle">File does not exist</text>
<rect x="400" y="330" width="230" height="80" rx="12" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="515" y="378" font-size="17" fill="var(--warn)" text-anchor="middle">0 lines</text>
<rect x="660" y="330" width="230" height="80" rx="12" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="775" y="378" font-size="17" fill="var(--warn)" text-anchor="middle">Scanned an empty folder</text>

<path d="M255,210 V252" fill="none" stroke="var(--grey)" stroke-width="2"/>
<path d="M255,288 V330" fill="none" stroke="var(--grey)" stroke-width="2"/>
<path d="M243,258 L267,282 M267,258 L243,282" stroke="var(--warn)" stroke-width="3" fill="none"/>

<path d="M515,210 V252" fill="none" stroke="var(--grey)" stroke-width="2"/>
<path d="M515,288 V330" fill="none" stroke="var(--grey)" stroke-width="2"/>
<path d="M503,258 L527,282 M527,258 L503,282" stroke="var(--warn)" stroke-width="3" fill="none"/>

<path d="M775,210 V252" fill="none" stroke="var(--grey)" stroke-width="2"/>
<path d="M775,288 V330" fill="none" stroke="var(--grey)" stroke-width="2"/>
<path d="M763,258 L787,282 M787,258 L763,282" stroke="var(--warn)" stroke-width="3" fill="none"/>

<text x="480" y="490" font-size="22" fill="var(--ink)" text-anchor="middle">A report is a clue; the floor is the evidence</text>
</svg>
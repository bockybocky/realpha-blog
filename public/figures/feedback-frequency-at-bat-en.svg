<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Dot counts on three timelines: one dot for the monthly, four for the weekly, and a dense row for the web.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; fill:var(--ink); font-weight:700; }
    .g  { font-size:19px; fill:var(--dim); font-weight:700; }
    .b  { font-size:16px; fill:var(--ink); }
    .c  { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="40" y="54">Same span, how many at-bats</text>
  <text class="g" x="40" y="94">One month</text>

  <line x1="230" y1="170" x2="900" y2="170" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="210" y="176" text-anchor="end">Monthly</text>
  <circle cx="250" cy="170" r="9" fill="var(--grey)"/>

  <line x1="230" y1="270" x2="900" y2="270" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="210" y="276" text-anchor="end">Weekly</text>
  <circle cx="250" cy="270" r="9" fill="var(--grey)"/>
  <circle cx="410" cy="270" r="9" fill="var(--grey)"/>
  <circle cx="570" cy="270" r="9" fill="var(--grey)"/>
  <circle cx="730" cy="270" r="9" fill="var(--grey)"/>

  <line x1="230" y1="370" x2="900" y2="370" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="210" y="376" text-anchor="end">Web</text>
  <circle cx="250" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="272" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="294" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="316" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="338" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="360" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="382" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="404" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="426" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="448" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="470" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="492" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="514" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="536" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="558" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="580" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="602" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="624" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="646" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="668" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="690" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="712" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="734" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="756" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="778" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="800" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="822" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="844" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="866" cy="370" r="9" fill="var(--accent)"/>
  <circle cx="888" cy="370" r="9" fill="var(--accent)"/>
  <text class="c" x="40" y="462">He wanted the dot density, not the prestige</text>
</svg>
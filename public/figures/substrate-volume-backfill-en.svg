<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Only three of the eighteen squares are shaded, showing that the purchased substrates far exceed the needs of the company’s own modules.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="56" y="66">More sheets bought than needed</text>
<text class="b" x="56" y="100">One square = 10,000 sheets; five-year contract totals 180,000 sheets</text>
<rect x="56" y="124" width="640" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="92" y="164" width="88" height="88" fill="var(--accent)"/>
<rect x="196" y="164" width="88" height="88" fill="var(--accent)"/>
<rect x="300" y="164" width="88" height="88" fill="var(--accent)"/>
<rect x="404" y="164" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="508" y="164" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="92" y="268" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="196" y="268" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="300" y="268" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="404" y="268" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="508" y="268" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text class="g" x="92" y="148" fill="var(--accent)">Own modules (illustrative)</text>
<text class="g" x="404" y="148" fill="var(--grey)">Remaining</text>
<text class="g" x="724" y="214">Its laser capacity</text>
<text class="g" x="724" y="248">Larger than disclosed</text>
<text class="b" x="724" y="292">Inference, not disclosure</text>
<text class="c" x="56" y="490">Procurement volume speaks first; definitions speak later</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上半是一個窄窗口後面封死，下半是一條可以反覆回頭的長帶">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">一邊只有一次，一邊隨時能回去</text>

<text x="60" y="118" font-size="20" font-weight="700" fill="var(--warn)">衛星</text>
<rect x="60" y="140" width="840" height="84" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="246" y="140" width="44" height="84" fill="var(--warn)"/>
<text x="252" y="190" font-size="16" font-weight="700" fill="var(--page)">窗口</text>
<text x="320" y="190" font-size="16" fill="var(--dim)">過了就過了</text>
<line x1="306" y1="148" x2="306" y2="216" stroke="var(--grey)" stroke-width="3"/>
<line x1="322" y1="148" x2="322" y2="216" stroke="var(--grey)" stroke-width="3"/>

<text x="60" y="300" font-size="20" font-weight="700" fill="var(--accent)">地面</text>
<rect x="60" y="322" width="840" height="84" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<path d="M330 352 C300 322 250 322 222 352" fill="none" stroke="var(--accent)" stroke-width="3"/>
<polygon points="222,352 240,340 240,364" fill="var(--accent)"/>
<path d="M560 352 C530 322 480 322 452 352" fill="none" stroke="var(--accent)" stroke-width="3"/>
<polygon points="452,352 470,340 470,364" fill="var(--accent)"/>
<path d="M800 352 C770 322 720 322 692 352" fill="none" stroke="var(--accent)" stroke-width="3"/>
<polygon points="692,352 710,340 710,364" fill="var(--accent)"/>
<text x="400" y="392" font-size="16" fill="var(--dim)">隨時回來改</text>

<text x="60" y="470" font-size="22" font-weight="700" fill="var(--ink)">所以錢先去趕那個窗口，地面排在後面。</text>
</svg>
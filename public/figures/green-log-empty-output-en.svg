<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The log column is ticked all the way down while the output column holds six empty boxes, two rulers disagreeing about the same run.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">One run, two rulers</text>

  <rect x="60" y="100" width="400" height="308" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="90" y="142" font-size="20" fill="var(--dim)">Log</text>
  <g stroke="var(--accent)" stroke-width="3" fill="none">
    <path d="M 100 186 l 12 12 l 22 -26"/>
    <path d="M 100 232 l 12 12 l 22 -26"/>
    <path d="M 100 278 l 12 12 l 22 -26"/>
    <path d="M 100 324 l 12 12 l 22 -26"/>
  </g>
  <g fill="var(--ink)" font-size="16">
    <text x="152" y="196">Fetch</text>
    <text x="152" y="242">Translate</text>
    <text x="152" y="288">Figures</text>
    <text x="152" y="334">Publish</text>
  </g>
  <text x="300" y="380" font-size="19" fill="var(--accent)">All green</text>

  <rect x="500" y="100" width="400" height="308" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="530" y="142" font-size="20" fill="var(--dim)">Output</text>
  <g stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <rect x="530" y="170" width="106" height="70" rx="6"/>
    <rect x="652" y="170" width="106" height="70" rx="6"/>
    <rect x="774" y="170" width="106" height="70" rx="6"/>
    <rect x="530" y="256" width="106" height="70" rx="6"/>
    <rect x="652" y="256" width="106" height="70" rx="6"/>
    <rect x="774" y="256" width="106" height="70" rx="6"/>
  </g>
  <text x="530" y="380" font-size="19" fill="var(--warn)">6 due　0 got</text>

  <text x="60" y="470" font-size="22" fill="var(--ink)">Check the output, not the log.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two short bars from the same starting point inside a long frame for the whole market, the upper slightly longer than the lower">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">A slice of the investment grade market</text>
<text x="80" y="132" font-size="16" fill="var(--dim)">Frame = the whole IG market</text>
<rect x="80" y="160" width="800" height="72" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="80" y="160" width="132" height="72" fill="var(--accent)"/>
<text x="228" y="204" font-size="19" fill="var(--ink)">Data center related　15–18%</text>
<rect x="80" y="272" width="800" height="72" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="80" y="272" width="104" height="72" fill="var(--grey)"/>
<text x="200" y="316" font-size="19" fill="var(--dim)">Financial services</text>
<text x="480" y="444" font-size="22" fill="var(--ink)" text-anchor="middle">Drop the idea that tech companies carry no debt</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A three-layer funnel narrows from wide to thin: the top layer of five thousand is screened by Jev, the middle two hundred are read closely by a large model, and the bottom is one small slot.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="40" y="58" font-size="27" font-weight="700">Screen first, then read closely</text>
<path d="M120,100 L840,100 L630,250 L330,250 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="148" font-size="20" font-weight="700" text-anchor="middle">5,000 résumés</text>
<text x="480" y="226" font-size="19" font-weight="700" text-anchor="middle" style="fill:var(--accent)">Jev screens</text>
<text x="700" y="232" font-size="16" style="fill:var(--dim)">Fast, cheap</text>
<path d="M330,266 L630,266 L545,386 L415,386 Z" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="480" y="306" font-size="20" font-weight="700" text-anchor="middle">200</text>
<text x="480" y="360" font-size="16" text-anchor="middle">Big model reads</text>
<text x="604" y="352" font-size="16" style="fill:var(--dim)">Slow, pricey</text>
<rect x="440" y="402" width="80" height="44" rx="8" fill="var(--accent)"/>
<text x="480" y="430" font-size="16" font-weight="700" text-anchor="middle" style="fill:var(--page)">Interview</text>
<text x="480" y="520" font-size="22" font-weight="700" text-anchor="middle">Users just feel faster and cheaper</text>
</svg>
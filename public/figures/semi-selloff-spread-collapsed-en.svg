<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two panels compared: on the left the bars point both up and down in scattered directions; on the right every bar points down and reaches deeper.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">Normally mixed; that day everything fell</text>
<rect x="70" y="90" width="390" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="90" width="390" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="265" y="128" text-anchor="middle" font-size="19" fill="var(--dim)">Normal</text>
<text x="695" y="128" text-anchor="middle" font-size="19" fill="var(--dim)">Nov 5</text>
<line x1="90" y1="270" x2="440" y2="270" stroke="var(--line)" stroke-width="2"/>
<line x1="520" y1="270" x2="870" y2="270" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="200" width="26" height="70" fill="var(--accent)"/>
<rect x="152" y="270" width="26" height="40" fill="var(--grey)"/>
<rect x="194" y="240" width="26" height="30" fill="var(--accent)"/>
<rect x="236" y="185" width="26" height="85" fill="var(--accent)"/>
<rect x="278" y="270" width="26" height="25" fill="var(--grey)"/>
<rect x="320" y="220" width="26" height="50" fill="var(--accent)"/>
<rect x="362" y="270" width="26" height="60" fill="var(--grey)"/>
<rect x="404" y="235" width="26" height="35" fill="var(--accent)"/>
<rect x="540" y="270" width="26" height="120" fill="var(--warn)"/>
<rect x="582" y="270" width="26" height="145" fill="var(--warn)"/>
<rect x="624" y="270" width="26" height="105" fill="var(--warn)"/>
<rect x="666" y="270" width="26" height="160" fill="var(--warn)"/>
<rect x="708" y="270" width="26" height="130" fill="var(--warn)"/>
<rect x="750" y="270" width="26" height="150" fill="var(--warn)"/>
<rect x="792" y="270" width="26" height="110" fill="var(--warn)"/>
<rect x="834" y="270" width="26" height="140" fill="var(--warn)"/>
<text x="265" y="442" text-anchor="middle" font-size="16" fill="var(--dim)">Good prints up, bad ones down</text>
<text x="695" y="442" text-anchor="middle" font-size="16" fill="var(--dim)">Good and bad fell together, double digits everywhere</text>
<text x="480" y="505" text-anchor="middle" font-size="22" fill="var(--ink)">Dispersion gone, only one direction left</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左欄三個光源路線分別連線到右欄的材料，虛線轉向箭頭讓其中一種材料的缺料標記變淡">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--dim); }
.n { font-size:16px; fill:var(--dim); }
.k { font-size:20px; font-weight:600; fill:var(--ink); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" class="t">光源選哪條，決定哪種材料缺</text>
<text x="150" y="150" class="g">光源路線</text>
<text x="620" y="150" class="g">吃的材料</text>
<rect x="140" y="180" width="220" height="64" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text x="250" y="220" class="k" text-anchor="middle">DFB</text>
<text x="250" y="264" class="n" text-anchor="middle">目前主流</text>
<rect x="140" y="300" width="220" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="250" y="340" class="k" text-anchor="middle">VCSEL</text>
<rect x="140" y="420" width="220" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="250" y="460" class="k" text-anchor="middle">micro LED</text>
<rect x="610" y="180" width="220" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="720" y="220" class="k" text-anchor="middle">磷化銦</text>
<rect x="610" y="300" width="220" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="720" y="340" class="k" text-anchor="middle">砷化鎵</text>
<rect x="610" y="420" width="220" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="720" y="460" class="k" text-anchor="middle" fill="var(--dim)">成本未明</text>
<path d="M360 212 H610" stroke="var(--accent)" stroke-width="2.5" fill="none"/>
<path d="M360 332 H610" stroke="var(--dim)" stroke-width="2" fill="none"/>
<path d="M360 452 H610" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
<path d="M250 250 V294" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="7 5" fill="none"/>
<path d="M250 294 l-7 -12 h14 z" fill="var(--warn)" transform="translate(0,12)"/>
<text x="268" y="284" class="n" fill="var(--warn)">轉向</text>
<text x="850" y="220" class="n" fill="var(--warn)">缺料鬆開</text>
<text x="60" y="530" class="c">同一個缺料故事，會因為上游換路線而失效</text>
</svg>
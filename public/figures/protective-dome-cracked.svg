<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊完整罩子把問題壓在底下，右邊罩子破了一個缺口，問題往外跑出去">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t27{font-size:27px;font-weight:700;fill:var(--ink)}
.t20{font-size:20px;font-weight:700;fill:var(--dim)}
.t15{font-size:15px;fill:var(--dim)}
.t22{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t27" x="48" y="46">大家都知道的事，靠一層罩子壓著</text>

<text class="t20" x="100" y="108">之前</text>
<path d="M100,400 A150,150 0 0 1 400,400" fill="var(--card)" stroke="var(--grey)" stroke-width="4"/>
<line x1="90" y1="400" x2="410" y2="400" stroke="var(--line)" stroke-width="3"/>
<circle cx="170" cy="368" r="12" fill="var(--grey)"/>
<circle cx="218" cy="340" r="12" fill="var(--grey)"/>
<circle cx="268" cy="356" r="12" fill="var(--grey)"/>
<circle cx="318" cy="374" r="12" fill="var(--grey)"/>
<text class="t15" x="250" y="432" text-anchor="middle">沒人處理的問題</text>
<text class="t15" x="250" y="250" text-anchor="middle">碰不得</text>

<text class="t20" x="560" y="108">罩子破過一次</text>
<path d="M560,400 A150,150 0 0 1 676,266" fill="none" stroke="var(--warn)" stroke-width="4"/>
<path d="M744,266 A150,150 0 0 1 860,400" fill="none" stroke="var(--warn)" stroke-width="4"/>
<line x1="550" y1="400" x2="870" y2="400" stroke="var(--line)" stroke-width="3"/>
<circle cx="640" cy="372" r="12" fill="var(--grey)"/>
<circle cx="690" cy="330" r="12" fill="var(--accent)"/>
<circle cx="706" cy="268" r="12" fill="var(--accent)"/>
<line x1="712" y1="252" x2="716" y2="178" stroke="var(--accent)" stroke-width="3"/>
<polygon points="716,164 708,182 724,182" fill="var(--accent)"/>
<text class="t15" x="740" y="200">自己往前走</text>
<text class="t15" x="620" y="432">缺口不會自己長回來</text>

<text class="t22" x="48" y="492">罩子破了，被擋住的東西自己往前走</text>
</svg>
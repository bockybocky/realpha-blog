<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一個下跌之後，一條線回到原位，另一條線變成長度不明的虛線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="70" font-size="27" fill="var(--ink)">被打壞的是這一組現金流，還是產生它的機制</text>
<line x1="80" y1="200" x2="900" y2="200" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 6"/>
<text x="80" y="185" font-size="16" fill="var(--dim)">原來的水準</text>
<polyline points="80,200 240,200 300,330 360,290 480,235 620,205 760,200 900,200" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="80,420 240,420 300,500 420,500" fill="none" stroke="var(--warn)" stroke-width="4"/>
<polyline points="420,500 900,500" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 12"/>
<text x="640" y="470" font-size="19" fill="var(--warn)">要等新的人做對一次</text>
<text x="640" y="534" font-size="16" fill="var(--dim)">這段多長，不知道</text>
<text x="640" y="170" font-size="19" fill="var(--accent)">時間會修回來</text>
<text x="300" y="358" font-size="16" fill="var(--dim)">這一組現金流被打壞</text>
<text x="300" y="455" font-size="16" fill="var(--dim)">機制裡的那個人被換掉</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="發球進球率三根柱子從四成升到九成多">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">同一個人、同一套技術，三個場合</text>

  <line x1="120" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="3"/>

  <rect x="170" y="300" width="130" height="120" fill="var(--grey)"/>
  <text class="t" x="235" y="285" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">4 成</text>
  <text class="t" x="235" y="452" font-size="19" text-anchor="middle" fill="var(--dim)">跟教練練</text>

  <rect x="415" y="195" width="130" height="225" fill="var(--grey)"/>
  <text class="t" x="480" y="180" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">7 到 8 成</text>
  <text class="t" x="480" y="452" font-size="19" text-anchor="middle" fill="var(--dim)">跟朋友單挑</text>

  <rect x="660" y="145" width="130" height="275" fill="var(--accent)"/>
  <text class="t" x="725" y="130" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">9 成多</text>
  <text class="t" x="725" y="452" font-size="19" text-anchor="middle" fill="var(--ink)">正式比賽</text>
  <text class="t" x="725" y="478" font-size="16" text-anchor="middle" fill="var(--accent)">有人看、有輸贏</text>

  <text class="t" x="60" y="518" font-size="22" font-weight="700" fill="var(--ink)">練習的成績不是你的成績</text>
</svg>
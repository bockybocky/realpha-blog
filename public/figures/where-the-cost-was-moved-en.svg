<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A distribution with a fat right tail on the left and the same curve with the tail cut into a smooth bell on the right, the removed part outlined in dashes">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.f11-b{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.f11-t{font-size:27px;font-weight:700}
.f11-g{font-size:19px;font-weight:700}
.f11-s{font-size:15px}
.f11-c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="f11-b f11-t" x="60" y="66">When something has it both ways, which box did the cost move to</text>
<text class="f11-b f11-g" x="255" y="140" text-anchor="middle">The original distribution</text>
<text class="f11-b f11-g" x="715" y="140" text-anchor="middle">The adjusted distribution</text>
<line x1="80" y1="380" x2="430" y2="380" stroke="var(--line)" stroke-width="2"/>
<line x1="530" y1="380" x2="900" y2="380" stroke="var(--line)" stroke-width="2"/>
<path d="M80,378 C160,376 195,196 270,196 C325,196 345,262 385,286 C412,304 424,312 430,316" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M530,378 C605,376 645,196 720,196 C795,196 826,374 900,378" fill="none" stroke="var(--dim)" stroke-width="3"/>
<path d="M720,196 C772,262 815,308 900,320" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>
<text class="f11-b f11-s" x="900" y="300" text-anchor="end" fill="var(--grey)">The clipped right tail</text>
<line x1="452" y1="288" x2="504" y2="288" stroke="var(--ink)" stroke-width="3"/>
<polygon points="516,288 498,279 498,297" fill="var(--ink)"/>
<text class="f11-b f11-s" x="480" y="452" text-anchor="middle" fill="var(--dim)">Liquidity　・　Tail　・　Time</text>
<text class="f11-b f11-c" x="480" y="500" text-anchor="middle">Costs rarely vanish; they get moved</text>
</svg>
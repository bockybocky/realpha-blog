<text class="g" x="76" y="358" fill="var(--page)">前 5 大</text>
<text class="g" x="402" y="358">=</text>
<g fill="var(--grey)">
<rect x="440" y="320" width="12" height="56"/><rect x="458" y="320" width="12" height="56"/><rect x="476" y="320" width="12" height="56"/><rect x="494" y="320" width="12" height="56"/><rect x="512" y="320" width="12" height="56"/><rect x="530" y="320" width="12" height="56"/><rect x="548" y="320" width="12" height="56"/><rect x="566" y="320" width="12" height="56"/><rect x="584" y="320" width="12" height="56"/><rect x="602" y="320" width="12" height="56"/><rect x="620" y="320" width="12" height="56"/><rect x="638" y="320" width="12" height="56"/><rect x="656" y="320" width="12" height="56"/><rect x="674" y="320" width="12" height="56"/><rect x="692" y="320" width="12" height="56"/><rect x="710" y="320" width="12" height="56"/><rect x="728" y="320" width="12" height="56"/><rect x="746" y="320" width="12" height="56"/>
</g>
<text class="b" x="772" y="358">後 434 檔</text>
<text class="c" x="48" y="460">八年之間，後半張清單被吸進前五格</text>
</svg>
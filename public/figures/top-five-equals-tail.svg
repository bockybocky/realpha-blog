<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="前五大的重量不變，右邊同樣長度的尾巴被切成愈來愈細的格子">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="48" y="62">同樣的重量，尾巴愈切愈細</text>
<text class="g" x="48" y="132">2018</text>
<rect x="48" y="148" width="330" height="56" rx="5" fill="var(--accent)"/>
<text class="g" x="76" y="186" fill="var(--page)">前 5 大</text>
<text class="g" x="402" y="186">=</text>
<g fill="var(--grey)">
<rect x="440" y="148" width="26" height="56"/><rect x="472" y="148" width="26" height="56"/><rect x="504" y="148" width="26" height="56"/><rect x="536" y="148" width="26" height="56"/><rect x="568" y="148" width="26" height="56"/><rect x="600" y="148" width="26" height="56"/><rect x="632" y="148" width="26" height="56"/><rect x="664" y="148" width="26" height="56"/><rect x="696" y="148" width="26" height="56"/><rect x="728" y="148" width="26" height="56"/>
</g>
<text class="b" x="772" y="186">後 282 檔</text>
<text class="g" x="48" y="304">2026</text>

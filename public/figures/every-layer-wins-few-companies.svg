<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="五層各有九個圓點，每層只有一個大圓點是贏家">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { fill:var(--ink); font-size:27px; font-weight:700; }
    .g { fill:var(--dim); font-size:19px; }
    .l { fill:var(--ink); font-size:20px; font-weight:700; }
    .c { fill:var(--ink); font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="64">每一層都會有贏家</text>

  <rect x="48" y="102" width="864" height="56" rx="10" fill="var(--card)"/>
  <text class="l" x="64" y="137">雲端</text>
  <circle cx="230" cy="130" r="8" fill="var(--grey)"/>
  <circle cx="292" cy="130" r="8" fill="var(--grey)"/>
  <circle cx="354" cy="130" r="13" fill="var(--accent)"/>
  <circle cx="416" cy="130" r="8" fill="var(--grey)"/>
  <circle cx="478" cy="130" r="8" fill="var(--grey)"/>
  <circle cx="540" cy="130" r="8" fill="var(--grey)"/>
  <circle cx="602" cy="130" r="8" fill="var(--grey)"/>
  <circle cx="664" cy="130" r="8" fill="var(--grey)"/>
  <circle cx="726" cy="130" r="8" fill="var(--grey)"/>

  <rect x="48" y="180" width="864" height="56" rx="10" fill="var(--card)"/>
  <text class="l" x="64" y="215">算力</text>
  <circle cx="230" cy="208" r="8" fill="var(--grey)"/>
  <circle cx="292" cy="208" r="8" fill="var(--grey)"/>
  <circle cx="354" cy="208" r="8" fill="var(--grey)"/>
  <circle cx="416" cy="208" r="8" fill="var(--grey)"/>
  <circle cx="478" cy="208" r="8" fill="var(--grey)"/>
  <circle cx="540" cy="208" r="13" fill="var(--accent)"/>
  <circle cx="602" cy="208" r="8" fill="var(--grey)"/>
  <circle cx="664" cy="208" r="8" fill="var(--grey)"/>
  <circle cx="726" cy="208" r="8" fill="var(--grey)"/>

  <rect x="48" y="258" width="864" height="56" rx="10" fill="var(--card)"/>
  <text class="l" x="64" y="293">推論</text>
  <circle cx="230" cy="286" r="13" fill="var(--accent)"/>
  <circle cx="292" cy="286" r="8" fill="var(--grey)"/>
  <circle cx="354" cy="286" r="8" fill="var(--grey)"/>
  <circle cx="416" cy="286" r="8" fill="var(--grey)"/>
  <circle cx="478" cy="286" r="8" fill="var(--grey)"/>
  <circle cx="540" cy="286" r="8" fill="var(--grey)"/>
  <circle cx="602" cy="286" r="8" fill="var(--grey)"/>
  <circle cx="664" cy="286" r="8" fill="var(--grey)"/>
  <circle cx="726" cy="286" r="8" fill="var(--grey)"/>

  <rect x="48" y="336" width="864" height="56" rx="10" fill="var(--card)"/>
  <text class="l" x="64" y="371">晶片</text>
  <circle cx="230" cy="364" r="8" fill="var(--grey)"/>
  <circle cx="292" cy="364" r="8" fill="var(--grey)"/>
  <circle cx="354" cy="364" r="8" fill="var(--grey)"/>
  <circle cx="416" cy="364" r="8" fill="var(--grey)"/>
  <circle cx="478" cy="364" r="8" fill="var(--grey)"/>
  <circle cx="540" cy="364" r="8" fill="var(--grey)"/>
  <circle cx="602" cy="364" r="8" fill="var(--grey)"/>
  <circle cx="664" cy="364" r="13" fill="var(--accent)"/>
  <circle cx="726" cy="364" r="8" fill="var(--grey)"/>

  <rect x="48" y="414" width="864" height="56" rx="10" fill="var(--card)"/>
  <text class="l" x="64" y="449">應用</text>
  <circle cx="230" cy="442" r="8" fill="var(--grey)"/>
  <circle cx="292" cy="442" r="8" fill="var(--grey)"/>
  <circle cx="354" cy="442" r="8" fill="var(--grey)"/>
  <circle cx="416" cy="442" r="13" fill="var(--accent)"/>
  <circle cx="478" cy="442" r="8" fill="var(--grey)"/>
  <circle cx="540" cy="442" r="8" fill="var(--grey)"/>
  <circle cx="602" cy="442" r="8" fill="var(--grey)"/>
  <circle cx="664" cy="442" r="8" fill="var(--grey)"/>
  <circle cx="726" cy="442" r="8" fill="var(--grey)"/>

  <circle cx="68" cy="502" r="11" fill="var(--accent)"/>
  <text class="g" x="90" y="509">贏家</text>
  <circle cx="200" cy="502" r="7" fill="var(--grey)"/>
  <text class="g" x="220" y="509">多數不會成</text>

  <text class="c" x="60" y="556">每一層都成立，不等於每一家都成立</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="結果散布得極開的一群點，中間一條平均線離最上與最下的點都很遠">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">同一間旅館，一百種結果</text>

<rect x="60" y="92" width="840" height="340" rx="10" fill="var(--card)"/>
<line x1="110" y1="262" x2="860" y2="262" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="110" y="252" font-size="19" font-weight="700" fill="var(--accent)">平均</text>

<circle cx="160" cy="134" r="8" fill="var(--grey)"/>
<circle cx="205" cy="330" r="8" fill="var(--grey)"/>
<circle cx="250" cy="178" r="8" fill="var(--grey)"/>
<circle cx="295" cy="392" r="8" fill="var(--grey)"/>
<circle cx="340" cy="244" r="8" fill="var(--grey)"/>
<circle cx="385" cy="150" r="8" fill="var(--grey)"/>
<circle cx="430" cy="300" r="8" fill="var(--grey)"/>
<circle cx="475" cy="200" r="8" fill="var(--grey)"/>
<circle cx="520" cy="378" r="8" fill="var(--grey)"/>
<circle cx="565" cy="126" r="8" fill="var(--grey)"/>
<circle cx="610" cy="286" r="8" fill="var(--grey)"/>
<circle cx="655" cy="166" r="8" fill="var(--grey)"/>
<circle cx="700" cy="356" r="8" fill="var(--grey)"/>
<circle cx="745" cy="222" r="8" fill="var(--grey)"/>
<circle cx="790" cy="140" r="8" fill="var(--grey)"/>
<circle cx="835" cy="320" r="8" fill="var(--grey)"/>

<circle cx="565" cy="126" r="13" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="584" y="122" font-size="16" fill="var(--warn)">最好的那家</text>
<circle cx="295" cy="392" r="13" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="314" y="398" font-size="16" fill="var(--warn)">最差的那家</text>

<text class="t" x="60" y="472" font-size="16" fill="var(--dim)">二十年來，上緣與下緣沒有靠近</text>
<text class="t" x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">你買的是一個點，不是那條線</text>
</svg>
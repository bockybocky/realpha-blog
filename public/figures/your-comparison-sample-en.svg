<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Only the right tail of a bell curve is lit and boxed; the rest stays gray.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="56">Your feed samples only the right edge</text>
  <defs>
    <clipPath id="tail">
      <rect x="700" y="100" width="180" height="340"/>
    </clipPath>
  </defs>

  <path d="M120,420 C300,420 330,170 480,170 C630,170 660,420 840,420 Z" fill="var(--grey)" opacity="0.45"/>
  <path d="M120,420 C300,420 330,170 480,170 C630,170 660,420 840,420 Z" fill="var(--accent)" clip-path="url(#tail)"/>
  <path d="M120,420 C300,420 330,170 480,170 C630,170 660,420 840,420" fill="none" stroke="var(--dim)" stroke-width="3"/>
  <line x1="100" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="3"/>

  <rect x="694" y="150" width="192" height="276" rx="8" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 7"/>
  <text class="g" x="660" y="130">People who post</text>
  <text class="b" x="660" y="462">Concerts, returns, vacations</text>

  <text class="g" x="200" y="300">People who don't post</text>
  <text class="b" x="200" y="328">Those priced out, those who lost money</text>
  <text class="b" x="200" y="462">Just as real, but unseen</text>

  <text class="c" x="80" y="516">The feed is a sample, not the distribution</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two arrows drain the tall column's labor to the army and the shipyards, while the short column on the right moves the same volume.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="48" y="62">Labor drained</text>

<line x1="48" y1="430" x2="912" y2="430" stroke="var(--line)" stroke-width="3"/>

<rect x="90" y="150" width="130" height="280" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<text class="g" x="90" y="134">200,000</text>
<text class="b" x="90" y="462">Retail delivery</text>

<polyline points="226,190 400,150" fill="none" stroke="var(--warn)" stroke-width="4"/>
<polygon points="400,138 428,152 398,164" fill="var(--warn)"/>
<rect x="436" y="124" width="120" height="54" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="466" y="158">Army</text>

<polyline points="226,250 400,270" fill="none" stroke="var(--warn)" stroke-width="4"/>
<polygon points="400,258 428,272 398,284" fill="var(--warn)"/>
<rect x="436" y="244" width="120" height="54" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="466" y="278">Shipyards</text>

<rect x="700" y="352" width="130" height="78" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="700" y="336">Fewer</text>
<text class="b" x="690" y="462">Same load</text>

<text class="c" x="48" y="514">Costly labor, easy sale</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One thick line links to a single customer on the left, while many thin lines fan out to many customers on the right." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <text x="60" y="56" font-size="27" fill="var(--ink)">The shape of exposure</text>

  <rect x="60" y="100" width="400" height="330" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <rect x="180" y="140" width="160" height="56" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
  <text x="200" y="176" font-size="16" fill="var(--warn)">A single ecosystem</text>
  <line x1="260" y1="196" x2="260" y2="320" stroke="var(--warn)" stroke-width="26"/>
  <rect x="180" y="320" width="160" height="56" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="212" y="356" font-size="16" fill="var(--ink)">Supplier</text>
  <text x="90" y="412" font-size="19" fill="var(--warn)">Governance &amp; staffing risk pass straight through</text>

  <rect x="500" y="100" width="400" height="330" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <g stroke="var(--accent)" stroke-width="3">
    <line x1="700" y1="320" x2="540" y2="150"/>
    <line x1="700" y1="320" x2="600" y2="142"/>
    <line x1="700" y1="320" x2="660" y2="138"/>
    <line x1="700" y1="320" x2="720" y2="138"/>
    <line x1="700" y1="320" x2="780" y2="142"/>
    <line x1="700" y1="320" x2="850" y2="150"/>
  </g>
  <g fill="var(--grey)">
    <circle cx="540" cy="146" r="10"/><circle cx="600" cy="138" r="10"/><circle cx="660" cy="134" r="10"/>
    <circle cx="720" cy="134" r="10"/><circle cx="780" cy="138" r="10"/><circle cx="850" cy="146" r="10"/>
  </g>
  <rect x="620" y="320" width="160" height="56" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="652" y="356" font-size="16" fill="var(--ink)">Supplier</text>
  <text x="530" y="412" font-size="19" fill="var(--accent)">Only risk: industry-wide capex turn</text>
</svg>
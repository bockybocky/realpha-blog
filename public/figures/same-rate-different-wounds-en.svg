<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One horizontal line sends four downward wounds of very different lengths, the two on the left deep and the two on the right shallow.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); font-weight:700; }
  .g { font-size:20px; fill:var(--ink); font-weight:700; }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="70" y="58">One number, a different depth on each of your positions</text>
<line x1="70" y1="150" x2="890" y2="150" stroke="var(--warn)" stroke-width="5"/>
<text class="g" x="70" y="132" fill="var(--warn)">5.25%</text>
<rect x="130" y="150" width="90" height="250" fill="var(--grey)" rx="4"/>
<rect x="320" y="150" width="90" height="210" fill="var(--grey)" rx="4"/>
<rect x="520" y="150" width="90" height="100" fill="var(--accent)" rx="4"/>
<rect x="710" y="150" width="90" height="62" fill="var(--accent)" rx="4"/>
<text class="b" x="130" y="428">Long contracts</text>
<text class="b" x="320" y="388">Fixed income</text>
<text class="b" x="520" y="278">Reprices quarterly</text>
<text class="b" x="710" y="240">Still adding supply</text>
<text class="b" x="130" y="458">Slowly shaved</text>
<text class="b" x="520" y="302">Earns it back</text>
<text class="c" x="70" y="494">Ask about the line on your sheet, not the index</text>
</svg>
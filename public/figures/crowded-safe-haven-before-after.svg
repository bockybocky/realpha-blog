<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="之前之後兩格對比：資金從分散的小方塊全部集中到同一個變得又高又大的方塊，並在上面出現裂痕">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="480" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">錢都躲進同一個地方</text>

  <rect x="55" y="95" width="390" height="345" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="250" y="130" text-anchor="middle" font-size="19" fill="var(--dim)">之前</text>
  <line x1="85" y1="400" x2="415" y2="400" stroke="var(--line)" stroke-width="2"/>
  <rect x="100" y="330" width="48" height="70" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.5"/>
  <rect x="160" y="330" width="48" height="70" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.5"/>
  <rect x="220" y="330" width="48" height="70" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="172" y="422" text-anchor="middle" font-size="15" fill="var(--dim)">中小型</text>
  <rect x="305" y="260" width="100" height="140" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="2"/>
  <text x="355" y="422" text-anchor="middle" font-size="15" fill="var(--dim)">最穩的那個</text>

  <path d="M462 262 L498 262 M488 253 L498 262 L488 271" fill="none" stroke="var(--accent)" stroke-width="2.5"/>

  <rect x="515" y="95" width="390" height="345" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="710" y="130" text-anchor="middle" font-size="19" fill="var(--dim)">之後</text>
  <line x1="545" y1="400" x2="875" y2="400" stroke="var(--line)" stroke-width="2"/>
  <rect x="555" y="386" width="48" height="14" fill="none" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="615" y="386" width="48" height="14" fill="none" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="675" y="386" width="48" height="14" fill="none" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="639" y="422" text-anchor="middle" font-size="15" fill="var(--dim)">空了</text>
  <rect x="760" y="150" width="110" height="250" fill="var(--warn)" fill-opacity="0.2" stroke="var(--warn)" stroke-width="2.5"/>
  <polyline points="818,150 800,196 824,232 802,282 820,330" fill="none" stroke="var(--warn)" stroke-width="2.8"/>
  <text x="815" y="422" text-anchor="middle" font-size="15" fill="var(--warn)">全部在這</text>

  <text x="480" y="510" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">大家都躲進來，這裡就不再是避風港</text>
</svg>
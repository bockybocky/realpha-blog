<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A work bar filled in the middle with a blank at each end, each end carrying a short label.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="56">Doing 80% of the work is not losing 80% of the people</text>

  <text class="s" x="480" y="176" text-anchor="middle">The 60-80% a model can take</text>
  <line x1="230" y1="192" x2="730" y2="192" stroke="var(--line)" stroke-width="2"/>
  <line x1="230" y1="192" x2="230" y2="214" stroke="var(--line)" stroke-width="2"/>
  <line x1="730" y1="192" x2="730" y2="214" stroke="var(--line)" stroke-width="2"/>

  <rect x="90" y="220" width="140" height="100" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
  <rect x="230" y="220" width="500" height="100" fill="var(--accent)"/>
  <rect x="730" y="220" width="140" height="100" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>

  <text class="g" x="160" y="276" text-anchor="middle">Define the goal</text>
  <text class="g" x="480" y="276" text-anchor="middle" fill="var(--page)">Execute</text>
  <text class="g" x="800" y="268" text-anchor="middle">Check</text>
  <text class="g" x="800" y="292" text-anchor="middle">Does it fit</text>

  <text class="s" x="160" y="358" text-anchor="middle">Left to people</text>
  <text class="s" x="800" y="358" text-anchor="middle">Left to people</text>

  <text class="c" x="60" y="450">What is taken is the middle; what stays is both ends</text>
</svg>
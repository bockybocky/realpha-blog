<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A box closed on all four sides with storefronts wired to a central node, the exit crossed out, and the UK outside pushed back by an arrow.">
<style>svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Check out, no exit</text>
<rect x="100" y="110" width="700" height="370" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<line x1="240" y1="196" x2="450" y2="286" stroke="var(--accent)" stroke-width="2"/>
<line x1="680" y1="196" x2="510" y2="286" stroke="var(--accent)" stroke-width="2"/>
<line x1="240" y1="400" x2="450" y2="312" stroke="var(--accent)" stroke-width="2"/>
<line x1="680" y1="400" x2="510" y2="312" stroke="var(--accent)" stroke-width="2"/>
<line x1="240" y1="196" x2="680" y2="196" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 6"/>
<line x1="240" y1="400" x2="680" y2="400" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 6"/>
<circle cx="480" cy="296" r="66" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="480" y="290" font-size="16" fill="var(--ink)" text-anchor="middle">IOUs</text>
<text x="480" y="314" font-size="16" fill="var(--dim)" text-anchor="middle">TARGET2</text>
<rect x="170" y="168" width="140" height="56" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="240" y="203" font-size="19" fill="var(--ink)" text-anchor="middle">FR</text>
<rect x="610" y="168" width="140" height="56" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="680" y="203" font-size="19" fill="var(--ink)" text-anchor="middle">DE</text>
<rect x="170" y="372" width="140" height="56" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="240" y="407" font-size="19" fill="var(--ink)" text-anchor="middle">IT</text>
<rect x="610" y="372" width="140" height="56" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text x="680" y="407" font-size="19" fill="var(--ink)" text-anchor="middle">Others</text>
<line x1="800" y1="258" x2="800" y2="334" stroke="var(--page)" stroke-width="7"/>
<line x1="782" y1="262" x2="818" y2="330" stroke="var(--warn)" stroke-width="4"/>
<line x1="818" y1="262" x2="782" y2="330" stroke="var(--warn)" stroke-width="4"/>
<text x="796" y="238" font-size="19" fill="var(--warn)" text-anchor="middle">Closed</text>
<rect x="836" y="368" width="104" height="52" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="888" y="400" font-size="19" fill="var(--dim)" text-anchor="middle">UK</text>
<line x1="880" y1="360" x2="820" y2="330" stroke="var(--grey)" stroke-width="3"/>
<polygon points="814,326 834,338 830,320" fill="var(--grey)"/>
<text x="60" y="560" font-size="22" fill="var(--ink)">Mutual funding is why no one can leave</text>
</svg>
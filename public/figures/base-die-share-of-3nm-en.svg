<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Only a small piece at the left end of one long bar is filled, and three ticks of increasing length sit inside that small piece.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">How much 3nm capacity base dies could take</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">Bar = monthly 3nm capacity, 190k+ wafers in 2027 (the show's estimate)</text>
<rect x="120" y="250" width="720" height="80" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="120" y="250" width="101" height="80" rx="6" fill="var(--accent)" opacity="0.85"/>
<text x="860" y="298" font-size="19" fill="var(--dim)">190k</text>
<line x1="142" y1="230" x2="142" y2="180" stroke="var(--grey)" stroke-width="3"/>
<text x="142" y="166" font-size="19" fill="var(--dim)" text-anchor="middle">2028: 3%</text>
<line x1="192" y1="230" x2="192" y2="140" stroke="var(--grey)" stroke-width="3"/>
<text x="210" y="126" font-size="19" fill="var(--dim)" text-anchor="middle">2029: a tenth</text>
<line x1="221" y1="350" x2="221" y2="400" stroke="var(--accent)" stroke-width="3"/>
<text x="232" y="420" font-size="19" fill="var(--accent)">Ceiling case: all on 3nm</text>
<text x="232" y="444" font-size="16" fill="var(--dim)">27k wafers a month, not yet in 2027</text>
<text x="60" y="492" font-size="22" fill="var(--ink)">Retelling drops the condition, and demand gains a tenth</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一根向下的柱被拆成很長的大盤段與很短的新聞段">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="48" y="56" font-size="27" font-weight="700" fill="var(--ink)">這 5% 是誰造成的？</text>

  <line x1="120" y1="170" x2="880" y2="170" stroke="var(--line)" stroke-width="2"/>
  <text x="92" y="176" font-size="15" fill="var(--dim)">0</text>

  <rect x="200" y="170" width="130" height="250" rx="5" fill="var(--grey)"/>
  <text x="200" y="452" font-size="16" fill="var(--dim)">我手上這檔</text>
  <text x="200" y="482" font-size="19" font-weight="700" fill="var(--ink)">−5%</text>

  <path d="M 420 295 L 512 295" stroke="var(--dim)" stroke-width="3" fill="none"/>
  <path d="M 512 295 L 498 287 L 498 303 Z" fill="var(--dim)"/>

  <rect x="600" y="170" width="130" height="200" rx="5" fill="var(--grey)"/>
  <rect x="600" y="374" width="130" height="48" rx="5" fill="var(--accent)"/>
  <text x="600" y="452" font-size="16" fill="var(--dim)">拆開來看</text>

  <text x="754" y="278" font-size="16" fill="var(--dim)">大盤　−4%</text>
  <text x="754" y="404" font-size="16" font-weight="700" fill="var(--accent)">這則新聞　−1%</text>

  <text x="480" y="516" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">先扣掉大盤，剩下的才是新聞的份</text>
</svg>
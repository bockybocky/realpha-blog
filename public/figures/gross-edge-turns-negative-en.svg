<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One bar above the baseline and three progressively deeper bars below it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="52">After stripping penny stocks and trading costs</text>
  <line x1="70" y1="230" x2="900" y2="230" stroke="var(--line)" stroke-width="2"/>
  <line x1="305" y1="80" x2="305" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 7"/>
  <text class="n" x="70" y="96">Headline number</text>
  <text class="n" x="330" y="96">Penny stocks removed, 60bps costs deducted</text>
  <rect x="100" y="106" width="130" height="124" fill="var(--accent)"/>
  <text class="g" x="165" y="140" text-anchor="middle" fill="var(--page)">+0.69%</text>
  <text class="g" x="165" y="260" text-anchor="middle">10 days</text>
  <rect x="380" y="230" width="130" height="86" fill="var(--warn)"/>
  <text class="g" x="445" y="214" text-anchor="middle">10 days</text>
  <text class="g" x="445" y="344" text-anchor="middle" fill="var(--warn)">-0.48%</text>
  <rect x="570" y="230" width="130" height="124" fill="var(--warn)"/>
  <text class="g" x="635" y="214" text-anchor="middle">20 days</text>
  <text class="g" x="635" y="382" text-anchor="middle" fill="var(--warn)">-0.69%</text>
  <rect x="760" y="230" width="130" height="220" fill="var(--warn)"/>
  <text class="g" x="825" y="214" text-anchor="middle">120 days</text>
  <text class="g" x="825" y="478" text-anchor="middle" fill="var(--warn)">-1.22%</text>
  <text class="c" x="60" y="516">The same signal loses money at every holding period</text>
</svg>
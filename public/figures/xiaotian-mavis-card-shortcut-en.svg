<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Left: after a one-line instruction, five steps through Settings, System, Control Panel and Search to reach Power plan, one of them a dead end; right: a card button goes straight to Power plan in one click">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
<marker id="mkb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
</defs>
<text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Where is the entry? A long way apart</text>
<line x1="480" y1="100" x2="480" y2="520" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="122" font-size="20" fill="var(--ink)">Just a sentence</text>
<text x="520" y="122" font-size="20" fill="var(--ink)">A card</text>
<g stroke="var(--dim)" stroke-width="2" stroke-dasharray="5 5" fill="none">
<line x1="240" y1="192" x2="140" y2="240"/>
<line x1="200" y1="260" x2="280" y2="260"/>
<line x1="400" y1="260" x2="420" y2="260"/>
<line x1="140" y1="280" x2="140" y2="320"/>
<line x1="200" y1="340" x2="280" y2="340"/>
<line x1="340" y1="360" x2="300" y2="410"/>
</g>
<rect x="60" y="140" width="360" height="52" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="240" y="172" font-size="16" text-anchor="middle" fill="var(--ink)">"Change power plan"</text>
<rect x="80" y="240" width="120" height="40" rx="20" fill="var(--card)" stroke="var(--grey)"/>
<text x="140" y="266" font-size="16" text-anchor="middle" fill="var(--dim)">Settings?</text>
<rect x="280" y="240" width="120" height="40" rx="20" fill="var(--card)" stroke="var(--grey)"/>
<text x="340" y="266" font-size="16" text-anchor="middle" fill="var(--dim)">System?</text>
<text x="437" y="267" font-size="20" text-anchor="middle" fill="var(--warn)">✕</text>
<rect x="80" y="320" width="120" height="40" rx="20" fill="var(--card)" stroke="var(--grey)"/>
<text x="140" y="346" font-size="16" text-anchor="middle" fill="var(--dim)">Ctrl Panel?</text>
<rect x="280" y="320" width="120" height="40" rx="20" fill="var(--card)" stroke="var(--grey)"/>
<text x="340" y="346" font-size="16" text-anchor="middle" fill="var(--dim)">Search?</text>
<rect x="60" y="410" width="360" height="52" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="240" y="443" font-size="18" text-anchor="middle" fill="var(--accent)">Power plan</text>
<text x="60" y="512" font-size="22" font-weight="700" fill="var(--warn)">5 steps</text>
<rect x="520" y="140" width="380" height="120" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="544" y="178" font-size="18" fill="var(--ink)">Power plan</text>
<rect x="544" y="196" width="150" height="44" rx="22" fill="var(--accent)"/>
<text x="619" y="224" font-size="16" text-anchor="middle" fill="var(--page)">Open Settings</text>
<line x1="619" y1="244" x2="619" y2="402" stroke="var(--accent)" stroke-width="3" marker-end="url(#mkb)"/>
<text x="642" y="335" font-size="16" fill="var(--dim)">"Oh, there!"</text>
<rect x="520" y="410" width="380" height="52" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="710" y="443" font-size="18" text-anchor="middle" fill="var(--accent)">Power plan</text>
<text x="520" y="512" font-size="22" font-weight="700" fill="var(--accent)">1 click</text>
</svg>
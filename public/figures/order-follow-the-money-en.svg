<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A closed loop on the left, and on the right a dashed line that breaks open and trails off.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="56" font-size="27" fill="var(--ink)">Same order, different source of money</text>

<rect x="60" y="120" width="370" height="300" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="86" y="166" font-size="20" fill="var(--ink)">Customer paying from earnings</text>
<rect x="95" y="215" width="130" height="56" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="160" y="250" font-size="16" fill="var(--ink)" text-anchor="middle">Order</text>
<rect x="265" y="215" width="140" height="56" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="335" y="250" font-size="16" fill="var(--ink)" text-anchor="middle">Operating cash flow</text>
<line x1="225" y1="243" x2="255" y2="243" stroke="var(--accent)" stroke-width="3"/>
<polygon points="263,243 253,238 253,248" fill="var(--accent)"/>
<path d="M335,271 C335,340 160,340 160,281" fill="none" stroke="var(--accent)" stroke-width="3"/>
<polygon points="160,271 155,283 165,283" fill="var(--accent)"/>
<text x="247" y="378" font-size="15" fill="var(--dim)" text-anchor="middle">Grown from within</text>

<rect x="500" y="120" width="370" height="300" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="526" y="166" font-size="20" fill="var(--ink)">Customer paying from raises</text>
<rect x="535" y="215" width="130" height="56" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text x="600" y="250" font-size="16" fill="var(--ink)" text-anchor="middle">Order</text>
<rect x="690" y="215" width="150" height="56" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text x="765" y="250" font-size="16" fill="var(--ink)" text-anchor="middle">Next funding round</text>
<line x1="665" y1="243" x2="682" y2="243" stroke="var(--warn)" stroke-width="3"/>
<polygon points="690,243 680,238 680,248" fill="var(--warn)"/>
<line x1="845" y1="243" x2="905" y2="243" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="928" y="252" font-size="27" fill="var(--warn)">?</text>
<text x="685" y="378" font-size="15" fill="var(--dim)" text-anchor="middle">Waiting on the next buyer</text>

<text x="60" y="486" font-size="22" fill="var(--ink)">Trace one layer down: where did that money come from?</text>
</g>
</svg>
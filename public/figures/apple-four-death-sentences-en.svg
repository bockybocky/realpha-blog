<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Four downward bars of different depths from one top line, the 1996 bar deepest, an upward arrow at the bottom of each">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="60">Four death sentences from the market</text>
  <text class="b" x="60" y="92">How far it fell, and the situation at the time</text>
  <line x1="60" y1="190" x2="900" y2="190" stroke="var(--line)" stroke-width="2"/>
  <text class="s" x="60" y="180">Before the fall</text>

  <rect x="130" y="190" width="110" height="190" fill="var(--grey)"/>
  <rect x="330" y="190" width="110" height="250" fill="var(--grey)"/>
  <rect x="530" y="190" width="110" height="222" fill="var(--grey)"/>
  <rect x="730" y="190" width="110" height="95" fill="var(--grey)"/>

  <rect x="182.5" y="346" width="5" height="22" fill="var(--accent)"/>
  <polygon points="185,326 176,346 194,346" fill="var(--accent)"/>
  <rect x="382.5" y="406" width="5" height="22" fill="var(--accent)"/>
  <polygon points="385,386 376,406 394,406" fill="var(--accent)"/>
  <rect x="582.5" y="378" width="5" height="22" fill="var(--accent)"/>
  <polygon points="585,358 576,378 594,378" fill="var(--accent)"/>
  <rect x="782.5" y="251" width="5" height="22" fill="var(--accent)"/>
  <polygon points="785,231 776,251 794,251" fill="var(--accent)"/>

  <text class="g" x="185" y="478" text-anchor="middle">1983</text>
  <text class="s" x="185" y="503" text-anchor="middle">Profit −80%</text>
  <text class="s" x="185" y="525" text-anchor="middle">$63 → $23</text>

  <text class="g" x="385" y="478" text-anchor="middle">1996</text>
  <text class="s" x="385" y="503" text-anchor="middle">$740M quarterly loss</text>
  <text class="s" x="385" y="525" text-anchor="middle">Six weeks from bankruptcy</text>

  <text class="g" x="585" y="478" text-anchor="middle">2000</text>
  <text class="s" x="585" y="503" text-anchor="middle">$53 → $14</text>
  <text class="s" x="585" y="525" text-anchor="middle">In three months</text>

  <text class="g" x="785" y="478" text-anchor="middle">2025</text>
  <text class="s" x="785" y="503" text-anchor="middle">−$773B in one day</text>
  <text class="s" x="785" y="525" text-anchor="middle">Tariff threat</text>

  <text class="c" x="60" y="566">Survived all four; the rescue was never what the market was watching</text>
</svg>
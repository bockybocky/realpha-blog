<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根等高的柱子，左邊大半給最重要，右邊整根給最急、最重要那格空白">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">同一份資源，兩種分法</text>

<rect x="50" y="100" width="860" height="340" rx="14" fill="var(--card)"/>
<text x="480" y="140" font-size="16" fill="var(--dim)" text-anchor="middle">多出來的那兩小時</text>

<text x="260" y="186" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">嘴上的順序</text>
<rect x="180" y="200" width="160" height="150" rx="4" fill="var(--grey)"/>
<text x="260" y="282" font-size="16" fill="var(--page)" text-anchor="middle">最重要</text>
<rect x="180" y="350" width="160" height="50" rx="4" fill="var(--line)"/>
<text x="260" y="382" font-size="16" fill="var(--dim)" text-anchor="middle">最急</text>

<text x="700" y="186" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">實際的流向</text>
<rect x="620" y="200" width="160" height="150" rx="4" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="700" y="282" font-size="16" fill="var(--dim)" text-anchor="middle">最重要　零</text>
<rect x="620" y="350" width="160" height="50" rx="4" fill="var(--accent)"/>
<text x="700" y="382" font-size="16" fill="var(--page)" text-anchor="middle">最急　全部</text>

<text x="60" y="506" font-size="22" font-weight="700" fill="var(--ink)">寫已經發生的，不是寫計畫</text>
</svg>
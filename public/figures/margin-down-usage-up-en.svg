<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Penetration rises while gross margin falls, and the pricing moment sits beyond the dashed line on the right.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>svg{--page:#ffffff;--card:#f6f8fc;--line:#dde3ee;--ink:#1a212b;--dim:#57616f;--grey:#b9c2d0;--accent:#1f6feb;--warn:#d97706;}@media (prefers-color-scheme: dark){svg{--page:#0d1117;--card:#161b22;--line:#272e39;--ink:#e6edf3;--dim:#8b949e;--grey:#4a5464;--accent:#58a6ff;--warn:#d29922;}}text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}</style>
<text x="60" y="58" font-size="27" font-weight="700">Usage first, price later</text>
<rect x="100" y="96" width="780" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
<line x1="100" y1="426" x2="880" y2="426" stroke="var(--line)" stroke-width="2"/>
<polyline points="130,356 300,316 470,252 640,186 800,146" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="130" cy="356" r="7" fill="var(--accent)"/>
<circle cx="800" cy="146" r="7" fill="var(--accent)"/>
<text x="130" y="392" font-size="20" font-weight="700" fill="var(--accent)">1/4</text>
<text x="786" y="128" font-size="20" font-weight="700" fill="var(--accent)">3/4</text>
<text x="330" y="276" font-size="19" font-weight="700" fill="var(--accent)">Workflow reach</text>
<polyline points="130,170 300,206 470,256 640,304 800,338" fill="none" stroke="var(--warn)" stroke-width="5"/>
<text x="560" y="350" font-size="19" font-weight="700" fill="var(--warn)">Margin</text>
<line x1="800" y1="96" x2="800" y2="426" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
<text x="828" y="236" font-size="16" fill="var(--dim)">Price</text>
<text x="828" y="258" font-size="16" fill="var(--dim)">Later</text>
<text x="60" y="488" font-size="22" font-weight="700">Cost lands today, the payoff hasn't happened yet</text>
</svg>
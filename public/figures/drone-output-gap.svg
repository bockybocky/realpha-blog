<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="四條長度差距極大的橫條，美國最短、中國最長">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="72">同一年，各自產了幾架無人機</text>
<text class="g" x="60" y="168">美國</text>
<rect x="240" y="150" width="9" height="26" fill="var(--accent)"/>
<text class="b" x="265" y="170">約 30 萬</text>
<text class="g" x="60" y="248">俄羅斯</text>
<rect x="240" y="230" width="181" height="26" fill="var(--grey)"/>
<text class="b" x="437" y="250">700 萬～1,000 萬</text>
<text class="g" x="60" y="328">烏克蘭</text>
<rect x="240" y="310" width="181" height="26" fill="var(--grey)"/>
<text class="b" x="437" y="330">700 萬～1,000 萬</text>
<text class="g" x="60" y="408">中國</text>
<rect x="240" y="390" width="640" height="26" fill="var(--grey)"/>
<text class="b" x="240" y="440">估 3,000 萬</text>
<text class="c" x="60" y="490">比的不是機器，是產線</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="曲線前段貼底走平，過了現在往上彎，兩年後超過歷年最高虛線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">電網：前段看似停滯</text>
<line x1="120" y1="100" x2="120" y2="460" stroke="var(--dim)" stroke-width="2"/>
<line x1="120" y1="460" x2="880" y2="460" stroke="var(--dim)" stroke-width="2"/>
<text x="132" y="104" font-size="15" fill="var(--dim)">新增容量</text>
<line x1="120" y1="200" x2="880" y2="200" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="880" y="190" font-size="15" fill="var(--dim)" text-anchor="end">本世紀以來最高</text>
<line x1="480" y1="120" x2="480" y2="460" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 6"/>
<text x="480" y="490" font-size="16" fill="var(--ink)" text-anchor="middle">現在</text>
<text x="780" y="490" font-size="16" fill="var(--ink)" text-anchor="middle">兩年後</text>
<path d="M120,420 L480,412" fill="none" stroke="var(--dim)" stroke-width="4"/>
<path d="M480,412 C600,405 690,300 780,140" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="12 6"/>
<circle cx="780" cy="140" r="8" fill="var(--accent)"/>
<text x="300" y="362" font-size="16" fill="var(--dim)" text-anchor="middle">新聞看到的</text>
<text x="300" y="394" font-size="15" fill="var(--dim)" text-anchor="middle">決策週期（好幾年）</text>
<text x="800" y="132" font-size="17" font-weight="700" fill="var(--accent)">Shayle 看的</text>
</svg>
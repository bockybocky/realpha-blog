<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left two arrows pointing in opposite directions cancel into a flat line, while on the right a small earnings cut sits against a very long price decline.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">The prop is thin</text>
  <text class="t" x="60" y="96" font-size="16" fill="var(--dim)">L: last 12 months  R: small EPS cut</text>

  <text class="t" x="80" y="150" font-size="20" font-weight="700" fill="var(--dim)">What held</text>
  <line x1="150" y1="200" x2="150" y2="380" stroke="var(--grey)" stroke-width="6"/>
  <polygon points="150,398 138,368 162,368" fill="var(--grey)"/>
  <text class="t" x="80" y="430" font-size="16" fill="var(--dim)">multiple</text>
  <line x1="270" y1="380" x2="270" y2="200" stroke="var(--accent)" stroke-width="6"/>
  <polygon points="270,182 258,212 282,212" fill="var(--accent)"/>
  <text class="t" x="214" y="430" font-size="16" fill="var(--accent)">earnings</text>
  <line x1="330" y1="290" x2="430" y2="290" stroke="var(--ink)" stroke-width="6"/>
  <text class="t" x="330" y="268" font-size="19" font-weight="700" fill="var(--ink)">flat</text>

  <line x1="490" y1="130" x2="490" y2="440" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="540" y="150" font-size="20" font-weight="700" fill="var(--warn)">If EPS falls 5%</text>
  <line x1="580" y1="200" x2="580" y2="232" stroke="var(--warn)" stroke-width="22"/>
  <text class="t" x="540" y="268" font-size="16" fill="var(--dim)">EPS -5%</text>
  <line x1="760" y1="200" x2="760" y2="420" stroke="var(--warn)" stroke-width="22"/>
  <text class="t" x="716" y="452" font-size="16" font-weight="700" fill="var(--warn)">Price -40%</text>

  <text class="t" x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">10% fewer builds = an EPS cut</text>
</svg>
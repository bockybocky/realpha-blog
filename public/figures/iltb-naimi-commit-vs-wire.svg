<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="長條被切成極小的已到帳色塊與一大片空白等待區，顯示承諾不等於到帳">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="80" y="60" font-size="27" font-weight="700">紙上的數字與帳上的數字</text>
<text x="200" y="140" font-size="19" fill="var(--dim)">意向書 五千萬美元</text>
<rect x="200" y="160" width="660" height="60" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="80" y="198" font-size="19">意向書</text>
<rect x="200" y="250" width="528" height="60" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="80" y="288" font-size="19">領投承諾</text>
<text x="420" y="288" font-size="19" fill="var(--dim)">四千萬美元</text>
<rect x="200" y="340" width="66" height="60" fill="var(--accent)"/>
<text x="80" y="378" font-size="19">已到帳</text>
<text x="286" y="378" font-size="19" font-weight="700" fill="var(--accent)">五百萬</text>
<rect x="266" y="340" width="462" height="60" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="420" y="378" font-size="16" fill="var(--warn)">再等八到十週</text>
<text x="80" y="470" font-size="22" font-weight="700">承諾不等於到帳</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two horizontal bars show how long delivery takes: gas turbines run about five years, and grid equipment runs three years or more with a dashed extension at the end, while a tag at each bar's tail marks a price two to three times higher.">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Order today — how long until it arrives</text>
  <text x="60" y="100" font-size="16" fill="var(--dim)">Order date at left, delivery at the bar's right end</text>

  <line x1="300" y1="140" x2="300" y2="400" stroke="var(--ink)" stroke-width="2"/>
  <g stroke="var(--line)" stroke-width="1">
    <line x1="420" y1="140" x2="420" y2="400"/>
    <line x1="540" y1="140" x2="540" y2="400"/>
    <line x1="660" y1="140" x2="660" y2="400"/>
    <line x1="780" y1="140" x2="780" y2="400"/>
    <line x1="900" y1="140" x2="900" y2="400"/>
  </g>
  <g font-size="15" fill="var(--dim)" text-anchor="middle">
    <text x="300" y="428">Order</text>
    <text x="420" y="428">Yr 1</text>
    <text x="540" y="428">Yr 2</text>
    <text x="660" y="428">Yr 3</text>
    <text x="780" y="428">Yr 4</text>
    <text x="900" y="428">Yr 5</text>
  </g>

  <text x="60" y="200" font-size="19" fill="var(--ink)">Gas turbines</text>
  <rect x="300" y="172" width="600" height="46" rx="6" fill="var(--accent)"/>
  <text x="590" y="202" font-size="16" fill="var(--page)" text-anchor="middle">~5 years before delivery</text>

  <text x="60" y="300" font-size="19" fill="var(--ink)">Transformers</text>
  <text x="60" y="326" font-size="19" fill="var(--ink)">Switchgear</text>
  <rect x="300" y="282" width="360" height="46" rx="6" fill="var(--accent)" opacity="0.72"/>
  <text x="480" y="312" font-size="16" fill="var(--page)" text-anchor="middle">3+ years</text>
  <line x1="660" y1="305" x2="792" y2="305" stroke="var(--accent)" stroke-width="3" stroke-dasharray="9 8"/>
  <path d="M 792 296 L 812 305 L 792 314 Z" fill="var(--accent)"/>

  <g font-size="16" fill="var(--warn)">
    <text x="830" y="258">Price ×2–3</text>
    <text x="830" y="368">Price ×2–3</text>
  </g>
  <text x="60" y="478" font-size="22" font-weight="700" fill="var(--ink)">Lead times run in years, at 2–3× the price of five years ago</text>
</svg>
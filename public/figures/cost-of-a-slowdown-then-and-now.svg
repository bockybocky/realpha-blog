<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一個觸發條件下，以前的代價只有一格，現在疊成三格的高柱">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:16px; fill:var(--ink); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">同一個訊號，帳單長高了</text>
<text class="b" x="60" y="90">觸發條件不變：雲端大廠資本支出成長率掉到 20% 以下</text>

<line x1="120" y1="424" x2="860" y2="424" stroke="var(--line)" stroke-width="2"/>

<rect x="200" y="324" width="200" height="96" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="s" x="300" y="380" text-anchor="middle">營收少賺</text>
<text class="g" x="300" y="462" text-anchor="middle">以前</text>

<rect x="580" y="324" width="200" height="96" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="s" x="680" y="380" text-anchor="middle">營收少賺</text>
<rect x="580" y="230" width="200" height="88" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="s" x="680" y="282" text-anchor="middle" fill="var(--warn)">替客戶補差額</text>
<rect x="580" y="142" width="200" height="82" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="s" x="680" y="190" text-anchor="middle" fill="var(--warn)">自己吃庫存</text>
<text class="g" x="680" y="462" text-anchor="middle">現在</text>

<text class="c" x="480" y="508" text-anchor="middle">同一件事發生，代價變成三層</text>
</svg>
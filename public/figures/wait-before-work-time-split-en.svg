<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Top bar: 21 minutes of model download plus the image generation time. Bottom bar: no download segment, generation starts right away.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .ti { font:700 27px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .lb { font:600 20px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .sm { font:400 16px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
    .in { font:600 19px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--page); }
    .cc { font:700 22px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--accent); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="ti" x="80" y="66">Where the time goes</text>

  <text class="lb" x="80" y="150">That rental</text>
  <rect x="80" y="172" width="340" height="64" rx="6" fill="var(--grey)"/>
  <text class="in" x="104" y="212">Model download</text>
  <rect x="420" y="172" width="460" height="64" rx="6" fill="var(--accent)"/>
  <text class="in" x="444" y="212">Images</text>
  <text class="sm" x="80" y="264">21 min</text>
  <text class="sm" x="420" y="264">28.5 min</text>

  <text class="lb" x="80" y="344">ZeroGPU</text>
  <rect x="80" y="366" width="460" height="64" rx="6" fill="var(--accent)"/>
  <text class="in" x="104" y="406">Images</text>
  <text class="sm" x="560" y="406">Model already loaded</text>

  <text class="cc" x="80" y="486">Used now and then, what you save is the wait</text>
</svg>
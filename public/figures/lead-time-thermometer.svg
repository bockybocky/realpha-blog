<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="交期刻度尺，指標停在三十個月，一支箭頭指向二十五個月的方向">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">缺貨的體溫計是交期</text>

  <rect x="100" y="230" width="760" height="40" rx="20" fill="var(--card)" stroke="var(--line)"/>
  <rect x="520" y="230" width="340" height="40" rx="20" fill="var(--warn)" opacity="0.35"/>

  <line x1="200" y1="270" x2="200" y2="296" stroke="var(--line)" stroke-width="2"/>
  <text x="200" y="326" font-size="16" fill="var(--dim)" text-anchor="middle">12 個月</text>
  <line x1="520" y1="270" x2="520" y2="296" stroke="var(--line)" stroke-width="2"/>
  <text x="520" y="326" font-size="16" fill="var(--dim)" text-anchor="middle">24 個月</text>
  <line x1="660" y1="270" x2="660" y2="296" stroke="var(--line)" stroke-width="2"/>
  <text x="660" y="326" font-size="16" fill="var(--dim)" text-anchor="middle">25 個月</text>

  <polygon points="820,196 806,170 834,170" fill="var(--warn)"/>
  <text x="820" y="152" font-size="20" fill="var(--warn)" text-anchor="middle">30 個月</text>
  <text x="820" y="124" font-size="16" fill="var(--dim)" text-anchor="middle">現在</text>

  <line x1="800" y1="376" x2="670" y2="376" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="656,376 674,366 674,386" fill="var(--accent)"/>
  <text x="800" y="408" font-size="16" fill="var(--accent)" text-anchor="end">往這邊動，就是轉折</text>

  <text x="100" y="212" font-size="19" fill="var(--dim)">寬鬆</text>
  <text x="860" y="212" font-size="19" fill="var(--warn)" text-anchor="end">緊到插不進去</text>

  <text x="60" y="468" font-size="22" fill="var(--ink)">買它的人，要一直量它</text>
  <text x="60" y="500" font-size="16" fill="var(--dim)">一次讀數不算數，要的是連續的同一格</text>
</svg>
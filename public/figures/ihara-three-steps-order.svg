<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三級階梯依序標止血、變現、可見化，階梯頂端接到利益二億、四億、九億逐年墊高">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">順序是固定的</text>

  <path d="M100 440 L100 390 L300 390 L300 330 L500 330 L500 250 L700 250 L700 440 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="200" y="372" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">止血</text>
  <text class="t" x="200" y="420" font-size="16" fill="var(--dim)" text-anchor="middle">每月再砍 1000 萬</text>

  <text class="t" x="400" y="312" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">變現</text>
  <text class="t" x="400" y="420" font-size="16" fill="var(--dim)" text-anchor="middle">應收換現金 六成</text>

  <text class="t" x="600" y="232" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">可見化</text>
  <text class="t" x="600" y="420" font-size="16" fill="var(--dim)" text-anchor="middle">生產性 +40%</text>

  <polyline points="720,340 780,300 840,250 890,170" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="720" cy="340" r="6" fill="var(--accent)"/>
  <circle cx="840" cy="250" r="6" fill="var(--accent)"/>
  <circle cx="890" cy="170" r="6" fill="var(--accent)"/>
  <text class="t" x="735" y="365" font-size="16" fill="var(--dim)">2 億</text>
  <text class="t" x="846" y="240" font-size="16" fill="var(--dim)">4 億</text>
  <text class="t" x="896" y="160" font-size="16" fill="var(--dim)" text-anchor="end">9 億</text>
  <text class="t" x="760" y="470" font-size="22" font-weight="700" fill="var(--accent)" text-anchor="middle">新產品不在這張圖上</text>
</svg>
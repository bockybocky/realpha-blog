<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="續航、體積、安全三角拉扯，取一角就犧牲另兩角">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="80" y="62" font-size="27" font-weight="700" fill="var(--ink)">機器人的電池：三個角拉不齊</text>

<polygon points="480,130 790,410 170,410" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="480" y1="316" x2="480" y2="150" stroke="var(--accent)" stroke-width="2"/>
<line x1="480" y1="316" x2="208" y2="396" stroke="var(--accent)" stroke-width="2"/>
<line x1="480" y1="316" x2="752" y2="396" stroke="var(--accent)" stroke-width="2"/>
<circle cx="480" cy="316" r="9" fill="var(--accent)"/>

<text class="t" x="480" y="112" font-size="20" fill="var(--ink)" text-anchor="middle">續航</text>
<text class="t" x="170" y="440" font-size="20" fill="var(--ink)" text-anchor="middle">體積</text>
<text class="t" x="790" y="440" font-size="20" fill="var(--ink)" text-anchor="middle">安全</text>

<text class="t" x="500" y="310" font-size="16" fill="var(--dim)">現況：兩小時就要充</text>
<text class="t" x="480" y="152" font-size="15" fill="var(--warn)" text-anchor="middle">電池加大 → 機器變龐大</text>
<text class="t" x="196" y="372" font-size="15" fill="var(--warn)">要小 → 撐不久</text>
<text class="t" x="764" y="372" font-size="15" fill="var(--warn)" text-anchor="end">拉高電壓 → 風險上來</text>

<text class="t" x="80" y="510" font-size="22" font-weight="700" fill="var(--ink)">往任一角走，就離另外兩角更遠</text>
</svg>
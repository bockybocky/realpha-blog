<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Top: a 640MB bar stops at 480MB when cut off, and the cloud original disappears; bottom: a size-match gate is added, and shutdown is allowed only after the match.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66">One missing check, and the output vanished</text>

<text class="g" x="60" y="128">That night</text>
<rect x="60" y="148" width="520" height="58" rx="5" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="148" width="390" height="58" rx="5" fill="var(--warn)"/>
<text class="n" x="66" y="236">0</text>
<text class="n" x="396" y="236">480MB</text>
<text class="n" x="524" y="236">640MB</text>
<line x1="450" y1="138" x2="450" y2="216" stroke="var(--ink)" stroke-width="3"/>
<text class="n" x="462" y="132">Time limit, cut off</text>

<g opacity="0.45">
<rect x="650" y="148" width="230" height="58" rx="5" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="676" y="186">Cloud original</text>
</g>
<line x1="650" y1="206" x2="880" y2="148" stroke="var(--warn)" stroke-width="3"/>
<text class="n" x="650" y="236">Machine off, both gone</text>

<text class="g" x="60" y="330">Now</text>
<rect x="60" y="350" width="520" height="58" rx="5" fill="var(--accent)"/>
<text class="n" x="524" y="438">640MB</text>
<line x1="580" y1="340" x2="580" y2="418" stroke="var(--accent)" stroke-width="3"/>
<text class="n" x="594" y="334">Expected size</text>

<rect x="650" y="350" width="230" height="58" rx="5" fill="var(--card)" stroke="var(--accent)"/>
<text class="g" x="676" y="388">Match before shutdown</text>

<text class="c" x="60" y="500">Verify the final step</text>
</svg>
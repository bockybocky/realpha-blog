<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="大藥廠總市值呈水平震盪，科技股呈持續右上的曲線">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="80" y="62">整個類別加起來的形狀</text>
<rect x="80" y="100" width="800" height="300" fill="var(--card)"/>
<line x1="130" y1="360" x2="860" y2="360" stroke="var(--line)" stroke-width="2"/>
<path d="M150 260 L240 230 L330 275 L420 240 L510 285 L600 245 L690 270 L800 250" fill="none" stroke="var(--grey)" stroke-width="4"/>
<path d="M150 330 C330 322 520 300 650 240 C740 198 780 170 800 150" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="150" y="212">大藥廠　總市值</text>
<text class="g" x="596" y="142">科技股</text>
<text class="s" x="150" y="388">時間</text>
<text class="c" x="80" y="452">醫療佔 GDP 往上，但多出來那塊很多不在股市裡</text>
<text class="s" x="80" y="484">醫院與醫療服務，你買不到</text>
</svg>
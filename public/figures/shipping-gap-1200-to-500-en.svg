<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bars fall from 1200 to 500, and four short port bars on the right point in different directions, showing a smaller gap from a different mix of sources.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700 }
.g { font-size:20px; fill:var(--ink); font-weight:600 }
.b { font-size:16px; fill:var(--dim) }
.n { font-size:22px; fill:var(--ink); font-weight:700 }
.c { font-size:22px; fill:var(--ink); font-weight:600 }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56">Smaller gap, new break points</text>
<text class="g" x="60" y="110">Net gap</text>
<rect x="150" y="180" width="120" height="300" fill="var(--grey)"/>
<rect x="330" y="355" width="120" height="125" fill="var(--accent)"/>
<text class="n" x="210" y="166" text-anchor="middle">1200</text>
<text class="n" x="390" y="341" text-anchor="middle">500</text>
<line x1="90" y1="480" x2="500" y2="480" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="210" y="506" text-anchor="middle">Peak</text>
<text class="b" x="390" y="506" text-anchor="middle">Sept</text>
<text class="b" x="90" y="506">kb/d</text>
<text class="g" x="600" y="110">Mix</text>
<line x1="570" y1="380" x2="930" y2="380" stroke="var(--line)" stroke-width="2"/>
<line x1="610" y1="380" x2="660" y2="380" stroke="var(--warn)" stroke-width="6"/>
<rect x="690" y="240" width="46" height="140" fill="var(--accent)"/>
<rect x="770" y="380" width="46" height="50" fill="var(--grey)"/>
<rect x="850" y="310" width="46" height="70" fill="var(--accent)"/>
<text class="b" x="635" y="356" text-anchor="middle">Zero</text>
<text class="b" x="635" y="470" text-anchor="middle">Yanbu</text>
<text class="b" x="713" y="470" text-anchor="middle">Iraq</text>
<text class="b" x="793" y="470" text-anchor="middle">Kuwait</text>
<text class="b" x="873" y="470" text-anchor="middle">Saudi</text>
<text class="c" x="60" y="542">Watch loadings, not transits</text>
</svg>
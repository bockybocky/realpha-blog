<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A capacity bar shifts forward, leaving a dashed gap behind it.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t h" x="70" y="70">Capacity moves forward, leaving a hole</text>
<text class="t g" x="70" y="185">N3</text>
<rect x="230" y="160" width="300" height="38" fill="var(--accent)"/>
<rect x="530" y="160" width="140" height="38" fill="var(--accent)" opacity="0.55"/>
<text class="t b" x="690" y="186">Converted in</text>
<text class="t g" x="70" y="285">N5</text>
<rect x="230" y="260" width="260" height="38" fill="var(--accent)" opacity="0.35"/>
<rect x="490" y="260" width="140" height="38" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
<text class="t b" x="650" y="286">Gap</text>
<path d="M560 250 C580 215, 600 210, 620 200" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M620 200 l-17 2 l9 11 z" fill="var(--accent)"/>
<text class="t g" x="70" y="385">Mature nodes</text>
<rect x="230" y="360" width="400" height="38" fill="var(--grey)"/>
<text class="t b" x="650" y="386">Another story</text>
<text class="t c" x="70" y="480">Someone has to want the slot that was vacated</text>
</svg>
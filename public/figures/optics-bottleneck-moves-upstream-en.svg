<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two three-layer supply-chain stacks, with the bottleneck moving from the optical-module layer on the left to the light-source and materials layer on the right, one step upstream.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
    .p { fill:var(--page); }
</style>
<defs>
<marker id="f7a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
<marker id="f7d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker>
</defs>
<text x="60" y="52" class="t">Choke moves upstream</text>
<line x1="90" y1="440" x2="90" y2="150" stroke="var(--dim)" stroke-width="2" marker-end="url(#f7d)"/>
<text x="90" y="132" class="d" text-anchor="middle">Up</text>
<text x="90" y="466" class="d" text-anchor="middle">Down</text>
<text x="290" y="118" class="g" text-anchor="middle">Pre</text>
<text x="670" y="118" class="g" text-anchor="middle">Now</text>
<rect x="160" y="140" width="260" height="70" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="290" y="182" class="g" text-anchor="middle">Lasers</text>
<rect x="160" y="250" width="260" height="70" rx="8" fill="var(--accent)"/>
<text x="290" y="292" class="g p" text-anchor="middle">Module ⚠</text>
<rect x="160" y="360" width="260" height="70" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="290" y="402" class="g" text-anchor="middle">Systems</text>
<rect x="540" y="140" width="260" height="70" rx="8" fill="var(--accent)"/>
<text x="670" y="182" class="g p" text-anchor="middle">Lasers ⚠</text>
<rect x="540" y="250" width="260" height="70" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="670" y="292" class="g" text-anchor="middle">Module</text>
<rect x="540" y="360" width="260" height="70" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="670" y="402" class="g" text-anchor="middle">Systems</text>
<path d="M425 285 C 480 285, 480 175, 530 175" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#f7a)"/>
<text x="480" y="500" class="c" text-anchor="middle">Cue: JV talks, lockups</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A small dip in a rising curve splits into two paths, one continuing upward and one leaving downward.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text class="t" x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">One dip, two readings</text>

  <line x1="100" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
  <line x1="100" y1="100" x2="100" y2="450" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="112" y="112" font-size="16" fill="var(--dim)">Industry size</text>
  <text class="t" x="896" y="474" text-anchor="end" font-size="16" fill="var(--dim)">Time</text>

  <path d="M 130 410 L 250 356 L 360 316 L 450 350" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 450 350 L 570 282 L 700 214 L 840 150" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 450 350 L 560 396 L 690 424 L 830 436" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="450" cy="350" r="8" fill="var(--page)" stroke="var(--ink)" stroke-width="3"/>
  <text class="t" x="450" y="332" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)">Cost down . monetising</text>

  <text class="t" x="848" y="144" font-size="19" font-weight="700" fill="var(--accent)">Unchanged</text>
  <text class="t" x="848" y="168" font-size="16" fill="var(--dim)">Trend goes on</text>

  <text class="t" x="838" y="432" font-size="19" font-weight="700" fill="var(--warn)">Read as top</text>
  <text class="t" x="838" y="456" font-size="16" fill="var(--dim)">Sold halfway up</text>

  <text class="t" x="480" y="512" text-anchor="middle" font-size="22" fill="var(--ink)">Ask whether the structure changed before you change the conclusion</text>
</svg>
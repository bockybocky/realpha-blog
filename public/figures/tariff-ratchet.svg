<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="成本線上去又下來，售價線上去就不下來，右段兩條線之間拉開一塊缺口">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.s { font-size:16px; fill:var(--dim); }
.g { font-size:19px; font-weight:600; }
.n { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="64">漲上去的價格沒有降回來</text>
<text class="s" x="60" y="96">關稅的緊張過去之後</text>
<polygon points="620,205 850,203 850,340 620,330" fill="var(--accent)" opacity="0.14"/>
<polyline points="180,350 400,240 620,330 850,340" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6"/>
<polyline points="180,320 400,210 620,205 850,203" fill="none" stroke="var(--accent)" stroke-width="4"/>
<line x1="140" y1="430" x2="890" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="690" y="188" fill="var(--accent)">售價</text>
<text class="g" x="690" y="378" fill="var(--dim)">成本回落</text>
<text class="g" x="735" y="278" text-anchor="middle" fill="var(--accent)">多出來的那一段</text>
<text class="n" x="180" y="458" text-anchor="middle">關稅登上頭條</text>
<text class="n" x="400" y="458" text-anchor="middle">被迫轉嫁</text>
<text class="n" x="735" y="458" text-anchor="middle">一年後</text>
<text class="c" x="60" y="508">同一批營收，毛利率自己長高了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="六個並排方塊的連線收束成一個節點，再從節點分出兩條相反方向的結果">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="64" font-size="27" fill="var(--ink)">看起來六個部位</text>

  <rect x="42" y="130" width="136" height="58" rx="7" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="110" y="166" font-size="16" fill="var(--ink)" text-anchor="middle">感測器</text>
  <rect x="190" y="130" width="136" height="58" rx="7" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="258" y="166" font-size="16" fill="var(--ink)" text-anchor="middle">車用晶片</text>
  <rect x="338" y="130" width="136" height="58" rx="7" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="406" y="166" font-size="16" fill="var(--ink)" text-anchor="middle">模擬軟體</text>
  <rect x="486" y="130" width="136" height="58" rx="7" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="554" y="166" font-size="16" fill="var(--ink)" text-anchor="middle">工業機具</text>
  <rect x="634" y="130" width="136" height="58" rx="7" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="702" y="166" font-size="16" fill="var(--ink)" text-anchor="middle">電力</text>
  <rect x="782" y="130" width="136" height="58" rx="7" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="850" y="166" font-size="16" fill="var(--ink)" text-anchor="middle">國防載具</text>

  <line x1="110" y1="188" x2="480" y2="326" stroke="var(--grey)" stroke-width="2"/>
  <line x1="258" y1="188" x2="480" y2="326" stroke="var(--grey)" stroke-width="2"/>
  <line x1="406" y1="188" x2="480" y2="326" stroke="var(--grey)" stroke-width="2"/>
  <line x1="554" y1="188" x2="480" y2="326" stroke="var(--grey)" stroke-width="2"/>
  <line x1="702" y1="188" x2="480" y2="326" stroke="var(--grey)" stroke-width="2"/>
  <line x1="850" y1="188" x2="480" y2="326" stroke="var(--grey)" stroke-width="2"/>

  <rect x="270" y="328" width="420" height="82" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="480" y="362" font-size="20" fill="var(--warn)" text-anchor="middle">同一句假設</text>
  <text x="480" y="390" font-size="16" fill="var(--dim)" text-anchor="middle">實體世界的自動化會如期落地</text>

  <line x1="420" y1="410" x2="300" y2="446" stroke="var(--grey)" stroke-width="2"/>
  <line x1="540" y1="410" x2="660" y2="446" stroke="var(--grey)" stroke-width="2"/>
  <text x="270" y="472" font-size="16" fill="var(--dim)" text-anchor="middle">摩擦小 → 一起受益</text>
  <text x="690" y="472" font-size="16" fill="var(--dim)" text-anchor="middle">摩擦大 → 一起被拖延</text>

  <text x="480" y="516" font-size="22" fill="var(--ink)" text-anchor="middle">那不是六個部位，是一個。</text>
</svg>
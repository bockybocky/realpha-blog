<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左格機櫃被上限蓋子壓住，右格機櫃可以疊高但出口縮成窄閘門">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="48">兩版管制卡的不是同一個地方</text>

<rect x="60" y="86" width="400" height="356" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="122">拜登版</text>
<text class="s" x="84" y="148">卡建置</text>
<rect x="84" y="170" width="352" height="14" rx="4" fill="var(--grey)"/>
<text class="s" x="84" y="206">建置上限</text>
<rect x="110" y="300" width="300" height="34" rx="5" fill="var(--page)" stroke="var(--accent)"/>
<rect x="110" y="340" width="300" height="34" rx="5" fill="var(--page)" stroke="var(--accent)"/>
<rect x="110" y="380" width="300" height="34" rx="5" fill="var(--page)" stroke="var(--accent)"/>
<text class="s" x="110" y="434">算力</text>

<rect x="500" y="86" width="400" height="356" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="524" y="122">這一版</text>
<text class="s" x="524" y="148">卡出租</text>
<rect x="560" y="160" width="300" height="30" rx="5" fill="var(--page)" stroke="var(--accent)"/>
<rect x="560" y="196" width="300" height="30" rx="5" fill="var(--page)" stroke="var(--accent)"/>
<rect x="560" y="232" width="300" height="30" rx="5" fill="var(--page)" stroke="var(--accent)"/>
<rect x="560" y="268" width="300" height="30" rx="5" fill="var(--page)" stroke="var(--accent)"/>
<rect x="560" y="304" width="300" height="30" rx="5" fill="var(--page)" stroke="var(--accent)"/>
<rect x="560" y="340" width="300" height="30" rx="5" fill="var(--page)" stroke="var(--accent)"/>
<path d="M560 386 L860 386 L740 414 L680 414 Z" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="s" x="560" y="434">出租給中國：一道窄門</text>

<text class="c" x="60" y="502">你能建多少不管了，管的是能流出去多少</text>
</svg>
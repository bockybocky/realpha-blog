<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three blocks enlarging in sequence stand for multipliers compounding.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .n { font-size:27px; fill:var(--accent); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="62">Three multipliers on one week</text>
<line x1="60" y1="450" x2="930" y2="450" stroke="var(--line)" stroke-width="2"/>

<rect x="80" y="370" width="150" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="80" y="350">Speed</text>
<text class="n" x="92" y="422">50×</text>
<text class="s" x="80" y="486">10× faster</text>
<text class="s" x="80" y="512">No sleep, no holidays</text>

<text class="n" x="255" y="420">×</text>

<rect x="300" y="250" width="200" height="200" fill="var(--accent)" opacity="0.14"/>
<rect x="300" y="250" width="200" height="200" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="300" y="230">Caliber</text>
<text class="n" x="314" y="360">Top 50 people</text>
<text class="s" x="300" y="486">80% of algorithmic gains</text>
<text class="s" x="300" y="512">come from them</text>

<text class="n" x="525" y="420">×</text>

<rect x="570" y="110" width="340" height="340" fill="var(--accent)" opacity="0.22"/>
<rect x="570" y="110" width="340" height="340" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="570" y="90">Count</text>
<text class="n" x="590" y="290">Thousands of copies</text>
<text class="s" x="570" y="486">Close to formal theorems</text>
<text class="s" x="570" y="512">Far from writing novels</text>
</svg>
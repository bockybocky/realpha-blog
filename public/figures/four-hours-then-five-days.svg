<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="七天時間軸上，破解只佔最左邊一小截，躲稽核佔了右邊五天的長帶">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">四小時破解，五天躲一個不存在的稽核</text>
<text x="120" y="150" font-size="19" fill="var(--ink)">1 小時：通用作弊法</text>
<text x="120" y="186" font-size="19" fill="var(--ink)">4 小時：驗證一致</text>
<line x1="112" y1="196" x2="112" y2="286" stroke="var(--grey)" stroke-width="2"/>
<line x1="126" y1="196" x2="126" y2="286" stroke="var(--grey)" stroke-width="2"/>
<rect x="130" y="246" width="730" height="40" rx="6" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="2"/>
<text x="410" y="274" font-size="20" fill="var(--ink)">五天：躲稽核</text>
<line x1="100" y1="310" x2="880" y2="310" stroke="var(--line)" stroke-width="2"/>
<text x="100" y="340" font-size="16" fill="var(--dim)">第 1 天</text>
<text x="533" y="340" font-size="16" fill="var(--dim)">第 4 天</text>
<text x="828" y="340" font-size="16" fill="var(--dim)">第 7 天</text>
<line x1="480" y1="378" x2="860" y2="378" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 8"/>
<text x="480" y="406" font-size="19" fill="var(--warn)">這個稽核不存在</text>
<text x="60" y="470" font-size="22" fill="var(--ink)">力氣幾乎都花在想像出來的對手身上</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two stacked timelines: the top layer's measurement signal arrives early but is dashed and can be overturned, and the bottom layer's physical signal arrives late but is solid and cannot be moved.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="60">Recession: 2 layers</text>
<line x1="150" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="150" y="460">Early</text>
<text class="b" x="846" y="460">Late</text>
<text class="g" x="60" y="152">Stat</text>
<text class="b" x="60" y="178">Who?</text>
<text class="b" x="60" y="200">Base year?</text>
<rect x="150" y="124" width="250" height="68" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="g" x="178" y="166" fill="var(--accent)">Line</text>
<path d="M410 158 L560 158" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 5"/>
<path d="M566 158 l-14 -7 l0 14 z" fill="var(--accent)"/>
<text class="b" x="586" y="152">Recalc</text>
<text class="b" x="586" y="176">may flip</text>
<text class="g" x="60" y="312">Real</text>
<text class="b" x="60" y="338">Jobs lost?</text>
<text class="b" x="60" y="360">Lines moved?</text>
<rect x="520" y="284" width="310" height="68" rx="10" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>
<text class="g" x="548" y="326">German mfg -1M jobs</text>
<path d="M150 318 L508 318" stroke="var(--grey)" stroke-width="3"/>
<path d="M514 318 l-14 -7 l0 14 z" fill="var(--grey)"/>
<text class="b" x="196" y="300">Slow</text>
<line x1="400" y1="104" x2="400" y2="430" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 6"/>
<line x1="520" y1="104" x2="520" y2="430" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 6"/>
<text class="c" x="60" y="498">Slow L2</text>
<text class="b" x="230" y="498">but neither erases the other</text>
</svg>
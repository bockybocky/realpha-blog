<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一個孤立小方塊是唯一正式權力；右邊中心點輻射四條線通往四種資源">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .ttl { font-size:27px; font-weight:700; }
    .grp { font-size:20px; font-weight:700; fill:var(--dim); }
    .lbl { font-size:16px; fill:var(--dim); }
    .cc { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t ttl" x="60" y="60">清單上一項，手上一把</text>

  <text class="t grp" x="60" y="118">正式權力清單</text>
  <rect x="60" y="140" width="250" height="250" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="96" y="248" width="60" height="36" rx="5" fill="var(--grey)"/>
  <text class="t lbl" x="172" y="272">優先發言權</text>

  <text class="t grp" x="400" y="118">他自己接上的線</text>
  <circle cx="560" cy="265" r="26" fill="var(--accent)"/>
  <g stroke="var(--accent)" stroke-width="4" fill="none">
    <path d="M585 248 L760 170"/>
    <path d="M589 262 L790 250"/>
    <path d="M589 274 L790 318"/>
    <path d="M582 288 L740 380"/>
  </g>
  <g fill="var(--accent)" opacity="0.16" stroke="var(--accent)">
    <rect x="762" y="146" width="150" height="46" rx="6"/>
    <rect x="792" y="228" width="120" height="46" rx="6"/>
    <rect x="792" y="296" width="120" height="46" rx="6"/>
    <rect x="742" y="360" width="170" height="46" rx="6"/>
  </g>
  <text class="t lbl" x="776" y="176">委員會席位</text>
  <text class="t lbl" x="806" y="258">議程</text>
  <text class="t lbl" x="806" y="326">眾議院門路</text>
  <text class="t lbl" x="756" y="390">選舉經費</text>

  <line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="t cc" x="60" y="486">權力不在職稱裡，在接得到誰</text>
</svg>
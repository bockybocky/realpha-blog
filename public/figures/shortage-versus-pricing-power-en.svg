<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A four-quadrant chart with degree of shortage on the horizontal axis and gross margin on the vertical; the upper-right and lower-right points share the same shortage but opposite margin directions">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:20px; font-weight:700; fill:var(--ink); }
.d { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">Shortage: revenue. Power: margin</text>
<rect x="250" y="140" width="620" height="330" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="560" y1="140" x2="560" y2="470" stroke="var(--line)" stroke-width="2.5"/>
<line x1="250" y1="305" x2="870" y2="305" stroke="var(--line)" stroke-width="2.5"/>
<text class="d" x="240" y="152" text-anchor="end">Margin up</text>
<text class="d" x="240" y="464" text-anchor="end">Margin flat</text>
<text class="d" x="250" y="500">Shortage low</text>
<text class="d" x="870" y="500" text-anchor="end">High</text>
<text class="g" x="715" y="196" text-anchor="middle" fill="var(--accent)">Real pricing power</text>
<text class="d" x="715" y="230" text-anchor="middle">Price hikes stick</text>
<text class="d" x="715" y="260" text-anchor="middle">Customers accept</text>
<text class="g" x="715" y="356" text-anchor="middle" fill="var(--warn)">Short but no gain</text>
<text class="d" x="715" y="390" text-anchor="middle">Prices locked</text>
<text class="d" x="715" y="420" text-anchor="middle">Concentrated buyers</text>
<text class="d" x="715" y="450" text-anchor="middle">They would cancel first</text>
<text class="d" x="405" y="212" text-anchor="middle">Raises without shortage</text>
<text class="d" x="405" y="242" text-anchor="middle">Rare</text>
<text class="d" x="405" y="380" text-anchor="middle">Normal</text>
<circle cx="840" cy="168" r="9" fill="var(--accent)"/>
<circle cx="840" cy="440" r="9" fill="var(--warn)"/>
<text class="c" x="60" y="534">The bottleneck is half the job</text>
</svg>
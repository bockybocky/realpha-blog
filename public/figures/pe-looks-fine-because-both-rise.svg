<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="價格與獲利同時被推高，本益比這個分數讀出來幾乎不變">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .n { font-size:46px; fill:var(--ink); }
</style>
<text class="t" x="60" y="56">兩邊一起被推高，倍數看起來沒變</text>
<rect x="60" y="92" width="520" height="340" rx="14" fill="var(--card)"/>
<text class="g" x="88" y="130">本益比</text>
<text class="g" x="88" y="186">價格</text>
<rect x="170" y="166" width="120" height="26" rx="6" fill="var(--grey)"/>
<rect x="170" y="166" width="330" height="26" rx="6" fill="var(--accent)" opacity="0.85"/>
<line x1="88" y1="236" x2="520" y2="236" stroke="var(--ink)" stroke-width="4"/>
<text class="g" x="88" y="302">獲利</text>
<rect x="170" y="282" width="120" height="26" rx="6" fill="var(--grey)"/>
<rect x="170" y="282" width="300" height="26" rx="6" fill="var(--warn)" opacity="0.85"/>
<text class="d" x="170" y="340">重複下單堆出來的訂單</text>
<text class="d" x="170" y="366">撐不住的毛利率</text>
<text class="d" x="170" y="150">兩個標準差之外</text>
<text class="n" x="612" y="252">＝</text>
<rect x="676" y="150" width="224" height="130" rx="14" fill="var(--card)"/>
<text class="g" x="700" y="200">讀出來的數字</text>
<text class="c" x="700" y="246">還合理</text>
<line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="60" y="518">泡沫長在分母上，分數就不會告警</text>
</svg>
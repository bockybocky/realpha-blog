<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bars of wildly different height, one very short and one very tall.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="76">Increase in capex over four quarters</text>
<text class="b" x="60" y="108">Same yardstick, same period</text>

<line x1="200" y1="450" x2="860" y2="450" stroke="var(--line)" stroke-width="2"/>

<rect x="280" y="434" width="120" height="16" rx="3" fill="var(--grey)"/>
<text class="g" x="280" y="416">10 billion USD</text>
<text class="g" x="300" y="486">Apple</text>
<text class="b" x="258" y="514">Not playing this game</text>

<rect x="640" y="150" width="120" height="300" rx="3" fill="var(--accent)"/>
<text class="g" x="640" y="132" fill="var(--accent)">215 billion USD</text>
<text class="g" x="648" y="486">Amazon</text>
<text class="b" x="618" y="514">Lives on data centers</text>

<text class="c" x="60" y="550">Two names in one column, carrying different risks</text>
</svg>
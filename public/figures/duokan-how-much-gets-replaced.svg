<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四個等大的框填滿高度不同，代表四種改法各換掉多少東西">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="480" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">四種改法，各自換掉多少東西</text>

  <rect x="80" y="130" width="170" height="260" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="165" y="420" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)">不改</text>
  <text class="t" x="165" y="450" text-anchor="middle" font-size="16" fill="var(--dim)">自己找安裝檔</text>

  <rect x="290" y="130" width="170" height="260" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="290" y="130" width="170" height="260" rx="10" fill="var(--accent)" opacity="0.85"/>
  <text class="t" x="375" y="420" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)">刷整套系統</text>
  <text class="t" x="375" y="450" text-anchor="middle" font-size="16" fill="var(--dim)">整個換掉</text>

  <rect x="500" y="130" width="170" height="260" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <rect x="500" y="352" width="170" height="38" fill="var(--accent)" opacity="0.85"/>
  <rect x="500" y="306" width="170" height="34" fill="var(--accent)" opacity="0.85"/>
  <text class="t" x="585" y="420" text-anchor="middle" font-size="19" font-weight="700" fill="var(--accent)">Magisk</text>
  <text class="t" x="585" y="450" text-anchor="middle" font-size="16" fill="var(--dim)">開機映像＋一包套件</text>

  <rect x="710" y="130" width="170" height="260" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="710" y="352" width="170" height="38" fill="var(--accent)" opacity="0.85"/>
  <text class="t" x="795" y="420" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)">只用開源程式</text>
  <text class="t" x="795" y="450" text-anchor="middle" font-size="16" fill="var(--dim)">開機映像</text>

  <text class="t" x="480" y="520" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">改得少，才救得回</text>
</svg>
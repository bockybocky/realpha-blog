<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two lanes on the left have opposing arrows, while on the right they merge into one lane with arrows pointing the same way.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">From separate lanes to teamwork</text>
<text class="g" x="60" y="130">2022</text>
<line x1="60" y1="150" x2="440" y2="150" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="60" y="196">Fed</text>
<path d="M170 190 L420 190" stroke="var(--accent)" stroke-width="4" marker-end="url(#a4)"/>
<text class="b" x="60" y="266">Treasury</text>
<path d="M420 260 L170 260" stroke="var(--warn)" stroke-width="4" marker-end="url(#a4w)"/>
<text class="b" x="60" y="310">Hands pulling apart</text>
<line x1="480" y1="110" x2="480" y2="430" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="g" x="530" y="130">Now</text>
<line x1="530" y1="150" x2="900" y2="150" stroke="var(--line)" stroke-width="2"/>
<path d="M540 190 C680 190 700 225 790 225" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M540 260 C680 260 700 225 790 225" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M790 225 L890 225" stroke="var(--accent)" stroke-width="6" marker-end="url(#a4)"/>
<text class="b" x="530" y="182">Fed</text>
<text class="b" x="530" y="290">Treasury</text>
<text class="g" x="700" y="330">Working together</text>
<defs>
<marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
<marker id="a4w" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker>
</defs>
<text class="c" x="60" y="430">The word is autonomy, not independence</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="In this bar chart the car-sale bar is very short while the financing, warranty and service bars are clearly longer and are bracketed as deals made after the customer is inside.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="70">Dealer money comes after the door</text>
  <text class="s" x="300" y="158">Bar length = relative margin</text>

  <line x1="300" y1="176" x2="300" y2="446" stroke="var(--line)" stroke-width="2"/>

  <rect x="300" y="190" width="90" height="40" fill="var(--grey)"/>
  <text class="g" x="284" y="218" text-anchor="end">Car sale</text>

  <rect x="300" y="256" width="320" height="40" fill="var(--accent)"/>
  <text class="g" x="284" y="284" text-anchor="end">Financing</text>

  <rect x="300" y="322" width="240" height="40" fill="var(--accent)"/>
  <text class="g" x="284" y="350" text-anchor="end">Warranty</text>

  <rect x="300" y="388" width="200" height="40" fill="var(--accent)"/>
  <text class="g" x="284" y="416" text-anchor="end">Service</text>

  <path d="M654 256 L668 256 L668 428 L654 428" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text class="g" x="684" y="336">Already inside</text>
  <text class="s" x="684" y="362">Value of the slot</text>

  <text class="c" x="60" y="500">Profit comes after the sale, not on the car</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條橫條：本金一條細線、標普 500 一小截、家得寶橫跨整張圖，差 100 倍">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .v { font-size:19px; font-weight:700; }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="60" y="60" class="t">同一筆 1,000 美元，1981 年至今</text>
<text x="60" y="94" class="b">股息再投入</text>
<line x1="200" y1="130" x2="200" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="186" class="g">本金</text>
<rect x="200" y="150" width="2" height="56" fill="var(--grey)"/>
<text x="216" y="186" class="v">1,000 美元</text>
<text x="60" y="286" class="g">標普 500</text>
<rect x="200" y="250" width="8" height="56" fill="var(--grey)"/>
<text x="222" y="286" class="v">17 萬美元</text>
<text x="60" y="386" class="g">家得寶</text>
<rect x="200" y="350" width="720" height="56" fill="var(--accent)"/>
<text x="900" y="386" class="v" text-anchor="end" style="fill:var(--page)">1,700 萬美元</text>
<text x="200" y="470" class="c">差 100 倍</text>
</svg>
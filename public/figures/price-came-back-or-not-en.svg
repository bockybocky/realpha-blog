<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The left panel drops sharply then rebounds into a V; the right panel drops sharply and stays pinned at the lows with no recovery.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="64" font-size="27" fill="var(--ink)">Did the Price Come Back?</text>

<rect x="60" y="110" width="400" height="300" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="90" y1="190" x2="430" y2="190" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<polyline points="90,190 180,190 230,350 300,200 430,190" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="260" y="450" font-size="20" fill="var(--accent)" text-anchor="middle">Definition Noise</text>

<rect x="500" y="110" width="400" height="300" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="530" y1="190" x2="870" y2="190" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<polyline points="530,190 620,190 670,350 740,360 870,370" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text x="700" y="450" font-size="20" fill="var(--warn)" text-anchor="middle">Real Trouble</text>
</svg>
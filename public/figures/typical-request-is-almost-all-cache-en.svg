<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A bar is almost entirely cache reads, with input and output left as two thin slivers.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="80" y="76" font-size="27" font-weight="700" fill="var(--ink)">What one typical request is made of</text>

<rect x="80" y="230" width="4" height="90" fill="var(--warn)"/>
<rect x="84" y="230" width="788" height="90" fill="var(--accent)"/>
<rect x="872" y="230" width="3" height="90" fill="var(--warn)"/>

<text x="478" y="285" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">Cache reads</text>

<line x1="82" y1="230" x2="82" y2="186" stroke="var(--warn)" stroke-width="2"/>
<text x="82" y="172" font-size="19" fill="var(--warn)" text-anchor="middle">In</text>
<line x1="873" y1="320" x2="873" y2="364" stroke="var(--warn)" stroke-width="2"/>
<text x="873" y="388" font-size="19" fill="var(--warn)" text-anchor="end">Output</text>

<text x="80" y="456" font-size="22" font-weight="700" fill="var(--ink)">Read a price list by the column you actually spend in</text>
</svg>
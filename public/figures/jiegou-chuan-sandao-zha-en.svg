<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="In this attenuation diagram, a thick arrow passes through three gates from left to right, losing width at each gate until it reaches price as a very thin line.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">Structure crosses buffers before prices</text>

<text x="60" y="112" font-size="19" fill="var(--dim)">Structure</text>
<rect x="60" y="190" width="200" height="88" fill="var(--accent)"/>
<rect x="300" y="206" width="160" height="56" fill="var(--accent)"/>
<rect x="500" y="218" width="160" height="32" fill="var(--accent)"/>
<rect x="700" y="228" width="120" height="12" fill="var(--accent)"/>
<path d="M820 214 L868 234 L820 254 Z" fill="var(--accent)"/>

<rect x="264" y="160" width="32" height="148" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<rect x="464" y="160" width="32" height="148" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<rect x="664" y="160" width="32" height="148" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>

<text x="280" y="348" font-size="16" fill="var(--ink)" text-anchor="middle">China curbs demand</text>
<text x="480" y="348" font-size="16" fill="var(--ink)" text-anchor="middle">Release reserves</text>
<text x="680" y="348" font-size="16" fill="var(--ink)" text-anchor="middle">Refinery outages</text>
<text x="880" y="284" font-size="19" fill="var(--dim)" text-anchor="end">Price</text>

<text x="60" y="440" font-size="22" fill="var(--ink)">Until buffers run out, price seems to refute you</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="三個小格裡的成本線高度不同，分別是下移、不動、換到低位">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text x="60" y="66" font-size="27" fill="var(--ink)">買在高點之後，成本線能去哪裡</text>
  <rect x="60" y="110" width="260" height="360" rx="16" fill="var(--card)" stroke="var(--line)"/>
  <circle cx="130" cy="190" r="12" fill="var(--grey)"/>
  <line x1="90" y1="190" x2="290" y2="190" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 7"/>
  <line x1="90" y1="300" x2="290" y2="300" stroke="var(--accent)" stroke-width="6"/>
  <circle cx="230" cy="300" r="12" fill="var(--accent)"/>
  <path d="M136 206 L224 286" stroke="var(--accent)" stroke-width="3"/>
  <text x="90" y="430" font-size="20" fill="var(--ink)">攤低均價</text>
  <text x="90" y="458" font-size="15" fill="var(--dim)">成本線下移</text>
  <rect x="350" y="110" width="260" height="360" rx="16" fill="var(--card)" stroke="var(--line)"/>
  <circle cx="420" cy="190" r="12" fill="var(--accent)"/>
  <line x1="380" y1="190" x2="580" y2="190" stroke="var(--accent)" stroke-width="6"/>
  <text x="380" y="430" font-size="20" fill="var(--ink)">鎖住部位</text>
  <text x="380" y="458" font-size="15" fill="var(--dim)">成本線不動</text>
  <rect x="640" y="110" width="260" height="360" rx="16" fill="var(--card)" stroke="var(--line)"/>
  <circle cx="710" cy="190" r="12" fill="var(--grey)"/>
  <line x1="670" y1="190" x2="870" y2="190" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 7"/>
  <line x1="670" y1="370" x2="870" y2="370" stroke="var(--warn)" stroke-width="6"/>
  <circle cx="820" cy="370" r="12" fill="var(--warn)"/>
  <text x="670" y="430" font-size="20" fill="var(--ink)">停損再買回</text>
  <text x="670" y="458" font-size="15" fill="var(--warn)">可能買得更高</text>
  <text x="60" y="540" font-size="22" fill="var(--ink)">三條都成立，前提是你知道自己在做哪一條</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左格線距鬆、一次曝光；右格線距緊、四次曝光">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="h" x="60" y="58">同一台機器，兩種結果</text>

  <rect x="60" y="92" width="400" height="330" rx="10" fill="var(--card)"/>
  <rect x="500" y="92" width="400" height="330" rx="10" fill="var(--card)"/>
  <text class="g" x="90" y="130">背面供電</text>
  <text class="g" x="530" y="130" fill="var(--warn)">沒有背面供電</text>

  <g stroke="var(--accent)" stroke-width="6">
    <line x1="100" y1="180" x2="420" y2="180"/>
    <line x1="100" y1="214" x2="420" y2="214"/>
    <line x1="100" y1="248" x2="420" y2="248"/>
  </g>
  <rect x="100" y="286" width="320" height="20" rx="4" fill="var(--grey)"/>
  <text class="b" x="100" y="330">供電層移到晶體管底下</text>
  <text class="b" x="420" y="330" text-anchor="end">線距鬆</text>
  <rect x="100" y="352" width="60" height="40" rx="5" fill="var(--accent)"/>
  <text class="g" x="176" y="380">曝光 1 次</text

>
  <g stroke="var(--warn)" stroke-width="6">
    <line x1="540" y1="170" x2="860" y2="170"/>
    <line x1="540" y1="190" x2="860" y2="190"/>
    <line x1="540" y1="210" x2="860" y2="210"/>
    <line x1="540" y1="230" x2="860" y2="230"/>
    <line x1="540" y1="250" x2="860" y2="250"/>
    <line x1="540" y1="270" x2="860" y2="270"/>
  </g>
  <text class="b" x="540" y="330">供電線還擠在上層</text>
  <text class="b" x="860" y="330" text-anchor="end">線距緊</text>
  <g fill="var(--warn)">
    <rect x="540" y="352" width="46" height="40" rx="5"/>
    <rect x="596" y="352" width="46" height="40" rx="5"/>
    <rect x="652" y="352" width="46" height="40" rx="5"/>
    <rect x="708" y="352" width="46" height="40" rx="5"/>
  </g>
  <text class="g" x="770" y="380">曝光 4 次</text>
  <text class="c" x="60" y="486">貴一倍的機台，要線距鬆才划得來</text>
</svg>
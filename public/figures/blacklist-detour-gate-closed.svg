<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="兩格對比：上格直接買晶片的路被擋，繞道東南亞機房的路通；下格繞道那條路也被關上">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t27{font-size:27px;font-weight:700;fill:var(--ink)}
.t20{font-size:20px;font-weight:700;fill:var(--dim)}
.t16{font-size:16px;fill:var(--ink)}
.t15{font-size:15px;fill:var(--dim)}
.t22{font-size:22px;font-weight:700;fill:var(--ink)}
.bx{fill:var(--card);stroke:var(--line);stroke-width:2}
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t27" x="48" y="46">名單擋得住正門，擋不住繞道</text>

<text class="t20" x="48" y="104">之前</text>
<rect class="bx" x="60" y="140" width="200" height="56" rx="8"/>
<text class="t16" x="160" y="174" text-anchor="middle">名單上的公司</text>
<rect class="bx" x="700" y="140" width="200" height="56" rx="8"/>
<text class="t16" x="800" y="174" text-anchor="middle">NVIDIA 算力</text>
<line x1="260" y1="168" x2="700" y2="168" stroke="var(--grey)" stroke-width="3"/>
<text class="t15" x="350" y="158">正門</text>
<line x1="468" y1="146" x2="492" y2="190" stroke="var(--warn)" stroke-width="6"/>
<line x1="492" y1="146" x2="468" y2="190" stroke="var(--warn)" stroke-width="6"/>
<polyline points="160,196 160,266 380,266" fill="none" stroke="var(--accent)" stroke-width="3"/>
<rect class="bx" x="380" y="240" width="200" height="52" rx="8"/>
<text class="t16" x="480" y="272" text-anchor="middle">東南亞機房</text>
<polyline points="580,266 800,266 800,206" fill="none" stroke="var(--accent)" stroke-width="3"/>
<polygon points="800,194 793,210 807,210" fill="var(--accent)"/>
<text class="t15" x="640" y="256">繞道可通</text>

<text class="t20" x="48" y="316">缺席那幾週之後</text>
<rect class="bx" x="60" y="352" width="200" height="56" rx="8"/>
<text class="t16" x="160" y="386" text-anchor="middle">名單上的公司</text>
<rect class="bx" x="700" y="352" width="200" height="56" rx="8"/>
<text class="t16" x="800" y="386" text-anchor="middle">NVIDIA 算力</text>
<line x1="260" y1="380" x2="700" y2="380" stroke="var(--grey)" stroke-width="3"/>
<line x1="468" y1="358" x2="492" y2="402" stroke="var(--warn)" stroke-width="6"/>
<line x1="492" y1="358" x2="468" y2="402" stroke="var(--warn)" stroke-width="6"/>
<polyline points="160,408 160,478 380,478" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect class="bx" x="380" y="452" width="200" height="52" rx="8"/>
<text class="t16" x="480" y="484" text-anchor="middle">東南亞機房</text>
<polyline points="580,478 700,478" fill="none" stroke="var(--grey)" stroke-width="3"/>
<line x1="678" y1="456" x2="702" y2="500" stroke="var(--warn)" stroke-width="6"/>
<line x1="702" y1="456" x2="678" y2="500" stroke="var(--warn)" stroke-width="6"/>
<text class="t15" x="716" y="484">閘關上</text>

<text class="t22" x="48" y="564">人回來，閘不會跟著重開</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條水平滑軌，左端標寬鬆定義並指向一個名字，右端標收緊定義並指向另外兩個名字，滑塊位置決定答案">
  <defs>
    <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="ti" x="40" y="54">滑一下，答案換人</text>

  <rect x="110" y="190" width="740" height="18" rx="9" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="240" cy="199" r="22" fill="var(--accent)"/>
  <circle cx="740" cy="199" r="22" fill="none" stroke="var(--grey)" stroke-width="4"/>

  <text class="g" x="150" y="166">定義寬</text>
  <text class="b" x="150" y="142">會閂鎖也算</text>
  <text class="g" x="660" y="166">定義緊</text>
  <text class="b" x="620" y="142">全範圍不閂鎖</text>

  <line x1="240" y1="226" x2="240" y2="290" stroke="var(--accent)" stroke-width="3"/>
  <rect x="130" y="290" width="240" height="110" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="162" y="334">Baliga</text>
  <text class="b" x="162" y="362">先發表、先上市</text>
  <text class="b" x="162" y="386">今天多數人認他</text>

  <line x1="740" y1="226" x2="740" y2="290" stroke="var(--grey)" stroke-width="3"/>
  <rect x="600" y="290" width="280" height="110" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="632" y="334">Becke　中川</text>
  <text class="b" x="632" y="362">請求項那一句在前者</text>
  <text class="b" x="632" y="386">做出東西的是後者</text>

  <text class="c" x="110" y="466">吵的不是誰先做，是這個詞指什麼</text>
</svg>
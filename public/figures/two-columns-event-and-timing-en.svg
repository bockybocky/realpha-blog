<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A two-column comparison with the left column filled and the right column blank.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t h" x="70" y="70">One headline, split into two columns</text>
<rect x="90" y="120" width="360" height="290" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="115" y="165">Will it happen</text>
<rect x="115" y="195" width="310" height="34" fill="var(--accent)"/>
<rect x="115" y="245" width="280" height="34" fill="var(--accent)"/>
<rect x="115" y="295" width="300" height="34" fill="var(--accent)"/>
<text class="t b" x="115" y="380">Send someone to count progress</text>
<rect x="510" y="120" width="360" height="290" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="535" y="165">When it hits earnings</text>
<rect x="535" y="195" width="310" height="34" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="535" y="245" width="310" height="34" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="535" y="295" width="310" height="34" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="t b" x="535" y="380">Empty</text>
<text class="t c" x="70" y="480">Until the right column is filled, it is just background noise</text>
</svg>
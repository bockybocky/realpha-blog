<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three stacked horizontal bands narrowing from top to bottom: the widest top band is a vague worry, the middle band in a warning colour is only an interpretation, and the narrowest bottom band is a fact you can go and check.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">Push a worry down to a fact</text>

  <rect x="120" y="110" width="720" height="74" fill="var(--card)"/>
  <rect x="120" y="110" width="8" height="74" fill="var(--grey)"/>
  <text class="g" x="150" y="142">Will I lose my job</text>
  <text class="b" x="150" y="168">Vague worry</text>

  <path d="M480 190 L480 218 M470 208 L480 220 M490 208 L480 220" stroke="var(--dim)" stroke-width="2.5" fill="none"/>

  <rect x="200" y="226" width="560" height="74" fill="var(--card)"/>
  <rect x="200" y="226" width="8" height="74" fill="var(--warn)"/>
  <text class="g" x="230" y="258">My boss seems colder</text>
  <text class="b" x="230" y="284">My reading, not a fact</text>

  <path d="M480 306 L480 334 M470 324 L480 336 M490 324 L480 336" stroke="var(--dim)" stroke-width="2.5" fill="none"/>

  <rect x="280" y="342" width="400" height="74" fill="var(--card)"/>
  <rect x="280" y="342" width="8" height="74" fill="var(--accent)"/>
  <text class="g" x="310" y="374">Is my team still hiring</text>
  <text class="b" x="310" y="400">Checkable, go check</text>

  <text class="c" x="60" y="490">Stop at layer two and you just loop</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一百格中只填三格的方格陣，旁邊兩根等高的柱子代表泥炭地的碳與生物量加大氣的碳總和">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">3% 的陸地，裝著一整個碳庫</text>
<text x="90" y="150" font-size="19" fill="var(--dim)">全世界陸地（每格 1%）</text>
<rect x="90" y="170" width="240" height="240" fill="var(--card)"/>
<rect x="90" y="170" width="24" height="24" fill="var(--accent)"/>
<rect x="114" y="170" width="24" height="24" fill="var(--accent)"/>
<rect x="138" y="170" width="24" height="24" fill="var(--accent)"/>
<path d="M90 170 H330 M90 194 H330 M90 218 H330 M90 242 H330 M90 266 H330 M90 290 H330 M90 314 H330 M90 338 H330 M90 362 H330 M90 386 H330 M90 410 H330 M90 170 V410 M114 170 V410 M138 170 V410 M162 170 V410 M186 170 V410 M210 170 V410 M234 170 V410 M258 170 V410 M282 170 V410 M306 170 V410 M330 170 V410" stroke="var(--line)" fill="none"/>
<text x="90" y="442" font-size="16" fill="var(--ink)">泥炭地 3%</text>
<line x1="450" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="490" y="170" width="140" height="300" fill="var(--accent)"/>
<text x="470" y="150" font-size="19" fill="var(--ink)">泥炭地的碳</text>
<rect x="720" y="320" width="140" height="150" fill="var(--grey)"/>
<rect x="720" y="170" width="140" height="150" fill="var(--card)" stroke="var(--line)"/>
<text x="700" y="150" font-size="19" fill="var(--ink)">生物量 ＋ 大氣</text>
<text x="734" y="252" font-size="16" fill="var(--dim)">大氣</text>
<text x="734" y="402" font-size="16" fill="var(--page)">生物量</text>
<text x="490" y="512" font-size="22" fill="var(--ink)">排水＝拔掉保險栓</text>
</svg>
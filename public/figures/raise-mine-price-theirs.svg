<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="帳面上兩根等高相抵的柱子，感受上一小一大明顯不對稱">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
</defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">同一筆錢，兩本帳</text>
<rect x="60" y="90" width="400" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="90" width="400" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="86" y="130">帳面</text>
<text class="g" x="526" y="130">感受</text>
<line x1="90" y1="270" x2="430" y2="270" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="190" width="70" height="80" fill="var(--accent)" opacity="0.55"/>
<rect x="300" y="270" width="70" height="80" fill="var(--grey)" opacity="0.6"/>
<text class="s" x="140" y="180">加薪</text>
<text class="s" x="290" y="376">漲價</text>
<text class="g" x="216" y="410">相抵</text>
<line x1="530" y1="270" x2="870" y2="270" stroke="var(--line)" stroke-width="2"/>
<rect x="590" y="238" width="60" height="32" fill="var(--accent)" opacity="0.55"/>
<rect x="730" y="270" width="90" height="140" fill="var(--warn)" opacity="0.5"/>
<text class="s" x="566" y="228">我的功勞</text>
<text class="s" x="716" y="440">被拿走的</text>
<text class="c" x="60" y="500">實質沒動，感覺是淨損</text>
</svg>
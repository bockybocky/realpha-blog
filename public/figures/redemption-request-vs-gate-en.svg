<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two tall bars of redemption requests rise far above a low cap line, with the excess left outside the gate.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Who wants out, and how wide the door is</text>

<rect x="60" y="92" width="840" height="340" rx="10" fill="var(--card)"/>
<line x1="100" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>

<rect x="260" y="150" width="120" height="270" rx="6" fill="var(--grey)"/>
<text class="t" x="272" y="136" font-size="19" font-weight="700" fill="var(--dim)">16.8%</text>
<text class="t" x="272" y="452" font-size="16" fill="var(--dim)">Last quarter</text>

<rect x="480" y="182" width="120" height="238" rx="6" fill="var(--warn)"/>
<text class="t" x="492" y="168" font-size="19" font-weight="700" fill="var(--warn)">14.7%</text>
<text class="t" x="492" y="452" font-size="16" fill="var(--dim)">This quarter</text>

<rect x="700" y="340" width="120" height="80" rx="6" fill="var(--accent)"/>
<text class="t" x="712" y="326" font-size="19" font-weight="700" fill="var(--accent)">5%</text>
<text class="t" x="712" y="452" font-size="16" fill="var(--dim)">Cap</text>

<line x1="100" y1="340" x2="880" y2="340" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8 8"/>
<text class="t" x="100" y="330" font-size="16" fill="var(--accent)">The gate is here</text>

<text class="t" x="60" y="504" font-size="22" font-weight="700" fill="var(--ink)">Three times as many still waiting outside</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One body of material reaches a test and splits into two routes: the public part goes out to several services, the part that must not leave stays on a local machine behind a wall.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t h" x="48" y="54">One question, two routes</text>

  <rect x="48" y="250" width="150" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t g" x="123" y="285" text-anchor="middle">What you send</text>

  <path d="M 198 278 L 258 278" stroke="var(--grey)" stroke-width="3"/>
  <path d="M 258 278 l -12 -7 l 0 14 z" fill="var(--grey)"/>

  <path d="M 262 278 L 392 206 L 522 278 L 392 350 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
  <text class="t g" x="392" y="268" text-anchor="middle">If seen</text>
  <text class="t g" x="392" y="296" text-anchor="middle">what happens</text>

  <path d="M 392 206 L 392 150 L 640 150" stroke="var(--accent)" stroke-width="3" fill="none"/>
  <path d="M 640 150 l -12 -7 l 0 14 z" fill="var(--accent)"/>
  <text class="t s" x="412" y="140" fill="var(--accent)">Nothing</text>

  <path d="M 392 350 L 392 420 L 640 420" stroke="var(--warn)" stroke-width="3" fill="none"/>
  <path d="M 640 420 l -12 -7 l 0 14 z" fill="var(--warn)"/>
  <text class="t s" x="412" y="410" fill="var(--warn)">Harm</text>

  <g>
    <rect x="656" y="92" width="80" height="36" rx="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <rect x="748" y="92" width="80" height="36" rx="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <rect x="840" y="92" width="80" height="36" rx="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <rect x="656" y="140" width="80" height="36" rx="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <rect x="748" y="140" width="80" height="36" rx="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <rect x="840" y="140" width="80" height="36" rx="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <text class="t g" x="656" y="208" fill="var(--accent)">Many free routers</text>
  </g>

  <g>
    <line x1="648" y1="364" x2="648" y2="492" stroke="var(--warn)" stroke-width="4"/>
    <line x1="664" y1="364" x2="664" y2="492" stroke="var(--warn)" stroke-width="4"/>
    <rect x="700" y="388" width="200" height="72" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
    <text class="t g" x="800" y="432" text-anchor="middle">The box at home</text>
    <text class="t s" x="700" y="492">Never leaves home</text>
  </g>
</svg>
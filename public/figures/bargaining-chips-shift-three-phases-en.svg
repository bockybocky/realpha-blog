<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three seesaws go from tilting left to level to tilting right as the bargaining chips move from the data center end to the utility end.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .e { font-size:16px; }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="56" text-anchor="middle">The bargaining chips switched sides</text>
<text class="b" x="160" y="118" text-anchor="middle">Phase 1</text>
<text class="b" x="480" y="118" text-anchor="middle">Phase 2</text>
<text class="b" x="800" y="118" text-anchor="middle">Phase 3</text>
<text class="g" x="160" y="150" text-anchor="middle">Cloud · Bitcoin</text>
<text class="g" x="480" y="150" text-anchor="middle">Early AI</text>
<text class="g" x="800" y="150" text-anchor="middle">Now</text>
<polygon points="160,300 136,344 184,344" fill="var(--grey)"/>
<line x1="44" y1="329" x2="276" y2="271" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
<circle cx="62" cy="314" r="9" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<circle cx="62" cy="296" r="9" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<circle cx="82" cy="309" r="9" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<text class="e" x="50" y="364" text-anchor="middle">Data ctrs</text>
<text class="e" x="276" y="304" text-anchor="middle">Utility</text>
<polygon points="480,300 456,344 504,344" fill="var(--grey)"/>
<line x1="360" y1="300" x2="600" y2="300" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
<circle cx="382" cy="288" r="9" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<circle cx="578" cy="288" r="9" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<text class="e" x="372" y="334" text-anchor="middle">Data center</text>
<text class="e" x="588" y="334" text-anchor="middle">Utility</text>
<polygon points="800,300 776,344 824,344" fill="var(--grey)"/>
<line x1="684" y1="271" x2="916" y2="329" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
<circle cx="898" cy="314" r="9" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<circle cx="898" cy="296" r="9" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<circle cx="878" cy="309" r="9" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<text class="e" x="684" y="304" text-anchor="middle">Data center</text>
<text class="e" x="906" y="364" text-anchor="middle">Utility</text>
<rect x="75" y="398" width="170" height="38" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="e" x="160" y="423" text-anchor="middle">States compete with tax breaks</text>
<rect x="395" y="398" width="170" height="38" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="e" x="480" y="423" text-anchor="middle">Not naming a price yet</text>
<rect x="715" y="398" width="170" height="38" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="e" x="800" y="423" text-anchor="middle">Promise lower bills</text>
<line x1="120" y1="478" x2="826" y2="478" stroke="var(--grey)" stroke-width="3"/>
<polygon points="824,470 840,478 824,486" fill="var(--grey)"/>
<text class="c" x="480" y="530" text-anchor="middle">Local rates: who holds the chips</text>
</svg>
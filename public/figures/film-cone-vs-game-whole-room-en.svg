<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The left panel holds only a narrow camera wedge, while in the right panel the whole room is filled with blocks.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="60" font-size="27" fill="var(--ink)">How much has to be built</text>
<rect x="48" y="96" width="400" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<polygon points="92,386 372,186 372,276" fill="var(--grey)"/>
<circle cx="92" cy="386" r="11" fill="var(--accent)"/>
<rect x="356" y="196" width="40" height="80" rx="8" fill="var(--accent)"/>
<text x="120" y="150" font-size="20" fill="var(--ink)">Film</text>
<text x="120" y="180" font-size="16" fill="var(--dim)">Only what the camera sees</text>
<text x="288" y="398" font-size="16" fill="var(--dim)" text-anchor="end">The rest need not exist</text>
<rect x="512" y="96" width="400" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<g fill="var(--grey)">
<rect x="536" y="196" width="34" height="34" rx="4"/><rect x="580" y="196" width="34" height="34" rx="4"/><rect x="624" y="196" width="34" height="34" rx="4"/><rect x="668" y="196" width="34" height="34" rx="4"/><rect x="756" y="196" width="34" height="34" rx="4"/><rect x="800" y="196" width="34" height="34" rx="4"/><rect x="844" y="196" width="34" height="34" rx="4"/>
<rect x="536" y="240" width="34" height="34" rx="4"/><rect x="580" y="240" width="34" height="34" rx="4"/><rect x="668" y="240" width="34" height="34" rx="4"/><rect x="756" y="240" width="34" height="34" rx="4"/><rect x="800" y="240" width="34" height="34" rx="4"/><rect x="844" y="240" width="34" height="34" rx="4"/>
<rect x="536" y="284" width="34" height="34" rx="4"/><rect x="580" y="284" width="34" height="34" rx="4"/><rect x="624" y="284" width="34" height="34" rx="4"/><rect x="668" y="284" width="34" height="34" rx="4"/><rect x="712" y="284" width="34" height="34" rx="4"/><rect x="756" y="284" width="34" height="34" rx="4"/><rect x="800" y="284" width="34" height="34" rx="4"/><rect x="844" y="284" width="34" height="34" rx="4"/>
<rect x="536" y="328" width="34" height="34" rx="4"/><rect x="580" y="328" width="34" height="34" rx="4"/><rect x="624" y="328" width="34" height="34" rx="4"/><rect x="668" y="328" width="34" height="34" rx="4"/><rect x="712" y="328" width="34" height="34" rx="4"/><rect x="756" y="328" width="34" height="34" rx="4"/><rect x="800" y="328" width="34" height="34" rx="4"/><rect x="844" y="328" width="34" height="34" rx="4"/>
</g>
<rect x="712" y="196" width="34" height="78" rx="6" fill="var(--accent)"/>
<path d="M620 170 A 112 60 0 1 1 836 170" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 7"/>
<text x="540" y="150" font-size="20" fill="var(--ink)">Game</text>
<text x="540" y="180" font-size="16" fill="var(--dim)">All the camera might turn to</text>
<text x="48" y="482" font-size="22" fill="var(--ink)">The cost sits in what you never see</text>
</svg>
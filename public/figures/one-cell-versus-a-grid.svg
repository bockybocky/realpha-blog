<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊一個孤立方格，右邊一整張連續延伸的方格表">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<text x="60" y="72" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="27" fill="var(--ink)">一個結構，對上一整張表</text>

<text x="60" y="150" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">新進者</text>
<rect x="60" y="176" width="110" height="80" rx="8" fill="var(--card)" stroke="var(--grey)"/>
<text x="115" y="296" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">一格</text>

<line x1="240" y1="140" x2="240" y2="400" stroke="var(--line)"/>

<text x="300" y="150" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">已在場上的人</text>
<rect x="300" y="176" width="110" height="80" rx="8" fill="var(--accent)" opacity="0.85"/>
<rect x="424" y="176" width="110" height="80" rx="8" fill="var(--accent)" opacity="0.65"/>
<rect x="548" y="176" width="110" height="80" rx="8" fill="var(--accent)" opacity="0.45"/>
<rect x="672" y="176" width="110" height="80" rx="8" fill="var(--accent)" opacity="0.3"/>
<rect x="796" y="176" width="110" height="80" rx="8" fill="var(--accent)" opacity="0.18"/>
<text x="300" y="296" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">世代一</text>
<text x="796" y="296" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">再往後</text>

<rect x="300" y="330" width="606" height="40" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="320" y="356" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--dim)">錢　　設備　　做過的經驗</text>

<text x="60" y="450" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="22" fill="var(--ink)">攤開路線圖，比的不是這一格，是後面還有幾格</text>
</svg>
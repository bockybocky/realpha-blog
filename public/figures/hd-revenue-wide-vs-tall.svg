<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="三個長方形：起點正方形、納德利版本變寬不變高、布雷克版本幾乎不變寬但長高一倍多">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .v { font-size:19px; font-weight:700; }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="60" y="56" class="t">營收 ＝ 店數 × 每店營收</text>
<text x="60" y="90" class="b">寬＝店數　高＝每店營收　面積＝營收</text>
<line x1="50" y1="480" x2="910" y2="480" stroke="var(--line)" stroke-width="2"/>
<rect x="80" y="340" width="140" height="140" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<text x="150" y="516" class="g" text-anchor="middle">起點</text>
<rect x="300" y="340" width="140" height="140" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<rect x="440" y="340" width="112" height="140" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="426" y="516" class="g" text-anchor="middle">納德利</text>
<text x="426" y="544" class="b" text-anchor="middle">店數 ×1.8　每店 ≈ 持平</text>
<rect x="660" y="340" width="146" height="140" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<rect x="660" y="176" width="146" height="164" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="733" y="516" class="g" text-anchor="middle">布雷克</text>
<text x="733" y="544" class="b" text-anchor="middle">店數 ×1.04　每店 ×2.2</text>
<text x="496" y="330" class="b" text-anchor="middle">往旁邊長</text>
<text x="733" y="164" class="b" text-anchor="middle">往上長</text>
</svg>
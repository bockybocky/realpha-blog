<svg id="fig-iltb-9" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The threshold line moves down from high, and the large field of dots unlocked in between stands for the uncertain uses you could not afford to try before">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
#fig-iltb-9 text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-iltb-9 .t { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-iltb-9 .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-iltb-9 .b { font-size:16px; fill:var(--dim); }
#fig-iltb-9 .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<defs><marker id="ar9" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="var(--accent)"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="52">10x cheaper ≠ a discount</text>

<rect x="200" y="190" width="680" height="190" fill="var(--accent)" fill-opacity="0.14"/>

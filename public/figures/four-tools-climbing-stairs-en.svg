<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Four steps rise from lower left to upper right, the horizontal axis showing increasing difficulty and the vertical axis increasing power, with tiered interest on the top step.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Stronger, harder</text>

  <rect x="60" y="92" width="840" height="388" rx="10" fill="var(--card)"/>

  <line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="3"/>
  <line x1="120" y1="440" x2="120" y2="140" stroke="var(--line)" stroke-width="3"/>
  <text class="t" x="760" y="468" font-size="16" fill="var(--dim)">Hard →</text>
  <text class="t" x="132" y="160" font-size="16" fill="var(--dim)">↑ Power</text>

  <rect x="150" y="400" width="160" height="40" fill="var(--accent)" opacity="0.35"/>
  <rect x="330" y="340" width="160" height="100" fill="var(--accent)" opacity="0.5"/>
  <rect x="510" y="272" width="160" height="168" fill="var(--accent)" opacity="0.72"/>
  <rect x="690" y="176" width="160" height="264" fill="var(--warn)"/>

  <text class="t" x="150" y="388" font-size="19" font-weight="700" fill="var(--ink)">Ad hoc</text>
  <text class="t" x="330" y="328" font-size="19" font-weight="700" fill="var(--ink)">Signal</text>
  <text class="t" x="510" y="260" font-size="19" font-weight="700" fill="var(--ink)">Saving</text>
  <text class="t" x="690" y="164" font-size="19" font-weight="700" fill="var(--ink)">Tiered</text>

  <text class="t" x="150" y="424" font-size="15" fill="var(--dim)">In hand</text>
  <text class="t" x="330" y="424" font-size="15" fill="var(--dim)">Touchy</text>
  <text class="t" x="510" y="424" font-size="15" fill="var(--dim)">Code</text>
  <text class="t" x="690" y="424" font-size="15" fill="var(--page)">Hated</text>

  <text class="t" x="60" y="534" font-size="22" font-weight="700" fill="var(--ink)">Tools for the cornered day</text>
</svg>
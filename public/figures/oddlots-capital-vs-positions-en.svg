<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two horizontal bars, one short and one long: the short one is own capital, and the long one is the positions once leverage is counted.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="72" font-size="27" fill="var(--ink)">Capital vs positions</text>
<text x="60" y="140" font-size="19" fill="var(--dim)">Equity</text>
<rect x="60" y="154" width="124" height="58" fill="var(--accent)"/>
<text x="200" y="192" font-size="16" fill="var(--ink)">$300 to $350 billion</text>
<text x="60" y="262" font-size="19" fill="var(--dim)">With leverage</text>
<rect x="60" y="276" width="760" height="58" fill="var(--grey)"/>
<text x="84" y="312" font-size="16" fill="var(--ink)">~$2.2 trillion</text>
<text x="60" y="420" font-size="22" fill="var(--ink)">Same capital, ~6-7x exposure</text>
<text x="60" y="462" font-size="15" fill="var(--dim)">To scale</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Four states are placed on two axes by whether they are running and whether they need you, done has an arrow to idle, and unknown falls outside the axes.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="56" y="62" font-size="27" font-weight="700" fill="var(--ink)">Five states, only two are actually calling you</text>

  <rect x="120" y="100" width="560" height="360" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <line x1="400" y1="100" x2="400" y2="460" stroke="var(--line)" stroke-width="2"/>
  <line x1="120" y1="280" x2="680" y2="280" stroke="var(--line)" stroke-width="2"/>

  <text x="260" y="88" font-size="16" fill="var(--grey)" text-anchor="middle">running</text>
  <text x="540" y="88" font-size="16" fill="var(--grey)" text-anchor="middle">stopped</text>
  <text x="104" y="180" font-size="16" fill="var(--grey)" text-anchor="end">needs you</text>
  <text x="104" y="390" font-size="16" fill="var(--grey)" text-anchor="end">no input</text>

  <rect x="472" y="130" width="176" height="60" rx="10" fill="var(--warn)"/>
  <text x="560" y="158" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">blocked</text>
  <text x="560" y="180" font-size="15" fill="var(--page)" text-anchor="middle">waiting for approval</text>

  <rect x="472" y="204" width="176" height="60" rx="10" fill="var(--accent)"/>
  <text x="560" y="232" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">done</text>
  <text x="560" y="254" font-size="15" fill="var(--page)" text-anchor="middle">waiting for a look</text>

  <rect x="472" y="330" width="176" height="60" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="560" y="358" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">idle</text>
  <text x="560" y="380" font-size="15" fill="var(--dim)" text-anchor="middle">ready</text>

  <rect x="184" y="330" width="176" height="60" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="272" y="358" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">working</text>
  <text x="272" y="380" font-size="15" fill="var(--dim)" text-anchor="middle">computing</text>

  <path d="M672 234 C 716 234 716 356 672 356" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M680 350 L 668 358 L 681 364 Z" fill="var(--accent)"/>
  <text x="724" y="300" font-size="16" fill="var(--accent)">you looked</text>

  <rect x="120" y="486" width="300" height="62" rx="10" fill="var(--page)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="144" y="514" font-size="20" font-weight="700" fill="var(--dim)">unknown</text>
  <text x="144" y="536" font-size="15" fill="var(--grey)">an agent, state unreadable</text>
  <text x="444" y="522" font-size="16" fill="var(--grey)">off the axes is not done</text>
</svg>
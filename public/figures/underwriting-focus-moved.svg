<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="審查重心由單一塊變成兩塊的前後對比">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">放款人在看誰</text>

<text x="150" y="130" font-size="19" fill="var(--dim)">六個月前</text>
<rect x="150" y="150" width="240" height="260" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="186" y="290" font-size="20" fill="var(--accent)">承租方信用</text>

<line x1="440" y1="280" x2="508" y2="280" stroke="var(--dim)" stroke-width="3"/>
<polygon points="508,270 532,280 508,290" fill="var(--dim)"/>

<text x="570" y="130" font-size="19" fill="var(--ink)">現在</text>
<rect x="570" y="150" width="240" height="140" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="606" y="228" font-size="20" fill="var(--accent)">承租方信用</text>
<rect x="570" y="298" width="240" height="112" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="606" y="346" font-size="20" fill="var(--warn)">營運者能力</text>
<text x="606" y="376" font-size="16" fill="var(--dim)">服務水準．部署經驗</text>

<text x="60" y="470" font-size="22" fill="var(--ink)">照付不議，要先有人把機器顧好</text>
</svg>
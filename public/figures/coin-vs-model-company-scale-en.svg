<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The large circle is $1T, the small circle at its bottom is $100B with an arrow pointing up, and a tiny coin in the lower left is $5B, with areas to scale.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:20px;font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700}
    .a{fill:var(--accent)}
    .w{fill:var(--warn)}
</style>
<defs><marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker></defs>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="62">A curb coin</text>
<text class="b" x="60" y="100">Revenue $, area to scale</text>
<circle cx="620" cy="330" r="220" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="620" y="160" text-anchor="middle">$1T</text>
<text class="b" x="620" y="186" text-anchor="middle">Lab target</text>
<circle cx="620" cy="480" r="70" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="620" y="484" text-anchor="middle">$100B</text>
<text class="b" x="620" y="508" text-anchor="middle">Now</text>
<line x1="620" y1="402" x2="620" y2="212" stroke="var(--dim)" stroke-width="2" marker-end="url(#ar4)"/>
<text class="b" x="180" y="488" text-anchor="middle">Rogo</text>
<circle cx="180" cy="520" r="16" fill="var(--warn)"/>
<text class="g w" x="206" y="527">$5B</text>
<text class="c" x="60" y="400">Stop? Nope.</text>
</svg>
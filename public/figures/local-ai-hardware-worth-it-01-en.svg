<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="A four-quadrant chart: the horizontal axis is whether it must stay on, the vertical is whether it must be fast after you press go. The low-power mini PC sits top left, the discrete graphics card bottom right, each need in its own quadrant; and the bottom-left cell — occasional use, no rush — holds the most people yet no review talks about it, where the answer is to stay on the cloud.">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #b9c2d0;
      --accent: #1f6feb;
      --warn:   #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #4a5464;
        --accent: #58a6ff;
        --warn:   #d29922;
      }
    }
    .t    { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1   { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .cap  { font-size: 19px; font-weight: 700; fill: var(--dim); }
    .capA { font-size: 19px; font-weight: 700; fill: var(--accent); }
    .capW { font-size: 19px; font-weight: 700; fill: var(--warn); }
    .body { font-size: 17px; fill: var(--dim); }
    .ax   { font-size: 17px; font-weight: 700; fill: var(--dim); }
    .axs  { font-size: 15px; fill: var(--dim); }
    .who  { font-size: 15px; font-weight: 700; fill: var(--page); }
  </style>

  <rect x="0" y="0" width="960" height="620" fill="var(--page)"/>

  <text class="t h1" x="40" y="48">One box, two measures, two verdicts</text>

  <!-- 四象限底 -->
  <rect x="150" y="90" width="340" height="210" fill="var(--card)" stroke="var(--line)"/>
  <rect x="490" y="90" width="340" height="210" fill="var(--card)" stroke="var(--line)"/>
  <rect x="150" y="300" width="340" height="210" fill="var(--card)" stroke="var(--line)"/>
  <rect x="490" y="300" width="340" height="210" fill="var(--card)" stroke="var(--line)"/>

  <!-- 中軸線 -->
  <line x1="490" y1="90" x2="490" y2="510" stroke="var(--line)" stroke-width="2"/>
  <line x1="150" y1="300" x2="830" y2="300" stroke="var(--line)" stroke-width="2"/>

  <!-- 左上：省電小主機 -->
  <circle cx="290" cy="150" r="30" fill="var(--accent)"/>
  <text class="t who" x="290" y="156" text-anchor="middle">Xiaotian</text>
  <text class="t capA" x="180" y="215">Mini PC</text>
  <text class="t body" x="180" y="243">~15W</text>
  <text class="t body" x="180" y="267">Always on</text>

  <!-- 右上：兩者都要 -->
  <text class="t cap" x="520" y="215">Both</text>
  <text class="t body" x="520" y="243">Build a box</text>
  <text class="t body" x="520" y="267">Costliest</text>

  <!-- 左下：多數人在這 -->
  <text class="t cap" x="180" y="355">Rare use, no rush</text>
  <text class="t body" x="180" y="383">Most people here</text>
  <text class="t body" x="180" y="407">No reviews here</text>
  <text class="t capW" x="180" y="443">Answer: use cloud</text>

  <!-- 右下：獨立顯示卡 -->
  <circle cx="700" cy="440" r="30" fill="var(--accent)"/>
  <text class="t who" x="700" y="446" text-anchor="middle">Lunchuizhe</text>
  <text class="t capA" x="520" y="355">Discrete GPU</text>
  <text class="t body" x="520" y="383">Fast</text>
  <text class="t body" x="520" y="407">Thirsty, fiddly</text>

  <!-- 軸標 -->
  <text class="t ax" x="150" y="545" text-anchor="start">No rush</text>
  <text class="t ax" x="830" y="545" text-anchor="end">Must be fast</text>
  <text class="t axs" x="490" y="545" text-anchor="middle">← how long you'll wait →</text>

  <text class="t ax" x="132" y="120" text-anchor="end">Must stay</text>
  <text class="t ax" x="132" y="142" text-anchor="end">on</text>
  <text class="t ax" x="132" y="470" text-anchor="end">Off when</text>
  <text class="t ax" x="132" y="492" text-anchor="end">done</text>

  <text class="t body" x="40" y="592">Both numbers are right; different questions</text>
</svg>

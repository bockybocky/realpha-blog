<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左為星狀結構，中心被打叉後外圍節點全灰；右為網狀結構，去掉一點後其餘節點仍彼此相連">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">拔掉哪一個，整件事停擺</text>

<text class="t" x="60" y="122" font-size="19" font-weight="700" fill="var(--dim)">收束在一個人</text>
<g stroke="var(--grey)" stroke-width="2">
<line x1="250" y1="300" x2="250" y2="180"/>
<line x1="250" y1="300" x2="356" y2="238"/>
<line x1="250" y1="300" x2="356" y2="362"/>
<line x1="250" y1="300" x2="250" y2="420"/>
<line x1="250" y1="300" x2="144" y2="362"/>
<line x1="250" y1="300" x2="144" y2="238"/>
</g>
<g fill="var(--grey)">
<circle cx="250" cy="180" r="14"/><circle cx="356" cy="238" r="14"/>
<circle cx="356" cy="362" r="14"/><circle cx="250" cy="420" r="14"/>
<circle cx="144" cy="362" r="14"/><circle cx="144" cy="238" r="14"/>
</g>
<circle cx="250" cy="300" r="26" fill="none" stroke="var(--warn)" stroke-width="3"/>
<line x1="234" y1="284" x2="266" y2="316" stroke="var(--warn)" stroke-width="3"/>
<line x1="266" y1="284" x2="234" y2="316" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="196" y="486" font-size="16" fill="var(--dim)">抓走這個人就夠</text>

<line x1="480" y1="140" x2="480" y2="500" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="560" y="122" font-size="19" font-weight="700" fill="var(--accent)">分散</text>
<g stroke="var(--accent)" stroke-width="2">
<line x1="620" y1="200" x2="760" y2="190"/>
<line x1="760" y1="190" x2="840" y2="300"/>
<line x1="840" y1="300" x2="740" y2="400"/>
<line x1="740" y1="400" x2="600" y2="380"/>
<line x1="600" y1="380" x2="620" y2="200"/>
<line x1="620" y1="200" x2="740" y2="400"/>
<line x1="760" y1="190" x2="600" y2="380"/>
</g>
<g fill="var(--accent)">
<circle cx="620" cy="200" r="13"/><circle cx="760" cy="190" r="13"/>
<circle cx="840" cy="300" r="13"/><circle cx="740" cy="400" r="13"/>
<circle cx="600" cy="380" r="13"/>
</g>
<circle cx="700" cy="300" r="13" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 4"/>
<text class="t" x="560" y="486" font-size="16" fill="var(--dim)">少一個，其餘照連</text>

<text class="t" x="60" y="536" font-size="22" fill="var(--ink)">風險位置，跟它貢獻多少營收沒關係</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="平常視窗與無痕視窗的手續費差距對比，兩條橫條長度懸殊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">同一個座位，兩種手續費</text>
  <text class="t" x="60" y="104" font-size="16" fill="var(--dim)">同一場、同一排、同一個位子</text>

  <text class="t" x="60" y="222" font-size="19" font-weight="700" fill="var(--ink)">平常視窗</text>
  <rect x="220" y="186" width="560" height="56" rx="6" fill="var(--warn)"/>
  <text class="t" x="800" y="224" font-size="19" font-weight="700" fill="var(--warn)">60 美元</text>

  <text class="t" x="60" y="348" font-size="19" font-weight="700" fill="var(--ink)">無痕視窗</text>
  <rect x="220" y="312" width="37" height="56" rx="6" fill="var(--accent)"/>
  <text class="t" x="277" y="350" font-size="19" font-weight="700" fill="var(--accent)">4 美元</text>

  <text class="t" x="60" y="452" font-size="22" font-weight="700" fill="var(--ink)">差額那一截，報的是你這個人</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="管線圖：前段產能高，中間後段封裝是窄口，右邊實際出貨只等於窄口的高度">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="480" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">後段卡住，前段就放不出量</text>

  <rect x="80" y="130" width="200" height="250" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="180" y="248" text-anchor="middle" font-size="20" fill="var(--ink)">前段產能</text>
  <text x="180" y="278" text-anchor="middle" font-size="15" fill="var(--dim)">能開的量</text>

  <polygon points="280,130 440,215 440,325 280,380" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>

  <rect x="570" y="130" width="300" height="85" fill="none" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="720" y="180" text-anchor="middle" font-size="16" fill="var(--dim)">開不出來</text>
  <rect x="570" y="325" width="300" height="55" fill="none" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="720" y="360" text-anchor="middle" font-size="16" fill="var(--dim)">開不出來</text>

  <rect x="570" y="215" width="300" height="110" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="720" y="263" text-anchor="middle" font-size="20" fill="var(--ink)">實際出貨</text>
  <text x="720" y="292" text-anchor="middle" font-size="15" fill="var(--dim)">等於窄口</text>

  <rect x="428" y="170" width="154" height="200" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="505" y="158" text-anchor="middle" font-size="15" fill="var(--accent)">還能放寬</text>

  <rect x="440" y="215" width="130" height="110" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text x="505" y="262" text-anchor="middle" font-size="19" font-weight="700" fill="var(--warn)">後段封裝</text>
  <text x="505" y="290" text-anchor="middle" font-size="15" fill="var(--warn)">現在最緊</text>

  <text x="480" y="478" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">決定出貨的，是最窄的那一段</text>
</svg>
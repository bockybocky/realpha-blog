<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The timeline shows only four equal downward bars in 31 years, with the first three in separate disaster years and the last isolated at the far right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">Only a handful in 31 years</text>
<text x="60" y="104" font-size="19" fill="var(--dim)">−20 basis points in one day</text>

<line x1="60" y1="150" x2="900" y2="150" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="60" y1="380" x2="900" y2="380" stroke="var(--grey)" stroke-width="3"/>

<rect x="176" y="150" width="48" height="230" fill="var(--grey)"/>
<text x="200" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">911</text>

<rect x="336" y="150" width="48" height="230" fill="var(--grey)"/>
<text x="360" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">Lehman</text>

<rect x="496" y="150" width="48" height="230" fill="var(--grey)"/>
<text x="520" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">COVID</text>

<rect x="806" y="150" width="48" height="230" fill="var(--warn)"/>
<text x="830" y="412" font-size="16" fill="var(--warn)" text-anchor="middle">A Thursday</text>

<text x="60" y="464" font-size="19" fill="var(--dim)">1995</text>
<text x="900" y="464" font-size="19" fill="var(--dim)" text-anchor="end">This year</text>

<text x="60" y="512" font-size="22" fill="var(--ink)">Same move, no disaster this time</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The timeline has three phases, the remembered sampling window covers only the last one, and an arrow moves it back to the beginning out of place.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  .h{font-size:27px;font-weight:700;fill:var(--ink)}
  .g{font-size:19px;font-weight:700;fill:var(--ink)}
  .b{font-size:16px;fill:var(--dim)}
  .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker></defs>
<text class="t h" x="60" y="72">Three phases of one war</text>
<rect x="60" y="160" width="300" height="110" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="84" y="196">Maneuver still worked</text>
<text class="t b" x="84" y="228">Drones as artillery's eyes</text>
<text class="t b" x="84" y="252">Attack and counterattack</text>
<rect x="372" y="160" width="150" height="110" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="396" y="196">Transition</text>
<text class="t b" x="396" y="228">FPV arrives</text>
<rect x="534" y="160" width="366" height="110" rx="8" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)"/>
<text class="t g" x="558" y="196">Lines freeze</text>
<text class="t b" x="558" y="228">Drones define it</text>
<text class="t b" x="558" y="252">Maneuver locked out</text>
<line x1="60" y1="310" x2="900" y2="310" stroke="var(--grey)" stroke-width="2"/>
<line x1="60" y1="302" x2="60" y2="318" stroke="var(--grey)" stroke-width="2"/>
<line x1="372" y1="302" x2="372" y2="318" stroke="var(--grey)" stroke-width="2"/>
<line x1="534" y1="302" x2="534" y2="318" stroke="var(--grey)" stroke-width="2"/>
<line x1="900" y1="302" x2="900" y2="318" stroke="var(--grey)" stroke-width="2"/>
<text class="t b" x="60" y="342">2022 war begins</text>
<text class="t b" x="340" y="342">Early 2023</text>
<text class="t b" x="502" y="342">Late summer 2023</text>
<text class="t b" x="836" y="342">Now</text>
<rect x="534" y="382" width="366" height="72" rx="8" fill="none" stroke="var(--accent)" stroke-dasharray="7 6"/>
<text class="t g" x="558" y="414" fill="var(--accent)">The war in our heads</text>
<text class="t b" x="558" y="440">Drones plus guns plus armor</text>
<path d="M530 418 L180 418" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a1)" fill="none"/>
<text class="t g" x="196" y="402" fill="var(--warn)">Moved to day one of the next war</text>
<text class="t c" x="60" y="512">This is the endgame, not the next opening</text>
</svg>
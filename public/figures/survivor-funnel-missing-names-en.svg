<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A funnel with a broad field of grey dots on top and only two or three named dots at the bottom.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="62">Books only keep the funnel's tip</text>
<path d="M150 110 L810 110 L560 380 L400 380 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--grey)">
  <circle cx="190" cy="140" r="7"/><circle cx="240" cy="140" r="7"/><circle cx="290" cy="140" r="7"/>
  <circle cx="340" cy="140" r="7"/><circle cx="390" cy="140" r="7"/><circle cx="440" cy="140" r="7"/>
  <circle cx="490" cy="140" r="7"/><circle cx="540" cy="140" r="7"/><circle cx="590" cy="140" r="7"/>
  <circle cx="640" cy="140" r="7"/><circle cx="690" cy="140" r="7"/><circle cx="740" cy="140" r="7"/>
  <circle cx="215" cy="180" r="7"/><circle cx="265" cy="180" r="7"/><circle cx="315" cy="180" r="7"/>
  <circle cx="365" cy="180" r="7"/><circle cx="415" cy="180" r="7"/><circle cx="465" cy="180" r="7"/>
  <circle cx="515" cy="180" r="7"/><circle cx="565" cy="180" r="7"/><circle cx="615" cy="180" r="7"/>
  <circle cx="665" cy="180" r="7"/><circle cx="715" cy="180" r="7"/>
  <circle cx="260" cy="220" r="7"/><circle cx="310" cy="220" r="7"/><circle cx="360" cy="220" r="7"/>
  <circle cx="410" cy="220" r="7"/><circle cx="460" cy="220" r="7"/><circle cx="510" cy="220" r="7"/>
  <circle cx="560" cy="220" r="7"/><circle cx="610" cy="220" r="7"/><circle cx="660" cy="220" r="7"/>
  <circle cx="330" cy="262" r="7"/><circle cx="380" cy="262" r="7"/><circle cx="430" cy="262" r="7"/>
  <circle cx="480" cy="262" r="7"/><circle cx="530" cy="262" r="7"/><circle cx="580" cy="262" r="7"/>
</g>
<text class="s" x="150" y="100">Same cohort, same playbook</text>
<circle cx="440" cy="330" r="10" fill="var(--accent)"/>
<circle cx="480" cy="330" r="10" fill="var(--accent)"/>
<circle cx="520" cy="330" r="10" fill="var(--accent)"/>
<text class="g" x="600" y="338">The few who got named</text>
<text class="c" x="150" y="446">The losers' names are in no book</text>
</svg>
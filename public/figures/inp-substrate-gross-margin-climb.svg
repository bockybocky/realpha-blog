<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="毛利率折線逐季陡升，從兩成出頭抬到五成六，最後一段為虛線估計" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <text x="60" y="56" font-size="27" fill="var(--ink)">毛利率是要寫進財報的欄位</text>
  <line x1="120" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
  <line x1="120" y1="120" x2="120" y2="420" stroke="var(--line)" stroke-width="2"/>
  <text x="60" y="126" font-size="16" fill="var(--dim)">60%</text>
  <text x="60" y="276" font-size="16" fill="var(--dim)">30%</text>

  <polyline points="200,336 370,292 540,195 710,140" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <polyline points="710,140 860,120" fill="none" stroke="var(--warn)" stroke-width="5" stroke-dasharray="8 6"/>
  <g fill="var(--accent)">
    <circle cx="200" cy="336" r="8"/><circle cx="370" cy="292" r="8"/>
    <circle cx="540" cy="195" r="8"/><circle cx="710" cy="140" r="8"/>
  </g>
  <circle cx="860" cy="120" r="8" fill="none" stroke="var(--warn)" stroke-width="3"/>

  <text x="170" y="320" font-size="16" fill="var(--ink)">20.9%</text>
  <text x="340" y="276" font-size="16" fill="var(--ink)">29.6%</text>
  <text x="510" y="178" font-size="16" fill="var(--ink)">44.9%</text>
  <text x="680" y="122" font-size="16" fill="var(--ink)">56.0%</text>
  <text x="806" y="102" font-size="16" fill="var(--warn)">估 超過 60%</text>

  <text x="166" y="448" font-size="15" fill="var(--dim)">2025 第四季</text>
  <text x="336" y="448" font-size="15" fill="var(--dim)">2026 第一季</text>
  <text x="510" y="448" font-size="15" fill="var(--dim)">第二季</text>
  <text x="680" y="448" font-size="15" fill="var(--dim)">第三季</text>
  <text x="830" y="448" font-size="15" fill="var(--warn)">第四季</text>

  <text x="60" y="500" font-size="22" fill="var(--ink)">一年前它被當成快死的公司。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The top row pairs a large circle with a long bar, the bottom row a small circle with a very short bar.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="480" y="54" text-anchor="middle" font-size="27" fill="var(--ink)">The same four-minute video going in</text>

<circle cx="170" cy="197" r="54" fill="var(--grey)"/>
<text x="170" y="278" text-anchor="middle" font-size="15" fill="var(--dim)">2 billion parameters</text>
<text x="300" y="158" font-size="16" fill="var(--dim)">Xiaotian's Mac mini</text>
<rect x="300" y="175" width="520" height="44" rx="6" fill="var(--grey)"/>
<text x="832" y="204" font-size="16" fill="var(--ink)">127 s</text>

<circle cx="170" cy="377" r="24" fill="var(--accent)"/>
<text x="170" y="428" text-anchor="middle" font-size="15" fill="var(--dim)">About 400 million</text>
<text x="300" y="338" font-size="16" fill="var(--dim)">My Windows, CPU only</text>
<rect x="300" y="355" width="41" height="44" rx="6" fill="var(--accent)"/>
<text x="355" y="384" font-size="16" fill="var(--ink)">Under 10 s</text>

<text x="480" y="492" text-anchor="middle" font-size="22" fill="var(--ink)">One size class up, one order of magnitude of waiting</text>
</svg>
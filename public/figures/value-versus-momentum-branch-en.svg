<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One rising price line forks partway: the upper branch means momentum buys more as it rises, the lower branch means value trims as it rises">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs>
<marker id="ua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
<marker id="uw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker>
</defs>
<text class="t" x="60" y="62">Which system are you on?</text>
<line x1="120" y1="430" x2="890" y2="430" stroke="var(--line)" stroke-width="2"/>
<polyline points="140,400 240,362 330,330 420,262 500,190" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="500" cy="190" r="9" fill="var(--ink)"/>
<text class="b" x="270" y="418" text-anchor="middle">One rise</text>
<path d="M512,182 L840,118" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#ua)"/>
<path d="M512,200 L840,322" fill="none" stroke="var(--warn)" stroke-width="4" marker-end="url(#uw)"/>
<text class="g" x="866" y="112" text-anchor="end" fill="var(--accent)">Momentum: add</text>
<text class="b" x="866" y="140" text-anchor="end">Trends persist</text>
<text class="g" x="866" y="356" text-anchor="end" fill="var(--warn)">Value: trim</text>
<text class="b" x="866" y="384" text-anchor="end">Price converges</text>
<text class="c" x="60" y="486">Both work; mixing loses</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The same falling curve twice: one rectangle catches a small area on the left, and a four-step ladder fills the area beneath it on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="60" y="56" font-size="27" fill="var(--ink)">What she refused was the either-or</text>

  <text x="80" y="104" font-size="20" fill="var(--dim)">One price</text>
  <text x="520" y="104" font-size="20" fill="var(--accent)">A ladder</text>

  <text x="80" y="132" font-size="15" fill="var(--dim)">Willingness to pay</text>
  <line x1="80" y1="140" x2="80" y2="420" stroke="var(--grey)" stroke-width="2"/>
  <line x1="80" y1="420" x2="450" y2="420" stroke="var(--grey)" stroke-width="2"/>
  <rect x="80" y="250" width="130" height="170" fill="var(--accent)" opacity="0.18"/>
  <rect x="80" y="250" width="130" height="170" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <path d="M 80 152 C 190 214, 268 340, 450 402" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
  <text x="145" y="342" font-size="15" fill="var(--dim)" text-anchor="middle">Who is caught</text>
  <text x="450" y="444" font-size="15" fill="var(--dim)" text-anchor="end">Readers</text>

  <text x="520" y="132" font-size="15" fill="var(--dim)">Willingness to pay</text>
  <line x1="520" y1="140" x2="520" y2="420" stroke="var(--grey)" stroke-width="2"/>
  <line x1="520" y1="420" x2="890" y2="420" stroke="var(--grey)" stroke-width="2"/>
  <rect x="520" y="180" width="80" height="240" fill="var(--accent)" opacity="0.18"/>
  <rect x="600" y="250" width="80" height="170" fill="var(--accent)" opacity="0.18"/>
  <rect x="680" y="326" width="100" height="94" fill="var(--accent)" opacity="0.18"/>
  <rect x="780" y="382" width="110" height="38" fill="var(--accent)" opacity="0.18"/>
  <path d="M 520 180 L 600 180 L 600 250 L 680 250 L 680 326 L 780 326 L 780 382 L 890 382" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <path d="M 520 152 C 630 214, 708 340, 890 402" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
  <text x="560" y="206" font-size="15" fill="var(--dim)" text-anchor="middle">All access</text>
  <text x="640" y="276" font-size="15" fill="var(--dim)" text-anchor="middle">Family</text>
  <text x="730" y="352" font-size="15" fill="var(--dim)" text-anchor="middle">News</text>
  <text x="835" y="408" font-size="15" fill="var(--dim)" text-anchor="middle">$1/week</text>
  <text x="890" y="444" font-size="15" fill="var(--dim)" text-anchor="end">Readers</text>

  <text x="480" y="512" font-size="22" fill="var(--ink)" text-anchor="middle">Same curve, very different numbers caught</text>
</svg>
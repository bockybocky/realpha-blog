<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一組數字分岔成兩種解釋，舊卡續約漲價這道閘門把需求轉弱那條路關掉，只剩供給跟不上那條路通行">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">兩種解釋，一道證據關掉一條</text>

  <rect x="50" y="235" width="180" height="70" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="140" y="277" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">同一組數字</text>

  <path d="M 230 260 C 320 260 330 170 420 170" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M 230 280 C 320 280 330 370 420 370" fill="none" stroke="var(--accent)" stroke-width="3"/>

  <rect x="420" y="140" width="130" height="60" rx="6" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="485" y="177" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">閘門</text>
  <text class="t" x="485" y="124" font-size="16" fill="var(--warn)" text-anchor="middle">舊卡續約還能漲價</text>

  <line x1="562" y1="150" x2="608" y2="190" stroke="var(--warn)" stroke-width="5"/>
  <line x1="608" y1="150" x2="562" y2="190" stroke="var(--warn)" stroke-width="5"/>

  <rect x="650" y="140" width="250" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-dasharray="6 5"/>
  <text class="t" x="775" y="177" font-size="20" fill="var(--grey)" text-anchor="middle">需求熄火</text>

  <path d="M 420 370 L 630 370" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="650,370 630,361 630,379" fill="var(--accent)"/>
  <rect x="650" y="340" width="250" height="60" rx="8" fill="var(--accent)" opacity="0.18" stroke="var(--accent)"/>
  <text class="t" x="775" y="377" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">東西做不出來</text>

  <text class="t" x="480" y="470" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">缺的在電力與許可，不在客戶的意願</text>
</svg>
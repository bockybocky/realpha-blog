<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The dividing lines of the household bar and the stock-holdings bar line up nowhere." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">One market, two ways to slice it</text>

<text x="60" y="130" font-size="19" fill="var(--dim)">Households　ranked by wealth</text>
<rect x="60" y="150" width="6" height="70" fill="var(--accent)"/>
<rect x="68" y="150" width="292" height="70" fill="var(--grey)"/>
<rect x="362" y="150" width="298" height="70" fill="var(--grey)"/>
<line x1="60" y1="150" x2="660" y2="150" stroke="var(--line)" stroke-width="1"/>
<text x="76" y="140" font-size="15" fill="var(--accent)">Top 1%</text>
<text x="214" y="195" font-size="16" fill="var(--ink)" text-anchor="middle">Middle 49%</text>
<text x="511" y="195" font-size="16" fill="var(--ink)" text-anchor="middle">Bottom 50%</text>

<line x1="66" y1="230" x2="360" y2="310" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="360" y1="230" x2="654" y2="310" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="660" y1="230" x2="660" y2="310" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4"/>

<text x="60" y="350" font-size="19" fill="var(--dim)">The stocks each group holds</text>
<rect x="60" y="370" width="300" height="70" fill="var(--accent)"/>
<rect x="362" y="370" width="292" height="70" fill="var(--grey)"/>
<rect x="656" y="370" width="6" height="70" fill="var(--grey)"/>
<text x="210" y="415" font-size="20" fill="var(--page)" text-anchor="middle">Half</text>
<text x="508" y="415" font-size="16" fill="var(--ink)" text-anchor="middle">49%</text>
<text x="676" y="415" font-size="15" fill="var(--dim)">1%</text>

<text x="60" y="505" font-size="22" fill="var(--ink)">A rising index does not mean every household is rising</text>
</svg>
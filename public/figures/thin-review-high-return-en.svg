<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A four-quadrant chart with asset condition projects in the upper-left corner of thin review and high return.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="58">Money→</text>

<rect x="180" y="110" width="660" height="360" fill="var(--card)" stroke="var(--line)"/>
<line x1="510" y1="110" x2="510" y2="470" stroke="var(--line)"/>
<line x1="180" y1="290" x2="840" y2="290" stroke="var(--line)"/>

<text class="b" x="190" y="100">Hi ROE</text>
<text class="b" x="190" y="492">Lo ROE</text>
<text class="b" x="180" y="520">Thin</text>
<text class="b" x="840" y="520" text-anchor="end">Thick</text>

<circle cx="300" cy="200" r="30" fill="var(--warn)"/>
<text class="g" x="345" y="196" fill="var(--warn)">Condition</text>
<text class="b" x="345" y="222">Poles</text>

<circle cx="680" cy="210" r="18" fill="var(--accent)"/>
<text class="g" x="712" y="216" fill="var(--accent)">New Tx</text>

<circle cx="690" cy="390" r="14" fill="var(--grey)"/>
<text class="g" x="718" y="396" fill="var(--dim)">Optimize</text>

<text class="c" x="60" y="568">Fastest rise, thin review</text>
</svg>
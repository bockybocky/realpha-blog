<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two grouped bars compare the World Cup with the Los Angeles Olympics: athletes number 600 against 17,000, a huge gap in bar length, and tickets 6.5 million against 15 million.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600}
.b{font-size:16px}
.d{font-size:15px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">Both called mega-events, an order apart</text>
<text class="d" x="60" y="92">2026 World Cup vs 2028 LA Olympics and Paralympics</text>
<text class="g" x="60" y="152">Athletes</text>
<rect x="60" y="170" width="30" height="34" rx="4" fill="var(--grey)"/>
<text class="b" x="102" y="193">600 / World Cup</text>
<rect x="60" y="216" width="840" height="34" rx="4" fill="var(--accent)"/>
<text x="884" y="239" text-anchor="end" style="font-size:16px;fill:var(--page)">17,000 / LA</text>
<text class="g" x="60" y="304">Tickets</text>
<rect x="60" y="322" width="364" height="34" rx="4" fill="var(--grey)"/>
<text class="b" x="436" y="345">6.5M / World Cup</text>
<rect x="60" y="368" width="840" height="34" rx="4" fill="var(--accent)"/>
<text x="884" y="391" text-anchor="end" style="font-size:16px;fill:var(--page)">15M / LA</text>
<text class="c" x="60" y="462">One city, nine in ten sports at once</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩組柱子，左邊每年頂端被切一小塊、長得矮；右邊只有最後一根被切、整組更高">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">被打斷的次數，決定最後的高度</text>
<text class="b" x="60" y="94">每一塊橘色＝那一年被拿走的部分</text>
<line x1="100" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="110" y="130" fill="var(--warn)">股息：每年課一次</text>
<rect x="130" y="400" width="26" height="40" fill="var(--grey)"/><rect x="130" y="394" width="26" height="6" fill="var(--warn)"/>
<rect x="172" y="384" width="26" height="56" fill="var(--grey)"/><rect x="172" y="378" width="26" height="6" fill="var(--warn)"/>
<rect x="214" y="366" width="26" height="74" fill="var(--grey)"/><rect x="214" y="360" width="26" height="6" fill="var(--warn)"/>
<rect x="256" y="346" width="26" height="94" fill="var(--grey)"/><rect x="256" y="340" width="26" height="6" fill="var(--warn)"/>
<rect x="298" y="324" width="26" height="116" fill="var(--grey)"/><rect x="298" y="318" width="26" height="6" fill="var(--warn)"/>
<rect x="340" y="300" width="26" height="140" fill="var(--grey)"/><rect x="340" y="294" width="26" height="6" fill="var(--warn)"/>
<rect x="382" y="274" width="26" height="166" fill="var(--grey)"/><rect x="382" y="268" width="26" height="6" fill="var(--warn)"/>
<rect x="424" y="246" width="26" height="194" fill="var(--grey)"/><rect x="424" y="240" width="26" height="6" fill="var(--warn)"/>
<text class="g" x="520" y="130" fill="var(--accent)">資本利得：賣掉前遞延</text>
<rect x="540" y="390" width="26" height="50" fill="var(--accent)" fill-opacity="0.8"/>
<rect x="582" y="368" width="26" height="72" fill="var(--accent)" fill-opacity="0.8"/>
<rect x="624" y="342" width="26" height="98" fill="var(--accent)" fill-opacity="0.8"/>
<rect x="666" y="312" width="26" height="128" fill="var(--accent)" fill-opacity="0.8"/>
<rect x="708" y="278" width="26" height="162" fill="var(--accent)" fill-opacity="0.8"/>
<rect x="750" y="240" width="26" height="200" fill="var(--accent)" fill-opacity="0.8"/>
<rect x="792" y="198" width="26" height="242" fill="var(--accent)" fill-opacity="0.8"/>
<rect x="834" y="152" width="26" height="288" fill="var(--accent)" fill-opacity="0.8"/>
<rect x="834" y="142" width="26" height="10" fill="var(--warn)"/>
<text class="b" x="540" y="130"> </text>
<text class="b" x="760" y="128">只切最後一次</text>
<text class="b" x="130" y="472">第 1 年</text>
<text class="b" x="402" y="472">第 8 年</text>
<text class="b" x="540" y="472">第 1 年</text>
<text class="b" x="812" y="472">第 8 年</text>
<text class="c" x="60" y="528">損失的不是那筆稅，是它之後會長出來的部分</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條形狀完全相同的下降折線，下方那條是上方的複製品；右側獨立評價的框被灰掉並標示 2028 才解鎖">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="56" y="66">換股比 4.5 : 1</text>
<rect x="56" y="100" width="540" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<polyline points="100,160 160,186 220,170 280,218 340,206 400,252 460,242 540,278" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polyline points="100,268 160,294 220,278 280,326 340,314 400,360 460,350 540,386" fill="none" stroke="var(--grey)" stroke-width="5" stroke-dasharray="10 7"/>
<text class="g" x="100" y="146">買方股價</text>
<text class="g" x="100" y="414">被併方＝買方 × 4.5</text>
<text class="b" x="330" y="414">同一個形狀</text>
<rect x="640" y="140" width="264" height="200" rx="14" fill="var(--card)" stroke="var(--grey)" stroke-dasharray="9 7"/>
<text class="g" x="672" y="200" fill="var(--grey)">獨立評價</text>
<line x1="672" y1="226" x2="872" y2="296" stroke="var(--grey)" stroke-width="4"/>
<line x1="872" y1="226" x2="672" y2="296" stroke="var(--grey)" stroke-width="4"/>
<text class="b" x="672" y="330">2028 交易完成才解鎖</text>
<text class="c" x="56" y="492">它的報價，一年多裡只是別人的影子</text>
</svg>
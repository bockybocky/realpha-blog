<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Three bars narrowing upward, where only the widest bottom layer is solid and the two layers above are empty dashed boxes.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="58" font-size="27" fill="var(--ink)">Base done, no floors</text>

<rect x="330" y="150" width="180" height="80" rx="10" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text x="420" y="198" font-size="20" fill="var(--dim)" text-anchor="middle">Decides</text>
<text x="540" y="198" font-size="16" fill="var(--warn)">Unmet</text>

<rect x="240" y="280" width="420" height="80" rx="10" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text x="450" y="328" font-size="20" fill="var(--dim)" text-anchor="middle">Speaks</text>
<text x="690" y="328" font-size="16" fill="var(--warn)">Unmet</text>

<rect x="140" y="410" width="680" height="80" rx="10" fill="var(--accent)"/>
<text x="480" y="458" font-size="20" fill="var(--page)" text-anchor="middle">Numbers</text>
<text x="140" y="520" font-size="16" fill="var(--dim)">Base</text>

<text x="80" y="565" font-size="22" fill="var(--ink)">Traits are base; views are goal</text>
</svg>
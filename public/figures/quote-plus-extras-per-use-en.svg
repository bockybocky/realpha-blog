<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="After adding extra fees to three quotes and dividing by usage count, the order flips and the cheapest quote becomes the most expensive per use.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">Add the extras you also pay, then divide by the times you use it</text>
<text x="70" y="112" font-size="20" fill="var(--ink)">Quote only</text>
<line x1="70" y1="400" x2="420" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="300" width="70" height="100" fill="var(--accent)"/>
<text x="135" y="284" font-size="16" fill="var(--ink)" text-anchor="middle">5</text>
<text x="135" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">A</text>
<rect x="210" y="280" width="70" height="120" fill="var(--grey)"/>
<text x="245" y="264" font-size="16" fill="var(--ink)" text-anchor="middle">6</text>
<text x="245" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">B</text>
<rect x="320" y="260" width="70" height="140" fill="var(--grey)"/>
<text x="355" y="244" font-size="16" fill="var(--ink)" text-anchor="middle">7</text>
<text x="355" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">C</text>
<text x="100" y="466" font-size="16" fill="var(--accent)">Cheapest</text>
<text x="470" y="340" font-size="27" fill="var(--dim)">→</text>
<text x="560" y="112" font-size="20" fill="var(--ink)">Per use</text>
<line x1="560" y1="400" x2="890" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="580" y="220" width="70" height="180" fill="var(--warn)"/>
<text x="615" y="204" font-size="16" fill="var(--ink)" text-anchor="middle">6</text>
<text x="615" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">A</text>
<rect x="690" y="280" width="70" height="120" fill="var(--grey)"/>
<text x="725" y="264" font-size="16" fill="var(--ink)" text-anchor="middle">4</text>
<text x="725" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">B</text>
<rect x="800" y="340" width="70" height="60" fill="var(--accent)"/>
<text x="835" y="324" font-size="16" fill="var(--ink)" text-anchor="middle">2</text>
<text x="835" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">C</text>
<text x="580" y="466" font-size="16" fill="var(--warn)">Priciest</text>
<text x="48" y="524" font-size="22" fill="var(--ink)">Where the quote stops is not where you stop paying</text>
</svg>
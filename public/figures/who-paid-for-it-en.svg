<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left two short blocks sit on the ground line; on the right two tall blocks, one solid and one a dashed outline that is still empty.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; fill:var(--dim); }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--dim); }
</style>
<text class="t" x="60" y="56">How hard a signal is depends on who paid</text>
<line x1="100" y1="170" x2="100" y2="440" stroke="var(--grey)" stroke-width="2"/>
<text class="s" x="56" y="186">Hard</text>
<text class="s" x="56" y="436">Soft</text>
<line x1="100" y1="440" x2="920" y2="440" stroke="var(--grey)" stroke-width="2"/>
<rect x="130" y="398" width="110" height="42" rx="4" fill="var(--grey)"/>
<text class="s" x="185" y="386" text-anchor="middle">Supplier shortage talk</text>
<rect x="270" y="398" width="110" height="42" rx="4" fill="var(--grey)"/>
<text class="s" x="325" y="386" text-anchor="middle">Broker lists</text>
<text class="g" x="255" y="492" text-anchor="middle">Talk is free</text>
<rect x="560" y="200" width="150" height="240" rx="4" fill="var(--accent)"/>
<text class="b" x="635" y="186" text-anchor="middle">Bought the whole company</text>
<rect x="760" y="200" width="150" height="240" rx="4" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 7"/>
<text class="b" x="835" y="186" text-anchor="middle">Buyer prepayment</text>
<text class="s" x="835" y="326" text-anchor="middle" fill="var(--warn)">Still empty this week</text>
<text class="g" x="735" y="492" text-anchor="middle">Money has to move</text>
<text class="c" x="60" y="536">One solid block this week, one still empty</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條被切成三段的橫條，第一段遠大於後兩段，後兩段等寬">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">簽出去的字，分成三堆</text>

<rect x="60" y="180" width="520" height="110" rx="10" fill="var(--accent)"/>
<text class="t" x="320" y="232" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">上游採購</text>
<text class="t" x="320" y="262" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">3,900 億美元</text>

<rect x="588" y="180" width="134" height="110" rx="10" fill="var(--grey)"/>
<text class="t" x="655" y="232" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">雲端租用</text>
<text class="t" x="655" y="262" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">1,000 億</text>

<rect x="730" y="180" width="134" height="110" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="797" y="232" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">信用擔保</text>
<text class="t" x="797" y="262" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="middle">1,000 億</text>

<text class="t" x="60" y="156" font-size="16" fill="var(--dim)">記憶體・晶圓・零組件</text>
<text class="t" x="588" y="156" font-size="16" fill="var(--dim)">買算力</text>
<text class="t" x="730" y="156" font-size="16" fill="var(--dim)">替客戶背書</text>

<line x1="60" y1="340" x2="864" y2="340" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="382" font-size="19" font-weight="700" fill="var(--ink)">已落在合約裡</text>
<text class="t" x="60" y="408" font-size="16" fill="var(--dim)">換執行長不會失效</text>
<text class="t" x="588" y="382" font-size="19" font-weight="700" fill="var(--warn)">沒談的新案</text>
<text class="t" x="588" y="408" font-size="16" fill="var(--dim)">才是變數</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-label="Two S-curves set two years apart show a clear height gap at the 2030 vertical line.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:700; }
    .body { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="590" fill="var(--page)"/>
  <text x="60" y="56" class="title">2 years late, a different 2030</text>
  <text x="60" y="100" class="grp" style="fill:var(--ink)">Market = units × price ×</text>
  <text x="352" y="100" class="grp" style="fill:var(--warn)">Adoption timing</text>
  <line x1="140" y1="440" x2="870" y2="440" stroke="var(--dim)" stroke-width="2"/>
  <line x1="500" y1="140" x2="500" y2="440" stroke="var(--line)" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="500" y="134" class="body" text-anchor="middle">2030</text>
  <path d="M140,438 C 300,436 340,190 470,178 S 700,170 860,170" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M140,440 L320,438 C 480,436 520,190 650,178 S 800,170 860,170" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="500" cy="176" r="8" fill="var(--accent)"/>
  <circle cx="500" cy="312" r="8" fill="var(--warn)"/>
  <path d="M520,178 L536,178 L536,310 L520,310" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <text x="548" y="250" class="grp" style="fill:var(--ink)">Big drop</text>
  <text x="300" y="220" class="grp" style="fill:var(--accent)">On-time adoption</text>
  <text x="700" y="330" class="grp" style="fill:var(--warn)">2 yrs late</text>
  <text x="140" y="468" class="body" text-anchor="middle">2026</text>
  <text x="320" y="468" class="body" text-anchor="middle">2028</text>
  <text x="680" y="468" class="body" text-anchor="middle">2032</text>
  <text x="860" y="468" class="body" text-anchor="middle">2034</text>
  <text x="480" y="560" class="end" text-anchor="middle">Of the three, timing is easiest to get wrong</text>
</svg>
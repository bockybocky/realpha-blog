<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Each of two panels holds a cluster of dots and an arrow moving out into open space">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:600}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
<path d="M0 0 L8 4 L0 8 z" fill="var(--accent)"/>
</marker>
</defs>
<text class="t h" x="480" y="58" text-anchor="middle">Two Neue Klasse moments, one move</text>
<rect x="60" y="100" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="100" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="90" y="142">1960s</text>
<text class="t g" x="530" y="142">2026</text>
<g fill="var(--grey)">
<circle cx="150" cy="240" r="16"/><circle cx="196" cy="272" r="16"/><circle cx="148" cy="304" r="16"/><circle cx="200" cy="212" r="16"/>
<circle cx="590" cy="240" r="16"/><circle cx="636" cy="272" r="16"/><circle cx="588" cy="304" r="16"/><circle cx="640" cy="212" r="16"/>
</g>
<text class="t s" x="176" y="360" text-anchor="middle">Same as everyone</text>
<text class="t s" x="616" y="360" text-anchor="middle">Bigger screens</text>
<path d="M232 252 Q300 200 356 208" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar)"/>
<path d="M672 252 Q740 200 796 208" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="382" cy="212" r="18" fill="var(--accent)"/>
<circle cx="822" cy="212" r="18" fill="var(--accent)"/>
<text class="t s" x="382" y="266" text-anchor="middle">Three jobs, one car</text>
<text class="t s" x="822" y="266" text-anchor="middle">Take the screen out</text>
<text class="t c" x="480" y="500" text-anchor="middle">Differentiation is leaving, not rising higher</text>
</svg>
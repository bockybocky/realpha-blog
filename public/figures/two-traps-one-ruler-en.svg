<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A single plank has a pit sinking below each of its two ends and is supported in the middle by two pillars.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="68">One plank, a pit at each end</text>
<text class="g" x="150" y="140">The cheap end</text>
<text class="g" x="700" y="140">The quality end</text>
<rect x="150" y="180" width="660" height="26" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<path d="M150,206 L150,300 L250,300 L250,206" fill="none" stroke="var(--warn)" stroke-width="4"/>
<path d="M810,206 L810,300 L710,300 L710,206" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="g" x="150" y="340">Value trap</text>
<text class="b" x="150" y="366">Firms that are truly dying</text>
<text class="g" x="662" y="340">Quality trap</text>
<text class="b" x="612" y="366">Paying for absent growth</text>
<rect x="400" y="206" width="56" height="150" rx="6" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<rect x="504" y="206" width="56" height="150" rx="6" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="386" y="398">Valuation rule</text>
<text class="b" x="494" y="398">Size of bet</text>
<line x1="150" y1="440" x2="810" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="150" y="492">What holds is the middle two</text>
</svg>
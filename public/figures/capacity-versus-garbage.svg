<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="產能容器只裝了下面約六成，上面約四成留白">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">爐子蓋好了，垃圾不夠燒</text>
<text x="320" y="128" font-size="19" font-weight="700" fill="var(--dim)">每日焚燒產能 120 萬噸</text>
<rect x="320" y="150" width="300" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="2.5" stroke-dasharray="8 6"/>
<rect x="320" y="300" width="300" height="170" fill="var(--accent)"/>
<line x1="320" y1="150" x2="620" y2="150" stroke="var(--line)" stroke-width="2.5"/>
<text x="470" y="235" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">空著 50 萬噸</text>
<text x="470" y="395" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">收到的垃圾 70 萬噸</text>
<line x1="660" y1="150" x2="660" y2="300" stroke="var(--warn)" stroke-width="2.5"/>
<line x1="653" y1="150" x2="667" y2="150" stroke="var(--warn)" stroke-width="2.5"/>
<line x1="653" y1="300" x2="667" y2="300" stroke="var(--warn)" stroke-width="2.5"/>
<text x="680" y="220" font-size="19" font-weight="700" fill="var(--warn)">照折舊</text>
<text x="680" y="248" font-size="19" font-weight="700" fill="var(--warn)">照付貸款</text>
<text x="60" y="530" font-size="22" font-weight="700" fill="var(--ink)">產能是蓋出來的，垃圾量不是</text>
</svg>
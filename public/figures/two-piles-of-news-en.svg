<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One headline splits into a short fast arrow and a long slow arrow.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="62">One headline, two arrival times</text>
<rect x="60" y="210" width="150" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="80" y="262">One headline</text>

<path d="M210 230 L300 150" stroke="var(--grey)" stroke-width="2" fill="none"/>
<path d="M210 280 L300 360" stroke="var(--grey)" stroke-width="2" fill="none"/>

<path d="M310 150 L560 150" stroke="var(--accent)" stroke-width="10" fill="none"/>
<path d="M548 132 L578 150 L548 168" fill="var(--accent)"/>
<text class="g" x="310" y="128">Checkable on internal scores</text>
<text class="s" x="310" y="186">Code · math · inference efficiency · cost per token</text>
<text class="s" x="600" y="156">Extrapolates fast</text>

<path d="M310 360 L820 360" stroke="var(--warn)" stroke-width="10" fill="none" stroke-dasharray="26 18"/>
<path d="M808 342 L838 360 L808 378" fill="var(--warn)"/>
<text class="g" x="310" y="338">Needs real-world feedback</text>
<text class="s" x="310" y="396">Lawsuits · running a business · winning an election</text>
<text class="s" x="600" y="338">Slow outside the data center</text>

<text class="c" x="60" y="470">Valuations run ahead of facts, usually only on the top line</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two lines diverge on the same timeline: upstream rental prices slide and then turn up, while downstream token prices head steadily lower.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">One chain, two directions</text>
  <rect x="60" y="92" width="840" height="336" rx="14" fill="var(--card)"/>
  <line x1="110" y1="398" x2="860" y2="398" stroke="var(--line)" stroke-width="2"/>
  <line x1="110" y1="128" x2="110" y2="398" stroke="var(--line)" stroke-width="2"/>

  <path d="M130 200 L300 236 L430 268 L520 256 L650 196 L840 150"
        fill="none" stroke="var(--accent)" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="520" cy="256" r="8" fill="var(--accent)"/>
  <text class="g" x="700" y="138" fill="var(--accent)">GPU hourly rent</text>
  <text class="b" x="700" y="162">Upstream</text>

  <path d="M130 288 L300 302 L430 318 L520 330 L650 356 L840 384"
        fill="none" stroke="var(--warn)" stroke-width="5" stroke-linejoin="round"/>
  <text class="g" x="700" y="364" fill="var(--warn)">Token price index</text>
  <text class="b" x="700" y="388" fill="var(--warn)">Downstream</text>

  <line x1="520" y1="128" x2="520" y2="398" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 7"/>
  <text class="b" x="446" y="120">Around Thanksgiving</text>
  <text class="b" x="130" y="424">This time last year</text>
  <text class="b" x="800" y="424">This year</text>

  <text class="c" x="60" y="492">It goes up, and down</text>
  <text class="b" x="60" y="524">Which is why you need a hedge</text>
</svg>
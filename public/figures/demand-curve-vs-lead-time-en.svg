<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Demand rises steeply while supply steps up only after a delay of months, leaving a gap between them.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">Demand grows daily, supply takes months</text>

  <line x1="110" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="3"/>
  <line x1="110" y1="140" x2="110" y2="450" stroke="var(--line)" stroke-width="3"/>

  <path d="M110 440 C 330 435, 520 400, 640 300 S 760 190, 820 150" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text class="t" x="700" y="205" font-size="19" fill="var(--accent)">Demand</text>

  <path d="M110 442 L400 442 L400 400 L620 400 L620 330 L880 330" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <text class="t" x="700" y="365" font-size="19" fill="var(--warn)">Compute</text>

  <path d="M660 290 L660 392" stroke="var(--dim)" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="t" x="675" y="270" font-size="19" font-weight="700" fill="var(--ink)">Gap</text>
  <text class="t" x="675" y="296" font-size="16" fill="var(--dim)">People who never got through</text>

  <path d="M400 478 L620 478" stroke="var(--dim)" stroke-width="2"/>
  <text class="t" x="510" y="505" font-size="16" fill="var(--dim)" text-anchor="middle">Lead time  months</text>
  <text class="t" x="110" y="505" font-size="16" fill="var(--dim)">Order placed</text>

  <text class="t" x="110" y="540" font-size="16" fill="var(--dim)">Rush restock: pay 3 to 4 times more</text>
</svg>
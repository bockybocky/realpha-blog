<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two identical supply chains, one with orders landing at the source and one bulging with inventory in the middle.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">One word, "queue." Two shapes.</text>

<text class="t" x="48" y="140" font-size="20" font-weight="700" fill="var(--accent)">Demand pull</text>
<rect x="200" y="152" width="180" height="56" rx="6" fill="var(--accent)"/>
<rect x="400" y="152" width="180" height="56" rx="6" fill="var(--grey)"/>
<rect x="600" y="152" width="180" height="56" rx="6" fill="var(--grey)"/>
<text class="t" x="290" y="188" font-size="16" fill="var(--page)" text-anchor="middle">Equipment</text>
<text class="t" x="490" y="188" font-size="16" fill="var(--ink)" text-anchor="middle">Middle</text>
<text class="t" x="690" y="188" font-size="16" fill="var(--ink)" text-anchor="middle">Demand</text>
<circle cx="290" cy="124" r="13" fill="var(--accent)"/>
<text class="t" x="320" y="131" font-size="16" fill="var(--accent)">Orders land here first</text>

<text class="t" x="48" y="370" font-size="20" font-weight="700" fill="var(--warn)">Capacity and power are stuck</text>
<rect x="200" y="382" width="180" height="56" rx="6" fill="var(--grey)"/>
<rect x="400" y="300" width="180" height="138" rx="6" fill="var(--warn)"/>
<rect x="600" y="382" width="180" height="56" rx="6" fill="var(--grey)"/>
<text class="t" x="290" y="418" font-size="16" fill="var(--ink)" text-anchor="middle">Equipment</text>
<text class="t" x="490" y="418" font-size="16" fill="var(--page)" text-anchor="middle">Middle</text>
<text class="t" x="690" y="418" font-size="16" fill="var(--ink)" text-anchor="middle">Demand</text>
<line x1="400" y1="282" x2="580" y2="282" stroke="var(--warn)" stroke-width="2.5"/>
<text class="t" x="600" y="288" font-size="16" fill="var(--warn)">Piling up here</text>

<text class="t" x="48" y="520" font-size="22" font-weight="700" fill="var(--ink)">Same headline, different next move</text>
</svg>
<text class="t" x="580" y="176" font-size="20" font-weight="700" fill="var(--ink)">My textbook</text>
<rect x="580" y="198" width="26" height="26" rx="3" fill="var(--accent)"/>
<rect x="614" y="198" width="26" height="26" rx="3" fill="var(--accent)"/>

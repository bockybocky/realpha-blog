<rect x="284" y="428" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>
<rect x="318" y="428" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>

<path d="M400 188 L540 230" stroke="var(--accent)" stroke-width="2" fill="none"/>
<path d="M400 308 L540 310" stroke="var(--accent)" stroke-width="2" fill="none"/>
<path d="M400 428 L540 390" stroke="var(--accent)" stroke-width="2" fill="none"/>


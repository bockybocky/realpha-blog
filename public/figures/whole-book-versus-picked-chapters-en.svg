<text class="t" x="726" y="218" font-size="15" fill="var(--dim)">Crystals, defects, phases</text>
<rect x="580" y="282" width="26" height="26" rx="3" fill="var(--accent)"/>
<rect x="614" y="282" width="26" height="26" rx="3" fill="var(--accent)"/>

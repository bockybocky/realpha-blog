<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A few chapters are picked from each of three books, and arrows converge into one self-assembled textbook on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">Whole book vs picked chapters</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">Left: chapters from three books　Right: only the sections I want</text>

<rect x="60" y="140" width="330" height="96" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="80" y="170" font-size="19" fill="var(--ink)">LibreTexts Materials Science</text>
<rect x="80" y="188" width="26" height="26" rx="3" fill="var(--accent)"/>
<rect x="114" y="188" width="26" height="26" rx="3" fill="var(--accent)"/>
<rect x="148" y="188" width="26" height="26" rx="3" fill="var(--accent)"/>
<rect x="182" y="188" width="26" height="26" rx="3" fill="var(--accent)"/>
<rect x="216" y="188" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>
<rect x="250" y="188" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>
<rect x="284" y="188" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>
<rect x="318" y="188" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>

<rect x="60" y="260" width="330" height="96" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="80" y="290" font-size="19" fill="var(--ink)">OpenStax Chemistry</text>
<rect x="80" y="308" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>
<rect x="114" y="308" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>
<rect x="148" y="308" width="26" height="26" rx="3" fill="var(--accent)"/>
<rect x="182" y="308" width="26" height="26" rx="3" fill="var(--accent)"/>
<rect x="216" y="308" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>

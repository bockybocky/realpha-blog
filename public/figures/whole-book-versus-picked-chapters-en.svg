<rect x="284" y="308" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>
<rect x="318" y="308" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>

<rect x="60" y="380" width="330" height="96" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="80" y="410" font-size="19" fill="var(--ink)">OpenStax University Physics</text>
<rect x="80" y="428" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>
<rect x="114" y="428" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>
<rect x="148" y="428" width="26" height="26" rx="3" fill="var(--grey)" opacity="0.4"/>
<rect x="182" y="428" width="26" height="26" rx="3" fill="var(--accent)"/>

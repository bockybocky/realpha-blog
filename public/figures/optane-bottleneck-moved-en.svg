<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Left panel: the pipe to the CPU narrows in the middle, and Optane fills the narrow spot. Right panel: the CPU pipe is straight and Optane fades to a dashed box, while the narrow spot has moved to the GPU pipe, where HBM fills it.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700} .g{font-size:20px;font-weight:700}
    .b{font-size:16px} .bb{font-size:16px;font-weight:700} .d{font-size:15px;fill:var(--dim)} .c{font-size:22px;font-weight:700}
</style>
<defs>
  <marker id="f4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
</defs>
<text x="480" y="50" class="t" text-anchor="middle">Bottleneck moved</text>
<rect x="40" y="90" width="420" height="360" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="90" width="420" height="360" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="250" y="126" class="g" text-anchor="middle">Optane era</text>
<text x="710" y="126" class="g" text-anchor="middle">Micron exit</text>
<text x="70" y="248" class="d">Data</text>
<path d="M70,258 H180 L200,272 H260 L280,258 H360 V302 H280 L260,288 H200 L180,302 H70 Z" fill="var(--grey)" fill-opacity="0.6" stroke="var(--dim)"/>
<rect x="370" y="250" width="70" height="60" rx="6" fill="var(--page)" stroke="var(--ink)"/>
<text x="405" y="286" class="bb" text-anchor="middle">CPU</text>
<rect x="195" y="190" width="70" height="36" rx="4" fill="var(--accent)"/>
<text x="230" y="214" class="bb" text-anchor="middle" style="fill:var(--page)">Optane</text>
<line x1="230" y1="228" x2="230" y2="266" stroke="var(--accent)" stroke-width="2" marker-end="url(#f4a)"/>
<text x="230" y="330" class="bb" text-anchor="middle" style="fill:var(--warn)">Choke</text>
<rect x="530" y="185" width="260" height="30" fill="var(--grey)" fill-opacity="0.6" stroke="var(--dim)"/>
<rect x="800" y="175" width="90" height="50" rx="6" fill="var(--page)" stroke="var(--ink)"/>
<text x="845" y="206" class="bb" text-anchor="middle">CPU</text>
<rect x="620" y="138" width="70" height="34" rx="4" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 4"/>
<text x="655" y="161" class="b" text-anchor="middle" style="fill:var(--grey)">Optane</text>
<path d="M530,328 H620 L640,342 H700 L720,328 H790 V372 H720 L700,358 H640 L620,372 H530 Z" fill="var(--grey)" fill-opacity="0.6" stroke="var(--dim)"/>
<rect x="800" y="325" width="90" height="50" rx="6" fill="var(--page)" stroke="var(--ink)"/>
<text x="845" y="356" class="d" text-anchor="middle" style="fill:var(--ink)">GPU/AI</text>
<rect x="635" y="262" width="70" height="36" rx="4" fill="var(--accent)"/>
<text x="670" y="286" class="bb" text-anchor="middle" style="fill:var(--page)">HBM</text>
<line x1="670" y1="300" x2="670" y2="336" stroke="var(--accent)" stroke-width="2" marker-end="url(#f4a)"/>
<text x="670" y="398" class="bb" text-anchor="middle" style="fill:var(--warn)">Choke</text>
<text x="480" y="505" class="c" text-anchor="middle">Product stayed put</text>
</svg>
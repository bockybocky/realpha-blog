<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="同一條起跑線往下延伸的柱子，美元那根短，其餘三根同樣深">
<style>svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">美元會贏，不是因為它好</text>
<line x1="110" y1="150" x2="880" y2="150" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="136" font-size="16" fill="var(--dim)">原本的購買力</text>
<line x1="70" y1="170" x2="70" y2="420" stroke="var(--grey)" stroke-width="2"/>
<polygon points="70,434 64,416 76,416" fill="var(--grey)"/>
<text x="56" y="300" font-size="16" fill="var(--dim)" text-anchor="end">貶</text>
<rect x="170" y="150" width="120" height="90" fill="var(--accent)"/>
<rect x="340" y="150" width="120" height="250" fill="var(--grey)"/>
<rect x="510" y="150" width="120" height="250" fill="var(--grey)"/>
<rect x="680" y="150" width="190" height="250" fill="var(--grey)"/>
<text x="230" y="272" font-size="20" fill="var(--accent)" text-anchor="middle">美元</text>
<text x="230" y="298" font-size="16" fill="var(--dim)" text-anchor="middle">爛得最少</text>
<text x="400" y="432" font-size="20" fill="var(--ink)" text-anchor="middle">歐元</text>
<text x="400" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">重新計價風險</text>
<text x="570" y="432" font-size="20" fill="var(--ink)" text-anchor="middle">人民幣</text>
<text x="570" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">資本管制</text>
<text x="775" y="432" font-size="20" fill="var(--ink)" text-anchor="middle">英鎊・瑞郎・日圓</text>
<text x="775" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">接不住流動性</text>
<text x="60" y="560" font-size="22" fill="var(--ink)">一起往下，它只是跌得比較少</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條橫條：每年同樣付 6 的利息，利率 3% 能扛 200 的債，利率 6% 只能扛 100，長度差一倍，數字為示意。">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:600}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}.p{fill:var(--page)}
</style>
<text class="t" x="480" y="52" text-anchor="middle">付得起的利息一樣，借得到的錢差一倍</text>
<text class="d" x="480" y="88" text-anchor="middle">示意：兩國每年都拿 6 出來付利息</text>
<line x1="210" y1="130" x2="210" y2="380" stroke="var(--dim)" stroke-width="2"/>
<text class="g" x="70" y="182">英國</text>
<text class="d" x="70" y="208">利率 3%</text>
<rect x="210" y="150" width="600" height="64" fill="var(--accent)" rx="4"/>
<text class="b" x="825" y="188">扛得起 200</text>
<text class="g" x="70" y="322">法國</text>
<text class="d" x="70" y="348">利率 6%</text>
<rect x="210" y="290" width="300" height="64" fill="var(--grey)" rx="4"/>
<text class="b" x="525" y="328">扛得起 100</text>
<line x1="510" y1="140" x2="510" y2="370" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text class="c" x="480" y="460" text-anchor="middle">利息越便宜，能借得越久</text>
<text class="d" x="480" y="500" text-anchor="middle">節目沒講法國的實際利率，6% 只為示意</text>
</svg>
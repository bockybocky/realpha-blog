<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條時間軸對照，實心的不可逆節點一條排在開頭、一條排在結尾">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="52" font-size="27" fill="var(--ink)">不可逆的那一步，排在第幾順位</text>
<text x="60" y="130" font-size="19" fill="var(--dim)">超級稻米計畫</text>
<line x1="90" y1="190" x2="900" y2="190" stroke="var(--line)" stroke-width="3"/>
<path d="M900 182 L916 190 L900 198 Z" fill="var(--line)"/>
<circle cx="130" cy="190" r="17" fill="var(--warn)"/>
<text x="130" y="232" font-size="16" fill="var(--ink)" text-anchor="middle">排水開渠</text>
<text x="130" y="256" font-size="16" fill="var(--warn)" text-anchor="middle">不可逆</text>
<circle cx="310" cy="190" r="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="310" y="232" font-size="16" fill="var(--dim)" text-anchor="middle">動工</text>
<circle cx="490" cy="190" r="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="490" y="232" font-size="16" fill="var(--dim)" text-anchor="middle">移民遷入</text>
<circle cx="670" cy="190" r="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="670" y="232" font-size="16" fill="var(--dim)" text-anchor="middle">成本效益</text>
<circle cx="850" cy="190" r="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="850" y="232" font-size="16" fill="var(--dim)" text-anchor="middle">環境評估</text>
<text x="60" y="350" font-size="19" fill="var(--dim)">留得住退路的順序</text>
<line x1="90" y1="410" x2="900" y2="410" stroke="var(--line)" stroke-width="3"/>
<path d="M900 402 L916 410 L900 418 Z" fill="var(--line)"/>
<circle cx="130" cy="410" r="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="130" y="452" font-size="16" fill="var(--ink)" text-anchor="middle">環境評估</text>
<circle cx="310" cy="410" r="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="310" y="452" font-size="16" fill="var(--ink)" text-anchor="middle">成本效益</text>
<circle cx="490" cy="410" r="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="490" y="452" font-size="16" fill="var(--ink)" text-anchor="middle">小規模試做</text>
<circle cx="670" cy="410" r="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="670" y="452" font-size="16" fill="var(--ink)" text-anchor="middle">移民遷入</text>
<circle cx="850" cy="410" r="17" fill="var(--warn)"/>
<text x="850" y="452" font-size="16" fill="var(--ink)" text-anchor="middle">排水開渠</text>
<text x="850" y="476" font-size="16" fill="var(--warn)" text-anchor="middle">不可逆</text>
<text x="60" y="528" font-size="22" fill="var(--ink)">不可逆的排到最後</text>
</svg>
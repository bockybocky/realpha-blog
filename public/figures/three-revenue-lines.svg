<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="三條粗細不同的橫向色帶流進右邊的營收方塊，最不顯眼的第三條最粗">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="56" font-size="27">最大的一條，不在最顯眼的地方</text>
  <rect x="330" y="140" width="460" height="34" fill="var(--grey)"/>
  <text x="310" y="163" font-size="19" text-anchor="end">廣告分潤</text>
  <rect x="330" y="214" width="460" height="20" fill="var(--grey)"/>
  <text x="310" y="231" font-size="19" text-anchor="end">企業贊助</text>
  <rect x="330" y="274" width="460" height="78" fill="var(--accent)"/>
  <text x="310" y="320" font-size="19" text-anchor="end">上門委託的製作案</text>
  <rect x="790" y="140" width="110" height="212" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="845" y="252" font-size="19" text-anchor="middle">營收</text>
  <text x="330" y="378" font-size="15" fill="var(--dim)">最不顯眼的一條</text>
  <text x="480" y="462" font-size="22" text-anchor="middle">曝光是入口，收入在門後</text>
</svg>
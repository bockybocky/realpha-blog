<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars of very different height and a horizontal dashed line; the short bar is Africa in 1945 and the tall bar is Africa today, just reaching the East Asia industrialization starting line.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); }
    .sub { font-size:15px; fill:var(--dim); }
    .cap { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="ttl" x="60" y="66">Population density just reached East Asia's starting line</text>

  <line x1="110" y1="130" x2="890" y2="130" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
  <text class="cap" x="110" y="116">East Asia industrialization line</text>

  <line x1="110" y1="430" x2="890" y2="430" stroke="var(--line)" stroke-width="2"/>

  <rect x="200" y="386" width="130" height="44" fill="var(--grey)" rx="3"/>
  <rect x="560" y="130" width="130" height="300" fill="var(--accent)" rx="3"/>

  <text class="grp" x="265" y="462" text-anchor="middle">1945</text>
  <text class="sub" x="265" y="488" text-anchor="middle">220 million people</text>
  <text class="sub" x="265" y="510" text-anchor="middle">About Europe in 1500</text>

  <text class="grp" x="625" y="462" text-anchor="middle">Today</text>
  <text class="sub" x="625" y="488" text-anchor="middle">1.5 billion people</text>
  <text class="sub" x="625" y="510" text-anchor="middle">About Asia in 1960</text>

  <text class="end" x="890" y="418" text-anchor="end">Without density there is no market</text>
</svg>
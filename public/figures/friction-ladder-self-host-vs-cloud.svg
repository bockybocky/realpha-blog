<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一道爬很高的四階樓梯，右邊一道只有三階的矮梯，頂端高度差很大">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:20px; fill:var(--ink); font-weight:600; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="48" y="58">能力一樣，要爬的樓梯不一樣</text>
<line x1="48" y1="452" x2="912" y2="452" stroke="var(--line)" stroke-width="3"/>
<text class="g" x="60" y="100">自己架</text>
<rect x="60" y="392" width="88" height="60" fill="var(--grey)"/>
<rect x="152" y="328" width="88" height="124" fill="var(--grey)"/>
<rect x="244" y="264" width="88" height="188" fill="var(--grey)"/>
<rect x="336" y="176" width="88" height="276" fill="var(--warn)"/>
<text class="b" x="66" y="382">買機器</text>
<text class="b" x="158" y="318">終端機</text>
<text class="b" x="250" y="254">串服務</text>
<text class="b" x="342" y="166">持續維護</text>
<text class="g" x="556" y="100">雲端</text>
<rect x="556" y="422" width="88" height="30" fill="var(--grey)"/>
<rect x="648" y="404" width="88" height="48" fill="var(--grey)"/>
<rect x="740" y="386" width="88" height="66" fill="var(--accent)"/>
<text class="b" x="562" y="412">開帳號</text>
<text class="b" x="654" y="394">取名字</text>
<text class="b" x="746" y="376">授權</text>
<line x1="424" y1="176" x2="828" y2="176" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="860" y1="176" x2="860" y2="386" stroke="var(--ink)" stroke-width="3"/>
<text class="b" x="876" y="290">摩擦力</text>
<text class="c" x="48" y="516">差的不是能力上限，是摩擦力</text>
</svg>
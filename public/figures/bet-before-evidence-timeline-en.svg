<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The timeline shows the bet at the far left and the evidence at the far right, about two years apart.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .a { font-size:19px; font-weight:700; fill:var(--accent); }
    .w { font-size:16px; fill:var(--warn); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="80" y="58">You bet now; evidence arrives two years later</text>

  <line x1="80" y1="300" x2="890" y2="300" stroke="var(--line)" stroke-width="3"/>
  <polygon points="890,294 906,300 890,306" fill="var(--line)"/>

  <line x1="150" y1="300" x2="150" y2="250" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="150" cy="300" r="9" fill="var(--accent)"/>
  <text class="a" x="112" y="236">Push the chips in</text>
  <text class="b" x="112" y="260">$100B-scale spend</text>
  <text class="b" x="112" y="332">2023–24 decision</text>

  <circle cx="440" cy="300" r="7" fill="var(--grey)"/>
  <text class="b" x="398" y="332">Data centers built</text>

  <circle cx="650" cy="300" r="7" fill="var(--grey)"/>
  <text class="b" x="612" y="332">Power comes on</text>

  <line x1="840" y1="300" x2="840" y2="250" stroke="var(--ink)" stroke-width="3"/>
  <circle cx="840" cy="300" r="9" fill="var(--ink)"/>
  <text class="g" x="770" y="236">Evidence</text>
  <text class="b" x="770" y="260">Model quality</text>
  <text class="b" x="770" y="332">2026</text>

  <line x1="150" y1="186" x2="840" y2="186" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="b" x="455" y="174">About two years</text>

  <rect x="80" y="396" width="810" height="86" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="104" y="428">The lean startup way</text>
  <text class="b" x="104" y="456">Wants bet and evidence to coincide</text>
  <text class="w" x="520" y="456">By then, rivals' clusters ran two years</text>
</svg>
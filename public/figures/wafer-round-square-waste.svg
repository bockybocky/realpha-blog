<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-label="左邊圓形裡只排得下九個方格，四周邊角留白；右邊面積相同的方形板上，同樣的格子排滿十六個，沒有邊角浪費。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="610" fill="var(--page)"/>
  <text x="480" y="54" font-size="27" text-anchor="middle">圓上切方，邊角是形狀吃掉的</text>

  <circle cx="270" cy="310" r="151" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="168" y="208" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="236" y="208" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="304" y="208" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="168" y="276" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="236" y="276" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="304" y="276" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="168" y="344" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="236" y="344" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="304" y="344" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <text x="270" y="150" font-size="20" text-anchor="middle" fill="var(--accent)">9 顆</text>
  <text x="270" y="500" font-size="19" text-anchor="middle">圓形晶圓</text>
  <text x="270" y="530" font-size="15" text-anchor="middle" fill="var(--dim)">邊角切不出來</text>

  <rect x="624" y="174" width="272" height="272" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="624" y="174" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="692" y="174" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="760" y="174" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="828" y="174" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="624" y="242" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="692" y="242" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="760" y="242" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="828" y="242" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="624" y="310" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="692" y="310" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="760" y="310" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="828" y="310" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="624" y="378" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="692" y="378" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="760" y="378" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <rect x="828" y="378" width="68" height="68" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
  <text x="760" y="150" font-size="20" text-anchor="middle" fill="var(--accent)">16 顆</text>
  <text x="760" y="500" font-size="19" text-anchor="middle">方形面板</text>
  <text x="760" y="530" font-size="15" text-anchor="middle" fill="var(--dim)">同樣的格子，排得滿</text>

  <text x="480" y="580" font-size="22" text-anchor="middle">同樣面積，形狀決定切得出幾顆</text>
</svg>
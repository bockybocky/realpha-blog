<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="垂直深度尺，上方極薄一層是經濟活動帶，下方大片是幾乎沒人去的深度">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
  <text x="80" y="56" font-size="27" fill="var(--ink)">錢都在最上面那一層水裡</text>

  <rect x="260" y="120" width="440" height="440" fill="var(--card)"/>
  <rect x="260" y="120" width="440" height="66" fill="var(--accent)" opacity="0.18"/>

  <line x1="260" y1="120" x2="700" y2="120" stroke="var(--ink)" stroke-width="3"/>
  <text x="730" y="114" font-size="19" fill="var(--ink)">海面</text>
  <text x="730" y="140" font-size="16" fill="var(--dim)">水面船長程移動</text>

  <line x1="260" y1="186" x2="700" y2="186" stroke="var(--accent)" stroke-width="3"/>
  <text x="730" y="192" font-size="19" fill="var(--accent)">1500 公尺｜現在作業</text>
  <text x="80" y="160" font-size="19" fill="var(--accent)">經濟活動帶</text>

  <line x1="260" y1="217" x2="700" y2="217" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="730" y="223" font-size="16" fill="var(--dim)">2200 公尺｜壓力測試</text>

  <line x1="260" y1="384" x2="700" y2="384" stroke="var(--grey)" stroke-width="2"/>
  <text x="730" y="390" font-size="16" fill="var(--dim)">6000 公尺｜全海深</text>

  <line x1="260" y1="560" x2="700" y2="560" stroke="var(--grey)" stroke-width="2"/>
  <text x="730" y="566" font-size="16" fill="var(--dim)">10000 公尺｜最深處</text>

  <text x="80" y="596" font-size="22" fill="var(--ink)">不必下到最深，就夠接到生意</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-label="Three short bars sit on the left and three tall bars on the right, with fiber attach the tallest.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:700; fill:var(--ink); }
    .body { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="590" fill="var(--page)"/>
  <text x="60" y="56" class="title">Back end is hard</text>
  <text x="60" y="110" class="body">Hard ↑</text>
  <line x1="80" y1="450" x2="880" y2="450" stroke="var(--dim)" stroke-width="2"/>
  <rect x="110" y="390" width="90" height="60" fill="var(--grey)"/>
  <rect x="220" y="390" width="90" height="60" fill="var(--grey)"/>
  <rect x="330" y="380" width="90" height="70" fill="var(--grey)"/>
  <rect x="530" y="140" width="90" height="310" fill="var(--warn)"/>
  <rect x="640" y="200" width="90" height="250" fill="var(--accent)"/>
  <rect x="750" y="190" width="90" height="260" fill="var(--accent)"/>
  <text x="575" y="126" class="grp" text-anchor="middle" style="fill:var(--warn)">Max</text>
  <text x="155" y="478" class="body" text-anchor="middle">SiWG</text>
  <text x="265" y="478" class="body" text-anchor="middle">SiN</text>
  <text x="375" y="478" class="body" text-anchor="middle">Ge PD</text>
  <text x="575" y="478" class="body" text-anchor="middle">Fiber</text>
  <text x="685" y="478" class="body" text-anchor="middle">LD</text>
  <text x="795" y="478" class="body" text-anchor="middle">Wfr test</text>
  <line x1="110" y1="496" x2="420" y2="496" stroke="var(--line)" stroke-width="2"/>
  <line x1="530" y1="496" x2="840" y2="496" stroke="var(--line)" stroke-width="2"/>
  <text x="265" y="520" class="grp" text-anchor="middle">Fab</text>
  <text x="685" y="520" class="grp" text-anchor="middle">Fiber/LD/test</text>
  <text x="480" y="570" class="end" text-anchor="middle">Necessary≠enough</text>
</svg>
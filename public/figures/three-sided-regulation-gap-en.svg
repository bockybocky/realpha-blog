<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three bars of different heights, with the supply side tallest, the market side middling and the demand side shortest.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t h" x="60" y="70">How far each side has got</text>

  <line x1="90" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="3"/>

  <rect x="150" y="150" width="160" height="290" rx="8" fill="var(--accent)" opacity="0.85"/>
  <text class="t g" x="230" y="480" text-anchor="middle">Supply</text>
  <text class="t b" x="230" y="508" text-anchor="middle">Quality bars, audits</text>

  <rect x="400" y="300" width="160" height="140" rx="8" fill="var(--grey)"/>
  <text class="t g" x="480" y="480" text-anchor="middle">Market</text>
  <text class="t b" x="480" y="508" text-anchor="middle">Exchanges, data formats</text>

  <rect x="650" y="390" width="160" height="50" rx="8" fill="var(--warn)" opacity="0.85"/>
  <text class="t g" x="730" y="480" text-anchor="middle">Demand</text>
  <text class="t b" x="730" y="508" text-anchor="middle">How to use and disclose</text>

  <text class="t b" x="100" y="140">In place</text>
  <text class="t b" x="100" y="430">Blank</text>
  <line x1="650" y1="150" x2="810" y2="150" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="t b" x="730" y="135" text-anchor="middle">The biggest gap</text>
</svg>
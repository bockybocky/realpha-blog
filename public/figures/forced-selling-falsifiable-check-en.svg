<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Five lines bending down together in the left box, and four flat lines with one falling in the right box">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">Two kinds of decline look different</text>
<rect x="70" y="130" width="390" height="240" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g fill="none" stroke="var(--accent)" stroke-width="3">
<path d="M100 170 L230 174 L440 232"/>
<path d="M100 205 L230 210 L440 268"/>
<path d="M100 240 L230 246 L440 300"/>
<path d="M100 275 L230 280 L440 332"/>
<path d="M100 310 L230 314 L440 356"/>
</g>
<text x="265" y="408" font-size="19" fill="var(--accent)" text-anchor="middle">Weak together → money is moving</text>
<rect x="500" y="130" width="390" height="240" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g fill="none" stroke="var(--grey)" stroke-width="3">
<path d="M530 170 L660 166 L870 172"/>
<path d="M530 205 L660 209 L870 203"/>
<path d="M530 240 L660 236 L870 242"/>
<path d="M530 275 L660 279 L870 273"/>
</g>
<path d="M530 310 L660 316 L870 356" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text x="695" y="408" font-size="19" fill="var(--warn)" text-anchor="middle">Only yours weak → something is wrong with it</text>
<text x="480" y="472" font-size="22" fill="var(--ink)" text-anchor="middle">The tell is in the names beside it</text>
</svg>
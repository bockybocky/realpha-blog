<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Filing cabinets in the middle with the computer in a corner on the left, and the computer in the centre radiating outward with the cabinets crossed out on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .l { font-size:15px; fill:var(--dim); }
    .a { font-size:16px; fill:var(--accent); font-weight:700; }
    .w { font-size:15px; fill:var(--warn); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="52">The same computer, in the corner or at the centre</text>

  <rect x="60" y="90" width="390" height="340" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="255" y="126" text-anchor="middle">Corner</text>
  <path d="M 100 168 L 400 168" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7" fill="none"/>
  <path d="M 400 168 L 388 162 L 388 174 Z" fill="var(--grey)"/>
  <text class="l" x="255" y="156" text-anchor="middle">Process unchanged</text>
  <rect x="150" y="196" width="60" height="86" rx="4" fill="var(--grey)" fill-opacity="0.3" stroke="var(--grey)" stroke-width="2"/>
  <rect x="228" y="196" width="60" height="86" rx="4" fill="var(--grey)" fill-opacity="0.3" stroke="var(--grey)" stroke-width="2"/>
  <rect x="306" y="196" width="60" height="86" rx="4" fill="var(--grey)" fill-opacity="0.3" stroke="var(--grey)" stroke-width="2"/>
  <text class="l" x="258" y="304" text-anchor="middle">Filing cabinets</text>
  <rect x="378" y="330" width="46" height="34" rx="4" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text class="l" x="401" y="384" text-anchor="middle">Computer</text>
  <text class="d" x="150" y="404" text-anchor="middle">One more job title</text>

  <rect x="510" y="90" width="390" height="340" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="705" y="126" text-anchor="middle">Centre</text>
  <path d="M 710 240 L 600 172 M 710 240 L 812 172 M 710 240 L 600 314 M 710 240 L 812 314"
        stroke="var(--accent)" stroke-width="2" fill="none"/>
  <circle cx="600" cy="168" r="14" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="815" cy="168" r="14" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="600" cy="318" r="14" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="815" cy="318" r="14" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <rect x="678" y="216" width="64" height="48" rx="5" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text class="a" x="710" y="292" text-anchor="middle">Computer</text>
  <rect x="528" y="352" width="38" height="54" rx="4" fill="var(--grey)" fill-opacity="0.18" stroke="var(--grey)" stroke-width="2"/>
  <path d="M 524 406 L 570 350" stroke="var(--warn)" stroke-width="3"/>
  <text class="w" x="547" y="342" text-anchor="middle">Thrown out</text>
  <text class="a" x="760" y="404" text-anchor="middle">Bottlenecks one at a time</text>

  <text class="c" x="480" y="500" text-anchor="middle">Not one more computer, one fewer filing cabinet</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left the fiscal rules stack into a solid three-step wall, while on the right pension reform is just an empty dashed box on the baseline.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">One side built high, one side empty</text>
<line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="3"/>
<rect x="90" y="340" width="150" height="90" fill="var(--accent)" opacity="0.35"/>
<text x="104" y="394" font-size="16" fill="var(--ink)">Halve the deficit</text>
<rect x="250" y="262" width="150" height="168" fill="var(--accent)" opacity="0.6"/>
<text x="266" y="356" font-size="16" fill="var(--page)">0.5% a year</text>
<rect x="410" y="170" width="150" height="260" fill="var(--accent)"/>
<text x="428" y="310" font-size="16" fill="var(--page)">Until 60%</text>
<text x="410" y="146" font-size="19" fill="var(--accent)">Into the constitution</text>
<rect x="680" y="372" width="200" height="58" rx="6" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text x="700" y="410" font-size="19" fill="var(--warn)">Pension reform</text>
<text x="700" y="456" font-size="16" fill="var(--dim)">Nothing behind it</text>
</svg>
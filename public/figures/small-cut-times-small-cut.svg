<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一個大正方形代表原本的面積一百，裡面左下角一塊兩邊各縮一點的實心長方形只剩約一半面積"><rect x="0" y="0" width="960" height="560" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style><g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'><text x="60" y="58" font-size="27px" fill="var(--ink)" text-anchor="start" font-weight="600">兩邊各砍一點，面積就少一半</text><rect x="180" y="130" width="300" height="300" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><rect x="180" y="250" width="270" height="180" fill="var(--accent)"/><text x="520" y="150" font-size="20px" fill="var(--dim)" text-anchor="start" font-weight="normal">原本 10 × 10 ＝ 100</text><line x1="480" y1="140" x2="510" y2="144" stroke="var(--grey)" stroke-width="1.5"/><text x="520" y="350" font-size="20px" fill="var(--accent)" text-anchor="start" font-weight="600">下修後 9 × 6 ＝ 54</text><line x1="450" y1="344" x2="510" y2="344" stroke="var(--accent)" stroke-width="1.5"/><text x="330" y="466" font-size="19px" fill="var(--dim)" text-anchor="middle" font-weight="normal">盈餘 10 → 9</text><line x1="180" y1="444" x2="450" y2="444" stroke="var(--grey)" stroke-width="2"/><text x="160" y="346" font-size="19px" fill="var(--dim)" text-anchor="end" font-weight="normal">本益比</text><text x="160" y="372" font-size="19px" fill="var(--dim)" text-anchor="end" font-weight="normal">10 → 6</text><line x1="166" y1="250" x2="166" y2="430" stroke="var(--grey)" stroke-width="2"/><text x="60" y="520" font-size="22px" fill="var(--ink)" text-anchor="start" font-weight="600">小幅下修乘上本益比下修，就是腰斬</text></g></svg>
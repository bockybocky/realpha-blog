<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A short route and a longer detour route sit side by side, with the added stretch marked as floating storage.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700 }
.g { font-size:20px; fill:var(--ink); font-weight:600 }
.b { font-size:16px; fill:var(--dim) }
.n { font-size:22px; fill:var(--ink); font-weight:700 }
.c { font-size:22px; fill:var(--ink); font-weight:600 }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56">Same barrels, 19 more days at sea</text>
<text class="b" x="60" y="150">Yanbu</text>
<text class="b" x="900" y="150" text-anchor="end">Asia</text>
<line x1="120" y1="190" x2="340" y2="190" stroke="var(--accent)" stroke-width="5"/>
<circle cx="230" cy="190" r="11" fill="var(--accent)"/>
<text class="g" x="360" y="197">Direct 10 days</text>
<polyline points="120,300 260,390 480,425 700,400 880,320" fill="none" stroke="var(--grey)" stroke-width="5"/>
<circle cx="480" cy="425" r="11" fill="var(--grey)"/>
<text class="g" x="120" y="285">Around Africa 29 days</text>
<path d="M340 480 L340 495 L880 495 L880 480" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="610" y="527" text-anchor="middle" fill="var(--warn)">19 extra days = floating storage</text>
<text class="c" x="60" y="440">Same oil, new location</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左側柱高懸殊，右側柱齊平頂住同一條上限線" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">退休帳戶那一欄，規則對每個人一樣</text>
<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="480" y1="100" x2="480" y2="420" stroke="var(--line)" stroke-width="2"/>

<rect x="100" y="140" width="70" height="280" fill="var(--grey)"/>
<rect x="200" y="330" width="70" height="90" fill="var(--grey)"/>
<rect x="300" y="400" width="70" height="20" fill="var(--grey)"/>
<text x="235" y="110" font-size="19" fill="var(--dim)" text-anchor="middle">一般持股</text>
<text x="235" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">差距沒有上限</text>

<line x1="560" y1="240" x2="880" y2="240" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="880" y="228" font-size="15" fill="var(--accent)" text-anchor="end">年度上限　人人相同</text>
<rect x="590" y="240" width="70" height="180" fill="var(--accent)"/>
<rect x="690" y="240" width="70" height="180" fill="var(--accent)"/>
<rect x="790" y="240" width="70" height="180" fill="var(--accent)"/>
<text x="720" y="110" font-size="19" fill="var(--accent)" text-anchor="middle">401(k)</text>
<text x="720" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">2.9 兆 → 近 11 兆　七千萬人在繳</text>

<text x="60" y="505" font-size="22" fill="var(--ink)">最平等的一欄，是被制度綁住的那一欄</text>
</svg>
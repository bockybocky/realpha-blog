<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三條長度不同的橫條由長到短排列，左邊是考古題主題比重、右邊是講義份量，兩側長度相同">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">考古題出得多的，講義就寫得厚</text>

  <text class="t" x="60" y="130" font-size="19" fill="var(--dim)">考古題主題比重</text>
  <text class="t" x="560" y="130" font-size="19" fill="var(--dim)">講義份量</text>

  <g>
    <text class="t" x="60" y="190" font-size="16" fill="var(--ink)">訓練</text>
    <rect x="150" y="172" width="330" height="26" rx="4" fill="var(--accent)"/>
    <rect x="560" y="172" width="330" height="26" rx="4" fill="var(--accent)" opacity="0.45"/>
  </g>
  <g>
    <text class="t" x="60" y="252" font-size="16" fill="var(--ink)">推論成本</text>
    <rect x="150" y="234" width="205" height="26" rx="4" fill="var(--accent)"/>
    <rect x="560" y="234" width="205" height="26" rx="4" fill="var(--accent)" opacity="0.45"/>
  </g>
  <g>
    <text class="t" x="60" y="314" font-size="16" fill="var(--ink)">資料處理</text>
    <rect x="150" y="296" width="180" height="26" rx="4" fill="var(--accent)"/>
    <rect x="560" y="296" width="180" height="26" rx="4" fill="var(--accent)" opacity="0.45"/>
  </g>
  <g>
    <text class="t" x="60" y="376" font-size="16" fill="var(--dim)">其餘</text>
    <rect x="150" y="358" width="85" height="26" rx="4" fill="var(--grey)"/>
    <rect x="560" y="358" width="85" height="26" rx="4" fill="var(--grey)" opacity="0.5"/>
  </g>

  <line x1="520" y1="150" x2="520" y2="400" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="60" y="460" font-size="22" font-weight="600" fill="var(--ink)">同一組比例，左右一樣長</text>
</svg>
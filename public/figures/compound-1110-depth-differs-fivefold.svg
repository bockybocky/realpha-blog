<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="四根往下的長條，從左到右愈來愈深，最淺是標普 500 的六趴，最深是半導體產業群的三成。">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">同一週，往下的深度差五倍</text>
<text x="60" y="88" font-size="16" fill="var(--dim)">每根下面標了它量的區間</text>
<line x1="60" y1="130" x2="900" y2="130" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="122" font-size="15" fill="var(--dim)">高點</text>
<rect x="110" y="130" width="130" height="66" fill="var(--accent)" fill-opacity="0.35"/>
<rect x="310" y="130" width="130" height="132" fill="var(--accent)" fill-opacity="0.5"/>
<rect x="510" y="130" width="130" height="253" fill="var(--accent)" fill-opacity="0.75"/>
<rect x="710" y="130" width="130" height="330" fill="var(--accent)"/>
<text x="175" y="222" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">6%</text>
<text x="375" y="288" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">12%</text>
<text x="575" y="409" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">23%</text>
<text x="775" y="486" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">30%</text>
<text x="175" y="520" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">標普 500</text>
<text x="375" y="520" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">NVIDIA</text>
<text x="575" y="520" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Micron</text>
<text x="775" y="520" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">半導體產業群</text>
<text x="175" y="546" font-size="15" fill="var(--dim)" text-anchor="middle">上週最大</text>
<text x="375" y="546" font-size="15" fill="var(--dim)" text-anchor="middle">兩天合計</text>
<text x="575" y="546" font-size="15" fill="var(--dim)" text-anchor="middle">兩天內</text>
<text x="775" y="546" font-size="15" fill="var(--dim)" text-anchor="middle">這波最深</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="人口帶緊貼美國邊界，往美國的箭頭很短很粗，往歐洲的兩條長箭頭跨過大西洋後都被打叉">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="66">加拿大能賣給誰</text>
<rect x="60" y="150" width="150" height="250" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="135" y="272" text-anchor="middle">美國</text>
<text class="b" x="135" y="300" text-anchor="middle">實際的買家</text>
<line x1="235" y1="130" x2="235" y2="420" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="235" y="120" text-anchor="middle">邊界</text>
<rect x="240" y="150" width="320" height="250" fill="none" stroke="var(--line)"/>
<rect x="240" y="150" width="90" height="250" fill="var(--accent)" opacity="0.22"/>
<text class="g" x="450" y="182" text-anchor="middle">加拿大</text>
<text class="b" x="285" y="424" text-anchor="middle">九成人口</text>
<text class="b" x="285" y="446" text-anchor="middle">車程兩小時</text>
<rect x="360" y="230" width="170" height="48" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="360" y="310" width="170" height="48" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="445" y="261" text-anchor="middle">原料</text>
<text class="g" x="445" y="341" text-anchor="middle">工業品</text>
<line x1="355" y1="254" x2="228" y2="254" stroke="var(--accent)" stroke-width="5"/>
<polygon points="228,246 212,254 228,262" fill="var(--accent)"/>
<line x1="355" y1="334" x2="228" y2="334" stroke="var(--accent)" stroke-width="5"/>
<polygon points="228,326 212,334 228,342" fill="var(--accent)"/>
<path d="M 575 200 q 25 -14 50 0 q 25 14 50 0" fill="none" stroke="var(--grey)" stroke-width="2"/>
<path d="M 575 380 q 25 -14 50 0 q 25 14 50 0" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="630" y="424" text-anchor="middle">大西洋</text>
<line x1="535" y1="254" x2="662" y2="254" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="535" y1="334" x2="662" y2="334" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="678" y1="242" x2="700" y2="266" stroke="var(--warn)" stroke-width="4"/>
<line x1="700" y1="242" x2="678" y2="266" stroke="var(--warn)" stroke-width="4"/>
<line x1="678" y1="322" x2="700" y2="346" stroke="var(--warn)" stroke-width="4"/>
<line x1="700" y1="322" x2="678" y2="346" stroke="var(--warn)" stroke-width="4"/>
<text class="b" x="598" y="238" text-anchor="middle">已有來源</text>
<text class="b" x="598" y="318" text-anchor="middle">自己就有</text>
<rect x="712" y="150" width="178" height="250" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="801" y="286" text-anchor="middle">歐洲</text>
<text class="c" x="60" y="505">人在邊界旁，替代市場在海的另一邊</text>
</svg>
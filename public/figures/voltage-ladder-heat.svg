<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="電壓階梯：五階由高往低下降，每一階交界冒出熱">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="80" y="62" font-size="27" font-weight="700" fill="var(--ink)">電壓階梯：每降一階，就掉一點熱</text>

<rect x="80" y="120" width="160" height="320" fill="var(--accent)" opacity="0.85"/>
<rect x="240" y="190" width="160" height="250" fill="var(--accent)" opacity="0.70"/>
<rect x="400" y="255" width="160" height="185" fill="var(--accent)" opacity="0.55"/>
<rect x="560" y="315" width="160" height="125" fill="var(--accent)" opacity="0.40"/>
<rect x="720" y="370" width="160" height="70" fill="var(--accent)" opacity="0.28"/>
<line x1="80" y1="440" x2="880" y2="440" stroke="var(--ink)" stroke-width="2"/>

<text class="t" x="160" y="110" font-size="15" fill="var(--dim)" text-anchor="middle">數十萬伏</text>
<text class="t" x="320" y="180" font-size="15" fill="var(--dim)" text-anchor="middle">數萬伏</text>
<text class="t" x="480" y="245" font-size="15" fill="var(--dim)" text-anchor="middle">數百伏</text>
<text class="t" x="640" y="305" font-size="15" fill="var(--dim)" text-anchor="middle">數十伏</text>
<text class="t" x="800" y="360" font-size="15" fill="var(--dim)" text-anchor="middle">約一伏</text>

<text class="t" x="160" y="472" font-size="19" fill="var(--ink)" text-anchor="middle">電網</text>
<text class="t" x="320" y="472" font-size="19" fill="var(--ink)" text-anchor="middle">變電</text>
<text class="t" x="480" y="472" font-size="19" fill="var(--ink)" text-anchor="middle">整流儲能</text>
<text class="t" x="640" y="472" font-size="19" fill="var(--ink)" text-anchor="middle">降壓</text>
<text class="t" x="800" y="472" font-size="19" fill="var(--ink)" text-anchor="middle">GPU</text>

<g stroke="var(--warn)" stroke-width="2" fill="var(--warn)">
<line x1="240" y1="150" x2="240" y2="100"/><polygon points="240,88 234,104 246,104"/>
<line x1="400" y1="220" x2="400" y2="170"/><polygon points="400,158 394,174 406,174"/>
<line x1="560" y1="285" x2="560" y2="235"/><polygon points="560,223 554,239 566,239"/>
<line x1="720" y1="345" x2="720" y2="295"/><polygon points="720,283 714,299 726,299"/>
</g>
<text class="t" x="258" y="96" font-size="15" fill="var(--warn)">熱</text>
<text class="t" x="418" y="166" font-size="15" fill="var(--warn)">熱</text>
<text class="t" x="578" y="231" font-size="15" fill="var(--warn)">熱</text>
<text class="t" x="738" y="291" font-size="15" fill="var(--warn)">熱</text>

<text class="t" x="80" y="524" font-size="22" font-weight="700" fill="var(--ink)">熱要再花電去冷卻</text>
</svg>
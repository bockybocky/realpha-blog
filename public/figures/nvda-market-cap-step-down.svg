<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根柱子的高度差，左高右低，從 5.5 兆美元降到 4 兆美元以下">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" fill="var(--ink)">兩週之間的高度差</text>
<line x1="150" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="240" y="140" width="150" height="300" fill="var(--grey)"/>
<rect x="540" y="222" width="150" height="218" fill="var(--accent)"/>
<text x="315" y="124" font-size="20" fill="var(--ink)" text-anchor="middle">5.5 兆美元</text>
<text x="615" y="206" font-size="20" fill="var(--ink)" text-anchor="middle">4 兆美元以下</text>
<text x="315" y="472" font-size="16" fill="var(--dim)" text-anchor="middle">兩週前</text>
<text x="615" y="472" font-size="16" fill="var(--dim)" text-anchor="middle">隔夜盤後</text>
<text x="760" y="300" font-size="16" fill="var(--dim)">30 天內</text>
<text x="760" y="326" font-size="16" fill="var(--dim)">跌超過三成</text>
<text x="60" y="505" font-size="22" fill="var(--ink)">掉下來的是一整段，不是一次修正</text>
</svg>
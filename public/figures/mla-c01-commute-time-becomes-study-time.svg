<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上下兩條等長時間帶對比，下面那條除了書桌時段外，通勤的兩段也被填滿">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">同樣一天，可讀書的格子變多</text>

  <text class="t" x="60" y="140" font-size="19" fill="var(--dim)">配音之前</text>
  <rect x="60" y="158" width="840" height="54" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="420" y="158" width="170" height="54" rx="6" fill="var(--accent)"/>
  <text class="t" x="505" y="192" font-size="16" fill="var(--page)" text-anchor="middle">書桌</text>
  <text class="t" x="230" y="192" font-size="15" fill="var(--dim)" text-anchor="middle">通勤</text>
  <text class="t" x="740" y="192" font-size="15" fill="var(--dim)" text-anchor="middle">通勤</text>

  <text class="t" x="60" y="300" font-size="19" fill="var(--dim)">配音之後</text>
  <rect x="60" y="318" width="840" height="54" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="150" y="318" width="160" height="54" rx="6" fill="var(--accent)" opacity="0.6"/>
  <rect x="420" y="318" width="170" height="54" rx="6" fill="var(--accent)"/>
  <rect x="660" y="318" width="160" height="54" rx="6" fill="var(--accent)" opacity="0.6"/>
  <text class="t" x="230" y="352" font-size="16" fill="var(--page)" text-anchor="middle">聽題</text>
  <text class="t" x="505" y="352" font-size="16" fill="var(--page)" text-anchor="middle">書桌</text>
  <text class="t" x="740" y="352" font-size="16" fill="var(--page)" text-anchor="middle">聽題</text>

  <text class="t" x="60" y="450" font-size="22" font-weight="600" fill="var(--ink)">多出來的，是原本空著的兩段路</text>
</svg>
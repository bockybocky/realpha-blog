<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="上下兩格各有一條水平門檻線，上格的走勢剛穿到線上，下格的走勢摔到線下又跳回線上">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="72" font-size="27" fill="var(--ink)">腳下兩條線，踩住才算多頭</text>
<rect x="60" y="110" width="840" height="200" fill="var(--card)"/>
<text x="80" y="146" font-size="20" fill="var(--ink)">標普銀行指數</text>
<line x1="80" y1="200" x2="880" y2="200" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="700" y="190" font-size="16" fill="var(--dim)">2007 年 1 月那個高點</text>
<polyline points="90,290 200,275 320,265 440,245 560,235 680,215 790,196 870,178" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="870" cy="178" r="7" fill="var(--accent)"/>
<text x="80" y="300" font-size="16" fill="var(--dim)">當年見高之後九個月，整個市場才見頂</text>
<rect x="60" y="340" width="840" height="200" fill="var(--card)"/>
<text x="80" y="376" font-size="20" fill="var(--ink)">半導體指數</text>
<line x1="80" y1="430" x2="880" y2="430" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="80" y="420" font-size="16" fill="var(--dim)">七月低點</text>
<polyline points="90,400 300,395 430,392" fill="none" stroke="var(--warn)" stroke-width="4"/>
<polyline points="470,470 540,485 610,490 680,480" fill="none" stroke="var(--warn)" stroke-width="4"/>
<polyline points="680,480 760,412 870,400" fill="none" stroke="var(--warn)" stroke-width="4"/>
<line x1="430" y1="392" x2="470" y2="470" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 5"/>
<text x="470" y="520" font-size="16" fill="var(--dim)">跳空摔破，連破四天，前一天又跳回線上</text>
<text x="60" y="578" font-size="22" fill="var(--ink)">線破了，劇本作廢</text>
</svg>
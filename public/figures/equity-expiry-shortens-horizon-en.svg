<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The upper line extends to the far right, while the lower line stops midway and continues only as a dashed line.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">Equity's expiry sets the horizon</text>
<rect x="80" y="100" width="800" height="150" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="100" y="140" fill="var(--accent)">One Microsoft share</text>
<line x1="140" y1="205" x2="836" y2="205" stroke="var(--accent)" stroke-width="4"/>
<polygon points="836,197 852,205 836,213" fill="var(--accent)"/>
<circle cx="400" cy="205" r="8" fill="var(--accent)"/>
<text class="b" x="400" y="182" text-anchor="middle">I sell next week</text>
<text class="b" x="840" y="182" text-anchor="end">Ten-year returns enter the sale price</text>
<rect x="80" y="280" width="800" height="150" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="100" y="320" fill="var(--warn)">Partner equity</text>
<line x1="140" y1="385" x2="500" y2="385" stroke="var(--warn)" stroke-width="4"/>
<circle cx="500" cy="385" r="8" fill="var(--warn)"/>
<line x1="540" y1="385" x2="850" y2="385" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 9"/>
<text class="b" x="500" y="362" text-anchor="middle">Expires at retirement</text>
<text class="b" x="840" y="362" text-anchor="end">Ten years later · Not my concern</text>
<text class="c" x="60" y="490">Rent AI, don't buy it; renovate offices, don't own them</text>
</svg>
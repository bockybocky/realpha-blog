<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bar charts: on the left the refund is packed into three months and followed by a cliff, while on the right the same refund is spread across six months.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="48" text-anchor="middle">Pace decides the cliff</text>
<text class="s" x="480" y="80" text-anchor="middle">Equal blue area (illus.)</text>
<rect x="40" y="98" width="440" height="392" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="500" y="98" width="440" height="392" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="260" y="135" text-anchor="middle">In 2-3 mo</text>
<text class="g" x="720" y="135" text-anchor="middle">6 months</text>
<g fill="var(--grey)">
<rect x="62" y="340" width="30" height="100"/>
<rect x="106" y="340" width="30" height="100"/>
<rect x="150" y="340" width="30" height="100"/>
<rect x="194" y="340" width="30" height="100"/>
<rect x="238" y="340" width="30" height="100"/>
<rect x="282" y="340" width="30" height="100"/>
<rect x="326" y="340" width="30" height="100"/>
<rect x="370" y="340" width="30" height="100"/>
<rect x="414" y="340" width="30" height="100"/>
<rect x="522" y="340" width="30" height="100"/>
<rect x="566" y="340" width="30" height="100"/>
<rect x="610" y="340" width="30" height="100"/>
<rect x="654" y="340" width="30" height="100"/>
<rect x="698" y="340" width="30" height="100"/>
<rect x="742" y="340" width="30" height="100"/>
<rect x="786" y="340" width="30" height="100"/>
<rect x="830" y="340" width="30" height="100"/>
<rect x="874" y="340" width="30" height="100"/>
</g>
<g fill="var(--accent)">
<rect x="106" y="260" width="30" height="80"/>
<rect x="150" y="260" width="30" height="80"/>
<rect x="194" y="260" width="30" height="80"/>
<rect x="566" y="300" width="30" height="40"/>
<rect x="610" y="300" width="30" height="40"/>
<rect x="654" y="300" width="30" height="40"/>
<rect x="698" y="300" width="30" height="40"/>
<rect x="742" y="300" width="30" height="40"/>
<rect x="786" y="300" width="30" height="40"/>
</g>
<line x1="253" y1="262" x2="253" y2="322" stroke="var(--warn)" stroke-width="3"/>
<polygon points="244,320 262,320 253,336" fill="var(--warn)"/>
<text class="g" x="272" y="300" style="fill:var(--warn)">Gap</text>
<line x1="566" y1="285" x2="816" y2="285" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="566" y1="285" x2="566" y2="294" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="816" y1="285" x2="816" y2="294" stroke="var(--accent)" stroke-width="2.5"/>
<text class="g" x="691" y="272" text-anchor="middle" style="fill:var(--accent)">Runway</text>
<line x1="56" y1="440" x2="450" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="516" y1="440" x2="910" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="121" y="465" text-anchor="middle">May</text>
<text class="s" x="429" y="465" text-anchor="middle">Dec</text>
<text class="s" x="581" y="465" text-anchor="middle">May</text>
<text class="s" x="889" y="465" text-anchor="middle">Dec</text>
<text class="c" x="480" y="536" text-anchor="middle">Ask how much is left</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左組就業人口向下而右組兩項都向上，但兩組的失業率結果都向上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="48" y="54" font-size="27" font-weight="700" fill="var(--ink)">失業率同樣回升，成因相反</text>
<rect x="48" y="92" width="416" height="300" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="496" y="92" width="416" height="300" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="72" y="130" font-size="20" font-weight="700" fill="var(--dim)">裁員型</text>
<text x="520" y="130" font-size="20" font-weight="700" fill="var(--accent)">回流型</text>
<text x="740" y="130" font-size="16" fill="var(--accent)">這次是這一種</text>
<line x1="140" y1="180" x2="140" y2="300" stroke="var(--warn)" stroke-width="6"/>
<polygon points="140,324 124,294 156,294" fill="var(--warn)"/>
<text x="92" y="358" font-size="16" fill="var(--dim)">就業人口</text>
<line x1="330" y1="250" x2="330" y2="250" stroke="var(--grey)" stroke-width="6"/>
<line x1="296" y1="250" x2="364" y2="250" stroke="var(--grey)" stroke-width="6"/>
<text x="280" y="358" font-size="16" fill="var(--dim)">勞動參與率</text>
<line x1="588" y1="300" x2="588" y2="180" stroke="var(--accent)" stroke-width="6"/>
<polygon points="588,156 572,186 604,186" fill="var(--accent)"/>
<text x="540" y="358" font-size="16" fill="var(--dim)">就業人口</text>
<line x1="790" y1="300" x2="790" y2="180" stroke="var(--accent)" stroke-width="6"/>
<polygon points="790,156 774,186 806,186" fill="var(--accent)"/>
<text x="740" y="358" font-size="16" fill="var(--dim)">勞動參與率</text>
<text x="156" y="440" font-size="19" font-weight="700" fill="var(--ink)">失業率 ↑</text>
<text x="604" y="440" font-size="19" font-weight="700" fill="var(--ink)">失業率 ↑</text>
<text x="48" y="500" font-size="22" font-weight="700" fill="var(--ink)">同一個讀數，底下的方向可以完全相反</text>
</g>
</svg>
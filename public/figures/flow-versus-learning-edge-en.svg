<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Three concentric rings: the inner ring is mastered work matching flow, the middle ring is the edge of getting stuck and making mistakes where learning happens, and the outer ring is too hard to attempt, with an arrow pointing outward from the center.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
  <marker id="arrWarn4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/>
  </marker>
</defs>
<text x="60" y="52" font-size="27" fill="var(--ink)">Where it flows, and where you grow</text>

<circle cx="480" cy="300" r="212" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="480" cy="300" r="150" fill="none" stroke="var(--warn)" stroke-width="2"/>
<circle cx="480" cy="300" r="85" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>

<text x="480" y="294" font-size="20" fill="var(--accent)" text-anchor="middle">Already mastered</text>
<text x="480" y="320" font-size="15" fill="var(--dim)" text-anchor="middle">Flow</text>

<text x="480" y="186" font-size="20" fill="var(--warn)" text-anchor="middle">The edge</text>
<text x="480" y="426" font-size="15" fill="var(--dim)" text-anchor="middle">Stuck · Mistakes · Strain</text>

<text x="480" y="122" font-size="16" fill="var(--grey)" text-anchor="middle">Too hard</text>

<line x1="540" y1="240" x2="588" y2="196" stroke="var(--warn)" stroke-width="2" marker-end="url(#arrWarn4)"/>
<text x="800" y="300" font-size="16" fill="var(--warn)" text-anchor="middle">Learning lives here</text>

<text x="480" y="558" font-size="22" fill="var(--ink)" text-anchor="middle">Not easy does not mean wrong</text>
</svg>
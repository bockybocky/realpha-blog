<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="新券成交量長條很高，兩檔舊券的長條幾乎貼地，下方價差色塊由窄變寬">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="52" text-anchor="middle">新券一過，成交量剩不到一成</text>
<text class="b" x="60" y="110">每日成交量</text>
<line x1="150" y1="390" x2="810" y2="390" stroke="var(--line)" stroke-width="2"/>
<rect x="185" y="100" width="130" height="290" fill="var(--accent)"/>
<rect x="415" y="362" width="130" height="28" fill="var(--grey)"/>
<rect x="645" y="382" width="130" height="8" fill="var(--grey)"/>
<text class="g" x="250" y="88" text-anchor="middle" style="fill:var(--accent)">563 億美元</text>
<text class="g" x="480" y="348" text-anchor="middle">55 億</text>
<text class="g" x="710" y="368" text-anchor="middle">16 億</text>
<text class="g" x="250" y="422" text-anchor="middle">新券</text>
<text class="g" x="480" y="422" text-anchor="middle">第一檔舊券</text>
<text class="g" x="710" y="422" text-anchor="middle">第二檔舊券</text>
<text class="b" x="60" y="486">買賣價差</text>
<rect x="244" y="474" width="12" height="12" fill="var(--warn)"/>
<line x1="244" y1="466" x2="244" y2="494" stroke="var(--ink)" stroke-width="2"/>
<line x1="256" y1="466" x2="256" y2="494" stroke="var(--ink)" stroke-width="2"/>
<rect x="465" y="474" width="30" height="12" fill="var(--warn)"/>
<line x1="465" y1="466" x2="465" y2="494" stroke="var(--ink)" stroke-width="2"/>
<line x1="495" y1="466" x2="495" y2="494" stroke="var(--ink)" stroke-width="2"/>
<rect x="682" y="474" width="56" height="12" fill="var(--warn)"/>
<line x1="682" y1="466" x2="682" y2="494" stroke="var(--ink)" stroke-width="2"/>
<line x1="738" y1="466" x2="738" y2="494" stroke="var(--ink)" stroke-width="2"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Book loss goes down, free cash flow goes up — two bars nearly equal in length but opposite in direction; the dashed box beside them is stock-based compensation, the main source of the gap.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .bb { font-size:16px; font-weight:700; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="40" y="52">Book loss, cash gain</text>
<text class="d" x="40" y="82">Last 4 qtrs, $bn</text>
<rect x="160" y="320" width="140" height="120" fill="var(--warn)"/>
<rect x="410" y="203" width="140" height="117" fill="var(--accent)"/>
<rect x="660" y="158" width="140" height="162" fill="none" stroke="var(--dim)" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="100" y1="320" x2="880" y2="320" stroke="var(--ink)" stroke-width="1.5"/>
<text class="d" x="90" y="325" text-anchor="end">0</text>
<text class="g" x="230" y="305" text-anchor="middle">Net loss (GAAP)</text>
<text class="bb" x="230" y="468" text-anchor="middle">-$1.091bn</text>
<text class="bb" x="480" y="190" text-anchor="middle">+$1.193bn</text>
<text class="g" x="480" y="348" text-anchor="middle">Free cash flow</text>
<text class="bb" x="730" y="235" text-anchor="middle">$1.64bn</text>
<text class="d" x="730" y="258" text-anchor="middle">4 qtrs</text>
<text class="g" x="730" y="348" text-anchor="middle">Stock comp</text>
<text class="d" x="730" y="372" text-anchor="middle">Expensed, non-cash</text>
<text class="c" x="480" y="510" text-anchor="middle">Gap mainly stock comp</text>
</svg>
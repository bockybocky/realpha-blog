<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three independent two-point lines side by side, all sloping from lower left to upper right in the same direction">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--ink); }
.d { font-size:16px; fill:var(--dim); }
.n { font-size:19px; font-weight:700; fill:var(--ink); }
.c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">Three sources, all revised up</text>
<line x1="340" y1="120" x2="340" y2="420" stroke="var(--line)" stroke-width="1.5"/>
<line x1="600" y1="120" x2="600" y2="420" stroke="var(--line)" stroke-width="1.5"/>
<text class="g" x="220" y="148" text-anchor="middle">Next-year growth</text>
<text class="g" x="480" y="148" text-anchor="middle">Transceivers per year</text>
<text class="g" x="740" y="148" text-anchor="middle">2027 cloud capex</text>
<line x1="140" y1="340" x2="300" y2="205" stroke="var(--accent)" stroke-width="4"/>
<circle cx="140" cy="340" r="7" fill="var(--grey)"/>
<circle cx="300" cy="205" r="8" fill="var(--accent)"/>
<text class="d" x="140" y="372" text-anchor="middle">44%</text>
<text class="n" x="300" y="186" text-anchor="middle">70%</text>
<line x1="400" y1="352" x2="560" y2="198" stroke="var(--accent)" stroke-width="4"/>
<circle cx="400" cy="352" r="7" fill="var(--grey)"/>
<circle cx="560" cy="198" r="8" fill="var(--accent)"/>
<text class="d" x="400" y="384" text-anchor="middle">50 million</text>
<text class="n" x="560" y="179" text-anchor="middle">80-90 million</text>
<line x1="660" y1="346" x2="820" y2="202" stroke="var(--accent)" stroke-width="4"/>
<circle cx="660" cy="346" r="7" fill="var(--grey)"/>
<circle cx="820" cy="202" r="8" fill="var(--accent)"/>
<text class="d" x="660" y="378" text-anchor="middle">June estimate</text>
<text class="n" x="820" y="183" text-anchor="middle">$1.3T</text>
<text class="c" x="60" y="472">Not the size, the same direction</text>
</svg>
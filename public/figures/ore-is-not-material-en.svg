<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="A funnel wide on the left and narrow on the right: the wide end is abundant copper ore, the narrow end is a smelting step with only three plants; bars below show three US plants against forty-two in China">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
  <text x="48" y="54" font-size="27" fill="var(--ink)">Ore isn't metal</text>

  <polygon points="60,100 420,218 420,282 60,380" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="420" y="218" width="120" height="64" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <rect x="540" y="232" width="300" height="36" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text x="96" y="232" font-size="20" fill="var(--ink)">Copper ore</text>
  <text x="96" y="262" font-size="16" fill="var(--dim)">Abundant</text>
  <text x="480" y="204" font-size="19" fill="var(--accent)" text-anchor="middle">Smelt·Refine</text>
  <text x="480" y="330" font-size="16" fill="var(--dim)" text-anchor="middle">3 in the US</text>
  <text x="690" y="258" font-size="19" fill="var(--ink)" text-anchor="middle">Metal</text>

  <line x1="48" y1="412" x2="912" y2="412" stroke="var(--line)" stroke-width="2"/>

  <text x="48" y="446" font-size="17" fill="var(--ink)">US</text>
  <rect x="48" y="456" width="36" height="20" fill="var(--accent)"/>
  <text x="98" y="473" font-size="16" fill="var(--dim)">3 smelters</text>

  <text x="48" y="506" font-size="17" fill="var(--ink)">China 10 yrs</text>
  <rect x="48" y="516" width="504" height="20" fill="var(--grey)"/>
  <text x="566" y="533" font-size="16" fill="var(--dim)">42 built</text>

  <text x="48" y="570" font-size="16" fill="var(--dim)">No new Al smelter in 46 yrs</text>
  <text x="48" y="606" font-size="22" fill="var(--ink)">Not the ground, the middle</text>
</svg>
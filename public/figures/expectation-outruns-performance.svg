<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-label="兩條上升線，實線是實際表現，虛線是市場內建預期且爬得更快，交叉之後預期一直高於實際">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:15px; fill:var(--dim); }
    .a { font-size:15px; fill:var(--accent); }
    .w { font-size:15px; fill:var(--warn); }
    .c { font-size:22px; }
</style>
<rect x="0" y="0" width="960" height="570" fill="var(--page)"/>
<text class="t" x="50" y="56">數字很好，股價卻跌</text>
<text class="b" x="50" y="84">比的是預期的變化，不是絕對水準</text>

<line x1="110" y1="140" x2="110" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="110" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="110" y="132">水準（示意）</text>

<polyline points="140,380 330,340 520,300 710,262 880,225" fill="none" stroke="var(--accent)" stroke-width="3"/>
<polyline points="140,405 330,338 520,278 710,222 880,168" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 5"/>
<text class="a" x="880" y="212" text-anchor="end">實際表現</text>
<text class="w" x="880" y="155" text-anchor="end">市場內建預期</text>

<line x1="345" y1="337" x2="345" y2="430" stroke="var(--grey)" stroke-dasharray="4 4"/>
<circle cx="345" cy="337" r="6" fill="var(--page)" stroke="var(--ink)" stroke-width="2"/>
<text class="b" x="345" y="452" text-anchor="middle">交叉點</text>
<text class="b" x="900" y="452" text-anchor="end">時間</text>

<polygon points="225,486 235,502 215,502" fill="var(--accent)"/>
<text class="a" x="225" y="524" text-anchor="middle">利多＝驚喜</text>
<polygon points="640,502 650,486 630,486" fill="var(--warn)"/>
<text class="w" x="640" y="524" text-anchor="middle">利多＝理所當然</text>

<text class="c" x="480" y="556" text-anchor="middle">及格線會跟著超預期一起往上移</text>
</svg>
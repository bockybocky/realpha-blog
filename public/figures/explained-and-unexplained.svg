<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="長條切成兩段，後段被補齊後整體縮成一條很短的殘差">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">差距先拆兩堆，只補一堆</text>
<text x="60" y="140" font-size="19" font-weight="700" fill="var(--dim)">整段差距</text>
<rect x="230" y="112" width="380" height="54" rx="6" fill="var(--grey)"/>
<rect x="610" y="112" width="250" height="54" rx="6" fill="var(--warn)"/>
<text x="300" y="196" font-size="16" fill="var(--dim)">可解釋：職級・年資・職種</text>
<text x="640" y="196" font-size="16" fill="var(--warn)">說不出理由的那一段</text>
<line x1="735" y1="216" x2="735" y2="278" stroke="var(--accent)" stroke-width="4"/>
<path d="M735 292 l-11 -18 h22 z" fill="var(--accent)"/>
<text x="756" y="262" font-size="19" font-weight="700" fill="var(--accent)">補起來</text>
<text x="60" y="360" font-size="19" font-weight="700" fill="var(--dim)">補完之後</text>
<rect x="230" y="332" width="42" height="54" rx="6" fill="var(--accent)"/>
<text x="290" y="370" font-size="22" font-weight="700" fill="var(--ink)">1.4%</text>
<text x="60" y="470" font-size="22" font-weight="700" fill="var(--ink)">一個數字，跟一句口號的距離</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四根柱子由矮到高，代表電路板層數從三四層增加到七十二層，但整塊板子的厚度沒有跟著長高">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="66">層數往上疊，厚度不准變厚</text>

  <line x1="60" y1="430" x2="760" y2="430" stroke="var(--line)" stroke-width="2"/>

  <rect x="90" y="410" width="120" height="20" fill="var(--grey)"/>
  <text class="g" x="150" y="464" text-anchor="middle">老規格</text>
  <text class="d" x="150" y="490" text-anchor="middle">三四層</text>

  <rect x="250" y="370" width="120" height="60" fill="var(--grey)"/>
  <line x1="250" y1="390" x2="370" y2="390" stroke="var(--page)" stroke-width="2"/>
  <line x1="250" y1="410" x2="370" y2="410" stroke="var(--page)" stroke-width="2"/>
  <text class="g" x="310" y="464" text-anchor="middle">近年</text>
  <text class="d" x="310" y="490" text-anchor="middle">十到十二層</text>

  <rect x="410" y="280" width="120" height="150" fill="var(--accent)"/>
  <line x1="410" y1="310" x2="530" y2="310" stroke="var(--page)" stroke-width="2"/>
  <line x1="410" y1="340" x2="530" y2="340" stroke="var(--page)" stroke-width="2"/>
  <line x1="410" y1="370" x2="530" y2="370" stroke="var(--page)" stroke-width="2"/>
  <line x1="410" y1="400" x2="530" y2="400" stroke="var(--page)" stroke-width="2"/>
  <text class="g" x="470" y="464" text-anchor="middle">新一代伺服器</text>
  <text class="d" x="470" y="490" text-anchor="middle">二十到三十層</text>

  <rect x="570" y="110" width="120" height="320" fill="var(--accent)"/>
  <line x1="570" y1="150" x2="690" y2="150" stroke="var(--page)" stroke-width="2"/>
  <line x1="570" y1="190" x2="690" y2="190" stroke="var(--page)" stroke-width="2"/>
  <line x1="570" y1="230" x2="690" y2="230" stroke="var(--page)" stroke-width="2"/>
  <line x1="570" y1="270" x2="690" y2="270" stroke="var(--page)" stroke-width="2"/>
  <line x1="570" y1="310" x2="690" y2="310" stroke="var(--page)" stroke-width="2"/>
  <line x1="570" y1="350" x2="690" y2="350" stroke="var(--page)" stroke-width="2"/>
  <line x1="570" y1="390" x2="690" y2="390" stroke="var(--page)" stroke-width="2"/>
  <text class="g" x="630" y="464" text-anchor="middle">展示品</text>
  <text class="d" x="630" y="490" text-anchor="middle">七十二層</text>

  <rect x="790" y="300" width="110" height="14" fill="var(--warn)"/>
  <text class="g" x="845" y="286" text-anchor="middle">厚度</text>
  <text class="d" x="845" y="340" text-anchor="middle">不到三四毫米</text>
  <text class="d" x="845" y="364" text-anchor="middle">單層五十微米</text>

  <text class="c" x="60" y="530">層數翻了十幾倍，每一層只能更薄</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩個同樣大的容器，左邊只裝到底部一小塊，右邊水位滿出來而且容器口還略窄一點">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="66" font-size="27" font-weight="700" fill="var(--ink)">錢變多，位子沒變多</text>
<text x="240" y="130" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">二〇二〇年</text>
<rect x="120" y="160" width="240" height="300" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="120" y="370" width="240" height="90" rx="8" fill="var(--accent)" opacity="0.6"/>
<text x="240" y="424" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">約三千億美元</text>
<text x="240" y="496" font-size="16" fill="var(--dim)" text-anchor="middle">容器＝可交易的標的</text>
<text x="700" y="130" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">今天</text>
<rect x="600" y="160" width="200" height="300" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="600" y="170" width="200" height="290" rx="8" fill="var(--accent)"/>
<rect x="600" y="118" width="200" height="40" rx="6" fill="var(--warn)"/>
<text x="700" y="146" font-size="16" font-weight="700" fill="var(--page)" text-anchor="middle">滿出來的部分</text>
<text x="700" y="324" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">超過一兆美元</text>
<text x="700" y="356" font-size="16" fill="var(--page)" text-anchor="middle">而且還能加槓桿</text>
<text x="700" y="496" font-size="16" fill="var(--dim)" text-anchor="middle">容器沒變大，甚至縮水</text>
<text x="80" y="540" font-size="22" font-weight="700" fill="var(--ink)">擁擠不是誰看錯，是大家做同一件事</text>
</svg>
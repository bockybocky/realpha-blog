<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左側柱子大幅升高、右側柱子大幅降低，兩邊方向相反">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="64" font-size="27" fill="var(--ink)">上半年：一邊往上，一邊往下</text>

<rect x="60" y="96" width="400" height="360" fill="var(--card)" rx="10"/>
<text x="90" y="130" font-size="20" fill="var(--dim)">收入</text>
<line x1="90" y1="420" x2="430" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="130" y="401" width="90" height="19" fill="var(--grey)" rx="3"/>
<text x="130" y="392" font-size="16" fill="var(--dim)">10 億美元</text>
<text x="130" y="444" font-size="16" fill="var(--dim)">去年同期</text>
<rect x="290" y="150" width="90" height="270" fill="var(--accent)" rx="3"/>
<text x="290" y="140" font-size="16" fill="var(--ink)">160 億美元</text>
<text x="290" y="444" font-size="16" fill="var(--dim)">今年上半年</text>

<rect x="500" y="96" width="400" height="360" fill="var(--card)" rx="10"/>
<text x="530" y="130" font-size="20" fill="var(--dim)">營業虧損</text>
<line x1="530" y1="160" x2="870" y2="160" stroke="var(--line)" stroke-width="2"/>
<rect x="570" y="160" width="90" height="230" fill="var(--warn)" rx="3"/>
<text x="570" y="412" font-size="16" fill="var(--ink)">21 億美元</text>
<text x="570" y="444" font-size="16" fill="var(--dim)">去年同期</text>
<rect x="730" y="160" width="90" height="76" fill="var(--warn)" opacity="0.55" rx="3"/>
<text x="730" y="258" font-size="16" fill="var(--ink)">6.93 億美元</text>
<text x="730" y="444" font-size="16" fill="var(--dim)">今年上半年</text>

<text x="60" y="516" font-size="22" fill="var(--ink)">短期的質疑，答案在這兩個方向裡；長期的兩題一個字都沒動</text>
</g>
</svg>
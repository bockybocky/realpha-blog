<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two cards for the scarcest layers both point right to value-add, showing that money switches layers when the scarcest cannot push price" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">When the scarcest layer cannot push price, money moves on</text>

<rect x="60" y="110" width="400" height="140" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="88" y="146" font-size="15" fill="var(--dim)">Components</text>
<text x="88" y="184" font-size="20" font-weight="700" fill="var(--ink)">Memory</text>
<text x="88" y="216" font-size="15" fill="var(--dim)">Scarcest · clearest outlook</text>

<rect x="60" y="290" width="400" height="140" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="88" y="326" font-size="15" fill="var(--dim)">Bottlenecks</text>
<text x="88" y="364" font-size="20" font-weight="700" fill="var(--ink)">Back-end packaging and test</text>
<text x="88" y="396" font-size="15" fill="var(--dim)">What else is scarcer</text>

<path d="M470 180 H540 V262 H600" fill="none" stroke="var(--warn)" stroke-width="2"/>
<polygon points="600,254 618,262 600,270" fill="var(--warn)"/>
<text x="476" y="168" font-size="16" fill="var(--warn)">No premium</text>

<path d="M470 360 H540 V298 H600" fill="none" stroke="var(--warn)" stroke-width="2"/>
<polygon points="600,290 618,298 600,306" fill="var(--warn)"/>
<text x="476" y="348" font-size="16" fill="var(--warn)">No premium</text>

<rect x="620" y="200" width="280" height="160" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="650" y="236" font-size="15" fill="var(--dim)">Third layer</text>
<text x="650" y="276" font-size="20" font-weight="700" fill="var(--accent)">Value-add</text>
<text x="650" y="308" font-size="15" fill="var(--dim)">Iteration · software</text>
<text x="650" y="334" font-size="15" fill="var(--dim)">Money returns</text>

<text x="480" y="500" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Check whether the scarcest layer commands a premium</text>
</svg>
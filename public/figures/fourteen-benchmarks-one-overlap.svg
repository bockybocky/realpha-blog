<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩個重疊的集合框，左邊十三格、交集只有一格，右邊是綜合榜">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="80" y="58" font-size="27" font-weight="700" fill="var(--ink)">發布文列的，和外界在看的</text>

  <rect x="80" y="110" width="480" height="300" rx="18" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="400" y="110" width="470" height="300" rx="18" fill="none" stroke="var(--accent)" stroke-width="2.5"/>

  <text x="108" y="148" font-size="19" font-weight="600" fill="var(--dim)">發布文挑的 14 個測驗</text>
  <text x="842" y="148" font-size="19" font-weight="600" fill="var(--accent)" text-anchor="end">外界常引用的綜合榜</text>

  <g fill="var(--grey)">
    <rect x="108" y="178" width="46" height="30" rx="6"/>
    <rect x="166" y="178" width="46" height="30" rx="6"/>
    <rect x="224" y="178" width="46" height="30" rx="6"/>
    <rect x="282" y="178" width="46" height="30" rx="6"/>
    <rect x="108" y="222" width="46" height="30" rx="6"/>
    <rect x="166" y="222" width="46" height="30" rx="6"/>
    <rect x="224" y="222" width="46" height="30" rx="6"/>
    <rect x="282" y="222" width="46" height="30" rx="6"/>
    <rect x="108" y="266" width="46" height="30" rx="6"/>
    <rect x="166" y="266" width="46" height="30" rx="6"/>
    <rect x="224" y="266" width="46" height="30" rx="6"/>
    <rect x="282" y="266" width="46" height="30" rx="6"/>
    <rect x="108" y="310" width="46" height="30" rx="6"/>
  </g>
  <text x="108" y="368" font-size="16" fill="var(--dim)">13 個只在發布文裡</text>

  <rect x="440" y="230" width="80" height="46" rx="8" fill="var(--accent)"/>
  <text x="480" y="260" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">1</text>
  <text x="480" y="308" font-size="16" fill="var(--ink)" text-anchor="middle">唯一重疊</text>

  <text x="700" y="252" font-size="19" font-weight="600" fill="var(--ink)" text-anchor="middle">榜上排第五</text>
  <text x="700" y="284" font-size="16" fill="var(--dim)" text-anchor="middle">落在另一家後面</text>

  <text x="80" y="486" font-size="22" font-weight="600" fill="var(--ink)">十四取一，剩下十三個沒有人替你比。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Proportion bar: a large gray segment of about 90% on the left, a thin sliver under 5% in the middle, and a small warning-colored segment of about 10% on the right, boxed below and labeled as the part that bites."><rect x="0" y="0" width="960" height="560" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:19px;font-weight:600}.b{font-size:16px;fill:var(--dim)}.k{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}
</style>
<text x="480" y="52" text-anchor="middle" class="t">$3.5T off-book, split by who pays</text>
<rect x="80" y="140" width="688" height="90" fill="var(--grey)"/>
<rect x="768" y="140" width="32" height="90" fill="var(--dim)"/>
<rect x="800" y="140" width="80" height="90" fill="var(--warn)"/>
<text x="424" y="193" text-anchor="middle" class="g">$3.5T</text>
<g stroke="var(--dim)" stroke-width="1.5">
<line x1="424" y1="230" x2="250" y2="290"/>
<line x1="784" y1="230" x2="560" y2="290"/>
<line x1="840" y1="230" x2="820" y2="290"/>
</g>
<rect x="715" y="292" width="210" height="136" rx="10" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 4"/>
<g text-anchor="middle">
<text x="250" y="320" class="g">Buys+leases</text>
<text x="250" y="356" class="k">~90%</text>
<text x="250" y="386" class="b">Contract</text>
<text x="250" y="412" class="b">Books later</text>
<text x="560" y="320" class="g">Loops</text>
<text x="560" y="356" class="k">&lt;5%</text>
<text x="560" y="386" class="b">Self</text>
<text x="560" y="412" class="b">Equity → 0</text>
<text x="820" y="320" class="g w">Guar.</text>
<text x="820" y="356" class="k w">~10%</text>
<text x="820" y="386" class="b">$300–500B</text>
<text x="820" y="412" class="b w">Spreads</text>
<text x="820" y="458" class="g w">Risk</text>
</g>
<text x="80" y="458" class="b">Approx.</text>
<text x="480" y="520" text-anchor="middle" class="k">Pile 3 bites; unbooked</text>
</svg>
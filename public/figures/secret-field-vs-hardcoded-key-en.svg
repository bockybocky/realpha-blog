<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Top panel: the key is inside the code and the copy still carries it. Bottom panel: the key is in an external secret field and the copy is empty.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .ti { font:700 27px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .lb { font:600 19px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .sm { font:400 16px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
    .wn { font:600 19px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--warn); }
    .ac { font:600 19px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--accent); }
    .cc { font:700 22px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--accent); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ti" x="80" y="62">Where the key lives</text>

  <rect x="80" y="100" width="260" height="130" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="lb" x="104" y="138">Code</text>
  <rect x="104" y="158" width="130" height="44" rx="6" fill="var(--warn)"/>
  <text class="sm" x="118" y="186" fill="var(--page)">Key</text>

  <line x1="360" y1="165" x2="540" y2="165" stroke="var(--grey)" stroke-width="3"/>
  <path d="M540 165 l-16 -8 v16 z" fill="var(--grey)"/>
  <text class="sm" x="400" y="150">Copied</text>

  <rect x="560" y="100" width="260" height="130" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="lb" x="584" y="138">Their copy</text>
  <rect x="584" y="158" width="130" height="44" rx="6" fill="var(--warn)"/>
  <text class="sm" x="598" y="186" fill="var(--page)">Key</text>
  <text class="wn" x="836" y="172">Leak</text>

  <rect x="80" y="300" width="260" height="130" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="lb" x="104" y="338">Code</text>
  <rect x="104" y="358" width="130" height="44" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="80" y="452" width="260" height="56" rx="8" fill="var(--accent)"/>
  <text class="lb" x="104" y="488" fill="var(--page)">Secret field</text>

  <line x1="360" y1="365" x2="540" y2="365" stroke="var(--grey)" stroke-width="3"/>
  <path d="M540 365 l-16 -8 v16 z" fill="var(--grey)"/>
  <text class="sm" x="400" y="350">Copied</text>

  <rect x="560" y="300" width="260" height="130" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="lb" x="584" y="338">Their copy</text>
  <rect x="584" y="358" width="130" height="44" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="ac" x="836" y="372">Empty</text>
</svg>
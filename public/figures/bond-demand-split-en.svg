<svg xmlns="http://www.w3.org/2000/svg" id="fig-bond-flow" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One flow of money splits into a thick branch to corporate bonds and a thin branch to Treasuries, pushing Treasury yields higher">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
#fig-bond-flow text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-bond-flow .h { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-bond-flow .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-bond-flow .b { font-size:16px; fill:var(--dim); }
#fig-bond-flow .s { font-size:15px; fill:var(--dim); }
#fig-bond-flow .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="h" x="60" y="54">One pool; the split sets price</text>
<path d="M 250 285 C 400 285 430 200 560 200" fill="none" stroke="var(--accent)" stroke-width="40" stroke-linecap="round"/>
<path d="M 250 305 C 400 305 430 420 560 420" fill="none" stroke="var(--grey)" stroke-width="14" stroke-linecap="round"/>
<rect x="70" y="240" width="180" height="110" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="160" y="288" text-anchor="middle">Bond money</text>
<text class="s" x="160" y="316" text-anchor="middle">Finite</text>
<rect x="560" y="150" width="300" height="100" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="580" y="192">IG corporates</text>
<text class="s" x="580" y="220">~$1.75T this year, up 20–30%</text>
<rect x="560" y="370" width="300" height="100" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="580" y="412">Treasuries</text>
<text class="s" x="580" y="440">Fewer buyers</text>
<path d="M 890 460 L 890 372" fill="none" stroke="var(--warn)" stroke-width="5"/>
<path d="M 890 360 L 880 382 L 900 382 Z" fill="var(--warn)"/>
<text class="s" x="905" y="430" fill="var(--warn)" transform="rotate(-90 905 430)">Yield↑</text>
<text class="c" x="60" y="520">Where money goes, yields fall</text>
</svg>
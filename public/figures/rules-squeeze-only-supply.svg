<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左側賣壓被三條規則夾緊變窄，右側需求完全沒動">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="56" y="66">新規則動的是哪一側</text>
<rect x="56" y="110" width="430" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="88" y="150">賣壓</text>
<rect x="190" y="180" width="150" height="200" fill="var(--grey)" opacity="0.5"/>
<rect x="236" y="180" width="58" height="200" fill="var(--warn)"/>
<polygon points="150,210 186,230 186,190" fill="var(--accent)"/>
<polygon points="150,280 186,300 186,260" fill="var(--accent)"/>
<polygon points="150,350 186,370 186,330" fill="var(--accent)"/>
<polygon points="380,210 344,230 344,190" fill="var(--accent)"/>
<polygon points="380,280 344,300 344,260" fill="var(--accent)"/>
<polygon points="380,350 344,370 344,330" fill="var(--accent)"/>
<text class="b" x="88" y="412">借券上限、融券擔保、穩定基金</text>
<rect x="520" y="110" width="384" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="552" y="150">需求</text>
<rect x="640" y="180" width="150" height="200" fill="var(--accent)"/>
<text class="b" x="552" y="412">一個字都沒改</text>
<text class="c" x="56" y="492">價格變了，可是沒有新資訊</text>
</svg>
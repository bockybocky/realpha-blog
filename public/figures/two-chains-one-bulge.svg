<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩條相同供應鏈，一條訂單落在源頭，一條中段鼓起堆料">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">同一句「排隊」，兩種形狀</text>

<text class="t" x="48" y="140" font-size="20" font-weight="700" fill="var(--accent)">需求拉動</text>
<rect x="200" y="152" width="180" height="56" rx="6" fill="var(--accent)"/>
<rect x="400" y="152" width="180" height="56" rx="6" fill="var(--grey)"/>
<rect x="600" y="152" width="180" height="56" rx="6" fill="var(--grey)"/>
<text class="t" x="290" y="188" font-size="16" fill="var(--page)" text-anchor="middle">設備端</text>
<text class="t" x="490" y="188" font-size="16" fill="var(--ink)" text-anchor="middle">中段</text>
<text class="t" x="690" y="188" font-size="16" fill="var(--ink)" text-anchor="middle">需求端</text>
<circle cx="290" cy="124" r="13" fill="var(--accent)"/>
<text class="t" x="320" y="131" font-size="16" fill="var(--accent)">訂單先落這裡</text>

<text class="t" x="48" y="370" font-size="20" font-weight="700" fill="var(--warn)">產能與電力卡住</text>
<rect x="200" y="382" width="180" height="56" rx="6" fill="var(--grey)"/>
<rect x="400" y="300" width="180" height="138" rx="6" fill="var(--warn)"/>
<rect x="600" y="382" width="180" height="56" rx="6" fill="var(--grey)"/>
<text class="t" x="290" y="418" font-size="16" fill="var(--ink)" text-anchor="middle">設備端</text>
<text class="t" x="490" y="418" font-size="16" fill="var(--page)" text-anchor="middle">中段</text>
<text class="t" x="690" y="418" font-size="16" fill="var(--ink)" text-anchor="middle">需求端</text>
<line x1="400" y1="282" x2="580" y2="282" stroke="var(--warn)" stroke-width="2.5"/>
<text class="t" x="600" y="288" font-size="16" fill="var(--warn)">堆在這裡</text>

<text class="t" x="48" y="520" font-size="22" font-weight="700" fill="var(--ink)">新聞寫起來一樣，下一步不一樣</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一個小團隊分出五條交付線，其中一條沒接上而落進缺口">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">一個小團隊，五個要同時交的東西</text>
  <rect x="60" y="230" width="150" height="90" rx="6" fill="var(--accent)"/>
  <text class="g" x="135" y="268" fill="var(--page)" text-anchor="middle">彭扎</text>
  <text class="b" x="135" y="296" fill="var(--page)" text-anchor="middle">幾十人</text>
  <g stroke="var(--grey)" stroke-width="3" fill="none">
    <path d="M210 275 C330 275 350 140 520 140"/>
    <path d="M210 275 C330 275 350 205 520 205"/>
    <path d="M210 275 C330 275 350 270 520 270"/>
    <path d="M210 275 C330 275 350 335 520 335"/>
  </g>
  <path d="M210 275 C330 275 360 420 470 460" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="520" y="116" width="320" height="48" rx="5" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="540" y="147">作業系統</text>
  <rect x="520" y="181" width="320" height="48" rx="5" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="540" y="212">ARMU 翻譯器</text>
  <rect x="520" y="246" width="320" height="48" rx="5" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="540" y="277">服務與測試程式</text>
  <rect x="520" y="311" width="320" height="48" rx="5" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="540" y="342">客製專案</text>
  <path d="M430 430 L900 430 L900 500 L430 500 Z" fill="var(--warn)" opacity="0.12"/>
  <text class="g" x="450" y="470" fill="var(--warn)">掉進縫裡的那些</text>
  <text class="c" x="60" y="400">機器照出廠，軟體沒跟著到</text>
</svg>
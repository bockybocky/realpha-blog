<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Five nodes joined end to end in a closed loop, with arrows going all the way around back to the start.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<defs>
  <marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1 1 L10 6 L1 11 z" fill="var(--accent)"/>
  </marker>
</defs>
<text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">Profits circle back to themselves</text>

<path d="M480 212 L 616 311" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#ar)"/>
<path d="M648 356 L 596 440" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#ar)"/>
<path d="M548 484 L 420 484" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#ar)"/>
<path d="M372 440 L 320 356" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#ar)"/>
<path d="M344 311 L 480 212" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#ar)"/>

<rect x="380" y="152" width="200" height="56" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="404" y="188" font-size="20" font-weight="700" fill="var(--ink)">Debt funding</text>

<rect x="620" y="282" width="200" height="56" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="644" y="318" font-size="20" font-weight="700" fill="var(--ink)">Capital spending</text>

<rect x="552" y="456" width="200" height="56" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="576" y="492" font-size="20" font-weight="700" fill="var(--ink)">Corporate profits</text>

<rect x="208" y="456" width="200" height="56" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="232" y="492" font-size="20" font-weight="700" fill="var(--ink)">Stock wealth</text>

<rect x="140" y="282" width="200" height="56" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="164" y="318" font-size="20" font-weight="700" fill="var(--ink)">Consumption</text>

<text x="396" y="372" font-size="22" font-weight="700" fill="var(--warn)">Until it is not safe</text>
</svg>
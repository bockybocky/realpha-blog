<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="橫向時間線，更早是 Córdoba 等人確立路線，8 月 15 日 Buckmaster 等人找到簡化版奇點，17 天後 9 月 1 日 OpenAI 聽到風聲，再 8 天後 9 月 9 日宣布解開">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="56" class="t">同一條路線的時間線</text>
<line x1="100" y1="290" x2="270" y2="290" stroke="var(--grey)" stroke-width="2"/>
<line x1="272" y1="302" x2="284" y2="278" stroke="var(--grey)" stroke-width="2"/>
<line x1="286" y1="302" x2="298" y2="278" stroke="var(--grey)" stroke-width="2"/>
<line x1="310" y1="290" x2="880" y2="290" stroke="var(--grey)" stroke-width="2"/>
<circle cx="180" cy="290" r="11" fill="var(--grey)"/>
<circle cx="413" cy="290" r="11" fill="var(--grey)"/>
<circle cx="697" cy="290" r="11" fill="var(--accent)"/>
<circle cx="830" cy="290" r="11" fill="var(--accent)"/>
<text x="180" y="226" class="b" text-anchor="middle">Córdoba 等人</text>
<text x="180" y="252" class="d" text-anchor="middle">確立路線</text>
<text x="413" y="226" class="b" text-anchor="middle">Buckmaster 等人</text>
<text x="413" y="252" class="d" text-anchor="middle">簡化版奇點</text>
<text x="697" y="226" class="b" text-anchor="middle">OpenAI</text>
<text x="697" y="252" class="d" text-anchor="middle">聽到風聲</text>
<text x="830" y="226" class="b" text-anchor="middle">OpenAI</text>
<text x="830" y="252" class="d" text-anchor="middle">宣布解開</text>
<text x="180" y="326" class="d" text-anchor="middle">更早</text>
<text x="413" y="326" class="d" text-anchor="middle">8/15</text>
<text x="697" y="326" class="d" text-anchor="middle">9/1</text>
<text x="830" y="326" class="d" text-anchor="middle">9/9</text>
<path d="M413,350 L413,362 L691,362 L691,350" fill="none" stroke="var(--dim)" stroke-width="2"/>
<text x="552" y="392" class="g" text-anchor="middle">17 天</text>
<path d="M703,350 L703,362 L830,362 L830,350" fill="none" stroke="var(--dim)" stroke-width="2"/>
<text x="766" y="392" class="g" text-anchor="middle">8 天</text>
<circle cx="370" cy="455" r="8" fill="var(--grey)"/>
<text x="386" y="461" class="b">數學家</text>
<circle cx="520" cy="455" r="8" fill="var(--accent)"/>
<text x="536" y="461" class="b">OpenAI</text>
</svg>
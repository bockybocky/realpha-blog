<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="集中停放的機群與分散加固的機群空間對比">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  .h{font-size:27px;font-weight:700;fill:var(--ink)}
  .g{font-size:19px;font-weight:700;fill:var(--ink)}
  .b{font-size:16px;fill:var(--dim)}
  .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="60" y="68">同樣的飛機，兩種擺法</text>
<rect x="60" y="110" width="400" height="320" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="84" y="150" fill="var(--warn)">中東基地</text>
<text class="t b" x="84" y="178">一個中隊疊一個中隊</text>
<line x1="84" y1="268" x2="436" y2="268" stroke="var(--grey)" stroke-width="3"/>
<rect x="96" y="240" width="40" height="22" rx="3" fill="var(--warn)"/>
<rect x="140" y="240" width="40" height="22" rx="3" fill="var(--warn)"/>
<rect x="184" y="240" width="40" height="22" rx="3" fill="var(--warn)"/>
<rect x="228" y="240" width="40" height="22" rx="3" fill="var(--warn)"/>
<rect x="272" y="240" width="40" height="22" rx="3" fill="var(--warn)"/>
<rect x="316" y="240" width="40" height="22" rx="3" fill="var(--warn)"/>
<rect x="360" y="240" width="40" height="22" rx="3" fill="var(--warn)"/>
<text class="t b" x="84" y="320">反無人機 ≈ 0</text>
<text class="t b" x="84" y="348">掩體＝擋 107mm 的混凝土板</text>
<text class="t b" x="84" y="376">人下不了地</text>
<text class="t b" x="84" y="404">商業衛星每天在放</text>
<rect x="500" y="110" width="400" height="320" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="524" y="150" fill="var(--accent)">俄烏四年做的事</text>
<text class="t b" x="524" y="178">分散、下地、攔截網</text>
<line x1="524" y1="268" x2="876" y2="268" stroke="var(--grey)" stroke-width="3"/>
<rect x="534" y="240" width="36" height="22" rx="3" fill="var(--accent)"/>
<rect x="636" y="240" width="36" height="22" rx="3" fill="var(--accent)"/>
<rect x="764" y="240" width="36" height="22" rx="3" fill="var(--accent)"/>
<rect x="576" y="290" width="36" height="22" rx="3" fill="var(--accent)"/>
<rect x="700" y="310" width="36" height="22" rx="3" fill="var(--accent)"/>
<rect x="828" y="296" width="36" height="22" rx="3" fill="var(--accent)"/>
<text class="t b" x="524" y="372">地面線以下＝加固與下挖</text>
<path d="M524 206 L876 206" stroke="var(--accent)" stroke-dasharray="4 8" stroke-width="2"/>
<path d="M560 196 L560 216 M620 196 L620 216 M680 196 L680 216 M740 196 L740 216 M800 196 L800 216" stroke="var(--accent)" stroke-width="1.5"/>
<text class="t b" x="524" y="232">攔截網</text>
<rect x="800" y="330" width="36" height="22" rx="3" fill="none" stroke="var(--accent)" stroke-dasharray="5 4"/>
<text class="t b" x="700" y="404">虛線＝假目標</text>
<text class="t c" x="60" y="492">選擇不作為，也是一個選擇</text>
</svg>
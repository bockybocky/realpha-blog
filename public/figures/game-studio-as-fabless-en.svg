<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two horizontal strips, each split into four segments, with dashed lines aligning the segments one to one">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">Studios are becoming fabless</text>
<text x="70" y="140" font-size="20" fill="var(--dim)">Semiconductors</text>
<rect x="70" y="158" width="196" height="66" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="270" y="158" width="196" height="66" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="470" y="158" width="196" height="66" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="670" y="158" width="196" height="66" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="168" y="198" font-size="16" fill="var(--ink)" text-anchor="middle">IC design</text>
<text x="368" y="198" font-size="16" fill="var(--ink)" text-anchor="middle">Foundry</text>
<text x="568" y="198" font-size="16" fill="var(--ink)" text-anchor="middle">EDA tools</text>
<text x="768" y="198" font-size="16" fill="var(--ink)" text-anchor="middle">Channels</text>
<line x1="168" y1="230" x2="168" y2="316" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="368" y1="230" x2="368" y2="316" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="568" y1="230" x2="568" y2="316" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="768" y1="230" x2="768" y2="316" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="70" y="308" font-size="20" fill="var(--dim)">Games</text>
<rect x="70" y="322" width="196" height="66" rx="8" fill="var(--card)" stroke="var(--accent)"/>
<rect x="270" y="322" width="196" height="66" rx="8" fill="var(--card)" stroke="var(--accent)"/>
<rect x="470" y="322" width="196" height="66" rx="8" fill="var(--card)" stroke="var(--accent)"/>
<rect x="670" y="322" width="196" height="66" rx="8" fill="var(--card)" stroke="var(--warn)"/>
<text x="168" y="352" font-size="16" fill="var(--ink)" text-anchor="middle">New studio</text>
<text x="368" y="352" font-size="16" fill="var(--ink)" text-anchor="middle">Rented AI compute</text>
<text x="568" y="352" font-size="16" fill="var(--ink)" text-anchor="middle">Game engine</text>
<text x="768" y="352" font-size="16" fill="var(--ink)" text-anchor="middle">Platforms</text>
<text x="768" y="376" font-size="16" fill="var(--warn)" text-anchor="middle">30% cut</text>
<text x="60" y="462" font-size="22" fill="var(--ink)">From one big bet to many small ones</text>
</svg>
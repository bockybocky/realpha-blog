<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="續約這道門前的兩條路：搬不走的重量，與剛交付的新東西">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>svg{--page:#ffffff;--card:#f6f8fc;--line:#dde3ee;--ink:#1a212b;--dim:#57616f;--grey:#b9c2d0;--accent:#1f6feb;--warn:#d97706;}@media (prefers-color-scheme: dark){svg{--page:#0d1117;--card:#161b22;--line:#272e39;--ink:#e6edf3;--dim:#8b949e;--grey:#4a5464;--accent:#58a6ff;--warn:#d29922;}}text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}</style>
<text x="60" y="58" font-size="27" font-weight="700">同一個續約，兩種來源</text>
<rect x="400" y="330" width="160" height="140" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text x="480" y="412" font-size="22" font-weight="700" text-anchor="middle">續約</text>
<rect x="110" y="150" width="190" height="110" rx="8" fill="var(--grey)" opacity="0.5" stroke="var(--grey)" stroke-width="3"/>
<text x="205" y="212" font-size="19" font-weight="700" text-anchor="middle" fill="var(--dim)">搬不走</text>
<path d="M300 212 C330 212 318 158 346 150" fill="none" stroke="var(--grey)" stroke-width="3"/>
<circle cx="352" cy="148" r="9" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M205 266 L205 320 L430 320 L430 326" fill="none" stroke="var(--grey)" stroke-width="4"/>
<polygon points="430,336 423,320 437,320" fill="var(--grey)"/>
<text x="110" y="300" font-size="16" fill="var(--dim)">系統紀錄</text>
<rect x="660" y="150" width="190" height="110" rx="8" fill="var(--accent)" opacity="0.3" stroke="var(--accent)" stroke-width="3"/>
<text x="755" y="212" font-size="19" font-weight="700" text-anchor="middle" fill="var(--accent)">這一季的新東西</text>
<path d="M755 266 L755 320 L530 320 L530 326" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polygon points="530,336 523,320 537,320" fill="var(--accent)"/>
<text x="660" y="300" font-size="16" fill="var(--accent)">最後一次交付</text>
<text x="60" y="498" font-size="22" font-weight="700">要問的是她留下來的理由，不是她有沒有留</text>
</svg>
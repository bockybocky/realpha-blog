<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A tall bar is followed by three nearly flat bars, with a dashed line marking the plunge from the high point.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">The paying side vanishes within two months</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">Monthly funding raised by telecom from stock and bond markets in 2000 ($bn)</text>
<line x1="100" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="160" y="140" width="120" height="300" fill="var(--accent)"/>
<rect x="340" y="376" width="120" height="64" fill="var(--warn)"/>
<rect x="520" y="392" width="120" height="48" fill="var(--warn)"/>
<rect x="700" y="402" width="120" height="38" fill="var(--warn)"/>
<text x="220" y="124" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">56</text>
<text x="400" y="360" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">12</text>
<text x="580" y="376" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">9</text>
<text x="760" y="386" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">7</text>
<text x="220" y="468" font-size="16" fill="var(--dim)" text-anchor="middle">First eight-month average</text>
<text x="400" y="468" font-size="16" fill="var(--dim)" text-anchor="middle">Sep</text>
<text x="580" y="468" font-size="16" fill="var(--dim)" text-anchor="middle">Oct</text>
<text x="760" y="468" font-size="16" fill="var(--dim)" text-anchor="middle">Nov</text>
<line x1="280" y1="140" x2="340" y2="376" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">The downstream didn’t slow; it disappeared</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三座艾菲爾鐵塔疊起的高度等於豎井深度，井底淹水處有一台火箭狀幫浦往上抽水；美國與德國做不出，中國 30 天交貨">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .ac { fill:var(--accent); }
    .wn { fill:var(--warn); }
    .inv { fill:var(--page); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="480" y="50" text-anchor="middle" class="t">吊進豎井的幫浦</text>
<line x1="150" y1="130" x2="560" y2="130" stroke="var(--ink)" stroke-width="2"/>
<text x="150" y="120" class="d">地面</text>
<polygon points="240,520 266,475 272,430 280,390 288,430 294,475 320,520 302,520 280,495 258,520" fill="var(--grey)"/>
<polygon points="240,390 266,345 272,300 280,260 288,300 294,345 320,390 302,390 280,365 258,390" fill="var(--grey)"/>
<polygon points="240,260 266,215 272,170 280,130 288,170 294,215 320,260 302,260 280,235 258,260" fill="var(--grey)"/>
<line x1="210" y1="130" x2="210" y2="520" stroke="var(--dim)" stroke-width="2"/>
<line x1="204" y1="130" x2="216" y2="130" stroke="var(--dim)" stroke-width="2"/>
<line x1="204" y1="260" x2="216" y2="260" stroke="var(--dim)" stroke-width="2"/>
<line x1="204" y1="390" x2="216" y2="390" stroke="var(--dim)" stroke-width="2"/>
<line x1="204" y1="520" x2="216" y2="520" stroke="var(--dim)" stroke-width="2"/>
<text x="195" y="330" text-anchor="end" class="g">3 座</text>
<text x="195" y="354" text-anchor="end" class="d">艾菲爾鐵塔</text>
<rect x="400" y="130" width="60" height="390" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="401" y="470" width="58" height="49" fill="var(--accent)" fill-opacity="0.25"/>
<line x1="430" y1="420" x2="430" y2="110" stroke="var(--accent)" stroke-width="5"/>
<polygon points="420,112 430,94 440,112" fill="var(--accent)"/>
<rect x="415" y="440" width="30" height="70" rx="6" fill="var(--accent)"/>
<polygon points="415,441 430,420 445,441" fill="var(--accent)"/>
<text x="510" y="190" class="g">每秒 1,300 公升</text>
<text x="510" y="222" class="b">直徑近 3 公尺</text>
<text x="510" y="248" class="b">長 20 多公尺</text>
<text x="510" y="316" class="b wn">美國廠：做不出</text>
<text x="510" y="344" class="b wn">德國廠：做不出</text>
<text x="510" y="370" class="d">缺釤鈷磁鐵</text>
<text x="510" y="420" class="g ac">中國廠：30 天交貨</text>
<text x="510" y="470" class="d">淹水期間：每天少收 1,500 萬美元</text>
</svg>
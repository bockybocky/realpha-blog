<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A broken arrow pointing at others on the left, and three concentric rings spreading outward from himself on the right">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Take the pill yourself first, then speak</text>

<text x="60" y="132" font-size="20" fill="var(--dim)">Telling others to take it untested</text>
<circle cx="110" cy="286" r="34" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="82" y="292" font-size="16" fill="var(--dim)">Himself</text>
<line x1="150" y1="286" x2="252" y2="286" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
<line x1="264" y1="268" x2="296" y2="304" stroke="var(--warn)" stroke-width="4"/>
<line x1="296" y1="268" x2="264" y2="304" stroke="var(--warn)" stroke-width="4"/>
<circle cx="360" cy="286" r="34" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="332" y="292" font-size="16" fill="var(--dim)">Others</text>
<text x="60" y="382" font-size="16" fill="var(--warn)">Only talk, nothing to look at</text>

<line x1="470" y1="110" x2="470" y2="410" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

<text x="530" y="132" font-size="20" fill="var(--accent)">Be the first user yourself</text>
<circle cx="712" cy="286" r="120" fill="none" stroke="var(--line)" stroke-width="2"/>
<circle cx="712" cy="286" r="78" fill="none" stroke="var(--line)" stroke-width="2"/>
<circle cx="712" cy="286" r="40" fill="var(--accent)"/>
<text x="672" y="292" font-size="16" fill="var(--page)">Six servers</text>
<circle cx="712" cy="208" r="10" fill="var(--accent)"/>
<circle cx="780" cy="326" r="10" fill="var(--accent)"/>
<circle cx="644" cy="326" r="10" fill="var(--accent)"/>
<text x="682" y="186" font-size="16" fill="var(--ink)">Results</text>
<text x="800" y="332" font-size="16" fill="var(--ink)">Banks</text>
<text x="536" y="332" font-size="16" fill="var(--ink)">SMEs</text>
<text x="530" y="440" font-size="16" fill="var(--dim)">Build it first, then let people see</text>

<text x="60" y="490" font-size="22" fill="var(--ink)">He persuaded nobody; he just showed you</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上排線自然收斂，下排線平行到某個垂直標記後才收斂">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:600}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="480" y="58" text-anchor="middle">兩種差距，只有一種會自己收斂</text>
<text class="t g" x="70" y="148">行為差異</text>
<path d="M200 176 L880 208" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M200 250 L880 222" fill="none" stroke="var(--accent)" stroke-width="4" opacity="0.5"/>
<text class="t s" x="880" y="262" text-anchor="end">時間會處理</text>
<line x1="70" y1="292" x2="890" y2="292" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="70" y="336">結構差異</text>
<path d="M200 366 L560 366 L880 396" fill="none" stroke="var(--ink)" stroke-width="4"/>
<path d="M200 430 L560 430 L880 410" fill="none" stroke="var(--ink)" stroke-width="4" opacity="0.45"/>
<line x1="560" y1="346" x2="560" y2="450" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 7"/>
<text class="t s" x="572" y="470">結構被改掉</text>
<text class="t s" x="880" y="470" text-anchor="end">等不到自己收斂</text>
<text class="t c" x="480" y="522" text-anchor="middle">先分清楚是行為還是結構</text>
</svg>
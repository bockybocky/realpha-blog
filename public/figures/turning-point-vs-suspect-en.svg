<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two panels compared: whether the suspect marker falls after or before the turning point leads to a different conclusion.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="54" font-size="27" font-weight="700" fill="var(--ink)">Which side of the turning point the suspect stands on</text>
<rect x="60" y="100" width="400" height="300" fill="var(--card)"/>
<rect x="500" y="100" width="400" height="300" fill="var(--card)"/>
<polyline points="100,170 180,182 260,250 340,300 420,340" fill="none" stroke="var(--ink)" stroke-width="3.5"/>
<circle cx="100" cy="170" r="7" fill="var(--accent)"/>
<line x1="100" y1="140" x2="100" y2="360" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="112" y="152" font-size="19" font-weight="700" fill="var(--accent)">Turning point</text>
<line x1="330" y1="140" x2="330" y2="360" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="342" y="152" font-size="19" font-weight="700" fill="var(--warn)">Suspect in</text>
<text x="100" y="384" font-size="16" fill="var(--dim)">Suspect arrives later</text>
<polyline points="540,170 620,182 700,250 780,300 860,340" fill="none" stroke="var(--ink)" stroke-width="3.5"/>
<circle cx="620" cy="182" r="7" fill="var(--accent)"/>
<line x1="620" y1="140" x2="620" y2="360" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="632" y="152" font-size="19" font-weight="700" fill="var(--accent)">Turn</text>
<line x1="545" y1="140" x2="545" y2="360" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="538" y="152" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="end">Killer</text>
<text x="540" y="384" font-size="16" fill="var(--dim)">Suspect first</text>
<text x="260" y="438" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">At most an accelerant</text>
<text x="700" y="438" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Could be the main cause</text>
<text x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">Two dates far apart, and the culprit changes.</text>
</svg>
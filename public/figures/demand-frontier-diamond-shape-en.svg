<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A sideways diamond-shaped band goes from thin to wide and then thin again, with a parallel thick grey band underneath running all the way to the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="58">Demand that must have the frontier</text>
  <rect x="60" y="88" width="840" height="398" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <polygon points="120,258 380,130 620,196 880,250 880,268 620,352 380,470 120,278" fill="var(--accent)" opacity="0.85"/>
  <text class="g" x="330" y="112">Widest</text>
  <text class="g" x="792" y="232">Thin</text>
  <rect x="120" y="396" width="760" height="44" fill="var(--grey)" opacity="0.5"/>
  <text class="s" x="140" y="424">After benchmarks saturate: commoditized</text>
  <path d="M120 462 L880 462" stroke="var(--grey)" stroke-width="2"/>
  <text class="s" x="120" y="486">Models keep getting better</text>
  <text class="c" x="60" y="542">How often do you need an IQ of 300?</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="街道側視圖：機械臂舉升高度被樹冠壓住，車道開口與消防栓前留空，容器高度多留一截。">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" fill="var(--ink)">一個容器要同時閃開幾樣東西</text>

<ellipse cx="300" cy="150" rx="150" ry="58" fill="var(--grey)" opacity="0.4"/>
<rect x="292" y="196" width="16" height="70" fill="var(--grey)"/>
<line x1="60" y1="208" x2="900" y2="208" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text x="900" y="198" font-size="19" fill="var(--warn)" text-anchor="end">舉升上限</text>
<text x="76" y="140" font-size="16" fill="var(--dim)">樹冠</text>

<path d="M560 420 Q560 240 660 236" fill="none" stroke="var(--accent)" stroke-width="4"/>
<rect x="600" y="300" width="250" height="120" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="660" cy="430" r="22" fill="var(--grey)"/>
<circle cx="800" cy="430" r="22" fill="var(--grey)"/>
<text x="660" y="372" font-size="19" fill="var(--dim)">側裝車</text>

<line x1="60" y1="452" x2="900" y2="452" stroke="var(--ink)" stroke-width="3"/>

<rect x="80" y="372" width="66" height="80" fill="var(--accent)" opacity="0.75"/>
<rect x="80" y="338" width="66" height="34" fill="var(--accent)" opacity="0.28" stroke="var(--accent)" stroke-dasharray="5 4"/>
<text x="113" y="330" font-size="15" fill="var(--accent)" text-anchor="middle">多一天</text>

<rect x="162" y="372" width="66" height="80" fill="var(--accent)" opacity="0.75"/>
<rect x="244" y="372" width="66" height="80" fill="var(--accent)" opacity="0.75"/>

<rect x="330" y="440" width="110" height="12" fill="var(--warn)" opacity="0.5"/>
<text x="385" y="490" font-size="16" fill="var(--warn)" text-anchor="middle">車道開口</text>

<rect x="470" y="400" width="14" height="52" fill="var(--warn)"/>
<circle cx="477" cy="394" r="11" fill="var(--warn)"/>
<text x="477" y="490" font-size="16" fill="var(--warn)" text-anchor="middle">消防栓</text>

<text x="60" y="534" font-size="22" fill="var(--ink)">街區長度扣掉不能放的，才是真正可用的</text>
</g>
</svg>
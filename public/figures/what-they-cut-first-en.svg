<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Stacked bars before and after pressure for two companies, one shrinking the marketing block and the other the R&D block">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .t{font-size:27px;fill:var(--ink);font-weight:700}
    .g{font-size:19px;fill:var(--ink);font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">Both cut, different place</text>
<text class="b" x="60" y="88">Hard years: what got cut first</text>
<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="140" y="320" width="80" height="100" fill="var(--accent)"/>
<rect x="140" y="230" width="80" height="90" fill="var(--grey)"/>
<rect x="140" y="170" width="80" height="60" fill="var(--line)"/>
<text class="b" x="180" y="448" text-anchor="middle">Before</text>
<rect x="270" y="320" width="80" height="100" fill="var(--accent)"/>
<rect x="270" y="290" width="80" height="30" fill="var(--grey)"/>
<rect x="270" y="240" width="80" height="50" fill="var(--line)"/>
<text class="b" x="310" y="448" text-anchor="middle">After</text>
<text class="g" x="140" y="140">Firm A</text>
<rect x="580" y="320" width="80" height="100" fill="var(--accent)"/>
<rect x="580" y="230" width="80" height="90" fill="var(--grey)"/>
<rect x="580" y="170" width="80" height="60" fill="var(--line)"/>
<text class="b" x="620" y="448" text-anchor="middle">Before</text>
<rect x="710" y="390" width="80" height="30" fill="var(--accent)"/>
<rect x="710" y="300" width="80" height="90" fill="var(--grey)"/>
<rect x="710" y="250" width="80" height="50" fill="var(--line)"/>
<text class="b" x="750" y="448" text-anchor="middle">After</text>
<text class="g" x="580" y="140">Firm B</text>
<rect x="400" y="180" width="18" height="18" fill="var(--accent)"/>
<text class="b" x="428" y="195">R&amp;D</text>
<rect x="400" y="216" width="18" height="18" fill="var(--grey)"/>
<text class="b" x="428" y="231">Marketing</text>
<text class="c" x="60" y="500">First cut = their priority</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One big block branches into four progressively smaller blocks.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<text x="60" y="72" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="27" fill="var(--ink)">One cluster, one product line</text>

<rect x="70" y="150" width="230" height="300" rx="10" fill="var(--accent)" opacity="0.85"/>
<text x="185" y="486" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">Own cluster</text>

<rect x="380" y="180" width="180" height="110" rx="8" fill="var(--accent)" opacity="0.6"/>
<rect x="380" y="320" width="180" height="90" rx="8" fill="var(--accent)" opacity="0.6"/>
<text x="470" y="440" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">Large model</text>

<rect x="650" y="170" width="120" height="50" rx="6" fill="var(--accent)" opacity="0.35"/>
<rect x="650" y="240" width="120" height="40" rx="6" fill="var(--accent)" opacity="0.3"/>
<rect x="650" y="300" width="120" height="32" rx="6" fill="var(--accent)" opacity="0.25"/>
<rect x="650" y="352" width="120" height="24" rx="6" fill="var(--accent)" opacity="0.2"/>
<text x="800" y="200" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--dim)">Ad serving</text>
<text x="800" y="266" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--dim)">Muse</text>
<text x="800" y="322" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--dim)">Cheap tier</text>
<text x="800" y="370" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--dim)">Other variants</text>
<text x="710" y="440" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">Distilled variants</text>

<path d="M 310 300 L 368 240" stroke="var(--line)" stroke-width="2" fill="none"/>
<path d="M 310 300 L 368 362" stroke="var(--line)" stroke-width="2" fill="none"/>
<path d="M 570 235 L 640 195" stroke="var(--line)" stroke-width="2" fill="none"/>
<path d="M 570 235 L 640 260" stroke="var(--line)" stroke-width="2" fill="none"/>
<path d="M 570 365 L 640 316" stroke="var(--line)" stroke-width="2" fill="none"/>
<path d="M 570 365 L 640 364" stroke="var(--line)" stroke-width="2" fill="none"/>

<text x="60" y="520" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="22" fill="var(--ink)">One pool of compute spread across a whole product line</text>
</svg>
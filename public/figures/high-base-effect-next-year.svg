<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上方油價線升高後持平跨年，下方年增率柱在跨年後自己變矮">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="48" y="54" font-size="27" font-weight="700" fill="var(--ink)">油價不用跌，年增率也會下來</text>
<line x1="480" y1="96" x2="480" y2="452" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="380" y="488" font-size="19" font-weight="700" fill="var(--dim)">今年</text>
<text x="500" y="488" font-size="19" font-weight="700" fill="var(--dim)">明年</text>
<text x="80" y="128" font-size="19" font-weight="700" fill="var(--accent)">油價水準</text>
<polyline points="88,236 180,196 280,160 380,148 480,146 600,148 720,146 860,148" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text x="700" y="128" font-size="16" fill="var(--dim)">停在高位</text>
<text x="80" y="296" font-size="19" font-weight="700" fill="var(--warn)">年增率</text>
<rect x="120" y="330" width="52" height="122" fill="var(--warn)"/>
<rect x="196" y="318" width="52" height="134" fill="var(--warn)"/>
<rect x="272" y="326" width="52" height="126" fill="var(--warn)"/>
<rect x="348" y="340" width="52" height="112" fill="var(--warn)"/>
<rect x="520" y="400" width="52" height="52" fill="var(--grey)"/>
<rect x="596" y="414" width="52" height="38" fill="var(--grey)"/>
<rect x="672" y="420" width="52" height="32" fill="var(--grey)"/>
<rect x="748" y="424" width="52" height="28" fill="var(--grey)"/>
<line x1="120" y1="452" x2="860" y2="452" stroke="var(--line)" stroke-width="2"/>
<text x="560" y="372" font-size="16" fill="var(--dim)">高基期自己會幫忙</text>
<text x="48" y="524" font-size="22" font-weight="700" fill="var(--ink)">同樣的價格，換個比較基準就是另一個數字</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="四象限：橫軸題材理由在不在、縱軸我的買進理由在不在，右下角題材還在但我沒有判準的那格被標為危險">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">兩個理由要分開問</text>
<rect x="230" y="100" width="300" height="190" fill="var(--card)"/>
<rect x="540" y="100" width="300" height="190" fill="var(--accent)" opacity="0.16"/>
<rect x="230" y="300" width="300" height="190" fill="var(--card)"/>
<rect x="540" y="300" width="300" height="190" fill="var(--warn)" opacity="0.18"/>
<text x="258" y="200" font-size="20" fill="var(--ink)">回頭檢查</text>
<text x="258" y="228" font-size="15" fill="var(--dim)">我的理由還在，題材退潮</text>
<text x="568" y="200" font-size="20" fill="var(--accent)">可以續抱</text>
<text x="568" y="228" font-size="15" fill="var(--dim)">兩個理由都還在</text>
<text x="258" y="400" font-size="20" fill="var(--ink)">出清</text>
<text x="258" y="428" font-size="15" fill="var(--dim)">兩個都沒了</text>
<text x="568" y="400" font-size="20" fill="var(--warn)">沒有判準</text>
<text x="568" y="428" font-size="15" fill="var(--dim)">只因為它在漲</text>
<line x1="230" y1="100" x2="230" y2="490" stroke="var(--line)" stroke-width="2"/>
<line x1="230" y1="490" x2="840" y2="490" stroke="var(--line)" stroke-width="2"/>
<text x="230" y="520" font-size="16" fill="var(--dim)">題材理由：不在</text>
<text x="690" y="520" font-size="16" fill="var(--dim)">題材理由：還在</text>
<text x="60" y="130" font-size="16" fill="var(--dim)">我的買進</text>
<text x="60" y="152" font-size="16" fill="var(--dim)">理由：還在</text>
<text x="60" y="450" font-size="16" fill="var(--dim)">我的買進</text>
<text x="60" y="472" font-size="16" fill="var(--dim)">理由：不在</text>
<text x="60" y="560" font-size="22" fill="var(--ink)">題材健在，救不了沒有判準的持有</text>
</svg>
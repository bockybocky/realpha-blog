<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="左邊一欄七個步驟，六個有箭頭指向右邊的大框，只有第三個被橘色框住、沒有箭頭，留在原地">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; }
    .c { font-size:22px; font-weight:700; }
    .ac { fill:var(--accent); }
    .wn { fill:var(--warn); }
    .dm { fill:var(--dim); }
</style>
<defs>
<marker id="ah549" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="var(--accent)"/>
</marker>
</defs>
<text x="60" y="52" class="t">替長輩約回診：寫成七步（示意）</text>
<g fill="var(--card)" stroke="var(--line)" stroke-width="1.5">
<rect x="60" y="90" width="300" height="46" rx="8"/>
<rect x="60" y="148" width="300" height="46" rx="8"/>
<rect x="60" y="264" width="300" height="46" rx="8"/>
<rect x="60" y="322" width="300" height="46" rx="8"/>
<rect x="60" y="380" width="300" height="46" rx="8"/>
<rect x="60" y="438" width="300" height="46" rx="8"/>
</g>
<rect x="60" y="206" width="300" height="46" rx="8" fill="var(--warn)" fill-opacity="0.14" stroke="var(--warn)" stroke-width="2.5"/>
<text x="80" y="119" class="b">1　看行事曆</text>
<text x="80" y="177" class="b">2　登入掛號</text>
<text x="80" y="235" class="b">3　選哪一科</text>
<text x="80" y="293" class="b">4　記下日期</text>
<text x="80" y="351" class="b">5　設提醒</text>
<text x="80" y="409" class="b">6　叫車</text>
<text x="80" y="467" class="b">7　帶健保卡</text>
<g fill="var(--accent)" fill-opacity="0.15">
<rect x="380" y="98" width="80" height="30" rx="15"/>
<rect x="380" y="156" width="80" height="30" rx="15"/>
<rect x="380" y="272" width="80" height="30" rx="15"/>
<rect x="380" y="330" width="80" height="30" rx="15"/>
<rect x="380" y="388" width="80" height="30" rx="15"/>
<rect x="380" y="446" width="80" height="30" rx="15"/>
</g>
<rect x="380" y="214" width="80" height="30" rx="15" fill="var(--warn)" fill-opacity="0.22"/>
<text x="420" y="118" class="s ac" text-anchor="middle">照做</text>
<text x="420" y="176" class="s ac" text-anchor="middle">照做</text>
<text x="420" y="234" class="s wn" text-anchor="middle">看情況</text>
<text x="420" y="292" class="s ac" text-anchor="middle">照做</text>
<text x="420" y="350" class="s ac" text-anchor="middle">照做</text>
<text x="420" y="408" class="s ac" text-anchor="middle">照做</text>
<text x="420" y="466" class="s ac" text-anchor="middle">照做</text>
<g stroke="var(--accent)" stroke-width="2" marker-end="url(#ah549)">
<line x1="472" y1="113" x2="632" y2="113"/>
<line x1="472" y1="171" x2="632" y2="171"/>
<line x1="472" y1="287" x2="632" y2="287"/>
<line x1="472" y1="345" x2="632" y2="345"/>
<line x1="472" y1="403" x2="632" y2="403"/>
<line x1="472" y1="461" x2="632" y2="461"/>
</g>
<text x="480" y="235" class="b wn" font-weight="700">留給自己</text>
<rect x="640" y="90" width="260" height="394" rx="12" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
<text x="770" y="262" class="g ac" text-anchor="middle">交出去</text>
<text x="770" y="298" class="b dm" text-anchor="middle">排程</text>
<text x="770" y="324" class="b dm" text-anchor="middle">清單</text>
<text x="770" y="350" class="b dm" text-anchor="middle">家人</text>
<text x="480" y="545" class="c" text-anchor="middle">六步照做，一步是判斷點</text>
</svg>
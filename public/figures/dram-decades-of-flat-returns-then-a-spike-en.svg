<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A long row of nearly equal columns shows memory makers spending and earning back almost the same amount for years, and at the far right one column suddenly rises several times higher for today's free cash flow.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:700; fill:var(--ink); }
    .body { font-size:15px; fill:var(--dim); }
    .concl { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t title" x="60" y="56">They remember nearly going bankrupt last cycle</text>
  <line x1="80" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
  <rect x="100" y="230" width="22" height="200" fill="var(--grey)"/>
  <rect x="126" y="240" width="22" height="190" fill="var(--accent)" opacity="0.55"/>
  <rect x="176" y="230" width="22" height="200" fill="var(--grey)"/>
  <rect x="202" y="220" width="22" height="210" fill="var(--accent)" opacity="0.55"/>
  <rect x="252" y="230" width="22" height="200" fill="var(--grey)"/>
  <rect x="278" y="250" width="22" height="180" fill="var(--accent)" opacity="0.55"/>
  <rect x="328" y="230" width="22" height="200" fill="var(--grey)"/>
  <rect x="354" y="235" width="22" height="195" fill="var(--accent)" opacity="0.55"/>
  <rect x="404" y="230" width="22" height="200" fill="var(--grey)"/>
  <rect x="430" y="245" width="22" height="185" fill="var(--accent)" opacity="0.55"/>
  <rect x="480" y="230" width="22" height="200" fill="var(--grey)"/>
  <rect x="506" y="225" width="22" height="205" fill="var(--accent)" opacity="0.55"/>
  <text class="t grp" x="100" y="466">Spend $20 billion</text>
  <text class="t grp" x="100" y="492">Earn back $19 billion</text>
  <text class="t body" x="100" y="516">$21 billion in good years, $18 billion in bad ones, year after year</text>
  <rect x="790" y="120" width="70" height="310" fill="var(--accent)"/>
  <text class="t grp" x="700" y="104">Now: $100 billion a year</text>
  <text class="t body" x="700" y="466">Free cash flow</text>
  <text class="t concl" x="80" y="92">Twenty flat years, then one spike</text>
</svg>
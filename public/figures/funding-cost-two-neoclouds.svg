<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩家公司對照：左邊收入全是浮動的，資金成本長條；右邊大半鎖進遠期，資金成本短條">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">同樣的卡，兩種賣法</text>

  <rect x="60" y="96" width="390" height="300" rx="14" fill="var(--card)"/>
  <text class="g" x="90" y="136">A 公司</text>
  <rect x="90" y="156" width="330" height="150" rx="8" fill="var(--warn)" opacity="0.85"/>
  <text class="g" x="112" y="238" fill="var(--page)">浮動收入</text>
  <text class="b" x="90" y="336">隨租隨用、信用較弱的對手</text>
  <text class="b" x="90" y="366">資金成本</text>
  <rect x="90" y="378" width="330" height="18" rx="9" fill="var(--warn)"/>

  <rect x="510" y="96" width="390" height="300" rx="14" fill="var(--card)"/>
  <text class="g" x="540" y="136">B 公司</text>
  <rect x="540" y="156" width="240" height="150" rx="8" fill="var(--accent)" opacity="0.9"/>
  <text class="g" x="562" y="238" fill="var(--page)">鎖進遠期</text>
  <rect x="790" y="156" width="80" height="150" rx="8" fill="var(--grey)"/>
  <text class="b" x="540" y="336">其餘才拿去賣浮動、收預付</text>
  <text class="b" x="540" y="366">資金成本</text>
  <rect x="540" y="378" width="96" height="18" rx="9" fill="var(--accent)"/>

  <text class="c" x="60" y="470">殖利率在定價的，有一塊是「你怎麼賣」</text>
  <text class="b" x="60" y="502">那一塊，公司自己改得動</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左格低矮天花板壓住 x86、UNIX 高塔在上方；右格天花板被打斷，x86 疊到同樣高度">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">最後一道牆是記憶體</text>

<text class="g" x="100" y="112">32 位元</text>
<line x1="90" y1="420" x2="430" y2="420" stroke="var(--line)" stroke-width="3"/>
<rect x="100" y="360" width="80" height="60" rx="4" fill="var(--accent)"/>
<rect x="196" y="360" width="80" height="60" rx="4" fill="var(--accent)"/>
<rect x="90" y="336" width="340" height="16" rx="4" fill="var(--warn)"/>
<text class="b" x="90" y="326" fill="var(--warn)">4GB 上限</text>
<rect x="320" y="150" width="100" height="186" rx="6" fill="var(--grey)"/>
<text class="b" x="370" y="250" text-anchor="middle" fill="var(--page)">UNIX</text>
<text class="b" x="100" y="452">x86 進不去</text>

<text class="g" x="540" y="112">64 位元起</text>
<line x1="530" y1="420" x2="870" y2="420" stroke="var(--line)" stroke-width="3"/>
<g fill="var(--warn)">
<rect x="530" y="336" width="60" height="16" rx="4"/>
<rect x="810" y="336" width="60" height="16" rx="4"/>
</g>
<text class="b" x="604" y="350" fill="var(--warn)">牆被敲掉</text>
<g fill="var(--accent)">
<rect x="540" y="360" width="80" height="60" rx="4"/>
<rect x="636" y="300" width="80" height="120" rx="4"/>
<rect x="732" y="150" width="80" height="270" rx="4"/>
</g>
<text class="b" x="540" y="452">定址到幾百 GB</text>

<text class="c" x="60" y="510">守了四五年的那塊地，一年之內沒了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="數線上舊的爭論區間在左，新的估計值落在右，中間空出一段距離">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<text x="60" y="72" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="27" fill="var(--ink)">爭論的區間整個搬家</text>

<rect x="200" y="200" width="200" height="56" rx="8" fill="var(--card)" stroke="var(--grey)"/>
<text x="300" y="186" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--dim)">年初在爭的範圍</text>

<rect x="700" y="200" width="20" height="56" rx="4" fill="var(--accent)"/>
<text x="710" y="186" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="19" fill="var(--accent)">現在的估計</text>

<line x1="120" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="2"/>
<line x1="200" y1="294" x2="200" y2="312" stroke="var(--grey)"/>
<line x1="400" y1="294" x2="400" y2="312" stroke="var(--grey)"/>
<line x1="710" y1="294" x2="710" y2="312" stroke="var(--accent)" stroke-width="2"/>
<text x="200" y="338" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">1,500</text>
<text x="400" y="338" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">1,600</text>
<text x="710" y="338" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--accent)">2,000</text>
<text x="880" y="368" text-anchor="end" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--dim)">億美元</text>

<path d="M 410 228 L 690 228" stroke="var(--accent)" stroke-width="2" fill="none"/>
<path d="M 690 222 L 700 228 L 690 234 Z" fill="var(--accent)"/>
<text x="550" y="216" text-anchor="middle" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--dim)">半年</text>

<text x="60" y="450" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="22" fill="var(--ink)">新數字落在舊爭論的外面，不在裡面</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸從 2026 延伸到 2033，中間標出 2028 到 2030 的區段與 2030、2031、2033 三個節點，底下括號標七年，末端有一段延後的虛線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="480" y="60" text-anchor="middle">從宣布到量產，隔了七年</text>
<line x1="80" y1="280" x2="870" y2="280" stroke="var(--grey)" stroke-width="3"/>
<line x1="870" y1="280" x2="940" y2="280" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="s" x="100" y="308" text-anchor="middle">2026</text>
<text class="s" x="210" y="308" text-anchor="middle">2027</text>
<text class="s" x="320" y="308" text-anchor="middle">2028</text>
<text class="s" x="430" y="308" text-anchor="middle">2029</text>
<text class="s" x="540" y="308" text-anchor="middle">2030</text>
<text class="s" x="650" y="308" text-anchor="middle">2031</text>
<text class="s" x="760" y="308" text-anchor="middle">2032</text>
<text class="s" x="870" y="308" text-anchor="middle">2033</text>
<rect x="320" y="324" width="220" height="38" rx="4" fill="var(--grey)" fill-opacity="0.35"/>
<text class="s" x="430" y="349" text-anchor="middle" style="fill:var(--ink)">多重曝光較划算</text>
<circle cx="100" cy="280" r="9" fill="var(--dim)"/>
<text class="g" x="100" y="240" text-anchor="middle">宣布</text>
<circle cx="540" cy="280" r="9" fill="var(--accent)"/>
<line x1="540" y1="271" x2="540" y2="232" stroke="var(--accent)" stroke-width="1.5"/>
<text class="g" x="540" y="222" text-anchor="middle" style="fill:var(--accent)">導入 High NA</text>
<circle cx="650" cy="280" r="9" fill="var(--dim)"/>
<line x1="650" y1="271" x2="650" y2="182" stroke="var(--grey)" stroke-width="1.5"/>
<text class="g" x="650" y="172" text-anchor="middle">12 吋試產線</text>
<circle cx="870" cy="280" r="9" fill="var(--accent)"/>
<text class="g" x="870" y="240" text-anchor="middle" style="fill:var(--accent)">12 吋量產</text>
<text class="b" x="905" y="264" text-anchor="middle" style="fill:var(--warn)">延後？</text>
<path d="M100 400 L100 412 L870 412 L870 400" fill="none" stroke="var(--dim)" stroke-width="2"/>
<text class="c" x="485" y="446" text-anchor="middle">七年</text>
<text class="b" x="485" y="476" text-anchor="middle">光罩廠・基板商・設計軟體 都得到位</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="五個圓圈的連線全部收斂到同一個方框">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">五個名字，一個分母</text>

<line x1="180" y1="220" x2="440" y2="326" stroke="var(--line)" stroke-width="2"/>
<line x1="330" y1="220" x2="450" y2="326" stroke="var(--line)" stroke-width="2"/>
<line x1="480" y1="220" x2="480" y2="326" stroke="var(--line)" stroke-width="2"/>
<line x1="630" y1="220" x2="510" y2="326" stroke="var(--line)" stroke-width="2"/>
<line x1="780" y1="220" x2="520" y2="326" stroke="var(--line)" stroke-width="2"/>

<circle cx="180" cy="180" r="40" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="330" cy="180" r="40" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="480" cy="180" r="40" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="630" cy="180" r="40" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="780" cy="180" r="40" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="180" y="188" font-size="20" fill="var(--accent)" text-anchor="middle">持股</text>
<text x="330" y="188" font-size="20" fill="var(--accent)" text-anchor="middle">持股</text>
<text x="480" y="188" font-size="20" fill="var(--accent)" text-anchor="middle">持股</text>
<text x="630" y="188" font-size="20" fill="var(--accent)" text-anchor="middle">持股</text>
<text x="780" y="188" font-size="20" fill="var(--accent)" text-anchor="middle">持股</text>

<text x="480" y="316" font-size="16" fill="var(--dim)" text-anchor="middle">共同分母</text>
<rect x="330" y="330" width="300" height="70" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="480" y="374" font-size="20" fill="var(--ink)" text-anchor="middle">AI 資本支出</text>

<text x="100" y="440" font-size="16" fill="var(--dim)">看起來 5 注</text>
<text x="760" y="440" font-size="16" fill="var(--dim)">實際 1 注</text>

<text x="60" y="500" font-size="22" fill="var(--ink)">分母相同，就是同一注</text>
</svg>
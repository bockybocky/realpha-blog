<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The left frame holds a nearly empty quota bar and three crowded tasks, with an arrow pointing to the right frame, which has no bar and lets the tasks spread out">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Same tasks, no clock there</text>

<rect x="80" y="130" width="330" height="280" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="104" y="172" font-size="20" fill="var(--ink)">Clocked</text>
<rect x="110" y="200" width="44" height="180" fill="var(--page)" stroke="var(--line)"/>
<rect x="110" y="348" width="44" height="32" fill="var(--warn)"/>
<text x="104" y="400" font-size="16" fill="var(--warn)">Quota</text>
<rect x="200" y="206" width="76" height="44" fill="var(--page)" stroke="var(--line)"/>
<rect x="200" y="262" width="76" height="44" fill="var(--page)" stroke="var(--line)"/>
<rect x="200" y="318" width="76" height="44" fill="var(--page)" stroke="var(--line)"/>
<text x="296" y="292" font-size="16" fill="var(--dim)">Tasks</text>

<text x="432" y="252" font-size="16" fill="var(--accent)">Move it</text>
<line x1="428" y1="278" x2="522" y2="278" stroke="var(--accent)" stroke-width="3"/>
<polygon points="540,278 520,268 520,288" fill="var(--accent)"/>

<rect x="550" y="130" width="330" height="280" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="574" y="172" font-size="20" fill="var(--ink)">No clock</text>
<rect x="574" y="206" width="76" height="44" fill="var(--page)" stroke="var(--line)"/>
<rect x="662" y="206" width="76" height="44" fill="var(--page)" stroke="var(--line)"/>
<rect x="750" y="206" width="76" height="44" fill="var(--page)" stroke="var(--line)"/>
<rect x="574" y="266" width="76" height="44" fill="var(--page)" stroke="var(--line)"/>
<rect x="662" y="266" width="76" height="44" fill="var(--page)" stroke="var(--line)"/>
<rect x="750" y="266" width="76" height="44" fill="var(--page)" stroke="var(--line)"/>
<text x="574" y="400" font-size="16" fill="var(--dim)">Power</text>

<text x="60" y="500" font-size="22" fill="var(--ink)">No wall, room for six</text>
</svg>
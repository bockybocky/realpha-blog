<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="四象限圖，橫軸事情會不會發生、縱軸價格假設了多少，只有右下角被標成重點">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="80" y="72" font-size="27">新聞只回答其中一個軸</text>
  <rect x="510" y="300" width="310" height="170" fill="var(--accent)" opacity="0.12"/>
  <rect x="200" y="130" width="620" height="340" fill="none" stroke="var(--line)" stroke-width="2"/>
  <line x1="510" y1="130" x2="510" y2="470" stroke="var(--line)" stroke-width="2"/>
  <line x1="200" y1="300" x2="820" y2="300" stroke="var(--line)" stroke-width="2"/>
  <text x="355" y="208" font-size="20" fill="var(--warn)" text-anchor="middle">最貴的錯</text>
  <text x="355" y="238" font-size="15" fill="var(--dim)" text-anchor="middle">敘事很貴，事情沒發生</text>
  <text x="665" y="208" font-size="20" fill="var(--dim)" text-anchor="middle">說對了也賺不到</text>
  <text x="665" y="238" font-size="15" fill="var(--dim)" text-anchor="middle">早就在價格裡</text>
  <text x="355" y="390" font-size="20" fill="var(--dim)" text-anchor="middle">沒事</text>
  <text x="665" y="382" font-size="20" fill="var(--accent)" text-anchor="middle">機會</text>
  <text x="665" y="412" font-size="15" fill="var(--dim)" text-anchor="middle">會發生，價格還沒假設</text>
  <text x="200" y="496" font-size="15" fill="var(--dim)">不會發生</text>
  <text x="820" y="496" font-size="15" fill="var(--dim)" text-anchor="end">會發生</text>
  <text x="510" y="524" font-size="16" fill="var(--dim)" text-anchor="middle">這件事三年後會不會發生</text>
  <text x="186" y="146" font-size="15" fill="var(--dim)" text-anchor="end">假設很多</text>
  <text x="186" y="466" font-size="15" fill="var(--dim)" text-anchor="end">幾乎沒假設</text>
  <text transform="translate(150,300) rotate(-90)" font-size="16" fill="var(--dim)" text-anchor="middle">價格已經假設了多少</text>
  <text x="480" y="562" font-size="22" text-anchor="middle">兩個獨立的問題，要分開問</text>
</svg>
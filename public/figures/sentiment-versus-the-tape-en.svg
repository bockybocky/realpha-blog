<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One bar filled to half height on the left and three nearly full bars on the right, with the two sides at opposite heights.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="72" font-size="27" fill="var(--ink)">Bearish in the survey, rising on the tape</text>
<text x="60" y="130" font-size="20" fill="var(--ink)">What was asked</text>
<rect x="60" y="150" width="340" height="40" fill="var(--grey)" opacity="0.3"/>
<rect x="60" y="150" width="175" height="40" fill="var(--warn)"/>
<text x="60" y="216" font-size="16" fill="var(--dim)">51.4% expect stocks lower in six months</text>
<rect x="60" y="250" width="340" height="40" fill="var(--grey)" opacity="0.3"/>
<rect x="60" y="250" width="7" height="40" fill="var(--warn)"/>
<text x="60" y="316" font-size="16" fill="var(--dim)">Same week, the index sat 2% off its high</text>
<line x1="490" y1="120" x2="490" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="540" y="130" font-size="20" fill="var(--ink)">What was counted</text>
<rect x="540" y="150" width="340" height="40" fill="var(--grey)" opacity="0.3"/>
<rect x="540" y="150" width="289" height="40" fill="var(--accent)"/>
<text x="540" y="216" font-size="16" fill="var(--dim)">Over 85% of stocks rose this month</text>
<rect x="540" y="250" width="340" height="40" fill="var(--grey)" opacity="0.3"/>
<rect x="540" y="250" width="238" height="40" fill="var(--accent)"/>
<text x="540" y="316" font-size="16" fill="var(--dim)">70% back above the 50-day</text>
<rect x="540" y="350" width="340" height="40" fill="var(--grey)" opacity="0.3"/>
<rect x="540" y="350" width="340" height="40" fill="var(--accent)"/>
<text x="540" y="416" font-size="16" fill="var(--dim)">Top 17 inflows all equity funds</text>
<text x="60" y="500" font-size="22" fill="var(--ink)">What's rising isn't what they own</text>
</svg>
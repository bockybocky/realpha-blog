<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條跑道，上面一條追兵緊貼在後只差一小段，下面一條追兵遠遠排在隊尾">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="40" y="58" font-size="27" fill="var(--ink)">追上來要花多久</text>

<text x="60" y="140" font-size="20" fill="var(--dim)">技術領先</text>
<line x1="60" y1="210" x2="900" y2="210" stroke="var(--line)" stroke-width="2"/>
<circle cx="860" cy="196" r="16" fill="var(--accent)"/>
<circle cx="770" cy="196" r="14" fill="var(--grey)"/>
<circle cx="722" cy="196" r="14" fill="var(--grey)"/>
<line x1="786" y1="240" x2="844" y2="240" stroke="var(--warn)" stroke-width="3"/>
<text x="770" y="268" font-size="19" fill="var(--warn)" text-anchor="end">差一小段</text>

<text x="60" y="350" font-size="20" fill="var(--accent)">已經過關</text>
<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<circle cx="860" cy="406" r="16" fill="var(--accent)"/>
<circle cx="120" cy="406" r="14" fill="var(--grey)"/>
<circle cx="168" cy="406" r="14" fill="var(--grey)"/>
<circle cx="216" cy="406" r="14" fill="var(--grey)"/>
<line x1="236" y1="450" x2="840" y2="450" stroke="var(--accent)" stroke-width="3"/>
<text x="538" y="478" font-size="19" fill="var(--accent)" text-anchor="middle">認證・長約・用地・維運人力</text>

<text x="480" y="518" font-size="22" fill="var(--ink)" text-anchor="middle">補不回來的是時間</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Two squares of equal area, one cut into four cells and one left whole, with unit-price bars below, one short and one extremely tall.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">One slice of capacity, two outputs</text>

<rect x="50" y="100" width="860" height="250" rx="14" fill="var(--card)"/>

<rect x="130" y="140" width="80" height="80" rx="4" fill="var(--grey)"/>
<rect x="220" y="140" width="80" height="80" rx="4" fill="var(--grey)"/>
<rect x="130" y="230" width="80" height="80" rx="4" fill="var(--grey)"/>
<rect x="220" y="230" width="80" height="80" rx="4" fill="var(--grey)"/>
<text x="215" y="340" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">Consumer  four units</text>

<text x="480" y="232" font-size="27" font-weight="700" fill="var(--dim)" text-anchor="middle">=</text>
<text x="480" y="266" font-size="15" fill="var(--dim)" text-anchor="middle">Same area</text>

<rect x="660" y="140" width="170" height="170" rx="4" fill="var(--accent)"/>
<text x="745" y="232" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">HBM</text>
<text x="745" y="340" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Top tier  one unit</text>

<line x1="100" y1="540" x2="880" y2="540" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="534" width="100" height="6" rx="2" fill="var(--grey)"/>
<text x="230" y="572" font-size="16" fill="var(--dim)" text-anchor="middle">Consumer price</text>
<rect x="680" y="400" width="100" height="140" rx="4" fill="var(--accent)"/>
<text x="730" y="572" font-size="16" fill="var(--dim)" text-anchor="middle">HBM price</text>
<text x="730" y="384" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">100x higher</text>
</svg>
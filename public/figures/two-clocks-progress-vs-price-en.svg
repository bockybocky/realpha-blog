<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A sparse timeline with five nodes above and a densely marked one below, crossed by one vertical dashed line.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .sub { font-size:15px; fill:var(--dim); }
    .cc { font-size:22px; fill:var(--accent); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="80" y="54">Two clocks with different graduations</text>

  <text class="g" x="80" y="196">Progress</text>
  <text class="sub" x="80" y="220">Quarters and years</text>
  <line x1="200" y1="210" x2="890" y2="210" stroke="var(--line)" stroke-width="3"/>
  <circle cx="200" cy="210" r="7" fill="var(--accent)"/>
  <circle cx="372" cy="210" r="7" fill="var(--accent)"/>
  <circle cx="544" cy="210" r="7" fill="var(--accent)"/>
  <circle cx="716" cy="210" r="7" fill="var(--accent)"/>
  <circle cx="888" cy="210" r="7" fill="var(--accent)"/>
  <text class="sub" x="200" y="248">Caught</text>
  <text class="sub" x="372" y="248" text-anchor="middle">Reflown</text>
  <text class="sub" x="544" y="248" text-anchor="middle">Reflown often</text>
  <text class="sub" x="716" y="248" text-anchor="middle">Shorter intervals</text>
  <text class="sub" x="888" y="248" text-anchor="end">Rapid reflight</text>

  <text class="g" x="80" y="356">Price</text>
  <text class="sub" x="80" y="380">Days</text>
  <line x1="200" y1="370" x2="890" y2="370" stroke="var(--line)" stroke-width="3"/>
  <g stroke="var(--grey)" stroke-width="2">
    <line x1="200" y1="360" x2="200" y2="380"/><line x1="220" y1="360" x2="220" y2="380"/><line x1="240" y1="360" x2="240" y2="380"/><line x1="260" y1="360" x2="260" y2="380"/><line x1="280" y1="360" x2="280" y2="380"/>
    <line x1="300" y1="360" x2="300" y2="380"/><line x1="320" y1="360" x2="320" y2="380"/><line x1="340" y1="360" x2="340" y2="380"/><line x1="360" y1="360" x2="360" y2="380"/><line x1="380" y1="360" x2="380" y2="380"/>
    <line x1="400" y1="360" x2="400" y2="380"/><line x1="420" y1="360" x2="420" y2="380"/><line x1="440" y1="360" x2="440" y2="380"/><line x1="460" y1="360" x2="460" y2="380"/><line x1="480" y1="360" x2="480" y2="380"/>
    <line x1="500" y1="360" x2="500" y2="380"/><line x1="520" y1="360" x2="520" y2="380"/><line x1="540" y1="360" x2="540" y2="380"/><line x1="560" y1="360" x2="560" y2="380"/><line x1="580" y1="360" x2="580" y2="380"/>
    <line x1="600" y1="360" x2="600" y2="380"/><line x1="620" y1="360" x2="620" y2="380"/><line x1="640" y1="360" x2="640" y2="380"/><line x1="660" y1="360" x2="660" y2="380"/><line x1="680" y1="360" x2="680" y2="380"/>
    <line x1="700" y1="360" x2="700" y2="380"/><line x1="720" y1="360" x2="720" y2="380"/><line x1="740" y1="360" x2="740" y2="380"/><line x1="760" y1="360" x2="760" y2="380"/><line x1="780" y1="360" x2="780" y2="380"/>
    <line x1="800" y1="360" x2="800" y2="380"/><line x1="820" y1="360" x2="820" y2="380"/><line x1="840" y1="360" x2="840" y2="380"/><line x1="860" y1="360" x2="860" y2="380"/><line x1="880" y1="360" x2="880" y2="380"/>
  </g>
  <text class="sub" x="200" y="408">Unlock dates</text>

  <line x1="560" y1="150" x2="560" y2="420" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="560" y="136" text-anchor="middle" font-size="16px" fill="var(--accent)">The same week</text>

  <text class="cc" x="80" y="470">Check your answer against the right clock</text>
</svg>
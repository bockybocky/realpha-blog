<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一塊寬板由六個圓支撐，只有兩個實心圓真正承重且標著虧錢">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="48" font-size="27" fill="var(--ink)">撐著整圈的其實是兩個點</text>
<rect x="100" y="110" width="760" height="60" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="149" font-size="20" fill="var(--ink)" text-anchor="middle">整輪的 AI 支出</text>
<g stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 5">
<line x1="190" y1="170" x2="190" y2="268"/>
<line x1="330" y1="170" x2="330" y2="268"/>
<line x1="630" y1="170" x2="630" y2="268"/>
<line x1="770" y1="170" x2="770" y2="268"/>
</g>
<g stroke="var(--warn)" stroke-width="4">
<line x1="420" y1="170" x2="420" y2="258"/>
<line x1="540" y1="170" x2="540" y2="258"/>
</g>
<g fill="none" stroke="var(--grey)" stroke-width="2">
<circle cx="190" cy="300" r="32"/><circle cx="330" cy="300" r="32"/>
<circle cx="630" cy="300" r="32"/><circle cx="770" cy="300" r="32"/>
</g>
<circle cx="420" cy="300" r="42" fill="var(--warn)" opacity="0.9"/>
<circle cx="540" cy="300" r="42" fill="var(--warn)" opacity="0.9"/>
<text x="420" y="307" font-size="19" fill="var(--page)" text-anchor="middle">虧錢</text>
<text x="540" y="307" font-size="19" fill="var(--page)" text-anchor="middle">虧錢</text>
<text x="190" y="372" font-size="16" fill="var(--dim)" text-anchor="middle">跟著出</text>
<text x="330" y="372" font-size="16" fill="var(--dim)" text-anchor="middle">跟著出</text>
<text x="630" y="372" font-size="16" fill="var(--dim)" text-anchor="middle">跟著出</text>
<text x="770" y="372" font-size="16" fill="var(--dim)" text-anchor="middle">跟著出</text>
<text x="480" y="372" font-size="19" fill="var(--warn)" text-anchor="middle">真正承重的兩家</text>
<text x="60" y="470" font-size="22" fill="var(--ink)">六家出錢的名單看起來分散，承重點只有兩個</text>
</svg>
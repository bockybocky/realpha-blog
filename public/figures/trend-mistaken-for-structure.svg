<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一段下跌後分岔：虛線沿原方向外推繼續下探，實線實際掉頭上揚">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">同一段真實的下跌，兩種讀法</text>
  <rect x="60" y="92" width="840" height="320" rx="14" fill="var(--card)"/>

  <path d="M120 170 L250 212 L380 258 L470 288" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
  <text class="b" x="130" y="150">已經發生的事實</text>
  <circle cx="470" cy="288" r="9" fill="var(--ink)"/>

  <path d="M470 288 L620 330 L860 376" fill="none" stroke="var(--grey)" stroke-width="5" stroke-dasharray="10 9"/>
  <text class="g" x="648" y="370" fill="var(--dim)">把趨勢外推</text>
  <text class="b" x="648" y="394">結構</text>

  <path d="M470 288 L600 254 L860 160" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linejoin="round"/>
  <text class="g" x="662" y="150" fill="var(--accent)">實際掉頭</text>
  <text class="b" x="662" y="174">新模型、需求湧出</text>

  <text class="c" x="60" y="470">數據沒看錯</text>
  <text class="b" x="60" y="502">錯在把一段方向當成一個結構</text>
</svg>
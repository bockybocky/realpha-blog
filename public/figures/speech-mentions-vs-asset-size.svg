<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="講稿提及 AI 遠多於房市，但資產規模的方塊大小正好相反。">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t h" x="60" y="66">講稿裡的比重，和實際的比重</text>
<text class="t b" x="60" y="118">傑克森霍爾演講提及次數</text>
<text class="t g" x="60" y="166" fill="var(--ink)">AI</text>
<rect x="150" y="144" width="560" height="30" rx="6" fill="var(--grey)"/>
<text class="t b" x="726" y="166">8</text>
<text class="t g" x="60" y="216" fill="var(--ink)">房市</text>
<rect x="150" y="194" width="70" height="30" rx="6" fill="var(--grey)"/>
<text class="t b" x="236" y="216">1</text>
<line x1="60" y1="258" x2="900" y2="258" stroke="var(--line)" stroke-width="2"/>
<text class="t b" x="60" y="294">資產類別規模</text>
<rect x="150" y="316" width="76" height="76" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t b" x="150" y="416">資料中心</text>
<rect x="330" y="316" width="300" height="152" rx="8" fill="var(--accent)"/>
<text class="t g" x="356" y="378" fill="var(--page)">美國房市</text>
<text class="t g" x="356" y="410" fill="var(--page)">50 兆美元</text>
<text class="t b" x="356" y="442" fill="var(--page)">新屋均價年減 8% 到 12%</text>
<text class="t c" x="60" y="528">你住在資料中心裡，還是住在房子裡</text>
</svg>
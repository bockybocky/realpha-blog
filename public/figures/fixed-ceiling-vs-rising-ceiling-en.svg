<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The left bar presses against a fixed horizontal ceiling, while the right ceiling is a rising dashed staircase with room still above the bar">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); font-weight:700; }
    .gl { font-size:19px; fill:var(--ink); font-weight:700; }
    .bd { font-size:16px; fill:var(--dim); }
    .bs { font-size:15px; fill:var(--dim); }
    .wn { font-size:15px; fill:var(--warn); }
    .cc { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ti" x="48" y="58">Hit the ceiling, or lift it</text>
<rect x="48" y="100" width="420" height="380" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="492" y="100" width="420" height="380" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="gl" x="72" y="140">2008  housing</text>
<text class="gl" x="516" y="140">AI capex</text>
<line x1="80" y1="200" x2="436" y2="200" stroke="var(--grey)" stroke-width="5"/>
<text class="bs" x="258" y="188" text-anchor="middle">Population demand: fixed</text>
<rect x="200" y="200" width="100" height="240" fill="var(--grey)"/>
<line x1="80" y1="440" x2="436" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="bd" x="250" y="466" text-anchor="middle">Debt lifts price</text>
<polyline points="524,320 634,320 634,270 744,270 744,215 880,215" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="9 6"/>
<text class="bs" x="756" y="200" text-anchor="middle">TAM grows with tech</text>
<rect x="620" y="360" width="100" height="80" fill="var(--accent)"/>
<line x1="524" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="bd" x="670" y="466" text-anchor="middle">Debt buys new uses</text>
<text class="wn" x="516" y="504">Premise: ceiling rises</text>
<text class="cc" x="48" y="544">Watch that premise, not bubbles</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="之前之後兩格對比：同樣長度的時間線，設計投入縮小後產品數從一個變三個">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">同樣兩三年，裝得進幾個產品</text>
<rect x="60" y="110" width="400" height="300" fill="var(--card)"/>
<rect x="500" y="110" width="400" height="300" fill="var(--card)"/>
<text x="84" y="150" font-size="20" fill="var(--dim)">過去</text>
<text x="524" y="150" font-size="20" fill="var(--accent)">若 AI 協作為真</text>
<rect x="84" y="180" width="352" height="160" fill="var(--grey)" opacity="0.45"/>
<text x="200" y="268" font-size="19" fill="var(--ink)">1 個產品</text>
<rect x="524" y="180" width="352" height="44" fill="var(--accent)" opacity="0.35"/>
<rect x="524" y="238" width="352" height="44" fill="var(--accent)" opacity="0.35"/>
<rect x="524" y="296" width="352" height="44" fill="var(--accent)" opacity="0.35"/>
<text x="664" y="208" font-size="16" fill="var(--ink)">產品</text>
<text x="664" y="266" font-size="16" fill="var(--ink)">產品</text>
<text x="664" y="324" font-size="16" fill="var(--ink)">產品</text>
<line x1="84" y1="368" x2="436" y2="368" stroke="var(--line)" stroke-width="3"/>
<line x1="524" y1="368" x2="876" y2="368" stroke="var(--line)" stroke-width="3"/>
<text x="84" y="392" font-size="15" fill="var(--dim)">兩三年</text>
<text x="524" y="392" font-size="15" fill="var(--dim)">兩三年（同樣長）</text>
<text x="60" y="458" font-size="22" fill="var(--ink)">投入變小，營運槓桿就開大</text>
<text x="60" y="492" font-size="15" fill="var(--warn)">他自己標的弱點：也可能只是設計能力本來就強，官宣只是官宣</text>
</svg>
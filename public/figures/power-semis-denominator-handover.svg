<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊密密麻麻的小圓點代表分散的電動車買家，右邊只有三塊大方塊代表少數超大型資料中心客戶">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); font-weight:600; }
    .body { font-size:16px; fill:var(--dim); }
    .concl { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t title" x="60" y="70">同樣一顆晶片，下訂單的人換了</text>

  <rect x="60" y="120" width="390" height="300" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="510" y="120" width="390" height="300" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text class="t grp" x="84" y="156">上一輪：電動車</text>
  <text class="t grp" x="534" y="156">這一輪：資料中心</text>

  <g fill="var(--grey)">
    <circle cx="104" cy="200" r="8"/><circle cx="144" cy="200" r="8"/><circle cx="184" cy="200" r="8"/><circle cx="224" cy="200" r="8"/><circle cx="264" cy="200" r="8"/><circle cx="304" cy="200" r="8"/><circle cx="344" cy="200" r="8"/><circle cx="384" cy="200" r="8"/>
    <circle cx="104" cy="242" r="8"/><circle cx="144" cy="242" r="8"/><circle cx="184" cy="242" r="8"/><circle cx="224" cy="242" r="8"/><circle cx="264" cy="242" r="8"/><circle cx="304" cy="242" r="8"/><circle cx="344" cy="242" r="8"/><circle cx="384" cy="242" r="8"/>
    <circle cx="104" cy="284" r="8"/><circle cx="144" cy="284" r="8"/><circle cx="184" cy="284" r="8"/><circle cx="224" cy="284" r="8"/><circle cx="264" cy="284" r="8"/><circle cx="304" cy="284" r="8"/><circle cx="344" cy="284" r="8"/><circle cx="384" cy="284" r="8"/>
    <circle cx="104" cy="326" r="8"/><circle cx="144" cy="326" r="8"/><circle cx="184" cy="326" r="8"/><circle cx="224" cy="326" r="8"/><circle cx="264" cy="326" r="8"/><circle cx="304" cy="326" r="8"/><circle cx="344" cy="326" r="8"/><circle cx="384" cy="326" r="8"/>
    <circle cx="104" cy="368" r="8"/><circle cx="144" cy="368" r="8"/><circle cx="184" cy="368" r="8"/><circle cx="224" cy="368" r="8"/><circle cx="264" cy="368" r="8"/><circle cx="304" cy="368" r="8"/><circle cx="344" cy="368" r="8"/><circle cx="384" cy="368" r="8"/>
  </g>

  <rect x="540" y="190" width="100" height="190" rx="8" fill="var(--accent)"/>
  <rect x="660" y="190" width="100" height="190" rx="8" fill="var(--accent)"/>
  <rect x="780" y="190" width="100" height="190" rx="8" fill="var(--accent)"/>

  <text class="t body" x="84" y="452">分散 · 消費品 · 看補貼與利率</text>
  <text class="t body" x="534" y="452">集中 · 資本支出 · 看建設計畫</text>

  <text class="t concl" x="60" y="508">分母換人，轉彎的速度也換人</text>
</svg>
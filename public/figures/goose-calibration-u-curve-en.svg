<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A U-shaped curve high at both ends and low in the middle, where the left and right end dots sit at the same height and the low middle is only a short band.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">Ends tie, thin</text>
  <line x1="110" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
  <line x1="110" y1="400" x2="110" y2="110" stroke="var(--line)" stroke-width="2"/>
  <text class="n" x="60" y="104">Users</text>
  <text class="n" x="60" y="130">Extra</text>
  <path d="M150 150 C 300 150 360 340 495 340 C 630 340 690 150 840 150" fill="none" stroke="var(--accent)" stroke-width="6"/>
  <circle cx="150" cy="150" r="13" fill="var(--warn)"/>
  <circle cx="840" cy="150" r="13" fill="var(--warn)"/>
  <text class="g" x="150" y="128">Lax</text>
  <text class="g" x="762" y="128">Taut</text>
  <text class="n" x="150" y="196">Upgrades hit users</text>
  <text class="n" x="636" y="196">Skip; users pay</text>
  <line x1="440" y1="340" x2="550" y2="340" stroke="var(--ink)" stroke-width="6"/>
  <text class="n" x="436" y="382">Tuned band</text>
  <text class="c" x="60" y="474">Devil in rate design</text>
</svg>
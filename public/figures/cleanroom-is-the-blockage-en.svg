<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The first of four pipeline segments has a break, the fluid stops before it, and the last three segments are empty.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="66" font-size="27" fill="var(--ink)">The shortage is not tools, it is fabs nobody can build fast enough</text>
  <rect x="60" y="110" width="840" height="330" rx="16" fill="var(--card)" stroke="var(--line)"/>
  <rect x="110" y="230" width="150" height="90" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
  <rect x="110" y="230" width="86" height="90" rx="10" fill="var(--accent)"/>
  <path d="M206 216 L206 334" stroke="var(--warn)" stroke-width="8"/>
  <text x="214" y="206" font-size="19" fill="var(--warn)">Stuck here</text>
  <rect x="300" y="230" width="150" height="90" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="490" y="230" width="150" height="90" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="680" y="230" width="150" height="90" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M262 275 L296 275" stroke="var(--grey)" stroke-width="6"/>
  <path d="M452 275 L486 275" stroke="var(--grey)" stroke-width="6"/>
  <path d="M642 275 L676 275" stroke="var(--grey)" stroke-width="6"/>
  <text x="185" y="372" font-size="19" fill="var(--ink)" text-anchor="middle">Cleanroom</text>
  <text x="375" y="372" font-size="19" fill="var(--dim)" text-anchor="middle">Tools move in</text>
  <text x="565" y="372" font-size="19" fill="var(--dim)" text-anchor="middle">Capacity</text>
  <text x="755" y="372" font-size="19" fill="var(--dim)" text-anchor="middle">Substrate supply</text>
  <text x="60" y="490" font-size="22" fill="var(--ink)">The first segment never fills, so the other three stay empty</text>
</svg>
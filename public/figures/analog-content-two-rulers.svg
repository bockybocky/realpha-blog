<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="同一段極細的量，在大尺上幾乎看不見，換到小尺上占掉大半">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="60" y="70" font-size="27" fill="var(--ink)">同一筆錢，換一把尺就換一種意義</text>

  <text x="120" y="130" font-size="19" fill="var(--dim)">一座 1 GW 資料中心</text>
  <rect x="120" y="150" width="140" height="330" fill="var(--card)" stroke="var(--line)"/>
  <rect x="120" y="472" width="140" height="8" fill="var(--accent)"/>
  <text x="120" y="508" font-size="15" fill="var(--dim)">約 1000 億美元</text>
  <polyline points="264,476 330,476 350,440" fill="none" stroke="var(--grey)" stroke-width="1.5"/>
  <text x="300" y="424" font-size="16" fill="var(--ink)">類比 10–15 億</text>
  <text x="300" y="446" font-size="15" fill="var(--dim)">約 1–2%</text>

  <path d="M 300 490 C 430 520 560 470 660 420" fill="none" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="7 7"/>
  <polygon points="666,416 650,418 656,430" fill="var(--grey)"/>
  <text x="430" y="536" font-size="16" fill="var(--dim)">換一把尺</text>

  <text x="700" y="130" font-size="19" fill="var(--dim)">ADI 的資料中心營收</text>
  <rect x="700" y="150" width="140" height="330" fill="var(--card)" stroke="var(--line)"/>
  <rect x="700" y="250" width="140" height="230" fill="var(--accent)"/>
  <text x="716" y="372" font-size="16" fill="var(--page)">同一筆錢</text>
  <text x="700" y="508" font-size="15" fill="var(--dim)">今年翻倍的來源</text>

  <text x="60" y="562" font-size="22" fill="var(--ink)">零頭還是主線，取決於誰在量</text>
</svg>
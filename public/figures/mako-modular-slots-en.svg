<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A building-block layout with a central hull and one swappable module attached on each of four sides.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="80" y="60" font-size="27" fill="var(--ink)">One hull, swap parts and swap missions</text>

  <rect x="380" y="240" width="200" height="90" rx="12" fill="var(--grey)"/>
  <text x="480" y="294" font-size="20" fill="var(--page)" text-anchor="middle">Shared hull</text>

  <rect x="380" y="130" width="200" height="70" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="480" y="172" font-size="19" fill="var(--accent)" text-anchor="middle">Battery pack</text>
  <line x1="480" y1="200" x2="480" y2="240" stroke="var(--line)" stroke-width="3"/>
  <text x="620" y="172" font-size="16" fill="var(--dim)">+150 nmi range</text>

  <rect x="380" y="370" width="200" height="70" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="480" y="412" font-size="19" fill="var(--accent)" text-anchor="middle">Rear thruster module</text>
  <line x1="480" y1="330" x2="480" y2="370" stroke="var(--line)" stroke-width="3"/>
  <text x="620" y="412" font-size="16" fill="var(--dim)">Faster</text>

  <rect x="110" y="250" width="190" height="70" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="205" y="292" font-size="19" fill="var(--accent)" text-anchor="middle">Stereo cameras</text>
  <line x1="300" y1="285" x2="380" y2="285" stroke="var(--line)" stroke-width="3"/>
  <text x="205" y="340" font-size="16" fill="var(--dim)" text-anchor="middle">3D imaging</text>

  <rect x="660" y="250" width="190" height="70" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="755" y="292" font-size="19" fill="var(--accent)" text-anchor="middle">Sonar nose</text>
  <line x1="580" y1="285" x2="660" y2="285" stroke="var(--line)" stroke-width="3"/>
  <text x="755" y="340" font-size="16" fill="var(--dim)" text-anchor="middle">Depth maps</text>

  <text x="80" y="510" font-size="22" fill="var(--ink)">A new customer doesn't mean a new vehicle</text>
</svg>
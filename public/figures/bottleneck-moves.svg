<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三層堆疊重複四次，每次收窄的那一層都不一樣，瓶頸位置隨時間移動" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="48" y="56" font-size="27" fill="var(--ink)">瓶頸一直在搬家</text>
  <text x="48" y="88" font-size="16" fill="var(--dim)">同一條堆疊，收窄的那一層會換位置</text>

  <text x="155" y="209" font-size="16" fill="var(--dim)" text-anchor="end">研究想法</text>
  <text x="155" y="289" font-size="16" fill="var(--dim)" text-anchor="end">算力</text>
  <text x="155" y="369" font-size="16" fill="var(--dim)" text-anchor="end">資料</text>

  <text x="250" y="140" font-size="19" fill="var(--ink)" text-anchor="middle">早期</text>
  <text x="430" y="140" font-size="19" fill="var(--ink)" text-anchor="middle">GPT-4 之後</text>
  <text x="610" y="140" font-size="19" fill="var(--ink)" text-anchor="middle">資料用完</text>
  <text x="790" y="140" font-size="19" fill="var(--ink)" text-anchor="middle">現在</text>

  <rect x="220" y="170" width="60" height="64" rx="6" fill="var(--accent)"/>
  <rect x="175" y="250" width="150" height="64" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="175" y="330" width="150" height="64" rx="6" fill="var(--card)" stroke="var(--line)"/>

  <rect x="355" y="170" width="150" height="64" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="400" y="250" width="60" height="64" rx="6" fill="var(--accent)"/>
  <rect x="355" y="330" width="150" height="64" rx="6" fill="var(--card)" stroke="var(--line)"/>

  <rect x="535" y="170" width="150" height="64" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="535" y="250" width="150" height="64" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="580" y="330" width="60" height="64" rx="6" fill="var(--accent)"/>

  <rect x="715" y="170" width="150" height="64" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="760" y="250" width="60" height="64" rx="6" fill="var(--accent)"/>
  <rect x="715" y="330" width="150" height="64" rx="6" fill="var(--card)" stroke="var(--line)"/>

  <line x1="175" y1="425" x2="880" y2="425" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="880,425 866,419 866,431" fill="var(--grey)"/>
  <text x="878" y="452" font-size="15" fill="var(--dim)" text-anchor="end">時間</text>

  <text x="480" y="505" font-size="22" fill="var(--accent)" text-anchor="middle">結構性判斷要附到期日</text>
</svg>
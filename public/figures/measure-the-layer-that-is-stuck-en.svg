<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="An arrow points at the stuck layer in a three-layer stack, and only that layer has matching numbers to measure.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62">Find the layer first</text>
  <rect x="150" y="110" width="300" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="170" y="152" fill="var(--dim)">Cap</text>
  <rect x="150" y="196" width="300" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="170" y="238" fill="var(--dim)">Ppl</text>
  <rect x="150" y="282" width="300" height="70" rx="6" fill="var(--accent)"/>
  <text class="g" x="170" y="324" fill="var(--page)">SW+intg</text>
  <g stroke="var(--warn)" stroke-width="4" fill="none">
    <path d="M90 317 L140 317"/>
    <path d="M140 317 l-14 -8 M140 317 l-14 8"/>
  </g>
  <line x1="500" y1="110" x2="500" y2="352" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="530" y="152">kit, ETA</text>
  <text class="b" x="530" y="238">heads, %</text>
  <text class="g" x="530" y="324" fill="var(--accent)">engs, lead</text>
  <text class="c" x="60" y="420">No claim, wrong measurements</text>
</svg>
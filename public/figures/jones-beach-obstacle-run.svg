<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條路線穿過一排連續擋在前面的地塊，從城市抵達海灘">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="62" font-size="27" fill="var(--ink)" font-weight="700">沒有徵收權，路還是穿過去了</text>

<rect x="48" y="170" width="110" height="130" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="62" y="240" font-size="19" fill="var(--ink)" font-weight="700">紐約市</text>

<rect x="230" y="170" width="92" height="130" rx="6" fill="var(--card)" stroke="var(--grey)"/>
<rect x="342" y="170" width="92" height="130" rx="6" fill="var(--card)" stroke="var(--grey)"/>
<rect x="454" y="170" width="92" height="130" rx="6" fill="var(--card)" stroke="var(--grey)"/>
<rect x="566" y="170" width="92" height="130" rx="6" fill="var(--card)" stroke="var(--grey)"/>
<rect x="678" y="170" width="92" height="130" rx="6" fill="var(--card)" stroke="var(--grey)"/>
<text x="248" y="340" font-size="15" fill="var(--dim)">農地</text>
<text x="360" y="340" font-size="15" fill="var(--dim)">農地</text>
<text x="472" y="340" font-size="15" fill="var(--dim)">農地</text>
<text x="584" y="340" font-size="15" fill="var(--dim)">農地</text>
<text x="696" y="340" font-size="15" fill="var(--dim)">農地</text>

<path d="M158 235 L230 235 M322 235 L342 235 M434 235 L454 235 M546 235 L566 235 M658 235 L678 235 M770 235 L830 235" stroke="var(--accent)" stroke-width="9"/>
<path d="M230 235 L322 235 M342 235 L434 235 M454 235 L546 235 M566 235 L658 235 M678 235 L770 235" stroke="var(--accent)" stroke-width="9" stroke-dasharray="14 10"/>

<rect x="830" y="170" width="82" height="130" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="840" y="230" font-size="19" fill="var(--ink)" font-weight="700">瓊斯</text>
<text x="840" y="256" font-size="19" fill="var(--ink)" font-weight="700">海灘</text>

<text x="400" y="130" font-size="16" fill="var(--dim)">二十七英里</text>
<text x="48" y="440" font-size="22" fill="var(--ink)">一個障礙，一個障礙</text>
</svg>
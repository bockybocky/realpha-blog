<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Four small squares on the left are a humanoid robot, an industrial robot, a drone and a wafer fab, while the single huge disc on the right is a data center, and all four squares added together are still far smaller than that disc.">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">New load, beside the data center</text>
  <text x="60" y="100" font-size="16" fill="var(--dim)">Not to scale</text>

  <rect x="70" y="160" width="110" height="70" rx="8" fill="var(--grey)"/>
  <rect x="200" y="160" width="110" height="70" rx="8" fill="var(--grey)"/>
  <rect x="70" y="270" width="110" height="70" rx="8" fill="var(--grey)"/>
  <rect x="200" y="270" width="110" height="70" rx="8" fill="var(--grey)"/>
  <g font-size="15" fill="var(--ink)" text-anchor="middle">
    <text x="125" y="192">Humanoid</text>
    <text x="125" y="212">robots</text>
    <text x="255" y="192">Industrial</text>
    <text x="255" y="212">robots</text>
    <text x="125" y="302">Drones</text>
    <text x="255" y="302">Fabs</text>
    <text x="255" y="322">100 MW</text>
  </g>
  <text x="125" y="322" font-size="15" fill="var(--ink)" text-anchor="middle">To 1B</text>
  <text x="190" y="382" font-size="16" fill="var(--dim)" text-anchor="middle">Humanoid power/yr</text>
  <text x="190" y="406" font-size="16" fill="var(--dim)" text-anchor="middle">3-4x a fridge</text>

  <circle cx="680" cy="270" r="180" fill="var(--accent)"/>
  <text x="680" y="262" font-size="27" font-weight="700" fill="var(--page)" text-anchor="middle">Data center</text>
  <text x="680" y="298" font-size="19" fill="var(--page)" text-anchor="middle">Eclipsing</text>

  <text x="60" y="482" font-size="22" font-weight="700" fill="var(--ink)">Flywheel real, invisible in the total</text>
</svg>
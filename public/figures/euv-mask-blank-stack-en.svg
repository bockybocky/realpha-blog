<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A top-to-bottom cross-section with a dense multilayer stack in the middle and the thickest glass layer at the bottom.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">How a mask blank is stacked up</text>

<rect x="200" y="120" width="420" height="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="650" y="134" font-size="16" fill="var(--dim)">Pellicle　stops particles</text>

<rect x="200" y="178" width="420" height="28" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="650" y="199" font-size="16" fill="var(--dim)">Absorber　eats reflection</text>

<rect x="200" y="206" width="420" height="18" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="650" y="222" font-size="16" fill="var(--dim)">Dielectric　etch stop</text>

<rect x="200" y="224" width="420" height="120" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<line x1="200" y1="236" x2="620" y2="236" stroke="var(--accent)" stroke-width="1"/>
<line x1="200" y1="248" x2="620" y2="248" stroke="var(--accent)" stroke-width="1"/>
<line x1="200" y1="260" x2="620" y2="260" stroke="var(--accent)" stroke-width="1"/>
<line x1="200" y1="272" x2="620" y2="272" stroke="var(--accent)" stroke-width="1"/>
<line x1="200" y1="284" x2="620" y2="284" stroke="var(--accent)" stroke-width="1"/>
<line x1="200" y1="296" x2="620" y2="296" stroke="var(--accent)" stroke-width="1"/>
<line x1="200" y1="308" x2="620" y2="308" stroke="var(--accent)" stroke-width="1"/>
<line x1="200" y1="320" x2="620" y2="320" stroke="var(--accent)" stroke-width="1"/>
<line x1="200" y1="332" x2="620" y2="332" stroke="var(--accent)" stroke-width="1"/>
<text x="650" y="278" font-size="16" fill="var(--ink)">Multilayer　40 Mo/Si pairs</text>
<text x="650" y="304" font-size="16" fill="var(--dim)">About 7 nm per pair</text>

<rect x="200" y="344" width="420" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="650" y="412" font-size="16" fill="var(--dim)">Low-expansion glass</text>
<text x="650" y="438" font-size="16" fill="var(--dim)">Heats up during exposure</text>

<rect x="200" y="494" width="420" height="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="650" y="508" font-size="16" fill="var(--dim)">Backside film　for the chuck</text>

<text x="60" y="566" font-size="22" fill="var(--ink)">The hard part is not one perfect mask, but every mask perfect</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="法庭座位形狀：法官在上、發明人當檢察官與辯方工程師對坐，過關才有出口通往總會">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="60" y="68">灰色地帶，先在自己家裡開庭</text>

<rect x="330" y="110" width="300" height="76" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="352" y="146">法官席</text>
<text class="t b" x="352" y="174">法務長・執行長</text>

<rect x="80" y="250" width="280" height="110" rx="12" fill="var(--warn)" opacity="0.9"/>
<text class="t g" x="104" y="290" fill="var(--page)">檢察官</text>
<text class="t b" x="104" y="320" fill="var(--page)">發明它的那個人</text>
<text class="t b" x="104" y="346" fill="var(--page)">攻擊自己的設計</text>

<rect x="600" y="250" width="280" height="110" rx="12" fill="var(--accent)" opacity="0.9"/>
<text class="t g" x="624" y="290" fill="var(--page)">辯方</text>
<text class="t b" x="624" y="320" fill="var(--page)">另一批工程師</text>
<text class="t b" x="624" y="346" fill="var(--page)">主張它合法</text>

<path d="M372 305 L588 305" stroke="var(--dim)" stroke-width="3"/>
<polygon points="378,305 392,298 392,312" fill="var(--dim)"/>
<polygon points="582,305 568,298 568,312" fill="var(--dim)"/>
<path d="M220 250 L450 192" stroke="var(--line)" stroke-width="2"/>
<path d="M740 250 L510 192" stroke="var(--line)" stroke-width="2"/>

<rect x="330" y="420" width="300" height="70" rx="12" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="t g" x="354" y="464">出去跟總會談</text>
<path d="M480 366 L480 414" stroke="var(--accent)" stroke-width="3"/>
<polygon points="480,420 472,406 488,406" fill="var(--accent)"/>
<text class="t c" x="60" y="522">看的是：你能不能把「它合法」這個論點拆掉</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條線從同一點分岔，一條一路往下到負七成，另一條先往上漲近四成再回落到正三趴。">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">叫它科技泡沫，名字取得準</text>
<line x1="120" y1="230" x2="900" y2="230" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="236" font-size="15" fill="var(--dim)">起點</text>
<polyline points="120,230 880,412" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polyline points="120,230 560,126 880,222" fill="none" stroke="var(--warn)" stroke-width="5"/>
<circle cx="120" cy="230" r="8" fill="var(--ink)"/>
<circle cx="880" cy="412" r="9" fill="var(--accent)"/>
<circle cx="560" cy="126" r="9" fill="var(--warn)"/>
<circle cx="880" cy="222" r="9" fill="var(--warn)"/>
<text x="870" y="444" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="end">科技＋通訊服務 跌 70%</text>
<text x="560" y="108" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">其餘市場 中途漲近 40%</text>
<text x="870" y="206" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="end">同期 漲 3%</text>
<text x="120" y="470" font-size="17" fill="var(--dim)">2000 年 3 月</text>
<text x="900" y="470" font-size="17" fill="var(--dim)" text-anchor="end">2002 年 10 月</text>
<line x1="120" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="516" font-size="16" fill="var(--dim)">前提：那一輪沒有伴隨深度衰退</text>
</svg>
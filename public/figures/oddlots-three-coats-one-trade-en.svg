<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Lines from three position boxes converge downward into one box.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="72" font-size="27" fill="var(--ink)">3 positions, one bet</text>
<rect x="60" y="120" width="250" height="100" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="185" y="166" font-size="20" fill="var(--ink)" text-anchor="middle">Chips</text>
<text x="185" y="196" font-size="15" fill="var(--dim)" text-anchor="middle">Equity</text>
<rect x="355" y="120" width="250" height="100" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="166" font-size="20" fill="var(--ink)" text-anchor="middle">Memory</text>
<text x="480" y="196" font-size="15" fill="var(--dim)" text-anchor="middle">Equity team 2</text>
<rect x="650" y="120" width="250" height="100" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="775" y="166" font-size="20" fill="var(--ink)" text-anchor="middle">UST ↓</text>
<text x="775" y="196" font-size="15" fill="var(--dim)" text-anchor="middle">Macro</text>
<line x1="185" y1="220" x2="474" y2="372" stroke="var(--accent)" stroke-width="3"/>
<line x1="480" y1="220" x2="480" y2="372" stroke="var(--accent)" stroke-width="3"/>
<line x1="775" y1="220" x2="486" y2="372" stroke="var(--accent)" stroke-width="3"/>
<polygon points="468,366 492,366 480,386" fill="var(--accent)"/>
<rect x="330" y="398" width="300" height="92" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="480" y="452" font-size="22" fill="var(--ink)" text-anchor="middle">The same AI trade</text>
<text x="60" y="534" font-size="22" fill="var(--ink)">One body, many coats</text>
</svg>
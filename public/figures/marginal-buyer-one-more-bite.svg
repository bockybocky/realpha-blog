<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="已買飽的部位是矮方塊，再多吃的那一口是高出一截的方塊，高度差就是他要的補償">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink)}
.ga{font-size:19px;fill:var(--accent)}
.b{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">再吃一口，他開什麼價</text>
<text class="b" x="60" y="150">殖利率</text>
<line x1="140" y1="120" x2="140" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="440" x2="890" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="312" x2="890" y2="312" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 6"/>
<text class="b" x="898" y="317" text-anchor="end" opacity="0">.</text>
<text class="g" x="820" y="303">5.3%</text>
<rect x="190" y="312" width="310" height="128" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="345" y="368" text-anchor="middle">已持有 200 億</text>
<text class="b" x="345" y="396" text-anchor="middle">買飽了</text>
<rect x="560" y="212" width="210" height="228" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<text class="ga" x="665" y="330" text-anchor="middle">再吃 100 億</text>
<text class="b" x="665" y="358" text-anchor="middle">價位要重談</text>
<line x1="830" y1="312" x2="830" y2="222" stroke="var(--accent)" stroke-width="2.5"/>
<path d="M830 214 L824 230 L836 230 Z" fill="var(--accent)"/>
<text class="b" x="846" y="270">補償</text>
<text class="c" x="60" y="500">多出來的那一口，決定全體的價格</text>
</svg>
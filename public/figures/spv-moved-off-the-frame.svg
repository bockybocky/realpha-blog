<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一塊義務被箭頭從實線報表框內搬到框外的虛線泡泡，泡泡旁標著更貴">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="70" font-size="27" fill="var(--ink)">更貴的那條路，為什麼還要走</text>

  <rect x="90" y="130" width="340" height="290" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="114" y="170" font-size="20" fill="var(--dim)">公司財務報表</text>
  <rect x="118" y="198" width="284" height="30" rx="4" fill="var(--page)" stroke="var(--line)"/>
  <rect x="118" y="244" width="284" height="30" rx="4" fill="var(--page)" stroke="var(--line)"/>
  <rect x="118" y="290" width="284" height="30" rx="4" fill="var(--page)" stroke="var(--line)"/>
  <text x="118" y="368" font-size="15" fill="var(--dim)">你看得見的地方</text>

  <line x1="446" y1="262" x2="566" y2="262" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="578,262 562,255 562,269" fill="var(--accent)"/>
  <text x="462" y="240" font-size="16" fill="var(--accent)">搬出去</text>

  <rect x="592" y="160" width="290" height="200" rx="12" fill="var(--page)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="618" y="204" font-size="20" fill="var(--accent)">SPV</text>
  <rect x="618" y="228" width="200" height="46" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text x="640" y="258" font-size="16" fill="var(--ink)">真實義務</text>
  <text x="618" y="304" font-size="15" fill="var(--warn)">出資方要報酬</text>
  <text x="618" y="330" font-size="15" fill="var(--warn)">這條路更貴</text>

  <text x="60" y="500" font-size="22" fill="var(--ink)">要問的不是多大，是為什麼搬</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="On the left one hub node links out to three outer nodes; on the right a row of bars gets shorter going down, showing downstream demand shrinking.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t27{font-size:27px;font-weight:700;fill:var(--ink)}
.t19{font-size:19px;font-weight:700;fill:var(--ink)}
.t15{font-size:15px;fill:var(--dim)}
.t16{font-size:16px;fill:var(--ink)}
.t22{font-size:22px;font-weight:700;fill:var(--ink)}
.bx{fill:var(--card);stroke:var(--line);stroke-width:2}
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t27" x="48" y="46">Hub slips, all shrink</text>

<line x1="220" y1="300" x2="120" y2="150" stroke="var(--grey)" stroke-width="3"/>
<line x1="220" y1="300" x2="330" y2="146" stroke="var(--grey)" stroke-width="3"/>
<line x1="220" y1="300" x2="130" y2="456" stroke="var(--grey)" stroke-width="3"/>
<rect class="bx" x="40" y="118" width="160" height="46" rx="8"/>
<text class="t16" x="120" y="147" text-anchor="middle">Asia chain</text>
<rect class="bx" x="252" y="114" width="190" height="46" rx="8"/>
<text class="t16" x="347" y="143" text-anchor="middle">7 banks</text>
<rect class="bx" x="40" y="432" width="190" height="46" rx="8"/>
<text class="t16" x="135" y="461" text-anchor="middle">Chip swap</text>
<circle cx="220" cy="300" r="66" fill="var(--card)" stroke="var(--accent)" stroke-width="4"/>
<text class="t19" x="220" y="294" text-anchor="middle">One</text>
<text class="t19" x="220" y="320" text-anchor="middle">Ties</text>

<line x1="286" y1="300" x2="520" y2="300" stroke="var(--accent)" stroke-width="4"/>
<polygon points="532,300 514,292 514,308" fill="var(--accent)"/>

<rect x="560" y="140" width="330" height="38" fill="var(--accent)"/>
<text class="t16" x="574" y="166" fill="var(--page)">NVIDIA chips</text>
<rect x="560" y="212" width="272" height="38" fill="var(--accent)"/>
<text class="t16" x="574" y="238" fill="var(--page)">Foxconn servers</text>
<rect x="560" y="284" width="214" height="38" fill="var(--accent)"/>
<text class="t16" x="574" y="310" fill="var(--page)">PCB boards</text>
<rect x="560" y="356" width="156" height="38" fill="var(--accent)"/>
<text class="t16" x="574" y="382" fill="var(--page)">CoWoS packaging</text>
<line x1="540" y1="150" x2="540" y2="400" stroke="var(--line)" stroke-width="2"/>
<polygon points="540,414 532,396 548,396" fill="var(--line)"/>
<text class="t15" x="560" y="440">Less below</text>

<text class="t22" x="48" y="552">His deals hold the volume</text>
</svg>
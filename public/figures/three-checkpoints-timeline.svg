<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="時間線上三個可以回頭對答案的觀察點">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="80" y="62" font-size="27" font-weight="700" fill="var(--ink)">寫下三個會到期的觀察點</text>

<line x1="100" y1="300" x2="860" y2="300" stroke="var(--line)" stroke-width="6"/>
<polygon points="880,300 858,290 858,310" fill="var(--line)"/>
<text class="t" x="100" y="340" font-size="15" fill="var(--dim)">今天</text>
<circle cx="100" cy="300" r="8" fill="var(--dim)"/>

<circle cx="300" cy="300" r="12" fill="var(--accent)"/>
<line x1="300" y1="288" x2="300" y2="210" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="300" y="192" font-size="19" fill="var(--ink)" text-anchor="middle">量產出貨公告</text>
<text class="t" x="300" y="166" font-size="15" fill="var(--dim)" text-anchor="middle">不算展場概念</text>
<text class="t" x="300" y="344" font-size="15" fill="var(--dim)" text-anchor="middle">兩年內</text>

<circle cx="560" cy="300" r="12" fill="var(--accent)"/>
<line x1="560" y1="312" x2="560" y2="390" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="560" y="414" font-size="19" fill="var(--ink)" text-anchor="middle">標準定案</text>
<text class="t" x="560" y="440" font-size="15" fill="var(--dim)" text-anchor="middle">通訊與硬體安全，哪一國先定</text>

<circle cx="800" cy="300" r="12" fill="var(--accent)"/>
<line x1="800" y1="288" x2="800" y2="210" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="800" y="192" font-size="19" fill="var(--ink)" text-anchor="middle">政府採購案</text>
<text class="t" x="800" y="166" font-size="15" fill="var(--dim)" text-anchor="middle">不算示範合作</text>

<text class="t" x="80" y="500" font-size="22" font-weight="700" fill="var(--ink)">到期回頭看，對了加權、錯了降權</text>
</svg>
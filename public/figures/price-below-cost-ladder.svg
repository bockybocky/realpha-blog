<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="價格階梯由上而下是零售499美元、店家進價、網路賣家200美元，進價與賣家之間的差額被標成要有解釋">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<defs>
  <marker id="ar-price" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker>
</defs>
<text x="48" y="62" class="t">價格低到不合理</text>
<line x1="180" y1="450" x2="180" y2="112" stroke="var(--dim)" stroke-width="2" marker-end="url(#ar-price)"/>
<text x="180" y="100" class="d" text-anchor="middle">價格</text>
<line x1="180" y1="150" x2="720" y2="150" stroke="var(--ink)" stroke-width="3"/>
<text x="166" y="156" class="b" text-anchor="end">$499</text>
<text x="740" y="157" class="g">店家零售</text>
<rect x="180" y="225" width="540" height="40" fill="var(--grey)" fill-opacity="0.6"/>
<text x="740" y="252" class="g">店家進價</text>
<rect x="180" y="265" width="540" height="125" fill="var(--warn)" fill-opacity="0.14"/>
<text x="450" y="334" class="g w" text-anchor="middle">這段差額要有解釋</text>
<line x1="180" y1="390" x2="720" y2="390" stroke="var(--accent)" stroke-width="3"/>
<text x="166" y="396" class="b" text-anchor="end">$200</text>
<text x="740" y="397" class="g a">網路賣家</text>
<text x="740" y="422" class="d">全新未拆・大量</text>
<text x="480" y="500" class="c" text-anchor="middle">低於進價 → 先問貨從哪來</text>
</svg>
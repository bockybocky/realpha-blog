<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-label="三列扇形：數學一條路最快，程式三條路次之，文章散成九條最慢">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="610" fill="var(--page)"/>
  <text x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">下一個字，有幾種可能</text>

  <rect x="40" y="105" width="880" height="130" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="70" y="164" font-size="20" font-weight="700" fill="var(--ink)">解數學題</text>
  <text x="70" y="190" font-size="15" fill="var(--dim)">公式、數字</text>
  <line x1="270" y1="170" x2="560" y2="170" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="260" cy="170" r="10" fill="var(--accent)"/>
  <text x="700" y="180" font-size="27" font-weight="700" fill="var(--accent)">150<tspan font-size="15" font-weight="400" fill="var(--dim)"> 字/秒</tspan></text>

  <rect x="40" y="255" width="880" height="130" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="70" y="314" font-size="20" font-weight="700" fill="var(--ink)">寫程式</text>
  <text x="70" y="340" font-size="15" fill="var(--dim)">括號好猜、變數名難猜</text>
  <line x1="270" y1="320" x2="560" y2="280" stroke="var(--grey)" stroke-width="2"/>
  <line x1="270" y1="320" x2="560" y2="320" stroke="var(--accent)" stroke-width="3"/>
  <line x1="270" y1="320" x2="560" y2="360" stroke="var(--grey)" stroke-width="2"/>
  <circle cx="260" cy="320" r="10" fill="var(--accent)"/>
  <text x="700" y="330" font-size="27" font-weight="700" fill="var(--accent)">125<tspan font-size="15" font-weight="400" fill="var(--dim)"> 字/秒</tspan></text>

  <rect x="40" y="405" width="880" height="130" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="70" y="464" font-size="20" font-weight="700" fill="var(--ink)">寫文章</text>
  <text x="70" y="490" font-size="15" fill="var(--dim)">春風吹過……</text>
  <line x1="270" y1="470" x2="560" y2="414" stroke="var(--grey)" stroke-width="2"/>
  <line x1="270" y1="470" x2="560" y2="428" stroke="var(--grey)" stroke-width="2"/>
  <line x1="270" y1="470" x2="560" y2="442" stroke="var(--grey)" stroke-width="2"/>
  <line x1="270" y1="470" x2="560" y2="456" stroke="var(--grey)" stroke-width="2"/>
  <line x1="270" y1="470" x2="560" y2="470" stroke="var(--grey)" stroke-width="2"/>
  <line x1="270" y1="470" x2="560" y2="484" stroke="var(--grey)" stroke-width="2"/>
  <line x1="270" y1="470" x2="560" y2="498" stroke="var(--grey)" stroke-width="2"/>
  <line x1="270" y1="470" x2="560" y2="512" stroke="var(--grey)" stroke-width="2"/>
  <line x1="270" y1="470" x2="560" y2="526" stroke="var(--grey)" stroke-width="2"/>
  <circle cx="260" cy="470" r="10" fill="var(--accent)"/>
  <text x="700" y="480" font-size="27" font-weight="700" fill="var(--warn)">最慢</text>

  <text x="480" y="585" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">岔路越少，猜得越快</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條橫條把一個廠址一天的排放與用水換算成十五萬輛車與三十萬人，後者長度為前者兩倍">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">一個廠址，一天</text>
<text x="48" y="92" font-size="16" fill="var(--dim)">燃氣複循環，一 GW，賣方口徑</text>
<text x="48" y="168" font-size="19" fill="var(--ink)">氮氧化物</text>
<text x="48" y="196" font-size="16" fill="var(--dim)">約 720 磅</text>
<rect x="240" y="146" width="290" height="56" rx="4" fill="var(--warn)"/>
<text x="548" y="182" font-size="19" fill="var(--ink)">≈ 15 萬輛新車</text>
<text x="48" y="318" font-size="19" fill="var(--ink)">用水</text>
<text x="48" y="346" font-size="16" fill="var(--dim)">約 450 萬加侖</text>
<rect x="240" y="296" width="580" height="56" rx="4" fill="var(--warn)"/>
<text x="838" y="332" font-size="19" fill="var(--ink)">≈ 30 萬人洗澡</text>
<rect x="48" y="410" width="772" height="44" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="68" y="439" font-size="16" fill="var(--dim)">社區聽證會吵的，是這兩條</text>
<text x="48" y="498" font-size="22" fill="var(--ink)">最便宜之外，多了一個要回答的問題</text>
</svg>
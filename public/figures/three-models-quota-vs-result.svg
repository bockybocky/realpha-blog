<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條長度差很多的橫條，最短的兩條標失敗，最長的一條標做對">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">吃掉多少額度 × 做成了沒有</text>
<text x="60" y="94" font-size="16" fill="var(--dim)">掄錘者同一台機器上的三次實測</text>

<text x="60" y="176" font-size="20" fill="var(--ink)">5.6 Luna</text>
<rect x="260" y="148" width="420" height="44" fill="var(--card)" stroke="var(--line)"/>
<rect x="260" y="148" width="21" height="44" fill="var(--grey)"/>
<text x="295" y="176" font-size="16" fill="var(--dim)">1%</text>
<text x="730" y="176" font-size="16" fill="var(--warn)">設定弄壞</text>

<text x="60" y="276" font-size="20" fill="var(--ink)">5.6 Terra</text>
<rect x="260" y="248" width="420" height="44" fill="var(--card)" stroke="var(--line)"/>
<rect x="260" y="248" width="126" height="44" fill="var(--grey)"/>
<text x="400" y="276" font-size="16" fill="var(--dim)">6%</text>
<text x="730" y="276" font-size="16" fill="var(--warn)">做不到三分之一</text>

<text x="60" y="376" font-size="20" fill="var(--ink)">GPT6</text>
<rect x="260" y="348" width="420" height="44" fill="var(--card)" stroke="var(--line)"/>
<rect x="260" y="348" width="368" height="44" fill="var(--accent)"/>
<text x="642" y="376" font-size="16" fill="var(--dim)">15–20%</text>
<text x="730" y="376" font-size="16" fill="var(--accent)">做對了，但慢</text>

<text x="60" y="460" font-size="22" fill="var(--ink)">省下來的額度，沒有換到做完的事</text>
</svg>
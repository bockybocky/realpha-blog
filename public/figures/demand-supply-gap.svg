<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="五個題材需求高度相近，前三個供給幾乎填滿，後兩個供給只填一小截，空出明顯缺口">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="56" font-size="27">缺口在沒人挖的地方</text>
  <rect x="600" y="84" width="18" height="14" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="626" y="97" font-size="15" fill="var(--dim)">需求</text>
  <rect x="700" y="84" width="18" height="14" fill="var(--accent)"/>
  <text x="726" y="97" font-size="15" fill="var(--dim)">供給</text>
  <line x1="60" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
  <rect x="110" y="170" width="90" height="230" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="110" y="185" width="90" height="215" fill="var(--accent)"/>
  <text x="155" y="430" font-size="19" text-anchor="middle">財經</text>
  <rect x="270" y="170" width="90" height="230" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="270" y="205" width="90" height="195" fill="var(--accent)"/>
  <text x="315" y="430" font-size="19" text-anchor="middle">AI 主題</text>
  <rect x="430" y="170" width="90" height="230" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="430" y="195" width="90" height="205" fill="var(--accent)"/>
  <text x="475" y="430" font-size="19" text-anchor="middle">健康</text>
  <rect x="590" y="170" width="90" height="230" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="590" y="310" width="90" height="90" fill="var(--accent)"/>
  <text x="635" y="250" font-size="16" text-anchor="middle" fill="var(--warn)">缺口</text>
  <text x="635" y="430" font-size="19" text-anchor="middle">歷史</text>
  <rect x="750" y="170" width="90" height="230" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="750" y="360" width="90" height="40" fill="var(--accent)"/>
  <text x="795" y="270" font-size="16" text-anchor="middle" fill="var(--warn)">缺口</text>
  <text x="795" y="430" font-size="19" text-anchor="middle">理系教養</text>
  <text x="480" y="492" font-size="22" text-anchor="middle">熱鬧在需求端，訂價權在供給端</text>
</svg>
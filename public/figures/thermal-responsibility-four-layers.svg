<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="熱由下往上穿過四層堆疊，每層只截住其中一段，層與層之間留著三條虛線的交界縫">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
<marker id="f2w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker>
</defs>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">熱解不掉的時候，責任被切成四段</text>
<path d="M170 470 V138" stroke="var(--warn)" stroke-width="3" fill="none" marker-end="url(#f2w)"/>
<text x="140" y="310" font-size="19" fill="var(--warn)">熱</text>
<rect x="230" y="140" width="520" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="230" y="222" width="520" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="230" y="304" width="520" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="230" y="386" width="520" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="258" y="180" font-size="19" fill="var(--ink)">機房空調</text>
<text x="258" y="262" font-size="19" fill="var(--ink)">系統機櫃</text>
<text x="258" y="344" font-size="19" fill="var(--ink)">水冷板</text>
<text x="258" y="426" font-size="19" fill="var(--ink)">晶片</text>
<rect x="560" y="166" width="160" height="12" rx="6" fill="var(--grey)" opacity="0.45"/>
<rect x="560" y="248" width="160" height="12" rx="6" fill="var(--grey)" opacity="0.45"/>
<rect x="560" y="330" width="160" height="12" rx="6" fill="var(--grey)" opacity="0.45"/>
<rect x="560" y="412" width="160" height="12" rx="6" fill="var(--grey)" opacity="0.45"/>
<rect x="560" y="166" width="62" height="12" rx="6" fill="var(--accent)"/>
<rect x="560" y="248" width="96" height="12" rx="6" fill="var(--accent)"/>
<rect x="560" y="330" width="48" height="12" rx="6" fill="var(--accent)"/>
<rect x="560" y="412" width="84" height="12" rx="6" fill="var(--accent)"/>
<path d="M230 213 H750" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 7"/>
<path d="M230 295 H750" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 7"/>
<path d="M230 377 H750" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 7"/>
<text x="768" y="218" font-size="15" fill="var(--warn)">交界</text>
<text x="768" y="300" font-size="15" fill="var(--warn)">交界</text>
<text x="768" y="382" font-size="15" fill="var(--warn)">交界</text>
<text x="768" y="172" font-size="15" fill="var(--dim)">各解一段</text>
<text x="60" y="545" font-size="22" fill="var(--ink)">四層各分一點，等於沒有人負全責。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The broken pipe on the left means the information cannot get through, while the intact pipe on the right delivers it but the reader has no matching question.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="56" font-size="27" fill="var(--ink)">Why things sleep: I guessed the wrong cause</text>

<rect x="40" y="96" width="420" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="64" y="132" font-size="20" fill="var(--dim)">My original explanation</text>
<text x="64" y="162" font-size="19" fill="var(--ink)">Supply side broke</text>

<rect x="70" y="210" width="96" height="76" rx="8" fill="var(--page)" stroke="var(--grey)"/>
<text x="96" y="255" font-size="16" fill="var(--ink)">Recipe</text>
<rect x="334" y="210" width="96" height="76" rx="8" fill="var(--page)" stroke="var(--grey)"/>
<text x="360" y="255" font-size="16" fill="var(--ink)">Reader</text>

<path d="M166 248 L236 248" stroke="var(--grey)" stroke-width="12" fill="none"/>
<path d="M264 248 L334 248" stroke="var(--grey)" stroke-width="12" fill="none"/>
<path d="M238 218 L262 278" stroke="var(--warn)" stroke-width="4"/>
<path d="M262 218 L238 278" stroke="var(--warn)" stroke-width="4"/>
<text x="206" y="326" font-size="16" fill="var(--warn)">Never arrives</text>
<text x="64" y="366" font-size="16" fill="var(--dim)">Implied: digitize it and it wakes up</text>

<rect x="500" y="96" width="420" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="524" y="132" font-size="20" fill="var(--dim)">The podcast case</text>
<text x="524" y="162" font-size="19" fill="var(--ink)">Supply never broke</text>

<rect x="530" y="210" width="96" height="76" rx="8" fill="var(--page)" stroke="var(--grey)"/>
<text x="556" y="255" font-size="16" fill="var(--ink)">Recipe</text>
<rect x="794" y="210" width="96" height="76" rx="8" fill="var(--page)" stroke="var(--grey)"/>
<text x="820" y="255" font-size="16" fill="var(--ink)">Reader</text>
<path d="M626 248 L794 248" stroke="var(--accent)" stroke-width="12" fill="none"/>
<text x="664" y="326" font-size="16" fill="var(--accent)">Always arrived</text>

<rect x="794" y="150" width="96" height="44" rx="8" fill="var(--page)" stroke="var(--line)" stroke-dasharray="6 5"/>
<text x="826" y="178" font-size="16" fill="var(--dim)">Question</text>
<text x="524" y="366" font-size="16" fill="var(--dim)">Missing box: nobody asking</text>

<text x="40" y="470" font-size="22" fill="var(--ink)">What blocked it was demand, not delivery</text>
</g>
</svg>
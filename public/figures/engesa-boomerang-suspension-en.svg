<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the same step in the terrain, the rigid hull's rear wheel lifts clear of the ground, while the hull with independent travel keeps both wheels pressed down on the surface.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Same broken ground; the difference is whether the wheels reach it</text>

<rect x="60" y="110" width="400" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="110" width="400" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="84" y="152" font-size="19" fill="var(--dim)">Rigid hull</text>
<text x="524" y="152" font-size="19" fill="var(--accent)">Boomerang</text>

<polyline points="84,350 230,350 250,400 436,400" fill="none" stroke="var(--grey)" stroke-width="4"/>
<rect x="120" y="258" width="290" height="26" rx="4" fill="none" stroke="var(--ink)" stroke-width="3"/>
<line x1="165" y1="284" x2="165" y2="312" stroke="var(--ink)" stroke-width="3"/>
<line x1="365" y1="284" x2="365" y2="312" stroke="var(--ink)" stroke-width="3"/>
<circle cx="165" cy="330" r="20" fill="none" stroke="var(--ink)" stroke-width="4"/>
<circle cx="365" cy="330" r="20" fill="none" stroke="var(--warn)" stroke-width="4"/>
<line x1="365" y1="350" x2="365" y2="400" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="382" y="382" font-size="16" fill="var(--warn)">In the air</text>
<text x="84" y="420" font-size="16" fill="var(--dim)">One wheel off, the vehicle loses traction</text>

<polyline points="524,350 670,350 690,400 876,400" fill="none" stroke="var(--grey)" stroke-width="4"/>
<rect x="560" y="258" width="290" height="26" rx="4" fill="none" stroke="var(--ink)" stroke-width="3"/>
<line x1="605" y1="284" x2="605" y2="312" stroke="var(--accent)" stroke-width="3"/>
<line x1="805" y1="284" x2="805" y2="362" stroke="var(--accent)" stroke-width="3"/>
<circle cx="605" cy="330" r="20" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="805" cy="380" r="20" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="620" y="252" font-size="16" fill="var(--accent)">Each side moves</text>
<text x="524" y="420" font-size="16" fill="var(--dim)">Both wheels down; heavy and costly but moving</text>

<text x="60" y="488" font-size="22" fill="var(--ink)">The first army contract bought exactly this height difference.</text>
</svg>
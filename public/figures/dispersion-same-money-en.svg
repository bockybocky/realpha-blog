<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The same pool of money splits into one side going up and one side going down.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">The same money picked a side</text>

<rect x="390" y="112" width="180" height="58" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="422" y="149" font-size="20" font-weight="700" fill="var(--ink)">The same money</text>

<path d="M400 170 C 320 200 280 200 250 232" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M250 232 L 242 212 M250 232 L 268 226" stroke="var(--accent)" stroke-width="4" fill="none"/>
<path d="M560 170 C 640 200 680 200 710 232" fill="none" stroke="var(--warn)" stroke-width="4"/>
<path d="M710 232 L 692 226 M710 232 L 718 212" stroke="var(--warn)" stroke-width="4" fill="none"/>

<text x="80" y="268" font-size="20" font-weight="700" fill="var(--accent)">Layers of upside</text>
<rect x="80" y="286" width="340" height="44" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="104" y="316" font-size="19" fill="var(--ink)">Hardware</text>
<rect x="80" y="340" width="340" height="44" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="104" y="370" font-size="19" fill="var(--ink)">Power</text>
<rect x="80" y="394" width="340" height="44" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="104" y="424" font-size="19" fill="var(--ink)">Optical links</text>
<rect x="80" y="448" width="340" height="44" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="104" y="478" font-size="19" fill="var(--ink)">Software</text>

<text x="540" y="268" font-size="20" font-weight="700" fill="var(--warn)">Inertia stocks</text>
<rect x="540" y="286" width="340" height="44" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="564" y="316" font-size="19" fill="var(--ink)">Pricey</text>
<rect x="540" y="340" width="340" height="44" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="564" y="370" font-size="19" fill="var(--ink)">So-so growth</text>
<rect x="540" y="394" width="340" height="44" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="564" y="424" font-size="19" fill="var(--ink)">No link</text>

<text x="60" y="534" font-size="22" font-weight="700" fill="var(--ink)">Weak prices are not broken, just on one side</text>
</svg>
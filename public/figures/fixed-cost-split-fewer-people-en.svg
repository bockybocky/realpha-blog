<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The same-length bar is divided into six sections for six people on the left and three sections for three people on the right, making each section twice as wide.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">Costs stay; leavers take the money</text>
<rect x="80" y="110" width="380" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="100" y="152" fill="var(--accent)">Split among 6</text>
<text class="b" x="110" y="180">Fixed cost 12</text>
<rect x="110" y="190" width="320" height="44" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<line x1="163" y1="190" x2="163" y2="234" stroke="var(--line)" stroke-width="2"/>
<line x1="216" y1="190" x2="216" y2="234" stroke="var(--line)" stroke-width="2"/>
<line x1="270" y1="190" x2="270" y2="234" stroke="var(--line)" stroke-width="2"/>
<line x1="323" y1="190" x2="323" y2="234" stroke="var(--line)" stroke-width="2"/>
<line x1="376" y1="190" x2="376" y2="234" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="136" y="220" text-anchor="middle">2</text>
<text class="b" x="190" y="220" text-anchor="middle">2</text>
<text class="b" x="243" y="220" text-anchor="middle">2</text>
<text class="b" x="296" y="220" text-anchor="middle">2</text>
<text class="b" x="350" y="220" text-anchor="middle">2</text>
<text class="b" x="403" y="220" text-anchor="middle">2</text>
<rect x="119" y="286" width="34" height="34" rx="5" fill="var(--accent)"/>
<rect x="173" y="286" width="34" height="34" rx="5" fill="var(--accent)"/>
<rect x="227" y="286" width="34" height="34" rx="5" fill="var(--accent)"/>
<rect x="281" y="286" width="34" height="34" rx="5" fill="var(--accent)"/>
<rect x="335" y="286" width="34" height="34" rx="5" fill="var(--accent)"/>
<rect x="389" y="286" width="34" height="34" rx="5" fill="var(--accent)"/>
<text class="g" x="270" y="380" text-anchor="middle" fill="var(--accent)">2 each</text>
<rect x="500" y="110" width="380" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="520" y="152" fill="var(--warn)">Split among 3</text>
<text class="b" x="530" y="180">Fixed cost 12</text>
<rect x="530" y="190" width="320" height="44" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<line x1="637" y1="190" x2="637" y2="234" stroke="var(--line)" stroke-width="2"/>
<line x1="743" y1="190" x2="743" y2="234" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="583" y="220" text-anchor="middle">4</text>
<text class="b" x="690" y="220" text-anchor="middle">4</text>
<text class="b" x="796" y="220" text-anchor="middle">4</text>
<rect x="539" y="286" width="34" height="34" rx="5" fill="var(--warn)"/>
<rect x="646" y="286" width="34" height="34" rx="5" fill="var(--warn)"/>
<rect x="752" y="286" width="34" height="34" rx="5" fill="var(--warn)"/>
<text class="g" x="690" y="380" text-anchor="middle" fill="var(--warn)">4 each</text>
<text class="c" x="60" y="500">Half leave; each person's share doubles</text>
</svg>
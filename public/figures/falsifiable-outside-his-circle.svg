<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="虛線圈內三個詞與圈外兩個被標示的點的包含關係">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:600}
.s{font-size:16px;fill:var(--dim)}
.i{font-size:17px;fill:var(--ink)}
.c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t h" x="480" y="58" text-anchor="middle">三年後看什麼，才知道他錯了</text>
<ellipse cx="360" cy="278" rx="250" ry="152" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 8"/>
<text class="t g" x="360" y="164" text-anchor="middle">他說了算</text>
<text class="t i" x="360" y="238" text-anchor="middle">信心</text>
<text class="t i" x="360" y="288" text-anchor="middle">願景</text>
<text class="t i" x="360" y="338" text-anchor="middle">理念</text>
<text class="t g" x="700" y="164">圈外的事</text>
<circle cx="706" cy="246" r="10" fill="var(--accent)"/>
<text class="t i" x="732" y="252">別人開始模仿</text>
<circle cx="706" cy="326" r="10" fill="var(--accent)"/>
<text class="t i" x="732" y="332">設計語言還在不在</text>
<text class="t c" x="480" y="490" text-anchor="middle">答案在他控制範圍之外</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="兩根同樣掛著價值名字的長條，左邊那根高出右邊兩倍多，中間用一段落差標出來。">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">名字一樣，今年差了二十幾個百分點</text>
<line x1="100" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="140" y="104" width="160" height="296" fill="var(--accent)"/>
<rect x="420" y="288" width="160" height="112" fill="var(--accent)" fill-opacity="0.4"/>
<text x="220" y="90" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">37%</text>
<text x="500" y="274" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">14%</text>
<text x="220" y="430" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">VLUE</text>
<text x="500" y="430" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">IVE</text>
<text x="220" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">名字裡都有 價值</text>
<text x="500" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">名字裡都有 價值</text>
<line x1="660" y1="104" x2="660" y2="288" stroke="var(--warn)" stroke-width="4"/>
<line x1="648" y1="104" x2="672" y2="104" stroke="var(--warn)" stroke-width="4"/>
<line x1="648" y1="288" x2="672" y2="288" stroke="var(--warn)" stroke-width="4"/>
<text x="690" y="190" font-size="20" font-weight="700" fill="var(--warn)">差二十幾個</text>
<text x="690" y="218" font-size="20" font-weight="700" fill="var(--warn)">百分點</text>
</svg>
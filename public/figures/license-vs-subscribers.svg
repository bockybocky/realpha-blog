<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-label="左邊一根極高的柱子標四千九百八十萬訂閱、下面只有五個點；右邊一根極矮的柱子標兩百萬訂閱、下面是密密麻麻的點陣">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
  <defs>
    <pattern id="crowdfield" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.5" fill="var(--grey)"/>
    </pattern>
  </defs>
  <text x="60" y="56" font-size="27">起跑線不是內容，是執照</text>
  <line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <rect x="160" y="110" width="180" height="330" fill="var(--accent)"/>
  <text x="250" y="96" font-size="20" text-anchor="middle" fill="var(--accent)">4,980 萬訂閱</text>
  <text x="250" y="472" font-size="19" text-anchor="middle">關東廣域執照</text>
  <circle cx="198" cy="512" r="5" fill="var(--accent)"/>
  <circle cx="224" cy="512" r="5" fill="var(--accent)"/>
  <circle cx="250" cy="512" r="5" fill="var(--accent)"/>
  <circle cx="276" cy="512" r="5" fill="var(--accent)"/>
  <circle cx="302" cy="512" r="5" fill="var(--accent)"/>
  <text x="250" y="550" font-size="15" text-anchor="middle" fill="var(--dim)">箱子裡 5 個頻道</text>
  <rect x="620" y="427" width="180" height="13" fill="var(--grey)"/>
  <text x="710" y="412" font-size="20" text-anchor="middle" fill="var(--dim)">200 萬訂閱</text>
  <text x="710" y="472" font-size="19" text-anchor="middle">自己拚出來的頻道</text>
  <rect x="620" y="494" width="180" height="50" fill="url(#crowdfield)"/>
  <text x="710" y="570" font-size="15" text-anchor="middle" fill="var(--dim)">同一個箱子 100 萬個頻道</text>
  <text x="480" y="606" font-size="22" text-anchor="middle">差距在分母，不在內容</text>
</svg>
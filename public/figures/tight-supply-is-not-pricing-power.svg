<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="四象限：橫軸為產能補不補得上，縱軸為毛利率有沒有跟上；只有右上角被強調為收租位置。">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--ink); }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="h" x="60" y="60">供應吃緊，不等於有議價權</text>
<rect x="200" y="120" width="620" height="340" fill="var(--card)"/>
<rect x="510" y="120" width="310" height="170" fill="var(--accent)" opacity="0.16"/>
<line x1="510" y1="120" x2="510" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="200" y1="290" x2="820" y2="290" stroke="var(--line)" stroke-width="2"/>
<rect x="200" y="120" width="620" height="340" fill="none" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="665" y="196" text-anchor="middle" fill="var(--accent)">收租位置</text>
<text class="b" x="665" y="224" text-anchor="middle">EUV 鏡片 · 燃氣輪機</text>
<text class="g" x="355" y="196" text-anchor="middle">短暫</text>
<text class="b" x="355" y="224" text-anchor="middle">很快被補上</text>
<text class="g" x="355" y="366" text-anchor="middle">只是很忙</text>
<text class="b" x="355" y="394" text-anchor="middle">客戶會等，不會加價</text>
<text class="g" x="665" y="366" text-anchor="middle">還沒反應</text>
<text class="b" x="665" y="394" text-anchor="middle">值得盯</text>
<text class="b" x="200" y="492">產能一兩年補得上</text>
<text class="b" x="820" y="492" text-anchor="end">補不上，也繞不開</text>
<text class="b" x="188" y="132" text-anchor="end">毛利率</text>
<text class="b" x="188" y="156" text-anchor="end">跟著上</text>
<text class="b" x="188" y="440" text-anchor="end">沒跟上</text>
<text class="c" x="60" y="552">看毛利率，不看新聞說誰缺貨</text>
</svg>
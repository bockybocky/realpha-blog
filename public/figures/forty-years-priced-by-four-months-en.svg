<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A very long reserves bar against a very thin delay sliver, yet the share-price column below shrinks sharply.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">A 40-year mine priced by 4 months</text>

<rect x="140" y="150" width="680" height="56" rx="6" fill="var(--accent)"/>
<text x="162" y="186" font-size="19" fill="var(--page)">40 years of reserves</text>
<rect x="815" y="150" width="6" height="56" fill="var(--warn)"/>
<line x1="818" y1="146" x2="862" y2="112" stroke="var(--warn)" stroke-width="2"/>
<text x="760" y="100" font-size="16" fill="var(--warn)">3~4 month delay</text>

<line x1="140" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="260" y="240" width="100" height="180" rx="4" fill="var(--grey)"/>
<rect x="450" y="315" width="100" height="105" rx="4" fill="var(--warn)"/>
<text x="310" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">Before</text>
<text x="500" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">After</text>
<text x="600" y="330" font-size="19" fill="var(--ink)">Share price</text>

<text x="60" y="505" font-size="22" fill="var(--ink)">Months late, decades marked down</text>
</svg>
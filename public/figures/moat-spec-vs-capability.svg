<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上方長條撞上世代轉換的分界線就停住，下方長條穿越分界線並延伸經過鋼鐵、汽車、晶圓三個停靠點">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl{font-size:27px;fill:var(--ink);font-weight:700}
    .grp{font-size:20px;fill:var(--ink);font-weight:600}
    .bd{font-size:16px;fill:var(--dim)}
    .wn{font-size:20px;fill:var(--warn);font-weight:600}
    .cc{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="ttl" x="60" y="62">護城河綁在哪裡</text>
<line x1="560" y1="130" x2="560" y2="420" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="wn" x="560" y="118" text-anchor="middle">世代轉換</text>

<text class="grp" x="100" y="175">綁在規格上的專利</text>
<rect x="100" y="190" width="445" height="30" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<rect x="541" y="182" width="6" height="46" fill="var(--warn)"/>
<text class="bd" x="600" y="212">歸零重來</text>

<text class="grp" x="100" y="295">綁在能力上的輸送技術</text>
<rect x="100" y="310" width="800" height="30" rx="15" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="200" cy="325" r="8" fill="var(--accent)"/>
<circle cx="430" cy="325" r="8" fill="var(--accent)"/>
<circle cx="760" cy="325" r="8" fill="var(--accent)"/>
<text class="bd" x="200" y="368" text-anchor="middle">鋼鐵 1937</text>
<text class="bd" x="430" y="368" text-anchor="middle">汽車 1959</text>
<text class="bd" x="760" y="368" text-anchor="middle">晶圓</text>

<text class="cc" x="60" y="468">規格一改就重新洗牌，能力可以搬去下一個產業。</text>
</svg>
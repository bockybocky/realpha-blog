<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A chatbot on the left bounces off three walls in the middle and never reaches the completed booking on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="80" y="56" font-size="27" font-weight="700" fill="var(--ink)">The layers no one can take</text>

  <rect x="70" y="236" width="170" height="104" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="92" y="294" font-size="19" fill="var(--ink)">Chatbot</text>

  <rect x="330" y="120" width="380" height="88" rx="8" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
  <text x="356" y="172" font-size="19" fill="var(--ink)">Owner relationships</text>
  <rect x="330" y="244" width="380" height="88" rx="8" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
  <text x="356" y="296" font-size="19" fill="var(--ink)">EU travel rules</text>
  <rect x="330" y="368" width="380" height="88" rx="8" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
  <text x="356" y="420" font-size="19" fill="var(--ink)">Hotels with no site</text>

  <rect x="800" y="236" width="140" height="104" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="822" y="294" font-size="19" fill="var(--ink)">Booking done</text>

  <path d="M 252 164 L 318 164" stroke="var(--warn)" stroke-width="4"/>
  <path d="M 276 188 L 252 176 L 276 164" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M 252 288 L 318 288" stroke="var(--warn)" stroke-width="4"/>
  <path d="M 276 312 L 252 300 L 276 288" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M 252 412 L 318 412" stroke="var(--warn)" stroke-width="4"/>
  <path d="M 276 436 L 252 424 L 276 412" fill="none" stroke="var(--warn)" stroke-width="4"/>

  <text x="730" y="152" font-size="16" fill="var(--dim)">ChatGPT shut it</text>
  <text x="730" y="276" font-size="16" fill="var(--dim)">Google tried</text>
  <text x="730" y="400" font-size="16" fill="var(--dim)">TripAdvisor tried</text>

  <text x="80" y="520" font-size="22" font-weight="700" fill="var(--ink)">The wall is not technical</text>
</svg>
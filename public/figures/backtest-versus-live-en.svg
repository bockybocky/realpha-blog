<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The left curve runs complete through the recovery; the right curve stops at today and forks into three dashed branches.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text class="t" x="60" y="66">The same decline, two ways of seeing it</text>

  <text class="g" x="60" y="118">Backtest</text>
  <text class="g" x="500" y="118">Live</text>

  <rect x="60" y="140" width="400" height="290" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="140" width="400" height="290" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <path d="M 100 200 C 140 250, 160 320, 200 355 C 250 395, 290 380, 330 340 C 360 300, 380 265, 400 248"
        fill="none" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="400" cy="248" r="7" fill="var(--accent)"/>
  <text class="b" x="400" y="228" text-anchor="middle" fill="var(--accent)">End</text>

  <rect x="722" y="158" width="160" height="254" rx="8" fill="var(--grey)" fill-opacity="0.14"/>
  <path d="M 540 200 C 580 250, 600 320, 640 355 C 670 388, 700 375, 722 352"
        fill="none" stroke="var(--ink)" stroke-width="3"/>
  <circle cx="722" cy="352" r="7" fill="var(--ink)"/>
  <path d="M 722 352 L 875 252" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M 722 352 L 875 352" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M 722 352 L 875 408" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
  <text class="b" x="802" y="192" text-anchor="middle" fill="var(--warn)">Unknown</text>

  <text class="b" x="60" y="462">End: known</text>
  <text class="b" x="500" y="462">End: unknown</text>

  <text class="c" x="480" y="518" text-anchor="middle">Backtest data has no variable called I do not know</text>
</svg>
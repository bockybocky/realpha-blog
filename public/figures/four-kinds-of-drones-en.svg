<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Four widely separated points enclosed together by one large dashed circle.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.ttl{font-size:27px;font-weight:700}
.grp{font-size:20px;font-weight:700}
.bdy{font-size:16px;fill:var(--dim)}
.cnc{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="ttl" x="60" y="62">One word</text>

<line x1="200" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="200" y1="110" x2="200" y2="470" stroke="var(--line)" stroke-width="2"/>
<text class="bdy" x="210" y="500">Nr</text>
<text class="bdy" x="866" y="500">F</text>
<text class="bdy" x="750" y="528">Rng</text>
<text class="bdy" x="130" y="124">Hi</text>
<text class="bdy" x="130" y="466">Lo</text>
<text class="bdy" x="60" y="300">Cost</text>
<text class="bdy" x="60" y="322">Size</text>

<ellipse cx="560" cy="290" rx="330" ry="185" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="12 10"/>
<text class="grp" x="268" y="150">"Drone"</text>

<circle cx="330" cy="415" r="13" fill="var(--accent)"/>
<text class="grp" x="352" y="412">Recon</text>
<circle cx="660" cy="398" r="13" fill="var(--accent)"/>
<text class="grp" x="682" y="395">OWA</text>
<circle cx="760" cy="238" r="13" fill="var(--accent)"/>
<text class="grp" x="640" y="222">Long</text>
<circle cx="500" cy="196" r="13" fill="var(--accent)"/>
<text class="grp" x="522" y="193">CCA</text>

<text class="cnc" x="60" y="556">One word, 4</text>
</svg>
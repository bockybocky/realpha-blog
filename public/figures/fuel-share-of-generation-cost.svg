<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="核電的燃料段很短，燃煤燃氣的燃料段長到接近整條">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">燃料佔發電成本多少</text>

<text x="60" y="146" font-size="20" font-weight="700" fill="var(--ink)">核電</text>
<rect x="190" y="120" width="650" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="190" y="120" width="65" height="56" fill="var(--accent)"/>
<rect x="255" y="120" width="98" height="56" fill="var(--grey)"/>
<text x="222" y="204" font-size="16" fill="var(--accent)" text-anchor="middle">鈾</text>
<text x="304" y="204" font-size="16" fill="var(--dim)" text-anchor="middle">其餘循環</text>
<text x="372" y="156" font-size="19" fill="var(--ink)">整個燃料循環約 25%</text>

<text x="60" y="286" font-size="20" font-weight="700" fill="var(--ink)">燃煤</text>
<rect x="190" y="260" width="650" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="190" y="260" width="553" height="56" fill="var(--warn)"/>
<text x="466" y="296" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">燃料 80 至 90%</text>

<text x="60" y="376" font-size="20" font-weight="700" fill="var(--ink)">燃氣</text>
<rect x="190" y="350" width="650" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="190" y="350" width="553" height="56" fill="var(--warn)"/>
<text x="466" y="386" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">燃料 80 至 90%</text>

<text x="60" y="462" font-size="19" fill="var(--dim)">買貴了不會被開除，買斷了會</text>
<text x="60" y="496" font-size="22" font-weight="700" fill="var(--ink)">價格判斷不在這份工作的計分板上</text>
</svg>
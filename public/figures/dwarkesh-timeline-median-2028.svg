<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸上 2028 與 2029 是兩個高標記，2027 被劃掉，明年只有一根四分之一高的短柱">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .k { font-size:22px; font-weight:700; fill:var(--accent); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70">他押的時間</text>
  <text class="b" x="60" y="102">中位數，不是宣告</text>

  <rect x="60" y="150" width="840" height="220" rx="14" fill="var(--card)"/>

  <line x1="100" y1="330" x2="880" y2="330" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="100" y="360">2026</text>
  <text class="b" x="300" y="360">2027</text>
  <text class="b" x="520" y="360">2028</text>
  <text class="b" x="700" y="360">2029</text>
  <text class="b" x="855" y="360">2030</text>

  <rect x="130" y="275" width="34" height="55" rx="4" fill="var(--accent)" opacity="0.45"/>
  <text class="g" x="120" y="258" fill="var(--accent)">25%</text>
  <text class="b" x="100" y="232">明年就到</text>

  <line x1="285" y1="300" x2="335" y2="250" stroke="var(--warn)" stroke-width="3"/>
  <line x1="335" y1="300" x2="285" y2="250" stroke="var(--warn)" stroke-width="3"/>
  <text class="b" x="268" y="232" fill="var(--warn)">他不主張</text>

  <rect x="520" y="190" width="34" height="140" rx="4" fill="var(--accent)"/>
  <text class="g" x="470" y="178">研究員全面自動化</text>

  <rect x="700" y="190" width="34" height="140" rx="4" fill="var(--accent)"/>
  <text class="g" x="690" y="178">超級智慧</text>

  <text class="k" x="60" y="440">時間點是分布，不是日期</text>
  <text class="b" x="60" y="472">同一組判斷，往前推一年機率就掉到四分之一</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上下兩條付款流程對比，上面中間有寬的浮存與手續費區塊，下面中間變成空的虛線框並打叉，底下升起存續期與流動性兩塊方塊撐住空缺">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<defs>
<marker id="a1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/></marker>
<marker id="a1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56">拿掉兩層摩擦，換來兩個要求</text>

<text class="b" x="80" y="112">以前</text>
<rect x="80" y="124" width="110" height="54" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="135" y="158" text-anchor="middle">付款</text>
<line x1="196" y1="151" x2="352" y2="151" stroke="var(--grey)" stroke-width="2" marker-end="url(#a1a)"/>
<rect x="360" y="124" width="200" height="54" rx="10" fill="var(--grey)" fill-opacity="0.3" stroke="var(--line)"/>
<text class="g" x="460" y="158" text-anchor="middle">浮存 · 手續費</text>
<line x1="566" y1="151" x2="722" y2="151" stroke="var(--grey)" stroke-width="2" marker-end="url(#a1a)"/>
<rect x="730" y="124" width="110" height="54" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="785" y="158" text-anchor="middle">收款</text>
<text class="b" x="460" y="200" text-anchor="middle">兩天</text>

<text class="b" x="80" y="248">現在</text>
<rect x="80" y="260" width="110" height="54" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="135" y="294" text-anchor="middle">付款</text>
<line x1="196" y1="287" x2="352" y2="287" stroke="var(--accent)" stroke-width="2" marker-end="url(#a1b)"/>
<rect x="360" y="260" width="200" height="54" rx="10" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="425" y1="272" x2="495" y2="302" stroke="var(--warn)" stroke-width="2"/>
<line x1="495" y1="272" x2="425" y2="302" stroke="var(--warn)" stroke-width="2"/>
<line x1="566" y1="287" x2="722" y2="287" stroke="var(--accent)" stroke-width="2" marker-end="url(#a1b)"/>
<rect x="730" y="260" width="110" height="54" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="785" y="294" text-anchor="middle">收款</text>
<text class="b" x="460" y="336" text-anchor="middle">0 秒</text>

<rect x="300" y="392" width="150" height="56" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="375" y="427" text-anchor="middle">存續期</text>
<rect x="470" y="392" width="150" height="56" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="545" y="427" text-anchor="middle">流動性</text>
<line x1="375" y1="388" x2="375" y2="330" stroke="var(--accent)" stroke-width="2" marker-end="url(#a1b)"/>
<line x1="545" y1="388" x2="545" y2="330" stroke="var(--accent)" stroke-width="2" marker-end="url(#a1b)"/>
<text class="b" x="650" y="427">事先備好</text>

<text class="c" x="60" y="494">緩衝消失，存量就得先站上來</text>
</svg>
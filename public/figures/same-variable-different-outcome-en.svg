<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two years with very different outcome bars at the same rate level, with an arrow pointing to the real difference">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
  <marker id="a8" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto">
    <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--warn)"/>
  </marker>
</defs>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Same variable, different outcome</text>

<rect x="70" y="110" width="450" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="295" y="150" font-size="19" fill="var(--dim)" text-anchor="middle">Same rates</text>
<line x1="295" y1="166" x2="295" y2="400" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>

<rect x="150" y="196" width="120" height="204" rx="8" fill="var(--accent)"/>
<text x="210" y="180" font-size="19" fill="var(--ink)" text-anchor="middle">2004, 2005</text>
<text x="210" y="428" font-size="16" fill="var(--dim)" text-anchor="middle">Built a lot</text>

<rect x="320" y="348" width="120" height="52" rx="8" fill="var(--grey)"/>
<text x="380" y="332" font-size="19" fill="var(--ink)" text-anchor="middle">Now</text>
<text x="380" y="428" font-size="16" fill="var(--dim)" text-anchor="middle">Doesn't pencil</text>
<line x1="70" y1="400" x2="520" y2="400" stroke="var(--line)" stroke-width="2"/>

<path d="M540 275 L 610 275" stroke="var(--warn)" stroke-width="3" marker-end="url(#a8)"/>
<text x="640" y="160" font-size="20" font-weight="700" fill="var(--warn)">The difference is elsewhere</text>
<rect x="640" y="186" width="250" height="48" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text x="765" y="216" font-size="16" fill="var(--ink)" text-anchor="middle">Construction costs up</text>
<rect x="640" y="250" width="250" height="48" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text x="765" y="280" font-size="16" fill="var(--ink)" text-anchor="middle">Labor up</text>
<rect x="640" y="314" width="250" height="48" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text x="765" y="344" font-size="16" fill="var(--ink)" text-anchor="middle">More equity required</text>
<rect x="640" y="378" width="250" height="48" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="765" y="408" font-size="16" fill="var(--ink)" text-anchor="middle">Someone else wants the same resources</text>

<text x="480" y="510" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Rule out the smoothest explanation first</text>
</svg>
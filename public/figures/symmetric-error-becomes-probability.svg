<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊讀數對稱散落在真值線兩側，右邊疊成中央對齊真值的鐘形">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .ti{font-size:27px;font-weight:700}
    .g{font-size:20px;font-weight:700}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t ti" x="60" y="56">不精準不要緊，偏得對稱就能用</text>
<line x1="230" y1="110" x2="230" y2="430" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text class="t b" x="190" y="458">真值</text>
<circle cx="150" cy="150" r="9" fill="var(--accent)" opacity="0.8"/>
<circle cx="300" cy="172" r="9" fill="var(--accent)" opacity="0.8"/>
<circle cx="120" cy="206" r="9" fill="var(--accent)" opacity="0.8"/>
<circle cx="268" cy="230" r="9" fill="var(--accent)" opacity="0.8"/>
<circle cx="176" cy="262" r="9" fill="var(--accent)" opacity="0.8"/>
<circle cx="330" cy="290" r="9" fill="var(--accent)" opacity="0.8"/>
<circle cx="138" cy="318" r="9" fill="var(--accent)" opacity="0.8"/>
<circle cx="292" cy="348" r="9" fill="var(--accent)" opacity="0.8"/>
<circle cx="194" cy="382" r="9" fill="var(--accent)" opacity="0.8"/>
<circle cx="258" cy="408" r="9" fill="var(--accent)" opacity="0.8"/>
<text class="t g" x="70" y="100">各州民調讀數</text>
<text class="t b" x="70" y="488">兩邊都偏，數量相當</text>
<path d="M430 270 L540 270" stroke="var(--dim)" stroke-width="3" marker-end="url(#a3)"/>
<text class="t g" x="432" y="252" fill="var(--dim)">疊起來</text>
<defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker></defs>
<line x1="600" y1="430" x2="900" y2="430" stroke="var(--grey)" stroke-width="2"/>
<path d="M600 430 C 680 430, 700 160, 750 160 C 800 160, 820 430, 900 430 Z" fill="var(--accent)" opacity="0.28"/>
<path d="M600 430 C 680 430, 700 160, 750 160 C 800 160, 820 430, 900 430" fill="none" stroke="var(--accent)" stroke-width="3"/>
<line x1="750" y1="150" x2="750" y2="430" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text class="t g" x="690" y="130">機率</text>
<text class="t b" x="650" y="462">中央回到真值</text>
<text class="t c" x="60" y="524">對稱的誤差加總以後互相抵掉</text>
</svg>
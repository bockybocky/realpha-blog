<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Side by side: a dial gauge on one side, a tank with inflow and outflow pipes on the other, where the water level itself is the measure of policy success or failure.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.lb{font-size:19px;fill:var(--dim)}.sm{font-size:15px;fill:var(--dim)}.t{font-size:27px}.c{font-size:22px}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">Failure shows up on different gauges</text>
<rect x="60" y="92" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="92" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="lb" x="88" y="128">Inflation targeting</text>
<text class="lb" x="528" y="128">The Bahamas</text>
<path d="M150 320 A110 110 0 0 1 370 320" fill="none" stroke="var(--grey)" stroke-width="12" stroke-linecap="round"/>
<line x1="260" y1="320" x2="330" y2="232" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/>
<circle cx="260" cy="320" r="9" fill="var(--accent)"/>
<text class="lb" x="236" y="362">CPI</text>
<rect x="585" y="250" width="230" height="110" rx="8" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="588" y="300" width="224" height="57" rx="6" fill="var(--accent)" opacity="0.35"/>
<line x1="640" y1="170" x2="640" y2="244" stroke="var(--accent)" stroke-width="4"/>
<polygon points="640,250 633,236 647,236" fill="var(--accent)"/>
<line x1="760" y1="170" x2="760" y2="244" stroke="var(--accent)" stroke-width="4"/>
<polygon points="760,250 753,236 767,236" fill="var(--accent)"/>
<text class="sm" x="596" y="162">Tourism</text>
<text class="sm" x="716" y="162">Finance</text>
<line x1="640" y1="366" x2="640" y2="402" stroke="var(--warn)" stroke-width="4"/>
<polygon points="640,408 633,394 647,394" fill="var(--warn)"/>
<line x1="760" y1="366" x2="760" y2="402" stroke="var(--warn)" stroke-width="4"/>
<polygon points="760,408 753,394 767,394" fill="var(--warn)"/>
<text class="sm" x="588" y="428">Spending</text>
<text class="sm" x="712" y="428">Credit</text>
<text class="lb" x="830" y="334">Level</text>
<text class="c" x="60" y="492">Left fails as prices, right fails as a falling level</text>
</svg>
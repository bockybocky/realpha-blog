<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="折線在前兩點維持高位，第三點陡降到底">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="72">它斷掉的第幾天，你沒有答案</text>
<line x1="120" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<polyline points="200,170 480,210 790,380" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="200" cy="170" r="9" fill="var(--accent)"/>
<circle cx="480" cy="210" r="9" fill="var(--accent)"/>
<circle cx="790" cy="380" r="11" fill="var(--warn)"/>
<text class="g" x="160" y="140">第 1 天</text>
<text class="b" x="160" y="440">手機熱點</text>
<text class="g" x="440" y="180">第 3 天</text>
<text class="b" x="440" y="440">還撐得住</text>
<text class="g" x="740" y="350">第 7 天</text>
<text class="b" x="730" y="440">沒有答案</text>
<text class="c" x="60" y="490">寫到你答不出來的那一天為止</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A downward-bending curve forks to both sides, and the triangles beside the same items on the left and right cards point in opposite directions.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">Same downward curve, two diagnoses</text>
<path d="M392,96 Q482,104 560,168" fill="none" stroke="var(--ink)" stroke-width="4"/>
<line x1="470" y1="176" x2="300" y2="222" stroke="var(--grey)" stroke-width="3"/>
<polygon points="296,210 286,228 310,230" fill="var(--grey)"/>
<line x1="490" y1="176" x2="660" y2="222" stroke="var(--grey)" stroke-width="3"/>
<polygon points="664,210 674,228 650,230" fill="var(--grey)"/>
<rect x="70" y="242" width="390" height="250" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="242" width="390" height="250" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="265" y="284" text-anchor="middle" font-size="20" fill="var(--ink)">Can't supply it</text>
<text x="695" y="284" text-anchor="middle" font-size="20" fill="var(--ink)">Fewer want it</text>
<text x="110" y="338" font-size="16" fill="var(--dim)">Spot purchases</text>
<polygon points="390,340 410,340 400,322" fill="var(--accent)"/>
<text x="110" y="386" font-size="16" fill="var(--dim)">Contract coverage</text>
<polygon points="390,370 410,370 400,388" fill="var(--accent)"/>
<text x="110" y="434" font-size="16" fill="var(--dim)">Outages, rate limits, delayed signups</text>
<text x="540" y="338" font-size="16" fill="var(--dim)">Buying turns cautious</text>
<polygon points="810,340 830,340 820,322" fill="var(--warn)"/>
<text x="540" y="386" font-size="16" fill="var(--dim)">Contract share</text>
<polygon points="810,362 830,362 820,380" fill="var(--warn)"/>
<text x="540" y="434" font-size="16" fill="var(--dim)">Inventory builds</text>
<text x="480" y="546" text-anchor="middle" font-size="22" fill="var(--ink)">The difference isn't in the curve, it's in the pages beside it</text>
</svg>
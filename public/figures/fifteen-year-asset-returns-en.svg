<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Fifteen-year return bars run from longest to shortest, with the bottom one crossing to the left of the zero line." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">Same 15 years, far wider gaps between assets</text>
<line x1="330" y1="100" x2="330" y2="520" stroke="var(--line)" stroke-width="2"/>
<text x="330" y="548" font-size="15" fill="var(--dim)" text-anchor="middle">0%</text>

<text x="315" y="142" font-size="16" fill="var(--ink)" text-anchor="end">Nasdaq</text>
<rect x="330" y="120" width="520" height="30" fill="var(--accent)"/>
<text x="862" y="142" font-size="16" fill="var(--accent)">1,005%</text>

<text x="315" y="184" font-size="16" fill="var(--ink)" text-anchor="end">S&amp;P 500</text>
<rect x="330" y="162" width="297" height="30" fill="var(--accent)"/>
<text x="639" y="184" font-size="16" fill="var(--dim)">573%</text>

<text x="315" y="226" font-size="16" fill="var(--ink)" text-anchor="end">Dow</text>
<rect x="330" y="204" width="186" height="30" fill="var(--accent)"/>
<text x="528" y="226" font-size="16" fill="var(--dim)">360%</text>

<text x="315" y="268" font-size="16" fill="var(--ink)" text-anchor="end">Russell 2000</text>
<rect x="330" y="246" width="170" height="30" fill="var(--grey)"/>
<text x="512" y="268" font-size="16" fill="var(--dim)">329%</text>

<text x="315" y="310" font-size="16" fill="var(--ink)" text-anchor="end">Gold</text>
<rect x="330" y="288" width="80" height="30" fill="var(--grey)"/>
<text x="422" y="310" font-size="16" fill="var(--dim)">154%</text>

<text x="315" y="352" font-size="16" fill="var(--ink)" text-anchor="end">Silver</text>
<rect x="330" y="330" width="47" height="30" fill="var(--grey)"/>
<text x="389" y="352" font-size="16" fill="var(--dim)">90%</text>

<text x="315" y="394" font-size="16" fill="var(--ink)" text-anchor="end">Crude oil</text>
<rect x="330" y="372" width="4" height="30" fill="var(--grey)"/>
<text x="346" y="394" font-size="16" fill="var(--dim)">8%</text>

<text x="315" y="436" font-size="16" fill="var(--ink)" text-anchor="end">Natural gas</text>
<rect x="327" y="414" width="3" height="30" fill="var(--warn)"/>
<text x="346" y="436" font-size="16" fill="var(--warn)">-6%</text>

<text x="60" y="588" font-size="22" fill="var(--ink)">Same span of time; where you sat decided everything</text>
</svg>
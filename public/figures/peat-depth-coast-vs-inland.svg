<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一條極薄的扁條對比右邊一塊高二十公尺的厚方塊，同一刻度下高度差約二十倍">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">泥炭層厚度：沿海與內陸</text>
<line x1="150" y1="120" x2="900" y2="120" stroke="var(--line)" stroke-dasharray="5 6"/>
<line x1="150" y1="310" x2="900" y2="310" stroke="var(--line)" stroke-dasharray="5 6"/>
<text x="40" y="126" font-size="16" fill="var(--dim)">20 m</text>
<text x="40" y="316" font-size="16" fill="var(--dim)">10 m</text>
<text x="40" y="496" font-size="16" fill="var(--dim)">0 m</text>
<rect x="180" y="481" width="260" height="19" fill="var(--accent)"/>
<text x="180" y="462" font-size="19" fill="var(--ink)">沿海泥炭 ＜1 公尺</text>
<text x="180" y="438" font-size="16" fill="var(--dim)">海水帶養分・種得起來</text>
<rect x="600" y="120" width="260" height="380" fill="var(--accent)"/>
<text x="600" y="104" font-size="19" fill="var(--ink)">內陸泥炭丘 17–20 公尺</text>
<text x="622" y="300" font-size="16" fill="var(--page)">酸・長期泡水</text>
<text x="622" y="326" font-size="16" fill="var(--page)">缺銅・缺鎂・缺鉀</text>
<line x1="150" y1="500" x2="900" y2="500" stroke="var(--ink)" stroke-width="2"/>
<text x="150" y="528" font-size="16" fill="var(--dim)">石英砂・花崗岩</text>
<text x="180" y="300" font-size="22" fill="var(--ink)">只有名詞相同</text>
</svg>
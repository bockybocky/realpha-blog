<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條長橫條被切成極長的左段與短短的右段，右段之後是水波，通用方法佔絕大部分，最後一小段才決定喝不喝水">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink)}
.g{font-size:19px;fill:var(--ink)}
.b{font-size:16px;fill:var(--dim)}
.s{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
</defs>
<text class="h" x="80" y="70">牽到河邊的路，跟低頭那一下</text>
<text class="g" x="80" y="168">通用的八成</text>
<text class="g" x="664" y="168" fill="var(--accent)">組織 DNA</text>
<rect x="80" y="190" width="568" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="664" y="190" width="136" height="64" rx="8" fill="var(--accent)"/>
<text class="s" x="118" y="228">組織圖</text>
<text class="s" x="248" y="228">新部門</text>
<text class="s" x="378" y="228">願景</text>
<text class="s" x="508" y="228">顧問</text>
<text x="732" y="228" font-size="15" fill="var(--page)" text-anchor="middle">內部人才懂</text>
<path d="M806 226 L826 244" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<text class="s" x="864" y="186" text-anchor="middle">水</text>
<path d="M830 212 q 12 -10 24 0 t 24 0 t 24 0" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M830 236 q 12 -10 24 0 t 24 0 t 24 0" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M830 260 q 12 -10 24 0 t 24 0 t 24 0" stroke="var(--accent)" stroke-width="3" fill="none"/>
<line x1="80" y1="366" x2="880" y2="366" stroke="var(--line)"/>
<text class="c" x="80" y="424">難的不是牽到河邊，是最後那一小段。</text>
</svg>
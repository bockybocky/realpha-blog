<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一個巨大方塊與右下角一個很小的方塊並列，體積落差極大">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .h1{font-size:27px;font-weight:700;fill:var(--ink);}
    .cap{font-size:20px;font-weight:700;fill:var(--dim);}
    .capA{font-size:20px;font-weight:700;fill:var(--accent);}
    .unit{font-size:16px;fill:var(--dim);}
    .kick{font-size:22px;font-weight:700;fill:var(--ink);}
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <g class="t">
    <text x="480" y="48" class="h1" text-anchor="middle">造出來的能力，和真正要用的量</text>
    <rect x="90" y="110" width="360" height="360" rx="6" fill="var(--accent)"/>
    <text x="270" y="500" class="capA" text-anchor="middle">造出來的能力</text>
    <line x1="470" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="1.5"/>
    <rect x="640" y="404" width="110" height="66" rx="4" fill="var(--grey)"/>
    <text x="695" y="500" class="cap" text-anchor="middle">多數人要的</text>
    <text x="695" y="530" class="unit" text-anchor="middle">信封貼幾張郵票</text>
    <text x="130" y="276" class="kick" style="fill:var(--page)">錢花在這一塊</text>
    <text x="130" y="314" class="unit" style="fill:var(--page)">最快、最強、最好的那一台</text>
    <text x="695" y="370" class="unit" text-anchor="middle">買一夸脫牛奶</text>
    <text x="695" y="394" class="unit" text-anchor="middle">不必開賓士</text>
  </g>
</svg>
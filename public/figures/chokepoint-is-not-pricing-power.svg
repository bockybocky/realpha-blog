<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩個瓶頸窄口一樣，左邊出口寬為淨利，右邊出口極細只剩新聞">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="56" y="66">一樣卡住，出口不一樣</text>
<text class="b" x="56" y="100">上方進料寬度相同</text>
<polygon points="90,140 410,140 290,290 210,290" fill="var(--grey)" opacity="0.45"/>
<polygon points="210,290 290,290 410,440 90,440" fill="var(--accent)"/>
<text class="g" x="90" y="130">需求</text>
<text class="g" x="190" y="480" fill="var(--accent)">淨利</text>
<text class="b" x="90" y="510">溢價、稀缺、能供的人少</text>
<polygon points="550,140 870,140 726,290 694,290" fill="var(--grey)" opacity="0.45"/>
<polygon points="694,290 726,290 736,440 684,440" fill="var(--warn)"/>
<text class="g" x="550" y="130">需求</text>
<text class="g" x="672" y="480" fill="var(--warn)">新聞</text>
<text class="b" x="550" y="510">成長被整體規模稀釋</text>
<text class="c" x="56" y="548">最後看的是淨利</text>
</svg>
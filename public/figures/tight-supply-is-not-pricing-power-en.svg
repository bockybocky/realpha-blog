<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Four quadrants: whether capacity can be rebuilt across, whether gross margin followed down; only the top right is highlighted as where the rent sits.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--ink); }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="h" x="60" y="60">Tight supply isn't pricing power</text>
<rect x="200" y="120" width="620" height="340" fill="var(--card)"/>
<rect x="510" y="120" width="310" height="170" fill="var(--accent)" opacity="0.16"/>
<line x1="510" y1="120" x2="510" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="200" y1="290" x2="820" y2="290" stroke="var(--line)" stroke-width="2"/>
<rect x="200" y="120" width="620" height="340" fill="none" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="665" y="196" text-anchor="middle" fill="var(--accent)">Rent seat</text>
<text class="b" x="665" y="224" text-anchor="middle">EUV optics · gas turbines</text>
<text class="g" x="355" y="196" text-anchor="middle">Brief</text>
<text class="b" x="355" y="224" text-anchor="middle">Filled fast</text>
<text class="g" x="355" y="366" text-anchor="middle">Just busy</text>
<text class="b" x="355" y="394" text-anchor="middle">Buyers wait, not bid</text>
<text class="g" x="665" y="366" text-anchor="middle">No reaction</text>
<text class="b" x="665" y="394" text-anchor="middle">Watch it</text>
<text class="b" x="200" y="492">Rebuilt in 1–2 yrs</text>
<text class="b" x="820" y="492" text-anchor="end">No rebuild, no bypass</text>
<text class="b" x="188" y="132" text-anchor="end">Margin</text>
<text class="b" x="188" y="156" text-anchor="end">Rose</text>
<text class="b" x="188" y="440" text-anchor="end">Flat</text>
<text class="c" x="60" y="552">Watch margin, not the headlines</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A two-column table with the left marker high and the right marker low, and a diagonal line showing that the two are offset.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">One sheet, two cells filled with different people</text>

  <rect x="120" y="108" width="720" height="312" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <line x1="480" y1="108" x2="480" y2="420" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="300" y="152" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Who decides</text>
  <text class="t" x="660" y="152" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Who bears the failure</text>
  <line x1="120" y1="176" x2="840" y2="176" stroke="var(--line)" stroke-width="2"/>

  <circle cx="300" cy="228" r="22" fill="var(--accent)"/>
  <text class="t" x="300" y="284" font-size="16" fill="var(--dim)" text-anchor="middle">Here</text>

  <circle cx="660" cy="356" r="22" fill="var(--warn)"/>
  <text class="t" x="660" y="320" font-size="16" fill="var(--dim)" text-anchor="middle">Here</text>

  <line x1="322" y1="240" x2="638" y2="344" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
  <text class="t" x="480" y="276" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Offset</text>

  <text class="t" x="120" y="478" font-size="22" font-weight="700" fill="var(--ink)">An offset setup, unfixed year after year</text>
</svg>
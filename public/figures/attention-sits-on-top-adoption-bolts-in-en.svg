<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="In the upper half three blocks sit crookedly on a thin plate, unfastened; in the lower half three blocks are each bolted into a thick base by two bolts.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">On top vs bolted in</text>

<text x="60" y="118" font-size="20" font-weight="700" fill="var(--dim)">Buzz</text>
<g fill="var(--grey)">
<rect x="200" y="134" width="120" height="48" rx="5" transform="rotate(-4 260 158)"/>
<rect x="420" y="130" width="120" height="48" rx="5" transform="rotate(5 480 154)"/>
<rect x="640" y="136" width="120" height="48" rx="5" transform="rotate(-7 700 160)"/>
</g>
<rect x="100" y="186" width="760" height="14" rx="3" fill="var(--line)"/>
<text x="100" y="228" font-size="16" fill="var(--dim)">Rank 1: easy on, easy off</text>

<text x="60" y="300" font-size="20" font-weight="700" fill="var(--ink)">Lock-in</text>
<g fill="var(--accent)">
<rect x="180" y="300" width="150" height="62" rx="6"/>
<rect x="405" y="300" width="150" height="62" rx="6"/>
<rect x="630" y="300" width="150" height="62" rx="6"/>
</g>
<rect x="100" y="382" width="760" height="120" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g stroke="var(--accent)" stroke-width="5" fill="none">
<path d="M215 350 L215 470"/><path d="M295 350 L295 470"/>
<path d="M440 350 L440 470"/><path d="M520 350 L520 470"/>
<path d="M665 350 L665 470"/><path d="M745 350 L745 470"/>
</g>
<g fill="var(--accent)">
<circle cx="215" cy="476" r="9"/><circle cx="295" cy="476" r="9"/>
<circle cx="440" cy="476" r="9"/><circle cx="520" cy="476" r="9"/>
<circle cx="665" cy="476" r="9"/><circle cx="745" cy="476" r="9"/>
</g>
<text x="100" y="534" font-size="22" font-weight="700" fill="var(--ink)">Built on it; removal moves the base</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Runners ahead on the track fall within the bright visible area, while the same number behind fall within the gray invisible area.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="72">View</text>
  <rect x="430" y="170" width="470" height="230" rx="14" fill="var(--card)"/>
  <rect x="60" y="170" width="340" height="230" rx="14" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 7"/>
  <text class="g" x="455" y="205" fill="var(--accent)">Visible</text>
  <text class="g" x="85" y="205" fill="var(--grey)">Invisible</text>
  <line x1="60" y1="330" x2="900" y2="330" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="90" cy="330" r="10" fill="var(--grey)"/>
  <circle cx="170" cy="330" r="10" fill="var(--grey)"/>
  <circle cx="250" cy="330" r="10" fill="var(--grey)"/>
  <circle cx="330" cy="330" r="10" fill="var(--grey)"/>
  <circle cx="420" cy="330" r="17" fill="var(--ink)"/>
  <text class="g" x="405" y="382">You</text>
  <circle cx="520" cy="330" r="10" fill="var(--accent)"/>
  <circle cx="610" cy="330" r="10" fill="var(--accent)"/>
  <circle cx="700" cy="330" r="10" fill="var(--accent)"/>
  <circle cx="790" cy="330" r="10" fill="var(--accent)"/>
  <text class="b" x="520" y="295">Faster than you</text>
  <text class="b" x="150" y="295">Slower than you</text>
  <text class="b" x="520" y="430">4</text>
  <text class="b" x="150" y="430">4</text>
  <text class="c" x="60" y="500">Built-in sample bias</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Demand shifting right raises price and quantity together; supply shifting left raises price while quantity falls.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .h{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:700;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="h" x="60" y="56">Two reasons rates rise</text>

  <rect x="60" y="104" width="400" height="352" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="80" y="140">Demand returns</text>
  <path d="M120 160 V410 H430" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="88" y="172">Price</text>
  <text class="b" x="436" y="416">Q</text>
  <path d="M130 400 L390 170" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M130 180 L390 400" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M220 180 L400 332" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <path d="M280 300 H348" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="348,293 348,307 361,300" fill="var(--accent)"/>
  <path d="M120 249 H301 M301 249 V410" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>
  <circle cx="257" cy="287" r="5" fill="var(--grey)"/>
  <circle cx="301" cy="249" r="7" fill="var(--accent)"/>
  <text class="b" x="126" y="240" fill="var(--accent)">Price up</text>
  <text class="b" x="301" y="434" text-anchor="middle" fill="var(--accent)">Volume up</text>
  <text class="b" x="396" y="168">Supply</text>
  <text class="b" x="396" y="404">Dem</text>

  <rect x="500" y="104" width="400" height="352" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="520" y="140">Supply cut</text>
  <path d="M560 160 V410 H870" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="528" y="172">Price</text>
  <text class="b" x="876" y="416">Q</text>
  <path d="M570 400 L830 170" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M570 180 L830 400" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M570 320 L751 160" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M676 300 H612" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="612,293 612,307 599,300" fill="var(--warn)"/>
  <path d="M560 248 H651 M651 248 V410" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>
  <circle cx="697" cy="287" r="5" fill="var(--grey)"/>
  <circle cx="651" cy="248" r="7" fill="var(--warn)"/>
  <text class="b" x="566" y="240" fill="var(--warn)">Price up</text>
  <text class="b" x="651" y="434" text-anchor="middle" fill="var(--warn)">Volume down</text>
  <text class="b" x="836" y="168">Supply</text>
  <text class="b" x="836" y="404">Dem</text>

  <text class="c" x="480" y="512" text-anchor="middle">Both go up; volume goes opposite ways</text>
</svg>
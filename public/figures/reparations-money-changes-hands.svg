<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上方長條顯示賠款佔德國經濟五分之一，下方三個等高方塊顯示同一筆錢從公債換成現金再換成股票">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">一筆賠款，兩年內換了三次身份</text>

  <text x="60" y="112" font-size="20" fill="var(--dim)">德國經濟</text>
  <rect x="60" y="128" width="840" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="60" y="128" width="168" height="56" fill="var(--accent)"/>
  <text x="60" y="212" font-size="16" fill="var(--accent)">賠款 10 億</text>
  <text x="176" y="212" font-size="16" fill="var(--dim)">≈ 20% GDP・兩年注入</text>

  <rect x="120" y="300" width="180" height="120" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="210" y="368" font-size="20" fill="var(--dim)" text-anchor="middle">公債</text>
  <text x="210" y="452" font-size="16" fill="var(--grey)" text-anchor="middle">各邦政府贖回</text>

  <rect x="390" y="300" width="180" height="120" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="480" y="368" font-size="20" fill="var(--accent)" text-anchor="middle">現金</text>
  <text x="480" y="452" font-size="16" fill="var(--grey)" text-anchor="middle">儲蓄者手上</text>

  <rect x="660" y="300" width="180" height="120" fill="var(--accent)"/>
  <text x="750" y="368" font-size="20" fill="var(--page)" text-anchor="middle">股市</text>
  <text x="750" y="452" font-size="16" fill="var(--grey)" text-anchor="middle">這輩子第一次</text>

  <line x1="310" y1="360" x2="372" y2="360" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="382,360 364,351 364,369" fill="var(--dim)"/>
  <line x1="580" y1="360" x2="642" y2="360" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="652,360 634,351 634,369" fill="var(--dim)"/>

  <text x="480" y="512" font-size="22" fill="var(--ink)" text-anchor="middle">錢沒有變多，只是被換到最沒經驗的地方</text>
</svg>
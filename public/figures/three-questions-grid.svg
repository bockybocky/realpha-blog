<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三題對三案例的格狀表，一片通過的是威尼斯與荷蘭，西班牙在債主住不住在城裡那格不過，今天的美國公債在同一格是問號">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">三題，逐格對答案</text>

  <text class="t" x="330" y="128" font-size="19" font-weight="700" text-anchor="middle" fill="var(--dim)">威尼斯．荷蘭</text>
  <text class="t" x="560" y="128" font-size="19" font-weight="700" text-anchor="middle" fill="var(--dim)">西班牙</text>
  <text class="t" x="790" y="128" font-size="19" font-weight="700" text-anchor="middle" fill="var(--dim)">今天的美國公債</text>

  <text class="t" x="250" y="196" font-size="19" text-anchor="end" fill="var(--ink)">債主是誰</text>
  <text class="t" x="250" y="306" font-size="19" text-anchor="end" fill="var(--ink)">價格連續而公開</text>
  <text class="t" x="250" y="416" font-size="19" text-anchor="end" fill="var(--ink)">債主住在城裡</text>

  <rect x="270" y="155" width="120" height="70" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="155" width="120" height="70" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="730" y="155" width="120" height="70" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="270" y="265" width="120" height="70" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="265" width="120" height="70" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="730" y="265" width="120" height="70" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="270" y="375" width="120" height="70" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="375" width="120" height="70" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
  <rect x="730" y="375" width="120" height="70" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>

  <path d="M312 192 l 12 14 l 26 -30" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M542 192 l 12 14 l 26 -30" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M772 192 l 12 14 l 26 -30" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M312 302 l 12 14 l 26 -30" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M542 302 l 12 14 l 26 -30" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M772 302 l 12 14 l 26 -30" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M312 412 l 12 14 l 26 -30" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M543 398 l 34 24 M577 398 l -34 24" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>
  <text class="t" x="790" y="424" font-size="30" font-weight="700" text-anchor="middle" fill="var(--warn)">？</text>

  <text class="t" x="60" y="510" font-size="22" font-weight="700" fill="var(--ink)">會變的是最後那一格</text>
</svg>
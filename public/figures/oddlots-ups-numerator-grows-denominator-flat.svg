<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="分數線上方的柱子變高，下方的柱子高度不變">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="48" y="62">分子長大，分母沒攤開</text>

<rect x="300" y="200" width="110" height="72" fill="var(--accent)"/>
<rect x="470" y="110" width="110" height="162" fill="var(--accent)"/>
<text class="g" x="140" y="196">營收</text>
<text class="b" x="320" y="186">之前</text>
<text class="b" x="490" y="96">之後</text>
<polyline points="420,180 456,130" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polygon points="448,120 472,118 466,142" fill="var(--accent)"/>

<line x1="140" y1="296" x2="820" y2="296" stroke="var(--ink)" stroke-width="6"/>

<rect x="300" y="320" width="110" height="72" fill="var(--grey)"/>
<rect x="470" y="320" width="110" height="72" fill="var(--grey)"/>
<text class="g" x="140" y="368">一趟幾件</text>
<text class="g" x="140" y="398">一天幾停點</text>
<line x1="420" y1="356" x2="456" y2="356" stroke="var(--grey)" stroke-width="4"/>
<text class="b" x="612" y="368">沒動</text>

<text class="c" x="48" y="492">規模優勢藏在分母裡</text>
</svg>
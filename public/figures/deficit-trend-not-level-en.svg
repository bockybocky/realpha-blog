<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="In a line chart, past deficits spike in two crises and then fall back, but in the recent stretch on the far right, with the economy doing fine, the line keeps climbing to the dashed wartime level.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:600}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}.p{fill:var(--page)}
</style>
<text class="t" x="480" y="52" text-anchor="middle">Used to heal; not now</text>
<rect x="640" y="135" width="260" height="325" fill="var(--card)"/>
<text class="b" x="770" y="160" text-anchor="middle" font-weight="700">Good times</text>
<line x1="100" y1="195" x2="900" y2="195" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
<text class="d" x="110" y="186">War level</text>
<line x1="100" y1="130" x2="100" y2="460" stroke="var(--dim)" stroke-width="2"/>
<line x1="100" y1="460" x2="900" y2="460" stroke="var(--dim)" stroke-width="2"/>
<text class="d" x="110" y="150">Def.</text>
<text class="d" x="900" y="485" text-anchor="end">Time</text>
<path d="M100 420 L200 415 L230 300 L265 330 L310 410 L420 405 L450 275 L485 315 L540 400 L640 395" fill="none" stroke="var(--dim)" stroke-width="3"/>
<path d="M640 395 L720 330 L800 255 L890 198" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="d" x="230" y="288" text-anchor="middle">Hit</text>
<text class="d" x="450" y="263" text-anchor="middle">Hit</text>
<text class="d" x="330" y="440" text-anchor="middle">Heal</text>
<text class="d" x="560" y="430" text-anchor="middle">Heal</text>
<text class="c" x="480" y="530" text-anchor="middle">Trend, not level</text>
</svg>
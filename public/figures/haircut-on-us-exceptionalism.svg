<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三根遞降長條，中間以虛線框標出被扣掉的一點五個百分點">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px;font-weight:700}
    .b{font-size:16px;fill:var(--dim)}
    .k{font-size:22px;font-weight:700}
</style>
<text class="t" x="60" y="58">往下修，不是往上抄</text>
<line x1="120" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="170" y="117" width="150" height="323" fill="var(--grey)" opacity="0.42"/>
<text class="g" x="245" y="104" text-anchor="middle">10.1%</text>
<text class="b" x="245" y="468" text-anchor="middle">美國百年名目</text>
<rect x="430" y="188" width="150" height="48" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="6 4"/>
<text class="b" x="596" y="212" fill="var(--warn)">−1.5 美國例外</text>
<rect x="430" y="236" width="150" height="204" fill="var(--accent)" opacity="0.75"/>
<text class="g" x="505" y="176" text-anchor="middle">7%</text>
<text class="b" x="505" y="468" text-anchor="middle">2050 名目</text>
<rect x="690" y="277" width="150" height="163" fill="var(--accent)" opacity="0.4"/>
<text class="g" x="765" y="264" text-anchor="middle">5.6%</text>
<text class="b" x="765" y="468" text-anchor="middle">2050 實質</text>
<line x1="596" y1="236" x2="690" y2="277" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="b" x="640" y="300" text-anchor="middle">扣物價</text>
<text class="k" x="60" y="512">最好的那個市場，不保證繼續是最好的</text>
</svg>
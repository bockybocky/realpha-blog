<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A fraction: the debt above and the GDP below are both pushed larger at once by arrows pointing up, and the resulting ratio on the right is a question mark.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" fill="var(--ink)">Top vs bottom race</text>

  <rect x="340" y="130" width="300" height="92" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="490" y="184" font-size="22" fill="var(--ink)" text-anchor="middle">Debt</text>

  <line x1="310" y1="256" x2="670" y2="256" stroke="var(--ink)" stroke-width="4"/>

  <rect x="340" y="290" width="300" height="92" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="490" y="344" font-size="22" fill="var(--ink)" text-anchor="middle">GDP</text>

  <line x1="300" y1="228" x2="300" y2="156" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="300,142 291,160 309,160" fill="var(--accent)"/>
  <text class="t" x="278" y="196" font-size="16" fill="var(--accent)" text-anchor="end">Rates up</text>
  <text class="t" x="278" y="220" font-size="15" fill="var(--dim)" text-anchor="end">Capex boom</text>

  <line x1="300" y1="388" x2="300" y2="316" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="300,302 291,320 309,320" fill="var(--accent)"/>
  <text class="t" x="278" y="356" font-size="16" fill="var(--accent)" text-anchor="end">Growth up</text>
  <text class="t" x="278" y="380" font-size="15" fill="var(--dim)" text-anchor="end">AI productivity</text>

  <text class="t" x="700" y="268" font-size="27" fill="var(--dim)">=</text>
  <text class="t" x="770" y="272" font-size="27" fill="var(--ink)">Ratio ?</text>

  <text class="t" x="60" y="470" font-size="22" fill="var(--ink)">One premise moves both</text>
</svg>
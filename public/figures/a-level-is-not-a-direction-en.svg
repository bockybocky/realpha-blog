<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Mirrored high-level and low-level panels, each with one arrow up and one arrow down." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">A level is not a direction</text>
<line x1="480" y1="100" x2="480" y2="440" stroke="var(--line)" stroke-width="2"/>

<text x="240" y="130" font-size="19" fill="var(--dim)" text-anchor="middle">Already huge</text>
<line x1="100" y1="200" x2="380" y2="200" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="240" cy="200" r="12" fill="var(--accent)"/>
<path d="M270 190 L350 150" stroke="var(--accent)" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
<path d="M350 150 l-14 1 l6 10 z" fill="var(--accent)"/>
<path d="M270 212 L350 260" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
<path d="M350 260 l-14 -2 l4 11 z" fill="var(--grey)"/>
<text x="240" y="330" font-size="16" fill="var(--ink)" text-anchor="middle">Could still double</text>

<text x="720" y="130" font-size="19" fill="var(--dim)" text-anchor="middle">Already down a lot</text>
<line x1="580" y1="380" x2="860" y2="380" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="720" cy="380" r="12" fill="var(--warn)"/>
<path d="M750 370 L830 330" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
<path d="M830 330 l-14 1 l6 10 z" fill="var(--grey)"/>
<path d="M750 392 L830 436" stroke="var(--warn)" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
<path d="M830 436 l-14 -2 l4 11 z" fill="var(--warn)"/>
<text x="720" y="300" font-size="16" fill="var(--ink)" text-anchor="middle">Could still halve</text>

<text x="60" y="505" font-size="22" fill="var(--ink)">To turn it around, you need an event you can name</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左圖買低賣高只擷取中間一段，右圖買在高處後一路持有，線延伸出畫面">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">兩種順序</text>

  <line x1="480" y1="92" x2="480" y2="462" stroke="var(--line)" stroke-width="2"/>

  <text class="g" x="60" y="116">多數人：買低、賣高</text>
  <rect x="110" y="270" width="155" height="160" fill="var(--card)"/>
  <polyline points="60,400 110,430 165,350 215,320 265,270 315,305 365,250 440,282"
            fill="none" stroke="var(--grey)" stroke-width="3"/>
  <polyline points="265,270 315,305 365,250 440,282"
            fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="110" cy="430" r="7" fill="var(--dim)"/>
  <circle cx="265" cy="270" r="7" fill="var(--dim)"/>
  <text class="b" x="88" y="458">買</text>
  <text class="b" x="252" y="252">賣</text>
  <text class="b" x="300" y="440">擷取這一段</text>
  <text class="b" x="352" y="228">離場</text>

  <text class="g" x="520" y="116">他：買高、盡量不賣</text>
  <polyline points="520,440 580,415 640,375" fill="none" stroke="var(--grey)"
            stroke-width="3" stroke-dasharray="6 6"/>
  <polyline points="640,375 700,315 760,250 820,192 892,152"
            fill="none" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="640" cy="375" r="7" fill="var(--accent)"/>
  <text class="b" x="620" y="404">買</text>
  <text class="b" x="524" y="404">已經漲過</text>
  <text class="g" x="790" y="132">持有中</text>

  <text class="c" x="60" y="506">他要的是買點之後那一整段</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="After the cooling cabinet and sidecar are inserted, the distance between racks stretches from 2 m to 3 m.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="70" y="70">What cooling cabinets eat is aisle distance</text>
<text class="t g" x="70" y="140">Before</text>
<rect x="230" y="150" width="80" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="470" y="150" width="80" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="310" y1="205" x2="470" y2="205" stroke="var(--accent)" stroke-width="4"/>
<text class="t b" x="355" y="192">2 m</text>
<text class="t b" x="600" y="212">Copper OK</text>
<text class="t g" x="70" y="340">After</text>
<rect x="230" y="350" width="80" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="320" y="350" width="90" height="110" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="t b" x="330" y="412">Cooler</text>
<rect x="420" y="350" width="90" height="110" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="t b" x="430" y="412">Sidecar</text>
<rect x="520" y="350" width="80" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="310" y1="490" x2="520" y2="490" stroke="var(--accent)" stroke-width="4"/>
<text class="t b" x="380" y="516">3 m</text>
<text class="t b" x="620" y="412">optics now</text>
<text class="t c" x="70" y="545">Power saved must offset that floor space</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊軌道與信用是兩塊分離的方塊中間留縫，右邊是軌道與信用合成一整塊">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t  { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">軌道與信用，分開還是同一塊</text>

<text class="t" x="110" y="130" font-size="20" fill="var(--dim)">Visa、Mastercard</text>
<rect x="110" y="150" width="320" height="96" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="134" y="206" font-size="16" fill="var(--ink)">信用　發卡行扛</text>
<rect x="110" y="286" width="320" height="96" rx="8" fill="var(--grey)"/>
<text class="t" x="134" y="342" font-size="16" fill="var(--ink)">軌道</text>
<text class="t" x="236" y="274" font-size="15" fill="var(--dim)">縫</text>

<text class="t" x="530" y="130" font-size="20" fill="var(--accent)">American Express、Affirm</text>
<rect x="530" y="150" width="320" height="232" rx="8" fill="var(--accent)" opacity="0.14" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="554" y="206" font-size="16" fill="var(--ink)">信用　自己扛</text>
<text class="t" x="554" y="342" font-size="16" fill="var(--ink)">軌道</text>
<text class="t" x="554" y="276" font-size="15" fill="var(--accent)">一整塊</text>

<text class="t" x="60" y="480" font-size="22" font-weight="700" fill="var(--ink)">信用在自己身上，市場就替它打折</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The peak of the worry curve sits exactly at the bottom of the price curve, after which the price climbs back.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型 */
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">The day the worry peaked</text>
<rect x="60" y="96" width="840" height="330" fill="var(--card)" rx="8"/>
<line x1="470" y1="120" x2="470" y2="400" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="470" y="418" font-size="16" fill="var(--dim)" text-anchor="middle">Unlock date</text>
<path d="M110 320 C 260 300, 380 160, 470 152 C 560 160, 700 290, 860 322" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text x="470" y="138" font-size="19" fill="var(--dim)" text-anchor="middle">Search interest</text>
<path d="M110 210 C 260 236, 380 358, 470 366 C 580 356, 720 250, 860 176" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="470" cy="366" r="7" fill="var(--accent)"/>
<text x="470" y="394" font-size="19" fill="var(--ink)" text-anchor="middle" font-weight="700">118</text>
<circle cx="860" cy="176" r="7" fill="var(--accent)"/>
<text x="856" y="204" font-size="19" fill="var(--ink)" text-anchor="end" font-weight="700">154</text>
<text x="120" y="192" font-size="19" fill="var(--dim)">Share price</text>
<text x="60" y="486" font-size="22" fill="var(--ink)">A risk written on the calendar is one the price has already walked through</text>
</svg>
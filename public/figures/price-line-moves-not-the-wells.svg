<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="六根高低不同的柱子與兩條高度不同的水平價格線">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; font-weight:700; fill:var(--ink); }
    .g  { font-size:20px; font-weight:600; }
    .b  { font-size:16px; fill:var(--dim); }
    .c  { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">井沒有變，是那條線動了</text>

<line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>

<rect x="150" y="380" width="70" height="60" fill="var(--accent)"/>
<rect x="260" y="330" width="70" height="110" fill="var(--accent)"/>
<rect x="370" y="300" width="70" height="140" fill="var(--accent)"/>
<rect x="480" y="255" width="70" height="185" fill="var(--accent)"/>
<rect x="590" y="215" width="70" height="225" fill="var(--grey)"/>
<rect x="700" y="175" width="70" height="265" fill="var(--grey)"/>

<line x1="120" y1="345" x2="880" y2="345" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="g" x="792" y="338" fill="var(--dim)">以前的價格</text>

<line x1="120" y1="235" x2="880" y2="235" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="792" y="228" fill="var(--accent)">現在的價格</text>

<text class="b" x="60" y="200">每口井</text>
<text class="b" x="60" y="222">的成本</text>

<text class="b" x="150" y="476">算得過來的</text>
<text class="b" x="590" y="476">還是算不過來</text>

<text class="c" x="60" y="524">同一批案子，換一條線就要重算一次</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="權力被包在公債契約裡、契約被包在憲法裡；州議會、州長、市長三支箭頭撞在外牆停住">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .ttl { font-size:27px; font-weight:700; }
    .grp { font-size:19px; font-weight:700; fill:var(--dim); }
    .lbl { font-size:16px; fill:var(--dim); }
    .cc { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t ttl" x="60" y="60">權力住在誰的屋子裡</text>

  <rect x="330" y="100" width="570" height="330" rx="10" fill="var(--card)" stroke="var(--ink)" stroke-width="4"/>
  <text class="t grp" x="352" y="132">美國憲法：不得損害契約義務</text>
  <rect x="372" y="156" width="490" height="240" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t grp" x="394" y="188">公債契約</text>
  <rect x="414" y="212" width="410" height="160" rx="6" fill="var(--accent)" opacity="0.14" stroke="var(--accent)"/>
  <text class="t lbl" x="436" y="248">過路費：任何金額</text>
  <text class="t lbl" x="436" y="284">收費期：任何時候</text>
  <text class="t lbl" x="436" y="320">盈餘：自己留著</text>
  <text class="t lbl" x="436" y="356">工程範圍：相連設施</text>

  <text class="t grp" x="60" y="196">收不回的人</text>
  <g stroke="var(--grey)" stroke-width="5" fill="none">
    <path d="M70 240 L300 240"/>
    <path d="M70 290 L300 290"/>
    <path d="M70 340 L300 340"/>
  </g>
  <g fill="var(--grey)">
    <path d="M300 230 L322 240 L300 250 Z"/>
    <path d="M300 280 L322 290 L300 300 Z"/>
    <path d="M300 330 L322 340 L300 350 Z"/>
  </g>
  <text class="t lbl" x="70" y="232">州議會</text>
  <text class="t lbl" x="70" y="282">州長</text>
  <text class="t lbl" x="70" y="332">市長</text>

  <line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text class="t cc" x="60" y="512">把權力寫進契約，就是請憲法替你看門</text>
</svg>
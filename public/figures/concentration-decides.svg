<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一個比重往上或往下走，分別通向兩個相反的結論">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="56">看那一格占幾成，往哪邊走</text>

  <rect x="60" y="210" width="250" height="110" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="86" y="252">受災地</text>
  <text class="b" x="86" y="284">做了這零件幾成</text>

  <path d="M310 250 L560 150" stroke="var(--warn)" stroke-width="4" fill="none"/>
  <path d="M560 150 l-17 1 l6 15 z" fill="var(--warn)"/>
  <path d="M310 290 L560 390" stroke="var(--grey)" stroke-width="4" fill="none"/>
  <path d="M560 390 l-17 -1 l6 -15 z" fill="var(--grey)"/>

  <rect x="575" y="100" width="325" height="110" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text class="g" x="600" y="140">往上</text>
  <text class="b" x="600" y="172">整併、資本密集、沒新玩家</text>
  <text class="b" x="600" y="196" fill="var(--warn)">反方成立</text>

  <rect x="575" y="340" width="325" height="110" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="600" y="380">往下</text>
  <text class="b" x="600" y="412">需求成長、新廠蓋在別處</text>
  <text class="b" x="600" y="436">正方成立</text>

  <text class="c" x="60" y="492">同一套算式，兩個相反的答案</text>
</svg>
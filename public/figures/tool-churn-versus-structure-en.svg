<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="A frequency contrast between the dense top row and the sparse long blocks below.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="480" fill="var(--page)"/>
  <text class="t" x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Two things that change at different speeds</text>

  <text class="t" x="60" y="130" font-size="20" font-weight="700" fill="var(--grey)">Tools</text>
  <rect x="60" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="130" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="200" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="270" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="340" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="410" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="480" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="550" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="620" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="690" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="760" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="830" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>

  <text class="t" x="60" y="290" font-size="20" font-weight="700" fill="var(--accent)">Structure</text>
  <rect x="60" y="310" width="400" height="70" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="260" y="353" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Who is stuck</text>
  <rect x="470" y="310" width="420" height="70" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="680" y="353" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Who collects rent</text>

  <text class="t" x="60" y="440" font-size="22" font-weight="700" fill="var(--ink)">Reading the bottom row beats chasing the top</text>
</svg>
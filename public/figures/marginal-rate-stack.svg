<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條橫長條，左側五成五分成聯邦、紐約州、紐約市三段，右側四成四是到手">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style></defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">最高邊際稅率是疊出來的</text>
<text class="b" x="60" y="94">一元所得，三個政府各切一刀</text>
<rect x="120" y="170" width="302" height="76" fill="var(--warn)" fill-opacity="0.85"/>
<rect x="422" y="170" width="81" height="76" fill="var(--warn)" fill-opacity="0.55"/>
<rect x="503" y="170" width="29" height="76" fill="var(--warn)" fill-opacity="0.3"/>
<rect x="532" y="170" width="329" height="76" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="150" x2="532" y2="150" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="120" y="138" fill="var(--warn)">稅 55.576%</text>
<text class="g" x="596" y="218" fill="var(--dim)">到手 44.424%</text>
<line x1="150" y1="246" x2="150" y2="286" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="150" y="312" fill="var(--ink)">聯邦</text>
<line x1="450" y1="246" x2="450" y2="326" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="430" y="352" fill="var(--ink)">紐約州</text>
<text class="b" x="430" y="374">10.9%</text>
<line x1="516" y1="246" x2="516" y2="396" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="496" y="422" fill="var(--ink)">紐約市</text>
<text class="b" x="496" y="444">3.876%</text>
<text class="c" x="60" y="494">州稅是另一層，加州那層更厚</text>
</svg>
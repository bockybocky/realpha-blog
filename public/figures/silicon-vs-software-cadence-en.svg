<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two timelines, the upper chip nodes densely spaced and the lower operating-system nodes sparse, with a decade-long gap marked between them.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">Cadences don't match</text>

<text class="g" x="60" y="150">Silicon</text>
<line x1="150" y1="180" x2="890" y2="180" stroke="var(--line)" stroke-width="3"/>
<g fill="var(--accent)">
<circle cx="150" cy="180" r="9"/><circle cx="283" cy="180" r="9"/>
<circle cx="416" cy="180" r="9"/><circle cx="549" cy="180" r="9"/>
<circle cx="682" cy="180" r="9"/><circle cx="815" cy="180" r="9"/>
</g>
<text class="b" x="150" y="160" text-anchor="middle">386</text>
<text class="b" x="815" y="160" text-anchor="middle">Pentium Pro</text>
<text class="b" x="470" y="212" text-anchor="middle">~2 years/gen</text>

<text class="g" x="60" y="370">OS</text>
<line x1="150" y1="340" x2="890" y2="340" stroke="var(--line)" stroke-width="3"/>
<g fill="var(--grey)">
<circle cx="150" cy="340" r="9"/><circle cx="615" cy="340" r="9"/><circle cx="748" cy="340" r="9"/>
</g>
<text class="b" x="615" y="372" text-anchor="middle">NT</text>
<text class="b" x="748" y="372" text-anchor="middle">Windows 95</text>
<text class="b" x="380" y="372" text-anchor="middle">3–5 years/ver</text>

<path d="M150 200 L150 260 L748 260 L748 320" fill="none" stroke="var(--warn)" stroke-width="3"/>
<rect x="378" y="238" width="142" height="44" rx="22" fill="var(--page)"/>
<text class="n" x="449" y="268" text-anchor="middle" fill="var(--warn)">32-bit: 10 years</text>

<text class="c" x="60" y="462">Silicon leads by a decade</text>
</svg>
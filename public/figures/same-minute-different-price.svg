<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="23 格清單裡 17 格兩人不同價，下方兩條長度不一的價格條">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">同一分鐘，同一份雜貨</text>
  <text class="t" x="60" y="112" font-size="16" fill="var(--dim)">23 項商品</text>

  <rect x="60" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="94" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="128" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="162" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="196" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="230" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="264" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="298" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="332" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="366" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="400" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="434" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="468" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="502" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="536" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="570" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="604" y="130" width="26" height="40" rx="4" fill="var(--warn)"/>
  <rect x="638" y="130" width="26" height="40" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="672" y="130" width="26" height="40" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="706" y="130" width="26" height="40" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="740" y="130" width="26" height="40" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="774" y="130" width="26" height="40" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="808" y="130" width="26" height="40" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <rect x="60" y="196" width="18" height="18" rx="3" fill="var(--warn)"/>
  <text class="t" x="88" y="211" font-size="16" fill="var(--ink)">兩人不同價 17</text>
  <rect x="260" y="196" width="18" height="18" rx="3" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="288" y="211" font-size="16" fill="var(--dim)">同價 6</text>

  <text class="t" x="60" y="290" font-size="19" font-weight="700" fill="var(--ink)">同一盒雞蛋</text>
  <rect x="220" y="312" width="420" height="46" rx="6" fill="var(--accent)"/>
  <text class="t" x="660" y="342" font-size="16" fill="var(--dim)">購物者 A</text>
  <rect x="220" y="384" width="517" height="46" rx="6" fill="var(--warn)"/>
  <text class="t" x="757" y="414" font-size="16" fill="var(--dim)">購物者 B</text>
  <line x1="640" y1="448" x2="737" y2="448" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="688" y="474" font-size="16" fill="var(--warn)" text-anchor="middle">＋23%</text>

  <text class="t" x="60" y="524" font-size="22" font-weight="700" fill="var(--ink)">價格不再是商品的屬性，是你的屬性</text>
</svg>
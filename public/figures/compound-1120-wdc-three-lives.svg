<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="折線先陡升後摔落，中間一段很長的平坦，最後又往上翹起">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .h1{font-size:27px;font-weight:700;fill:var(--ink);}
    .cap{font-size:19px;font-weight:700;fill:var(--dim);}
    .capA{font-size:19px;font-weight:700;fill:var(--accent);}
    .unit{font-size:16px;fill:var(--dim);}
    .kick{font-size:22px;font-weight:700;fill:var(--ink);}
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <g class="t">
    <text x="480" y="48" class="h1" text-anchor="middle">同一檔股票的三段人生</text>
    <line x1="70" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="1.5"/>
    <polyline points="80,400 215,150 300,330 680,335 890,160" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="215" cy="150" r="7" fill="var(--accent)"/>
    <circle cx="890" cy="160" r="8" fill="var(--accent)"/>
    <text x="215" y="124" class="capA" text-anchor="middle">熱門股</text>
    <text x="215" y="462" class="unit" text-anchor="middle">1997 到 2000</text>
    <text x="490" y="310" class="cap" text-anchor="middle">配息股</text>
    <text x="490" y="462" class="unit" text-anchor="middle">二十幾年什麼也沒發生</text>
    <text x="890" y="134" class="capA" text-anchor="end">又變動能股</text>
    <text x="890" y="462" class="unit" text-anchor="end">現在</text>
    <text x="480" y="516" class="kick" text-anchor="middle">沒有價值的價格，是那段平坦給的</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bars compare the share of companies trading below 1x PBR falling from about half to roughly a quarter, with the shrinkage split into share price gains and company action, the latter unknown.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t h" x="60" y="62">Share of companies below 1x PBR</text>
  <text class="t b" x="60" y="92">TSE Prime Market</text>

  <line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>

  <rect x="120" y="150" width="150" height="320" fill="var(--grey)" opacity="0.55"/>
  <text class="t g" x="120" y="135">About half</text>
  <text class="t b" x="120" y="500">2023, at the review</text>

  <rect x="620" y="310" width="150" height="160" fill="var(--accent)"/>
  <text class="t g" x="620" y="295">20-30%</text>
  <text class="t b" x="620" y="500">Now</text>

  <line x1="270" y1="150" x2="620" y2="150" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="270" y1="310" x2="620" y2="310" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="330" y="150" width="230" height="78" fill="var(--warn)" opacity="0.35" stroke="var(--line)"/>
  <rect x="330" y="232" width="230" height="78" fill="var(--accent)" opacity="0.30" stroke="var(--line)"/>
  <text class="t g" x="348" y="196">Price gains</text>
  <text class="t g" x="348" y="278">Company action ?</text>
  <text class="t b" x="330" y="340">The split of this drop was never broken out</text>

  <text class="t c" x="60" y="540">Better numbers aren't a better company</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="文字與語音之間兩個相反箭頭，下方另有語音到語音的箭頭">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<defs><marker id="a11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">看箭頭指哪邊</text>
<rect x="140" y="130" width="200" height="90" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="240" y="182" text-anchor="middle">文字</text>
<rect x="620" y="130" width="200" height="90" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="720" y="182" text-anchor="middle">語音</text>
<line x1="345" y1="155" x2="612" y2="155" stroke="var(--accent)" stroke-width="2" marker-end="url(#a11)"/>
<text class="b" x="480" y="142" text-anchor="middle">TTS</text>
<line x1="615" y1="200" x2="348" y2="200" stroke="var(--accent)" stroke-width="2" marker-end="url(#a11)"/>
<text class="b" x="480" y="228" text-anchor="middle">STT</text>
<rect x="140" y="300" width="200" height="90" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="240" y="342" text-anchor="middle">語音</text>
<text class="s" x="240" y="368" text-anchor="middle">中文</text>
<rect x="620" y="300" width="200" height="90" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="720" y="342" text-anchor="middle">語音</text>
<text class="s" x="720" y="368" text-anchor="middle">英文</text>
<line x1="345" y1="345" x2="612" y2="345" stroke="var(--accent)" stroke-width="2" marker-end="url(#a11)"/>
<text class="b" x="480" y="332" text-anchor="middle">S2S</text>
<text class="s" x="480" y="372" text-anchor="middle">不落文字</text>
<text class="c" x="60" y="465">起點與終點　決定它叫什麼</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A chart plots current performance on the horizontal axis and movement this year on the vertical axis; the upper band is marked as the selection zone, containing both a low-positioned rising point and a mid-positioned sharply rising point, while a high but unmoved point at the lower right lies outside it."><rect x="0" y="0" width="960" height="560" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
<text x="80" y="56" font-size="27" fill="var(--ink)">The list rewards change, not height</text>
<rect x="200" y="140" width="660" height="170" fill="var(--card)"/>
<text x="845" y="168" font-size="16" fill="var(--dim)" text-anchor="end">Selections fall in this band</text>
<line x1="200" y1="130" x2="200" y2="465" stroke="var(--grey)" stroke-width="2"/>
<line x1="195" y1="460" x2="865" y2="460" stroke="var(--grey)" stroke-width="2"/>
<text x="200" y="118" font-size="19" fill="var(--ink)">Movement this year</text>
<text x="865" y="492" font-size="19" fill="var(--ink)" text-anchor="end">Current performance</text>
<circle cx="318" cy="208" r="10" fill="var(--accent)"/>
<text x="340" y="214" font-size="16" fill="var(--ink)">Small firm: 0 to 1 or 2</text>
<circle cx="585" cy="176" r="10" fill="var(--accent)"/>
<text x="607" y="182" font-size="16" fill="var(--ink)">Firm: 10 to 100</text>
<circle cx="800" cy="415" r="10" fill="var(--grey)"/>
<text x="778" y="421" font-size="16" fill="var(--dim)" text-anchor="end">Already strong, no move this year</text>
<text x="200" y="534" font-size="22" fill="var(--ink)">The same list tracks the slope</text>
</svg>
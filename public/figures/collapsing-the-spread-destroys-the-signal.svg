<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊四群分散的選民，右邊被壓成一個點">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .ti{font-size:27px;font-weight:700}
    .g{font-size:19px;font-weight:700}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t ti" x="60" y="56">擺動幅度最大的那群人，平均掉就什麼都看不到</text>
<line x1="110" y1="440" x2="470" y2="440" stroke="var(--grey)" stroke-width="2"/>
<line x1="110" y1="440" x2="110" y2="120" stroke="var(--grey)" stroke-width="2"/>
<text class="t b" x="110" y="470">剛來</text>
<text class="t b" x="400" y="470">住了幾十年</text>
<text class="t b" x="60" y="112">立場</text>
<circle cx="170" cy="180" r="14" fill="var(--accent)" opacity="0.85"/>
<circle cx="420" cy="230" r="14" fill="var(--accent)" opacity="0.85"/>
<circle cx="230" cy="390" r="14" fill="var(--accent)" opacity="0.85"/>
<circle cx="380" cy="350" r="14" fill="var(--accent)" opacity="0.85"/>
<text class="t g" x="190" y="176">古巴裔</text>
<text class="t g" x="300" y="226">波多黎各裔</text>
<text class="t g" x="250" y="396">墨西哥裔</text>
<text class="t g" x="256" y="330">多明尼加裔</text>
<path d="M520 300 L620 300" stroke="var(--dim)" stroke-width="3" marker-end="url(#a5)"/>
<text class="t g" x="516" y="282" fill="var(--dim)">合成受訪者</text>
<defs><marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker></defs>
<line x1="680" y1="440" x2="900" y2="440" stroke="var(--grey)" stroke-width="2"/>
<line x1="680" y1="440" x2="680" y2="120" stroke="var(--grey)" stroke-width="2"/>
<circle cx="790" cy="290" r="18" fill="var(--warn)"/>
<text class="t g" x="736" y="258" fill="var(--warn)">一個平均人格</text>
<text class="t b" x="700" y="330">分散消失了</text>
<text class="t c" x="60" y="528">要測的就是他們彼此不同意</text>
</svg>
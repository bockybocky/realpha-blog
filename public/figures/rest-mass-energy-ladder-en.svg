<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The bar is all rest-mass energy; chemistry and nuclear reactions occupy only a sliver at the left, whose internal differences show up only when magnified.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:15px; fill:var(--dim); }
    .a { font-size:16px; fill:var(--accent); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56">Who can reach the energy inside matter</text>

  <rect x="80" y="110" width="800" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <rect x="80" y="110" width="10" height="80" fill="var(--warn)"/>
  <text class="a" x="360" y="158">The whole bar is rest-mass energy</text>
  <text class="s" x="82" y="212">Chemistry and nuclear sit here</text>
  <text class="s" x="700" y="212">Gravity reaches it all</text>

  <line x1="90" y1="222" x2="180" y2="290" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="90" y1="222" x2="860" y2="290" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>

  <rect x="180" y="290" width="680" height="86" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="180" y="278">Left end magnified</text>

  <line x1="210" y1="360" x2="830" y2="360" stroke="var(--line)" stroke-width="2"/>
  <rect x="210" y="352" width="4" height="8" fill="var(--grey)"/>
  <rect x="420" y="330" width="10" height="30" fill="var(--accent)"/>
  <rect x="620" y="316" width="10" height="44" fill="var(--accent)"/>
  <text class="s" x="212" y="404">Chemical bonds</text>
  <text class="s" x="425" y="404" text-anchor="middle">Fission</text>
  <text class="s" x="625" y="404" text-anchor="middle">Fusion</text>
  <text class="s" x="212" y="424">10 to the minus 10</text>
  <text class="s" x="425" y="424" text-anchor="middle">One thousandth</text>
  <text class="s" x="625" y="424" text-anchor="middle">One hundredth</text>

  <text class="c" x="60" y="486">Burn as hot as you like, you are still competing inside that sliver</text>
</svg>
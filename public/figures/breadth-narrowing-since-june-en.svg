<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Two breadth proportion bars shorten, three drawdown share bars sit side by side, and a heavyweight-stock arrow points up at the top right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Since June, fewer stocks take part</text>

<text class="t" x="60" y="128" font-size="19" fill="var(--ink)">Above the 200-day average</text>
<rect x="320" y="110" width="450" height="22" rx="4" fill="var(--grey)"/>
<text class="t" x="784" y="128" font-size="16" fill="var(--dim)">75%</text>
<rect x="320" y="146" width="240" height="22" rx="4" fill="var(--warn)"/>
<text class="t" x="574" y="164" font-size="16" fill="var(--warn)">40%</text>

<text class="t" x="60" y="222" font-size="19" fill="var(--ink)">Beating the index</text>
<rect x="320" y="204" width="360" height="22" rx="4" fill="var(--grey)"/>
<text class="t" x="694" y="222" font-size="16" fill="var(--dim)">60%</text>
<rect x="320" y="240" width="200" height="22" rx="4" fill="var(--warn)"/>
<text class="t" x="534" y="258" font-size="16" fill="var(--warn)">One third</text>

<line x1="60" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="340" font-size="19" fill="var(--ink)">Share down more than 30%</text>
<line x1="120" y1="490" x2="620" y2="490" stroke="var(--line)" stroke-width="2"/>
<rect x="160" y="403" width="70" height="87" fill="var(--grey)"/>
<text class="t" x="195" y="391" font-size="20" fill="var(--ink)" text-anchor="middle">29%</text>
<text class="t" x="195" y="518" font-size="16" fill="var(--dim)" text-anchor="middle">Whole market</text>
<rect x="300" y="349" width="70" height="141" fill="var(--warn)"/>
<text class="t" x="335" y="337" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">47%</text>
<text class="t" x="335" y="518" font-size="16" fill="var(--dim)" text-anchor="middle">Software services</text>
<rect x="440" y="370" width="70" height="120" fill="var(--grey)"/>
<text class="t" x="475" y="358" font-size="20" fill="var(--ink)" text-anchor="middle">40%</text>
<text class="t" x="475" y="518" font-size="16" fill="var(--dim)" text-anchor="middle">Auto parts</text>

<path d="M720 470 L860 360" stroke="var(--accent)" stroke-width="4" marker-end="url(#a6)"/>
<defs><marker id="a6" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>
<text class="t" x="700" y="510" font-size="19" font-weight="700" fill="var(--accent)">The seven largest weights</text>

<text class="t" x="60" y="570" font-size="22" font-weight="700" fill="var(--ink)">Your experience diverging from the index has been normal this half-year</text>
</svg>
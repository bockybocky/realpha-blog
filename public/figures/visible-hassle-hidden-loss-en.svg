<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Above the waterline, the iceberg's small tip is lines, call buttons, and waiting for staff; below it, the large mass is stockouts, wasted trips, and lost sales.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
</style>
<rect x="0" y="240" width="960" height="340" fill="var(--accent)" fill-opacity="0.06"/>
<text x="48" y="62" class="t">Hassle seen, loss not</text>
<path d="M390 240 L590 240 L700 320 L690 460 L540 540 L340 510 L260 390 Z" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<path d="M410 240 L455 170 L490 130 L530 175 L570 240 Z" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<line x1="40" y1="240" x2="920" y2="240" stroke="var(--accent)" stroke-width="2" stroke-dasharray="10 6"/>
<text x="48" y="230" class="d">Sea</text>
<text x="620" y="165" class="b">Line·bell·wait</text>
<text x="620" y="192" class="d">Seen, gripes</text>
<text x="480" y="332" class="g" text-anchor="middle">OOS</text>
<text x="480" y="392" class="g" text-anchor="middle">Miss</text>
<text x="480" y="452" class="g" text-anchor="middle">No sale</text>
<text x="730" y="400" class="d">Unseen</text>
<text x="730" y="424" class="d">Silent</text>
</svg>
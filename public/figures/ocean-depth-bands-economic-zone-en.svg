<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="A vertical depth scale whose top is a very thin economic zone, with a large expanse below it that almost nobody visits.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
  <text x="80" y="56" font-size="27" fill="var(--ink)">The money sits in the topmost layer of water</text>

  <rect x="260" y="120" width="440" height="440" fill="var(--card)"/>
  <rect x="260" y="120" width="440" height="66" fill="var(--accent)" opacity="0.18"/>

  <line x1="260" y1="120" x2="700" y2="120" stroke="var(--ink)" stroke-width="3"/>
  <text x="730" y="114" font-size="19" fill="var(--ink)">Surface</text>
  <text x="730" y="140" font-size="16" fill="var(--dim)">Surface ship transit</text>

  <line x1="260" y1="186" x2="700" y2="186" stroke="var(--accent)" stroke-width="3"/>
  <text x="730" y="192" font-size="19" fill="var(--accent)">1500 m | works today</text>
  <text x="80" y="160" font-size="19" fill="var(--accent)">Economic zone</text>

  <line x1="260" y1="217" x2="700" y2="217" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="730" y="223" font-size="16" fill="var(--dim)">2200 m | pressure test</text>

  <line x1="260" y1="384" x2="700" y2="384" stroke="var(--grey)" stroke-width="2"/>
  <text x="730" y="390" font-size="16" fill="var(--dim)">6000 m | full ocean depth</text>

  <line x1="260" y1="560" x2="700" y2="560" stroke="var(--grey)" stroke-width="2"/>
  <text x="730" y="566" font-size="16" fill="var(--dim)">10000 m | deepest point</text>

  <text x="80" y="596" font-size="22" fill="var(--ink)">You don't need the deepest water to win business</text>
</svg>
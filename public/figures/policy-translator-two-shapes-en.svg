<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the left, a single line runs from one source straight to a preset conclusion; on the right, four lines first converge onto a shared baseline, and only then does discussion grow.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">Two shapes</text>
<rect x="48" y="104" width="408" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="76" y="146" fill="var(--warn)">Draft</text>
<rect x="76" y="176" width="150" height="54" rx="8" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text class="b" x="96" y="209">1 source</text>
<line x1="226" y1="203" x2="330" y2="203" stroke="var(--warn)" stroke-width="3"/>
<polygon points="330,195 352,203 330,211" fill="var(--warn)"/>
<rect x="258" y="266" width="150" height="54" rx="8" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="b" x="278" y="299">Preset</text>
<line x1="301" y1="203" x2="301" y2="258" stroke="var(--warn)" stroke-width="3"/>
<polygon points="293,258 301,280 309,258" fill="var(--warn)"/>
<text class="b" x="76" y="372">One line, direct</text>
<rect x="504" y="104" width="408" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="532" y="146" fill="var(--accent)">Data</text>
<rect x="532" y="170" width="78" height="40" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="624" y="170" width="78" height="40" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="716" y="170" width="78" height="40" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="808" y="170" width="78" height="40" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
<line x1="571" y1="210" x2="690" y2="268" stroke="var(--grey)" stroke-width="2"/>
<line x1="663" y1="210" x2="700" y2="268" stroke="var(--grey)" stroke-width="2"/>
<line x1="755" y1="210" x2="716" y2="268" stroke="var(--grey)" stroke-width="2"/>
<line x1="847" y1="210" x2="726" y2="268" stroke="var(--grey)" stroke-width="2"/>
<rect x="532" y="276" width="354" height="18" rx="9" fill="var(--accent)"/>
<text class="b" x="532" y="326">One base</text>
<line x1="708" y1="276" x2="708" y2="330" stroke="var(--accent)" stroke-width="3"/>
<polygon points="700,330 708,352 716,330" fill="var(--accent)"/>
<text class="g" x="736" y="344">Ask</text>
<text class="b" x="532" y="372">Base, then grow</text>
<text class="c" x="60" y="462">Not candor, but which layer</text>
</svg>
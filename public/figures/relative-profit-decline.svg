<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="一條線上升、另一條線往右下掉，兩條線愈走愈遠">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">獲利在漲，排名在掉</text>
<rect x="100" y="100" width="800" height="400" rx="14" fill="var(--card)" stroke="var(--line)"/>
<path d="M160,300 C320,286 540,250 860,208" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="858" y="190" text-anchor="end" fill="var(--accent)">絕對獲利 年年成長</text>
<line x1="160" y1="345" x2="860" y2="466" stroke="var(--warn)" stroke-width="4"/>
<circle cx="160" cy="345" r="9" fill="var(--warn)"/>
<circle cx="860" cy="466" r="9" fill="var(--warn)"/>
<text class="g" x="178" y="334" fill="var(--warn)">同業排名</text>
<text class="b" x="150" y="351" text-anchor="end">第 9</text>
<text class="b" x="860" y="492" text-anchor="middle">第 20 上下</text>
<text class="b" x="160" y="528" text-anchor="middle">2020</text>
<text class="b" x="860" y="528" text-anchor="middle">2025</text>
<text class="c" x="60" y="572">倒掉的條件不是虧錢，是比同業慢</text>
</svg>
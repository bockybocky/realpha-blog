<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="In the top row a small block becomes a large one through an arrow; in the bottom row the same small block passes through an arrow but the result goes the other way.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Small cut, big drop</text>
<text x="60" y="118" font-size="19" font-weight="700" fill="var(--dim)">Same way</text>
<rect x="60" y="150" width="54" height="44" fill="var(--accent)"/>
<line x1="134" y1="172" x2="196" y2="172" stroke="var(--dim)" stroke-width="4"/>
<polygon points="216,172 190,160 190,184" fill="var(--dim)"/>
<rect x="230" y="150" width="360" height="44" fill="var(--accent)"/>
<text x="60" y="228" font-size="19" font-weight="700" fill="var(--ink)">Est. EPS -6%</text>
<text x="230" y="228" font-size="19" font-weight="700" fill="var(--ink)">Price can fall 40%</text>
<line x1="60" y1="268" x2="900" y2="268" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="310" font-size="19" font-weight="700" fill="var(--dim)">Also reverse</text>
<rect x="60" y="342" width="54" height="44" fill="var(--warn)"/>
<line x1="134" y1="364" x2="196" y2="364" stroke="var(--dim)" stroke-width="4"/>
<polygon points="216,364 190,352 190,376" fill="var(--dim)"/>
<rect x="230" y="342" width="200" height="44" fill="var(--warn)"/>
<text x="60" y="420" font-size="19" font-weight="700" fill="var(--ink)">Est. EPS cut</text>
<text x="230" y="420" font-size="19" font-weight="700" fill="var(--ink)">Price up</text>
<text x="230" y="448" font-size="16" fill="var(--dim)">Multiple 10x to 16x</text>
<text x="640" y="310" font-size="19" font-weight="700" fill="var(--ink)">Schematic</text>
<text x="640" y="342" font-size="16" fill="var(--dim)">Only cited numbers</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A three-step staircase descends to the right with a loop arrow returning to the start, indicating that a program presses the sell button.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">Self-fueled decline</text>
<path d="M110 150 L330 150 L330 260 L560 260 L560 370 L790 370 L790 470"
      fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="110" cy="150" r="7" fill="var(--accent)"/>
<text class="g" x="110" y="128">Yields rise</text>
<circle cx="330" cy="260" r="7" fill="var(--accent)"/>
<text class="g" x="330" y="240">Bond prices fall</text>
<circle cx="560" cy="370" r="7" fill="var(--accent)"/>
<text class="g" x="560" y="350">Passive funds sell</text>
<circle cx="790" cy="470" r="7" fill="var(--warn)"/>
<text class="g" x="700" y="508">Prices fall again</text>
<path d="M790 470 C880 470 900 120 350 112" fill="none" stroke="var(--warn)"
      stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a3)"/>
<defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker></defs>
<text class="b" x="470" y="440">No human hits sell</text>
<text class="b" x="470" y="464">A program does</text>
<text class="c" x="60" y="100">Why it is fast and fierce</text>
</svg>
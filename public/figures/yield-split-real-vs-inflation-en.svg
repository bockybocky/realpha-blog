<svg xmlns="http://www.w3.org/2000/svg" id="fig-yield-split" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two lines compared: inflation expectations almost flat in a narrow band, real rates climbing all the way up">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
#fig-yield-split text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-yield-split .h { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-yield-split .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-yield-split .b { font-size:16px; fill:var(--dim); }
#fig-yield-split .s { font-size:15px; fill:var(--dim); }
#fig-yield-split .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="h" x="60" y="54">One part still, one moving</text>
<text class="b" x="60" y="84">2010 to 2026, illustrative</text>
<rect x="100" y="216" width="720" height="96" fill="var(--card)"/>
<line x1="100" y1="120" x2="100" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="450" x2="840" y2="450" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="90" y="445" text-anchor="end">-1%</text>
<text class="s" x="90" y="381" text-anchor="end">0%</text>
<text class="s" x="90" y="317" text-anchor="end">1%</text>
<text class="s" x="90" y="253" text-anchor="end">2%</text>
<text class="s" x="90" y="189" text-anchor="end">3%</text>
<text class="s" x="90" y="125" text-anchor="end">4%</text>
<polyline fill="none" stroke="var(--grey)" stroke-width="3" points="100,272 190,262 280,278 370,285 460,265 550,290 640,240 730,258 820,262"/>
<polyline fill="none" stroke="var(--accent)" stroke-width="4" points="100,427 190,395 280,352 370,363 460,340 505,330 550,440 595,428 640,360 685,290 730,242 775,208 820,190"/>
<circle cx="820" cy="190" r="6" fill="var(--accent)"/>
<text class="g" x="836" y="186">Real rate</text>
<text class="s" x="836" y="210">Rising</text>
<text class="g" x="836" y="268" fill="var(--dim)">Inflation</text>
<text class="s" x="836" y="292">Flat</text>
<text class="s" x="100" y="474">2010</text>
<text class="s" x="370" y="474">2016</text>
<text class="s" x="550" y="474">2020</text>
<text class="s" x="820" y="474" text-anchor="end">2026</text>
<text class="c" x="60" y="522">Price of money, not inflation</text>
</svg>
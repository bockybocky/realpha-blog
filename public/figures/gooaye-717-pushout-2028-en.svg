<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two units are carved out of the ten units of 2028 volume and arrows move them to 2029 and 2030, so the total stays the same but the timing moves later.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">The volume didn't vanish; it changed years</text>
<line x1="90" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="372" width="130" height="44" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<rect x="150" y="328" width="130" height="44" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<rect x="150" y="284" width="130" height="44" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<rect x="150" y="240" width="130" height="44" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<rect x="150" y="196" width="130" height="44" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<rect x="150" y="152" width="130" height="44" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<rect x="150" y="108" width="130" height="44" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<rect x="150" y="64" width="130" height="44" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<rect x="150" y="20" width="130" height="40" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
<text class="g" x="215" y="452" text-anchor="middle">2028</text>
<text class="b" x="296" y="46" fill="var(--warn)">2 units moved out</text>
<rect x="470" y="372" width="130" height="44" fill="var(--grey)" stroke="var(--page)" stroke-width="2"/>
<rect x="470" y="328" width="130" height="44" fill="var(--grey)" stroke="var(--page)" stroke-width="2"/>
<rect x="470" y="284" width="130" height="44" fill="var(--grey)" stroke="var(--page)" stroke-width="2"/>
<rect x="470" y="240" width="130" height="44" fill="var(--warn)" stroke="var(--page)" stroke-width="2"/>
<text class="g" x="535" y="452" text-anchor="middle">2029</text>
<rect x="720" y="372" width="130" height="44" fill="var(--grey)" stroke="var(--page)" stroke-width="2"/>
<rect x="720" y="328" width="130" height="44" fill="var(--grey)" stroke="var(--page)" stroke-width="2"/>
<rect x="720" y="284" width="130" height="44" fill="var(--warn)" stroke="var(--page)" stroke-width="2"/>
<text class="g" x="785" y="452" text-anchor="middle">2030</text>
<path d="M300 60 C400 60 430 180 505 232" fill="none" stroke="var(--warn)" stroke-width="3"/>
<polygon points="512,243 495,230 507,222" fill="var(--warn)"/>
<path d="M300 78 C520 90 650 200 752 276" fill="none" stroke="var(--warn)" stroke-width="3"/>
<polygon points="760,286 742,274 754,266" fill="var(--warn)"/>
<text class="c" x="60" y="506">Still your order, but a looser date kills the price case</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="短期減柱長於加柱、淨額在零線下；中長期加柱變長、淨額回到零線上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="48">記憶體沒有陣營，只有加減</text>

<path d="M60 290 L900 290" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="60" y="282">0</text>

<text class="g" x="140" y="96">短期</text>
<rect x="140" y="210" width="70" height="80" fill="var(--accent)"/>
<text class="s" x="140" y="196">ASIC 補</text>
<rect x="240" y="290" width="70" height="150" fill="var(--warn)"/>
<text class="s" x="240" y="466">GPU 掉</text>
<rect x="350" y="290" width="70" height="70" fill="var(--warn)" opacity="0.55"/>
<text class="s" x="350" y="386">淨減</text>

<path d="M470 120 L470 470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

<text class="g" x="560" y="96">中長期</text>
<rect x="560" y="150" width="70" height="140" fill="var(--accent)"/>
<text class="s" x="560" y="136">ASIC 補</text>
<rect x="660" y="290" width="70" height="90" fill="var(--warn)"/>
<text class="s" x="660" y="406">GPU 掉</text>
<rect x="770" y="240" width="70" height="50" fill="var(--accent)" opacity="0.55"/>
<text class="s" x="770" y="226">有機會淨增</text>

<text class="c" x="60" y="520">受害與受惠可以同時成立，它們在講不同的格子</text>
</svg>
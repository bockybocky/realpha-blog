<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊的點陣由一擴散成八，右邊的點陣由八收斂成一，右邊標為實際情況">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="80" y="62" font-size="27" fill="var(--ink)">一個用戶帶進幾個新用戶</text>
<line x1="480" y1="110" x2="480" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="250" y="130" font-size="20" fill="var(--dim)" text-anchor="middle">K 大於 1</text>
<text x="710" y="130" font-size="20" fill="var(--accent)" text-anchor="middle">K 小於 1</text>
<circle cx="250" cy="180" r="13" fill="var(--grey)"/>
<circle cx="215" cy="250" r="13" fill="var(--grey)"/>
<circle cx="285" cy="250" r="13" fill="var(--grey)"/>
<circle cx="190" cy="320" r="13" fill="var(--grey)"/>
<circle cx="230" cy="320" r="13" fill="var(--grey)"/>
<circle cx="270" cy="320" r="13" fill="var(--grey)"/>
<circle cx="310" cy="320" r="13" fill="var(--grey)"/>
<circle cx="165" cy="390" r="13" fill="var(--grey)"/>
<circle cx="205" cy="390" r="13" fill="var(--grey)"/>
<circle cx="245" cy="390" r="13" fill="var(--grey)"/>
<circle cx="285" cy="390" r="13" fill="var(--grey)"/>
<circle cx="325" cy="390" r="13" fill="var(--grey)"/>
<circle cx="365" cy="390" r="13" fill="var(--grey)"/>
<circle cx="125" cy="390" r="13" fill="var(--grey)"/>
<circle cx="405" cy="390" r="13" fill="var(--grey)"/>
<circle cx="625" cy="180" r="13" fill="var(--accent)"/>
<circle cx="665" cy="180" r="13" fill="var(--accent)"/>
<circle cx="705" cy="180" r="13" fill="var(--accent)"/>
<circle cx="745" cy="180" r="13" fill="var(--accent)"/>
<circle cx="785" cy="180" r="13" fill="var(--accent)"/>
<circle cx="585" cy="180" r="13" fill="var(--accent)"/>
<circle cx="825" cy="180" r="13" fill="var(--accent)"/>
<circle cx="545" cy="180" r="13" fill="var(--accent)"/>
<circle cx="650" cy="250" r="13" fill="var(--accent)" opacity="0.75"/>
<circle cx="690" cy="250" r="13" fill="var(--accent)" opacity="0.75"/>
<circle cx="730" cy="250" r="13" fill="var(--accent)" opacity="0.75"/>
<circle cx="770" cy="250" r="13" fill="var(--accent)" opacity="0.75"/>
<circle cx="690" cy="320" r="13" fill="var(--accent)" opacity="0.5"/>
<circle cx="730" cy="320" r="13" fill="var(--accent)" opacity="0.5"/>
<circle cx="710" cy="390" r="13" fill="var(--accent)" opacity="0.3"/>
<text x="250" y="440" font-size="16" fill="var(--dim)" text-anchor="middle">自己會滾</text>
<text x="710" y="440" font-size="16" fill="var(--accent)" text-anchor="middle">十二年來每一樣都在這邊</text>
<text x="80" y="520" font-size="22" fill="var(--ink)">沒有病毒式擴散，每一個客戶都得自己去賺</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩格各有一條虛線門檻，一支水平箭頭撞上垂直線，一條上升折線穿過水平線">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <defs>
    <marker id="aa3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <text x="60" y="58" font-size="27" fill="var(--ink)">兩邊各畫一條會被撞到的線</text>

  <rect x="56" y="110" width="392" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="80" y="150" font-size="20" fill="var(--dim)">看好的一邊</text>
  <line x1="90" y1="280" x2="352" y2="280" stroke="var(--accent)" stroke-width="3" marker-end="url(#aa3)"/>
  <line x1="368" y1="180" x2="368" y2="380" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="368" y="170" font-size="16" fill="var(--warn)" text-anchor="middle">某個時間點</text>
  <text x="90" y="255" font-size="16" fill="var(--ink)">時間往前走</text>
  <text x="90" y="345" font-size="16" fill="var(--dim)">還是只有一個客戶</text>

  <rect x="512" y="110" width="392" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="536" y="150" font-size="20" fill="var(--dim)">看壞的一邊</text>
  <line x1="546" y1="300" x2="880" y2="300" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="880" y="288" font-size="16" fill="var(--warn)" text-anchor="end">連續幾季</text>
  <polyline points="556,392 626,378 696,346 766,300 846,214" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#aa3)"/>
  <text x="556" y="345" font-size="16" fill="var(--dim)">供應鏈的量</text>

  <text x="60" y="495" font-size="22" fill="var(--ink)">畫不出線的那一邊，講的是立場</text>
</svg>
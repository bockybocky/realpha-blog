<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A single vertical path on the left, and a block fanning out to five customer blocks on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="64" font-size="27" fill="var(--ink)">One theme, two ways to benefit</text>
  <line x1="480" y1="110" x2="480" y2="480" stroke="var(--line)" stroke-width="1"/>

  <rect x="130" y="140" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="230" y="177" font-size="19" fill="var(--ink)" text-anchor="middle">Tech</text>
  <line x1="230" y1="200" x2="230" y2="232" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="223,232 237,232 230,244" fill="var(--grey)"/>
  <rect x="130" y="246" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="230" y="283" font-size="19" fill="var(--ink)" text-anchor="middle">Own machine</text>
  <line x1="230" y1="306" x2="230" y2="338" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="223,338 237,338 230,350" fill="var(--grey)"/>
  <rect x="130" y="352" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="230" y="389" font-size="19" fill="var(--ink)" text-anchor="middle">Market</text>
  <text x="230" y="446" font-size="20" fill="var(--ink)" text-anchor="middle">Vertical</text>
  <text x="230" y="476" font-size="16" fill="var(--dim)" text-anchor="middle">Wins if its own product sells</text>

  <rect x="600" y="140" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="700" y="177" font-size="19" fill="var(--ink)" text-anchor="middle">Tech</text>
  <line x1="700" y1="200" x2="528" y2="300" stroke="var(--accent)" stroke-width="2"/>
  <line x1="700" y1="200" x2="614" y2="300" stroke="var(--accent)" stroke-width="2"/>
  <line x1="700" y1="200" x2="700" y2="300" stroke="var(--accent)" stroke-width="2"/>
  <line x1="700" y1="200" x2="786" y2="300" stroke="var(--accent)" stroke-width="2"/>
  <line x1="700" y1="200" x2="872" y2="300" stroke="var(--accent)" stroke-width="2"/>
  <rect x="490" y="300" width="76" height="54" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="528" y="333" font-size="16" fill="var(--ink)" text-anchor="middle">Carmakers</text>
  <rect x="576" y="300" width="76" height="54" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="614" y="333" font-size="16" fill="var(--ink)" text-anchor="middle">Mining</text>
  <rect x="662" y="300" width="76" height="54" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="700" y="333" font-size="16" fill="var(--ink)" text-anchor="middle">Farm gear</text>
  <rect x="748" y="300" width="76" height="54" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="786" y="333" font-size="16" fill="var(--ink)" text-anchor="middle">Defense</text>
  <rect x="834" y="300" width="76" height="54" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="872" y="333" font-size="16" fill="var(--ink)" text-anchor="middle">Robots</text>
  <text x="700" y="446" font-size="20" fill="var(--ink)" text-anchor="middle">Horizontal</text>
  <text x="700" y="476" font-size="16" fill="var(--dim)" text-anchor="middle">Wins if more entrants show up</text>

  <text x="480" y="528" font-size="22" fill="var(--ink)" text-anchor="middle">The horizontal risk is not rivals. It is customers building it themselves.</text>
</svg>
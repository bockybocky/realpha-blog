<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="六階往右上升的階梯，壓力從農人一路傳到紐約拆款市場">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">農忙季那條鏈子</text>
<rect x="60" y="400" width="140" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="78" y="434">農人提現</text>
<rect x="208" y="340" width="140" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="226" y="374">小鎮銀行</text>
<rect x="356" y="280" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="374" y="314">動用準備</text>
<rect x="514" y="220" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="532" y="254">調回紐約存款</text>
<rect x="672" y="160" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="690" y="194">拆款市場斷炊</text>
<rect x="760" y="92" width="150" height="56" rx="8" fill="var(--warn)" opacity="0.85"/>
<text class="b" x="778" y="126" fill="var(--page)">利率跳升</text>
<path d="M200 428 L208 372" stroke="var(--grey)" stroke-width="2.5"/>
<path d="M348 368 L356 312" stroke="var(--grey)" stroke-width="2.5"/>
<path d="M506 308 L514 252" stroke="var(--grey)" stroke-width="2.5"/>
<path d="M664 248 L672 192" stroke="var(--grey)" stroke-width="2.5"/>
<path d="M822 188 L838 150" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="60" y="486">起點：銀行發不出自己的鈔票</text>
<text class="c" x="60" y="524">每一階都沒有人做錯事</text>
</svg>
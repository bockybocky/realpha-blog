<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="邊界兩側各有一筆錢在內部易手，只有一支標著毒品的箭頭橫跨邊界">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<defs>
<marker id="vcA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
<marker id="vcW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker>
</defs>
<text class="t" x="480" y="48" text-anchor="middle">錢不過境，只有貨過境</text>
<text class="g" x="240" y="100" text-anchor="middle">加拿大</text>
<text class="g" x="720" y="100" text-anchor="middle">中國</text>
<line x1="480" y1="75" x2="480" y2="470" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="140" y="140" width="200" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="240" y="177" text-anchor="middle">販毒集團</text>
<rect x="140" y="330" width="200" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="240" y="367" text-anchor="middle">海外富人</text>
<rect x="620" y="140" width="200" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="720" y="177" text-anchor="middle">中間人</text>
<rect x="620" y="330" width="200" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="720" y="367" text-anchor="middle">富人的帳戶</text>
<line x1="240" y1="202" x2="240" y2="322" stroke="var(--accent)" stroke-width="3" marker-end="url(#vcA)"/>
<text class="g a" x="256" y="268">現金</text>
<line x1="720" y1="328" x2="720" y2="208" stroke="var(--accent)" stroke-width="3" marker-end="url(#vcA)"/>
<text class="g a" x="736" y="268">人民幣</text>
<line x1="618" y1="170" x2="350" y2="170" stroke="var(--warn)" stroke-width="4" marker-end="url(#vcW)"/>
<rect x="440" y="128" width="80" height="30" fill="var(--page)"/>
<text class="g w" x="480" y="151" text-anchor="middle">毒品</text>
<rect x="415" y="342" width="130" height="36" fill="var(--page)"/>
<text class="b" x="480" y="366" text-anchor="middle">錢不過境</text>
<text class="c" x="480" y="520" text-anchor="middle">兩邊各自易手，差額由貨抵銷</text>
</svg>
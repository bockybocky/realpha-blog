<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="AI 風險一詞底下兩格，左格填滿治理與採用的工作，右格是空的虛線框代表尾端風險未被處理">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">一個詞，裝著兩個不同的問題</text>

<rect x="330" y="100" width="300" height="66" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text x="480" y="143" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">「AI 風險」</text>

<path d="M420 166 L250 206" stroke="var(--line)" stroke-width="4"/>
<path d="M540 166 L710 206" stroke="var(--line)" stroke-width="4"/>

<rect x="70" y="210" width="380" height="270" rx="12" fill="var(--accent)" opacity="0.14"/>
<rect x="70" y="210" width="380" height="270" rx="12" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="96" y="250" font-size="20" font-weight="700" fill="var(--accent)">治理與採用</text>
<rect x="96" y="268" width="328" height="44" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="112" y="297" font-size="16" fill="var(--ink)">跨機構工具包</text>
<rect x="96" y="322" width="328" height="44" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="112" y="351" font-size="16" fill="var(--ink)">創新論壇 約百家公司</text>
<rect x="96" y="376" width="328" height="44" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="112" y="405" font-size="16" fill="var(--ink)">監理期待：抓詐騙加分</text>
<text x="96" y="458" font-size="16" fill="var(--dim)">她答的那一半</text>

<rect x="510" y="210" width="380" height="270" rx="12" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="12 10"/>
<text x="536" y="250" font-size="20" font-weight="700" fill="var(--warn)">模型自主行為</text>
<text x="536" y="282" font-size="16" fill="var(--dim)">尾端風險</text>
<text x="700" y="360" font-size="19" font-weight="700" text-anchor="middle" fill="var(--grey)">（空）</text>
<text x="536" y="458" font-size="16" fill="var(--dim)">留在原地沒被碰</text>

<text x="60" y="528" font-size="22" font-weight="700" fill="var(--ink)">讀新聞時先把這兩格分開</text>
</svg>
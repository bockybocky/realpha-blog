<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="On the left the headcount column is tall and the customer bar short; on the right the headcount column is only a tenth as tall and the customer bar is longer.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text x="80" y="60" font-size="27" font-weight="700" fill="var(--ink)">Same business, two different bodies</text>

  <text x="80" y="110" font-size="20" font-weight="700" fill="var(--dim)">Incumbent bank</text>
  <rect x="80" y="130" width="90" height="290" fill="var(--grey)"/>
  <text x="185" y="160" font-size="16" fill="var(--dim)">100,000 employees</text>
  <g fill="var(--grey)">
    <rect x="185" y="186" width="22" height="22"/><rect x="215" y="186" width="22" height="22"/>
    <rect x="245" y="186" width="22" height="22"/><rect x="275" y="186" width="22" height="22"/>
    <rect x="305" y="186" width="22" height="22"/><rect x="335" y="186" width="22" height="22"/>
    <rect x="185" y="216" width="22" height="22"/><rect x="215" y="216" width="22" height="22"/>
    <rect x="245" y="216" width="22" height="22"/><rect x="275" y="216" width="22" height="22"/>
    <rect x="305" y="216" width="22" height="22"/><rect x="335" y="216" width="22" height="22"/>
  </g>
  <text x="185" y="266" font-size="16" fill="var(--dim)">6,000 branches</text>
  <rect x="80" y="446" width="200" height="30" fill="var(--grey)"/>
  <text x="80" y="508" font-size="16" fill="var(--dim)">Serving 100 million customers</text>

  <line x1="480" y1="100" x2="480" y2="520" stroke="var(--line)" stroke-width="2"/>

  <text x="540" y="110" font-size="20" font-weight="700" fill="var(--accent)">Nubank</text>
  <rect x="540" y="391" width="90" height="29" fill="var(--accent)"/>
  <text x="645" y="412" font-size="16" fill="var(--dim)">10,000 employees</text>
  <rect x="645" y="186" width="200" height="52" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="658" y="218" font-size="16" fill="var(--dim)">No branches</text>
  <rect x="540" y="446" width="280" height="30" fill="var(--accent)"/>
  <text x="540" y="508" font-size="16" fill="var(--dim)">Serving 140M customers</text>

  <line x1="80" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
  <text x="80" y="566" font-size="22" font-weight="700" fill="var(--ink)">The cost-per-customer gap was built long before AI</text>
</svg>
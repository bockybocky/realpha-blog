<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A dividing line puts monetary policy alone in the independent zone on the left, while supervision, emergency lending and balance sheet policy fall into the executive zone on the right, needing coordination and accountability.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">"Independent to do what": four functions, two zones</text>

<line x1="330" y1="110" x2="330" y2="480" stroke="var(--ink)" stroke-width="4"/>

<text x="80" y="146" font-size="20" font-weight="700" fill="var(--accent)">Independence holds up</text>
<text x="80" y="172" font-size="16" fill="var(--dim)">Article One｜delegated by Congress</text>

<rect x="80" y="196" width="220" height="150" rx="10" fill="var(--accent)" opacity="0.18"/>
<rect x="80" y="196" width="220" height="150" rx="10" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="190" y="262" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">Monetary policy</text>
<text x="190" y="294" font-size="16" text-anchor="middle" fill="var(--ink)">Regulates the value of money</text>

<text x="360" y="146" font-size="20" font-weight="700" fill="var(--warn)">The power is executive in nature</text>
<text x="360" y="172" font-size="16" fill="var(--dim)">Fiscal or quasi-fiscal in nature｜needs coordination and accountability</text>

<rect x="360" y="196" width="170" height="150" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="445" y="262" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Supervision</text>
<text x="445" y="292" font-size="16" text-anchor="middle" fill="var(--dim)">and payments</text>

<rect x="548" y="196" width="170" height="150" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="633" y="262" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Emergency lending</text>

<rect x="736" y="196" width="170" height="150" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="821" y="254" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Balance sheet</text>
<text x="821" y="282" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">and QE</text>

<text x="190" y="416" font-size="16" text-anchor="middle" fill="var(--dim)">Time inconsistency: it fits</text>
<text x="633" y="416" font-size="16" text-anchor="middle" fill="var(--dim)">Time inconsistency: it does not fit</text>

<text x="60" y="520" font-size="22" font-weight="700" fill="var(--ink)">The answer differs in each of the four boxes</text>
</svg>
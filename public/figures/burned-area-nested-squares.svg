<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三個依面積比例嵌套、左下角對齊的正方形，最外層遠大於計畫區本身">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">燒掉的面積，按比例</text>
<rect x="80" y="120" width="380" height="380" fill="var(--card)" stroke="var(--line)"/>
<rect x="80" y="358" width="142" height="142" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)"/>
<rect x="80" y="415" width="85" height="85" fill="var(--warn)"/>
<line x1="460" y1="150" x2="520" y2="150" stroke="var(--line)" stroke-width="2"/>
<text x="530" y="144" font-size="19" fill="var(--ink)">約 1,000 萬公頃</text>
<text x="530" y="170" font-size="16" fill="var(--dim)">含計畫區以外</text>
<line x1="222" y1="370" x2="520" y2="370" stroke="var(--line)" stroke-width="2"/>
<text x="530" y="364" font-size="19" fill="var(--ink)">140 萬公頃</text>
<text x="530" y="390" font-size="16" fill="var(--dim)">計畫區</text>
<line x1="165" y1="458" x2="520" y2="458" stroke="var(--warn)" stroke-width="2"/>
<text x="530" y="452" font-size="19" fill="var(--warn)">50 萬公頃</text>
<text x="530" y="478" font-size="16" fill="var(--dim)">區內燒毀・八成是泥炭</text>
<text x="80" y="540" font-size="22" fill="var(--ink)">火不認界線</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two equal bars split the same minus seven percent into index and single-stock parts, one almost all index and the other almost all stock." font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="80" y="56" font-size="27" font-weight="600" fill="var(--ink)">Down 7% today: how much is this company</text>
  <text x="80" y="88" font-size="16" fill="var(--dim)">Illustration: the same fall split into index and stock</text>

  <text x="80" y="142" font-size="20" font-weight="600" fill="var(--ink)">Case A</text>
  <text x="840" y="142" text-anchor="end" font-size="16" fill="var(--accent)">Stock -1%</text>
  <rect x="80" y="160" width="651" height="64" fill="var(--grey)"/>
  <rect x="731" y="160" width="109" height="64" fill="var(--accent)"/>
  <rect x="80" y="160" width="760" height="64" fill="none" stroke="var(--line)"/>
  <text x="405" y="199" text-anchor="middle" font-size="16" fill="var(--ink)">Index -6%</text>
  <text x="80" y="260" font-size="20" font-weight="600" fill="var(--ink)">Thesis stands</text>

  <text x="80" y="332" font-size="20" font-weight="600" fill="var(--ink)">Case B</text>
  <rect x="80" y="350" width="109" height="64" fill="var(--grey)"/>
  <rect x="189" y="350" width="651" height="64" fill="var(--accent)"/>
  <rect x="80" y="350" width="760" height="64" fill="none" stroke="var(--line)"/>
  <text x="514" y="389" text-anchor="middle" font-size="16" fill="var(--page)">Stock -6%</text>
  <text x="80" y="452" font-size="15" fill="var(--dim)">Index -1%</text>
  <text x="840" y="452" text-anchor="end" font-size="20" font-weight="600" fill="var(--warn)">Go reread the thesis</text>

  <text x="480" y="498" text-anchor="middle" font-size="22" fill="var(--ink)">Split index from stock before you decide to act</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="With total resources fixed, the ring body stops at ordinary height and the part given up moves onto the tall sensor and algorithm column.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">You cannot boil the ocean, so pick one pot</text>
<rect x="120" y="100" width="760" height="34" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="134" y="124">Total resources are fixed</text>
<line x1="120" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="3"/>
<rect x="190" y="360" width="160" height="70" fill="var(--grey)"/>
<rect x="190" y="200" width="160" height="160" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="b" x="196" y="252">Where you want excellence</text>
<text class="b" x="196" y="282">Given up on purpose</text>
<text class="g" x="190" y="470">The ring body</text>
<text class="b" x="190" y="500">Ordinary is fine</text>
<path d="M 370 280 C 450 240 520 240 580 250" fill="none" stroke="var(--dim)" stroke-width="4"/>
<polygon points="574,240 596,252 572,262" fill="var(--dim)"/>
<rect x="620" y="200" width="160" height="230" fill="var(--accent)"/>
<text class="g" x="620" y="470">Sensors and algorithms</text>
<text class="b" x="620" y="500">A generation ahead</text>
<text class="c" x="60" y="534">What you do best is also what eats every resource you have</text>
</svg>
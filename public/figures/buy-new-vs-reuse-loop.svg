<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="上面一條直線路徑被一道牆擋住，下面一條路徑串起退役、拆下、重新認證三站抵達機櫃，再有一條回流弧線繞回起點形成循環">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="60" y="70" font-size="27" fill="var(--ink)">買不到，就把舊的挖回來</text>

  <text x="60" y="135" font-size="19" fill="var(--dim)">其他路徑</text>
  <rect x="60" y="160" width="170" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="88" y="197" font-size="16" fill="var(--ink)">買新 DDR5</text>
  <line x1="240" y1="190" x2="320" y2="190" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="332,190 318,183 318,197" fill="var(--grey)"/>
  <line x1="345" y1="152" x2="345" y2="228" stroke="var(--warn)" stroke-width="7"/>
  <text x="305" y="252" font-size="16" fill="var(--warn)">買不到</text>
  <polyline points="360,190 785,190 785,368" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <polygon points="785,378 778,364 792,364" fill="var(--grey)"/>

  <text x="60" y="355" font-size="19" fill="var(--dim)">CXL</text>
  <rect x="60" y="380" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="82" y="414" font-size="16" fill="var(--ink)">退役伺服器</text>
  <line x1="218" y1="408" x2="230" y2="408" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="242,408 228,401 228,415" fill="var(--accent)"/>
  <rect x="250" y="380" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="278" y="414" font-size="16" fill="var(--ink)">拆下 DDR4</text>
  <line x1="408" y1="408" x2="420" y2="408" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="432,408 418,401 418,415" fill="var(--accent)"/>
  <rect x="440" y="380" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="470" y="414" font-size="16" fill="var(--ink)">重新認證</text>
  <line x1="598" y1="408" x2="660" y2="408" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="672,408 658,401 658,415" fill="var(--accent)"/>
  <rect x="680" y="380" width="210" height="56" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="722" y="414" font-size="16" fill="var(--ink)">機櫃上線</text>

  <path d="M 785 436 C 785 520, 135 520, 135 448" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
  <polygon points="135,436 128,450 142,450" fill="var(--accent)"/>
  <text x="420" y="528" font-size="16" fill="var(--dim)">換新 CPU</text>
</svg>
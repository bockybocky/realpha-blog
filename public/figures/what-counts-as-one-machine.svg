<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="晶片被伺服器包住、伺服器被機櫃包住、機櫃被資料中心包住的四層巢狀方框，一支箭頭由內向外穿出。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--accent); }
    .k { font-size:19px; font-weight:700; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="52">「一台」的邊界一直外擴</text>
  <rect x="60" y="76" width="14" height="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="s" x="82" y="89">以前的「一台」</text>
  <rect x="250" y="76" width="14" height="14" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text class="s" x="272" y="89">未來的「一台」</text>

  <rect x="150" y="140" width="580" height="300" rx="16" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="g" x="168" y="170">資料中心</text>
  <rect x="195" y="180" width="490" height="222" rx="14" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text class="g" x="213" y="210">機櫃</text>
  <rect x="240" y="220" width="400" height="144" rx="12" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text class="k" x="258" y="250">伺服器</text>
  <rect x="285" y="262" width="300" height="70" rx="10" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
  <text class="k" x="303" y="303">晶片</text>

  <text class="s" x="682" y="284" text-anchor="middle">邊界外擴</text>
  <line x1="600" y1="300" x2="748" y2="300" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="748,292 766,300 748,308" fill="var(--accent)"/>

  <text class="c" x="480" y="496" text-anchor="middle">賣點從一顆晶片，變成一整套系統</text>
</svg>
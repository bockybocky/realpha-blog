<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊散落的錯題方塊，右邊被歸類成五根高低不同的柱子，最高那根一眼可見" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">一題一題，還是堆成一枝一枝</text>

<rect x="60" y="96" width="390" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="510" y="96" width="390" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>

<text x="80" y="138" font-size="20" font-weight="700" fill="var(--dim)">答完就散了</text>
<text x="530" y="138" font-size="20" font-weight="700" fill="var(--ink)">歸類累積</text>

<g fill="var(--grey)">
<rect x="98" y="188" width="18" height="18" rx="4"/>
<rect x="166" y="196" width="18" height="18" rx="4"/>
<rect x="228" y="184" width="18" height="18" rx="4"/>
<rect x="292" y="198" width="18" height="18" rx="4"/>
<rect x="356" y="188" width="18" height="18" rx="4"/>
<rect x="106" y="240" width="18" height="18" rx="4"/>
<rect x="172" y="232" width="18" height="18" rx="4"/>
<rect x="296" y="238" width="18" height="18" rx="4"/>
<rect x="352" y="246" width="18" height="18" rx="4"/>
<rect x="94" y="290" width="18" height="18" rx="4"/>
<rect x="164" y="298" width="18" height="18" rx="4"/>
<rect x="232" y="286" width="18" height="18" rx="4"/>
<rect x="360" y="292" width="18" height="18" rx="4"/>
<rect x="110" y="344" width="18" height="18" rx="4"/>
<rect x="226" y="338" width="18" height="18" rx="4"/>
<rect x="290" y="346" width="18" height="18" rx="4"/>
<rect x="356" y="340" width="18" height="18" rx="4"/>
</g>
<g fill="var(--warn)">
<rect x="234" y="242" width="18" height="18" rx="4"/>
<rect x="296" y="292" width="18" height="18" rx="4"/>
<rect x="168" y="348" width="18" height="18" rx="4"/>
<rect x="102" y="192" width="0" height="0"/>
<rect x="360" y="238" width="18" height="18" rx="4"/>
<rect x="164" y="186" width="0" height="0"/>
</g>
<text x="255" y="404" font-size="16" text-anchor="middle" fill="var(--dim)">錯過哪些，看不出方向</text>

<line x1="530" y1="386" x2="880" y2="386" stroke="var(--line)" stroke-width="2"/>
<g>
<rect x="546" y="236" width="44" height="150" rx="6" fill="var(--warn)"/>
<text x="568" y="226" font-size="16" text-anchor="middle" fill="var(--warn)">5</text>
<text x="568" y="408" font-size="15" text-anchor="middle" fill="var(--ink)">視覺</text>

<rect x="614" y="296" width="44" height="90" rx="6" fill="var(--grey)"/>
<text x="636" y="286" font-size="16" text-anchor="middle" fill="var(--dim)">3</text>
<text x="636" y="408" font-size="15" text-anchor="middle" fill="var(--ink)">語言</text>

<rect x="682" y="326" width="44" height="60" rx="6" fill="var(--grey)"/>
<text x="704" y="316" font-size="16" text-anchor="middle" fill="var(--dim)">2</text>
<text x="704" y="408" font-size="15" text-anchor="middle" fill="var(--ink)">生成式</text>

<rect x="750" y="356" width="44" height="30" rx="6" fill="var(--grey)"/>
<text x="772" y="346" font-size="16" text-anchor="middle" fill="var(--dim)">1</text>
<text x="772" y="408" font-size="15" text-anchor="middle" fill="var(--ink)">機器學習</text>

<rect x="818" y="356" width="44" height="30" rx="6" fill="var(--grey)"/>
<text x="840" y="346" font-size="16" text-anchor="middle" fill="var(--dim)">1</text>
<text x="840" y="408" font-size="15" text-anchor="middle" fill="var(--ink)">負責任 AI</text>
</g>

<text x="480" y="482" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">同一批錯，堆起來才看得出弱在哪一枝</text>
</svg>
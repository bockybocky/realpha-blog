<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The left column ranks the difficulties as guessed and the right column ranks them as the downstream buyers answered, and one of the three connecting lines jumps from last place to first, making an obvious crossing.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型：繁體中文無襯線 */
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Guess then ask</text>
<text x="92" y="130" font-size="20" font-weight="600" fill="var(--dim)">My guess</text>
<text x="640" y="130" font-size="20" font-weight="600" fill="var(--dim)">Answer</text>
<rect x="92" y="160" width="230" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="116" y="200" font-size="19" fill="var(--ink)">Permit</text>
<rect x="92" y="252" width="230" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="116" y="292" font-size="19" fill="var(--ink)">Build</text>
<rect x="92" y="344" width="230" height="64" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="116" y="384" font-size="19" font-weight="600" fill="var(--accent)">Fuel</text>
<rect x="638" y="160" width="230" height="64" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="662" y="200" font-size="19" font-weight="600" fill="var(--accent)">Fuel</text>
<rect x="638" y="252" width="230" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="662" y="292" font-size="19" fill="var(--ink)">Permit</text>
<rect x="638" y="344" width="230" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="662" y="384" font-size="19" fill="var(--ink)">Build</text>
<path d="M322,192 L638,284" stroke="var(--grey)" stroke-width="3"/>
<path d="M322,284 L638,376" stroke="var(--grey)" stroke-width="3"/>
<path d="M322,376 L638,192" stroke="var(--accent)" stroke-width="6"/>
<text x="400" y="266" font-size="20" font-weight="700" fill="var(--accent)">Gap</text>
<text x="60" y="476" font-size="22" font-weight="600" fill="var(--ink)">The wrong guess is your blind spot</text>
</svg>
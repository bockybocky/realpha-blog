<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="五段首尾相接的橫條，其中一段 30 天的藍條遠長於其他四段，被圈起來">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .ac { fill:var(--accent); }
    .wn { fill:var(--warn); }
    .inv { fill:var(--page); }
</style>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<text x="480" y="50" text-anchor="middle" class="t">把等待拆開，圈出最久那一格</text>
<text x="480" y="82" text-anchor="middle" class="d">示意：一次裝潢，共 47 天</text>
<text x="185" y="132" text-anchor="end" class="b">找師傅</text>
<text x="185" y="188" text-anchor="end" class="b">等報價</text>
<text x="185" y="244" text-anchor="end" class="g ac">訂磁磚</text>
<text x="185" y="300" text-anchor="end" class="b">施工</text>
<text x="185" y="356" text-anchor="end" class="b">驗收</text>
<rect x="200" y="110" width="45" height="32" fill="var(--grey)"/>
<rect x="245" y="166" width="75" height="32" fill="var(--grey)"/>
<rect x="320" y="222" width="450" height="32" fill="var(--accent)"/>
<rect x="770" y="278" width="105" height="32" fill="var(--grey)"/>
<rect x="875" y="334" width="30" height="32" fill="var(--grey)"/>
<text x="253" y="132" class="d">3 天</text>
<text x="328" y="188" class="d">5 天</text>
<text x="545" y="244" text-anchor="middle" class="g inv">30 天</text>
<text x="883" y="300" class="d">7 天</text>
<text x="913" y="356" class="d">2 天</text>
<ellipse cx="545" cy="238" rx="250" ry="34" fill="none" stroke="var(--accent)" stroke-width="3"/>
<line x1="200" y1="385" x2="905" y2="385" stroke="var(--grey)" stroke-width="2"/>
<text x="200" y="408" text-anchor="middle" class="d">0</text>
<text x="350" y="408" text-anchor="middle" class="d">10</text>
<text x="500" y="408" text-anchor="middle" class="d">20</text>
<text x="650" y="408" text-anchor="middle" class="d">30</text>
<text x="800" y="408" text-anchor="middle" class="d">40 天</text>
<text x="480" y="466" text-anchor="middle" class="c">今天先讓這一格開始跑</text>
</svg>
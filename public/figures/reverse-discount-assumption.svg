<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條方向相反的線：其他產業的假設往右上，商品的假設往右下">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">同一個未來，兩套假設</text>

<line x1="150" y1="430" x2="890" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="120" x2="150" y2="430" stroke="var(--line)" stroke-width="2"/>

<line x1="170" y1="380" x2="870" y2="165" stroke="var(--accent)" stroke-width="4"/>
<line x1="170" y1="300" x2="870" y2="402" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 6"/>

<circle cx="870" cy="165" r="7" fill="var(--accent)"/>
<circle cx="870" cy="402" r="7" fill="var(--warn)"/>

<text x="470" y="200" font-size="19" fill="var(--accent)">其他產業｜美元隨年份變薄</text>
<text x="430" y="285" font-size="19" fill="var(--warn)">商品｜美元釘死、價格逐年下修</text>

<text x="160" y="458" font-size="15" fill="var(--dim)">0 年</text>
<text x="840" y="458" font-size="15" fill="var(--dim)">40 年</text>
<text x="470" y="458" font-size="16" fill="var(--dim)">礦權年限</text>
<text x="132" y="280" font-size="16" fill="var(--dim)" transform="rotate(-90 132 280)" text-anchor="middle">模型假設的未來售價</text>

<text x="60" y="502" font-size="22" fill="var(--ink)">年限越長，賣給你的價格反而越便宜</text>
</svg>
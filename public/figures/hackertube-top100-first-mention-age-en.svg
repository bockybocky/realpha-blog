<rect x="92" y="172" width="30" height="30" rx="5"/><rect x="136" y="172" width="30" height="30" rx="5"/><rect x="180" y="172" width="30" height="30" rx="5"/><rect x="224" y="172" width="30" height="30" rx="5"/><rect x="268" y="172" width="30" height="30" rx="5"/><rect x="312" y="172" width="30" height="30" rx="5"/><rect x="356" y="172" width="30" height="30" rx="5"/><rect x="400" y="172" width="30" height="30" rx="5"/><rect x="444" y="172" width="30" height="30" rx="5"/><rect x="488" y="172" width="30" height="30" rx="5"/>
<rect x="92" y="216" width="30" height="30" rx="5"/><rect x="136" y="216" width="30" height="30" rx="5"/><rect x="180" y="216" width="30" height="30" rx="5"/><rect x="224" y="216" width="30" height="30" rx="5"/><rect x="268" y="216" width="30" height="30" rx="5"/><rect x="312" y="216" width="30" height="30" rx="5"/><rect x="356" y="216" width="30" height="30" rx="5"/><rect x="400" y="216" width="30" height="30" rx="5"/><rect x="444" y="216" width="30" height="30" rx="5"/><rect x="488" y="216" width="30" height="30" rx="5"/>
<rect x="92" y="260" width="30" height="30" rx="5"/><rect x="136" y="260" width="30" height="30" rx="5"/><rect x="180" y="260" width="30" height="30" rx="5"/><rect x="224" y="260" width="30" height="30" rx="5"/><rect x="268" y="260" width="30" height="30" rx="5"/><rect x="312" y="260" width="30" height="30" rx="5"/><rect x="356" y="260" width="30" height="30" rx="5"/><rect x="400" y="260" width="30" height="30" rx="5"/><rect x="444" y="260" width="30" height="30" rx="5"/><rect x="488" y="260" width="30" height="30" rx="5"/>

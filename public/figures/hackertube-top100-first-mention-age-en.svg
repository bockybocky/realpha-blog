</g>
<g fill="var(--grey)">
<rect x="92" y="348" width="30" height="30" rx="5"/><rect x="136" y="348" width="30" height="30" rx="5"/><rect x="180" y="348" width="30" height="30" rx="5"/><rect x="224" y="348" width="30" height="30" rx="5"/><rect x="268" y="348" width="30" height="30" rx="5"/><rect x="312" y="348" width="30" height="30" rx="5"/><rect x="356" y="348" width="30" height="30" rx="5"/><rect x="400" y="348" width="30" height="30" rx="5"/><rect x="444" y="348" width="30" height="30" rx="5"/><rect x="488" y="348" width="30" height="30" rx="5"/>
</g>
<g fill="none" stroke="var(--ink)" stroke-width="2">
<rect x="92" y="392" width="30" height="30" rx="5"/><rect x="136" y="392" width="30" height="30" rx="5"/><rect x="180" y="392" width="30" height="30" rx="5"/><rect x="224" y="392" width="30" height="30" rx="5"/><rect x="268" y="392" width="30" height="30" rx="5"/><rect x="312" y="392" width="30" height="30" rx="5"/>
</g>

<rect x="588" y="128" width="30" height="30" rx="5" fill="var(--accent)"/>
<text class="g" x="632" y="150">2017 or earlier</text>
<text class="b" x="632" y="176">Half</text>
<rect x="588" y="212" width="30" height="30" rx="5" fill="var(--grey)"/>
<text class="g" x="632" y="234">Middle years</text>
<text class="b" x="632" y="260">Rest</text>
<rect x="588" y="296" width="30" height="30" rx="5" fill="none" stroke="var(--ink)" stroke-width="2"/>
<text class="g" x="632" y="318">After 2022</text>
<text class="b" x="632" y="344">6 videos</text>

<text class="c" x="60" y="500">It counts months, so newer videos have not had time to accumulate</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two of three figures on the left are darkened to show two thirds died, and an arrow bends toward a three-step rising staircase on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--grey)"/>
    </marker>
  </defs>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">The old script had to collapse before new rules could grow</text>

  <text class="t" x="60" y="116" font-size="20" font-weight="700" fill="var(--ink)">The copied script</text>
  <text class="t" x="60" y="142" font-size="15" fill="var(--dim)">Living off an extracted population</text>
  <rect x="60" y="170" width="86" height="150" rx="10" fill="var(--warn)" opacity="0.28" stroke="var(--line)" stroke-width="2"/>
  <rect x="156" y="170" width="86" height="150" rx="10" fill="var(--warn)" opacity="0.28" stroke="var(--line)" stroke-width="2"/>
  <rect x="252" y="170" width="86" height="150" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="103" y="252" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Starved</text>
  <text class="t" x="199" y="252" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Starved</text>
  <text class="t" x="295" y="252" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Alive</text>
  <text class="t" x="60" y="356" font-size="16" fill="var(--dim)">Two of every three died</text>

  <path d="M 356 246 Q 430 246 430 410 Q 430 470 500 470" fill="none" stroke="var(--grey)" stroke-width="3" marker-end="url(#ah3)"/>
  <text class="t" x="444" y="330" font-size="16" fill="var(--dim)">No one to extract from</text>
  <text class="t" x="444" y="354" font-size="16" fill="var(--dim)">Only another path left</text>

  <rect x="520" y="420" width="128" height="76" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="660" y="330" width="128" height="166" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="800" y="236" width="128" height="260" rx="10" fill="var(--accent)" opacity="0.2" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="584" y="466" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Grant terms</text>
  <text class="t" x="724" y="376" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Set up an assembly</text>
  <text class="t" x="864" y="282" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Open up voting</text>
  <text class="t" x="520" y="180" font-size="20" font-weight="700" fill="var(--ink)">The equilibrium left after no one could win</text>
  <text class="t" x="520" y="206" font-size="15" fill="var(--dim)">Not a charter anyone designed</text>
</svg>
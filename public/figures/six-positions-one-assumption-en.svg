<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Six blocks converge into a single node, which then splits into two opposite outcomes.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="64" font-size="27" fill="var(--ink)">Looks like six positions</text>

  <rect x="42" y="130" width="136" height="58" rx="7" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="110" y="166" font-size="16" fill="var(--ink)" text-anchor="middle">Sensors</text>
  <rect x="190" y="130" width="136" height="58" rx="7" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="258" y="166" font-size="16" fill="var(--ink)" text-anchor="middle">Auto chips</text>
  <rect x="338" y="130" width="136" height="58" rx="7" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="406" y="166" font-size="16" fill="var(--ink)" text-anchor="middle">Simulation</text>
  <rect x="486" y="130" width="136" height="58" rx="7" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="554" y="166" font-size="16" fill="var(--ink)" text-anchor="middle">Machinery</text>
  <rect x="634" y="130" width="136" height="58" rx="7" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="702" y="166" font-size="16" fill="var(--ink)" text-anchor="middle">Power</text>
  <rect x="782" y="130" width="136" height="58" rx="7" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="850" y="166" font-size="16" fill="var(--ink)" text-anchor="middle">Defense</text>

  <line x1="110" y1="188" x2="480" y2="326" stroke="var(--grey)" stroke-width="2"/>
  <line x1="258" y1="188" x2="480" y2="326" stroke="var(--grey)" stroke-width="2"/>
  <line x1="406" y1="188" x2="480" y2="326" stroke="var(--grey)" stroke-width="2"/>
  <line x1="554" y1="188" x2="480" y2="326" stroke="var(--grey)" stroke-width="2"/>
  <line x1="702" y1="188" x2="480" y2="326" stroke="var(--grey)" stroke-width="2"/>
  <line x1="850" y1="188" x2="480" y2="326" stroke="var(--grey)" stroke-width="2"/>

  <rect x="270" y="328" width="420" height="82" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="480" y="362" font-size="20" fill="var(--warn)" text-anchor="middle">One assumption</text>
  <text x="480" y="390" font-size="16" fill="var(--dim)" text-anchor="middle">Physical-world automation lands on schedule</text>

  <line x1="420" y1="410" x2="300" y2="446" stroke="var(--grey)" stroke-width="2"/>
  <line x1="540" y1="410" x2="660" y2="446" stroke="var(--grey)" stroke-width="2"/>
  <text x="270" y="472" font-size="16" fill="var(--dim)" text-anchor="middle">Less friction, all win</text>
  <text x="690" y="472" font-size="16" fill="var(--dim)" text-anchor="middle">More friction, all wait</text>

  <text x="480" y="516" font-size="22" fill="var(--ink)" text-anchor="middle">That is not six positions. It is one.</text>
</svg>
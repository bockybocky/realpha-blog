<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One bar spanning the full width of the chart sits beside one short bar as thin as a line.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.ttl{font-size:27px;font-weight:700}
.grp{font-size:20px;font-weight:700}
.bdy{font-size:16px;fill:var(--dim)}
.cnc{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="ttl" x="60" y="62">Per kill</text>

<text class="grp" x="60" y="178">Shield</text>
<rect x="200" y="156" width="656" height="34" rx="4" fill="var(--accent)"/>
<text class="bdy" x="208" y="222">Patriot, $4M</text>

<text class="grp" x="60" y="328">Attack</text>
<rect x="200" y="306" width="12" height="34" rx="2" fill="var(--grey)" stroke="var(--ink)" stroke-width="1"/>
<text class="bdy" x="228" y="330">Shahed, $50K</text>

<line x1="200" y1="398" x2="856" y2="398" stroke="var(--line)" stroke-width="2"/>
<text class="cnc" x="60" y="462">80:1 doesn't hold</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One start splits into two paths, one reaching a solid working example, the other crossing a long blank to an empty box">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="48" y="54" font-size="27" fill="var(--ink)">Two industries, two choices</text>

  <circle cx="120" cy="300" r="10" fill="var(--ink)"/>
  <text x="120" y="342" font-size="15" fill="var(--dim)" text-anchor="middle">50–60 yrs ago</text>

  <path d="M 130 296 C 200 296, 200 200, 270 200" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <line x1="270" y1="200" x2="640" y2="200" stroke="var(--ink)" stroke-width="3"/>
  <text x="300" y="182" font-size="17" fill="var(--ink)">Stayed</text>
  <text x="452" y="182" font-size="17" fill="var(--ink)">Clean</text>
  <rect x="640" y="170" width="260" height="60" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text x="770" y="207" font-size="18" fill="var(--accent)" text-anchor="middle">An example</text>

  <path d="M 130 304 C 200 304, 200 400, 270 400" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <line x1="270" y1="400" x2="640" y2="400" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="300" y="382" font-size="17" fill="var(--ink)">Left</text>
  <text x="466" y="382" font-size="17" fill="var(--dim)">Decades gap</text>
  <rect x="640" y="370" width="260" height="60" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="770" y="407" font-size="18" fill="var(--warn)" text-anchor="middle">No example</text>

  <text x="770" y="306" font-size="15" fill="var(--dim)" text-anchor="middle">Today</text>
  <text x="48" y="506" font-size="22" fill="var(--ink)">Examples, not arguments</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Two-by-two grid; across: does watching teach, down: can only a person do it; three cells say hand over, the bottom-left says AI presses it">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">When to hand the entry point to a person</text>
<text x="385" y="100" font-size="18" text-anchor="middle" fill="var(--dim)">Nothing to learn</text>
<text x="715" y="100" font-size="18" text-anchor="middle" fill="var(--dim)">Something to learn</text>
<text x="205" y="213" font-size="18" text-anchor="end" fill="var(--dim)">Human only</text>
<text x="205" y="403" font-size="18" text-anchor="end" fill="var(--dim)">AI can</text>
<rect x="220" y="112" width="330" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="550" y="112" width="330" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="550" y="302" width="330" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="222" y="304" width="326" height="186" fill="var(--page)" stroke="var(--warn)" stroke-width="2.5"/>
<text x="385" y="200" font-size="22" font-weight="700" text-anchor="middle" fill="var(--accent)">Hand over</text>
<text x="385" y="234" font-size="16" text-anchor="middle" fill="var(--dim)">Type password</text>
<text x="715" y="214" font-size="22" font-weight="700" text-anchor="middle" fill="var(--accent)">Hand over</text>
<text x="715" y="390" font-size="22" font-weight="700" text-anchor="middle" fill="var(--accent)">Hand over</text>
<text x="715" y="424" font-size="16" text-anchor="middle" fill="var(--dim)">Coworker sees setting</text>
<text x="385" y="382" font-size="22" font-weight="700" text-anchor="middle" fill="var(--warn)">AI presses it</text>
<text x="385" y="414" font-size="16" text-anchor="middle" fill="var(--dim)">Login button</text>
<text x="385" y="446" font-size="15" text-anchor="middle" fill="var(--warn)">Handing it = pushing it back</text>
<text x="60" y="556" font-size="22" font-weight="700" fill="var(--ink)">Only one cell is the AI's to do</text>
</svg>
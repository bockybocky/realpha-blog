<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two mirrored pairs of blocks with a center line for one property: rigid versus brittle, smooth versus non-adhesive">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:20px; font-weight:700; fill:var(--ink); }
    .bd  { font-size:16px; fill:var(--dim); }
    .sm  { font-size:15px; fill:var(--dim); }
    .cc  { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="ttl" x="60" y="58">The back of the advantage says the same thing</text>

  <text class="bd" x="285" y="118" text-anchor="middle">The side you want</text>
  <text class="bd" x="675" y="118" text-anchor="middle">The side that comes with it</text>
  <line x1="480" y1="140" x2="480" y2="400" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 7"/>

  <rect x="140" y="166" width="290" height="76" rx="12" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
  <text class="grp" x="285" y="212" text-anchor="middle" fill="var(--accent)">Rigid, so it doesn't warp</text>
  <rect x="530" y="166" width="290" height="76" rx="12" fill="var(--warn)" fill-opacity="0.16" stroke="var(--warn)" stroke-width="2"/>
  <text class="grp" x="675" y="212" text-anchor="middle" fill="var(--warn)">Rigid, so it is brittle</text>

  <rect x="140" y="290" width="290" height="76" rx="12" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
  <text class="grp" x="285" y="336" text-anchor="middle" fill="var(--accent)">Smooth, so lines can be fine</text>
  <rect x="530" y="290" width="290" height="76" rx="12" fill="var(--warn)" fill-opacity="0.16" stroke="var(--warn)" stroke-width="2"/>
  <text class="grp" x="675" y="336" text-anchor="middle" fill="var(--warn)">Smooth, so nothing sticks</text>

  <circle cx="480" cy="266" r="34" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text class="sm" x="480" y="262" text-anchor="middle">One and</text>
  <text class="sm" x="480" y="282" text-anchor="middle">the same</text>

  <text class="cc" x="60" y="464">You can't keep only half; plan for the other face in advance</text>
</svg>
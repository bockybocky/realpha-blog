<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The same question moves from first place in the left column to third place in the right column, with an arc marking the drop.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <defs>
    <marker id="ar5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">Same question, different rank</text>

  <text class="g" x="120" y="122">The usual view</text>
  <rect x="120" y="150" width="320" height="70" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="g" x="146" y="193">① Has it run up a lot</text>
  <rect x="120" y="240" width="320" height="70" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="146" y="283">② Is it cheap</text>
  <rect x="120" y="330" width="320" height="70" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="146" y="373">③ What is the business</text>

  <text class="g" x="540" y="122">His order</text>
  <rect x="540" y="150" width="320" height="70" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="566" y="193">① Leader in a new field</text>
  <rect x="540" y="240" width="320" height="70" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="566" y="283">② An edge that lasts</text>
  <rect x="540" y="330" width="320" height="70" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="g" x="566" y="373">③ Has it run up a lot</text>

  <path d="M440,185 C495,185 485,365 532,365" fill="none" stroke="var(--accent)"
        stroke-width="3" marker-end="url(#ar5)"/>

  <text class="c" x="120" y="480">The same fact turns from obstacle to evidence once you move it</text>
</svg>
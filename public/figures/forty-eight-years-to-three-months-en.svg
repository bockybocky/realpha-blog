<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On one scale, forty-eight years fills the whole width and three months is a line almost too thin to see.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Two answers, one scale</text>
  <text class="t" x="60" y="86" font-size="16" fill="var(--dim)">Time to clear the CA backlog</text>

  <text class="t" x="60" y="140" font-size="20" fill="var(--dim)">From reports</text>
  <rect x="60" y="156" width="800" height="54" rx="6" fill="var(--grey)"/>
  <text class="t" x="876" y="192" font-size="20" fill="var(--ink)">48 yrs</text>

  <text class="t" x="60" y="268" font-size="20" fill="var(--dim)">Nails pulled</text>
  <rect x="60" y="284" width="4" height="54" rx="2" fill="var(--accent)"/>
  <line x1="64" y1="311" x2="200" y2="311" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="212" y="318" font-size="20" fill="var(--accent)">3 months</text>

  <text class="t" x="60" y="400" font-size="19" fill="var(--ink)">Nails</text>
  <rect x="60" y="416" width="250" height="60" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="185" y="453" font-size="17" text-anchor="middle" fill="var(--dim)">30-char address</text>
  <rect x="330" y="416" width="250" height="60" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="455" y="453" font-size="17" text-anchor="middle" fill="var(--dim)">Scans drop red</text>
  <rect x="600" y="416" width="250" height="60" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="725" y="453" font-size="17" text-anchor="middle" fill="var(--dim)">Empty desks</text>
</svg>
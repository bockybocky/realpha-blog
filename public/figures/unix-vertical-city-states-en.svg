<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Four walled three-layer columns, with the horizontal arrows between them crossed out.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">Four city-states, early 1990s</text>

<g>
<rect x="70" y="120" width="170" height="290" rx="10" fill="none" stroke="var(--line)" stroke-width="3"/>
<text class="g" x="155" y="150" text-anchor="middle">Sun</text>
<rect x="90" y="166" width="130" height="66" rx="6" fill="var(--card)"/>
<text class="b" x="155" y="205" text-anchor="middle">Solaris</text>
<rect x="90" y="242" width="130" height="66" rx="6" fill="var(--grey)"/>
<text class="b" x="155" y="281" text-anchor="middle" fill="var(--page)">SPARC</text>
<rect x="90" y="318" width="130" height="66" rx="6" fill="var(--card)"/>
<text class="b" x="155" y="357" text-anchor="middle">Services</text>
</g>
<g>
<rect x="268" y="120" width="170" height="290" rx="10" fill="none" stroke="var(--line)" stroke-width="3"/>
<text class="g" x="353" y="150" text-anchor="middle">IBM</text>
<rect x="288" y="166" width="130" height="66" rx="6" fill="var(--card)"/>
<text class="b" x="353" y="205" text-anchor="middle">AIX</text>
<rect x="288" y="242" width="130" height="66" rx="6" fill="var(--grey)"/>
<text class="b" x="353" y="281" text-anchor="middle" fill="var(--page)">POWER</text>
<rect x="288" y="318" width="130" height="66" rx="6" fill="var(--card)"/>
<text class="b" x="353" y="357" text-anchor="middle">Services</text>
</g>
<g>
<rect x="466" y="120" width="170" height="290" rx="10" fill="none" stroke="var(--line)" stroke-width="3"/>
<text class="g" x="551" y="150" text-anchor="middle">HP</text>
<rect x="486" y="166" width="130" height="66" rx="6" fill="var(--card)"/>
<text class="b" x="551" y="205" text-anchor="middle">HP-UX</text>
<rect x="486" y="242" width="130" height="66" rx="6" fill="var(--grey)"/>
<text class="b" x="551" y="281" text-anchor="middle" fill="var(--page)">PA-RISC</text>
<rect x="486" y="318" width="130" height="66" rx="6" fill="var(--card)"/>
<text class="b" x="551" y="357" text-anchor="middle">Services</text>
</g>
<g>
<rect x="664" y="120" width="170" height="290" rx="10" fill="none" stroke="var(--line)" stroke-width="3"/>
<text class="g" x="749" y="150" text-anchor="middle">SGI</text>
<rect x="684" y="166" width="130" height="66" rx="6" fill="var(--card)"/>
<text class="b" x="749" y="205" text-anchor="middle">IRIX</text>
<rect x="684" y="242" width="130" height="66" rx="6" fill="var(--grey)"/>
<text class="b" x="749" y="281" text-anchor="middle" fill="var(--page)">MIPS</text>
<rect x="684" y="318" width="130" height="66" rx="6" fill="var(--card)"/>
<text class="b" x="749" y="357" text-anchor="middle">Services</text>
</g>

<g stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6">
<line x1="250" y1="440" x2="330" y2="440"/>
<line x1="448" y1="440" x2="528" y2="440"/>
<line x1="646" y1="440" x2="726" y2="440"/>
</g>
<g stroke="var(--warn)" stroke-width="4">
<line x1="278" y1="428" x2="302" y2="452"/><line x1="302" y1="428" x2="278" y2="452"/>
<line x1="476" y1="428" x2="500" y2="452"/><line x1="500" y1="428" x2="476" y2="452"/>
<line x1="674" y1="428" x2="698" y2="452"/><line x1="698" y1="428" x2="674" y2="452"/>
</g>

<text class="c" x="60" y="505">Swap one, swap all three</text>
</svg>
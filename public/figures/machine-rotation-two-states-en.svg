<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two panels: in calm times four bars cancel out to near zero; when a shock hits the same bars shrink to thin strips on the zero line">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="50" y="58" font-size="27" font-weight="700" fill="var(--ink)">Two states</text>

  <rect x="50" y="95" width="410" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="95" width="410" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>

  <text x="72" y="132" font-size="20" font-weight="600" fill="var(--ink)">Calm times</text>
  <text x="522" y="132" font-size="20" font-weight="600" fill="var(--ink)">Real shock</text>
  <text x="438" y="132" font-size="16" text-anchor="end" fill="var(--dim)">Sum ≈ 0</text>
  <text x="888" y="132" font-size="20" font-weight="700" text-anchor="end" fill="var(--warn)">Off</text>

  <line x1="72" y1="300" x2="438" y2="300" stroke="var(--line)" stroke-width="2"/>
  <line x1="522" y1="300" x2="888" y2="300" stroke="var(--line)" stroke-width="2"/>

  <rect x="110" y="300" width="46" height="80" fill="var(--grey)"/>
  <rect x="190" y="242" width="46" height="58" fill="var(--accent)"/>
  <rect x="270" y="228" width="46" height="72" fill="var(--accent)"/>
  <rect x="350" y="300" width="46" height="50" fill="var(--grey)"/>

  <text x="133" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">Semis</text>
  <text x="213" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">Apple</text>
  <text x="293" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">Health</text>
  <text x="373" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">Others</text>

  <rect x="560" y="294" width="46" height="10" fill="var(--grey)"/>
  <rect x="640" y="294" width="46" height="10" fill="var(--grey)"/>
  <rect x="720" y="294" width="46" height="10" fill="var(--grey)"/>
  <rect x="800" y="294" width="46" height="10" fill="var(--grey)"/>

  <text x="583" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">Semis</text>
  <text x="663" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">Apple</text>
  <text x="743" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">Health</text>
  <text x="823" y="404" font-size="15" text-anchor="middle" fill="var(--dim)">Others</text>

  <text x="705" y="245" font-size="16" text-anchor="middle" fill="var(--dim)">Wide spreads·thin</text>

  <text x="480" y="490" font-size="22" font-weight="600" text-anchor="middle" fill="var(--ink)">Weather, not disconnection</text>
</svg>
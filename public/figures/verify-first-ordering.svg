<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="上下兩格對比，先讀一堆會溢出，先定驗證量再回推讀量則剛好收完">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">先讀，還是先框驗證量</text>

<text x="60" y="110" font-size="19" fill="var(--dim)">之前</text>
<rect x="60" y="130" width="420" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="270" y="178" font-size="19" fill="var(--ink)" text-anchor="middle">讀一大堆</text>
<path d="M490 170 L560 170" stroke="var(--grey)" stroke-width="3"/>
<path d="M560 170 l-14 -7 l0 14 z" fill="var(--grey)"/>
<rect x="570" y="130" width="130" height="80" fill="var(--grey)" opacity="0.5" stroke="var(--line)" stroke-width="2"/>
<text x="635" y="178" font-size="16" fill="var(--ink)" text-anchor="middle">驗得完的</text>
<g fill="var(--warn)">
<circle cx="740" cy="140" r="9"/><circle cx="775" cy="162" r="9"/><circle cx="745" cy="188" r="9"/>
<circle cx="805" cy="140" r="9"/><circle cx="812" cy="190" r="9"/><circle cx="778" cy="210" r="9"/>
</g>
<text x="880" y="178" font-size="16" fill="var(--warn)" text-anchor="end">剩下的只能猜</text>

<line x1="60" y1="270" x2="900" y2="270" stroke="var(--line)" stroke-width="2"/>

<text x="60" y="320" font-size="19" fill="var(--dim)">之後</text>
<rect x="60" y="340" width="130" height="80" fill="var(--accent)"/>
<text x="125" y="388" font-size="16" fill="var(--page)" text-anchor="middle">我能驗幾檔</text>
<path d="M200 380 L270 380" stroke="var(--accent)" stroke-width="3"/>
<path d="M270 380 l-14 -7 l0 14 z" fill="var(--accent)"/>
<rect x="280" y="340" width="190" height="80" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="375" y="388" font-size="16" fill="var(--ink)" text-anchor="middle">回推讀幾份</text>
<path d="M480 380 L550 380" stroke="var(--accent)" stroke-width="3"/>
<path d="M550 380 l-14 -7 l0 14 z" fill="var(--accent)"/>
<rect x="560" y="340" width="190" height="80" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="655" y="388" font-size="16" fill="var(--ink)" text-anchor="middle">全部驗完</text>
<text x="790" y="388" font-size="16" fill="var(--accent)">沒有剩下的</text>

<text x="480" y="520" font-size="22" fill="var(--ink)" text-anchor="middle">瓶頸在驗證，排序就從驗證開始</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left a whole row of shoppers is marked down; on the right only one in the same row is tagged.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t  { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Who gets the discount</text>

<text class="t" x="60" y="130" font-size="20" fill="var(--warn)">Storewide sale</text>
<line x1="60" y1="150" x2="900" y2="150" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="120" y="186" width="60" height="70" rx="5" fill="var(--warn)" opacity="0.8"/>
<rect x="210" y="186" width="60" height="70" rx="5" fill="var(--warn)" opacity="0.8"/>
<rect x="300" y="186" width="60" height="70" rx="5" fill="var(--warn)" opacity="0.8"/>
<rect x="390" y="186" width="60" height="70" rx="5" fill="var(--warn)" opacity="0.8"/>
<rect x="480" y="186" width="60" height="70" rx="5" fill="var(--warn)" opacity="0.8"/>
<rect x="570" y="186" width="60" height="70" rx="5" fill="var(--warn)" opacity="0.8"/>
<rect x="660" y="186" width="60" height="70" rx="5" fill="var(--warn)" opacity="0.8"/>
<rect x="750" y="186" width="60" height="70" rx="5" fill="var(--warn)" opacity="0.8"/>
<text class="t" x="120" y="286" font-size="16" fill="var(--dim)">Shoppers who would pay full price get it too</text>

<text class="t" x="60" y="358" font-size="20" fill="var(--accent)">Personalized 0% APR</text>
<line x1="60" y1="378" x2="900" y2="378" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="120" y="398" width="60" height="70" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="210" y="398" width="60" height="70" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="300" y="398" width="60" height="70" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="390" y="398" width="60" height="70" rx="5" fill="var(--accent)"/>
<rect x="480" y="398" width="60" height="70" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="570" y="398" width="60" height="70" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="660" y="398" width="60" height="70" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="750" y="398" width="60" height="70" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="390" y="496" font-size="16" fill="var(--accent)">Only for the ones who need that nudge</text>
</svg>
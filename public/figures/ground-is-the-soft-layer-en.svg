<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A three-layer stack in which the weakest layer sits at the bottom, with an arrow running up from the bottom through the stack.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">The weakest layer is at the bottom</text>

<rect x="150" y="96" width="560" height="96" rx="12" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<text x="180" y="140" font-size="20" font-weight="700" fill="var(--ink)">The satellite itself</text>
<text x="180" y="168" font-size="16" fill="var(--dim)">A sealed metal shell</text>
<text x="740" y="152" font-size="19" font-weight="700" fill="var(--grey)">Hard in</text>

<rect x="150" y="216" width="560" height="96" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="180" y="260" font-size="20" font-weight="700" fill="var(--ink)">Inter-satellite links</text>
<text x="180" y="288" font-size="16" fill="var(--dim)">Satellite to satellite</text>

<rect x="150" y="336" width="560" height="120" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<rect x="150" y="376" width="22" height="44" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
<text x="196" y="382" font-size="20" font-weight="700" fill="var(--ink)">Ground systems</text>
<text x="196" y="414" font-size="16" fill="var(--dim)">Command networks　Mission processing</text>
<text x="740" y="406" font-size="19" font-weight="700" fill="var(--warn)">Easy in</text>

<polygon points="96,456 118,456 118,140 136,140 107,92 78,140 96,140" fill="var(--warn)"/>
<text x="60" y="486" font-size="16" fill="var(--warn)">This is where they come in</text>

<text x="60" y="520" font-size="22" font-weight="700" fill="var(--ink)">The door is at the bottom; the eyes stay on the top.</text>
</svg>
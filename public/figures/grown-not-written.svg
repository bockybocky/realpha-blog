<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="雜亂散點經過一道箭頭變成整齊點陣，下方問為什麼是這一組，答案空白">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="80">養，不是寫</text>

  <rect x="80" y="130" width="280" height="230" rx="10" fill="var(--card)"/>
  <text class="g" x="220" y="165" text-anchor="middle">隨機起點</text>
  <circle cx="128" cy="222" r="5" fill="var(--grey)"/>
  <circle cx="172" cy="196" r="5" fill="var(--grey)"/>
  <circle cx="205" cy="256" r="5" fill="var(--grey)"/>
  <circle cx="251" cy="205" r="5" fill="var(--grey)"/>
  <circle cx="294" cy="243" r="5" fill="var(--grey)"/>
  <circle cx="318" cy="192" r="5" fill="var(--grey)"/>
  <circle cx="147" cy="291" r="5" fill="var(--grey)"/>
  <circle cx="232" cy="318" r="5" fill="var(--grey)"/>
  <circle cx="276" cy="297" r="5" fill="var(--grey)"/>
  <circle cx="326" cy="330" r="5" fill="var(--grey)"/>
  <circle cx="188" cy="340" r="5" fill="var(--grey)"/>
  <circle cx="110" cy="325" r="5" fill="var(--grey)"/>
  <text class="b" x="220" y="390" text-anchor="middle">一兆個變數</text>

  <path d="M385 245 L575 245" stroke="var(--accent)" stroke-width="3"/>
  <path d="M575 245 L558 236 L558 254 Z" fill="var(--accent)"/>
  <text class="b" x="480" y="222" text-anchor="middle">餵資料</text>
  <text class="b" x="480" y="282" text-anchor="middle">往上調一點，不行就往下</text>
  <text class="b" x="480" y="310" text-anchor="middle">跑一兆次</text>

  <rect x="600" y="130" width="280" height="230" rx="10" fill="var(--card)"/>
  <text class="g" x="740" y="165" text-anchor="middle">停在某一組設定</text>
  <circle cx="650" cy="210" r="5" fill="var(--accent)"/>
  <circle cx="695" cy="210" r="5" fill="var(--accent)"/>
  <circle cx="740" cy="210" r="5" fill="var(--accent)"/>
  <circle cx="785" cy="210" r="5" fill="var(--accent)"/>
  <circle cx="830" cy="210" r="5" fill="var(--accent)"/>
  <circle cx="650" cy="255" r="5" fill="var(--accent)"/>
  <circle cx="695" cy="255" r="5" fill="var(--accent)"/>
  <circle cx="740" cy="255" r="5" fill="var(--accent)"/>
  <circle cx="785" cy="255" r="5" fill="var(--accent)"/>
  <circle cx="830" cy="255" r="5" fill="var(--accent)"/>
  <circle cx="650" cy="300" r="5" fill="var(--accent)"/>
  <circle cx="695" cy="300" r="5" fill="var(--accent)"/>
  <circle cx="740" cy="300" r="5" fill="var(--accent)"/>
  <circle cx="785" cy="300" r="5" fill="var(--accent)"/>
  <circle cx="830" cy="300" r="5" fill="var(--accent)"/>
  <text class="b" x="740" y="390" text-anchor="middle">會講話，會解數學題</text>

  <text class="c" x="80" y="462">為什麼是這一組？</text>
  <text class="c" x="330" y="462" fill="var(--warn)">不知道</text>
  <text class="b" x="80" y="500">人寫的只有那段調整規則，不是這組答案</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="長條只有左段是亮的，其餘三段是灰的，下方一小段做比例參照">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">帳面上的存貨，有多少真的買得到</text>

<text x="120" y="152" font-size="20" font-weight="700" fill="var(--ink)">帳面 14 億磅</text>
<rect x="120" y="170" width="232" height="110" fill="var(--accent)"/>
<rect x="352" y="170" width="170" height="110" fill="var(--grey)"/>
<rect x="522" y="170" width="170" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="692" y="170" width="148" height="110" fill="var(--grey)"/>
<text x="236" y="232" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">會流進市場</text>
<text x="236" y="260" font-size="16" fill="var(--page)" text-anchor="middle">4 至 5 億磅</text>
<text x="437" y="232" font-size="17" fill="var(--ink)" text-anchor="middle">要重新濃縮</text>
<text x="607" y="232" font-size="17" fill="var(--ink)" text-anchor="middle">貧化尾料</text>
<text x="766" y="232" font-size="17" fill="var(--ink)" text-anchor="middle">鎖在主權基金</text>

<text x="120" y="352" font-size="20" font-weight="700" fill="var(--ink)">一年用掉</text>
<rect x="120" y="370" width="103" height="56" fill="var(--warn)"/>
<text x="240" y="406" font-size="19" fill="var(--dim)">約 2 億磅</text>

<text x="60" y="488" font-size="22" font-weight="700" fill="var(--ink)">「永遠不必再買」是拿整條在算</text>
</svg>
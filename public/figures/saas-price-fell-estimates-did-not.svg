<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="股價線在春天深跌後彈回，盈餘預估線全程水平">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  .ttl{font-size:27px;fill:var(--ink);font-weight:700}
  .lbl{font-size:19px;fill:var(--ink);font-weight:600}
  .txt{font-size:16px;fill:var(--dim)}
  .cc{font-size:22px;fill:var(--ink);font-weight:600}
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="ttl" x="60" y="62">跌的是信心，不是預估</text>
<rect x="300" y="110" width="230" height="330" fill="var(--card)"/>
<text class="txt" x="415" y="134" text-anchor="middle">春天</text>
<polyline points="120,196 250,206 330,262 420,344 500,318 620,244 760,206 890,182" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
<polyline points="120,394 300,390 500,388 700,384 890,380" fill="none" stroke="var(--grey)" stroke-width="3.5"/>
<text class="lbl" x="120" y="172" fill="var(--accent)">股價</text>
<text class="lbl" x="890" y="416" text-anchor="end">盈餘預估</text>
<text class="txt" x="620" y="366" text-anchor="middle">一格都沒動</text>
<line x1="620" y1="376" x2="620" y2="386" stroke="var(--grey)" stroke-width="2"/>
<text class="cc" x="60" y="496">數字沒變壞，是大家不信它撐得住</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="官方說法的兩條長橫條與衛星估計的短橫條對比">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; } .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); } .c { font-size:22px; font-weight:700; }
</style>
<text x="40" y="50" class="t">九月荷莫茲海峽每天幾桶？（萬桶）</text>
<text x="240" y="147" class="g" text-anchor="end">總統說</text>
<rect x="260" y="110" width="600" height="56" fill="var(--grey)"/>
<text x="845" y="147" class="g" text-anchor="end">1,800</text>
<text x="240" y="247" class="g" text-anchor="end">能源部長說</text>
<rect x="260" y="210" width="300" height="56" fill="var(--grey)"/>
<text x="545" y="247" class="g" text-anchor="end">900</text>
<rect x="560" y="210" width="140" height="56" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text x="630" y="244" class="b" text-anchor="middle" style="fill:var(--warn)">＋繞道</text>
<text x="715" y="244" class="b" style="fill:var(--warn)">重複計算</text>
<text x="240" y="347" class="g" text-anchor="end">衛星裝船估</text>
<rect x="260" y="310" width="167" height="56" fill="var(--accent)"/>
<rect x="427" y="310" width="33" height="56" fill="var(--accent)" fill-opacity="0.4"/>
<text x="475" y="347" class="g">500–600</text>
<text x="480" y="450" class="c" text-anchor="middle">說法 ≠ 船數 → 看運費與價差</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Of three gaps, only the first is covered; the other two remain open.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">Worktrees cover one of the three gaps</text>

  <rect x="60" y="118" width="250" height="58" rx="10" fill="var(--accent)"/>
  <text class="t" x="185" y="155" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">Worktree cover</text>

  <rect x="340" y="131" width="560" height="32" rx="8" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="t" x="620" y="154" font-size="16" fill="var(--dim)" text-anchor="middle">The cover stops here</text>

  <rect x="60" y="230" width="250" height="250" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="t" x="185" y="282" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">File conflict</text>
  <text class="t" x="185" y="316" font-size="16" fill="var(--dim)" text-anchor="middle">Overwriting each other</text>
  <text class="t" x="185" y="402" font-size="22" font-weight="700" fill="var(--accent)" text-anchor="middle">Solved</text>
  <text class="t" x="185" y="436" font-size="16" fill="var(--dim)" text-anchor="middle">Loud when it breaks</text>

  <rect x="340" y="230" width="250" height="250" rx="14" fill="var(--page)" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text class="t" x="465" y="282" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Quota conflict</text>
  <text class="t" x="465" y="316" font-size="16" fill="var(--dim)" text-anchor="middle">One seat, one subscription</text>
  <text class="t" x="465" y="402" font-size="22" font-weight="700" fill="var(--warn)" text-anchor="middle">Still open</text>
  <text class="t" x="465" y="436" font-size="16" fill="var(--dim)" text-anchor="middle">Found only at month end</text>

  <rect x="620" y="230" width="250" height="250" rx="14" fill="var(--page)" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text class="t" x="745" y="282" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Attention conflict</text>
  <text class="t" x="745" y="316" font-size="16" fill="var(--dim)" text-anchor="middle">Only you review</text>
  <text class="t" x="745" y="402" font-size="22" font-weight="700" fill="var(--warn)" text-anchor="middle">Still open</text>
  <text class="t" x="745" y="436" font-size="16" fill="var(--dim)" text-anchor="middle">Piling up quietly</text>
</svg>
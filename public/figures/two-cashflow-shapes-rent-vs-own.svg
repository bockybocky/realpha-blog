<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="播出方的現金流在停拍當天歸零，版權方的現金流前期為負、之後延伸三十年">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="80" y="70">兩種現金流的形狀</text>
<line x1="80" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="80" y="326">零</text>
<line x1="420" y1="120" x2="420" y2="440" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text class="b" x="432" y="140">1998 停拍</text>
<path d="M120 268 L200 230 L280 196 L360 176 L420 172" fill="none" stroke="var(--grey)" stroke-width="5"/>
<path d="M420 172 L420 300" fill="none" stroke="var(--grey)" stroke-width="5"/>
<circle cx="420" cy="300" r="7" fill="var(--grey)"/>
<text class="g" x="120" y="196" fill="var(--dim)">播出權</text>
<text class="b" x="446" y="296">殘值零</text>
<path d="M120 340 L180 368 L240 384 L300 352 L352 300" fill="none" stroke="var(--accent)" stroke-width="5"/>
<path d="M352 300 L420 252 L560 236 L720 244 L900 240" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="352" cy="300" r="7" fill="var(--accent)"/>
<text class="g" x="120" y="420" fill="var(--accent)">版權</text>
<text class="b" x="200" y="420">前九年每集都在虧</text>
<text class="b" x="640" y="222">之後收三十年</text>
<text class="c" x="80" y="516">兩邊的損益表都好看，一邊是租約到期，一邊是資產</text>
</svg>
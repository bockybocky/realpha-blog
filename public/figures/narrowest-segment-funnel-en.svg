<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A pipe narrowing sharply from very wide to very thin: millions of filings at the entrance, staff in the middle, prosecutions at the exit.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="h" x="60" y="58">The narrowest segment sets the output of the whole chain</text>
<polygon points="100,130 520,258 520,302 100,430" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="520,258 760,272 760,288 520,302" fill="var(--accent)"/>
<rect x="760" y="272" width="120" height="16" fill="var(--accent)"/>
<text class="g" x="120" y="290">Millions of filings</text>
<text class="b" x="120" y="320">Backed by rules and penalties</text>
<text class="g" x="540" y="240" fill="var(--accent)">Staff who can read them</text>
<text class="b" x="540" y="345">Nobody owns this part</text>
<text class="g" x="770" y="250">Prosecutions</text>
<line x1="60" y1="410" x2="900" y2="410" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="60" y="462">The inputs are visible, the bottleneck isn't</text>
<text class="b" x="60" y="494">$200B and tens of thousands of compliance staff, all at the widest end</text>
</svg>
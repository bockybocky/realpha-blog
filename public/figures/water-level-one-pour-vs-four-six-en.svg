<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The left brewer's water sits close to the rim, while the right brewer, filled in five pours, holds less than half that level.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">Water level in the cone differs 2.5x</text>

<rect x="48" y="90" width="420" height="360" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="72" y="126" font-size="20" font-weight="700" fill="var(--ink)">Single pour</text>
<text x="444" y="126" font-size="16" text-anchor="end" fill="var(--dim)">1 pour</text>
<path d="M 148 160 L 368 160 L 282 400 L 234 400 Z" fill="none" stroke="var(--grey)" stroke-width="2"/>
<path d="M 160 194 L 356 194 L 282 400 L 234 400 Z" fill="var(--accent)" opacity="0.28"/>
<line x1="160" y1="194" x2="356" y2="194" stroke="var(--accent)" stroke-width="3"/>
<text x="372" y="200" font-size="16" font-weight="700" fill="var(--accent)">133 g</text>
<text x="258" y="432" font-size="15" text-anchor="middle" fill="var(--dim)">Level</text>

<rect x="492" y="90" width="420" height="360" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="516" y="126" font-size="20" font-weight="700" fill="var(--ink)">4:6 method</text>
<text x="888" y="126" font-size="16" text-anchor="end" fill="var(--dim)">5 pours</text>
<path d="M 592 160 L 812 160 L 726 400 L 678 400 Z" fill="none" stroke="var(--grey)" stroke-width="2"/>
<path d="M 672 320 L 732 320 L 726 400 L 678 400 Z" fill="var(--accent)" opacity="0.28"/>
<line x1="672" y1="320" x2="732" y2="320" stroke="var(--accent)" stroke-width="3"/>
<text x="748" y="326" font-size="16" font-weight="700" fill="var(--accent)">51 g</text>
<g stroke="var(--accent)" stroke-width="3" stroke-linecap="round">
<line x1="636" y1="176" x2="636" y2="200"/>
<line x1="672" y1="176" x2="672" y2="200"/>
<line x1="708" y1="176" x2="708" y2="200"/>
<line x1="744" y1="176" x2="744" y2="200"/>
<line x1="780" y1="176" x2="780" y2="200"/>
</g>
<text x="708" y="432" font-size="15" text-anchor="middle" fill="var(--dim)">one-fifth each</text>

<text x="48" y="500" font-size="22" font-weight="700" fill="var(--ink)">Pour style moves the water level most</text>
<text x="48" y="532" font-size="15" fill="var(--dim)">Yields 19.0% and 21.2%, both in range; model numbers</text>
</svg>
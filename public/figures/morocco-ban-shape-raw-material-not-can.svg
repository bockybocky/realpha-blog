<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="摩洛哥海域分成上下兩條路，上路的冷凍原料被閘門擋下，下路的罐頭成品照常出口">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="56" y="60" font-size="27" font-weight="700" fill="var(--ink)">禁令擋的是哪一段</text>

  <rect x="48" y="232" width="180" height="104" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="138" y="278" font-size="19" text-anchor="middle" fill="var(--ink)">摩洛哥海域</text>
  <text x="138" y="306" font-size="15" text-anchor="middle" fill="var(--dim)">沙丁魚</text>

  <path d="M228 284 H272 V152 H310" fill="none" stroke="var(--line)" stroke-width="3"/>
  <path d="M228 284 H272 V420 H310" fill="none" stroke="var(--line)" stroke-width="3"/>

  <rect x="316" y="112" width="210" height="80" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="421" y="148" font-size="19" text-anchor="middle" fill="var(--ink)">冷凍原料</text>
  <text x="421" y="174" font-size="15" text-anchor="middle" fill="var(--dim)">出口</text>

  <path d="M526 152 H578" fill="none" stroke="var(--line)" stroke-width="3"/>
  <path d="M592 108 V196" stroke="var(--warn)" stroke-width="7" stroke-linecap="round"/>
  <text x="592" y="92" font-size="19" text-anchor="middle" fill="var(--warn)">擋</text>

  <rect x="650" y="112" width="240" height="80" rx="12" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="770" y="148" font-size="19" text-anchor="middle" fill="var(--dim)">西班牙罐頭廠</text>
  <text x="770" y="174" font-size="15" text-anchor="middle" fill="var(--grey)">原料九成靠它</text>

  <rect x="316" y="380" width="210" height="80" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="421" y="416" font-size="19" text-anchor="middle" fill="var(--ink)">摩洛哥罐頭廠</text>
  <text x="421" y="442" font-size="15" text-anchor="middle" fill="var(--dim)">境內加工</text>

  <path d="M526 420 H636" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="650,420 634,412 634,428" fill="var(--accent)"/>

  <rect x="650" y="380" width="240" height="80" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="770" y="416" font-size="19" text-anchor="middle" fill="var(--accent)">罐頭成品</text>
  <text x="770" y="442" font-size="15" text-anchor="middle" fill="var(--dim)">照常出口</text>

  <text x="480" y="524" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">擋原料，不擋成品</text>
</svg>
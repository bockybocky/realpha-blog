<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三層由大到小套疊的方框，代表名單、便宜、市場表態三層收斂">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">漲停照買的底氣來自外面那兩層</text>
<rect x="150" y="110" width="660" height="390" fill="var(--card)" stroke="var(--line)" stroke-width="2" rx="10"/>
<text class="t" x="480" y="146" font-size="20" fill="var(--dim)" text-anchor="middle">事前寫好的二十檔</text>
<rect x="250" y="172" width="460" height="290" fill="var(--page)" stroke="var(--grey)" stroke-width="3" rx="10"/>
<text class="t" x="480" y="208" font-size="20" fill="var(--dim)" text-anchor="middle">其中帶便宜的十檔</text>
<rect x="350" y="236" width="260" height="190" fill="var(--accent)" rx="10"/>
<text class="t" x="480" y="330" font-size="20" fill="var(--page)" text-anchor="middle">今天有人願意買</text>
<text class="t" x="480" y="362" font-size="16" fill="var(--page)" text-anchor="middle">他才出手</text>
<text class="t" x="60" y="538" font-size="22" fill="var(--ink)">少掉外面兩層，剩下的只是追漲停</text>
</svg>
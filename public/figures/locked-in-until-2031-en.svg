<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four bars on a timeline stretch from today to between 2029 and 2031, their length showing the years of capacity locked up.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--dim); }
.b { font-size:16px; fill:var(--ink); }
.s { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="66">How far out capacity is signed</text>

<line x1="120" y1="150" x2="120" y2="470" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="s" x="126" y="140" fill="var(--warn)">Today</text>

<line x1="120" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--dim)" font-size="15px" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="102" y="498">2026</text>
<text x="232" y="498">2027</text>
<text x="362" y="498">2028</text>
<text x="492" y="498">2029</text>
<text x="622" y="498">2030</text>
<text x="752" y="498">2031</text>
<text x="866" y="498">2032</text>
</g>

<rect x="120" y="180" width="650" height="36" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="138" y="204">A memory maker　about 70% of capacity</text>
<text class="s" x="786" y="204" fill="var(--accent)">2031</text>

<rect x="120" y="234" width="520" height="36" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="138" y="258">Advanced packaging capacity</text>
<text class="s" x="656" y="258" fill="var(--accent)">2030</text>

<rect x="120" y="288" width="520" height="36" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="138" y="312">Older-generation memory capacity</text>
<text class="s" x="656" y="312" fill="var(--accent)">2029 to 2030</text>

<rect x="120" y="342" width="520" height="36" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="138" y="366">Optical long-term deals</text>
<text class="s" x="656" y="366" fill="var(--accent)">2029 to 2030</text>

<text class="c" x="60" y="535">What is locked in is volume, not margin</text>
</svg>
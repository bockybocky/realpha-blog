<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A branching chart with two judgment gates: the first splits off unwanted, the second splits a long wait from a near waking.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="56" font-size="27" fill="var(--ink)">Wrongly dismissed, or just unwanted</text>

<rect x="40" y="240" width="170" height="90" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="64" y="282" font-size="19" fill="var(--ink)">The sleeping thing</text>
<text x="64" y="312" font-size="19" fill="var(--ink)">you hold</text>

<path d="M210 285 L300 285" stroke="var(--grey)" stroke-width="5"/>
<rect x="300" y="226" width="190" height="118" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="322" y="270" font-size="19" fill="var(--accent)">Gate one</text>
<text x="322" y="302" font-size="16" fill="var(--ink)">Outside conditions</text>
<text x="322" y="328" font-size="16" fill="var(--ink)">changing?</text>

<path d="M396 344 L396 440 L560 440" fill="none" stroke="var(--warn)" stroke-width="5"/>
<text x="408" y="400" font-size="16" fill="var(--warn)">Cannot say</text>
<rect x="560" y="404" width="340" height="72" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="584" y="450" font-size="19" fill="var(--warn)">Not asleep, just unwanted</text>

<path d="M490 285 L560 285" stroke="var(--accent)" stroke-width="5"/>
<rect x="560" y="226" width="170" height="118" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="582" y="270" font-size="19" fill="var(--accent)">Gate two</text>
<text x="582" y="302" font-size="16" fill="var(--ink)">Someone depends</text>
<text x="582" y="328" font-size="16" fill="var(--ink)">on it sleeping</text>

<path d="M730 260 L820 200" fill="none" stroke="var(--grey)" stroke-width="5"/>
<text x="840" y="196" font-size="19" fill="var(--dim)">Long wait</text>
<path d="M730 310 L820 150" fill="none" stroke="var(--page)" stroke-width="0"/>
<path d="M730 312 L820 372" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text x="840" y="382" font-size="19" fill="var(--accent)">Near waking</text>
<text x="40" y="520" font-size="22" fill="var(--ink)">If you cannot say what it waits for, it is not asleep</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="四階上升階梯，線條由極細逐級變粗，代表從奈米放大到數百微米">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:20px; font-weight:700; fill:var(--ink); }
    .bd  { font-size:16px; fill:var(--dim); }
    .sm  { font-size:15px; fill:var(--dim); }
    .cc  { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="ttl" x="60" y="58">一千倍的落差，要一級一級放大</text>

  <line x1="80" y1="128" x2="902" y2="128" stroke="var(--grey)" stroke-width="2"/>
  <line x1="80" y1="128" x2="80" y2="140" stroke="var(--grey)" stroke-width="2"/>
  <line x1="902" y1="128" x2="902" y2="140" stroke="var(--grey)" stroke-width="2"/>
  <text class="bd" x="491" y="116" text-anchor="middle">相差一千倍以上</text>

  <rect x="80" y="350" width="186" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="110" y="378" width="126" height="3" fill="var(--accent)"/>
  <rect x="110" y="386" width="126" height="3" fill="var(--accent)"/>
  <text class="grp" x="173" y="452" text-anchor="middle">晶片</text>
  <text class="sm" x="173" y="476" text-anchor="middle">奈米級</text>

  <rect x="292" y="292" width="186" height="126" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="322" y="312" width="126" height="8" fill="var(--accent)"/>
  <rect x="322" y="328" width="126" height="8" fill="var(--accent)"/>
  <text class="grp" x="385" y="452" text-anchor="middle">中介層</text>

  <rect x="504" y="234" width="186" height="184" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="534" y="252" width="126" height="18" fill="var(--accent)"/>
  <rect x="534" y="288" width="126" height="18" fill="var(--accent)"/>
  <text class="grp" x="597" y="452" text-anchor="middle">載板</text>

  <rect x="716" y="176" width="186" height="242" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="746" y="192" width="126" height="34" fill="var(--accent)"/>
  <rect x="746" y="260" width="126" height="34" fill="var(--accent)"/>
  <text class="grp" x="809" y="452" text-anchor="middle">電路板</text>
  <text class="sm" x="809" y="476" text-anchor="middle">數百微米</text>

  <text class="cc" x="60" y="512">細流變小溪，小溪變河川，才進得了海</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊容器開底往下漏，右邊容器封底，東西留在裡面">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">能不能單方抽走自己那一塊</text>
<rect x="80" y="100" width="380" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="100" y="142" fill="var(--warn)">合夥人持有</text>
<path d="M150,180 L390,180 M150,180 L150,360 M390,180 L390,360" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="b" x="270" y="212" text-anchor="middle">每個人的那一塊</text>
<circle cx="210" cy="258" r="13" fill="var(--warn)"/>
<circle cx="265" cy="296" r="13" fill="var(--warn)"/>
<circle cx="320" cy="254" r="13" fill="var(--warn)"/>
<circle cx="240" cy="330" r="13" fill="var(--warn)"/>
<line x1="210" y1="372" x2="210" y2="416" stroke="var(--warn)" stroke-width="4"/>
<polygon points="202,416 218,416 210,430" fill="var(--warn)"/>
<line x1="270" y1="372" x2="270" y2="416" stroke="var(--warn)" stroke-width="4"/>
<polygon points="262,416 278,416 270,430" fill="var(--warn)"/>
<line x1="330" y1="372" x2="330" y2="416" stroke="var(--warn)" stroke-width="4"/>
<polygon points="322,416 338,416 330,430" fill="var(--warn)"/>
<rect x="500" y="100" width="380" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="520" y="142" fill="var(--accent)">投資人持有</text>
<rect x="570" y="180" width="240" height="180" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="b" x="690" y="212" text-anchor="middle">錢留在公司</text>
<circle cx="630" cy="258" r="13" fill="var(--accent)"/>
<circle cx="685" cy="296" r="13" fill="var(--accent)"/>
<circle cx="740" cy="254" r="13" fill="var(--accent)"/>
<circle cx="660" cy="330" r="13" fill="var(--accent)"/>
<line x1="614" y1="404" x2="766" y2="404" stroke="var(--accent)" stroke-width="4"/>
<polygon points="614,396 600,404 614,412" fill="var(--accent)"/>
<polygon points="766,396 780,404 766,412" fill="var(--accent)"/>
<text class="b" x="690" y="440" text-anchor="middle">只能把股票轉給下一個人</text>
<text class="c" x="60" y="520">一邊漏底，一邊封底</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四條由寬到窄的橫條由上往下排列：材料好、做得出來、做得便宜、賺得到錢，條與條之間是不等號，最上面一條標示為新聞只寫到這裡">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); font-weight:600; }
    .body { font-size:16px; fill:var(--dim); }
    .neq { font-size:26px; fill:var(--warn); font-weight:700; }
    .concl { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t title" x="60" y="66">從材料到獲利，中間有四個會斷的等號</text>

  <rect x="160" y="120" width="640" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="240" y="220" width="480" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="315" y="320" width="330" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="385" y="420" width="190" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text class="t grp" x="480" y="158" text-anchor="middle">材料好</text>
  <text class="t grp" x="480" y="258" text-anchor="middle">做得出來</text>
  <text class="t grp" x="480" y="358" text-anchor="middle">做得便宜</text>
  <text class="t grp" x="480" y="458" text-anchor="middle">賺得到錢</text>

  <text class="t neq" x="480" y="209" text-anchor="middle">≠</text>
  <text class="t neq" x="480" y="309" text-anchor="middle">≠</text>
  <text class="t neq" x="480" y="409" text-anchor="middle">≠</text>

  <line x1="820" y1="150" x2="890" y2="150" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="820" cy="150" r="5" fill="var(--accent)"/>
  <text class="t body" x="836" y="136">新聞停在這格</text>
  <text class="t body" x="60" y="458">股價落點在這格</text>
  <line x1="200" y1="450" x2="375" y2="450" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="375" cy="450" r="5" fill="var(--accent)"/>

  <text class="t concl" x="60" y="530">中間任何一格斷掉，前一格就不算數</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Government bond prices drop like a staircase, each step a forced sale after a margin call, until central bank buying finally flattens the line.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:600}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}.p{fill:var(--page)}
</style>
<text class="t" x="480" y="52" text-anchor="middle">Sell spiral</text>
<line x1="100" y1="130" x2="100" y2="480" stroke="var(--dim)" stroke-width="2"/>
<line x1="100" y1="480" x2="900" y2="480" stroke="var(--dim)" stroke-width="2"/>
<text class="d" x="110" y="122">Bond px</text>
<text class="d" x="900" y="505" text-anchor="end">Time</text>
<path d="M120 160 H270 V220 H420 V280 H570 V340 H720 V400" fill="none" stroke="var(--warn)" stroke-width="4"/>
<path d="M720 400 H890" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="d" x="195" y="148" text-anchor="middle">Bonds ↓</text>
<text class="b w" x="280" y="196">Forced</text>
<text class="b w" x="430" y="256">Forced</text>
<text class="b w" x="580" y="316">Forced</text>
<text class="b w" x="730" y="376">Forced</text>
<text class="b a" x="805" y="428" text-anchor="middle" font-weight="700">CB buys</text>
<text class="c" x="480" y="550" text-anchor="middle">Levered get forced</text>
</svg>
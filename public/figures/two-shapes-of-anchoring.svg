<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩塊對照：一邊是獨資加採購承諾，一邊是對方持多數股權、台積電持少數並負責營運">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; font-weight:700; fill:var(--ink); }
  .g { font-size:20px; font-weight:700; fill:var(--ink); }
  .d { font-size:15px; fill:var(--dim); }
  .n { font-size:19px; font-weight:700; fill:var(--page); }
  .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="68">錨定有兩種形狀：綁採購，還是綁股權</text>

<rect x="60" y="100" width="400" height="360" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="140">德州版（推測）</text>
<text class="d" x="84" y="168">持股</text>
<rect x="84" y="180" width="352" height="46" rx="5" fill="var(--accent)"/>
<text class="n" x="104" y="210">台積電 100%</text>
<text class="d" x="84" y="266">綁定方式</text>
<rect x="84" y="280" width="352" height="64" rx="5" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="104" y="320">採購承諾 800 到 1200 億</text>
<path d="M260 352 L260 392" stroke="var(--accent)" stroke-width="3"/>
<path d="M260 400 L250 384 L270 384 Z" fill="var(--accent)"/>
<text class="g" x="150" y="432">客戶出的是訂單</text>

<rect x="500" y="100" width="400" height="360" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="524" y="140">熊本版（已發生）</text>
<text class="d" x="524" y="168">持股</text>
<rect x="524" y="180" width="219" height="46" rx="5" fill="var(--grey)"/>
<rect x="743" y="180" width="133" height="46" rx="5" fill="var(--accent)"/>
<text class="n" x="544" y="210">索尼 62.2%</text>
<text class="n" x="763" y="210">37.8%</text>
<text class="d" x="524" y="266">綁定方式</text>
<rect x="524" y="280" width="352" height="64" rx="5" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="544" y="320">對方出需求與技術，台積電出營運</text>
<path d="M700 352 L700 392" stroke="var(--accent)" stroke-width="3"/>
<path d="M700 400 L690 384 L710 384 Z" fill="var(--accent)"/>
<text class="g" x="572" y="432">買公寓的人與管理公寓的人</text>

<text class="c" x="60" y="516">同一句「錨定客戶」，兩種版本要問的問題完全不同</text>
<text class="d" x="60" y="544">還有第三種：沒有錨定客戶，照樣蓋</text>
</svg>
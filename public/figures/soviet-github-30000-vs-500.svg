<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="蘇聯登記三萬支程式的柱子最高，美國八千支約四分之一高，蘇聯能用的五百支幾乎貼地">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="60" y="54" font-size="27" font-weight="700" fill="var(--ink)">目錄裡有幾支，和真的能用幾支（1989）</text>

  <line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>

  <rect x="120" y="140" width="130" height="300" rx="4" fill="var(--grey)"/>
  <text x="185" y="126" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">30,000</text>
  <text x="185" y="474" font-size="16" fill="var(--dim)" text-anchor="middle">蘇聯登記在冊</text>

  <rect x="400" y="435" width="130" height="5" rx="2" fill="var(--warn)"/>
  <text x="465" y="418" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">500</text>
  <text x="465" y="474" font-size="16" fill="var(--warn)" text-anchor="middle">蘇聯真的能用</text>

  <rect x="680" y="360" width="130" height="80" rx="4" fill="var(--accent)"/>
  <text x="745" y="346" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">8,000</text>
  <text x="745" y="474" font-size="16" fill="var(--accent)" text-anchor="middle">美國市面高品質</text>

  <text x="60" y="522" font-size="22" font-weight="700" fill="var(--ink)">收藏的高度，不是能力的高度</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四段由寬到窄的鏈條，末端接著一塊三年等待成本">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .d { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700">等下一屆，你得連過四關</text>
<text class="d" x="60" y="94" font-size="16">高度＝還剩多少把握</text>

<rect x="80" y="150" width="150" height="260" rx="8" fill="var(--accent)"/>
<rect x="258" y="212" width="150" height="198" rx="8" fill="var(--accent)" opacity="0.8"/>
<rect x="436" y="268" width="150" height="142" rx="8" fill="var(--accent)" opacity="0.6"/>
<rect x="614" y="320" width="150" height="90" rx="8" fill="var(--accent)" opacity="0.4"/>

<text class="t" x="96" y="196" font-size="19" font-weight="700" fill="var(--page)">拿下兩院</text>
<text class="t" x="274" y="258" font-size="19" font-weight="700" fill="var(--page)">湊到 60 票</text>
<text class="t" x="452" y="314" font-size="19" font-weight="700">共和黨一起投</text>
<text class="t" x="630" y="366" font-size="19" font-weight="700">總統願意簽</text>

<line x1="80" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>

<rect x="790" y="150" width="110" height="260" rx="8" fill="var(--warn)"/>
<text class="t" x="845" y="268" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">三年</text>
<text class="t" x="845" y="296" font-size="16" fill="var(--page)" text-anchor="middle">等待</text>
<text class="d" x="790" y="476" font-size="16">兩年等待＋一年實施規則</text>
<text class="t" x="80" y="528" font-size="22" font-weight="700">還是一筆兩黨協議，只是晚三年</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three paired rows where the left bars lengthen for duration while the right bars shorten for attention.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--dim); }
.b { font-size:16px; fill:var(--ink); }
.s { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">The longest-lasting gets the least attention</text>

<text class="g" x="370" y="140" text-anchor="end">How long it lasts</text>
<text class="g" x="590" y="140">Attention received</text>

<rect x="310" y="190" width="60" height="40" rx="4" fill="var(--accent)"/>
<text class="b" x="480" y="216" text-anchor="middle">A stock price jump</text>
<rect x="590" y="190" width="290" height="40" rx="4" fill="var(--warn)"/>

<rect x="220" y="280" width="150" height="40" rx="4" fill="var(--accent)"/>
<text class="b" x="480" y="306" text-anchor="middle">Guidance revisions</text>
<rect x="590" y="280" width="150" height="40" rx="4" fill="var(--warn)"/>

<rect x="80" y="370" width="290" height="40" rx="4" fill="var(--accent)"/>
<text class="b" x="480" y="396" text-anchor="middle">A contract signed to 2031</text>
<rect x="590" y="370" width="60" height="40" rx="4" fill="var(--warn)"/>

<text class="c" x="60" y="490">Ask first: when does this stop mattering</text>
</svg>
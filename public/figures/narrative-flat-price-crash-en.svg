<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two lines part ways: one runs almost flat to the right, the other slides from a high point down toward the bottom.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; fill:var(--dim); }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--dim); }
</style>
<text class="t" x="60" y="56">Narrative intact, price down three quarters</text>
<line x1="140" y1="430" x2="890" y2="430" stroke="var(--grey)" stroke-width="2"/>
<line x1="140" y1="130" x2="140" y2="430" stroke="var(--grey)" stroke-width="2"/>
<polyline points="170,250 400,244 640,238 862,232" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="8 6"/>
<polyline points="170,172 300,212 420,202 560,300 700,352 862,396" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="b" x="178" y="160" fill="var(--warn)">$18</text>
<text class="b" x="790" y="420" fill="var(--warn)">$4</text>
<text class="g" x="600" y="222" fill="var(--accent)">Narrative</text>
<text class="g" x="296" y="188" fill="var(--warn)">Price</text>
<text class="s" x="140" y="458">Time</text>
<text class="c" x="60" y="518">Right direction isn't staying power</text>
</svg>
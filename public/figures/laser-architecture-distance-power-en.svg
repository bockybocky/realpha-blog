<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three side-by-side panels show the light source moving closer to the compute chip as the power bars grow taller, with the rightmost light source inside the same package." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <text x="60" y="56" font-size="27" fill="var(--ink)">The closer it moves, the brighter the light source must be</text>
  <text x="60" y="88" font-size="16" fill="var(--dim)">Power demand (bar height)</text>

  <g>
    <rect x="60" y="120" width="260" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
    <rect x="80" y="196" width="26" height="40" fill="var(--grey)"/>
    <text x="80" y="182" font-size="15" fill="var(--dim)">100 mW</text>
    <rect x="80" y="320" width="62" height="54" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
    <text x="86" y="352" font-size="15" fill="var(--accent)">Laser</text>
    <rect x="212" y="300" width="88" height="90" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
    <text x="226" y="352" font-size="15" fill="var(--ink)">Compute chip</text>
    <line x1="142" y1="345" x2="206" y2="345" stroke="var(--grey)" stroke-width="2"/>
    <polygon points="212,345 202,340 202,350" fill="var(--grey)"/>
    <text x="80" y="424" font-size="19" fill="var(--ink)">Pluggable</text>
  </g>

  <g>
    <rect x="350" y="120" width="260" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
    <rect x="370" y="166" width="26" height="70" fill="var(--grey)"/>
    <text x="370" y="152" font-size="15" fill="var(--dim)">120–150 mW</text>
    <rect x="432" y="320" width="62" height="54" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
    <text x="438" y="352" font-size="15" fill="var(--accent)">Laser</text>
    <rect x="502" y="300" width="88" height="90" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
    <text x="516" y="352" font-size="15" fill="var(--ink)">Compute chip</text>
    <line x1="494" y1="345" x2="498" y2="345" stroke="var(--grey)" stroke-width="2"/>
    <text x="370" y="424" font-size="19" fill="var(--ink)">Near-package</text>
  </g>

  <g>
    <rect x="640" y="120" width="260" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
    <rect x="660" y="106" width="26" height="130" fill="var(--accent)"/>
    <text x="660" y="96" font-size="15" fill="var(--ink)">400 mW</text>
    <rect x="692" y="288" width="188" height="114" rx="8" fill="none" stroke="var(--accent)" stroke-dasharray="6 5"/>
    <text x="692" y="278" font-size="15" fill="var(--accent)">Same package</text>
    <rect x="706" y="320" width="62" height="54" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
    <text x="712" y="352" font-size="15" fill="var(--accent)">Laser</text>
    <rect x="776" y="300" width="88" height="90" rx="6" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
    <text x="790" y="352" font-size="15" fill="var(--ink)">Compute chip</text>
    <text x="660" y="424" font-size="19" fill="var(--ink)">Co-packaged</text>
  </g>

  <text x="60" y="500" font-size="22" fill="var(--ink)">Shorter distance, sharply higher power demand.</text>
</svg>
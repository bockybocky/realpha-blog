<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三根實柱托住一條橫梁，另一條橫梁懸空，柱位是虛線空缺">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">三根柱子托得住哪一條</text>

<rect x="120" y="112" width="720" height="40" rx="6" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 7"/>
<text class="t" x="480" y="140" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">這一層能漲價</text>

<rect x="200" y="188" width="90" height="120" rx="6" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<rect x="435" y="188" width="90" height="120" rx="6" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<rect x="670" y="188" width="90" height="120" rx="6" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="t" x="245" y="254" font-size="16" fill="var(--warn)" text-anchor="middle">毛利率</text>
<text class="t" x="480" y="246" font-size="16" fill="var(--warn)" text-anchor="middle">漲價</text>
<text class="t" x="480" y="268" font-size="16" fill="var(--warn)" text-anchor="middle">紀錄</text>
<text class="t" x="715" y="254" font-size="16" fill="var(--warn)" text-anchor="middle">長約</text>

<rect x="120" y="344" width="720" height="40" rx="6" fill="var(--accent)"/>
<text class="t" x="480" y="372" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">這一層不好被換掉</text>

<rect x="200" y="384" width="90" height="120" rx="6" fill="var(--grey)"/>
<rect x="435" y="384" width="90" height="120" rx="6" fill="var(--grey)"/>
<rect x="670" y="384" width="90" height="120" rx="6" fill="var(--grey)"/>
<text class="t" x="245" y="452" font-size="16" fill="var(--ink)" text-anchor="middle">難替代</text>
<text class="t" x="480" y="452" font-size="16" fill="var(--ink)" text-anchor="middle">難理解</text>
<text class="t" x="715" y="452" font-size="16" fill="var(--ink)" text-anchor="middle">難找人</text>

<text class="t" x="48" y="552" font-size="22" font-weight="700" fill="var(--ink)">上面那條還缺柱子</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="鋸齒劇烈上下擺動，但底下的平緩直線一路通到同一個目標點">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="64" font-size="27" fill="var(--ink)">雜訊與方向</text>

<polyline points="120,400 190,180 250,420 320,170 390,410 460,200 530,430 600,190 670,380 740,230 800,300"
          fill="none" stroke="var(--grey)" stroke-width="3"/>
<text x="196" y="156" font-size="19" fill="var(--grey)">上修</text>
<text x="536" y="462" font-size="19" fill="var(--grey)">下修</text>

<line x1="120" y1="420" x2="800" y2="300" stroke="var(--accent)" stroke-width="5"/>
<circle cx="800" cy="300" r="12" fill="var(--accent)"/>
<text x="824" y="296" font-size="20" fill="var(--accent)">目標</text>
<text x="300" y="356" font-size="20" fill="var(--accent)">方向</text>

<text x="120" y="470" font-size="16" fill="var(--dim)">時間</text>
</svg>
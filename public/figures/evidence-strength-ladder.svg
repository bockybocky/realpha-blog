<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三根遞增長條表示證據強度，最高的是改工具與花錢，上方虛線標出仍看不到的範圍">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .w { font-size:19px; font-weight:700; fill:var(--warn); }
</style>
<text x="40" y="58" class="t">哪一種說法，算得上證據</text>
<text x="60" y="118" class="b">證據強度</text>
<line x1="100" y1="130" x2="100" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="600" y1="150" x2="880" y2="150" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="740" y="138" class="w" text-anchor="middle">看不到：誰賺錢・時程</text>
<rect x="150" y="380" width="160" height="70" rx="6" fill="var(--grey)"/>
<rect x="400" y="280" width="160" height="170" rx="6" fill="var(--grey)"/>
<rect x="660" y="180" width="160" height="270" rx="6" fill="var(--accent)"/>
<text x="230" y="485" class="g" text-anchor="middle">形容詞</text>
<text x="480" y="485" class="g" text-anchor="middle">難關清單</text>
<text x="740" y="485" class="g" text-anchor="middle">改工具・花錢</text>
<text x="230" y="510" class="b" text-anchor="middle">新聞稿</text>
<text x="480" y="510" class="b" text-anchor="middle">有樣品在追</text>
<text x="740" y="510" class="b" text-anchor="middle">正在發生</text>
<text x="40" y="560" class="c">花了錢的，比形容的可靠</text>
</svg>
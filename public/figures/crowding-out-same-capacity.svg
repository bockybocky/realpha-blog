<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="兩排各十格代表同一條產線，之前三格高階七格低階，之後七格高階三格低階，被擠掉的那三格標為先斷貨。">
<style>
  svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
        --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
  @media (prefers-color-scheme: dark) {
    svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
          --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
  }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); font-weight:700; }
  .g { font-size:19px; fill:var(--ink); }
  .b { font-size:15px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<text class="t" x="60" y="62">同一條產線，配比變了</text>
<text class="b" x="60" y="100">10 格＝一條產線的產能</text>
<rect x="592" y="88" width="14" height="14" fill="var(--accent)"/>
<text class="b" x="614" y="100">AI 高階</text>
<rect x="722" y="88" width="14" height="14" fill="var(--grey)"/>
<text class="b" x="744" y="100">車用與消費級</text>

<text class="g" x="60" y="182">之前</text>
<rect x="150" y="140" width="60" height="70" rx="6" fill="var(--accent)"/>
<rect x="220" y="140" width="60" height="70" rx="6" fill="var(--accent)"/>
<rect x="290" y="140" width="60" height="70" rx="6" fill="var(--accent)"/>
<rect x="360" y="140" width="60" height="70" rx="6" fill="var(--grey)"/>
<rect x="430" y="140" width="60" height="70" rx="6" fill="var(--grey)"/>
<rect x="500" y="140" width="60" height="70" rx="6" fill="var(--grey)"/>
<rect x="570" y="140" width="60" height="70" rx="6" fill="var(--grey)"/>
<rect x="640" y="140" width="60" height="70" rx="6" fill="var(--grey)"/>
<rect x="710" y="140" width="60" height="70" rx="6" fill="var(--grey)"/>
<rect x="780" y="140" width="60" height="70" rx="6" fill="var(--grey)"/>

<text class="g" x="60" y="312">之後</text>
<rect x="150" y="270" width="60" height="70" rx="6" fill="var(--accent)"/>
<rect x="220" y="270" width="60" height="70" rx="6" fill="var(--accent)"/>
<rect x="290" y="270" width="60" height="70" rx="6" fill="var(--accent)"/>
<rect x="360" y="270" width="60" height="70" rx="6" fill="var(--accent)"/>
<rect x="430" y="270" width="60" height="70" rx="6" fill="var(--accent)"/>
<rect x="500" y="270" width="60" height="70" rx="6" fill="var(--accent)"/>
<rect x="570" y="270" width="60" height="70" rx="6" fill="var(--accent)"/>
<rect x="640" y="270" width="60" height="70" rx="6" fill="var(--grey)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="710" y="270" width="60" height="70" rx="6" fill="var(--grey)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="780" y="270" width="60" height="70" rx="6" fill="var(--grey)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M640 358 L640 368 L840 368 L840 358" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text class="b" x="740" y="392" text-anchor="middle" fill="var(--warn)">先斷貨</text>
<text class="c" x="60" y="452">沒有人漲價，供給自己消失</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="花錢速度的曲線由高點往下滑，收錢速度的曲線緩緩抬升，兩條線在圖的右側交會">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="64">兩條可以分別追蹤的線</text>
<rect x="60" y="100" width="840" height="340" rx="14" fill="var(--card)"/>
<line x1="130" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<path d="M160 150 C 360 160, 520 300, 760 338" stroke="var(--warn)" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M160 358 C 380 348, 560 320, 760 290" stroke="var(--accent)" stroke-width="5" fill="none" stroke-linecap="round"/>
<text class="g" x="160" y="134" fill="var(--warn)">花錢速度</text>
<text class="b" x="160" y="186">資本支出年增率，見頂往下</text>
<text class="g" x="160" y="386" fill="var(--accent)">收錢速度</text>
<text class="b" x="160" y="336">雲端營收年增率，還在升</text>
<circle cx="742" cy="306" r="11" fill="none" stroke="var(--ink)" stroke-width="3"/>
<text class="g" x="770" y="286">交會</text>
<text class="b" x="770" y="330">自由現金流回正</text>
<text class="c" x="60" y="500">收錢那條一掉頭，整個推論就要重算</text>
</svg>
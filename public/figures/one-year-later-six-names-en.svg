<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Of six bars, five point down and one points up." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">Six names picked a year ago: cheap or trap</text>
<line x1="60" y1="260" x2="900" y2="260" stroke="var(--line)" stroke-width="2"/>
<text x="900" y="248" font-size="15" fill="var(--dim)" text-anchor="end">Starting point a year ago</text>

<rect x="100" y="260" width="90" height="172" fill="var(--warn)"/>
<text x="145" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">Lululemon</text>
<text x="145" y="480" font-size="16" fill="var(--warn)" text-anchor="middle">-43%</text>

<rect x="230" y="260" width="90" height="172" fill="var(--warn)"/>
<text x="275" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">Nike</text>
<text x="275" y="480" font-size="16" fill="var(--warn)" text-anchor="middle">-43%</text>

<rect x="360" y="260" width="90" height="132" fill="var(--warn)"/>
<text x="405" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">Adobe</text>
<text x="405" y="480" font-size="16" fill="var(--warn)" text-anchor="middle">-33%</text>

<rect x="490" y="260" width="90" height="92" fill="var(--warn)"/>
<text x="535" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">Chipotle</text>
<text x="535" y="480" font-size="16" fill="var(--warn)" text-anchor="middle">-23%</text>

<rect x="620" y="256" width="90" height="8" fill="var(--grey)"/>
<text x="665" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">Salesforce</text>
<text x="665" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">Flat</text>

<rect x="750" y="100" width="90" height="160" fill="var(--accent)"/>
<text x="795" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">Airbnb</text>
<text x="795" y="480" font-size="16" fill="var(--accent)" text-anchor="middle">+40%</text>

<text x="60" y="528" font-size="22" fill="var(--ink)">Five of them went a whole year without one decent bounce</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A downward line on the upper layer and an upward line on the lower layer, pointing opposite ways">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; font-weight:700; fill:var(--ink); }
    .g  { font-size:20px; font-weight:600; }
    .b  { font-size:16px; fill:var(--dim); }
    .c  { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">One thing moving opposite ways at two scales</text>

<rect x="60" y="96" width="840" height="164" fill="var(--card)"/>
<text class="g" x="88" y="136" fill="var(--accent)">Your utility territory</text>
<text class="b" x="88" y="162">A big user arrives and shares the backbone cost</text>
<path d="M420 140 C 560 148, 660 196, 830 224" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="830" cy="224" r="6" fill="var(--accent)"/>
<text class="b" x="700" y="152">Your rate</text>
<text class="g" x="700" y="252" fill="var(--accent)">Down</text>

<rect x="60" y="288" width="840" height="164" fill="var(--card)"/>
<text class="g" x="88" y="328" fill="var(--warn)">The whole country</text>
<text class="b" x="88" y="354">Transformers</text>
<text class="b" x="88" y="378">Gas turbines</text>
<text class="b" x="88" y="402">Natural gas</text>
<path d="M420 424 C 560 416, 660 368, 830 332" fill="none" stroke="var(--warn)" stroke-width="4"/>
<circle cx="830" cy="332" r="6" fill="var(--warn)"/>
<text class="b" x="620" y="440">Every component on the bill</text>
<text class="g" x="700" y="316" fill="var(--warn)">Up</text>

<text class="c" x="60" y="500">Both can hold, because they measure different things</text>
</svg>
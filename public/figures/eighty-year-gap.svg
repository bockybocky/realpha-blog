<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="時間軸上，她的結論與凱因斯之間隔著很長一段空白">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="480" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">同一個結論，早了八十年</text>

  <path d="M80 250 H900" stroke="var(--line)" stroke-width="4"/>
  <circle cx="150" cy="250" r="12" fill="var(--accent)"/>
  <circle cx="850" cy="250" r="12" fill="var(--grey)"/>

  <text class="t" x="150" y="210" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">飢荒</text>
  <text class="t" x="150" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">她改了立場</text>
  <text class="t" x="150" y="328" font-size="16" fill="var(--dim)" text-anchor="middle">政府得花錢發東西</text>

  <text class="t" x="850" y="210" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">凱因斯</text>
  <text class="t" x="850" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">寫成理論</text>

  <path d="M170 170 H830" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
  <text class="t" x="500" y="150" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">空白八十年</text>

  <text class="t" x="60" y="420" font-size="22" font-weight="700" fill="var(--ink)">沒留在會被翻開的紀錄裡，就等於沒說</text>
</svg>
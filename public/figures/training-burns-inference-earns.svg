<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左格箭頭向外、右格箭頭向內，兩邊方向相反">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">錢的方向：訓練只出，推論才進</text>
<rect x="60" y="110" width="400" height="330" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="90" y="156">訓練</text>
<text class="d" x="90" y="186">純成本</text>
<circle cx="260" cy="296" r="58" fill="var(--warn)" opacity="0.3"/>
<line x1="260" y1="238" x2="260" y2="162" stroke="var(--warn)" stroke-width="3"/>
<path d="M252 170 L268 170 L260 148 Z" fill="var(--warn)"/>
<line x1="318" y1="296" x2="400" y2="296" stroke="var(--warn)" stroke-width="3"/>
<path d="M392 288 L392 304 L414 296 Z" fill="var(--warn)"/>
<line x1="260" y1="354" x2="260" y2="418" stroke="var(--warn)" stroke-width="3"/>
<path d="M252 410 L268 410 L260 432 Z" fill="var(--warn)"/>
<line x1="202" y1="296" x2="120" y2="296" stroke="var(--warn)" stroke-width="3"/>
<path d="M128 288 L128 304 L106 296 Z" fill="var(--warn)"/>
<rect x="500" y="110" width="400" height="330" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="530" y="156">推論</text>
<text class="d" x="530" y="186">收入在這裡</text>
<circle cx="700" cy="296" r="58" fill="var(--accent)" opacity="0.3"/>
<line x1="700" y1="148" x2="700" y2="222" stroke="var(--accent)" stroke-width="3"/>
<path d="M692 214 L708 214 L700 238 Z" fill="var(--accent)"/>
<line x1="854" y1="296" x2="780" y2="296" stroke="var(--accent)" stroke-width="3"/>
<path d="M788 288 L788 304 L764 296 Z" fill="var(--accent)"/>
<line x1="700" y1="432" x2="700" y2="370" stroke="var(--accent)" stroke-width="3"/>
<path d="M692 378 L708 378 L700 354 Z" fill="var(--accent)"/>
<line x1="546" y1="296" x2="620" y2="296" stroke="var(--accent)" stroke-width="3"/>
<path d="M612 288 L612 304 L636 296 Z" fill="var(--accent)"/>
<text class="d" x="60" y="480">把資本支出從左邊挪到右邊，成本結構會好看</text>
<text class="d" x="60" y="506">Tim 只指出這個商業理由存在，不等於主張該這樣做</text>
</svg>
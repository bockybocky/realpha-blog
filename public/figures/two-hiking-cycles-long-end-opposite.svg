<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩格折線對照：左格短端階梯上升而長端水平，右格短端水平而長端斜向右上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="48" y="54" font-size="27" font-weight="700" fill="var(--ink)">同樣升息，長端兩次反應相反</text>
<rect x="48" y="92" width="416" height="372" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="496" y="92" width="416" height="372" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="72" y="128" font-size="20" font-weight="700" fill="var(--ink)">2004 → 2006</text>
<text x="520" y="128" font-size="20" font-weight="700" fill="var(--ink)">2026 年初 → 10 月</text>
<line x1="72" y1="436" x2="440" y2="436" stroke="var(--line)" stroke-width="2"/>
<line x1="520" y1="436" x2="888" y2="436" stroke="var(--line)" stroke-width="2"/>
<polyline points="80,400 140,400 140,370 200,370 200,338 260,338 260,306 320,306 320,272 380,272 380,240 432,240" fill="none" stroke="var(--grey)" stroke-width="4"/>
<polyline points="80,300 160,297 240,304 320,298 432,300" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="84" y="420" font-size="16" fill="var(--dim)">短端 政策利率</text>
<text x="330" y="226" font-size="16" fill="var(--dim)">＋425 個基點</text>
<text x="84" y="284" font-size="16" fill="var(--accent)">長端 10 年期</text>
<text x="344" y="328" font-size="16" fill="var(--accent)">幾乎不動</text>
<polyline points="520,396 600,394 680,391 760,390 872,388" fill="none" stroke="var(--grey)" stroke-width="4"/>
<polyline points="520,340 592,322 664,298 736,266 808,230 872,196" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="524" y="424" font-size="16" fill="var(--dim)">短端 ＋1 碼</text>
<text x="620" y="178" font-size="16" fill="var(--accent)">長端 4% → 5.3%</text>
<text x="48" y="506" font-size="22" font-weight="700" fill="var(--ink)">同一個方向的政策，長端給了相反的答案</text>
</g>
</svg>
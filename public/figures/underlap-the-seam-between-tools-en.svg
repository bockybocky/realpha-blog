<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two gaps between three standalone tools let data fall through at handoff, set against one seamless platform on the right.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">Attackers hit the seams, not the bricks</text>
<text x="60" y="118" font-size="19" fill="var(--dim)">A stack of bolted-on tools</text>
<rect x="60" y="150" width="128" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="228" y="150" width="128" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="396" y="150" width="128" height="86" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="124" y="200" font-size="16" fill="var(--dim)" text-anchor="middle">Tool A</text>
<text x="292" y="200" font-size="16" fill="var(--dim)" text-anchor="middle">Tool B</text>
<text x="460" y="200" font-size="16" fill="var(--dim)" text-anchor="middle">Tool C</text>
<path d="M90 193 L 184 193" stroke="var(--accent)" stroke-width="5"/>
<path d="M232 193 L 352 193" stroke="var(--accent)" stroke-width="5"/>
<path d="M400 193 L 494 193" stroke="var(--accent)" stroke-width="5"/>
<path d="M190 240 L 204 300" stroke="var(--warn)" stroke-width="4"/>
<path d="M358 240 L 372 300" stroke="var(--warn)" stroke-width="4"/>
<polygon points="198,300 212,300 205,318" fill="var(--warn)"/>
<polygon points="366,300 380,300 373,318" fill="var(--warn)"/>
<text x="292" y="352" font-size="20" fill="var(--warn)" text-anchor="middle">underlap</text>
<text x="292" y="380" font-size="16" fill="var(--dim)" text-anchor="middle">At the handoff</text>
<text x="560" y="118" font-size="19" fill="var(--accent)">Pulled into one platform</text>
<rect x="560" y="150" width="340" height="86" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<path d="M590 193 L 866 193" stroke="var(--accent)" stroke-width="5"/>
<text x="730" y="268" font-size="16" fill="var(--dim)" text-anchor="middle">One agent, one data layer</text>
<text x="730" y="352" font-size="20" fill="var(--accent)" text-anchor="middle">No seam to fall through</text>
<text x="60" y="500" font-size="22" fill="var(--ink)">Partnerships stitched by M&amp;A still leave seams</text>
</g>
</svg>
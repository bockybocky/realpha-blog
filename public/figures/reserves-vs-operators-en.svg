<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bars compared by height: the left one is a single block of reserves awarded to an unlisted small company, and the right one stacks two listed companies in layers and extends upward with a dashed line past the left bar.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="60">Same week: who got the reserves</text>
<text class="d" x="60" y="90">Bar height = size of reserves signed</text>

<line x1="120" y1="446" x2="900" y2="446" stroke="var(--line)" stroke-width="2"/>

<rect x="180" y="126" width="200" height="320" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
<text class="b" x="280" y="290" text-anchor="middle">65 bn bbl</text>
<text class="g" x="280" y="478" text-anchor="middle">NABEP</text>
<text class="d" x="280" y="504" text-anchor="middle">Unlisted, no operating record</text>
<text class="d" x="280" y="528" text-anchor="middle">Half is greenfield, no infrastructure</text>

<rect x="600" y="195" width="200" height="172" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="b" x="700" y="288" text-anchor="middle">ENI 35 bn bbl</text>
<rect x="600" y="367" width="200" height="79" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="b" x="700" y="413" text-anchor="middle">GeoPark 16 bn bbl</text>
<rect x="600" y="112" width="200" height="70" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="d" x="700" y="141" text-anchor="middle">Chevron</text>
<text class="d" x="700" y="164" text-anchor="middle">$7 bn, output doubled</text>
<text class="g" x="700" y="478" text-anchor="middle">Listed operators</text>
<text class="d" x="700" y="504" text-anchor="middle">Balance sheet, public filings</text>
<text class="d" x="700" y="528" text-anchor="middle">Operating record</text>

<line x1="380" y1="126" x2="590" y2="126" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>

<text class="c" x="60" y="560" opacity="0"> </text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="高度對比圖：左側柱由三段逐層疊高，右側代表買家的方塊只有一小截高">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">供給一層層疊高，買家只剩一個</text>

<line x1="60" y1="500" x2="900" y2="500" stroke="var(--grey)" stroke-width="3"/>

<rect x="200" y="380" width="200" height="120" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="300" y="448" font-size="16" fill="var(--ink)" text-anchor="middle">現在的赤字 2 兆</text>

<rect x="200" y="260" width="200" height="120" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="300" y="328" font-size="16" fill="var(--ink)" text-anchor="middle">衰退再加 2 兆</text>

<rect x="200" y="194" width="200" height="66" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="300" y="234" font-size="16" fill="var(--ink)" text-anchor="middle">銀行、外國央行、對沖基金</text>

<text x="300" y="166" font-size="20" fill="var(--warn)" text-anchor="middle">約 5.1 兆</text>
<line x1="180" y1="194" x2="420" y2="194" stroke="var(--warn)" stroke-width="3"/>

<path d="M440 420 L600 420" stroke="var(--grey)" stroke-width="8"/>
<path d="M592 404 L624 420 L592 436 Z" fill="var(--grey)"/>

<rect x="660" y="458" width="200" height="42" fill="var(--warn)"/>
<text x="760" y="538" font-size="19" fill="var(--warn)" text-anchor="middle">剩下的買家</text>

<text x="60" y="578" font-size="22" fill="var(--ink)">缺口不會消失，只會換一個人承接</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Four horizontal bars share the same scale: the 12-month, 8-month, and 6-month bars are long, while the bottom bar representing 12 hours is almost invisible and identified by a leader line.">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">The debated scale versus the real one</text>
  <text x="60" y="104" font-size="16" fill="var(--dim)">Same scale, same proportion</text>
  <text x="60" y="166" font-size="19" fill="var(--dim)">In debate</text>
  <rect x="200" y="148" width="360" height="26" rx="4" fill="var(--grey)"/>
  <text x="576" y="168" font-size="16" fill="var(--dim)">12 months</text>
  <rect x="200" y="192" width="240" height="26" rx="4" fill="var(--grey)"/>
  <text x="456" y="212" font-size="16" fill="var(--dim)">8 months</text>
  <rect x="200" y="236" width="180" height="26" rx="4" fill="var(--grey)"/>
  <text x="396" y="256" font-size="16" fill="var(--dim)">6 months</text>
  <line x1="200" y1="292" x2="900" y2="292" stroke="var(--line)" stroke-width="2"/>
  <text x="60" y="340" font-size="19" font-weight="700" fill="var(--warn)">In reality</text>
  <rect x="200" y="322" width="5" height="26" fill="var(--warn)"/>
  <line x1="205" y1="335" x2="300" y2="335" stroke="var(--warn)" stroke-width="2"/>
  <text x="312" y="341" font-size="17" font-weight="700" fill="var(--warn)">12 hours</text>
  <text x="200" y="388" font-size="15" fill="var(--dim)">A security startup saw internal source code within days and all of Slack in 12 hours</text>
  <text x="60" y="462" font-size="22" font-weight="700" fill="var(--ink)">The thinnest layer determines the lead</text>
</svg>
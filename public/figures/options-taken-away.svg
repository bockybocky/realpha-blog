<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="一筆等於國內生產毛額兩成的賠款在兩年內被塞進來，拿去清償公債之後，原本買公債的人手上只剩現金，而當時唯一還在發新標的的地方是股市">
  <style>
    svg {
      --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922;
      }
    }
    .t    { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1   { font-size:27px; font-weight:700; fill:var(--ink); }
    .big  { font-size:22px; font-weight:700; fill:var(--page); }
    .bigs { font-size:16px; fill:var(--page); }
    .opt  { font-size:18px; font-weight:700; fill:var(--dim); }
    .optA { font-size:18px; font-weight:700; fill:var(--page); }
    .note { font-size:15px; fill:var(--dim); }
    .kick { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>

  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>

  <g class="t">
    <text x="480" y="44" class="h1" text-anchor="middle">錢不是被賺出來的，是被「還」出來的</text>

    <rect x="300" y="80" width="360" height="76" rx="8" fill="var(--warn)"/>
    <text x="480" y="112" class="big" text-anchor="middle">一筆賠款砸進來</text>
    <text x="480" y="140" class="bigs" text-anchor="middle">兩年之內，相當於全國產出的兩成</text>

    <path d="M480,156 L480,196" stroke="var(--dim)" stroke-width="3"/>
    <path d="M470,186 L480,200 L490,186" fill="none" stroke="var(--dim)" stroke-width="3" stroke-linecap="round"/>

    <text x="480" y="228" class="note" text-anchor="middle">各邦拿去清償公債，於是原本買公債的人手上只剩現金</text>

    <text x="140" y="286" class="note">他們可以放哪裡？</text>

    <rect x="120" y="304" width="230" height="72" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text x="235" y="348" class="opt" text-anchor="middle">公債</text>
    <g stroke="var(--warn)" stroke-width="5" stroke-linecap="round">
      <line x1="150" y1="318" x2="320" y2="362"/>
      <line x1="320" y1="318" x2="150" y2="362"/>
    </g>
    <text x="235" y="398" class="note" text-anchor="middle">已經被贖回了</text>

    <rect x="365" y="304" width="230" height="72" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text x="480" y="348" class="opt" text-anchor="middle">別的固定收益</text>
    <g stroke="var(--warn)" stroke-width="5" stroke-linecap="round">
      <line x1="395" y1="318" x2="565" y2="362"/>
      <line x1="565" y1="318" x2="395" y2="362"/>
    </g>
    <text x="480" y="398" class="note" text-anchor="middle">沒有新標的在發</text>

    <rect x="610" y="304" width="230" height="72" rx="8" fill="var(--accent)"/>
    <text x="725" y="348" class="optA" text-anchor="middle">股市</text>
    <text x="725" y="398" class="note" text-anchor="middle" fill="var(--accent)">唯一還開著的門</text>

    <line x1="100" y1="440" x2="860" y2="440" stroke="var(--line)" stroke-width="1"/>
    <text x="480" y="474" class="note" text-anchor="middle">接著兩三年，全國瘋狂新股上市——供給端立刻反應，因為大家發現錢好募</text>

    <text x="480" y="522" class="kick" text-anchor="middle">這種泡沫不需要人變貪婪，</text>
    <text x="480" y="554" class="kick" text-anchor="middle">只需要人的選項被拿走。</text>
  </g>
</svg>

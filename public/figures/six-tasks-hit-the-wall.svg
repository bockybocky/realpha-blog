<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上下兩條同長的額度條，上面被六格填滿頂到牆，下面只填一格還留一大段空白">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">一次丟六個，時鐘就走到底</text>

<text x="60" y="186" font-size="20" fill="var(--ink)">六個任務</text>
<rect x="230" y="150" width="590" height="56" fill="var(--card)" stroke="var(--line)"/>
<rect x="232" y="152" width="94" height="52" fill="var(--warn)"/>
<rect x="330" y="152" width="94" height="52" fill="var(--warn)"/>
<rect x="428" y="152" width="94" height="52" fill="var(--warn)"/>
<rect x="526" y="152" width="94" height="52" fill="var(--warn)"/>
<rect x="624" y="152" width="94" height="52" fill="var(--warn)"/>
<rect x="722" y="152" width="96" height="52" fill="var(--warn)"/>
<rect x="824" y="136" width="12" height="84" fill="var(--warn)"/>
<text x="700" y="248" font-size="16" fill="var(--warn)">額度見底，連封面也畫不了</text>

<text x="60" y="366" font-size="20" fill="var(--ink)">一個任務</text>
<rect x="230" y="330" width="590" height="56" fill="var(--card)" stroke="var(--line)"/>
<rect x="232" y="332" width="94" height="52" fill="var(--accent)"/>
<rect x="824" y="316" width="12" height="84" fill="var(--line)"/>
<text x="340" y="428" font-size="16" fill="var(--dim)">剩下的都還能用</text>

<text x="60" y="500" font-size="22" fill="var(--ink)">付得起的是錢，走到底的是時鐘</text>
</svg>
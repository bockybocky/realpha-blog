<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一道由左上往右下的三階梯，每一階上方有代表需求的方塊，兩道箭頭把方塊往下一階推，最低的那一階堆得最滿">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--ink); }
.d { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">買不到的人，往下一階買</text>
<polygon points="140,440 140,220 400,220 400,300 660,300 660,380 920,380 920,440" fill="var(--card)" stroke="var(--line)" stroke-width="2.5"/>
<rect x="160" y="192" width="18" height="24" fill="var(--accent)"/>
<rect x="184" y="192" width="18" height="24" fill="var(--accent)"/>
<rect x="208" y="192" width="18" height="24" fill="var(--accent)"/>
<rect x="232" y="192" width="18" height="24" fill="var(--accent)"/>
<rect x="420" y="272" width="18" height="24" fill="var(--accent)"/>
<rect x="444" y="272" width="18" height="24" fill="var(--accent)"/>
<rect x="468" y="272" width="18" height="24" fill="var(--accent)"/>
<rect x="492" y="272" width="18" height="24" fill="var(--accent)"/>
<rect x="516" y="272" width="18" height="24" fill="var(--accent)"/>
<rect x="540" y="272" width="18" height="24" fill="var(--accent)"/>
<rect x="676" y="352" width="18" height="24" fill="var(--warn)"/>
<rect x="700" y="352" width="18" height="24" fill="var(--warn)"/>
<rect x="724" y="352" width="18" height="24" fill="var(--warn)"/>
<rect x="748" y="352" width="18" height="24" fill="var(--warn)"/>
<rect x="772" y="352" width="18" height="24" fill="var(--warn)"/>
<rect x="796" y="352" width="18" height="24" fill="var(--warn)"/>
<rect x="820" y="352" width="18" height="24" fill="var(--warn)"/>
<rect x="844" y="352" width="18" height="24" fill="var(--warn)"/>
<rect x="868" y="352" width="18" height="24" fill="var(--warn)"/>
<rect x="892" y="352" width="18" height="24" fill="var(--warn)"/>
<path d="M330 180 Q400 172 424 244" fill="none" stroke="var(--dim)" stroke-width="3"/>
<polygon points="426,256 418,240 434,238" fill="var(--dim)"/>
<path d="M590 260 Q660 252 682 324" fill="none" stroke="var(--dim)" stroke-width="3"/>
<polygon points="684,336 676,320 692,318" fill="var(--dim)"/>
<text class="g" x="270" y="262">最新規格</text>
<text class="g" x="530" y="342">上一代</text>
<text class="g" x="790" y="422">更舊的一代</text>
<text class="d" x="920" y="472" text-anchor="end">缺口在這一階被放大</text>
<text class="c" x="60" y="510">缺貨沿著整條規格梯往下傳染</text>
</svg>
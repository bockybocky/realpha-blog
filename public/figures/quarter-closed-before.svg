<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條時間軸：左半段是已結帳的那一季，接著是執行長離開、財報公布兩個點，右端是一片灰色的待定區，軸上有問號">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="66" font-size="27" fill="var(--ink)">漂亮的數字屬於結帳日之前</text>
<line x1="80" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="3"/>
<rect x="80" y="272" width="350" height="56" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="255" y="307" font-size="19" fill="var(--accent)" text-anchor="middle">這一季</text>
<rect x="745" y="272" width="135" height="56" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="812" y="310" font-size="27" fill="var(--grey)" text-anchor="middle">？</text>
<circle cx="430" cy="300" r="9" fill="var(--accent)"/>
<circle cx="560" cy="300" r="9" fill="var(--ink)"/>
<circle cx="672" cy="300" r="9" fill="var(--ink)"/>
<line x1="430" y1="300" x2="430" y2="240" stroke="var(--accent)" stroke-width="2"/>
<text x="430" y="226" font-size="16" fill="var(--ink)" text-anchor="middle">10／30 結帳</text>
<line x1="560" y1="300" x2="560" y2="364" stroke="var(--dim)" stroke-width="2"/>
<text x="560" y="388" font-size="16" fill="var(--ink)" text-anchor="middle">執行長離開</text>
<line x1="672" y1="300" x2="672" y2="240" stroke="var(--dim)" stroke-width="2"/>
<text x="672" y="226" font-size="16" fill="var(--ink)" text-anchor="middle">財報公布</text>
<text x="672" y="204" font-size="15" fill="var(--dim)" text-anchor="middle">展望加碼・股價跌</text>
<text x="812" y="388" font-size="16" fill="var(--dim)" text-anchor="middle">人選未定・六個月以上</text>
<text x="60" y="474" font-size="22" fill="var(--ink)">承諾蓋的是舊管理層的章</text>
</svg>
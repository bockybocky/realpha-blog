<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="貼地矮柱與高柱之間的高度差被框起來，下方五個並排方塊">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="68">利差加分散</text>
<line x1="100" y1="350" x2="880" y2="350" stroke="var(--line)" stroke-width="2"/>
<rect x="140" y="338" width="150" height="12" fill="var(--grey)"/>
<text class="g" x="140" y="384">日圓借款成本</text>
<text class="b" x="140" y="410">近乎零</text>
<rect x="420" y="140" width="150" height="210" fill="var(--accent)" opacity="0.8"/>
<text class="g" x="420" y="124">商社股息</text>
<text class="b" x="420" y="384">七到九趴</text>
<rect x="600" y="140" width="190" height="198" fill="var(--accent)" opacity="0.14" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8 7"/>
<text class="c" x="624" y="232">價差</text>
<text class="b" x="624" y="266">每年進帳</text>
<g fill="var(--card)" stroke="var(--line)" stroke-width="2">
<rect x="140" y="446" width="76" height="56" rx="6"/><rect x="232" y="446" width="76" height="56" rx="6"/><rect x="324" y="446" width="76" height="56" rx="6"/><rect x="416" y="446" width="76" height="56" rx="6"/><rect x="508" y="446" width="76" height="56" rx="6"/>
</g>
<text class="g" x="616" y="482">五家，各自已是綜合企業</text>
</svg>
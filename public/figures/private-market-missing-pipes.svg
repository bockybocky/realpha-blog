<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="公開市場是一整條實心管線；私募市場只有虛線輪廓，四個環節各站一個人手動接。">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:20px;font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700}
    .a{fill:var(--accent)}
    .w{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">管線蓋好了沒</text>
<text class="g" x="60" y="177">公開市場</text>
<text class="b" x="520" y="138" text-anchor="middle">交易所・資料設施</text>
<rect x="240" y="150" width="560" height="40" rx="20" fill="var(--grey)"/>
<text class="g" x="820" y="177" style="fill:var(--dim)">已蓋好</text>
<text class="g" x="60" y="367">私募市場</text>
<rect x="240" y="340" width="560" height="40" rx="20" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="310" cy="352" r="9" fill="var(--warn)"/>
<path d="M297,378 Q310,358 323,378 Z" fill="var(--warn)"/>
<circle cx="450" cy="352" r="9" fill="var(--warn)"/>
<path d="M437,378 Q450,358 463,378 Z" fill="var(--warn)"/>
<circle cx="590" cy="352" r="9" fill="var(--warn)"/>
<path d="M577,378 Q590,358 603,378 Z" fill="var(--warn)"/>
<circle cx="730" cy="352" r="9" fill="var(--warn)"/>
<path d="M717,378 Q730,358 743,378 Z" fill="var(--warn)"/>
<text class="b" x="310" y="410" text-anchor="middle">資料室</text>
<text class="b" x="450" y="410" text-anchor="middle">盡調問卷</text>
<text class="b" x="590" y="410" text-anchor="middle">協調</text>
<text class="b" x="730" y="410" text-anchor="middle">交割</text>
<text class="g a" x="820" y="367">機會在這</text>
<text class="c" x="480" y="495" text-anchor="middle">機會＝還沒蓋的管線</text>
</svg>
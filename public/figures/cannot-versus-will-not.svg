<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="一個點往下分成左右兩路，各接一個結果，中間有兩條交叉的虛線">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">同一個變小的數字，兩個相反的意思</text>

<rect x="330" y="100" width="300" height="64" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="140" font-size="19" fill="var(--ink)" text-anchor="middle">數字沒到滿分</text>

<line x1="440" y1="166" x2="250" y2="238" stroke="var(--accent)" stroke-width="3"/>
<polygon points="238,242 254,232 258,246" fill="var(--accent)"/>
<line x1="520" y1="166" x2="710" y2="238" stroke="var(--warn)" stroke-width="3"/>
<polygon points="722,242 702,246 706,232" fill="var(--warn)"/>

<rect x="100" y="252" width="280" height="64" rx="12" fill="var(--accent)" opacity="0.18"/>
<rect x="100" y="252" width="280" height="64" rx="12" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="240" y="292" font-size="20" fill="var(--ink)" text-anchor="middle">不能</text>
<rect x="580" y="252" width="280" height="64" rx="12" fill="var(--warn)" opacity="0.18"/>
<rect x="580" y="252" width="280" height="64" rx="12" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text x="720" y="292" font-size="20" fill="var(--ink)" text-anchor="middle">不想</text>

<line x1="240" y1="320" x2="240" y2="396" stroke="var(--accent)" stroke-width="3"/>
<polygon points="240,408 233,392 247,392" fill="var(--accent)"/>
<line x1="720" y1="320" x2="720" y2="396" stroke="var(--warn)" stroke-width="3"/>
<polygon points="720,408 713,392 727,392" fill="var(--warn)"/>

<line x1="300" y1="330" x2="660" y2="390" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<line x1="660" y1="330" x2="300" y2="390" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text x="480" y="378" font-size="15" fill="var(--grey)" text-anchor="middle">常見的錯配</text>

<rect x="100" y="416" width="280" height="72" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="240" y="450" font-size="16" fill="var(--ink)" text-anchor="middle">去找卡住的那一格</text>
<text x="240" y="474" font-size="15" fill="var(--dim)" text-anchor="middle">不是加油打氣</text>
<rect x="580" y="416" width="280" height="72" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="720" y="450" font-size="16" fill="var(--ink)" text-anchor="middle">先承認不想做</text>
<text x="720" y="474" font-size="15" fill="var(--dim)" text-anchor="middle">不是再排一次時間表</text>

<text x="480" y="546" font-size="22" fill="var(--ink)" text-anchor="middle">選錯一格，藥就下在錯的地方</text>
</svg>
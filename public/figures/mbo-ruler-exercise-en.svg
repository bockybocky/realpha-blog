<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two columns of three boxes are compared with dashed lines, and unmatched items lead to an action with a specific time.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="58" font-size="27" fill="var(--ink)">One Page, Two Columns</text>

  <text x="220" y="116" font-size="20" fill="var(--dim)" text-anchor="middle">How Others Measure Me</text>
  <rect x="80" y="140" width="280" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="220" y="178" font-size="16" fill="var(--ink)" text-anchor="middle">Performance</text>
  <rect x="80" y="226" width="280" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="220" y="264" font-size="16" fill="var(--ink)" text-anchor="middle">Earnings</text>
  <rect x="80" y="312" width="280" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="220" y="350" font-size="16" fill="var(--ink)" text-anchor="middle">Time Home</text>

  <text x="740" y="116" font-size="20" fill="var(--dim)" text-anchor="middle">What I Do Well</text>
  <rect x="600" y="140" width="280" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="740" y="178" font-size="16" fill="var(--ink)" text-anchor="middle">First</text>
  <rect x="600" y="226" width="280" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="740" y="264" font-size="16" fill="var(--ink)" text-anchor="middle">Second</text>
  <rect x="600" y="312" width="280" height="62" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="740" y="350" font-size="16" fill="var(--ink)" text-anchor="middle">Third</text>

  <line x1="368" y1="171" x2="592" y2="171" stroke="var(--grey)" stroke-dasharray="6 6"/>
  <line x1="368" y1="257" x2="592" y2="257" stroke="var(--grey)" stroke-dasharray="6 6"/>
  <line x1="368" y1="343" x2="592" y2="343" stroke="var(--grey)" stroke-dasharray="6 6"/>
  <rect x="412" y="222" width="136" height="36" rx="8" fill="var(--page)" stroke="var(--line)"/>
  <text x="480" y="247" font-size="16" fill="var(--dim)" text-anchor="middle">Do They Match?</text>

  <rect x="240" y="412" width="480" height="62" rx="8" fill="var(--card)" stroke="var(--accent)"/>
  <text x="480" y="450" font-size="19" fill="var(--accent)" text-anchor="middle">Pick One Mismatch: Date, Time, Duration</text>

  <text x="480" y="516" font-size="22" fill="var(--ink)" text-anchor="middle">If you cannot replace the ruler, know which part of you it cannot measure</text>
</svg>
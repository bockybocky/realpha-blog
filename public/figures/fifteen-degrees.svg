<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="窄扇形視野外側多出一小塊角度，原本在外面的人落進了視野">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">不必變成另一個人，放寬十五度</text>
<circle cx="150" cy="300" r="14" fill="var(--ink)"/>
<text x="106" y="350" font-size="19" font-weight="700" fill="var(--ink)">你</text>
<path d="M150 300 L790 196 L790 300 Z" fill="var(--accent)" opacity="0.7"/>
<path d="M150 300 L790 300 L790 404 Z" fill="var(--accent)" opacity="0.18"/>
<line x1="150" y1="300" x2="790" y2="404" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 8"/>
<text x="440" y="264" font-size="19" font-weight="700" fill="var(--page)">原本看得到的</text>
<text x="500" y="372" font-size="19" font-weight="700" fill="var(--accent)">＋15°</text>
<circle cx="740" cy="372" r="13" fill="var(--warn)"/>
<text x="768" y="378" font-size="16" fill="var(--dim)">剛好進來的人</text>
<text x="60" y="484" font-size="22" font-weight="700" fill="var(--ink)">制度要年，角度只要一念</text>
</svg>
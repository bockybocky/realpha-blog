<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上下兩條時間線，上面先預告再動作，下面沒有預告動作直接提早，中間用箭頭標出時間差">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="52" font-size="27" font-weight="700" fill="var(--ink)">兩種前瞻</text>

  <text x="60" y="152" font-size="20" font-weight="700" fill="var(--dim)">先說再做</text>
  <line x1="60" y1="210" x2="900" y2="210" stroke="var(--line)" stroke-width="3"/>
  <circle cx="300" cy="210" r="13" fill="none" stroke="var(--dim)" stroke-width="3"/>
  <text x="300" y="185" font-size="16" fill="var(--dim)" text-anchor="middle">預告</text>
  <rect x="646" y="196" width="28" height="28" rx="5" fill="var(--dim)"/>
  <text x="660" y="185" font-size="16" fill="var(--dim)" text-anchor="middle">動作</text>

  <text x="60" y="372" font-size="20" font-weight="700" fill="var(--accent)">不說先做</text>
  <line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="3"/>
  <rect x="366" y="416" width="28" height="28" rx="5" fill="var(--accent)"/>
  <text x="380" y="405" font-size="16" fill="var(--accent)" text-anchor="middle">動作</text>

  <line x1="380" y1="300" x2="660" y2="300" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="366,300 392,288 392,312" fill="var(--warn)"/>
  <polygon points="674,300 648,288 648,312" fill="var(--warn)"/>
  <text x="520" y="284" font-size="16" fill="var(--warn)" text-anchor="middle">差這一段</text>

  <text x="480" y="500" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">同一個中文詞，兩件事</text>
</svg>
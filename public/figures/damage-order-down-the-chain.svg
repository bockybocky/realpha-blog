<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="五層供應鏈各配一條受傷幅度橫條，二線雲端與品牌伺服器的條明顯比一線與白牌長">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="48">傷害從下游往上排</text>
<text class="s" x="60" y="82">橫條長度＝受傷幅度</text>

<rect x="60" y="106" width="300" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="80" y="146">出租算力的資料中心</text>
<rect x="380" y="124" width="420" height="28" rx="6" fill="var(--warn)"/>

<rect x="60" y="186" width="300" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="80" y="226">二線雲端</text>
<rect x="380" y="204" width="340" height="28" rx="6" fill="var(--warn)"/>

<rect x="60" y="266" width="300" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="80" y="306">一線雲端</text>
<rect x="380" y="284" width="110" height="28" rx="6" fill="var(--grey)"/>
<text class="s" x="504" y="306">自家需求就吃不完</text>

<rect x="60" y="346" width="300" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="80" y="386">品牌伺服器</text>
<rect x="380" y="364" width="300" height="28" rx="6" fill="var(--warn)"/>
<text class="s" x="694" y="386">兼做融資與建置</text>

<rect x="60" y="426" width="300" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="80" y="466">白牌 ODM</text>
<rect x="380" y="444" width="130" height="28" rx="6" fill="var(--grey)"/>
<text class="s" x="524" y="466">北美一線訂單墊著</text>

<text class="c" x="60" y="542">誰靠中國需求吃飯，誰就排在前面</text>
</svg>
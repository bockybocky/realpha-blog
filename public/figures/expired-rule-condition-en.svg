<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The rule's left end rests on a solid pillar while the pillar at its right end is only a dashed empty outline, yet the bar still hangs in place.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">The rule stayed; its conditions left long ago</text>

  <rect x="80" y="130" width="800" height="62" rx="8" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
  <text x="112" y="170" font-size="20" fill="var(--ink)">I don't do this</text>

  <rect x="140" y="230" width="200" height="180" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text x="168" y="290" font-size="16" fill="var(--accent)">The crash that year</text>
  <text x="168" y="322" font-size="16" fill="var(--accent)">Years of losses</text>
  <text x="168" y="354" font-size="16" fill="var(--accent)">Bailout talks failed</text>
  <text x="140" y="460" font-size="19" fill="var(--accent)">Back then: it held</text>

  <rect x="620" y="230" width="200" height="180" rx="6" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 9"/>
  <text x="664" y="330" font-size="16" fill="var(--grey)">Conditions are gone</text>
  <text x="620" y="460" font-size="19" fill="var(--grey)">Today: hanging</text>

  <line x1="80" y1="414" x2="880" y2="414" stroke="var(--line)" stroke-width="3"/>
  <text x="48" y="500" font-size="22" fill="var(--ink)">The rule that saved you is the one you least want touched.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two timelines: in the top one supply comes first and demand much later, in the bottom one demand comes first and taller with supply still short, leaving a gap.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="66" font-size="27" fill="var(--ink)">Which came first is completely reversed</text>

  <rect x="60" y="100" width="840" height="170" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="80" y="136" font-size="20" fill="var(--dim)">The year 2000</text>
  <line x1="140" y1="240" x2="880" y2="240" stroke="var(--line)" stroke-width="2"/>
  <rect x="170" y="160" width="70" height="80" fill="var(--grey)"/>
  <text class="t" x="205" y="264" font-size="16" fill="var(--ink)" text-anchor="middle">Supply</text>
  <rect x="740" y="196" width="70" height="44" fill="var(--accent)"/>
  <text class="t" x="775" y="264" font-size="16" fill="var(--ink)" text-anchor="middle">Demand</text>
  <line x1="250" y1="180" x2="730" y2="180" stroke="var(--grey)" stroke-width="1" stroke-dasharray="6 6"/>
  <text class="t" x="490" y="168" font-size="16" fill="var(--dim)" text-anchor="middle">Ten to twenty years of waiting</text>

  <rect x="60" y="300" width="840" height="170" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="80" y="336" font-size="20" fill="var(--dim)">Now</text>
  <line x1="140" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
  <rect x="170" y="340" width="70" height="100" fill="var(--accent)"/>
  <text class="t" x="205" y="464" font-size="16" fill="var(--ink)" text-anchor="middle">Demand</text>
  <rect x="320" y="396" width="70" height="44" fill="var(--grey)"/>
  <text class="t" x="355" y="464" font-size="16" fill="var(--ink)" text-anchor="middle">Supply</text>
  <line x1="320" y1="340" x2="390" y2="340" stroke="var(--warn)" stroke-width="2"/>
  <line x1="355" y1="340" x2="355" y2="392" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
  <text class="t" x="410" y="356" font-size="19" fill="var(--warn)">Gap: short materials tight</text>
</svg>
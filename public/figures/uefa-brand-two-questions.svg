<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩軸四格，橫軸是一眼認不認得出，縱軸是沒需求的日子還會不會帶著；右上格有洋基帽，左下格有 J 聯賽球衣。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <g style="font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
    <text x="40" y="52" font-size="27" font-weight="700" fill="var(--ink)">品牌的兩道題</text>

    <rect x="520" y="110" width="340" height="170" fill="var(--accent)" opacity="0.12"/>
    <line x1="180" y1="450" x2="880" y2="450" stroke="var(--dim)" stroke-width="2"/>
    <line x1="180" y1="450" x2="180" y2="100" stroke="var(--dim)" stroke-width="2"/>
    <line x1="520" y1="110" x2="520" y2="450" stroke="var(--line)" stroke-width="2"/>
    <line x1="180" y1="280" x2="860" y2="280" stroke="var(--line)" stroke-width="2"/>

    <text x="196" y="96" font-size="19" fill="var(--dim)">沒需求的日子還帶著</text>
    <text x="196" y="486" font-size="19" fill="var(--dim)">只在需要時才用</text>
    <text x="196" y="516" font-size="19" fill="var(--dim)">一眼認不出</text>
    <text x="860" y="516" font-size="19" fill="var(--dim)" text-anchor="end">一秒認得出</text>

    <circle cx="730" cy="190" r="13" fill="var(--accent)"/>
    <text x="730" y="162" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">洋基帽</text>
    <circle cx="320" cy="380" r="13" fill="var(--warn)"/>
    <text x="320" y="352" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">J 聯賽球衣</text>

    <text x="690" y="252" font-size="16" fill="var(--accent)" text-anchor="middle">兩題都是</text>
    <text x="480" y="548" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">答不出來的那幾檔，護城河要重講</text>
  </g>
</svg>
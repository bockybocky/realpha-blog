<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three columns side by side: one central block fanning outward, a large grid of small blocks, and a few cells strung along one track.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="480" y="54" text-anchor="middle" font-size="27" fill="var(--ink)">Three shapes inside one chip</text>

<rect x="40" y="88" width="280" height="392" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="340" y="88" width="280" height="392" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="640" y="88" width="280" height="392" rx="12" fill="var(--card)" stroke="var(--line)"/>

<text x="180" y="132" text-anchor="middle" font-size="20" fill="var(--ink)">CPU</text>
<text x="480" y="132" text-anchor="middle" font-size="20" fill="var(--ink)">GPU</text>
<text x="780" y="132" text-anchor="middle" font-size="20" fill="var(--accent)">ANE</text>
<text x="180" y="162" text-anchor="middle" font-size="15" fill="var(--dim)">Foreman</text>
<text x="480" y="162" text-anchor="middle" font-size="15" fill="var(--dim)">A crowd of workers</text>
<text x="780" y="162" text-anchor="middle" font-size="15" fill="var(--dim)">One assembly line</text>

<line x1="180" y1="325" x2="115" y2="252" stroke="var(--grey)" stroke-width="2"/>
<line x1="180" y1="325" x2="245" y2="252" stroke="var(--grey)" stroke-width="2"/>
<line x1="180" y1="325" x2="115" y2="398" stroke="var(--grey)" stroke-width="2"/>
<line x1="180" y1="325" x2="245" y2="398" stroke="var(--grey)" stroke-width="2"/>
<rect x="145" y="292" width="70" height="66" rx="8" fill="var(--ink)"/>
<rect x="72" y="228" width="66" height="30" rx="6" fill="var(--page)" stroke="var(--line)"/>
<rect x="222" y="228" width="66" height="30" rx="6" fill="var(--page)" stroke="var(--line)"/>
<rect x="72" y="384" width="66" height="30" rx="6" fill="var(--page)" stroke="var(--line)"/>
<rect x="222" y="384" width="66" height="30" rx="6" fill="var(--page)" stroke="var(--line)"/>
<text x="105" y="249" text-anchor="middle" font-size="15" fill="var(--dim)">Scheduling</text>
<text x="255" y="249" text-anchor="middle" font-size="15" fill="var(--dim)">Judgment</text>
<text x="105" y="405" text-anchor="middle" font-size="15" fill="var(--dim)">Odd jobs</text>
<text x="255" y="405" text-anchor="middle" font-size="15" fill="var(--dim)">Handoffs</text>

<g fill="var(--grey)">
<rect x="388" y="262" width="24" height="24" rx="4"/><rect x="420" y="262" width="24" height="24" rx="4"/><rect x="452" y="262" width="24" height="24" rx="4"/><rect x="484" y="262" width="24" height="24" rx="4"/><rect x="516" y="262" width="24" height="24" rx="4"/><rect x="548" y="262" width="24" height="24" rx="4"/>
<rect x="388" y="294" width="24" height="24" rx="4"/><rect x="420" y="294" width="24" height="24" rx="4"/><rect x="452" y="294" width="24" height="24" rx="4"/><rect x="484" y="294" width="24" height="24" rx="4"/><rect x="516" y="294" width="24" height="24" rx="4"/><rect x="548" y="294" width="24" height="24" rx="4"/>
<rect x="388" y="326" width="24" height="24" rx="4"/><rect x="420" y="326" width="24" height="24" rx="4"/><rect x="452" y="326" width="24" height="24" rx="4"/><rect x="484" y="326" width="24" height="24" rx="4"/><rect x="516" y="326" width="24" height="24" rx="4"/><rect x="548" y="326" width="24" height="24" rx="4"/>
<rect x="388" y="358" width="24" height="24" rx="4"/><rect x="420" y="358" width="24" height="24" rx="4"/><rect x="452" y="358" width="24" height="24" rx="4"/><rect x="484" y="358" width="24" height="24" rx="4"/><rect x="516" y="358" width="24" height="24" rx="4"/><rect x="548" y="358" width="24" height="24" rx="4"/>
</g>
<text x="480" y="412" text-anchor="middle" font-size="15" fill="var(--dim)">Many hands, heavy power draw</text>

<line x1="662" y1="325" x2="900" y2="325" stroke="var(--line)" stroke-width="3"/>
<rect x="668" y="307" width="36" height="36" rx="6" fill="var(--accent)"/>
<rect x="718" y="307" width="36" height="36" rx="6" fill="var(--accent)"/>
<rect x="768" y="307" width="36" height="36" rx="6" fill="var(--accent)"/>
<rect x="818" y="307" width="36" height="36" rx="6" fill="var(--accent)"/>
<rect x="868" y="307" width="36" height="36" rx="6" fill="var(--accent)"/>
<path d="M706,325 l10,0 M756,325 l10,0 M806,325 l10,0 M856,325 l10,0" stroke="var(--accent)" stroke-width="3"/>
<text x="786" y="412" text-anchor="middle" font-size="15" fill="var(--dim)">One job only, fastest in order</text>

<text x="480" y="518" text-anchor="middle" font-size="22" fill="var(--ink)">One　·　A crowd　·　A line</text>
</svg>
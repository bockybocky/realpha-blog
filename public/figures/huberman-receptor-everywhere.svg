<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右對比：左邊腦內所有受體點全亮，右邊只有一小簇亮、其餘灰">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">粗糙的來源：受體長在各處</text>
<rect x="60" y="100" width="390" height="330" rx="14" fill="var(--card)"/>
<rect x="510" y="100" width="390" height="330" rx="14" fill="var(--card)"/>
<text class="t" x="90" y="140" font-size="20" font-weight="700" fill="var(--ink)">現在的工具</text>
<text class="t" x="540" y="140" font-size="20" font-weight="700" fill="var(--ink)">想要的</text>
<rect x="95" y="165" width="320" height="200" rx="90" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="545" y="165" width="320" height="200" rx="90" fill="none" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--accent)">
<circle cx="140" cy="205" r="7"/><circle cx="184" cy="205" r="7"/><circle cx="228" cy="205" r="7"/><circle cx="272" cy="205" r="7"/><circle cx="316" cy="205" r="7"/><circle cx="360" cy="205" r="7"/>
<circle cx="140" cy="245" r="7"/><circle cx="184" cy="245" r="7"/><circle cx="228" cy="245" r="7"/><circle cx="272" cy="245" r="7"/><circle cx="316" cy="245" r="7"/><circle cx="360" cy="245" r="7"/>
<circle cx="140" cy="285" r="7"/><circle cx="184" cy="285" r="7"/><circle cx="228" cy="285" r="7"/><circle cx="272" cy="285" r="7"/><circle cx="316" cy="285" r="7"/><circle cx="360" cy="285" r="7"/>
<circle cx="140" cy="325" r="7"/><circle cx="184" cy="325" r="7"/><circle cx="228" cy="325" r="7"/><circle cx="272" cy="325" r="7"/><circle cx="316" cy="325" r="7"/><circle cx="360" cy="325" r="7"/>
</g>
<g fill="var(--grey)">
<circle cx="590" cy="205" r="7"/><circle cx="634" cy="205" r="7"/><circle cx="678" cy="205" r="7"/><circle cx="722" cy="205" r="7"/><circle cx="766" cy="205" r="7"/><circle cx="810" cy="205" r="7"/>
<circle cx="590" cy="245" r="7"/><circle cx="634" cy="245" r="7"/><circle cx="766" cy="245" r="7"/><circle cx="810" cy="245" r="7"/>
<circle cx="590" cy="285" r="7"/><circle cx="634" cy="285" r="7"/><circle cx="766" cy="285" r="7"/><circle cx="810" cy="285" r="7"/>
<circle cx="590" cy="325" r="7"/><circle cx="634" cy="325" r="7"/><circle cx="678" cy="325" r="7"/><circle cx="722" cy="325" r="7"/><circle cx="766" cy="325" r="7"/><circle cx="810" cy="325" r="7"/>
</g>
<g fill="var(--accent)">
<circle cx="678" cy="245" r="8"/><circle cx="722" cy="245" r="8"/><circle cx="678" cy="285" r="8"/><circle cx="722" cy="285" r="8"/>
</g>
<text class="t" x="255" y="398" font-size="16" fill="var(--dim)" text-anchor="middle">全亮：副作用</text>
<text class="t" x="705" y="398" font-size="16" fill="var(--dim)" text-anchor="middle">一塊：還做不到</text>
<text class="t" x="60" y="486" font-size="22" font-weight="700" fill="var(--ink)">缺的是選擇性，不是劑量</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸上一段很短、一段極長，兩段長度落差極大">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="62" font-size="27" fill="var(--ink)" font-weight="700">裝進去很快，拿出來很慢</text>

<rect x="60" y="170" width="110" height="52" rx="8" fill="var(--accent)"/>
<text x="60" y="150" font-size="19" fill="var(--ink)" font-weight="700">裝進去</text>
<text x="60" y="248" font-size="16" fill="var(--dim)">幾年</text>

<rect x="60" y="310" width="830" height="52" rx="8" fill="var(--grey)"/>
<text x="60" y="290" font-size="19" fill="var(--ink)" font-weight="700">拿出來</text>
<text x="60" y="388" font-size="16" fill="var(--dim)">等到盔甲裂了</text>

<line x1="60" y1="420" x2="890" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="600" y="462" font-size="16" fill="var(--warn)">該蓋的與不該蓋的都蓋完了</text>
<text x="48" y="500" font-size="22" fill="var(--ink)">兩段長度的差，就是代價</text>
</svg>
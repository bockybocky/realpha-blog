<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two nearly overlapping lines run most of the chart before one pulls straight up and the other stays put">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.f7-b{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.f7-t{font-size:27px;font-weight:700}
.f7-s{font-size:15px}
.f7-g{font-size:19px;font-weight:700}
.f7-c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="f7-b f7-t" x="60" y="66">90% correlated, yet the outlier hits only one</text>
<line x1="100" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<path d="M100,404 L200,396 L300,402 L400,392 L500,398 L600,390 L700,396 L880,388" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M100,398 L200,388 L300,394 L400,384 L500,390 L600,330 L700,240 L880,164" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="f7-b f7-g" x="700" y="222" fill="var(--accent)">Silver</text>
<text class="f7-b f7-s" x="880" y="146" text-anchor="end" fill="var(--accent)">More than doubled</text>
<text class="f7-b f7-g" x="700" y="374" fill="var(--dim)">Gold</text>
<text class="f7-b f7-s" x="880" y="414" text-anchor="end" fill="var(--dim)">+$20</text>
<path d="M100,452 L100,464 L560,464 L560,452" fill="none" stroke="var(--dim)" stroke-width="2"/>
<text class="f7-b f7-s" x="330" y="488" text-anchor="middle" fill="var(--dim)">Almost in step most of the time</text>
<text class="f7-b f7-c" x="60" y="530">Which is why both belong in the portfolio</text>
</svg>
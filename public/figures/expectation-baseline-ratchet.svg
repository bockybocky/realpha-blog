<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="逐季升高的階梯與比較平緩的營運線，最後一季拉開缺口">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t  { font-size:27px; font-weight:700; fill:var(--ink); }
.gd { font-size:19px; font-weight:600; fill:var(--dim); }
.ga { font-size:19px; font-weight:600; fill:var(--accent); }
.gw { font-size:19px; font-weight:600; fill:var(--warn); }
.b  { font-size:16px; fill:var(--dim); }
.c  { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="64">基準會一季一季墊高</text>
<line x1="120" y1="140" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<path d="M140,400 H290 V350 H440 V300 H590 V250 H740" fill="none" stroke="var(--grey)" stroke-width="4"/>
<polyline points="150,400 300,358 450,318 600,292 740,286" fill="none" stroke="var(--accent)" stroke-width="4"/>
<line x1="740" y1="256" x2="740" y2="280" stroke="var(--warn)" stroke-width="3"/>
<polygon points="740,250 734,264 746,264" fill="var(--warn)"/>
<text class="gw" x="756" y="272">爬不動</text>
<text class="gd" x="300" y="338">預期基準</text>
<text class="ga" x="300" y="386">實際營運</text>
<text class="b" x="188" y="474">上上季</text>
<text class="b" x="346" y="474">上季</text>
<text class="b" x="496" y="474">這季</text>
<text class="b" x="640" y="474">下一季</text>
<text class="c" x="60" y="524">符合預期，會把下一次的門檻墊高</text>
</svg>
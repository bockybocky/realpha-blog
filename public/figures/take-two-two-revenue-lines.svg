<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="長方形被切成八比二兩塊，下方用一小格與一長條對比首週與年年">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="60" font-size="27" fill="var(--ink)">錢從哪一欄進來</text>
<rect x="80" y="120" width="640" height="130" rx="10" fill="var(--accent)"/>
<rect x="720" y="120" width="160" height="130" rx="10" fill="var(--grey)"/>
<text x="110" y="190" font-size="20" fill="var(--page)">遊戲內消費</text>
<text x="110" y="220" font-size="16" fill="var(--page)">約八成</text>
<text x="800" y="190" font-size="20" fill="var(--ink)" text-anchor="middle">賣遊戲</text>
<text x="800" y="220" font-size="16" fill="var(--dim)" text-anchor="middle">約兩成</text>
<text x="48" y="318" font-size="20" fill="var(--dim)">這兩欄各管多久</text>
<rect x="80" y="340" width="52" height="34" rx="6" fill="var(--grey)"/>
<text x="148" y="364" font-size="16" fill="var(--dim)">首週紀錄：一週</text>
<rect x="80" y="392" width="640" height="34" rx="6" fill="var(--accent)"/>
<text x="736" y="416" font-size="16" fill="var(--ink)">遊戲內消費：年年</text>
<text x="48" y="482" font-size="22" fill="var(--ink)">要追的是那條長的</text>
</svg>
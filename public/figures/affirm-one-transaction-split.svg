<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條長橫條幾乎整條是商家收的錢，右端極薄一片是 Affirm 的抽成；下方另一條在尾端外接一塊利息">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t  { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">一筆 250 美元，錢怎麼分</text>

<text class="t" x="60" y="140" font-size="19" fill="var(--dim)">免息方案</text>
<rect x="60" y="158" width="700" height="58" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="158" width="686" height="58" rx="6" fill="var(--grey)"/>
<rect x="746" y="158" width="14" height="58" fill="var(--accent)"/>
<text class="t" x="80" y="194" font-size="16" fill="var(--ink)">商家　245</text>
<line x1="753" y1="158" x2="820" y2="118" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="790" y="108" font-size="16" fill="var(--accent)">Affirm　5</text>
<text class="t" x="790" y="130" font-size="15" fill="var(--dim)">商家折扣率</text>

<text class="t" x="60" y="300" font-size="19" fill="var(--dim)">計息方案</text>
<rect x="60" y="318" width="700" height="58" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="318" width="686" height="58" rx="6" fill="var(--grey)"/>
<rect x="746" y="318" width="14" height="58" fill="var(--accent)"/>
<text class="t" x="80" y="354" font-size="16" fill="var(--ink)">商家　245</text>
<rect x="772" y="318" width="118" height="58" rx="6" fill="var(--accent)" opacity="0.85"/>
<text class="t" x="790" y="354" font-size="16" fill="var(--page)">利息</text>
<text class="t" x="772" y="402" font-size="15" fill="var(--dim)">消費者另外付</text>

<text class="t" x="60" y="470" font-size="22" font-weight="700" fill="var(--ink)">抽成很薄，厚的是利息那一塊</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三根柱子中新利率區塊由下往上長，依序約零、一半、四分之三">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t  { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">帳冊多久換一輪</text>

<rect x="150" y="130" width="160" height="260" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="150" y="420" font-size="19" fill="var(--dim)">升息當下</text>

<rect x="400" y="130" width="160" height="260" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="400" y="260" width="160" height="130" rx="6" fill="var(--accent)" opacity="0.85"/>
<text class="t" x="400" y="420" font-size="19" fill="var(--dim)">一季後</text>
<text class="t" x="424" y="336" font-size="16" fill="var(--page)">新利率　半本</text>

<rect x="650" y="130" width="160" height="260" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="650" y="195" width="160" height="195" rx="6" fill="var(--accent)" opacity="0.85"/>
<text class="t" x="650" y="420" font-size="19" fill="var(--dim)">兩季後</text>
<text class="t" x="674" y="300" font-size="16" fill="var(--page)">新利率　四分之三</text>

<text class="t" x="60" y="478" font-size="22" font-weight="700" fill="var(--ink)">缺口是短暫的，不是結構的</text>
</svg>
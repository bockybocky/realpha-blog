<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Four quadrants of judgment against survival, with lucky and right-but-wiped-out on the diagonal, the two places outcome-based judging gets wrong.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">Being right, and the position surviving</text>

  <rect x="300" y="120" width="270" height="160" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <rect x="570" y="120" width="270" height="160" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="300" y="280" width="270" height="160" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="570" y="280" width="270" height="160" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>

  <text class="t" x="435" y="208" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">Lucky</text>
  <text class="t" x="705" y="208" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">Compounding</text>
  <text class="t" x="435" y="368" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">Vindicated</text>
  <text class="t" x="705" y="368" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">Right but wiped out</text>

  <text class="t" x="286" y="206" font-size="16" text-anchor="end" fill="var(--dim)">Survives</text>
  <text class="t" x="286" y="366" font-size="16" text-anchor="end" fill="var(--dim)">Blows up</text>
  <text class="t" x="230" y="280" font-size="19" fill="var(--dim)" transform="rotate(-90 230 280)" text-anchor="middle">Position</text>

  <text class="t" x="435" y="472" font-size="16" text-anchor="middle" fill="var(--dim)">Wrong</text>
  <text class="t" x="705" y="472" font-size="16" text-anchor="middle" fill="var(--dim)">Right</text>
  <text class="t" x="570" y="504" font-size="19" text-anchor="middle" fill="var(--dim)">Judgment</text>

  <line x1="60" y1="536" x2="900" y2="536" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="60" y="574" font-size="22" font-weight="700" fill="var(--ink)">Blowing up is not being wrong</text>
  <rect x="700" y="560" width="14" height="14" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="724" y="573" font-size="15" fill="var(--dim)">Outcome and judgment disagree</text>
</svg>
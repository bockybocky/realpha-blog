<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Twenty thin layers stack into a column, a dashed ceiling above blocks it, and an upward arrow hits that ceiling and stops." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Stops at 20</text>
<line x1="140" y1="118" x2="560" y2="118" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="140" y="104" font-size="20" fill="var(--warn)">Phys cap</text>
<rect x="200" y="470" width="300" height="20" rx="4" fill="var(--grey)"/>
<text x="350" y="516" font-size="15" fill="var(--dim)" text-anchor="middle">Base</text>
<rect x="210" y="453" width="280" height="12" rx="2" fill="var(--accent)"/>

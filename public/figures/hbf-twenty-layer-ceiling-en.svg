<rect x="210" y="334" width="280" height="12" rx="2" fill="var(--accent)"/>
<rect x="210" y="317" width="280" height="12" rx="2" fill="var(--accent)"/>
<rect x="210" y="300" width="280" height="12" rx="2" fill="var(--accent)"/>
<rect x="210" y="283" width="280" height="12" rx="2" fill="var(--accent)"/>

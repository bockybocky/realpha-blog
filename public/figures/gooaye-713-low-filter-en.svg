<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The lows of three price paths sit above, level with, and below the horizontal dashed line marking the July low.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">Where is November's low versus July's?</text>
<line x1="80" y1="300" x2="900" y2="300" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="t" x="80" y="286" font-size="16" fill="var(--dim)">July low</text>
<polyline points="140,190 190,235 240,252 300,160" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="400,205 450,275 500,301 560,180" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="660,215 710,320 760,362 820,255" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="t" x="220" y="430" font-size="20" fill="var(--ink)" text-anchor="middle">Held</text>
<text class="t" x="220" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">More likely to rise</text>
<text class="t" x="480" y="430" font-size="20" fill="var(--ink)" text-anchor="middle">Near the same level</text>
<text class="t" x="480" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">Still viable</text>
<text class="t" x="740" y="430" font-size="20" fill="var(--ink)" text-anchor="middle">Lower</text>
<text class="t" x="740" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">Move may be over</text>
</svg>
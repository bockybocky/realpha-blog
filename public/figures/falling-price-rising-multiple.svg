<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="股價小跌、獲利大跌，上方倍數線從十倍升到三十倍">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="60" y="70">越跌越貴</text>
<path d="M150 230 L 420 180 L 700 130" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="150" cy="230" r="8" fill="var(--accent)"/>
<circle cx="420" cy="180" r="8" fill="var(--accent)"/>
<circle cx="700" cy="130" r="8" fill="var(--accent)"/>
<text class="t g" x="112" y="208">10 倍</text>
<text class="t g" x="382" y="158">20 倍</text>
<text class="t g" x="662" y="108">30 倍</text>
<text class="t b" x="730" y="136">本益比</text>
<line x1="150" y1="290" x2="900" y2="290" stroke="var(--line)" stroke-width="2"/>
<path d="M150 340 L 420 372 L 700 400" fill="none" stroke="var(--grey)" stroke-width="5"/>
<text class="t b" x="730" y="406">股價</text>
<path d="M150 360 L 420 452 L 700 520" fill="none" stroke="var(--warn)" stroke-width="5"/>
<text class="t b" x="730" y="526">獲利預估</text>
<text class="t c" x="60" y="546">分母掉得比分子快</text>
</svg>
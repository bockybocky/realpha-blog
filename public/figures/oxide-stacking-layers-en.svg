<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the left there is only one layer; on the right, four oxide cell layers sit on the same silicon, standing taller.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">Same silicon; capacity comes from how many layers you can stack</text>

  <line x1="60" y1="402" x2="900" y2="402" stroke="var(--line)" stroke-width="3"/>

  <rect x="110" y="350" width="280" height="50" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="170" y="382" font-size="16" fill="var(--ink)">Silicon: one cell layer</text>
  <text x="110" y="440" font-size="20" fill="var(--dim)">Classic 1T1C</text>

  <rect x="570" y="350" width="280" height="50" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="630" y="382" font-size="16" fill="var(--ink)">Silicon: one cell layer</text>
  <rect x="570" y="304" width="280" height="38" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="570" y="258" width="280" height="38" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="570" y="212" width="280" height="38" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="570" y="166" width="280" height="38" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text x="620" y="192" font-size="16" fill="var(--accent)">Oxide cells</text>
  <text x="620" y="284" font-size="16" fill="var(--accent)">Oxide cells</text>
  <text x="570" y="440" font-size="20" fill="var(--accent)">Low heat, so it can grow up</text>

  <line x1="520" y1="166" x2="520" y2="402" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="400" y="140" font-size="16" fill="var(--dim)">Added capacity</text>

  <text x="48" y="488" font-size="22" fill="var(--ink)">What you add is floors, not floor area.</text>
</svg>
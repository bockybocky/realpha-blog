<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One demand curve with two operating points: when supply cuts the steep stretch the crossing hangs high, and when it cuts the flat stretch the crossing rests on the lower bound.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .a { font-size:16px; font-weight:700; fill:var(--accent); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56">One curve, 2 points</text>
  <text class="g" x="110" y="104">Low</text>
  <text class="g" x="560" y="104">Big</text>

  <line x1="110" y1="130" x2="110" y2="400" stroke="var(--dim)" stroke-width="2"/>
  <line x1="110" y1="400" x2="440" y2="400" stroke="var(--dim)" stroke-width="2"/>
  <text class="s" x="110" y="124">O/N</text>
  <text class="s" x="330" y="426">Reserves</text>
  <line x1="110" y1="368" x2="440" y2="368" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="s" x="382" y="360">Flr</text>
  <path d="M 150 150 C 220 160 245 270 262 330 S 330 366 440 370" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <line x1="252" y1="130" x2="252" y2="400" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="252" cy="296" r="9" fill="var(--accent)"/>
  <text class="a" x="268" y="236">Steep</text>
  <text class="s" x="200" y="150">Dmd</text>
  <text class="s" x="258" y="124">Sup</text>

  <line x1="560" y1="130" x2="560" y2="400" stroke="var(--dim)" stroke-width="2"/>
  <line x1="560" y1="400" x2="900" y2="400" stroke="var(--dim)" stroke-width="2"/>
  <text class="s" x="560" y="124">O/N</text>
  <text class="s" x="786" y="426">Reserves</text>
  <line x1="560" y1="368" x2="900" y2="368" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="s" x="604" y="360">Flr</text>
  <path d="M 600 150 C 670 160 695 270 712 330 S 780 366 900 370" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <line x1="848" y1="130" x2="848" y2="400" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="848" cy="369" r="9" fill="var(--accent)"/>
  <text class="a" x="716" y="340">Flat</text>
  <text class="s" x="854" y="124">Sup</text>
</svg>
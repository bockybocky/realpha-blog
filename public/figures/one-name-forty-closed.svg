<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一個大圓對上四十個小圓的懸殊比例">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">你叫得出的名字，跟你叫不出的</text>
<text x="60" y="90" font-size="15" fill="var(--dim)">來賓引 SBA 與 Wharton，節目裡沒有給具體數字</text>

<circle cx="150" cy="260" r="46" fill="var(--accent)"/>
<text x="150" y="340" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">1</text>
<text x="150" y="368" font-size="16" fill="var(--dim)" text-anchor="middle">賺到大錢</text>
<text x="150" y="392" font-size="16" fill="var(--dim)" text-anchor="middle">名字你聽過</text>

<line x1="258" y1="150" x2="258" y2="420" stroke="var(--line)" stroke-width="2"/>

<g fill="var(--grey)">
<circle cx="340" cy="160" r="14"/><circle cx="404" cy="160" r="14"/><circle cx="468" cy="160" r="14"/><circle cx="532" cy="160" r="14"/><circle cx="596" cy="160" r="14"/><circle cx="660" cy="160" r="14"/><circle cx="724" cy="160" r="14"/><circle cx="788" cy="160" r="14"/>
<circle cx="340" cy="222" r="14"/><circle cx="404" cy="222" r="14"/><circle cx="468" cy="222" r="14"/><circle cx="532" cy="222" r="14"/><circle cx="596" cy="222" r="14"/><circle cx="660" cy="222" r="14"/><circle cx="724" cy="222" r="14"/><circle cx="788" cy="222" r="14"/>
<circle cx="340" cy="284" r="14"/><circle cx="404" cy="284" r="14"/><circle cx="468" cy="284" r="14"/><circle cx="532" cy="284" r="14"/><circle cx="596" cy="284" r="14"/><circle cx="660" cy="284" r="14"/><circle cx="724" cy="284" r="14"/><circle cx="788" cy="284" r="14"/>
<circle cx="340" cy="346" r="14"/><circle cx="404" cy="346" r="14"/><circle cx="468" cy="346" r="14"/><circle cx="532" cy="346" r="14"/><circle cx="596" cy="346" r="14"/><circle cx="660" cy="346" r="14"/><circle cx="724" cy="346" r="14"/><circle cx="788" cy="346" r="14"/>
<circle cx="340" cy="408" r="14"/><circle cx="404" cy="408" r="14"/><circle cx="468" cy="408" r="14"/><circle cx="532" cy="408" r="14"/><circle cx="596" cy="408" r="14"/><circle cx="660" cy="408" r="14"/><circle cx="724" cy="408" r="14"/><circle cx="788" cy="408" r="14"/>
</g>
<text x="840" y="166" font-size="20" font-weight="700" fill="var(--ink)">40</text>
<text x="840" y="192" font-size="16" fill="var(--dim)">店關了</text>
<text x="840" y="216" font-size="16" fill="var(--dim)">回去當牙醫</text>

<text x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">進入門檻為零，倒掉的那堆你不會聽說</text>
</g>
</svg>
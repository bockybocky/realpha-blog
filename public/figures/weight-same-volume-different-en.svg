<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Two piles of trash read the same on the scale, but in the same container one leaves room to spare and the other overflows.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" fill="var(--ink)">A century of measuring answered a different question</text>

<text x="60" y="110" font-size="20" fill="var(--dim)">On the scale</text>
<rect x="100" y="178" width="100" height="58" rx="6" fill="var(--grey)"/>
<rect x="420" y="128" width="180" height="108" rx="10" fill="var(--grey)" opacity="0.45"/>
<rect x="100" y="236" width="220" height="16" fill="var(--card)" stroke="var(--line)"/>
<rect x="420" y="236" width="220" height="16" fill="var(--card)" stroke="var(--line)"/>
<path d="M150 252 L170 290 L130 290 Z" fill="var(--card)" stroke="var(--line)"/>
<path d="M470 252 L490 290 L450 290 Z" fill="var(--card)" stroke="var(--line)"/>
<line x1="100" y1="300" x2="320" y2="300" stroke="var(--line)" stroke-width="2"/>
<line x1="420" y1="300" x2="640" y2="300" stroke="var(--line)" stroke-width="2"/>
<line x1="230" y1="292" x2="230" y2="312" stroke="var(--accent)" stroke-width="4"/>
<line x1="550" y1="292" x2="550" y2="312" stroke="var(--accent)" stroke-width="4"/>
<text x="230" y="334" font-size="16" fill="var(--accent)" text-anchor="middle">Same reading</text>
<text x="550" y="334" font-size="16" fill="var(--accent)" text-anchor="middle">Same reading</text>

<text x="700" y="200" font-size="19" fill="var(--dim)">Weight</text>
<text x="700" y="226" font-size="15" fill="var(--dim)">A century of records</text>

<text x="60" y="394" font-size="20" fill="var(--dim)">In the same container</text>
<rect x="100" y="420" width="220" height="130" fill="none" stroke="var(--ink)" stroke-width="3"/>
<rect x="130" y="478" width="100" height="58" rx="6" fill="var(--grey)"/>
<line x1="100" y1="420" x2="320" y2="420" stroke="var(--accent)" stroke-width="3"/>
<text x="340" y="446" font-size="16" fill="var(--accent)">Room to spare</text>

<rect x="420" y="420" width="220" height="130" fill="none" stroke="var(--ink)" stroke-width="3"/>
<rect x="440" y="382" width="180" height="154" rx="10" fill="var(--warn)" opacity="0.45"/>
<line x1="420" y1="420" x2="640" y2="420" stroke="var(--warn)" stroke-width="3"/>
<text x="660" y="400" font-size="16" fill="var(--warn)">Will not fit</text>

<text x="700" y="490" font-size="19" fill="var(--dim)">Volume</text>
<text x="700" y="516" font-size="15" fill="var(--dim)">What containers really ask</text>

<text x="60" y="586" font-size="22" fill="var(--ink)">What is missing is not data but a second unit</text>
</g>
</svg>
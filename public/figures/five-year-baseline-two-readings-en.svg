<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The five-year blocks sit in different places on the two timelines, one flush against the filing date and the other pushed to the left.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="60" font-size="27" font-weight="700" fill="var(--ink)">Which day you count the "past five years" from</text>

<text class="t" x="60" y="150" font-size="20" font-weight="700" fill="var(--ink)">Reading one</text>
<line x1="60" y1="210" x2="900" y2="210" stroke="var(--line)" stroke-width="2"/>
<rect x="520" y="178" width="320" height="32" fill="var(--grey)"/>
<text class="t" x="680" y="200" font-size="16" fill="var(--ink)" text-anchor="middle">5-year baseline</text>
<line x1="840" y1="160" x2="840" y2="232" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="840" y="256" font-size="16" fill="var(--warn)" text-anchor="end">Filing date</text>

<text class="t" x="60" y="330" font-size="20" font-weight="700" fill="var(--ink)">Reading two</text>
<line x1="60" y1="390" x2="900" y2="390" stroke="var(--line)" stroke-width="2"/>
<rect x="300" y="358" width="320" height="32" fill="var(--accent)"/>
<text class="t" x="460" y="380" font-size="16" fill="var(--page)" text-anchor="middle">5-year baseline</text>
<line x1="620" y1="340" x2="620" y2="412" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="620" y="436" font-size="16" fill="var(--accent)" text-anchor="middle">Differential treatment begins</text>
<line x1="840" y1="340" x2="840" y2="412" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="840" y="436" font-size="16" fill="var(--warn)" text-anchor="end">Filing date</text>

<text class="t" x="480" y="508" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Same clause, but it benchmarks different administrations</text>
</svg>
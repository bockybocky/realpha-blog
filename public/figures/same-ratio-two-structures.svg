<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩個同樣頭重腳輕的結構，差別在底層下方站著幾個願意接的人">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .dm { font-size:16px; fill:var(--dim); }
    .cc { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56">同樣頭重腳輕，兩種結局</text>
<rect x="60" y="90" width="400" height="390" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="128">寬市場</text>
<rect x="100" y="160" width="320" height="110" fill="var(--accent)" opacity="0.28" stroke="var(--line)"/>
<text class="dm" x="196" y="222">衍生品量很大</text>
<rect x="220" y="286" width="80" height="34" fill="var(--accent)"/>
<text class="dm" x="312" y="310">底層現貨</text>
<g fill="var(--accent)">
<rect x="104" y="356" width="30" height="34"/><rect x="149" y="356" width="30" height="34"/>
<rect x="194" y="356" width="30" height="34"/><rect x="239" y="356" width="30" height="34"/>
<rect x="284" y="356" width="30" height="34"/><rect x="329" y="356" width="30" height="34"/>
<rect x="374" y="356" width="30" height="34"/>
</g>
<text class="dm" x="104" y="424">一排人願意接</text>
<text class="dm" x="104" y="450">偏離 1% 就報價</text>
<rect x="500" y="90" width="400" height="390" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="524" y="128">薄市場</text>
<rect x="540" y="160" width="320" height="110" fill="var(--warn)" opacity="0.26" stroke="var(--line)"/>
<text class="dm" x="636" y="222">衍生品量很大</text>
<rect x="660" y="286" width="80" height="34" fill="var(--warn)"/>
<text class="dm" x="752" y="310">底層現貨</text>
<g fill="var(--warn)">
<rect x="664" y="356" width="30" height="34"/><rect x="709" y="356" width="30" height="34"/>
</g>
<text class="dm" x="544" y="424">只有幾個掛單</text>
<text class="dm" x="544" y="450">推底層就能傳導進來</text>
<text class="cc" x="60" y="528">量比說不了什麼，壞天氣裡誰在接才算</text>
</svg>
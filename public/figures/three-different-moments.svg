<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸上三個先後的點被兩段間距分開，上方一個括號把三點壓縮成單一個點">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">三個不同的時刻</text>

<path d="M180 130 L180 108 L780 108 L780 130" stroke="var(--warn)" stroke-width="2" fill="none"/>
<path d="M480 108 L480 84" stroke="var(--warn)" stroke-width="2"/>
<circle cx="480" cy="76" r="8" fill="var(--warn)"/>
<text x="510" y="84" font-size="19" fill="var(--warn)">新聞標題：壓成一個點</text>

<path d="M120 300 L860 300" stroke="var(--line)" stroke-width="2.5"/>
<path d="M860 300 L844 292 L844 308 Z" fill="var(--line)"/>
<circle cx="180" cy="300" r="11" fill="var(--accent)"/>
<circle cx="480" cy="300" r="11" fill="var(--accent)"/>
<circle cx="780" cy="300" r="11" fill="var(--accent)"/>
<text x="132" y="352" font-size="19" fill="var(--ink)">已經發生</text>
<text x="432" y="352" font-size="19" fill="var(--ink)">被看見</text>
<text x="716" y="352" font-size="19" fill="var(--ink)">進到數字</text>

<path d="M192 252 L468 252" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M492 252 L768 252" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="272" y="238" font-size="16" fill="var(--dim)">時間差</text>
<text x="572" y="238" font-size="16" fill="var(--dim)">時間差</text>

<text x="60" y="440" font-size="22" fill="var(--ink)">「還沒看到」不等於「不會發生」</text>
</svg>
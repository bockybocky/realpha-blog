<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="凳面往右傾斜，兩隻腳粗長撐地，第三隻腳短一截沒接到地面">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">兩腳撐得很用力，第三腳沒落地</text>
  <polygon points="120,150 840,206 840,236 120,180" fill="var(--ink)" opacity="0.85"/>
  <rect x="200" y="176" width="34" height="250" fill="var(--accent)"/>
  <rect x="470" y="198" width="34" height="228" fill="var(--accent)"/>
  <rect x="760" y="230" width="22" height="120" fill="var(--warn)"/>
  <line x1="120" y1="426" x2="880" y2="426" stroke="var(--line)" stroke-width="4"/>
  <line x1="760" y1="350" x2="760" y2="426" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="782" y1="350" x2="782" y2="426" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="g" x="170" y="466">可靠</text>
  <text class="g" x="440" y="466">減碳</text>
  <text class="g" x="716" y="466">可負擔</text>
  <text class="n" x="166" y="494">川普重押</text>
  <text class="n" x="436" y="494">拜登重押</text>
  <text class="n" x="690" y="494">兩邊都忽略</text>
  <text class="c" x="60" y="542">他下的注：接下來兩年，往短的那一腳硬轉</text>
</svg>
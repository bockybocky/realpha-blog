<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一條時間軸上兩根長度懸殊的橫條，合約有效期只到二〇二九年初，油田開發週期延伸二十年並以虛線再往外延伸">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="60">兩個時鐘，走的長度不一樣</text>
<text class="d" x="60" y="90">橫軸＝年份</text>

<text class="g" x="60" y="166">合約有效期</text>
<rect x="250" y="140" width="103" height="46" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
<text class="d" x="368" y="170">2029/01/20 12:01 到期</text>

<text class="g" x="60" y="272">油田開發</text>
<rect x="250" y="246" width="600" height="46" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="b" x="272" y="277">20 年</text>
<line x1="850" y1="269" x2="920" y2="269" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="8 6"/>
<path d="M908 261 L920 269 L908 277" stroke="var(--accent)" stroke-width="2.5" fill="none"/>
<text class="d" x="700" y="277">重油帶更慢</text>

<line x1="250" y1="340" x2="900" y2="340" stroke="var(--line)" stroke-width="2"/>
<line x1="250" y1="334" x2="250" y2="346" stroke="var(--grey)" stroke-width="2"/>
<line x1="353" y1="334" x2="353" y2="346" stroke="var(--warn)" stroke-width="2.5"/>
<line x1="490" y1="334" x2="490" y2="346" stroke="var(--grey)" stroke-width="2"/>
<line x1="850" y1="334" x2="850" y2="346" stroke="var(--grey)" stroke-width="2"/>
<text class="d" x="250" y="366" text-anchor="middle">2026</text>
<text class="d" x="353" y="366" text-anchor="middle">2029</text>
<text class="d" x="490" y="366" text-anchor="middle">2033</text>
<text class="d" x="850" y="366" text-anchor="middle">2046</text>
<text class="d" x="490" y="392" text-anchor="middle">供給缺口</text>

<line x1="353" y1="120" x2="353" y2="330" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>

<text class="c" x="60" y="466">合約的有效期，蓋不到開發週期的六分之一。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three boxes multiplied together: when any one box is empty the result bar is near zero; with little data but full systems and culture the result bar is longest.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="80" y="62" font-size="27" font-weight="700" fill="var(--ink)">It multiplies, it doesn't add</text>

  <text x="80" y="124" font-size="16" fill="var(--dim)">Data</text>
  <text x="200" y="124" font-size="16" fill="var(--dim)">Systems</text>
  <text x="320" y="124" font-size="16" fill="var(--dim)">Culture</text>
  <text x="560" y="124" font-size="16" fill="var(--dim)">Better recommendations</text>

  <text x="80" y="176" font-size="20" font-weight="700" fill="var(--dim)">Blockbuster</text>
  <rect x="80" y="196" width="80" height="80" fill="none" stroke="var(--line)" stroke-width="2"/>
  <rect x="80" y="196" width="80" height="80" fill="var(--grey)"/>
  <text x="176" y="244" font-size="19" fill="var(--dim)">×</text>
  <rect x="200" y="196" width="80" height="80" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text x="296" y="244" font-size="19" fill="var(--dim)">×</text>
  <rect x="320" y="196" width="80" height="80" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text x="420" y="244" font-size="19" fill="var(--dim)">＝</text>
  <rect x="460" y="226" width="14" height="20" fill="var(--grey)"/>

  <text x="80" y="356" font-size="20" font-weight="700" fill="var(--accent)">Netflix</text>
  <rect x="80" y="376" width="80" height="80" fill="none" stroke="var(--line)" stroke-width="2"/>
  <rect x="80" y="440" width="80" height="16" fill="var(--accent)"/>
  <text x="176" y="424" font-size="19" fill="var(--dim)">×</text>
  <rect x="200" y="376" width="80" height="80" fill="var(--accent)"/>
  <text x="296" y="424" font-size="19" fill="var(--dim)">×</text>
  <rect x="320" y="376" width="80" height="80" fill="var(--accent)"/>
  <text x="420" y="424" font-size="19" fill="var(--dim)">＝</text>
  <rect x="460" y="406" width="380" height="20" fill="var(--accent)"/>

  <line x1="80" y1="496" x2="880" y2="496" stroke="var(--line)" stroke-width="2"/>
  <text x="80" y="536" font-size="22" font-weight="700" fill="var(--ink)">One empty box zeroes out everything before it</text>
</svg>
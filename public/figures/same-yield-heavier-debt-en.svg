<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The yield line sits at the same height at both points in time, while the debt bar below grows from short to tall, with a dashed extension reaching 200%.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="50" text-anchor="middle">Same 5%, more debt</text>
<line x1="140" y1="160" x2="880" y2="160" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="480" y="140" text-anchor="middle" style="fill:var(--accent)">Long yield ≈5%</text>
<circle cx="280" cy="160" r="10" fill="var(--accent)"/>
<circle cx="680" cy="160" r="10" fill="var(--accent)"/>
<line x1="280" y1="172" x2="280" y2="430" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 6"/>
<line x1="680" y1="172" x2="680" y2="200" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 6"/>
<line x1="120" y1="480" x2="880" y2="480" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="40" y="475">Debt/GDP</text>
<rect x="220" y="430" width="120" height="50" fill="var(--grey)"/>
<text class="s" x="352" y="462">Low</text>
<rect x="620" y="340" width="120" height="140" fill="var(--accent)"/>
<rect x="620" y="200" width="120" height="140" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="b" x="754" y="415">Now 100%</text>
<text class="b" x="754" y="275" style="fill:var(--warn)">In 20y: 200%</text>
<text class="g" x="280" y="515" text-anchor="middle">2007 pre-GFC</text>
<text class="g" x="680" y="515" text-anchor="middle">Now</text>
<text class="c" x="480" y="560" text-anchor="middle">Same 5%, heavier</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="兩條橫柱，上條幾乎橫跨整張圖，下條只剩極短一截。">
<rect x="0" y="0" width="960" height="460" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">消費端的月活差距</text>
<path d="M150 120 L150 400" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="196" font-size="20" font-weight="700" fill="var(--ink)">豆包</text>
<rect x="150" y="168" width="700" height="56" fill="var(--accent)"/>
<text x="150" y="152" font-size="16" fill="var(--dim)">3.24 億（估計）</text>
<text x="60" y="326" font-size="20" font-weight="700" fill="var(--ink)">智譜清言</text>
<rect x="150" y="298" width="24" height="56" fill="var(--warn)"/>
<text x="192" y="332" font-size="16" fill="var(--warn)">1,100 萬（高點）</text>
<text x="60" y="428" font-size="22" font-weight="700" fill="var(--ink)">通路在誰手上，這張圖就長成誰的樣子</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="左側一矮一高兩根柱子代表疊層一百層與一千層，右側同樣產能下一般料十顆、特殊料只有一顆">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="600" fill="var(--ink)">一顆料吃掉十倍產能</text>

  <text x="110" y="112" font-size="19" fill="var(--dim)">疊層</text>
  <rect x="150" y="425" width="90" height="45" fill="var(--grey)"/>
  <rect x="310" y="140" width="90" height="330" fill="var(--accent)"/>
  <text x="195" y="410" font-size="19" text-anchor="middle" fill="var(--ink)">一般料</text>
  <text x="355" y="125" font-size="19" text-anchor="middle" fill="var(--ink)">特殊料</text>
  <line x1="110" y1="470" x2="480" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text x="195" y="498" font-size="16" text-anchor="middle" fill="var(--dim)">一百層</text>
  <text x="355" y="498" font-size="16" text-anchor="middle" fill="var(--dim)">一千層以上</text>

  <line x1="520" y1="110" x2="520" y2="470" stroke="var(--line)" stroke-width="2"/>

  <text x="560" y="112" font-size="19" fill="var(--dim)">同樣產能</text>
  <text x="560" y="178" font-size="19" fill="var(--ink)">一般料</text>
  <rect x="660" y="150" width="28" height="28" fill="var(--grey)"/>
  <rect x="694" y="150" width="28" height="28" fill="var(--grey)"/>
  <rect x="728" y="150" width="28" height="28" fill="var(--grey)"/>
  <rect x="762" y="150" width="28" height="28" fill="var(--grey)"/>
  <rect x="796" y="150" width="28" height="28" fill="var(--grey)"/>
  <rect x="660" y="188" width="28" height="28" fill="var(--grey)"/>
  <rect x="694" y="188" width="28" height="28" fill="var(--grey)"/>
  <rect x="728" y="188" width="28" height="28" fill="var(--grey)"/>
  <rect x="762" y="188" width="28" height="28" fill="var(--grey)"/>
  <rect x="796" y="188" width="28" height="28" fill="var(--grey)"/>
  <text x="660" y="244" font-size="16" fill="var(--dim)">十顆</text>

  <text x="560" y="318" font-size="19" fill="var(--ink)">特殊料</text>
  <rect x="660" y="290" width="28" height="28" fill="var(--accent)"/>
  <text x="660" y="346" font-size="16" fill="var(--dim)">一顆</text>

  <text x="480" y="552" font-size="22" text-anchor="middle" fill="var(--ink)">疊得越高，做得越少</text>
</svg>
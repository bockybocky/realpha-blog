<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="八個方塊全部只連到同一個中心圓，方塊彼此之間沒有連線">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" fill="var(--ink)">每一條線都經過同一個點</text>
<line x1="480" y1="320" x2="480" y2="140" stroke="var(--grey)" stroke-width="2"/>
<line x1="480" y1="320" x2="676" y2="186" stroke="var(--grey)" stroke-width="2"/>
<line x1="480" y1="320" x2="740" y2="320" stroke="var(--grey)" stroke-width="2"/>
<line x1="480" y1="320" x2="676" y2="454" stroke="var(--grey)" stroke-width="2"/>
<line x1="480" y1="320" x2="480" y2="500" stroke="var(--grey)" stroke-width="2"/>
<line x1="480" y1="320" x2="284" y2="454" stroke="var(--grey)" stroke-width="2"/>
<line x1="480" y1="320" x2="220" y2="320" stroke="var(--grey)" stroke-width="2"/>
<line x1="480" y1="320" x2="284" y2="186" stroke="var(--grey)" stroke-width="2"/>
<rect x="400" y="112" width="160" height="46" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="142" font-size="19" fill="var(--ink)" text-anchor="middle">政府層級關係</text>
<rect x="608" y="162" width="140" height="46" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="678" y="192" font-size="19" fill="var(--ink)" text-anchor="middle">企業客戶</text>
<rect x="690" y="296" width="180" height="46" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="780" y="326" font-size="19" fill="var(--ink)" text-anchor="middle">循環式融資案</text>
<rect x="608" y="430" width="180" height="46" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="698" y="460" font-size="19" fill="var(--ink)" text-anchor="middle">60 位直接匯報</text>
<rect x="390" y="478" width="180" height="46" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="508" font-size="19" fill="var(--ink)" text-anchor="middle">全球供應鏈</text>
<rect x="172" y="430" width="140" height="46" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="242" y="460" font-size="19" fill="var(--ink)" text-anchor="middle">技術方向</text>
<rect x="90" y="296" width="140" height="46" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="160" y="326" font-size="19" fill="var(--ink)" text-anchor="middle">品牌形象</text>
<rect x="172" y="162" width="140" height="46" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="242" y="192" font-size="19" fill="var(--ink)" text-anchor="middle">虛擬化身</text>
<circle cx="480" cy="320" r="60" fill="var(--accent)"/>
<text x="480" y="328" font-size="20" fill="var(--page)" text-anchor="middle">一個人</text>
<text x="60" y="578" font-size="22" fill="var(--ink)">抽掉中心，八條線一起斷</text>
</svg>
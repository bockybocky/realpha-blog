<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A before-and-after comparison of two bridges with identical decks and swapped piers">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="72">Swap the piers and nobody on the bridge notices</text>

<rect x="70" y="120" width="380" height="330" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="260" y="160" text-anchor="middle">Today</text>
<rect x="110" y="200" width="300" height="56" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="260" y="236" text-anchor="middle">Stablecoin transactions</text>
<rect x="164" y="256" width="18" height="84" fill="var(--grey)"/>
<rect x="338" y="256" width="18" height="84" fill="var(--grey)"/>
<rect x="110" y="340" width="300" height="64" rx="8" fill="var(--accent)" opacity="0.8"/>
<text class="g" x="260" y="380" text-anchor="middle" fill="var(--page)">Collateral: US Treasuries</text>

<line x1="466" y1="285" x2="500" y2="285" stroke="var(--dim)" stroke-width="3"/>
<polygon points="500,275 520,285 500,295" fill="var(--dim)"/>

<rect x="530" y="120" width="380" height="330" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="720" y="160" text-anchor="middle">One day</text>
<rect x="570" y="200" width="300" height="56" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="720" y="236" text-anchor="middle">Stablecoin transactions</text>
<rect x="624" y="256" width="18" height="84" fill="var(--grey)"/>
<rect x="798" y="256" width="18" height="84" fill="var(--grey)"/>
<rect x="570" y="340" width="300" height="64" rx="8" fill="var(--warn)"/>
<text class="g" x="720" y="380" text-anchor="middle" fill="var(--page)">Collateral: something else</text>

<text class="c" x="60" y="512">The deck is unchanged, so nobody stops to ask</text>
</svg>
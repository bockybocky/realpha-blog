<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩根並列柱狀，石油本業四百八十六億的柱子很高，成功上限增加的七十億只有一小截">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">先把成功寫死，再看高度</text>
  <text x="60" y="96" font-size="16" fill="var(--dim)">單位：億美元</text>

  <line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>

  <rect x="200" y="130" width="150" height="300" rx="6" fill="var(--grey)"/>
  <text x="200" y="118" font-size="20" font-weight="700" fill="var(--ink)">486</text>
  <text x="200" y="462" font-size="16" fill="var(--dim)">石油本業</text>
  <text x="200" y="486" font-size="15" fill="var(--dim)">一九七七</text>

  <rect x="580" y="387" width="150" height="43" rx="6" fill="var(--accent)"/>
  <text x="580" y="375" font-size="20" font-weight="700" fill="var(--ink)">＋70</text>
  <text x="580" y="462" font-size="16" fill="var(--dim)">辦公室事業的上限</text>
  <text x="580" y="486" font-size="15" fill="var(--dim)">長到全錄那麼大</text>

  <text x="60" y="524" font-size="22" font-weight="700" fill="var(--ink)">連最好的一天都改變不了什麼</text>
</svg>
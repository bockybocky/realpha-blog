<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two panels: in the right one the earnings-estimate block shrinks and the multiple at the same price goes up.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">Cheap, computed from whose estimate</text>
<text x="60" y="100" font-size="16" fill="var(--dim)">Small numbers, for illustration</text>
<rect x="60" y="130" width="380" height="330" rx="10" fill="var(--card)"/>
<rect x="520" y="130" width="380" height="330" rx="10" fill="var(--card)"/>
<text x="84" y="170" font-size="20" fill="var(--ink)">Now</text>
<text x="544" y="170" font-size="20" fill="var(--warn)">Later-year plans cut</text>
<rect x="110" y="200" width="100" height="60" fill="var(--grey)"/>
<text x="230" y="238" font-size="19" fill="var(--ink)">Price $24</text>
<rect x="110" y="300" width="100" height="100" fill="var(--accent)"/>
<text x="230" y="358" font-size="19" fill="var(--ink)">Earnings est. $2</text>
<text x="110" y="436" font-size="22" fill="var(--ink)">12x, looks cheap</text>
<rect x="570" y="200" width="100" height="60" fill="var(--grey)"/>
<text x="690" y="238" font-size="19" fill="var(--ink)">Price $24</text>
<rect x="570" y="340" width="100" height="60" fill="var(--warn)"/>
<text x="690" y="378" font-size="19" fill="var(--ink)">Earnings est. $1</text>
<text x="570" y="436" font-size="22" fill="var(--ink)">24x, cheap is gone</text>
<text x="60" y="508" font-size="22" fill="var(--ink)">The denominator rests on build-out plans at a few compute-renting new clouds</text>
</svg>
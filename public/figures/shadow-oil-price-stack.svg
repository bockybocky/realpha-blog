<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="報價之上疊加煉油利差與運費保險，堆成實際支付的油價">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
 svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
       --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
 @media (prefers-color-scheme: dark) {
   svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
         --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
 }
 text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
 .h{font-size:27px;font-weight:700}
 .g{font-size:19px;fill:var(--dim)}
 .b{font-size:16px;fill:var(--dim)}
 .c{font-size:22px;font-weight:700}
</style>
<text class="h" x="60" y="56">沒有人在消費 WTI</text>
<line x1="60" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="3"/>
<rect x="180" y="330" width="200" height="120" fill="var(--grey)"/>
<text class="b" x="398" y="400">螢幕上的 WTI 報價</text>
<rect x="180" y="240" width="200" height="90" fill="var(--accent)"/>
<text class="b" x="398" y="292" fill="var(--accent)">＋$20 煉油利差</text>
<rect x="180" y="150" width="200" height="90" fill="var(--warn)"/>
<text class="b" x="398" y="202" fill="var(--warn)">＋$20 運費與保險</text>
<line x1="150" y1="150" x2="150" y2="450" stroke="var(--dim)" stroke-width="2"/>
<text class="g" x="180" y="128">亞洲實際買到的精煉產品</text>
<text class="c" x="60" y="512">我們住在一個 150 到 200 美元油價的世界</text>
</svg>
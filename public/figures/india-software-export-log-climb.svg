<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="對數刻度上一條從左下陡升到右上的曲線，跨越約五個十倍刻度">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">每一格是十倍，它爬了快五格</text>
<line x1="220" y1="440" x2="860" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="220" y1="380" x2="860" y2="380" stroke="var(--line)" stroke-width="1"/>
<line x1="220" y1="320" x2="860" y2="320" stroke="var(--line)" stroke-width="1"/>
<line x1="220" y1="260" x2="860" y2="260" stroke="var(--line)" stroke-width="1"/>
<line x1="220" y1="200" x2="860" y2="200" stroke="var(--line)" stroke-width="1"/>
<line x1="220" y1="140" x2="860" y2="140" stroke="var(--line)" stroke-width="1"/>
<text x="195" y="446" text-anchor="end" font-size="15" fill="var(--dim)">400 萬</text>
<text x="195" y="386" text-anchor="end" font-size="15" fill="var(--dim)">4 千萬</text>
<text x="195" y="326" text-anchor="end" font-size="15" fill="var(--dim)">4 億</text>
<text x="195" y="266" text-anchor="end" font-size="15" fill="var(--dim)">40 億</text>
<text x="195" y="206" text-anchor="end" font-size="15" fill="var(--dim)">400 億</text>
<text x="195" y="146" text-anchor="end" font-size="15" fill="var(--dim)">4 千億</text>
<path d="M250 440 C470 432 620 360 820 172" stroke="var(--accent)" stroke-width="3" fill="none"/>
<circle cx="250" cy="440" r="7" fill="var(--accent)"/>
<circle cx="820" cy="172" r="7" fill="var(--accent)"/>
<text x="250" y="478" text-anchor="middle" font-size="16" fill="var(--ink)">1980</text>
<text x="820" y="478" text-anchor="middle" font-size="16" fill="var(--ink)">2023</text>
<text x="700" y="150" text-anchor="middle" font-size="19" fill="var(--ink)">1,940 億美元</text>
<text x="480" y="528" text-anchor="middle" font-size="22" fill="var(--ink)">起點小得幾乎看不見</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三束光纖由左到右從稀疏變成密不可分，數量級跳升">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .k { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">位置一變，數量就爆了</text>

<text class="g" x="80" y="140">模組</text>
<text class="b" x="80" y="166">四到十六條</text>
<g stroke="var(--grey)" stroke-width="4">
<line x1="80" y1="210" x2="240" y2="210"/><line x1="80" y1="226" x2="240" y2="226"/>
<line x1="80" y1="242" x2="240" y2="242"/><line x1="80" y1="258" x2="240" y2="258"/>
</g>

<text class="g" x="330" y="140">陣列一面</text>
<text class="b" x="330" y="166">四十到八十條</text>
<g stroke="var(--accent)" stroke-width="3" opacity="0.8">
<line x1="330" y1="196" x2="500" y2="196"/><line x1="330" y1="206" x2="500" y2="206"/>
<line x1="330" y1="216" x2="500" y2="216"/><line x1="330" y1="226" x2="500" y2="226"/>
<line x1="330" y1="236" x2="500" y2="236"/><line x1="330" y1="246" x2="500" y2="246"/>
<line x1="330" y1="256" x2="500" y2="256"/><line x1="330" y1="266" x2="500" y2="266"/>
<line x1="330" y1="276" x2="500" y2="276"/><line x1="330" y1="286" x2="500" y2="286"/>
</g>

<text class="g" x="600" y="140">一個引擎</text>
<text class="b" x="600" y="166">上千條</text>
<rect x="600" y="186" width="280" height="160" fill="var(--accent)" opacity="0.28"/>
<g stroke="var(--accent)" stroke-width="1">
<line x1="600" y1="190" x2="880" y2="190"/><line x1="600" y1="198" x2="880" y2="198"/>
<line x1="600" y1="206" x2="880" y2="206"/><line x1="600" y1="214" x2="880" y2="214"/>
<line x1="600" y1="222" x2="880" y2="222"/><line x1="600" y1="230" x2="880" y2="230"/>
<line x1="600" y1="238" x2="880" y2="238"/><line x1="600" y1="246" x2="880" y2="246"/>
<line x1="600" y1="254" x2="880" y2="254"/><line x1="600" y1="262" x2="880" y2="262"/>
<line x1="600" y1="270" x2="880" y2="270"/><line x1="600" y1="278" x2="880" y2="278"/>
<line x1="600" y1="286" x2="880" y2="286"/><line x1="600" y1="294" x2="880" y2="294"/>
<line x1="600" y1="302" x2="880" y2="302"/><line x1="600" y1="310" x2="880" y2="310"/>
<line x1="600" y1="318" x2="880" y2="318"/><line x1="600" y1="326" x2="880" y2="326"/>
<line x1="600" y1="334" x2="880" y2="334"/><line x1="600" y1="342" x2="880" y2="342"/>
</g>

<text class="k" x="80" y="430">每一條都要對準到幾百奈米</text>
<text class="b" x="80" y="462">偏一點，光就漏掉</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Five bars of different lengths on a timeline from 2026 to 2030, starts stepped back one after another, right ends all flush at 2030">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--ink); }
.d { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">Not unbuilt, already spoken for</text>
<line x1="240" y1="120" x2="240" y2="450" stroke="var(--line)" stroke-width="1.5"/>
<line x1="372" y1="120" x2="372" y2="450" stroke="var(--line)" stroke-width="1.5"/>
<line x1="504" y1="120" x2="504" y2="450" stroke="var(--line)" stroke-width="1.5"/>
<line x1="636" y1="120" x2="636" y2="450" stroke="var(--line)" stroke-width="1.5"/>
<line x1="768" y1="120" x2="768" y2="450" stroke="var(--line)" stroke-width="1.5"/>
<line x1="900" y1="120" x2="900" y2="450" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<rect x="240" y="140" width="660" height="30" rx="6" fill="var(--accent)"/>
<rect x="240" y="200" width="660" height="30" rx="6" fill="var(--accent)"/>
<rect x="240" y="260" width="660" height="30" rx="6" fill="var(--accent)"/>
<rect x="438" y="320" width="462" height="30" rx="6" fill="var(--grey)"/>
<rect x="504" y="380" width="396" height="30" rx="6" fill="var(--grey)"/>
<text class="d" x="228" y="161" text-anchor="end">Optics major A</text>
<text class="d" x="228" y="221" text-anchor="end">Optics major B</text>
<text class="d" x="228" y="281" text-anchor="end">Asian laser LTA</text>
<text class="d" x="228" y="341" text-anchor="end">New capacity</text>
<text class="d" x="228" y="401" text-anchor="end">Analog CW sales</text>
<line x1="240" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
<text class="d" x="240" y="476" text-anchor="middle">2026</text>
<text class="d" x="372" y="476" text-anchor="middle">2027</text>
<text class="d" x="504" y="476" text-anchor="middle">2028</text>
<text class="d" x="636" y="476" text-anchor="middle">2029</text>
<text class="d" x="768" y="476" text-anchor="middle">2030</text>
<text class="c" x="60" y="524">Locking to 2030: both expect a long shortage</text>
</svg>
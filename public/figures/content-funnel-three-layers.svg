<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="由寬到窄的三層漏斗：最寬的免費內容一百人看，收窄到建立信任二十人留下，最窄的付費課程三人付費">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .n { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
    .on { font-size:20px; fill:var(--page); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text class="t" x="60" y="62">一個觀眾，從免費影片走到付費課程</text>

  <polygon points="200,130 760,130 670,230 290,230" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="290,250 670,250 590,350 370,350" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="370,370 590,370 530,450 430,450" fill="var(--accent)"/>

  <text class="g" x="480" y="188" text-anchor="middle">免費內容</text>
  <text class="g" x="480" y="308" text-anchor="middle">建立信任</text>
  <text class="on" x="480" y="418" text-anchor="middle">付費課程</text>

  <text class="s" x="176" y="188" text-anchor="end">教你幾招</text>
  <text class="s" x="346" y="308" text-anchor="end">這老師有料</text>
  <text class="s" x="406" y="418" text-anchor="end">數千到數萬</text>

  <line x1="784" y1="180" x2="700" y2="180" stroke="var(--line)" stroke-width="2"/>
  <line x1="784" y1="300" x2="620" y2="300" stroke="var(--line)" stroke-width="2"/>
  <line x1="784" y1="410" x2="546" y2="410" stroke="var(--line)" stroke-width="2"/>
  <text class="n" x="796" y="186">100 人看</text>
  <text class="n" x="796" y="306">20 人留下</text>
  <text class="n" x="796" y="416">3 人付費</text>

  <text class="c" x="60" y="492">免費那層的功能，是證明值得你付錢</text>
</svg>
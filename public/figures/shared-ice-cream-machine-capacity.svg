<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="一格對上二十格的產能差，以及一週時間軸上只被佔用的一小段">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">一台沒人用滿的機器，三個人用剛好</text>
<text x="60" y="90" font-size="15" fill="var(--dim)">每一格代表一天十加侖</text>

<text x="60" y="146" font-size="20" font-weight="700" fill="var(--ink)">自己買</text>
<text x="60" y="172" font-size="16" fill="var(--dim)">$5,000 一加侖機</text>
<rect x="60" y="192" width="40" height="40" rx="4" fill="var(--grey)"/>
<text x="60" y="258" font-size="19" font-weight="700" fill="var(--ink)">一天 10 加侖</text>

<line x1="300" y1="130" x2="300" y2="300" stroke="var(--line)" stroke-width="2"/>

<text x="340" y="146" font-size="20" font-weight="700" fill="var(--ink)">共用</text>
<text x="340" y="172" font-size="16" fill="var(--dim)">$26,000 五加侖工業機</text>
<g fill="var(--accent)">
<rect x="340" y="192" width="40" height="40" rx="4"/><rect x="388" y="192" width="40" height="40" rx="4"/><rect x="436" y="192" width="40" height="40" rx="4"/><rect x="484" y="192" width="40" height="40" rx="4"/><rect x="532" y="192" width="40" height="40" rx="4"/><rect x="580" y="192" width="40" height="40" rx="4"/><rect x="628" y="192" width="40" height="40" rx="4"/><rect x="676" y="192" width="40" height="40" rx="4"/><rect x="724" y="192" width="40" height="40" rx="4"/><rect x="772" y="192" width="40" height="40" rx="4"/>
<rect x="340" y="240" width="40" height="40" rx="4"/><rect x="388" y="240" width="40" height="40" rx="4"/><rect x="436" y="240" width="40" height="40" rx="4"/><rect x="484" y="240" width="40" height="40" rx="4"/><rect x="532" y="240" width="40" height="40" rx="4"/><rect x="580" y="240" width="40" height="40" rx="4"/><rect x="628" y="240" width="40" height="40" rx="4"/><rect x="676" y="240" width="40" height="40" rx="4"/><rect x="724" y="240" width="40" height="40" rx="4"/><rect x="772" y="240" width="40" height="40" rx="4"/>
</g>
<text x="340" y="312" font-size="19" font-weight="700" fill="var(--accent)">一天 200 加侖，材料約 $1,000</text>

<text x="60" y="400" font-size="20" font-weight="700" fill="var(--ink)">一個人一週用得到多少</text>
<rect x="60" y="424" width="780" height="46" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="424" width="37" height="46" rx="6" fill="var(--warn)"/>
<text x="112" y="454" font-size="16" fill="var(--dim)">2–8 小時</text>
<text x="840" y="454" font-size="16" fill="var(--dim)" text-anchor="end">一週 168 小時</text>

<text x="60" y="550" font-size="22" font-weight="700" fill="var(--ink)">閒置的那一大段，就是共用賺到的</text>
</g>
</svg>
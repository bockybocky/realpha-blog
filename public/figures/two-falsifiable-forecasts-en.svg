<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One origin forks into two timelines: one running to a materials shortage in the first half of 2027, the other to unexplained demand in 2028, each with a checkpoint at its end.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="60">No sides, just two claims that can be wrong</text>

  <circle cx="130" cy="270" r="16" fill="var(--dim)"/>
  <text class="d" x="90" y="320">Same episode</text>

  <path d="M 146 270 C 300 270 320 160 480 160 L 700 160" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <path d="M 146 270 C 300 270 320 390 480 390 L 700 390" fill="none" stroke="var(--warn)" stroke-width="5"/>

  <circle cx="700" cy="160" r="14" fill="var(--accent)"/>
  <circle cx="700" cy="390" r="14" fill="var(--warn)"/>

  <text class="g" x="400" y="134" fill="var(--accent)">Material is short</text>
  <text class="g" x="400" y="436" fill="var(--warn)">Demand is short</text>

  <text class="g" x="730" y="140">H1 2027</text>
  <text class="d" x="730" y="166">Glass and loom shortage</text>
  <text class="d" x="730" y="190">becomes public talk</text>

  <text class="g" x="730" y="370">2028</text>
  <text class="d" x="730" y="396">Compute with no use</text>
  <text class="d" x="730" y="420">or several cut usage spend</text>

  <text class="c" x="60" y="500">Both carry dates; facts will answer them</text>
</svg>
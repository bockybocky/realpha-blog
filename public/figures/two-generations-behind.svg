<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條相同形狀的階梯線，美國廠那條整體右移，中間以雙箭頭標出五到六年的時間差">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="90" y="72" font-size="27" font-weight="700" fill="var(--ink)">同一座樓梯，晚了兩階</text>
<text x="90" y="108" font-size="16" fill="var(--dim)">先進製程節點・示意</text>

<line x1="90" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="880" y="500" font-size="15" text-anchor="end" fill="var(--dim)">時間 →</text>
<text x="86" y="200" font-size="15" text-anchor="end" fill="var(--dim)">新</text>
<text x="86" y="446" font-size="15" text-anchor="end" fill="var(--dim)">舊</text>

<path d="M120 430 H280 V370 H440 V310 H600 V250 H770" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M310 438 H470 V378 H630 V318 H790 V258 H870" fill="none" stroke="var(--grey)" stroke-width="4"/>

<text x="125" y="412" font-size="19" fill="var(--accent)">台中・廣島</text>
<text x="332" y="422" font-size="19" fill="var(--grey)">美國廠</text>

<line x1="292" y1="345" x2="458" y2="345" stroke="var(--warn)" stroke-width="3"/>
<polygon points="280,345 294,339 294,351" fill="var(--warn)"/>
<polygon points="470,345 456,339 456,351" fill="var(--warn)"/>
<text x="375" y="328" font-size="19" text-anchor="middle" fill="var(--warn)">五到六年</text>

<text x="90" y="524" font-size="22" font-weight="700" fill="var(--ink)">同樣的階梯，晚了兩個世代</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="A row of blocks runs from wide to narrow to show sector weights, the widest one being tech and the rest narrowing in turn.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="480" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Value index: top slice tech</text>
<text x="60" y="94" font-size="16" fill="var(--dim)">Width = weight; only cited slices</text>
<rect x="60" y="130" width="150" height="80" fill="var(--accent)"/>
<rect x="214" y="130" width="90" height="80" fill="var(--grey)"/>
<rect x="308" y="130" width="78" height="80" fill="var(--grey)" fill-opacity="0.8"/>
<rect x="390" y="130" width="65" height="80" fill="var(--grey)" fill-opacity="0.6"/>
<rect x="459" y="130" width="51" height="80" fill="var(--grey)" fill-opacity="0.45"/>
<text x="135" y="178" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">IT</text>
<text x="135" y="240" font-size="16" fill="var(--dim)" text-anchor="middle">Top</text>
<rect x="600" y="138" width="24" height="24" fill="var(--accent)"/>
<rect x="600" y="186" width="24" height="24" fill="var(--grey)"/>
<rect x="600" y="234" width="24" height="24" fill="var(--grey)" fill-opacity="0.8"/>
<rect x="600" y="282" width="24" height="24" fill="var(--grey)" fill-opacity="0.6"/>
<rect x="600" y="330" width="24" height="24" fill="var(--grey)" fill-opacity="0.45"/>
<text x="638" y="158" font-size="19" font-weight="700" fill="var(--ink)">Tech no figure</text>
<text x="638" y="206" font-size="19" fill="var(--ink)">Fin 15%</text>
<text x="638" y="254" font-size="19" fill="var(--ink)">Health 13%</text>
<text x="638" y="302" font-size="19" fill="var(--ink)">Indus 10.8%</text>
<text x="638" y="350" font-size="19" fill="var(--ink)">Disc. 8.5%</text>
<text x="60" y="320" font-size="19" font-weight="700" fill="var(--warn)">Only 500 names</text>
<text x="60" y="352" font-size="16" fill="var(--dim)">Can't get cheap + diverse</text>
<text x="60" y="420" font-size="16" fill="var(--dim)">A stock's weight can split half growth, half value</text>
</svg>
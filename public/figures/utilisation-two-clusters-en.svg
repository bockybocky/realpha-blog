<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A utilization dot plot splits into low and high clusters, with the average line landing in the gap between them">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">One set of numbers, two fates already</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">One dot per plant, axis is capacity utilization</text>
<line x1="120" y1="380" x2="880" y2="380" stroke="var(--line)" stroke-width="2"/>
<circle cx="275" cy="355" r="10" fill="var(--accent)"/>
<circle cx="300" cy="355" r="10" fill="var(--accent)"/>
<circle cx="325" cy="355" r="10" fill="var(--accent)"/>
<circle cx="285" cy="332" r="10" fill="var(--accent)"/>
<circle cx="310" cy="332" r="10" fill="var(--accent)"/>
<circle cx="297" cy="309" r="10" fill="var(--accent)"/>
<circle cx="455" cy="355" r="10" fill="var(--accent)"/>
<circle cx="505" cy="355" r="10" fill="var(--accent)"/>
<circle cx="650" cy="355" r="10" fill="var(--accent)"/>
<circle cx="675" cy="355" r="10" fill="var(--accent)"/>
<circle cx="700" cy="355" r="10" fill="var(--accent)"/>
<circle cx="725" cy="355" r="10" fill="var(--accent)"/>
<circle cx="750" cy="355" r="10" fill="var(--accent)"/>
<circle cx="662" cy="332" r="10" fill="var(--accent)"/>
<circle cx="687" cy="332" r="10" fill="var(--accent)"/>
<circle cx="712" cy="332" r="10" fill="var(--accent)"/>
<circle cx="737" cy="332" r="10" fill="var(--accent)"/>
<circle cx="700" cy="309" r="10" fill="var(--accent)"/>
<line x1="564" y1="180" x2="564" y2="395" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="576" y="192" font-size="19" font-weight="700" fill="var(--warn)">Average 60%</text>
<text x="576" y="220" font-size="16" fill="var(--warn)">Almost no plants here</text>
<text x="300" y="425" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">As low as 24%</text>
<text x="700" y="425" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Above 80%</text>
<text x="120" y="465" font-size="16" fill="var(--dim)">0%</text>
<text x="490" y="465" font-size="16" fill="var(--dim)" text-anchor="middle">50%</text>
<text x="880" y="465" font-size="16" fill="var(--dim)" text-anchor="end">100%</text>
<text x="60" y="525" font-size="22" font-weight="700" fill="var(--ink)">The average flattens two fates into one number</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三層堆疊中，中間層被壓薄，兩支箭頭從中間往上層與下層跑">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">被吞掉的是中間那層</text>
<rect x="250" y="110" width="460" height="110" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="282" y="155" font-size="20" fill="var(--ink)">決定要做什麼</text>
<text x="282" y="190" font-size="16" fill="var(--dim)">設計・品味・對使用者的理解</text>
<rect x="250" y="240" width="460" height="56" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="282" y="276" font-size="20" fill="var(--warn)">把想法變成成品的手工</text>
<rect x="250" y="316" width="460" height="110" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="282" y="360" font-size="20" fill="var(--ink)">別人搬不動的資產</text>
<text x="282" y="395" font-size="16" fill="var(--dim)">資料・通路・信任・規模</text>
<line x1="762" y1="262" x2="762" y2="166" stroke="var(--accent)" stroke-width="3"/>
<polygon points="762,150 754,168 770,168" fill="var(--accent)"/>
<line x1="762" y1="274" x2="762" y2="370" stroke="var(--accent)" stroke-width="3"/>
<polygon points="762,386 754,368 770,368" fill="var(--accent)"/>
<text x="790" y="172" font-size="16" fill="var(--dim)">往上跑</text>
<text x="790" y="380" font-size="16" fill="var(--dim)">往下跑</text>
<polygon points="200,252 232,268 200,284" fill="var(--warn)"/>
<text x="120" y="274" font-size="16" fill="var(--warn)">被壓扁</text>
<text x="60" y="480" font-size="22" fill="var(--ink)">中間那層正在快速貶值</text>
</svg>
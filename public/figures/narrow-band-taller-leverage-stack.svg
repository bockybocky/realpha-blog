<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左格波動帶寬、方塊只疊兩層；右格波動帶被壓窄、方塊疊到六層">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56">壓住波動，疊高槓桿</text>

  <rect x="60" y="92" width="400" height="390" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="92" width="400" height="390" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <rect x="96" y="150" width="330" height="120" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
  <polyline points="96,250 150,166 204,246 258,176 312,254 366,180 426,236" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text class="s" x="96" y="300">波動寬</text>
  <rect x="170" y="420" width="170" height="30" fill="var(--accent)" fill-opacity="0.45" stroke="var(--accent)"/>
  <rect x="170" y="386" width="170" height="30" fill="var(--accent)" fill-opacity="0.45" stroke="var(--accent)"/>
  <text class="g" x="170" y="366">槓桿低</text>

  <rect x="536" y="194" width="330" height="36" fill="var(--warn)" fill-opacity="0.2" stroke="var(--warn)" stroke-width="2"/>
  <polyline points="536,212 590,202 644,220 698,204 752,218 806,204 866,212" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text class="s" x="536" y="266">波動被壓窄</text>
  <rect x="610" y="420" width="170" height="30" fill="var(--warn)" fill-opacity="0.4" stroke="var(--warn)"/>
  <rect x="610" y="386" width="170" height="30" fill="var(--warn)" fill-opacity="0.4" stroke="var(--warn)"/>
  <rect x="610" y="352" width="170" height="30" fill="var(--warn)" fill-opacity="0.4" stroke="var(--warn)"/>
  <rect x="610" y="318" width="170" height="30" fill="var(--warn)" fill-opacity="0.4" stroke="var(--warn)"/>
  <rect x="610" y="284" width="170" height="30" fill="var(--warn)" fill-opacity="0.4" stroke="var(--warn)"/>
  <rect x="610" y="300" width="0" height="0" fill="var(--warn)"/>
  <text class="g" x="610" y="316">槓桿疊高</text>
</svg>
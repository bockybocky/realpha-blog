<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A long bar cut into two very uneven segments, the left long and the right short, each tied by a line to a recipient label below">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="62" font-size="27" fill="var(--ink)">Where each dollar the federal government spends ends up</text>

<rect x="80" y="150" width="800" height="96" rx="5" fill="var(--card)" stroke="var(--line)"/>
<rect x="744" y="150" width="136" height="96" rx="5" fill="var(--accent)"/>
<line x1="744" y1="150" x2="744" y2="246" stroke="var(--page)" stroke-width="2"/>
<text x="412" y="206" font-size="22" fill="var(--ink)" text-anchor="middle">83 cents</text>
<text x="812" y="206" font-size="22" fill="var(--page)" text-anchor="middle">17 cents</text>

<line x1="412" y1="246" x2="412" y2="288" stroke="var(--line)" stroke-width="2"/>
<text x="412" y="316" font-size="19" fill="var(--ink)" text-anchor="middle">Older people and asset holders</text>
<text x="412" y="342" font-size="15" fill="var(--dim)" text-anchor="middle">The two groups that vote and donate most</text>

<line x1="812" y1="246" x2="812" y2="288" stroke="var(--line)" stroke-width="2"/>
<text x="812" y="316" font-size="19" fill="var(--accent)" text-anchor="middle">Means-tested programs</text>
<text x="812" y="342" font-size="15" fill="var(--dim)" text-anchor="middle">You must first prove you're poor enough</text>

<text x="80" y="440" font-size="22" fill="var(--ink)">Not guessing who spends more, but following where each dollar goes</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The electric share rises from a thin sliver to half in the three bars, while exports are also split evenly between electric and gasoline vehicles.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Both powertrains are oversupplied</text>
  <text class="t" x="60" y="100" font-size="16" fill="var(--dim)">Dark = electric / light = gasoline</text>

  <text class="t" x="60" y="178" font-size="19" fill="var(--ink)">Domestic 2020</text>
  <rect x="230" y="156" width="630" height="44" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="230" y="156" width="32" height="44" fill="var(--accent)"/>
  <text class="t" x="276" y="186" font-size="19" font-weight="700" fill="var(--accent)">5%</text>

  <text class="t" x="60" y="278" font-size="19" fill="var(--ink)">Domestic today</text>
  <rect x="230" y="256" width="630" height="44" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="230" y="256" width="315" height="44" fill="var(--accent)"/>
  <text class="t" x="387" y="286" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">Half</text>

  <text class="t" x="60" y="378" font-size="19" fill="var(--ink)">Export cars</text>
  <rect x="230" y="356" width="630" height="44" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="230" y="356" width="315" height="44" fill="var(--accent)"/>
  <text class="t" x="387" y="386" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">Half electric</text>
  <text class="t" x="702" y="386" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">Half gasoline</text>

  <text class="t" x="60" y="470" font-size="22" font-weight="700" fill="var(--ink)">This is not just an EV story</text>
</svg>
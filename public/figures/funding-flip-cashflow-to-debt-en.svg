<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars of equal length, the upper one a single color and the lower one with more than half in another color">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">Same money, different nature</text>
<text x="60" y="200" font-size="19" fill="var(--dim)">Before</text>
<rect x="180" y="168" width="680" height="64" fill="var(--grey)"/>
<text x="520" y="208" font-size="19" fill="var(--page)" text-anchor="middle">Internal cash flow</text>
<text x="60" y="336" font-size="19" fill="var(--ink)">First half of this year</text>
<rect x="180" y="304" width="306" height="64" fill="var(--grey)"/>
<rect x="486" y="304" width="374" height="64" fill="var(--warn)"/>
<text x="333" y="344" font-size="19" fill="var(--page)" text-anchor="middle">Cash flow</text>
<text x="673" y="344" font-size="19" fill="var(--page)" text-anchor="middle">External debt</text>
<text x="333" y="404" font-size="19" fill="var(--dim)" text-anchor="middle">Can slow down</text>
<text x="673" y="404" font-size="19" fill="var(--warn)" text-anchor="middle">Cannot stop</text>
<text x="480" y="470" font-size="22" fill="var(--ink)" text-anchor="middle">The source changed, and so did the schedule</text>
</svg>
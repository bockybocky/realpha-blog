<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上排時間軸上五個節點由左往右接力，下排同一時間軸的台階從矮跳到高，兩排方向一致" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="64" y="66" font-size="27" font-weight="700" fill="var(--ink)">漲價接力，和電力規格同向</text>
<text x="64" y="98" font-size="16" fill="var(--dim)">一家一家往後排，和下面那級台階一起走</text>

<text x="64" y="162" font-size="19" font-weight="700" fill="var(--dim)">漲價</text>
<line x1="64" y1="216" x2="896" y2="216" stroke="var(--line)" stroke-width="3"/>
<circle cx="150" cy="216" r="10" fill="var(--grey)"/>
<circle cx="330" cy="216" r="10" fill="var(--grey)"/>
<circle cx="500" cy="216" r="10" fill="var(--accent)"/>
<circle cx="670" cy="216" r="10" fill="var(--accent)"/>
<circle cx="850" cy="216" r="10" fill="var(--accent)"/>
<text x="150" y="196" font-size="15" fill="var(--dim)" text-anchor="middle">德州儀器</text>
<text x="330" y="252" font-size="15" fill="var(--dim)" text-anchor="middle">英飛凌・中國</text>
<text x="500" y="196" font-size="15" fill="var(--ink)" text-anchor="middle">英飛凌・意法</text>
<text x="670" y="252" font-size="15" fill="var(--ink)" text-anchor="middle">安森美・台系</text>
<text x="850" y="196" font-size="15" fill="var(--ink)" text-anchor="middle">瑞薩</text>

<text x="64" y="312" font-size="19" font-weight="700" fill="var(--dim)">電力規格</text>
<path d="M120 420 L470 420 L470 348 L880 348" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="290" y="404" font-size="16" fill="var(--dim)" text-anchor="middle">3.5–5.5 kW</text>
<text x="675" y="332" font-size="16" fill="var(--accent)" text-anchor="middle">8 kW</text>

<line x1="64" y1="452" x2="896" y2="452" stroke="var(--line)" stroke-width="2"/>
<text x="150" y="484" font-size="15" fill="var(--dim)" text-anchor="middle">去年</text>
<text x="500" y="484" font-size="15" fill="var(--dim)" text-anchor="middle">今年</text>
<text x="850" y="484" font-size="15" fill="var(--dim)" text-anchor="middle">明年</text>

<text x="480" y="528" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">需求拉的，不是成本推的</text>
</svg>
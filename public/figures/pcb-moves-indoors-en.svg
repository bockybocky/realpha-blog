<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A tool moves from open air into a sealed enclosure, with dust specks outside and clean air inside.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">PCBs are moving into boxes</text>

  <text x="140" y="130" font-size="20" fill="var(--dim)">Before</text>
  <rect x="100" y="150" width="320" height="250" rx="8" fill="var(--page)" stroke="var(--line)" stroke-dasharray="6 6"/>
  <rect x="180" y="270" width="160" height="90" rx="6" fill="var(--grey)" opacity="0.7"/>
  <circle cx="150" cy="200" r="4" fill="var(--dim)"/>
  <circle cx="230" cy="185" r="3" fill="var(--dim)"/>
  <circle cx="300" cy="215" r="5" fill="var(--dim)"/>
  <circle cx="370" cy="190" r="3" fill="var(--dim)"/>
  <circle cx="260" cy="240" r="4" fill="var(--dim)"/>
  <circle cx="340" cy="255" r="3" fill="var(--dim)"/>
  <text x="260" y="430" font-size="16" fill="var(--dim)" text-anchor="middle">Made in open air</text>

  <text x="580" y="130" font-size="20" fill="var(--accent)">Now</text>
  <rect x="540" y="150" width="320" height="250" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <rect x="620" y="270" width="160" height="90" rx="6" fill="var(--accent)" opacity="0.7"/>
  <circle cx="520" cy="200" r="4" fill="var(--dim)"/>
  <circle cx="890" cy="230" r="4" fill="var(--dim)"/>
  <circle cx="900" cy="170" r="3" fill="var(--dim)"/>
  <text x="700" y="430" font-size="16" fill="var(--accent)" text-anchor="middle">Enclosed, cleanliness managed</text>

  <text x="60" y="490" font-size="22" fill="var(--ink)">Not just more capacity, a spec step up</text>
</svg>
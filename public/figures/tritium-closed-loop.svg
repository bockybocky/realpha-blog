<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="一個順時針閉環串起四個節點，左上一條實線進料箭頭，右側一條虛線被打叉">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .n { font-size:19px; font-weight:700; fill:var(--ink); text-anchor:middle; }
    .s { font-size:15px; fill:var(--dim); }
    .sw { font-size:15px; fill:var(--warn); }
    .gw { font-size:19px; font-weight:700; fill:var(--warn); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="58">燃料是外面買，還是爐子外面自己長</text>

<circle cx="480" cy="310" r="140" fill="none" stroke="var(--accent)" stroke-width="8"/>
<polygon points="608,304 632,310 608,316" fill="var(--accent)" transform="rotate(90 620 310)"/>
<polygon points="468,432 492,438 468,444" fill="var(--accent)" transform="rotate(180 480 438)"/>
<polygon points="328,304 352,310 328,316" fill="var(--accent)" transform="rotate(270 340 310)"/>
<polygon points="468,164 492,170 468,176" fill="var(--accent)"/>

<circle cx="579" cy="211" r="46" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="579" cy="409" r="46" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="381" cy="409" r="46" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="381" cy="211" r="46" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="n" x="579" y="218">融合爐</text>
<text class="n" x="579" y="416">中子</text>
<text class="n" x="381" y="416">鋰包層</text>
<text class="n" x="381" y="218">氚</text>

<path d="M100 150 L470 150 L520 178" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polygon points="512,166 542,190 506,192" fill="var(--accent)"/>
<text class="s" x="100" y="128">外部只需要氘・海水裡就有</text>

<line x1="900" y1="310" x2="660" y2="310" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
<line x1="768" y1="292" x2="796" y2="328" stroke="var(--warn)" stroke-width="4"/>
<line x1="796" y1="292" x2="768" y2="328" stroke="var(--warn)" stroke-width="4"/>
<text class="gw" x="700" y="266">外購氚</text>
<text class="sw" x="700" y="374">每公斤 3000 萬美元</text>

<text class="c" x="60" y="530">閉得起來，燃料成本才不是那個價</text>
</svg>
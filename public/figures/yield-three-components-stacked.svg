<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根三段堆疊柱，右邊較高，底段實質利率明顯變厚，頂段期限溢價略厚，中段通膨預期幾乎不變">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="48" y="54" font-size="27" font-weight="700" fill="var(--ink)">殖利率拆成三段：哪一段在推</text>
<line x1="120" y1="462" x2="840" y2="462" stroke="var(--line)" stroke-width="2"/>
<rect x="240" y="342" width="130" height="120" fill="var(--accent)"/>
<rect x="240" y="252" width="130" height="90" fill="var(--grey)"/>
<rect x="240" y="202" width="130" height="50" fill="var(--warn)"/>
<rect x="560" y="272" width="130" height="190" fill="var(--accent)"/>
<rect x="560" y="180" width="130" height="92" fill="var(--grey)"/>
<rect x="560" y="102" width="130" height="78" fill="var(--warn)"/>
<text x="248" y="492" font-size="20" font-weight="700" fill="var(--dim)">一段時間前</text>
<text x="594" y="492" font-size="20" font-weight="700" fill="var(--ink)">現在</text>
<text x="710" y="382" font-size="16" fill="var(--accent)">實質利率 · 主要推力</text>
<text x="710" y="236" font-size="16" fill="var(--dim)">通膨預期 · 最穩</text>
<text x="710" y="148" font-size="16" fill="var(--warn)">期限溢價 · 開始變厚</text>
<text x="48" y="536" font-size="22" font-weight="700" fill="var(--ink)">同一個高度，可以由不同段堆出來</text>
</g>
</svg>
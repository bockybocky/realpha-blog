<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩組柱子，每組右邊明顯高出一截">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="h" x="480" y="52" text-anchor="middle">同一樣東西，兩種難度</text>
<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="60" y="110">難度</text>
<line x1="60" y1="130" x2="60" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="120" y="340" width="90" height="80" fill="var(--grey)"/>
<rect x="260" y="190" width="90" height="230" fill="var(--warn)"/>
<text class="s" x="165" y="450" text-anchor="middle">一點電</text>
<text class="s" x="305" y="450" text-anchor="middle">夠多的電</text>
<text class="g" x="235" y="490" text-anchor="middle">電</text>
<line x1="480" y1="140" x2="480" y2="500" stroke="var(--line)" stroke-width="1" stroke-dasharray="5 7"/>
<rect x="590" y="360" width="90" height="60" fill="var(--grey)"/>
<rect x="730" y="150" width="90" height="270" fill="var(--warn)"/>
<text class="s" x="635" y="450" text-anchor="middle">堪用的晶片</text>
<text class="s" x="775" y="450" text-anchor="middle">最強的那顆</text>
<text class="g" x="705" y="490" text-anchor="middle">晶片</text>
<text class="c" x="480" y="528" text-anchor="middle">缺的從來不是「有沒有」</text>
</svg>
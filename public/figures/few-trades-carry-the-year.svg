<rect x="724" y="380" width="15" height="30" fill="var(--warn)"/>
<rect x="778" y="380" width="15" height="16" fill="var(--warn)"/>
<rect x="832" y="380" width="15" height="24" fill="var(--warn)"/>
<line x1="272" y1="166" x2="272" y2="140" stroke="var(--accent)" stroke-width="2"/>
<text class="f2-b f2-s" x="272" y="128" text-anchor="middle" fill="var(--accent)">前 5–10%</text>
<text class="f2-b f2-s" x="76" y="452" fill="var(--warn)">六成以上：小虧</text>
<text class="f2-b f2-s" x="600" y="452" fill="var(--accent)">少數幾筆：整年的獲利</text>
<text class="f2-b f2-c" x="60" y="512">勝率四成，是這個形狀的代價</text>
</svg>
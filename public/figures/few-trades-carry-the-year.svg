<rect x="427" y="325" width="15" height="55" fill="var(--accent)"/>
<rect x="508" y="230" width="15" height="150" fill="var(--accent)"/>
<rect x="589" y="355" width="15" height="25" fill="var(--accent)"/>
<rect x="670" y="285" width="15" height="95" fill="var(--accent)"/>
<rect x="751" y="345" width="15" height="35" fill="var(--accent)"/>
<rect x="805" y="360" width="15" height="20" fill="var(--accent)"/>
<rect x="859" y="352" width="15" height="28" fill="var(--accent)"/>
<rect x="76" y="380" width="15" height="26" fill="var(--warn)"/>
<rect x="130" y="380" width="15" height="18" fill="var(--warn)"/>
<rect x="157" y="380" width="15" height="32" fill="var(--warn)"/>
<rect x="211" y="380" width="15" height="22" fill="var(--warn)"/>
<rect x="238" y="380" width="15" height="14" fill="var(--warn)"/>
<rect x="292" y="380" width="15" height="30" fill="var(--warn)"/>
<rect x="319" y="380" width="15" height="20" fill="var(--warn)"/>
<rect x="373" y="380" width="15" height="24" fill="var(--warn)"/>
<rect x="454" y="380" width="15" height="16" fill="var(--warn)"/>
<rect x="481" y="380" width="15" height="28" fill="var(--warn)"/>
<rect x="535" y="380" width="15" height="22" fill="var(--warn)"/>
<rect x="562" y="380" width="15" height="34" fill="var(--warn)"/>
<rect x="616" y="380" width="15" height="18" fill="var(--warn)"/>
<rect x="643" y="380" width="15" height="26" fill="var(--warn)"/>

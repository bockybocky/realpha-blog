<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="交易長條圖，基線下方許多小虧損棒，上方少數幾根極高的獲利棒撐起整年">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.f2-b{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.f2-t{font-size:27px;font-weight:700}
.f2-s{font-size:15px}
.f2-c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="f2-b f2-t" x="60" y="66">整年的獲利，靠的是最少的那幾筆</text>
<line x1="66" y1="380" x2="910" y2="380" stroke="var(--line)" stroke-width="2"/>
<rect x="103" y="358" width="15" height="22" fill="var(--accent)"/>
<rect x="184" y="340" width="15" height="40" fill="var(--accent)"/>

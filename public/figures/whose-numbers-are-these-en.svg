<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two staggered color bands span a quarterly timeline, with the predecessor's band covering the first few quarters and overlapping the successor's band, while a dashed stock-price marker sits at the far left.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="70" y="70" font-size="27" fill="var(--ink)">New Leader, Old Numbers</text>
<line x1="110" y1="370" x2="890" y2="370" stroke="var(--line)" stroke-width="3"/>
<g font-size="15" fill="var(--dim)">
<text x="98" y="400">This Quarter</text><text x="250" y="400">+1</text><text x="404" y="400">+2</text>
<text x="558" y="400">+3</text><text x="712" y="400">+4</text><text x="856" y="400">+5</text>
</g>
<g stroke="var(--line)" stroke-width="2">
<line x1="110" y1="370" x2="110" y2="382"/><line x1="264" y1="370" x2="264" y2="382"/>
<line x1="418" y1="370" x2="418" y2="382"/><line x1="572" y1="370" x2="572" y2="382"/>
<line x1="726" y1="370" x2="726" y2="382"/><line x1="880" y1="370" x2="880" y2="382"/>
</g>
<rect x="110" y="252" width="600" height="42" rx="10" fill="var(--accent)" opacity="0.85"/>
<text x="124" y="238" font-size="19" fill="var(--ink)">Old Leader's Numbers</text>
<rect x="560" y="302" width="330" height="42" rx="10" fill="var(--grey)" opacity="0.7"/>
<text x="700" y="334" font-size="19" fill="var(--ink)">New Leader's Numbers</text>
<line x1="170" y1="130" x2="170" y2="368" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="186" y="140" font-size="19" fill="var(--ink)">Stock Price</text>
<text x="186" y="166" font-size="16" fill="var(--warn)">Moves First</text>
<text x="70" y="478" font-size="22" fill="var(--ink)">Leadership Changes Before Numbers Do</text>
</svg>
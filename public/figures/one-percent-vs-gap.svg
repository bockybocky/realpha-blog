<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="省下的薄片極細，與需求缺口的高度差不成比例">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="80" y="62" font-size="27" font-weight="700" fill="var(--ink)">省一點，對上缺好幾倍</text>

<line x1="120" y1="440" x2="880" y2="440" stroke="var(--ink)" stroke-width="2"/>

<rect x="180" y="340" width="150" height="100" fill="var(--grey)"/>
<rect x="180" y="336" width="150" height="4" fill="var(--warn)"/>
<text class="t" x="255" y="472" font-size="19" fill="var(--ink)" text-anchor="middle">現在供得起</text>
<text class="t" x="350" y="334" font-size="15" fill="var(--warn)">省下這一條</text>

<rect x="600" y="140" width="150" height="300" fill="var(--accent)" opacity="0.85"/>
<text class="t" x="675" y="472" font-size="19" fill="var(--ink)" text-anchor="middle">要用的電</text>

<line x1="470" y1="150" x2="470" y2="430" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="t" x="490" y="290" font-size="19" fill="var(--dim)">缺口</text>
<text class="t" x="490" y="316" font-size="15" fill="var(--dim)">發電、併網、交期、人力</text>

<text class="t" x="120" y="516" font-size="22" font-weight="700" fill="var(--ink)">效率降成本，不解除限制</text>
<text class="t" x="120" y="542" font-size="15" fill="var(--dim)">比例示意，非實際數值</text>
</svg>
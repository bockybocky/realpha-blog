<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三個並列方塊接到下方同一條橫帶，顯示三代問候語不同但源頭相同" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/>
    </marker>
  </defs>

  <text x="80" y="54" font-size="27" font-weight="700" fill="var(--ink)">同一份關心，換了三次說法</text>

  <line x1="80" y1="92" x2="872" y2="92" stroke="var(--grey)" stroke-width="2" marker-end="url(#ar1)"/>
  <text x="880" y="97" font-size="15" fill="var(--dim)" text-anchor="end" dy="-14">時間</text>

  <rect x="80" y="120" width="240" height="200" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="360" y="120" width="240" height="200" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="640" y="120" width="240" height="200" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text x="200" y="168" font-size="19" fill="var(--dim)" text-anchor="middle">祖父輩</text>
  <text x="480" y="168" font-size="19" fill="var(--dim)" text-anchor="middle">父輩</text>
  <text x="760" y="168" font-size="19" fill="var(--dim)" text-anchor="middle">這一代</text>

  <text x="200" y="232" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">吃飽沒</text>
  <text x="480" y="232" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">有在賺錢嗎</text>
  <text x="760" y="232" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">生日怎麼過</text>

  <text x="200" y="288" font-size="15" fill="var(--dim)" text-anchor="middle">當年稀缺｜吃飽</text>
  <text x="480" y="288" font-size="15" fill="var(--dim)" text-anchor="middle">當年稀缺｜賺錢</text>
  <text x="760" y="288" font-size="15" fill="var(--dim)" text-anchor="middle">當年稀缺｜陪伴</text>

  <line x1="200" y1="320" x2="200" y2="380" stroke="var(--accent)" stroke-width="2"/>
  <line x1="480" y1="320" x2="480" y2="380" stroke="var(--accent)" stroke-width="2"/>
  <line x1="760" y1="320" x2="760" y2="380" stroke="var(--accent)" stroke-width="2"/>

  <rect x="80" y="380" width="800" height="64" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text x="480" y="421" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">同一份關心</text>

  <text x="80" y="480" font-size="15" fill="var(--dim)">上面：出口</text>
  <text x="880" y="480" font-size="15" fill="var(--dim)" text-anchor="end">下面：源頭</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左格多組推力室共用一套泵，右格每組一套泵，右側列出三項收穫">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Block 2 的改法：加泵，不是換引擎</text>
<rect x="60" y="100" width="390" height="330" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="90" y="138" font-size="19" font-weight="700" fill="var(--dim)">現在</text>
<circle cx="150" cy="200" r="16" fill="var(--grey)"/>
<circle cx="192" cy="200" r="16" fill="var(--grey)"/>
<circle cx="256" cy="200" r="16" fill="var(--grey)"/>
<circle cx="298" cy="200" r="16" fill="var(--grey)"/>
<circle cx="362" cy="200" r="16" fill="var(--grey)"/>
<circle cx="404" cy="200" r="16" fill="var(--grey)"/>
<path d="M 171 220 L 255 300 M 277 220 L 255 300 M 383 220 L 255 300" stroke="var(--grey)" stroke-width="2" fill="none"/>
<rect x="195" y="300" width="120" height="48" rx="6" fill="var(--grey)"/>
<text x="255" y="330" font-size="16" fill="var(--page)" text-anchor="middle">共用一套泵</text>
<text x="255" y="394" font-size="15" fill="var(--dim)" text-anchor="middle">兩具推力室為一組</text>
<rect x="490" y="100" width="410" height="330" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="520" y="138" font-size="19" font-weight="700" fill="var(--accent)">Block 2</text>
<circle cx="560" cy="200" r="16" fill="var(--accent)"/>
<circle cx="602" cy="200" r="16" fill="var(--accent)"/>
<circle cx="686" cy="200" r="16" fill="var(--accent)"/>
<circle cx="728" cy="200" r="16" fill="var(--accent)"/>
<circle cx="812" cy="200" r="16" fill="var(--accent)"/>
<circle cx="854" cy="200" r="16" fill="var(--accent)"/>
<path d="M 581 220 L 581 262 M 707 220 L 707 262 M 833 220 L 833 262" stroke="var(--accent)" stroke-width="2"/>
<rect x="531" y="262" width="100" height="44" rx="6" fill="var(--accent)"/>
<rect x="657" y="262" width="100" height="44" rx="6" fill="var(--accent)"/>
<rect x="783" y="262" width="100" height="44" rx="6" fill="var(--accent)"/>
<text x="581" y="290" font-size="15" fill="var(--page)" text-anchor="middle">自己的泵</text>
<text x="707" y="290" font-size="15" fill="var(--page)" text-anchor="middle">自己的泵</text>
<text x="833" y="290" font-size="15" fill="var(--page)" text-anchor="middle">自己的泵</text>
<text x="707" y="346" font-size="15" fill="var(--dim)" text-anchor="middle">一組一具，共 12 具</text>
<text x="560" y="394" font-size="16" fill="var(--ink)">推力</text>
<text x="660" y="394" font-size="16" fill="var(--ink)">循環效率</text>
<text x="790" y="394" font-size="16" fill="var(--ink)">引擎容錯</text>
<text x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">一個改動，同時買到三樣東西</text>
</svg>
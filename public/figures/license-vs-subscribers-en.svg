<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-label="A very tall bar with five dots below it beside a very short bar with a dense field of dots below.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
  <defs>
    <pattern id="crowdfield" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.5" fill="var(--grey)"/>
    </pattern>
  </defs>
  <text x="60" y="56" font-size="27">The starting line is a licence, not content</text>
  <line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <rect x="160" y="110" width="180" height="330" fill="var(--accent)"/>
  <text x="250" y="96" font-size="20" text-anchor="middle" fill="var(--accent)">49.8m subscribers</text>
  <text x="250" y="472" font-size="19" text-anchor="middle">Kanto-wide licence</text>
  <circle cx="198" cy="512" r="5" fill="var(--accent)"/>
  <circle cx="224" cy="512" r="5" fill="var(--accent)"/>
  <circle cx="250" cy="512" r="5" fill="var(--accent)"/>
  <circle cx="276" cy="512" r="5" fill="var(--accent)"/>
  <circle cx="302" cy="512" r="5" fill="var(--accent)"/>
  <text x="250" y="550" font-size="15" text-anchor="middle" fill="var(--dim)">5 channels in the box</text>
  <rect x="620" y="427" width="180" height="13" fill="var(--grey)"/>
  <text x="710" y="412" font-size="20" text-anchor="middle" fill="var(--dim)">2m subscribers</text>
  <text x="710" y="472" font-size="19" text-anchor="middle">A channel built from scratch</text>
  <rect x="620" y="494" width="180" height="50" fill="url(#crowdfield)"/>
  <text x="710" y="570" font-size="15" text-anchor="middle" fill="var(--dim)">1m channels in the same box</text>
  <text x="480" y="606" font-size="22" text-anchor="middle">The gap is in the denominator, not the content</text>
</svg>
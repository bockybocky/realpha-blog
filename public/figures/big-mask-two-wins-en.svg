<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two before-and-after pairs of blocks, one going from half a field to a full field, the other from one unit to two.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">One bigger mask, a win for each tool</text>

<text x="60" y="130" font-size="19" fill="var(--dim)">High-NA 0.55</text>
<rect x="60" y="165" width="99" height="156" rx="5" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<path d="M180 243 L218 243" stroke="var(--grey)" stroke-width="2"/>
<path d="M211 236 L221 243 L211 250 Z" fill="var(--grey)"/>
<rect x="240" y="165" width="198" height="156" rx="5" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="240" y="352" font-size="16" fill="var(--ink)">Full field again</text>
<text x="240" y="378" font-size="16" fill="var(--dim)">No stitching</text>

<line x1="490" y1="110" x2="490" y2="400" stroke="var(--line)" stroke-width="2"/>

<text x="530" y="130" font-size="19" fill="var(--dim)">0.33 NA</text>
<rect x="530" y="165" width="85" height="156" rx="5" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<path d="M640 243 L678 243" stroke="var(--grey)" stroke-width="2"/>
<path d="M671 236 L681 243 L671 250 Z" fill="var(--grey)"/>
<rect x="700" y="165" width="85" height="156" rx="5" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="795" y="165" width="85" height="156" rx="5" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="700" y="352" font-size="16" fill="var(--ink)">Twice the area</text>
<text x="700" y="378" font-size="16" fill="var(--dim)">Bigger dies, or two at once</text>

<text x="60" y="490" font-size="22" fill="var(--ink)">23% to 50% more productivity, and half the cost gap</text>
</svg>
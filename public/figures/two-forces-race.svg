<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="向下的成本箭頭與向上的需求箭頭對推，中間夾著短缺撐出來的價格">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">兩股力量對推</text>
<rect x="330" y="210" width="300" height="100" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="400" y="252" font-size="20" fill="var(--ink)">現在的權杖價格</text>
<text x="400" y="282" font-size="16" fill="var(--dim)">世代級短缺撐著</text>
<path d="M300 260 L 120 260" stroke="var(--accent)" stroke-width="6" fill="none"/>
<path d="M120 260 L 146 246 L 146 274 Z" fill="var(--accent)"/>
<text x="60" y="200" font-size="20" fill="var(--accent)">往下壓</text>
<text x="60" y="320" font-size="16" fill="var(--dim)">更多資本支出</text>
<text x="60" y="344" font-size="16" fill="var(--dim)">更好的模型效率</text>
<text x="60" y="368" font-size="16" fill="var(--dim)">更多晶片</text>
<text x="60" y="400" font-size="19" fill="var(--ink)">一年掉一個數量級</text>
<path d="M660 260 L 860 260" stroke="var(--warn)" stroke-width="6" fill="none"/>
<path d="M860 260 L 834 246 L 834 274 Z" fill="var(--warn)"/>
<text x="700" y="200" font-size="20" fill="var(--warn)">往上拉</text>
<text x="700" y="320" font-size="16" fill="var(--dim)">代理人模式</text>
<text x="700" y="344" font-size="16" fill="var(--dim)">每題用掉更多權杖</text>
<text x="700" y="400" font-size="19" fill="var(--ink)">推高一兩個數量級</text>
<text x="60" y="470" font-size="22" fill="var(--ink)">結論是「不知道」，不是看跌</text>
</svg>
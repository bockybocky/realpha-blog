<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="一個往右張開的扇形涵蓋一塊區域，另一個點落在扇形之外">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
</defs>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<text x="48" y="60" font-size="27" font-weight="700" fill="var(--ink)">同一份資料，有它的射程</text>

<rect x="48" y="100" width="864" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<polygon points="120,300 880,150 880,300" fill="var(--accent)" opacity="0.18"/>
<line x1="120" y1="300" x2="880" y2="150" stroke="var(--accent)" stroke-width="3"/>
<line x1="120" y1="300" x2="880" y2="300" stroke="var(--accent)" stroke-width="3"/>
<circle cx="120" cy="300" r="9" fill="var(--accent)"/>
<text x="120" y="332" font-size="16" text-anchor="middle" fill="var(--dim)">這集</text>
<text x="520" y="238" font-size="22" font-weight="700" text-anchor="middle" fill="var(--accent)">結構判斷</text>
<text x="520" y="266" font-size="16" text-anchor="middle" fill="var(--dim)">鏈條長相、傳導路徑、哪些條件會破</text>

<circle cx="700" cy="360" r="9" fill="var(--warn)"/>
<text x="724" y="366" font-size="16" fill="var(--warn)">時點判斷：什麼時候會轉</text>

<text x="480" y="460" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">用在射程外，就變成替自己找背書</text>
</svg>
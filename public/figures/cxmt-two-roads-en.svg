<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="A starting point splits into an upward and downward branch, each pointing to a different party under pressure">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
<defs>
<marker id="gb1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
<marker id="gb2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/></marker>
</defs>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Where the threat lies depends on which road it takes</text>
<rect x="60" y="250" width="250" height="110" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="82" y="292" font-size="20" font-weight="700" fill="var(--ink)">CXMT</text>
<text x="82" y="324" font-size="16" fill="var(--dim)">Stuck at 16nm</text>
<path d="M310 305 L420 305 L420 195 L508 195" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#gb1)"/>
<path d="M420 305 L420 455 L508 455" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#gb2)"/>
<text x="432" y="172" font-size="16" fill="var(--accent)">Now</text>
<text x="432" y="438" font-size="16" fill="var(--dim)">Alternate path</text>
<rect x="520" y="120" width="380" height="150" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="542" y="162" font-size="20" font-weight="700" fill="var(--ink)">Advanced nodes</text>
<text x="542" y="196" font-size="16" fill="var(--ink)">3-4 generations behind</text>
<text x="542" y="222" font-size="16" fill="var(--ink)">Wafer starts grow -&gt; bit output discounted</text>
<text x="542" y="250" font-size="16" fill="var(--dim)">Mature-node makers: breathing room</text>
<rect x="520" y="380" width="380" height="150" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="542" y="422" font-size="20" font-weight="700" fill="var(--ink)">Pivots to mature nodes</text>
<text x="542" y="456" font-size="16" fill="var(--ink)">Same market, head-on collision</text>
<text x="542" y="486" font-size="16" fill="var(--warn)">Pressure: Nanya / Winbond</text>
<rect x="60" y="548" width="840" height="60" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="586" font-size="22" text-anchor="middle" fill="var(--ink)">Different direction, different casualties</text>
</svg>
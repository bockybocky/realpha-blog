<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The left bars rise sharply while the right bars fall sharply, moving in opposite directions.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="64" font-size="27" fill="var(--ink)">First half: one side up, one side down</text>

<rect x="60" y="96" width="400" height="360" fill="var(--card)" rx="10"/>
<text x="90" y="130" font-size="20" fill="var(--dim)">Revenue</text>
<line x1="90" y1="420" x2="430" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="130" y="401" width="90" height="19" fill="var(--grey)" rx="3"/>
<text x="130" y="392" font-size="16" fill="var(--dim)">$1B</text>
<text x="130" y="444" font-size="16" fill="var(--dim)">Year-ago</text>
<rect x="290" y="150" width="90" height="270" fill="var(--accent)" rx="3"/>
<text x="290" y="140" font-size="16" fill="var(--ink)">$16B</text>
<text x="290" y="444" font-size="16" fill="var(--dim)">H1 this year</text>

<rect x="500" y="96" width="400" height="360" fill="var(--card)" rx="10"/>
<text x="530" y="130" font-size="20" fill="var(--dim)">Operating loss</text>
<line x1="530" y1="160" x2="870" y2="160" stroke="var(--line)" stroke-width="2"/>
<rect x="570" y="160" width="90" height="230" fill="var(--warn)" rx="3"/>
<text x="570" y="412" font-size="16" fill="var(--ink)">$2.1B</text>
<text x="570" y="444" font-size="16" fill="var(--dim)">Year-ago</text>
<rect x="730" y="160" width="90" height="76" fill="var(--warn)" opacity="0.55" rx="3"/>
<text x="730" y="258" font-size="16" fill="var(--ink)">$693M</text>
<text x="730" y="444" font-size="16" fill="var(--dim)">H1 this year</text>

<text x="60" y="516" font-size="22" fill="var(--ink)">Short-term doubts answer here; the two long-term questions unchanged</text>
</g>
</svg>
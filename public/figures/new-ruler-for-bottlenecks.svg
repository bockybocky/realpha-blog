<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-label="兩軸圖左上角被塗色，電工與電費對資料中心兩個點落在佔比小但缺了會停的區塊">
<rect x="0" y="0" width="960" height="590" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="50" text-anchor="middle">判斷瓶頸的新尺</text>
<rect x="160" y="120" width="360" height="180" fill="var(--accent)" fill-opacity="0.12"/>
<text class="g" x="506" y="150" text-anchor="end" style="fill:var(--accent)">買方不怕貴</text>
<line x1="160" y1="480" x2="868" y2="480" stroke="var(--ink)" stroke-width="2"/>
<polygon points="866,473 880,480 866,487" fill="var(--ink)"/>
<line x1="160" y1="480" x2="160" y2="120" stroke="var(--ink)" stroke-width="2"/>
<polygon points="153,122 160,108 167,122" fill="var(--ink)"/>
<text class="g" x="160" y="96" text-anchor="middle">缺了它</text>
<text class="b" x="146" y="146" text-anchor="end">會停</text>
<text class="b" x="146" y="472" text-anchor="end">不會</text>
<text class="b" x="172" y="506">小</text>
<text class="b" x="868" y="506" text-anchor="end">大</text>
<text class="g" x="520" y="530" text-anchor="middle">佔買方成本</text>
<line x1="560" y1="444" x2="826" y2="444" stroke="var(--grey)" stroke-width="3"/>
<polygon points="824,437 838,444 824,451" fill="var(--grey)"/>
<text class="g" x="700" y="430" text-anchor="middle" style="fill:var(--dim)">舊尺</text>
<circle cx="230" cy="186" r="11" fill="var(--accent)"/>
<text class="g" x="252" y="193">電工</text>
<circle cx="300" cy="246" r="11" fill="var(--accent)"/>
<text class="g" x="322" y="253">電費對資料中心</text>
<text class="b" x="322" y="278">佔 5–10%</text>
<text class="c" x="480" y="568" text-anchor="middle">小而不可缺，最能開價</text>
</svg>
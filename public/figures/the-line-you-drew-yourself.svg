<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條往遠方延伸的路，中段被一條虛線攔住標為我以為的終點，而路面在虛線之後仍持續往右方延伸">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">你以為的上限，和路的上限</text>
<polygon points="80,420 900,270 900,240 80,360" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="300" cy="354" r="10" fill="var(--accent)"/>
<text class="g" x="300" y="322" text-anchor="middle" fill="var(--accent)">現在</text>
<line x1="470" y1="286" x2="470" y2="366" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 7"/>
<text class="g" x="470" y="256" text-anchor="middle" fill="var(--warn)">我以為的終點</text>
<text class="b" x="470" y="230" text-anchor="middle">身體發出的訊號</text>
<text class="g" x="890" y="212" text-anchor="end" fill="var(--dim)">路還在</text>
<text class="c" x="60" y="476">那條線是身體畫的，不是路畫的</text>
</svg>
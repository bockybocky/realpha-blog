<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The level stands well above the statutory line, the gap between them is the buffer, and a downward arrow shows shocks eating it away.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.lb{font-size:19px;fill:var(--dim)}.sm{font-size:15px;fill:var(--dim)}.t{font-size:27px}.c{font-size:22px}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">A buffer is a stock, not a policy</text>
<rect x="330" y="120" width="220" height="320" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="333" y="160" width="214" height="277" rx="8" fill="var(--accent)" opacity="0.32"/>
<line x1="300" y1="160" x2="600" y2="160" stroke="var(--accent)" stroke-width="4"/>
<text class="lb" x="614" y="166">Actual cover</text>
<line x1="300" y1="340" x2="600" y2="340" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 7"/>
<text class="lb" x="614" y="346">Statutory floor</text>
<line x1="258" y1="168" x2="258" y2="332" stroke="var(--ink)" stroke-width="3"/>
<polygon points="258,162 251,176 265,176" fill="var(--ink)"/>
<polygon points="258,338 251,324 265,324" fill="var(--ink)"/>
<text class="lb" x="92" y="250">Buffer</text>
<text class="sm" x="92" y="278">Also the annual premium</text>
<line x1="700" y1="180" x2="700" y2="320" stroke="var(--warn)" stroke-width="5"/>
<polygon points="700,332 691,314 709,314" fill="var(--warn)"/>
<text class="sm" x="722" y="250">Successive shocks</text>
<text class="sm" x="722" y="276">eat it away</text>
<text class="c" x="60" y="492">Slip to the dashed line and adjustment turns into tightening</text>
</svg>
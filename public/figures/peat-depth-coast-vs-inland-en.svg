<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="An extremely thin flat bar on the left sits beside a twenty-metre-thick block on the right, and on the same scale the heights differ by about twenty times.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">Peat: coast vs inland</text>
<line x1="150" y1="120" x2="900" y2="120" stroke="var(--line)" stroke-dasharray="5 6"/>
<line x1="150" y1="310" x2="900" y2="310" stroke="var(--line)" stroke-dasharray="5 6"/>
<text x="40" y="126" font-size="16" fill="var(--dim)">20 m</text>
<text x="40" y="316" font-size="16" fill="var(--dim)">10 m</text>
<text x="40" y="496" font-size="16" fill="var(--dim)">0 m</text>
<rect x="180" y="481" width="260" height="19" fill="var(--accent)"/>
<text x="180" y="462" font-size="19" fill="var(--ink)">Coastal peat &lt;1 m</text>
<text x="180" y="438" font-size="16" fill="var(--dim)">Nutrients; farmable</text>
<rect x="600" y="120" width="260" height="380" fill="var(--accent)"/>
<text x="600" y="104" font-size="19" fill="var(--ink)">Dome: 17–20 m</text>
<text x="622" y="300" font-size="16" fill="var(--page)">Acid, wet</text>
<text x="622" y="326" font-size="16" fill="var(--page)">No Cu, Mg, K</text>
<line x1="150" y1="500" x2="900" y2="500" stroke="var(--ink)" stroke-width="2"/>
<text x="150" y="528" font-size="16" fill="var(--dim)">Sand, granite</text>
<text x="180" y="300" font-size="22" fill="var(--ink)">Name only</text>
</svg>
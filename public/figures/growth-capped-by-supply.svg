<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左高右矮兩根柱子，高度差被標註為上游還沒填滿的缺口">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--dim); }
.b { font-size:16px; fill:var(--ink); }
.s { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">同一個成長率，量的是兩件事</text>

<line x1="120" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>

<rect x="200" y="120" width="130" height="280" fill="var(--card)" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="g" x="200" y="108">超過一倍</text>
<text class="b" x="200" y="432">不受供給限制</text>

<rect x="430" y="190" width="130" height="210" fill="var(--accent)"/>
<text class="g" x="430" y="178">約七成</text>
<text class="b" x="430" y="432">對外給的展望</text>

<line x1="330" y1="120" x2="620" y2="120" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="560" y1="190" x2="620" y2="190" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="620" y1="126" x2="620" y2="184" stroke="var(--warn)" stroke-width="2"/>
<path d="M620 118 l-6 12 l12 0 z" fill="var(--warn)"/>
<path d="M620 192 l-6 -12 l12 0 z" fill="var(--warn)"/>
<text class="g" x="640" y="150" fill="var(--warn)">上游還沒填滿的缺口</text>

<text class="c" x="60" y="485">量到的是瓶頸有多緊，不是需求有多強</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上排一長列卡車，下排只有一台卡車">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="60" y="64">同樣兩天，運耗材的卡車跑幾趟</text>
<text class="g" x="60" y="200">台灣</text>
<g fill="var(--accent)">
<g transform="translate(150,175)"><rect x="0" y="0" width="46" height="30" rx="3"/><rect x="46" y="10" width="18" height="20" rx="3"/><circle cx="12" cy="34" r="6"/><circle cx="52" cy="34" r="6"/></g>
<g transform="translate(225,175)"><rect x="0" y="0" width="46" height="30" rx="3"/><rect x="46" y="10" width="18" height="20" rx="3"/><circle cx="12" cy="34" r="6"/><circle cx="52" cy="34" r="6"/></g>
<g transform="translate(300,175)"><rect x="0" y="0" width="46" height="30" rx="3"/><rect x="46" y="10" width="18" height="20" rx="3"/><circle cx="12" cy="34" r="6"/><circle cx="52" cy="34" r="6"/></g>
<g transform="translate(375,175)"><rect x="0" y="0" width="46" height="30" rx="3"/><rect x="46" y="10" width="18" height="20" rx="3"/><circle cx="12" cy="34" r="6"/><circle cx="52" cy="34" r="6"/></g>
<g transform="translate(450,175)"><rect x="0" y="0" width="46" height="30" rx="3"/><rect x="46" y="10" width="18" height="20" rx="3"/><circle cx="12" cy="34" r="6"/><circle cx="52" cy="34" r="6"/></g>
<g transform="translate(525,175)"><rect x="0" y="0" width="46" height="30" rx="3"/><rect x="46" y="10" width="18" height="20" rx="3"/><circle cx="12" cy="34" r="6"/><circle cx="52" cy="34" r="6"/></g>
</g>
<g fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4">
<g transform="translate(600,175)"><rect x="0" y="0" width="46" height="30" rx="3"/><rect x="46" y="10" width="18" height="20" rx="3"/><circle cx="12" cy="34" r="6"/><circle cx="52" cy="34" r="6"/></g>
<g transform="translate(675,175)"><rect x="0" y="0" width="46" height="30" rx="3"/><rect x="46" y="10" width="18" height="20" rx="3"/><circle cx="12" cy="34" r="6"/><circle cx="52" cy="34" r="6"/></g>
<g transform="translate(750,175)"><rect x="0" y="0" width="46" height="30" rx="3"/><rect x="46" y="10" width="18" height="20" rx="3"/><circle cx="12" cy="34" r="6"/><circle cx="52" cy="34" r="6"/></g>
<g transform="translate(825,175)"><rect x="0" y="0" width="46" height="30" rx="3"/><rect x="46" y="10" width="18" height="20" rx="3"/><circle cx="12" cy="34" r="6"/><circle cx="52" cy="34" r="6"/></g>
</g>
<text class="b" x="150" y="250">6～10 趟</text>
<line x1="60" y1="290" x2="900" y2="290" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="60" y="360">美國</text>
<g fill="var(--accent)">
<g transform="translate(150,335)"><rect x="0" y="0" width="46" height="30" rx="3"/><rect x="46" y="10" width="18" height="20" rx="3"/><circle cx="12" cy="34" r="6"/><circle cx="52" cy="34" r="6"/></g>
</g>
<text class="b" x="150" y="410">1 趟</text>
<text class="c" x="60" y="475">六到十趟，對一趟</text>
</svg>
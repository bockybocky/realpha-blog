<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="One line rises from below the zero axis and keeps climbing, while another branches downward from the same starting point.">
<style>svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Who can repay the debt</text>
<rect x="130" y="110" width="720" height="220" fill="var(--card)"/>
<line x1="130" y1="330" x2="850" y2="330" stroke="var(--line)" stroke-width="2"/>
<text x="130" y="102" font-size="16" fill="var(--dim)">Inflow</text>
<text x="130" y="356" font-size="16" fill="var(--dim)">Outflow</text>
<path d="M170 404 C 320 392, 400 358, 470 330 C 580 290, 700 242, 820 206" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M170 404 C 400 420, 600 444, 820 474" fill="none" stroke="var(--grey)" stroke-width="4" stroke-dasharray="9 7"/>
<circle cx="470" cy="330" r="7" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<line x1="470" y1="337" x2="470" y2="520" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 6"/>
<text x="824" y="190" font-size="20" fill="var(--accent)" text-anchor="end">Top firms</text>
<text x="824" y="214" font-size="16" fill="var(--dim)" text-anchor="end">Easy repay</text>
<text x="824" y="504" font-size="20" fill="var(--dim)" text-anchor="end">Others</text>
<text x="824" y="528" font-size="16" fill="var(--dim)" text-anchor="end">No path</text>
<text x="170" y="548" font-size="16" fill="var(--dim)" text-anchor="middle">Now</text>
<text x="470" y="548" font-size="19" fill="var(--ink)" text-anchor="middle">2027</text>
<text x="60" y="584" font-size="22" fill="var(--ink)">Sold as one: who's on top is unclear</text>
</svg>
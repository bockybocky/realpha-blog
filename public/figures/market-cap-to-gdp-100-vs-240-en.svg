<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bars of total market capitalisation against GDP, one about one times and one about two and a half times.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="56">Same burst, very different leverage</text>
<line x1="90" y1="440" x2="900" y2="440" stroke="var(--ink)" stroke-width="3"/>
<line x1="90" y1="380" x2="900" y2="380" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
<text class="d" x="900" y="372" text-anchor="end">GDP</text>
<rect x="190" y="374" width="180" height="66" rx="8" fill="var(--grey)"/>
<text class="g" x="280" y="470" text-anchor="middle">Year 2000</text>
<text class="g" x="280" y="352" text-anchor="middle">About 1x</text>
<rect x="580" y="214" width="180" height="226" rx="8" fill="var(--warn)" opacity="0.9"/>
<text class="g" x="670" y="470" text-anchor="middle">Now</text>
<text class="g" x="670" y="192" text-anchor="middle">About 2.5x</text>
<text class="d" x="280" y="500" text-anchor="middle">A shallow recession</text>
<text class="d" x="670" y="500" text-anchor="middle">A harsher wealth effect</text>
<text class="c" x="60" y="542">Stocks now lever the economy more, so payback day is bigger too</text>
</svg>
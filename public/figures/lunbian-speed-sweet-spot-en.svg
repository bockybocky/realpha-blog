<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A U-shaped curve shows that cutting too slowly or too quickly both cause large error, and only a narrow middle band of speed keeps error lowest.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .c { font-size:22px; font-weight:700; }
    .d { fill:var(--dim); }
    .a { fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs><marker id="m0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker></defs>
<text x="480" y="56" text-anchor="middle" class="t">Wheelwright: thin window</text>
<rect x="420" y="145" width="120" height="255" fill="var(--accent)" opacity="0.12"/>
<line x1="100" y1="400" x2="880" y2="400" stroke="var(--dim)" stroke-width="2" marker-end="url(#m0)"/>
<line x1="100" y1="400" x2="100" y2="110" stroke="var(--dim)" stroke-width="2" marker-end="url(#m0)"/>
<text x="112" y="122" class="b d">Miss</text>
<text x="150" y="430" text-anchor="middle" class="b d">Slow</text>
<text x="810" y="430" text-anchor="middle" class="b d">Fast</text>
<text x="880" y="458" text-anchor="end" class="b d">Speed</text>
<path d="M130 150 Q480 630 830 150" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="480" cy="390" r="8" fill="var(--accent)"/>
<text x="215" y="150" class="b d">Slow</text>
<text x="215" y="180" class="g">Lax</text>
<text x="745" y="150" text-anchor="end" class="b d">Fast</text>
<text x="745" y="180" text-anchor="end" class="g">Jams</text>
<text x="480" y="132" text-anchor="middle" class="g a">Just so</text>
<text x="480" y="300" text-anchor="middle" class="b">By feel</text>
<text x="480" y="492" text-anchor="middle" class="c">Felt, not spoken</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="人力資本隨年齡遞減、金融資本遞增，兩個楔形在中年交叉">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px;font-weight:700}
    .b{font-size:16px;fill:var(--dim)}
    .k{font-size:22px;font-weight:700}
</style>
<text class="t" x="60" y="58">你的資產，多數還沒入帳</text>
<line x1="120" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<path d="M120,138 C 380,196 620,384 880,432 L880,440 L120,440 Z" fill="var(--grey)" opacity="0.38"/>
<path d="M120,138 C 380,196 620,384 880,432" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M120,436 C 420,428 660,368 880,182 L880,440 L120,440 Z" fill="var(--accent)" opacity="0.16"/>
<path d="M120,436 C 420,428 660,368 880,182" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
<text class="g" x="150" y="186">人力資本</text>
<text class="b" x="150" y="212">未來的薪水</text>
<text class="g" x="880" y="222" text-anchor="end" fill="var(--accent)">金融資本</text>
<text class="b" x="880" y="248" text-anchor="end">帳戶裡的錢</text>
<text class="b" x="120" y="468">25 歲</text>
<text class="b" x="500" y="468" text-anchor="middle">50 歲</text>
<text class="b" x="900" y="468" text-anchor="end">75 歲</text>
<line x1="120" y1="490" x2="420" y2="490" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="120" y="514">可以全押股票</text>
<line x1="600" y1="490" x2="900" y2="490" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="900" y="514" text-anchor="end">該轉保守</text>
<text class="k" x="60" y="546">股票比重看的是薪水還剩幾年</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="時間軸上三塊相距很遠的方塊，上方一個虛線框把三塊收攏成單一個方塊" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="64" y="66" font-size="27" font-weight="700" fill="var(--ink)">三種時間刻度，一個故事</text>
<text x="64" y="98" font-size="16" fill="var(--dim)">合起來聽像一個市場，攤開來是三段距離</text>

<rect x="330" y="146" width="300" height="72" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="480" y="190" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">正在爆發的市場</text>

<path d="M180 330 L400 226" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M480 330 L480 226" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M780 330 L560 226" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>

<rect x="80" y="336" width="200" height="86" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="180" y="372" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">導電型元件</text>
<text x="180" y="400" font-size="15" fill="var(--accent)" text-anchor="middle">已在出貨</text>

<rect x="380" y="336" width="200" height="86" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="372" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">800V 架構</text>
<text x="480" y="400" font-size="15" fill="var(--dim)" text-anchor="middle">等規格落地</text>

<rect x="680" y="336" width="200" height="86" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="780" y="372" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">導光・散熱</text>
<text x="780" y="400" font-size="15" fill="var(--dim)" text-anchor="middle">還在實驗室</text>

<line x1="64" y1="452" x2="896" y2="452" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="482" font-size="15" fill="var(--dim)">現在</text>
<text x="896" y="482" font-size="15" fill="var(--dim)" text-anchor="end">很久以後</text>
</svg>
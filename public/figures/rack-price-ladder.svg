<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三根柱子高度遞增且最後一根跳得特別多">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">一櫃的價碼，一代跳一階</text>

<line x1="100" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>
<rect x="160" y="315" width="160" height="135" rx="6" fill="var(--accent)" opacity="0.2"/>
<rect x="160" y="315" width="160" height="135" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="240" y="298" font-size="20" fill="var(--ink)" text-anchor="middle">1,800 萬</text>
<text x="240" y="484" font-size="16" fill="var(--dim)" text-anchor="middle">GB200</text>

<rect x="420" y="263" width="160" height="187" rx="6" fill="var(--accent)" opacity="0.2"/>
<rect x="420" y="263" width="160" height="187" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="500" y="246" font-size="20" fill="var(--ink)" text-anchor="middle">2,500 萬</text>
<text x="500" y="484" font-size="16" fill="var(--dim)" text-anchor="middle">GB300</text>

<rect x="680" y="150" width="160" height="300" rx="6" fill="var(--accent)" opacity="0.34"/>
<rect x="680" y="150" width="160" height="300" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="760" y="133" font-size="20" fill="var(--ink)" text-anchor="middle">4,000 萬</text>
<text x="760" y="484" font-size="16" fill="var(--dim)" text-anchor="middle">Vera Rubin</text>

<text x="80" y="330" font-size="16" fill="var(--dim)" text-anchor="middle">美元</text>
<text x="480" y="524" font-size="22" fill="var(--ink)" text-anchor="middle">不是想不想自研，是被價碼逼的</text>
</svg>
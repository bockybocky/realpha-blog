<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩層水平分隔的方塊，上層資本結構、下層供給條件，中間虛線表示兩層要分開看">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">兩層要分開看</text>

<rect x="60" y="100" width="840" height="150" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="88" y="140" font-size="20" font-weight="700" fill="var(--warn)">公司自己這一關</text>
<rect x="88" y="162" width="200" height="60" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="188" y="199" font-size="17" fill="var(--ink)" text-anchor="middle">隨市增資</text>
<rect x="312" y="162" width="200" height="60" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="412" y="199" font-size="17" fill="var(--ink)" text-anchor="middle">稀釋</text>
<rect x="536" y="162" width="200" height="60" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="636" y="199" font-size="17" fill="var(--ink)" text-anchor="middle">利息壓力</text>
<text class="t" x="770" y="199" font-size="16" fill="var(--dim)">→ 股價</text>

<path d="M60 290 L900 290" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="t" x="480" y="282" font-size="16" font-weight="600" fill="var(--dim)" text-anchor="middle">別混讀</text>

<rect x="60" y="320" width="840" height="150" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="88" y="360" font-size="20" font-weight="700" fill="var(--accent)">物理這一關</text>
<rect x="88" y="382" width="200" height="60" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="188" y="419" font-size="17" fill="var(--ink)" text-anchor="middle">做得出來幾家</text>
<rect x="312" y="382" width="200" height="60" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="412" y="419" font-size="17" fill="var(--ink)" text-anchor="middle">交期</text>
<rect x="536" y="382" width="200" height="60" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="636" y="419" font-size="17" fill="var(--ink)" text-anchor="middle">長約年限</text>
<text class="t" x="770" y="419" font-size="16" fill="var(--dim)">→ 供給</text>

<text class="t" x="60" y="524" font-size="22" font-weight="600" fill="var(--ink)">增資跑完，交期不會變短</text>
</svg>
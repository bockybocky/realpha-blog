<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two rows of chain links compared, the upper with its rotten link propped up and the whole row greyed out, the lower with that link removed so the chain breaks open.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="48" y="62" font-size="27" fill="var(--ink)">Propped up, or let to fall</text>

  <text x="48" y="150" font-size="20" fill="var(--dim)">Propped up</text>
  <line x1="150" y1="215" x2="810" y2="215" stroke="var(--grey)" stroke-width="3"/>
  <rect x="150" y="180" width="110" height="70" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="290" y="180" width="110" height="70" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="430" y="180" width="110" height="70" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="570" y="180" width="110" height="70" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="710" y="180" width="110" height="70" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="438" y="168" font-size="16" fill="var(--warn)">Screw plant</text>
  <line x1="455" y1="250" x2="440" y2="288" stroke="var(--warn)" stroke-width="3"/>
  <line x1="515" y1="250" x2="530" y2="288" stroke="var(--warn)" stroke-width="3"/>
  <line x1="425" y1="288" x2="545" y2="288" stroke="var(--warn)" stroke-width="3"/>
  <text x="556" y="282" font-size="16" fill="var(--warn)">Held by subsidy</text>

  <text x="48" y="382" font-size="20" fill="var(--dim)">Let it fall</text>
  <line x1="150" y1="430" x2="420" y2="430" stroke="var(--accent)" stroke-width="3"/>
  <line x1="552" y1="430" x2="810" y2="430" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>
  <rect x="150" y="395" width="110" height="70" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="290" y="395" width="110" height="70" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="430" y="395" width="110" height="70" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 6"/>
  <rect x="570" y="395" width="110" height="70" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <rect x="710" y="395" width="110" height="70" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text x="596" y="382" font-size="16" fill="var(--dim)">Downstream breaks first</text>

  <text x="48" y="546" font-size="22" fill="var(--ink)">Prop up a rotten link and the whole chain rots</text>
</svg>
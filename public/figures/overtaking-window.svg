<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條曲線中途變平、另一條持續陡升並在右側穿過它，交叉點是超車窗口">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="66">誰慢下來，誰的窗口就打開</text>

<line x1="120" y1="110" x2="120" y2="480" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="480" x2="900" y2="480" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="60" y="118">算力</text>
<text class="s" x="850" y="508">時間</text>

<polyline points="120,430 400,270 707,227 880,212" fill="none" stroke="var(--grey)" stroke-width="5"/>
<text class="g" x="700" y="188" fill="var(--dim)">領先者</text>
<text class="s" x="700" y="166">踩下剎車</text>

<polyline points="120,462 400,388 707,227 880,140" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="g" x="770" y="120" fill="var(--accent)">追趕者</text>

<circle cx="707" cy="227" r="14" fill="none" stroke="var(--warn)" stroke-width="3"/>
<line x1="707" y1="241" x2="640" y2="330" stroke="var(--warn)" stroke-width="2"/>
<text class="g" x="500" y="356" fill="var(--warn)">超車窗口</text>

<text class="s" x="150" y="410">一座資料中心：三～四年</text>
<text class="s" x="150" y="436">他自己算：幾十天</text>

<text class="c" x="60" y="530">他怕的不是後面的人追上，是前面的人跑太快。</text>
</svg>
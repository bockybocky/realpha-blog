<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三條位置隨時間變化的曲線，一條衝過目標後震盪，一條緩慢爬升，一條迅速平穩到位">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .drop { stroke-width:1.5; stroke-dasharray:3 5; }
</style>
<text x="60" y="64" class="t">對位平台的兩難</text>
<line x1="100" y1="130" x2="100" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="100" y="120" text-anchor="middle" class="b">位置</text>
<text x="880" y="468" text-anchor="end" class="b">時間</text>
<line x1="100" y1="220" x2="880" y2="220" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="880" y="200" text-anchor="end" class="b">目標位置</text>
<path d="M100 440 C320 420 560 250 820 222" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M100 440 C125 230 150 130 195 140 C240 150 245 255 290 250 C330 245 340 210 375 214 C400 217 415 221 440 220" fill="none" stroke="var(--warn)" stroke-width="3"/>
<path d="M100 440 C150 250 190 222 300 220" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="300" cy="220" r="6" fill="var(--accent)"/>
<circle cx="440" cy="220" r="6" fill="var(--warn)"/>
<circle cx="820" cy="222" r="6" fill="var(--grey)"/>
<line x1="300" y1="226" x2="300" y2="440" class="drop" stroke="var(--accent)"/>
<line x1="440" y1="226" x2="440" y2="440" class="drop" stroke="var(--warn)"/>
<line x1="820" y1="228" x2="820" y2="440" class="drop" stroke="var(--grey)"/>
<text x="205" y="122" text-anchor="middle" class="g" style="fill:var(--warn)">衝過頭</text>
<text x="300" y="262" text-anchor="middle" class="g" style="fill:var(--accent)">理想</text>
<text x="650" y="336" text-anchor="middle" class="g" style="fill:var(--dim)">拖時間</text>
<text x="480" y="520" text-anchor="middle" class="c">到位越快，越能開價</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The rate of rise falls steadily, with one downward notch at first crack followed by a rebound.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="80" y="72" font-size="27" font-weight="700" fill="var(--ink)">The rate of rise should fall all the way, with no notch in the middle</text>

  <line x1="120" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
  <line x1="120" y1="120" x2="120" y2="420" stroke="var(--line)" stroke-width="2"/>
  <text x="104" y="136" font-size="15" text-anchor="end" fill="var(--dim)">Rate of rise</text>
  <text x="900" y="450" font-size="15" text-anchor="end" fill="var(--dim)">Time</text>

  <path d="M140 160 C 260 196, 380 236, 520 266" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 7"/>
  <path d="M520 266 C 640 290, 760 310, 880 328" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 7"/>
  <text x="860" y="306" font-size="16" text-anchor="end" fill="var(--dim)">Ideal: a steady decline</text>

  <path d="M140 160 C 260 196, 380 236, 520 266 C 540 300, 552 362, 566 364 C 584 366, 596 310, 620 296 C 700 304, 790 318, 880 334" fill="none" stroke="var(--accent)" stroke-width="4"/>

  <line x1="520" y1="130" x2="520" y2="400" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="520" y="120" font-size="19" font-weight="700" text-anchor="middle" fill="var(--warn)">First crack</text>
  <circle cx="566" cy="364" r="8" fill="var(--warn)"/>
  <text x="582" y="396" font-size="19" font-weight="700" fill="var(--warn)">Crash</text>
  <text x="636" y="268" font-size="19" font-weight="700" fill="var(--accent)">Flick</text>
  <text x="300" y="150" font-size="16" fill="var(--dim)">Steam from the core is cooler than the probe</text>

  <text x="80" y="488" font-size="22" font-weight="700" fill="var(--ink)">This notch is blamed for the flat, baked taste</text>
</svg>
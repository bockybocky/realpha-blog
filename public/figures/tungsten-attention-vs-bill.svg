<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="注意力的箭頭指向小塊軍工，成本的箭頭指向大塊工具用途，兩支箭頭方向相反交叉">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t  { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1 { font-size:27px; fill:var(--ink); font-weight:700; }
    .g  { font-size:19px; fill:var(--ink); font-weight:600; }
    .gp { font-size:19px; fill:var(--page); font-weight:600; }
    .ga { font-size:19px; fill:var(--accent); font-weight:600; }
    .gw { font-size:19px; fill:var(--warn); font-weight:600; }
    .s  { font-size:15px; fill:var(--dim); }
    .c  { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t h1" x="60" y="62">帳單寄到了另一群人手上</text>
  <text class="t s" x="900" y="150" text-anchor="end">鎢價 300 → 3,000</text>

  <rect x="60" y="250" width="672" height="80" fill="var(--card)" stroke="var(--line)"/>
  <rect x="732" y="250" width="168" height="80" fill="var(--accent)"/>
  <text class="t g" x="396" y="298" text-anchor="middle">碳化鎢工具 80%</text>
  <text class="t gp" x="816" y="298" text-anchor="middle">軍工 20%</text>

  <text class="t ga" x="100" y="152">新聞在講的</text>
  <path d="M215,162 C 420,140 700,170 816,228" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <polygon points="816,244 809,228 823,228" fill="var(--accent)"/>

  <text class="t gw" x="900" y="440" text-anchor="end">成本打到的</text>
  <path d="M790,422 C 620,432 480,400 396,346" fill="none" stroke="var(--warn)" stroke-width="2.5"/>
  <polygon points="396,332 389,348 403,348" fill="var(--warn)"/>

  <text class="t c" x="60" y="500">離關鍵字最近的，未必是受惠的那個</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩格對比，毛利率同樣下滑，但左格的量在陡升、右格的量在持平">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="56" y="60" font-size="27" font-weight="700" fill="var(--ink)">毛利率下滑的兩種</text>

  <rect x="48" y="110" width="416" height="340" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="496" y="110" width="416" height="340" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text x="76" y="152" font-size="19" font-weight="700" fill="var(--accent)">量在暴增</text>
  <text x="524" y="152" font-size="19" font-weight="700" fill="var(--dim)">量在停滯</text>

  <path d="M76 296 H436" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 8"/>
  <path d="M524 296 H884" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 8"/>

  <text x="96" y="250" font-size="15" fill="var(--accent)">量</text>
  <path d="M96 272 L200 244 L300 214 L424 186" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <text x="96" y="312" font-size="15" fill="var(--dim)">毛利率</text>
  <path d="M96 332 L200 346 L300 360 L424 376" fill="none" stroke="var(--grey)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <text x="544" y="208" font-size="15" fill="var(--accent)">量</text>
  <path d="M544 230 L650 228 L760 233 L872 229" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <text x="544" y="312" font-size="15" fill="var(--dim)">毛利率</text>
  <path d="M544 332 L650 346 L760 360 L872 376" fill="none" stroke="var(--grey)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <text x="480" y="512" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">同一條線，看的是量的方向</text>
</svg>
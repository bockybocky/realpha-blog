<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="三根柱子：成本柱矮，一年前的收入柱低於成本線，現在的收入柱高出數倍。">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--ink); }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="h" x="60" y="60">一兆瓦，從賠錢翻成引擎</text>
<line x1="120" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="130" y1="385" x2="900" y2="385" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="7 7"/>
<text class="b" x="900" y="378" text-anchor="end">成本上緣</text>
<rect x="170" y="385" width="150" height="85" fill="var(--grey)"/>
<line x1="170" y1="413" x2="320" y2="413" stroke="var(--page)" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="420" y="425" width="150" height="45" fill="var(--warn)"/>
<rect x="670" y="187" width="150" height="283" fill="var(--accent)"/>
<text class="b" x="245" y="373" text-anchor="middle">1000–1500 萬美元</text>
<text class="b" x="495" y="413" text-anchor="middle">低於成本</text>
<text class="b" x="745" y="175" text-anchor="middle">約 5000 萬美元</text>
<text class="g" x="245" y="502" text-anchor="middle">每兆瓦成本</text>
<text class="g" x="495" y="502" text-anchor="middle">一年多前</text>
<text class="b" x="495" y="526" text-anchor="middle">每兆瓦收入</text>
<text class="g" x="745" y="502" text-anchor="middle">現在</text>
<text class="b" x="745" y="526" text-anchor="middle">每兆瓦收入</text>
<text class="c" x="60" y="572">花十塊，生出五十塊</text>
</svg>
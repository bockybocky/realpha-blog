<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A four-step descending staircase showing how deeply the filing describes each chip supplier, with Google's step left empty.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">One filing, four degrees of closeness</text>
<text x="60" y="94" font-size="15" fill="var(--dim)">Higher step, deeper wording</text>

<rect x="60" y="130" width="560" height="74" fill="var(--accent)"/>
<text x="80" y="162" font-size="20" fill="var(--page)">Nvidia</text>
<text x="80" y="188" font-size="15" fill="var(--page)">Design and engineering work, optimizing future hardware</text>

<rect x="60" y="214" width="470" height="74" fill="var(--accent)" opacity="0.72"/>
<text x="80" y="246" font-size="20" fill="var(--page)">AMD</text>
<text x="80" y="272" font-size="15" fill="var(--page)">Multi-year engineering partnership</text>

<rect x="60" y="298" width="380" height="74" fill="var(--accent)" opacity="0.45"/>
<text x="80" y="330" font-size="20" fill="var(--ink)">Trainium</text>
<text x="80" y="356" font-size="15" fill="var(--ink)">Able to shape future generations</text>

<rect x="60" y="382" width="200" height="74" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="80" y="414" font-size="20" fill="var(--dim)">Google</text>
<text x="80" y="440" font-size="15" fill="var(--dim)">Not described</text>

<line x1="680" y1="130" x2="680" y2="456" stroke="var(--line)" stroke-width="2"/>
<text x="706" y="150" font-size="19" fill="var(--dim)">Fifth name</text>
<text x="706" y="180" font-size="16" fill="var(--ink)">Broadcom</text>
<text x="706" y="206" font-size="15" fill="var(--dim)">Co-developing in-house chips</text>
<text x="706" y="232" font-size="15" fill="var(--dim)">Not quoted on the show</text>

<text x="60" y="504" font-size="22" fill="var(--ink)">The language is vague, but the uneven affection shows</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="共識從走平翻到大幅成長，旁邊股價只漲一小截，兩段高度差明顯">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">共識改了一大截，價格只動一小截</text>
<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="80" y="112" font-size="19" font-weight="700" fill="var(--dim)">共識對 2027 的看法</text>
<circle cx="140" cy="400" r="10" fill="var(--grey)"/>
<text class="t" x="118" y="432" font-size="15" fill="var(--dim)">去年</text>
<line x1="140" y1="400" x2="300" y2="396" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 6"/>
<text class="t" x="220" y="380" font-size="16" fill="var(--dim)" text-anchor="middle">走平或縮</text>
<line x1="300" y1="396" x2="420" y2="150" stroke="var(--accent)" stroke-width="4"/>
<circle cx="420" cy="150" r="11" fill="var(--accent)"/>
<text class="t" x="420" y="128" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">成長 74%</text>
<text class="t" x="420" y="432" font-size="15" fill="var(--dim)" text-anchor="middle">現在</text>

<text class="t" x="620" y="112" font-size="19" font-weight="700" fill="var(--dim)">同一年的股價</text>
<rect x="650" y="372" width="170" height="68" rx="6" fill="var(--grey)"/>
<text class="t" x="735" y="352" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">只漲兩成</text>
<line x1="650" y1="150" x2="820" y2="150" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="735" y1="160" x2="735" y2="362" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="750" y="266" font-size="16" fill="var(--dim)">兩者的落差</text>

<text class="t" x="60" y="506" font-size="22" font-weight="700" fill="var(--ink)">落在十三到十四倍盈餘</text>
</svg>
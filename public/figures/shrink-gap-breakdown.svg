<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="帳上長條比架上長條多出一截叫損耗，放大後切成員工約四成、外部約三成五、其餘作業疏失三段">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .w { fill:var(--warn); }
</style>
<text x="48" y="62" class="t">損耗＝帳上有、架上沒有</text>
<text x="160" y="139" class="g" text-anchor="end">帳上</text>
<text x="160" y="199" class="g" text-anchor="end">架上</text>
<rect x="180" y="110" width="600" height="44" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="170" width="540" height="44" fill="var(--accent)" fill-opacity="0.75"/>
<rect x="720" y="170" width="60" height="44" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 4"/>
<text x="800" y="199" class="g w">損耗</text>
<line x1="720" y1="214" x2="180" y2="328" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="780" y1="214" x2="780" y2="328" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="180" y="330" width="240" height="56" fill="var(--accent)"/>
<rect x="420" y="330" width="210" height="56" fill="var(--accent)" fill-opacity="0.45"/>
<rect x="630" y="330" width="150" height="56" fill="var(--grey)"/>
<text x="800" y="364" class="d">業界粗估</text>
<text x="300" y="418" class="g" text-anchor="middle">員工</text>
<text x="525" y="418" class="g" text-anchor="middle">外部</text>
<text x="705" y="418" class="g" text-anchor="middle">作業疏失</text>
<text x="300" y="444" class="d" text-anchor="middle">約四成</text>
<text x="525" y="444" class="d" text-anchor="middle">約三成五</text>
<text x="705" y="444" class="d" text-anchor="middle">其餘</text>
<text x="480" y="512" class="c" text-anchor="middle">差額 ≠ 被偷</text>
</svg>
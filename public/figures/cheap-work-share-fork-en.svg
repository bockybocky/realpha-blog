<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two upright buckets of equal size, the lower 80% of the left one shaded light for cheap work and the upper 80% of the right one shaded dark for paid work, with an opposite outcome written under each.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); }
.g { font-size:20px; fill:var(--ink); }
.s { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="68">The whole chain turns on this share</text>

<rect x="120" y="120" width="260" height="300" fill="var(--card)" stroke="var(--line)"/>
<rect x="120" y="180" width="260" height="240" fill="var(--grey)"/>
<text class="g" x="140" y="310" fill="var(--page)">Cheap work 80%</text>
<text class="s" x="140" y="158">Paid work 20%</text>
<text class="g" x="120" y="470" fill="var(--warn)">Price war breaks out</text>
<text class="s" x="120" y="502">The chain links up</text>

<rect x="580" y="120" width="260" height="300" fill="var(--card)" stroke="var(--line)"/>
<rect x="580" y="120" width="260" height="240" fill="var(--accent)"/>
<text class="g" x="600" y="250" fill="var(--page)">Paid work 80%</text>
<text class="s" x="600" y="396">Cheap work 20%</text>
<text class="g" x="580" y="470" fill="var(--accent)">No price war</text>
<text class="s" x="580" y="502">First link never forms</text>

<line x1="440" y1="120" x2="440" y2="420" stroke="var(--line)" stroke-dasharray="6 7"/>
<text class="s" x="408" y="548">One industry, two forks</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A curve flat then rising: the first stretch is near-horizontal and dips slightly, the second climbs steeply, with a vertical dashed line between them">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">The harvest comes later</text>

<path d="M120 110 L120 420 L880 420" stroke="var(--line)" stroke-width="2.5" fill="none"/>
<text x="60" y="130" font-size="16" fill="var(--dim)">Output</text>
<text x="812" y="452" font-size="16" fill="var(--dim)">Time</text>

<path d="M150 322 C260 340 340 372 440 368 C600 360 740 260 860 150"
      stroke="var(--accent)" stroke-width="4" fill="none"/>
<path d="M470 120 L470 420" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="6 6"/>

<text x="164" y="266" font-size="19" fill="var(--dim)">Making chips</text>
<text x="164" y="294" font-size="16" fill="var(--dim)">Barely visible</text>
<text x="520" y="212" font-size="19" fill="var(--accent)">Redo the business</text>
<text x="520" y="240" font-size="16" fill="var(--dim)">Harvest here</text>

<text x="60" y="498" font-size="22" fill="var(--ink)">Shovel sellers first, buyers later</text>
</svg>
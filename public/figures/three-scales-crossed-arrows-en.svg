<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three time-scale boxes, with the comfort arrow and the decision arrow crossing to point at opposite ends.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Comfort right/act left</text>

<rect x="80" y="110" width="240" height="120" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="200" y="182" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">One quarter</text>
<rect x="360" y="110" width="240" height="120" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="182" font-size="20" text-anchor="middle" fill="var(--dim)">One year</text>
<rect x="640" y="110" width="240" height="120" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="760" y="182" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">Five years</text>

<path d="M760 396 C 700 330 300 310 212 248" stroke="var(--warn)" stroke-width="4" fill="none"/>
<path d="M226 262 L202 238 L222 236 Z" fill="var(--warn)"/>
<path d="M200 396 C 260 330 660 310 748 248" stroke="var(--accent)" stroke-width="4" fill="none"/>
<path d="M734 262 L758 238 L738 236 Z" fill="var(--accent)"/>

<text x="200" y="432" font-size="20" text-anchor="middle" fill="var(--warn)">The decision now</text>
<text x="760" y="432" font-size="20" text-anchor="middle" fill="var(--accent)">The optimism I cite</text>

<text x="480" y="488" font-size="22" text-anchor="middle" fill="var(--ink)">Name your scale: no crossing</text>
</svg>
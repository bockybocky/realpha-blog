<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左格兩箭頭一上一下，右格兩箭頭同時向下">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">這個保護有前提</text>

  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="var(--warn)"/>
    </marker>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 10 L 10 10 L 5 0 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect x="60" y="110" width="400" height="320" fill="var(--card)"/>
  <text class="t" x="80" y="150" font-size="20" font-weight="700" fill="var(--ink)">殺盤來自供應鏈緩解</text>
  <line x1="170" y1="200" x2="170" y2="370" stroke="var(--warn)" stroke-width="8" marker-end="url(#dn)"/>
  <line x1="350" y1="370" x2="350" y2="200" stroke="var(--accent)" stroke-width="8" marker-end="url(#up)"/>
  <text class="t" x="170" y="400" font-size="16" text-anchor="middle" fill="var(--dim)">缺貨漲價</text>
  <text class="t" x="350" y="400" font-size="16" text-anchor="middle" fill="var(--dim)">靠出貨量</text>
  <text class="t" x="80" y="425" font-size="19" font-weight="700" fill="var(--accent)">對沖成立</text>

  <rect x="500" y="110" width="400" height="320" fill="var(--card)"/>
  <text class="t" x="520" y="150" font-size="20" font-weight="700" fill="var(--ink)">利率、地緣、需求</text>
  <line x1="610" y1="200" x2="610" y2="370" stroke="var(--warn)" stroke-width="8" marker-end="url(#dn)"/>
  <line x1="790" y1="200" x2="790" y2="370" stroke="var(--warn)" stroke-width="8" marker-end="url(#dn)"/>
  <text class="t" x="610" y="400" font-size="16" text-anchor="middle" fill="var(--dim)">缺貨漲價</text>
  <text class="t" x="790" y="400" font-size="16" text-anchor="middle" fill="var(--dim)">靠出貨量</text>
  <text class="t" x="520" y="425" font-size="19" font-weight="700" fill="var(--warn)">保護消失</text>

  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">他用的詞是「有機會」，不是「會」</text>
</svg>
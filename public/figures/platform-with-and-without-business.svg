<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊平台上有兩塊實心方塊，右邊同樣的平台上是空的虛線框">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="72">平台不是生意，平台上面的才是</text>
<rect x="70" y="200" width="150" height="130" rx="4" fill="var(--accent)" opacity="0.9"/>
<text class="g" x="86" y="270" fill="var(--page)">製劑</text>
<rect x="240" y="240" width="150" height="90" rx="4" fill="var(--accent)" opacity="0.9"/>
<text class="g" x="256" y="292" fill="var(--page)">風洞</text>
<rect x="60" y="340" width="340" height="40" rx="4" fill="var(--grey)"/>
<text class="b" x="60" y="412">有人付錢，所以要再飛一次</text>
<rect x="560" y="200" width="300" height="130" rx="4" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="10 8"/>
<rect x="550" y="340" width="340" height="40" rx="4" fill="var(--grey)"/>
<text class="b" x="550" y="412">技術很稀有，上面沒有生意</text>
<text class="c" x="60" y="492">先問誰在付錢、付多久</text>
</svg>
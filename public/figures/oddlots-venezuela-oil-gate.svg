<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一道閘門把短期交易放進去，長期投資在門外排著等">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="50" y="58" font-size="27" font-weight="700" fill="var(--ink)">誰進得去，看投資期限多長</text>

<rect x="60" y="100" width="840" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="300" y1="112" x2="300" y2="408" stroke="var(--warn)" stroke-width="6"/>
<text x="300" y="440" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">合約會被遵守嗎</text>

<text x="96" y="156" font-size="19" font-weight="700" fill="var(--dim)">門內</text>
<rect x="96" y="176" width="92" height="40" rx="6" fill="var(--accent)"/>
<text x="142" y="238" font-size="16" fill="var(--ink)" text-anchor="middle">快速交易</text>
<text x="142" y="262" font-size="15" fill="var(--dim)" text-anchor="middle">小公司</text>

<text x="340" y="156" font-size="19" font-weight="700" fill="var(--dim)">門外等著</text>
<rect x="340" y="188" width="300" height="40" rx="6" fill="var(--grey)" opacity="0.55"/>
<text x="656" y="216" font-size="16" fill="var(--ink)">十年期</text>
<rect x="340" y="266" width="520" height="40" rx="6" fill="var(--grey)" opacity="0.55"/>
<text x="352" y="340" font-size="16" fill="var(--ink)">三十年期</text>
<text x="352" y="364" font-size="15" fill="var(--dim)">大型石油公司</text>

<text x="480" y="500" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">條越長，越等不起不確定</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A horizontal truth line with three errors below it on the left and two errors above it on the right, running in opposite directions.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .ti{font-size:27px;font-weight:700}
    .g{font-size:20px;font-weight:700}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t ti" x="60" y="56">One rule, two conditions</text>
<rect x="60" y="90" width="400" height="36" rx="8" fill="var(--card)"/>
<rect x="500" y="90" width="400" height="36" rx="8" fill="var(--card)"/>
<text class="t g" x="80" y="116" fill="var(--accent)">He's on the ballot</text>
<text class="t g" x="520" y="116" fill="var(--warn)">Off ballot</text>
<line x1="60" y1="310" x2="900" y2="310" stroke="var(--grey)" stroke-width="2"/>
<text class="t b" x="60" y="300">Actual</text>
<line x1="480" y1="140" x2="480" y2="480" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="130" y="310" width="46" height="110" fill="var(--accent)" opacity="0.85"/>
<rect x="240" y="310" width="46" height="120" fill="var(--accent)" opacity="0.85"/>
<rect x="350" y="310" width="46" height="62" fill="var(--accent)" opacity="0.85"/>
<text class="t b" x="124" y="444">2016</text>
<text class="t b" x="234" y="454">2020</text>
<text class="t b" x="344" y="396">2024</text>
<text class="t g" x="130" y="478" fill="var(--accent)">Polls low on Trump</text>
<rect x="580" y="186" width="46" height="124" fill="var(--warn)" opacity="0.85"/>
<rect x="700" y="200" width="46" height="110" fill="var(--warn)" opacity="0.85"/>
<text class="t b" x="566" y="176">NJ</text>
<text class="t b" x="690" y="190">VA</text>
<text class="t b" x="580" y="340">2025</text>
<text class="t g" x="580" y="478" fill="var(--warn)">Dems too low</text>
<text class="t c" x="60" y="528">The rule held — until it didn't</text>
</svg>
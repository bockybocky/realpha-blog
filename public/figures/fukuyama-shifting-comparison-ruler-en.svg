<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bar panels compare the past, when you and your neighbor were about equal, with now, when you are taller but the comparison is the top 1 percent, far higher.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); font-size:16px; }
</style>
<text x="480" y="48" text-anchor="middle" style="font-size:27px;font-weight:700">The bar moved up</text>
<text x="265" y="92" text-anchor="middle" style="font-size:20px;font-weight:700">Then: peers</text>
<text x="700" y="92" text-anchor="middle" style="font-size:20px;font-weight:700">Now: feed's elite</text>
<line x1="480" y1="110" x2="480" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="90" y1="450" x2="890" y2="450" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="330" width="90" height="120" rx="6" fill="var(--accent)"/>
<rect x="290" y="320" width="90" height="130" rx="6" fill="var(--grey)"/>
<rect x="580" y="250" width="90" height="200" rx="6" fill="var(--accent)"/>
<rect x="730" y="120" width="90" height="330" rx="6" fill="var(--warn)"/>
<line x1="195" y1="330" x2="625" y2="250" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="250" y="302" text-anchor="middle" style="font-size:16px;fill:var(--accent);font-weight:700">Better</text>
<line x1="834" y1="120" x2="834" y2="250" stroke="var(--warn)" stroke-width="3"/>
<line x1="826" y1="250" x2="842" y2="250" stroke="var(--warn)" stroke-width="3"/>
<text x="848" y="192" style="font-size:19px;fill:var(--warn);font-weight:700">Gap</text>
<text x="195" y="482" text-anchor="middle" style="font-size:19px">U</text>
<text x="335" y="482" text-anchor="middle" style="font-size:19px;fill:var(--dim)">Nbr</text>
<text x="625" y="482" text-anchor="middle" style="font-size:19px">U</text>
<text x="775" y="482" text-anchor="middle" style="font-size:19px;fill:var(--warn)">Top 1%</text>
<text x="480" y="535" text-anchor="middle" style="font-size:22px;font-weight:700">Mood tracks the ruler</text>
</svg>
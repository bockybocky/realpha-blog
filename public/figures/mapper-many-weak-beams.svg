<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一道強束必須收束成一點，一整排弱小束各走各路直落晶圓，不經過交叉點">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px}.g{font-size:19px;fill:var(--dim)}.b{font-size:16px;fill:var(--dim)}.c{font-size:22px}
</style>
<text class="t" x="48" y="62">把一道強的，換成很多道弱的</text>
<text class="g" x="48" y="118">一道強束</text>
<path d="M120 140 L300 230 M180 140 L300 230 M240 140 L300 230 M300 140 L300 230 M360 140 L300 230 M420 140 L300 230" stroke="var(--grey)" stroke-width="2"/>
<circle cx="300" cy="236" r="14" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="330" y="242">非得擠過一點</text>
<text class="g" x="48" y="320">很多道弱束</text>
<g stroke="var(--accent)" stroke-width="3">
<path d="M120 342 L120 430"/><path d="M164 342 L164 430"/><path d="M208 342 L208 430"/><path d="M252 342 L252 430"/><path d="M296 342 L296 430"/><path d="M340 342 L340 430"/><path d="M384 342 L384 430"/><path d="M428 342 L428 430"/><path d="M472 342 L472 430"/><path d="M516 342 L516 430"/><path d="M560 342 L560 430"/><path d="M604 342 L604 430"/><path d="M648 342 L648 430"/><path d="M692 342 L692 430"/><path d="M736 342 L736 430"/><path d="M780 342 L780 430"/><path d="M824 342 L824 430"/><path d="M868 342 L868 430"/>
</g>
<rect x="104" y="434" width="780" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="b" x="104" y="494">一道束＝設計圖上一個像素，能量低到彼此不打擾</text>
<text class="c" x="48" y="530">不收束，就不互斥</text>
</svg>
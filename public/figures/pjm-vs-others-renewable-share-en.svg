<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="PJM's bar is very short, while the bars for the other grid regions are several times longer.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Wind and solar share: one country, two worlds</text>

<text class="t" x="60" y="178" font-size="20" font-weight="700" fill="var(--ink)">PJM</text>
<rect x="240" y="155" width="60" height="44" fill="var(--grey)"/>
<text class="t" x="316" y="186" font-size="19" font-weight="700" fill="var(--dim)">Single digits</text>

<text class="t" x="60" y="268" font-size="20" font-weight="700" fill="var(--ink)">MISO · SPP</text>
<rect x="240" y="245" width="400" height="44" fill="var(--accent)"/>
<text class="t" x="656" y="276" font-size="19" font-weight="700" fill="var(--accent)">Near 40%</text>

<text class="t" x="60" y="358" font-size="20" font-weight="700" fill="var(--ink)">ERCOT · West</text>
<rect x="240" y="335" width="400" height="44" fill="var(--accent)"/>
<text class="t" x="656" y="366" font-size="19" font-weight="700" fill="var(--accent)">Near 40%</text>

<line x1="240" y1="400" x2="240" y2="120" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="240" y="452" font-size="16" fill="var(--dim)">Such a gap isn't a technology problem</text>
<text class="t" x="240" y="478" font-size="16" fill="var(--dim)">It's transmission and the interconnection queue</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On a twenty-four-hour bar, two double-height blocks fall between 9 am and noon and between 2 pm and 6 pm.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="80" y="72" font-size="27" font-weight="700" fill="var(--ink)">Two stretches a day that burn twice as fast</text>

<line x1="80" y1="360" x2="900" y2="360" stroke="var(--line)" stroke-width="2"/>

<rect x="80" y="320" width="287" height="40" fill="var(--grey)"/>
<rect x="367" y="280" width="103" height="80" fill="var(--warn)"/>
<rect x="470" y="320" width="68" height="40" fill="var(--grey)"/>
<rect x="538" y="280" width="137" height="80" fill="var(--warn)"/>
<rect x="675" y="320" width="225" height="40" fill="var(--grey)"/>

<text x="418" y="262" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Double</text>
<text x="606" y="262" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Double</text>
<text x="223" y="348" font-size="16" fill="var(--page)" text-anchor="middle">Normal</text>
<text x="787" y="348" font-size="16" fill="var(--page)" text-anchor="middle">Normal</text>

<text x="80" y="392" font-size="16" fill="var(--dim)">0:00</text>
<text x="367" y="392" font-size="16" fill="var(--ink)" text-anchor="middle">9</text>
<text x="470" y="392" font-size="16" fill="var(--ink)" text-anchor="middle">12</text>
<text x="538" y="392" font-size="16" fill="var(--ink)" text-anchor="middle">14</text>
<text x="675" y="392" font-size="16" fill="var(--ink)" text-anchor="middle">18</text>
<text x="900" y="392" font-size="16" fill="var(--dim)" text-anchor="end">24:00</text>
<text x="900" y="418" font-size="16" fill="var(--dim)" text-anchor="end">Taipei time, Monday to Friday</text>

<text x="80" y="470" font-size="22" font-weight="700" fill="var(--ink)">Those two stretches are exactly office hours</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="成長率折線持續上升，但下方股價反應柱正負交錯">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="64" font-size="27" fill="var(--ink)">成長一路往上，股價正負交錯</text>

<rect x="60" y="96" width="840" height="180" fill="var(--card)" rx="10"/>
<text x="84" y="128" font-size="20" fill="var(--dim)">AWS 成長率</text>
<polyline points="180,240 330,228 480,200 630,176 790,140" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="180" cy="240" r="6" fill="var(--accent)"/>
<circle cx="330" cy="228" r="6" fill="var(--accent)"/>
<circle cx="480" cy="200" r="6" fill="var(--accent)"/>
<circle cx="630" cy="176" r="6" fill="var(--accent)"/>
<circle cx="790" cy="140" r="6" fill="var(--accent)"/>
<text x="152" y="226" font-size="16" fill="var(--ink)">17.5%</text>
<text x="310" y="214" font-size="16" fill="var(--ink)">20%</text>
<text x="460" y="186" font-size="16" fill="var(--ink)">24%</text>
<text x="610" y="162" font-size="16" fill="var(--ink)">28%</text>
<text x="770" y="126" font-size="16" fill="var(--ink)">37%</text>

<rect x="60" y="296" width="840" height="200" fill="var(--card)" rx="10"/>
<text x="84" y="328" font-size="20" fill="var(--dim)">隔日股價反應</text>
<line x1="120" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="156" y="400" width="48" height="56" fill="var(--warn)" rx="3"/>
<text x="156" y="478" font-size="16" fill="var(--ink)">-7%</text>
<rect x="306" y="296" width="48" height="104" fill="var(--accent)" rx="3"/>
<text x="306" y="290" font-size="16" fill="var(--ink)">+13%</text>
<rect x="456" y="400" width="48" height="80" fill="var(--warn)" rx="3"/>
<text x="456" y="500" font-size="16" fill="var(--ink)">-10%</text>
<rect x="606" y="384" width="48" height="16" fill="var(--grey)" rx="3"/>
<rect x="766" y="296" width="48" height="104" fill="var(--accent)" rx="3"/>
<text x="766" y="290" font-size="16" fill="var(--ink)">+15%</text>
<text x="150" y="358" font-size="15" fill="var(--dim)">花費跑在前面</text>
<text x="450" y="358" font-size="15" fill="var(--dim)">指引拉到 2,000 億</text>

<text x="60" y="556" font-size="22" fill="var(--ink)">市場在對的是成長除以花費，不是成長本身</text>
</g>
</svg>
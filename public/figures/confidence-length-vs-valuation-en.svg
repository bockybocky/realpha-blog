<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars of different length sit on the left, and the matching blocks on the right are tall and short the other way round.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">The one that sees further trades cheaper</text>
<text x="80" y="118" font-size="19" fill="var(--dim)">Visibility</text>
<text x="700" y="118" font-size="19" fill="var(--dim)">P/E</text>
<text x="80" y="196" font-size="19" fill="var(--ink)">Advanced nodes</text>
<rect x="220" y="170" width="420" height="40" rx="6" fill="var(--accent)" opacity="0.8"/>
<text x="652" y="198" font-size="16" fill="var(--dim)">To 2027, even 2029</text>
<rect x="700" y="196" width="120" height="50" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text x="760" y="228" font-size="19" fill="var(--ink)" text-anchor="middle">Low</text>
<text x="80" y="356" font-size="19" fill="var(--ink)">Mature nodes</text>
<rect x="220" y="330" width="150" height="40" rx="6" fill="var(--warn)" opacity="0.8"/>
<text x="382" y="358" font-size="16" fill="var(--dim)">At least to 1H next year</text>
<rect x="700" y="290" width="120" height="110" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="4"/>
<text x="760" y="352" font-size="19" fill="var(--warn)" text-anchor="middle">High</text>
<line x1="640" y1="190" x2="700" y2="214" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="370" y1="350" x2="700" y2="330" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="60" y="470" font-size="22" fill="var(--ink)">The market pays more for shorter visibility</text>
<text x="60" y="500" font-size="16" fill="var(--dim)">Both readings hold: overpaid elasticity, or pricing the leader's base and depreciation</text>
</svg>
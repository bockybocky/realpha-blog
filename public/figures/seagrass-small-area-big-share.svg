<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條等長軌道，填滿比例一條極小、兩條各約五分之一">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="80" y="60" font-size="27" fill="var(--ink)">海草：占得少，鎖得多</text>

  <text x="80" y="170" font-size="19" fill="var(--dim)">海床面積</text>
  <rect x="260" y="148" width="600" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="260" y="148" width="12" height="34" rx="2" fill="var(--accent)"/>
  <text x="290" y="172" font-size="19" fill="var(--accent)">2%</text>

  <text x="80" y="280" font-size="19" fill="var(--dim)">海洋碳儲量</text>
  <rect x="260" y="258" width="600" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="260" y="258" width="120" height="34" rx="6" fill="var(--accent)"/>
  <text x="396" y="282" font-size="19" fill="var(--accent)">20%</text>

  <text x="80" y="390" font-size="19" fill="var(--dim)">商業魚種棲地</text>
  <rect x="260" y="368" width="600" height="34" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="260" y="368" width="120" height="34" rx="6" fill="var(--accent)"/>
  <text x="396" y="392" font-size="19" fill="var(--accent)">約 20%</text>

  <text x="80" y="470" font-size="22" fill="var(--ink)">珊瑚搶走了注意力</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One source splits into three reports, which converge back into one information unit, forming one-to-three-to-one.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Three people speaking doesn’t mean three information units</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">Reports from one source still add up to one</text>
<circle cx="150" cy="290" r="56" fill="var(--accent)"/>
<text x="150" y="284" font-size="16" font-weight="700" fill="var(--page)" text-anchor="middle">One</text>
<text x="150" y="306" font-size="16" font-weight="700" fill="var(--page)" text-anchor="middle">Source</text>
<line x1="210" y1="276" x2="390" y2="190" stroke="var(--dim)" stroke-width="2"/>
<line x1="212" y1="290" x2="390" y2="290" stroke="var(--dim)" stroke-width="2"/>
<line x1="210" y1="304" x2="390" y2="390" stroke="var(--dim)" stroke-width="2"/>
<rect x="394" y="155" width="170" height="70" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="394" y="255" width="170" height="70" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="394" y="355" width="170" height="70" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="479" y="198" font-size="19" fill="var(--ink)" text-anchor="middle">Report 1</text>
<text x="479" y="298" font-size="19" fill="var(--ink)" text-anchor="middle">Report 2</text>
<text x="479" y="398" font-size="19" fill="var(--ink)" text-anchor="middle">Report 3</text>
<line x1="564" y1="190" x2="730" y2="276" stroke="var(--dim)" stroke-width="2"/>
<line x1="564" y1="290" x2="728" y2="290" stroke="var(--dim)" stroke-width="2"/>
<line x1="564" y1="390" x2="730" y2="304" stroke="var(--dim)" stroke-width="2"/>
<rect x="734" y="250" width="166" height="80" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="817" y="284" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">Information</text>
<text x="817" y="312" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">One unit</text>
<text x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">And you were about to decide as if there were three units</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條只填滿不到三分之一的長條，加一條往右下的斜線，表示打敗大盤的股票很少而且越來越少">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="80" y="56" font-size="27" font-weight="700" fill="var(--ink)">打敗大盤的大型股比例</text>

  <text x="80" y="146" font-size="19" fill="var(--dim)">近三年</text>
  <rect x="180" y="118" width="660" height="46" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="180" y="118" width="183" height="46" rx="6" fill="var(--accent)"/>
  <text x="378" y="148" font-size="19" font-weight="700" fill="var(--ink)">27.7%</text>

  <text x="80" y="234" font-size="19" fill="var(--dim)">近十年</text>
  <rect x="180" y="206" width="660" height="46" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="180" y="206" width="153" height="46" rx="6" fill="var(--accent)"/>
  <text x="348" y="236" font-size="19" font-weight="700" fill="var(--ink)">23.2%</text>

  <line x1="80" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="1"/>
  <text x="80" y="348" font-size="19" fill="var(--dim)">比率一路往下</text>
  <line x1="180" y1="386" x2="840" y2="452" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
  <line x1="160" y1="478" x2="860" y2="478" stroke="var(--line)" stroke-width="1"/>
  <text x="180" y="504" font-size="16" fill="var(--dim)">2002</text>
  <text x="800" y="504" font-size="16" fill="var(--dim)">2026</text>

  <text x="80" y="546" font-size="22" font-weight="700" fill="var(--ink)">多數股票輸給指數</text>
</svg>
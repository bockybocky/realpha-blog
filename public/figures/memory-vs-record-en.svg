<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two parallel timelines: the upper one has a sell point and stops, the lower one has no sell point and keeps going.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="60" y="56" font-size="27" fill="var(--ink)">One event, two versions</text>

  <text x="60" y="228" font-size="20" fill="var(--dim)">What I remember</text>
  <text x="60" y="388" font-size="20" fill="var(--accent)">What the record says</text>

  <line x1="200" y1="220" x2="700" y2="220" stroke="var(--grey)" stroke-width="3"/>
  <line x1="200" y1="380" x2="848" y2="380" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="860,380 844,372 844,388" fill="var(--accent)"/>

  <circle cx="280" cy="220" r="9" fill="var(--grey)"/>
  <circle cx="500" cy="220" r="9" fill="var(--grey)"/>
  <circle cx="700" cy="220" r="11" fill="var(--warn)"/>
  <text x="280" y="192" font-size="16" fill="var(--dim)" text-anchor="middle">Buy</text>
  <text x="500" y="192" font-size="16" fill="var(--dim)" text-anchor="middle">Stop-loss signal</text>
  <text x="700" y="188" font-size="19" fill="var(--warn)" text-anchor="middle">Sell</text>

  <circle cx="280" cy="380" r="9" fill="var(--accent)"/>
  <circle cx="500" cy="380" r="9" fill="var(--accent)"/>
  <text x="280" y="416" font-size="16" fill="var(--dim)" text-anchor="middle">Buy</text>
  <text x="500" y="416" font-size="16" fill="var(--dim)" text-anchor="middle">Stop-loss signal</text>
  <text x="790" y="416" font-size="19" fill="var(--accent)" text-anchor="middle">Still held</text>

  <line x1="700" y1="236" x2="700" y2="364" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="714" y="306" font-size="19" fill="var(--warn)">Gap</text>
</svg>
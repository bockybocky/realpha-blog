<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bars: the geocentric model is taller and marked as chosen, while the heliocentric model is shorter but labeled as the right model, showing that judging only by accuracy at the time picks the wrong one.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="48" y="56" class="t">Accuracy only?</text>
<line x1="200" y1="140" x2="200" y2="430" stroke="var(--grey)" stroke-width="2"/>
<line x1="200" y1="430" x2="760" y2="430" stroke="var(--grey)" stroke-width="2"/>
<text x="210" y="132" class="d">Accuracy then</text>
<text x="340" y="108" class="d" text-anchor="middle">Accuracy-chaser</text>
<rect x="285" y="120" width="110" height="34" rx="17" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text x="340" y="143" class="b" text-anchor="middle" style="fill:var(--warn)">Won</text>
<rect x="270" y="170" width="140" height="260" rx="4" fill="var(--grey)"/>
<rect x="565" y="214" width="110" height="34" rx="17" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="620" y="237" class="b" text-anchor="middle" style="fill:var(--accent)">Right</text>
<rect x="550" y="262" width="140" height="168" rx="4" fill="var(--accent)"/>
<text x="340" y="464" class="g" text-anchor="middle">Geo.</text>
<text x="340" y="490" class="d" text-anchor="middle">Polished</text>
<text x="620" y="464" class="g" text-anchor="middle">Sun</text>
<text x="620" y="490" class="d" text-anchor="middle">Fresh</text>
<text x="480" y="536" class="c" text-anchor="middle">Fit ≠ truth</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="An agent's closed four-stop loop, where every stop burns CPU.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">One prompt, many laps</text>

  <circle cx="480" cy="300" r="150" fill="none" stroke="var(--line)" stroke-width="3"/>

  <rect x="380" y="118" width="200" height="64" fill="var(--card)" stroke="var(--accent)" stroke-width="2" rx="8"/>
  <text class="g" x="480" y="158" text-anchor="middle">Reason</text>

  <rect x="660" y="268" width="200" height="64" fill="var(--card)" stroke="var(--accent)" stroke-width="2" rx="8"/>
  <text class="g" x="760" y="308" text-anchor="middle">Act</text>

  <rect x="380" y="418" width="200" height="64" fill="var(--card)" stroke="var(--accent)" stroke-width="2" rx="8"/>
  <text class="g" x="480" y="458" text-anchor="middle">Check</text>

  <rect x="100" y="268" width="200" height="64" fill="var(--card)" stroke="var(--accent)" stroke-width="2" rx="8"/>
  <text class="g" x="200" y="308" text-anchor="middle">Rethink</text>

  <path d="M600 190 L640 250" stroke="var(--accent)" stroke-width="3"/>
  <path d="M740 350 L600 420" stroke="var(--accent)" stroke-width="3"/>
  <path d="M360 430 L230 350" stroke="var(--accent)" stroke-width="3"/>
  <path d="M230 250 L370 180" stroke="var(--accent)" stroke-width="3"/>

  <text class="b" x="480" y="292" text-anchor="middle">Every lap</text>
  <text class="b" x="480" y="322" text-anchor="middle">burns CPU</text>

  <text class="c" x="60" y="530">So the bill lands on CPU, not just GPU</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two rulers of very different lengths: the upper spans three years in three sections, the lower covers only a short stretch at the far left">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="56" font-size="27" fill="var(--ink)">Same time, two rulers</text>

<text x="120" y="140" font-size="20" fill="var(--dim)">The successor's clock</text>
<rect x="140" y="160" width="720" height="72" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<line x1="380" y1="160" x2="380" y2="232" stroke="var(--line)" stroke-width="2"/>
<line x1="620" y1="160" x2="620" y2="232" stroke="var(--line)" stroke-width="2"/>
<text x="260" y="204" font-size="19" fill="var(--ink)" text-anchor="middle">Deliberately boring</text>
<text x="500" y="204" font-size="19" fill="var(--ink)" text-anchor="middle">His own product</text>
<text x="740" y="204" font-size="19" fill="var(--ink)" text-anchor="middle">Fireworks</text>
<text x="260" y="262" font-size="16" fill="var(--dim)" text-anchor="middle">Year 1</text>
<text x="500" y="262" font-size="16" fill="var(--dim)" text-anchor="middle">Year 2</text>
<text x="740" y="262" font-size="16" fill="var(--dim)" text-anchor="middle">Year 3</text>

<text x="120" y="342" font-size="20" fill="var(--dim)">The watcher's ruler</text>
<rect x="140" y="362" width="60" height="72" rx="8" fill="var(--warn)" opacity="0.25"/>
<rect x="140" y="362" width="60" height="72" rx="8" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text x="216" y="406" font-size="19" fill="var(--warn)">Graded at three months</text>
<line x1="200" y1="398" x2="850" y2="398" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 8"/>

<text x="60" y="492" font-size="22" fill="var(--accent)">Not the judgment, the ruler</text>
</g>
</svg>
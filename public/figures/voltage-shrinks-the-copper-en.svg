<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A very large conductor cross-section almost filling its frame beside a small one carrying the same power.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--dim); font-weight:700; }
    .ga { font-size:20px; fill:var(--accent); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="480" y="56" text-anchor="middle">Same power, different voltage</text>
  <text class="s" x="480" y="92" text-anchor="middle">Conductor cross-section</text>

  <rect x="140" y="160" width="280" height="280" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="280" cy="300" r="110" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
  <text class="g" x="280" y="146" text-anchor="middle">54V</text>
  <text class="s" x="280" y="306" text-anchor="middle">About 6,000 amps</text>
  <text class="s" x="140" y="472">Space eaten inside the rack</text>

  <rect x="663" y="263" width="74" height="74" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="700" cy="300" r="29" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="ga" x="700" y="146" text-anchor="middle">800V</text>
  <text class="s" x="700" y="372" text-anchor="middle">About 400 amps</text>
  <text class="s" x="700" y="472" text-anchor="middle">Left for compute and cooling</text>

  <text class="c" x="480" y="512" text-anchor="middle">Raise the voltage and there is less to change</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="成長率四柱全向上，下方股價箭頭全向下">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">需求全部加速，股價全部往下</text>
<rect x="60" y="92" width="840" height="400" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="120" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="305" width="110" height="115" fill="var(--accent)"/>
<rect x="340" y="180" width="110" height="240" fill="var(--accent)"/>
<rect x="530" y="324" width="110" height="96" fill="var(--accent)"/>
<rect x="720" y="348" width="110" height="72" fill="var(--accent)"/>
<text x="168" y="292" font-size="19" fill="var(--accent)">48%</text>
<text x="340" y="166" font-size="19" fill="var(--accent)">一百%以上</text>
<text x="552" y="310" font-size="19" fill="var(--accent)">四成</text>
<text x="742" y="334" font-size="19" fill="var(--accent)">三成</text>
<text x="170" y="444" font-size="16" fill="var(--ink)">Azure</text>
<text x="334" y="444" font-size="16" fill="var(--ink)">Google Cloud</text>
<text x="548" y="444" font-size="16" fill="var(--ink)">AWS</text>
<text x="726" y="444" font-size="16" fill="var(--ink)">Meta 廣告</text>
<text x="80" y="478" font-size="16" fill="var(--warn)">股價</text>
<g stroke="var(--warn)" stroke-width="5" fill="none">
<line x1="205" y1="456" x2="205" y2="482"/><polyline points="195,474 205,484 215,474"/>
<line x1="395" y1="456" x2="395" y2="482"/><polyline points="385,474 395,484 405,474"/>
<line x1="585" y1="456" x2="585" y2="482"/><polyline points="575,474 585,484 595,474"/>
<line x1="775" y1="456" x2="775" y2="482"/><polyline points="765,474 775,484 785,474"/>
</g>
<text x="60" y="534" font-size="22" fill="var(--ink)">分析對了，回饋沒來</text>
</svg>
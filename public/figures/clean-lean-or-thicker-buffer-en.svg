<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On an undulating cycle curve, both leaning against the wind and cleaning up afterwards are crossed out, and the effort is redirected to a thickened buffer band along the bottom.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Cycles always come; the question is where the effort goes</text>

<path d="M80 280 C 180 150, 280 150, 380 280 C 480 410, 580 410, 680 280 C 760 175, 840 175, 900 230" fill="none" stroke="var(--grey)" stroke-width="5"/>

<circle cx="230" cy="186" r="10" fill="var(--warn)"/>
<text x="230" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">Lean beforehand</text>
<text x="230" y="124" font-size="16" text-anchor="middle" fill="var(--dim)">A fool's errand</text>
<path d="M208 196 L252 240 M252 196 L208 240" stroke="var(--warn)" stroke-width="5"/>

<circle cx="530" cy="374" r="10" fill="var(--warn)"/>
<text x="530" y="440" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">Clean up afterwards</text>
<path d="M508 352 L552 396 M552 352 L508 396" stroke="var(--warn)" stroke-width="5"/>

<rect x="80" y="470" width="820" height="40" rx="8" fill="var(--accent)" opacity="0.18"/>
<rect x="80" y="470" width="820" height="40" rx="8" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="100" y="496" font-size="20" font-weight="700" fill="var(--accent)">Buffers: balance sheets, income, resilience conditions</text>

<path d="M760 300 L760 455" stroke="var(--accent)" stroke-width="5"/>
<path d="M748 440 L760 462 L772 440" fill="var(--accent)"/>
<text x="786" y="360" font-size="20" font-weight="700" fill="var(--accent)">Effort moves here</text>

<text x="60" y="540" font-size="22" font-weight="700" fill="var(--ink)">Third path = thicken the cushion at the start</text>
</svg>
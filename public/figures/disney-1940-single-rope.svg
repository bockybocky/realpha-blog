<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="四條線從左側四個賭注收斂到中央同一個節點長片票房，節點被一道斜線切斷">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t{font-size:27px;fill:var(--ink);font-weight:700}
    .g{font-size:19px;fill:var(--dim)}
    .n{font-size:16px;fill:var(--ink)}
    .w{font-size:19px;fill:var(--warn)}
    .c{font-size:22px;fill:var(--ink);font-weight:700}
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="50">1940 年那五個賭注</text>
  <rect x="60" y="88" width="840" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <rect x="100" y="143" width="10" height="10" fill="var(--accent)"/>
  <text class="n" x="122" y="153">三部長片</text>
  <rect x="100" y="208" width="10" height="10" fill="var(--accent)"/>
  <text class="n" x="122" y="218">新園區</text>
  <rect x="100" y="273" width="10" height="10" fill="var(--accent)"/>
  <text class="n" x="122" y="283">銀行貸款</text>
  <rect x="100" y="338" width="10" height="10" fill="var(--accent)"/>
  <text class="n" x="122" y="348">賣三成股權</text>

  <path d="M270,148 C 400,148 480,196 582,240" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M270,213 C 400,213 490,228 582,246" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M270,278 C 400,278 490,266 582,252" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M270,343 C 400,343 480,296 582,258" fill="none" stroke="var(--accent)" stroke-width="3"/>

  <circle cx="630" cy="248" r="48" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="n" x="630" y="243" text-anchor="middle">長片</text>
  <text class="n" x="630" y="266" text-anchor="middle">票房</text>

  <line x1="592" y1="196" x2="668" y2="300" stroke="var(--warn)" stroke-width="6"/>
  <text class="w" x="630" y="172" text-anchor="middle">歐洲票房歸零</text>

  <text class="c" x="60" y="472">看起來分散，其實共用同一根繩</text>
</svg>
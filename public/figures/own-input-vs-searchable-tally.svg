<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="五張理由卡片，四張灰色標查，只有一張藍色標親。">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:20px;font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700}
    .a{fill:var(--accent)}
    .w{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">一個決定的五條理由</text>
<text class="b" x="60" y="98">示意例子</text>
<rect x="80" y="140" width="150" height="190" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="155" cy="222" r="46" fill="var(--grey)"/>
<text class="c" x="155" y="236" text-anchor="middle" style="font-size:40px">查</text>
<text class="b" x="155" y="306" text-anchor="middle">查得到</text>
<rect x="250" y="140" width="150" height="190" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="325" cy="222" r="46" fill="var(--grey)"/>
<text class="c" x="325" y="236" text-anchor="middle" style="font-size:40px">查</text>
<text class="b" x="325" y="306" text-anchor="middle">查得到</text>
<rect x="420" y="140" width="150" height="190" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="495" cy="222" r="46" fill="var(--accent)"/>
<text class="c" x="495" y="236" text-anchor="middle" style="font-size:40px;fill:var(--page)">親</text>
<text class="b a" x="495" y="306" text-anchor="middle">親眼看到</text>
<rect x="590" y="140" width="150" height="190" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="665" cy="222" r="46" fill="var(--grey)"/>
<text class="c" x="665" y="236" text-anchor="middle" style="font-size:40px">查</text>
<text class="b" x="665" y="306" text-anchor="middle">查得到</text>
<rect x="760" y="140" width="150" height="190" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="835" cy="222" r="46" fill="var(--grey)"/>
<text class="c" x="835" y="236" text-anchor="middle" style="font-size:40px">查</text>
<text class="b" x="835" y="306" text-anchor="middle">查得到</text>
<text class="c" x="480" y="410" text-anchor="middle"><tspan class="a">親 1 條</tspan><tspan style="fill:var(--dim)">　・　查 4 條</tspan></text>
<text class="b" x="480" y="450" text-anchor="middle">查得到的交給 AI 驗算</text>
</svg>
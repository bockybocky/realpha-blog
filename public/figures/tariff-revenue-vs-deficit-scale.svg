<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上下兩條橫條，上面那條長度是下面那條的九倍左右">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:19px;fill:var(--ink)}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">收入是千億級，缺口是兆級</text>
<text class="g" x="140" y="172">累積赤字　1.8 兆美元</text>
<rect x="140" y="188" width="700" height="72" fill="var(--grey)"/>
<text class="g" x="140" y="332">關稅增收　約 0.2 兆美元</text>
<rect x="140" y="348" width="78" height="72" fill="var(--accent)"/>
<rect x="218" y="348" width="622" height="72" fill="var(--card)" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="s" x="529" y="392" text-anchor="middle">補不到的部分</text>
<text class="c" x="60" y="478">稅率加得上去，量級差了一位數</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="較貴但零預付的報價被選中">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">兩個報價，他選了貴的</text>

<line x1="140" y1="420" x2="760" y2="420" stroke="var(--line)" stroke-width="2"/>

<rect x="200" y="256" width="150" height="164" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<text x="212" y="232" font-size="20" fill="var(--grey)">$4.40 / 小時</text>
<text x="212" y="454" font-size="16" fill="var(--grey)">三年約</text>
<text x="212" y="480" font-size="16" fill="var(--grey)">先付三成</text>
<line x1="208" y1="412" x2="342" y2="264" stroke="var(--grey)" stroke-width="4"/>

<rect x="520" y="212" width="150" height="208" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="4"/>
<text x="524" y="188" font-size="20" fill="var(--accent)">$5 中高段</text>
<text x="532" y="454" font-size="16" fill="var(--accent)">零預付</text>
<text x="532" y="480" font-size="16" fill="var(--accent)">買方選這個</text>

<line x1="690" y1="300" x2="774" y2="300" stroke="var(--accent)" stroke-width="3"/>
<polygon points="774,290 798,300 774,310" fill="var(--accent)"/>
<text x="806" y="292" font-size="19" fill="var(--ink)">現金</text>
<text x="806" y="320" font-size="19" fill="var(--ink)">留在手上</text>
</svg>
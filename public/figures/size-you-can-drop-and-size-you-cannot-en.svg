<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left, a small block rests on an intact floor; on the right, a very large block presses on the same floor and the floor cracks open.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">Droppable, or not</text>
<rect x="100" y="326" width="72" height="72" rx="8" fill="var(--accent)"/>
<text class="g" x="90" y="296" fill="var(--accent)">Tiny</text>
<text class="b" x="78" y="454">Try, learn, fail</text>
<line x1="56" y1="398" x2="420" y2="398" stroke="var(--grey)" stroke-width="5"/>
<rect x="560" y="156" width="330" height="242" rx="10" fill="var(--warn)"/>
<text class="g" x="560" y="130" fill="var(--warn)">Big base</text>
<path d="M 540 398 L 640 398 L 668 428 L 700 392 L 740 430 L 776 394 L 812 428 L 844 396 L 940 398" fill="none" stroke="var(--warn)" stroke-width="5"/>
<text class="b" x="560" y="454">Systemic before basket is set</text>
<text class="c" x="60" y="510">Permissionless means failing small</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條一整天的時間帶對照：上面一條被中檔填滿、高檔只剩最右邊一小塊；下面一條先切出高檔與低檔區塊，中檔填在尾端。">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="52" font-size="27" fill="var(--ink)">一天怎麼排</text>

<text x="60" y="142" font-size="19" fill="var(--dim)">多數人</text>
<rect x="180" y="155" width="600" height="56" fill="var(--grey)"/>
<rect x="780" y="155" width="120" height="56" fill="var(--accent)"/>
<text x="840" y="145" font-size="15" fill="var(--dim)" text-anchor="middle">晚上九點</text>
<text x="840" y="238" font-size="15" fill="var(--warn)" text-anchor="middle">只剩渣</text>

<text x="60" y="312" font-size="19" fill="var(--accent)">先排高檔與低檔</text>
<rect x="180" y="325" width="180" height="56" fill="var(--accent)"/>
<rect x="360" y="325" width="90" height="56" fill="var(--card)" stroke="var(--line)"/>
<rect x="450" y="325" width="150" height="56" fill="var(--accent)"/>
<rect x="600" y="325" width="80" height="56" fill="var(--card)" stroke="var(--line)"/>
<rect x="680" y="325" width="220" height="56" fill="var(--grey)"/>

<rect x="180" y="418" width="22" height="18" fill="var(--accent)"/>
<text x="212" y="433" font-size="16" fill="var(--dim)">高檔</text>
<rect x="330" y="418" width="22" height="18" fill="var(--card)" stroke="var(--line)"/>
<text x="362" y="433" font-size="16" fill="var(--dim)">低檔</text>
<rect x="470" y="418" width="22" height="18" fill="var(--grey)"/>
<text x="502" y="433" font-size="16" fill="var(--dim)">中檔</text>

<text x="180" y="478" font-size="15" fill="var(--dim)">早上八點</text>
<text x="900" y="478" font-size="15" fill="var(--dim)" text-anchor="end">晚上十一點</text>

<text x="480" y="525" font-size="22" fill="var(--ink)" text-anchor="middle">先填的是中檔，高檔撿剩下的</text>
</svg>
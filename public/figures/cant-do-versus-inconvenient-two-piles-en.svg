<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three cards sort into two buckets, and one week later the right bucket has one card fewer, leaving a dashed empty slot.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">Two piles, then look again a week later</text>
<rect x="60" y="150" width="130" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="60" y="232" width="130" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="60" y="314" width="130" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="125" y="186" text-anchor="middle" font-size="16" fill="var(--ink)">Someone asks</text>
<text x="125" y="268" text-anchor="middle" font-size="16" fill="var(--ink)">Someone asks</text>
<text x="125" y="350" text-anchor="middle" font-size="16" fill="var(--ink)">Someone asks</text>
<path d="M200 178 L330 215" stroke="var(--ink)" stroke-width="2"/>
<path d="M200 260 L330 290" stroke="var(--ink)" stroke-width="2"/>
<path d="M200 342 L330 330" stroke="var(--ink)" stroke-width="2"/>
<rect x="340" y="180" width="190" height="80" rx="6" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
<text x="435" y="228" text-anchor="middle" font-size="19" fill="var(--ink)">He can't</text>
<rect x="340" y="296" width="190" height="110" rx="6" fill="var(--warn)" fill-opacity="0.16" stroke="var(--warn)" stroke-width="2"/>
<text x="435" y="340" text-anchor="middle" font-size="19" fill="var(--ink)">Inconvenient now</text>
<text x="435" y="372" text-anchor="middle" font-size="16" fill="var(--dim)">Two</text>
<path d="M560 290 L660 290" stroke="var(--ink)" stroke-width="2"/>
<path d="M660 290 l-14 -7 l0 14 z" fill="var(--ink)"/>
<text x="610" y="272" text-anchor="middle" font-size="16" fill="var(--dim)">A week later</text>
<rect x="690" y="180" width="190" height="80" rx="6" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
<text x="785" y="228" text-anchor="middle" font-size="19" fill="var(--ink)">Still here</text>
<rect x="690" y="296" width="190" height="110" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="9 7"/>
<text x="785" y="344" text-anchor="middle" font-size="19" fill="var(--dim)">One gone</text>
<text x="785" y="374" text-anchor="middle" font-size="16" fill="var(--dim)">They installed the app</text>
<text x="480" y="480" text-anchor="middle" font-size="22" fill="var(--ink)">Inconvenience fades; can't may not</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩張錯開、互不重疊的表，中間一道空隙，表示準備的理由與對方在意的事不在同一張表上">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">兩張表，對不上</text>

  <rect x="60" y="110" width="360" height="300" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="84" y="152" font-size="20" font-weight="700" fill="var(--accent)">他準備的那張</text>
  <line x1="84" y1="170" x2="396" y2="170" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="84" y="214" font-size="16" fill="var(--ink)">資料中心替居民付財產稅</text>
  <line x1="84" y1="238" x2="396" y2="238" stroke="var(--line)" stroke-width="1"/>
  <text class="t" x="84" y="278" font-size="16" fill="var(--ink)">稅率連十年下降</text>
  <line x1="84" y1="302" x2="396" y2="302" stroke="var(--line)" stroke-width="1"/>
  <text class="t" x="84" y="342" font-size="16" fill="var(--ink)">房子多值兩萬美元</text>
  <line x1="84" y1="366" x2="396" y2="366" stroke="var(--line)" stroke-width="1"/>

  <rect x="540" y="180" width="360" height="300" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="564" y="222" font-size="20" font-weight="700" fill="var(--warn)">台下在意的那張</text>
  <line x1="564" y1="240" x2="876" y2="240" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="564" y="284" font-size="16" fill="var(--ink)">我會不會得癌症</text>
  <line x1="564" y1="308" x2="876" y2="308" stroke="var(--line)" stroke-width="1"/>
  <text class="t" x="564" y="348" font-size="16" fill="var(--ink)">水</text>
  <line x1="564" y1="372" x2="876" y2="372" stroke="var(--line)" stroke-width="1"/>
  <text class="t" x="564" y="412" font-size="16" fill="var(--ink)">我這一帶的鄉下樣子</text>
  <line x1="564" y1="436" x2="876" y2="436" stroke="var(--line)" stroke-width="1"/>

  <line x1="430" y1="300" x2="528" y2="300" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>

  <text class="t" x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">先問他在意哪一件，再拿出你的表</text>
</svg>
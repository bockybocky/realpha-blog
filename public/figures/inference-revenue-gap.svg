<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="三根直條由矮到高，最右邊要做到的營收遠高於看得到的營收，中間標出差距">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="50" text-anchor="middle">15 GW 推論要撐起多少營收</text>
<text class="b" x="40" y="95">億美元</text>
<g stroke="var(--line)" stroke-width="1">
<line x1="100" y1="386.7" x2="920" y2="386.7"/><line x1="100" y1="253.3" x2="920" y2="253.3"/><line x1="100" y1="120" x2="920" y2="120"/>
</g>
<line x1="100" y1="520" x2="920" y2="520" stroke="var(--dim)" stroke-width="2"/>
<text class="b" x="88" y="525" text-anchor="end">0</text>
<text class="b" x="88" y="392" text-anchor="end">5,000</text>
<text class="b" x="88" y="259" text-anchor="end">10,000</text>
<text class="b" x="88" y="126" text-anchor="end">15,000</text>
<rect x="180" y="480" width="120" height="40" fill="var(--grey)"/>
<rect x="180" y="466.7" width="120" height="13.3" fill="var(--grey)" opacity="0.45"/>
<text x="240" y="455" text-anchor="middle" style="font-size:16px">1,500–2,000</text>
<rect x="420" y="413.3" width="120" height="106.7" fill="var(--grey)"/>
<rect x="420" y="386.7" width="120" height="26.6" fill="var(--grey)" opacity="0.45"/>
<text x="480" y="375" text-anchor="middle" style="font-size:16px">4,000–5,000</text>
<rect x="660" y="320" width="120" height="200" fill="var(--accent)"/>
<rect x="660" y="120" width="120" height="200" fill="var(--accent)" opacity="0.35"/>
<text x="720" y="108" text-anchor="middle" style="font-size:16px;font-weight:700">7,500–15,000</text>
<text class="b" x="795" y="326">每 GW 500 億</text>
<text class="b" x="795" y="140">每 GW 1,000 億</text>
<line x1="540" y1="386.7" x2="660" y2="386.7" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="615" y1="386.7" x2="615" y2="320" stroke="var(--warn)" stroke-width="3"/>
<line x1="605" y1="320" x2="625" y2="320" stroke="var(--warn)" stroke-width="3"/>
<line x1="605" y1="386.7" x2="625" y2="386.7" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="600" y="360" text-anchor="end" fill="var(--warn)">差距</text>
<text class="g" x="240" y="552" text-anchor="middle">2026 兩家</text>
<text class="g" x="480" y="552" text-anchor="middle">2027 看得到</text>
<text class="g" x="720" y="552" text-anchor="middle">2027 要做到</text>
<text class="b" x="240" y="580" text-anchor="middle">多數人估</text>
<text class="b" x="480" y="580" text-anchor="middle">主持人估</text>
<text class="b" x="720" y="580" text-anchor="middle">15 GW 推論</text>
</svg>
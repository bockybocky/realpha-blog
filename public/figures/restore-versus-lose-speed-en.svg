<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A long arrow contrasted with a stub of an arrow that is almost invisible.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <text x="80" y="60" font-size="27" fill="var(--ink)">The two rates are not in the same league</text>

  <text x="80" y="170" font-size="20" fill="var(--warn)">Lost</text>
  <line x1="200" y1="200" x2="870" y2="200" stroke="var(--warn)" stroke-width="18" marker-end="url(#aw)"/>

  <text x="80" y="330" font-size="20" fill="var(--accent)">Restored</text>
  <line x1="200" y1="360" x2="207" y2="360" stroke="var(--accent)" stroke-width="18" marker-end="url(#aa)"/>
  <line x1="215" y1="360" x2="470" y2="360" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="490" y="366" font-size="19" fill="var(--dim)">About 1/100 to 1/1000 of the above</text>

  <text x="80" y="470" font-size="22" fill="var(--ink)">Effort won't close the gap; unit cost will</text>
</svg>
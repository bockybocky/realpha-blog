<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三層同心圓逐層擴大，競爭範圍從串流同業擴到所有晚上的時間用法">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" fill="var(--ink)">比的場地換了，分母跟著換</text>
<circle cx="420" cy="300" r="200" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="420" cy="300" r="134" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<circle cx="420" cy="300" r="66" fill="var(--accent)"/>
<text x="378" y="296" font-size="19" fill="var(--page)">Netflix</text>
<text x="368" y="322" font-size="16" fill="var(--page)">贏得了</text>

<text x="330" y="190" font-size="19" fill="var(--ink)">串流同業</text>
<text x="330" y="214" font-size="16" fill="var(--dim)">Disney、Paramount</text>

<text x="300" y="128" font-size="19" fill="var(--warn)">所有晚上的時間</text>
<text x="300" y="152" font-size="16" fill="var(--dim)">TikTok、Instagram、YouTube、看書、匹克球</text>

<line x1="700" y1="300" x2="760" y2="300" stroke="var(--grey)" stroke-width="3"/>
<text x="700" y="268" font-size="20" fill="var(--dim)">時間花費</text>
<text x="700" y="340" font-size="16" fill="var(--dim)">所以這個指標</text>
<text x="700" y="362" font-size="16" fill="var(--dim)">不再談</text>
<text x="60" y="520" font-size="22" fill="var(--ink)">注意力不簽約，走的時候財報一個數字都不動</text>
</svg>
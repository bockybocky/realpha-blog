<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The route splits: one branch ends midway, while the other reaches the finish after plunging into a deep valley and climbing back up.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="64" font-size="27" fill="var(--ink)">Two Ways to Die Betting on a Roadmap</text>

<circle cx="140" cy="280" r="10" fill="var(--ink)"/>
<text x="110" y="326" font-size="19" fill="var(--dim)">Buy In</text>
<line x1="150" y1="280" x2="330" y2="280" stroke="var(--ink)" stroke-width="4"/>
<circle cx="330" cy="280" r="9" fill="var(--ink)"/>
<text x="330" y="252" font-size="19" fill="var(--ink)" text-anchor="middle">Branch</text>

<path d="M330 280 L520 160 L600 160" fill="none" stroke="var(--warn)" stroke-width="4"/>
<line x1="604" y1="134" x2="648" y2="186" stroke="var(--warn)" stroke-width="5"/>
<line x1="648" y1="134" x2="604" y2="186" stroke="var(--warn)" stroke-width="5"/>
<text x="676" y="166" font-size="20" fill="var(--warn)">Wrong Bet: Zero</text>

<path d="M330 280 C420 300 460 430 540 430 C620 430 680 340 820 300" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="820" cy="300" r="10" fill="var(--accent)"/>
<text x="824" y="272" font-size="20" fill="var(--accent)">Right Bet</text>
<line x1="540" y1="300" x2="540" y2="430" stroke="var(--dim)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="540" y="470" font-size="19" fill="var(--dim)" text-anchor="middle">Cut Short</text>
</svg>
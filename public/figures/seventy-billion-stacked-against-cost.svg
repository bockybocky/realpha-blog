<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="疊起來的授權金高柱與幾乎貼在地面的成本矮條，高度相差近三十倍">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="80" y="68">一次付完的成本，三十年收的錢</text>
<line x1="80" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="200" y="370" width="160" height="100" fill="var(--grey)"/>
<rect x="200" y="345" width="160" height="25" fill="var(--accent)" opacity="0.45"/>
<rect x="200" y="290" width="160" height="55" fill="var(--accent)" opacity="0.6"/>
<rect x="200" y="265" width="160" height="25" fill="var(--accent)" opacity="0.75"/>
<rect x="200" y="120" width="160" height="145" fill="var(--accent)"/>
<text class="b" x="378" y="428">首播廣告利潤 20 億</text>
<text class="b" x="378" y="364">地方電台 5 億</text>
<text class="b" x="378" y="322">有線與國際 11 億</text>
<text class="b" x="378" y="284">DVD 5 億</text>
<text class="b" x="378" y="200">串流與續約 29 億</text>
<text class="g" x="200" y="100">共七十幾億</text>
<rect x="760" y="457" width="120" height="13" fill="var(--warn)"/>
<text class="g" x="760" y="438" fill="var(--warn)">成本 2.5 億</text>
<text class="b" x="760" y="500">1998 年付完</text>
<text class="c" x="80" y="534">成本有終點，殘值沒有</text>
</svg>
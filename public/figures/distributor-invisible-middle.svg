<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="多家供應商的貨流收束進中間一個窄節點再扇出，右側規格書框裡該節點的位置是空的" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <text x="60" y="56" font-size="27" fill="var(--ink)">貨都經過它，帳上看不見它</text>

  <rect x="60" y="110" width="150" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="76" y="140" font-size="15" fill="var(--ink)">晶片公司</text>
  <text x="76" y="160" font-size="15" fill="var(--dim)">74% 走通路</text>

  <rect x="240" y="110" width="150" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="256" y="140" font-size="15" fill="var(--ink)">視覺晶片公司</text>
  <text x="256" y="160" font-size="15" fill="var(--dim)">六到七成</text>

  <rect x="420" y="110" width="150" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="436" y="146" font-size="15" fill="var(--ink)">連續波雷射</text>

  <line x1="135" y1="170" x2="300" y2="250" stroke="var(--accent)" stroke-width="5"/>
  <line x1="315" y1="170" x2="310" y2="250" stroke="var(--accent)" stroke-width="5"/>
  <line x1="495" y1="170" x2="325" y2="250" stroke="var(--accent)" stroke-width="5"/>

  <rect x="230" y="252" width="170" height="56" rx="8" fill="var(--accent)"/>
  <text x="252" y="288" font-size="20" fill="var(--page)">通路商</text>

  <line x1="280" y1="308" x2="180" y2="380" stroke="var(--grey)" stroke-width="4"/>
  <line x1="315" y1="308" x2="315" y2="380" stroke="var(--grey)" stroke-width="4"/>
  <line x1="350" y1="308" x2="450" y2="380" stroke="var(--grey)" stroke-width="4"/>
  <text x="130" y="408" font-size="16" fill="var(--dim)">客戶</text>
  <text x="296" y="408" font-size="16" fill="var(--dim)">客戶</text>
  <text x="432" y="408" font-size="16" fill="var(--dim)">客戶</text>

  <rect x="620" y="110" width="280" height="298" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="640" y="146" font-size="19" fill="var(--ink)">產品規格書</text>
  <line x1="640" y1="178" x2="860" y2="178" stroke="var(--line)" stroke-width="3"/>
  <line x1="640" y1="208" x2="800" y2="208" stroke="var(--line)" stroke-width="3"/>
  <line x1="640" y1="238" x2="860" y2="238" stroke="var(--line)" stroke-width="3"/>
  <rect x="640" y="266" width="220" height="48" rx="6" fill="none" stroke="var(--warn)" stroke-dasharray="6 5"/>
  <text x="656" y="296" font-size="16" fill="var(--warn)">這裡沒有它的名字</text>
  <line x1="640" y1="344" x2="820" y2="344" stroke="var(--line)" stroke-width="3"/>
  <line x1="640" y1="374" x2="860" y2="374" stroke="var(--line)" stroke-width="3"/>

  <text x="60" y="490" font-size="22" fill="var(--ink)">單價從 4 美元變 50 美元，價差落在誰的帳上。</text>
</svg>
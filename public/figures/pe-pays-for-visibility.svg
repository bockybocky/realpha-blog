<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條長條分成四段，只有第一段填實，其餘是虛線空格">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">本益比三到四倍，在給什麼定價</text>
<text x="120" y="212" font-size="19" text-anchor="end" fill="var(--ink)">獲利</text>
<rect x="140" y="170" width="190" height="70" rx="6" fill="var(--accent)"/>
<rect x="330" y="170" width="190" height="70" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="520" y="170" width="190" height="70" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="710" y="170" width="190" height="70" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="235" y="272" font-size="16" text-anchor="middle" fill="var(--ink)">今年</text>
<text x="425" y="272" font-size="16" text-anchor="middle" fill="var(--dim)">明年</text>
<text x="615" y="272" font-size="16" text-anchor="middle" fill="var(--dim)">後年</text>
<text x="805" y="272" font-size="16" text-anchor="middle" fill="var(--dim)">再後年</text>
<line x1="140" y1="312" x2="330" y2="312" stroke="var(--accent)" stroke-width="3"/>
<text x="235" y="340" font-size="16" text-anchor="middle" fill="var(--accent)">市場只付這一段</text>
<text x="900" y="340" font-size="16" text-anchor="end" fill="var(--dim)">看不到 → 不給錢</text>
<rect x="60" y="384" width="840" height="76" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="431" font-size="22" text-anchor="middle" fill="var(--ink)">定價的是能見度，不是獲利</text>
</svg>
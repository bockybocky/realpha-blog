<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="二十根長條裡十九根貼地為零，只有一根高達六十倍，單一贏家撐起整檔基金的報酬">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; fill:var(--ink); font-weight:700; }
    .group { font-size:19px; fill:var(--dim); }
    .body  { font-size:15px; fill:var(--dim); }
    .accentlab { font-size:20px; fill:var(--accent); font-weight:700; }
    .concl { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text class="title" x="80" y="52">命中率 5%，整檔基金 ×3</text>

  <line x1="88" y1="100" x2="88" y2="470" stroke="var(--line)" stroke-width="2"/>
  <line x1="88" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text class="body" x="76" y="116" text-anchor="end">60</text>
  <text class="body" x="76" y="476" text-anchor="end">0</text>
  <text class="body" x="40" y="90">回收</text>

  <line x1="100" y1="464" x2="884" y2="464" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text class="body" x="884" y="456" text-anchor="end">投入 1／家</text>

  <rect x="100" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="140" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="180" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="220" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="260" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="300" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="340" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="380" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="420" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="460" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="500" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="540" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="580" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="620" y="110" width="24" height="360" fill="var(--accent)"/>
  <rect x="660" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="700" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="740" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="780" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="820" y="466" width="24" height="4" fill="var(--grey)"/>
  <rect x="860" y="466" width="24" height="4" fill="var(--grey)"/>

  <text class="accentlab" x="632" y="98" text-anchor="middle">×60</text>
  <text class="group" x="632" y="498" text-anchor="middle">1 家</text>
  <text class="group" x="340" y="498" text-anchor="middle">19 家歸零</text>

  <text class="concl" x="80" y="540">20 家投入，1 家付清全場</text>
</svg>
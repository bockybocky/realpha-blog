<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two paths fork from not knowing: one stops at finding a confident statement, the other goes on to handle the unknown.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62">Same start, two paths</text>
  <rect x="60" y="92" width="840" height="286" rx="14" fill="var(--card)"/>

  <circle cx="170" cy="236" r="54" fill="var(--ink)"/>
  <text class="g" x="140" y="230" fill="var(--page)">I don't</text>
  <text class="g" x="140" y="256" fill="var(--page)">know</text>

  <path d="M228 206 L420 156" fill="none" stroke="var(--grey)" stroke-width="6"/>
  <rect x="430" y="122" width="210" height="66" rx="10" fill="var(--grey)"/>
  <text class="g" x="456" y="162" fill="var(--page)">Find a confident line</text>
  <text class="b" x="664" y="162">The path ends here</text>

  <path d="M228 266 L420 300" fill="none" stroke="var(--accent)" stroke-width="6"/>
  <rect x="430" y="268" width="180" height="66" rx="10" fill="var(--accent)"/>
  <text class="g" x="452" y="308" fill="var(--page)">Ask the price</text>
  <path d="M618 301 L686 301" stroke="var(--accent)" stroke-width="6"/>
  <polygon points="700,301 684,292 684,310" fill="var(--accent)"/>
  <rect x="706" y="268" width="166" height="66" rx="10" fill="var(--accent)" opacity="0.25"/>
  <text class="g" x="728" y="308" fill="var(--accent)">Trade it away</text>

  <text class="c" x="60" y="442">Admitting you don't know is step one, not the answer</text>
  <text class="b" x="60" y="474">Step two is where the difference is</text>
</svg>
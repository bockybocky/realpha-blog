<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="整台機器中，看守只有左邊一小塊可寫，右邊七個區域上鎖">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">看守的手，伸得到哪裡</text>

  <rect x="60" y="100" width="840" height="356" rx="12" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text x="80" y="130" font-size="16" fill="var(--dim)">整台機器</text>

  <rect x="90" y="152" width="250" height="278" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="118" y="200" font-size="20" fill="var(--accent)">隔離區</text>
  <text x="118" y="238" font-size="16" fill="var(--ink)">可寫</text>
  <text x="118" y="270" font-size="16" fill="var(--dim)">產物</text>
  <text x="118" y="300" font-size="16" fill="var(--dim)">帳本</text>
  <text x="118" y="330" font-size="16" fill="var(--dim)">佇列</text>

  <g stroke="var(--grey)" stroke-width="1.5" fill="var(--card)">
    <rect x="392" y="152" width="152" height="80" rx="8"/>
    <rect x="562" y="152" width="152" height="80" rx="8"/>
    <rect x="732" y="152" width="152" height="80" rx="8"/>
    <rect x="392" y="252" width="152" height="80" rx="8"/>
    <rect x="562" y="252" width="152" height="80" rx="8"/>
    <rect x="732" y="252" width="152" height="80" rx="8"/>
    <rect x="392" y="352" width="152" height="80" rx="8"/>
  </g>
  <g fill="var(--dim)" font-size="16">
    <text x="416" y="200">決策帳本</text>
    <text x="586" y="200">公司憲章</text>
    <text x="756" y="200">設定檔</text>
    <text x="416" y="300">規則</text>
    <text x="586" y="300">技能</text>
    <text x="756" y="300">記憶</text>
    <text x="416" y="400">交接檔</text>
  </g>
  <g stroke="var(--grey)" stroke-width="2" fill="none">
    <path d="M 508 176 a 8 8 0 0 1 16 0 v 8"/>
    <path d="M 678 176 a 8 8 0 0 1 16 0 v 8"/>
    <path d="M 848 176 a 8 8 0 0 1 16 0 v 8"/>
    <path d="M 508 276 a 8 8 0 0 1 16 0 v 8"/>
    <path d="M 678 276 a 8 8 0 0 1 16 0 v 8"/>
    <path d="M 848 276 a 8 8 0 0 1 16 0 v 8"/>
    <path d="M 508 376 a 8 8 0 0 1 16 0 v 8"/>
  </g>
  <g fill="var(--grey)">
    <rect x="504" y="184" width="24" height="18" rx="3"/>
    <rect x="674" y="184" width="24" height="18" rx="3"/>
    <rect x="844" y="184" width="24" height="18" rx="3"/>
    <rect x="504" y="284" width="24" height="18" rx="3"/>
    <rect x="674" y="284" width="24" height="18" rx="3"/>
    <rect x="844" y="284" width="24" height="18" rx="3"/>
    <rect x="504" y="384" width="24" height="18" rx="3"/>
  </g>
  <text x="586" y="400" font-size="19" fill="var(--dim)">七個禁區　唯讀</text>

  <text x="60" y="516" font-size="22" fill="var(--ink)">拒絕寫入是設計，不是故障。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條南海公司的價格曲線，在賣出點之後繼續上行三倍，牛頓在接近最終頭部處買回，隨後整段以警示色崩落回低位">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .gd { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .w { font-size:19px; fill:var(--warn); }
    .a { font-size:19px; fill:var(--accent); }
  </style>
  <text class="t" x="60" y="66">他賣對了，然後又買回去</text>
  <line x1="70" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
  <path d="M100 392 L170 360 L240 300 L300 262" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M300 262 L380 236 L450 176 L520 142 L600 112" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M600 112 L660 190 L730 300 L820 404" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="170" cy="360" r="6" fill="var(--accent)"/>
  <text class="b" x="112" y="400">1719 年 12 月 手上有</text>
  <circle cx="300" cy="262" r="6" fill="var(--accent)"/>
  <text class="a" x="262" y="240">賣出：五倍</text>
  <text class="b" x="372" y="288">在旁邊看它再漲三倍</text>
  <circle cx="520" cy="142" r="6" fill="var(--warn)"/>
  <text class="w" x="506" y="124" text-anchor="end">買回：頭部前兩三週</text>
  <circle cx="600" cy="112" r="6" fill="var(--ink)"/>
  <text class="g" x="616" y="104">最終頭部</text>
  <text class="b" x="742" y="430">遺產裡還卡著一塊</text>
  <text class="c" x="60" y="512">誘惑不理性，對理性的人照樣有效</text>
</svg>
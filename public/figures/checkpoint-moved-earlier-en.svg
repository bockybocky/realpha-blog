<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The checkpoint on the timeline is pulled by an arc from three years out back to an earlier position, with four watch items attached below">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">The timeline moved, not the view</text>
<text x="60" y="92" font-size="16" fill="var(--dim)">Structure same / speed up</text>

<path d="M856 250 Q 630 178 412 244" fill="none" stroke="var(--accent)" stroke-width="2"/>
<polygon points="400,248 416,236 418,250" fill="var(--accent)"/>

<line x1="120" y1="300" x2="874" y2="300" stroke="var(--line)" stroke-width="3"/>
<polygon points="886,300 870,293 870,307" fill="var(--line)"/>

<line x1="120" y1="292" x2="120" y2="308" stroke="var(--dim)" stroke-width="2"/>
<line x1="373" y1="292" x2="373" y2="308" stroke="var(--line)" stroke-width="2"/>
<line x1="626" y1="292" x2="626" y2="308" stroke="var(--line)" stroke-width="2"/>
<line x1="866" y1="292" x2="866" y2="308" stroke="var(--dim)" stroke-width="2"/>
<text x="120" y="334" font-size="15" fill="var(--dim)" text-anchor="middle">Today</text>
<text x="373" y="334" font-size="15" fill="var(--dim)" text-anchor="middle">1 year</text>
<text x="626" y="334" font-size="15" fill="var(--dim)" text-anchor="middle">2 years</text>
<text x="866" y="334" font-size="15" fill="var(--dim)" text-anchor="middle">3 years</text>

<circle cx="866" cy="300" r="11" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 4"/>
<text x="890" y="272" font-size="16" fill="var(--grey)" text-anchor="end">Was: 3 years out</text>

<circle cx="400" cy="300" r="12" fill="var(--accent)"/>
<text x="400" y="212" font-size="19" fill="var(--accent)" text-anchor="middle">Now: moved earlier</text>

<line x1="400" y1="312" x2="400" y2="368" stroke="var(--accent)" stroke-width="2"/>
<line x1="130" y1="368" x2="820" y2="368" stroke="var(--accent)" stroke-width="2"/>
<line x1="215" y1="368" x2="215" y2="388" stroke="var(--accent)" stroke-width="2"/>
<line x1="395" y1="368" x2="395" y2="388" stroke="var(--accent)" stroke-width="2"/>
<line x1="575" y1="368" x2="575" y2="388" stroke="var(--accent)" stroke-width="2"/>
<line x1="755" y1="368" x2="755" y2="388" stroke="var(--accent)" stroke-width="2"/>

<rect x="130" y="388" width="170" height="44" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="215" y="416" font-size="16" fill="var(--ink)" text-anchor="middle">Gen-2 results</text>
<rect x="310" y="388" width="170" height="44" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="395" y="416" font-size="16" fill="var(--ink)" text-anchor="middle">Same-gen rivals</text>
<rect x="490" y="388" width="170" height="44" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="575" y="416" font-size="16" fill="var(--ink)" text-anchor="middle">Full-factory scale</text>
<rect x="670" y="388" width="170" height="44" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="755" y="416" font-size="16" fill="var(--ink)" text-anchor="middle">Do others ship</text>

<text x="60" y="484" font-size="22" fill="var(--ink)">Wrong speed, move the checkpoint</text>
</svg>
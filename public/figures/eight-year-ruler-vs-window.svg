<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一把八格長尺與一把兩三年短尺上下對照，同一年在兩把尺上的占比天差地遠">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70">兩把尺</text>

  <text class="g" x="60" y="132">同業的尺</text>
  <rect x="60" y="150" width="800" height="60" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <line x1="160" y1="150" x2="160" y2="210" stroke="var(--line)"/>
  <line x1="260" y1="150" x2="260" y2="210" stroke="var(--line)"/>
  <line x1="360" y1="150" x2="360" y2="210" stroke="var(--line)"/>
  <line x1="460" y1="150" x2="460" y2="210" stroke="var(--line)"/>
  <line x1="560" y1="150" x2="560" y2="210" stroke="var(--line)"/>
  <line x1="660" y1="150" x2="660" y2="210" stroke="var(--line)"/>
  <line x1="760" y1="150" x2="760" y2="210" stroke="var(--line)"/>
  <rect x="60" y="150" width="100" height="60" rx="6" fill="var(--warn)"/>
  <text class="d" x="110" y="187" text-anchor="middle" fill="var(--page)">一年</text>
  <text class="d" x="868" y="187">八年一輪</text>

  <text class="g" x="60" y="302">這次的尺</text>
  <rect x="60" y="320" width="250" height="60" rx="6" fill="var(--accent)"/>
  <rect x="60" y="320" width="100" height="60" rx="6" fill="var(--warn)"/>
  <text class="d" x="110" y="357" text-anchor="middle" fill="var(--page)">一年</text>
  <text class="d" x="322" y="357">窗口 兩三年</text>

  <text class="d" x="60" y="434">同樣的落後，在上面那把尺是零頭，在下面那把是半條命</text>
  <text class="c" x="60" y="486">尺量錯了，理性的判斷就會錯</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩個開關的對照圖：一開一關結論不變，兩個都開結論才反轉">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">兩個開關，缺一不可</text>

  <text class="t" x="255" y="130" font-size="19" fill="var(--dim)" text-anchor="middle">受託義務</text>
  <text class="t" x="455" y="130" font-size="19" fill="var(--dim)" text-anchor="middle">身分遮掉</text>

  <text class="t" x="60" y="200" font-size="16" fill="var(--dim)">一開一關</text>
  <rect x="180" y="166" width="150" height="56" rx="28" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
  <circle cx="208" cy="194" r="18" fill="var(--grey)"/>
  <rect x="380" y="166" width="150" height="56" rx="28" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="502" cy="194" r="18" fill="var(--accent)"/>
  <line x1="545" y1="194" x2="608" y2="194" stroke="var(--line)" stroke-width="3"/>
  <polygon points="618,194 602,187 602,201" fill="var(--line)"/>
  <rect x="624" y="158" width="286" height="72" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="767" y="202" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">替對面出價</text>

  <text class="t" x="60" y="356" font-size="16" fill="var(--dim)">兩個都開</text>
  <rect x="180" y="322" width="150" height="56" rx="28" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="302" cy="350" r="18" fill="var(--accent)"/>
  <rect x="380" y="322" width="150" height="56" rx="28" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="502" cy="350" r="18" fill="var(--accent)"/>
  <line x1="545" y1="350" x2="608" y2="350" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="618,350 602,343 602,357" fill="var(--accent)"/>
  <rect x="624" y="314" width="286" height="72" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="767" y="358" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">替你比價</text>

  <text class="t" x="60" y="480" font-size="22" font-weight="700" fill="var(--ink)">少一個開關，結論就不成立</text>
</svg>
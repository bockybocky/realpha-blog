<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三個方向相反的箭頭推同一個方塊，訂單卡在中間">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/>
</marker>
</defs>
<text class="t" x="48" y="62" font-size="27" font-weight="700" fill="var(--ink)">同一批訂單，三個方向</text>

<rect x="390" y="200" width="180" height="92" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="480" y="254" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">H200 訂單</text>

<rect x="40" y="216" width="190" height="60" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="135" y="253" font-size="19" fill="var(--ink)" text-anchor="middle">中國 AI 公司</text>
<line x1="240" y1="246" x2="378" y2="246" stroke="var(--accent)" stroke-width="4" marker-end="url(#aA)"/>
<text class="t" x="309" y="226" font-size="16" fill="var(--dim)" text-anchor="middle">買得到就買</text>

<rect x="730" y="216" width="190" height="60" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="825" y="253" font-size="19" fill="var(--ink)" text-anchor="middle">北京</text>
<line x1="720" y1="246" x2="582" y2="246" stroke="var(--accent)" stroke-width="4" marker-end="url(#aA)"/>
<text class="t" x="651" y="226" font-size="16" fill="var(--dim)" text-anchor="middle">慢一點</text>

<rect x="385" y="392" width="190" height="60" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="480" y="429" font-size="19" fill="var(--ink)" text-anchor="middle">國產晶片廠</text>
<line x1="480" y1="384" x2="480" y2="302" stroke="var(--accent)" stroke-width="4" marker-end="url(#aA)"/>
<text class="t" x="596" y="352" font-size="16" fill="var(--dim)" text-anchor="middle">天文級需求</text>

<line x1="48" y1="490" x2="912" y2="490" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="480" y="528" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">方向不同，訂單就停在中間</text>
</svg>
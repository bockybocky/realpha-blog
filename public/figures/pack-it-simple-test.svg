<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="纏繞的線收成一個小方塊，再分出兩個出口，其中一條繞回起點">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<defs>
<marker id="arw8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/>
</marker>
</defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" class="t">講給一個不在意這件事的人聽</text>

<g fill="none" stroke="var(--grey)" stroke-width="4">
<path d="M110 280 C140 200 250 214 254 284 C258 356 140 366 130 300 C122 248 232 246 246 324"/>
<path d="M126 246 C186 200 258 254 224 330 C196 392 122 352 148 300"/>
</g>
<text x="104" y="422" class="g">一件複雜的事</text>

<path d="M300 288 L368 288" stroke="var(--dim)" stroke-width="3" marker-end="url(#arw8)"/>

<rect x="380" y="240" width="180" height="100" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="404" y="286" class="g">三分鐘・白話</text>
<text x="404" y="318" class="b">冒出術語就換掉</text>

<path d="M560 268 L640 210" fill="none" stroke="var(--dim)" stroke-width="3" marker-end="url(#arw8)"/>
<path d="M560 310 L640 372" fill="none" stroke="var(--dim)" stroke-width="3" marker-end="url(#arw8)"/>

<rect x="650" y="150" width="200" height="90" rx="12" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="2"/>
<text x="676" y="204" class="g">他追問</text>

<rect x="650" y="340" width="200" height="90" rx="12" fill="var(--warn)" fill-opacity="0.2" stroke="var(--warn)" stroke-width="2"/>
<text x="676" y="394" class="g">眼神飄走</text>

<path d="M650 430 C520 480 260 470 186 400" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arw8)"/>
<text x="386" y="486" class="b">回去重包一次</text>

<text x="60" y="118" class="b">規則只有一條：不准用他沒聽過的詞</text>
</svg>
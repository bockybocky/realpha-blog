<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four places linked into a loop by arrows labelled with goods, with 'no money moves' in the centre.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="h" x="60" y="58">Move goods, not money</text>
<rect x="90" y="120" width="170" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="150" y="158">North America</text>
<rect x="90" y="400" width="170" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="150" y="438">South America</text>
<rect x="560" y="120" width="170" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="620" y="158">Europe</text>
<rect x="700" y="400" width="170" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="765" y="438">Asia</text>
<line x1="150" y1="400" x2="150" y2="192" stroke="var(--accent)" stroke-width="4"/>
<polygon points="150,178 143,196 157,196" fill="var(--accent)"/>
<text class="b" x="164" y="300">Fentanyl</text>
<line x1="215" y1="182" x2="215" y2="388" stroke="var(--grey)" stroke-width="4"/>
<polygon points="215,402 208,384 222,384" fill="var(--grey)"/>
<text class="b" x="229" y="340">Farm machinery</text>
<line x1="262" y1="418" x2="586" y2="196" stroke="var(--accent)" stroke-width="4"/>
<polygon points="598,188 580,190 588,202" fill="var(--accent)"/>
<text class="b" x="360" y="326">Cocaine</text>
<line x1="672" y1="182" x2="770" y2="388" stroke="var(--accent)" stroke-width="4"/>
<polygon points="776,402 762,390 775,384" fill="var(--accent)"/>
<text class="b" x="700" y="300">Designer bags</text>
<text class="c" x="330" y="238">No money moves</text>
<text class="b" x="330" y="268">The movement hides in the paperwork</text>
<text class="c" x="60" y="520">If the goods add up, the books add up</text>
</svg>
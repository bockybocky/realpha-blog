<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The left futures tax bar is split 60/40, the right swap bar is one piece, and the right column adds margin and registration blocks.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t h" x="60" y="66">Different name, different rulebook</text>

  <text class="t g" x="90" y="130">Future</text>
  <text class="t g" x="540" y="130">Swap</text>

  <text class="t b" x="90" y="178">Tax</text>
  <rect x="90" y="192" width="192" height="46" rx="5" fill="var(--accent)"/>
  <rect x="282" y="192" width="128" height="46" rx="5" fill="var(--grey)"/>
  <text class="t b" x="100" y="266">60% long-term</text>
  <text class="t b" x="292" y="266">40% short-term</text>

  <text class="t b" x="540" y="178">Tax</text>
  <rect x="540" y="192" width="320" height="46" rx="5" fill="var(--warn)"/>
  <text class="t b" x="550" y="266">Ordinary income</text>

  <text class="t b" x="90" y="340">Margin days</text>
  <rect x="90" y="354" width="10" height="40" rx="4" fill="var(--grey)"/>
  <text class="t b" x="112" y="382">No such rule</text>

  <text class="t b" x="540" y="340">Margin days</text>
  <rect x="540" y="354" width="150" height="40" rx="4" fill="var(--warn)"/>
  <rect x="700" y="354" width="160" height="40" rx="4" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text class="t b" x="552" y="382" fill="var(--page)">5 if cleared</text>
  <text class="t b" x="712" y="382">10 if not</text>

  <text class="t b" x="540" y="452">Plus</text>
  <rect x="540" y="466" width="150" height="44" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t b" x="556" y="494">Registration</text>
  <rect x="706" y="466" width="154" height="44" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t b" x="722" y="494">Compliance</text>

  <text class="t c" x="60" y="552">Same position, new name, new rulebook</text>
</svg>
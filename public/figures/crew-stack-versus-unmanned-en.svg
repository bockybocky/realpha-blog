<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="On the left a tower of crew stacked layer by layer, on the right a small block flat on the ground.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text x="80" y="60" font-size="27" fill="var(--ink)">The bill is mostly people, not machines</text>
  <line x1="80" y1="500" x2="880" y2="500" stroke="var(--line)" stroke-width="2"/>

  <rect x="200" y="440" width="260" height="56" rx="6" fill="var(--grey)"/>
  <text x="330" y="476" font-size="19" fill="var(--page)" text-anchor="middle">One position</text>

  <rect x="200" y="378" width="260" height="56" rx="6" fill="var(--grey)"/>
  <text x="330" y="414" font-size="19" fill="var(--page)" text-anchor="middle">Three shifts</text>

  <rect x="200" y="316" width="260" height="56" rx="6" fill="var(--grey)"/>
  <text x="330" y="352" font-size="19" fill="var(--page)" text-anchor="middle">Supervisor each</text>

  <rect x="200" y="254" width="260" height="56" rx="6" fill="var(--grey)"/>
  <text x="330" y="290" font-size="19" fill="var(--page)" text-anchor="middle">Captain | Mate | Cook</text>

  <rect x="200" y="192" width="260" height="56" rx="6" fill="var(--warn)"/>
  <text x="330" y="228" font-size="19" fill="var(--page)" text-anchor="middle">Ship's doctor</text>

  <text x="330" y="165" font-size="20" fill="var(--ink)" text-anchor="middle">Dozens aboard | $100Ks a day</text>
  <text x="330" y="540" font-size="16" fill="var(--dim)" text-anchor="middle">People aboard</text>

  <rect x="620" y="470" width="220" height="26" rx="6" fill="var(--accent)"/>
  <text x="730" y="455" font-size="20" fill="var(--accent)" text-anchor="middle">Unmanned</text>
  <text x="730" y="540" font-size="16" fill="var(--dim)" text-anchor="middle">Sails in worse seas | can run fast underwater</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="貸款成數、不能換約、交屋日三個箭頭從三邊往中間壓，原本的出口被夾成一道窄縫，只剩解約或認賠賣出">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">三件事各自合理，疊起來是強制賣壓</text>

  <rect x="330" y="230" width="300" height="140" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="390" y="276">手上那一戶</text>
  <text class="b" x="390" y="306">幾十萬簽的約</text>
  <text class="b" x="390" y="332">本來打算交屋再說</text>

  <path d="M480 130 L480 212" stroke="var(--grey)" stroke-width="5"/>
  <path d="M480 212 l-9 -16 l18 0 z" fill="var(--grey)"/>
  <text class="g" x="400" y="118">貸款成數鎖住</text>
  <text class="b" x="366" y="96">第二戶・全國適用</text>

  <path d="M150 300 L312 300" stroke="var(--grey)" stroke-width="5"/>
  <path d="M312 300 l-16 -9 l0 18 z" fill="var(--grey)"/>
  <text class="g" x="60" y="268">不能換約</text>
  <text class="b" x="60" y="292">紅單賣不掉</text>

  <path d="M860 300 L648 300" stroke="var(--warn)" stroke-width="5"/>
  <path d="M648 300 l16 -9 l0 18 z" fill="var(--warn)"/>
  <text class="g" x="690" y="268" fill="var(--warn)">交屋日提前</text>
  <text class="b" x="690" y="292" fill="var(--warn)">2028 變 2027</text>

  <path d="M430 388 L430 450 L300 450" stroke="var(--warn)" stroke-width="3" fill="none"/>
  <path d="M300 450 l16 -9 l0 18 z" fill="var(--warn)"/>
  <text class="b" x="160" y="444" fill="var(--warn)">貸不出來就解約違約</text>

  <path d="M530 388 L530 450 L660 450" stroke="var(--warn)" stroke-width="3" fill="none"/>
  <path d="M660 450 l-16 -9 l0 18 z" fill="var(--warn)"/>
  <text class="b" x="680" y="444" fill="var(--warn)">交屋後認賠處理</text>

  <text class="c" x="60" y="524">題材沒被推翻，但現金流的時點對不上</text>
</svg>
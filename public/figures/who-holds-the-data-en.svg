<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A level, untipped balance with a pan on each side and a large question mark above">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600;fill:var(--dim)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
.q{font-size:56px;font-weight:700;fill:var(--accent)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">Where data tips is still open</text>
<text class="q" x="480" y="176" text-anchor="middle">?</text>
<rect x="220" y="216" width="520" height="12" rx="6" fill="var(--accent)"/>
<path d="M440,300 L480,222 L520,300 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="466" y="300" width="28" height="72" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="280" y1="228" x2="280" y2="300" stroke="var(--grey)" stroke-width="2"/>
<path d="M200,300 L360,300 L330,346 L230,346 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="280" y="392" text-anchor="middle">Model side</text>
<text class="b" x="280" y="418" text-anchor="middle">Public data</text>
<line x1="680" y1="228" x2="680" y2="300" stroke="var(--grey)" stroke-width="2"/>
<path d="M600,300 L760,300 L730,346 L630,346 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="680" y="392" text-anchor="middle">Enterprise</text>
<text class="b" x="680" y="418" text-anchor="middle">Closed data</text>
<text class="c" x="60" y="478">Whoever holds the unswappable wins</text>
</svg>
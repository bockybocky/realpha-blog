<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊一個小方塊、右邊二十乘十共兩百個同樣大小的方塊，呈現一天五十分鐘累積成一年兩百小時">
<defs>
<pattern id="hourcell" width="20" height="20" patternUnits="userSpaceOnUse">
<rect x="2" y="2" width="16" height="16" rx="3" fill="var(--accent)" fill-opacity="0.55"/>
</pattern>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
</defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">小到不值得你為它改變任何事</text>
<text class="b" x="60" y="94">一格＝一小時</text>
<rect x="102" y="222" width="16" height="16" rx="3" fill="var(--warn)"/>
<text class="g" x="80" y="282" fill="var(--warn)">一天</text>
<text class="b" x="80" y="304">50 分鐘</text>
<text class="t" x="196" y="240" fill="var(--dim)">×</text>
<text class="b" x="186" y="282">一年</text>
<rect x="260" y="150" width="400" height="200" fill="url(#hourcell)"/>
<rect x="260" y="150" width="400" height="200" fill="none" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="690" y="246" fill="var(--accent)">200 小時以上</text>
<text class="c" x="60" y="430">如果要一次付掉右邊這一整塊，</text>
<text class="c" x="60" y="462">你願不願意？</text>
<text class="b" x="60" y="500">不願意，那它就是你的 160 個基點</text>
</svg>
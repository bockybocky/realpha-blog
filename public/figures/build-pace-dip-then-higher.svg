<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三根柱子的高度先高、中間下凹、最後最高，最後一根用強調色">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="58">建設節奏：先凹下去，2030 年代再站上去</text>
  <text class="d" x="60" y="88">風電、太陽光電加儲能，每年新增容量（容量不等於發電量）</text>

  <rect x="120" y="248" width="170" height="172" fill="var(--grey)"/>
  <rect x="360" y="278" width="170" height="142" fill="var(--grey)"/>
  <rect x="600" y="210" width="170" height="210" fill="var(--accent)"/>
  <line x1="90" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="3"/>

  <text class="g" x="205" y="236" text-anchor="middle">約 90 GW</text>
  <text class="g" x="445" y="266" text-anchor="middle">約 75 GW</text>
  <text class="g" x="685" y="198" text-anchor="middle">100～110 GW</text>
  <text class="d" x="205" y="446" text-anchor="middle">今年與明年</text>
  <text class="d" x="445" y="446" text-anchor="middle">接下來幾年</text>
  <text class="d" x="685" y="446" text-anchor="middle">2030 年代</text>
  <text class="d" x="685" y="468" text-anchor="middle">已走過稅額抵減</text>

  <text class="c" x="60" y="504">凹下去的那幾年，不是趨勢反轉</text>
</svg>
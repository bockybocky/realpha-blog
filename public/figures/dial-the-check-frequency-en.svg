<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A small hollow dot at each end of an axis, with the enlarged solid dot in the middle marking the option chosen">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Signal on: change the frequency, not the position</text>
<path d="M120 280 H840" stroke="var(--grey)" stroke-width="3"/>
<circle cx="120" cy="280" r="9" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
<circle cx="840" cy="280" r="9" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
<circle cx="480" cy="280" r="17" fill="var(--accent)"/>
<text x="120" y="330" font-size="19" fill="var(--dim)">Do nothing</text>
<text x="840" y="330" font-size="19" fill="var(--dim)" text-anchor="end">Cut the position</text>
<text x="480" y="238" font-size="20" fill="var(--accent)" text-anchor="middle">Raise the review frequency</text>
<text x="480" y="332" font-size="15" fill="var(--dim)" text-anchor="middle">Signal on, move here</text>
<text x="60" y="452" font-size="22" fill="var(--ink)">Treat it as a dial, not a switch.</text>
</svg>
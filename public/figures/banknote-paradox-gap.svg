<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-label="左邊高柱是每人流通現金七千多美元，其中上段六成五在海外；右邊矮柱是實際持有約四百三十美元，中間標差一個數量級">
<rect x="0" y="0" width="960" height="590" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<defs>
<marker id="bnW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker>
</defs>
<text class="t" x="480" y="48" text-anchor="middle">印了多少，手上有多少</text>
<text class="b" x="900" y="48" text-anchor="end">單位：美元／人</text>
<rect x="250" y="100" width="140" height="260" fill="var(--line)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="b" x="320" y="224" text-anchor="middle">約六成五</text>
<text class="b" x="320" y="248" text-anchor="middle">在海外</text>
<rect x="250" y="360" width="140" height="140" fill="var(--grey)"/>
<text class="g" x="320" y="86" text-anchor="middle">7,000+</text>
<rect x="570" y="475" width="140" height="25" fill="var(--accent)"/>
<text class="g a" x="640" y="462" text-anchor="middle">約 430</text>
<line x1="200" y1="500" x2="760" y2="500" stroke="var(--grey)" stroke-width="1.5"/>
<text class="b" x="320" y="528" text-anchor="middle">流通中，每人平均</text>
<text class="b" x="640" y="528" text-anchor="middle">身上＋家中</text>
<line x1="392" y1="100" x2="640" y2="100" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="640" y1="106" x2="640" y2="436" stroke="var(--warn)" stroke-width="2.5" marker-start="url(#bnW)" marker-end="url(#bnW)"/>
<text class="g w" x="656" y="280">差一個數量級</text>
<text class="c" x="480" y="570" text-anchor="middle">印出來的，大多不在一般人手上</text>
</svg>
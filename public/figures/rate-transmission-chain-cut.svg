<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="升息傳導鏈在企業那一節斷開，壓力改道流向公共部門">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="58">老路斷了，壓力改道</text>
<circle cx="120" cy="200" r="52" fill="var(--accent)" opacity="0.85"/>
<text class="g" x="120" y="207" text-anchor="middle" fill="var(--page)">升息</text>
<line x1="172" y1="200" x2="268" y2="200" stroke="var(--grey)" stroke-width="10"/>
<line x1="300" y1="160" x2="356" y2="240" stroke="var(--warn)" stroke-width="7"/>
<line x1="356" y1="160" x2="300" y2="240" stroke="var(--warn)" stroke-width="7"/>
<text class="g" x="328" y="130" text-anchor="middle" fill="var(--warn)">斷</text>
<text class="b" x="328" y="286" text-anchor="middle">鎖了低利債、手上有現金</text>
<g opacity="0.45">
<line x1="388" y1="200" x2="470" y2="200" stroke="var(--grey)" stroke-width="10"/>
<circle cx="530" cy="200" r="52" fill="var(--grey)"/>
<text class="g" x="530" y="207" text-anchor="middle">毛利</text>
<line x1="582" y1="200" x2="664" y2="200" stroke="var(--grey)" stroke-width="10"/>
<circle cx="724" cy="200" r="52" fill="var(--grey)"/>
<text class="g" x="724" y="207" text-anchor="middle">砍支出</text>
<line x1="776" y1="200" x2="844" y2="200" stroke="var(--grey)" stroke-width="10"/>
<text class="g" x="900" y="207" text-anchor="middle">轉彎</text>
</g>
<path d="M120 252 L120 400 L520 400" fill="none" stroke="var(--accent)" stroke-width="10"/>
<polygon points="536,400 512,388 512,412" fill="var(--accent)"/>
<circle cx="640" cy="400" r="58" fill="var(--accent)"/>
<text class="g" x="640" y="394" text-anchor="middle" fill="var(--page)">公共部門</text>
<text class="b" x="640" y="420" text-anchor="middle" fill="var(--page)">槓桿在這</text>
<text class="c" x="60" y="500">教科書的鏈子被剪斷，不等於壓力消失</text>
</svg>
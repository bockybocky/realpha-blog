<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊兩圓不相交只有一支箭頭，右邊兩圓大面積重疊">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); }
    .g  { font-size:19px; fill:var(--dim); }
    .s  { font-size:15px; fill:var(--dim); }
    .c  { font-size:22px; fill:var(--ink); }
</style>
<text class="ti" x="80" y="62">這筆錢有沒有帶著聽眾進來</text>
<circle cx="180" cy="300" r="86" fill="var(--grey)" fill-opacity="0.3" stroke="var(--grey)" stroke-width="2"/>
<circle cx="392" cy="300" r="86" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<text class="s" x="180" y="306" text-anchor="middle">純資金</text>
<text class="s" x="392" y="306" text-anchor="middle">目標買家</text>
<path d="M272 300 L 300 300" stroke="var(--dim)" stroke-width="3"/>
<path d="M300 300 l -12 -7 l 0 14 Z" fill="var(--dim)"/>
<text class="s" x="286" y="276" text-anchor="middle">錢</text>
<text class="g" x="180" y="432" text-anchor="middle">不相交</text>
<circle cx="618" cy="300" r="106" fill="var(--grey)" fill-opacity="0.3" stroke="var(--grey)" stroke-width="2"/>
<circle cx="758" cy="300" r="106" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2"/>
<text class="s" x="548" y="306" text-anchor="middle">營運者股東</text>
<text class="s" x="828" y="306" text-anchor="middle">目標買家</text>
<text class="s" x="688" y="250" text-anchor="middle">同一群人</text>
<text class="g" x="688" y="432" text-anchor="middle">大面積重疊</text>
<text class="c" x="80" y="506">只拿到錢，還是拿到通路</text>
</svg>
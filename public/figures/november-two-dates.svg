<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="注意力與對長端殖利率的直接作用兩軸上，期中選舉在右下、融資發行公告在左上。">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t h" x="60" y="66">11 月的兩個日子</text>
<line x1="150" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="450" x2="150" y2="130" stroke="var(--line)" stroke-width="2"/>
<text class="t b" x="150" y="482">市場注意力 低</text>
<text class="t b" x="790" y="482">高</text>
<text class="t b" x="60" y="146">對長端</text>
<text class="t b" x="60" y="168">的直接</text>
<text class="t b" x="60" y="190">作用 大</text>
<text class="t b" x="60" y="440">小</text>
<circle cx="280" cy="200" r="16" fill="var(--accent)"/>
<text class="t g" x="312" y="196" fill="var(--accent)">11 / 4 融資發行公告</text>
<text class="t b" x="312" y="222">財政部決定發什麼天期</text>
<circle cx="790" cy="392" r="16" fill="var(--warn)"/>
<text class="t g" x="520" y="356" fill="var(--warn)">11 / 3 期中選舉</text>
<text class="t b" x="520" y="382">作用走財政：之後兩年沒有新刺激</text>
<circle cx="236" cy="262" r="11" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="5 4"/>
<text class="t b" x="186" y="300">2023 秋：砍長債 → 十年期 −100bp</text>
<text class="t c" x="60" y="528">所有人記得右下角那一個</text>
</svg>
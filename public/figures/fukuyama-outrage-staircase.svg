<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="階梯圖：言論每變得更極端一級，追蹤數就往上跳一階，最低一階是合理但沒人理">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); font-size:16px; }
</style>
<text x="480" y="50" text-anchor="middle" style="font-size:27px;font-weight:700">漲粉的階梯</text>
<line x1="110" y1="450" x2="870" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="110" y1="120" x2="110" y2="450" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="290" text-anchor="middle" transform="rotate(-90 80 290)" style="font-size:19px;fill:var(--dim)">追蹤數</text>
<path d="M120 430 H300 V350 H480 V260 H660" fill="none" stroke="var(--accent)" stroke-width="7"/>
<path d="M660 260 V160 H850" fill="none" stroke="var(--warn)" stroke-width="7"/>
<text x="210" y="412" text-anchor="middle" style="font-size:16px;fill:var(--dim)">沒人理</text>
<text x="210" y="484" text-anchor="middle" style="font-size:19px;fill:var(--dim)">合理</text>
<text x="390" y="484" text-anchor="middle" style="font-size:19px">荒唐</text>
<text x="570" y="484" text-anchor="middle" style="font-size:19px">侮辱</text>
<text x="755" y="484" text-anchor="middle" style="font-size:19px;fill:var(--warn);font-weight:700">更極端</text>
<text x="870" y="520" text-anchor="end" style="font-size:16px;fill:var(--dim)">言論極端程度 →</text>
<text x="480" y="570" text-anchor="middle" style="font-size:22px;font-weight:700">往上一階，就得再狠一級</text>
</svg>
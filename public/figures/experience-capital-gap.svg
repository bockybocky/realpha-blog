<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條同起點的折線隨時間愈拉愈開，右端標出累積的差距">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">被跳過的場面，會累積</text>
<line x1="130" y1="430" x2="820" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="130" y1="430" x2="130" y2="110" stroke="var(--line)" stroke-width="2"/>
<text x="118" y="462" font-size="16" fill="var(--dim)">入職</text>
<text x="760" y="462" font-size="16" fill="var(--dim)">幾年後</text>
<text x="60" y="120" font-size="16" fill="var(--dim)">經驗</text>
<polyline points="130,410 270,352 410,296 550,236 690,176 760,148" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="130,410 270,392 410,378 550,366 690,356 760,352" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text x="500" y="196" font-size="19" font-weight="700" fill="var(--accent)">一直被派上場</text>
<text x="500" y="340" font-size="19" font-weight="700" fill="var(--dim)">一直被保護</text>
<line x1="790" y1="148" x2="790" y2="352" stroke="var(--warn)" stroke-width="3"/>
<path d="M790 148 l-7 14 h14 z" fill="var(--warn)"/>
<path d="M790 352 l-7 -14 h14 z" fill="var(--warn)"/>
<text x="806" y="240" font-size="19" font-weight="700" fill="var(--warn)">經驗</text>
<text x="806" y="266" font-size="19" font-weight="700" fill="var(--warn)">資本差</text>
<text x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">能力沒輸，場面數輸了</text>
</svg>
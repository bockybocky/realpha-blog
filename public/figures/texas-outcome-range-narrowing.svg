<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="結果區間像漏斗，從現在的寬張開逐步收窄，四個行政日期落在收窄的節點上">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">區間先收窄，才會有定價</text>

  <polygon points="120,130 120,400 860,290 860,240" fill="var(--grey)" opacity="0.3"/>
  <polyline points="120,130 400,196 620,230 860,240" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <polyline points="120,400 400,330 620,300 860,290" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <line x1="120" y1="265" x2="880" y2="265" stroke="var(--accent)" stroke-width="4"/>

  <circle cx="300" cy="265" r="8" fill="var(--accent)"/>
  <text class="t" x="258" y="438" font-size="19" font-weight="700" fill="var(--ink)">12／10</text>
  <text class="t" x="258" y="462" font-size="16" fill="var(--dim)">能源審計</text>
  <line x1="300" y1="275" x2="300" y2="414" stroke="var(--line)" stroke-width="2"/>

  <circle cx="450" cy="265" r="8" fill="var(--accent)"/>
  <text class="t" x="410" y="438" font-size="19" font-weight="700" fill="var(--ink)">12／17</text>
  <text class="t" x="410" y="462" font-size="16" fill="var(--dim)">公聽會</text>
  <line x1="450" y1="275" x2="450" y2="414" stroke="var(--line)" stroke-width="2"/>

  <circle cx="620" cy="265" r="8" fill="var(--warn)"/>
  <text class="t" x="576" y="438" font-size="19" font-weight="700" fill="var(--ink)">一月</text>
  <text class="t" x="576" y="462" font-size="16" fill="var(--dim)">各州州情咨文</text>
  <line x1="620" y1="275" x2="620" y2="414" stroke="var(--line)" stroke-width="2"/>

  <circle cx="800" cy="265" r="8" fill="var(--accent)"/>
  <text class="t" x="756" y="438" font-size="19" font-weight="700" fill="var(--ink)">四至六月</text>
  <text class="t" x="756" y="462" font-size="16" fill="var(--dim)">德州會期</text>
  <line x1="800" y1="275" x2="800" y2="414" stroke="var(--line)" stroke-width="2"/>

  <text class="t" x="130" y="118" font-size="16" fill="var(--dim)">現在：結果區間太寬</text>
  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">這段時間的跌，一部分是先開槍再問問題</text>
</svg>
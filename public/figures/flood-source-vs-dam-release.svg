<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="長短懸殊的兩根橫條：本地降雨佔七成三，而完美洩洪能救回的淹水面積只有百分之三點六八，短到幾乎看不見">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">被罵的環節，不是決定結果的環節</text>
<text x="60" y="86" font-size="16" fill="var(--dim)">下游窪地洪水來源，與 17 種洩洪情境的上限</text>

<text x="80" y="164" font-size="20" font-weight="700" fill="var(--ink)">洪水從哪裡來</text>
<rect x="80" y="180" width="800" height="86" fill="var(--card)" stroke="var(--line)"/>
<rect x="80" y="180" width="590" height="86" fill="var(--accent)"/>
<text x="375" y="216" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">當地自己下的雨</text>
<text x="375" y="244" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">73.7%</text>
<text x="775" y="216" font-size="16" text-anchor="middle" fill="var(--ink)">河川</text>
<text x="775" y="242" font-size="16" text-anchor="middle" fill="var(--ink)">不到 30%</text>

<text x="80" y="342" font-size="20" font-weight="700" fill="var(--ink)">完美洩洪最多能救回</text>
<rect x="80" y="358" width="800" height="60" fill="var(--card)" stroke="var(--line)"/>
<rect x="80" y="358" width="29" height="60" fill="var(--warn)"/>
<line x1="109" y1="358" x2="160" y2="330" stroke="var(--warn)" stroke-width="2"/>
<text x="168" y="326" font-size="19" font-weight="700" fill="var(--warn)">3.68%</text>
<text x="480" y="396" font-size="16" text-anchor="middle" fill="var(--dim)">即使操作者完全掌握接下來的雨</text>

<text x="480" y="478" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">脆弱點不在那個被指責的地方</text>
</svg>
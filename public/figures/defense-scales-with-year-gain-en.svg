<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A line rising to the upper right: with a small gain this year you turn defensive early, and with a larger gain you can hold longer through deeper pullbacks, reset every year and every quarter.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">Gain more, wait out deeper dips</text>
<line x1="140" y1="110" x2="140" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="440" x2="850" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="130" y="126" text-anchor="end" font-size="16" fill="var(--dim)">Tolerable dip</text>
<text x="850" y="492" text-anchor="end" font-size="16" fill="var(--dim)">Gain this year →</text>
<text x="840" y="118" text-anchor="end" font-size="16" fill="var(--dim)">Reset yearly and quarterly</text>
<line x1="160" y1="400" x2="820" y2="160" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
<circle cx="300" cy="349" r="11" fill="var(--warn)"/>
<text x="318" y="388" font-size="19" font-weight="700" fill="var(--warn)">Defend early</text>
<circle cx="740" cy="189" r="11" fill="var(--accent)"/>
<text x="725" y="168" text-anchor="end" font-size="19" font-weight="700" fill="var(--accent)">Hold longer</text>
<line x1="300" y1="440" x2="300" y2="448" stroke="var(--dim)" stroke-width="2"/>
<line x1="740" y1="440" x2="740" y2="448" stroke="var(--dim)" stroke-width="2"/>
<text x="300" y="466" text-anchor="middle" font-size="15" fill="var(--dim)">20%</text>
<text x="740" y="466" text-anchor="middle" font-size="15" fill="var(--dim)">More</text>
<text x="480" y="525" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">Defense scales with gains</text>
</svg>
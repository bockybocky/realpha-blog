<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The right bar is about twice the height of the left one, with a note beside it saying the figure is derived by dividing revenue by the price per rack.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Rumors can't be checked; division can</text>

<line x1="150" y1="452" x2="820" y2="452" stroke="var(--line)" stroke-width="2"/>

<rect x="230" y="310" width="150" height="142" rx="6" fill="var(--grey)"/>
<text class="t" x="305" y="292" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">~1,250 racks</text>
<text class="t" x="305" y="484" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Prior gen</text>
<text class="t" x="305" y="510" font-size="16" fill="var(--dim)" text-anchor="middle">First volume quarter</text>

<rect x="590" y="110" width="150" height="342" rx="6" fill="var(--accent)"/>
<text class="t" x="665" y="92" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">~3,000 racks</text>
<text class="t" x="665" y="484" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">This gen</text>
<text class="t" x="665" y="510" font-size="16" fill="var(--dim)" text-anchor="middle">Q3</text>

<rect x="60" y="120" width="130" height="118" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="125" y="156" font-size="16" fill="var(--dim)" text-anchor="middle">Math</text>
<text class="t" x="125" y="186" font-size="16" fill="var(--ink)" text-anchor="middle">~$20B</text>
<text class="t" x="125" y="212" font-size="16" fill="var(--dim)" text-anchor="middle">÷ rack price</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="兩條橫條：我自己讀要一個下午以上還讀不完，AI 五分鐘讀完，長度差很多">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<text class="t" x="60" y="70">同一份原始碼，兩種讀法</text>
<text class="b" x="60" y="104">41 個 Go 檔｜約 280KB</text>
<text class="g" x="60" y="207">我自己</text>
<text class="b" x="180" y="166">一個下午：讀不完</text>
<rect x="180" y="180" width="600" height="40" rx="6" fill="var(--grey)"/>
<rect x="780" y="180" width="120" height="40" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="g" x="60" y="317">AI</text>
<rect x="180" y="290" width="13" height="40" rx="3" fill="var(--accent)"/>
<text class="g" x="208" y="317" style="fill:var(--accent)">五分鐘：讀完</text>
<line x1="60" y1="380" x2="900" y2="380" stroke="var(--line)" stroke-width="1"/>
<text class="c" x="60" y="435">讀完原始碼：一個下午 → 五分鐘</text>
</svg>
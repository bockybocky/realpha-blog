<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Price falls sharply and recovers fast, and the cheap zone at the trough is a narrow band, far shorter than the wide range people imagine they can shop in.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .a { font-size:19px; fill:var(--accent); font-weight:600; }
</style>
<text class="t" x="60" y="66">Cheap is not a range, it is a window</text>
<rect x="452" y="120" width="56" height="320" fill="var(--accent)" opacity="0.14"/>
<line x1="90" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="90" y1="120" x2="90" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="60" y="112">Price</text>
<path d="M110,205 L240,215 L300,242 L360,300 L420,368 L470,392 L500,358 L540,290 L580,252 L640,238 L720,226 L890,212" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="470" cy="392" r="6" fill="var(--accent)"/>
<text class="a" x="452" y="108">Cheap</text>
<text class="b" x="300" y="336">July . leverage flush</text>
<text class="b" x="596" y="318">August . multiple repair</text>
<rect x="330" y="470" width="370" height="12" rx="6" fill="var(--grey)" opacity="0.55"/>
<rect x="452" y="470" width="56" height="12" rx="6" fill="var(--accent)"/>
<text class="b" x="330" y="508">The range you imagine</text>
<text class="a" x="532" y="482">The real window</text>
</svg>
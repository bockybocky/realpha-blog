<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One bar cut into two segments: the left just over half at contract prices, the right close to half bought on the spot market.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">Nearly half sits outside the contract</text>
<text x="120" y="122" font-size="19" fill="var(--dim)">Q3 compute spend　$10 billion total</text>
<rect x="120" y="150" width="396" height="96" fill="var(--accent)"/>
<rect x="516" y="150" width="324" height="96" fill="var(--warn)"/>
<text x="150" y="207" font-size="16" fill="var(--page)">Contract $5.5 billion</text>
<text x="552" y="207" font-size="16" fill="var(--page)">Spot $4.5 billion</text>
<line x1="480" y1="140" x2="480" y2="258" stroke="var(--dim)" stroke-dasharray="5 5"/>
<text x="480" y="280" text-anchor="middle" font-size="15" fill="var(--dim)">Half</text>
<path d="M516,300 L516,326 L840,326 L840,300" fill="none" stroke="var(--dim)"/>
<text x="678" y="358" text-anchor="middle" font-size="16" fill="var(--dim)">Two weeks pre-listing, filled at a premium</text>
<text x="480" y="452" text-anchor="middle" font-size="22" fill="var(--ink)">The pricey segment is the mark of scarcity</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根柱子比較看錯的代價：跟著多頭看錯是矮柱，轉空頭看錯是高柱，不對稱使讀數偏多">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">看錯的代價不一樣高</text>
<text class="t" x="60" y="100" font-size="16" fill="var(--dim)">同一位策略師，兩種錯法</text>

<line x1="60" y1="420" x2="640" y2="420" stroke="var(--line)" stroke-width="2"/>

<rect x="140" y="360" width="130" height="60" rx="4" fill="var(--grey)"/>
<text class="t" x="205" y="340" font-size="19" fill="var(--ink)" text-anchor="middle">大家一起錯</text>
<text class="t" x="205" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">繼續多頭</text>

<rect x="420" y="150" width="130" height="270" rx="4" fill="var(--warn)"/>
<text class="t" x="485" y="130" font-size="19" fill="var(--ink)" text-anchor="middle">只有你一個錯</text>
<text class="t" x="485" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">轉空頭</text>

<text class="t" x="340" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">代價</text>
<path d="M700 290 L830 290" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#a1)"/>
<defs><marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>
<text class="t" x="700" y="265" font-size="20" font-weight="700" fill="var(--accent)">讀數偏多</text>
<text class="t" x="700" y="325" font-size="16" fill="var(--dim)">線圖上看不到</text>

<text class="t" x="60" y="492" font-size="22" font-weight="700" fill="var(--ink)">指標量的是一群有誘因的人的嘴</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左邊六個節點六條線全接到他身上；右邊六個節點先接到管家，管家只拉一條線給他">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">誰在盯</text>
<line x1="480" y1="100" x2="480" y2="550" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="118" font-size="20" fill="var(--ink)">現在</text>
<text x="520" y="118" font-size="20" fill="var(--ink)">想要的</text>
<g stroke="var(--warn)" stroke-width="2">
<line x1="98" y1="206" x2="263" y2="410"/>
<line x1="164" y1="206" x2="263" y2="410"/>
<line x1="230" y1="206" x2="263" y2="410"/>
<line x1="296" y1="206" x2="263" y2="410"/>
<line x1="362" y1="206" x2="263" y2="410"/>
<line x1="428" y1="206" x2="263" y2="410"/>
</g>
<g stroke="var(--grey)" stroke-width="2">
<line x1="558" y1="206" x2="723" y2="286"/>
<line x1="624" y1="206" x2="723" y2="286"/>
<line x1="690" y1="206" x2="723" y2="286"/>
<line x1="756" y1="206" x2="723" y2="286"/>
<line x1="822" y1="206" x2="723" y2="286"/>
<line x1="888" y1="206" x2="723" y2="286"/>
</g>
<line x1="723" y1="354" x2="723" y2="410" stroke="var(--accent)" stroke-width="3"/>
<g fill="var(--card)" stroke="var(--grey)" stroke-width="1.5">
<circle cx="98" cy="180" r="26"/><circle cx="164" cy="180" r="26"/><circle cx="230" cy="180" r="26"/>
<circle cx="296" cy="180" r="26"/><circle cx="362" cy="180" r="26"/><circle cx="428" cy="180" r="26"/>
<circle cx="558" cy="180" r="26"/><circle cx="624" cy="180" r="26"/><circle cx="690" cy="180" r="26"/>
<circle cx="756" cy="180" r="26"/><circle cx="822" cy="180" r="26"/><circle cx="888" cy="180" r="26"/>
</g>
<g font-size="15" text-anchor="middle" fill="var(--ink)">
<text x="98" y="185">AI</text><text x="164" y="185">AI</text><text x="230" y="185">AI</text>
<text x="296" y="185">機器</text><text x="362" y="185">機器</text><text x="428" y="185">機器</text>
<text x="558" y="185">AI</text><text x="624" y="185">AI</text><text x="690" y="185">AI</text>
<text x="756" y="185">機器</text><text x="822" y="185">機器</text><text x="888" y="185">機器</text>
</g>
<circle cx="263" cy="450" r="40" fill="var(--page)" stroke="var(--ink)" stroke-width="2"/>
<text x="263" y="458" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">他</text>
<circle cx="723" cy="320" r="34" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="723" y="326" font-size="18" font-weight="700" text-anchor="middle" fill="var(--accent)">管家</text>
<circle cx="723" cy="450" r="40" fill="var(--page)" stroke="var(--ink)" stroke-width="2"/>
<text x="723" y="458" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">他</text>
<text x="60" y="540" font-size="22" font-weight="700" fill="var(--warn)">6 條線拉著他</text>
<text x="520" y="540" font-size="22" font-weight="700" fill="var(--accent)">1 條線</text>
</svg>
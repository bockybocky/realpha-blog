<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three holding blocks each send an arrow down, all landing on the same wide bar below.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="56" font-size="27" fill="var(--ink)">Three on paper, one when you look through</text>

  <text x="60" y="132" font-size="19" fill="var(--dim)">Holdings list</text>

  <rect x="90" y="150" width="200" height="70" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="380" y="150" width="200" height="70" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="670" y="150" width="200" height="70" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="190" y="192" font-size="16" fill="var(--ink)" text-anchor="middle">EM ETF</text>
  <text x="480" y="192" font-size="16" fill="var(--ink)" text-anchor="middle">Taiwan cap-weighted ETF</text>
  <text x="770" y="192" font-size="16" fill="var(--ink)" text-anchor="middle">Semiconductor names</text>

  <line x1="190" y1="228" x2="190" y2="330" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="184,330 196,330 190,344" fill="var(--grey)"/>
  <line x1="480" y1="228" x2="480" y2="330" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="474,330 486,330 480,344" fill="var(--grey)"/>
  <line x1="770" y1="228" x2="770" y2="330" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="764,330 776,330 770,344" fill="var(--grey)"/>

  <text x="60" y="338" font-size="19" fill="var(--dim)">Looking through</text>

  <rect x="90" y="356" width="780" height="88" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text x="480" y="408" font-size="20" fill="var(--accent)" text-anchor="middle">Asian semiconductor supply chain</text>

  <text x="480" y="510" font-size="22" fill="var(--ink)" text-anchor="middle">Diversification counts overlaps, not tickers</text>
</svg>
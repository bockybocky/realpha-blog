<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Within the large square of total purchasing, only a small patch is spot volume, yet it sets the reference price.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">How thin the floor is</text>

<rect x="80" y="110" width="440" height="300" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="156" font-size="20" fill="var(--dim)">Total purchasing</text>
<text x="110" y="186" font-size="16" fill="var(--dim)">Long-term · internal</text>

<rect x="412" y="330" width="96" height="68" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="4"/>
<text x="420" y="370" font-size="16" fill="var(--accent)">Spot volume</text>

<line x1="512" y1="364" x2="636" y2="364" stroke="var(--accent)" stroke-width="3"/>
<polygon points="636,354 660,364 636,374" fill="var(--accent)"/>
<text x="668" y="348" font-size="20" fill="var(--ink)">What everyone quotes</text>
<text x="668" y="382" font-size="20" fill="var(--accent)">Reference price</text>

<text x="60" y="470" font-size="22" fill="var(--ink)">It takes few lost buyers to break the line</text>
</svg>
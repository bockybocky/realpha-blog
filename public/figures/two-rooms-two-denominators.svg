<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩張分開的卡片各有自己的柱子，中間以虛線隔開，表示兩組數字不在同一個試驗裡">
  <defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style></defs>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>

  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">兩個房間裡量出來的數字</text>

  <rect x="60" y="110" width="400" height="370" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="110" width="400" height="370" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <text class="t" x="80" y="146" font-size="20" font-weight="700" fill="var(--dim)">別人的試驗</text>
  <text class="t" x="80" y="172" font-size="15" fill="var(--grey)">真實世界 · 會缺席</text>
  <text class="t" x="520" y="146" font-size="20" font-weight="700" fill="var(--dim)">這個試驗</text>
  <text class="t" x="520" y="172" font-size="15" fill="var(--grey)">試驗內 · 被盯著</text>

  <line x1="80" y1="440" x2="440" y2="440" stroke="var(--line)" stroke-width="2"/>
  <line x1="520" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>

  <rect x="130" y="396" width="76" height="44" fill="var(--grey)"/>
  <rect x="270" y="421" width="76" height="19" fill="var(--grey)"/>
  <text class="t" x="130" y="386" font-size="16" fill="var(--dim)">11%</text>
  <text class="t" x="270" y="411" font-size="16" fill="var(--dim)">4.7%</text>
  <text class="t" x="130" y="464" font-size="15" fill="var(--dim)">藥物</text>
  <text class="t" x="270" y="464" font-size="15" fill="var(--dim)">心理治療</text>

  <rect x="570" y="232" width="76" height="208" fill="var(--accent)"/>
  <rect x="710" y="168" width="76" height="272" fill="var(--accent)"/>
  <text class="t" x="570" y="222" font-size="16" fill="var(--ink)">52%</text>
  <text class="t" x="710" y="158" font-size="16" fill="var(--ink)">68%</text>
  <text class="t" x="570" y="464" font-size="15" fill="var(--dim)">症狀下降</text>
  <text class="t" x="710" y="464" font-size="15" fill="var(--dim)">緩解</text>

  <line x1="480" y1="104" x2="480" y2="486" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 8"/>
  <text class="t" x="480" y="92" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">分母不同</text>

  <text class="t" x="60" y="546" font-size="22" font-weight="700" fill="var(--ink)">倍數降級成方向</text>
</svg>
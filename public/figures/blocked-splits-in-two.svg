<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一個節點分岔成兩支，左支柱子貼地幾乎沒高度，右支柱子高高立起">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">同樣是「在等」，代價不一樣</text>

  <rect x="400" y="112" width="160" height="54" rx="27" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="480" y="147" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">在等</text>
  <path d="M480 166 L250 232" fill="none" stroke="var(--line)" stroke-width="3"/>
  <path d="M480 166 L710 232" fill="none" stroke="var(--line)" stroke-width="3"/>

  <text class="t" x="250" y="266" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">安靜等待</text>
  <text class="t" x="710" y="266" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">空轉卡死</text>

  <line x1="170" y1="430" x2="800" y2="430" stroke="var(--line)" stroke-width="2"/>
  <rect x="222" y="420" width="56" height="10" fill="var(--grey)"/>
  <rect x="682" y="288" width="56" height="142" fill="var(--warn)"/>

  <text class="t" x="250" y="462" font-size="15" fill="var(--dim)" text-anchor="middle">CPU 趨近零</text>
  <text class="t" x="710" y="462" font-size="15" fill="var(--warn)" text-anchor="middle">CPU 持續非零</text>

  <text class="t" x="60" y="508" font-size="22" font-weight="700" fill="var(--ink)">都在等，只有一種在燒你的機器</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="對比圖：流程是一條有一環斷掉的鏈，性質是任何人隨時都能從四面驗證的一個點">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .lb { font-size:16px; fill:var(--ink); }
    .dm { font-size:16px; fill:var(--dim); }
    .cc { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56">流程，還是性質</text>
<rect x="60" y="90" width="400" height="330" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="128" fill="var(--warn)">流程</text>
<circle cx="150" cy="200" r="34" fill="none" stroke="var(--grey)" stroke-width="7"/>
<circle cx="214" cy="200" r="34" fill="none" stroke="var(--grey)" stroke-width="7"/>
<path d="M310 174 A34 34 0 1 0 310 226" fill="none" stroke="var(--warn)" stroke-width="7"/>
<circle cx="344" cy="248" r="34" fill="none" stroke="var(--grey)" stroke-width="7" opacity="0.5"/>
<text class="lb" x="84" y="300">我願意　我有空　我沒出錯</text>
<text class="dm" x="84" y="334">斷一環，整條斷</text>
<text class="dm" x="84" y="360">而且斷在最忙的那天</text>
<rect x="500" y="90" width="400" height="330" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="524" y="128" fill="var(--accent)">性質</text>
<circle cx="700" cy="230" r="52" fill="var(--accent)"/>
<text x="664" y="224" font-size="16px" fill="var(--page)" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">隨時</text>
<text x="664" y="246" font-size="16px" fill="var(--page)" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">成立</text>
<g stroke="var(--accent)" stroke-width="3">
<line x1="560" y1="150" x2="656" y2="200"/><line x1="840" y1="150" x2="744" y2="200"/>
<line x1="560" y1="310" x2="656" y2="260"/><line x1="840" y1="310" x2="744" y2="260"/>
<line x1="700" y1="120" x2="700" y2="172"/><line x1="700" y1="340" x2="700" y2="288"/>
</g>
<text class="lb" x="524" y="378">任何人自己驗得出來</text>
<text class="dm" x="524" y="404">不需要我在場</text>
<text class="cc" x="60" y="492">把一件事從流程改成性質</text>
</svg>
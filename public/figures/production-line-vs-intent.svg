<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上半實心長條由短變長，下半是幾個空的虛線框">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="40" y="54" font-size="27" font-weight="700" fill="var(--ink)">已經在跑的產線，和還沒定型的需求</text>

  <text x="40" y="112" font-size="20" font-weight="700" fill="var(--accent)">產線已定型</text>
  <text x="184" y="112" font-size="16" fill="var(--dim)">巨頭・未來三年</text>

  <text x="40" y="164" font-size="16" fill="var(--dim)">PAC-3 現在</text>
  <rect x="200" y="142" width="174" height="30" rx="4" fill="var(--accent)" opacity="0.45"/>
  <text x="386" y="164" font-size="16" fill="var(--ink)">620 枚</text>

  <text x="40" y="216" font-size="16" fill="var(--dim)">要拉到</text>
  <rect x="200" y="194" width="560" height="30" rx="4" fill="var(--accent)"/>
  <text x="772" y="216" font-size="16" font-weight="700" fill="var(--ink)">2000 枚</text>

  <text x="40" y="268" font-size="16" fill="var(--dim)">THAAD</text>
  <rect x="200" y="246" width="140" height="30" rx="4" fill="var(--accent)" opacity="0.45"/>
  <rect x="344" y="246" width="416" height="30" rx="4" fill="var(--accent)"/>
  <text x="772" y="268" font-size="16" font-weight="700" fill="var(--ink)">四倍</text>

  <line x1="40" y1="316" x2="920" y2="316" stroke="var(--line)" stroke-width="2"/>

  <text x="40" y="366" font-size="20" font-weight="700" fill="var(--dim)">還只是意向</text>
  <text x="184" y="366" font-size="16" fill="var(--dim)">中間帶五家・三到五年</text>

  <rect x="200" y="390" width="104" height="46" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="316" y="390" width="104" height="46" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="432" y="390" width="104" height="46" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="548" y="390" width="104" height="46" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="664" y="390" width="104" height="46" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="790" y="420" font-size="19" fill="var(--dim)">我需要幾萬個</text>

  <text x="40" y="512" font-size="22" font-weight="700" fill="var(--ink)">講得出一年幾套的是結構，講不出的多半是雜音</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊兩個長條一矮一高並有向上箭頭；右邊一個極小的點緊貼一個巨大方塊">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="40" y="52" font-size="27" font-weight="700">拿什麼比，決定看到什麼</text>
<rect x="40" y="90" width="420" height="380" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="90" width="420" height="380" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="250" y="130" font-size="20" font-weight="700" text-anchor="middle">跟舊作比</text>
<text x="710" y="130" font-size="20" font-weight="700" text-anchor="middle">跟美術館比</text>
<line x1="90" y1="420" x2="410" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="120" y="310" width="100" height="110" fill="var(--grey)"/>
<rect x="280" y="190" width="100" height="230" fill="var(--accent)"/>
<path d="M170 290 Q250 200 322 178" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M308 170 L332 175 L316 192 Z" fill="var(--accent)"/>
<text x="170" y="448" font-size="16" text-anchor="middle" style="fill:var(--dim)">十年前</text>
<text x="330" y="448" font-size="16" text-anchor="middle" style="fill:var(--accent)">現在</text>
<rect x="600" y="160" width="290" height="260" fill="var(--grey)"/>
<text x="745" y="298" font-size="19" text-anchor="middle" style="fill:var(--page)">現代美術館</text>
<circle cx="560" cy="416" r="4" fill="var(--accent)"/>
<line x1="560" y1="406" x2="560" y2="360" stroke="var(--dim)" stroke-width="1.5"/>
<text x="560" y="350" font-size="16" text-anchor="middle" style="fill:var(--dim)">一粒塵</text>
<text x="250" y="520" font-size="22" font-weight="700" text-anchor="middle" style="fill:var(--accent)">看得到進步</text>
<text x="710" y="520" font-size="22" font-weight="700" text-anchor="middle" style="fill:var(--dim)">只剩渺小</text>
</svg>
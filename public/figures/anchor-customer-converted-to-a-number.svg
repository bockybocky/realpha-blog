<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="投資條與營收條同尺度並列，營收條左端切出兩成到三成的小塊代表錨定客戶的採購承諾">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; font-weight:700; fill:var(--ink); }
  .g { font-size:19px; fill:var(--ink); }
  .n { font-size:20px; font-weight:700; fill:var(--ink); }
  .d { font-size:15px; fill:var(--dim); }
  .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70">一個體面的詞，換算成一張要簽名的採購單</text>

<text class="g" x="60" y="150">亞利桑那投資（當尺）</text>
<rect x="120" y="170" width="477" height="54" rx="6" fill="var(--grey)"/>
<text class="n" x="140" y="205" fill="var(--page)">2650 億</text>

<text class="g" x="60" y="282">德州廠使用年限營收（假設五成報酬）</text>
<rect x="120" y="302" width="720" height="54" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="120" y="302" width="216" height="54" rx="6" fill="var(--accent)"/>
<rect x="120" y="302" width="144" height="54" fill="var(--accent)"/>
<text class="n" x="700" y="337">4000 億</text>
<text class="d" x="140" y="337" fill="var(--page)">兩成到三成</text>

<path d="M120 372 L120 390 L336 390 L336 372" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="c" x="120" y="424" fill="var(--accent)">錨定客戶要簽 800 到 1200 億</text>
<text class="d" x="120" y="456">單位：美元。比例為示意，用來看量級不是精算</text>
<text class="d" x="60" y="492">右側灰底的那一大段，是沒有人承諾、要靠其他客戶填滿的部分</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three bars of equal length each stand for a different whole, with the coloured share being very long on one, about two thirds on another, and absent on the third.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="58">Same-looking percentages, different denominators</text>

  <text class="g" x="80" y="124">Capacity added to the grid last year</text>
  <rect x="80" y="138" width="800" height="64" fill="var(--card)" stroke="var(--line)"/>
  <rect x="80" y="138" width="720" height="64" fill="var(--accent)"/>
  <text class="d" x="104" y="178">About 90% clean energy</text>

  <text class="g" x="80" y="256">New demand</text>
  <rect x="80" y="270" width="800" height="64" fill="var(--card)" stroke="var(--line)"/>
  <rect x="80" y="270" width="533" height="64" fill="var(--warn)"/>
  <text class="d" x="104" y="310">About two thirds supplied by gas</text>

  <text class="g" x="80" y="388">Share of the total</text>
  <rect x="80" y="402" width="800" height="64" fill="var(--card)" stroke="var(--line)" stroke-dasharray="8 6"/>
  <text class="d" x="104" y="442">No figure given in this episode</text>

  <text class="c" x="60" y="500">See a percentage, ask whose denominator it is</text>
</svg>
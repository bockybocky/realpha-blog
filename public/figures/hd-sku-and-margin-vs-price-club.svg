<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左側品項數柱狀圖家得寶是 Price Club 的六倍高；右側毛利率柱狀圖家得寶比業界矮三分之一">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .v { font-size:19px; font-weight:700; }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="60" y="56" class="t">多賣六倍品項，少賺一截毛利</text>
<text x="265" y="124" class="g" text-anchor="middle">品項數</text>
<line x1="120" y1="470" x2="410" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="422" width="90" height="48" fill="var(--grey)"/>
<text x="195" y="410" class="v" text-anchor="middle">4,000</text>
<rect x="290" y="170" width="90" height="300" fill="var(--accent)"/>
<text x="335" y="158" class="v" text-anchor="middle">25,000</text>
<text x="195" y="498" class="b" text-anchor="middle">Price Club</text>
<text x="335" y="498" class="b" text-anchor="middle">家得寶</text>
<line x1="480" y1="110" x2="480" y2="500" stroke="var(--line)" stroke-width="1"/>
<text x="705" y="124" class="g" text-anchor="middle">毛利率</text>
<line x1="560" y1="470" x2="850" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="590" y="200" width="90" height="270" fill="var(--grey)"/>
<text x="635" y="188" class="v" text-anchor="middle">45%</text>
<rect x="730" y="290" width="90" height="180" fill="var(--accent)"/>
<text x="775" y="278" class="v" text-anchor="middle">30%</text>
<text x="635" y="498" class="b" text-anchor="middle">當時業界</text>
<text x="775" y="498" class="b" text-anchor="middle">家得寶</text>
<text x="480" y="542" class="c" text-anchor="middle">品項 ×6　毛利 −15 點</text>
</svg>
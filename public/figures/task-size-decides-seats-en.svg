<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The fork with small changes has many seats, while the fork with a large change has only one seat.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">Change size decides seat count</text>

  <rect x="48" y="245" width="150" height="58" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="123" y="282" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">One task</text>

  <path d="M198 258 C270 258 270 160 340 160" stroke="var(--accent)" stroke-width="3" fill="none"/>
  <path d="M198 290 C270 290 270 410 340 410" stroke="var(--warn)" stroke-width="3" fill="none"/>

  <text class="t" x="340" y="128" font-size="19" font-weight="700" fill="var(--accent)">Change read at a glance</text>
  <rect x="340" y="146" width="56" height="56" rx="10" fill="var(--accent)"/>
  <rect x="412" y="146" width="56" height="56" rx="10" fill="var(--accent)"/>
  <rect x="484" y="146" width="56" height="56" rx="10" fill="var(--accent)"/>
  <rect x="556" y="146" width="56" height="56" rx="10" fill="var(--accent)"/>
  <rect x="628" y="146" width="56" height="56" rx="10" fill="var(--accent)"/>
  <text class="t" x="716" y="182" font-size="22" font-weight="700" fill="var(--ink)">Seats can be many</text>

  <text class="t" x="340" y="378" font-size="19" font-weight="700" fill="var(--warn)">Must understand it to merge</text>
  <rect x="340" y="396" width="200" height="90" rx="12" fill="var(--warn)"/>
  <text class="t" x="440" y="449" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">One seat</text>
  <text class="t" x="572" y="449" font-size="22" font-weight="700" fill="var(--ink)">Seats should be few</text>
</svg>
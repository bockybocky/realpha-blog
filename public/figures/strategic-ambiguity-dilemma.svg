<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條曲線從左下一起往右上升，藍線是威嚇力，橘線是緊張，橘線在右段急升">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<defs><marker id="m4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--dim)"/></marker></defs>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700">戰略模糊的兩難</text>
<line x1="140" y1="440" x2="140" y2="120" stroke="var(--dim)" stroke-width="2"/>
<line x1="140" y1="440" x2="850" y2="440" stroke="var(--dim)" stroke-width="2" marker-end="url(#m4)"/>
<text x="126" y="136" text-anchor="end" font-size="16" style="fill:var(--dim)">高</text>
<text x="126" y="440" text-anchor="end" font-size="16" style="fill:var(--dim)">低</text>
<path d="M140 390 C 330 280, 560 230, 830 205" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M140 425 C 480 415, 680 330, 830 150" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text x="842" y="212" font-size="19" font-weight="700" style="fill:var(--accent)">威嚇力</text>
<text x="842" y="155" font-size="19" font-weight="700" style="fill:var(--warn)">緊張</text>
<text x="140" y="475" font-size="16">模糊</text>
<text x="830" y="475" text-anchor="end" font-size="16">明說會出兵</text>
<text x="480" y="530" text-anchor="middle" font-size="22" font-weight="700">威嚇變強，緊張也跟著升</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two equal bars: the large position can sell only a sliver in a day with the rest stuck, while the small position clears entirely.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t  { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1 { font-size:27px; font-weight:700; fill:var(--ink); }
    .lb { font-size:20px; font-weight:700; fill:var(--ink); }
    .bd { font-size:16px; fill:var(--dim); }
    .cc { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text class="t h1" x="60" y="62">Same stock, same day, two situations at the limit</text>

  <rect x="60" y="100" width="840" height="150" rx="10" fill="var(--card)"/>
  <text class="t lb" x="84" y="140">Large position</text>
  <rect x="84" y="164" width="792" height="48" fill="var(--grey)"/>
  <rect x="84" y="164" width="24" height="48" fill="var(--accent)"/>
  <line x1="96" y1="164" x2="96" y2="132" stroke="var(--accent)" stroke-width="2"/>
  <text class="t bd" x="112" y="128" fill="var(--accent)">What a day can absorb</text>
  <text class="t bd" x="560" y="240">The rest is stuck with you</text>

  <rect x="60" y="272" width="840" height="150" rx="10" fill="var(--card)"/>
  <text class="t lb" x="84" y="312">Small position</text>
  <rect x="84" y="336" width="792" height="48" fill="var(--accent)"/>
  <text class="t bd" x="96" y="412">You can leave; only the loss matters</text>

  <text class="t cc" x="60" y="470">Same fall, different ability to move</text>
  <text class="t bd" x="60" y="500">Liquidity is decided when you build the position</text>
</svg>
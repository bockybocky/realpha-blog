<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A staircase of three steps rising from low to high, where the higher the step, the longer the wait and the more things listed on it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="480" y="60" font-size="27" fill="var(--ink)" text-anchor="middle">What 16 seconds and 30 seconds each buy you</text>

  <rect x="100" y="400" width="240" height="60" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="340" y="310" width="240" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="580" y="220" width="240" height="240" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>

  <text x="220" y="438" font-size="16" fill="var(--dim)" text-anchor="middle">Funds land in seconds</text>

  <text x="460" y="352" font-size="19" fill="var(--ink)" text-anchor="middle">One screening pass runs</text>
  <text x="460" y="390" font-size="16" fill="var(--dim)" text-anchor="middle">Fraud meets friction</text>

  <text x="700" y="262" font-size="19" fill="var(--ink)" text-anchor="middle">Banks net between them</text>
  <text x="700" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">Less idle liquidity</text>
  <text x="700" y="334" font-size="16" fill="var(--dim)" text-anchor="middle">Risk appetite falls with it</text>

  <line x1="80" y1="460" x2="880" y2="460" stroke="var(--line)" stroke-width="2"/>
  <text x="220" y="497" font-size="20" fill="var(--grey)" text-anchor="middle">0 seconds</text>
  <text x="460" y="497" font-size="20" fill="var(--dim)" text-anchor="middle">16 seconds</text>
  <text x="700" y="497" font-size="20" fill="var(--accent)" text-anchor="middle">30 seconds</text>

  <text x="480" y="546" font-size="22" fill="var(--ink)" text-anchor="middle">Each step buys not slowness but one more job done</text>
</svg>
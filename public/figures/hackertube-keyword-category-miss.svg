<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="兩條水平長條被極不對稱切分，上條幾乎全是程式語言只留極小一塊是真生鏽，下條大部分是標題沒有金屬字卻仍屬金屬主題">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">照字面找，兩頭都會錯</text>

<text class="g" x="60" y="130">帶 rust 字的 35 支</text>
<rect x="60" y="150" width="816" height="64" rx="8" fill="var(--grey)"/>
<rect x="852" y="150" width="24" height="64" rx="8" fill="var(--warn)"/>
<text class="b" x="80" y="190">34 支是程式語言或寫程式</text>
<text class="b" x="700" y="246">1 支真的跟鏽有關</text>
<polygon points="864,222 856,238 872,238" fill="var(--warn)"/>

<text class="g" x="60" y="330">人工挑進金屬材料學的 27 支</text>
<rect x="60" y="350" width="574" height="64" rx="8" fill="var(--accent)"/>
<rect x="634" y="350" width="242" height="64" rx="8" fill="var(--grey)"/>
<text class="b" fill="#ffffff" style="fill:#ffffff" x="80" y="390">19 支連一個金屬字都沒有</text>
<text class="b" x="654" y="390">8 支有</text>

<text class="c" x="60" y="492">字面命中率高，和分對類是兩件事</text>
</svg>
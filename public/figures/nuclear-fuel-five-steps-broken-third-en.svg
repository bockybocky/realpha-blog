<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A five-step supply chain runs horizontally, and only the third step, enrichment, is an empty gap, while the other four steps stay solid and connected.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="78" font-size="27" fill="var(--ink)">The five steps of nuclear fuel</text>
<text x="60" y="112" font-size="16" fill="var(--dim)">US domestic capacity</text>

<line x1="150" y1="250" x2="270" y2="250" stroke="var(--grey)" stroke-width="4"/>
<line x1="390" y1="250" x2="440" y2="250" stroke="var(--grey)" stroke-width="4" stroke-dasharray="6 8"/>
<line x1="610" y1="250" x2="660" y2="250" stroke="var(--grey)" stroke-width="4" stroke-dasharray="6 8"/>
<line x1="780" y1="250" x2="820" y2="250" stroke="var(--grey)" stroke-width="4"/>

<rect x="60" y="200" width="150" height="100" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="135" y="245" font-size="20" fill="var(--ink)" text-anchor="middle">Mining</text>
<text x="135" y="275" font-size="15" fill="var(--dim)" text-anchor="middle">Kazakhstan, Canada</text>

<rect x="240" y="200" width="150" height="100" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="315" y="245" font-size="20" fill="var(--ink)" text-anchor="middle">Conversion</text>
<text x="315" y="275" font-size="15" fill="var(--dim)" text-anchor="middle">One plant only</text>

<rect x="430" y="185" width="190" height="130" rx="10" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text x="525" y="240" font-size="20" fill="var(--warn)" text-anchor="middle">Enrichment</text>
<text x="525" y="272" font-size="16" fill="var(--warn)" text-anchor="middle">No domestic commercial capacity</text>

<rect x="660" y="200" width="130" height="100" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="725" y="255" font-size="20" fill="var(--ink)" text-anchor="middle">Reconversion</text>

<rect x="820" y="200" width="100" height="100" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="870" y="255" font-size="20" fill="var(--ink)" text-anchor="middle">Fuel</text>

<text x="135" y="350" font-size="19" fill="var(--dim)" text-anchor="middle">Overseas</text>
<text x="315" y="350" font-size="19" fill="var(--ink)" text-anchor="middle">Yes</text>
<text x="525" y="350" font-size="19" fill="var(--warn)" text-anchor="middle">Gap</text>
<text x="725" y="350" font-size="19" fill="var(--ink)" text-anchor="middle">Yes</text>
<text x="870" y="350" font-size="19" fill="var(--ink)" text-anchor="middle">Yes</text>

<text x="60" y="440" font-size="22" fill="var(--ink)">One broken step blocks the whole chain</text>
</g>
</svg>
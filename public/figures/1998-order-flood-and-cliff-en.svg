<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Order volume stacks higher each year to a 2001 peak, then falls vertically to a very low level in a cliff shape, with roughly the upper half of each bar marked as phantom demand.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">A flood of orders, then a cliff</text>
  <text class="t" x="60" y="94" font-size="16" fill="var(--dim)">Bar height = orders that year (illustrative)</text>

  <line x1="120" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>

  <g>
    <rect x="150" y="395" width="70" height="45" fill="var(--accent)" opacity="0.85"/>
    <rect x="150" y="350" width="70" height="45" fill="var(--warn)" opacity="0.75"/>
    <text class="t" x="185" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">1998</text>
  </g>
  <g>
    <rect x="265" y="355" width="70" height="85" fill="var(--accent)" opacity="0.85"/>
    <rect x="265" y="270" width="70" height="85" fill="var(--warn)" opacity="0.75"/>
    <text class="t" x="300" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">1999</text>
  </g>
  <g>
    <rect x="380" y="310" width="70" height="130" fill="var(--accent)" opacity="0.85"/>
    <rect x="380" y="180" width="70" height="130" fill="var(--warn)" opacity="0.75"/>
    <text class="t" x="415" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">2000</text>
  </g>
  <g>
    <rect x="495" y="275" width="70" height="165" fill="var(--accent)" opacity="0.85"/>
    <rect x="495" y="110" width="70" height="165" fill="var(--warn)" opacity="0.75"/>
    <text class="t" x="530" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">2001</text>
  </g>
  <g>
    <rect x="610" y="412" width="70" height="28" fill="var(--grey)"/>
    <text class="t" x="645" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">2002</text>
  </g>
  <g>
    <rect x="725" y="424" width="70" height="16" fill="var(--grey)"/>
    <text class="t" x="760" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">2003</text>
  </g>

  <path d="M575 108 L600 108 L600 404 L606 404" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5" opacity="0.6"/>

  <text class="t" x="830" y="200" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Phantom</text>
  <text class="t" x="830" y="224" font-size="16" fill="var(--dim)" text-anchor="middle">About half</text>
  <text class="t" x="830" y="352" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Real</text>

  <text class="t" x="60" y="510" font-size="22" font-weight="700" fill="var(--ink)">Half of that flood never existed</text>
</svg>
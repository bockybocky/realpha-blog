<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="股市總市值對 GDP 的兩根柱，一根約一倍，一根約兩倍半">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="56">同一次破掉，槓桿不一樣大</text>
<line x1="90" y1="440" x2="900" y2="440" stroke="var(--ink)" stroke-width="3"/>
<line x1="90" y1="380" x2="900" y2="380" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
<text class="d" x="900" y="372" text-anchor="end">GDP</text>
<rect x="190" y="374" width="180" height="66" rx="8" fill="var(--grey)"/>
<text class="g" x="280" y="470" text-anchor="middle">2000 年</text>
<text class="g" x="280" y="352" text-anchor="middle">約一倍</text>
<rect x="580" y="214" width="180" height="226" rx="8" fill="var(--warn)" opacity="0.9"/>
<text class="g" x="670" y="470" text-anchor="middle">現在</text>
<text class="g" x="670" y="192" text-anchor="middle">約兩倍半</text>
<text class="d" x="280" y="500" text-anchor="middle">淺的衰退</text>
<text class="d" x="670" y="500" text-anchor="middle">更兇的財富效果</text>
<text class="c" x="60" y="542">股市對經濟的槓桿變大，還錢那天也變大</text>
</svg>
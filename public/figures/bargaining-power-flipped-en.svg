<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Thick arrows pointing opposite ways in two rows">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">In two years, the arrow reversed</text>

<text x="60" y="112" font-size="19" font-weight="600" fill="var(--dim)">2023 – 2025</text>
<rect x="60" y="132" width="180" height="88" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="150" y="184" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">Town</text>
<rect x="720" y="132" width="180" height="88" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="810" y="184" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">Developer</text>
<text x="480" y="158" font-size="16" fill="var(--ink)" text-anchor="middle">Tax subsidies　NDAs</text>
<path d="M 270 176 L 660 176 L 660 162 L 700 184 L 660 206 L 660 192 L 270 192 Z" fill="var(--grey)"/>
<text x="480" y="222" font-size="15" fill="var(--dim)" text-anchor="middle">Afraid the next town takes it</text>

<line x1="60" y1="272" x2="900" y2="272" stroke="var(--line)" stroke-width="2"/>

<text x="60" y="316" font-size="19" font-weight="600" fill="var(--accent)">Now</text>
<rect x="60" y="336" width="180" height="88" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="150" y="388" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">Town</text>
<rect x="720" y="336" width="180" height="88" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="810" y="388" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle">Developer</text>
<text x="480" y="362" font-size="16" fill="var(--ink)" text-anchor="middle">Prepaid power　bonuses for teachers</text>
<path d="M 700 380 L 310 380 L 310 366 L 270 388 L 310 410 L 310 396 L 700 396 Z" fill="var(--accent)"/>
<text x="480" y="426" font-size="15" fill="var(--dim)" text-anchor="middle">No more NDAs</text>

<text x="480" y="502" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Bargaining power changed sides</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One large concentrated circle on the left, dozens of scattered small dots on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="h" x="60" y="58">Why bad systems last</text>
<text class="g" x="120" y="120" fill="var(--accent)">Gains</text>
<circle cx="250" cy="270" r="96" fill="var(--accent)"/>
<text class="b" x="150" y="410">Named, countable, well lobbied</text>
<line x1="480" y1="100" x2="480" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="560" y="120" fill="var(--dim)">Harm</text>
<circle cx="560" cy="180" r="11" fill="var(--grey)"/>
<circle cx="640" cy="150" r="9" fill="var(--grey)"/>
<circle cx="720" cy="196" r="12" fill="var(--grey)"/>
<circle cx="800" cy="162" r="8" fill="var(--grey)"/>
<circle cx="880" cy="205" r="10" fill="var(--grey)"/>
<circle cx="590" cy="252" r="9" fill="var(--grey)"/>
<circle cx="670" cy="285" r="12" fill="var(--grey)"/>
<circle cx="755" cy="248" r="8" fill="var(--grey)"/>
<circle cx="840" cy="292" r="11" fill="var(--grey)"/>
<circle cx="905" cy="258" r="9" fill="var(--grey)"/>
<circle cx="545" cy="330" r="10" fill="var(--grey)"/>
<circle cx="625" cy="356" r="8" fill="var(--grey)"/>
<circle cx="710" cy="336" r="11" fill="var(--grey)"/>
<circle cx="795" cy="362" r="9" fill="var(--grey)"/>
<circle cx="878" cy="340" r="12" fill="var(--grey)"/>
<text class="b" x="560" y="410">Scattered, uncounted, unrepresented</text>
<text class="c" x="60" y="490">Nobody did wrong, and nothing moves</text>
</svg>
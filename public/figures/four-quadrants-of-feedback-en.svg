<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Four quadrants of right or wrong calls against feedback or none, with the bottom-right box marked odd.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">Only one box makes you doubt</text>
<text x="66" y="188" font-size="19" fill="var(--dim)">Mkt</text>
<text x="66" y="214" font-size="19" fill="var(--dim)">pays</text>
<text x="66" y="372" font-size="19" fill="var(--dim)">Mkt</text>
<text x="66" y="398" font-size="19" fill="var(--dim)">none</text>
<rect x="180" y="130" width="330" height="160" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="520" y="130" width="330" height="160" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="180" y="302" width="330" height="160" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="520" y="302" width="330" height="160" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="4"/>
<text x="318" y="222" font-size="27" fill="var(--dim)">Luck</text>
<text x="658" y="222" font-size="27" fill="var(--accent)">Norm</text>
<text x="318" y="394" font-size="27" fill="var(--dim)">Due</text>
<text x="650" y="384" font-size="27" fill="var(--warn)">Odd</text>
<text x="590" y="420" font-size="16" fill="var(--warn)">Pre-empting</text>
<text x="300" y="492" font-size="19" fill="var(--dim)">Wrong</text>
<text x="640" y="492" font-size="19" fill="var(--ink)">Right</text>
<text x="60" y="548" font-size="22" fill="var(--ink)">Right, no payoff: trim and rest</text>
</svg>
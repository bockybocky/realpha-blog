<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="The upper stream narrows after three gates, while the lower stream runs at full width with only dashed outlines where its gates were removed.">
<rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">Does this money need someone's signature</text>
<text class="g" x="60" y="112">CalKids: every gate needs a human decision</text>
<polygon points="60,140 300,140 300,220 60,220" fill="var(--grey)"/>
<polygon points="300,152 540,152 540,208 300,208" fill="var(--grey)"/>
<polygon points="540,170 780,170 780,196 540,196" fill="var(--grey)"/>
<polygon points="780,178 900,178 900,190 780,190" fill="var(--grey)"/>
<line x1="300" y1="126" x2="300" y2="234" stroke="var(--warn)" stroke-width="4"/>
<line x1="540" y1="126" x2="540" y2="234" stroke="var(--warn)" stroke-width="4"/>
<line x1="780" y1="126" x2="780" y2="234" stroke="var(--warn)" stroke-width="4"/>
<text class="s" x="192" y="268">Parents must open it</text>
<text class="s" x="412" y="268">College use only</text>
<text class="s" x="648" y="268">Stuck at the parent gate</text>
<text class="s" x="800" y="160">What's left</text>
<text class="g" x="60" y="382">530A: gates removed</text>
<rect x="60" y="410" width="840" height="80" fill="var(--accent)"/>
<rect x="300" y="396" width="2" height="108" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="540" y="396" width="2" height="108" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="780" y="396" width="2" height="108" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 8"/>
<text class="s" x="192" y="538">Account opens at birth</text>
<text class="s" x="412" y="538">Indexed the next day</text>
<text class="s" x="648" y="538">Late claims still compound</text>
<text class="c" x="60" y="596">Does the default flow, or wait for a signature</text>
</svg>
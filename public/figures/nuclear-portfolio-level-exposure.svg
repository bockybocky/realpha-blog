<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊單一專案被殺掉報酬歸零，右邊三案一組其中一案被殺掉，報酬仍由另兩案撐住">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">報酬算在哪個單位上</text>

<rect x="60" y="100" width="380" height="360" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="250" y="140" font-size="20" fill="var(--ink)" text-anchor="middle">單一專案</text>
<circle cx="250" cy="250" r="62" fill="none" stroke="var(--warn)" stroke-width="6"/>
<line x1="206" y1="206" x2="294" y2="294" stroke="var(--warn)" stroke-width="6"/>
<line x1="294" y1="206" x2="206" y2="294" stroke="var(--warn)" stroke-width="6"/>
<text class="t" x="250" y="258" font-size="19" fill="var(--dim)" text-anchor="middle"> </text>
<text class="t" x="250" y="360" font-size="19" fill="var(--warn)" text-anchor="middle">被按暫停</text>
<text class="t" x="250" y="415" font-size="22" fill="var(--ink)" text-anchor="middle">報酬：0</text>

<rect x="500" y="100" width="400" height="360" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="700" y="140" font-size="20" fill="var(--ink)" text-anchor="middle">三案一組</text>
<circle cx="580" cy="240" r="46" fill="none" stroke="var(--warn)" stroke-width="5"/>
<line x1="549" y1="209" x2="611" y2="271" stroke="var(--warn)" stroke-width="5"/>
<line x1="611" y1="209" x2="549" y2="271" stroke="var(--warn)" stroke-width="5"/>
<circle cx="700" cy="240" r="46" fill="var(--accent)"/>
<circle cx="820" cy="240" r="46" fill="var(--accent)"/>
<text class="t" x="700" y="340" font-size="19" fill="var(--dim)" text-anchor="middle">殺掉一個，後面賺回來</text>
<text class="t" x="700" y="415" font-size="22" fill="var(--ink)" text-anchor="middle">報酬：仍成立</text>

<text class="t" x="60" y="505" font-size="22" fill="var(--ink)">把問題變大，鎖才打得開</text>
</svg>
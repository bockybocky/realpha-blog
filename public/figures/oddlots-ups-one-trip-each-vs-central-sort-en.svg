<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The left side is a tangle of separate point-to-point lines, while the right side gathers into one node first and then fans out.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="48" y="62">One trip each vs sort</text>

<text class="g" x="60" y="124">One trip</text>
<line x1="110" y1="170" x2="400" y2="390" stroke="var(--grey)" stroke-width="3"/>
<line x1="110" y1="230" x2="400" y2="170" stroke="var(--grey)" stroke-width="3"/>
<line x1="110" y1="290" x2="400" y2="450" stroke="var(--grey)" stroke-width="3"/>
<line x1="110" y1="350" x2="400" y2="230" stroke="var(--grey)" stroke-width="3"/>
<line x1="110" y1="410" x2="400" y2="290" stroke="var(--grey)" stroke-width="3"/>
<circle cx="110" cy="170" r="9" fill="var(--dim)"/>
<circle cx="110" cy="230" r="9" fill="var(--dim)"/>
<circle cx="110" cy="290" r="9" fill="var(--dim)"/>
<circle cx="110" cy="350" r="9" fill="var(--dim)"/>
<circle cx="110" cy="410" r="9" fill="var(--dim)"/>
<circle cx="400" cy="170" r="9" fill="var(--grey)"/>
<circle cx="400" cy="230" r="9" fill="var(--grey)"/>
<circle cx="400" cy="290" r="9" fill="var(--grey)"/>
<circle cx="400" cy="350" r="9" fill="var(--grey)"/>
<circle cx="400" cy="390" r="9" fill="var(--grey)"/>
<circle cx="400" cy="450" r="9" fill="var(--grey)"/>
<text class="b" x="62" y="500">Pickup</text>
<text class="b" x="376" y="500">Deliver</text>

<line x1="470" y1="150" x2="470" y2="470" stroke="var(--line)" stroke-width="2"/>

<text class="g" x="540" y="124">Sort hub</text>
<line x1="560" y1="170" x2="690" y2="290" stroke="var(--accent)" stroke-width="3"/>
<line x1="560" y1="230" x2="690" y2="290" stroke="var(--accent)" stroke-width="3"/>
<line x1="560" y1="290" x2="690" y2="290" stroke="var(--accent)" stroke-width="3"/>
<line x1="560" y1="350" x2="690" y2="290" stroke="var(--accent)" stroke-width="3"/>
<line x1="560" y1="410" x2="690" y2="290" stroke="var(--accent)" stroke-width="3"/>
<circle cx="560" cy="170" r="9" fill="var(--dim)"/>
<circle cx="560" cy="230" r="9" fill="var(--dim)"/>
<circle cx="560" cy="290" r="9" fill="var(--dim)"/>
<circle cx="560" cy="350" r="9" fill="var(--dim)"/>
<circle cx="560" cy="410" r="9" fill="var(--dim)"/>
<rect x="690" y="252" width="86" height="76" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="702" y="298">Sort</text>
<polyline points="776,280 830,200 900,180" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="776,300 830,380 900,420" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="900" cy="180" r="9" fill="var(--grey)"/>
<circle cx="862" cy="190" r="9" fill="var(--grey)"/>
<circle cx="900" cy="420" r="9" fill="var(--grey)"/>
<circle cx="862" cy="402" r="9" fill="var(--grey)"/>
<text class="b" x="824" y="306">2 routes</text>

<text class="c" x="48" y="534">Not trucks—trips</text>
</svg>
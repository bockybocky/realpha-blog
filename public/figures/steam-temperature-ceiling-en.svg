<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Two bars compare steam temperature: the waste-to-energy bar is shorter and held down by a dashed ceiling, the coal bar is higher">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Steam temperature caps efficiency</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">Boiler steam temperature</text>
<line x1="180" y1="460" x2="820" y2="460" stroke="var(--line)" stroke-width="2"/>
<rect x="280" y="240" width="150" height="220" fill="var(--accent)"/>
<rect x="560" y="130" width="150" height="330" fill="var(--grey)"/>
<text x="355" y="278" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">400°C</text>
<text x="635" y="168" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">600°C</text>
<line x1="200" y1="240" x2="800" y2="240" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="200" y="226" font-size="19" font-weight="700" fill="var(--warn)">Chlorine corrosion ceiling</text>
<text x="355" y="495" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Waste-to-energy</text>
<text x="355" y="524" font-size="16" fill="var(--dim)" text-anchor="middle">Efficiency about 30%</text>
<text x="635" y="495" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Coal plant</text>
<text x="635" y="524" font-size="16" fill="var(--dim)" text-anchor="middle">Efficiency about 40%</text>
<text x="60" y="572" font-size="22" font-weight="700" fill="var(--ink)">The ceiling is set by the plastic thrown in, not by technology</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上半四根橫條，科技那根幾乎滿格，其他三根不到一半；下半兩根橫條各約一半長。">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">倒的不是全場，是一區</text>
<text x="60" y="96" font-size="19" font-weight="700" fill="var(--dim)">跌超過 20% 的成分股比例</text>
<rect x="240" y="118" width="594" height="28" fill="var(--accent)"/>
<rect x="240" y="158" width="270" height="28" fill="var(--accent)" fill-opacity="0.5"/>
<rect x="240" y="198" width="198" height="28" fill="var(--accent)" fill-opacity="0.5"/>
<rect x="240" y="238" width="198" height="28" fill="var(--accent)" fill-opacity="0.5"/>
<text x="228" y="139" font-size="17" fill="var(--ink)" text-anchor="end">科技</text>
<text x="228" y="179" font-size="17" fill="var(--ink)" text-anchor="end">原物料</text>
<text x="228" y="219" font-size="17" fill="var(--ink)" text-anchor="end">金融</text>
<text x="228" y="259" font-size="17" fill="var(--ink)" text-anchor="end">民生必需品、公用事業</text>
<text x="846" y="139" font-size="19" font-weight="700" fill="var(--ink)">99%</text>
<text x="522" y="179" font-size="19" font-weight="700" fill="var(--ink)">45%</text>
<text x="450" y="219" font-size="19" font-weight="700" fill="var(--ink)">約三分之一</text>
<text x="450" y="259" font-size="19" font-weight="700" fill="var(--ink)">約三分之一</text>
<line x1="60" y1="296" x2="900" y2="296" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="334" font-size="19" font-weight="700" fill="var(--dim)">最低點那天，股價高於泡沫高點的比例</text>
<rect x="240" y="356" width="300" height="28" fill="var(--warn)"/>
<rect x="240" y="396" width="300" height="28" fill="var(--warn)"/>
<text x="228" y="377" font-size="17" fill="var(--ink)" text-anchor="end">金融</text>
<text x="228" y="417" font-size="17" fill="var(--ink)" text-anchor="end">非必需消費</text>
<text x="552" y="377" font-size="19" font-weight="700" fill="var(--ink)">約一半</text>
<text x="552" y="417" font-size="19" font-weight="700" fill="var(--ink)">約一半</text>
<text x="60" y="482" font-size="16" fill="var(--dim)">上下兩塊量的是不同的東西，不要放在同一條軸上比</text>
</svg>
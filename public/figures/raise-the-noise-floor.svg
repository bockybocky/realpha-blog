<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左格單一高柱突出於低噪音底，右格噪音底抬高後高柱與周圍齊平">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">乾草堆裡的針，換成一堆針</text>

  <rect x="60" y="100" width="390" height="330" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="84" y="134" font-size="20" font-weight="700" fill="var(--dim)">乾草堆</text>
  <g fill="var(--grey)">
    <rect x="96" y="372" width="26" height="18"/><rect x="136" y="366" width="26" height="24"/>
    <rect x="176" y="374" width="26" height="16"/><rect x="216" y="368" width="26" height="22"/>
    <rect x="296" y="372" width="26" height="18"/><rect x="336" y="366" width="26" height="24"/>
    <rect x="376" y="374" width="26" height="16"/>
  </g>
  <rect x="256" y="180" width="26" height="210" fill="var(--warn)"/>
  <path d="M 269 160 L 269 100" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="t" x="269" y="170" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="middle">一根</text>
  <path d="M 72 390 L 438 390" stroke="var(--ink)" stroke-width="2"/>
  <text class="t" x="255" y="416" font-size="15" fill="var(--dim)" text-anchor="middle">噪音底很低</text>

  <rect x="510" y="100" width="390" height="330" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="534" y="134" font-size="20" font-weight="700" fill="var(--accent)">一堆針</text>
  <g fill="var(--grey)">
    <rect x="540" y="186" width="26" height="204"/><rect x="580" y="196" width="26" height="194"/>
    <rect x="620" y="180" width="26" height="210"/><rect x="660" y="192" width="26" height="198"/>
    <rect x="740" y="184" width="26" height="206"/><rect x="780" y="198" width="26" height="192"/>
    <rect x="820" y="188" width="26" height="202"/><rect x="860" y="194" width="26" height="196"/>
  </g>
  <rect x="700" y="190" width="26" height="200" fill="var(--accent)"/>
  <path d="M 522 390 L 888 390" stroke="var(--ink)" stroke-width="2"/>
  <text class="t" x="705" y="416" font-size="15" fill="var(--dim)" text-anchor="middle">噪音底抬高，混在裡面</text>
  <text class="t" x="480" y="478" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">沒鑽到噪音底下，而是站進噪音裡</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Two bars aligned one above the other each end in a small blue sliver on the right, standing for people who identify only as Chinese and for investment going to China.">
<rect x="0" y="0" width="960" height="480" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700">Both down to a sliver</text>
<text x="80" y="150" font-size="20" font-weight="700">Identity</text>
<rect x="80" y="165" width="520" height="72" fill="var(--grey)"/>
<rect x="600" y="165" width="240" height="72" fill="var(--line)"/>
<rect x="840" y="165" width="40" height="72" fill="var(--accent)"/>
<text x="340" y="207" text-anchor="middle" font-size="16">Taiwanese 65%</text>
<text x="720" y="207" text-anchor="middle" font-size="16">Both 30%</text>
<text x="880" y="265" text-anchor="end" font-size="16" font-weight="700" style="fill:var(--accent)">Chinese only 5%</text>
<text x="80" y="330" font-size="20" font-weight="700">Outbound</text>
<rect x="80" y="345" width="760" height="72" fill="var(--grey)"/>
<rect x="840" y="345" width="40" height="72" fill="var(--accent)"/>
<text x="460" y="387" text-anchor="middle" font-size="16">Elsewhere 95%</text>
<text x="880" y="445" text-anchor="end" font-size="16" font-weight="700" style="fill:var(--accent)">To China 5%</text>
</svg>
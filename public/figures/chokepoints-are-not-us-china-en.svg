<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="A narrow US-China standoff band sits above two cards listing European and Japanese sole-supplier segments with nearly full bars.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--dim); }
.b { font-size:16px; fill:var(--ink); }
.s { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
<text class="t" x="60" y="58">The camera is here, the chokepoint is there</text>

<rect x="60" y="88" width="840" height="76" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="82" y="133">The visible standoff</text>
<rect x="520" y="104" width="110" height="44" rx="6" fill="var(--page)" stroke="var(--dim)"/>
<text class="b" x="552" y="132">US</text>
<rect x="720" y="104" width="110" height="44" rx="6" fill="var(--page)" stroke="var(--dim)"/>
<text class="b" x="752" y="132">China</text>
<line x1="644" y1="126" x2="706" y2="126" stroke="var(--dim)" stroke-width="2"/>
<path d="M638 126 l12 -6 l0 12 z" fill="var(--dim)"/>
<path d="M712 126 l-12 -6 l0 12 z" fill="var(--dim)"/>

<rect x="60" y="200" width="400" height="300" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="90" y="240">Netherlands・Germany</text>
<text class="b" x="90" y="288">EUV lithography　one supplier only</text>
<rect x="90" y="300" width="340" height="10" rx="5" fill="var(--line)"/>
<rect x="90" y="300" width="340" height="10" rx="5" fill="var(--accent)"/>
<text class="b" x="90" y="368">Optics・laser sources　two suppliers</text>
<rect x="90" y="380" width="340" height="10" rx="5" fill="var(--line)"/>
<rect x="90" y="380" width="340" height="10" rx="5" fill="var(--accent)"/>

<rect x="500" y="200" width="400" height="300" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="530" y="240">Japan</text>
<text class="b" x="530" y="284">EUV resist　4 firms, over 90%</text>
<rect x="530" y="294" width="340" height="10" rx="5" fill="var(--line)"/>
<rect x="530" y="294" width="308" height="10" rx="5" fill="var(--accent)"/>
<text class="b" x="530" y="344">Coater developers　over 90%</text>
<rect x="530" y="354" width="340" height="10" rx="5" fill="var(--line)"/>
<rect x="530" y="354" width="308" height="10" rx="5" fill="var(--accent)"/>
<text class="b" x="530" y="404">Mask inspection　100%</text>
<rect x="530" y="414" width="340" height="10" rx="5" fill="var(--line)"/>
<rect x="530" y="414" width="340" height="10" rx="5" fill="var(--accent)"/>
<text class="b" x="530" y="464">Mask blanks　about 93%</text>
<rect x="530" y="474" width="340" height="10" rx="5" fill="var(--line)"/>
<rect x="530" y="474" width="316" height="10" rx="5" fill="var(--accent)"/>

<text class="c" x="60" y="560">The most fragile row is off camera</text>
</svg>
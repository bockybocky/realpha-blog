<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊兩美元柱子頂端的利息只有一條幾乎看不見的細線，右邊同高的方塊是馬上拿得到的薯片與汽水">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">存了半年，多出來的那一條線</text>
<line x1="60" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="3"/>
<rect x="150" y="160" width="150" height="240" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="157" width="150" height="3" fill="var(--warn)"/>
<line x1="320" y1="158" x2="420" y2="120" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="424" y="114" style="fill:var(--warn)">利息 ＄0.01</text>
<text class="g" x="150" y="140">每月兩毛五</text>
<text class="s" x="150" y="432">半年後拿回 ＄2.00</text>
<polygon points="470,270 540,270 540,250 580,280 540,310 540,290 470,290" fill="var(--grey)"/>
<rect x="640" y="160" width="110" height="240" fill="var(--accent)"/>
<rect x="770" y="160" width="110" height="240" fill="var(--accent)"/>
<text class="g" x="648" y="432">薯片</text>
<text class="g" x="778" y="432">汽水</text>
<text class="s" x="640" y="140">同樣 ＄2.00，現在就有</text>
<text class="c" x="60" y="496">看得見的那一邊贏了四十年</text>
</svg>
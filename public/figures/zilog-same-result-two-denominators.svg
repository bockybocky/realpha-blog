<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一筆成果放在兩個分母上，在大分母上只剩一絲，在小分母上衝出框外">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">同一份成績，兩個分母</text>
  <text x="60" y="96" font-size="16" fill="var(--dim)">Zilog 一九九七年售出 · 億美元</text>

  <text x="60" y="160" font-size="19" font-weight="700" fill="var(--ink)">放進埃克森</text>
  <text x="60" y="184" font-size="15" fill="var(--dim)">分母 840</text>
  <rect x="60" y="200" width="760" height="54" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="200" width="5" height="54" rx="2" fill="var(--accent)"/>
  <line x1="66" y1="227" x2="180" y2="227" stroke="var(--grey)" stroke-width="2"/>
  <text x="190" y="233" font-size="16" fill="var(--dim)">5.27</text>

  <text x="60" y="330" font-size="19" font-weight="700" fill="var(--ink)">放進一個基金部位</text>
  <text x="60" y="354" font-size="15" fill="var(--dim)">分母 0.17</text>
  <rect x="60" y="370" width="760" height="54" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="370" width="790" height="54" rx="8" fill="var(--accent)" opacity="0.85"/>
  <polygon points="850,370 900,397 850,424" fill="var(--accent)"/>
  <text x="90" y="404" font-size="20" font-weight="700" fill="var(--page)">12 倍</text>

  <text x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">成績沒變，變的是底下那個數</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="五階上升階梯，前三階是已發生的數字，後兩階虛線是目標">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="58" font-size="27" fill="var(--ink)">下市那年不是終點</text>

  <line x1="100" y1="470" x2="900" y2="470" stroke="var(--line)"/>

  <rect x="110" y="420" width="150" height="50" fill="var(--grey)"/>
  <text x="185" y="408" font-size="16" fill="var(--dim)" text-anchor="middle">1999 就任</text>
  <text x="185" y="452" font-size="16" fill="var(--page)" text-anchor="middle">50 億・虧錢</text>

  <rect x="266" y="340" width="150" height="130" fill="var(--grey)"/>
  <text x="341" y="328" font-size="16" fill="var(--dim)" text-anchor="middle">MBO 前</text>
  <text x="341" y="376" font-size="16" fill="var(--page)" text-anchor="middle">220 億</text>
  <text x="341" y="400" font-size="16" fill="var(--page)" text-anchor="middle">利益率 20% 以上</text>

  <rect x="422" y="244" width="150" height="226" fill="var(--accent)"/>
  <text x="497" y="232" font-size="16" fill="var(--accent)" text-anchor="middle">非公開三年</text>
  <text x="497" y="282" font-size="16" fill="var(--page)" text-anchor="middle">300 億</text>
  <text x="497" y="306" font-size="16" fill="var(--page)" text-anchor="middle">利潤 90 億</text>
  <text x="497" y="330" font-size="16" fill="var(--page)" text-anchor="middle">利益率 30%</text>

  <rect x="578" y="176" width="150" height="294" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="653" y="164" font-size="16" fill="var(--warn)" text-anchor="middle">再三年</text>
  <text x="653" y="222" font-size="16" fill="var(--warn)" text-anchor="middle">500 億</text>

  <rect x="734" y="120" width="150" height="350" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="809" y="108" font-size="16" fill="var(--warn)" text-anchor="middle">八年</text>
  <text x="809" y="168" font-size="16" fill="var(--warn)" text-anchor="middle">1000 億</text>

  <text x="480" y="524" font-size="22" fill="var(--ink)" text-anchor="middle">先喊出來，再被自己逼著想辦法</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="速度與普及度呈交叉：快的機器台數少，慢的機器台數多">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62">快的那台，和到得了的那台</text>
  <text class="b" x="330" y="112">每秒運算次數</text>
  <text class="b" x="660" y="112">量產台數</text>
  <line x1="620" y1="92" x2="620" y2="430" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="60" y="178">STRELA、BESM</text>
  <rect x="330" y="156" width="250" height="30" rx="4" fill="var(--grey)"/>
  <text class="b" x="330" y="214">8,000 到 10,000</text>
  <rect x="660" y="156" width="18" height="30" rx="4" fill="var(--grey)"/>
  <text class="b" x="690" y="178">7 台</text>
  <text class="g" x="60" y="300">Ural-1</text>
  <rect x="330" y="278" width="10" height="30" rx="4" fill="var(--accent)"/>
  <text class="b" x="350" y="300">100</text>
  <rect x="660" y="278" width="230" height="30" rx="4" fill="var(--accent)"/>
  <text class="b" x="660" y="336">183 台、128 座以上城市</text>
  <path d="M330 196 C480 200 480 280 580 292" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="c" x="60" y="470">同級對手不是它，市場也不是</text>
</svg>
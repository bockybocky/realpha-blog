<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" role="img" aria-label="On the left, a large field of gray dots has only one lit up, and on the right, two of five human figures are lit up.">
<rect x="0" y="0" width="960" height="550" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<defs><pattern id="dots5" x="71" y="156" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="6" fill="var(--grey)"/></pattern></defs>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700">Few remember, many suspect</text>
<text x="251" y="130" text-anchor="middle" font-size="19" style="fill:var(--dim)">Per 200</text>
<rect x="71" y="156" width="360" height="180" fill="url(#dots5)"/>
<circle cx="422" cy="327" r="7" fill="var(--page)"/>
<circle cx="422" cy="327" r="6" fill="var(--accent)"/>
<text x="251" y="380" text-anchor="middle" font-size="16">Saw big war</text>
<text x="251" y="418" text-anchor="middle" font-size="22" font-weight="700" style="fill:var(--accent)">Under 1</text>
<line x1="480" y1="110" x2="480" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="705" y="130" text-anchor="middle" font-size="19" style="fill:var(--dim)">Per 5 in US</text>
<circle cx="565" cy="200" r="16" fill="var(--warn)"/><rect x="543" y="224" width="44" height="76" rx="20" fill="var(--warn)"/>
<circle cx="635" cy="200" r="16" fill="var(--warn)"/><rect x="613" y="224" width="44" height="76" rx="20" fill="var(--warn)"/>
<circle cx="705" cy="200" r="16" fill="var(--grey)"/><rect x="683" y="224" width="44" height="76" rx="20" fill="var(--grey)"/>
<circle cx="775" cy="200" r="16" fill="var(--grey)"/><rect x="753" y="224" width="44" height="76" rx="20" fill="var(--grey)"/>
<circle cx="845" cy="200" r="16" fill="var(--grey)"/><rect x="823" y="224" width="44" height="76" rx="20" fill="var(--grey)"/>
<text x="705" y="380" text-anchor="middle" font-size="16">War w/ China ≤5y</text>
<text x="705" y="418" text-anchor="middle" font-size="22" font-weight="700" style="fill:var(--warn)">2</text>
<text x="480" y="510" text-anchor="middle" font-size="22" font-weight="700">Unafraid, yet wary</text>
</svg>
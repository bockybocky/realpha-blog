<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="通膨與成長切成的九宮格裡，只有通膨高、成長高那一格被標亮並標著今天與年化只正四十個基點，其餘八格留空">
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .gd { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .w { font-size:19px; fill:var(--warn); }
    .a { font-size:19px; fill:var(--accent); }
  </style>
  <text class="t" x="60" y="66">格子決定籌碼，技術面決定時機</text>
  <rect x="200" y="140" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="350" y="140" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="200" y="240" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="350" y="240" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="240" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="200" y="340" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="350" y="340" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="340" width="150" height="100" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="140" width="150" height="100" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="530" cy="178" r="7" fill="var(--accent)"/>
  <text class="a" x="548" y="186">今天</text>
  <text class="b" x="514" y="222">年化只正 40 基點</text>
  <text class="b" x="140" y="200">通膨 高</text>
  <text class="b" x="140" y="300">通膨 中</text>
  <text class="b" x="140" y="400">通膨 低</text>
  <text class="b" x="240" y="472">成長 低</text>
  <text class="b" x="390" y="472">成長 中</text>
  <text class="b" x="540" y="472">成長 高</text>
  <line x1="700" y1="150" x2="700" y2="430" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="724" y="220">油：籌碼多寡</text>
  <text class="g" x="724" y="268">火花：技術面</text>
  <text class="c" x="60" y="534">條件和扣扳機要分開</text>
</svg>
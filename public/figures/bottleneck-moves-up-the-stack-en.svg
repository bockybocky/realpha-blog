<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Three stacks, each taller than the last, with the dashed bottleneck marker moving up one layer at each step.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="60" y="64" font-size="27" fill="var(--ink)">The bottleneck keeps moving up</text>
  <rect x="742" y="44" width="30" height="20" rx="4" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="782" y="60" font-size="15" fill="var(--dim)">Current bottleneck</text>

  <rect x="80" y="404" width="220" height="66" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="190" y="444" font-size="19" fill="var(--ink)" text-anchor="middle">Tools</text>
  <rect x="80" y="328" width="220" height="66" rx="8" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="190" y="368" font-size="19" fill="var(--warn)" text-anchor="middle">OS</text>
  <text x="190" y="508" font-size="16" fill="var(--dim)" text-anchor="middle">Tools first</text>

  <line x1="312" y1="361" x2="352" y2="361" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="352,354 366,361 352,368" fill="var(--grey)"/>

  <rect x="370" y="404" width="220" height="66" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="480" y="444" font-size="19" fill="var(--ink)" text-anchor="middle">Tools</text>
  <rect x="370" y="328" width="220" height="66" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="480" y="368" font-size="19" fill="var(--ink)" text-anchor="middle">OS</text>
  <rect x="370" y="252" width="220" height="66" rx="8" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="480" y="292" font-size="19" fill="var(--warn)" text-anchor="middle">Full stack</text>
  <text x="480" y="508" font-size="16" fill="var(--dim)" text-anchor="middle">Pushed into building the OS</text>

  <line x1="602" y1="361" x2="642" y2="361" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="642,354 656,361 642,368" fill="var(--grey)"/>

  <rect x="660" y="404" width="220" height="66" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="770" y="444" font-size="19" fill="var(--ink)" text-anchor="middle">Tools</text>
  <rect x="660" y="328" width="220" height="66" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="770" y="368" font-size="19" fill="var(--ink)" text-anchor="middle">OS</text>
  <rect x="660" y="252" width="220" height="66" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="770" y="292" font-size="19" fill="var(--ink)" text-anchor="middle">Full stack</text>
  <text x="770" y="508" font-size="16" fill="var(--dim)" text-anchor="middle">Then the whole solution</text>

  <text x="480" y="556" font-size="22" fill="var(--ink)" text-anchor="middle">A bottleneck is not a coordinate. It is a rope pulling you forward.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two boxes with arrows pointing to a box in the middle, where the two directions meet">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="80" y="76" font-size="27">Meet in the middle</text>
  <rect x="40" y="210" width="250" height="120" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text x="165" y="262" font-size="20" text-anchor="middle">What models do</text>
  <text x="165" y="294" font-size="15" fill="var(--dim)" text-anchor="middle">Next-token prediction</text>
  <rect x="670" y="210" width="250" height="120" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text x="795" y="262" font-size="20" text-anchor="middle">Customer pain</text>
  <text x="795" y="294" font-size="15" fill="var(--dim)" text-anchor="middle">Who pays</text>
  <rect x="380" y="188" width="200" height="164" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="480" y="248" font-size="22" fill="var(--accent)" text-anchor="middle">Law</text>
  <text x="480" y="286" font-size="15" fill="var(--dim)" text-anchor="middle">Structured language</text>
  <text x="480" y="312" font-size="15" fill="var(--dim)" text-anchor="middle">Searchable case law</text>
  <text x="334" y="248" font-size="15" fill="var(--dim)" text-anchor="middle">From ability</text>
  <line x1="296" y1="272" x2="364" y2="272" stroke="var(--accent)" stroke-width="2.5"/>
  <polygon points="364,265 378,272 364,279" fill="var(--accent)"/>
  <text x="626" y="248" font-size="15" fill="var(--dim)" text-anchor="middle">From problem</text>
  <line x1="664" y1="272" x2="596" y2="272" stroke="var(--accent)" stroke-width="2.5"/>
  <polygon points="596,265 582,272 596,279" fill="var(--accent)"/>
  <text x="480" y="430" font-size="22" text-anchor="middle">One side alone bends</text>
</svg>
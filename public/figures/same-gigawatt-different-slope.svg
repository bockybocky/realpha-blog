<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條斜率極端不同的線爬到同一個高度">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; font-weight:700; fill:var(--ink); }
    .g  { font-size:20px; font-weight:600; }
    .b  { font-size:16px; fill:var(--dim); }
    .c  { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">一樣的一個 GW，兩種坡度</text>

<line x1="150" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="120" x2="150" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="150" x2="880" y2="150" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="790" y="140">一個 GW</text>

<path d="M150 430 L 205 150" fill="none" stroke="var(--warn)" stroke-width="4"/>
<circle cx="205" cy="150" r="6" fill="var(--warn)"/>
<text class="g" x="228" y="196" fill="var(--warn)">十八個月</text>
<text class="b" x="228" y="220">一次砸下來</text>

<path d="M150 430 C 400 400, 650 260, 830 150" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="830" cy="150" r="6" fill="var(--accent)"/>
<text class="g" x="600" y="332" fill="var(--accent)">二十年</text>
<text class="b" x="600" y="356">水上運動中心、學校</text>
<text class="b" x="600" y="380">失業率 9% 到 6%</text>

<text class="b" x="150" y="466">開始</text>
<text class="b" x="820" y="466">蓋完</text>

<text class="c" x="60" y="510">面積一樣，人的感受不在面積上</text>
</svg>
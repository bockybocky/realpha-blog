<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三個不同動機的方塊用箭頭匯聚到右邊同一句話，底下標明只算一票">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="66">三張嘴，一塊蛋糕</text>

<rect x="60" y="110" width="290" height="88" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="82" y="148">領先者 A</text>
<text class="s" x="82" y="176">要把後面的人擋在門外</text>

<rect x="60" y="238" width="290" height="88" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="82" y="276">領先者 B</text>
<text class="s" x="82" y="304">要把後面的人擋在門外</text>

<rect x="60" y="366" width="290" height="88" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="82" y="404">追趕者</text>
<text class="s" x="82" y="432">要前面的人踩剎車</text>

<path d="M350 154 C 460 154, 480 262, 560 272" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M350 282 C 460 282, 480 282, 560 282" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M350 410 C 460 410, 480 302, 560 292" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M566 282 l-14 -7 v14 z" fill="var(--grey)"/>

<rect x="580" y="212" width="320" height="140" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="606" y="262" fill="var(--accent)">同一句話</text>
<text class="s" x="606" y="296">大家一起慢下來</text>
<text class="s" x="606" y="326">吃的是同一塊蛋糕</text>

<text class="c" x="580" y="416">併成一票</text>
<text class="s" x="580" y="446">不是三票</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The earnings line stays flat while the price line drops sharply and then recovers, so the two lines move in completely different ways.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">The story fell, the earnings did not</text>
<line x1="120" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="120" y="498" font-size="15" fill="var(--dim)">March</text>
<text class="t" x="330" y="498" font-size="15" fill="var(--dim)">April</text>
<text class="t" x="820" y="498" font-size="15" fill="var(--dim)">Sep</text>
<line x1="130" y1="270" x2="860" y2="270" stroke="var(--grey)" stroke-width="3"/>
<text class="t" x="600" y="258" font-size="19" fill="var(--dim)">EPS</text>
<path d="M130 270 L230 300 L300 420 L400 430 L520 380 L680 300 L860 190" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="640" y="248" font-size="19" fill="var(--accent)">Px</text>
<circle cx="300" cy="420" r="6" fill="var(--accent)"/>
<text class="t" x="228" y="452" font-size="15" fill="var(--ink)">SaaS</text>
<circle cx="400" cy="430" r="6" fill="var(--accent)"/>
<text class="t" x="420" y="452" font-size="15" fill="var(--ink)">Cyber</text>
<text class="t" x="60" y="530" font-size="22" fill="var(--ink)">Numbers held, imagination moved</text>
</svg>
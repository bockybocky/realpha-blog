<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條由左到右的工序長條，最左段最長，現在的標記落在這段裡，半年的虛線停在倒數第二段，碰不到最右邊那段" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="64" y="66" font-size="27" font-weight="700" fill="var(--ink)">產能的時間刻度</text>
<text x="64" y="98" font-size="16" fill="var(--dim)">宣布之後到出貨之前，有幾段拿不掉的工序</text>

<text x="170" y="196" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">現在</text>
<line x1="170" y1="208" x2="170" y2="264" stroke="var(--accent)" stroke-width="2"/>
<path d="M162 252 L178 252 L170 268 Z" fill="var(--accent)"/>

<rect x="64" y="276" width="300" height="72" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="372" y="276" width="150" height="72" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="530" y="276" width="150" height="72" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="688" y="276" width="208" height="72" rx="10" fill="var(--card)" stroke="var(--line)"/>

<text x="214" y="320" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">蓋無塵室</text>
<text x="447" y="320" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">進機台</text>
<text x="605" y="320" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">試產</text>
<text x="792" y="320" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">出貨</text>

<line x1="64" y1="380" x2="896" y2="380" stroke="var(--line)" stroke-width="2"/>

<line x1="656" y1="160" x2="656" y2="412" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text x="656" y="146" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">半年</text>
<text x="656" y="408" font-size="15" fill="var(--dim)" text-anchor="middle">還在這裡</text>

<text x="480" y="470" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">加錢能壓短，順序改不了</text>
</svg>
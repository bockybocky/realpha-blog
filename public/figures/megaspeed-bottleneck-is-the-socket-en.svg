<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two full rows of blocks at the top stand for the chips you can buy, the middle narrows into a very tight funnel mouth labeled the places you can plug in, and only two blocks fall out below the funnel.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="52">Got chips, not running</text>
  <text class="g" x="60" y="100" text-anchor="start">Chips available (rough)</text>
  <rect x="120" y="116" width="80" height="36" rx="4" fill="var(--grey)"/>
  <rect x="220" y="116" width="80" height="36" rx="4" fill="var(--grey)"/>
  <rect x="320" y="116" width="80" height="36" rx="4" fill="var(--grey)"/>
  <rect x="420" y="116" width="80" height="36" rx="4" fill="var(--grey)"/>
  <rect x="520" y="116" width="80" height="36" rx="4" fill="var(--grey)"/>
  <rect x="620" y="116" width="80" height="36" rx="4" fill="var(--grey)"/>
  <rect x="720" y="116" width="80" height="36" rx="4" fill="var(--grey)"/>
  <rect x="120" y="160" width="80" height="36" rx="4" fill="var(--grey)"/>
  <rect x="220" y="160" width="80" height="36" rx="4" fill="var(--grey)"/>
  <rect x="320" y="160" width="80" height="36" rx="4" fill="var(--grey)"/>
  <rect x="420" y="160" width="80" height="36" rx="4" fill="var(--grey)"/>
  <rect x="520" y="160" width="80" height="36" rx="4" fill="var(--grey)"/>
  <rect x="620" y="160" width="80" height="36" rx="4" fill="var(--grey)"/>
  <rect x="720" y="160" width="80" height="36" rx="4" fill="var(--grey)"/>
  <polygon points="160,214 800,214 540,320 420,320" fill="var(--accent)" opacity="0.18"/>
  <polygon points="160,214 800,214 540,320 420,320" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="480" y="350" text-anchor="middle" fill="var(--accent)">Places to plug</text>
  <rect x="400" y="378" width="80" height="36" rx="4" fill="var(--accent)"/>
  <rect x="500" y="378" width="80" height="36" rx="4" fill="var(--accent)"/>
  <text class="g" x="480" y="450" text-anchor="middle">Actually run</text>
  <text class="n" x="648" y="400" text-anchor="start">SEA has power</text>
  <text class="c" x="60" y="516">If sockets bind, plugs win</text>
</svg>
<svg id="fig-iltb-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊箱子進出即空代表消費，右邊箱子堆滿而出口是虛線代表囤給未來的投機">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
#fig-iltb-8 text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-iltb-8 .t { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-iltb-8 .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-iltb-8 .b { font-size:16px; fill:var(--dim); }
#fig-iltb-8 .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<defs>
<marker id="ar8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="var(--accent)"/></marker>
<marker id="ar8b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="var(--grey)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="52">買來就用掉，還是囤著等未來</text>

<line x1="90" y1="220" x2="168" y2="220" stroke="var(--accent)" stroke-width="4" marker-end="url(#ar8)"/>
<rect x="180" y="150" width="140" height="130" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="232" y="246" width="36" height="24" fill="var(--grey)"/>
<line x1="332" y1="220" x2="410" y2="220" stroke="var(--accent)" stroke-width="4" marker-end="url(#ar8)"/>
<text class="b" x="420" y="200">立刻燒掉</text>
<text class="g" x="250" y="330" text-anchor="middle">消費</text>
<text class="b" x="250" y="362" text-anchor="middle">沒有人囤 token</text>

<line x1="530" y1="220" x2="608" y2="220" stroke="var(--accent)" stroke-width="4" marker-end="url(#ar8)"/>
<rect x="620" y="140" width="140" height="140" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="634" y="164" width="36" height="24" fill="var(--grey)"/>
<rect x="676" y="164" width="36" height="24" fill="var(--grey)"/>
<rect x="718" y="164" width="36" height="24" fill="var(--grey)"/>
<rect x="634" y="196" width="36" height="24" fill="var(--grey)"/>
<rect x="676" y="196" width="36" height="24" fill="var(--grey)"/>
<rect x="718" y="196" width="36" height="24" fill="var(--grey)"/>
<rect x="634" y="228" width="36" height="24" fill="var(--grey)"/>
<rect x="676" y="228" width="36" height="24" fill="var(--grey)"/>
<rect x="718" y="228" width="36" height="24" fill="var(--grey)"/>
<line x1="772" y1="220" x2="850" y2="220" stroke="var(--grey)" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#ar8b)"/>
<text class="b" x="860" y="200">等未來的使用者</text>
<text class="g" x="690" y="330" text-anchor="middle">投機</text>
<text class="b" x="690" y="362" text-anchor="middle">蓋給沒來的人</text>

<text class="c" x="60" y="472">這把尺可以量你手上任何一個持股的下游需求</text>
</svg>
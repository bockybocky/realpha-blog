<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three lanes run toward one gate: one passes far through, one has just cleared it, one stops in front of it.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">One supply gate — who got through</text>
<rect x="560" y="120" width="22" height="310" fill="var(--grey)"/>
<text x="571" y="104" text-anchor="middle" font-size="20" fill="var(--ink)">Power, substrates, memory</text>
<text x="80" y="187" font-size="19" fill="var(--ink)">AMD</text>
<line x1="170" y1="180" x2="836" y2="180" stroke="var(--accent)" stroke-width="4"/>
<polygon points="836,170 862,180 836,190" fill="var(--accent)"/>
<text x="620" y="158" font-size="16" fill="var(--dim)">Raised it first on the call</text>
<text x="80" y="277" font-size="19" fill="var(--ink)">Arm</text>
<line x1="170" y1="270" x2="646" y2="270" stroke="var(--accent)" stroke-width="4"/>
<polygon points="646,260 672,270 646,280" fill="var(--accent)"/>
<text x="620" y="248" font-size="16" fill="var(--dim)">Tone eased this quarter</text>
<text x="80" y="367" font-size="19" fill="var(--ink)">Intel</text>
<line x1="170" y1="360" x2="516" y2="360" stroke="var(--warn)" stroke-width="4"/>
<line x1="506" y1="344" x2="538" y2="376" stroke="var(--warn)" stroke-width="4"/>
<line x1="538" y1="344" x2="506" y2="376" stroke="var(--warn)" stroke-width="4"/>
<text x="330" y="336" font-size="16" fill="var(--warn)">Stopped at the gate</text>
<text x="480" y="476" text-anchor="middle" font-size="22" fill="var(--ink)">With supply you pass; without it you jam at the same door</text>
</svg>
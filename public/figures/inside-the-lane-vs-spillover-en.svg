<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="In the top panel the heat stays inside the lane and the national numbers stay put; in the bottom it breaks out into other industries and the aggregates move">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<defs>
  <marker id="arw-f4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/></marker>
  <marker id="arw-f4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker>
</defs>
<text x="48" y="62" font-size="27" fill="var(--ink)">Fierce competition isn't overheating; leaving the lane is</text>

<text x="48" y="132" font-size="20" fill="var(--ink)">Heat inside the lane: one gains, another loses</text>
<rect x="120" y="150" width="500" height="100" fill="var(--card)" stroke="var(--line)" rx="8"/>
<text x="146" y="186" font-size="19" fill="var(--ink)">AI construction lane</text>
<text x="146" y="218" font-size="16" fill="var(--dim)">Electricians　Land　Engineering　Power</text>
<path d="M470,180 C560,180 560,225 470,225" fill="none" stroke="var(--grey)" stroke-width="3" marker-end="url(#arw-f4a)"/>
<text x="660" y="188" font-size="19" fill="var(--dim)">National unemployment・GDP</text>
<text x="660" y="220" font-size="22" fill="var(--dim)">Unmoved</text>

<text x="48" y="312" font-size="20" fill="var(--ink)">Heat spills outside the lane: the aggregate is pushed up</text>
<text x="370" y="352" font-size="19" fill="var(--warn)" text-anchor="middle">Wages and prices outside the lane</text>
<rect x="120" y="370" width="500" height="100" fill="var(--card)" stroke="var(--line)" rx="8"/>
<text x="146" y="406" font-size="19" fill="var(--ink)">AI construction lane</text>
<text x="146" y="438" font-size="16" fill="var(--dim)">Electricians　Land　Engineering　Power</text>
<line x1="300" y1="370" x2="300" y2="336" stroke="var(--warn)" stroke-width="3" marker-end="url(#arw-f4b)"/>
<line x1="440" y1="370" x2="440" y2="336" stroke="var(--warn)" stroke-width="3" marker-end="url(#arw-f4b)"/>
<text x="660" y="408" font-size="19" fill="var(--dim)">National unemployment・GDP</text>
<text x="660" y="440" font-size="22" fill="var(--warn)">Then it moves</text>

<text x="480" y="536" font-size="22" fill="var(--ink)" text-anchor="middle">Read the news and ask: has the heat left the lane</text>
</svg>
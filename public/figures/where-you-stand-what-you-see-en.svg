<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The high vantage's cone of vision covers the whole long decline, while the low vantage's cone covers only a short dip and rebound, with the rest greyed out.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="66" font-size="27" fill="var(--ink)">The same tsunami, seen from different places</text>

  <rect x="60" y="110" width="400" height="340" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="110" width="400" height="340" fill="var(--card)" stroke="var(--line)"/>

  <text class="t" x="80" y="148" font-size="20" fill="var(--accent)">Macro vantage</text>
  <text class="t" x="520" y="148" font-size="20" fill="var(--accent)">Industry vantage</text>

  <circle cx="100" cy="190" r="8" fill="var(--accent)"/>
  <polygon points="100,190 440,240 440,430" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="1"/>
  <polyline points="100,250 170,262 240,300 310,368 380,404 440,412" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <text class="t" x="440" y="188" font-size="16" fill="var(--dim)" text-anchor="end">Delinquency . inventory . new homes</text>
  <text class="t" x="260" y="434" font-size="16" fill="var(--ink)" text-anchor="middle">Sees: a whole cycle sinking</text>

  <polyline points="520,300 570,306 620,336 660,348" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 6"/>
  <polyline points="660,348 700,372 740,330 790,286 860,258" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <circle cx="700" cy="418" r="8" fill="var(--warn)"/>
  <polygon points="700,418 660,352 790,290" fill="var(--warn)" fill-opacity="0.12" stroke="var(--warn)" stroke-width="1"/>
  <text class="t" x="560" y="286" font-size="16" fill="var(--grey)">Cannot see</text>
  <text class="t" x="820" y="238" font-size="16" fill="var(--ink)" text-anchor="middle">Stronger</text>
  <text class="t" x="700" y="440" font-size="16" fill="var(--ink)" text-anchor="middle">Sees: solar and LED dip then recover</text>

  <text class="t" x="60" y="510" font-size="22" fill="var(--ink)">Where you stand decides which disaster you can see</text>
</svg>
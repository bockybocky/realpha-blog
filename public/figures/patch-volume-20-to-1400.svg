<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩根柱子，左邊幾乎看不見，右邊非常高">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--dim); }
    .n { font-size:27px; fill:var(--ink); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="70">微軟每月更新量</text>
  <line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>

  <rect x="200" y="424" width="160" height="6" fill="var(--grey)"/>
  <text class="n" x="200" y="408">20</text>
  <text class="g" x="200" y="466">二十年前</text>

  <rect x="600" y="130" width="160" height="300" fill="var(--accent)"/>
  <text class="n" x="600" y="112">1,400</text>
  <text class="g" x="600" y="466">現在</text>

  <text class="c" x="60" y="516">同一個團隊，同一個月</text>
</svg>
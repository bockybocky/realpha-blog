<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three bars above and below a zero line, with only Brent pointing down and the other two far up.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700 }
.g { font-size:20px; fill:var(--ink); font-weight:600 }
.b { font-size:16px; fill:var(--dim) }
.n { font-size:22px; fill:var(--ink); font-weight:700 }
.c { font-size:22px; fill:var(--ink); font-weight:600 }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56">Only one of them went down</text>
<line x1="120" y1="360" x2="920" y2="360" stroke="var(--ink)" stroke-width="2"/>
<text class="b" x="120" y="386">Pre-war level</text>
<rect x="220" y="360" width="120" height="62" fill="var(--accent)"/>
<text class="n" x="280" y="446" text-anchor="middle" fill="var(--accent)">−17%</text>
<text class="g" x="280" y="478" text-anchor="middle">Brent</text>
<rect x="460" y="210" width="120" height="150" fill="var(--warn)"/>
<text class="n" x="520" y="192" text-anchor="middle" fill="var(--warn)">+85%</text>
<text class="g" x="520" y="478" text-anchor="middle">Diesel retail</text>
<rect x="700" y="120" width="120" height="240" fill="var(--warn)"/>
<polyline points="700,132 730,120 760,132 790,120 820,132" fill="none" stroke="var(--page)" stroke-width="5"/>
<text class="n" x="760" y="104" text-anchor="middle" fill="var(--warn)">About 20x</text>
<text class="g" x="760" y="478" text-anchor="middle">Tanker rates</text>
<text class="c" x="60" y="518">Headline cools, spreads scream</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Five short curves that climb only a little on the left, and one curve that rises all the way on the right.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="40" y="58">Five short, one long</text>
<line x1="60" y1="430" x2="440" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="60" y1="150" x2="60" y2="430" stroke="var(--line)" stroke-width="2"/>
<path d="M60 430 Q96 418 130 404" fill="none" stroke="var(--grey)" stroke-width="6"/>
<path d="M60 430 Q96 420 130 410" fill="none" stroke="var(--grey)" stroke-width="6"/>
<path d="M60 430 Q96 422 130 414" fill="none" stroke="var(--grey)" stroke-width="6"/>
<path d="M60 430 Q96 424 130 419" fill="none" stroke="var(--grey)" stroke-width="6"/>
<path d="M60 430 Q96 426 130 423" fill="none" stroke="var(--grey)" stroke-width="6"/>
<circle cx="130" cy="404" r="6" fill="var(--grey)"/>
<circle cx="130" cy="423" r="6" fill="var(--grey)"/>
<text class="g" x="150" y="414">All five moving</text>
<text class="b" x="150" y="444">Progress on each</text>
<line x1="520" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="520" y1="150" x2="520" y2="430" stroke="var(--line)" stroke-width="2"/>
<path d="M520 430 Q700 424 790 330 Q870 240 890 160" fill="none" stroke="var(--accent)" stroke-width="8"/>
<circle cx="890" cy="160" r="9" fill="var(--accent)"/>
<line x1="590" y1="150" x2="590" y2="430" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 6"/>
<text class="b" x="598" y="404">Flat for 10 years</text>
<text class="g" x="700" y="200">Much further</text>
<text class="c" x="60" y="512">Flat isn't useless, just early</text>
</svg>
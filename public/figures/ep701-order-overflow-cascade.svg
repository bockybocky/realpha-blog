<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="階層溢流圖：AI 投片需求從最上層一路往下溢，最小的 IC 設計公司接到的是上游排不下的量">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">訂單外溢：量從上面漏下來</text>
<rect x="60" y="100" width="700" height="80" fill="var(--accent)" opacity="0.18"/>
<text x="84" y="138" font-size="20" fill="var(--ink)">AI 晶片投片需求</text>
<text x="84" y="164" font-size="15" fill="var(--dim)">產能與設計人力變成稀缺資源</text>
<rect x="60" y="210" width="560" height="80" fill="var(--accent)" opacity="0.14"/>
<text x="84" y="248" font-size="20" fill="var(--ink)">聯發科</text>
<text x="84" y="274" font-size="15" fill="var(--dim)">接了很多 TPU 訂單，有些案子接不下</text>
<rect x="60" y="320" width="420" height="80" fill="var(--accent)" opacity="0.10"/>
<text x="84" y="358" font-size="20" fill="var(--ink)">其他大型 IC 設計</text>
<text x="84" y="384" font-size="15" fill="var(--dim)">同樣排不下</text>
<rect x="60" y="430" width="280" height="80" fill="var(--accent)" opacity="0.07"/>
<text x="84" y="468" font-size="20" fill="var(--ink)">最小的那一掛</text>
<text x="84" y="494" font-size="15" fill="var(--dim)">集體表態</text>
<path d="M 700 180 L 700 205 L 600 205" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M 560 290 L 560 315 L 460 315" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M 420 400 L 420 425 L 320 425" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="560" y="150" font-size="15" fill="var(--dim)">往下丟</text>
<text x="500" y="470" font-size="19" fill="var(--warn)">要看的是上游有沒有繼續排不下</text>
<text x="500" y="496" font-size="15" fill="var(--dim)">不是小公司股價有沒有繼續漲</text>
</svg>
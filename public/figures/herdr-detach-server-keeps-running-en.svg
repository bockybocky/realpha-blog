<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two panels compare before and after detaching: only your window at the top disappears, and the server and three agents below are unchanged.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="56" y="62" font-size="27" font-weight="700" fill="var(--ink)">The only thing you closed was your own pane</text>

  <text x="56" y="112" font-size="20" fill="var(--dim)">open</text>
  <text x="516" y="112" font-size="20" fill="var(--dim)">after you detach</text>

  <rect x="56" y="130" width="384" height="66" rx="10" fill="var(--accent)"/>
  <text x="248" y="170" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">your window</text>
  <line x1="248" y1="196" x2="248" y2="232" stroke="var(--accent)" stroke-width="3"/>

  <rect x="516" y="130" width="384" height="66" rx="10" fill="var(--page)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="708" y="170" font-size="20" fill="var(--grey)" text-anchor="middle">closed</text>

  <rect x="56" y="232" width="384" height="230" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="76" y="262" font-size="19" fill="var(--dim)">server</text>
  <rect x="76" y="278" width="344" height="48" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="96" y="308" font-size="16" fill="var(--ink)">agent computing</text>
  <rect x="76" y="334" width="344" height="48" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="96" y="364" font-size="16" fill="var(--ink)">agent computing</text>
  <rect x="76" y="390" width="344" height="48" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="96" y="420" font-size="16" fill="var(--ink)">agent waiting for you</text>

  <rect x="516" y="232" width="384" height="230" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="536" y="262" font-size="19" fill="var(--dim)">server</text>
  <rect x="536" y="278" width="344" height="48" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="556" y="308" font-size="16" fill="var(--ink)">agent computing</text>
  <rect x="536" y="334" width="344" height="48" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="556" y="364" font-size="16" fill="var(--ink)">agent computing</text>
  <rect x="536" y="390" width="344" height="48" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="556" y="420" font-size="16" fill="var(--ink)">agent waiting for you</text>

  <text x="56" y="512" font-size="22" fill="var(--ink)">Lights off, the crew still working inside</text>
</svg>
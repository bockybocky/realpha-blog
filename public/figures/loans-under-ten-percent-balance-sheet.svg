<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="資產負債表方塊裡放款只佔窄窄一條十趴以下，一支箭頭把其餘放款帶出方塊外">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="80" y="62" font-size="27" fill="var(--ink)">放款只准佔資產負債表的一條窄邊</text>
<text x="100" y="150" font-size="20" fill="var(--dim)">資產負債表</text>
<rect x="100" y="170" width="760" height="140" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="170" width="76" height="140" fill="var(--accent)"/>
<text x="138" y="248" font-size="16" fill="var(--page)" text-anchor="middle">放款</text>
<text x="520" y="248" font-size="19" fill="var(--dim)" text-anchor="middle">其他資產</text>
<path d="M176 170 L176 130" stroke="var(--accent)" stroke-width="2"/>
<text x="186" y="126" font-size="19" fill="var(--accent)">10% 以下</text>
<path d="M300 310 C340 390 540 390 700 390" stroke="var(--ink)" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
<path d="M694 384 L708 390 L694 396 Z" fill="var(--ink)"/>
<text x="716" y="396" font-size="19" fill="var(--ink)">證券化出去</text>
<text x="100" y="462" font-size="22" fill="var(--ink)">風險留在自己身上的比例，就是他選的生意</text>
</g>
</svg>
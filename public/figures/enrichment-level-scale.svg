<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="濃度刻度尺，傳統燃料在低端，HALEU 位置緊貼 20% 界線下方">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="78" font-size="27" fill="var(--ink)">同一個過程，多跑幾輪</text>

<rect x="300" y="140" width="110" height="330" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="300" y="420" width="110" height="50" fill="var(--accent)"/>
<rect x="300" y="170" width="110" height="20" fill="var(--accent)"/>

<line x1="260" y1="160" x2="760" y2="160" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="470" y="150" font-size="20" fill="var(--warn)">20%　武器級界線</text>

<line x1="410" y1="180" x2="620" y2="180" stroke="var(--grey)" stroke-width="2"/>
<text x="640" y="176" font-size="20" fill="var(--ink)">19.75%</text>
<text x="640" y="206" font-size="16" fill="var(--dim)">HALEU・小型機組</text>

<line x1="410" y1="445" x2="620" y2="445" stroke="var(--grey)" stroke-width="2"/>
<text x="640" y="441" font-size="20" fill="var(--ink)">3–5%</text>
<text x="640" y="471" font-size="16" fill="var(--dim)">傳統大型機組</text>

<text x="355" y="330" font-size="16" fill="var(--dim)" text-anchor="middle">再分離</text>
<text x="355" y="356" font-size="16" fill="var(--dim)" text-anchor="middle">一輪</text>

<text x="60" y="520" font-size="22" fill="var(--ink)">難的不是物理，是臨界安全與執照</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="橫軸從兩週延伸到數年，三種零件標在軸上，下方對應的痛期長條長度隨更換時間拉長">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">換掉他要花多久</text>
<text x="60" y="86" font-size="16" fill="var(--dim)">更換時間，等於斷掉之後的痛期</text>

<line x1="120" y1="150" x2="900" y2="150" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="132" font-size="15" fill="var(--dim)">兩週</text>
<text x="380" y="132" font-size="15" text-anchor="middle" fill="var(--dim)">數月</text>
<text x="900" y="132" font-size="15" text-anchor="end" fill="var(--dim)">以年計</text>

<text x="120" y="212" font-size="16" fill="var(--ink)">標準件</text>
<rect x="120" y="226" width="110" height="44" fill="var(--grey)"/>
<text x="248" y="254" font-size="15" fill="var(--dim)">斷了只是新聞</text>

<text x="120" y="312" font-size="16" fill="var(--ink)">主軸馬達</text>
<rect x="120" y="326" width="330" height="44" fill="var(--accent)" opacity="0.55"/>
<text x="468" y="354" font-size="15" fill="var(--dim)">加速認證新供應商還來得及</text>

<text x="120" y="412" font-size="16" fill="var(--ink)">滑塊</text>
<rect x="120" y="426" width="760" height="44" fill="var(--warn)"/>
<text x="500" y="454" font-size="16" font-weight="700" text-anchor="middle" fill="var(--page)">產線是自家的，外面幾乎沒有第二家</text>

<text x="480" y="504" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">找出那個講不出第二個名字的零件</text>
</svg>
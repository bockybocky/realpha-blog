<svg id="fig-iltb-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="可用率刻度上，接近百分之百的窄帶是市場搶購區，九十五到八十的寬帶是他獨自的採購區">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
#fig-iltb-3 text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-iltb-3 .t { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-iltb-3 .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-iltb-3 .b { font-size:16px; fill:var(--dim); }
#fig-iltb-3 .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="52">同一個規格，兩種驗收標準</text>

<rect x="140" y="270" width="168" height="52" fill="var(--grey)"/>
<rect x="308" y="270" width="504" height="52" fill="var(--accent)"/>
<line x1="140" y1="340" x2="880" y2="340" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="322" x2="140" y2="340" stroke="var(--dim)" stroke-width="2"/>
<line x1="308" y1="322" x2="308" y2="340" stroke="var(--dim)" stroke-width="2"/>
<line x1="812" y1="322" x2="812" y2="340" stroke="var(--dim)" stroke-width="2"/>
<text class="b" x="140" y="366" text-anchor="middle">100%</text>
<text class="b" x="308" y="366" text-anchor="middle">95%</text>
<text class="b" x="812" y="366" text-anchor="middle">80%</text>

<line x1="140" y1="240" x2="308" y2="240" stroke="var(--dim)" stroke-width="2"/>
<line x1="140" y1="240" x2="140" y2="262" stroke="var(--dim)" stroke-width="2"/>
<line x1="308" y1="240" x2="308" y2="262" stroke="var(--dim)" stroke-width="2"/>
<text class="g" x="224" y="222" text-anchor="middle">市場的驗收線</text>
<text class="b" x="224" y="196" text-anchor="middle">一秒都不能停</text>

<line x1="308" y1="404" x2="812" y2="404" stroke="var(--accent)" stroke-width="2"/>
<line x1="308" y1="382" x2="308" y2="404" stroke="var(--accent)" stroke-width="2"/>
<line x1="812" y1="382" x2="812" y2="404" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="560" y="430" text-anchor="middle">他的採購區</text>
<text class="b" x="560" y="456" text-anchor="middle">停十分鐘沒人在乎，風電太陽能都能用</text>

<text class="c" x="60" y="508">先把自己改造成能容忍中斷的買家</text>
</svg>
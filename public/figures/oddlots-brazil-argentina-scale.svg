<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩座天秤往相反方向傾斜，代表阿根廷大選兩種結果各壓向一個說法">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="50" y="58" font-size="27" font-weight="700" fill="var(--ink)">阿根廷：兩種結果，兩個方向</text>

<rect x="50" y="96" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="74" y="130" font-size="20" font-weight="700" fill="var(--dim)">米雷伊連任</text>
<line x1="250" y1="330" x2="250" y2="220" stroke="var(--grey)" stroke-width="4"/>
<line x1="130" y1="196" x2="370" y2="252" stroke="var(--accent)" stroke-width="5"/>
<circle cx="370" cy="252" r="18" fill="var(--accent)"/>
<circle cx="130" cy="196" r="12" fill="var(--grey)" opacity="0.6"/>
<text x="124" y="170" font-size="19" fill="var(--dim)" text-anchor="middle">鐘擺</text>
<text x="370" y="296" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">右轉</text>
<line x1="180" y1="344" x2="320" y2="344" stroke="var(--line)" stroke-width="3"/>

<rect x="510" y="96" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="534" y="130" font-size="20" font-weight="700" fill="var(--dim)">米雷伊被換掉</text>
<line x1="710" y1="330" x2="710" y2="220" stroke="var(--grey)" stroke-width="4"/>
<line x1="590" y1="252" x2="830" y2="196" stroke="var(--warn)" stroke-width="5"/>
<circle cx="590" cy="252" r="18" fill="var(--warn)"/>
<circle cx="830" cy="196" r="12" fill="var(--grey)" opacity="0.6"/>
<text x="590" y="296" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">鐘擺</text>
<text x="836" y="170" font-size="19" fill="var(--dim)" text-anchor="middle">右轉</text>
<line x1="640" y1="344" x2="780" y2="344" stroke="var(--line)" stroke-width="3"/>

<text x="480" y="484" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">兩邊不會同時變重，所以它是條件</text>
</svg>
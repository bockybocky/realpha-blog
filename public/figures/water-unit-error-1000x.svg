<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一根高長條是居民用水量，經過單位欄填錯後縮成一條細線，右邊的資料中心長條沒變，兩者之間因此撐出一千倍的落差">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">1000 倍不是算出來的，是單位欄填錯</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">同一筆居民用水量，換個單位就只剩千分之一</text>
<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="140" width="130" height="280" fill="var(--accent)"/>
<text x="175" y="450" font-size="16" fill="var(--ink)" text-anchor="middle">居民用水量</text>
<text x="175" y="474" font-size="15" fill="var(--dim)" text-anchor="middle">單位：立方公尺</text>
<line x1="270" y1="280" x2="388" y2="280" stroke="var(--warn)" stroke-width="2"/>
<polygon points="400,280 386,273 386,287" fill="var(--warn)"/>
<text x="335" y="236" font-size="16" fill="var(--warn)" text-anchor="middle">單位欄</text>
<text x="335" y="260" font-size="16" fill="var(--warn)" text-anchor="middle">填成公升</text>
<rect x="430" y="416" width="130" height="4" fill="var(--warn)"/>
<text x="495" y="450" font-size="16" fill="var(--ink)" text-anchor="middle">同一筆</text>
<text x="495" y="474" font-size="15" fill="var(--dim)" text-anchor="middle">單位：公升</text>
<rect x="700" y="140" width="130" height="280" fill="var(--grey)"/>
<text x="765" y="450" font-size="16" fill="var(--ink)" text-anchor="middle">資料中心用水量</text>
<text x="765" y="474" font-size="15" fill="var(--dim)" text-anchor="middle">沒有變</text>
<line x1="600" y1="280" x2="690" y2="280" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="645" y="268" font-size="19" fill="var(--warn)" text-anchor="middle" font-weight="700">1000 倍</text>
<text x="60" y="535" font-size="22" fill="var(--ink)" font-weight="700">分母縮小，倍數就自己長出來</text>
</svg>
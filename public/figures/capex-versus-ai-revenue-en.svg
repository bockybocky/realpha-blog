<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars of different lengths, capex on top and AI revenue below, where the length gap shows how much is covered.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:19px; fill:var(--ink); font-weight:700; }
.b { font-size:16px; fill:var(--dim); }
.n { font-size:22px; fill:var(--ink); font-weight:700; }
.c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="h" x="60" y="72">Two lengths</text>
<text class="g" x="60" y="166">Next-year capex</text>
<rect x="60" y="190" width="760" height="76" fill="var(--grey)"/>
<text class="n" x="836" y="238">$1.3T</text>
<text class="g" x="60" y="336">2027 pure-AI revenue est.</text>
<rect x="60" y="360" width="292" height="76" fill="var(--accent)"/>
<text class="n" x="370" y="408">$500B</text>
<line x1="352" y1="190" x2="352" y2="446" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>
<text class="c" x="60" y="494">Her math: covers half</text>
</svg>
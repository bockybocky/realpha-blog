<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Lines from three boxes converge into one circle on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="72" font-size="27" fill="var(--ink)">Three things that keep you safe</text>

  <rect x="90" y="130" width="250" height="70" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="215" y="174" font-size="19" fill="var(--ink)" text-anchor="middle">A job</text>
  <rect x="90" y="230" width="250" height="70" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="215" y="274" font-size="19" fill="var(--ink)" text-anchor="middle">A person</text>
  <rect x="90" y="330" width="250" height="70" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="215" y="374" font-size="19" fill="var(--ink)" text-anchor="middle">A habit</text>

  <line x1="340" y1="165" x2="638" y2="248" stroke="var(--accent)" stroke-width="3"/>
  <line x1="340" y1="265" x2="640" y2="265" stroke="var(--accent)" stroke-width="3"/>
  <line x1="340" y1="365" x2="638" y2="282" stroke="var(--accent)" stroke-width="3"/>

  <circle cx="700" cy="265" r="60" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text x="700" y="272" font-size="19" fill="var(--accent)" text-anchor="middle">The same source</text>
  <text x="700" y="380" font-size="16" fill="var(--dim)" text-anchor="middle">All fail on the same night</text>

  <text x="60" y="460" font-size="22" fill="var(--ink)">Write them down and you see they rest on one pillar</text>
</svg>
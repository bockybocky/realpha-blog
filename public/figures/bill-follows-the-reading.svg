<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="左邊一支鉛筆寫出一行字，右邊一整座書架被讀進模型，帳單的高度跟著書架走，不跟著那行字走">
  <style>
    .ink { fill: #3b3b3b; }
    .line { stroke: #3b3b3b; stroke-width: 2; fill: none; }
    .paper { fill: #f7f3ea; stroke: #3b3b3b; stroke-width: 2; }
    .book { fill: #d9c8a6; stroke: #3b3b3b; stroke-width: 2; }
    .bill { fill: #f1d9b5; stroke: #3b3b3b; stroke-width: 2; }
    .label { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 20px; fill: #3b3b3b; }
    .small { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 16px; fill: #6b6b6b; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6e1d6; }
      .line { stroke: #e6e1d6; }
      .paper { fill: #2a2925; stroke: #e6e1d6; }
      .book { fill: #5a4d3a; stroke: #e6e1d6; }
      .bill { fill: #5e4a2e; stroke: #e6e1d6; }
      .label { fill: #e6e1d6; }
      .small { fill: #b5b0a5; }
    }
  </style>

  <!-- 左：它寫的 -->
  <text x="150" y="48" text-anchor="middle" class="label">它寫出來的</text>
  <rect x="80" y="80" width="140" height="180" rx="4" class="paper"/>
  <line x1="100" y1="120" x2="200" y2="120" class="line"/>
  <text x="150" y="300" text-anchor="middle" class="small">一行字，約 800 個 token</text>

  <!-- 中：箭頭與比例 -->
  <text x="480" y="48" text-anchor="middle" class="label">帳單跟著誰走</text>
  <line x1="240" y1="170" x2="360" y2="170" class="line"/>
  <line x1="600" y1="170" x2="720" y2="170" class="line"/>
  <polygon points="720,162 736,170 720,178" class="ink"/>
  <text x="480" y="178" text-anchor="middle" class="label">600 : 1</text>
  <text x="480" y="300" text-anchor="middle" class="small">每答一次，先重讀一遍</text>

  <!-- 右：它讀的（書架） -->
  <text x="810" y="48" text-anchor="middle" class="label">它讀進去的</text>
  <g>
    <rect x="750" y="70" width="18" height="190" class="book"/>
    <rect x="772" y="90" width="18" height="170" class="book"/>
    <rect x="794" y="60" width="18" height="200" class="book"/>
    <rect x="816" y="100" width="18" height="160" class="book"/>
    <rect x="838" y="75" width="18" height="185" class="book"/>
    <rect x="860" y="95" width="18" height="165" class="book"/>
    <rect x="882" y="65" width="18" height="195" class="book"/>
    <line x1="740" y1="262" x2="912" y2="262" class="line"/>
  </g>
  <text x="810" y="300" text-anchor="middle" class="small">整個工作區，約 45 萬個 token</text>

  <!-- 底：帳單 -->
  <rect x="80" y="340" width="80" height="40" class="bill"/>
  <text x="120" y="366" text-anchor="middle" class="small">帳單</text>
  <rect x="740" y="330" width="172" height="60" class="bill"/>
  <text x="826" y="366" text-anchor="middle" class="small">帳單（跟這邊一樣高）</text>
</svg>

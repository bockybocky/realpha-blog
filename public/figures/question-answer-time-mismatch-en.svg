<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The left segment of the timeline is electricity already secured and the right segment is permits still to come; the answer arrow lands on the left segment while the question arrow lands on the right, so the two cross and sit out of alignment.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">Answer left, ask right</text>

  <rect x="60" y="250" width="380" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <rect x="520" y="250" width="380" height="64" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-dasharray="7 5"/>
  <text class="t" x="250" y="289" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Live/permitted</text>
  <text class="t" x="710" y="289" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">Permits</text>

  <line x1="60" y1="282" x2="40" y2="282" stroke="var(--grey)" stroke-width="2"/>
  <line x1="440" y1="220" x2="440" y2="344" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
  <text class="t" x="440" y="208" font-size="16" fill="var(--dim)" text-anchor="middle">Now</text>
  <line x1="900" y1="282" x2="930" y2="282" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="940" y="287" font-size="16" fill="var(--dim)">Soon</text>

  <path d="M 760 150 L 760 190 L 250 190 L 250 242" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="250,250 244,238 256,238" fill="var(--accent)"/>
  <rect x="640" y="118" width="240" height="40" rx="8" fill="var(--page)" stroke="var(--accent)"/>
  <text class="t" x="760" y="145" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">CEO says</text>

  <path d="M 200 420 L 200 380 L 710 380 L 710 322" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="710,314 704,326 716,326" fill="var(--warn)"/>
  <rect x="80" y="420" width="240" height="40" rx="8" fill="var(--page)" stroke="var(--warn)"/>
  <text class="t" x="200" y="447" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Street Q</text>

  <text class="t" x="480" y="492" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Mismatch marks the pressure</text>
</svg>
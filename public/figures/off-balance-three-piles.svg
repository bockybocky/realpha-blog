<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="比例橫條：左邊一大段灰色約九成，中間一條細縫不到 5%，右邊一小段警示色約一成，右段下方框起來標示會咬人。"><rect x="0" y="0" width="960" height="560" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:19px;font-weight:600}.b{font-size:16px;fill:var(--dim)}.k{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}
</style>
<text x="480" y="52" text-anchor="middle" class="t">3.5 兆美元表外承諾，照「出事誰賠」拆三堆</text>
<rect x="80" y="140" width="688" height="90" fill="var(--grey)"/>
<rect x="768" y="140" width="32" height="90" fill="var(--dim)"/>
<rect x="800" y="140" width="80" height="90" fill="var(--warn)"/>
<text x="424" y="193" text-anchor="middle" class="g">3.5 兆美元</text>
<g stroke="var(--dim)" stroke-width="1.5">
<line x1="424" y1="230" x2="250" y2="290"/>
<line x1="784" y1="230" x2="560" y2="290"/>
<line x1="840" y1="230" x2="820" y2="290"/>
</g>
<rect x="715" y="292" width="210" height="136" rx="10" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 4"/>
<g text-anchor="middle">
<text x="250" y="320" class="g">採購＋未起算租約</text>
<text x="250" y="356" class="k">約九成</text>
<text x="250" y="386" class="b">照合約付</text>
<text x="250" y="412" class="b">日後回到財報</text>
<text x="560" y="320" class="g">循環投資</text>
<text x="560" y="356" class="k">不到 5%</text>
<text x="560" y="386" class="b">賠自己</text>
<text x="560" y="412" class="b">最壞：股權歸零</text>
<text x="820" y="320" class="g w">各類擔保</text>
<text x="820" y="356" class="k w">約一成</text>
<text x="820" y="386" class="b">3000～5000 億美元</text>
<text x="820" y="412" class="b w">拖別人下水</text>
<text x="820" y="458" class="g w">會咬人</text>
</g>
<text x="80" y="458" class="b">比例為約數</text>
<text x="480" y="520" text-anchor="middle" class="k">會咬人的是第三堆，平常不在帳上</text>
</svg>
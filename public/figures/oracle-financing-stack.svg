<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="示意柱狀圖：景氣好時十格高的機房只有底部一格是自己出的錢，其餘九格來自客戶預付、客戶硬體與供應商融資；需求反轉時九格撤走，只剩一格">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">一座機房，甲骨文自己出多少</text>
<text x="480" y="86" text-anchor="middle" font-size="15" fill="var(--dim)">示意，共 10 格</text>
<rect x="220" y="140" width="160" height="96" fill="var(--grey)" stroke="var(--page)" stroke-width="2"/>
<rect x="220" y="236" width="160" height="96" fill="var(--line)" stroke="var(--page)" stroke-width="2"/>
<rect x="220" y="332" width="160" height="96" fill="var(--grey)" stroke="var(--page)" stroke-width="2"/>
<rect x="220" y="428" width="160" height="32" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>
<text x="395" y="193" font-size="16" fill="var(--dim)">供應商融資</text>
<text x="395" y="289" font-size="16" fill="var(--dim)">客戶自帶硬體</text>
<text x="395" y="385" font-size="16" fill="var(--dim)">客戶預付</text>
<text x="395" y="450" font-size="16" font-weight="700" fill="var(--accent)">自己出</text>
<text x="300" y="498" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)">景氣好</text>
<rect x="620" y="140" width="160" height="288" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="620" y="428" width="160" height="32" fill="var(--accent)"/>
<text x="700" y="292" text-anchor="middle" font-size="19" fill="var(--dim)">撤走</text>
<text x="700" y="498" text-anchor="middle" font-size="19" font-weight="700" fill="var(--warn)">需求反轉</text>
<text x="480" y="540" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">被融資撐大的需求</text>
</svg>
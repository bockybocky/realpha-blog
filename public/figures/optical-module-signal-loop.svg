<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="光模組內部的往返迴路，上排電轉光向右，下排光轉電向左，末端接回同一顆處理器">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">那顆小盒子裡，訊號走一圈</text>

<rect x="60" y="88" width="840" height="340" fill="var(--card)" rx="10"/>

<path d="M90 180 L108 158 L126 202 L144 158 L162 202 L180 180" fill="none" stroke="var(--dim)" stroke-width="3"/>
<text class="b" x="90" y="226">電訊號</text>

<rect x="208" y="146" width="96" height="68" rx="8" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M226 196 L244 166 L262 196 L280 170" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="222" y="238">洗訊號</text>

<polygon points="356,144 356,216 420,180" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="352" y="238">放大</text>

<g stroke="var(--warn)" stroke-width="4">
<line x1="470" y1="150" x2="506" y2="150"/><line x1="470" y1="160" x2="506" y2="160"/>
<line x1="470" y1="170" x2="506" y2="170"/><line x1="470" y1="180" x2="506" y2="180"/>
<line x1="470" y1="190" x2="506" y2="190"/><line x1="470" y1="200" x2="506" y2="200"/>
<line x1="470" y1="210" x2="506" y2="210"/><line x1="470" y1="220" x2="506" y2="220"/>
</g>
<text class="g" x="462" y="250">八顆雷射</text>

<path d="M566 142 Q596 180 566 218" fill="none" stroke="var(--dim)" stroke-width="3"/>
<path d="M602 142 Q572 180 602 218" fill="none" stroke="var(--dim)" stroke-width="3"/>
<text class="b" x="560" y="250">透鏡對準</text>

<path d="M660 174 Q700 162 740 174 T820 174 T890 174" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M660 186 Q700 198 740 186 T820 186 T890 186" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="760" y="226">光纖</text>
<polygon points="890,172 912,180 890,188" fill="var(--accent)"/>

<path d="M858 300 L130 300" stroke="var(--dim)" stroke-width="3"/>
<polygon points="146,292 124,300 146,308" fill="var(--dim)"/>
<circle cx="760" cy="300" r="16" fill="none" stroke="var(--dim)" stroke-width="3"/>
<text class="b" x="716" y="340">光變回電流</text>
<polygon points="560,282 560,318 596,300" fill="none" stroke="var(--dim)" stroke-width="3"/>
<text class="b" x="552" y="340">再放大</text>
<path d="M256 300 L256 222" stroke="var(--dim)" stroke-width="3"/>
<polygon points="248,232 256,210 264,232" fill="var(--dim)"/>
<text class="b" x="276" y="340">回到同一顆處理器</text>

<text class="c" x="60" y="482">去程把電變成光，回程把光變成電——</text>
<text class="c" x="60" y="512">難的那一格不是算，是把光對準。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One full bar becomes a short bar and a long bar after delivery records are applied">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Discount by track record first, then judge</text>

<text x="60" y="140" font-size="19" font-weight="600" fill="var(--dim)">The same sentence</text>
<rect x="300" y="110" width="400" height="52" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="500" y="143" font-size="16" fill="var(--ink)" text-anchor="middle">Margins should improve next year</text>

<line x1="60" y1="206" x2="900" y2="206" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="248" font-size="19" font-weight="600" fill="var(--dim)">Left after the discount</text>

<text x="60" y="300" font-size="16" fill="var(--ink)">Company A　said it 6 times, delivered 2</text>
<rect x="300" y="274" width="400" height="52" rx="8" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="300" y="274" width="133" height="52" rx="8" fill="var(--grey)"/>
<text x="720" y="306" font-size="16" fill="var(--dim)">A third left</text>

<text x="60" y="392" font-size="16" fill="var(--ink)">Company B　said it 4 times, delivered 4</text>
<rect x="300" y="366" width="400" height="52" rx="8" fill="var(--accent)"/>
<text x="720" y="398" font-size="16" fill="var(--dim)">Full value</text>

<text x="480" y="482" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">The same sentence, worth several times more or less</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A two-by-two matrix with slow down and do not slow down on each axis, where the bottom-right cell in which neither side slows down is boxed and labelled as the equilibrium.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--dim); }
.n { font-size:16px; fill:var(--dim); }
.k { font-size:20px; font-weight:600; fill:var(--ink); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="58" class="t">Everyone calls for a pause, nobody stops first</text>
<text x="440" y="176" class="g" text-anchor="middle">Rival slows</text>
<text x="720" y="176" class="g" text-anchor="middle">Rival keeps going</text>
<text x="282" y="278" class="g" text-anchor="end">You slow</text>
<text x="282" y="428" class="g" text-anchor="end">You keep going</text>
<rect x="300" y="200" width="280" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="580" y="200" width="280" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="300" y="350" width="280" height="150" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="580" y="350" width="280" height="150" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="440" y="268" class="k" text-anchor="middle">Both save money</text>
<text x="440" y="300" class="n" text-anchor="middle">Nobody believes it</text>
<text x="720" y="268" class="k" text-anchor="middle" fill="var(--warn)">Position changes hands</text>
<text x="720" y="300" class="n" text-anchor="middle">The feared cell</text>
<text x="440" y="418" class="k" text-anchor="middle">Lead widens</text>
<text x="440" y="450" class="n" text-anchor="middle">Rival self-harms</text>
<text x="720" y="418" class="k" text-anchor="middle">Both burn cash</text>
<text x="720" y="450" class="n" text-anchor="middle">Nobody dares stop</text>
<text x="846" y="378" class="n" text-anchor="end" fill="var(--accent)">Equilibrium</text>
<text x="60" y="545" class="c">Whatever the rival picks, not slowing wins</text>
</svg>
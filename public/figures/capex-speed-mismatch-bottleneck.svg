<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四條長短不一的橫條，一條垂直虛線切在最短那條的末端">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .b { font-size:15px; fill:var(--dim); }
    .w { font-size:16px; fill:var(--warn); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="80" y="58">錢很快，機器很慢</text>
  <text class="s" x="80" y="90">條的長度＝這一層擴產的速度</text>

  <text class="g" x="80" y="188">板廠</text>
  <rect x="300" y="166" width="500" height="28" rx="8" fill="var(--page)" stroke="var(--line)"/>
  <rect x="300" y="166" width="480" height="28" rx="8" fill="var(--accent)"/>

  <text class="g" x="80" y="263">材料廠</text>
  <rect x="300" y="241" width="500" height="28" rx="8" fill="var(--page)" stroke="var(--line)"/>
  <rect x="300" y="241" width="350" height="28" rx="8" fill="var(--accent)"/>

  <text class="g" x="80" y="338">壓合・鑽孔設備</text>
  <rect x="300" y="316" width="500" height="28" rx="8" fill="var(--page)" stroke="var(--line)"/>
  <rect x="300" y="316" width="200" height="28" rx="8" fill="var(--grey)"/>
  <text class="b" x="516" y="337">交期很長</text>

  <text class="g" x="80" y="413">鑽針廠</text>
  <rect x="300" y="391" width="500" height="28" rx="8" fill="var(--page)" stroke="var(--line)"/>
  <rect x="300" y="391" width="130" height="28" rx="8" fill="var(--warn)"/>
  <text class="b" x="446" y="412">跟不上板廠</text>

  <line x1="430" y1="140" x2="430" y2="440" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="w" x="430" y="128" text-anchor="middle">整條鏈的實際節奏</text>

  <text class="c" x="80" y="506">錢再多，也只是把瓶頸往上游推一格</text>
</svg>
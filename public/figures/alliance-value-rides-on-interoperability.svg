<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條由左下往右上翹起的曲線，橫軸是價值有多少來自互通，縱軸是聯盟值多少，左端貼地右端拉高">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">聯盟的價值掛在哪一根軸上</text>
<line x1="140" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="3"/>
<line x1="140" y1="120" x2="140" y2="400" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="140" y="436">價值來自互通的比重　低</text>
<text class="b" x="760" y="436">高</text>
<text class="g" x="60" y="108">聯盟值多少</text>
<path d="M 160 392 C 400 388 560 330 840 150" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="168" cy="391" r="9" fill="var(--warn)"/>
<circle cx="838" cy="152" r="9" fill="var(--accent)"/>
<text class="b" x="186" y="372" fill="var(--warn)">只剩開會成本</text>
<text class="g" x="672" y="130" fill="var(--accent)">Zelle　Akoya</text>
<text class="c" x="60" y="496">有最好想法的那家，常常不在解決那個問題的位置上</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三列並排的站點方塊，第一列四站亮起，第二列多亮一站，第三列只剩中間兩站亮著">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--dim); }
.n { font-size:16px; fill:var(--dim); }
.k { font-size:20px; font-weight:600; }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" class="t">測試流程還在增減</text>
<text x="290" y="238" class="g" text-anchor="end">原本</text>
<rect x="320" y="200" width="100" height="60" fill="var(--accent)"/>
<rect x="440" y="200" width="100" height="60" fill="var(--accent)"/>
<rect x="560" y="200" width="100" height="60" fill="var(--accent)"/>
<rect x="680" y="200" width="100" height="60" fill="var(--accent)"/>
<rect x="800" y="200" width="100" height="60" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="370" y="238" class="k" fill="var(--page)" text-anchor="middle">1</text>
<text x="490" y="238" class="k" fill="var(--page)" text-anchor="middle">2</text>
<text x="610" y="238" class="k" fill="var(--page)" text-anchor="middle">3</text>
<text x="730" y="238" class="k" fill="var(--page)" text-anchor="middle">4</text>
<text x="850" y="238" class="k" fill="var(--grey)" text-anchor="middle">5</text>
<text x="290" y="348" class="g" text-anchor="end">加老化站</text>
<rect x="320" y="310" width="100" height="60" fill="var(--accent)"/>
<rect x="440" y="310" width="100" height="60" fill="var(--accent)"/>
<rect x="560" y="310" width="100" height="60" fill="var(--accent)"/>
<rect x="680" y="310" width="100" height="60" fill="var(--accent)"/>
<rect x="800" y="310" width="100" height="60" fill="var(--accent)"/>
<text x="370" y="348" class="k" fill="var(--page)" text-anchor="middle">1</text>
<text x="490" y="348" class="k" fill="var(--page)" text-anchor="middle">2</text>
<text x="610" y="348" class="k" fill="var(--page)" text-anchor="middle">3</text>
<text x="730" y="348" class="k" fill="var(--page)" text-anchor="middle">4</text>
<text x="850" y="348" class="k" fill="var(--page)" text-anchor="middle">5</text>
<text x="290" y="458" class="g" text-anchor="end">這次傳出</text>
<rect x="320" y="420" width="100" height="60" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="440" y="420" width="100" height="60" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="560" y="420" width="100" height="60" fill="var(--accent)"/>
<rect x="680" y="420" width="100" height="60" fill="var(--accent)"/>
<rect x="800" y="420" width="100" height="60" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="370" y="458" class="k" fill="var(--grey)" text-anchor="middle">1</text>
<text x="490" y="458" class="k" fill="var(--warn)" text-anchor="middle">2</text>
<text x="610" y="458" class="k" fill="var(--page)" text-anchor="middle">3</text>
<text x="730" y="458" class="k" fill="var(--page)" text-anchor="middle">4</text>
<text x="850" y="458" class="k" fill="var(--grey)" text-anchor="middle">5</text>
<text x="490" y="500" class="n" fill="var(--warn)" text-anchor="middle">傳出要撤</text>
<text x="60" y="530" class="c">一個站點的去留，改寫一批設備商的價值</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條橫條以年為刻度：環形齒輪當年 4.5 年，今天 8 到 10 年幾乎翻倍，燃氣渦輪 6 到 8 年">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .ac { fill:var(--accent); }
    .wn { fill:var(--warn); }
    .inv { fill:var(--page); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="480" y="50" text-anchor="middle" class="t">設備交期（年）</text>
<line x1="280" y1="95" x2="280" y2="370" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 6"/>
<line x1="400" y1="95" x2="400" y2="370" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 6"/>
<line x1="520" y1="95" x2="520" y2="370" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 6"/>
<line x1="640" y1="95" x2="640" y2="370" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 6"/>
<line x1="760" y1="95" x2="760" y2="370" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 6"/>
<line x1="880" y1="95" x2="880" y2="370" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 6"/>
<text x="280" y="395" text-anchor="middle" class="d">0</text>
<text x="400" y="395" text-anchor="middle" class="d">2</text>
<text x="520" y="395" text-anchor="middle" class="d">4</text>
<text x="640" y="395" text-anchor="middle" class="d">6</text>
<text x="760" y="395" text-anchor="middle" class="d">8</text>
<text x="880" y="395" text-anchor="middle" class="d">10 年</text>
<rect x="280" y="110" width="270" height="44" fill="var(--grey)"/>
<text x="265" y="139" text-anchor="end" class="g">環形齒輪・當年</text>
<text x="265" y="173" text-anchor="end" class="d">蓋 Oyu Tolgoi 時</text>
<text x="562" y="139" class="b">4.5 年</text>
<rect x="280" y="195" width="480" height="44" fill="var(--warn)"/>
<rect x="760" y="195" width="120" height="44" fill="var(--warn)" fill-opacity="0.35"/>
<text x="265" y="224" text-anchor="end" class="g">環形齒輪・今天</text>
<text x="265" y="258" text-anchor="end" class="d">也可能等不到</text>
<text x="520" y="224" text-anchor="middle" class="b inv">8–10 年</text>
<rect x="280" y="280" width="360" height="44" fill="var(--warn)"/>
<rect x="640" y="280" width="120" height="44" fill="var(--warn)" fill-opacity="0.35"/>
<text x="265" y="309" text-anchor="end" class="g">燃氣渦輪・今天</text>
<text x="265" y="343" text-anchor="end" class="d">資料中心用</text>
<text x="460" y="309" text-anchor="middle" class="b inv">6–8 年</text>
<text x="480" y="462" text-anchor="middle" class="c">少一個，就飛不起來</text>
</svg>
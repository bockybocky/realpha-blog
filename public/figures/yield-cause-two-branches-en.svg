<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The same number splits into two scenarios: in one, both bars rise together and the gap is unchanged; in the other, only one bar rises and the gap widens.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); font-weight:700; }
  .g { font-size:20px; fill:var(--ink); font-weight:700; }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="70" y="56">One 5.2%, two causes</text>
<rect x="370" y="84" width="220" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2" rx="8"/>
<text class="g" x="392" y="120">Yields spike</text>
<path d="M420 140 C 300 170 260 170 240 196" fill="none" stroke="var(--line)" stroke-width="3"/>
<path d="M540 140 C 660 170 700 170 720 196" fill="none" stroke="var(--line)" stroke-width="3"/>
<rect x="70" y="196" width="370" height="286" fill="var(--card)" rx="8"/>
<rect x="520" y="196" width="370" height="286" fill="var(--card)" rx="8"/>
<text class="g" x="94" y="232">Inflation, nominal growth</text>
<text class="g" x="544" y="232">Term premium, fiscal</text>
<line x1="94" y1="440" x2="416" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="544" y1="440" x2="866" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="130" y="300" width="80" height="140" fill="var(--grey)" rx="4"/>
<rect x="260" y="290" width="80" height="150" fill="var(--accent)" rx="4"/>
<text class="b" x="130" y="466">Cash flow</text>
<text class="b" x="260" y="466">Discount rate</text>
<text class="b" x="130" y="282">Rise together</text>
<rect x="580" y="382" width="80" height="58" fill="var(--grey)" rx="4"/>
<rect x="710" y="268" width="80" height="172" fill="var(--warn)" rx="4"/>
<text class="b" x="580" y="466">Cash flow</text>
<text class="b" x="710" y="466">Discount rate</text>
<text class="b" x="580" y="364">Flat</text>
<text class="g" x="94" y="416" fill="var(--dim)">Limited squeeze</text>
<text class="g" x="544" y="416" fill="var(--dim)">A real squeeze</text>
<text class="c" x="70" y="528">The headline gives you the number, not the cause</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A scissor-shaped split, with the token-cost line falling away, the spending line flat, and the GPU rental line tilting up.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="66" font-size="27" font-weight="700" fill="var(--ink)">Both true</text>
<rect x="150" y="120" width="4" height="300" fill="var(--line)"/>
<rect x="150" y="416" width="700" height="4" fill="var(--line)"/>
<text x="140" y="140" font-size="16" fill="var(--dim)" text-anchor="end">H</text>
<text x="140" y="412" font-size="16" fill="var(--dim)" text-anchor="end">L</text>
<text x="150" y="452" font-size="16" fill="var(--dim)">Past</text>
<text x="850" y="452" font-size="16" fill="var(--dim)" text-anchor="end">Now</text>
<polyline points="170,268 360,258 540,252 720,250 840,250" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text x="560" y="238" font-size="19" font-weight="700" fill="var(--dim)">Spend: flat</text>
<polyline points="170,200 330,284 500,352 680,392 840,402" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text x="330" y="330" font-size="19" font-weight="700" fill="var(--warn)">Cost: down to 1%</text>
<polyline points="170,330 350,306 520,266 700,206 840,160" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="596" y="188" font-size="19" font-weight="700" fill="var(--accent)">GPU rent: up</text>
<text x="150" y="498" font-size="16" fill="var(--dim)">Open weights: 20% to 80%</text>
<text x="80" y="528" font-size="22" font-weight="700" fill="var(--ink)">Cheap tokens, dear GPU</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="時間軸上債務方塊堆在 2030 到 2032 形成一道高牆，利率由八趴跳到十五趴">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">牆不在今年，在到期那一年</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">到期時間與再融資成本</text>

<line x1="90" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="90" y="464" font-size="19" fill="var(--dim)">2026</text>
<text class="t" x="330" y="464" font-size="19" fill="var(--dim)">2028</text>
<text class="t" x="600" y="464" font-size="19" font-weight="700" fill="var(--ink)">2030</text>
<text class="t" x="810" y="464" font-size="19" font-weight="700" fill="var(--ink)">2032</text>

<rect x="110" y="400" width="36" height="28" rx="3" fill="var(--grey)" opacity="0.5"/>
<rect x="210" y="400" width="36" height="28" rx="3" fill="var(--grey)" opacity="0.5"/>
<rect x="340" y="400" width="36" height="28" rx="3" fill="var(--grey)" opacity="0.5"/>

<rect x="600" y="200" width="60" height="228" rx="4" fill="var(--warn)" opacity="0.4"/>
<rect x="675" y="170" width="60" height="258" rx="4" fill="var(--warn)" opacity="0.5"/>
<rect x="750" y="150" width="60" height="278" rx="4" fill="var(--warn)" opacity="0.6"/>
<text class="t" x="600" y="135" font-size="20" font-weight="700" fill="var(--warn)">再融資牆</text>

<line x1="110" y1="370" x2="520" y2="370" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
<text class="t" x="110" y="352" font-size="19" font-weight="700" fill="var(--accent)">現在票面 8%～10%</text>

<line x1="600" y1="300" x2="880" y2="300" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 6"/>
<text class="t" x="600" y="282" font-size="19" font-weight="700" fill="var(--ink)">借新還舊 13%～15%</text>

<line x1="60" y1="498" x2="900" y2="498" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="536" font-size="22" font-weight="700" fill="var(--ink)">到期不可怕，到期那天借不到才可怕</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" id="fig-cashflow-flip" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two panels with the arrows reversed: cash used to flow out to shareholders, now money flows into the company and all into one project">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
#fig-cashflow-flip text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-cashflow-flip .h { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-cashflow-flip .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-cashflow-flip .b { font-size:16px; fill:var(--dim); }
#fig-cashflow-flip .s { font-size:15px; fill:var(--dim); }
#fig-cashflow-flip .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="h" x="60" y="54">Cash flow reversed</text>
<rect x="60" y="110" width="400" height="330" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="84" y="148">The 2022 round</text>
<rect x="110" y="190" width="130" height="70" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="175" y="232" text-anchor="middle">Company</text>
<path d="M 246 225 L 330 225" stroke="var(--accent)" stroke-width="16" stroke-linecap="round"/>
<path d="M 352 225 L 322 208 L 322 242 Z" fill="var(--accent)"/>
<rect x="356" y="190" width="80" height="70" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="396" y="232" text-anchor="middle">Shareholders</text>
<text class="s" x="110" y="300">Returned 30–50% of cash</text>
<text class="s" x="110" y="326">Debt refinanced at zero</text>
<text class="s" x="110" y="352">Cut the duds, stock came back</text>
<rect x="500" y="110" width="400" height="330" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="524" y="148">Now</text>
<rect x="640" y="190" width="130" height="70" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="705" y="232" text-anchor="middle">Company</text>
<path d="M 560 225 L 616 225" stroke="var(--grey)" stroke-width="12" stroke-linecap="round"/>
<path d="M 636 225 L 610 210 L 610 240 Z" fill="var(--grey)"/>
<text class="s" x="524" y="200">Equity</text>
<text class="s" x="524" y="278">Debt</text>
<path d="M 705 268 L 705 320" stroke="var(--warn)" stroke-width="22" stroke-linecap="round"/>
<path d="M 705 348 L 686 316 L 724 316 Z" fill="var(--warn)"/>
<rect x="590" y="352" width="230" height="60" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="705" y="390" text-anchor="middle">One experiment</text>
<text class="c" x="60" y="500">Leverage plus reinvestment risk</text>
</svg>
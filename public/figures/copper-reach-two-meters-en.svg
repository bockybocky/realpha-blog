<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="A long copper bar on top; below, copper is only a short stub with a dashed line at two metres and optics for the rest.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="600" fill="var(--ink)">Copper is down to two metres</text>

  <text x="80" y="208" font-size="19" fill="var(--dim)">Before</text>
  <text x="180" y="168" font-size="16" fill="var(--dim)">Copper</text>
  <rect x="180" y="180" width="580" height="44" fill="var(--grey)"/>

  <text x="80" y="338" font-size="19" fill="var(--dim)">Now</text>
  <text x="180" y="298" font-size="16" fill="var(--dim)">Copper</text>
  <rect x="180" y="310" width="110" height="44" fill="var(--grey)"/>
  <text x="312" y="298" font-size="16" fill="var(--dim)">Optics</text>
  <rect x="300" y="310" width="460" height="44" fill="var(--accent)"/>

  <line x1="294" y1="140" x2="294" y2="392" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="294" y="418" font-size="19" text-anchor="middle" fill="var(--warn)">2 metres</text>

  <text x="480" y="478" font-size="22" text-anchor="middle" fill="var(--ink)">Even inside the rack it goes optical</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two circles that barely overlap, with a very small intersection.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="78">Names that are up vs. names you own</text>

<circle cx="390" cy="290" r="150" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="640" cy="290" r="110" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<ellipse cx="518" cy="290" rx="18" ry="52" fill="var(--accent)" opacity="0.35"/>

<text class="g" x="310" y="200" fill="var(--accent)">Names that are up</text>
<text class="b" x="300" y="228">Most of the equal-weight index</text>
<text class="g" x="588" y="200">Your list</text>
<text class="b" x="568" y="228">A dozen or so</text>
<text class="b" x="470" y="470">Overlap</text>

<text class="c" x="60" y="512">Your P&amp;L measures this overlap, not the whole market</text>
</svg>
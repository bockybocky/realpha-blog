<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條中段被掐細的錢管線，夾點之前與之後是兩種東西">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">同樣一筆錢，卡在管線的哪一段</text>

<path d="M60 200 L430 200 L488 254 L560 254 L620 200 L900 200 L900 320 L620 320 L560 266 L488 266 L430 320 L60 320 Z" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>

<text x="86" y="252" font-size="19" font-weight="700" fill="var(--ink)">行政命令</text>
<text x="86" y="282" font-size="16" fill="var(--dim)">軍種　專案經理</text>

<rect x="488" y="150" width="76" height="56" rx="8" fill="var(--warn)"/>
<text x="500" y="186" font-size="16" font-weight="700" fill="var(--page)">夾點</text>
<text x="420" y="124" font-size="19" font-weight="700" fill="var(--warn)">持續決議案</text>
<text x="420" y="150" font-size="16" fill="var(--warn)">期限 12 月 11 日</text>

<text x="672" y="252" font-size="19" font-weight="700" fill="var(--ink)">編進某個武器系統</text>
<text x="672" y="282" font-size="16" fill="var(--dim)">修補計畫　合約下得去</text>

<text x="86" y="396" font-size="16" fill="var(--dim)">夾點之前：還在等預算定案的研究案</text>
<text x="86" y="424" font-size="16" fill="var(--accent)">夾點之後：已經有錢的修補計畫</text>

<text x="60" y="492" font-size="22" font-weight="700" fill="var(--ink)">得標的新聞不會告訴你是哪一段。</text>
</svg>
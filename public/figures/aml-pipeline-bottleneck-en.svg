<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The top row has a wide pipe feeding a narrow neck where reports pile up and spill over; the bottom row has a uniform pipe with fewer reports flowing freely and a feedback arc looping from the end back to the start.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
    .s { fill:var(--page); stroke:var(--warn); stroke-width:1.5; }
    .sa { fill:var(--page); stroke:var(--accent); stroke-width:1.5; }
</style>
<defs>
<marker id="plA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
</defs>
<text class="t" x="480" y="48" text-anchor="middle">Stuck in the middle</text>
<text class="g" x="40" y="187">Now</text>
<rect x="140" y="130" width="260" height="100" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<rect x="400" y="165" width="240" height="30" fill="var(--warn)" fill-opacity="0.15" stroke="var(--warn)" stroke-width="2"/>
<rect x="640" y="165" width="220" height="30" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<rect class="s" x="300" y="206" width="14" height="18"/><rect class="s" x="316" y="206" width="14" height="18"/><rect class="s" x="332" y="206" width="14" height="18"/><rect class="s" x="348" y="206" width="14" height="18"/><rect class="s" x="364" y="206" width="14" height="18"/><rect class="s" x="380" y="206" width="14" height="18"/>
<rect class="s" x="300" y="186" width="14" height="18"/><rect class="s" x="316" y="186" width="14" height="18"/><rect class="s" x="332" y="186" width="14" height="18"/><rect class="s" x="348" y="186" width="14" height="18"/><rect class="s" x="364" y="186" width="14" height="18"/><rect class="s" x="380" y="186" width="14" height="18"/>
<rect class="s" x="300" y="166" width="14" height="18"/><rect class="s" x="316" y="166" width="14" height="18"/><rect class="s" x="332" y="166" width="14" height="18"/><rect class="s" x="348" y="166" width="14" height="18"/><rect class="s" x="364" y="166" width="14" height="18"/><rect class="s" x="380" y="166" width="14" height="18"/>
<rect class="s" x="300" y="146" width="14" height="18"/><rect class="s" x="316" y="146" width="14" height="18"/><rect class="s" x="332" y="146" width="14" height="18"/><rect class="s" x="348" y="146" width="14" height="18"/><rect class="s" x="364" y="146" width="14" height="18"/><rect class="s" x="380" y="146" width="14" height="18"/>
<rect class="s" x="332" y="126" width="14" height="18"/><rect class="s" x="348" y="126" width="14" height="18"/><rect class="s" x="364" y="126" width="14" height="18"/><rect class="s" x="380" y="126" width="14" height="18"/>
<rect class="s" x="332" y="106" width="14" height="18"/><rect class="s" x="348" y="106" width="14" height="18"/><rect class="s" x="364" y="106" width="14" height="18"/><rect class="s" x="380" y="106" width="14" height="18"/>
<rect class="s" x="364" y="86" width="14" height="18"/><rect class="s" x="380" y="86" width="14" height="18"/>
<text class="g" x="40" y="407">Proposed</text>
<path d="M820,380 C820,320 180,320 180,380" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#plA)"/>
<text class="b a" x="480" y="310" text-anchor="middle">Prosecution → feedback</text>
<rect x="140" y="385" width="720" height="30" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<rect class="sa" x="250" y="391" width="14" height="18"/>
<rect class="sa" x="470" y="391" width="14" height="18"/>
<rect class="sa" x="700" y="391" width="14" height="18"/>
<text class="b" x="270" y="470" text-anchor="middle">Banks file reports</text>
<text class="b w" x="520" y="470" text-anchor="middle">Law enforcement reads</text>
<text class="b" x="750" y="470" text-anchor="middle">Prosecutors charge</text>
<text class="c" x="480" y="530" text-anchor="middle">More upstream capacity just piles higher</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A narrow tall rectangle beside a wide flat one on the same baseline, with the right roughly twice the area, showing lower unit price and higher volume yielding a bigger total.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">Price halved, why is the total still rising</text>

  <line x1="110" y1="390" x2="790" y2="390" stroke="var(--line)" stroke-width="2"/>

  <rect x="150" y="250" width="70" height="140" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="185" y="238" text-anchor="middle" font-size="16" fill="var(--dim)">Price $2</text>
  <text x="185" y="328" text-anchor="middle" font-size="19" fill="var(--ink)">Total 10</text>
  <text x="185" y="416" text-anchor="middle" font-size="15" fill="var(--dim)">Volume 5</text>
  <text x="185" y="452" text-anchor="middle" font-size="19" fill="var(--dim)">Before</text>

  <rect x="440" y="320" width="280" height="70" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="580" y="308" text-anchor="middle" font-size="16" fill="var(--dim)">Price $1</text>
  <text x="580" y="364" text-anchor="middle" font-size="19" fill="var(--accent)">Total 20</text>
  <text x="580" y="416" text-anchor="middle" font-size="15" fill="var(--dim)">Volume 20</text>
  <text x="580" y="452" text-anchor="middle" font-size="20" fill="var(--ink)">After</text>

  <path d="M250 200 L 405 200" stroke="var(--accent)" stroke-width="2.5" fill="none"/>
  <polygon points="418,200 402,193 402,207" fill="var(--accent)"/>
  <text x="330" y="180" text-anchor="middle" font-size="16" fill="var(--dim)">Price down</text>
  <text x="330" y="232" text-anchor="middle" font-size="16" fill="var(--accent)">Volume up</text>

  <text x="480" y="508" text-anchor="middle" font-size="22" fill="var(--ink)">Price down, volume up, total larger</text>
</svg>
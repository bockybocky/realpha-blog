<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左組：一根橘色長條旁邊是一條貼地的線；右組：同樣高度的橘色長條旁邊是一根高出近一倍的藍色疊加長條">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .n { font-size:18px; font-weight:700; }
    .b { font-size:16px; }
    .c { font-size:22px; font-weight:700; }
    .ac { fill:var(--accent); }
    .pg { fill:var(--page); }
</style>
<text x="60" y="52" class="t">同一張帳單，換個分母</text>
<text x="250" y="100" class="g" text-anchor="middle">之前：跟免費比</text>
<text x="700" y="100" class="g ac" text-anchor="middle">之後：跟工作比</text>
<line x1="470" y1="85" x2="470" y2="480" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="150" y="284" width="90" height="156" fill="var(--warn)"/>
<text x="195" y="272" class="n" text-anchor="middle">$1,300</text>
<line x1="270" y1="440" x2="360" y2="440" stroke="var(--dim)" stroke-width="4"/>
<text x="315" y="426" class="n" text-anchor="middle">$0</text>
<rect x="570" y="284" width="90" height="156" fill="var(--warn)"/>
<text x="615" y="272" class="n" text-anchor="middle">$1,300</text>
<rect x="710" y="344" width="110" height="96" fill="var(--accent)"/>
<rect x="710" y="140" width="110" height="204" fill="var(--accent)" fill-opacity="0.4"/>
<text x="765" y="386" class="b pg" text-anchor="middle">薪水</text>
<text x="765" y="408" class="b pg" text-anchor="middle">$800</text>
<text x="765" y="236" class="b" text-anchor="middle">廣告省一成</text>
<text x="765" y="258" class="b" text-anchor="middle">$1,700</text>
<text x="765" y="130" class="n ac" text-anchor="middle">$2,500</text>
<line x1="100" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="195" y="468" class="b" text-anchor="middle">帳單</text>
<text x="315" y="468" class="b" text-anchor="middle">免費</text>
<text x="615" y="468" class="b" text-anchor="middle">帳單</text>
<text x="765" y="468" class="b" text-anchor="middle">工作價值</text>
<text x="480" y="525" class="c" text-anchor="middle">1,300 ＜ 2,500：帳翻面</text>
</svg>
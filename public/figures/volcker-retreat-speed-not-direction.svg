<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="下行的通膨路徑在中途變緩但方向未變，另兩條虛線代表維持原力道與掉頭向上">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
</defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">後退的是速度，不是方向</text>
<rect x="60" y="90" width="840" height="350" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="150" y1="120" x2="150" y2="405" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="405" x2="870" y2="405" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="96" y="150">高</text>
<text class="s" x="96" y="400">低</text>
<text class="s" x="112" y="275">通膨</text>
<text class="s" x="810" y="432">時間</text>
<path d="M160 155 L390 292" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
<path d="M390 292 L860 340" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
<path d="M392 296 L640 400" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<path d="M392 288 L620 190" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>
<line x1="608" y1="178" x2="634" y2="202" stroke="var(--warn)" stroke-width="4"/>
<line x1="634" y1="178" x2="608" y2="202" stroke="var(--warn)" stroke-width="4"/>
<circle cx="390" cy="292" r="9" fill="var(--accent)"/>
<text class="g" x="300" y="126">一九七九起</text>
<text class="s" x="300" y="150">陡降</text>
<text class="g" x="418" y="268">一九八二下半年</text>
<text class="s" x="418" y="292">鬆手</text>
<text class="g" x="646" y="196">掉頭向上</text>
<text class="s" x="646" y="220">＝論點作廢</text>
<text class="s" x="654" y="404">維持原力道</text>
<text class="g" x="700" y="322">仍朝同一方向</text>
<text class="c" x="60" y="492">力道可以退，宣示不退</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="折線先平後升：1940 到 1980 年平在 23 年，家得寶創立後一路升到今天的 42 年">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .v { font-size:19px; font-weight:700; }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="60" y="56" class="t">美國房屋中位屋齡</text>
<line x1="120" y1="396" x2="880" y2="396" stroke="var(--line)" stroke-width="1"/>
<line x1="120" y1="332" x2="880" y2="332" stroke="var(--line)" stroke-width="1"/>
<line x1="120" y1="268" x2="880" y2="268" stroke="var(--line)" stroke-width="1"/>
<line x1="120" y1="204" x2="880" y2="204" stroke="var(--line)" stroke-width="1"/>
<line x1="120" y1="140" x2="880" y2="140" stroke="var(--line)" stroke-width="1"/>
<line x1="120" y1="130" x2="120" y2="460" stroke="var(--dim)" stroke-width="2"/>
<line x1="120" y1="460" x2="890" y2="460" stroke="var(--dim)" stroke-width="2"/>
<text x="108" y="466" class="b" text-anchor="end">0</text>
<text x="108" y="338" class="b" text-anchor="end">20</text>
<text x="108" y="210" class="b" text-anchor="end">40</text>
<text x="108" y="120" class="b" text-anchor="end">年</text>
<text x="120" y="488" class="b" text-anchor="middle">1940</text>
<text x="297" y="488" class="b" text-anchor="middle">1960</text>
<text x="474" y="488" class="b" text-anchor="middle">1980</text>
<text x="650" y="488" class="b" text-anchor="middle">2000</text>
<text x="827" y="488" class="b" text-anchor="middle">2020</text>
<line x1="465" y1="140" x2="465" y2="460" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="477" y="162" class="g">家得寶創立</text>
<polyline points="120,312.8 473.6,312.8 880,191.2" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round"/>
<circle cx="120" cy="312.8" r="7" fill="var(--accent)"/>
<circle cx="473.6" cy="312.8" r="7" fill="var(--accent)"/>
<circle cx="880" cy="191.2" r="7" fill="var(--accent)"/>
<text x="136" y="298" class="v">23 年</text>
<text x="300" y="298" class="b" text-anchor="middle">持平</text>
<text x="680" y="226" class="b" text-anchor="middle">一路往上</text>
<text x="870" y="176" class="v" text-anchor="end">42 年</text>
<text x="120" y="534" class="c">23 → 42 年</text>
</svg>
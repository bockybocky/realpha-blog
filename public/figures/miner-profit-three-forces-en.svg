<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A profit block is pushed up by one blue arrow and pressed down by two orange arrows: price goes up, while output and costs move the opposite way.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .ac { fill:var(--accent); }
    .wn { fill:var(--warn); }
    .inv { fill:var(--page); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="480" y="52" text-anchor="middle" class="t">Profit = Price × Output − Cost</text>
<rect x="411" y="100" width="18" height="100" fill="var(--warn)"/>
<polygon points="394,196 420,232 446,196" fill="var(--warn)"/>
<rect x="531" y="100" width="18" height="100" fill="var(--warn)"/>
<polygon points="514,196 540,232 566,196" fill="var(--warn)"/>
<text x="395" y="140" text-anchor="end" class="g wn">Output ↓</text>
<text x="395" y="166" text-anchor="end" class="d">Falling grades</text>
<text x="565" y="140" class="g wn">Cost ↑</text>
<text x="565" y="166" class="d">Power · water · acid · equipment</text>
<rect x="370" y="240" width="220" height="90" rx="12" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
<text x="480" y="296" text-anchor="middle" class="t">Profit?</text>
<rect x="471" y="372" width="18" height="88" fill="var(--accent)"/>
<polygon points="454,376 480,338 506,376" fill="var(--accent)"/>
<text x="505" y="420" class="g ac">Price ↑</text>
<text x="505" y="446" class="d">About $14,875/ton</text>
<text x="480" y="508" text-anchor="middle" class="c">One force up, two down</text>
</svg>
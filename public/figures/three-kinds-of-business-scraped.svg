<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三根由高到低的柱子，最右邊靠摩擦力的只剩一薄片，上方虛線是被刮掉的部分">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:20px; fill:var(--ink); font-weight:600; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="48" y="58">刮完之後還剩多少</text>
<line x1="48" y1="430" x2="912" y2="430" stroke="var(--line)" stroke-width="3"/>
<rect x="110" y="140" width="180" height="290" fill="var(--accent)"/>
<rect x="110" y="116" width="180" height="24" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="g" x="118" y="470">服務本身</text>
<text class="b" x="118" y="496">幾乎沒少</text>
<rect x="390" y="286" width="180" height="144" fill="var(--grey)"/>
<rect x="390" y="116" width="180" height="170" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="g" x="398" y="470">介面流量</text>
<text class="b" x="398" y="496">少一半</text>
<rect x="670" y="410" width="180" height="20" fill="var(--warn)"/>
<rect x="670" y="116" width="180" height="294" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="g" x="678" y="470">摩擦力</text>
<text class="b" x="678" y="496">刮得最乾淨</text>
<text class="b" x="676" y="106">被刮掉</text>
<text class="c" x="48" y="540">越靠你懶得動賺錢，剩得越少</text>
</svg>
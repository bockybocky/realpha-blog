<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Zoned chart with component share on the horizontal axis, where the left zone is absorbed downstream, the upper right pulls back, the lower right keeps buying, and lasers move along a dashed arrow from left to right toward a question mark.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text x="480" y="52" class="t" text-anchor="middle">Which cell will lasers land in?</text>
<text x="480" y="88" class="b" text-anchor="middle">Missing number: laser share of optical module cost</text>
<rect x="160" y="110" width="350" height="360" fill="var(--card)"/>
<rect x="160" y="110" width="700" height="360" fill="none" stroke="var(--line)" stroke-width="2"/>
<line x1="510" y1="110" x2="510" y2="470" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="510" y1="290" x2="860" y2="290" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="335" y="150" class="g" text-anchor="middle">Absorbed downstream</text>
<text x="685" y="145" class="b" text-anchor="middle">Buyer has alternatives</text>
<text x="685" y="172" class="g" text-anchor="middle">Pulls back</text>
<text x="685" y="425" class="b" text-anchor="middle">Buyer has no choice</text>
<text x="685" y="452" class="g" text-anchor="middle">Keeps buying · price up</text>
<circle cx="230" cy="340" r="10" fill="var(--dim)"/>
<text x="230" y="372" class="b" text-anchor="middle">Legacy memory · cameras</text>
<circle cx="640" cy="360" r="10" fill="var(--dim)"/>
<text x="640" y="392" class="b" text-anchor="middle">HBM · accelerator cards</text>
<line x1="314" y1="290" x2="588" y2="290" stroke="var(--accent)" stroke-width="3" stroke-dasharray="9 6"/>
<polygon points="586,282 600,290 586,298" fill="var(--accent)"/>
<circle cx="300" cy="290" r="12" fill="var(--accent)"/>
<text x="300" y="266" class="g" text-anchor="middle" style="fill:var(--accent)">Lasers</text>
<circle cx="626" cy="290" r="22" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5"/>
<text x="626" y="298" class="c" text-anchor="middle" style="fill:var(--accent)">?</text>
<line x1="160" y1="490" x2="848" y2="490" stroke="var(--ink)" stroke-width="2"/>
<polygon points="846,483 860,490 846,497" fill="var(--ink)"/>
<text x="160" y="518" class="b">Small</text>
<text x="860" y="518" class="b" text-anchor="end">Large</text>
<text x="510" y="518" class="b" text-anchor="middle">Component share of product price</text>
</svg>
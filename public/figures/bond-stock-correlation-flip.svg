<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="債股相關性在 2000 年前為正、2000 年後轉負、近年又翻回正值">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="40" y="58" font-size="27" font-weight="700" fill="var(--ink)">債股相關性：翻過去，又翻回來</text>

<rect x="90" y="110" width="800" height="150" fill="var(--card)"/>
<rect x="90" y="260" width="800" height="150" fill="var(--card)" opacity="0.5"/>
<line x1="90" y1="260" x2="890" y2="260" stroke="var(--ink)" stroke-width="2"/>
<text class="t" x="40" y="130" font-size="15" fill="var(--warn)">正相關</text>
<text class="t" x="40" y="404" font-size="15" fill="var(--accent)">負相關</text>
<text class="t" x="44" y="266" font-size="15" fill="var(--dim)">0</text>

<path d="M 110 180 L 200 160 L 300 195 L 400 170 L 470 250 L 540 330 L 640 350 L 720 320 L 780 250 L 850 180" fill="none" stroke="var(--ink)" stroke-width="3"/>

<line x1="470" y1="110" x2="470" y2="410" stroke="var(--grey)" stroke-width="1" stroke-dasharray="6 5"/>
<line x1="780" y1="110" x2="780" y2="410" stroke="var(--grey)" stroke-width="1" stroke-dasharray="6 5"/>
<text class="t" x="110" y="440" font-size="16" fill="var(--dim)">1970 ─ 1990 年代</text>
<text class="t" x="490" y="440" font-size="16" fill="var(--dim)">2000 ─ 2010 年代</text>
<text class="t" x="770" y="440" font-size="16" fill="var(--dim)">2020 ─</text>

<text class="t" x="150" y="150" font-size="19" font-weight="700" fill="var(--warn)">債市義勇軍</text>
<text class="t" x="560" y="390" font-size="19" font-weight="700" fill="var(--accent)">避險工具</text>
<text class="t" x="770" y="150" font-size="19" font-weight="700" fill="var(--warn)">又像股票</text>

<text class="t" x="40" y="498" font-size="22" font-weight="700" fill="var(--ink)">零線的哪一邊，就是公債的身分</text>
</svg>
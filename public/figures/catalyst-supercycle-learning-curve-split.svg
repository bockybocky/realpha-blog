<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一張圖上兩條相反的成本曲線，工廠裡做完的東西隨累積數量往下走，要在現場蓋的工程隨累積數量往上翹，兩條線在左側起點附近交叉後越拉越開">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">做得越多，一邊變便宜一邊變貴</text>

  <line x1="150" y1="450" x2="900" y2="450" stroke="var(--ink)" stroke-width="2"/>
  <line x1="150" y1="120" x2="150" y2="450" stroke="var(--ink)" stroke-width="2"/>
  <text x="128" y="134" font-size="16" fill="var(--dim)" text-anchor="end">單位成本</text>
  <text x="520" y="482" font-size="16" fill="var(--dim)" text-anchor="middle">累積做過的數量</text>
  <text x="900" y="482" font-size="16" fill="var(--dim)" text-anchor="end">第一百次</text>
  <text x="160" y="482" font-size="16" fill="var(--dim)">第一次</text>

  <path d="M 170 250 Q 420 174 900 158" fill="none" stroke="var(--warn)" stroke-width="5"/>
  <text x="884" y="138" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="end">要在現場蓋的工程</text>
  <g font-size="16" fill="var(--dim)" text-anchor="end">
    <text x="884" y="192">輸電線、走廊、許可</text>
    <text x="884" y="216">好走廊先用完，第十條更貴</text>
  </g>

  <path d="M 170 280 Q 420 400 900 420" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <text x="884" y="396" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="end">工廠裡做完的箱子</text>
  <g font-size="16" fill="var(--dim)" text-anchor="end">
    <text x="330" y="352">太陽能板、電池</text>
    <text x="330" y="376">功率元件、馬達</text>
  </g>

  <text x="60" y="530" font-size="22" font-weight="700" fill="var(--ink)">學習曲線要的是重複製造，一次性工程沒有這條線</text>
</svg>
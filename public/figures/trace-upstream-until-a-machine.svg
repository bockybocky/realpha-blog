<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="往上游追的五層漏斗，愈上游愈窄，最後收在做織機的那一家，頂端被一條橫線擋住">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text class="t" x="60" y="60">一層一層問「這一層要用什麼做」</text>

  <rect x="180" y="470" width="600" height="60" fill="var(--grey)"/>
  <text class="g" x="480" y="508" text-anchor="middle">伺服器電路板</text>

  <rect x="240" y="392" width="480" height="60" fill="var(--grey)"/>
  <text class="g" x="480" y="430" text-anchor="middle">低介電玻纖布</text>

  <rect x="300" y="314" width="360" height="60" fill="var(--grey)"/>
  <text class="g" x="480" y="352" text-anchor="middle">玻璃纖維紗</text>

  <rect x="360" y="236" width="240" height="60" fill="var(--accent)"/>
  <text class="g" x="480" y="274" text-anchor="middle">噴氣織機</text>

  <rect x="400" y="158" width="160" height="60" fill="var(--warn)"/>
  <text class="g" x="480" y="196" text-anchor="middle">做織機的公司</text>

  <line x1="360" y1="124" x2="600" y2="124" stroke="var(--warn)" stroke-width="6"/>
  <text class="g" x="620" y="130">到這裡停住</text>

  <path d="M 150 470 L 150 180" stroke="var(--dim)" stroke-width="3"/>
  <path d="M 150 180 L 142 200 L 158 200 Z" fill="var(--dim)"/>
  <text class="d" x="86" y="330">往上游</text>

  <text class="d" x="640" y="196">一年兩千五百台上下</text>
  <text class="d" x="640" y="274">有人一年進三百台</text>

  <text class="c" x="60" y="568">想擴產要先有機台，而機台本身就是瓶頸</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Six lines converge from the left, squeeze through one narrow neck in the middle, and fan out again.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" fill="var(--ink)">All of it, one neck</text>
<path d="M120 150 C 300 150, 400 280, 470 280" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M120 210 C 300 210, 400 280, 470 280" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M120 270 C 300 270, 400 280, 470 280" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M120 330 C 300 330, 400 290, 470 290" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M120 390 C 300 390, 400 290, 470 290" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M120 450 C 300 450, 400 290, 470 290" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M490 280 C 560 280, 640 170, 840 170" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M490 282 C 560 282, 640 230, 840 230" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M490 285 C 560 285, 640 285, 840 285" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M490 288 C 560 288, 640 340, 840 340" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M490 290 C 560 290, 640 400, 840 400" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="462" y="120" width="36" height="130" rx="6" fill="var(--accent)"/>
<rect x="462" y="320" width="36" height="130" rx="6" fill="var(--accent)"/>
<text x="480" y="104" font-size="19" fill="var(--ink)" text-anchor="middle">No substitute</text>
<text x="120" y="492" font-size="16" fill="var(--dim)">Demand</text>
<text x="840" y="492" font-size="16" fill="var(--dim)" text-anchor="end">Markets</text>
<text x="60" y="536" font-size="22" fill="var(--ink)">Neck = your heel</text>
</svg>
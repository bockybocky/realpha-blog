<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The diagonal marks usage in step with time; sitting above it means running ahead and not lasting until the reset.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">Room to spare is not percent left</text>

  <rect x="140" y="120" width="680" height="310" fill="var(--card)"/>
  <path d="M 140 430 L 820 430 M 140 430 L 140 120" stroke="var(--line)" stroke-width="2" fill="none"/>
  <path d="M 140 430 L 820 120" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7" fill="none"/>
  <text x="700" y="150" font-size="16" fill="var(--grey)">In step</text>

  <text x="300" y="180" font-size="19" fill="var(--warn)">Ahead</text>
  <text x="600" y="392" font-size="19" fill="var(--dim)">Spare</text>

  <circle cx="290" cy="226" r="9" fill="var(--warn)"/>
  <text x="308" y="222" font-size="19" fill="var(--ink)">Codex</text>
  <text x="308" y="248" font-size="16" fill="var(--dim)">Amber　·　well ahead</text>

  <circle cx="324" cy="349" r="9" fill="var(--accent)"/>
  <text x="344" y="345" font-size="19" fill="var(--ink)">Claude</text>
  <text x="344" y="371" font-size="16" fill="var(--dim)">Green　·　on the line</text>

  <text x="140" y="462" font-size="16" fill="var(--dim)">Window elapsed →</text>
  <text x="60" y="126" font-size="16" fill="var(--dim)">Quota used ↑</text>

  <text x="60" y="506" font-size="22" fill="var(--ink)">Distance from the line is the room.</text>
</svg>
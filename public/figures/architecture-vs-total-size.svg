<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左邊小圓分兩塊，右邊大圓分兩塊，一條橫帶貫穿兩者底部">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">架構之爭是切法，總量之爭是餅</text>

<text x="250" y="112" font-size="19" fill="var(--dim)" text-anchor="middle">誰贏</text>
<path d="M250 290 L250 180 A110 110 0 0 1 250 400 Z" fill="var(--accent)" opacity="0.3"/>
<path d="M250 290 L250 400 A110 110 0 0 1 250 180 Z" fill="var(--grey)" opacity="0.3"/>
<circle cx="250" cy="290" r="110" fill="none" stroke="var(--line)" stroke-width="2"/>
<text x="320" y="296" font-size="16" fill="var(--ink)">一種架構</text>
<text x="180" y="296" font-size="16" fill="var(--dim)" text-anchor="end">另一種</text>

<text x="700" y="112" font-size="19" fill="var(--accent)" text-anchor="middle">可以搶的市場</text>
<circle cx="700" cy="290" r="176" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="9 8"/>
<path d="M700 290 L700 140 A150 150 0 0 1 700 440 Z" fill="var(--accent)" opacity="0.3"/>
<path d="M700 290 L700 440 A150 150 0 0 1 700 140 Z" fill="var(--grey)" opacity="0.3"/>
<circle cx="700" cy="290" r="150" fill="none" stroke="var(--line)" stroke-width="2"/>

<rect x="48" y="472" width="864" height="52" rx="10" fill="var(--accent)" opacity="0.16"/>
<rect x="48" y="472" width="864" height="52" rx="10" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="480" y="505" font-size="19" fill="var(--ink)" text-anchor="middle">不管誰贏，都得經過的那一段</text>
</svg>
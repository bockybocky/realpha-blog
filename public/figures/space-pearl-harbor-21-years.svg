<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="二十一年的長軸上一個事件都沒有，末端機率曲線往上翹">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">講了二十一年，一次都沒發生</text>

<line x1="90" y1="300" x2="830" y2="300" stroke="var(--grey)" stroke-width="4"/>
<circle cx="90" cy="300" r="10" fill="var(--accent)"/>
<text x="66" y="346" font-size="19" font-weight="700" fill="var(--ink)">2005</text>
<text x="66" y="374" font-size="16" fill="var(--dim)">五角大廈開始講</text>
<circle cx="830" cy="300" r="10" fill="var(--accent)"/>
<text x="788" y="346" font-size="19" font-weight="700" fill="var(--ink)">2026</text>

<text x="380" y="266" font-size="20" font-weight="700" fill="var(--dim)">空的二十一年</text>

<path d="M830 300 C880 300 900 240 912 160" fill="none" stroke="var(--warn)" stroke-width="5"/>
<polygon points="912,152 900,186 926,190" fill="var(--warn)"/>
<text x="700" y="140" font-size="19" font-weight="700" fill="var(--warn)">機率在升</text>

<text x="60" y="446" font-size="22" font-weight="700" fill="var(--ink)">空白這麼長，不是因為它不會來。</text>
</svg>
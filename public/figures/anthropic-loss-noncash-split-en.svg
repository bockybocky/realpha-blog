<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Most of the $80 billion loss bar consists of non-cash items, with only a small segment representing cash actually burned.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">$80 Billion Lost, Just Over $8 Billion Paid</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">Unit: $100 Million</text>

<rect x="60" y="180" width="840" height="100" rx="6" fill="none" stroke="var(--ink)" stroke-width="2"/>
<rect x="60" y="180" width="756" height="100" rx="6" fill="var(--grey)" opacity="0.4"/>
<rect x="816" y="180" width="84" height="100" rx="6" fill="var(--accent)"/>
<text class="t" x="60" y="162" font-size="16" fill="var(--dim)">Reported Net Loss 800</text>
<text class="t" x="90" y="238" font-size="20" font-weight="700" fill="var(--ink)">Non-Cash: About 720</text>
<text class="t" x="90" y="266" font-size="16" fill="var(--dim)">Convertible Equity and Revaluation</text>
<text class="t" x="700" y="320" font-size="20" font-weight="700" fill="var(--accent)">Cash Burn: 80+</text>
<text class="t" x="700" y="348" font-size="16" fill="var(--dim)">Compute Contracts</text>
<line x1="858" y1="286" x2="858" y2="300" stroke="var(--accent)" stroke-width="3"/>

<line x1="60" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="444" font-size="22" font-weight="700" fill="var(--ink)">For Any Big Number, First Ask Whether Cash Was Paid</text>
<text class="t" x="60" y="476" font-size="16" fill="var(--dim)">Reported Loss and Cash Differ Tenfold</text>
</svg>
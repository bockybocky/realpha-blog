<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three bars of very different heights, the shortest being this year and the tallest being 1999.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .sub { font-size:16px; fill:var(--dim); }
    .grp { font-size:19px; fill:var(--ink); }
    .val { font-size:20px; fill:var(--ink); font-weight:700; }
    .dimtxt { font-size:15px; fill:var(--dim); }
    .concl { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="62">Same label, very different contents</text>
  <text class="sub" x="60" y="92">Share of the market down more than 30% year to date</text>

  <line x1="150" y1="440" x2="850" y2="440" stroke="var(--line)" stroke-width="2"/>

  <line x1="150" y1="269" x2="850" y2="269" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="dimtxt" x="850" y="260" text-anchor="end">Both guessed above 10%</text>

  <rect x="220" y="371" width="110" height="69" fill="var(--accent)"/>
  <text class="val" x="275" y="356" text-anchor="middle">4%</text>
  <text class="grp" x="275" y="470" text-anchor="middle">2026 so far</text>

  <rect x="430" y="269" width="110" height="171" fill="var(--grey)"/>
  <text class="val" x="485" y="254" text-anchor="middle">10%</text>
  <text class="grp" x="485" y="470" text-anchor="middle">1998</text>

  <rect x="640" y="200" width="110" height="240" fill="var(--grey)"/>
  <text class="val" x="695" y="185" text-anchor="middle">14%</text>
  <text class="grp" x="695" y="470" text-anchor="middle">1999</text>
  <text class="dimtxt" x="695" y="498" text-anchor="middle">Sears · Radio Shack · Pier One · Sam Goody</text>
  <text class="dimtxt" x="695" y="520" text-anchor="middle">plus a wave of steel bankruptcies</text>

  <text class="concl" x="60" y="524">Bad breadth, different order of magnitude</text>
</svg>
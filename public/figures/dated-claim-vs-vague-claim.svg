<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="無日期的說法向外散開，有日期的說法被釘在時間軸上並留下檢查點">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">一句話有沒有到期日</text>

<text class="t" x="60" y="128" font-size="19" font-weight="600" fill="var(--dim)">沒有日期</text>
<rect x="60" y="148" width="200" height="56" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="160" y="184" font-size="19" fill="var(--ink)" text-anchor="middle">需求強勁</text>
<path d="M270 162 L470 140" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M270 176 L480 176" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M270 190 L470 212" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="t" x="500" y="182" font-size="16" fill="var(--dim)">怎麼收都接得住</text>

<text class="t" x="60" y="300" font-size="19" font-weight="600" fill="var(--accent)">有日期</text>
<rect x="60" y="320" width="200" height="56" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="160" y="356" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">售罄到 2029</text>
<path d="M270 348 L880 348" stroke="var(--accent)" stroke-width="3"/>
<circle cx="380" cy="348" r="7" fill="var(--accent)"/>
<circle cx="500" cy="348" r="7" fill="var(--accent)"/>
<circle cx="620" cy="348" r="7" fill="var(--accent)"/>
<circle cx="740" cy="348" r="7" fill="var(--accent)"/>
<rect x="862" y="326" width="18" height="44" rx="4" fill="var(--accent)"/>
<text class="t" x="380" y="392" font-size="15" fill="var(--dim)" text-anchor="middle">出貨</text>
<text class="t" x="500" y="392" font-size="15" fill="var(--dim)" text-anchor="middle">交期</text>
<text class="t" x="620" y="392" font-size="15" fill="var(--dim)" text-anchor="middle">長約</text>
<text class="t" x="740" y="392" font-size="15" fill="var(--dim)" text-anchor="middle">出貨</text>
<text class="t" x="871" y="396" font-size="15" font-weight="600" fill="var(--accent)" text-anchor="middle">到期</text>
<text class="t" x="60" y="462" font-size="22" font-weight="600" fill="var(--ink)">會被打臉的那一種，才值得抄進筆記</text>
</svg>
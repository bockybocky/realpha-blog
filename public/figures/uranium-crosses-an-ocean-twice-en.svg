<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Mined uranium arcs over an ocean to be enriched in Russia and Europe and then arcs back to the United States, where the domestic enrichment box is drawn as an empty outline.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型：繁體中文無襯線 */
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">The fuel loop</text>
<rect x="300" y="90" width="360" height="400" fill="var(--card)"/>
<text x="420" y="470" font-size="19" fill="var(--dim)">Ocean</text>
<rect x="60" y="250" width="190" height="110" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="82" y="298" font-size="20" font-weight="600" fill="var(--ink)">Mine</text>
<text x="82" y="328" font-size="16" fill="var(--dim)">Kazakh・Canada</text>
<rect x="390" y="130" width="190" height="104" rx="10" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="412" y="176" font-size="20" font-weight="600" fill="var(--ink)">Enrich</text>
<text x="412" y="206" font-size="16" fill="var(--dim)">Russia・EU</text>
<path d="M250,290 Q320,180 390,182" fill="none" stroke="var(--accent)" stroke-width="5"/>
<path d="M580,182 Q660,186 718,290" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polygon points="718,296 706,268 734,272" fill="var(--accent)"/>
<rect x="710" y="230" width="190" height="170" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="732" y="276" font-size="20" font-weight="600" fill="var(--ink)">US</text>
<text x="732" y="304" font-size="16" fill="var(--dim)">94 reactors</text>
<rect x="732" y="326" width="146" height="54" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>
<text x="752" y="360" font-size="17" fill="var(--grey)">Enrich: 0</text>
<text x="60" y="100" font-size="22" font-weight="600" fill="var(--ink)">The middle link is missing</text>
</svg>
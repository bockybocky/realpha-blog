<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="由下往上的樹狀圖：底部一根主幹，向上分成五枝，每枝掛一片葉子，右側標註葉與幹的差別" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩格柱狀對比：以前你和鄰居差不多高；現在你變高了，但比較對象換成前百分之一，高出一大截">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); font-size:16px; }
</style>
<text x="480" y="48" text-anchor="middle" style="font-size:27px;font-weight:700">你往上走，尺也換了</text>
<text x="265" y="92" text-anchor="middle" style="font-size:20px;font-weight:700">以前：跟鄰居比</text>
<text x="700" y="92" text-anchor="middle" style="font-size:20px;font-weight:700">現在：跟演算法推的人比</text>
<line x1="480" y1="110" x2="480" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="90" y1="450" x2="890" y2="450" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="330" width="90" height="120" rx="6" fill="var(--accent)"/>
<rect x="290" y="320" width="90" height="130" rx="6" fill="var(--grey)"/>
<rect x="580" y="250" width="90" height="200" rx="6" fill="var(--accent)"/>
<rect x="730" y="120" width="90" height="330" rx="6" fill="var(--warn)"/>
<line x1="195" y1="330" x2="625" y2="250" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="250" y="302" text-anchor="middle" style="font-size:16px;fill:var(--accent);font-weight:700">你變好了</text>
<line x1="834" y1="120" x2="834" y2="250" stroke="var(--warn)" stroke-width="3"/>
<line x1="826" y1="250" x2="842" y2="250" stroke="var(--warn)" stroke-width="3"/>
<text x="848" y="192" style="font-size:19px;fill:var(--warn);font-weight:700">落差</text>
<text x="195" y="482" text-anchor="middle" style="font-size:19px">你</text>
<text x="335" y="482" text-anchor="middle" style="font-size:19px;fill:var(--dim)">鄰居</text>
<text x="625" y="482" text-anchor="middle" style="font-size:19px">你</text>
<text x="775" y="482" text-anchor="middle" style="font-size:19px;fill:var(--warn)">前 1%</text>
<text x="480" y="535" text-anchor="middle" style="font-size:22px;font-weight:700">數字往上，心情看的是尺</text>
</svg>
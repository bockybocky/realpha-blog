<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條時間軸上四個標記，四月底與七月底相隔很寬，七月底到九月底、再到十月初急速壓縮，右側三點被一個括號圈在一起標為同一件事。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">公司先講，兩週內變成快訊</text>

  <line x1="80" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="3"/>
  <circle cx="90" cy="300" r="11" fill="var(--grey)"/>
  <circle cx="470" cy="300" r="14" fill="var(--accent)"/>
  <circle cx="708" cy="300" r="11" fill="var(--grey)"/>
  <circle cx="767" cy="300" r="11" fill="var(--grey)"/>

  <text class="t" x="90" y="262" font-size="19" fill="var(--dim)" text-anchor="middle">4／29</text>
  <text class="t" x="90" y="346" font-size="16" fill="var(--ink)" text-anchor="middle">估約 1,900 億</text>

  <text class="t" x="470" y="262" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">7／29</text>
  <text class="t" x="470" y="346" font-size="16" fill="var(--ink)" text-anchor="middle">財務長講口徑變動</text>
  <text class="t" x="470" y="372" font-size="16" fill="var(--ink)" text-anchor="middle">改估約 1,750 億</text>

  <text class="t" x="708" y="262" font-size="19" fill="var(--dim)" text-anchor="middle">9／24</text>
  <text class="t" x="700" y="346" font-size="16" fill="var(--ink)" text-anchor="end">貝利發文</text>
  <text class="t" x="767" y="232" font-size="19" fill="var(--dim)" text-anchor="middle">10／8</text>
  <text class="t" x="790" y="346" font-size="16" fill="var(--ink)">中文快訊</text>

  <path d="M470 196 L470 180 L767 180 L767 196" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="618" y="166" font-size="19" fill="var(--dim)" text-anchor="middle">同一件事</text>

  <line x1="48" y1="430" x2="912" y2="430" stroke="var(--line)"/>
  <text class="t" x="48" y="472" font-size="22" font-weight="700" fill="var(--ink)">數字沒錯，錯的是「被揭露」</text>
</svg>
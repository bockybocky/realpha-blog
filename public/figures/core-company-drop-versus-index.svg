<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三根向下柱子長度差極大：十四、七、零點一七個百分點，最右邊那根只剩一條細線">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .n { font-size:20px; fill:var(--ink); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="68">心臟跌十四，身體跌零點一七</text>
<text class="b" x="60" y="100">同一個交易日，錄音當天的盤中說法</text>

<line x1="90" y1="160" x2="880" y2="160" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="90" y="146">零線</text>

<rect x="150" y="160" width="130" height="280" rx="6" fill="var(--warn)"/>
<text class="n" x="215" y="474" text-anchor="middle">負十四</text>
<text class="g" x="215" y="506" text-anchor="middle">核心公司</text>
<text class="b" x="215" y="532" text-anchor="middle">盤中，市值跌破四兆美元</text>

<rect x="415" y="160" width="130" height="140" rx="6" fill="var(--accent)"/>
<text class="n" x="480" y="474" text-anchor="middle">負七</text>
<text class="g" x="480" y="506" text-anchor="middle">同一檔</text>
<text class="b" x="480" y="532" text-anchor="middle">九點五十五分收斂後</text>

<rect x="680" y="160" width="130" height="4" rx="2" fill="var(--accent)"/>
<text class="n" x="745" y="474" text-anchor="middle">負零點一七</text>
<text class="g" x="745" y="506" text-anchor="middle">大盤</text>
<text class="b" x="745" y="532" text-anchor="middle">標普 500</text>

<text class="c" x="480" y="398" text-anchor="middle">人走了，競賽照舊</text>
</svg>
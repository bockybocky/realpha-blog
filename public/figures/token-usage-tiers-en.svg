<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Token usage comes in three tiers, with decisions and actions lowest, pulled up toward coding height by a continuous loop.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>svg{--page:#ffffff;--card:#f6f8fc;--line:#dde3ee;--ink:#1a212b;--dim:#57616f;--grey:#b9c2d0;--accent:#1f6feb;--warn:#d97706;}@media (prefers-color-scheme: dark){svg{--page:#0d1117;--card:#161b22;--line:#272e39;--ink:#e6edf3;--dim:#8b949e;--grey:#4a5464;--accent:#58a6ff;--warn:#d29922;}}text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}</style>
<text x="60" y="58" font-size="27" font-weight="700">Your token tier decides whether you can afford to pick on quality</text>
<line x1="110" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="120" width="130" height="310" rx="6" fill="var(--grey)"/>
<text x="215" y="462" font-size="19" font-weight="700" text-anchor="middle">Coding</text>
<rect x="380" y="268" width="130" height="162" rx="6" fill="var(--grey)"/>
<text x="445" y="462" font-size="19" font-weight="700" text-anchor="middle">Legal documents</text>
<rect x="610" y="366" width="130" height="64" rx="6" fill="var(--accent)"/>
<text x="675" y="462" font-size="19" font-weight="700" text-anchor="middle" fill="var(--accent)">Decisions and actions</text>
<text x="675" y="494" font-size="16" text-anchor="middle" fill="var(--dim)">One tier lower</text>
<path d="M790 366 C840 300 840 200 800 136" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 7"/>
<polygon points="798,128 788,144 808,146" fill="var(--warn)"/>
<text x="818" y="268" font-size="17" font-weight="700" fill="var(--warn)">A loop that</text>
<text x="818" y="292" font-size="17" font-weight="700" fill="var(--warn)">never ends</text>
<text x="150" y="104" font-size="16" fill="var(--dim)">Whale</text>
</svg>
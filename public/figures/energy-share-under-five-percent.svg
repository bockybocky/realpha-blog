<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="前沿模型花費的長條圖：研發與晶片佔掉幾乎整條，能源只剩最右邊一條窄縫，而那條窄縫被標為最缺的東西">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="80" y="80">前沿模型的錢花到哪裡</text>
<text class="b" x="80" y="112">一整條＝總花費</text>

<rect x="80" y="200" width="760" height="96" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="80" y="200" width="722" height="96" rx="6" fill="var(--accent)" opacity="0.85"/>
<rect x="802" y="200" width="38" height="96" fill="var(--warn)"/>

<text class="g" x="110" y="256" fill="var(--page)">研發人員　AI 晶片</text>
<line x1="821" y1="180" x2="821" y2="196" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="821" y="166" text-anchor="middle" fill="var(--warn)">能源</text>
<text class="b" x="821" y="140" text-anchor="middle" fill="var(--warn)">不到 5%</text>

<text class="b" x="80" y="330">↑ 還能自己控制的變數</text>
<text class="b" x="840" y="330" text-anchor="end" fill="var(--warn)">↑ 最缺的那一塊</text>

<line x1="80" y1="382" x2="880" y2="382" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="80" y="432">搶不到，就不在那上面加價</text>
<text class="b" x="80" y="466">錢繞道，改買能繞過它的東西</text>
</svg>
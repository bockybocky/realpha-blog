<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條長條被切成兩段，左段略過半是合約價，右段接近一半是現貨採購">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">近一半在合約外</text>
<text x="120" y="122" font-size="19" fill="var(--dim)">第三季算力支出　總計 100 億美元</text>
<rect x="120" y="150" width="396" height="96" fill="var(--accent)"/>
<rect x="516" y="150" width="324" height="96" fill="var(--warn)"/>
<text x="150" y="207" font-size="16" fill="var(--page)">合約價 55 億</text>
<text x="552" y="207" font-size="16" fill="var(--page)">現貨 45 億</text>
<line x1="480" y1="140" x2="480" y2="258" stroke="var(--dim)" stroke-dasharray="5 5"/>
<text x="480" y="280" text-anchor="middle" font-size="15" fill="var(--dim)">一半</text>
<path d="M516,300 L516,326 L840,326 L840,300" fill="none" stroke="var(--dim)"/>
<text x="678" y="358" text-anchor="middle" font-size="16" fill="var(--dim)">上市前兩週，用貴的價格補上</text>
<text x="480" y="452" text-anchor="middle" font-size="22" fill="var(--ink)">貴的那一段，是買不到的痕跡</text>
</svg>
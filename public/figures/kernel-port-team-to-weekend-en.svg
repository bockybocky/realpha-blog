<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two bars of very different lengths: the past bar spans months, the present is a short stub with a dashed outline showing the original length">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">Same job: from a team to a weekend</text>
<text x="60" y="150" font-size="19" fill="var(--dim)">Before · an engineering team</text>
<rect x="60" y="170" width="700" height="54" rx="6" fill="var(--grey)"/>
<text x="778" y="205" font-size="16" fill="var(--dim)">Months</text>
<text x="60" y="300" font-size="19" fill="var(--accent)">Now · one agent</text>
<rect x="60" y="320" width="700" height="54" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="60" y="320" width="96" height="54" rx="6" fill="var(--accent)"/>
<text x="174" y="355" font-size="16" fill="var(--accent)">A weekend</text>
<line x1="60" y1="392" x2="156" y2="392" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="416" font-size="15" fill="var(--dim)">Friday</text>
<text x="126" y="416" font-size="15" fill="var(--dim)">Monday</text>
<text x="60" y="478" font-size="22" fill="var(--ink)">Agents do checkable, not hard</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A bell curve cut into three segments, both tails marked un-hedgeable and only the middle marked as where work can be done">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:20px; font-weight:700; fill:var(--ink); }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<defs>
<clipPath id="clipL"><rect x="110" y="100" width="200" height="340"/></clipPath>
<clipPath id="clipM"><rect x="310" y="100" width="350" height="340"/></clipPath>
<clipPath id="clipR"><rect x="660" y="100" width="200" height="340"/></clipPath>
</defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="480" y="60" text-anchor="middle">Three scenarios, only one you can bet on</text>

<path d="M 120,430 C 300,430 300,150 485,150 C 670,150 670,430 850,430 Z" fill="var(--warn)" fill-opacity="0.16" clip-path="url(#clipL)"/>
<path d="M 120,430 C 300,430 300,150 485,150 C 670,150 670,430 850,430 Z" fill="var(--accent)" fill-opacity="0.18" clip-path="url(#clipM)"/>
<path d="M 120,430 C 300,430 300,150 485,150 C 670,150 670,430 850,430 Z" fill="var(--warn)" fill-opacity="0.16" clip-path="url(#clipR)"/>
<path d="M 120,430 C 300,430 300,150 485,150 C 670,150 670,430 850,430" fill="none" stroke="var(--ink)" stroke-width="3"/>

<line x1="310" y1="150" x2="310" y2="430" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="660" y1="150" x2="660" y2="430" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 6"/>

<line x1="120" y1="430" x2="850" y2="430" stroke="var(--line)" stroke-width="3"/>
<line x1="310" y1="430" x2="660" y2="430" stroke="var(--accent)" stroke-width="7"/>

<text paint-order="stroke" stroke="var(--page)" stroke-width="5" stroke-linejoin="round" class="g" x="212" y="358" text-anchor="middle" fill="var(--warn)">Extreme bad</text>
<text paint-order="stroke" stroke="var(--page)" stroke-width="5" stroke-linejoin="round" class="b" x="212" y="388" text-anchor="middle">Holdings lose meaning</text>
<text class="g" x="485" y="290" text-anchor="middle">Middle scenario</text>
<text class="b" x="485" y="320" text-anchor="middle">Real winners and losers</text>
<text paint-order="stroke" stroke="var(--page)" stroke-width="5" stroke-linejoin="round" class="g" x="756" y="358" text-anchor="middle" fill="var(--warn)">Extreme good</text>
<text paint-order="stroke" stroke="var(--page)" stroke-width="5" stroke-linejoin="round" class="b" x="756" y="388" text-anchor="middle">Returns lose coordinates</text>

<text class="b" x="212" y="470" text-anchor="middle">Cannot hedge</text>
<text class="b" x="485" y="470" text-anchor="middle">Work can be done</text>
<text class="b" x="756" y="470" text-anchor="middle">Cannot hedge</text>

<text class="c" x="480" y="524" text-anchor="middle">Neither tail is bettable; discipline lives in the middle</text>
</svg>
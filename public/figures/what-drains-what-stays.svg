<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="之前與之後兩格對比：四個推高價格的因素中，兩個在水退後淡出消失，兩個仍留在原地">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">水退了會消失的，和不會的</text>
<text x="60" y="86" font-size="16" fill="var(--dim)">四個推高價格的因素</text>

<text x="240" y="140" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">災難當下</text>
<rect x="70" y="158" width="340" height="300" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="98" y="186" width="284" height="56" fill="var(--grey)"/>
<text x="240" y="222" font-size="16" text-anchor="middle" fill="var(--ink)">多年期長約</text>
<rect x="98" y="254" width="284" height="56" fill="var(--grey)"/>
<text x="240" y="290" font-size="16" text-anchor="middle" fill="var(--ink)">重複建廠成本</text>
<rect x="98" y="322" width="284" height="56" fill="var(--accent)"/>
<text x="240" y="358" font-size="16" text-anchor="middle" fill="var(--page)">需求轉向平板與快閃</text>
<rect x="98" y="390" width="284" height="56" fill="var(--accent)"/>
<text x="240" y="426" font-size="16" text-anchor="middle" fill="var(--page)">主要玩家五家變三家</text>

<line x1="450" y1="308" x2="510" y2="308" stroke="var(--dim)" stroke-width="3"/>
<path d="M500 300 L512 308 L500 316 Z" fill="var(--dim)"/>

<text x="720" y="140" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">水退之後</text>
<rect x="550" y="158" width="340" height="300" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="578" y="186" width="284" height="56" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>
<text x="720" y="222" font-size="16" text-anchor="middle" fill="var(--dim)">到期了</text>
<rect x="578" y="254" width="284" height="56" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>
<text x="720" y="290" font-size="16" text-anchor="middle" fill="var(--dim)">攤完了</text>
<rect x="578" y="322" width="284" height="56" fill="var(--accent)"/>
<text x="720" y="358" font-size="16" text-anchor="middle" fill="var(--page)">還在原地</text>
<rect x="578" y="390" width="284" height="56" fill="var(--accent)"/>
<text x="720" y="426" font-size="16" text-anchor="middle" fill="var(--page)">還在原地</text>

<text x="480" y="504" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">判準只有一句：水退了它會不會自己消失</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三條從左往右收窄的管道，上面那條幾乎不收窄，中間那條收一半，最下面那條收到只剩一線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">慢下來，不是停下來</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">三種進度的資料中心（示意）</text>
<polygon points="200,135 760,141 760,199 200,205" fill="var(--accent)" opacity="0.85"/>
<text x="190" y="176" font-size="19" fill="var(--ink)" text-anchor="end">蓋到一半、執照齊</text>
<text x="780" y="176" font-size="19" fill="var(--dim)">跑完</text>
<polygon points="200,265 760,285 760,315 200,335" fill="var(--accent)" opacity="0.85"/>
<text x="190" y="306" font-size="19" fill="var(--ink)" text-anchor="end">執照還沒拿齊</text>
<text x="780" y="306" font-size="19" fill="var(--dim)">有被停的風險</text>
<polygon points="200,385 760,416 760,423 200,455" fill="var(--accent)" opacity="0.85"/>
<text x="190" y="426" font-size="19" fill="var(--ink)" text-anchor="end">還在規劃、提案</text>
<text x="780" y="426" font-size="19" fill="var(--dim)">多數胎死腹中</text>
<text x="60" y="505" font-size="22" fill="var(--ink)" font-weight="700">新場地要時間，速度往下走</text>
</svg>
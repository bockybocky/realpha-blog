<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四格代價方陣，只有留在裡面而判斷錯誤那一格的代價柱特別深">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">顧問的四格代價</text>

<text class="t" x="420" y="104" font-size="19" font-weight="700" fill="var(--dim)">後來對了</text>
<text class="t" x="700" y="104" font-size="19" font-weight="700" fill="var(--dim)">後來錯了</text>
<text class="t" x="70" y="200" font-size="19" font-weight="700" fill="var(--ink)">留在裡面</text>
<text class="t" x="70" y="380" font-size="19" font-weight="700" fill="var(--ink)">還錢給客戶</text>

<rect x="380" y="128" width="220" height="150" rx="8" fill="var(--card)"/>
<rect x="380" y="248" width="220" height="30" rx="4" fill="var(--grey)"/>
<text class="t" x="400" y="170" font-size="16" fill="var(--dim)">沒人記得</text>

<rect x="660" y="128" width="220" height="150" rx="8" fill="var(--card)"/>
<rect x="660" y="148" width="220" height="130" rx="4" fill="var(--warn)"/>
<text class="t" x="680" y="216" font-size="19" font-weight="700" fill="var(--page)">被開除</text>

<rect x="380" y="308" width="220" height="150" rx="8" fill="var(--card)"/>
<rect x="380" y="438" width="220" height="20" rx="4" fill="var(--grey)"/>
<text class="t" x="400" y="350" font-size="16" fill="var(--dim)">有點尷尬</text>

<rect x="660" y="308" width="220" height="150" rx="8" fill="var(--card)"/>
<rect x="660" y="444" width="220" height="14" rx="4" fill="var(--accent)"/>
<text class="t" x="680" y="350" font-size="16" fill="var(--accent)">像英雄</text>

<text class="t" x="60" y="524" font-size="22" font-weight="700" fill="var(--ink)">一格見底，其餘三格幾乎無感</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="1999 年營收 50 億、累積虧損 35 億的矮柱，對比 2023 年營收 220 億、營業利益 40 億的高柱">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">同一家公司，相隔二十四年</text>

  <line x1="60" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>

  <rect x="170" y="340" width="80" height="60" fill="var(--grey)"/>
  <text class="t" x="210" y="325" font-size="16" fill="var(--dim)" text-anchor="middle">營收 50 億</text>
  <rect x="280" y="400" width="54" height="42" fill="var(--warn)"/>
  <text class="t" x="307" y="470" font-size="16" fill="var(--warn)" text-anchor="middle">累虧 35 億</text>
  <text class="t" x="250" y="505" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">1999</text>

  <rect x="600" y="136" width="80" height="264" fill="var(--accent)"/>
  <text class="t" x="640" y="121" font-size="16" fill="var(--dim)" text-anchor="middle">營收 220 億</text>
  <rect x="710" y="352" width="54" height="48" fill="var(--accent)"/>
  <text class="t" x="737" y="337" font-size="16" fill="var(--dim)" text-anchor="middle">利益 40 億</text>
  <text class="t" x="680" y="505" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">2023</text>

  <text class="t" x="900" y="80" font-size="22" font-weight="700" fill="var(--accent)" text-anchor="end">營益率 20%</text>
</svg>
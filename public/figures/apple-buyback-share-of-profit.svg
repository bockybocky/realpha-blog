<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩根等長的百分比橫條，幾乎整根都被填滿，只剩右端很細的一小截空白">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="60">賺的錢，幾乎原封不動還回去</text>

  <text class="g" x="60" y="122">2015–2025 十一年　淨利 7027 億美元</text>
  <rect x="140" y="142" width="700" height="64" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="140" y="142" width="644" height="64" fill="var(--accent)"/>
  <text class="s" x="140" y="232">買回自家股票 6439 億　＝　淨利的 92%</text>
  <text class="s" x="840" y="232" text-anchor="end">留下 8%</text>

  <text class="g" x="60" y="302">2025 一年　淨利 1120 億美元</text>
  <rect x="140" y="322" width="700" height="64" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="140" y="322" width="567" height="64" fill="var(--accent)"/>
  <rect x="707" y="322" width="98" height="64" fill="var(--accent)" opacity="0.5"/>
  <text class="s" x="140" y="412">庫藏股 907 億</text>
  <text class="s" x="707" y="412">股利 154 億</text>
  <text class="s" x="840" y="412" text-anchor="end">留下 5%</text>

  <text class="c" x="60" y="490">找不到比買回自己更好的投資</text>
</svg>
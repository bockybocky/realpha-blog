<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條曲線在垂直虛線後仍然上升，另一條從低位緩升並在很後面才追上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" class="t">被宣告要死之後，它還放量了好幾年</text>

<line x1="90" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="3"/>
<line x1="90" y1="120" x2="90" y2="460" stroke="var(--line)" stroke-width="3"/>
<text x="46" y="128" class="b">量</text>
<text x="856" y="494" class="b">時間</text>

<line x1="270" y1="120" x2="270" y2="460" stroke="var(--dim)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="220" y="108" class="b">被宣告要死</text>

<path d="M110 390 C200 360 300 250 430 195 C540 152 640 160 740 210 C800 242 860 282 900 306" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text x="430" y="172" class="g">舊的那一層</text>

<path d="M270 452 C400 445 520 420 640 370 C740 328 830 282 900 246" fill="none" stroke="var(--warn)" stroke-width="5" stroke-dasharray="12 8"/>
<text x="640" y="404" class="g">新架構</text>

<circle cx="836" cy="278" r="9" fill="var(--ink)"/>
<text x="756" y="258" class="b">交叉在很後面</text>

<text x="60" y="524" class="c">要問的是時間表，不是方向</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="債市波動線往上、股市波動線持平，兩線間張開一塊缺口">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
 svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
       --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
 @media (prefers-color-scheme: dark) {
   svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
         --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
 }
 text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
 .h{font-size:27px;font-weight:700}
 .g{font-size:19px;fill:var(--dim)}
 .b{font-size:16px;fill:var(--dim)}
 .c{font-size:22px;font-weight:700}
</style>
<text class="h" x="60" y="56">折現率在抖，股票假裝沒事</text>
<path d="M90,320 L300,310 L420,290 L560,220 L700,160 L880,120 L880,336 L700,330 L560,326 L420,316 L300,320 Z" fill="var(--card)"/>
<polyline points="90,320 300,310 420,290 560,220 700,160 880,120" fill="none" stroke="var(--warn)" stroke-width="4"/>
<polyline points="90,326 300,320 420,316 560,326 700,330 880,336" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="700" y="104" fill="var(--warn)">MOVE 債市波動</text>
<text class="g" x="700" y="380">VIX 股市波動</text>
<text class="b" x="120" y="376">平常貼在一起</text>
<line x1="760" y1="140" x2="760" y2="330" stroke="var(--dim)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="b" x="780" y="250">張開了</text>
<text class="c" x="60" y="480">他的猜測：兩邊各走一半，往中間收</text>
</svg>
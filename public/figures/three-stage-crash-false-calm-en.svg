<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A falling line in three stages with a plateau of false calm between the Vienna drop and the steeper New York drop, then a slide into emerging markets.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">The crash came in three stages, and the middle one deceives</text>

  <path d="M 70 150 L 190 150 L 240 330" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <path d="M 240 330 L 440 330" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M 440 330 L 620 428 L 890 470" fill="none" stroke="var(--accent)" stroke-width="4"/>

  <circle cx="240" cy="330" r="7" fill="var(--accent)"/>
  <circle cx="620" cy="428" r="7" fill="var(--accent)"/>
  <circle cx="890" cy="470" r="7" fill="var(--accent)"/>

  <text x="150" y="288" font-size="20" fill="var(--ink)">Vienna</text>
  <text x="150" y="312" font-size="16" fill="var(--dim)">May, -50%</text>

  <text x="340" y="298" font-size="20" fill="var(--warn)" text-anchor="middle">Nothing happened</text>
  <text x="340" y="368" font-size="16" fill="var(--warn)" text-anchor="middle">A few months</text>

  <text x="470" y="410" font-size="20" fill="var(--ink)">New York</text>
  <text x="470" y="434" font-size="16" fill="var(--dim)">September, Jay Cooke</text>
  <text x="470" y="458" font-size="16" fill="var(--dim)">A third stop paying by year end</text>

  <text x="880" y="440" font-size="20" fill="var(--ink)" text-anchor="end">Egypt . Turkey</text>
  <text x="880" y="504" font-size="16" fill="var(--dim)" text-anchor="end">$1.5bn</text>

  <text x="480" y="540" font-size="22" fill="var(--ink)" text-anchor="middle">Calm between two events is not itself evidence</text>
</svg>
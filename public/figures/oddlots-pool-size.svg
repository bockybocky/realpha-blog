<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="五條長度不同的橫條並排，最長是三十兆的可觸及市場，標普營收費用淨利依序縮短，最底是微軟加蘋果三十五年累計營收">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="66" font-size="27" font-weight="700" fill="var(--ink)">要補的洞，與池子的大小</text>
<text x="80" y="128" font-size="19" font-weight="700" fill="var(--warn)">被講出來的市場</text>
<rect x="80" y="146" width="720" height="52" rx="6" fill="var(--warn)"/>
<text x="100" y="180" font-size="20" font-weight="700" fill="var(--page)">約三十兆美元</text>
<text x="80" y="256" font-size="19" font-weight="700" fill="var(--accent)">真正的池子：標普整體</text>
<rect x="80" y="274" width="408" height="44" rx="6" fill="var(--accent)"/>
<text x="100" y="304" font-size="16" font-weight="700" fill="var(--page)">營收約十七兆</text>
<rect x="80" y="330" width="276" height="44" rx="6" fill="var(--accent)" opacity="0.72"/>
<text x="100" y="360" font-size="16" font-weight="700" fill="var(--page)">費用約十一到十二兆</text>
<rect x="80" y="386" width="126" height="44" rx="6" fill="var(--accent)" opacity="0.48"/>
<text x="216" y="416" font-size="16" font-weight="700" fill="var(--ink)">淨利五到五點五兆</text>
<text x="80" y="476" font-size="19" font-weight="700" fill="var(--dim)">對照：微軟加蘋果，一九九〇年以來累計營收</text>
<rect x="80" y="494" width="240" height="36" rx="6" fill="var(--grey)"/>
<text x="334" y="520" font-size="16" fill="var(--dim)">不到十兆（經通膨調整）</text>
<text x="80" y="566" font-size="22" font-weight="700" fill="var(--ink)">洞比池子大的時候，錢要從誰的淨利裡出</text>
</svg>
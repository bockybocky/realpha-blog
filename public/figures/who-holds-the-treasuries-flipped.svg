<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上下兩條橫條比例翻轉：官方儲備那一段縮短，私部門那一段變長">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="48" y="54" font-size="27" font-weight="700" fill="var(--ink)">買美債的人換了</text>
<text x="80" y="128" font-size="20" font-weight="700" fill="var(--dim)">過去</text>
<rect x="80" y="144" width="500" height="58" fill="var(--grey)"/>
<rect x="580" y="144" width="260" height="58" fill="var(--accent)"/>
<text x="104" y="180" font-size="16" fill="var(--page)">官方儲備</text>
<text x="604" y="180" font-size="16" fill="var(--page)">私部門</text>
<text x="80" y="286" font-size="20" font-weight="700" fill="var(--ink)">現在</text>
<rect x="80" y="302" width="300" height="58" fill="var(--grey)"/>
<rect x="380" y="302" width="460" height="58" fill="var(--accent)"/>
<text x="104" y="338" font-size="16" fill="var(--page)">官方儲備</text>
<text x="404" y="338" font-size="16" fill="var(--page)">私部門</text>
<text x="80" y="396" font-size="16" fill="var(--dim)">為儲備 · 不看價格</text>
<text x="404" y="396" font-size="16" fill="var(--accent)">為報酬 · 對利率敏感</text>
<text x="48" y="470" font-size="22" font-weight="700" fill="var(--ink)">同一批債，持有人的目的不同，價格就更會動</text>
</g>
</svg>
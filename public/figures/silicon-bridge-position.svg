<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩個層疊剖面，亮色小長條分別埋在不同層，警示標記也跟著換層">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">橋埋在哪一層，難度就跟到哪一層</text>

<rect x="48" y="92" width="400" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="512" y="92" width="400" height="360" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="72" y="128" font-size="19" fill="var(--dim)">埋在有機層</text>
<text x="536" y="128" font-size="19" fill="var(--accent)">埋進載板</text>

<rect x="112" y="156" width="120" height="42" rx="4" fill="var(--page)" stroke="var(--line)"/>
<rect x="264" y="156" width="120" height="42" rx="4" fill="var(--page)" stroke="var(--line)"/>
<text x="248" y="146" font-size="15" fill="var(--dim)" text-anchor="middle">晶片</text>
<rect x="112" y="210" width="272" height="60" rx="4" fill="var(--warn)" opacity="0.12"/>
<rect x="112" y="210" width="272" height="60" rx="4" fill="none" stroke="var(--warn)" stroke-width="2"/>
<rect x="188" y="228" width="120" height="24" rx="3" fill="var(--accent)"/>
<text x="248" y="292" font-size="15" fill="var(--dim)" text-anchor="middle">有機層</text>
<rect x="112" y="310" width="272" height="64" rx="4" fill="var(--page)" stroke="var(--line)"/>
<text x="248" y="348" font-size="15" fill="var(--dim)" text-anchor="middle">載板</text>
<text x="400" y="246" font-size="15" fill="var(--warn)">難點</text>

<rect x="576" y="156" width="120" height="42" rx="4" fill="var(--page)" stroke="var(--line)"/>
<rect x="728" y="156" width="120" height="42" rx="4" fill="var(--page)" stroke="var(--line)"/>
<text x="712" y="146" font-size="15" fill="var(--dim)" text-anchor="middle">晶片</text>
<rect x="576" y="210" width="272" height="36" rx="4" fill="var(--page)" stroke="var(--line)"/>
<text x="712" y="234" font-size="15" fill="var(--dim)" text-anchor="middle">有機層</text>
<rect x="576" y="286" width="272" height="88" rx="4" fill="var(--warn)" opacity="0.12"/>
<rect x="576" y="286" width="272" height="88" rx="4" fill="none" stroke="var(--warn)" stroke-width="2"/>
<rect x="652" y="300" width="120" height="28" rx="3" fill="var(--accent)"/>
<text x="712" y="356" font-size="15" fill="var(--dim)" text-anchor="middle">載板挖槽</text>
<text x="864" y="330" font-size="15" fill="var(--warn)">難點</text>

<text x="480" y="512" font-size="22" fill="var(--ink)" text-anchor="middle">難點會位移，不會消失</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A right-angle shape has a completely horizontal long line pointing right and a short line that jumps sharply upward." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <text x="60" y="56" font-size="27" fill="var(--ink)">Two directions, only one moves price</text>

  <line x1="140" y1="400" x2="860" y2="400" stroke="var(--grey)" stroke-width="6"/>
  <polygon points="876,400 856,390 856,410" fill="var(--grey)"/>
  <circle cx="140" cy="400" r="9" fill="var(--grey)"/>
  <text x="300" y="434" font-size="19" fill="var(--dim)">Shipment volume doubles</text>
  <text x="300" y="382" font-size="16" fill="var(--dim)">Unit price stays at $4</text>

  <line x1="140" y1="400" x2="140" y2="170" stroke="var(--accent)" stroke-width="6"/>
  <polygon points="140,154 130,174 150,174" fill="var(--accent)"/>
  <text x="166" y="196" font-size="19" fill="var(--accent)">One-generation architecture change</text>
  <text x="166" y="226" font-size="16" fill="var(--ink)">The same part jumps to $50</text>

  <text x="60" y="486" font-size="22" fill="var(--ink)">Watch the vertical axis, not the horizontal axis.</text>
</svg>
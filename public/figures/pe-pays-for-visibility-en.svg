<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A bar split into four segments, only the first filled solid, the rest dashed and empty">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">A P/E of 3 to 4x -- pricing what, exactly</text>
<text x="120" y="212" font-size="19" text-anchor="end" fill="var(--ink)">Profit</text>
<rect x="140" y="170" width="190" height="70" rx="6" fill="var(--accent)"/>
<rect x="330" y="170" width="190" height="70" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="520" y="170" width="190" height="70" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="710" y="170" width="190" height="70" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="235" y="272" font-size="16" text-anchor="middle" fill="var(--ink)">This yr</text>
<text x="425" y="272" font-size="16" text-anchor="middle" fill="var(--dim)">Next yr</text>
<text x="615" y="272" font-size="16" text-anchor="middle" fill="var(--dim)">Yr+2</text>
<text x="805" y="272" font-size="16" text-anchor="middle" fill="var(--dim)">Yr+3</text>
<line x1="140" y1="312" x2="330" y2="312" stroke="var(--accent)" stroke-width="3"/>
<text x="235" y="340" font-size="16" text-anchor="middle" fill="var(--accent)">Market only pays for this stretch</text>
<text x="900" y="340" font-size="16" text-anchor="end" fill="var(--dim)">Can't see it -&gt; won't pay for it</text>
<rect x="60" y="384" width="840" height="76" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="431" font-size="22" text-anchor="middle" fill="var(--ink)">What's priced is visibility, not profit</text>
</svg>
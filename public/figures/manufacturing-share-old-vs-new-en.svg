<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four bars: two for Britain falling from high to low, one medium bar for Germany, and the tallest bar on the right for China, close to twice Germany's level at the time.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<defs><marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--warn)"/></marker></defs>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700">Old wanes, new rises</text>
<text x="315" y="110" text-anchor="middle" font-size="20" style="fill:var(--dim)">Pre-1914</text>
<text x="695" y="110" text-anchor="middle" font-size="20" style="fill:var(--dim)">Now</text>
<line x1="575" y1="95" x2="575" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="120" y="230" width="110" height="230" fill="var(--grey)"/>
<rect x="260" y="325" width="110" height="135" fill="var(--grey)"/>
<rect x="400" y="310" width="110" height="150" fill="var(--accent)"/>
<rect x="640" y="180" width="110" height="280" fill="var(--accent)"/>
<line x1="510" y1="310" x2="760" y2="310" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="766" y="315" font-size="15" style="fill:var(--dim)">Germany '13</text>
<line x1="90" y1="460" x2="870" y2="460" stroke="var(--grey)" stroke-width="2"/>
<path d="M232 232 Q 290 240 302 316" fill="none" stroke="var(--warn)" stroke-width="3" marker-end="url(#m1)"/>
<text x="318" y="268" font-size="16" font-weight="700" style="fill:var(--warn)">Fell</text>
<text x="175" y="218" text-anchor="middle" font-size="20" font-weight="700">23%</text>
<text x="315" y="313" text-anchor="middle" font-size="20" font-weight="700">13.5%</text>
<text x="455" y="298" text-anchor="middle" font-size="20" font-weight="700">15%</text>
<text x="695" y="168" text-anchor="middle" font-size="20" font-weight="700">28%</text>
<text x="175" y="490" text-anchor="middle" font-size="16">UK 1890</text>
<text x="315" y="490" text-anchor="middle" font-size="16">UK 1913</text>
<text x="455" y="490" text-anchor="middle" font-size="16">Germany 1913</text>
<text x="695" y="490" text-anchor="middle" font-size="16">China 2023</text>
<text x="480" y="535" text-anchor="middle" font-size="15" style="fill:var(--dim)">World mfg share (per book)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Four bars in two groups; chip bars are tall in both waves, while one assembly bar is short and the other is tall.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t h" x="60" y="70">Where the value lands differs by wave</text>
<line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="t g" x="150" y="130">The phone wave</text>
<rect x="150" y="200" width="100" height="230" fill="var(--grey)"/>
<rect x="280" y="360" width="100" height="70" fill="var(--accent)"/>
<text class="t b" x="166" y="458">Chips</text>
<text class="t b" x="296" y="458">Assembly</text>
<text class="t g" x="560" y="130">The AI wave</text>
<rect x="560" y="190" width="100" height="240" fill="var(--grey)"/>
<rect x="690" y="180" width="100" height="250" fill="var(--accent)"/>
<text class="t b" x="576" y="458">Chips</text>
<text class="t b" x="706" y="458">Assembly</text>
<text class="t c" x="60" y="510">The difference is whose assembly it is</text>
</svg>
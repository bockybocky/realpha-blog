<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="On axes of speed and reliability confidence, copper, optics and CPO line up from lower left to upper right.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style></defs>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t h" x="70" y="70">The faster the end, the less repair experience you have</text>
<line x1="180" y1="470" x2="890" y2="470" stroke="var(--line)" stroke-width="3"/>
<line x1="180" y1="470" x2="180" y2="130" stroke="var(--line)" stroke-width="3"/>
<text class="t b" x="800" y="500">Faster</text>
<text class="t b" x="120" y="150">Unsure</text>
<text class="t b" x="120" y="460">Fixable</text>
<circle cx="320" cy="415" r="12" fill="var(--grey)"/>
<text class="t g" x="345" y="408">Copper</text>
<text class="t b" x="345" y="436">Parts everywhere</text>
<circle cx="600" cy="265" r="12" fill="var(--accent)"/>
<text class="t g" x="625" y="258">Optics</text>
<text class="t b" x="625" y="286">Reliability unknown</text>
<circle cx="800" cy="180" r="12" fill="var(--accent)"/>
<text class="t g" x="700" y="160">Co-packaged optics</text>
<text class="t b" x="700" y="130">Seen in one post only</text>
<path d="M340 405 C470 370, 520 310, 586 275" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
<path d="M614 255 C680 230, 730 205, 786 186" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
<text class="t c" x="70" y="545">You pick who will fix it, not just the speed</text>
</svg>
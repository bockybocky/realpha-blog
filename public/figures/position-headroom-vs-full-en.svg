<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A full container loses a piece to a shock while the container with slack takes the shock in.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">Size decides what a shock cuts</text>
<rect x="150" y="78" width="240" height="56" rx="8" fill="var(--warn)"/>
<text x="246" y="114" font-size="20" fill="var(--page)">Jolt</text>
<rect x="150" y="150" width="240" height="300" fill="var(--accent)"/>
<rect x="150" y="150" width="240" height="300" fill="none" stroke="var(--line)" stroke-width="3"/>
<rect x="150" y="390" width="240" height="60" fill="var(--warn)"/>
<text x="196" y="428" font-size="20" fill="var(--page)">Cut now</text>
<text x="196" y="300" font-size="20" fill="var(--page)">Full</text>
<text x="190" y="492" font-size="20" fill="var(--ink)">At limit</text>
<rect x="570" y="150" width="240" height="300" fill="none" stroke="var(--line)" stroke-width="3"/>
<rect x="570" y="250" width="240" height="200" fill="var(--accent)"/>
<rect x="570" y="186" width="240" height="56" rx="8" fill="var(--warn)"/>
<text x="666" y="222" font-size="20" fill="var(--page)">Jolt</text>
<text x="616" y="358" font-size="20" fill="var(--page)">Position</text>
<text x="640" y="492" font-size="20" fill="var(--ink)">Slack</text>
<text x="60" y="548" font-size="22" fill="var(--ink)">Slack is the right not to sell</text>
</svg>
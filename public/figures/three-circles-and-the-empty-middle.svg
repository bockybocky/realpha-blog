<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-label="三個重疊的圓，三個灰點分別在各自的圓內，一個藍點在三圓共同交集的正中央">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:600;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:600;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="570" fill="var(--page)"/>
<text class="t" x="60" y="60">三種都做，卻沒有一種非它不可</text>
<circle cx="480" cy="225" r="125" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="400" cy="350" r="125" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="560" cy="350" r="125" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="480" y="140" text-anchor="middle">純種跑車</text>
<text class="g" x="330" y="432" text-anchor="middle">省油小車</text>
<text class="g" x="632" y="432" text-anchor="middle">豪華大轎車</text>
<circle cx="480" cy="178" r="8" fill="var(--grey)"/>
<circle cx="332" cy="318" r="8" fill="var(--grey)"/>
<circle cx="628" cy="318" r="8" fill="var(--grey)"/>
<circle cx="480" cy="300" r="11" fill="var(--accent)"/>
<line x1="492" y1="298" x2="736" y2="272" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="744" y="268" fill="var(--accent)">1500</text>
<text class="b" x="744" y="296">通勤、樂趣、舒適同時成立</text>
<text class="b" x="60" y="500">灰點＝當時三個類別各有一台</text>
<text class="c" x="480" y="540" text-anchor="middle">問題不是做錯了什麼，是做的跟大家一樣</text>
</svg>
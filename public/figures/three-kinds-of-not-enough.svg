<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三個並排方框分別畫滿水的容器、中段縮細的管子、被切斷並夾著時鐘的管子">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="56" y="56" font-size="27" font-weight="700" fill="var(--ink)">抱怨不夠的時候，先看卡在哪一格</text>
<rect x="56" y="120" width="248" height="260" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="356" y="120" width="248" height="260" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="656" y="120" width="248" height="260" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="110" y="170" width="140" height="110" rx="4" fill="none" stroke="var(--ink)" stroke-width="3"/>
<rect x="118" y="178" width="124" height="94" rx="2" fill="var(--accent)"/>
<text x="180" y="336" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">總量不夠</text>
<rect x="390" y="200" width="60" height="60" rx="4" fill="var(--accent)"/>
<rect x="450" y="220" width="90" height="20" fill="var(--accent)"/>
<rect x="540" y="200" width="60" height="60" rx="4" fill="var(--accent)"/>
<text x="480" y="336" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">取用速度不夠</text>
<rect x="682" y="220" width="70" height="20" fill="var(--accent)"/>
<rect x="808" y="220" width="70" height="20" fill="var(--accent)"/>
<line x1="752" y1="230" x2="808" y2="230" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="780" cy="230" r="24" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
<line x1="780" y1="230" x2="780" y2="216" stroke="var(--warn)" stroke-width="3"/>
<line x1="780" y1="230" x2="791" y2="236" stroke="var(--warn)" stroke-width="3"/>
<text x="780" y="336" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">等別人回覆</text>
<text x="180" y="424" font-size="16" fill="var(--dim)" text-anchor="middle">加容量</text>
<text x="480" y="424" font-size="16" fill="var(--dim)" text-anchor="middle">加頻寬</text>
<text x="780" y="424" font-size="16" fill="var(--dim)" text-anchor="middle">改流程</text>
<text x="56" y="500" font-size="22" font-weight="700" fill="var(--ink)">要加的東西，得落在卡住的那一格</text>
</svg>
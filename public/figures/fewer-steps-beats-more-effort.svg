<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="同樣每步八成，七步後剩很矮的一截，三步後剩下高出兩倍多的一截">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .k { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="60">砍步驟，不是更用力</text>

<text class="g" x="60" y="132">七步</text>
<g fill="var(--card)" stroke="var(--line)">
<rect x="150" y="104" width="56" height="44" rx="6"/><rect x="216" y="104" width="56" height="44" rx="6"/>
<rect x="282" y="104" width="56" height="44" rx="6"/><rect x="348" y="104" width="56" height="44" rx="6"/>
<rect x="414" y="104" width="56" height="44" rx="6"/><rect x="480" y="104" width="56" height="44" rx="6"/>
<rect x="546" y="104" width="56" height="44" rx="6"/>
</g>
<text class="b" x="150" y="178">每步八成</text>
<rect x="700" y="200" width="70" height="42" fill="var(--grey)"/>
<text class="g" x="700" y="188">剩兩成</text>

<text class="g" x="60" y="332">三步</text>
<g fill="var(--card)" stroke="var(--accent)" stroke-width="2">
<rect x="150" y="304" width="56" height="44" rx="6"/><rect x="216" y="304" width="56" height="44" rx="6"/>
<rect x="282" y="304" width="56" height="44" rx="6"/>
</g>
<text class="b" x="150" y="378">每步八成</text>
<rect x="700" y="294" width="70" height="108" fill="var(--accent)"/>
<text class="g" x="700" y="282" fill="var(--accent)">剩五成</text>

<text class="k" x="60" y="472">少一步，比多用力有效得多</text>
</svg>
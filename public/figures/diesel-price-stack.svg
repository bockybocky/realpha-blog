<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="原油單層柱與柴油雙層疊柱對比，柴油柱高約為原油兩倍">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; } .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); } .c { font-size:22px; font-weight:700; }
</style>
<text x="40" y="45" class="t">柴油一桶 ＝ 原油 ＋ 裂解價差</text>
<line x1="200" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="250" y="290" width="140" height="180" fill="var(--grey)"/>
<text x="320" y="278" class="g" text-anchor="middle">&gt; 100</text>
<rect x="560" y="290" width="140" height="180" fill="var(--grey)"/>
<rect x="560" y="110" width="140" height="180" fill="var(--warn)"/>
<text x="720" y="207" class="g" style="fill:var(--warn)">裂解價差 &gt; 100</text>
<text x="720" y="387" class="g">原油 &gt; 100</text>
<text x="630" y="95" class="c" text-anchor="middle">&gt; 200 美元／桶</text>
<text x="320" y="505" class="g" text-anchor="middle">原油</text>
<text x="630" y="505" class="g" text-anchor="middle">散裝柴油</text>
<text x="480" y="545" class="c" text-anchor="middle">兩層各破 100 美元</text>
</svg>
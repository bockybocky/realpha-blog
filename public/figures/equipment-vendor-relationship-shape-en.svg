<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left a straight process that ends when it reaches the finish; on the right a closed loop that locks customer and equipment maker together and keeps coming back around">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
<marker id="f1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--grey)"/></marker>
<marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
</defs>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">The vendor-customer relationship changed shape</text>
<rect x="60" y="110" width="390" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="88" y="152" font-size="19" fill="var(--dim)">Before</text>
<path d="M110 300 H400" stroke="var(--grey)" stroke-width="2.5" fill="none" marker-end="url(#f1g)"/>
<circle cx="112" cy="300" r="8" fill="var(--grey)"/>
<circle cx="205" cy="300" r="8" fill="var(--grey)"/>
<circle cx="298" cy="300" r="8" fill="var(--grey)"/>
<path d="M410 278 V322" stroke="var(--grey)" stroke-width="3"/>
<text x="112" y="272" font-size="15" fill="var(--ink)" text-anchor="middle">Write spec</text>
<text x="205" y="272" font-size="15" fill="var(--ink)" text-anchor="middle">Build to it</text>
<text x="298" y="272" font-size="15" fill="var(--ink)" text-anchor="middle">Ship</text>
<text x="398" y="272" font-size="15" fill="var(--dim)" text-anchor="middle">Done</text>
<text x="88" y="410" font-size="15" fill="var(--dim)">A one-off transaction</text>
<rect x="510" y="110" width="390" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="538" y="152" font-size="19" fill="var(--accent)">Now</text>
<path d="M705 200 A92 92 0 0 1 705 384" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#f1a)"/>
<path d="M705 384 A92 92 0 0 1 705 200" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#f1a)"/>
<circle cx="705" cy="200" r="9" fill="var(--accent)"/>
<circle cx="705" cy="384" r="9" fill="var(--accent)"/>
<text x="705" y="185" font-size="19" fill="var(--ink)" text-anchor="middle">Customer</text>
<text x="705" y="412" font-size="19" fill="var(--ink)" text-anchor="middle">Equipment maker</text>
<text x="705" y="286" font-size="19" fill="var(--accent)" text-anchor="middle">Joint development</text>
<text x="705" y="312" font-size="15" fill="var(--dim)" text-anchor="middle">Spec revised in under a year</text>
<text x="60" y="515" font-size="22" fill="var(--ink)">Replacing you costs more than the machine.</text>
</svg>
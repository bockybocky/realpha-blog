<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="The supply chain is stacked as five blocks from downstream up to upstream, and a single vertical dashed line on the right touches every one of them, showing that all five layers were locked the same day in the same way.">
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>

  <text class="t" x="60" y="58">5 layers, one day</text>

  <line x1="100" y1="130" x2="100" y2="480" stroke="var(--line)" stroke-width="2"/>
  <polygon points="100,486 94,472 106,472" fill="var(--line)"/>
  <text class="b" x="62" y="136">Down</text>
  <text class="b" x="62" y="486">Up</text>

  <rect x="200" y="120" width="520" height="66" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="224" y="160">OE</text>
  <text class="b" x="696" y="160" text-anchor="end">LTA to 2029</text>

  <rect x="200" y="196" width="520" height="66" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="224" y="236">Lasers</text>
  <text class="b" x="696" y="236" text-anchor="end">Buyer $</text>

  <rect x="200" y="272" width="520" height="66" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="224" y="312">AP</text>
  <text class="b" x="696" y="312" text-anchor="end">Over 3x</text>

  <rect x="200" y="348" width="520" height="66" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="224" y="388">ATE</text>
  <text class="b" x="696" y="388" text-anchor="end">$1.1bn deal</text>

  <rect x="200" y="424" width="520" height="66" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="224" y="464">ABF</text>
  <text class="b" x="696" y="464" text-anchor="end">2.5x, prepay</text>

  <line x1="790" y1="140" x2="790" y2="470" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 6"/>
  <line x1="720" y1="153" x2="790" y2="153" stroke="var(--accent)" stroke-width="1.5"/>
  <line x1="720" y1="229" x2="790" y2="229" stroke="var(--accent)" stroke-width="1.5"/>
  <line x1="720" y1="305" x2="790" y2="305" stroke="var(--accent)" stroke-width="1.5"/>
  <line x1="720" y1="381" x2="790" y2="381" stroke="var(--accent)" stroke-width="1.5"/>
  <line x1="720" y1="457" x2="790" y2="457" stroke="var(--accent)" stroke-width="1.5"/>
  <circle cx="790" cy="153" r="6" fill="var(--accent)"/>
  <circle cx="790" cy="229" r="6" fill="var(--accent)"/>
  <circle cx="790" cy="305" r="6" fill="var(--accent)"/>
  <circle cx="790" cy="381" r="6" fill="var(--accent)"/>
  <circle cx="790" cy="457" r="6" fill="var(--accent)"/>
  <text class="g" x="812" y="298">1 day</text>
  <text class="b" x="812" y="324">Oct 22</text>

  <text class="c" x="200" y="548">Cash says: no slot</text>
</svg>
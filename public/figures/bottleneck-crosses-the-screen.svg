<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條由左往右的箭頭串起四個節點，中間有一道垂直界線，最後一個節點落在界線右側的虛線區塊裡，是瓶頸移動到篩選器看不到的一側" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="80" y="70" font-size="27" font-weight="700" fill="var(--ink)">瓶頸移到了篩不到的那一側</text>

  <rect x="80" y="140" width="560" height="250" rx="10" fill="var(--card)"/>
  <rect x="660" y="140" width="220" height="250" rx="10" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="650" y1="140" x2="650" y2="390" stroke="var(--line)" stroke-width="2"/>

  <text x="110" y="182" font-size="20" font-weight="700" fill="var(--ink)">篩得到</text>
  <text x="110" y="208" font-size="15" fill="var(--dim)">產能 · 出貨 · 財報欄位</text>
  <text x="690" y="182" font-size="20" font-weight="700" fill="var(--warn)">篩不到</text>
  <text x="690" y="208" font-size="15" fill="var(--dim)">執行能力</text>

  <line x1="150" y1="290" x2="725" y2="290" stroke="var(--dim)" stroke-width="2.5"/>
  <polygon points="745,290 723,282 723,298" fill="var(--dim)"/>

  <circle cx="170" cy="290" r="9" fill="var(--accent)"/>
  <circle cx="330" cy="290" r="9" fill="var(--accent)"/>
  <circle cx="490" cy="290" r="9" fill="var(--accent)"/>
  <circle cx="770" cy="290" r="11" fill="var(--warn)"/>

  <text x="170" y="262" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">晶片</text>
  <text x="330" y="262" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">電力 · 土地</text>
  <text x="490" y="262" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">變壓器 · 渦輪</text>
  <text x="770" y="262" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">122 天站起場站</text>

  <text x="80" y="472" font-size="22" font-weight="700" fill="var(--ink)">這一輪的瓶頸，長成了資料欄位裡沒有的樣子</text>
</svg>
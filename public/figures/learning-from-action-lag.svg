<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="政策升息的階梯在前，市場感知係數從零到一的曲線落在後面，兩者之間有時間落差">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="40" y="58" font-size="27" font-weight="700" fill="var(--ink)">動作在前，認知在後</text>

<text class="t" x="40" y="118" font-size="19" font-weight="700" fill="var(--ink)">政策利率</text>
<path d="M 160 240 L 240 240 L 240 220 L 320 220 L 320 180 L 420 180 L 420 150 L 540 150 L 540 130 L 880 130" fill="none" stroke="var(--ink)" stroke-width="3"/>
<circle cx="240" cy="240" r="6" fill="var(--warn)"/>
<text class="t" x="176" y="274" font-size="15" fill="var(--warn)">首次 25 個基點</text>

<text class="t" x="40" y="352" font-size="19" font-weight="700" fill="var(--accent)">市場感知的反應係數</text>
<line x1="160" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="124" y="436" font-size="15" fill="var(--dim)">0</text>
<text class="t" x="124" y="326" font-size="15" fill="var(--dim)">1</text>
<path d="M 160 430 L 300 428 L 400 404 L 500 368 L 620 340 L 740 324 L 880 320" fill="none" stroke="var(--accent)" stroke-width="3"/>

<line x1="240" y1="240" x2="240" y2="430" stroke="var(--grey)" stroke-width="1" stroke-dasharray="6 5"/>
<line x1="620" y1="130" x2="620" y2="340" stroke="var(--grey)" stroke-width="1" stroke-dasharray="6 5"/>
<line x1="240" y1="470" x2="620" y2="470" stroke="var(--warn)" stroke-width="2"/>
<line x1="240" y1="462" x2="240" y2="478" stroke="var(--warn)" stroke-width="2"/>
<line x1="620" y1="462" x2="620" y2="478" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="330" y="498" font-size="16" fill="var(--warn)">學習的時間差</text>
<text class="t" x="176" y="468" font-size="15" fill="var(--dim)">2022 初</text>
<text class="t" x="634" y="468" font-size="15" fill="var(--dim)">2023 底</text>

<text class="t" x="40" y="528" font-size="22" font-weight="700" fill="var(--ink)">要先做給它看，它才改掉那條規則</text>
</svg>
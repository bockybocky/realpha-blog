<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩個交疊的圓分別代表訓練與推理，新雲的方塊全落在左圓的非交疊處，超大規模雲的方塊落在兩圓交疊處">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="66" font-size="27" fill="var(--ink)">推理那一塊，新雲站不進去</text>
<circle cx="390" cy="300" r="175" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="610" cy="300" r="175" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="268" y="140" font-size="19" fill="var(--dim)" text-anchor="middle">訓練</text>
<text x="736" y="140" font-size="19" fill="var(--accent)" text-anchor="middle">推理</text>
<rect x="200" y="250" width="150" height="46" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="275" y="280" font-size="16" fill="var(--dim)" text-anchor="middle">新雲</text>
<rect x="200" y="310" width="150" height="46" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="275" y="340" font-size="16" fill="var(--dim)" text-anchor="middle">新雲</text>
<rect x="420" y="276" width="160" height="50" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="500" y="308" font-size="16" fill="var(--accent)" text-anchor="middle">超大規模雲</text>
<line x1="500" y1="432" x2="500" y2="472" stroke="var(--dim)" stroke-width="2"/>
<text x="500" y="494" font-size="16" fill="var(--dim)" text-anchor="middle">兩邊都站得到的只有這一格</text>
<line x1="760" y1="420" x2="860" y2="420" stroke="var(--accent)" stroke-width="3"/>
<polygon points="860,412 884,420 860,428" fill="var(--accent)"/>
<text x="820" y="402" font-size="16" fill="var(--accent)" text-anchor="middle">重心</text>
<text x="60" y="534" font-size="22" fill="var(--ink)">重心往右移，接得到的人不換</text>
</svg>
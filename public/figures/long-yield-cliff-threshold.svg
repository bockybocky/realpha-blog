<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 565" width="960" height="565" role="img" aria-label="曲線前段平坦、過了橘色門檻區後急墜，現在的位置緊貼門檻左側">
<rect x="0" y="0" width="960" height="565" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="50" text-anchor="middle">長債風險：前面沒反應，跨線才一次反應</text>
<rect x="580" y="110" width="80" height="350" fill="var(--warn)" opacity="0.15"/>
<text class="s" x="620" y="130" text-anchor="middle" style="fill:var(--warn)">跨線區</text>
<line x1="100" y1="110" x2="100" y2="460" stroke="var(--dim)" stroke-width="2"/>
<line x1="100" y1="460" x2="900" y2="460" stroke="var(--dim)" stroke-width="2"/>
<text class="s" x="110" y="104">股市</text>
<text class="s" x="900" y="488" text-anchor="end">長天期殖利率往上 →</text>
<path d="M100,170 L540,176 C590,180 620,210 660,300 S740,440 900,450" fill="none" stroke="var(--ink)" stroke-width="4"/>
<text class="s" x="290" y="158" text-anchor="middle">怎麼漲都沒事</text>
<circle cx="480" cy="175" r="10" fill="var(--accent)"/>
<text class="g" x="480" y="150" text-anchor="middle" style="fill:var(--accent)">現在</text>
<text class="g" x="760" y="400" style="fill:var(--warn)">一次反應</text>
<line x1="480" y1="490" x2="660" y2="490" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="480" y1="480" x2="480" y2="500" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="580" y1="482" x2="580" y2="498" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="660" y1="480" x2="660" y2="500" stroke="var(--accent)" stroke-width="2.5"/>
<text class="b" x="570" y="520" text-anchor="middle" style="fill:var(--accent)">再 +20~35 基點</text>
<text class="c" x="480" y="552" text-anchor="middle">「到目前沒事」≠ 離線很遠</text>
</svg>
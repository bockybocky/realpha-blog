<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一個起點分出兩條路，上路暢通抵達主管，下路撞上一堵牆停住">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink)}
.g{font-size:19px;fill:var(--ink)}
.b{font-size:16px;fill:var(--dim)}
.s{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
</defs>
<text class="h" x="80" y="70">壞消息走哪條路</text>
<circle cx="110" cy="290" r="12" fill="var(--accent)"/>
<text class="b" x="110" y="330" text-anchor="middle">部屬察覺</text>
<path d="M124 284 C 190 284 200 190 268 190 L 700 190" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<circle cx="300" cy="190" r="7" fill="var(--accent)"/>
<circle cx="470" cy="190" r="7" fill="var(--accent)"/>
<circle cx="620" cy="190" r="7" fill="var(--accent)"/>
<text class="b" x="300" y="164" text-anchor="middle">日常稱讚</text>
<text class="b" x="470" y="164" text-anchor="middle">被看見</text>
<text class="b" x="620" y="164" text-anchor="middle">敢早講</text>
<text class="g" x="724" y="196" fill="var(--accent)">主管知道</text>
<path d="M124 296 C 190 296 200 400 268 400 L 736 400" stroke="var(--grey)" stroke-width="3" fill="none"/>
<circle cx="300" cy="400" r="7" fill="var(--grey)"/>
<circle cx="470" cy="400" r="7" fill="var(--grey)"/>
<circle cx="620" cy="400" r="7" fill="var(--grey)"/>
<text class="s" x="300" y="438" text-anchor="middle">沒有互動</text>
<text class="s" x="470" y="438" text-anchor="middle">開口就是責備</text>
<text class="s" x="620" y="438" text-anchor="middle">留在自己這裡</text>
<rect x="740" y="344" width="16" height="112" fill="var(--warn)"/>
<text class="g" x="772" y="406" fill="var(--warn)">離職</text>
<text class="c" x="80" y="510">稱讚不是客套，是壞消息的通道。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩組以中線為基準的柱體，左組上下等高、右組上長下短，顯示要找的是不對稱形狀">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70">要找的是形狀，不是把握</text>

  <line x1="60" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>
  <text class="d" x="60" y="292">賺</text>
  <text class="d" x="60" y="322">賠</text>

  <rect x="200" y="200" width="150" height="100" rx="6" fill="var(--grey)"/>
  <rect x="200" y="300" width="150" height="100" rx="6" fill="var(--warn)"/>
  <text class="g" x="275" y="446" text-anchor="middle">跟著共識</text>
  <text class="d" x="275" y="476" text-anchor="middle">要猜對才有得拿</text>

  <rect x="620" y="110" width="150" height="190" rx="6" fill="var(--accent)"/>
  <rect x="620" y="300" width="150" height="36" rx="6" fill="var(--warn)"/>
  <text class="g" x="695" y="446" text-anchor="middle">所有人都在縮的時候押大</text>
  <text class="d" x="695" y="476" text-anchor="middle">不需要對，只要別錯得離譜</text>

  <text class="c" x="60" y="528">下面那塊夠小，上面那塊才值得押</text>
</svg>
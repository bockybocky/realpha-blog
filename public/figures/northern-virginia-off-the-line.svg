<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條斜向虛線代表我預期的越密越貴，一個實心點落在虛線另一側的右上角">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">一個點，落在我那條線的外面</text>
  <line x1="150" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
  <line x1="150" y1="440" x2="150" y2="110" stroke="var(--line)" stroke-width="2"/>
  <text class="n" x="700" y="474">資料中心密度　越右越密</text>
  <text class="n" x="60" y="104">可負擔性</text>
  <text class="n" x="60" y="130">越上越好</text>
  <line x1="180" y1="170" x2="840" y2="420" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 8"/>
  <text class="n" x="300" y="300">我預期的方向：越密、越難負擔</text>
  <circle cx="800" cy="180" r="16" fill="var(--accent)"/>
  <text class="g" x="660" y="152">北維州</text>
  <text class="n" x="560" y="212">最密的叢聚，可負擔性在前段</text>
</svg>
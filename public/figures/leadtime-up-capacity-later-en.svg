<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="The lead-time line climbs from twenty to thirty-six weeks above while new capacity slides right from the fourth quarter of 2026 to 2027 below, one going up and one going back">
<style>
  svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
        --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
  @media (prefers-color-scheme: dark) {
    svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
          --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
  }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); font-weight:700; }
  .g { font-size:19px; fill:var(--ink); }
  .b { font-size:15px; fill:var(--dim); }
  .k { font-size:16px; fill:var(--ink); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<defs>
  <marker id="f2w" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0 0 L7 3.2 L0 6.4 z" fill="var(--warn)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="62">Lead times up, expansion back</text>
<text class="b" x="120" y="128">Lead time (weeks)</text>
<line x1="120" y1="340" x2="880" y2="340" stroke="var(--line)" stroke-width="2"/>
<polyline points="120,340 373,290 627,215 880,140" fill="none" stroke="var(--accent)" stroke-width="3"/>
<circle cx="120" cy="340" r="6" fill="var(--accent)"/>
<circle cx="373" cy="290" r="6" fill="var(--accent)"/>
<circle cx="627" cy="215" r="6" fill="var(--accent)"/>
<circle cx="880" cy="140" r="7" fill="var(--accent)"/>
<text class="k" x="120" y="322">20</text>
<text class="k" x="373" y="272">24</text>
<text class="k" x="627" y="197">30</text>
<text class="k" x="880" y="122" text-anchor="end">36</text>
<text class="b" x="120" y="368">Start of year</text>
<text class="b" x="373" y="368">June</text>
<text class="b" x="627" y="368">July</text>
<text class="b" x="880" y="368" text-anchor="end">Latest</text>

<line x1="60" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 5"/>
<text class="g" x="120" y="440">New capacity arrives</text>
<line x1="120" y1="495" x2="880" y2="495" stroke="var(--line)" stroke-width="2"/>
<circle cx="400" cy="495" r="7" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="700" cy="495" r="7" fill="var(--warn)"/>
<line x1="415" y1="495" x2="682" y2="495" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#f2w)"/>
<text class="k" x="550" y="478" text-anchor="middle" fill="var(--warn)">Pushed back</text>
<text class="b" x="400" y="522" text-anchor="middle">2026 Q4</text>
<text class="b" x="700" y="522" text-anchor="middle">2027</text>
<text class="c" x="60" y="572">The gap slips twice: demand added, supply not filled</text>
</svg>
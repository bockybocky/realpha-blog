<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two panels side by side: the earnings bar doubles in height, the price to earnings figure is identical on both sides, and the price to sales figure doubles.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型 */
</style></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">Same company, one number changed</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">Revenue is $10 in both</text>
<rect x="70" y="116" width="380" height="330" fill="var(--card)" rx="10"/>
<text x="100" y="156" font-size="20" fill="var(--dim)">Before</text>
<rect x="100" y="188" width="90" height="112" fill="var(--grey)" rx="4" opacity="0.45"/>
<rect x="100" y="300" width="90" height="60" fill="var(--accent)" rx="4"/>
<text x="145" y="386" font-size="16" fill="var(--dim)" text-anchor="middle">Earnings $2</text>
<text x="240" y="252" font-size="19" fill="var(--ink)">P/E  15x</text>
<text x="240" y="300" font-size="19" fill="var(--ink)">P/S  3x</text>
<rect x="510" y="116" width="380" height="330" fill="var(--card)" rx="10"/>
<text x="540" y="156" font-size="20" fill="var(--dim)">After</text>
<rect x="540" y="188" width="90" height="52" fill="var(--grey)" rx="4" opacity="0.45"/>
<rect x="540" y="240" width="90" height="120" fill="var(--accent)" rx="4"/>
<text x="585" y="386" font-size="16" fill="var(--dim)" text-anchor="middle">Earnings $4</text>
<text x="680" y="252" font-size="19" fill="var(--ink)">P/E  15x</text>
<text x="680" y="300" font-size="19" fill="var(--warn)" font-weight="700">P/S  6x</text>
<text x="60" y="502" font-size="22" fill="var(--ink)">What doubled is the margin, not the valuation</text>
</svg>
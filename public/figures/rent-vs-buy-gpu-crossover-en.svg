<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-label="Flat buy line and rising rent line cross; the few-times-a-year point sits left, where renting is cheaper">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="570" fill="var(--page)"/>
<text x="480" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">Rent or buy a GPU (illustrative)</text>
<rect x="140" y="90" width="420" height="350" fill="var(--card)"/>
<line x1="140" y1="440" x2="880" y2="440" stroke="var(--dim)" stroke-width="2"/>
<line x1="140" y1="440" x2="140" y2="90" stroke="var(--dim)" stroke-width="2"/>
<text x="130" y="100" text-anchor="end" font-size="16" fill="var(--dim)">Cost</text>
<text x="880" y="472" text-anchor="end" font-size="16" fill="var(--dim)">Hours used per year →</text>
<line x1="140" y1="264" x2="880" y2="264" stroke="var(--grey)" stroke-width="5"/>
<text x="890" y="270" font-size="20" font-weight="700" fill="var(--dim)">Buy</text>
<line x1="140" y1="440" x2="880" y2="130" stroke="var(--accent)" stroke-width="5"/>
<text x="890" y="136" font-size="20" font-weight="700" fill="var(--accent)">Rent</text>
<line x1="560" y1="264" x2="560" y2="440" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="350" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="var(--accent)">Renting cheaper</text>
<text x="720" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="var(--dim)">Buying cheaper</text>
<circle cx="230" cy="402" r="11" fill="var(--accent)"/>
<text x="250" y="386" font-size="16" fill="var(--ink)">A few times a year</text>
<text x="480" y="530" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">Light compute needs: rent first</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊一團模糊的雲，右邊四個排成一列的勾選框">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
</defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="60" font-size="27" font-weight="700" fill="var(--ink)">一團，還是四個可以下手的點</text>

<rect x="48" y="105" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<path d="M130 250 C130 205 175 185 215 195 C240 165 300 170 312 200 C355 200 370 240 348 268 C355 305 310 330 275 315 C240 340 175 330 165 300 C130 298 118 272 130 250 Z" fill="var(--grey)" opacity="0.35" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="240" y="258" font-size="16" text-anchor="middle" fill="var(--ink)">像不像</text>
<text x="248" y="380" font-size="19" font-weight="700" text-anchor="middle" fill="var(--warn)">沒有地方可以下手</text>

<rect x="512" y="105" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="548" y="158" width="18" height="18" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="582" y="173" font-size="16" fill="var(--ink)">融資條件：變寬還是變緊</text>
<rect x="548" y="203" width="18" height="18" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="582" y="218" font-size="16" fill="var(--ink)">借款主體：有沒有往外擴散</text>
<rect x="548" y="248" width="18" height="18" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="582" y="263" font-size="16" fill="var(--ink)">折舊年限：有沒有被拉長</text>
<rect x="548" y="293" width="18" height="18" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="582" y="308" font-size="16" fill="var(--ink)">市場天花板：還在不在擴大</text>
<text x="712" y="372" font-size="19" font-weight="700" text-anchor="middle" fill="var(--accent)">每一條都能被推翻</text>

<text x="480" y="470" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">推翻得了，才叫判斷</text>
</svg>
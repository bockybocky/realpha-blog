<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="對比圖：直鏈斷一處整條停住，互連節點掉兩個仍然連通">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .lb { font-size:16px; fill:var(--dim); }
    .x { font-size:22px; font-weight:700; fill:var(--warn); }
    .cc { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56">掉一家，與掉幾家</text>
<rect x="60" y="90" width="400" height="300" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="128">單一供應商</text>
<rect x="84" y="200" width="70" height="56" fill="var(--accent)" opacity="0.85"/>
<line x1="154" y1="228" x2="184" y2="228" stroke="var(--accent)" stroke-width="3"/>
<rect x="184" y="200" width="70" height="56" fill="var(--accent)" opacity="0.85"/>
<line x1="254" y1="228" x2="284" y2="228" stroke="var(--warn)" stroke-width="3"/>
<rect x="284" y="200" width="70" height="56" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="x" x="311" y="236">✕</text>
<line x1="354" y1="228" x2="384" y2="228" stroke="var(--grey)" stroke-width="3" stroke-dasharray="5 5"/>
<rect x="384" y="200" width="52" height="56" fill="var(--grey)" opacity="0.4"/>
<text class="lb" x="84" y="316">斷一處</text>
<text class="lb" x="84" y="344">後面全停</text>
<rect x="500" y="90" width="400" height="300" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="524" y="128">分散驗證者</text>
<g stroke="var(--accent)" stroke-width="2">
<line x1="560" y1="180" x2="680" y2="180"/><line x1="680" y1="180" x2="800" y2="180"/>
<line x1="560" y1="250" x2="680" y2="250"/><line x1="680" y1="250" x2="800" y2="250"/>
<line x1="560" y1="320" x2="680" y2="320"/><line x1="680" y1="320" x2="800" y2="320"/>
<line x1="560" y1="180" x2="560" y2="250"/><line x1="560" y1="250" x2="560" y2="320"/>
<line x1="680" y1="180" x2="680" y2="250"/><line x1="680" y1="250" x2="680" y2="320"/>
<line x1="800" y1="180" x2="800" y2="250"/><line x1="800" y1="250" x2="800" y2="320"/>
<line x1="560" y1="180" x2="680" y2="250"/><line x1="680" y1="250" x2="800" y2="320"/>
<line x1="800" y1="180" x2="680" y2="250"/><line x1="680" y1="250" x2="560" y2="320"/>
</g>
<circle cx="560" cy="180" r="14" fill="var(--accent)"/>
<circle cx="680" cy="180" r="14" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="x" x="673" y="188">✕</text>
<circle cx="800" cy="180" r="14" fill="var(--accent)"/>
<circle cx="560" cy="250" r="14" fill="var(--accent)"/>
<circle cx="680" cy="250" r="14" fill="var(--accent)"/>
<circle cx="800" cy="250" r="14" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="x" x="793" y="258">✕</text>
<circle cx="560" cy="320" r="14" fill="var(--accent)"/>
<circle cx="680" cy="320" r="14" fill="var(--accent)"/>
<circle cx="800" cy="320" r="14" fill="var(--accent)"/>
<text class="lb" x="524" y="366">掉幾家，網路照樣推進</text>
<text class="cc" x="60" y="462">地基換了，上層照樣可以是受監理的那一家</text>
</svg>
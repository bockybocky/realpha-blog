<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two concentric circles whose outer radius is nearly twice the inner one, covering about three and a half times the area.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">Push the radius out and buildable land jumps, not inches</text>

<circle cx="420" cy="300" r="196" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="3"/>
<circle cx="420" cy="300" r="105" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<circle cx="420" cy="300" r="8" fill="var(--ink)"/>
<line x1="420" y1="300" x2="525" y2="300" stroke="var(--grey)" stroke-width="3"/>
<line x1="420" y1="300" x2="420" y2="104" stroke="var(--accent)" stroke-width="3"/>
<text x="472" y="290" font-size="16" fill="var(--dim)" text-anchor="middle">40 mi</text>
<text x="392" y="196" font-size="16" fill="var(--accent)" text-anchor="end">75 mi</text>
<text x="420" y="330" font-size="15" fill="var(--dim)" text-anchor="middle">Jobs</text>

<rect x="676" y="176" width="212" height="112" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="782" y="216" font-size="19" fill="var(--dim)" text-anchor="middle">Radius</text>
<text x="782" y="262" font-size="27" fill="var(--ink)" text-anchor="middle">×1.9</text>
<rect x="676" y="308" width="212" height="112" rx="12" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)"/>
<text x="782" y="348" font-size="19" fill="var(--accent)" text-anchor="middle">Area</text>
<text x="782" y="394" font-size="27" fill="var(--ink)" text-anchor="middle">×3.5</text>

<text x="480" y="524" font-size="22" fill="var(--ink)" text-anchor="middle">Land grows with the square, commuting hurts with the first power</text>
</svg>
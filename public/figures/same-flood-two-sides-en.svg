<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The dry side and the flooded side of the same flood, with two arrows on the right pointing in opposite directions.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56">One flood, two directions</text>

  <rect x="360" y="110" width="200" height="180" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="360" y="290" width="200" height="190" fill="var(--accent)" opacity="0.2"/>
  <rect x="360" y="290" width="200" height="190" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <line x1="360" y1="290" x2="560" y2="290" stroke="var(--accent)" stroke-width="3"/>

  <rect x="400" y="170" width="120" height="50" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
  <rect x="400" y="350" width="120" height="50" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>

  <text class="g" x="120" y="196">North</text>
  <text class="b" x="120" y="224">Seagate plant</text>
  <text class="b" x="120" y="250">Dry</text>

  <text class="g" x="120" y="376">Central parks</text>
  <text class="b" x="120" y="404">Western Digital plant</text>
  <text class="b" x="120" y="430">Flooded</text>

  <path d="M620 200 L620 130" stroke="var(--accent)" stroke-width="5" fill="none"/>
  <path d="M620 130 l-9 16 l18 0 z" fill="var(--accent)"/>
  <text class="b" x="650" y="176">Prices rise; it gets the good price</text>

  <path d="M620 380 L620 450" stroke="var(--warn)" stroke-width="5" fill="none"/>
  <path d="M620 450 l-9 -16 l18 0 z" fill="var(--warn)"/>
  <text class="b" x="650" y="408">Lines stop; share gets taken</text>

  <text class="c" x="60" y="528">The industry's book and the company's book are not the same book</text>
</svg>
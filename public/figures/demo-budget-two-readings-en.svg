<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Top resource bar fully filled and overflowing the frame, bottom resource bar only a small segment filled at the left edge">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">Same capability, two different framings</text>
<text x="60" y="132" font-size="19" fill="var(--ink)">Creators with early access</text>
<rect x="60" y="150" width="820" height="46" fill="var(--accent)"/>
<polygon points="920,173 884,151 884,195" fill="var(--accent)"/>
<text x="60" y="228" font-size="16" fill="var(--dim)">Unlimited for a week, running non-stop for seven days</text>
<text x="900" y="228" font-size="19" fill="var(--accent)" text-anchor="end">Where's the ceiling</text>
<text x="60" y="302" font-size="19" fill="var(--ink)">One week's quota on the $200 plan</text>
<rect x="60" y="320" width="840" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="60" y="320" width="14" height="46" fill="var(--accent)"/>
<text x="60" y="398" font-size="16" fill="var(--dim)">Uses about 1-2 percent</text>
<text x="900" y="398" font-size="19" fill="var(--accent)" text-anchor="end">What you can actually use</text>
<text x="60" y="466" font-size="22" fill="var(--ink)">One speaks to the ceiling, the other to your daily use</text>
</svg>
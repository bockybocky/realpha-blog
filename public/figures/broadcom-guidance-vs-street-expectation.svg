<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根長條並列，左高右低，兩根柱頂之間空出一段被標記，代表符合預期但沒有超出的空隙">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t  { font-size:27px; font-weight:700; fill:var(--ink); }
.g  { font-size:19px; font-weight:600; fill:var(--ink); }
.gd { font-size:19px; font-weight:600; fill:var(--dim); }
.gw { font-size:19px; font-weight:600; fill:var(--warn); }
.b  { font-size:16px; fill:var(--dim); }
.s  { font-size:15px; fill:var(--dim); }
.c  { font-size:22px; font-weight:600; fill:var(--ink); }
.cw { font-size:22px; font-weight:700; fill:var(--warn); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="64">符合預期，換來下跌</text>
<line x1="180" y1="150" x2="720" y2="150" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="180" y="150" width="130" height="280" rx="4" fill="var(--grey)"/>
<rect x="400" y="215" width="130" height="215" rx="4" fill="var(--accent)"/>
<line x1="120" y1="430" x2="800" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="180" y="462">街上的預期</text>
<text class="s" x="180" y="488">約 1500 億美元</text>
<text class="g" x="400" y="462">管理層指引</text>
<text class="s" x="400" y="488">約 1150 億美元</text>
<line x1="600" y1="152" x2="600" y2="213" stroke="var(--warn)" stroke-width="2"/>
<polygon points="600,146 594,160 606,160" fill="var(--warn)"/>
<polygon points="600,219 594,205 606,205" fill="var(--warn)"/>
<text class="gw" x="618" y="176">沒有的那一段</text>
<text class="s" x="618" y="200">＝ 沒給到的驚喜</text>
<text class="gd" x="700" y="306">股價當週</text>
<text class="cw" x="700" y="344">−4%</text>
<text class="c" x="60" y="524">股價比的是差距，不是高度</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條橫條急遽縮短，顯示客戶家數隨付費級距層層遞減">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="64" font-size="27" fill="var(--ink)">客戶金字塔：家數層層掉，收入沒有押在一個人身上</text>
<rect x="60" y="100" width="840" height="300" fill="var(--card)" rx="10"/>

<text x="90" y="150" font-size="20" fill="var(--dim)">年付 10 萬美元以上</text>
<rect x="90" y="162" width="700" height="34" fill="var(--accent)" rx="4"/>
<text x="802" y="186" font-size="19" fill="var(--ink)">11,900 家</text>

<text x="90" y="246" font-size="20" fill="var(--dim)">年付 100 萬美元以上</text>
<rect x="90" y="258" width="112" height="34" fill="var(--accent)" opacity="0.72" rx="4"/>
<text x="214" y="282" font-size="19" fill="var(--ink)">1,900 家</text>

<text x="90" y="342" font-size="20" fill="var(--dim)">年付 1,000 萬美元以上</text>
<rect x="90" y="354" width="15" height="34" fill="var(--accent)" opacity="0.5" rx="3"/>
<text x="118" y="378" font-size="19" fill="var(--ink)">約 250 家</text>

<line x1="60" y1="432" x2="900" y2="432" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="478" font-size="22" fill="var(--ink)">前五大客戶以外佔收入 79%</text>
<text x="500" y="478" font-size="22" fill="var(--dim)">單一客戶都不到一成</text>
</g>
</svg>
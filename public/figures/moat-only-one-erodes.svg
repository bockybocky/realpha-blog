<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="七根等高的柱子並排，只有中間標著轉換成本的那根被削掉一大截、以虛線標出原本高度，其餘六根維持原高。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .l { font-size:16px; fill:var(--dim); }
    .w { font-size:16px; fill:var(--warn); font-weight:700; }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="52">七種力量裡，只有一項在貶值</text>

  <rect x="82" y="210" width="78" height="190" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
  <rect x="200" y="210" width="78" height="190" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
  <rect x="318" y="210" width="78" height="190" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
  <rect x="554" y="210" width="78" height="190" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
  <rect x="672" y="210" width="78" height="190" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
  <rect x="790" y="210" width="78" height="190" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>

  <rect x="436" y="210" width="78" height="190" rx="5" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="436" y="322" width="78" height="78" rx="5" fill="var(--warn)" fill-opacity="0.18" stroke="var(--warn)" stroke-width="3"/>
  <path d="M 475 150 L 475 296" stroke="var(--warn)" stroke-width="3" fill="none"/>
  <path d="M 475 302 L 467 288 L 483 288 Z" fill="var(--warn)"/>
  <text class="w" x="475" y="136" text-anchor="middle">被工具溶掉</text>

  <path d="M 60 400 L 900 400" stroke="var(--line)" stroke-width="2"/>

  <text class="l" x="121" y="428" text-anchor="middle">規模經濟</text>
  <text class="l" x="239" y="428" text-anchor="middle">網路效應</text>
  <text class="l" x="357" y="428" text-anchor="middle">反向定位</text>
  <text class="w" x="475" y="428" text-anchor="middle">轉換成本</text>
  <text class="l" x="593" y="428" text-anchor="middle">品牌</text>
  <text class="l" x="711" y="428" text-anchor="middle">壟斷資源</text>
  <text class="l" x="829" y="428" text-anchor="middle">流程效能</text>

  <text class="c" x="480" y="492" text-anchor="middle">要問的是，這家靠的是哪幾項</text>
</svg>
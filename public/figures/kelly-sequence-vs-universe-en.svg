<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A row of cards arriving in sequence on the left against a whole field of dots laid out at once on the right, where each single position is far smaller.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="68">Kelly's table, and the investing table</text>
<line x1="480" y1="110" x2="480" y2="470" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="70" y="146">One hand after another</text>
<rect x="70" y="176" width="78" height="104" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="166" y="176" width="78" height="104" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2" opacity="0.6"/>
<rect x="262" y="176" width="78" height="104" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2" opacity="0.35"/>
<path d="M352,228 L420,228" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<text class="b" x="70" y="306">Only one arrives at a time</text>
<rect x="70" y="340" width="190" height="86" rx="8" fill="var(--accent)" opacity="0.22" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="90" y="392">You can bet big</text>
<text class="g" x="520" y="146">The whole universe is open at once</text>
<g fill="var(--accent)" opacity="0.75">
<circle cx="536" cy="188" r="11"/><circle cx="588" cy="188" r="11"/><circle cx="640" cy="188" r="11"/><circle cx="692" cy="188" r="11"/><circle cx="744" cy="188" r="11"/><circle cx="796" cy="188" r="11"/>
<circle cx="536" cy="232" r="11"/><circle cx="588" cy="232" r="11"/><circle cx="640" cy="232" r="11"/><circle cx="692" cy="232" r="11"/><circle cx="744" cy="232" r="11"/><circle cx="796" cy="232" r="11"/>
<circle cx="536" cy="276" r="11"/><circle cx="588" cy="276" r="11"/><circle cx="640" cy="276" r="11"/><circle cx="692" cy="276" r="11"/><circle cx="744" cy="276" r="11"/><circle cx="796" cy="276" r="11"/>
</g>
<text class="b" x="520" y="316">Every one has positive odds and deserves a share</text>
<rect x="520" y="340" width="34" height="86" rx="6" fill="var(--accent)" opacity="0.22" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="566" y="392">So each slot shrinks</text>
<text class="c" x="60" y="506">When everything is open at once, no single bet can be that big</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間線上左段施工期有數根高而窄的用水尖峰，右段營運期是一條低而長的平線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">兩個都是真的用水數字</text>

<line x1="100" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="380" y1="110" x2="380" y2="420" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>

<rect x="130" y="170" width="26" height="230" fill="var(--warn)" rx="3"/>
<rect x="190" y="210" width="26" height="190" fill="var(--warn)" rx="3"/>
<rect x="250" y="150" width="26" height="250" fill="var(--warn)" rx="3"/>
<rect x="310" y="240" width="26" height="160" fill="var(--warn)" rx="3"/>
<text class="g" x="130" y="130">施工期</text>
<text class="n" x="130" y="440">灑水抑塵 · 灌管 · 沖洗</text>

<rect x="400" y="370" width="490" height="30" fill="var(--accent)" rx="3"/>
<text class="g" x="400" y="130">營運期</text>
<text class="n" x="400" y="440">年復一年的低量</text>
<text class="n" x="400" y="350">散熱設計決定它多低</text>

<text class="c" x="60" y="490">混在一起講，兩邊都覺得對方在騙人</text>
</svg>
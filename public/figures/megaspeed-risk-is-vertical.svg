<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條貼著底部的平線走了很長一段，然後在某一點垂直往上跳到高處並持平，下方另有一條始終平坦的虛線代表財報上的訊號">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56">平常不出現，出現時是垂直的</text>
  <path d="M 90 400 L 600 400" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <path d="M 600 400 L 600 160 L 860 160" fill="none" stroke="var(--warn)" stroke-width="5"/>
  <text class="n" x="120" y="378" text-anchor="start" fill="var(--accent)">不碰營收</text>
  <text class="g" x="620" y="290" text-anchor="start" fill="var(--warn)">政治決定的那一刻</text>
  <text class="g" x="620" y="142" text-anchor="start" fill="var(--warn)">合作被收掉</text>
  <text class="n" x="620" y="190" text-anchor="start">合法也不保證留得住</text>
  <path d="M 90 456 L 860 456" fill="none" stroke="var(--grey)" stroke-width="4" stroke-dasharray="11 9"/>
  <text class="n" x="120" y="484" text-anchor="start">財報上的訊號：一路平的</text>
  <text class="n" x="60" y="516" text-anchor="start">示意，無刻度</text>
  <text class="c" x="60" y="550">要盯的是執行者，不是損益表</text>
</svg>
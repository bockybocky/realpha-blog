<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上排六個方格中一格填滿，下排十八個方格中三格填滿，比例相同但命中數量不同">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="480" y="60" text-anchor="middle" font-size="27" fill="var(--ink)">命中率一樣，機會次數不一樣</text>

  <text x="60" y="168" font-size="20" fill="var(--ink)">6 次</text>
  <rect x="170" y="130" width="94" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="278" y="130" width="94" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="386" y="130" width="94" height="60" rx="8" fill="var(--accent)"/>
  <rect x="494" y="130" width="94" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="602" y="130" width="94" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="710" y="130" width="94" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="830" y="168" font-size="15" fill="var(--dim)">命中 1</text>

  <text x="60" y="358" font-size="20" fill="var(--ink)">18 次</text>
  <rect x="170" y="270" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="278" y="270" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="386" y="270" width="94" height="44" rx="8" fill="var(--accent)"/>
  <rect x="494" y="270" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="602" y="270" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="710" y="270" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="170" y="330" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="278" y="330" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="386" y="330" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="494" y="330" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="602" y="330" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="710" y="330" width="94" height="44" rx="8" fill="var(--accent)"/>
  <rect x="170" y="390" width="94" height="44" rx="8" fill="var(--accent)"/>
  <rect x="278" y="390" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="386" y="390" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="494" y="390" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="602" y="390" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="710" y="390" width="94" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="830" y="358" font-size="15" fill="var(--dim)">命中 3</text>

  <text x="480" y="505" text-anchor="middle" font-size="22" fill="var(--ink)">你控制的是次數，不是哪一次</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="一個節點向右分岔成上下兩條路徑，上路往上是利多，下路往下是利空，兩條路來自同一則消息">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; fill:var(--ink); font-weight:700; }
    .g  { font-size:20px; font-weight:700; }
    .b  { font-size:19px; fill:var(--ink); font-weight:700; }
    .s  { font-size:15px; fill:var(--dim); }
    .e  { font-size:22px; font-weight:700; }
    .c  { font-size:22px; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text class="t" x="50" y="64">同一則新聞，兩個相反方向</text>

  <rect x="50" y="205" width="210" height="110" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="155" y="252" text-anchor="middle">Meta 出租</text>
  <text class="b" x="155" y="282" text-anchor="middle">舊 GPU 算力</text>

  <path d="M260 260 C 300 260, 300 172, 340 172" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M260 260 C 300 260, 300 350, 340 350" fill="none" stroke="var(--warn)" stroke-width="2.5"/>

  <rect x="340" y="128" width="230" height="90" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="455" y="166" text-anchor="middle" fill="var(--accent)">資產面</text>
  <text class="s" x="455" y="194" text-anchor="middle">機器仍在賺錢</text>

  <rect x="340" y="306" width="230" height="90" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="455" y="344" text-anchor="middle" fill="var(--warn)">估值面</text>
  <text class="s" x="455" y="372" text-anchor="middle">租金可被計算</text>

  <line x1="570" y1="173" x2="632" y2="173" stroke="var(--accent)" stroke-width="2.5"/>
  <polygon points="644,173 630,166 630,180" fill="var(--accent)"/>
  <line x1="570" y1="351" x2="632" y2="351" stroke="var(--warn)" stroke-width="2.5"/>
  <polygon points="644,351 630,344 630,358" fill="var(--warn)"/>

  <rect x="656" y="128" width="254" height="90" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <polygon points="700,150 714,176 686,176" fill="var(--accent)"/>
  <text class="e" x="732" y="176" fill="var(--accent)">利多</text>
  <text class="s" x="686" y="202">呆帳論不成立</text>

  <rect x="656" y="306" width="254" height="90" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <polygon points="700,382 714,356 686,356" fill="var(--warn)"/>
  <text class="e" x="732" y="378" fill="var(--warn)">利空</text>
  <text class="s" x="686" y="340">溢價被抽走</text>

  <text class="c" x="480" y="470" text-anchor="middle">同一件事，兩張帳</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="同一個起點往右分岔成向上與向下兩條路徑">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">同一個訊號，兩種結局</text>

<rect x="60" y="230" width="230" height="90" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="92" y="268" font-size="20" font-weight="700" fill="var(--ink)">寬度很差</text>
<text x="92" y="298" font-size="19" fill="var(--dim)">離高點很近</text>

<path d="M300 262 C 400 262 420 180 520 170" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M520 170 L 880 118" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text x="560" y="104" font-size="20" font-weight="700" fill="var(--accent)">1998</text>
<text x="640" y="104" font-size="19" fill="var(--dim)">又漲了兩年</text>

<path d="M300 292 C 400 292 430 330 520 342" fill="none" stroke="var(--warn)" stroke-width="4"/>
<path d="M520 342 L 880 448" fill="none" stroke="var(--warn)" stroke-width="5"/>
<text x="560" y="402" font-size="20" font-weight="700" fill="var(--warn)">2000</text>
<text x="640" y="402" font-size="19" fill="var(--dim)">隔一天見頂</text>

<text x="60" y="482" font-size="22" font-weight="700" fill="var(--ink)">不是充分條件，也不是必要條件</text>
</svg>
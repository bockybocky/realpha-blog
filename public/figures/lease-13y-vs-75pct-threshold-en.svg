<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two horizontal bars compare a 13-year lease term with the asset life: with a 15-year asset life, 13 years exceeds the 75% threshold, while with a 25-year asset life, the same 13 years falls short of it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">Same 13-year lease, different category</text>

  <text class="t" x="48" y="124" font-size="19" fill="var(--dim)">15-year asset life</text>
  <rect x="200" y="132" width="384" height="48" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="200" y="132" width="333" height="48" rx="4" fill="var(--accent)"/>
  <text class="t" x="216" y="163" font-size="16" fill="var(--page)">13-year lease</text>
  <line x1="488" y1="118" x2="488" y2="194" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="t" x="488" y="110" font-size="15" fill="var(--warn)" text-anchor="middle">75% threshold</text>
  <text class="t" x="200" y="212" font-size="16" fill="var(--ink)">87%  Above → finance lease</text>

  <text class="t" x="48" y="292" font-size="19" fill="var(--dim)">25-year asset life</text>
  <rect x="200" y="300" width="640" height="48" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="200" y="300" width="333" height="48" rx="4" fill="var(--accent)"/>
  <text class="t" x="216" y="331" font-size="16" fill="var(--page)">13-year lease</text>
  <line x1="680" y1="286" x2="680" y2="362" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="t" x="680" y="278" font-size="15" fill="var(--warn)" text-anchor="middle">75% threshold</text>
  <text class="t" x="200" y="380" font-size="16" fill="var(--ink)">52%  Below → operating lease</text>

  <line x1="48" y1="424" x2="912" y2="424" stroke="var(--line)"/>
  <text class="t" x="48" y="468" font-size="22" font-weight="700" fill="var(--ink)">A larger denominator makes the threshold harder to cross</text>
</svg>
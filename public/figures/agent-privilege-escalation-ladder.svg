<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊五階往右上爬升的樓梯代表權限逐級提升，右邊方框內密集排列的小方塊代表同時發生的大量攻擊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .lab { font-size:15px; fill:var(--ink); }
    .sub { font-size:15px; fill:var(--dim); }
    .big { font-size:20px; fill:var(--warn); font-weight:700; }
    .cc { font-size:22px; fill:var(--accent); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="80" y="54">一階一階往上，而且是一群</text>

  <rect x="80" y="430" width="105" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="185" y="384" width="105" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="290" y="338" width="105" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="395" y="292" width="105" height="46" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="246" width="105" height="46" fill="var(--accent)" stroke="var(--accent)" stroke-width="2"/>

  <text class="lab" x="132" y="459" text-anchor="middle">沙盒內</text>
  <text class="lab" x="237" y="413" text-anchor="middle">零日逃出</text>
  <text class="lab" x="342" y="367" text-anchor="middle">工作節點</text>
  <text class="lab" x="447" y="321" text-anchor="middle">主機權限</text>
  <text x="552" y="275" text-anchor="middle" font-size="15px" fill="var(--page)">雲端憑證</text>

  <line x1="80" y1="476" x2="605" y2="476" stroke="var(--line)" stroke-width="2"/>
  <text class="sub" x="80" y="500">起點</text>
  <text class="sub" x="605" y="500" text-anchor="end">橫向移動</text>
  <text class="g" x="80" y="140">權限</text>

  <rect x="660" y="180" width="240" height="250" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="780" y="216" text-anchor="middle">同時進行</text>
  <g fill="var(--warn)">
    <rect x="731" y="240" width="8" height="8"/><rect x="745" y="240" width="8" height="8"/><rect x="759" y="240" width="8" height="8"/><rect x="773" y="240" width="8" height="8"/><rect x="787" y="240" width="8" height="8"/><rect x="801" y="240" width="8" height="8"/><rect x="815" y="240" width="8" height="8"/>
    <rect x="731" y="254" width="8" height="8"/><rect x="745" y="254" width="8" height="8"/><rect x="759" y="254" width="8" height="8"/><rect x="773" y="254" width="8" height="8"/><rect x="787" y="254" width="8" height="8"/><rect x="801" y="254" width="8" height="8"/><rect x="815" y="254" width="8" height="8"/>
    <rect x="731" y="268" width="8" height="8"/><rect x="745" y="268" width="8" height="8"/><rect x="759" y="268" width="8" height="8"/><rect x="773" y="268" width="8" height="8"/><rect x="787" y="268" width="8" height="8"/><rect x="801" y="268" width="8" height="8"/><rect x="815" y="268" width="8" height="8"/>
    <rect x="731" y="282" width="8" height="8"/><rect x="745" y="282" width="8" height="8"/><rect x="759" y="282" width="8" height="8"/><rect x="773" y="282" width="8" height="8"/><rect x="787" y="282" width="8" height="8"/><rect x="801" y="282" width="8" height="8"/><rect x="815" y="282" width="8" height="8"/>
    <rect x="731" y="296" width="8" height="8"/><rect x="745" y="296" width="8" height="8"/><rect x="759" y="296" width="8" height="8"/><rect x="773" y="296" width="8" height="8"/><rect x="787" y="296" width="8" height="8"/><rect x="801" y="296" width="8" height="8"/><rect x="815" y="296" width="8" height="8"/>
    <rect x="731" y="310" width="8" height="8"/><rect x="745" y="310" width="8" height="8"/><rect x="759" y="310" width="8" height="8"/><rect x="773" y="310" width="8" height="8"/><rect x="787" y="310" width="8" height="8"/><rect x="801" y="310" width="8" height="8"/><rect x="815" y="310" width="8" height="8"/>
    <rect x="731" y="324" width="8" height="8"/><rect x="745" y="324" width="8" height="8"/><rect x="759" y="324" width="8" height="8"/><rect x="773" y="324" width="8" height="8"/><rect x="787" y="324" width="8" height="8"/><rect x="801" y="324" width="8" height="8"/><rect x="815" y="324" width="8" height="8"/>
    <rect x="731" y="338" width="8" height="8"/><rect x="745" y="338" width="8" height="8"/><rect x="759" y="338" width="8" height="8"/><rect x="773" y="338" width="8" height="8"/><rect x="787" y="338" width="8" height="8"/><rect x="801" y="338" width="8" height="8"/><rect x="815" y="338" width="8" height="8"/>
    <rect x="731" y="352" width="8" height="8"/><rect x="745" y="352" width="8" height="8"/><rect x="759" y="352" width="8" height="8"/><rect x="773" y="352" width="8" height="8"/><rect x="787" y="352" width="8" height="8"/><rect x="801" y="352" width="8" height="8"/><rect x="815" y="352" width="8" height="8"/>
  </g>
  <text class="big" x="780" y="404" text-anchor="middle">17,000+ 次</text>

  <text class="cc" x="80" y="536">守方要對付的不是一個，是一片</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="加上固定 IP 條件後，可選機器從 343 台的長條縮成 39 台的短條，最低價由 0.163 升到 0.201 美元">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70">多一個條件，池子少掉近九成</text>

<text class="g" x="60" y="140">全部機器</text>
<rect x="60" y="158" width="760" height="56" rx="6" fill="var(--grey)" opacity="0.45"/>
<text class="g" x="80" y="195" fill="var(--ink)">343 台</text>
<text class="n" x="836" y="195">最低 0.163 美元／時</text>

<text class="g" x="60" y="268">要有固定 IP</text>
<rect x="60" y="286" width="86" height="56" rx="6" fill="var(--accent)"/>
<text class="g" x="162" y="323">39 台</text>
<text class="n" x="836" y="323">最低 0.201 美元／時</text>

<rect x="60" y="392" width="420" height="78" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="n" x="82" y="424">整個市場裡的正式機房</text>
<text class="c" x="82" y="456">25 台，約 7%</text>

<text class="c" x="520" y="430">條件愈嚴，剩下的愈貴</text>
<text class="n" x="520" y="458">便宜，是因為它不是大機房</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="機場與三哩圈的兩格俯視對照，雷擊在圈內與已飄到圈外東側的差別">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="68">差別只在雷落在圈內還是圈外</text>

  <text class="d" x="60" y="112">西</text>
  <text class="d" x="900" y="112" text-anchor="end">東</text>
  <line x1="80" y1="100" x2="880" y2="100" stroke="var(--grey)" stroke-width="2"/>
  <path d="M880,100 l-14,-7 v14 z" fill="var(--grey)"/>
  <text class="d" x="480" y="92" text-anchor="middle">雷雨由西往東走</text>

  <circle cx="270" cy="300" r="120" fill="var(--card)" stroke="var(--line)" stroke-dasharray="6 6"/>
  <rect x="240" y="288" width="60" height="24" rx="4" fill="var(--ink)"/>
  <path d="M200,250 l22,34 h-16 l18,34 l-40,-40 h16 z" fill="var(--warn)"/>
  <text class="d" x="270" y="440" text-anchor="middle">三哩界線</text>
  <text class="g" x="270" y="482" text-anchor="middle" fill="var(--warn)">停機坪關半小時</text>

  <circle cx="690" cy="300" r="120" fill="var(--card)" stroke="var(--line)" stroke-dasharray="6 6"/>
  <rect x="660" y="288" width="60" height="24" rx="4" fill="var(--ink)"/>
  <path d="M862,250 l22,34 h-16 l18,34 l-40,-40 h16 z" fill="var(--warn)"/>
  <text class="d" x="690" y="440" text-anchor="middle">三哩界線</text>
  <text class="g" x="690" y="482" text-anchor="middle" fill="var(--accent)">照常起降</text>

  <text class="c" x="60" y="528">拿不到位置，就只能照最壞的那格辦</text>
</svg>
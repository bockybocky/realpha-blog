<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一個起點分岔成兩條時間線：一條走向二〇二七上半的缺料，一條走向二〇二八的需求說不清，兩端各有一個檢查點">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="60">不選邊，各寫一句會被打臉的話</text>

  <circle cx="130" cy="270" r="16" fill="var(--dim)"/>
  <text class="d" x="90" y="320">同一集節目</text>

  <path d="M 146 270 C 300 270 320 160 480 160 L 700 160" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <path d="M 146 270 C 300 270 320 390 480 390 L 700 390" fill="none" stroke="var(--warn)" stroke-width="5"/>

  <circle cx="700" cy="160" r="14" fill="var(--accent)"/>
  <circle cx="700" cy="390" r="14" fill="var(--warn)"/>

  <text class="g" x="400" y="134" fill="var(--accent)">缺的是料</text>
  <text class="g" x="400" y="436" fill="var(--warn)">缺的是需求</text>

  <text class="g" x="730" y="140">二〇二七上半</text>
  <text class="d" x="730" y="166">玻纖與織機缺料</text>
  <text class="d" x="730" y="190">變成公開話題</text>

  <text class="g" x="730" y="370">二〇二八</text>
  <text class="d" x="730" y="396">算力講不出用途</text>
  <text class="d" x="730" y="420">或多家砍用量支出</text>

  <text class="c" x="60" y="500">兩句都帶日期，到時候由事實回答</text>
</svg>
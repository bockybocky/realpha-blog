<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" role="img" aria-label="Two blocks of equal area: a long thin gray band on the left stands for the 700 million tons humanity has mined so far, and a narrow, tall blue column on the right stands for the 700 million tons to be mined in the next 18 years.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .ac { fill:var(--accent); }
    .wn { fill:var(--warn); }
    .inv { fill:var(--page); }
</style>
<rect x="0" y="0" width="960" height="550" fill="var(--page)"/>
<text x="480" y="52" text-anchor="middle" class="t">Same 700M tons of copper</text>
<text x="480" y="84" text-anchor="middle" class="d">Equal areas | widths not to scale</text>
<line x1="720" y1="150" x2="720" y2="430" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="60" y="400" width="620" height="14" fill="var(--grey)"/>
<line x1="148.6" y1="400" x2="148.6" y2="414" stroke="var(--page)" stroke-width="2"/>
<line x1="237.1" y1="400" x2="237.1" y2="414" stroke="var(--page)" stroke-width="2"/>
<line x1="325.7" y1="400" x2="325.7" y2="414" stroke="var(--page)" stroke-width="2"/>
<line x1="414.3" y1="400" x2="414.3" y2="414" stroke="var(--page)" stroke-width="2"/>
<line x1="502.9" y1="400" x2="502.9" y2="414" stroke="var(--page)" stroke-width="2"/>
<line x1="591.4" y1="400" x2="591.4" y2="414" stroke="var(--page)" stroke-width="2"/>
<rect x="760" y="269" width="60" height="145" fill="var(--accent)"/>
<line x1="760" y1="289.7" x2="820" y2="289.7" stroke="var(--page)" stroke-width="2"/>
<line x1="760" y1="310.4" x2="820" y2="310.4" stroke="var(--page)" stroke-width="2"/>
<line x1="760" y1="331.1" x2="820" y2="331.1" stroke="var(--page)" stroke-width="2"/>
<line x1="760" y1="351.9" x2="820" y2="351.9" stroke="var(--page)" stroke-width="2"/>
<line x1="760" y1="372.6" x2="820" y2="372.6" stroke="var(--page)" stroke-width="2"/>
<line x1="760" y1="393.3" x2="820" y2="393.3" stroke="var(--page)" stroke-width="2"/>
<line x1="50" y1="416" x2="880" y2="416" stroke="var(--grey)" stroke-width="2"/>
<text x="370" y="385" text-anchor="middle" class="g">700M tons mined to date</text>
<text x="790" y="255" text-anchor="middle" class="g ac">700M more tons</text>
<text x="60" y="446" class="b">Mohenjo-daro</text>
<text x="720" y="446" text-anchor="middle" class="b">Today</text>
<text x="790" y="446" text-anchor="middle" class="b ac">Next 18 years</text>
<text x="480" y="498" text-anchor="middle" class="c">With just 3% GDP growth</text>
<text x="480" y="528" text-anchor="middle" class="d">Excluding EVs and data centers</text>
</svg>
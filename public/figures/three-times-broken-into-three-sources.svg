<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三根長度不同的橫條，最長的一根撞上一道直立的牆">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">每年三倍，是三塊乘出來的</text>

  <line x1="330" y1="110" x2="330" y2="430" stroke="var(--line)" stroke-width="2"/>

  <text class="g" x="310" y="163" text-anchor="end">摩爾定律</text>
  <rect x="330" y="135" width="196" height="46" fill="var(--grey)"/>
  <text class="g" x="546" y="166">1.4×</text>

  <text class="g" x="310" y="248" text-anchor="end">新蓋的晶圓廠</text>
  <rect x="330" y="220" width="168" height="46" fill="var(--grey)"/>
  <text class="g" x="518" y="251">1.2×</text>

  <text class="g" x="310" y="333" text-anchor="end">搶手機與 PC 的配額</text>
  <rect x="330" y="305" width="252" height="46" fill="var(--warn)"/>
  <text class="g" x="602" y="336">1.8×</text>

  <rect x="596" y="285" width="8" height="120" fill="var(--warn)"/>
  <text class="g" x="620" y="330" fill="var(--warn)">明年底</text>
  <text class="s" x="620" y="356">最先進製程 60% 到 86%</text>

  <text class="s" x="330" y="404">前兩塊有物理天花板，第三塊是搬存量</text>

  <text class="c" x="60" y="500">最大的那一塊，搬完就沒有了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A wide pipe is pinched by a permitting bottleneck in the middle, with racks waiting for electricity on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">The Shortage Is Permits, Not Power</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">The Pipeline from Generation to Racks</text>

<path d="M80 170 L380 250 L580 250 L880 200 L880 360 L580 310 L380 310 L80 390 Z" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<rect x="380" y="250" width="200" height="60" fill="var(--warn)" opacity="0.3"/>
<line x1="380" y1="250" x2="380" y2="310" stroke="var(--warn)" stroke-width="3"/>
<line x1="580" y1="250" x2="580" y2="310" stroke="var(--warn)" stroke-width="3"/>

<text class="t" x="80" y="150" font-size="20" font-weight="700" fill="var(--ink)">Natural Gas, Nuclear</text>
<text class="t" x="80" y="430" font-size="16" fill="var(--dim)">Enough Supply</text>

<text class="t" x="394" y="222" font-size="20" font-weight="700" fill="var(--warn)">Bottleneck</text>
<text class="t" x="366" y="352" font-size="16" fill="var(--dim)">Grid, Public, Rules, Reviews</text>

<text class="t" x="740" y="178" font-size="20" font-weight="700" fill="var(--ink)">Racks</text>
<text class="t" x="700" y="400" font-size="16" fill="var(--dim)">Awaiting Power</text>

<line x1="60" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">First to Power the Racks, First to Get Paid</text>
</svg>
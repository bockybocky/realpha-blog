<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A staircase of processor counts with the UNIX line at the top and Linux stepping up year by year until it draws level.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">CPUs per single system</text>

<line x1="150" y1="460" x2="890" y2="460" stroke="var(--line)" stroke-width="3"/>
<line x1="150" y1="460" x2="150" y2="120" stroke="var(--line)" stroke-width="3"/>
<g class="b" fill="var(--dim)">
<text x="132" y="146" text-anchor="end">64</text>
<text x="132" y="226" text-anchor="end">32</text>
<text x="132" y="306" text-anchor="end">16</text>
<text x="132" y="386" text-anchor="end">8</text>
<text x="132" y="426" text-anchor="end">4</text>
<text x="132" y="456" text-anchor="end">2</text>
</g>

<line x1="150" y1="140" x2="890" y2="140" stroke="var(--grey)" stroke-width="5"/>
<text class="b" x="760" y="128">High-end UNIX: 64</text>
<line x1="150" y1="390" x2="620" y2="390" stroke="var(--grey)" stroke-width="4" stroke-dasharray="9 7"/>
<text class="b" x="300" y="378">NT 4.0: 4–8</text>

<path d="M150 452 L380 452 L380 230 L620 230 L620 140 L870 140" fill="none" stroke="var(--accent)" stroke-width="6"/>
<g fill="var(--accent)">
<circle cx="380" cy="230" r="8"/><circle cx="620" cy="140" r="8"/>
</g>
<text class="b" x="170" y="440" fill="var(--accent)">Linux 2.2</text>
<text class="b" x="392" y="214" fill="var(--accent)">2.4: 16–32</text>
<text class="b" x="632" y="176" fill="var(--accent)">2.6: 64</text>
<g class="b" fill="var(--dim)">
<text x="180" y="488">1999</text><text x="360" y="488">2001</text><text x="600" y="488">2003</text>
</g>

<text class="c" x="60" y="528">Ceiling rose step by step</text>
</svg>
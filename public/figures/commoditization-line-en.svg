<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The upper layer gets commoditised and the lower one stays, with a dividing line and the premium pointing at the lower layer." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="48" y="56" font-size="27" fill="var(--ink)">Which layer are you paying the premium for</text>
  <text x="48" y="88" font-size="16" fill="var(--dim)">Company stories usually bundle both layers into one pitch</text>

  <rect x="90" y="136" width="620" height="112" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="400" y="200" font-size="20" fill="var(--ink)" text-anchor="middle">The intelligence itself</text>
  <text x="732" y="200" font-size="16" fill="var(--warn)">Gets commoditised</text>

  <line x1="60" y1="288" x2="900" y2="288" stroke="var(--line)" stroke-width="3"/>

  <rect x="90" y="320" width="620" height="164" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="110" y="340" width="280" height="58" rx="8" fill="var(--page)" stroke="var(--line)"/>
  <text x="250" y="376" font-size="16" fill="var(--ink)" text-anchor="middle">The compute fleet</text>
  <rect x="410" y="340" width="280" height="58" rx="8" fill="var(--page)" stroke="var(--line)"/>
  <text x="550" y="376" font-size="16" fill="var(--ink)" text-anchor="middle">Workflow and integration</text>
  <rect x="110" y="408" width="280" height="58" rx="8" fill="var(--page)" stroke="var(--line)"/>
  <text x="250" y="444" font-size="16" fill="var(--ink)" text-anchor="middle">Team habits</text>
  <rect x="410" y="408" width="280" height="58" rx="8" fill="var(--page)" stroke="var(--line)"/>
  <text x="550" y="444" font-size="16" fill="var(--ink)" text-anchor="middle">Brand familiarity</text>

  <text x="732" y="384" font-size="16" fill="var(--dim)">These stay</text>
  <text x="732" y="416" font-size="19" fill="var(--accent)">Pay the premium here</text>
  <polygon points="716,408 730,401 730,415" fill="var(--accent)"/>

  <text x="480" y="530" font-size="22" fill="var(--accent)" text-anchor="middle">Do not pay for the layer that expires</text>
</svg>
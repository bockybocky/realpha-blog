<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一九六〇到一九八四的時間線，上方是投入節點下方是世界轉向節點，前提在一九七三失效時投入仍在進行">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">前提的有效期，比工程短</text>

  <text x="120" y="130" font-size="19" font-weight="700" fill="var(--dim)">埃克森的投入</text>
  <line x1="120" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="3"/>
  <line x1="120" y1="300" x2="520" y2="300" stroke="var(--accent)" stroke-width="6"/>
  <line x1="520" y1="300" x2="880" y2="300" stroke="var(--warn)" stroke-width="6"/>
  <text x="200" y="336" font-size="15" fill="var(--accent)">前提成立</text>
  <text x="640" y="336" font-size="15" fill="var(--warn)">前提已過期</text>

  <circle cx="120" cy="300" r="7" fill="var(--accent)"/>
  <circle cx="212" cy="300" r="7" fill="var(--accent)"/>
  <circle cx="582" cy="300" r="7" fill="var(--warn)"/>
  <circle cx="674" cy="300" r="7" fill="var(--warn)"/>
  <circle cx="860" cy="300" r="7" fill="var(--warn)"/>
  <circle cx="520" cy="300" r="10" fill="var(--warn)"/>
  <circle cx="643" cy="300" r="7" fill="var(--grey)"/>
  <circle cx="767" cy="300" r="7" fill="var(--grey)"/>

  <line x1="120" y1="300" x2="120" y2="220" stroke="var(--line)" stroke-width="2"/>
  <text x="96" y="210" font-size="16" fill="var(--ink)">診斷</text>
  <text x="96" y="188" font-size="15" fill="var(--dim)">1960</text>
  <line x1="212" y1="300" x2="212" y2="250" stroke="var(--line)" stroke-width="2"/>
  <text x="188" y="240" font-size="16" fill="var(--ink)">撒種</text>
  <text x="188" y="218" font-size="15" fill="var(--dim)">1963</text>
  <line x1="582" y1="300" x2="582" y2="220" stroke="var(--line)" stroke-width="2"/>
  <text x="546" y="210" font-size="16" fill="var(--ink)">投資 Zilog</text>
  <text x="546" y="188" font-size="15" fill="var(--dim)">1975</text>
  <line x1="674" y1="300" x2="674" y2="250" stroke="var(--line)" stroke-width="2"/>
  <text x="650" y="240" font-size="16" fill="var(--ink)">合併十五家</text>
  <text x="650" y="218" font-size="15" fill="var(--dim)">1978</text>
  <line x1="860" y1="300" x2="860" y2="220" stroke="var(--line)" stroke-width="2"/>
  <text x="810" y="210" font-size="16" fill="var(--ink)">認賠</text>
  <text x="810" y="188" font-size="15" fill="var(--dim)">1984</text>

  <text x="120" y="480" font-size="19" font-weight="700" fill="var(--dim)">世界的轉向</text>
  <line x1="520" y1="300" x2="520" y2="380" stroke="var(--warn)" stroke-width="2"/>
  <text x="472" y="404" font-size="16" font-weight="700" fill="var(--warn)">油價暴漲</text>
  <text x="472" y="426" font-size="15" fill="var(--dim)">1973</text>
  <line x1="643" y1="300" x2="643" y2="356" stroke="var(--line)" stroke-width="2"/>
  <text x="608" y="380" font-size="16" fill="var(--ink)">Apple II</text>
  <text x="608" y="402" font-size="15" fill="var(--dim)">1977</text>
  <line x1="767" y1="300" x2="767" y2="380" stroke="var(--line)" stroke-width="2"/>
  <text x="736" y="404" font-size="16" fill="var(--ink)">IBM PC</text>
  <text x="736" y="426" font-size="15" fill="var(--dim)">1981</text>

  <text x="60" y="528" font-size="22" font-weight="700" fill="var(--ink)">工程還在跑，理由已經不在了</text>
</svg>
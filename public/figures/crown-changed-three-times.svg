<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="美國持股率明顯最高並戴著王冠，另外三個矮很多的國家柱頂也各有一頂王冠">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="64" font-size="27" fill="var(--ink)">王冠戴過的，現在都在後面</text>
  <text class="t" x="60" y="96" font-size="16" fill="var(--dim)">家庭持股率</text>

  <rect x="140" y="140" width="100" height="300" fill="var(--accent)"/>
  <rect x="340" y="275" width="100" height="165" fill="var(--warn)"/>
  <rect x="540" y="365" width="100" height="75" fill="var(--warn)"/>
  <rect x="740" y="370" width="100" height="70" fill="var(--warn)"/>

  <polygon points="0,14 0,0 6,7 12,0 18,7 24,0 24,14" fill="var(--accent)" transform="translate(178,100)"/>
  <polygon points="0,14 0,0 6,7 12,0 18,7 24,0 24,14" fill="var(--warn)" transform="translate(378,235)"/>
  <polygon points="0,14 0,0 6,7 12,0 18,7 24,0 24,14" fill="var(--warn)" transform="translate(578,325)"/>
  <polygon points="0,14 0,0 6,7 12,0 18,7 24,0 24,14" fill="var(--warn)" transform="translate(778,330)"/>

  <text class="t" x="190" y="132" font-size="19" fill="var(--ink)" text-anchor="middle">60%</text>
  <text class="t" x="390" y="267" font-size="19" fill="var(--ink)" text-anchor="middle">33%</text>
  <text class="t" x="590" y="357" font-size="19" fill="var(--ink)" text-anchor="middle">15%</text>
  <text class="t" x="790" y="362" font-size="19" fill="var(--ink)" text-anchor="middle">14%</text>

  <line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="190" y="470" font-size="16" fill="var(--ink)" text-anchor="middle">美國</text>
  <text class="t" x="390" y="470" font-size="16" fill="var(--ink)" text-anchor="middle">英國</text>
  <text class="t" x="590" y="470" font-size="16" fill="var(--ink)" text-anchor="middle">日本</text>
  <text class="t" x="790" y="470" font-size="16" fill="var(--ink)" text-anchor="middle">荷蘭</text>

  <line x1="340" y1="492" x2="840" y2="492" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="590" y="518" font-size="16" fill="var(--warn)" text-anchor="middle">曾經的全球最大股市</text>
</svg>
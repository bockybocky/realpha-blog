<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two opposite cost curves on one chart: things finished in a factory fall as cumulative volume rises, while engineering built on site tilts upward with volume, so the two lines cross near the origin on the left and then spread further and further apart.">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Do more, and one side gets cheaper while the other gets dearer</text>

  <line x1="150" y1="450" x2="900" y2="450" stroke="var(--ink)" stroke-width="2"/>
  <line x1="150" y1="120" x2="150" y2="450" stroke="var(--ink)" stroke-width="2"/>
  <text x="128" y="134" font-size="16" fill="var(--dim)" text-anchor="end">Unit cost</text>
  <text x="520" y="482" font-size="16" fill="var(--dim)" text-anchor="middle">Cumulative units built</text>
  <text x="900" y="482" font-size="16" fill="var(--dim)" text-anchor="end">100th time</text>
  <text x="160" y="482" font-size="16" fill="var(--dim)">1st time</text>

  <path d="M 170 250 Q 420 174 900 158" fill="none" stroke="var(--warn)" stroke-width="5"/>
  <text x="884" y="138" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="end">Engineering built on site</text>
  <g font-size="16" fill="var(--dim)" text-anchor="end">
    <text x="884" y="192">Permits</text>
    <text x="884" y="216">Pricier</text>
  </g>

  <path d="M 170 280 Q 420 400 900 420" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <text x="884" y="396" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="end">Boxes finished in a factory</text>
  <g font-size="16" fill="var(--dim)" text-anchor="end">
    <text x="330" y="352">Solar panels, batteries</text>
    <text x="330" y="376">Power devices, motors</text>
  </g>

  <text x="60" y="530" font-size="22" font-weight="700" fill="var(--ink)">Learning curves need repeat manufacturing; one-off engineering has no such line</text>
</svg>
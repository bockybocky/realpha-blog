<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="石油與天然氣的箭頭往下、煤的箭頭往上，三支方向不一致">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">安全偏好不會自動偏向低排放</text>
  <text class="t" x="60" y="100" font-size="16" fill="var(--dim)">額外回應情境，與既定政策情境相比</text>

  <line x1="90" y1="250" x2="880" y2="250" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>

  <text class="t" x="200" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">石油</text>
  <path d="M200 185 L200 370" stroke="var(--accent)" stroke-width="7" fill="none"/>
  <path d="M200 395 l-13 -25 l26 0 z" fill="var(--accent)"/>
  <text class="t" x="200" y="430" font-size="16" text-anchor="middle" fill="var(--dim)">進口量更低</text>

  <text class="t" x="420" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">天然氣</text>
  <path d="M420 185 L420 350" stroke="var(--accent)" stroke-width="7" fill="none"/>
  <path d="M420 375 l-13 -25 l26 0 z" fill="var(--accent)"/>
  <text class="t" x="420" y="430" font-size="16" text-anchor="middle" fill="var(--dim)">需求更低</text>

  <text class="t" x="700" y="430" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">煤</text>
  <path d="M700 390 L700 215" stroke="var(--warn)" stroke-width="7" fill="none"/>
  <path d="M700 190 l-13 25 l26 0 z" fill="var(--warn)"/>
  <text class="t" x="700" y="160" font-size="16" text-anchor="middle" fill="var(--dim)">略高</text>
  <text class="t" x="700" y="466" font-size="15" text-anchor="middle" fill="var(--dim)">受傷最重的亞洲進口國，國內有的就是煤</text>

  <text class="t" x="480" y="518" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">自家生產的，不一定是乾淨的</text>
</svg>
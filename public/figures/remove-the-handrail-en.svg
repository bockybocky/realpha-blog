<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two lines first overlap into one, then split after a vertical dashed line, one going up and the other going down.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">Only once the handrail is gone do the two readings part ways</text>

  <line x1="100" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="3"/>
  <line x1="520" y1="110" x2="520" y2="430" stroke="var(--dim)" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="g" x="520" y="98" text-anchor="middle">Subsidy removed</text>

  <line x1="120" y1="370" x2="520" y2="300" stroke="var(--grey)" stroke-width="14"/>
  <line x1="120" y1="370" x2="520" y2="300" stroke="var(--accent)" stroke-width="4" stroke-dasharray="10 8"/>
  <text class="d" x="140" y="400">The two lines overlap exactly, indistinguishable</text>

  <line x1="520" y1="300" x2="880" y2="196" stroke="var(--accent)" stroke-width="6"/>
  <text class="g" x="700" y="186">Walking on its own</text>
  <line x1="520" y1="300" x2="880" y2="398" stroke="var(--grey)" stroke-width="6"/>
  <text class="d" x="700" y="422">Held up by the rail</text>

  <text class="c" x="60" y="500">Whether it walks on its own is only measurable once the rail is gone</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A side-by-side contrast: pushing down long-term yields breaks down in transmission under a floating-rate structure, but passes straight through under a fixed-rate structure.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:20px;fill:var(--ink)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">Push down long rates — does it reach borrowers?</text>

<rect x="60" y="96" width="390" height="376" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="134">Sweden</text>
<text class="b" x="84" y="162">Mostly floating rates</text>
<rect x="104" y="184" width="300" height="46" rx="8" fill="var(--page)" stroke="var(--line)"/>
<text class="b" x="124" y="214">Central bank pushes down long yields</text>
<path d="M254 236 L254 268" stroke="var(--warn)" stroke-width="4"/>
<path d="M254 296 L254 336" stroke="var(--warn)" stroke-width="4" stroke-dasharray="7 9" marker-end="url(#aw)"/>
<rect x="150" y="266" width="208" height="32" rx="6" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text class="b" x="170" y="289">Rate structure: floating</text>
<rect x="104" y="352" width="300" height="86" rx="8" fill="var(--page)" stroke="var(--line)"/>
<text class="g" x="124" y="386">Actual borrowing costs</text>
<text class="b" x="124" y="416">Barely move</text>

<rect x="510" y="96" width="390" height="376" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="534" y="134">US</text>
<text class="b" x="534" y="162">Mostly 30-year fixed</text>
<rect x="554" y="184" width="300" height="46" rx="8" fill="var(--page)" stroke="var(--line)"/>
<text class="b" x="574" y="214">CB pushes down long yields</text>
<path d="M704 236 L704 268" stroke="var(--accent)" stroke-width="4"/>
<path d="M704 296 L704 344" stroke="var(--accent)" stroke-width="4" marker-end="url(#aa)"/>
<rect x="600" y="266" width="208" height="32" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="620" y="289">Rate structure: fixed</text>
<rect x="554" y="352" width="300" height="86" rx="8" fill="var(--page)" stroke="var(--line)"/>
<text class="g" x="574" y="386">Actual costs</text>
<text class="b" x="574" y="416">Refis and new buyers both fall</text>

<text class="c" x="60" y="518">Same move, different rate structures</text>
</svg>
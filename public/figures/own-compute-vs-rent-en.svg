<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left the compute sits inside the company boundary; on the right it sits outside, joined by a dashed line.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="64" font-size="27" fill="var(--ink)">Whose name the compute is in</text>

<text x="60" y="110" font-size="20" fill="var(--dim)">Owned outright</text>
<rect x="60" y="126" width="380" height="230" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5" rx="10"/>
<text x="84" y="160" font-size="19" fill="var(--ink)">Alphabet · Meta</text>
<rect x="84" y="180" width="80" height="54" fill="var(--accent)" rx="4"/>
<rect x="176" y="180" width="80" height="54" fill="var(--accent)" rx="4"/>
<rect x="268" y="180" width="80" height="54" fill="var(--accent)" rx="4"/>
<rect x="84" y="250" width="80" height="54" fill="var(--accent)" rx="4"/>
<rect x="176" y="250" width="80" height="54" fill="var(--accent)" rx="4"/>
<text x="84" y="336" font-size="16" fill="var(--dim)">Compute on the balance sheet</text>

<text x="520" y="110" font-size="20" fill="var(--dim)">Rented access</text>
<rect x="520" y="126" width="180" height="230" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 6" rx="10"/>
<text x="544" y="160" font-size="19" fill="var(--ink)">Anthropic</text>
<text x="544" y="186" font-size="19" fill="var(--ink)">OpenAI</text>
<text x="544" y="336" font-size="16" fill="var(--dim)">No machines owned</text>

<line x1="700" y1="240" x2="770" y2="240" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="706" y="228" font-size="16" fill="var(--dim)">Contract</text>
<rect x="780" y="180" width="70" height="54" fill="var(--grey)" rx="4"/>
<rect x="780" y="250" width="70" height="54" fill="var(--grey)" rx="4"/>
<text x="780" y="336" font-size="16" fill="var(--dim)">Cloud vendors</text>

<line x1="60" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="446" font-size="22" fill="var(--ink)">The biggest question: $500B–$900B of purchase commitments</text>
<rect x="60" y="470" width="840" height="30" fill="var(--warn)" opacity="0.35" rx="6"/>
<text x="78" y="492" font-size="19" fill="var(--ink)">Spread across several cloud vendors</text>
</g>
</svg>
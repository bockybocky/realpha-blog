<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三次利多的股價線上下排列，高點從利多後很久、到利多後不久、到公布當下，一次比一次早，用橘色虛線串起往左移">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">市場記住了，跑得一次比一次早</text>
<line x1="100" y1="240" x2="860" y2="240" stroke="var(--line)" stroke-width="1.5"/>
<line x1="100" y1="355" x2="860" y2="355" stroke="var(--line)" stroke-width="1.5"/>
<line x1="300" y1="115" x2="300" y2="470" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 6"/>
<text x="300" y="104" text-anchor="middle" font-size="16" fill="var(--dim)">利多公布</text>
<text x="160" y="200" text-anchor="end" font-size="19" fill="var(--ink)">第 1 次</text>
<text x="160" y="318" text-anchor="end" font-size="19" fill="var(--ink)">第 2 次</text>
<text x="160" y="432" text-anchor="end" font-size="19" fill="var(--ink)">第 3 次</text>
<polyline points="180,205 300,195 400,165 480,135 560,175 700,195" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
<polyline points="180,322 300,312 380,262 460,305 700,330" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
<polyline points="180,425 298,422 300,375 360,410 480,450 700,455" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
<polyline points="480,135 380,262 300,375" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="7 6"/>
<circle cx="480" cy="135" r="9" fill="var(--warn)"/>
<circle cx="380" cy="262" r="9" fill="var(--warn)"/>
<circle cx="300" cy="375" r="9" fill="var(--warn)"/>
<text x="520" y="268" font-size="20" font-weight="700" fill="var(--warn)">高點越來越早</text>
<text x="860" y="492" text-anchor="end" font-size="15" fill="var(--dim)">時間 →</text>
<text x="480" y="535" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">跌的是累積的預期</text>
</svg>
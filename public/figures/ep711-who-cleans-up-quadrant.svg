<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一張四象限圖，橫軸是學得會與學不會、縱軸是出錯我收拾與出錯有人簽名；左上那一格用警示底色標出最常掉進去的硬撐區">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56">該自己做還是交出去，看出錯那天誰收拾</text>
  <rect x="180" y="110" width="330" height="150" fill="var(--warn)" opacity="0.18"/>
  <rect x="510" y="110" width="330" height="150" fill="var(--card)"/>
  <rect x="180" y="260" width="330" height="150" fill="var(--card)"/>
  <rect x="510" y="260" width="330" height="150" fill="var(--card)"/>
  <line x1="510" y1="100" x2="510" y2="420" stroke="var(--line)" stroke-width="2"/>
  <line x1="170" y1="260" x2="850" y2="260" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="80" y="180">出錯</text>
  <text class="b" x="80" y="206">我收拾</text>
  <text class="b" x="80" y="330">出錯</text>
  <text class="b" x="80" y="356">有人簽名</text>
  <text class="b" x="300" y="452">學得會</text>
  <text class="b" x="630" y="452">學不會</text>
  <text class="g" x="200" y="200">硬撐</text>
  <text class="b" x="200" y="232">最常掉進來的那一格</text>
  <text class="g" x="530" y="200">撐不住</text>
  <text class="g" x="200" y="350">自己做也行</text>
  <text class="g" x="530" y="350">交出去</text>
  <text class="c" x="60" y="518">「我學得會」不等於「我該自己做」</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊單體放大、不確定張開；右邊重複單位、成本階梯下降">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
</style></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="66">兩種讓它變便宜的路</text>
<rect x="60" y="96" width="400" height="420" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="520" y="96" width="380" height="420" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="134">做得更大、更完美</text>
<text class="g" x="544" y="134">同一台做很多次</text>
<rect x="100" y="400" width="36" height="36" rx="3" fill="var(--grey)"/>
<rect x="176" y="360" width="64" height="76" rx="3" fill="var(--grey)"/>
<rect x="280" y="282" width="120" height="154" rx="4" fill="var(--warn)"/>
<line x1="100" y1="452" x2="400" y2="452" stroke="var(--line)" stroke-width="2"/>
<path d="M118 340 L118 320 M200 300 L200 250 M330 240 L330 150" stroke="var(--warn)" stroke-width="3"/>
<path d="M108 320 L128 320 M186 250 L214 250 M300 150 L360 150" stroke="var(--warn)" stroke-width="3"/>
<text class="n" x="84" y="486">工期與預算的不確定跟著放大</text>
<g fill="var(--accent)">
<rect x="548" y="406" width="30" height="30" rx="3"/><rect x="588" y="406" width="30" height="30" rx="3"/>
<rect x="628" y="406" width="30" height="30" rx="3"/><rect x="668" y="406" width="30" height="30" rx="3"/>
<rect x="708" y="406" width="30" height="30" rx="3"/><rect x="748" y="406" width="30" height="30" rx="3"/>
<rect x="788" y="406" width="30" height="30" rx="3"/><rect x="828" y="406" width="30" height="30" rx="3"/>
<rect x="548" y="366" width="30" height="30" rx="3"/><rect x="588" y="366" width="30" height="30" rx="3"/>
<rect x="628" y="366" width="30" height="30" rx="3"/><rect x="668" y="366" width="30" height="30" rx="3"/>
<rect x="708" y="366" width="30" height="30" rx="3"/><rect x="748" y="366" width="30" height="30" rx="3"/>
<rect x="788" y="366" width="30" height="30" rx="3"/><rect x="828" y="366" width="30" height="30" rx="3"/>
</g>
<line x1="548" y1="452" x2="858" y2="452" stroke="var(--line)" stroke-width="2"/>
<polyline points="548,180 628,180 628,236 708,236 708,278 788,278 788,304 858,304" fill="none" stroke="var(--ink)" stroke-width="3"/>
<text class="n" x="548" y="166">每一代改一點，單位成本往下</text>
<text class="n" x="544" y="486">便宜長在重複裡</text>
</svg>
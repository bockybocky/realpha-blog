<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三根高低不同的柱子，微電網本事從醫院校園的小柱先被資料中心推到最高，再往下回流到中等高度的充電站">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">同一套本事，被推上去再流下來</text>

  <line x1="120" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
  <rect x="160" y="340" width="150" height="60" rx="6" fill="var(--grey)"/>
  <rect x="405" y="150" width="150" height="250" rx="6" fill="var(--accent)"/>
  <rect x="650" y="290" width="150" height="110" rx="6" fill="var(--accent)" opacity="0.6"/>

  <g font-size="19" fill="var(--ink)" text-anchor="middle">
    <text x="235" y="432">醫院與校園</text>
    <text x="480" y="432">資料中心</text>
    <text x="725" y="432">公路邊充電站</text>
  </g>
  <g font-size="15" fill="var(--dim)" text-anchor="middle">
    <text x="235" y="456">做了十幾年</text>
    <text x="480" y="456">吉瓦級</text>
    <text x="725" y="456">十幾到二十兆瓦</text>
  </g>
  <text x="235" y="326" font-size="16" fill="var(--dim)" text-anchor="middle">練出調度本事</text>
  <text x="480" y="130" font-size="16" fill="var(--accent)" text-anchor="middle">推到十一格</text>
  <text x="725" y="270" font-size="16" fill="var(--dim)" text-anchor="middle">自帶電池，可離可併</text>

  <path d="M 320 330 Q 362 230 400 180" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M 392 190 L 404 168 L 414 192 Z" fill="var(--accent)"/>
  <path d="M 560 180 Q 610 210 645 280" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="9 7"/>
  <path d="M 634 266 L 650 292 L 626 288 Z" fill="var(--accent)"/>
  <text x="615" y="214" font-size="16" fill="var(--accent)">往下回流</text>
</svg>
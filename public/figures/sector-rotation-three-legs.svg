<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三欄之間兩條路徑交叉，一條從最下排升到最上排，另一條從最上排掉下來">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="72" font-size="27" fill="var(--ink)">領先的那一群，換了三次</text>
<rect x="60" y="160" width="840" height="70" fill="var(--card)"/>
<rect x="60" y="400" width="840" height="70" fill="var(--card)"/>
<text x="70" y="150" font-size="16" fill="var(--dim)">領先</text>
<text x="70" y="492" font-size="16" fill="var(--dim)">墊底</text>
<text x="250" y="120" font-size="19" fill="var(--ink)" text-anchor="middle">第一季</text>
<text x="530" y="120" font-size="19" fill="var(--ink)" text-anchor="middle">六月到八月</text>
<text x="810" y="120" font-size="19" fill="var(--ink)" text-anchor="middle">八月到十月</text>
<polyline points="250,435 530,435 810,195" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="250,195 530,300 810,435" fill="none" stroke="var(--grey)" stroke-width="3"/>
<circle cx="250" cy="435" r="8" fill="var(--accent)"/>
<circle cx="530" cy="435" r="8" fill="var(--accent)"/>
<circle cx="810" cy="195" r="10" fill="var(--accent)"/>
<circle cx="250" cy="195" r="8" fill="var(--grey)"/>
<circle cx="530" cy="195" r="8" fill="var(--grey)"/>
<circle cx="810" cy="435" r="8" fill="var(--grey)"/>
<text x="268" y="462" font-size="16" fill="var(--accent)">科技</text>
<text x="268" y="188" font-size="16" fill="var(--dim)">能源</text>
<text x="548" y="188" font-size="16" fill="var(--dim)">金融 · 醫療 · 不動產</text>
<text x="700" y="462" font-size="16" fill="var(--dim)">公用 · 不動產 · 耐久財</text>
<text x="60" y="528" font-size="22" fill="var(--ink)">位子一直在換手，不是一群人一路領先</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="In this proportional diagram, a small piece cut from the right end of a long bar connects by dashed lines to a short column below, where it fills the bottom 40% of the height.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">A tiny piece in a much smaller pool</text>

<text x="60" y="110" font-size="19" fill="var(--dim)">Consumer debt: $19 trillion</text>
<rect x="60" y="128" width="840" height="78" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="858" y="128" width="42" height="78" rx="6" fill="var(--warn)"/>
<text x="879" y="236" font-size="16" fill="var(--warn)" text-anchor="middle">5%</text>

<path d="M879 250 L879 300 L560 300 L560 330" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
<path d="M548 320 L560 344 L572 320 Z" fill="var(--warn)"/>

<text x="300" y="376" font-size="19" fill="var(--dim)" text-anchor="end">Bank equity</text>
<text x="300" y="402" font-size="19" fill="var(--dim)" text-anchor="end">$2.6 trillion</text>
<rect x="460" y="350" width="200" height="160" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="460" y="446" width="200" height="64" rx="0" fill="var(--warn)"/>
<text x="700" y="486" font-size="16" fill="var(--warn)">About $1T = 40%</text>

<text x="60" y="556" font-size="22" fill="var(--ink)">Compare it with what it consumes, not itself</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩軸四象限中兩個點分別在左上與右下，右上角虛線框是空的">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">兩邊都有的那一格，空著</text>
<line x1="200" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="200" y1="470" x2="200" y2="120" stroke="var(--line)" stroke-width="2"/>
<polygon points="880,470 862,463 862,477" fill="var(--line)"/>
<polygon points="200,120 193,138 207,138" fill="var(--line)"/>
<text x="700" y="502" font-size="19" fill="var(--dim)">營運經驗</text>
<text x="212" y="136" font-size="19" fill="var(--dim)">工程與技術背景</text>
<rect x="620" y="150" width="240" height="120" rx="8" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="740" y="200" font-size="19" fill="var(--dim)" text-anchor="middle">同等技能組合</text>
<text x="740" y="230" font-size="19" fill="var(--dim)" text-anchor="middle">很少人站得進來</text>
<circle cx="330" cy="210" r="12" fill="var(--accent)"/>
<text x="356" y="206" font-size="19" fill="var(--ink)">Ian Buck</text>
<text x="356" y="232" font-size="16" fill="var(--dim)">發明 CUDA，欠營運</text>
<circle cx="700" cy="400" r="12" fill="var(--accent)"/>
<text x="500" y="396" font-size="19" fill="var(--ink)" text-anchor="end">Colette Kress</text>
<text x="500" y="422" font-size="16" fill="var(--dim)" text-anchor="end">做得好，欠技術背景</text>
<line x1="510" y1="400" x2="676" y2="400" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="540" font-size="22" fill="var(--ink)">缺口不在名單短，在右上角沒有人</text>
</svg>
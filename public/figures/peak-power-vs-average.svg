<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="極高極窄的尖峰與幾乎貼地的長條，高度差極大但覆蓋的面積相當">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .k { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">峰值高　時間短</text>
<line x1="100" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="100" y="430">時間</text>
<text class="b" x="62" y="130" transform="rotate(-90 62 130)">功率</text>

<rect x="240" y="120" width="16" height="280" fill="var(--accent)"/>
<text class="g" x="272" y="150">瞬間峰值</text>
<text class="b" x="272" y="176">五千萬瓦</text>
<text class="b" x="272" y="200">極短</text>

<rect x="520" y="392" width="330" height="8" fill="var(--warn)"/>
<text class="g" x="520" y="366">連續功耗</text>
<text class="b" x="520" y="342">一顆燈泡以下</text>

<text class="k" x="100" y="480">難的不是大功率，是那一瞬間的控制</text>
</svg>
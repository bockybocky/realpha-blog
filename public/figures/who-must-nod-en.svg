<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The node holding the decision links to two nodes that must both nod, and the line between those two is broken and crossed out.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">The jam is on the second line</text>
<rect x="90" y="236" width="220" height="86" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="130" y="288" font-size="20" fill="var(--ink)">Who holds the decision</text>
<path d="M310 258 L560 170" fill="none" stroke="var(--grey)" stroke-width="5"/>
<path d="M310 300 L560 388" fill="none" stroke="var(--grey)" stroke-width="5"/>
<rect x="560" y="128" width="220" height="86" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="610" y="180" font-size="20" fill="var(--ink)">He must nod</text>
<rect x="560" y="346" width="220" height="86" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="610" y="398" font-size="20" fill="var(--ink)">She must nod too</text>
<line x1="670" y1="214" x2="670" y2="346" stroke="var(--dim)" stroke-width="3" stroke-dasharray="9 7"/>
<line x1="640" y1="250" x2="700" y2="310" stroke="var(--warn)" stroke-width="6"/>
<line x1="700" y1="250" x2="640" y2="310" stroke="var(--warn)" stroke-width="6"/>
<text x="712" y="288" font-size="16" fill="var(--warn)">No dealings</text>
<text x="90" y="470" font-size="22" fill="var(--ink)">Watch the broken line, not the numbers</text>
</svg>
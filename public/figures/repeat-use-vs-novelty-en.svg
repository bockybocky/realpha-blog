<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A densely dotted upper timeline compared with a lower one holding a single lone dot">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:600}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t h" x="480" y="58" text-anchor="middle">When will it be used again</text>
<text class="t g" x="70" y="152">Audio, video while charging</text>
<line x1="70" y1="196" x2="900" y2="196" stroke="var(--line)" stroke-width="3"/>
<g fill="var(--accent)">
<circle cx="104" cy="196" r="10"/><circle cx="168" cy="196" r="10"/><circle cx="232" cy="196" r="10"/><circle cx="296" cy="196" r="10"/><circle cx="360" cy="196" r="10"/><circle cx="424" cy="196" r="10"/><circle cx="488" cy="196" r="10"/><circle cx="552" cy="196" r="10"/><circle cx="616" cy="196" r="10"/><circle cx="680" cy="196" r="10"/><circle cx="744" cy="196" r="10"/><circle cx="808" cy="196" r="10"/><circle cx="866" cy="196" r="10"/>
</g>
<text class="t s" x="900" y="234" text-anchor="end">Keeps coming back</text>
<text class="t g" x="70" y="322">Digital pet on the nose</text>
<line x1="70" y1="366" x2="900" y2="366" stroke="var(--line)" stroke-width="3"/>
<circle cx="104" cy="366" r="10" fill="var(--warn)"/>
<text class="t s" x="900" y="404" text-anchor="end">Never again after that</text>
<text class="t s" x="70" y="440">Time</text>
<text class="t c" x="480" y="478" text-anchor="middle">It counts as a plus only if it recurs</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三組晶片散熱堆疊由左到右冷板從一片、上下兩片到三片，下方瓦數長條逐組升高">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .plate { fill:var(--card); stroke:var(--dim); stroke-width:2; }
</style>
<text x="60" y="64" class="t">瓦數越高，冷板越多</text>
<rect x="100" y="226" width="180" height="24" rx="4" class="plate"/>
<rect x="120" y="256" width="140" height="26" rx="3" fill="var(--accent)"/>
<text x="190" y="275" text-anchor="middle" style="font-size:15px;fill:var(--page)">晶片</text>
<text x="292" y="244" class="b">冷板</text>
<rect x="390" y="226" width="180" height="24" rx="4" class="plate"/>
<rect x="410" y="256" width="140" height="26" rx="3" fill="var(--accent)"/>
<rect x="390" y="288" width="180" height="24" rx="4" class="plate"/>
<rect x="680" y="196" width="180" height="24" rx="4" class="plate"/>
<rect x="680" y="226" width="180" height="24" rx="4" class="plate"/>
<rect x="700" y="256" width="140" height="26" rx="3" fill="var(--accent)"/>
<rect x="680" y="288" width="180" height="24" rx="4" class="plate"/>
<text x="190" y="356" text-anchor="middle" class="g">一片</text>
<text x="480" y="356" text-anchor="middle" class="g">上下兩片</text>
<text x="770" y="356" text-anchor="middle" class="g">三片</text>
<rect x="160" y="450" width="60" height="30" fill="var(--grey)"/>
<rect x="450" y="420" width="60" height="60" fill="var(--grey)"/>
<rect x="740" y="390" width="60" height="90" fill="var(--grey)"/>
<line x1="80" y1="480" x2="880" y2="480" stroke="var(--line)" stroke-width="2"/>
<text x="880" y="466" text-anchor="end" class="b">瓦數 ↑</text>
<text x="480" y="530" text-anchor="middle" class="c">規格還沒定案</text>
</svg>
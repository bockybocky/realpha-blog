<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="合約那本帳的時間條長達數年，部位那本帳的時間條短到只有幾週，長度差距很大">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">兩本帳的計時單位不一樣</text>
<text class="t" x="60" y="152" font-size="20" fill="var(--ink)">合約那本帳</text>
<rect x="60" y="176" width="800" height="54" rx="8" fill="var(--accent)"/>
<text class="t" x="84" y="212" font-size="16" fill="var(--page)">四到五年</text>
<text class="t" x="620" y="212" font-size="16" fill="var(--page)">2027 上半年才交付</text>
<text class="t" x="60" y="312" font-size="20" fill="var(--ink)">部位那本帳</text>
<rect x="60" y="336" width="96" height="54" rx="8" fill="var(--warn)"/>
<text class="t" x="176" y="372" font-size="16" fill="var(--dim)">幾週，月底結帳</text>
<line x1="156" y1="330" x2="156" y2="400" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="60" y="468" font-size="22" fill="var(--ink)">去槓桿那幾週，兩條差距拉到最遠</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一個方塊往右分岔成兩條路，一條走平再上揚，一條一路下沉">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .h1{font-size:27px;font-weight:700;fill:var(--ink);}
    .cap{font-size:19px;font-weight:700;fill:var(--dim);}
    .capA{font-size:20px;font-weight:700;fill:var(--accent);}
    .capW{font-size:20px;font-weight:700;fill:var(--warn);}
    .unit{font-size:16px;fill:var(--dim);}
    .kick{font-size:22px;font-weight:700;fill:var(--ink);}
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <g class="t">
    <text x="480" y="48" class="h1" text-anchor="middle">同一組數字，兩個命名</text>
    <rect x="60" y="230" width="240" height="110" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="180" y="278" class="cap" text-anchor="middle">同一組數字</text>
    <text x="180" y="312" class="unit" text-anchor="middle">腰斬、市值、新高</text>
    <polyline points="300,285 520,282 700,220 880,186" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="880" cy="186" r="8" fill="var(--accent)"/>
    <text x="700" y="160" class="capA" text-anchor="middle">放掉一些氣</text>
    <text x="700" y="190" class="unit" text-anchor="middle">換手</text>
    <text x="880" y="150" class="unit" text-anchor="end">去數錢流到哪裡</text>
    <polyline points="300,295 540,370 720,440 880,480" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="880" cy="480" r="8" fill="var(--warn)"/>
    <text x="640" y="392" class="capW">泡沫破了</text>
    <text x="640" y="420" class="unit">一路到底</text>
    <text x="880" y="512" class="unit" text-anchor="end">該減的是整個方向</text>
    <text x="480" y="548" class="kick" text-anchor="middle">命名決定下一步</text>
  </g>
</svg>
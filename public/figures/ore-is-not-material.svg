<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="一個左寬右窄的漏斗，寬端是豐富的銅礦、窄端是只有三座的冶煉環節；下方長條顯示美國三座對中國四十二座">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
  <text x="48" y="54" font-size="27" fill="var(--ink)">有礦，不等於有料</text>

  <polygon points="60,100 420,218 420,282 60,380" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="420" y="218" width="120" height="64" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <rect x="540" y="232" width="300" height="36" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text x="96" y="232" font-size="20" fill="var(--ink)">地底下的銅</text>
  <text x="96" y="262" font-size="16" fill="var(--dim)">資源豐富</text>
  <text x="480" y="204" font-size="19" fill="var(--accent)" text-anchor="middle">冶煉・精煉</text>
  <text x="480" y="330" font-size="16" fill="var(--dim)" text-anchor="middle">全國 3 座</text>
  <text x="690" y="258" font-size="19" fill="var(--ink)" text-anchor="middle">可用金屬</text>

  <line x1="48" y1="412" x2="912" y2="412" stroke="var(--line)" stroke-width="2"/>

  <text x="48" y="446" font-size="17" fill="var(--ink)">美國</text>
  <rect x="48" y="456" width="36" height="20" fill="var(--accent)"/>
  <text x="98" y="473" font-size="16" fill="var(--dim)">銅冶煉廠 3 座</text>

  <text x="48" y="506" font-size="17" fill="var(--ink)">中國　近十年</text>
  <rect x="48" y="516" width="504" height="20" fill="var(--grey)"/>
  <text x="566" y="533" font-size="16" fill="var(--dim)">42 座</text>

  <text x="48" y="570" font-size="16" fill="var(--dim)">鋁冶煉廠：46 年沒有新的</text>
  <text x="48" y="606" font-size="22" fill="var(--ink)">卡住的不是地下，是中間那一段</text>
</svg>
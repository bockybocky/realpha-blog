<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="金字塔的上下兩層是實心的、被討論的，中間一層用虛線空心表示沒有名字">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .ga { font-size:19px; font-weight:600; fill:var(--accent); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70">財富分布裡被跳過的那一層</text>

  <polygon points="380,140 446,230 314,230" fill="var(--grey)" stroke="var(--line)"/>
  <polygon points="314,230 446,230 542,360 218,360" fill="var(--card)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8 6"/>
  <polygon points="218,360 542,360 630,480 130,480" fill="var(--grey)" stroke="var(--line)"/>

  <line x1="430" y1="192" x2="660" y2="192" stroke="var(--line)" stroke-width="2"/>
  <line x1="500" y1="298" x2="660" y2="298" stroke="var(--accent)" stroke-width="2"/>
  <line x1="580" y1="428" x2="660" y2="428" stroke="var(--line)" stroke-width="2"/>

  <text class="g" x="672" y="186">名單上的那幾個</text>
  <text class="s" x="672" y="212">科技富豪</text>
  <text class="ga" x="672" y="292">沒有名字的一層</text>
  <text class="s" x="672" y="318">汽車經銷 · 啤酒經銷 · 牙醫</text>
  <text class="g" x="672" y="422">財務吃緊的多數</text>
  <text class="s" x="672" y="448">討論的另一端</text>

  <text class="c" x="60" y="528">討論停在兩端，錢在中間</text>
</svg>
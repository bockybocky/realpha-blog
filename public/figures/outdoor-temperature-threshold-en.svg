<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A horizontal forty-three degree threshold: left of it most climates sit below the line and heat moves downhill, while right of it extreme-heat days rise above the line and heat must be pushed uphill.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">One loop, two climates, two outcomes</text>

<line x1="120" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="230" x2="900" y2="230" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 7"/>
<text class="n" x="900" y="214" text-anchor="end">43°C outdoor threshold</text>

<rect x="200" y="200" width="120" height="240" fill="var(--accent)" rx="4"/>
<text class="g" x="260" y="186" text-anchor="middle">45°C supply</text>
<text class="n" x="260" y="480" text-anchor="middle">Water off the chip side</text>

<rect x="440" y="340" width="120" height="100" fill="var(--grey)" rx="4"/>
<text class="g" x="500" y="326" text-anchor="middle">Most climates</text>
<text class="n" x="500" y="480" text-anchor="middle">Heat goes downhill</text>
<path d="M500 250 l0 60 m-14 -16 l14 16 l14 -16" fill="none" stroke="var(--accent)" stroke-width="4"/>

<rect x="700" y="180" width="120" height="260" fill="var(--warn)" rx="4"/>
<text class="g" x="760" y="166" text-anchor="middle">Extreme heat</text>
<text class="n" x="760" y="480" text-anchor="middle">Heat must go uphill</text>
<path d="M760 140 l0 -50 m-14 16 l14 -16 l14 16" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="n" x="760" y="124" text-anchor="middle">Run a chiller</text>

<text class="c" x="60" y="518">Low water use is a gift of climate, not a spec sheet line</text>
</svg>
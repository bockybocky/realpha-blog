<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩根堆疊柱：下面兩段實質利率與通膨預期高度相同，最上層期限溢價從矮變高，整根柱因此變高">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); font-weight:700; }
    .gl { font-size:19px; fill:var(--ink); font-weight:700; }
    .bd { font-size:16px; fill:var(--dim); }
    .bs { font-size:15px; fill:var(--dim); }
    .cc { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="ti" x="48" y="58">名目殖利率拆三塊，只有一塊在動</text>
<line x1="120" y1="470" x2="820" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="200" y="350" width="140" height="120" fill="var(--grey)"/>
<rect x="200" y="270" width="140" height="80" fill="var(--grey)"/>
<rect x="200" y="220" width="140" height="50" fill="var(--accent)"/>
<rect x="560" y="350" width="140" height="120" fill="var(--grey)"/>
<rect x="560" y="270" width="140" height="80" fill="var(--grey)"/>
<rect x="560" y="130" width="140" height="140" fill="var(--accent)"/>
<text class="gl" x="270" y="502" text-anchor="middle">七月</text>
<text class="gl" x="630" y="502" text-anchor="middle">現在</text>
<text class="bs" x="450" y="416" text-anchor="middle">不動</text>
<text class="bs" x="450" y="316" text-anchor="middle">不動</text>
<line x1="700" y1="200" x2="716" y2="200" stroke="var(--accent)" stroke-width="2"/>
<line x1="700" y1="310" x2="716" y2="310" stroke="var(--line)" stroke-width="2"/>
<line x1="700" y1="410" x2="716" y2="410" stroke="var(--line)" stroke-width="2"/>
<text class="gl" x="726" y="206">期限溢價</text>
<text class="bd" x="726" y="316">通膨預期</text>
<text class="bd" x="726" y="416">實質利率</text>
<text class="cc" x="48" y="548">動的不是經濟與通膨，是「找不到買家」的補償</text>
</svg>
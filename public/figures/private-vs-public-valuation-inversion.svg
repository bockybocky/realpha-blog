<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="使用者數與估值的兩點呈倒置，使用者少的在左上，使用者多的在右下">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">倒過來的那一側</text>

<path d="M170 420 L880 420" stroke="var(--line)" stroke-width="2"/>
<path d="M170 420 L170 110" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="170" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">10 萬</text>
<text class="t" x="820" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">近 10 億</text>
<text class="t" x="525" y="492" font-size="17" font-weight="600" fill="var(--dim)" text-anchor="middle">使用者</text>
<text class="t" x="96" y="265" font-size="17" font-weight="600" fill="var(--dim)" text-anchor="middle">估值</text>

<circle cx="250" cy="160" r="14" fill="var(--warn)"/>
<text class="t" x="280" y="152" font-size="20" font-weight="700" fill="var(--ink)">私募階段</text>
<text class="t" x="280" y="180" font-size="17" fill="var(--warn)">100 億美元</text>

<circle cx="800" cy="300" r="14" fill="var(--accent)"/>
<text class="t" x="640" y="340" font-size="20" font-weight="700" fill="var(--ink)">上市平台</text>
<text class="t" x="640" y="368" font-size="17" fill="var(--accent)">市值更低</text>

<path d="M268 172 L784 290" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text class="t" x="60" y="524" font-size="16" fill="var(--dim)">他的判斷：這一邊才是泡沫，不是供應鏈那一邊</text>
</svg>
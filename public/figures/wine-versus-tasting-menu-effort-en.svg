<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A tenfold difference in labour, with two gross-margin bars of the same height underneath.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">One table, two cost structures</text>
<text x="60" y="90" font-size="15" fill="var(--dim)">North Pond, Saturday night</text>

<rect x="60" y="116" width="400" height="236" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="84" y="150" font-size="20" font-weight="700" fill="var(--ink)">Five courses, $130</text>
<g fill="var(--grey)">
<circle cx="104" cy="196" r="13"/><circle cx="160" cy="196" r="13"/><circle cx="216" cy="196" r="13"/><circle cx="272" cy="196" r="13"/><circle cx="328" cy="196" r="13"/>
<circle cx="104" cy="248" r="13"/><circle cx="160" cy="248" r="13"/><circle cx="216" cy="248" r="13"/><circle cx="272" cy="248" r="13"/><circle cx="328" cy="248" r="13"/>
</g>
<text x="84" y="306" font-size="16" fill="var(--dim)">Kitchen and pastry: 9–10 people</text>
<text x="84" y="330" font-size="16" fill="var(--dim)">All night</text>

<rect x="500" y="116" width="400" height="236" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="524" y="150" font-size="20" font-weight="700" fill="var(--ink)">One bottle, $110</text>
<circle cx="544" cy="196" r="13" fill="var(--accent)"/>
<text x="524" y="306" font-size="16" fill="var(--dim)">1 server</text>
<text x="524" y="330" font-size="16" fill="var(--dim)">Two minutes</text>

<rect x="60" y="400" width="400" height="56" rx="6" fill="var(--grey)"/>
<rect x="500" y="400" width="400" height="56" rx="6" fill="var(--accent)"/>
<text x="260" y="436" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">Gross margin</text>
<text x="700" y="436" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">Gross margin</text>
<text x="480" y="484" font-size="16" fill="var(--dim)" text-anchor="middle">Same height on both</text>

<text x="60" y="540" font-size="22" font-weight="700" fill="var(--ink)">Same margin, and one side costs almost nothing</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="高窄矩形與矮寬矩形對比，矮寬那個面積反而更大">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">省下來的時間，去了哪裡</text>
<text x="60" y="112" font-size="19" fill="var(--dim)">面積＝總工時</text>

<line x1="100" y1="140" x2="100" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="106" y="158" font-size="15" fill="var(--dim)">每件耗時</text>
<text x="898" y="500" font-size="15" fill="var(--dim)" text-anchor="end">件數</text>

<rect x="120" y="270" width="90" height="200" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="165" y="255" font-size="15" fill="var(--dim)" text-anchor="middle">2 小時 × 3 件</text>
<text x="165" y="378" font-size="16" fill="var(--ink)" text-anchor="middle">6 小時</text>

<rect x="300" y="420" width="480" height="50" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<text x="540" y="405" font-size="15" fill="var(--dim)" text-anchor="middle">0.5 小時 × 16 件</text>
<text x="540" y="452" font-size="16" fill="var(--ink)" text-anchor="middle">8 小時</text>

<text x="480" y="528" font-size="22" fill="var(--ink)" text-anchor="middle">單位成本降了，總量變更大</text>
</svg>
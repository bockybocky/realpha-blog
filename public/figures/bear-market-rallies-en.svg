<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A jagged line trending down to the right, with three clear bounces peaking progressively lower and the lowest point at the far right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">The fiercest bear rally is not the bottom</text>

  <rect x="60" y="110" width="840" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <polyline points="100,160 230,320 300,250 430,384 500,300 620,430 690,352 860,452"
            fill="none" stroke="var(--accent)" stroke-width="5"/>

  <circle cx="300" cy="250" r="9" fill="var(--page)" stroke="var(--warn)" stroke-width="5"/>
  <circle cx="500" cy="300" r="9" fill="var(--page)" stroke="var(--warn)" stroke-width="5"/>
  <circle cx="690" cy="352" r="9" fill="var(--page)" stroke="var(--warn)" stroke-width="5"/>
  <text x="300" y="228" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="middle">+15–20%</text>
  <text x="500" y="278" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="middle">+15–20%</text>
  <text x="690" y="330" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="middle">+15–20%</text>

  <circle cx="860" cy="452" r="9" fill="var(--accent)"/>
  <text x="860" y="486" font-size="16" fill="var(--ink)" text-anchor="end">The final low</text>
  <text x="60" y="516" font-size="22" font-weight="700" fill="var(--ink)">Each one flips sentiment once more</text>
</svg>
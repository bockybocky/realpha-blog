<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A stack of bars on the left all shrink to about half their length, while two long lines on the right do not shorten at all.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="72" font-size="27" fill="var(--ink)">What changed in a day was conviction, not orders</text>
<text x="60" y="130" font-size="20" fill="var(--ink)">What got changed</text>
<rect x="60" y="150" width="340" height="24" fill="var(--grey)" opacity="0.35"/>
<rect x="60" y="150" width="136" height="24" fill="var(--warn)"/>
<text x="412" y="169" font-size="16" fill="var(--dim)">500 → 200</text>
<rect x="60" y="192" width="272" height="24" fill="var(--grey)" opacity="0.35"/>
<rect x="60" y="192" width="136" height="24" fill="var(--warn)"/>
<text x="412" y="211" font-size="16" fill="var(--dim)">400 → 200</text>
<rect x="60" y="234" width="214" height="24" fill="var(--grey)" opacity="0.35"/>
<rect x="60" y="234" width="126" height="24" fill="var(--warn)"/>
<text x="412" y="253" font-size="16" fill="var(--dim)">315 → 185</text>
<rect x="60" y="276" width="300" height="24" fill="var(--grey)" opacity="0.35"/>
<line x1="66" y1="300" x2="356" y2="276" stroke="var(--warn)" stroke-width="3"/>
<text x="412" y="295" font-size="16" fill="var(--dim)">Target withdrawn</text>
<rect x="60" y="318" width="240" height="24" fill="var(--grey)" opacity="0.35"/>
<rect x="60" y="318" width="120" height="24" fill="var(--warn)"/>
<text x="412" y="337" font-size="16" fill="var(--dim)">Cut to neutral</text>
<line x1="560" y1="140" x2="560" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="600" y="130" font-size="20" fill="var(--ink)">What didn't change</text>
<rect x="600" y="150" width="300" height="24" fill="var(--accent)"/>
<text x="600" y="198" font-size="16" fill="var(--dim)">EPS growth 95% this year</text>
<rect x="600" y="220" width="300" height="24" fill="var(--accent)"/>
<text x="600" y="268" font-size="16" fill="var(--dim)">70% next year</text>
<rect x="600" y="290" width="300" height="24" fill="var(--accent)"/>
<text x="600" y="338" font-size="16" fill="var(--dim)">The order book on hand</text>
<text x="60" y="400" font-size="16" fill="var(--dim)">Light bars are the old numbers</text>
<text x="60" y="490" font-size="22" fill="var(--ink)">This measures sell-side conviction</text>
<text x="60" y="524" font-size="16" fill="var(--dim)">Forward P/E sits near 10x</text>
</svg>
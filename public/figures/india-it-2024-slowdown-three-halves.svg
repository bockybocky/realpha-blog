<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三組成對的柱子，每組右邊那根都明顯比左邊矮，最後一組落差最大">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">一年之間，三根都掉下來</text>
<line x1="90" y1="450" x2="870" y2="450" stroke="var(--line)" stroke-width="2"/>
<rect x="130" y="270" width="80" height="180" fill="var(--accent)"/>
<rect x="230" y="369" width="80" height="81" fill="var(--warn)"/>
<text x="170" y="252" text-anchor="middle" font-size="16" fill="var(--ink)">8.4%</text>
<text x="270" y="351" text-anchor="middle" font-size="16" fill="var(--ink)">3.8%</text>
<text x="220" y="490" text-anchor="middle" font-size="19" fill="var(--ink)">成長率</text>
<rect x="400" y="260" width="80" height="190" fill="var(--accent)"/>
<rect x="500" y="360" width="80" height="90" fill="var(--warn)"/>
<text x="440" y="242" text-anchor="middle" font-size="16" fill="var(--ink)">190 億</text>
<text x="540" y="342" text-anchor="middle" font-size="16" fill="var(--ink)">90 億</text>
<text x="490" y="490" text-anchor="middle" font-size="19" fill="var(--ink)">增量營收</text>
<rect x="670" y="250" width="80" height="200" fill="var(--accent)"/>
<rect x="770" y="410" width="80" height="40" fill="var(--warn)"/>
<text x="710" y="232" text-anchor="middle" font-size="16" fill="var(--ink)">30 萬</text>
<text x="810" y="392" text-anchor="middle" font-size="16" fill="var(--ink)">6 萬</text>
<text x="760" y="490" text-anchor="middle" font-size="19" fill="var(--ink)">新增職位</text>
<text x="480" y="530" text-anchor="middle" font-size="22" fill="var(--ink)">左 2023 · 右 2024</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Seven evenly spaced grey squares for a daily plan on the left, and five uneven blocks ending in a gate and an exam-day flag on the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">Two rhythms</text>

  <rect x="60" y="112" width="400" height="290" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="88" y="156" font-size="20" font-weight="700" fill="var(--dim)">Daily schedule</text>
  <line x1="88" y1="268" x2="432" y2="268" stroke="var(--line)" stroke-width="3"/>
  <rect x="92" y="228" width="34" height="40" fill="var(--grey)" opacity="0.45"/>
  <rect x="141" y="228" width="34" height="40" fill="var(--grey)" opacity="0.45"/>
  <rect x="190" y="228" width="34" height="40" fill="var(--grey)" opacity="0.45"/>
  <rect x="239" y="228" width="34" height="40" fill="var(--grey)" opacity="0.45"/>
  <rect x="288" y="228" width="34" height="40" fill="var(--grey)" opacity="0.45"/>
  <rect x="337" y="228" width="34" height="40" fill="var(--grey)" opacity="0.45"/>
  <rect x="386" y="228" width="34" height="40" fill="var(--grey)" opacity="0.45"/>
  <text x="88" y="330" font-size="16" fill="var(--dim)">One box a day</text>
  <text x="88" y="362" font-size="16" fill="var(--dim)">Completion 0</text>

  <rect x="500" y="112" width="400" height="290" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="528" y="156" font-size="20" font-weight="700" fill="var(--accent)">Blocks tied to exam day</text>
  <line x1="528" y1="268" x2="872" y2="268" stroke="var(--line)" stroke-width="3"/>
  <rect x="530" y="212" width="52" height="56" rx="4" fill="var(--accent)"/>
  <rect x="600" y="232" width="30" height="36" rx="4" fill="var(--accent)"/>
  <rect x="650" y="204" width="64" height="64" rx="4" fill="var(--accent)"/>
  <rect x="732" y="236" width="36" height="32" rx="4" fill="var(--accent)"/>
  <rect x="784" y="220" width="44" height="48" rx="4" fill="var(--accent)"/>
  <line x1="846" y1="182" x2="846" y2="286" stroke="var(--warn)" stroke-width="4" stroke-dasharray="8 7"/>
  <text x="806" y="172" font-size="16" font-weight="700" fill="var(--warn)">Mock-exam gate</text>
  <line x1="872" y1="188" x2="872" y2="286" stroke="var(--ink)" stroke-width="3"/>
  <polygon points="872,188 908,202 872,216" fill="var(--ink)"/>
  <text x="528" y="330" font-size="16" fill="var(--dim)">Push one when you can</text>
  <text x="528" y="362" font-size="16" fill="var(--dim)">Book only after the gate</text>

  <text x="60" y="474" font-size="22" fill="var(--ink)">Anchor to that one day, not to every day</text>
</svg>
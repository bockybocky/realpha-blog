<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一百格灰色小橫條其中三格藍色；右邊兩條長條，全部讀一百格長，先用搜尋工具挑過只剩三格長">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
<pattern id="pr" x="60" y="130" width="32" height="22" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="26" height="12" rx="2" fill="var(--grey)"/></pattern>
</defs>
<text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">只讀需要的那幾行</text>
<rect x="60" y="130" width="320" height="220" fill="url(#pr)"/>
<rect x="252" y="152" width="26" height="12" rx="2" fill="var(--accent)"/>
<rect x="124" y="218" width="26" height="12" rx="2" fill="var(--accent)"/>
<rect x="316" y="284" width="26" height="12" rx="2" fill="var(--accent)"/>
<text x="60" y="388" font-size="16" fill="var(--dim)">一堆檔案：100 行</text>
<text x="60" y="414" font-size="16" fill="var(--accent)">要找的：3 行</text>
<text x="470" y="180" font-size="18" fill="var(--ink)">全部讀一遍</text>
<rect x="470" y="192" width="420" height="40" rx="4" fill="var(--grey)"/>
<text x="880" y="218" font-size="16" text-anchor="end" fill="var(--ink)">100</text>
<text x="470" y="282" font-size="18" fill="var(--ink)">先用搜尋工具挑</text>
<rect x="470" y="294" width="13" height="40" rx="2" fill="var(--accent)"/>
<text x="496" y="320" font-size="16" fill="var(--accent)">3</text>
<text x="470" y="378" font-size="15" fill="var(--dim)">長條＝AI 要讀、要付的 token</text>
<text x="60" y="480" font-size="22" font-weight="700" fill="var(--ink)">讀得少，花得少</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four safe-haven bars differ in height: Europe, Japan, and China are low, the United States is highest, and capital flows toward the highest bar.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">Money parks by comparison</text>
<text class="b" x="60" y="92">Bar height = capacity</text>
<line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="340" width="110" height="90" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="110" y="462">Europe</text>
<text class="b" x="110" y="488">War</text>
<text class="b" x="110" y="510">Weak growth</text>
<text class="b" x="110" y="532">No fiscal union</text>
<rect x="290" y="310" width="110" height="120" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="290" y="462">Japan</text>
<text class="b" x="290" y="488">Old woes</text>
<text class="b" x="290" y="510">Too few havens</text>
<rect x="470" y="360" width="110" height="70" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="470" y="462">China</text>
<text class="b" x="470" y="488">Half-open market</text>
<text class="b" x="470" y="510">Trade war</text>
<rect x="680" y="170" width="140" height="260" fill="var(--accent)" opacity="0.18"/>
<rect x="680" y="170" width="140" height="260" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="680" y="462">USD</text>
<text class="b" x="680" y="488">Earn USD</text>
<text class="b" x="680" y="510">Owe USD</text>
<text class="b" x="680" y="532">Most sway</text>
<path d="M240 300 L660 230" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#a1)"/>
<path d="M410 290 L660 255" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#a1)"/>
<path d="M590 345 L660 300" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#a1)"/>
<defs><marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>
<text class="c" x="60" y="140">Not a calculation</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A four-quadrant chart: low gear sits in the cell that produces nothing but restores, high gear sits in the cell that produces but depletes, and middle gear lands in the bottom-left corner that neither produces nor restores, flagged as the worst cell.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="52" font-size="27" fill="var(--ink)">Where the three gears land</text>

<rect x="180" y="120" width="680" height="340" fill="var(--card)" stroke="var(--line)"/>
<line x1="520" y1="120" x2="520" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="180" y1="290" x2="860" y2="290" stroke="var(--line)" stroke-width="2"/>

<text x="350" y="188" font-size="20" fill="var(--ink)" text-anchor="middle">Low gear</text>
<text x="350" y="218" font-size="15" fill="var(--dim)" text-anchor="middle">Talking · Idling · Light reading</text>
<text x="350" y="245" font-size="15" fill="var(--dim)" text-anchor="middle">Recharging</text>

<text x="690" y="205" font-size="16" fill="var(--grey)" text-anchor="middle">No gear here</text>

<rect x="182" y="292" width="336" height="166" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text x="350" y="352" font-size="20" fill="var(--warn)" text-anchor="middle">Middle gear</text>
<text x="350" y="382" font-size="15" fill="var(--dim)" text-anchor="middle">Meetings · Email · Window switching</text>
<text x="350" y="409" font-size="15" fill="var(--warn)" text-anchor="middle">Neither side</text>

<text x="690" y="352" font-size="20" fill="var(--accent)" text-anchor="middle">High gear</text>
<text x="690" y="382" font-size="15" fill="var(--dim)" text-anchor="middle">Writing · Research · Learning</text>
<text x="690" y="409" font-size="15" fill="var(--dim)" text-anchor="middle">Hard, and it produces</text>

<text x="165" y="210" font-size="16" fill="var(--dim)" text-anchor="end">Recovering</text>
<text x="165" y="380" font-size="16" fill="var(--dim)" text-anchor="end">Depleting</text>
<text x="350" y="492" font-size="16" fill="var(--dim)" text-anchor="middle">Nothing left behind</text>
<text x="690" y="492" font-size="16" fill="var(--dim)" text-anchor="middle">Something left behind</text>

<text x="480" y="552" font-size="22" fill="var(--ink)" text-anchor="middle">Most people sit in the bottom left all day</text>
</svg>
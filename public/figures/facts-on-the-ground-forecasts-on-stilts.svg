<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊的石頭直接壓在地面上，右邊的平台架在四根細柱上懸在高處">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">同一個人講的，站在不同的地面上</text>
<line x1="40" y1="420" x2="920" y2="420" stroke="var(--ink)" stroke-width="5"/>
<text class="g" x="60" y="116">機制</text>
<rect x="60" y="356" width="110" height="64" fill="var(--accent)"/>
<rect x="180" y="340" width="110" height="80" fill="var(--accent)"/>
<rect x="300" y="368" width="110" height="52" fill="var(--accent)"/>
<text class="s" x="60" y="330">簽署日期</text>
<text class="s" x="180" y="314">提領規則</text>
<text class="s" x="300" y="342">四年授權</text>
<text class="s" x="60" y="452">可以查</text>
<text class="g" x="560" y="116">預測</text>
<rect x="540" y="176" width="380" height="54" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="s" x="556" y="212">十到十五年後的那些數字</text>
<rect x="566" y="230" width="6" height="190" fill="var(--warn)"/>
<rect x="676" y="230" width="6" height="190" fill="var(--warn)"/>
<rect x="786" y="230" width="6" height="190" fill="var(--warn)"/>
<rect x="896" y="230" width="6" height="190" fill="var(--warn)"/>
<text class="s" x="540" y="452">慈善匯錢</text>
<text class="s" x="650" y="452">國會授權</text>
<text class="s" x="760" y="452">指數上行</text>
<text class="s" x="866" y="452">認領率</text>
<text class="c" x="60" y="534">把前面的可查性借給後面，是我最常犯的錯</text>
</svg>
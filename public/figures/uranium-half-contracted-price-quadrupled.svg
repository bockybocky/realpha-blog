<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊柱子變矮、右邊柱子變高，兩邊方向相反">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">買得比平常少，價格漲了四倍</text>

<line x1="80" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>

<rect x="140" y="270" width="88" height="160" fill="var(--grey)"/>
<rect x="268" y="326" width="88" height="104" fill="var(--accent)"/>
<text x="184" y="258" font-size="16" fill="var(--dim)" text-anchor="middle">正常年份</text>
<text x="312" y="314" font-size="16" font-weight="700" fill="var(--accent)" text-anchor="middle">現在</text>
<text x="184" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">八成靠長約</text>
<text x="312" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">只簽一半</text>
<text x="248" y="500" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">簽約率</text>

<rect x="604" y="380" width="88" height="50" fill="var(--grey)"/>
<rect x="732" y="230" width="88" height="200" fill="var(--accent)"/>
<text x="648" y="368" font-size="16" fill="var(--dim)" text-anchor="middle">起點</text>
<text x="776" y="218" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">四倍</text>
<text x="712" y="500" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">長約價</text>

<text x="480" y="300" font-size="19" fill="var(--warn)" text-anchor="middle">課本說</text>
<text x="480" y="330" font-size="19" fill="var(--warn)" text-anchor="middle">需求少就該跌</text>
<line x1="400" y1="352" x2="560" y2="352" stroke="var(--warn)" stroke-width="3"/>
<text x="480" y="382" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">沒有</text>

<text x="60" y="532" font-size="22" font-weight="700" fill="var(--ink)">市場已經在告訴你，不必相信任何人</text>
</svg>
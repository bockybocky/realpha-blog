<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一個圓分成兩半，左半是實心的看得見，右半是虛線空心的看不見">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .gp { font-size:19px; font-weight:600; fill:var(--page); }
    .sp { font-size:15px; fill:var(--page); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70">美國的企業利潤，一半在鏡子外</text>

  <path d="M330 150 A150 150 0 0 0 330 450 Z" fill="var(--accent)"/>
  <path d="M330 150 A150 150 0 0 1 330 450 Z" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>

  <text class="gp" x="262" y="292" text-anchor="middle">看得見</text>
  <text class="sp" x="262" y="318" text-anchor="middle">上市公司</text>
  <text class="g" x="398" y="292" text-anchor="middle">看不見</text>
  <text class="s" x="398" y="318" text-anchor="middle">直通實體</text>

  <line x1="486" y1="300" x2="560" y2="300" stroke="var(--grey)" stroke-width="2"/>
  <text class="g" x="576" y="264">不發財報</text>
  <text class="g" x="576" y="300">不開法說會</text>
  <text class="g" x="576" y="336">不在篩選器上</text>

  <text class="c" x="60" y="486">用一半的樣本推整體，會很有信心地錯</text>
</svg>
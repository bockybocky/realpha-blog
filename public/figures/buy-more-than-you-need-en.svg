<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="All eight solid squares in the top row are bought, all eight dashed squares below are empty">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600;fill:var(--dim)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">Buys far more than it uses</text>
<text class="g" x="60" y="168">Bought at once</text>
<rect x="300" y="128" width="60" height="60" rx="8" fill="var(--accent)"/>
<rect x="372" y="128" width="60" height="60" rx="8" fill="var(--accent)"/>
<rect x="444" y="128" width="60" height="60" rx="8" fill="var(--accent)"/>
<rect x="516" y="128" width="60" height="60" rx="8" fill="var(--accent)" opacity="0.55"/>
<rect x="588" y="128" width="60" height="60" rx="8" fill="var(--accent)" opacity="0.55"/>
<rect x="660" y="128" width="60" height="60" rx="8" fill="var(--accent)" opacity="0.55"/>
<rect x="732" y="128" width="60" height="60" rx="8" fill="var(--accent)" opacity="0.55"/>
<rect x="804" y="128" width="60" height="60" rx="8" fill="var(--accent)" opacity="0.55"/>
<line x1="300" y1="206" x2="504" y2="206" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="402" y="232" text-anchor="middle">For itself</text>
<line x1="516" y1="206" x2="864" y2="206" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="690" y="232" text-anchor="middle">Locked up</text>
<text class="g" x="60" y="352">For others</text>
<rect x="300" y="312" width="60" height="60" rx="8" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="372" y="312" width="60" height="60" rx="8" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="444" y="312" width="60" height="60" rx="8" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="516" y="312" width="60" height="60" rx="8" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="588" y="312" width="60" height="60" rx="8" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="660" y="312" width="60" height="60" rx="8" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="732" y="312" width="60" height="60" rx="8" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="804" y="312" width="60" height="60" rx="8" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="582" y="410" text-anchor="middle" fill="var(--grey)">Empty</text>
<text class="c" x="60" y="482">No capacity, no shipments</text>
</svg>
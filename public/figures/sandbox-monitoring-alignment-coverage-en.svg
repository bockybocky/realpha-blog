<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The horizontal axis is model capability growing stronger toward the right, where the sandbox coverage band breaks off partway, the monitoring band reaches further but also ends, and alignment is the bottom layer running the whole way across.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:700; fill:var(--ink); }
    .body { font-size:15px; fill:var(--dim); }
    .concl { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t title" x="60" y="56">How far the cage holds is decided by trust</text>
  <line x1="140" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <polygon points="900,440 884,433 884,447" fill="var(--grey)"/>
  <text class="t body" x="700" y="470">Models keep getting stronger</text>
  <rect x="140" y="380" width="760" height="46" fill="var(--accent)" opacity="0.85"/>
  <text class="t grp" x="60" y="410">Alignment</text>
  <rect x="140" y="300" width="520" height="46" fill="var(--accent)" opacity="0.5"/>
  <text class="t grp" x="60" y="330">Monitoring</text>
  <line x1="660" y1="290" x2="660" y2="356" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="140" y="220" width="300" height="46" fill="var(--accent)" opacity="0.25"/>
  <text class="t grp" x="60" y="250">Sandbox</text>
  <line x1="440" y1="210" x2="440" y2="276" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="t body" x="452" y="200">Holds to here</text>
  <text class="t concl" x="140" y="150">Loosen the bottom layer and the two above fall with it</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="一條先高峰後衰減至近乎平直的聲量曲線，結果落在最安靜那一段，下方是一張列著條款的文件框">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--dim)}
.b{font-size:16px;fill:var(--ink)}
.s{font-size:15px;fill:var(--dim)}
.sa{font-size:15px;fill:var(--accent)}
.sw{font-size:15px;fill:var(--warn)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="h" x="60" y="58">喊得最大聲的時候，什麼都還沒定</text>
<rect x="60" y="90" width="840" height="212" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="126">頭條聲量</text>
<line x1="90" y1="286" x2="880" y2="286" stroke="var(--line)" stroke-width="1.5"/>
<path d="M100,282 L160,190 L220,134 L300,156 L380,204 L470,246 L560,270 L650,280 L760,283 L870,283" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="sw" x="176" y="120">歐洲輪流表態</text>
<line x1="700" y1="120" x2="700" y2="330" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="sa" x="614" y="330">安靜之後，簽了</text>
<rect x="540" y="352" width="360" height="200" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="566" y="386">文件裡的條款</text>
<text class="b" x="566" y="422">沒有期限</text>
<text class="b" x="566" y="454">獨立也不影響</text>
<text class="b" x="566" y="486">擴建只通知</text>
<text class="b" x="566" y="518">第三方投資要同意</text>
<text class="s" x="90" y="424">當時我們在聽</text>
<text class="s" x="90" y="454">上一輪的回音</text>
<text class="c" x="60" y="576">結果寫在條款裡，不在形容詞裡</text>
</svg>
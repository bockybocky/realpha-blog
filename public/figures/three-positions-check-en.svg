<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A three-row, two-column comparison table where all three cells in the left column are filled and all three in the right column are question marks.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="60">Can all three slots be filled</text>
<text class="d" x="60" y="90">Two same-week announcements of similar headline size</text>

<text class="g" x="440" y="146" text-anchor="middle">Chevron</text>
<text class="g" x="740" y="146" text-anchor="middle">NABEP</text>

<text class="g" x="60" y="204">Who signed</text>
<rect x="290" y="172" width="300" height="58" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="b" x="440" y="208" text-anchor="middle">Itself</text>
<rect x="590" y="172" width="300" height="58" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="b" x="740" y="208" text-anchor="middle">A small firm with no public financials</text>

<text class="g" x="60" y="288">Who operates</text>
<rect x="290" y="256" width="300" height="58" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="b" x="440" y="292" text-anchor="middle">Itself</text>
<rect x="590" y="256" width="300" height="58" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="b" x="740" y="292" text-anchor="middle">Unknown</text>

<text class="g" x="60" y="372">Who pays</text>
<rect x="290" y="340" width="300" height="58" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="b" x="440" y="376" text-anchor="middle">Its own balance sheet</text>
<rect x="590" y="340" width="300" height="58" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="b" x="740" y="376" text-anchor="middle">Not named</text>

<text class="d" x="440" y="434" text-anchor="middle">All three slots filled</text>
<text class="d" x="740" y="434" text-anchor="middle">All three are question marks</text>

<text class="c" x="60" y="500">An announced number is not an invested one; miss one slot and it is just a press release.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Branching diagram: one item goes through three checks, moving to doing if any is met and to still talking if none are.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .gp { font-size:20px; font-weight:700; fill:var(--page); }
</style>
<text x="40" y="58" class="t">3 months of 'soon'</text>
<rect x="40" y="235" width="180" height="80" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="130" y="270" class="g" text-anchor="middle">Said 3mo</text>
<text x="130" y="296" class="b" text-anchor="middle">Gym, lang</text>
<line x1="220" y1="275" x2="290" y2="275" stroke="var(--grey)" stroke-width="3"/>
<rect x="290" y="130" width="260" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="308" y="150" width="20" height="20" rx="3" fill="none" stroke="var(--dim)" stroke-width="2"/>
<text x="342" y="167" class="g">Bought</text>
<rect x="290" y="245" width="260" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="308" y="265" width="20" height="20" rx="3" fill="none" stroke="var(--dim)" stroke-width="2"/>
<text x="342" y="282" class="g">Booked</text>
<rect x="290" y="360" width="260" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="308" y="380" width="20" height="20" rx="3" fill="none" stroke="var(--dim)" stroke-width="2"/>
<text x="342" y="397" class="g">Dropped</text>
<path d="M550 275 C620 275 620 170 690 170" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M550 275 C620 275 620 390 690 390" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text x="600" y="200" class="b">Any</text>
<text x="600" y="370" class="b">None</text>
<rect x="690" y="120" width="230" height="100" rx="10" fill="var(--accent)"/>
<text x="805" y="178" class="gp" text-anchor="middle">Live</text>
<rect x="690" y="340" width="230" height="100" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="805" y="398" class="g" text-anchor="middle">Talk</text>
<text x="40" y="505" class="c">One item = begun</text>
</svg>
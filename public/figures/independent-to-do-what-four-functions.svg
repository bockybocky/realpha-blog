<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條分界線左邊只放貨幣政策在獨立區，右邊監理、緊急貸放與資產負債表政策三件落在行政區需要協調與問責">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">「獨立去做什麼」：四件事落在兩區</text>

<line x1="330" y1="110" x2="330" y2="480" stroke="var(--ink)" stroke-width="4"/>

<text x="80" y="146" font-size="20" font-weight="700" fill="var(--accent)">獨立站得住</text>
<text x="80" y="172" font-size="16" fill="var(--dim)">憲法第一條｜國會委任</text>

<rect x="80" y="196" width="220" height="150" rx="10" fill="var(--accent)" opacity="0.18"/>
<rect x="80" y="196" width="220" height="150" rx="10" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="190" y="262" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">貨幣政策</text>
<text x="190" y="294" font-size="16" text-anchor="middle" fill="var(--ink)">規範貨幣價值</text>

<text x="360" y="146" font-size="20" font-weight="700" fill="var(--warn)">權力性質是行政的</text>
<text x="360" y="172" font-size="16" fill="var(--dim)">帶財政或準財政性質｜要協調與問責</text>

<rect x="360" y="196" width="170" height="150" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="445" y="262" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">監理</text>
<text x="445" y="292" font-size="16" text-anchor="middle" fill="var(--dim)">與支付</text>

<rect x="548" y="196" width="170" height="150" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="633" y="262" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">緊急貸放</text>

<rect x="736" y="196" width="170" height="150" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="821" y="254" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">資產負債表</text>
<text x="821" y="282" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">與量化寬鬆</text>

<text x="190" y="416" font-size="16" text-anchor="middle" fill="var(--dim)">時間不一致：套得上</text>
<text x="633" y="416" font-size="16" text-anchor="middle" fill="var(--dim)">時間不一致：套不上</text>

<text x="60" y="520" font-size="22" font-weight="700" fill="var(--ink)">答案在四格裡各不相同</text>
</svg>
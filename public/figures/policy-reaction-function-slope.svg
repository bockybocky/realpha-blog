<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一比一的斜線代表反應係數等於一，貼在零軸的水平線代表 2021 年被壓平的反應函數">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="40" y="58" font-size="27" font-weight="700" fill="var(--ink)">反應函數＝市場心裡那條規則的斜率</text>

<line x1="140" y1="400" x2="820" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="110" x2="140" y2="400" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="700" y="434" font-size="16" fill="var(--dim)">通膨</text>
<text class="t" x="80" y="128" font-size="16" fill="var(--dim)">政策利率</text>
<text class="t" x="300" y="434" font-size="15" fill="var(--dim)">2%</text>
<text class="t" x="560" y="434" font-size="15" fill="var(--dim)">4%</text>
<text class="t" x="96" y="320" font-size="15" fill="var(--dim)">4%</text>
<text class="t" x="96" y="220" font-size="15" fill="var(--dim)">6%</text>

<line x1="200" y1="340" x2="700" y2="160" stroke="var(--accent)" stroke-width="3"/>
<circle cx="310" cy="300" r="6" fill="var(--accent)"/>
<circle cx="570" cy="206" r="6" fill="var(--accent)"/>
<text class="t" x="612" y="150" font-size="19" font-weight="700" fill="var(--accent)">係數 ＝ 1</text>

<line x1="200" y1="392" x2="760" y2="392" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="600" y="378" font-size="19" font-weight="700" fill="var(--warn)">2021 年：平的</text>
<text class="t" x="200" y="470" font-size="16" fill="var(--ink)">通膨跑到 5%、6%，兩年期利率一動也沒動</text>

<text class="t" x="40" y="512" font-size="22" font-weight="700" fill="var(--ink)">市場不預期它會動，升息就不在價格裡</text>
</svg>
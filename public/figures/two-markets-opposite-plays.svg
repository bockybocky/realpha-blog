<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左右兩張卡片，左為快速上衝的折線，右為一階一階的階梯，中間交叉虛線表示兩個市場刻意反著做">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">同一個人，兩個市場，刻意反著做</text>
<rect x="60" y="96" width="390" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="510" y="96" width="390" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="92" y="138" font-size="20" fill="var(--dim)">股票市場</text>
<text x="92" y="168" font-size="20" fill="var(--accent)">動能</text>
<polyline points="100,350 168,336 236,308 304,256 378,196" fill="none" stroke="var(--accent)" stroke-width="3"/>
<circle cx="378" cy="196" r="7" fill="var(--accent)"/>
<line x1="100" y1="360" x2="400" y2="360" stroke="var(--line)" stroke-width="2"/>
<text x="92" y="392" font-size="16" fill="var(--dim)">不必全懂</text>
<text x="240" y="392" font-size="16" fill="var(--dim)">在浪頭上就進場</text>
<text x="542" y="138" font-size="20" fill="var(--dim)">創投</text>
<text x="542" y="168" font-size="20" fill="var(--accent)">價值</text>
<polyline points="545,352 610,352 610,312 675,312 675,272 740,272 740,226 815,226" fill="none" stroke="var(--accent)" stroke-width="3"/>
<circle cx="815" cy="226" r="7" fill="var(--accent)"/>
<line x1="545" y1="360" x2="850" y2="360" stroke="var(--line)" stroke-width="2"/>
<text x="542" y="392" font-size="16" fill="var(--dim)">認識團隊</text>
<text x="690" y="392" font-size="16" fill="var(--dim)">一起複利</text>
<line x1="456" y1="200" x2="504" y2="300" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="456" y1="300" x2="504" y2="200" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="60" y="472" font-size="22" fill="var(--ink)">動能在本業已經做得到，跨過去再做一次，等於白跨</text>
</svg>
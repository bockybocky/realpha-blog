<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="上排一道閘門，下排兩道串聯的閘門">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="480" fill="var(--page)"/>
<text class="t" x="60" y="66">同一個信念，多了一道閘</text>
<text class="g" x="80" y="140">舊規則</text>
<line x1="200" y1="170" x2="420" y2="170" stroke="var(--grey)" stroke-width="4"/>
<rect x="420" y="130" width="170" height="80" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<text class="g" x="446" y="178">夠便宜</text>
<line x1="590" y1="170" x2="800" y2="170" stroke="var(--grey)" stroke-width="4"/>
<path d="M800,170 l-16,-7 l0,14 z" fill="var(--grey)"/>
<text class="g" x="812" y="178">買</text>
<text class="g" x="80" y="310">新規則</text>
<line x1="200" y1="340" x2="280" y2="340" stroke="var(--accent)" stroke-width="4"/>
<rect x="280" y="300" width="200" height="80" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="300" y="348">先替品質估值</text>
<line x1="480" y1="340" x2="540" y2="340" stroke="var(--accent)" stroke-width="4"/>
<rect x="540" y="300" width="200" height="80" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="568" y="348">再要求折價</text>
<line x1="740" y1="340" x2="800" y2="340" stroke="var(--accent)" stroke-width="4"/>
<path d="M800,340 l-16,-7 l0,14 z" fill="var(--accent)"/>
<text class="g" x="812" y="348">買</text>
<text class="c" x="60" y="444">沒換掉信念，只把適用條件寫細了</text>
</svg>
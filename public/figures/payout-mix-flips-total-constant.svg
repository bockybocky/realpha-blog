<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根等高堆疊長條，股息與庫藏股比例翻轉，總高度不變">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px;font-weight:700}
    .b{font-size:16px;fill:var(--dim)}
    .k{font-size:22px;font-weight:700}
</style>
<text class="t" x="60" y="58">總量沒變，管線換了</text>
<line x1="120" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="140" x2="900" y2="140" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="b" x="900" y="128" text-anchor="end">合計 ≈ 4%</text>
<rect x="240" y="140" width="170" height="228" fill="var(--accent)" opacity="0.38"/>
<rect x="240" y="368" width="170" height="52" fill="var(--accent)"/>
<text class="g" x="325" y="262" text-anchor="middle">股息</text>
<text class="b" x="430" y="400">庫藏股</text>
<text class="b" x="325" y="448" text-anchor="middle">1980 年代之前</text>
<rect x="600" y="140" width="170" height="70" fill="var(--accent)" opacity="0.38"/>
<rect x="600" y="210" width="170" height="210" fill="var(--accent)"/>
<text class="b" x="790" y="182">股息</text>
<text class="g" x="685" y="322" text-anchor="middle" fill="var(--page)">庫藏股</text>
<text class="b" x="685" y="448" text-anchor="middle">現在</text>
<text class="k" x="60" y="492">股息只剩 1%，不代表公司少發錢</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三根每月產量長條：二零二二年那根幾乎看不見，今天高出一大截，明年預估再翻三倍">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">冷板產量：換算成每月</text>

<line x1="120" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

<rect x="200" y="417" width="130" height="3" fill="var(--grey)"/>
<text class="g" x="265" y="460" text-anchor="middle">2022 年</text>
<text class="n" x="265" y="486" text-anchor="middle">一年十萬片</text>
<text class="n" x="265" y="400" text-anchor="middle">幾乎看不見</text>

<rect x="420" y="330" width="130" height="90" fill="var(--accent)" rx="4"/>
<text class="g" x="485" y="460" text-anchor="middle">今天</text>
<text class="n" x="485" y="486" text-anchor="middle">每月數十萬片</text>

<rect x="640" y="120" width="130" height="300" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="8 6" rx="4"/>
<text class="g" x="705" y="460" text-anchor="middle">明年</text>
<text class="n" x="705" y="486" text-anchor="middle">逼近每月百萬片</text>

<text class="c" x="60" y="524">到這個節奏，跟得上的技術才是贏的技術</text>
</svg>
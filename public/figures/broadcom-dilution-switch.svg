<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左右兩格對照：達標時同一筆房租換成一疊較矮的股票方塊，未達標時換股折扣更深、利率跳高，股票方塊疊得更高">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t h" x="60" y="66">同一筆房租，兩種交法</text>
  <text class="t s" x="60" y="96">Broadcom 可用股票付的那 420 億美元</text>

  <rect x="80" y="130" width="380" height="330" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="500" y="130" width="380" height="330" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <text class="t g" x="110" y="172" fill="var(--accent)">成長達標</text>
  <text class="t s" x="110" y="200">換股價＝市價九折</text>

  <text class="t g" x="530" y="172" fill="var(--warn)">營收沒達標</text>
  <text class="t s" x="530" y="200">換股價＝市價八五折｜利率跳到 13%</text>

  <rect x="150" y="384" width="240" height="22" rx="3" fill="var(--accent)"/>
  <rect x="150" y="356" width="240" height="22" rx="3" fill="var(--accent)"/>
  <rect x="150" y="328" width="240" height="22" rx="3" fill="var(--accent)"/>
  <text class="t s" x="270" y="432" text-anchor="middle">交出去的股票</text>

  <rect x="570" y="384" width="240" height="22" rx="3" fill="var(--warn)"/>
  <rect x="570" y="356" width="240" height="22" rx="3" fill="var(--warn)"/>
  <rect x="570" y="328" width="240" height="22" rx="3" fill="var(--warn)"/>
  <rect x="570" y="300" width="240" height="22" rx="3" fill="var(--warn)"/>
  <rect x="570" y="272" width="240" height="22" rx="3" fill="var(--warn)"/>
  <rect x="570" y="244" width="240" height="22" rx="3" fill="var(--warn)"/>
  <text class="t s" x="690" y="432" text-anchor="middle">交出去的股票</text>

  <text class="t c" x="60" y="512">最需要股價的時候，稀釋開得最大</text>
  <text class="t s" x="60" y="548">失效條件寫在這裡：成長停下來的那一刻</text>
</svg>
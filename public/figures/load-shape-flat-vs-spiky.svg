<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="家電用電平坦，AI 訓練用電出現高聳尖峰">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="80" y="62" font-size="27" font-weight="700" fill="var(--ink)">用電的形狀變了</text>

<rect x="80" y="100" width="380" height="320" fill="var(--card)"/>
<rect x="500" y="100" width="380" height="320" fill="var(--card)"/>
<line x1="100" y1="380" x2="440" y2="380" stroke="var(--line)" stroke-width="2"/>
<line x1="520" y1="380" x2="860" y2="380" stroke="var(--line)" stroke-width="2"/>

<polyline points="100,340 140,344 180,336 220,342 260,338 300,344 340,338 380,342 420,340 440,342" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text class="t" x="100" y="138" font-size="19" fill="var(--ink)">家電</text>
<text class="t" x="100" y="164" font-size="15" fill="var(--dim)">跳電就是重開</text>

<polyline points="520,344 560,342 580,142 600,344 640,340 680,146 700,344 740,342 780,138 800,344 840,342 860,344" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="520" y="138" font-size="19" fill="var(--ink)">AI 訓練</text>
<text class="t" x="520" y="164" font-size="15" fill="var(--dim)">同時通訊，瞬間跳上去</text>
<text class="t" x="810" y="124" font-size="15" fill="var(--warn)" text-anchor="middle">尖峰</text>

<text class="t" x="80" y="462" font-size="22" font-weight="700" fill="var(--ink)">斷一秒，算好幾天的東西沒了</text>
<text class="t" x="80" y="492" font-size="15" fill="var(--dim)">形狀示意，非實際數值</text>
</svg>
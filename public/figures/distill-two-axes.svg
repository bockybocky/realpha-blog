<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="難度對真實度的平面：前沿模型在右上，蒸餾模型在它正下方，橫向位置相同，縱向有一段缺口">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<defs><marker id="bArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker></defs>
<text x="60" y="62" class="h">蒸餾追上一條軸，漏掉另一條</text>
<line x1="140" y1="480" x2="840" y2="480" stroke="var(--grey)" stroke-width="2" marker-end="url(#bArr)"/>
<line x1="140" y1="480" x2="140" y2="130" stroke="var(--grey)" stroke-width="2" marker-end="url(#bArr)"/>
<text x="852" y="487" class="g">難度</text>
<text x="840" y="512" text-anchor="end" class="b">好造・好驗證</text>
<text x="140" y="116" text-anchor="middle" class="g">真實度</text>
<text x="160" y="146" class="b">多輪・目標衝突</text>
<line x1="180" y1="455" x2="676" y2="424" stroke="var(--dim)" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#bArr)"/>
<text x="400" y="420" text-anchor="middle" class="b">天真蒸餾</text>
<line x1="700" y1="404" x2="700" y2="206" stroke="var(--warn)" stroke-width="3" stroke-dasharray="6 5"/>
<text x="722" y="315" class="g" style="fill:var(--warn)">手感差一截</text>
<line x1="700" y1="434" x2="700" y2="480" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 4"/>
<text x="700" y="508" text-anchor="middle" class="b">分數對上</text>
<circle cx="700" cy="190" r="14" fill="var(--accent)"/>
<text x="726" y="197" class="g">前沿模型</text>
<circle cx="700" cy="420" r="13" fill="var(--page)" stroke="var(--warn)" stroke-width="4"/>
<text x="726" y="427" class="g">蒸餾模型</text>
</svg>
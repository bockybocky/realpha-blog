<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The fare bar is almost entirely consumed by airport cost, and the remaining gap cannot hold fuel, aircraft, staff and maintenance.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70">4 costs, this much</text>

  <text class="g" x="60" y="130">Fare $58</text>
  <rect x="60" y="150" width="812" height="70" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="150" width="728" height="70" rx="8" fill="var(--grey)"/>
  <text class="g" x="424" y="193" text-anchor="middle">Airport 52</text>
  <rect x="788" y="150" width="84" height="70" rx="8" fill="var(--accent)"/>
  <text class="d" x="830" y="193" text-anchor="middle" fill="var(--page)">6</text>

  <line x1="788" y1="228" x2="788" y2="300" stroke="var(--line)" stroke-dasharray="5 5"/>
  <line x1="872" y1="228" x2="872" y2="300" stroke="var(--line)" stroke-dasharray="5 5"/>
  <rect x="788" y="300" width="84" height="150" rx="6" fill="none" stroke="var(--accent)" stroke-dasharray="6 6" stroke-width="2"/>
  <text class="d" x="830" y="478" text-anchor="middle">Left</text>

  <rect x="200" y="300" width="420" height="34" rx="5" fill="var(--warn)"/>
  <text class="d" x="212" y="324" fill="var(--page)">Gas</text>
  <rect x="200" y="340" width="360" height="34" rx="5" fill="var(--warn)"/>
  <text class="d" x="212" y="364" fill="var(--page)">Jets</text>
  <rect x="200" y="380" width="300" height="34" rx="5" fill="var(--warn)"/>
  <text class="d" x="212" y="404" fill="var(--page)">Crew</text>
  <rect x="200" y="420" width="240" height="34" rx="5" fill="var(--warn)"/>
  <text class="d" x="212" y="444" fill="var(--page)">Fix</text>

  <text class="c" x="60" y="528">Not ops; the math fails</text>
</svg>
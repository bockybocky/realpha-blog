<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="五個步驟的雙柱圖，做十次時只有第三步的柱子暴衝出圖框，其餘只略微變高。">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--ink); }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="h" x="60" y="60">量放大十倍，哪一步先斷</text>
<line x1="100" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="140" y="400" width="34" height="40" fill="var(--grey)"/>
<rect x="180" y="330" width="34" height="110" fill="var(--accent)"/>
<rect x="300" y="405" width="34" height="35" fill="var(--grey)"/>
<rect x="340" y="345" width="34" height="95" fill="var(--accent)"/>
<rect x="460" y="395" width="34" height="45" fill="var(--grey)"/>
<rect x="500" y="128" width="34" height="312" fill="var(--warn)"/>
<path d="M500,144 L517,132 L534,144 L534,124 L517,112 L500,124 Z" fill="var(--page)"/>
<rect x="620" y="410" width="34" height="30" fill="var(--grey)"/>
<rect x="660" y="355" width="34" height="85" fill="var(--accent)"/>
<rect x="780" y="402" width="34" height="38" fill="var(--grey)"/>
<rect x="820" y="340" width="34" height="100" fill="var(--accent)"/>
<text class="g" x="197" y="470" text-anchor="middle">步驟 1</text>
<text class="g" x="357" y="470" text-anchor="middle">步驟 2</text>
<text class="g" x="517" y="470" text-anchor="middle" fill="var(--warn)">步驟 3</text>
<text class="g" x="677" y="470" text-anchor="middle">步驟 4</text>
<text class="g" x="837" y="470" text-anchor="middle">步驟 5</text>
<text class="b" x="546" y="140" fill="var(--warn)">卡點</text>
<rect x="140" y="96" width="18" height="18" fill="var(--grey)"/>
<text class="b" x="166" y="111">做 1 次</text>
<rect x="250" y="96" width="18" height="18" fill="var(--accent)"/>
<text class="b" x="276" y="111">做 10 次</text>
<text class="c" x="60" y="522">產能從你最不想面對的那一步長出來</text>
</svg>
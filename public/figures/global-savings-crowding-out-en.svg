<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars of equal length stacked, the blue left segment taking about a quarter on the top bar and widening to forty percent on the bottom, with the remaining space narrowing">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="62" font-size="27" fill="var(--ink)">How big a slice of global savings the US government takes</text>
<text x="80" y="94" font-size="16" fill="var(--dim)">Funding needed over the next 12 months ÷ global savings flow</text>

<text x="80" y="209" font-size="19" fill="var(--dim)">Long-run mean</text>
<rect x="250" y="170" width="620" height="64" rx="4" fill="var(--card)" stroke="var(--line)"/>
<rect x="250" y="170" width="143" height="64" rx="4" fill="var(--accent)"/>
<text x="321" y="210" font-size="20" fill="var(--page)" text-anchor="middle">23%</text>

<text x="80" y="339" font-size="19" fill="var(--ink)">Now</text>
<rect x="250" y="300" width="620" height="64" rx="4" fill="var(--card)" stroke="var(--line)"/>
<rect x="250" y="300" width="248" height="64" rx="4" fill="var(--accent)"/>
<text x="374" y="340" font-size="20" fill="var(--page)" text-anchor="middle">40%</text>

<path d="M498,378 L498,392 L870,392 L870,378" fill="none" stroke="var(--line)" stroke-width="2"/>
<text x="684" y="418" font-size="15" fill="var(--dim)" text-anchor="middle">Housing　Corporate investment　Small business and household credit</text>

<text x="80" y="486" font-size="22" fill="var(--ink)">Same pool, and the scoop taken out got bigger</text>
</svg>
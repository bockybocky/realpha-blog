<svg xmlns="http://www.w3.org/2000/svg" id="fig-return-source" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three bars: one tall upward, one short downward, and a third just below the first after the two offset">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
#fig-return-source text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-return-source .h { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-return-source .g { font-size:20px; fill:var(--ink); font-weight:600; }
#fig-return-source .b { font-size:16px; fill:var(--dim); }
#fig-return-source .s { font-size:15px; fill:var(--dim); }
#fig-return-source .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="h" x="60" y="54">What drove the gain</text>
<text class="b" x="60" y="84">Index, YTD, illustrative</text>
<line x1="120" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="210" width="150" height="210" fill="var(--accent)"/>
<text class="g" x="255" y="196" text-anchor="middle">+15%</text>
<text class="b" x="255" y="450" text-anchor="middle">Earnings up</text>
<rect x="420" y="210" width="150" height="42" fill="var(--warn)"/>
<text class="g" x="495" y="196" text-anchor="middle">−3%</text>
<text class="b" x="495" y="450" text-anchor="middle">Multiple down</text>
<line x1="330" y1="210" x2="420" y2="210" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="570" y1="252" x2="660" y2="252" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="660" y="252" width="150" height="168" fill="var(--accent)"/>
<text class="g" x="735" y="238" text-anchor="middle">+12%</text>
<text class="b" x="735" y="450" text-anchor="middle">Index gain</text>
<text class="c" x="60" y="504">Earned, not repriced</text>
</svg>
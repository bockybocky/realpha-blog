<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="兩條通膨路徑與兩塊形狀不同的代價，短而深對比長而淺">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
</defs>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="62">痛一次，還是痛很久</text>
<rect x="60" y="90" width="840" height="240" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="s" x="80" y="120">通膨</text>
<path d="M150 170 L300 152 L450 178 L600 148 L840 160" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>
<path d="M150 170 L300 158 L420 262 L520 290 L840 296" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
<text class="g" x="700" y="140">不肯下手</text>
<text class="g" x="700" y="332" fill="var(--ink)">下手</text>
<line x1="60" y1="352" x2="900" y2="352" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="60" y="384">代價的形狀</text>
<rect x="150" y="400" width="220" height="46" rx="8" fill="var(--warn)" opacity="0.35"/>
<rect x="150" y="400" width="220" height="46" rx="8" fill="none" stroke="var(--warn)" stroke-width="2"/>
<rect x="410" y="400" width="470" height="46" rx="8" fill="var(--grey)" opacity="0.35"/>
<rect x="410" y="400" width="470" height="46" rx="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="150" y="446" width="220" height="62" rx="8" fill="var(--warn)" opacity="0.35"/>
<text class="g" x="150" y="392">一次性</text>
<text class="s" x="242" y="392">深</text>
<text class="g" x="410" y="392">拖著</text>
<text class="s" x="482" y="392">淺，但沒有盡頭</text>
<text class="c" x="60" y="548">先相信它是一次性的，才付得下去</text>
</svg>
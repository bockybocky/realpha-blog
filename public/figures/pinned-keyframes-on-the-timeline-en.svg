<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The timeline is split into three segments, with a starting photo pinned at frames 0, 120, and 240.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="78" font-size="27" font-weight="700" fill="var(--ink)">One clip, three pins</text>
  <rect x="80" y="150" width="266" height="120" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="346" y="150" width="266" height="120" rx="6" fill="var(--grey)" opacity="0.45"/>
  <rect x="612" y="150" width="268" height="120" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="213" y="200" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Day 1, dawn</text>
  <text class="t" x="213" y="230" font-size="16" fill="var(--dim)" text-anchor="middle">Cool window light</text>
  <text class="t" x="479" y="200" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Day 12, late night</text>
  <text class="t" x="479" y="230" font-size="16" fill="var(--warn)" text-anchor="middle">One hanging lamp</text>
  <text class="t" x="746" y="200" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Day 30, daytime</text>
  <text class="t" x="746" y="230" font-size="16" fill="var(--dim)" text-anchor="middle">Bright</text>
  <line x1="80" y1="330" x2="880" y2="330" stroke="var(--line)" stroke-width="4"/>
  <circle cx="80" cy="330" r="11" fill="var(--accent)"/>
  <circle cx="346" cy="330" r="11" fill="var(--accent)"/>
  <circle cx="612" cy="330" r="11" fill="var(--accent)"/>
  <text class="t" x="80" y="372" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">0</text>
  <text class="t" x="346" y="372" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">120</text>
  <text class="t" x="612" y="372" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">240</text>
  <text class="t" x="880" y="372" font-size="19" fill="var(--dim)" text-anchor="end">362 frames</text>
  <text class="t" x="80" y="410" font-size="16" fill="var(--dim)">A pin is a pre-made starting photo</text>
  <text class="t" x="80" y="478" font-size="22" font-weight="700" fill="var(--ink)">Text says "cut to night," the photo says "like this"</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="總良率曲線從高處急速塌陷並貼到底部，條數越多越不可救">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .k { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66">單條九成，整排接近零</text>

<line x1="120" y1="120" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="60" y="126">全數成功</text>
<text class="b" x="84" y="446">零</text>
<text class="b" x="820" y="470">條數</text>

<polyline points="120,120 167,251 215,328 262,375 310,401 405,427 500,435 690,439 880,440"
  fill="none" stroke="var(--accent)" stroke-width="4"/>

<circle cx="120" cy="120" r="6" fill="var(--accent)"/>
<text class="g" x="136" y="112">一條　九成</text>

<circle cx="215" cy="328" r="6" fill="var(--accent)"/>
<text class="b" x="232" y="334">十條　三成五</text>

<circle cx="500" cy="435" r="6" fill="var(--warn)"/>
<text class="g" x="516" y="412">四十條</text>
<text class="b" x="516" y="436">百分之一點五</text>

<text class="k" x="120" y="500">沒有人偷懶，數學自己把它壓下去</text>
</svg>
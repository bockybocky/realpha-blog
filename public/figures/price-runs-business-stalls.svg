<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="股價線持續上行，生意線在中段走平，兩線在虛線之後越離越遠">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">價格在走，生意有沒有跟上</text>

  <line x1="100" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <line x1="400" y1="140" x2="400" y2="440" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="g" x="352" y="128">分岔點</text>

  <polyline points="100,420 250,368 400,300 550,222 700,178 880,196"
            fill="none" stroke="var(--accent)" stroke-width="4"/>
  <polyline points="100,420 250,384 400,356 550,350 700,354 880,358"
            fill="none" stroke="var(--dim)" stroke-width="4"/>

  <text class="g" x="700" y="156">股價</text>
  <text class="b" x="560" y="392">客戶數・續約・單客貢獻</text>

  <text class="c" x="100" y="492">兩條線分開的地方，就是重新問問題的地方</text>
</svg>
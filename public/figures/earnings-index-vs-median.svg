<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="盈餘年增率分佈：多數公司集中在中間，右側有一條矮長尾；中位數的線在分佈中央，指數加權的線被右側少數幾家拉到更右邊">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.s { font-size:16px; fill:var(--dim); }
.g { font-size:19px; font-weight:600; }
.n { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="64">盈餘好的不只是最右邊那幾家</text>
<text class="s" x="60" y="96">第二季盈餘年增，每根柱子是一群公司</text>
<rect x="136" y="400" width="56" height="30" fill="var(--grey)"/>
<rect x="204" y="350" width="56" height="80" fill="var(--grey)"/>
<rect x="272" y="290" width="56" height="140" fill="var(--grey)"/>
<rect x="340" y="260" width="56" height="170" fill="var(--grey)"/>
<rect x="408" y="310" width="56" height="120" fill="var(--grey)"/>
<rect x="476" y="350" width="56" height="80" fill="var(--grey)"/>
<rect x="544" y="380" width="56" height="50" fill="var(--grey)"/>
<rect x="612" y="400" width="56" height="30" fill="var(--accent)"/>
<rect x="680" y="410" width="56" height="20" fill="var(--accent)"/>
<rect x="748" y="410" width="56" height="20" fill="var(--accent)"/>
<rect x="816" y="420" width="56" height="10" fill="var(--accent)"/>
<line x1="120" y1="430" x2="890" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="368" y1="430" x2="368" y2="245" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="g" x="368" y="232" text-anchor="middle">中位數公司　+14%</text>
<line x1="606" y1="430" x2="606" y2="205" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="g" x="606" y="192" text-anchor="middle" fill="var(--accent)">指數層級　+28%</text>
<text class="n" x="790" y="352" text-anchor="middle" fill="var(--accent)">權重最大的那幾家</text>
<text class="n" x="130" y="454" text-anchor="middle">0%</text>
<text class="n" x="300" y="454" text-anchor="middle">10%</text>
<text class="n" x="470" y="454" text-anchor="middle">20%</text>
<text class="n" x="640" y="454" text-anchor="middle">30%</text>
<text class="n" x="810" y="454" text-anchor="middle">40%</text>
<text class="c" x="60" y="512">右邊那條線被少數幾家拉走，左邊那條沒有</text>
</svg>
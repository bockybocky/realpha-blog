<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four stacked layers with the upward arrow between each pair cut by a break, three jams at once">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:15px; fill:var(--dim); }
    .w { font-size:15px; fill:var(--warn); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="80" y="58">A whole row, not a point</text>
  <text class="s" x="80" y="90">Specs push up, each layer short</text>

  <rect x="210" y="130" width="540" height="62" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="236" y="158">Cloud CSPs</text>
  <text class="b" x="236" y="180">Faster, thicker AI server boards</text>

  <rect x="210" y="232" width="540" height="62" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="236" y="260">Board makers</text>
  <text class="b" x="236" y="282">22–44 layers, HDI mixed in</text>

  <rect x="210" y="334" width="540" height="62" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="236" y="362">CCL makers</text>
  <text class="b" x="236" y="384">M8-grade laminate</text>

  <rect x="210" y="436" width="540" height="62" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="236" y="464">Fabric·foil</text>
  <text class="b" x="236" y="486">Low CTE, HVLP4</text>

  <line x1="480" y1="232" x2="480" y2="220" stroke="var(--grey)" stroke-width="2"/>
  <circle cx="480" cy="212" r="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
  <line x1="475" y1="217" x2="485" y2="207" stroke="var(--warn)" stroke-width="2"/>
  <line x1="480" y1="204" x2="480" y2="198" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="480,188 473,199 487,199" fill="var(--grey)"/>
  <text class="w" x="196" y="217" text-anchor="end">Boards short</text>

  <line x1="480" y1="334" x2="480" y2="322" stroke="var(--grey)" stroke-width="2"/>
  <circle cx="480" cy="314" r="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
  <line x1="475" y1="319" x2="485" y2="309" stroke="var(--warn)" stroke-width="2"/>
  <line x1="480" y1="306" x2="480" y2="300" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="480,290 473,301 487,301" fill="var(--grey)"/>
  <text class="w" x="196" y="319" text-anchor="end">Material short</text>

  <line x1="480" y1="436" x2="480" y2="424" stroke="var(--grey)" stroke-width="2"/>
  <circle cx="480" cy="416" r="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
  <line x1="475" y1="421" x2="485" y2="411" stroke="var(--warn)" stroke-width="2"/>
  <line x1="480" y1="408" x2="480" y2="402" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="480,392 473,403 487,403" fill="var(--grey)"/>
  <text class="w" x="196" y="421" text-anchor="end">Upstream short</text>

  <text class="c" x="80" y="532">Three jams, no single fix</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two arrows from different sources feed into the same outcome: the upper path is transparent governance, the lower path is lenders making money — one result with two possible causes.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">One outcome, two different causes</text>

  <rect x="60" y="130" width="300" height="110" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="t" x="82" y="168" font-size="20" font-weight="700" fill="var(--accent)">Good governance, open books</text>
  <text class="t" x="82" y="200" font-size="16" fill="var(--dim)">Venice · Dutch · British</text>
  <text class="t" x="82" y="224" font-size="16" fill="var(--dim)">Citizens are creditors</text>

  <rect x="60" y="310" width="300" height="130" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
  <text class="t" x="82" y="348" font-size="20" font-weight="700" fill="var(--warn)">Lenders get paid well</text>
  <text class="t" x="82" y="380" font-size="16" fill="var(--dim)">High rates + collateral</text>
  <text class="t" x="82" y="404" font-size="16" fill="var(--dim)">Philip II's Spain</text>
  <text class="t" x="82" y="428" font-size="16" fill="var(--dim)">Defaulted often, still funded</text>

  <path d="M360 185 C 480 185 500 270 600 270" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M360 375 C 480 375 500 290 600 290" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <path d="M592 262 L 614 270 L 592 278 Z" fill="var(--accent)"/>
  <path d="M592 282 L 614 290 L 592 298 Z" fill="var(--warn)"/>

  <rect x="620" y="230" width="280" height="100" rx="6" fill="var(--page)" stroke="var(--ink)" stroke-width="2.5"/>
  <text class="t" x="760" y="272" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">The money keeps coming</text>
  <text class="t" x="760" y="302" font-size="16" text-anchor="middle" fill="var(--dim)">And it is not dear</text>

  <text class="t" x="60" y="496" font-size="22" font-weight="700" fill="var(--ink)">You see cheap money, not which path it came from</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="In the left panel a pillar holds the platform up, and in the right panel the pillar's place becomes a dashed empty outline and the platform tilts and sinks.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" fill="var(--ink)" font-weight="700">Who decides is a variable</text>
<text class="t" x="70" y="120" font-size="19" fill="var(--dim)">Now</text>
<text class="t" x="510" y="120" font-size="19" fill="var(--dim)">Rule changed</text>
<rect x="100" y="180" width="300" height="38" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="250" y="206" font-size="16" fill="var(--ink)" text-anchor="middle">What works</text>
<rect x="230" y="218" width="44" height="150" fill="var(--accent)"/>
<line x1="100" y1="378" x2="400" y2="378" stroke="var(--line)" stroke-width="3"/>
<text class="t" x="250" y="412" font-size="16" fill="var(--accent)" text-anchor="middle">A nod or a rule</text>
<g transform="rotate(-9 540 199)">
<rect x="540" y="180" width="300" height="38" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="690" y="206" font-size="16" fill="var(--ink)" text-anchor="middle">Same</text>
</g>
<rect x="670" y="218" width="44" height="150" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<line x1="540" y1="378" x2="840" y2="378" stroke="var(--line)" stroke-width="3"/>
<text class="t" x="690" y="412" font-size="16" fill="var(--grey)" text-anchor="middle">Gone</text>
<text class="t" x="70" y="476" font-size="22" fill="var(--ink)" font-weight="700">System fine; premise gone</text>
</svg>
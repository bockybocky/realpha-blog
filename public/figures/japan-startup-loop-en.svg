<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Four nodes in a ring, arrows linking startups growing businesses, large firms acquiring, talent entering large firms, and startups used as engines again">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .t{font-size:27px;fill:var(--ink);font-weight:700}
    .g{font-size:19px;fill:var(--ink);font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="58">Not swap, a loop</text>
<text class="b" x="60" y="88">Japan looks European: same sign, new people inside</text>
<path d="M480 168 A 152 152 0 0 1 632 320" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M632 320 L622 300 L644 306 Z" fill="var(--accent)"/>
<path d="M632 320 A 152 152 0 0 1 480 472" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M480 472 L500 462 L494 484 Z" fill="var(--accent)"/>
<path d="M480 472 A 152 152 0 0 1 328 320" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M328 320 L338 340 L316 334 Z" fill="var(--accent)"/>
<path d="M328 320 A 152 152 0 0 1 480 168" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M480 168 L460 178 L466 156 Z" fill="var(--accent)"/>
<rect x="358" y="140" width="244" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="480" y="178" text-anchor="middle">Startups build</text>
<rect x="618" y="290" width="244" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="740" y="328" text-anchor="middle">Big firms buy</text>
<rect x="358" y="442" width="244" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="480" y="480" text-anchor="middle">Talent moves in</text>
<rect x="98" y="290" width="244" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="220" y="328" text-anchor="middle">Later they lead</text>
<text class="c" x="60" y="548">Startups become the engine</text>
</svg>
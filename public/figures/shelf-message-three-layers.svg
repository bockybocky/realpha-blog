<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="貨架訊息三層順序，科學本體排在購買線之後">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="40" y="52" font-size="27" fill="var(--ink)">科學排在最後一層</text>

  <rect x="40" y="96" width="640" height="88" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="68" y="140" font-size="20" fill="var(--ink)">無類固醇・無藥・有效</text>
  <text x="68" y="168" font-size="16" fill="var(--dim)">第一層</text>

  <rect x="40" y="200" width="460" height="88" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="68" y="244" font-size="20" fill="var(--ink)">馬上舒服一點</text>
  <text x="68" y="272" font-size="16" fill="var(--dim)">第二層</text>

  <line x1="40" y1="320" x2="920" y2="320" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="40" y="350" font-size="19" fill="var(--warn)">買下去的那條線</text>

  <rect x="40" y="376" width="300" height="88" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text x="68" y="420" font-size="20" fill="var(--ink)">保護鼻腔菌相</text>
  <text x="68" y="448" font-size="16" fill="var(--dim)">第三層</text>

  <text x="380" y="412" font-size="19" fill="var(--ink)">科學本體在這裡</text>
  <text x="380" y="444" font-size="16" fill="var(--dim)">進了品牌世界才補的功課</text>

  <text x="716" y="150" font-size="16" fill="var(--dim)">看得最清楚</text>
  <text x="716" y="420" font-size="16" fill="var(--dim)">貨架前沒人讀</text>
</svg>
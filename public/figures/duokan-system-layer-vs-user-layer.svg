<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同樣三個元件在上層穩定、在下層旁邊有鋸齒線代表反覆重啟">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="480" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">同一包套件，放的層決定它穩不穩</text>

  <rect x="70" y="110" width="820" height="150" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="100" y="145" font-size="20" font-weight="700" fill="var(--accent)">系統層</text>
  <rect x="110" y="162" width="190" height="76" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="205" y="207" text-anchor="middle" font-size="15" fill="var(--ink)">Phonesky</text>
  <rect x="316" y="162" width="190" height="76" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="411" y="207" text-anchor="middle" font-size="15" fill="var(--ink)">GmsCore</text>
  <rect x="522" y="162" width="190" height="76" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="617" y="207" text-anchor="middle" font-size="15" fill="var(--ink)">Framework</text>
  <path d="M740 200 L870 200" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="805" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="var(--accent)">穩定</text>

  <rect x="70" y="330" width="820" height="150" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="100" y="365" font-size="20" font-weight="700" fill="var(--warn)">使用者層</text>
  <rect x="110" y="382" width="190" height="76" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="205" y="427" text-anchor="middle" font-size="15" fill="var(--ink)">Phonesky</text>
  <rect x="316" y="382" width="190" height="76" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="411" y="427" text-anchor="middle" font-size="15" fill="var(--ink)">GmsCore</text>
  <rect x="522" y="382" width="190" height="76" rx="8" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="617" y="427" text-anchor="middle" font-size="15" fill="var(--ink)">Framework</text>
  <path d="M740 420 L760 398 L780 442 L800 398 L820 442 L840 398 L860 420" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="805" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="var(--warn)">每幾秒重啟</text>

  <text class="t" x="480" y="528" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">位置對了才算裝好</text>
</svg>
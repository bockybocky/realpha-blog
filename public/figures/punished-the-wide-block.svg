<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條按營收佔比分段的橫條，高成長的段很窄、放緩的段很寬，箭頭指向寬的那一段">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:19px; fill:var(--ink); font-weight:700; }
.b { font-size:16px; fill:var(--dim); }
.s { font-size:15px; fill:var(--page); font-weight:700; }
.c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="h" x="60" y="72">被罰的，是寬的那一塊</text>
<text class="g" x="60" y="168">營收結構</text>
<rect x="60" y="196" width="380" height="72" fill="var(--grey)"/>
<rect x="440" y="196" width="182" height="72" fill="var(--accent)"/>
<rect x="622" y="196" width="238" height="72" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="80" y="240">搜尋廣告　增速放緩</text>
<text class="s" x="460" y="240">雲端　年增 103%</text>
<text class="b" x="642" y="240">其他</text>
<rect x="60" y="352" width="600" height="72" fill="var(--grey)"/>
<rect x="660" y="352" width="200" height="72" fill="var(--accent)"/>
<text class="s" x="80" y="396">線上零售與廣告　年增 2% 與 11%</text>
<text class="s" x="680" y="396">雲端</text>
<path d="M 300 316 L 300 344" stroke="var(--warn)" stroke-width="4"/>
<path d="M 300 344 L 288 322 L 312 322 Z" fill="var(--warn)"/>
<path d="M 300 316 L 240 316 L 240 288" stroke="var(--warn)" stroke-width="4" fill="none"/>
<path d="M 240 288 L 228 310 L 252 310 Z" fill="var(--warn)"/>
<text class="b" x="330" y="322">股價盯的是體量最大的那一塊</text>
<text class="c" x="60" y="500">雲端再快，也只佔一小段寬度</text>
</svg>
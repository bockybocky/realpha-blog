<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The model capability curve bends upward and crosses the usable threshold at Opus 4.5, and the product line, flat near the bottom until then, jumps straight up at that moment.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:20px;font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700}
    .a{fill:var(--accent)}
    .w{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">Too soon</text>
<line x1="100" y1="110" x2="100" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="460" x2="890" y2="460" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="110" y="128">Cap.</text>
<text class="b" x="890" y="512" text-anchor="end">Time</text>
<line x1="100" y1="260" x2="890" y2="260" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
<text class="b" x="110" y="250">Usable</text>
<path d="M100,430 Q650,430 880,140" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text class="b" x="870" y="128" text-anchor="end">Model</text>
<line x1="207" y1="427" x2="207" y2="460" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 4"/>
<line x1="570" y1="357" x2="570" y2="460" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 4"/>
<line x1="754" y1="260" x2="754" y2="460" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="207" cy="427" r="6" fill="var(--dim)"/>
<circle cx="570" cy="357" r="6" fill="var(--dim)"/>
<circle cx="754" cy="260" r="8" fill="var(--accent)"/>
<text class="b" x="207" y="486" text-anchor="middle">GPT-3</text>
<text class="b" x="570" y="486" text-anchor="middle">o1 Pro</text>
<text class="b" x="754" y="486" text-anchor="middle">Opus 4.5</text>
<path d="M100,395 H754 V175 H880" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linejoin="round"/>
<text class="g a" x="130" y="382">App: junk</text>
<text class="g a" x="772" y="162">Works!</text>
<text class="c" x="480" y="540" text-anchor="middle">Build ahead</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="長期平穩的折線在末端突然斷裂下墜">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">酒類佔營收：二十八年的平線，斷在最後一段</text>
<text x="60" y="90" font-size="15" fill="var(--dim)">North Pond，1997 年開業至今</text>

<line x1="120" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="130" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="165" x2="900" y2="165" stroke="var(--line)" stroke-dasharray="5 6"/>
<line x1="120" y1="375" x2="900" y2="375" stroke="var(--line)" stroke-dasharray="5 6"/>
<text x="76" y="171" font-size="15" fill="var(--dim)">34%</text>
<text x="76" y="381" font-size="15" fill="var(--dim)">24%</text>
<text x="120" y="468" font-size="15" fill="var(--dim)">1997</text>
<text x="900" y="468" font-size="15" fill="var(--dim)" text-anchor="end">2026</text>

<path d="M130 180 L210 174 L290 182 L370 172 L450 180 L530 173 L610 181 L690 175 L770 180 L812 178" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M812 178 L900 375" fill="none" stroke="var(--warn)" stroke-width="4"/>
<circle cx="900" cy="375" r="7" fill="var(--warn)"/>

<text x="300" y="146" font-size="19" fill="var(--ink)">28 年都在 33%–34%</text>
<text x="812" y="500" font-size="16" fill="var(--warn)" text-anchor="middle">最近 18 個月</text>
<line x1="812" y1="482" x2="856" y2="440" stroke="var(--warn)" stroke-width="2"/>

<line x1="676" y1="234" x2="676" y2="330" stroke="var(--warn)" stroke-width="2"/>
<text x="696" y="268" font-size="19" font-weight="700" fill="var(--warn)">少掉 9–10 個</text>
<text x="696" y="294" font-size="19" font-weight="700" fill="var(--warn)">百分點</text>

<text x="60" y="534" font-size="22" font-weight="700" fill="var(--ink)">掉的那一段，是全店獲利最高的銷售</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Top view of a motherboard with two large dies at the center and all sensing traces converging on one small chip in the lower-left corner.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="48" font-size="27" fill="var(--ink)">The one in the corner</text>
<rect x="60" y="80" width="840" height="370" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="300" y="140" width="210" height="170" rx="6" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text x="405" y="235" font-size="20" fill="var(--dim)" text-anchor="middle">Accelerators</text>
<rect x="560" y="140" width="170" height="130" rx="6" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text x="645" y="212" font-size="20" fill="var(--dim)" text-anchor="middle">Processors</text>
<g stroke="var(--grey)" stroke-width="1" opacity="0.55">
<line x1="330" y1="170" x2="170" y2="395"/>
<line x1="390" y1="195" x2="170" y2="395"/>
<line x1="455" y1="165" x2="170" y2="395"/>
<line x1="480" y1="235" x2="170" y2="395"/>
<line x1="350" y1="272" x2="170" y2="395"/>
<line x1="425" y1="296" x2="170" y2="395"/>
<line x1="575" y1="172" x2="170" y2="395"/>
<line x1="625" y1="208" x2="170" y2="395"/>
<line x1="700" y1="168" x2="170" y2="395"/>
<line x1="612" y1="252" x2="170" y2="395"/>
<line x1="690" y1="240" x2="170" y2="395"/>
<line x1="745" y1="300" x2="170" y2="395"/>
<line x1="505" y1="340" x2="170" y2="395"/>
<line x1="640" y1="336" x2="170" y2="395"/>
</g>
<g fill="var(--grey)">
<circle cx="330" cy="170" r="4"/><circle cx="390" cy="195" r="4"/><circle cx="455" cy="165" r="4"/>
<circle cx="480" cy="235" r="4"/><circle cx="350" cy="272" r="4"/><circle cx="425" cy="296" r="4"/>
<circle cx="575" cy="172" r="4"/><circle cx="625" cy="208" r="4"/><circle cx="700" cy="168" r="4"/>
<circle cx="612" cy="252" r="4"/><circle cx="690" cy="240" r="4"/><circle cx="745" cy="300" r="4"/>
<circle cx="505" cy="340" r="4"/><circle cx="640" cy="336" r="4"/>
</g>
<text x="790" y="175" font-size="16" fill="var(--dim)">Sensors</text>
<text x="790" y="197" font-size="16" fill="var(--dim)">V · temp · current</text>
<rect x="110" y="365" width="120" height="60" rx="5" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="170" y="402" font-size="19" fill="var(--accent)" text-anchor="middle">BMC</text>
<rect x="262" y="375" width="110" height="50" rx="5" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text x="317" y="406" font-size="16" fill="var(--dim)" text-anchor="middle">FPGA</text>
<text x="396" y="406" font-size="15" fill="var(--dim)">Fills gaps no ASIC covers</text>
<text x="60" y="495" font-size="22" fill="var(--ink)">It does no compute; it gathers the board's electrical flow into one readable place</text>
</svg>
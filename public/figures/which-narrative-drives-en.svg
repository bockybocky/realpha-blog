<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two arrows above and below press on one vertical dial from opposite directions, and the dial moves down a short way, from 5.4 to 5.1.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); }
.g { font-size:20px; fill:var(--ink); }
.s { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="68">Two hands on the wheel: see which way the price gives</text>

<text class="g" x="90" y="170">Inflation hot</text>
<line x1="240" y1="200" x2="430" y2="200" stroke="var(--grey)" stroke-width="5"/>
<polygon points="446,200 426,190 426,210" fill="var(--grey)"/>
<text class="s" x="240" y="182">Push up</text>

<text class="g" x="90" y="382">AI debt sells slow</text>
<line x1="240" y1="352" x2="430" y2="352" stroke="var(--accent)" stroke-width="5"/>
<polygon points="446,352 426,342 426,362" fill="var(--accent)"/>
<text class="s" x="240" y="334">Push down</text>

<rect x="520" y="140" width="150" height="272" fill="var(--card)" stroke="var(--line)"/>
<line x1="520" y1="200" x2="670" y2="200" stroke="var(--line)" stroke-dasharray="4 6"/>
<line x1="520" y1="352" x2="670" y2="352" stroke="var(--line)" stroke-dasharray="4 6"/>
<text class="s" x="686" y="206">5.4%</text>
<text class="s" x="686" y="358">5.1%</text>
<line x1="595" y1="200" x2="595" y2="340" stroke="var(--accent)" stroke-width="6"/>
<polygon points="595,356 585,334 605,334" fill="var(--accent)"/>
<text class="g" x="520" y="450">Yield gave way</text>

<line x1="60" y1="486" x2="900" y2="486" stroke="var(--line)"/>
<text class="c" x="60" y="524">The side that gives is not the side driving</text>
</svg>
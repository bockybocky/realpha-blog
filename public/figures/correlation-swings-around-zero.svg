<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="相關係數在正負之間長段擺盪，平均值落在零，2022 位在正相關那一段">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px;font-weight:700}
    .b{font-size:16px;fill:var(--dim)}
    .k{font-size:22px;font-weight:700}
</style>
<text class="t" x="60" y="58">平均值沒有哪一天發生</text>
<rect x="120" y="110" width="780" height="180" fill="var(--warn)" opacity="0.08"/>
<rect x="120" y="290" width="780" height="180" fill="var(--accent)" opacity="0.08"/>
<line x1="120" y1="290" x2="900" y2="290" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="b" x="112" y="296" text-anchor="end">0</text>
<text class="b" x="112" y="126" text-anchor="end">+1</text>
<text class="b" x="112" y="466" text-anchor="end">−1</text>
<text class="b" x="900" y="272" text-anchor="end">長期平均 ≈ 0</text>
<path d="M120,352 C 190,404 250,214 330,182 C 410,152 456,268 540,340 C 610,400 660,412 716,378 C 780,338 828,192 900,210" fill="none" stroke="var(--ink)" stroke-width="3.5"/>
<text class="g" x="150" y="150" fill="var(--warn)">正相關：一起跌</text>
<text class="g" x="150" y="434" fill="var(--accent)">負相關：互相抵銷</text>
<circle cx="840" cy="192" r="6.5" fill="var(--warn)"/>
<text class="b" x="840" y="172" text-anchor="middle">2022</text>
<text class="b" x="900" y="496" text-anchor="end">時間</text>
<text class="k" x="60" y="530">你買到平均，承受的是某一段</text>
</svg>
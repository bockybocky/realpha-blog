<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A timeline with a clear solid left half labelled through the first half of 2027, fading into dashes past the divider and labelled 2028 onward.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .n { font-size:34px; font-weight:700; fill:var(--ink); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62">Market looks right of the line</text>
  <text class="b" x="60" y="94">Where news lands decides its use</text>
  <path d="M80 280 L520 280" stroke="var(--accent)" stroke-width="8"/>
  <path d="M520 280 L700 280" stroke="var(--grey)" stroke-width="6" stroke-dasharray="12 10"/>
  <path d="M700 280 L890 280" stroke="var(--grey)" stroke-width="4" stroke-dasharray="6 14" opacity="0.5"/>
  <path d="M520 180 L520 390" stroke="var(--line)" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="80" cy="280" r="9" fill="var(--accent)"/>
  <text class="g" x="80" y="240">Through 1H 2027</text>
  <text class="b" x="80" y="320">Signed, 1-yr lead</text>
  <text class="b" x="80" y="344">No supply flip in 6 mo</text>
  <text class="g" x="560" y="240">2028 on</text>
  <text class="b" x="560" y="320">Traded now</text>
  <text class="b" x="560" y="344">Land, demand still unknown</text>
  <text class="c" x="60" y="440">Then ask what is not priced yet</text>
  <text class="b" x="60" y="476">Mostly nothing; just calms near quarters</text>
</svg>
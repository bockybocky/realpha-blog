<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="長橢圓會議桌，首位是財政部長並定議程，桌邊十五席中十席實心為有投票權、五席空心為無投票權">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">FSOC 不是監管機關，是一張桌子</text>
<text x="60" y="94" font-size="16" fill="var(--dim)">成立 2010 年｜放在財政部</text>

<ellipse cx="500" cy="330" rx="300" ry="120" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>

<circle cx="150" cy="330" r="22" fill="var(--accent)"/>
<text x="150" y="286" font-size="19" font-weight="700" text-anchor="middle" fill="var(--accent)">首位</text>
<text x="150" y="382" font-size="16" text-anchor="middle" fill="var(--ink)">財政部長</text>
<text x="150" y="404" font-size="16" text-anchor="middle" fill="var(--dim)">定議程</text>

<circle cx="195" cy="274" r="13" fill="var(--ink)"/>
<circle cx="267" cy="228" r="13" fill="var(--ink)"/>
<circle cx="374" cy="196" r="13" fill="var(--ink)"/>
<circle cx="500" cy="185" r="13" fill="var(--ink)"/>
<circle cx="626" cy="196" r="13" fill="var(--ink)"/>
<circle cx="733" cy="228" r="13" fill="var(--ink)"/>
<circle cx="805" cy="274" r="13" fill="var(--ink)"/>
<circle cx="830" cy="330" r="13" fill="var(--ink)"/>
<circle cx="805" cy="386" r="13" fill="var(--ink)"/>
<circle cx="733" cy="432" r="13" fill="var(--ink)"/>

<circle cx="626" cy="464" r="13" fill="none" stroke="var(--grey)" stroke-width="3"/>
<circle cx="500" cy="475" r="13" fill="none" stroke="var(--grey)" stroke-width="3"/>
<circle cx="374" cy="464" r="13" fill="none" stroke="var(--grey)" stroke-width="3"/>
<circle cx="267" cy="432" r="13" fill="none" stroke="var(--grey)" stroke-width="3"/>
<circle cx="195" cy="386" r="13" fill="none" stroke="var(--grey)" stroke-width="3"/>

<text x="500" y="320" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">銀行 ｜ 證券 ｜ 商品期貨</text>
<text x="500" y="350" font-size="16" text-anchor="middle" fill="var(--dim)">各路監管者</text>

<circle cx="700" cy="516" r="11" fill="var(--ink)"/>
<text x="720" y="522" font-size="16" fill="var(--ink)">有投票權 10</text>
<circle cx="840" cy="516" r="11" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text x="858" y="522" font-size="16" fill="var(--dim)">無 5</text>

<text x="60" y="522" font-size="22" font-weight="700" fill="var(--accent)">超能力＝協調</text>
</svg>
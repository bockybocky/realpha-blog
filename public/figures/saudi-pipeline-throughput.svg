<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條橫條由長到短：設計量、高峰實際、現在">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; } .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); } .c { font-size:22px; font-weight:700; }
</style>
<text x="40" y="50" class="t">沙烏地東西向輸油管（萬桶／日）</text>
<text x="220" y="157" class="g" text-anchor="end">設計量</text>
<rect x="240" y="120" width="600" height="56" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="825" y="157" class="g" text-anchor="end">700</text>
<text x="220" y="257" class="g" text-anchor="end">高峰實際</text>
<rect x="240" y="220" width="300" height="56" fill="var(--accent)"/>
<text x="555" y="257" class="g">350</text>
<text x="220" y="357" class="g" text-anchor="end">現在</text>
<rect x="240" y="320" width="171" height="56" fill="var(--warn)"/>
<text x="425" y="357" class="g" style="fill:var(--warn)">&lt; 200</text>
<text x="480" y="455" class="c" text-anchor="middle">遇襲 → 修復要好幾週</text>
</svg>
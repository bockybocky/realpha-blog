<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三個情境的排放柱，一根持平、一根略低、一根最低，呈階梯往下">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">2035 年的排放，差距在政策那一端</text>

  <line x1="90" y1="160" x2="900" y2="160" stroke="var(--ink)" stroke-width="2"/>
  <text class="t" x="90" y="146" font-size="16" fill="var(--dim)">今天的水準</text>

  <rect x="150" y="148" width="150" height="12" rx="3" fill="var(--grey)"/>
  <text class="t" x="225" y="300" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">現行政策</text>
  <text class="t" x="225" y="328" font-size="16" text-anchor="middle" fill="var(--dim)">持平或略增</text>

  <rect x="405" y="160" width="150" height="150" rx="4" fill="var(--accent)" opacity="0.45"/>
  <text class="t" x="480" y="350" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">既定政策</text>
  <text class="t" x="480" y="378" font-size="16" text-anchor="middle" fill="var(--dim)">少 6%</text>
  <text class="t" x="480" y="406" font-size="15" text-anchor="middle" fill="var(--dim)">已寫進官方計畫</text>

  <rect x="660" y="160" width="150" height="225" rx="4" fill="var(--accent)"/>
  <text class="t" x="735" y="425" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">額外回應</text>
  <text class="t" x="735" y="453" font-size="16" text-anchor="middle" fill="var(--dim)">少 9%</text>
  <text class="t" x="735" y="481" font-size="15" text-anchor="middle" fill="var(--dim)">看得到清楚意向</text>

  <text class="t" x="480" y="520" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">同一場危機，三個落點</text>
</svg>
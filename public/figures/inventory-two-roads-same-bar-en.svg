<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two arrows from opposite directions point at one rising inventory bar, with three telltale checks listed below.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="66" font-size="27" fill="var(--ink)">Two opposite roads, growing into the same bar</text>

  <rect x="60" y="110" width="840" height="300" fill="var(--card)" stroke="var(--line)"/>

  <rect x="435" y="180" width="90" height="180" fill="var(--ink)"/>
  <text class="t" x="480" y="392" font-size="19" fill="var(--ink)" text-anchor="middle">Inventory up</text>

  <line x1="180" y1="230" x2="420" y2="230" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="432,230 416,222 416,238" fill="var(--accent)"/>
  <text class="t" x="180" y="210" font-size="20" fill="var(--accent)">Building for a strong season</text>

  <line x1="780" y1="310" x2="540" y2="310" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="528,310 544,302 544,318" fill="var(--warn)"/>
  <text class="t" x="780" y="290" font-size="20" fill="var(--warn)" text-anchor="end">Piling up unsold</text>

  <text class="t" x="480" y="150" font-size="16" fill="var(--dim)" text-anchor="middle">Identical on the statements</text>

  <text class="t" x="60" y="462" font-size="16" fill="var(--dim)">Only these three tell them apart</text>
  <rect x="60" y="478" width="260" height="46" fill="var(--card)" stroke="var(--line)"/>
  <rect x="350" y="478" width="260" height="46" fill="var(--card)" stroke="var(--line)"/>
  <rect x="640" y="478" width="260" height="46" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="190" y="508" font-size="19" fill="var(--ink)" text-anchor="middle">Shipping schedule</text>
  <text class="t" x="480" y="508" font-size="19" fill="var(--ink)" text-anchor="middle">Supply and demand tightness</text>
  <text class="t" x="770" y="508" font-size="19" fill="var(--ink)" text-anchor="middle">Can it turn into revenue</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A pipeline that is wide at the left and narrow at the right, with the outlet matching the height of its narrowest segment.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t  { font-size:27px; font-weight:700; fill:var(--ink); }
.g  { font-size:19px; font-weight:600; fill:var(--ink); }
.gd { font-size:19px; font-weight:600; fill:var(--dim); }
.gw { font-size:19px; font-weight:600; fill:var(--warn); }
.ga { font-size:19px; font-weight:600; fill:var(--accent); }
.b  { font-size:16px; fill:var(--dim); }
.c  { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="64">Capacity is set by the narrowest link</text>
<rect x="80" y="225" width="130" height="150" rx="3" fill="var(--grey)"/>
<rect x="214" y="230" width="130" height="140" rx="3" fill="var(--grey)"/>
<rect x="348" y="273" width="130" height="54" rx="3" fill="var(--warn)"/>
<rect x="482" y="278" width="130" height="44" rx="3" fill="var(--warn)"/>
<rect x="616" y="283" width="130" height="34" rx="3" fill="var(--warn)"/>
<rect x="750" y="283" width="130" height="34" rx="3" fill="var(--accent)"/>
<text class="gd" x="98" y="208">Memory</text>
<text class="gd" x="248" y="208">GPU</text>
<line x1="348" y1="248" x2="746" y2="248" stroke="var(--warn)" stroke-width="2"/>
<line x1="348" y1="248" x2="348" y2="262" stroke="var(--warn)" stroke-width="2"/>
<line x1="746" y1="248" x2="746" y2="262" stroke="var(--warn)" stroke-width="2"/>
<text class="gw" x="500" y="238">These links jam</text>
<text class="b" x="372" y="356">Substrates</text>
<text class="b" x="490" y="356">Passives</text>
<text class="b" x="624" y="356">Wafer test</text>
<text class="ga" x="768" y="358">Actual shipments</text>
<text class="c" x="60" y="524">No matter how wide upstream, the narrowest link sets the pace</text>
</svg>
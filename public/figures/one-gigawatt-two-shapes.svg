<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同樣一吉瓦的兩種形狀：左邊一棟建築兩台渦輪，右邊三十五台引擎攤開近一英里">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="64">一樣是一吉瓦，兩種形狀</text>

<text class="g" x="60" y="128">電力公司的電廠</text>
<rect x="60" y="150" width="240" height="120" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="92" y="186" width="70" height="48" fill="var(--accent)"/>
<rect x="196" y="186" width="70" height="48" fill="var(--accent)"/>
<text class="n" x="60" y="298">兩台渦輪，一棟建築</text>

<text class="g" x="60" y="372">資料中心自建</text>
<g fill="var(--warn)">
<rect x="60" y="394" width="18" height="26"/><rect x="84" y="394" width="18" height="26"/>
<rect x="108" y="394" width="18" height="26"/><rect x="132" y="394" width="18" height="26"/>
<rect x="156" y="394" width="18" height="26"/><rect x="180" y="394" width="18" height="26"/>
<rect x="204" y="394" width="18" height="26"/><rect x="228" y="394" width="18" height="26"/>
<rect x="252" y="394" width="18" height="26"/><rect x="276" y="394" width="18" height="26"/>
<rect x="300" y="394" width="18" height="26"/><rect x="324" y="394" width="18" height="26"/>
<rect x="348" y="394" width="18" height="26"/><rect x="372" y="394" width="18" height="26"/>
<rect x="396" y="394" width="18" height="26"/><rect x="420" y="394" width="18" height="26"/>
<rect x="444" y="394" width="18" height="26"/><rect x="468" y="394" width="18" height="26"/>
<rect x="492" y="394" width="18" height="26"/><rect x="516" y="394" width="18" height="26"/>
<rect x="540" y="394" width="18" height="26"/><rect x="564" y="394" width="18" height="26"/>
<rect x="588" y="394" width="18" height="26"/><rect x="612" y="394" width="18" height="26"/>
<rect x="636" y="394" width="18" height="26"/><rect x="660" y="394" width="18" height="26"/>
<rect x="684" y="394" width="18" height="26"/><rect x="708" y="394" width="18" height="26"/>
<rect x="732" y="394" width="18" height="26"/><rect x="756" y="394" width="18" height="26"/>
<rect x="780" y="394" width="18" height="26"/><rect x="804" y="394" width="18" height="26"/>
<rect x="828" y="394" width="18" height="26"/><rect x="852" y="394" width="18" height="26"/>
<rect x="876" y="394" width="18" height="26"/>
</g>
<line x1="60" y1="440" x2="894" y2="440" stroke="var(--grey)" stroke-width="2"/>
<text class="n" x="60" y="466">35 台往復式引擎，攤開將近一英里</text>
<text class="c" x="60" y="512">接頭變多，漏點就變多</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The highlighted cell in four equal tracks moves one step right each row, forming a diagonal">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600;fill:var(--dim)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="62">Fix one, it moves one right</text>
<text class="b" x="285" y="122" text-anchor="middle">Money</text>
<text class="b" x="455" y="122" text-anchor="middle">Time</text>
<text class="b" x="625" y="122" text-anchor="middle">Attention</text>
<text class="b" x="795" y="122" text-anchor="middle">Presence</text>
<text class="b" x="190" y="176" text-anchor="end">Now</text>
<rect x="200" y="140" width="170" height="46" rx="8" fill="var(--warn)"/>
<rect x="370" y="140" width="170" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="140" width="170" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="710" y="140" width="170" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="190" y="256" text-anchor="end">Higher pay</text>
<rect x="200" y="220" width="170" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="370" y="220" width="170" height="46" rx="8" fill="var(--warn)"/>
<rect x="540" y="220" width="170" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="710" y="220" width="170" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="190" y="336" text-anchor="end">Outsourced</text>
<rect x="200" y="300" width="170" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="370" y="300" width="170" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="300" width="170" height="46" rx="8" fill="var(--warn)"/>
<rect x="710" y="300" width="170" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="190" y="416" text-anchor="end">A tablet</text>
<rect x="200" y="380" width="170" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="370" y="380" width="170" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="380" width="170" height="46" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="710" y="380" width="170" height="46" rx="8" fill="var(--warn)"/>
<rect x="200" y="466" width="26" height="18" rx="4" fill="var(--warn)"/>
<text class="b" x="238" y="481">What's stuck now</text>
<text class="c" x="60" y="542">Each fix is an unwritten bet</text>
</svg>
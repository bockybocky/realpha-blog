<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="密集小點往右逐漸合併成一個大方塊">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">離現場越遠，細節掉得越快</text>

<g fill="var(--accent)">
<circle cx="110" cy="200" r="4"/><circle cx="132" cy="200" r="4"/><circle cx="154" cy="200" r="4"/><circle cx="176" cy="200" r="4"/><circle cx="198" cy="200" r="4"/><circle cx="220" cy="200" r="4"/>
<circle cx="110" cy="222" r="4"/><circle cx="132" cy="222" r="4"/><circle cx="154" cy="222" r="4"/><circle cx="176" cy="222" r="4"/><circle cx="198" cy="222" r="4"/><circle cx="220" cy="222" r="4"/>
<circle cx="110" cy="244" r="4"/><circle cx="132" cy="244" r="4"/><circle cx="154" cy="244" r="4"/><circle cx="176" cy="244" r="4"/><circle cx="198" cy="244" r="4"/><circle cx="220" cy="244" r="4"/>
<circle cx="110" cy="266" r="4"/><circle cx="132" cy="266" r="4"/><circle cx="154" cy="266" r="4"/><circle cx="176" cy="266" r="4"/><circle cx="198" cy="266" r="4"/><circle cx="220" cy="266" r="4"/>
</g>
<g fill="var(--accent)" fill-opacity="0.55">
<circle cx="432" cy="215" r="8"/><circle cx="482" cy="215" r="8"/><circle cx="532" cy="215" r="8"/>
<circle cx="432" cy="255" r="8"/><circle cx="482" cy="255" r="8"/><circle cx="532" cy="255" r="8"/>
</g>
<rect x="722" y="205" width="100" height="60" rx="6" fill="var(--grey)" fill-opacity="0.45" stroke="var(--line)"/>

<text x="165" y="170" font-size="15" fill="var(--dim)" text-anchor="middle">24 個細節</text>
<text x="482" y="170" font-size="15" fill="var(--dim)" text-anchor="middle">6 個</text>
<text x="772" y="170" font-size="15" fill="var(--dim)" text-anchor="middle">1 句結論</text>

<text x="165" y="340" font-size="19" fill="var(--ink)" text-anchor="middle">親手做</text>
<text x="482" y="340" font-size="19" fill="var(--dim)" text-anchor="middle">聽人轉述</text>
<text x="772" y="340" font-size="19" fill="var(--dim)" text-anchor="middle">看報告</text>

<line x1="80" y1="440" x2="890" y2="440" stroke="var(--line)" stroke-width="2"/>
<polygon points="890,433 890,447 908,440" fill="var(--line)"/>
<text x="80" y="470" font-size="15" fill="var(--dim)">屋簷底下</text>
<text x="890" y="470" font-size="15" fill="var(--dim)" text-anchor="end">遠處</text>

<text x="480" y="536" font-size="22" fill="var(--ink)" text-anchor="middle">只有站在現場，才拿得到顆粒</text>
</svg>
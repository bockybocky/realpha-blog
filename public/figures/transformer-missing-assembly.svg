<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="散落的小零件收攏成一個完整方塊">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
</style>
<text class="t" x="60" y="62">零件都在，缺的是拼</text>
<text class="g" x="70" y="116">躺在文獻裡</text>

<rect x="70" y="140" width="130" height="52" fill="var(--accent)" opacity="0.18"/>
<rect x="70" y="140" width="130" height="52" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="84" y="173">注意力</text>

<rect x="230" y="150" width="120" height="48" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="244" y="180">並行訓練</text>
<rect x="90" y="226" width="120" height="48" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="104" y="256">長序列</text>
<rect x="250" y="246" width="120" height="48" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="264" y="276">正規化</text>
<rect x="80" y="316" width="120" height="48" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="94" y="346">位置編碼</text>
<rect x="240" y="336" width="120" height="48" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="254" y="366">暖身排程</text>
<rect x="120" y="406" width="120" height="48" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="134" y="436">學習率</text>

<path d="M400 290 L560 290" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M540 274 L562 290 L540 306" stroke="var(--accent)" stroke-width="3" fill="none"/>
<text class="s" x="400" y="268">研究品味</text>
<text class="s" x="400" y="332">海量小實驗</text>

<rect x="600" y="170" width="290" height="240" fill="var(--accent)" opacity="0.18"/>
<rect x="600" y="170" width="290" height="240" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="624" y="300">一個贏過當時最強的架構</text>
<text class="s" x="624" y="336">2017</text>
</svg>
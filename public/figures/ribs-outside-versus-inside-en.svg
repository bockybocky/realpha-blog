<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left the ribs ring the outside like a straight fence, while on the right they hug the inside of the cone wall.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">Ribs grown outside turn a cone into a cylinder</text>

<rect x="48" y="90" width="420" height="368" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="72" y="126" font-size="20" font-weight="700" fill="var(--warn)">Before</text>
<text x="444" y="126" font-size="16" text-anchor="end" fill="var(--dim)">Checks pass</text>
<path d="M 160 166 L 356 166 L 282 402 L 234 402 Z" fill="none" stroke="var(--grey)" stroke-width="2"/>
<g stroke="var(--warn)" stroke-width="4" stroke-linecap="round">
<line x1="140" y1="170" x2="140" y2="402"/>
<line x1="164" y1="170" x2="164" y2="402"/>
<line x1="188" y1="170" x2="188" y2="402"/>
<line x1="328" y1="170" x2="328" y2="402"/>
<line x1="352" y1="170" x2="352" y2="402"/>
<line x1="376" y1="170" x2="376" y2="402"/>
</g>
<text x="258" y="300" font-size="19" font-weight="700" text-anchor="middle" fill="var(--warn)">Fence</text>
<text x="258" y="434" font-size="15" text-anchor="middle" fill="var(--dim)">No clashes, no floating</text>

<rect x="492" y="90" width="420" height="368" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="516" y="126" font-size="20" font-weight="700" fill="var(--accent)">After</text>
<text x="888" y="126" font-size="16" text-anchor="end" fill="var(--dim)">One test added</text>
<path d="M 604 166 L 800 166 L 726 402 L 678 402 Z" fill="none" stroke="var(--grey)" stroke-width="2"/>
<g stroke="var(--accent)" stroke-width="4" stroke-linecap="round">
<line x1="612" y1="190" x2="684" y2="396"/>
<line x1="632" y1="190" x2="694" y2="396"/>
<line x1="772" y1="190" x2="710" y2="396"/>
<line x1="792" y1="190" x2="720" y2="396"/>
</g>
<line x1="624" y1="256" x2="780" y2="256" stroke="var(--accent)" stroke-width="1" stroke-dasharray="5 4"/>
<text x="702" y="246" font-size="16" text-anchor="middle" fill="var(--accent)">Inner dia.</text>
<text x="702" y="434" font-size="15" text-anchor="middle" fill="var(--dim)">Ribs within inner dia.</text>

<text x="48" y="506" font-size="22" font-weight="700" fill="var(--ink)">Checks only test whether parts pass through each other</text>
</svg>
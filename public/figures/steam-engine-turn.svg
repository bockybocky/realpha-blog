<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="垂直往復改成旋轉之後，分岔出紡織機、火車、輪船三條路">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <defs>
    <marker id="ar5" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="var(--accent)"/>
    </marker>
    <marker id="ar5b" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="var(--grey)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">垂直改成旋轉之後</text>

  <line x1="140" y1="170" x2="140" y2="400" stroke="var(--grey)" stroke-width="5" marker-end="url(#ar5b)"/>
  <line x1="140" y1="400" x2="140" y2="170" stroke="var(--grey)" stroke-width="5" marker-end="url(#ar5b)"/>
  <text class="t" x="140" y="440" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">抽礦坑水</text>
  <text class="t" x="140" y="466" font-size="16" fill="var(--dim)" text-anchor="middle">上下，幾十年</text>

  <path d="M330,380 A80,80 0 1 1 330,220" fill="none" stroke="var(--accent)" stroke-width="5" marker-end="url(#ar5)"/>
  <text class="t" x="400" y="300" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">旋轉</text>
  <text class="t" x="400" y="470" font-size="16" fill="var(--accent)" text-anchor="middle">機械上改一道</text>

  <line x1="510" y1="300" x2="620" y2="170" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar5)"/>
  <line x1="510" y1="300" x2="620" y2="300" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar5)"/>
  <line x1="510" y1="300" x2="620" y2="430" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar5)"/>

  <rect x="640" y="140" width="260" height="62" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="660" y="167" font-size="19" font-weight="700" fill="var(--ink)">紡織機</text>
  <text class="t" x="660" y="190" font-size="16" fill="var(--dim)">離開河邊，24 小時</text>

  <rect x="640" y="270" width="260" height="62" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="660" y="297" font-size="19" font-weight="700" fill="var(--ink)">火車</text>
  <text class="t" x="660" y="320" font-size="16" fill="var(--dim)">鐵軌寬＝馬車輪距</text>

  <rect x="640" y="400" width="260" height="62" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="660" y="427" font-size="19" font-weight="700" fill="var(--ink)">輪船</text>
  <text class="t" x="660" y="450" font-size="16" fill="var(--dim)">不等季風，不用划</text>

  <text class="t" x="60" y="545" font-size="22" fill="var(--ink)">現在大家每天在搞的，是左邊那台機器。</text>
</svg>
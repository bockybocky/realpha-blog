<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上方一條長時間條，下方短了約三倍的時間條，其中絕大部分是讀結構與文字辨識，判斷只佔末端一小段">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<defs><marker id="f6ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker></defs>
<text x="40" y="58" font-size="27" font-weight="700">判斷只花一瞬，時間卡在讀網頁</text>
<text x="180" y="194" font-size="19" text-anchor="end">Claude Opus</text>
<rect x="200" y="165" width="720" height="44" rx="6" fill="var(--grey)"/>
<text x="560" y="194" font-size="16" text-anchor="middle">看畫面＋推理</text>
<text x="180" y="304" font-size="19" text-anchor="end">Jev 系統</text>
<rect x="200" y="275" width="96" height="44" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="248" y="304" font-size="16" text-anchor="middle">讀結構</text>
<rect x="296" y="275" width="124" height="44" fill="var(--grey)"/>
<text x="358" y="304" font-size="16" text-anchor="middle">文字辨識</text>
<rect x="420" y="275" width="16" height="44" fill="var(--accent)"/>
<line x1="428" y1="252" x2="428" y2="270" stroke="var(--accent)" stroke-width="2"/>
<text x="428" y="244" font-size="16" font-weight="700" text-anchor="middle" style="fill:var(--accent)">Jev 判斷</text>
<text x="462" y="305" font-size="20" font-weight="700" style="fill:var(--accent)">只快約 3 倍</text>
<line x1="200" y1="370" x2="916" y2="370" stroke="var(--dim)" stroke-width="1.5" marker-end="url(#f6ah)"/>
<text x="200" y="396" font-size="16" style="fill:var(--dim)">時間</text>
<text x="920" y="400" font-size="15" text-anchor="end" style="fill:var(--dim)">長度為示意</text>
<text x="480" y="470" font-size="22" font-weight="700" text-anchor="middle">最慢那段決定整條線</text>
</svg>
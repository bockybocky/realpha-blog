<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三種買家出三個不同高度的價，第三根衝出可計算範圍的虛線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="60" y="68">誰在定價，決定那個倍數有沒有意義</text>

<line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="3"/>
<line x1="60" y1="200" x2="900" y2="200" stroke="var(--dim)" stroke-width="2" stroke-dasharray="10 9"/>
<text class="t b" x="700" y="190">你能算到這裡</text>

<rect x="110" y="330" width="170" height="100" rx="8" fill="var(--accent)"/>
<text class="t g" x="110" y="310">算現金流</text>
<text class="t b" x="110" y="464">報酬・利潤</text>

<rect x="400" y="260" width="170" height="170" rx="8" fill="var(--accent)" opacity="0.7"/>
<text class="t g" x="400" y="240">買稀缺</text>
<text class="t b" x="400" y="464">只有十一支隊</text>

<rect x="690" y="120" width="170" height="310" rx="8" fill="var(--warn)" opacity="0.9"/>
<text class="t g" x="690" y="100">買位置</text>
<text class="t b" x="690" y="464">場邊第一排</text>

<text class="t c" x="60" y="524">看到一個倍數，先問它是哪一種買家留下的</text>
</svg>
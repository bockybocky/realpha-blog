<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="An empty shell space inside the park is marked out, while the already-tooled cleanroom outside the park is excluded.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="52" font-size="27" fill="var(--ink)">What is actually leased</text>
<rect x="60" y="86" width="520" height="392" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="118" font-size="19" fill="var(--dim)">Terafab park</text>
<rect x="88" y="136" width="200" height="80" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="188" y="183" font-size="16" fill="var(--dim)" text-anchor="middle">Memory</text>
<rect x="328" y="136" width="200" height="80" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="428" y="183" font-size="16" fill="var(--dim)" text-anchor="middle">Logic</text>
<rect x="88" y="236" width="200" height="80" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="188" y="283" font-size="16" fill="var(--dim)" text-anchor="middle">Packaging</text>
<rect x="328" y="236" width="200" height="80" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="428" y="283" font-size="16" fill="var(--dim)" text-anchor="middle">Test</text>
<rect x="88" y="336" width="200" height="80" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="188" y="383" font-size="16" fill="var(--dim)" text-anchor="middle">Mask</text>
<rect x="328" y="336" width="200" height="80" rx="8" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 6"/>
<text x="428" y="370" font-size="16" fill="var(--accent)" text-anchor="middle">Empty shell space</text>
<text x="428" y="394" font-size="15" fill="var(--accent)" text-anchor="middle">Own tools installed</text>
<rect x="660" y="236" width="240" height="120" rx="10" fill="var(--page)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="780" y="288" font-size="16" fill="var(--dim)" text-anchor="middle">Already tooled</text>
<text x="780" y="312" font-size="16" fill="var(--dim)" text-anchor="middle">Cleanroom</text>
<text x="780" y="392" font-size="19" fill="var(--warn)" text-anchor="middle">Not leased</text>
<text x="780" y="180" font-size="19" fill="var(--accent)" text-anchor="middle">Leased</text>
<path d="M700 200 L760 200" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M528 376 L660 300" stroke="var(--line)" stroke-width="2" fill="none"/>
<text x="60" y="524" font-size="22" fill="var(--ink)">Space is leased, not someone else's fab</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="時間軸分成三段，第 0、120、240 格各釘一張起始照片">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="78" font-size="27" font-weight="700" fill="var(--ink)">一段影片，三個釘點</text>
  <rect x="80" y="150" width="266" height="120" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="346" y="150" width="266" height="120" rx="6" fill="var(--grey)" opacity="0.45"/>
  <rect x="612" y="150" width="268" height="120" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="213" y="200" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">第 1 天清晨</text>
  <text class="t" x="213" y="230" font-size="16" fill="var(--dim)" text-anchor="middle">冷白窗光</text>
  <text class="t" x="479" y="200" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">第 12 天深夜</text>
  <text class="t" x="479" y="230" font-size="16" fill="var(--warn)" text-anchor="middle">一盞吊燈</text>
  <text class="t" x="746" y="200" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">第 30 天白天</text>
  <text class="t" x="746" y="230" font-size="16" fill="var(--dim)" text-anchor="middle">明亮</text>
  <line x1="80" y1="330" x2="880" y2="330" stroke="var(--line)" stroke-width="4"/>
  <circle cx="80" cy="330" r="11" fill="var(--accent)"/>
  <circle cx="346" cy="330" r="11" fill="var(--accent)"/>
  <circle cx="612" cy="330" r="11" fill="var(--accent)"/>
  <text class="t" x="80" y="372" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">0</text>
  <text class="t" x="346" y="372" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">120</text>
  <text class="t" x="612" y="372" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">240</text>
  <text class="t" x="880" y="372" font-size="19" fill="var(--dim)" text-anchor="end">362 格</text>
  <text class="t" x="80" y="410" font-size="16" fill="var(--dim)">釘點＝一張事先生好的起始照片</text>
  <text class="t" x="80" y="478" font-size="22" font-weight="700" fill="var(--ink)">文字說「切到深夜」，照片說「切成這樣」</text>
</svg>
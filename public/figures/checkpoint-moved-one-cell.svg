<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩排相同的三格，亮起的格子從中間換到最左，表示檢查點移了一格">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.h { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:19px; fill:var(--ink); font-weight:700; }
.b { font-size:16px; fill:var(--dim); }
.w { font-size:16px; fill:var(--page); font-weight:700; }
.c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="h" x="60" y="72">檢查點換了一格</text>
<text class="g" x="60" y="150">過去幾季</text>
<rect x="60" y="176" width="250" height="96" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="340" y="176" width="250" height="96" fill="var(--accent)"/>
<rect x="620" y="176" width="250" height="96" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="80" y="232">主力營收增速</text>
<text class="w" x="360" y="226">自由現金流</text>
<text class="w" x="360" y="252">轉負也接受</text>
<text class="b" x="640" y="232">資本支出</text>
<text class="g" x="60" y="358">這一季</text>
<rect x="60" y="384" width="250" height="96" fill="var(--accent)"/>
<rect x="340" y="384" width="250" height="96" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="620" y="384" width="250" height="96" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="w" x="80" y="434">主力營收增速</text>
<text class="w" x="80" y="460">掉下來就罰</text>
<text class="b" x="360" y="440">自由現金流</text>
<text class="b" x="640" y="440">資本支出</text>
<path d="M 465 282 L 200 374" stroke="var(--accent)" stroke-width="4" fill="none" stroke-dasharray="10 8"/>
<path d="M 200 374 L 220 356 L 228 378 Z" fill="var(--accent)"/>
<text class="c" x="60" y="518">財報沒有不好，是盯的那一格換了</text>
</svg>
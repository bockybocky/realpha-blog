<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two lines spread apart to the right from the same starting point, the upper one steep and the lower one flat, forming a gap between them.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">Usage up, spend flat</text>
<line x1="150" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="420" x2="150" y2="110" stroke="var(--line)" stroke-width="2"/>
<path d="M150 400 C 360 380, 520 260, 760 150" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M150 400 C 380 392, 560 360, 760 330" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text x="776" y="146" font-size="19" fill="var(--ink)">Tokens</text>
<text x="776" y="336" font-size="19" fill="var(--dim)">Token spend</text>
<line x1="700" y1="186" x2="700" y2="342" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="688" y="268" font-size="16" fill="var(--dim)" text-anchor="end">Gap</text>
<text x="150" y="452" font-size="16" fill="var(--dim)">Time</text>
<text x="60" y="498" font-size="22" fill="var(--ink)">Use ≠ revenue</text>
</svg>
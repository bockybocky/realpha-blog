<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="同一個起點分出一條往上走和一條往下走的路徑，兩端的結果相反">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); font-weight:700; }
  .g { font-size:20px; fill:var(--ink); font-weight:700; }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="70" y="58">同一個前提，兩個相反的結果</text>
<rect x="70" y="240" width="170" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2" rx="8"/>
<text class="g" x="90" y="276">缺人</text>
<text class="b" x="90" y="302">派一個人幾十萬</text>
<path d="M240 266 C 330 266 330 170 420 170" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M420 170 l-14 -6 v12 z" fill="var(--accent)"/>
<path d="M240 294 C 330 294 330 390 420 390" fill="none" stroke="var(--warn)" stroke-width="4"/>
<path d="M420 390 l-14 -6 v12 z" fill="var(--warn)"/>
<g>
<rect x="436" y="138" width="124" height="62" fill="var(--card)" rx="6"/><text class="g" x="456" y="176">急單</text>
<rect x="580" y="138" width="124" height="62" fill="var(--card)" rx="6"/><text class="g" x="600" y="176">轉單</text>
<rect x="724" y="138" width="166" height="62" fill="var(--accent)" rx="6"/><text class="g" x="744" y="176" fill="var(--page)">毛利好</text>
</g>
<g>
<rect x="436" y="358" width="124" height="62" fill="var(--card)" rx="6"/><text class="g" x="456" y="396">交不出</text>
<rect x="580" y="358" width="124" height="62" fill="var(--card)" rx="6"/><text class="g" x="600" y="396">罰款</text>
<rect x="724" y="358" width="166" height="62" fill="var(--warn)" rx="6"/><text class="g" x="744" y="396" fill="var(--page)">認列遞延</text>
</g>
<text class="b" x="436" y="232">職缺還掛在台灣，就走不到上面那條</text>
<text class="c" x="70" y="476">人力短缺同時是定價權，也是成本</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="實體型平順上升，期貨型每月缺一小口，長期落後">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); }
  .g { font-size:20px; fill:var(--ink); }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">同樣是黃金，中間漏掉一點</text>

<line x1="120" y1="400" x2="890" y2="400" stroke="var(--line)" stroke-width="2"/>
<polyline points="130,380 300,320 470,268 640,214 860,160" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="700" y="140" fill="var(--accent)">實體型</text>
<text class="b" x="700" y="166">管理費＋倉儲</text>

<polyline points="130,380 215,352 215,368 300,342 300,358 385,332 385,348 470,322 470,338 555,312 555,328 640,302 640,318 725,294 725,310 860,268" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="g" x="700" y="352" fill="var(--warn)">期貨型</text>
<text class="b" x="700" y="378">每月換合約</text>

<text class="b" x="130" y="440">時間</text>
<text class="c" x="60" y="490">每個缺口都很小，累起來不小</text>
</svg>
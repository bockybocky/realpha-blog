<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Half the invested capital flows back along a return arrow; the other half feeds into a widening funnel.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="68">The capital walks back to you</text>
<rect x="100" y="150" width="400" height="60" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="150" width="200" height="60" rx="6" fill="var(--accent)" opacity="0.8"/>
<text class="g" x="100" y="134">Capital invested</text>
<text class="b" x="140" y="188" fill="var(--page)">Half</text>
<text class="b" x="352" y="188">Half</text>
<path d="M200,210 C200,300 120,300 90,250" fill="none" stroke="var(--accent)" stroke-width="5"/>
<path d="M90,250 l14,4 l-2,-16 z" fill="var(--accent)"/>
<text class="g" x="96" y="330">Back out quickly</text>
<text class="b" x="96" y="356">A notch less risk</text>
<path d="M400,210 L400,268" stroke="var(--grey)" stroke-width="5"/>
<path d="M330,268 L870,268 L740,420 L460,420 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="520" y="322">It can absorb heavy capex</text>
<text class="g" x="520" y="356">Regulated</text>
<text class="c" x="660" y="356">About 10%</text>
<text class="b" x="520" y="392">That was the near-zero rate era</text>
<text class="c" x="60" y="494">The half that stays is a pipe that can drink money</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊柱子停在一條水平天花板線下，右邊的方塊往上疊到超出畫面沒有盡頭">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<rect x="40" y="40" width="400" height="430" rx="10" fill="var(--card)"/>
<rect x="520" y="40" width="400" height="430" rx="10" fill="var(--card)"/>

<text class="t" x="70" y="84" font-size="20" font-weight="700" fill="var(--ink)">實體法：結果的底線</text>
<text class="t" x="550" y="84" font-size="20" font-weight="700" fill="var(--warn)">程序法：交卷的格式</text>

<line x1="80" y1="170" x2="400" y2="170" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="400" y="156" font-size="16" fill="var(--accent)" text-anchor="end">濃度上限</text>
<rect x="190" y="230" width="100" height="190" fill="var(--grey)"/>
<text class="t" x="240" y="214" font-size="16" fill="var(--dim)" text-anchor="middle">現況</text>
<text class="t" x="70" y="446" font-size="16" fill="var(--dim)">有數字 · 算得出成本</text>

<rect x="620" y="400" width="200" height="22" fill="var(--grey)"/>
<rect x="620" y="366" width="200" height="22" fill="var(--grey)"/>
<rect x="620" y="332" width="200" height="22" fill="var(--grey)"/>
<rect x="620" y="298" width="200" height="22" fill="var(--grey)"/>
<rect x="620" y="264" width="200" height="22" fill="var(--grey)"/>
<rect x="620" y="230" width="200" height="22" fill="var(--grey)"/>
<rect x="620" y="196" width="200" height="22" fill="var(--grey)" opacity="0.6"/>
<rect x="620" y="162" width="200" height="22" fill="var(--grey)" opacity="0.35"/>
<text class="t" x="720" y="134" font-size="22" font-weight="700" fill="var(--warn)" text-anchor="middle">⋯</text>
<text class="t" x="550" y="446" font-size="16" fill="var(--dim)">開放集合 · 漏一項作廢</text>

<text class="t" x="480" y="524" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">底線能花錢過，格式沒有上限</text>
</svg>
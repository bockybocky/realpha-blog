<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three horizontal bars from long to very short, the last so thin it is only a line.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:20px; fill:var(--ink); font-weight:600; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="48" y="58">The ceiling is a very thin line</text>
<text class="b" x="48" y="130">Global card volume</text>
<rect x="48" y="146" width="780" height="54" rx="6" fill="var(--grey)"/>
<text class="g" x="840" y="182">23T</text>
<text class="b" x="48" y="256">Take 60% as online</text>
<rect x="48" y="272" width="475" height="54" rx="6" fill="var(--grey)"/>
<text class="g" x="540" y="308">14T</text>
<text class="b" x="48" y="382">Times a 1% cut</text>
<rect x="48" y="398" width="6" height="54" rx="3" fill="var(--accent)"/>
<line x1="54" y1="425" x2="200" y2="425" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="212" y="432">140B</text>
<text class="c" x="48" y="498">Big, but not unimaginably big</text>
</svg>
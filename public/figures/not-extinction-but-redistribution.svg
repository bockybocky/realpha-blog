<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左側兩個方塊其中一個被打叉，右側五層長短不一的長條，顯示價值集中在中間幾層">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600;fill:var(--dim)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">不是消滅，是重新分配</text>
<text class="g" x="60" y="126">舊框架</text>
<rect x="60" y="150" width="150" height="104" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="78" y1="168" x2="192" y2="236" stroke="var(--grey)" stroke-width="4"/>
<line x1="192" y1="168" x2="78" y2="236" stroke="var(--grey)" stroke-width="4"/>
<text class="b" x="135" y="280" text-anchor="middle" fill="var(--grey)">軟體</text>
<rect x="240" y="150" width="150" height="104" rx="10" fill="var(--accent)" opacity="0.85"/>
<text class="b" x="315" y="280" text-anchor="middle">硬體</text>
<text class="b" x="60" y="330">一堆活，一堆死</text>
<line x1="460" y1="110" x2="460" y2="420" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="g" x="520" y="126">實際</text>
<text class="b" x="620" y="182" text-anchor="end">介面</text>
<rect x="630" y="164" width="60" height="26" rx="6" fill="var(--accent)" opacity="0.35"/>
<text class="b" x="620" y="227" text-anchor="end">應用</text>
<rect x="630" y="209" width="120" height="26" rx="6" fill="var(--accent)" opacity="0.5"/>
<text class="b" x="620" y="272" text-anchor="end">模型</text>
<rect x="630" y="254" width="200" height="26" rx="6" fill="var(--accent)" opacity="0.7"/>
<text class="b" x="620" y="317" text-anchor="end">產能</text>
<rect x="630" y="299" width="270" height="26" rx="6" fill="var(--accent)"/>
<text class="b" x="620" y="362" text-anchor="end">元件</text>
<rect x="630" y="344" width="215" height="26" rx="6" fill="var(--accent)" opacity="0.85"/>
<text class="b" x="630" y="410">同一條鏈，厚薄重新分配</text>
<text class="c" x="60" y="505">問的不是誰會死，是價值往哪一層集中</text>
</svg>
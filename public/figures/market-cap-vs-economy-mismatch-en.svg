<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three proportion bars: the US is two-thirds of global market value, one-fifth of the global economy, and commodities are a small stub in the index.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">Where the money is, where the stuff is</text>

<text x="60" y="148" font-size="19" fill="var(--dim)">Global stock market value</text>
<rect x="300" y="118" width="560" height="46" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="300" y="118" width="373" height="46" rx="6" fill="var(--accent)"/>
<text x="318" y="148" font-size="19" fill="var(--page)">US</text>
<text x="690" y="148" font-size="19" fill="var(--ink)">Two-thirds</text>

<text x="60" y="258" font-size="19" fill="var(--dim)">Global economy</text>
<rect x="300" y="228" width="560" height="46" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="300" y="228" width="112" height="46" rx="6" fill="var(--accent)"/>
<text x="428" y="258" font-size="19" fill="var(--ink)">One-fifth</text>

<text x="60" y="368" font-size="19" fill="var(--dim)">Oil, copper, gold in the index</text>
<rect x="300" y="338" width="560" height="46" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="300" y="338" width="34" height="46" rx="6" fill="var(--warn)"/>
<text x="350" y="368" font-size="19" fill="var(--ink)">Single digits</text>

<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="472" font-size="22" fill="var(--ink)">An index mirrors money, not the world</text>
</svg>
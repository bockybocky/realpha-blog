<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The inventory-growth bar extends far beyond the revenue-growth forecast bar, with a dashed box enclosing the gap between them.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Inventory growth outruns revenue growth</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">FY2000 10-K and next-quarter 10-Q</text>
<text x="215" y="198" font-size="16" fill="var(--dim)" text-anchor="end">Revenue growth forecast</text>
<rect x="230" y="168" width="280" height="44" fill="var(--grey)"/>
<text x="522" y="198" font-size="19" font-weight="700" fill="var(--ink)">50%</text>
<text x="215" y="288" font-size="16" fill="var(--dim)" text-anchor="end">Inventory growth that year</text>
<rect x="230" y="258" width="487" height="44" fill="var(--accent)"/>
<text x="729" y="288" font-size="19" font-weight="700" fill="var(--ink)">87%</text>
<text x="215" y="378" font-size="16" fill="var(--dim)" text-anchor="end">More growth next quarter</text>
<rect x="230" y="348" width="329" height="44" fill="var(--accent)"/>
<text x="571" y="378" font-size="19" font-weight="700" fill="var(--ink)">58.8%</text>
<line x1="510" y1="140" x2="510" y2="320" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="717" y1="140" x2="717" y2="320" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="510" y1="140" x2="717" y2="140" stroke="var(--warn)" stroke-width="2"/>
<text x="613" y="128" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">37 percentage points</text>
<text x="60" y="470" font-size="22" font-weight="700" fill="var(--ink)">This gap is a forecast bought with cash</text>
<text x="60" y="502" font-size="15" fill="var(--dim)">The filings show where the forecast sits—and who carries it</text>
</svg>
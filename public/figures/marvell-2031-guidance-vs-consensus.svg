<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="指引 800 億的長條遠長於共識 450 到 500 的短條，長條切成連接近五成、客製運算三成七與其餘">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="64" font-size="27" fill="var(--ink)">2031 年：指引與共識</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">單位：億美元</text>

<text x="60" y="176" font-size="20" fill="var(--ink)">共識</text>
<rect x="230" y="148" width="292" height="56" rx="4" fill="var(--grey)"/>
<rect x="522" y="148" width="33" height="56" rx="4" fill="var(--grey)" opacity="0.45"/>
<text x="572" y="184" font-size="19" fill="var(--dim)">450–500</text>

<text x="60" y="300" font-size="20" fill="var(--ink)">指引中值</text>
<rect x="230" y="268" width="260" height="64" rx="4" fill="var(--accent)"/>
<rect x="490" y="268" width="192" height="64" rx="4" fill="var(--accent)" opacity="0.62"/>
<rect x="682" y="268" width="68" height="64" rx="4" fill="var(--accent)" opacity="0.32"/>
<text x="772" y="308" font-size="20" fill="var(--accent)">800</text>

<text x="230" y="368" font-size="16" fill="var(--dim)">連接 近五成</text>
<text x="490" y="368" font-size="16" fill="var(--dim)">客製運算與小晶片 三成七</text>
<text x="682" y="392" font-size="16" fill="var(--dim)">其餘</text>

<line x1="555" y1="148" x2="555" y2="420" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="750" y1="268" x2="750" y2="420" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="555" y1="450" x2="750" y2="450" stroke="var(--warn)" stroke-width="3"/>
<text x="652" y="486" font-size="19" fill="var(--warn)" text-anchor="middle">上修空間</text>
</svg>
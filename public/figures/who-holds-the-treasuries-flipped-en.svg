<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two horizontal bars flip their proportions: the official-reserves segment shrinks while the private-sector segment grows.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="48" y="54" font-size="27" font-weight="700" fill="var(--ink)">Who buys Treasuries changed</text>
<text x="80" y="128" font-size="20" font-weight="700" fill="var(--dim)">Before</text>
<rect x="80" y="144" width="500" height="58" fill="var(--grey)"/>
<rect x="580" y="144" width="260" height="58" fill="var(--accent)"/>
<text x="104" y="180" font-size="16" fill="var(--page)">Official reserves</text>
<text x="604" y="180" font-size="16" fill="var(--page)">Private sector</text>
<text x="80" y="286" font-size="20" font-weight="700" fill="var(--ink)">Now</text>
<rect x="80" y="302" width="300" height="58" fill="var(--grey)"/>
<rect x="380" y="302" width="460" height="58" fill="var(--accent)"/>
<text x="104" y="338" font-size="16" fill="var(--page)">Official reserves</text>
<text x="404" y="338" font-size="16" fill="var(--page)">Private sector</text>
<text x="80" y="396" font-size="16" fill="var(--dim)">For reserves · Price-insensitive</text>
<text x="404" y="396" font-size="16" fill="var(--accent)">For returns · Rate-sensitive</text>
<text x="48" y="470" font-size="22" font-weight="700" fill="var(--ink)">Same bonds, different holders’ motives, more price movement</text>
</g>
</svg>
<svg id="fig-iltb-7" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩張走勢圖出貨量都上升，左圖價格線持平，右圖價格線同步走高">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
#fig-iltb-7 text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-iltb-7 .t { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-iltb-7 .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-iltb-7 .b { font-size:16px; fill:var(--dim); }
#fig-iltb-7 .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="52">滿載，不等於漲價</text>

<rect x="80" y="120" width="360" height="240" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="110" y1="150" x2="110" y2="330" stroke="var(--line)" stroke-width="2"/>
<line x1="110" y1="330" x2="415" y2="330" stroke="var(--line)" stroke-width="2"/>
<polyline points="110,315 190,288 270,240 350,205 410,188" fill="none" stroke="var(--grey)" stroke-width="4"/>
<polyline points="110,296 190,292 270,290 350,288 410,286" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="b" x="405" y="176" text-anchor="end">出貨量</text>
<text class="b" x="405" y="322" text-anchor="end" fill="var(--accent)">價格</text>
<text class="g" x="260" y="398" text-anchor="middle">只是在加班</text>

<rect x="520" y="120" width="360" height="240" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="550" y1="150" x2="550" y2="330" stroke="var(--line)" stroke-width="2"/>
<line x1="550" y1="330" x2="855" y2="330" stroke="var(--line)" stroke-width="2"/>
<polyline points="550,315 630,292 710,252 790,222 850,208" fill="none" stroke="var(--grey)" stroke-width="4"/>
<polyline points="550,296 630,268 710,214 790,178 850,160" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="b" x="845" y="232" text-anchor="end">出貨量</text>
<text class="b" x="845" y="148" text-anchor="end" fill="var(--accent)">價格</text>
<text class="g" x="700" y="398" text-anchor="middle">真的卡住的那一層</text>

<text class="c" x="60" y="470">供應吃緊，不等於有議價權</text>
</svg>
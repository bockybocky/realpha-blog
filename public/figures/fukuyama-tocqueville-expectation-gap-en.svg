<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two lines start from the same point when reform begins, with expectations rising steeply and delivery rising slowly, so the gap between them grows wider until the breaking point at the far right.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); font-size:16px; }
</style>
<text x="480" y="50" text-anchor="middle" style="font-size:27px;font-weight:700">Tocqueville</text>
<line x1="100" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
<path d="M260 420 C 400 360, 600 220, 860 120 L860 300 C 650 350, 450 400, 260 420 Z" fill="var(--warn)" opacity="0.15"/>
<line x1="110" y1="420" x2="260" y2="420" stroke="var(--grey)" stroke-width="5"/>
<path d="M260 420 C 450 400, 650 350, 860 300" fill="none" stroke="var(--accent)" stroke-width="6"/>
<path d="M260 420 C 400 360, 600 220, 860 120" fill="none" stroke="var(--warn)" stroke-width="6"/>
<line x1="260" y1="140" x2="260" y2="470" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="860" y1="120" x2="860" y2="300" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="872" y="126" style="font-size:20px;fill:var(--warn);font-weight:700">Aim</text>
<text x="872" y="306" style="font-size:20px;fill:var(--accent);font-weight:700">Got</text>
<text x="690" y="285" text-anchor="middle" style="font-size:20px;fill:var(--warn);font-weight:700">Gap</text>
<text x="845" y="100" text-anchor="end" style="font-size:19px;font-weight:700">Unrest</text>
<text x="180" y="400" text-anchor="middle" style="font-size:16px;fill:var(--dim)">Old</text>
<text x="260" y="500" text-anchor="middle" style="font-size:16px;fill:var(--dim)">Reform</text>
<text x="880" y="500" text-anchor="end" style="font-size:16px;fill:var(--dim)">Time →</text>
<text x="480" y="548" text-anchor="middle" style="font-size:22px;font-weight:700">Gap peaks mid-reform</text>
</svg>
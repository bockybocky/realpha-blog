<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A thick band flows from the cartel to the United States on top, and two half-width bands flow back below, one of cash and one of goods.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .a { fill:var(--accent); }
    .p { fill:var(--page); }
</style>
<text class="t" x="480" y="48" text-anchor="middle">Goods are money</text>
<text class="b" x="900" y="90" text-anchor="end">Unit: $100M/yr, illustrative</text>
<rect x="60" y="110" width="160" height="340" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="140" y="286" text-anchor="middle">Cartel</text>
<rect x="740" y="110" width="160" height="340" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="820" y="286" text-anchor="middle">U.S.</text>
<rect x="220" y="140" width="480" height="80" fill="var(--grey)"/>
<polygon points="700,120 740,180 700,240" fill="var(--grey)"/>
<text class="g" x="460" y="188" text-anchor="middle">Cocaine 500</text>
<rect x="260" y="290" width="480" height="40" fill="var(--grey)"/>
<polygon points="260,275 220,310 260,345" fill="var(--grey)"/>
<text class="g" x="500" y="317" text-anchor="middle">Cash 250</text>
<rect x="260" y="380" width="480" height="40" fill="var(--accent)"/>
<polygon points="260,365 220,400 260,435" fill="var(--accent)"/>
<text class="g p" x="500" y="407" text-anchor="middle">Goods 250</text>
<text class="b a" x="500" y="458" text-anchor="middle">Tractors · designer bags · $1M watches</text>
<text class="c" x="480" y="512" text-anchor="middle">Books balance: half cash, half goods</text>
</svg>
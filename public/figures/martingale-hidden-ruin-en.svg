<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A bar chart of bets doubling each round, with the first six below the dashed capital limit and the seventh breaking through it.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">Double after a loss: ruin hides in the last bar</text>

<line x1="70" y1="470" x2="890" y2="470" stroke="var(--line)" stroke-width="3"/>

<rect x="140" y="441" width="70" height="29" rx="4" fill="var(--accent)"/>
<rect x="242" y="435" width="70" height="35" rx="4" fill="var(--accent)"/>
<rect x="344" y="424" width="70" height="46" rx="4" fill="var(--accent)"/>
<rect x="446" y="403" width="70" height="67" rx="4" fill="var(--accent)"/>
<rect x="548" y="360" width="70" height="110" rx="4" fill="var(--accent)"/>
<rect x="650" y="273" width="70" height="197" rx="4" fill="var(--accent)"/>
<rect x="752" y="100" width="70" height="370" rx="4" fill="var(--warn)"/>

<text x="175" y="429" font-size="16" fill="var(--dim)" text-anchor="middle">$2</text>
<text x="277" y="423" font-size="16" fill="var(--dim)" text-anchor="middle">$4</text>
<text x="379" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">$8</text>
<text x="481" y="391" font-size="16" fill="var(--dim)" text-anchor="middle">$16</text>
<text x="583" y="348" font-size="16" fill="var(--dim)" text-anchor="middle">$32</text>
<text x="685" y="261" font-size="16" fill="var(--dim)" text-anchor="middle">$64</text>
<text x="787" y="88" font-size="16" fill="var(--warn)" text-anchor="middle">$128</text>

<line x1="90" y1="210" x2="890" y2="210" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="90" y="200" font-size="19" fill="var(--warn)">This is all the money you have</text>
<text x="787" y="180" font-size="19" fill="var(--page)" text-anchor="middle">Ruin</text>

<text x="175" y="498" font-size="16" fill="var(--ink)" text-anchor="middle">Bet 1</text>
<text x="277" y="498" font-size="16" fill="var(--ink)" text-anchor="middle">2</text>
<text x="379" y="498" font-size="16" fill="var(--ink)" text-anchor="middle">3</text>
<text x="481" y="498" font-size="16" fill="var(--ink)" text-anchor="middle">4</text>
<text x="583" y="498" font-size="16" fill="var(--ink)" text-anchor="middle">5</text>
<text x="685" y="498" font-size="16" fill="var(--ink)" text-anchor="middle">6</text>
<text x="787" y="498" font-size="16" fill="var(--warn)" text-anchor="middle">7</text>

<text x="480" y="538" font-size="22" fill="var(--ink)" text-anchor="middle">The risk never left; it just moved to the last bar</text>
</svg>
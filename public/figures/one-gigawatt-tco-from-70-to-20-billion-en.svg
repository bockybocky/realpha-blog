<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left a tall column labeled $70 billion, on the right a column less than a third as tall labeled $20 billion, with the difference in height between them labeled as margin stacked all along the way.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:700; fill:var(--ink); }
    .body { font-size:15px; fill:var(--dim); }
    .concl { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t title" x="60" y="56">One gigawatt, five years, what it costs</text>
  <line x1="80" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <rect x="160" y="120" width="130" height="320" fill="var(--grey)"/>
  <text class="t grp" x="160" y="106">Today: $70 billion</text>
  <rect x="620" y="348" width="130" height="92" fill="var(--accent)"/>
  <text class="t grp" x="620" y="334">What he wants: $20 billion</text>
  <rect x="620" y="120" width="130" height="228" fill="var(--card)" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="t grp" x="620" y="190">This part has to go</text>
  <text class="t body" x="620" y="216">Energy, plus margin stacked all the way up</text>
  <path d="M300 300 L600 300" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="612,300 594,292 594,308" fill="var(--grey)"/>
  <text class="t concl" x="80" y="500">From melting sand to tokens coming back, margin at every step</text>
</svg>
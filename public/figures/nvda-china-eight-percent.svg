<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條長條最右端的一小段被放大，裡面大部分不是資料中心">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="70" font-size="27" fill="var(--ink)">中國這條線的量體有多小</text>
<rect x="80" y="130" width="800" height="70" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="816" y="130" width="64" height="70" fill="var(--warn)"/>
<text x="90" y="173" font-size="19" fill="var(--ink)">上一季總營收</text>
<text x="700" y="117" font-size="16" fill="var(--warn)">中國含香港約 8%</text>
<line x1="816" y1="205" x2="300" y2="270" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="880" y1="205" x2="880" y2="270" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="300" y="270" width="580" height="90" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<rect x="300" y="270" width="470" height="90" fill="var(--grey)" opacity="0.55"/>
<rect x="866" y="270" width="14" height="90" fill="var(--accent)"/>
<text x="320" y="322" font-size="19" fill="var(--ink)">一大塊是遊戲與車用</text>
<text x="560" y="404" font-size="16" fill="var(--accent)">直接運進中國的資料中心，接近於零</text>
<line x1="873" y1="364" x2="860" y2="392" stroke="var(--accent)" stroke-width="2"/>
<text x="60" y="470" font-size="22" fill="var(--ink)">政策收緊改變的是溫度，不是明年的量</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A bar comparison in which the Roman two-thousand-year bar is far longer than the two short modern bars of one hundred and fifty years.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="56" font-size="27" fill="var(--ink)">Years it holds up: barely the same material</text>

<text x="40" y="150" font-size="19" fill="var(--ink)">Roman dome</text>
<rect x="40" y="166" width="840" height="56" rx="6" fill="var(--accent)"/>
<text x="60" y="203" font-size="19" fill="var(--page)">2,000 years, no cracks</text>

<text x="40" y="284" font-size="19" fill="var(--ink)">Modern, if lucky</text>
<rect x="40" y="300" width="42" height="56" rx="6" fill="var(--grey)"/>
<text x="100" y="337" font-size="19" fill="var(--dim)">100 years</text>

<text x="40" y="418" font-size="19" fill="var(--ink)">Modern, rated</text>
<rect x="40" y="434" width="21" height="56" rx="6" fill="var(--grey)"/>
<text x="100" y="471" font-size="19" fill="var(--dim)">50 years</text>

<line x1="40" y1="240" x2="880" y2="240" stroke="var(--line)" stroke-dasharray="5 6"/>
</g>
</svg>
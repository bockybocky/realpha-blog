<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A three-layer stratum diagram: the top layer's edge is jagged from erosion, and lower layers are thicker and erode more slowly">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">A moat of three layers</text>

<path d="M140 220 L140 136 L172 124 L204 136 L236 124 L268 136 L300 124 L332 136 L364 124 L396 136 L428 124 L460 136 L492 124 L524 136 L556 124 L588 136 L620 124 L652 136 L660 130 L660 220 Z" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="170" y="184" font-size="19" fill="var(--ink)">Software</text>
<text x="330" y="184" font-size="16" fill="var(--dim)">Ecosystem, learning cost</text>

<rect x="140" y="232" width="520" height="108" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="170" y="292" font-size="19" fill="var(--ink)">Physics</text>
<text x="330" y="292" font-size="16" fill="var(--dim)">Links, cooling</text>

<rect x="140" y="352" width="520" height="140" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="170" y="428" font-size="19" fill="var(--ink)">Capital</text>
<text x="330" y="428" font-size="16" fill="var(--dim)">Scale, toolchain</text>

<line x1="760" y1="150" x2="760" y2="462" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
<polygon points="760,476 753,460 767,460" fill="var(--dim)"/>
<text x="780" y="156" font-size="16" fill="var(--warn)">Fast</text>
<text x="780" y="316" font-size="16" fill="var(--dim)">Erosion rate</text>
<text x="780" y="470" font-size="16" fill="var(--dim)">Slow</text>

<text x="60" y="528" font-size="22" fill="var(--ink)">This news hits the top layer; two below untouched</text>
</svg>
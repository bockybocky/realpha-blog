<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two rulers side by side, the left measuring the drawdown and pointing at a person, the right measuring how many reasons are left and pointing at a company">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .t{font-size:27px;fill:var(--ink);font-weight:700}
    .g{font-size:19px;font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">Your ruler measures who?</text>
<text class="b" x="60" y="88">One measures pain, one the company</text>
<text class="g" x="80" y="150" fill="var(--dim)">Drawdown ruler</text>
<rect x="80" y="176" width="340" height="52" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<line x1="160" y1="176" x2="160" y2="204" stroke="var(--grey)" stroke-width="2"/>
<line x1="250" y1="176" x2="250" y2="204" stroke="var(--grey)" stroke-width="2"/>
<line x1="340" y1="176" x2="340" y2="204" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="160" y="222" text-anchor="middle">10%</text>
<text class="b" x="250" y="222" text-anchor="middle">20%</text>
<text class="b" x="340" y="222" text-anchor="middle">30%</text>
<line x1="250" y1="240" x2="250" y2="300" stroke="var(--grey)" stroke-width="3"/>
<path d="M250 310 L242 294 L258 294 Z" fill="var(--grey)"/>
<circle cx="250" cy="346" r="22" fill="var(--grey)"/>
<path d="M206 424 C 206 380 294 380 294 424 Z" fill="var(--grey)"/>
<text class="g" x="250" y="466" text-anchor="middle" fill="var(--dim)">Measures you</text>
<line x1="480" y1="130" x2="480" y2="440" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>
<text class="g" x="540" y="150" fill="var(--accent)">Reason ruler</text>
<rect x="540" y="176" width="340" height="52" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<line x1="626" y1="176" x2="626" y2="204" stroke="var(--accent)" stroke-width="2"/>
<line x1="710" y1="176" x2="710" y2="204" stroke="var(--accent)" stroke-width="2"/>
<line x1="794" y1="176" x2="794" y2="204" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="626" y="222" text-anchor="middle">3 left</text>
<text class="b" x="710" y="222" text-anchor="middle">2 left</text>
<text class="b" x="794" y="222" text-anchor="middle">1 left</text>
<line x1="710" y1="240" x2="710" y2="300" stroke="var(--accent)" stroke-width="3"/>
<path d="M710 310 L702 294 L718 294 Z" fill="var(--accent)"/>
<rect x="656" y="330" width="108" height="94" fill="var(--accent)"/>
<rect x="676" y="352" width="20" height="20" fill="var(--page)"/>
<rect x="724" y="352" width="20" height="20" fill="var(--page)"/>
<rect x="676" y="390" width="20" height="20" fill="var(--page)"/>
<rect x="724" y="390" width="20" height="20" fill="var(--page)"/>
<text class="g" x="710" y="466" text-anchor="middle" fill="var(--accent)">Measures it</text>
<text class="c" x="60" y="514">Only one? Take the right</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="訂單線先持平、股價線已下跌，傳導完之後訂單線才下彎">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t h" x="60" y="70">它答現在，股價賭以後</text>
<line x1="120" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="660" y1="120" x2="660" y2="420" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="t b" x="672" y="140">傳導完</text>
<path d="M120 200 L 660 200" fill="none" stroke="var(--grey)" stroke-width="5"/>
<path d="M660 200 C 740 206 790 280 880 360" fill="none" stroke="var(--grey)" stroke-width="5" stroke-dasharray="10 8"/>
<text class="t b" x="140" y="182">訪公司問到的訂單：沒有變化</text>
<path d="M120 240 C 260 260 420 330 660 370 C 760 384 820 390 880 394" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="t b" x="140" y="300">股價</text>
<text class="t c" x="60" y="490">中間那段落差，就是把供應鏈資訊降級的理由</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A two-axis grid of replacement time against remaining stock, with the bottom-right corner marked as the area that runs dry first.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">Which one runs out first</text>
<rect x="560" y="290" width="300" height="140" fill="var(--warn)" opacity="0.12"/>
<text x="710" y="336" text-anchor="middle" font-size="19" fill="var(--warn)">Runs dry first</text>
<line x1="160" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="160" y1="430" x2="160" y2="130" stroke="var(--line)" stroke-width="2"/>
<line x1="560" y1="130" x2="560" y2="430" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 6"/>
<line x1="160" y1="290" x2="880" y2="290" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="160" y="466" font-size="16" fill="var(--dim)">Months to replace</text>
<text x="880" y="466" text-anchor="end" font-size="16" fill="var(--dim)">Cannot be replaced</text>
<text x="520" y="500" text-anchor="middle" font-size="19" fill="var(--ink)">Time to replace one</text>
<text x="128" y="290" transform="rotate(-90 128 290)" text-anchor="middle" font-size="19" fill="var(--ink)">How much is left</text>
<circle cx="268" cy="200" r="9" fill="var(--accent)"/>
<text x="286" y="206" font-size="16" fill="var(--ink)">Money</text>
<circle cx="500" cy="248" r="9" fill="var(--accent)"/>
<text x="518" y="254" font-size="16" fill="var(--ink)">Time</text>
<circle cx="660" cy="206" r="9" fill="var(--accent)"/>
<text x="678" y="212" font-size="16" fill="var(--ink)">Energy</text>
<circle cx="766" cy="360" r="9" fill="var(--warn)"/>
<text x="784" y="366" font-size="16" fill="var(--ink)">Someone's patience</text>
<text x="880" y="152" text-anchor="end" font-size="15" fill="var(--dim)">Place them yourself; these are illustrative</text>
<text x="480" y="536" text-anchor="middle" font-size="22" fill="var(--ink)">Name the object first, then see which runs dry</text>
</svg>
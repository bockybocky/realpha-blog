<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two side-by-side loop diagrams: on the left the money circles back to its starting point between vendor and customer, on the right an extra arrow comes in from outside, standing for the company's own profit">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.n{font-size:16px;fill:var(--ink)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs>
<marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
</defs>
<text class="t" x="60" y="62">One deal, two shapes</text>
<rect x="60" y="110" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="260" y="152" text-anchor="middle" fill="var(--warn)">Circular</text>
<rect x="90" y="190" width="150" height="60" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="n" x="165" y="227" text-anchor="middle">Vendor</text>
<rect x="250" y="300" width="150" height="60" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="n" x="325" y="337" text-anchor="middle">Customer</text>
<path d="M245,228 C290,240 305,270 320,294" fill="none" stroke="var(--warn)" stroke-width="3" marker-end="url(#mw)"/>
<path d="M248,330 C200,330 170,302 166,258" fill="none" stroke="var(--warn)" stroke-width="3" marker-end="url(#mw)"/>
<text class="b" x="288" y="252">Invest</text>
<text class="b" x="182" y="316">Orders</text>
<rect x="500" y="110" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="700" y="152" text-anchor="middle" fill="var(--accent)">Outside cash</text>
<rect x="530" y="190" width="150" height="60" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="n" x="605" y="227" text-anchor="middle">Vendor</text>
<rect x="690" y="300" width="150" height="60" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="n" x="765" y="337" text-anchor="middle">Customer</text>
<path d="M685,228 C730,240 745,270 760,294" fill="none" stroke="var(--grey)" stroke-width="3" marker-end="url(#mw)"/>
<path d="M688,330 C640,330 610,302 606,258" fill="none" stroke="var(--grey)" stroke-width="3" marker-end="url(#mw)"/>
<text class="b" x="728" y="252">Invest</text>
<text class="b" x="622" y="316">Orders</text>
<path d="M884,268 L848,296" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#ma)"/>
<text class="g" x="890" y="248" text-anchor="end" fill="var(--accent)">Own profit</text>
<text class="c" x="60" y="472">Without it, still a business?</text>
</svg>
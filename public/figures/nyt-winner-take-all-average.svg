<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一根極高的柱與五根矮柱並排，同業平均虛線橫過，位置遠低於高柱、又高於所有矮柱">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="60" y="56" font-size="27" fill="var(--ink)">平均值不代表這裡的任何一家</text>

  <line x1="100" y1="430" x2="900" y2="430" stroke="var(--grey)" stroke-width="2"/>

  <rect x="130" y="150" width="86" height="280" rx="5" fill="var(--accent)"/>
  <rect x="258" y="370" width="86" height="60" rx="5" fill="var(--grey)"/>
  <rect x="386" y="385" width="86" height="45" rx="5" fill="var(--grey)"/>
  <rect x="514" y="395" width="86" height="35" rx="5" fill="var(--grey)"/>
  <rect x="642" y="400" width="86" height="30" rx="5" fill="var(--grey)"/>
  <rect x="770" y="405" width="86" height="25" rx="5" fill="var(--grey)"/>

  <line x1="100" y1="341" x2="900" y2="341" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="240" y="332" font-size="16" fill="var(--warn)">同業平均</text>

  <text x="173" y="462" font-size="16" fill="var(--ink)" text-anchor="middle">一站式入口</text>
  <text x="557" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">其他 · 地方報</text>

  <text x="480" y="522" font-size="22" fill="var(--ink)" text-anchor="middle">同一張表上，不是同一門生意</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three timeline rows run from zero to ten years, with dots and bars in each row representing different claims, and each row's spread is wider than the one above it.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="60" y="62" class="h">Same Q: 1 to 10 years</text>
<text x="300" y="112" class="b">Dots: claims</text>
<g stroke="var(--line)" stroke-width="1">
<line x1="300" y1="130" x2="300" y2="430"/><line x1="358" y1="130" x2="358" y2="430"/>
<line x1="416" y1="130" x2="416" y2="430"/><line x1="474" y1="130" x2="474" y2="430"/>
<line x1="532" y1="130" x2="532" y2="430"/><line x1="590" y1="130" x2="590" y2="430"/>
<line x1="648" y1="130" x2="648" y2="430"/><line x1="706" y1="130" x2="706" y2="430"/>
<line x1="764" y1="130" x2="764" y2="430"/><line x1="822" y1="130" x2="822" y2="430"/>
<line x1="880" y1="130" x2="880" y2="430"/>
</g>
<line x1="300" y1="430" x2="880" y2="430" stroke="var(--grey)" stroke-width="2"/>
<g class="b" text-anchor="middle">
<text x="300" y="456" class="b">0</text><text x="358" y="456" class="b">1</text>
<text x="416" y="456" class="b">2</text><text x="474" y="456" class="b">3</text>
<text x="532" y="456" class="b">4</text><text x="590" y="456" class="b">5</text>
<text x="648" y="456" class="b">6</text><text x="706" y="456" class="b">7</text>
<text x="764" y="456" class="b">8</text><text x="822" y="456" class="b">9</text>
<text x="880" y="456" class="b">10</text>
</g>
<text x="900" y="456" class="b">y</text>
<text x="270" y="177" text-anchor="end" class="g">Remote 1 mo</text>
<text x="270" y="277" text-anchor="end" class="g">10× output</text>
<text x="270" y="377" text-anchor="end" class="g">Tops pros</text>
<rect x="344" y="150" width="144" height="40" rx="20" fill="var(--card)"/>
<rect x="402" y="250" width="492" height="40" rx="20" fill="var(--card)"/>
<rect x="460" y="350" width="434" height="40" rx="20" fill="var(--card)"/>
<circle cx="358" cy="170" r="10" fill="var(--accent)"/>
<circle cx="474" cy="170" r="10" fill="var(--accent)"/>
<circle cx="416" cy="270" r="10" fill="var(--accent)"/>
<rect x="590" y="261" width="290" height="18" rx="9" fill="var(--accent)"/>
<rect x="474" y="361" width="58" height="18" rx="9" fill="var(--accent)"/>
<rect x="590" y="361" width="290" height="18" rx="9" fill="var(--accent)"/>
</svg>
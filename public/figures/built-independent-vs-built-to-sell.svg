<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="二乘二矩陣，四格中只有一格畫成向下的斷崖折線，其餘三格是平的">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="70">照哪套邏輯蓋，決定了沒人買的時候還剩什麼</text>
<text class="g" x="440" y="130" text-anchor="middle">為獨立而建</text>
<text class="g" x="740" y="130" text-anchor="middle">為被買而建</text>
<text class="g" x="60" y="235">有人來買</text>
<text class="g" x="60" y="395">沒人來買</text>
<rect x="290" y="150" width="300" height="150" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="600" y="150" width="300" height="150" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="290" y="310" width="300" height="150" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="600" y="310" width="300" height="150" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="b" x="440" y="200" text-anchor="middle">加分題</text>
<path d="M320 250 H560" stroke="var(--grey)" stroke-width="3"/>
<text class="b" x="740" y="200" text-anchor="middle">賣掉</text>
<path d="M630 250 H870" stroke="var(--grey)" stroke-width="3"/>
<text class="b" x="440" y="360" text-anchor="middle" fill="var(--accent)">自己走下去</text>
<path d="M320 410 H560" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="740" y="360" text-anchor="middle" fill="var(--warn)">走不下去</text>
<path d="M630 400 H730 L740 440 L760 448" stroke="var(--warn)" stroke-width="3" fill="none"/>
<text class="b" x="300" y="500">製造、通路、臨床關係在自己手上</text>
<text class="b" x="610" y="500">製造外包、通路不建、團隊只養到能講故事</text>
<text class="c" x="60" y="548">手上有活下去的能力，才有資格挑</text>
</svg>
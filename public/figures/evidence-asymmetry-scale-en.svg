<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The scale sinks on the solid-block side and rises on the dashed-block side, showing the two numbers are not backed by evidence of equal hardness.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); font-weight:700; }
  .g { font-size:20px; fill:var(--ink); font-weight:700; }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="70" y="60">The two sides of the subtraction differ in hardness</text>
<line x1="480" y1="150" x2="480" y2="410" stroke="var(--line)" stroke-width="6"/>
<line x1="200" y1="212" x2="760" y2="130" stroke="var(--ink)" stroke-width="5"/>
<circle cx="480" cy="171" r="9" fill="var(--ink)"/>
<line x1="200" y1="212" x2="200" y2="262" stroke="var(--line)" stroke-width="3"/>
<line x1="760" y1="130" x2="760" y2="180" stroke="var(--line)" stroke-width="3"/>
<rect x="110" y="262" width="180" height="92" fill="var(--grey)" rx="6"/>
<text class="g" x="128" y="302">6%</text>
<text class="b" x="128" y="330">Contract | verifiable</text>
<rect x="670" y="180" width="180" height="92" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 6" rx="6"/>
<text class="g" x="688" y="220">20%</text>
<text class="b" x="688" y="248">Self-reported | denominator hidden</text>
<text class="b" x="110" y="386">Depreciation life, transfer pricing, idle rate</text>
<text class="b" x="110" y="410">All on the books of the side spending the money</text>
<line x1="330" y1="400" x2="660" y2="266" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>
<text class="c" x="70" y="492">Nearly all the error comes from the light side</text>
</svg>
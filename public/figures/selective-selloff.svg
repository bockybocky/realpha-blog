<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四根向下柱子長度差極大，只有半導體設備那根探到最底">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" fill="var(--ink)">同一週的賣壓，挑過對象</text>
<line x1="60" y1="210" x2="900" y2="210" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="200" font-size="15" fill="var(--dim)">上週起點</text>

<text x="140" y="186" font-size="19" fill="var(--dim)">軟體股</text>
<rect x="140" y="210" width="120" height="36" fill="var(--grey)"/>
<text x="340" y="186" font-size="19" fill="var(--dim)">雲端大廠</text>
<rect x="340" y="210" width="120" height="58" fill="var(--grey)"/>
<text x="540" y="186" font-size="19" fill="var(--dim)">標普指數</text>
<rect x="540" y="210" width="120" height="50" fill="var(--grey)"/>
<text x="540" y="284" font-size="15" fill="var(--dim)">回落兩成半</text>

<text x="740" y="186" font-size="20" fill="var(--accent)">半導體設備</text>
<rect x="740" y="210" width="120" height="212" fill="var(--accent)"/>
<text x="740" y="448" font-size="16" fill="var(--accent)">連跌九天</text>
<text x="740" y="470" font-size="15" fill="var(--dim)">十年最長</text>
<text x="60" y="508" font-size="22" fill="var(--ink)">挑過對象的賣壓＝懷疑；不挑對象的才是恐懼</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="理論往後傳的時候，但書那一層掉了下去">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">傳開的是刪掉但書的那一版</text>

  <text class="t" x="60" y="130" font-size="19" font-weight="700" fill="var(--dim)">他私下想的</text>
  <rect x="60" y="150" width="280" height="70" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="200" y="193" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">比較利益</text>
  <rect x="60" y="226" width="280" height="70" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="200" y="269" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">但書：會餓死人</text>

  <path d="M370 196 H560" stroke="var(--line)" stroke-width="6" fill="none"/>
  <path d="M548 184 L574 196 L548 208 Z" fill="var(--line)"/>
  <text class="t" x="465" y="176" font-size="16" fill="var(--dim)" text-anchor="middle">出版</text>

  <text class="t" x="600" y="130" font-size="19" font-weight="700" fill="var(--dim)">後世拿到的</text>
  <rect x="600" y="150" width="280" height="70" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="740" y="193" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">比較利益</text>
  <rect x="600" y="226" width="280" height="70" rx="10" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="t" x="740" y="269" font-size="19" fill="var(--grey)" text-anchor="middle">空的</text>

  <path d="M740 300 V380" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 7" fill="none"/>
  <path d="M732 370 L740 392 L748 370 Z" fill="var(--warn)"/>
  <rect x="600" y="398" width="280" height="62" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="740" y="436" font-size="19" fill="var(--warn)" text-anchor="middle">私人信件</text>

  <text class="t" x="60" y="436" font-size="22" font-weight="700" fill="var(--ink)">但書沒有</text>
  <text class="t" x="60" y="468" font-size="22" font-weight="700" fill="var(--ink)">口號的形狀</text>
</svg>
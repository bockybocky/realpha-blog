<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三根曝險柱，前兩根一樣高，第三根明顯較低">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">砍出來的錢去哪，決定曝險有沒有真的降</text>

  <line x1="120" y1="410" x2="880" y2="410" stroke="var(--line)" stroke-width="3"/>

  <rect x="170" y="150" width="120" height="260" fill="var(--grey)"/>
  <text class="t" x="230" y="440" font-size="19" text-anchor="middle" fill="var(--ink)">原本</text>

  <rect x="420" y="150" width="120" height="260" fill="var(--warn)"/>
  <text class="t" x="480" y="440" font-size="19" text-anchor="middle" fill="var(--ink)">換到跑最快的</text>
  <text class="t" x="480" y="466" font-size="16" text-anchor="middle" fill="var(--warn)">只是換位置</text>

  <rect x="670" y="280" width="120" height="130" fill="var(--accent)"/>
  <text class="t" x="730" y="440" font-size="19" text-anchor="middle" fill="var(--ink)">扣著現金</text>
  <text class="t" x="730" y="466" font-size="16" text-anchor="middle" fill="var(--accent)">槓桿降一格</text>

  <line x1="810" y1="155" x2="810" y2="275" stroke="var(--ink)" stroke-width="2"/>
  <text class="t" x="825" y="220" font-size="19" fill="var(--ink)">降的這段</text>

  <text class="t" x="120" y="130" font-size="19" fill="var(--dim)">曝險</text>
  <text class="t" x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">他擔心的是急殺那天出不來</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="四個方塊組成回到原點的閉環，另有一條抄近路的箭頭被劃掉">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">繞回原點的門票</text>
<rect x="330" y="110" width="300" height="76" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="400" y="158" font-size="20" fill="var(--ink)">央行背書</text>
<rect x="660" y="262" width="250" height="76" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="684" y="310" font-size="20" fill="var(--ink)">先做財政整併</text>
<rect x="330" y="414" width="300" height="76" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="378" y="462" font-size="20" fill="var(--ink)">要有政治承諾</text>
<rect x="60" y="262" width="250" height="76" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="110" y="310" font-size="20" fill="var(--ink)">決策權碎裂</text>
<path d="M630 160 L690 250" fill="none" stroke="var(--grey)" stroke-width="5"/>
<path d="M674 244 L694 262 L668 266 Z" fill="var(--grey)"/>
<path d="M740 338 L640 410" fill="none" stroke="var(--grey)" stroke-width="5"/>
<path d="M650 396 L634 416 L628 392 Z" fill="var(--grey)"/>
<path d="M330 452 L220 346" fill="none" stroke="var(--grey)" stroke-width="5"/>
<path d="M232 356 L212 340 L236 332 Z" fill="var(--grey)"/>
<path d="M200 262 L330 164" fill="none" stroke="var(--warn)" stroke-width="5"/>
<path d="M320 178 L336 158 L342 182 Z" fill="var(--warn)"/>
<line x1="100" y1="196" x2="300" y2="226" stroke="var(--dim)" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="150" y1="188" x2="250" y2="236" stroke="var(--warn)" stroke-width="5"/>
<line x1="250" y1="188" x2="150" y2="236" stroke="var(--warn)" stroke-width="5"/>
<text x="60" y="540" font-size="16" fill="var(--dim)">近路：德國簽不下去</text>
</svg>
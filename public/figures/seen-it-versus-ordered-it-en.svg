<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The long blank between proof and the actual order is labeled as time cost.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  .h{font-size:27px;font-weight:700;fill:var(--ink)}
  .g{font-size:19px;font-weight:700;fill:var(--ink)}
  .b{font-size:16px;fill:var(--dim)}
  .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t h" x="60" y="68">Seeing it versus doing it</text>
<line x1="60" y1="300" x2="900" y2="300" stroke="var(--grey)" stroke-width="2"/>
<rect x="180" y="238" width="600" height="62" fill="var(--warn)" fill-opacity="0.1"/>
<path d="M200 300 L240 238 M240 300 L280 238 M280 300 L320 238 M320 300 L360 238 M360 300 L400 238 M400 300 L440 238 M440 300 L480 238 M480 300 L520 238 M520 300 L560 238 M560 300 L600 238 M600 300 L640 238 M640 300 L680 238 M680 300 L720 238 M720 300 L760 238" stroke="var(--warn)" stroke-width="1.2" opacity="0.7"/>
<circle cx="180" cy="300" r="9" fill="var(--accent)"/>
<circle cx="780" cy="300" r="9" fill="var(--accent)"/>
<text class="t g" x="84" y="200">Capability proven</text>
<text class="t b" x="84" y="226">Ukraine battlefield</text>
<text class="t g" x="700" y="200">Order placed</text>
<text class="t b" x="700" y="226">After the war began</text>
<text class="t g" x="380" y="360" fill="var(--warn)">Blank</text>
<text class="t b" x="300" y="392">Partnership yes, proof yes, orders no</text>
<text class="t c" x="60" y="462">That blank is the thesis's time cost</text>
</svg>
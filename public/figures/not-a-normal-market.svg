<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="上下兩格對比，一條會波動的價格線與一條被壓在成本線下的平坦價格線，後者旁邊的廠房逐一熄滅">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
  <text x="48" y="54" font-size="27" fill="var(--ink)">它不是一個正常運作的市場</text>

  <text x="48" y="116" font-size="19" fill="var(--ink)">石油</text>
  <text x="48" y="142" font-size="15" fill="var(--dim)">布蘭特・西德州</text>
  <polyline points="200,200 260,160 320,224 380,150 440,210 500,166 560,232 620,178 680,214 740,158 800,206 860,184"
            fill="none" stroke="var(--ink)" stroke-width="3"/>
  <line x1="200" y1="258" x2="860" y2="258" stroke="var(--line)" stroke-width="2"/>
  <text x="860" y="284" font-size="15" fill="var(--dim)" text-anchor="end">價格會上下</text>

  <line x1="48" y1="318" x2="912" y2="318" stroke="var(--line)" stroke-width="2"/>

  <text x="48" y="366" font-size="19" fill="var(--ink)">石墨・銅・鋁</text>
  <line x1="200" y1="372" x2="560" y2="372" stroke="var(--dim)" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="200" y="360" font-size="15" fill="var(--dim)">成本</text>
  <line x1="200" y1="432" x2="560" y2="432" stroke="var(--accent)" stroke-width="4"/>
  <text x="200" y="458" font-size="15" fill="var(--accent)">價格　二十年</text>

  <rect x="620" y="392" width="52" height="52" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
  <rect x="684" y="392" width="52" height="52" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
  <rect x="748" y="392" width="52" height="52" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="812" y="392" width="52" height="52" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="742" y="480" font-size="15" fill="var(--dim)" text-anchor="middle">廠一間間關掉</text>

  <text x="48" y="574" font-size="22" fill="var(--ink)">價格不由供需決定時，產業就會離開</text>
</svg>
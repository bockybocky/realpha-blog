<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three generation columns, each with a professional card below whose name contains 6000, showing similar names scattered across three generations.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="48" y="62">Similar names</text>
<rect x="60" y="110" width="240" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="180" y="148" text-anchor="middle">3090 gen</text>
<rect x="360" y="110" width="240" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="480" y="148" text-anchor="middle">4090 gen</text>
<rect x="660" y="110" width="240" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="780" y="148" text-anchor="middle">5090 gen</text>
<line x1="180" y1="170" x2="180" y2="260" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="480" y1="170" x2="480" y2="260" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="780" y1="170" x2="780" y2="260" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="60" y="260" width="240" height="90" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="180" y="298" text-anchor="middle">RTX A<tspan style="fill:var(--accent)">6000</tspan></text>
<text class="s" x="180" y="328" text-anchor="middle">48GB, BF16, no FP8</text>
<rect x="360" y="260" width="240" height="90" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="480" y="298" text-anchor="middle">RTX <tspan style="fill:var(--accent)">6000</tspan> (Ada)</text>
<text class="s" x="480" y="328" text-anchor="middle">Like a 48GB 4090</text>
<rect x="660" y="260" width="240" height="90" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="780" y="298" text-anchor="middle">RTX Pro <tspan style="fill:var(--accent)">6000</tspan></text>
<text class="s" x="780" y="328" text-anchor="middle">100k+ CNY</text>
<text class="c" x="48" y="440">A letter apart, a generation apart</text>
</svg>
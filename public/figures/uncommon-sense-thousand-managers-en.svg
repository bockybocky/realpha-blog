<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A grid of 1,000 grey dots with 31 scattered blue dots, showing that when 1,000 people flip coins for five years, about 31 win five years in a row">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .g { fill:var(--grey); }
    .w { fill:var(--accent); }
  </style>
  <defs>
    <pattern id="uc-dot" x="80" y="130" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="5" class="g"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="480" y="48" font-size="27" font-weight="700" text-anchor="middle">1,000 managers flip coins: after 5 years</text>
  <text x="480" y="84" font-size="16" fill="var(--dim)" text-anchor="middle">50% chance of making money each year</text>

  <rect x="80" y="130" width="800" height="320" fill="url(#uc-dot)"/>

  <g class="w">
    <circle cx="136" cy="170" r="6.5"/><circle cx="264" cy="138" r="6.5"/><circle cx="360" cy="218" r="6.5"/>
    <circle cx="472" cy="154" r="6.5"/><circle cx="584" cy="186" r="6.5"/><circle cx="696" cy="138" r="6.5"/>
    <circle cx="808" cy="202" r="6.5"/><circle cx="856" cy="282" r="6.5"/><circle cx="184" cy="266" r="6.5"/>
    <circle cx="312" cy="314" r="6.5"/><circle cx="408" cy="250" r="6.5"/><circle cx="520" cy="282" r="6.5"/>
    <circle cx="632" cy="234" r="6.5"/><circle cx="744" cy="298" r="6.5"/><circle cx="120" cy="362" r="6.5"/>
    <circle cx="232" cy="410" r="6.5"/><circle cx="344" cy="378" r="6.5"/><circle cx="456" cy="346" r="6.5"/>
    <circle cx="552" cy="426" r="6.5"/><circle cx="664" cy="378" r="6.5"/><circle cx="776" cy="394" r="6.5"/>
    <circle cx="840" cy="442" r="6.5"/><circle cx="168" cy="442" r="6.5"/><circle cx="280" cy="202" r="6.5"/>
    <circle cx="392" cy="330" r="6.5"/><circle cx="504" cy="394" r="6.5"/><circle cx="616" cy="330" r="6.5"/>
    <circle cx="728" cy="442" r="6.5"/><circle cx="792" cy="154" r="6.5"/><circle cx="216" cy="314" r="6.5"/>
    <circle cx="680" cy="266" r="6.5"/>
  </g>

  <circle cx="290" cy="495" r="6" class="g"/>
  <text x="306" y="501" font-size="19">969 lost money, moved on</text>
  <circle cx="570" cy="495" r="6.5" class="w"/>
  <text x="586" y="501" font-size="19" fill="var(--accent)" font-weight="700">31 won 5 years in a row</text>

  <text x="480" y="552" font-size="22" font-weight="700" text-anchor="middle">1000 ÷ 32 ≈ 31 "geniuses"</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四個方塊共用一根柱子；柱子一裂，四個一起傾倒">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .k { font-size:16px; }
</style>
<text class="t" x="60" y="64">四個名字，同一根柱子</text>
<text class="g" x="90" y="130">看起來分散</text>
<line x1="60" y1="446" x2="440" y2="446" stroke="var(--dim)" stroke-width="2"/>
<rect x="225" y="276" width="50" height="170" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<rect x="90" y="260" width="320" height="16" fill="var(--dim)"/>
<g fill="var(--card)" stroke="var(--accent)" stroke-width="2">
<rect x="95" y="198" width="68" height="60" rx="4"/>
<rect x="175" y="198" width="68" height="60" rx="4"/>
<rect x="255" y="198" width="68" height="60" rx="4"/>
<rect x="335" y="198" width="68" height="60" rx="4"/>
</g>
<text class="k" x="129" y="234" text-anchor="middle">封裝</text>
<text class="k" x="209" y="234" text-anchor="middle">載板</text>
<text class="k" x="289" y="234" text-anchor="middle">矽光子</text>
<text class="k" x="369" y="234" text-anchor="middle">測試</text>
<text class="b" x="250" y="475" text-anchor="middle">產能滿載＋人力補得上</text>
<line x1="480" y1="110" x2="480" y2="480" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="540" y="130">假設一鬆動</text>
<line x1="510" y1="446" x2="900" y2="446" stroke="var(--dim)" stroke-width="2"/>
<rect x="675" y="276" width="50" height="170" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<polyline points="700,276 688,310 710,340 692,372 706,405" fill="none" stroke="var(--warn)" stroke-width="3"/>
<g transform="rotate(12 700 268)">
<rect x="540" y="260" width="320" height="16" fill="var(--dim)"/>
<g fill="var(--card)" stroke="var(--accent)" stroke-width="2">
<rect x="545" y="198" width="68" height="60" rx="4"/>
<rect x="625" y="198" width="68" height="60" rx="4"/>
<rect x="705" y="198" width="68" height="60" rx="4"/>
<rect x="785" y="198" width="68" height="60" rx="4"/>
</g>
<text class="k" x="579" y="234" text-anchor="middle">封裝</text>
<text class="k" x="659" y="234" text-anchor="middle">載板</text>
<text class="k" x="739" y="234" text-anchor="middle">矽光子</text>
<text class="k" x="819" y="234" text-anchor="middle">測試</text>
</g>
<text class="b" x="700" y="475" text-anchor="middle" style="fill:var(--warn)">四個一起倒</text>
<text class="c" x="60" y="525">名字有四個，風險只有一筆</text>
</svg>
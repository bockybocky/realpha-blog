<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一資產兩把尺：利潤倍數量出較低的柱，營收倍數量出高兩倍多的柱">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="60" y="68">同一支車隊，換把尺就換個價</text>

<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="3"/>

<rect x="150" y="320" width="180" height="120" rx="8" fill="var(--accent)"/>
<text class="t g" x="150" y="300">四十六億英鎊</text>
<text class="t b" x="150" y="472">尺：利潤倍數</text>
<text class="t b" x="150" y="500">投資報酬・現金流</text>

<rect x="620" y="150" width="180" height="290" rx="8" fill="var(--warn)" opacity="0.9"/>
<text class="t g" x="620" y="130">一百至一百二十億</text>
<text class="t b" x="620" y="472">尺：營收倍數</text>
<text class="t b" x="620" y="500">別人成交價換算來的</text>

<rect x="390" y="300" width="180" height="76" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="412" y="334">資產沒變</text>
<text class="t b" x="412" y="362">營收・利潤率</text>
</svg>
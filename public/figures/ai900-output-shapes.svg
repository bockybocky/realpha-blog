<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="四格對照，每格左邊是同一份輸入、右邊是輸出的形狀：發票變成一整片文字流，或變成幾個帶標籤的欄位框；照片得到一個整張的標籤，或得到框住每個物件的多個框。">

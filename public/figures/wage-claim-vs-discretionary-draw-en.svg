<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The left side has a one-way arrow, while the right-side arrow curves back to its origin after going out.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">Same money, two legal forms</text>
<rect x="80" y="110" width="370" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="100" y="152" fill="var(--accent)">Admin assistant's wage</text>
<rect x="100" y="210" width="130" height="64" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="165" y="248" text-anchor="middle">Firm</text>
<rect x="300" y="210" width="130" height="64" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="365" y="248" text-anchor="middle">Assistant</text>
<line x1="236" y1="242" x2="282" y2="242" stroke="var(--accent)" stroke-width="4"/>
<polygon points="282,234 296,242 282,250" fill="var(--accent)"/>
<text class="b" x="265" y="226" text-anchor="middle">Debt</text>
<text class="b" x="100" y="346">Entitled · Once paid, it is theirs</text>
<rect x="490" y="110" width="390" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="510" y="152" fill="var(--warn)">Partner distribution</text>
<rect x="510" y="210" width="130" height="64" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="575" y="248" text-anchor="middle">Firm</text>
<rect x="740" y="210" width="130" height="64" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="805" y="248" text-anchor="middle">Partner</text>
<line x1="646" y1="228" x2="720" y2="228" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 7"/>
<polygon points="720,220 734,228 720,236" fill="var(--warn)"/>
<text class="b" x="690" y="212" text-anchor="middle">Optional</text>
<path d="M800,282 C780,318 690,324 660,296" fill="none" stroke="var(--warn)" stroke-width="4"/>
<polygon points="668,306 654,292 670,288" fill="var(--warn)"/>
<text class="b" x="730" y="344" text-anchor="middle">Clawback</text>
<text class="b" x="510" y="382">Paid while insolvent · Claw it back</text>
<text class="c" x="60" y="500">Legally, optional money paid out is a transfer</text>
</svg>
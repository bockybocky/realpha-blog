<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="After the model segment is halved, the overall time bar becomes only slightly shorter.">
<rect x="0" y="0" width="960" height="480" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--ink); }
    .p { font-size:16px; fill:var(--page); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="48" y="54">With a 2× faster model</text>
<text class="g" x="48" y="162">Today</text>
<rect x="190" y="130" width="209" height="64" fill="var(--accent)"/>
<rect x="399" y="130" width="511" height="64" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="p" x="294" y="170" text-anchor="middle">Model</text>
<text class="b" x="654" y="170" text-anchor="middle">Waiting on tools</text>
<text class="g" x="48" y="302">2× faster</text>
<rect x="190" y="270" width="104" height="64" fill="var(--accent)"/>
<rect x="294" y="270" width="511" height="64" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="805" y="270" width="105" height="64" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="b" x="549" y="310" text-anchor="middle">Waiting on tools (unchanged)</text>
<text class="d" x="857" y="364" text-anchor="middle" fill="var(--warn)">Time saved</text>
<line x1="910" y1="118" x2="910" y2="350" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="480" y="446" text-anchor="middle">At most a little over 10% saved</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩張左右分欄的紙並列，左邊那張左欄行數多右欄很少，右邊那張相反">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .t{font-size:27px;fill:var(--ink);font-weight:700}
    .g{font-size:19px;font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">兩欄的比例，就是那把尺</text>
<text class="b" x="60" y="88">左欄是你在等的條件，右欄是你做過的行為</text>
<rect x="70" y="126" width="380" height="286" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="260" y1="126" x2="260" y2="412" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="90" y="158">在等的條件</text>
<text class="b" x="280" y="158">做過的行為</text>
<g stroke="var(--grey)" stroke-width="6" stroke-linecap="round">
<line x1="92" y1="196" x2="238" y2="196"/><line x1="92" y1="228" x2="238" y2="228"/>
<line x1="92" y1="260" x2="238" y2="260"/><line x1="92" y1="292" x2="238" y2="292"/>
<line x1="92" y1="324" x2="238" y2="324"/><line x1="92" y1="356" x2="238" y2="356"/>
</g>
<g stroke="var(--accent)" stroke-width="6" stroke-linecap="round">
<line x1="282" y1="196" x2="428" y2="196"/>
</g>
<text class="g" x="70" y="452" fill="var(--dim)">你等的是運氣</text>
<rect x="510" y="126" width="380" height="286" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<line x1="700" y1="126" x2="700" y2="412" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="530" y="158">在等的條件</text>
<text class="b" x="720" y="158">做過的行為</text>
<g stroke="var(--grey)" stroke-width="6" stroke-linecap="round">
<line x1="532" y1="196" x2="678" y2="196"/><line x1="532" y1="228" x2="678" y2="228"/>
</g>
<g stroke="var(--accent)" stroke-width="6" stroke-linecap="round">
<line x1="722" y1="196" x2="868" y2="196"/><line x1="722" y1="228" x2="868" y2="228"/>
<line x1="722" y1="260" x2="868" y2="260"/><line x1="722" y1="292" x2="868" y2="292"/>
<line x1="722" y1="324" x2="868" y2="324"/><line x1="722" y1="356" x2="868" y2="356"/>
</g>
<text class="g" x="510" y="452" fill="var(--accent)">你已經在往前</text>
<text class="c" x="60" y="508">每三個月重寫一次，看右欄長多少</text>
</svg>
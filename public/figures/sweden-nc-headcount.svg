<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩組橫條：44 人縮成 22 人，63 人縮成 21 人">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .c { font-size:22px; font-weight:700; }
    .d { fill:var(--dim); }
    .a { fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="480" y="56" text-anchor="middle" class="t">瑞典兩家廠：換成 NC 後的人頭</text>
<rect x="140" y="88" width="18" height="18" fill="var(--grey)"/>
<text x="166" y="103" class="b">傳統機工</text>
<rect x="290" y="88" width="18" height="18" fill="var(--accent)"/>
<text x="316" y="103" class="b">NC 操作員</text>
<text x="140" y="165" class="g">車床廠</text>
<rect x="140" y="180" width="440" height="34" fill="var(--grey)"/>
<text x="590" y="204" class="g">44</text>
<rect x="140" y="222" width="220" height="34" fill="var(--accent)"/>
<text x="370" y="246" class="g a">22</text>
<text x="420" y="246" class="b d">少一半</text>
<text x="140" y="310" class="g">另一家廠</text>
<rect x="140" y="325" width="630" height="34" fill="var(--grey)"/>
<text x="780" y="349" class="g">63</text>
<rect x="140" y="367" width="210" height="34" fill="var(--accent)"/>
<text x="360" y="391" class="g a">21</text>
<text x="410" y="391" class="b d">少三分之二</text>
<text x="480" y="470" text-anchor="middle" class="c">拿掉的是「顧一台機器」這個動作</text>
<text x="480" y="512" text-anchor="middle" class="b d">1982 年瑞典工廠研究</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="保存年限的長條與循環次數的長條在調配方前後互換長短，說明這筆交換誰吃虧" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">保存年限換循環次數</text>
<text x="60" y="130" font-size="20" fill="var(--dim)">原本：跟硬碟搶飯碗</text>
<text x="300" y="172" font-size="15" fill="var(--dim)" text-anchor="end">保存年限</text>
<rect x="315" y="150" width="430" height="28" rx="4" fill="var(--accent)"/>
<text x="760" y="172" font-size="15" fill="var(--ink)">十年</text>
<text x="300" y="216" font-size="15" fill="var(--dim)" text-anchor="end">循環次數</text>
<rect x="315" y="194" width="120" height="28" rx="4" fill="var(--accent)"/>
<text x="450" y="216" font-size="15" fill="var(--ink)">一萬～十萬次</text>
<text x="315" y="256" font-size="15" fill="var(--warn)">KV 快取一兩個月就磨完</text>
<line x1="60" y1="290" x2="900" y2="290" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="340" font-size="20" fill="var(--accent)">調配方之後</text>
<text x="300" y="382" font-size="15" fill="var(--dim)" text-anchor="end">保存年限</text>
<rect x="315" y="360" width="110" height="28" rx="4" fill="var(--grey)"/>
<text x="440" y="382" font-size="15" fill="var(--ink)">讓出去</text>
<text x="300" y="426" font-size="15" fill="var(--dim)" text-anchor="end">循環次數</text>
<rect x="315" y="404" width="440" height="28" rx="4" fill="var(--accent)"/>
<text x="770" y="426" font-size="15" fill="var(--ink)">更耐熱</text>
<text x="60" y="500" font-size="22" fill="var(--ink)">說得出誰吃虧的，才是真的交換</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A main line reaches a node and splits into an upward branch and a downward branch.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <defs>
    <marker id="f9a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="f9b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--warn)"/>
    </marker>
  </defs>
  <text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">The fork is not the return, it is the wording</text>

  <line x1="90" y1="290" x2="400" y2="290" stroke="var(--dim)" stroke-width="6"/>
  <circle cx="420" cy="290" r="16" fill="var(--page)" stroke="var(--ink)" stroke-width="6"/>
  <text x="420" y="340" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">December 9</text>

  <path d="M 440 280 C 600 280 680 200 850 180" fill="none" stroke="var(--accent)" stroke-width="6" marker-end="url(#f9a)"/>
  <path d="M 440 300 C 600 300 680 390 850 420" fill="none" stroke="var(--warn)" stroke-width="6" marker-end="url(#f9b)"/>

  <text x="640" y="200" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Convincing</text>
  <text x="846" y="146" font-size="16" fill="var(--ink)" text-anchor="end">Rally keeps running</text>
  <text x="846" y="122" font-size="15" fill="var(--dim)" text-anchor="end">2 to 4 weeks</text>

  <text x="640" y="398" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Off-key</text>
  <text x="846" y="462" font-size="16" fill="var(--ink)" text-anchor="end">Mechanical selling returns</text>
  <text x="846" y="486" font-size="15" fill="var(--dim)" text-anchor="end">Funding gets pricier</text>

  <text x="60" y="152" font-size="16" fill="var(--dim)">Two bear cases, still unanswered</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two fractions compared, numerators the same size while the after panel's denominator is wider and the quotient smaller.">
<style>svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Denominator moved</text>
<rect x="70" y="106" width="350" height="320" fill="var(--card)"/>
<text x="96" y="146" font-size="20" fill="var(--ink)">Pre</text>
<rect x="110" y="178" width="270" height="56" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="245" y="212" font-size="16" fill="var(--ink)" text-anchor="middle">Buy·no supply</text>
<line x1="110" y1="258" x2="380" y2="258" stroke="var(--ink)" stroke-width="3"/>
<rect x="200" y="278" width="90" height="42" fill="var(--grey)"/>
<text x="245" y="306" font-size="16" fill="var(--ink)" text-anchor="middle">USD</text>
<rect x="190" y="356" width="110" height="34" fill="var(--accent)"/>
<text x="245" y="412" font-size="19" fill="var(--dim)" text-anchor="middle">Px</text>
<rect x="540" y="106" width="350" height="320" fill="var(--card)"/>
<text x="566" y="146" font-size="20" fill="var(--ink)">Now</text>
<rect x="580" y="178" width="270" height="56" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="715" y="212" font-size="16" fill="var(--ink)" text-anchor="middle">Buy·no supply</text>
<line x1="580" y1="258" x2="850" y2="258" stroke="var(--ink)" stroke-width="3"/>
<rect x="580" y="278" width="270" height="42" fill="var(--grey)"/>
<text x="715" y="306" font-size="16" fill="var(--ink)" text-anchor="middle">USD up</text>
<rect x="688" y="356" width="54" height="34" fill="var(--accent)"/>
<text x="715" y="412" font-size="19" fill="var(--dim)" text-anchor="middle">Px</text>
<line x1="440" y1="266" x2="516" y2="266" stroke="var(--accent)" stroke-width="3"/>
<polygon points="530,266 512,258 512,274" fill="var(--accent)"/>
<text x="60" y="516" font-size="22" fill="var(--ink)">Bull case ≠ the unit it's priced in</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左格兩支箭頭方向相反，右格兩支箭頭同時朝下。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="72" font-size="27" fill="var(--ink)">同樣是跌，來源不一樣</text>

  <rect x="60" y="120" width="390" height="300" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="84" y="160" font-size="20" fill="var(--dim)">需求衝擊</text>
  <line x1="170" y1="200" x2="170" y2="310" stroke="var(--ink)" stroke-width="7"/>
  <polygon points="153,306 187,306 170,348" fill="var(--ink)"/>
  <line x1="340" y1="348" x2="340" y2="238" stroke="var(--accent)" stroke-width="7"/>
  <polygon points="323,242 357,242 340,200" fill="var(--accent)"/>
  <text x="170" y="382" font-size="16" fill="var(--ink)" text-anchor="middle">股票</text>
  <text x="340" y="382" font-size="16" fill="var(--accent)" text-anchor="middle">債券</text>
  <text x="255" y="410" font-size="16" fill="var(--dim)" text-anchor="middle">互相抵銷</text>

  <rect x="510" y="120" width="390" height="300" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="534" y="160" font-size="20" fill="var(--dim)">供給衝擊</text>
  <line x1="620" y1="200" x2="620" y2="310" stroke="var(--ink)" stroke-width="7"/>
  <polygon points="603,306 637,306 620,348" fill="var(--ink)"/>
  <line x1="790" y1="200" x2="790" y2="310" stroke="var(--warn)" stroke-width="7"/>
  <polygon points="773,306 807,306 790,348" fill="var(--warn)"/>
  <text x="620" y="382" font-size="16" fill="var(--ink)" text-anchor="middle">股票</text>
  <text x="790" y="382" font-size="16" fill="var(--warn)" text-anchor="middle">債券</text>
  <text x="705" y="410" font-size="16" fill="var(--dim)" text-anchor="middle">一起往下</text>

  <text x="60" y="490" font-size="22" fill="var(--ink)">分散的單位不是名字，是背後推動它的那股力量</text>
</svg>
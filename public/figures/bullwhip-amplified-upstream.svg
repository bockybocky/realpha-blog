<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一個波從終端到最上游，振幅一層層放大">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="60" y="70">同一個延期，越往上游越大</text>
<line x1="280" y1="140" x2="900" y2="140" stroke="var(--line)" stroke-width="1"/>
<path d="M280 140 C 380 128 460 152 560 140 C 700 128 800 140 900 140" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text class="t g" x="60" y="146">終端</text>
<text class="t b" x="60" y="172">資料中心延 90 天</text>
<line x1="280" y1="250" x2="900" y2="250" stroke="var(--line)" stroke-width="1"/>
<path d="M280 250 C 380 220 460 284 560 250 C 700 212 800 256 900 250" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text class="t g" x="60" y="256">中游</text>
<line x1="280" y1="360" x2="900" y2="360" stroke="var(--line)" stroke-width="1"/>
<path d="M280 360 C 380 300 460 424 560 360 C 700 284 800 376 900 360" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="t g" x="60" y="366">上游</text>
<line x1="280" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="1"/>
<path d="M280 470 C 380 370 460 574 560 470 C 700 346 800 492 900 470" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="t g" x="60" y="476">最上游</text>
<text class="t b" x="60" y="502">漲價的理由先消失</text>
<text class="t c" x="280" y="540">交期縮短是大家照著反應的那根針</text>
</svg>
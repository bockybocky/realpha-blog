<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根堆疊柱：換成二十年尺度後總量變高，甲烷那一段由少數翻成多數">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="64">同一筆排放，換個尺度就變樣</text>

<line x1="200" y1="460" x2="860" y2="460" stroke="var(--line)" stroke-width="2"/>

<rect x="240" y="270" width="150" height="104" fill="var(--warn)"/>
<rect x="240" y="374" width="150" height="86" fill="var(--grey)"/>
<text class="g" x="315" y="244" text-anchor="middle">3.8 億噸</text>
<text class="n" x="315" y="492" text-anchor="middle">100 年當量</text>

<rect x="620" y="98" width="150" height="196" fill="var(--warn)"/>
<rect x="620" y="294" width="150" height="166" fill="var(--grey)"/>
<text class="g" x="695" y="72" text-anchor="middle">7.24 億噸</text>
<text class="n" x="695" y="492" text-anchor="middle">20 年當量</text>

<rect x="60" y="300" width="20" height="20" fill="var(--warn)"/>
<text class="n" x="90" y="317">甲烷</text>
<rect x="60" y="336" width="20" height="20" fill="var(--grey)"/>
<text class="n" x="90" y="353">二氧化碳</text>

<text class="c" x="60" y="536">那個「多一倍」裡面，藏著一個選擇</text>
</svg>
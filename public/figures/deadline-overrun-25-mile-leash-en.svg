<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Once the timeline passes its deadline, the person on the right is confined inside a circle labeled with a 25-mile radius.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">The state's own clock locks too</text>

<rect x="60" y="250" width="240" height="30" fill="var(--grey)"/>
<rect x="300" y="250" width="110" height="30" fill="var(--warn)"/>
<text class="t" x="180" y="236" font-size="16" fill="var(--dim)" text-anchor="middle">Statutory deadline</text>
<text class="t" x="355" y="236" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">60 days overdue</text>
<text class="t" x="180" y="312" font-size="16" fill="var(--dim)" text-anchor="middle">Normal review</text>

<path d="M430 265 L510 265" stroke="var(--warn)" stroke-width="3"/>
<path d="M510 265 l-14 -8 l0 16 z" fill="var(--warn)"/>

<circle cx="730" cy="265" r="150" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 7"/>
<circle cx="730" cy="265" r="14" fill="var(--accent)"/>
<line x1="730" y1="265" x2="880" y2="265" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="806" y="252" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">25 miles</text>
<text class="t" x="730" y="306" font-size="16" fill="var(--dim)" text-anchor="middle">Office site</text>
<text class="t" x="730" y="86" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Chief stays put</text>

<text class="t" x="480" y="500" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Delay should cost both sides too</text>
</svg>
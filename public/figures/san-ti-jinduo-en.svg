<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The three progress bars are full, half full, and empty, respectively.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="52" font-size="27" font-weight="700" fill="var(--ink)">One new theme, three separate questions</text>

<text x="60" y="142" font-size="20" fill="var(--ink)">Can it be made?</text>
<rect x="260" y="118" width="620" height="38" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="260" y="118" width="620" height="38" rx="6" fill="var(--accent)"/>

<text x="60" y="252" font-size="20" fill="var(--ink)">At scale?</text>
<rect x="260" y="228" width="620" height="38" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="260" y="228" width="300" height="38" rx="6" fill="var(--accent)"/>

<text x="60" y="362" font-size="20" fill="var(--ink)">Common standard?</text>
<rect x="260" y="338" width="620" height="38" rx="6" fill="var(--card)" stroke="var(--line)"/>

<text x="260" y="420" font-size="18" fill="var(--warn)">The stock price bets on this box</text>
<line x1="400" y1="408" x2="430" y2="384" stroke="var(--warn)" stroke-width="3"/>

<text x="60" y="478" font-size="22" font-weight="700" fill="var(--ink)">No one knows when the empty box will fill</text>
</svg>
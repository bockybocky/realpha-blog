<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="化工業曝險最長而就業減少最短，兩根長度相反的橫條指向一個標著囤人的方框">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="60">曝險最大的那一行，就業掉得最少</text>
<text class="g" x="60" y="150">化工業</text>
<text class="b" x="60" y="180">能源・中國曝險</text>
<rect x="250" y="124" width="430" height="40" rx="4" fill="var(--warn)" opacity="0.85"/>
<text class="g" x="700" y="152">最大</text>
<text class="g" x="60" y="276">化工業</text>
<text class="b" x="60" y="306">就業減少</text>
<rect x="250" y="250" width="96" height="40" rx="4" fill="var(--accent)" opacity="0.85"/>
<text class="g" x="366" y="278">最少</text>
<line x1="250" y1="196" x2="250" y2="236" stroke="var(--line)" stroke-width="1"/>
<path d="M700 186 C760 210 760 250 700 272" stroke="var(--grey)" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
<rect x="560" y="348" width="330" height="96" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="588" y="390">勞動市場卡住</text>
<text class="b" x="588" y="420">找不到合格技術工，先把人留著</text>
<path d="M420 320 L556 372" stroke="var(--ink)" stroke-width="3" fill="none"/>
<path d="M562 374 l-16 -3 l6 -12 z" fill="var(--ink)"/>
<text class="b" x="60" y="388">兩根對不上</text>
<text class="b" x="60" y="414">＝數字沒說完</text>
<text class="c" x="60" y="492">掉得少不等於沒事</text>
<text class="b" x="330" y="492">也可能是企業在囤人</text>
</svg>
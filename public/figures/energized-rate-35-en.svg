<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A rectangle is filled for only about its left third and left blank elsewhere, with the filled and blank parts labeled by whether they can collect money.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Signed doesn't mean energized</text>

<text class="t" x="60" y="128" font-size="19" font-weight="700" fill="var(--dim)">Contracted capacity</text>
<rect x="60" y="150" width="840" height="190" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="60" y="150" width="294" height="190" rx="12" fill="var(--accent)"/>
<text class="t" x="207" y="236" font-size="27" font-weight="700" fill="var(--page)" text-anchor="middle">35%</text>
<text class="t" x="207" y="272" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">Energized</text>
<text class="t" x="627" y="236" font-size="27" font-weight="700" fill="var(--warn)" text-anchor="middle">65%</text>
<text class="t" x="627" y="272" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Awaiting grid hookup</text>

<line x1="354" y1="360" x2="354" y2="398" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="398" font-size="19" font-weight="700" fill="var(--ink)">Rent gets collected</text>
<text class="t" x="394" y="398" font-size="19" font-weight="700" fill="var(--warn)">No cash coming in</text>
<text class="t" x="394" y="426" font-size="16" fill="var(--dim)">Prepayments hinge on on-time delivery</text>

<text class="t" x="480" y="486" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Leverage counts now, cash lags</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條橫條由短到長，獎金 100 萬美元最短，輸出 token 約 650 萬，總估算約 1,500 萬，約為獎金的 15 倍">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="56" class="t">一題的帳（萬美元）</text>
<text x="48" y="88" class="d">一萬個代理 × 88 小時</text>
<line x1="240" y1="130" x2="240" y2="400" stroke="var(--line)" stroke-width="2"/>
<text x="222" y="176" class="b" text-anchor="end">千禧年獎金</text>
<rect x="240" y="152" width="37" height="36" rx="3" fill="var(--grey)"/>
<text x="290" y="177" class="g">100</text>
<text x="240" y="212" class="d">2000 年定的價</text>
<text x="222" y="276" class="b" text-anchor="end">光輸出 token</text>
<rect x="240" y="252" width="243" height="36" rx="3" fill="var(--accent)" fill-opacity="0.5"/>
<text x="496" y="277" class="g">約 650</text>
<text x="222" y="376" class="b" text-anchor="end">網路總估算</text>
<rect x="240" y="352" width="560" height="36" rx="3" fill="var(--accent)"/>
<text x="812" y="377" class="g">約 1,500</text>
<text x="480" y="468" class="c" text-anchor="middle">總成本 ≈ 獎金 × 15</text>
</svg>
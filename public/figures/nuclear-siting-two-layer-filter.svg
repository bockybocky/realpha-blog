<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="由寬到窄的漏斗：排除條件把一部分直接剔出判死，迴避條件只把成本加上去，最後剩一小圈場址">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">兩種篩法，一個判死一個加價</text>

<rect x="200" y="110" width="440" height="60" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="420" y="148" font-size="19" fill="var(--ink)" text-anchor="middle">全美地圖，數億個小格</text>

<path d="M200 190 L640 190 L560 300 L280 300 Z" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="420" y="235" font-size="20" fill="var(--ink)" text-anchor="middle">排除條件</text>
<text class="t" x="420" y="265" font-size="15" fill="var(--dim)" text-anchor="middle">地震帶、不歡迎你的社區</text>

<path d="M640 230 L860 230" stroke="var(--warn)" stroke-width="3" fill="none" marker-end="url(#a3)"/>
<defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker></defs>
<text class="t" x="870" y="222" font-size="19" fill="var(--warn)" text-anchor="end">出局</text>

<path d="M280 320 L560 320 L470 430 L370 430 Z" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="420" y="360" font-size="20" fill="var(--ink)" text-anchor="middle">迴避條件</text>
<text class="t" x="420" y="390" font-size="15" fill="var(--dim)" text-anchor="middle">土壤、基岩、運輸、離線路多遠</text>

<path d="M560 360 L860 360" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#a4)"/>
<defs><marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>
<text class="t" x="870" y="352" font-size="19" fill="var(--accent)" text-anchor="end">算成本</text>

<circle cx="420" cy="490" r="46" fill="var(--accent)"/>
<text class="t" x="420" y="568" font-size="20" fill="var(--ink)" text-anchor="middle">畫得出圈的場址</text>
<text class="t" x="640" y="500" font-size="16" fill="var(--dim)">還要賣家願意賣</text>
</svg>
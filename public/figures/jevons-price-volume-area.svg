<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="面積圖：左邊高窄長方形代表降價前價格 1 乘用量 1；右邊矮寬長方形代表價格 0.2 乘用量 13，面積約為左邊的 2.6 倍。"><rect x="0" y="0" width="960" height="560" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:19px;font-weight:600}.b{font-size:16px;fill:var(--dim)}.k{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}
</style>
<text x="480" y="52" text-anchor="middle" class="t">降價 80%，用量 ×13：總收入反而變大</text>
<text x="115" y="165" text-anchor="middle" class="g">降價前</text>
<rect x="90" y="180" width="50" height="250" fill="var(--grey)"/>
<text x="80" y="196" text-anchor="end" class="b">價格 1</text>
<text x="115" y="462" text-anchor="middle" class="b">營收 1</text>
<text x="250" y="165" class="g a">降價 80% 後</text>
<rect x="250" y="180" width="50" height="250" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="250" y="380" width="650" height="50" fill="var(--accent)"/>
<text x="240" y="411" text-anchor="end" class="b">價格 0.2</text>
<text x="600" y="412" text-anchor="middle" class="g" style="fill:var(--page)">營收 2.6（推算）</text>
<line x1="80" y1="430" x2="910" y2="430" stroke="var(--line)" stroke-width="2"/>
<g stroke="var(--dim)" stroke-width="1.5">
<line x1="300" y1="430" x2="300" y2="438"/><line x1="350" y1="430" x2="350" y2="438"/><line x1="400" y1="430" x2="400" y2="438"/><line x1="450" y1="430" x2="450" y2="438"/><line x1="500" y1="430" x2="500" y2="438"/><line x1="550" y1="430" x2="550" y2="438"/><line x1="600" y1="430" x2="600" y2="438"/><line x1="650" y1="430" x2="650" y2="438"/><line x1="700" y1="430" x2="700" y2="438"/><line x1="750" y1="430" x2="750" y2="438"/><line x1="800" y1="430" x2="800" y2="438"/><line x1="850" y1="430" x2="850" y2="438"/><line x1="900" y1="430" x2="900" y2="438"/>
</g>
<text x="575" y="462" text-anchor="middle" class="b">用量 1 → 13</text>
<text x="480" y="520" text-anchor="middle" class="k">傑文斯悖論：越便宜，用得越兇</text>
</svg>
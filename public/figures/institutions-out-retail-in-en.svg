<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One stock in the middle, with the left arrow pointing out and the right arrow pointing in.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">Same week, two sides going opposite ways</text>
<rect x="390" y="200" width="180" height="140" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="424" y="278" font-size="22" fill="var(--ink)">This stock</text>
<line x1="380" y1="270" x2="210" y2="270" stroke="var(--warn)" stroke-width="4"/>
<polygon points="210,270 238,254 238,286" fill="var(--warn)"/>
<text x="76" y="244" font-size="20" fill="var(--ink)">Fund managers</text>
<text x="76" y="320" font-size="16" fill="var(--dim)">Tech overweight, one month</text>
<text x="76" y="344" font-size="16" fill="var(--dim)">Down 25 points</text>
<text x="76" y="368" font-size="16" fill="var(--dim)">Biggest since 2006</text>
<line x1="760" y1="270" x2="590" y2="270" stroke="var(--accent)" stroke-width="4"/>
<polygon points="590,270 618,254 618,286" fill="var(--accent)"/>
<text x="772" y="244" font-size="20" fill="var(--ink)">Retail</text>
<text x="772" y="320" font-size="16" fill="var(--dim)">Daily order imbalance</text>
<text x="772" y="344" font-size="16" fill="var(--dim)">Overwhelming buying</text>
<text x="772" y="368" font-size="16" fill="var(--dim)">Record buy amount</text>
<text x="60" y="462" font-size="22" fill="var(--ink)">Price is set by whether buyers or sellers outnumber</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根等長的橫條把同一天的負七趴拆成大盤與個股兩段，上面一根幾乎全是大盤，下面一根幾乎全是個股。" font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="80" y="56" font-size="27" font-weight="600" fill="var(--ink)">今天 −7%，有多少是這家公司的事</text>
  <text x="80" y="88" font-size="16" fill="var(--dim)">示意：同一根跌幅，拆成大盤與個股兩段</text>

  <text x="80" y="142" font-size="20" font-weight="600" fill="var(--ink)">情境 A</text>
  <text x="840" y="142" text-anchor="end" font-size="16" fill="var(--accent)">個股 −1%</text>
  <rect x="80" y="160" width="651" height="64" fill="var(--grey)"/>
  <rect x="731" y="160" width="109" height="64" fill="var(--accent)"/>
  <rect x="80" y="160" width="760" height="64" fill="none" stroke="var(--line)"/>
  <text x="405" y="199" text-anchor="middle" font-size="16" fill="var(--ink)">大盤 −6%</text>
  <text x="80" y="260" font-size="20" font-weight="600" fill="var(--ink)">論點不動</text>

  <text x="80" y="332" font-size="20" font-weight="600" fill="var(--ink)">情境 B</text>
  <rect x="80" y="350" width="109" height="64" fill="var(--grey)"/>
  <rect x="189" y="350" width="651" height="64" fill="var(--accent)"/>
  <rect x="80" y="350" width="760" height="64" fill="none" stroke="var(--line)"/>
  <text x="514" y="389" text-anchor="middle" font-size="16" fill="var(--page)">個股 −6%</text>
  <text x="80" y="452" font-size="15" fill="var(--dim)">大盤 −1%</text>
  <text x="840" y="452" text-anchor="end" font-size="20" font-weight="600" fill="var(--warn)">回頭重讀論點</text>

  <text x="480" y="498" text-anchor="middle" font-size="22" fill="var(--ink)">先分大盤還是個股，再決定動不動</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條成本曲線，平的那條是網路時代，往上陡翹的那條是 AI">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">多一個人，成本怎麼走</text>

  <line x1="150" y1="120" x2="150" y2="450" stroke="var(--line)" stroke-width="2"/>
  <line x1="150" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="150" y="105" font-size="16" fill="var(--dim)" text-anchor="middle">成本</text>
  <text class="t" x="880" y="480" font-size="16" fill="var(--dim)" text-anchor="end">使用人數</text>

  <path d="M170,400 L860,372" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <text class="t" x="860" y="350" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="end">網路時代</text>
  <text class="t" x="860" y="325" font-size="16" fill="var(--dim)" text-anchor="end">巴不得大家都來用</text>

  <path d="M170,420 C470,412 680,330 860,150" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text class="t" x="700" y="190" font-size="19" font-weight="700" fill="var(--accent)">AI</text>
  <text class="t" x="700" y="218" font-size="16" fill="var(--accent)">算力＋電力一起疊</text>

  <text class="t" x="60" y="525" font-size="22" fill="var(--ink)">所以現在的低價是補貼，不是技術變便宜。</text>
</svg>
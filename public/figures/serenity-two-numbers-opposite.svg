<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左側採購承諾由低跳高，右側淨動能曝險由高墜到接近零，兩者方向相反">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">同一週，兩個相反方向</text>
<rect x="60" y="96" width="400" height="384" rx="10" fill="var(--card)"/>
<rect x="500" y="96" width="400" height="384" rx="10" fill="var(--card)"/>
<text class="t" x="90" y="136" font-size="20" fill="var(--ink)">採購承諾</text>
<text class="t" x="530" y="136" font-size="20" fill="var(--ink)">淨動能曝險</text>
<line x1="90" y1="440" x2="430" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="530" y1="440" x2="870" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="130" y="300" width="80" height="140" fill="var(--grey)"/>
<rect x="300" y="190" width="80" height="250" fill="var(--accent)"/>
<text class="t" x="130" y="286" font-size="16" fill="var(--dim)">2,790 億美元</text>
<text class="t" x="300" y="176" font-size="16" fill="var(--accent)">3,900 億美元</text>
<path d="M226 292 L286 206" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M286 206 L270 216 L282 222 Z" fill="var(--accent)"/>
<rect x="570" y="200" width="80" height="240" fill="var(--grey)"/>
<rect x="740" y="408" width="80" height="32" fill="var(--dim)"/>
<text class="t" x="570" y="186" font-size="16" fill="var(--dim)">約六成</text>
<text class="t" x="740" y="394" font-size="16" fill="var(--ink)">8%</text>
<path d="M666 214 L726 396" stroke="var(--dim)" stroke-width="3" fill="none"/>
<path d="M726 396 L712 380 L704 392 Z" fill="var(--dim)"/>
<text class="t" x="130" y="466" font-size="16" fill="var(--dim)">簽字的量</text>
<text class="t" x="570" y="466" font-size="16" fill="var(--dim)">在場的錢</text>
<text class="t" x="60" y="526" font-size="22" fill="var(--ink)">一邊在加碼未來，一邊在撤出現場</text>
</svg>
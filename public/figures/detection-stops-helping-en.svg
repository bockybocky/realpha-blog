<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The left grid has only two lit dots and the right grid is fully lit.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .w { font-size:16px; fill:var(--warn); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <defs>
    <pattern id="dotsCold" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="7" fill="var(--line)"/>
    </pattern>
    <pattern id="dotsHot" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="7" fill="var(--warn)"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="68">Found, then?</text>

  <rect x="60" y="110" width="360" height="252" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="78" y="128" width="324" height="216" fill="url(#dotsCold)"/>
  <circle cx="132" cy="182" r="9" fill="var(--warn)"/>
  <circle cx="276" cy="290" r="9" fill="var(--warn)"/>
  <text class="g" x="60" y="398">Then: 1-2 hosts</text>
  <text class="d" x="60" y="430">See it, clear it</text>

  <rect x="540" y="110" width="360" height="252" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="558" y="128" width="324" height="216" fill="url(#dotsHot)"/>
  <text class="g" x="540" y="398">Now: 100s</text>
  <text class="w" x="540" y="430">Only: shut all</text>

  <text class="c" x="60" y="520">Banks: no</text>
</svg>
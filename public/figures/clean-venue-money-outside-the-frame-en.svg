<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Concentric circles: the centre field of play carries zero advertising, the outer ring holds back-of-house and sponsor visibility, and a leader line points outside the circle to broadcast rights.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600}
.b{font-size:16px}
.d{font-size:15px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">The money sits outside the frame</text>
<circle cx="420" cy="300" r="170" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="420" cy="300" r="85" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="420" y="294" text-anchor="middle">Field of play</text>
<text class="d" x="420" y="322" text-anchor="middle">Zero corporate ads</text>
<text class="b" x="420" y="172" text-anchor="middle">Back of house, athlete tunnels</text>
<text class="b" x="420" y="446" text-anchor="middle">Sponsor visibility lives here</text>
<line x1="556" y1="248" x2="700" y2="212" stroke="var(--line)" stroke-width="2"/>
<circle cx="556" cy="248" r="4" fill="var(--accent)"/>
<text class="b" x="712" y="208">Broadcast rights</text>
<text class="d" x="712" y="232">Sold years ago</text>
<text class="d" x="712" y="254">Signed to 2036</text>
<text class="c" x="60" y="530">Clean on camera, paid off camera</text>
</svg>
<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="上下兩條鏈路對比：原版經過雲端，本地版全部留在自己電腦裡">
    <defs><marker id="vm1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888888"/></marker></defs>
    <text x="20" y="30" font-family="sans-serif" font-size="15" font-weight="600" fill="#333333">原版（雲端直連）</text>
    <rect x="20" y="45" width="150" height="46" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="8"/><text x="95" y="73" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">瀏覽器插件</text>
    <rect x="230" y="45" width="150" height="46" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="8"/><text x="305" y="73" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">嵌入模型</text>
    <rect x="440" y="45" width="230" height="46" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/><text x="555" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">雲端向量儲存</text><text x="555" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">（看片紀錄離家）</text>
    <path d="M170,68 L228,68" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#vm1)"/><path d="M380,68 L438,68" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#vm1)"/>
    <text x="20" y="170" font-family="sans-serif" font-size="15" font-weight="600" fill="#333333">本地版（這次補上的那塊）</text>
    <rect x="20" y="185" width="150" height="46" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="8"/><text x="95" y="213" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">同一個插件</text>
    <rect x="230" y="185" width="180" height="46" fill="#eaf7ee" stroke="#27804a" stroke-width="1.5" rx="8"/><text x="320" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">自寫的本地伺服器</text><text x="320" y="224" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">（原本缺的第四隻腳）</text>
    <rect x="470" y="185" width="200" height="46" fill="#eaf7ee" stroke="#27804a" stroke-width="1.5" rx="8"/><text x="570" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">本地模型＋本地資料庫</text><text x="570" y="224" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">（資料不出門）</text>
    <path d="M170,208 L228,208" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#vm1)"/><path d="M410,208 L468,208" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#vm1)"/>
  </svg>

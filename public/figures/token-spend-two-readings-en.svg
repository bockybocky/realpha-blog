<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A three-step rising usage line forks at the right end into arrows for two opposite readings.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .k { font-size:22px; font-weight:700; fill:var(--accent); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70">One line, 2 reads</text>
  <text class="b" x="60" y="102">Tokens/person/day</text>

  <rect x="60" y="130" width="500" height="320" rx="12" fill="var(--card)"/>
  <line x1="110" y1="420" x2="530" y2="420" stroke="var(--grey)" stroke-width="2"/>

  <rect x="140" y="400" width="70" height="20" rx="4" fill="var(--accent)" opacity="0.4"/>
  <text class="b" x="140" y="390">1,000</text>
  <rect x="270" y="330" width="70" height="90" rx="4" fill="var(--accent)" opacity="0.7"/>
  <text class="b" x="270" y="318">7,000</text>
  <rect x="400" y="200" width="70" height="220" rx="4" fill="var(--accent)"/>
  <text class="g" x="390" y="186">23,000</text>
  <text class="b" x="140" y="448">Before</text>
  <text class="b" x="270" y="448">Essay</text>
  <text class="b" x="400" y="448">Day prior</text>

  <path d="M 570 260 C 650 260 660 210 740 200" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <path d="M 752 198 L 734 190 L 736 207 Z" fill="var(--accent)"/>
  <path d="M 570 300 C 650 300 660 350 740 362" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M 752 364 L 734 355 L 732 372 Z" fill="var(--warn)"/>

  <text class="g" x="760" y="190" fill="var(--accent)">Leaner</text>
  <text class="b" x="760" y="218">More per $</text>
  <text class="g" x="760" y="360" fill="var(--warn)">Costly</text>
  <text class="b" x="760" y="388">More to hold</text>

  <text class="k" x="60" y="520">Usage can't tell</text>
</svg>
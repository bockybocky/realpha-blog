<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根長短不同的上下雙向箭頭，長的對應 VIX 40、短的對應 VIX 30，兩端分別是上漲與下跌">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <defs>
    <marker id="f1a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">波動率體制：擺幅變大，不分方向</text>

  <rect x="150" y="150" width="240" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="570" y="150" width="240" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <line x1="80" y1="320" x2="880" y2="320" stroke="var(--line)" stroke-dasharray="6 6"/>
  <text x="84" y="312" font-size="15" fill="var(--dim)">不動</text>

  <line x1="270" y1="320" x2="270" y2="178" stroke="var(--accent)" stroke-width="10" marker-end="url(#f1a)"/>
  <line x1="270" y1="320" x2="270" y2="462" stroke="var(--accent)" stroke-width="10" marker-end="url(#f1a)"/>
  <line x1="690" y1="320" x2="690" y2="225" stroke="var(--accent)" stroke-width="10" marker-end="url(#f1a)"/>
  <line x1="690" y1="320" x2="690" y2="415" stroke="var(--accent)" stroke-width="10" marker-end="url(#f1a)"/>

  <text x="270" y="135" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">VIX 40</text>
  <text x="690" y="135" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">VIX 30</text>
  <text x="270" y="520" font-size="16" fill="var(--dim)" text-anchor="middle">每天 ±3% 出頭</text>
  <text x="690" y="520" font-size="16" fill="var(--dim)" text-anchor="middle">每天 ±2%</text>

  <text x="420" y="196" font-size="16" fill="var(--dim)">上漲崩盤</text>
  <text x="420" y="452" font-size="16" fill="var(--dim)">暴跌</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="One core capability branches out to the right into three paths, the shortest taking only a little over a year, and the most unexpected one turning from aerospace certification toward drones.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .w { font-size:19px; font-weight:700; fill:var(--warn); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="80" y="66">One capability, three branches</text>
  <rect x="80" y="240" width="190" height="110" rx="8" fill="var(--accent)"/>
  <text x="175" y="288" text-anchor="middle" font-family="Noto Sans TC,Microsoft JhengHei,PingFang TC,sans-serif" font-size="19" font-weight="700" fill="var(--page)">Anti-static</text>
  <text x="175" y="316" text-anchor="middle" font-family="Noto Sans TC,Microsoft JhengHei,PingFang TC,sans-serif" font-size="19" font-weight="700" fill="var(--page)">Dispersion uniformity</text>
  <text class="b" x="175" y="376" text-anchor="middle">Four years on IC carriers</text>
  <path d="M270 268 C 360 180, 420 150, 520 150" fill="none" stroke="var(--line)" stroke-width="4"/>
  <rect x="520" y="118" width="200" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="620" y="156" text-anchor="middle">IC carriers</text>
  <text class="b" x="740" y="156">In under 1.5 yrs</text>
  <path d="M270 295 C 380 295, 430 295, 520 295" fill="none" stroke="var(--line)" stroke-width="4"/>
  <rect x="520" y="263" width="200" height="64" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="620" y="301" text-anchor="middle">Backup battery modules</text>
  <text class="b" x="740" y="301">Heat + fire block</text>
  <path d="M270 322 C 360 410, 420 440, 520 440" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <rect x="520" y="408" width="190" height="64" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text class="w" x="615" y="446" text-anchor="middle">Aerospace certification</text>
  <path d="M710 440 C 760 440, 770 500, 820 500" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="8 6"/>
  <text class="w" x="820" y="508">Drones</text>
  <text class="b" x="520" y="534">Not laid for this one</text>
</svg>
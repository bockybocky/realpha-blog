<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩組長條：左邊三根幾乎等高，右邊三根高低懸殊，最矮的是中間那個模型">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--dim); }
    .n { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56">同樣三個模型，換一把尺就換一種形狀</text>

  <rect x="60" y="90" width="400" height="400" rx="14" fill="var(--card)"/>
  <rect x="500" y="90" width="400" height="400" rx="14" fill="var(--card)"/>

  <text class="g" x="88" y="128">聰明程度</text>
  <text class="g" x="528" y="128">一次工作燒掉的量</text>

  <line x1="88" y1="440" x2="436" y2="440" stroke="var(--line)" stroke-width="2"/>
  <line x1="528" y1="440" x2="876" y2="440" stroke="var(--line)" stroke-width="2"/>

  <rect x="100" y="170" width="70" height="270" fill="var(--grey)"/>
  <rect x="212" y="175" width="70" height="265" fill="var(--grey)"/>
  <rect x="324" y="188" width="70" height="252" fill="var(--grey)"/>
  <text class="n" x="135" y="160" text-anchor="middle">60</text>
  <text class="n" x="247" y="165" text-anchor="middle">59</text>
  <text class="n" x="359" y="178" text-anchor="middle">56</text>
  <text class="s" x="135" y="466" text-anchor="middle">Fable 5</text>
  <text class="s" x="247" y="466" text-anchor="middle">GPT-5.6</text>
  <text class="s" x="359" y="466" text-anchor="middle">Opus 4.8</text>

  <rect x="540" y="222" width="70" height="218" fill="var(--grey)"/>
  <rect x="652" y="341" width="70" height="99" fill="var(--accent)"/>
  <rect x="764" y="170" width="70" height="270" fill="var(--grey)"/>
  <text class="n" x="575" y="212" text-anchor="middle">3.3 萬</text>
  <text class="n" x="687" y="331" text-anchor="middle">1.5 萬</text>
  <text class="n" x="799" y="160" text-anchor="middle">4.1 萬</text>
  <text class="s" x="575" y="466" text-anchor="middle">Fable 5</text>
  <text class="s" x="687" y="466" text-anchor="middle">GPT-5.6</text>
  <text class="s" x="799" y="466" text-anchor="middle">Opus 4.8</text>

  <text class="c" x="60" y="534">差不多的聰明，差一倍的花費</text>
</svg>
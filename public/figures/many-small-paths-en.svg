<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A tall bar on the left sends out twenty thin lines that fan out and all point to the same box on the right">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">Twenty paths, each only 5%</text>
<rect x="100" y="150" width="70" height="280" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="135" y="464" font-size="19" fill="var(--accent)" text-anchor="middle">At the top</text>
<g stroke="var(--grey)" stroke-width="1">
<line x1="176" y1="290" x2="592" y2="150"/>
<line x1="176" y1="290" x2="592" y2="165"/>
<line x1="176" y1="290" x2="592" y2="180"/>
<line x1="176" y1="290" x2="592" y2="194"/>
<line x1="176" y1="290" x2="592" y2="209"/>
<line x1="176" y1="290" x2="592" y2="224"/>
<line x1="176" y1="290" x2="592" y2="238"/>
<line x1="176" y1="290" x2="592" y2="253"/>
<line x1="176" y1="290" x2="592" y2="268"/>
<line x1="176" y1="290" x2="592" y2="283"/>
<line x1="176" y1="290" x2="592" y2="297"/>
<line x1="176" y1="290" x2="592" y2="312"/>
<line x1="176" y1="290" x2="592" y2="327"/>
<line x1="176" y1="290" x2="592" y2="342"/>
<line x1="176" y1="290" x2="592" y2="356"/>
<line x1="176" y1="290" x2="592" y2="371"/>
<line x1="176" y1="290" x2="592" y2="386"/>
<line x1="176" y1="290" x2="592" y2="400"/>
<line x1="176" y1="290" x2="592" y2="415"/>
<line x1="176" y1="290" x2="592" y2="430"/>
</g>
<rect x="600" y="180" width="290" height="220" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="745" y="272" font-size="20" fill="var(--warn)" text-anchor="middle">None of them happens</text>
<text x="745" y="322" font-size="22" fill="var(--ink)" text-anchor="middle">Under 40% odds</text>
<text x="480" y="516" font-size="22" fill="var(--ink)" text-anchor="middle">The danger isn't which path, it's how many</text>
</svg>
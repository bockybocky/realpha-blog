<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two stacked bars with cost segments of equal height, where the margin segment grows from 1 to 9 after the price hike and fills almost the whole bar.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
    .p { fill:var(--page); }
</style>
<text x="60" y="52" class="t">Price×5, cost×1</text>
<rect x="300" y="456" width="120" height="34" fill="var(--grey)"/>
<rect x="300" y="422" width="120" height="34" fill="var(--accent)"/>
<rect x="580" y="456" width="120" height="34" fill="var(--grey)"/>
<rect x="580" y="150" width="120" height="306" fill="var(--accent)"/>
<line x1="220" y1="456" x2="780" y2="456" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="790" y="461" class="d">Flat</text>
<text x="360" y="410" class="g" text-anchor="middle">Price 2</text>
<text x="640" y="138" class="g" text-anchor="middle">Price 10</text>
<text x="430" y="445" class="b a">Gap 1</text>
<text x="640" y="310" class="g p" text-anchor="middle">Gap 9</text>
<text x="290" y="479" class="b" text-anchor="end">Cost 1</text>
<text x="570" y="479" class="b" text-anchor="end">Cost 1</text>
<line x1="260" y1="490" x2="740" y2="490" stroke="var(--line)" stroke-width="2"/>
<text x="360" y="518" class="g" text-anchor="middle">Old</text>
<text x="640" y="518" class="g" text-anchor="middle">New</text>
<text x="480" y="560" class="c" text-anchor="middle">Extra gap → profit</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two groups of downward bars, with the dashed one on the right much longer than the solid ones and ending in a question mark." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="80" y="54" font-size="27" font-weight="700" fill="var(--ink)">One market, two kinds of fall</text>

  <text x="285" y="112" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Crowded positioning . July</text>
  <text x="700" y="112" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Fundamentals break . ahead</text>

  <line x1="80" y1="150" x2="880" y2="150" stroke="var(--line)" stroke-width="3"/>
  <text x="80" y="142" font-size="15" fill="var(--dim)">Start of the fall</text>

  <rect x="190" y="150" width="90" height="112" fill="var(--accent)" rx="4"/>
  <text x="235" y="286" font-size="15" fill="var(--dim)" text-anchor="middle">Small and mid index</text>
  <text x="235" y="308" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">-30%</text>

  <rect x="320" y="150" width="90" height="205" fill="var(--accent)" rx="4"/>
  <text x="365" y="379" font-size="15" fill="var(--dim)" text-anchor="middle">Single names</text>
  <text x="365" y="401" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">-50 to -60%</text>

  <rect x="610" y="150" width="180" height="300" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="700" y="330" font-size="60" font-weight="700" fill="var(--warn)" text-anchor="middle">?</text>
  <text x="700" y="480" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">Several times this</text>

  <text x="480" y="524" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">July was a rehearsal, not a disaster</text>
</svg>
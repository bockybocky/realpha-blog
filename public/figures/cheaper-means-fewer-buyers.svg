<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條從左上往右下滑落的曲線，橫軸越往右越便宜，縱軸是買得下手的人，曲線在最便宜處貼近零，旁邊標著想買沒錢、套在山上、沒信心"><rect x="0" y="0" width="960" height="560" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style><g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'><text x="60" y="58" font-size="27px" fill="var(--ink)" text-anchor="start" font-weight="600">越便宜，買得下手的人越少</text><line x1="140" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/><line x1="140" y1="120" x2="140" y2="430" stroke="var(--line)" stroke-width="2"/><text x="140" y="104" font-size="19px" fill="var(--dim)" text-anchor="start" font-weight="normal">買得下手的人</text><text x="180" y="462" font-size="16px" fill="var(--dim)" text-anchor="middle" font-weight="normal">本益比 20 倍</text><text x="840" y="462" font-size="16px" fill="var(--dim)" text-anchor="middle" font-weight="normal">七、八倍</text><text x="510" y="462" font-size="16px" fill="var(--dim)" text-anchor="middle" font-weight="normal">越往右越便宜</text><path d="M 165 155 C 380 200 520 330 860 414" fill="none" stroke="var(--accent)" stroke-width="4"/><circle cx="860" cy="414" r="9" fill="var(--warn)"/><text x="620" y="206" font-size="19px" fill="var(--warn)" text-anchor="start" font-weight="normal">想買沒錢</text><text x="620" y="240" font-size="19px" fill="var(--warn)" text-anchor="start" font-weight="normal">套在山上</text><text x="620" y="274" font-size="19px" fill="var(--warn)" text-anchor="start" font-weight="normal">已失去信心</text><line x1="612" y1="286" x2="560" y2="340" stroke="var(--grey)" stroke-width="1.5"/><line x1="560" y1="340" x2="848" y2="408" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="60" y="516" font-size="22px" fill="var(--ink)" text-anchor="start" font-weight="600">這三種狀態，都跟估值無關</text></g></svg>
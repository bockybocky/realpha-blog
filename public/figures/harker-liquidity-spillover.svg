<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左邊柱子下段被卡住只剩小段可用，右邊報酬斜線因此變陡">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="480" y="60" font-size="27" fill="var(--ink)" text-anchor="middle">壓在帳上的流動性，外溢成風險</text>

  <text x="190" y="138" font-size="19" fill="var(--ink)" text-anchor="middle">帳上 $10</text>
  <rect x="110" y="290" width="160" height="180" fill="var(--grey)" stroke="var(--line)" stroke-width="2"/>
  <rect x="110" y="170" width="160" height="120" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text x="190" y="228" font-size="19" fill="var(--accent)" text-anchor="middle">可運用</text>
  <text x="190" y="256" font-size="19" fill="var(--accent)" text-anchor="middle">$4</text>
  <text x="190" y="372" font-size="19" fill="var(--ink)" text-anchor="middle">卡在支付</text>
  <text x="190" y="400" font-size="19" fill="var(--ink)" text-anchor="middle">$6</text>

  <line x1="480" y1="150" x2="480" y2="470" stroke="var(--line)" stroke-width="2"/>
  <line x1="480" y1="470" x2="890" y2="470" stroke="var(--line)" stroke-width="2"/>
  <line x1="480" y1="470" x2="870" y2="360" stroke="var(--grey)" stroke-width="5"/>
  <line x1="480" y1="470" x2="870" y2="190" stroke="var(--accent)" stroke-width="5"/>
  <text x="862" y="340" font-size="16" fill="var(--dim)" text-anchor="end">$10 全能用</text>
  <text x="862" y="178" font-size="19" fill="var(--accent)" text-anchor="end">只剩 $4 扛同樣報酬</text>
  <text x="684" y="502" font-size="16" fill="var(--dim)" text-anchor="middle">要賺到的報酬</text>
  <text x="462" y="146" font-size="16" fill="var(--dim)" text-anchor="end">冒的風險</text>

  <text x="480" y="548" font-size="22" fill="var(--ink)" text-anchor="middle">同樣的報酬，攤在更小的部位上</text>
</svg>
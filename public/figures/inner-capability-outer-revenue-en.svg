<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A large circle holding a smaller circle inside it, with a clear ring gap between them and two leader lines on the right pointing at each.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="480" y="54" text-anchor="middle" font-size="27" fill="var(--ink)">Internal capability and external deployment</text>

<circle cx="360" cy="310" r="180" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<circle cx="360" cy="350" r="95" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>

<text x="360" y="182" text-anchor="middle" font-size="20" fill="var(--ink)">Internal capability</text>
<text x="360" y="236" text-anchor="middle" font-size="15" fill="var(--dim)">The ring that cannot be sold</text>
<text x="360" y="348" text-anchor="middle" font-size="18" fill="var(--accent)">External deployment</text>
<text x="360" y="376" text-anchor="middle" font-size="16" fill="var(--accent)">Revenue</text>

<line x1="620" y1="220" x2="512" y2="220" stroke="var(--line)" stroke-width="2"/>
<path d="M504 220 L516 214 L516 226 Z" fill="var(--line)"/>
<text x="636" y="226" font-size="16" fill="var(--ink)">Watch the field</text>

<line x1="620" y1="400" x2="453" y2="400" stroke="var(--accent)" stroke-width="2"/>
<path d="M445 400 L457 394 L457 406 Z" fill="var(--accent)"/>
<text x="636" y="406" font-size="16" fill="var(--accent)">Watch this quarter</text>

<text x="480" y="522" text-anchor="middle" font-size="22" fill="var(--ink)">Capability in the big ring, numbers only in the small</text>
</svg>
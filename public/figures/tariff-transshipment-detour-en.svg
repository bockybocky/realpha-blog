<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The direct line from China to the United States is blocked by a tariff wall, while another arc detours through Singapore into the United States, and the origin label on the goods switches from China to Singapore.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:700}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700;fill:var(--accent)}
.w{fill:var(--page)}.a{fill:var(--accent)}.wa{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="40" y="56" class="t">Loop swaps tag</text>
<line x1="210" y1="200" x2="740" y2="200" stroke="var(--grey)" stroke-width="4" stroke-dasharray="10 8"/>
<line x1="480" y1="150" x2="480" y2="250" stroke="var(--warn)" stroke-width="10"/>
<text x="480" y="136" text-anchor="middle" class="g wa">Tax</text>
<circle cx="160" cy="200" r="50" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="160" y="207" text-anchor="middle" class="g">CN</text>
<circle cx="800" cy="200" r="50" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="800" y="207" text-anchor="middle" class="g">US</text>
<circle cx="480" cy="410" r="46" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="480" y="417" text-anchor="middle" class="g">SG</text>
<path d="M195,238 Q300,400 434,405" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M526,405 Q660,400 765,238" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polygon points="770,230 767,249 754,241" fill="var(--accent)"/>
<rect x="60" y="290" width="110" height="32" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="115" y="312" text-anchor="middle" class="b">Tag:CN</text>
<rect x="790" y="290" width="130" height="32" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="855" y="312" text-anchor="middle" class="b a">Tag: SG</text>
<text x="480" y="496" text-anchor="middle" class="c">Stops direct only</text>
</svg>
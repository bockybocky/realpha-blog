<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="股價越低柱越高的階梯：部位隨下跌放大、隨上漲縮小">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">跌了加碼，漲了減碼</text>

<line x1="140" y1="112" x2="880" y2="112" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="140" y="102" font-size="16" fill="var(--dim)">估值 50　風險折後 30</text>

<line x1="140" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>

<rect x="200" y="230" width="100" height="200" rx="4" fill="var(--accent)"/>
<text x="250" y="212" font-size="20" fill="var(--accent)" text-anchor="middle">4%</text>
<text x="250" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">股價 10</text>

<rect x="380" y="330" width="100" height="100" rx="4" fill="var(--accent)"/>
<text x="430" y="312" font-size="20" fill="var(--accent)" text-anchor="middle">2%</text>
<text x="430" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">15</text>

<rect x="560" y="380" width="100" height="50" rx="4" fill="var(--accent)"/>
<text x="610" y="362" font-size="20" fill="var(--accent)" text-anchor="middle">1%</text>
<text x="610" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">20</text>

<rect x="740" y="400" width="100" height="30" rx="4" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="790" y="382" font-size="20" fill="var(--dim)" text-anchor="middle">出清</text>
<text x="790" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">30</text>

<text x="200" y="498" font-size="16" fill="var(--dim)">越跌，部位越大</text>
<text x="740" y="498" font-size="16" fill="var(--dim)">越漲，部位越小</text>

<text x="60" y="534" font-size="22" fill="var(--ink)">價位對應部位，事先寫好</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A short grey bar for the old two quarters and three equal longer bars for today's eight, with arrows passing up from end customers to majors to upstream materials.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="50" y="56">Visibility went from two quarters to eight</text>
<text class="b" x="50" y="84">Customers sign with the majors, who sign with their suppliers</text>

<line x1="250" y1="150" x2="250" y2="430" stroke="var(--line)"/>
<line x1="328" y1="150" x2="328" y2="430" stroke="var(--line)"/>
<line x1="406" y1="150" x2="406" y2="430" stroke="var(--line)"/>
<line x1="484" y1="150" x2="484" y2="430" stroke="var(--line)"/>
<line x1="562" y1="150" x2="562" y2="430" stroke="var(--line)"/>
<line x1="640" y1="150" x2="640" y2="430" stroke="var(--line)"/>
<line x1="718" y1="150" x2="718" y2="430" stroke="var(--line)"/>
<line x1="796" y1="150" x2="796" y2="430" stroke="var(--line)"/>
<line x1="874" y1="150" x2="874" y2="430" stroke="var(--line)"/>

<text class="g" x="240" y="192" text-anchor="end">Before</text>
<rect x="250" y="170" width="156" height="30" fill="var(--grey)"/>
<text class="b" x="416" y="192">2 quarters</text>

<rect x="60" y="244" width="180" height="46" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="150" y="274" text-anchor="middle">Substrate . wafer . foundry</text>
<rect x="250" y="250" width="624" height="34" fill="var(--accent)"/>
<text class="b" x="884" y="274">8 qtr</text>

<rect x="60" y="309" width="180" height="46" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="150" y="339" text-anchor="middle">Majors</text>
<rect x="250" y="315" width="624" height="34" fill="var(--accent)"/>

<rect x="60" y="374" width="180" height="46" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="150" y="404" text-anchor="middle">End customers</text>
<rect x="250" y="380" width="624" height="34" fill="var(--accent)"/>

<line x1="150" y1="374" x2="150" y2="362" stroke="var(--ink)" stroke-width="2"/>
<polygon points="144,363 150,353 156,363" fill="var(--ink)"/>
<line x1="150" y1="309" x2="150" y2="297" stroke="var(--ink)" stroke-width="2"/>
<polygon points="144,298 150,288 156,298" fill="var(--ink)"/>

<text class="b" x="406" y="452" text-anchor="middle">2 qtr</text>
<text class="b" x="874" y="452" text-anchor="end">8 qtr</text>

<text class="c" x="480" y="515" text-anchor="middle">The floor is higher, but a downturn has not tested it</text>
</svg>
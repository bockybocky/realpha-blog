<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="滿的貨架把三個已被認得的標籤整批搬到空的過敏貨架">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="40" y="52" font-size="27" fill="var(--ink)">信任是從別的貨架搬過來的</text>

  <rect x="40" y="90" width="340" height="300" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="60" y="126" font-size="20" fill="var(--ink)">保養品・腸道保健</text>
  <text x="60" y="152" font-size="16" fill="var(--dim)">消費者已經買單</text>

  <line x1="60" y1="236" x2="360" y2="236" stroke="var(--grey)" stroke-width="3"/>
  <line x1="60" y1="330" x2="360" y2="330" stroke="var(--grey)" stroke-width="3"/>
  <g fill="var(--accent)">
    <rect x="72" y="196" width="26" height="40" rx="5"/>
    <rect x="112" y="186" width="26" height="50" rx="5"/>
    <rect x="152" y="202" width="26" height="34" rx="5"/>
    <rect x="192" y="190" width="26" height="46" rx="5"/>
    <rect x="232" y="200" width="26" height="36" rx="5"/>
    <rect x="272" y="188" width="26" height="48" rx="5"/>
    <rect x="312" y="198" width="26" height="38" rx="5"/>
    <rect x="80" y="292" width="26" height="38" rx="5"/>
    <rect x="124" y="284" width="26" height="46" rx="5"/>
    <rect x="168" y="296" width="26" height="34" rx="5"/>
    <rect x="212" y="286" width="26" height="44" rx="5"/>
    <rect x="256" y="294" width="26" height="36" rx="5"/>
    <rect x="300" y="288" width="26" height="42" rx="5"/>
  </g>

  <g font-size="16" fill="var(--ink)">
    <rect x="46" y="410" width="150" height="34" rx="17" fill="var(--card)" stroke="var(--accent)"/>
    <text x="68" y="433">白藜蘆醇</text>
    <rect x="206" y="410" width="128" height="34" rx="17" fill="var(--card)" stroke="var(--accent)"/>
    <text x="228" y="433">益生菌</text>
    <rect x="46" y="456" width="200" height="34" rx="17" fill="var(--card)" stroke="var(--accent)"/>
    <text x="68" y="479">一二三步驟流程</text>
  </g>
  <text x="46" y="520" font-size="16" fill="var(--dim)">認得＝不必懂</text>

  <path d="M420 262 L560 262" stroke="var(--accent)" stroke-width="8" fill="none"/>
  <path d="M548 240 L580 262 L548 284 Z" fill="var(--accent)"/>
  <text x="422" y="238" font-size="19" fill="var(--accent)">整批搬過來</text>
  <text x="422" y="306" font-size="16" fill="var(--dim)">省掉從零教育</text>

  <rect x="600" y="90" width="320" height="300" rx="10" fill="var(--card)" stroke="var(--line)" stroke-dasharray="7 6"/>
  <text x="620" y="126" font-size="20" fill="var(--ink)">過敏</text>
  <text x="620" y="152" font-size="16" fill="var(--dim)">沒有品牌做這件事</text>
  <line x1="620" y1="236" x2="900" y2="236" stroke="var(--grey)" stroke-width="3"/>
  <line x1="620" y1="330" x2="900" y2="330" stroke="var(--grey)" stroke-width="3"/>

  <circle cx="700" cy="420" r="20" fill="var(--grey)"/>
  <path d="M676 500 Q700 446 724 500 Z" fill="var(--grey)"/>
  <text x="744" y="418" font-size="19" fill="var(--ink)">自己拼湊</text>
  <text x="744" y="446" font-size="16" fill="var(--dim)">三到五種產品</text>
</svg>
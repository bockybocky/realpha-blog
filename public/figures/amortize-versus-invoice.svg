<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一次大支出加一條長薄線，右邊一排等高的柱子">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<text x="60" y="72" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="27" fill="var(--ink)">同一筆成本的兩種形狀</text>

<text x="60" y="150" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">自己有機房</text>
<line x1="60" y1="300" x2="440" y2="300" stroke="var(--line)" stroke-width="2"/>
<rect x="70" y="180" width="40" height="120" fill="var(--accent)"/>
<rect x="116" y="286" width="320" height="14" fill="var(--accent)" opacity="0.4"/>
<text x="60" y="336" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">一次付</text>
<text x="436" y="336" text-anchor="end" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">往後攤</text>

<line x1="480" y1="140" x2="480" y2="400" stroke="var(--line)"/>

<text x="530" y="150" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="20" fill="var(--dim)">跟別人租</text>
<line x1="530" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="230" width="34" height="70" fill="var(--warn)"/>
<rect x="590" y="230" width="34" height="70" fill="var(--warn)"/>
<rect x="640" y="230" width="34" height="70" fill="var(--warn)"/>
<rect x="690" y="230" width="34" height="70" fill="var(--warn)"/>
<rect x="740" y="230" width="34" height="70" fill="var(--warn)"/>
<rect x="790" y="230" width="34" height="70" fill="var(--warn)"/>
<rect x="840" y="230" width="34" height="70" fill="var(--warn)"/>
<text x="530" y="336" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">每期都付</text>
<text x="896" y="336" text-anchor="end" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="16" fill="var(--grey)">不會停</text>

<text x="60" y="460" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" font-size="22" fill="var(--ink)">一邊是攤提，一邊是帳單</text>
</svg>
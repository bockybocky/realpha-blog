<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The upper track is almost full for dependence, the lower track is entirely empty for June imports of zero.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--dim); }
.b { font-size:16px; fill:var(--ink); }
.s { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">The need is full, the delivery is zero</text>

<text class="b" x="60" y="188">Japan's dysprosium・terbium</text>
<text class="s" x="60" y="212">Reliance on a single source</text>
<rect x="280" y="160" width="600" height="52" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="280" y="160" width="576" height="52" rx="8" fill="var(--accent)"/>
<text class="b" x="304" y="193" fill="var(--page)">Nearly all of it</text>

<text class="b" x="60" y="318">June imports from China</text>
<text class="s" x="60" y="342">Gallium・dysprosium・terbium・yttrium</text>
<rect x="280" y="290" width="600" height="52" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="g" x="300" y="324" fill="var(--warn)">0</text>

<text class="c" x="60" y="440">Policy wording can leave room, customs numbers cannot</text>
</svg>
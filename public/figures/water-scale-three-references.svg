<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條橫條比較年用水量：資料中心最短，燃氣電廠是它三倍長，550英畝農田與資料中心等長">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70">一年的水，放在同一把尺上</text>
<text class="n" x="60" y="100">同為 300 百萬瓦容量</text>

<text class="g" x="300" y="168" text-anchor="end">資料中心</text>
<text class="n" x="300" y="193" text-anchor="end">蒸發冷卻</text>
<rect x="320" y="146" width="190" height="42" fill="var(--accent)" rx="4"/>
<text class="g" x="528" y="174">1.5 億加侖</text>

<text class="g" x="300" y="268" text-anchor="end">燃氣電廠</text>
<text class="n" x="300" y="293" text-anchor="end">複循環</text>
<rect x="320" y="246" width="570" height="42" fill="var(--grey)" rx="4"/>
<text class="g" x="700" y="274" fill="var(--page)">約三倍</text>

<text class="g" x="300" y="368" text-anchor="end">農田</text>
<text class="n" x="300" y="393" text-anchor="end">大豆灌溉</text>
<rect x="320" y="346" width="190" height="42" fill="var(--grey)" rx="4"/>
<text class="g" x="528" y="374">約 550 英畝</text>

<line x1="320" y1="120" x2="320" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="60" y="470">尺只量得到「過去那一代廠」</text>
</svg>
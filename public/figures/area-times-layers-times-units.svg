<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="小方塊乘以大面積、乘以層數疊影、乘以多台機器，三次相乘把需求放大">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
    .x { font-size:27px; font-weight:700; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="66">需求是三個乘號疊出來的</text>

  <rect x="70" y="250" width="56" height="40" fill="var(--grey)"/>
  <text class="g" x="98" y="330" text-anchor="middle">車用</text>
  <text class="d" x="98" y="356" text-anchor="middle">一小塊</text>

  <text class="x" x="160" y="280">×</text>

  <rect x="200" y="190" width="200" height="140" fill="var(--accent)"/>
  <text class="g" x="300" y="368" text-anchor="middle">面積</text>
  <text class="d" x="300" y="394" text-anchor="middle">八到十五倍</text>

  <text class="x" x="432" y="280">×</text>

  <rect x="480" y="300" width="150" height="16" fill="var(--accent)"/>
  <rect x="488" y="276" width="150" height="16" fill="var(--accent)"/>
  <rect x="496" y="252" width="150" height="16" fill="var(--accent)"/>
  <rect x="504" y="228" width="150" height="16" fill="var(--accent)"/>
  <rect x="512" y="204" width="150" height="16" fill="var(--accent)"/>
  <text class="g" x="560" y="368" text-anchor="middle">層數</text>
  <text class="d" x="560" y="394" text-anchor="middle">一塊疊幾十層</text>

  <text class="x" x="686" y="280">×</text>

  <rect x="730" y="200" width="40" height="130" fill="var(--grey)"/>
  <rect x="780" y="200" width="40" height="130" fill="var(--grey)"/>
  <rect x="830" y="200" width="40" height="130" fill="var(--grey)"/>
  <rect x="880" y="200" width="40" height="130" fill="var(--grey)"/>
  <text class="g" x="825" y="368" text-anchor="middle">出貨台數</text>
  <text class="d" x="825" y="394" text-anchor="middle">一直在加</text>

  <text class="c" x="60" y="470">一塊板子看起來不大，三個乘號之後就是另一個量級</text>
  <text class="d" x="60" y="506">原本只有先進駕駛輔助在用，現在伺服器也要</text>
</svg>
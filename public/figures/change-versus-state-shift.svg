<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左右兩個面板各有五個圓點代表五個元素，左邊只有想法那顆亮著其餘灰著，右邊五顆全亮">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700">動了幾個元素</text>

  <rect x="70" y="106" width="380" height="368" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="102" y="152" font-size="20" font-weight="700">改變</text>
  <circle cx="122" cy="204" r="11" fill="var(--accent)"/>
  <text x="152" y="210" font-size="16">想法</text>
  <circle cx="122" cy="254" r="11" fill="var(--grey)"/>
  <text x="152" y="260" font-size="16" fill="var(--dim)">感受</text>
  <circle cx="122" cy="304" r="11" fill="var(--grey)"/>
  <text x="152" y="310" font-size="16" fill="var(--dim)">身體經驗</text>
  <circle cx="122" cy="354" r="11" fill="var(--grey)"/>
  <text x="152" y="360" font-size="16" fill="var(--dim)">關係姿態</text>
  <circle cx="122" cy="404" r="11" fill="var(--grey)"/>
  <text x="152" y="410" font-size="16" fill="var(--dim)">想做的事</text>
  <text x="102" y="452" font-size="15" fill="var(--dim)">只有一個亮</text>

  <rect x="510" y="106" width="380" height="368" rx="16" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="542" y="152" font-size="20" font-weight="700">轉變</text>
  <circle cx="562" cy="204" r="11" fill="var(--accent)"/>
  <text x="592" y="210" font-size="16">想法</text>
  <circle cx="562" cy="254" r="11" fill="var(--accent)"/>
  <text x="592" y="260" font-size="16">感受</text>
  <circle cx="562" cy="304" r="11" fill="var(--accent)"/>
  <text x="592" y="310" font-size="16">身體經驗</text>
  <circle cx="562" cy="354" r="11" fill="var(--accent)"/>
  <text x="592" y="360" font-size="16">關係姿態</text>
  <circle cx="562" cy="404" r="11" fill="var(--accent)"/>
  <text x="592" y="410" font-size="16">想做的事</text>
  <text x="542" y="452" font-size="15" fill="var(--dim)">一起亮</text>

  <text x="60" y="548" font-size="22" font-weight="700">知道怎麼騎，跟真的會騎</text>
</svg>
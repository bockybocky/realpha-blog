<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On a seven-day timeline, the break takes only a sliver at the far left while hiding from the audit fills five days on the right">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">4 hours to break, 5 days hiding</text>
<text x="120" y="150" font-size="19" fill="var(--ink)">1 hr: universal cheat</text>
<text x="120" y="186" font-size="19" fill="var(--ink)">4 hrs: verified</text>
<line x1="112" y1="196" x2="112" y2="286" stroke="var(--grey)" stroke-width="2"/>
<line x1="126" y1="196" x2="126" y2="286" stroke="var(--grey)" stroke-width="2"/>
<rect x="130" y="246" width="730" height="40" rx="6" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="2"/>
<text x="410" y="274" font-size="20" fill="var(--ink)">5 days: hiding</text>
<line x1="100" y1="310" x2="880" y2="310" stroke="var(--line)" stroke-width="2"/>
<text x="100" y="340" font-size="16" fill="var(--dim)">Day 1</text>
<text x="533" y="340" font-size="16" fill="var(--dim)">Day 4</text>
<text x="828" y="340" font-size="16" fill="var(--dim)">Day 7</text>
<line x1="480" y1="378" x2="860" y2="378" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 8"/>
<text x="480" y="406" font-size="19" fill="var(--warn)">No such audit</text>
<text x="60" y="470" font-size="22" fill="var(--ink)">Effort spent on an imagined foe</text>
</svg>
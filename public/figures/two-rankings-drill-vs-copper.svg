<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="斜線圖：電鑽在件數榜排最前、在金額榜掉到後面；銅與電線反過來，兩條線在中間交叉">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .a { fill:var(--accent); }
</style>
<text x="48" y="62" class="t">最常被偷的東西：兩張不同的榜</text>
<text x="300" y="132" class="g" text-anchor="middle">按件數</text>
<text x="660" y="132" class="g" text-anchor="middle">按金額</text>
<line x1="300" y1="156" x2="300" y2="416" stroke="var(--line)" stroke-width="2"/>
<line x1="660" y1="156" x2="660" y2="416" stroke="var(--line)" stroke-width="2"/>
<text x="48" y="182" class="d">排前面</text>
<text x="48" y="402" class="d">排後面</text>
<line x1="300" y1="176" x2="660" y2="396" stroke="var(--grey)" stroke-width="6" stroke-linecap="round"/>
<line x1="300" y1="396" x2="660" y2="176" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
<circle cx="300" cy="176" r="10" fill="var(--grey)"/>
<circle cx="660" cy="396" r="10" fill="var(--grey)"/>
<circle cx="300" cy="396" r="10" fill="var(--accent)"/>
<circle cx="660" cy="176" r="10" fill="var(--accent)"/>
<text x="280" y="183" class="g" text-anchor="end">電鑽</text>
<text x="280" y="403" class="g a" text-anchor="end">銅・電線</text>
<text x="680" y="183" class="g a">銅・電線</text>
<text x="680" y="210" class="d">跟著銅價漲跌</text>
<text x="680" y="403" class="g">電鑽</text>
<text x="480" y="476" class="c" text-anchor="middle">件數第一 ≠ 金額第一</text>
</svg>
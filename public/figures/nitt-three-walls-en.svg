<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="An arrow passes through the first of three walls and stops at the second, with test data at the innermost point.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .w { font-size:19px; font-weight:700; fill:var(--warn); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="80" y="68">Three different walls</text>
  <rect x="700" y="150" width="200" height="300" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="800" y="286" text-anchor="middle">Test data</text>
  <text class="b" x="800" y="316" text-anchor="middle">Thermal curve</text>
  <text class="b" x="800" y="340" text-anchor="middle">What can be skipped</text>
  <rect x="300" y="150" width="26" height="300" rx="4" fill="var(--grey)"/>
  <rect x="520" y="150" width="26" height="300" rx="4" fill="var(--warn)"/>
  <rect x="690" y="150" width="14" height="300" rx="4" fill="var(--line)"/>
  <text class="g" x="313" y="132" text-anchor="middle">Materials</text>
  <text class="b" x="313" y="486" text-anchor="middle">The assumed barrier</text>
  <text class="w" x="533" y="132" text-anchor="middle">Willing to validate?</text>
  <text class="b" x="533" y="486" text-anchor="middle">The real barrier</text>
  <text class="b" x="800" y="132" text-anchor="middle">Inside</text>
  <line x1="90" y1="300" x2="500" y2="300" stroke="var(--accent)" stroke-width="5"/>
  <polygon points="500,286 522,300 500,314" fill="var(--accent)"/>
  <text class="b" x="90" y="276">Outsider</text>
  <text class="b" x="90" y="336">Stops here</text>
</svg>
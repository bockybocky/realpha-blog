<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The short four-month bar falls inside the dashed election-cycle span, while the forty-five-year bar runs far beyond it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .ttl { font-size:27px; font-weight:700; }
    .grp { font-size:20px; font-weight:700; fill:var(--dim); }
    .lbl { font-size:16px; fill:var(--dim); }
    .cc { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t ttl" x="60" y="60">Delivery speed is power</text>

  <rect x="60" y="100" width="200" height="280" fill="var(--card)" stroke="var(--line)" stroke-dasharray="8 6"/>
  <text class="t lbl" x="60" y="410">One term</text>

  <text class="t grp" x="60" y="158">First 4 months in office</text>
  <rect x="60" y="176" width="46" height="40" rx="5" fill="var(--accent)"/>
  <text class="t lbl" x="124" y="203">1,700 park fixes</text>

  <text class="t grp" x="60" y="268">First 2 mi, 2nd Ave</text>
  <rect x="60" y="286" width="840" height="40" rx="5" fill="var(--grey)"/>
  <text class="t lbl" x="76" y="313" fill="var(--page)">Begun 1972 → opened 2017, $4.5 billion</text>

  <line x1="60" y1="446" x2="900" y2="446" stroke="var(--line)" stroke-width="2"/>
  <text class="t cc" x="60" y="490">Fit the term, get the power</text>
</svg>
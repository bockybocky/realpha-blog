<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="左側一個小圓代表股價下跌只波及持股的人；右側一組同心圓從殖利率上升往外擴到房貸、信用卡、企業借款，最外圈是政府的利息帳單。">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:600}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}.p{fill:var(--page)}
</style>
<text class="t" x="480" y="52" text-anchor="middle">同樣是下跌，波及的範圍差很多</text>
<text class="g" x="210" y="125" text-anchor="middle">股價下跌</text>
<circle cx="210" cy="320" r="50" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="210" y="326" text-anchor="middle">持股的人</text>
<line x1="420" y1="110" x2="420" y2="520" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="680" y="125" text-anchor="middle">公債殖利率上升</text>
<circle cx="680" cy="320" r="185" fill="var(--accent)" fill-opacity="0.06" stroke="var(--accent)" stroke-width="1.5"/>
<circle cx="680" cy="320" r="135" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="1.5"/>
<circle cx="680" cy="320" r="88" fill="var(--accent)" fill-opacity="0.14" stroke="var(--accent)" stroke-width="1.5"/>
<circle cx="680" cy="320" r="44" fill="var(--accent)"/>
<text class="b p" x="680" y="326" text-anchor="middle" font-weight="700">殖利率↑</text>
<text class="b" x="680" y="258" text-anchor="middle">房貸</text>
<text class="b" x="680" y="211" text-anchor="middle">信用卡・企業借款</text>
<text class="b" x="680" y="161" text-anchor="middle" font-weight="700">政府利息帳單</text>
<text class="c" x="480" y="570" text-anchor="middle">債市一動，政府自己也在圈內</text>
</svg>
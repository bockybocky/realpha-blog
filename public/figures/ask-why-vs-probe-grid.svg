<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊問黑盒子為什麼只得到事後編的理由，右邊改條件得到點陣，買與不買之間浮出一條分界線">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="54" font-size="27" font-weight="700" fill="var(--ink)">與其問它為什麼，不如改題看它怎麼變</text>
<text x="200" y="104" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">做法一：問它</text>
<text x="675" y="104" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">做法二：改題追問</text>
<line x1="410" y1="84" x2="410" y2="480" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="134" width="200" height="60" rx="30" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<path d="M180,194 L200,218 L214,194 z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="182" y="190" width="30" height="6" fill="var(--card)"/>
<text x="200" y="171" font-size="18" text-anchor="middle" fill="var(--ink)">「因為……」</text>
<rect x="120" y="230" width="160" height="110" rx="14" fill="var(--ink)"/>
<text x="200" y="292" font-size="20" font-weight="700" text-anchor="middle" fill="var(--page)">模型</text>
<text x="200" y="382" font-size="16" font-weight="700" text-anchor="middle" fill="var(--warn)">理由：事後編的</text>
<g>
<circle cx="500" cy="170" r="9" fill="var(--grey)"/><circle cx="550" cy="170" r="9" fill="var(--grey)"/><circle cx="600" cy="170" r="9" fill="var(--grey)"/><circle cx="650" cy="170" r="9" fill="var(--grey)"/><circle cx="700" cy="170" r="9" fill="var(--grey)"/><circle cx="750" cy="170" r="9" fill="var(--grey)"/><circle cx="800" cy="170" r="9" fill="var(--accent)"/><circle cx="850" cy="170" r="9" fill="var(--accent)"/>
<circle cx="500" cy="220" r="9" fill="var(--grey)"/><circle cx="550" cy="220" r="9" fill="var(--grey)"/><circle cx="600" cy="220" r="9" fill="var(--grey)"/><circle cx="650" cy="220" r="9" fill="var(--grey)"/><circle cx="700" cy="220" r="9" fill="var(--grey)"/><circle cx="750" cy="220" r="9" fill="var(--accent)"/><circle cx="800" cy="220" r="9" fill="var(--accent)"/><circle cx="850" cy="220" r="9" fill="var(--accent)"/>
<circle cx="500" cy="270" r="9" fill="var(--grey)"/><circle cx="550" cy="270" r="9" fill="var(--grey)"/><circle cx="600" cy="270" r="9" fill="var(--grey)"/><circle cx="650" cy="270" r="9" fill="var(--grey)"/><circle cx="700" cy="270" r="9" fill="var(--accent)"/><circle cx="750" cy="270" r="9" fill="var(--accent)"/><circle cx="800" cy="270" r="9" fill="var(--accent)"/><circle cx="850" cy="270" r="9" fill="var(--accent)"/>
<circle cx="500" cy="320" r="9" fill="var(--grey)"/><circle cx="550" cy="320" r="9" fill="var(--grey)"/><circle cx="600" cy="320" r="9" fill="var(--grey)"/><circle cx="650" cy="320" r="9" fill="var(--grey)"/><circle cx="700" cy="320" r="9" fill="var(--accent)"/><circle cx="750" cy="320" r="9" fill="var(--accent)"/><circle cx="800" cy="320" r="9" fill="var(--accent)"/><circle cx="850" cy="320" r="9" fill="var(--accent)"/>
<circle cx="500" cy="370" r="9" fill="var(--grey)"/><circle cx="550" cy="370" r="9" fill="var(--grey)"/><circle cx="600" cy="370" r="9" fill="var(--grey)"/><circle cx="650" cy="370" r="9" fill="var(--accent)"/><circle cx="700" cy="370" r="9" fill="var(--accent)"/><circle cx="750" cy="370" r="9" fill="var(--accent)"/><circle cx="800" cy="370" r="9" fill="var(--accent)"/><circle cx="850" cy="370" r="9" fill="var(--accent)"/>
<circle cx="500" cy="420" r="9" fill="var(--grey)"/><circle cx="550" cy="420" r="9" fill="var(--grey)"/><circle cx="600" cy="420" r="9" fill="var(--accent)"/><circle cx="650" cy="420" r="9" fill="var(--accent)"/><circle cx="700" cy="420" r="9" fill="var(--accent)"/><circle cx="750" cy="420" r="9" fill="var(--accent)"/><circle cx="800" cy="420" r="9" fill="var(--accent)"/><circle cx="850" cy="420" r="9" fill="var(--accent)"/>
</g>
<polyline points="790,142 775,170 725,220 675,270 675,320 625,370 575,420 560,446" fill="none" stroke="var(--ink)" stroke-width="3" stroke-dasharray="7 5"/>
<text x="800" y="140" font-size="16" font-weight="700" fill="var(--ink)">分界＝推理路徑</text>
<text x="675" y="466" font-size="15" text-anchor="middle" fill="var(--dim)">改條件甲 →</text>
<text x="462" y="295" font-size="15" text-anchor="middle" fill="var(--dim)" transform="rotate(-90 462 295)">改條件乙 →</text>
<circle cx="742" cy="492" r="8" fill="var(--accent)"/><text x="756" y="498" font-size="15" fill="var(--dim)">買</text>
<circle cx="802" cy="492" r="8" fill="var(--grey)"/><text x="816" y="498" font-size="15" fill="var(--dim)">不買</text>
<text x="480" y="538" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">從外圍繞出路徑，不聽它自己說</text>
</svg>
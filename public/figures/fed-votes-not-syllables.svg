<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一顆大圓被十一顆小圓環繞，右邊十二顆等大的圓其中三顆變色，代表權重從集中在主席變成十二票平等、三票主張升息。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="56" font-size="27" fill="var(--ink)">從讀主席，到數票</text>

  <rect x="60" y="90" width="400" height="380" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="86" y="132" font-size="19" fill="var(--dim)">過去</text>
  <circle cx="260" cy="175" r="13" fill="var(--grey)"/>
  <circle cx="327" cy="195" r="13" fill="var(--grey)"/>
  <circle cx="374" cy="248" r="13" fill="var(--grey)"/>
  <circle cx="384" cy="318" r="13" fill="var(--grey)"/>
  <circle cx="354" cy="382" r="13" fill="var(--grey)"/>
  <circle cx="295" cy="420" r="13" fill="var(--grey)"/>
  <circle cx="225" cy="420" r="13" fill="var(--grey)"/>
  <circle cx="166" cy="382" r="13" fill="var(--grey)"/>
  <circle cx="136" cy="318" r="13" fill="var(--grey)"/>
  <circle cx="146" cy="248" r="13" fill="var(--grey)"/>
  <circle cx="192" cy="195" r="13" fill="var(--grey)"/>
  <circle cx="260" cy="300" r="62" fill="var(--accent)"/>
  <text x="260" y="308" font-size="20" fill="var(--page)" text-anchor="middle">主席</text>

  <rect x="500" y="90" width="400" height="380" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="526" y="132" font-size="19" fill="var(--dim)">現在</text>
  <circle cx="560" cy="210" r="32" fill="var(--grey)"/>
  <circle cx="650" cy="210" r="32" fill="var(--warn)"/>
  <circle cx="740" cy="210" r="32" fill="var(--grey)"/>
  <circle cx="830" cy="210" r="32" fill="var(--grey)"/>
  <circle cx="560" cy="300" r="32" fill="var(--grey)"/>
  <circle cx="650" cy="300" r="32" fill="var(--grey)"/>
  <circle cx="740" cy="300" r="32" fill="var(--grey)"/>
  <circle cx="830" cy="300" r="32" fill="var(--warn)"/>
  <circle cx="560" cy="390" r="32" fill="var(--warn)"/>
  <circle cx="650" cy="390" r="32" fill="var(--grey)"/>
  <circle cx="740" cy="390" r="32" fill="var(--grey)"/>
  <circle cx="830" cy="390" r="32" fill="var(--grey)"/>
  <text x="700" y="448" font-size="19" fill="var(--warn)" text-anchor="middle">三票主張升息</text>

  <text x="480" y="518" font-size="22" fill="var(--ink)" text-anchor="middle">主席只是十二票裡的一票</text>
</svg>
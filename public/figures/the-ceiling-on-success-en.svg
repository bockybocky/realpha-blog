<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A business growth curve meets a horizontal threshold and forks into one branch that keeps rising minus a share and one that flattens below the line.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="58" font-size="27" font-weight="600" fill="var(--ink)">The ceiling on success</text>

<rect x="96" y="120" width="804" height="90" fill="var(--card)"/>
<line x1="96" y1="120" x2="96" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="96" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="96" y1="210" x2="900" y2="210" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="900" y="234" font-size="20" font-weight="600" fill="var(--warn)" text-anchor="end">Threshold</text>

<path d="M120,420 C240,414 380,318 470,212" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M470,212 C600,180 740,150 876,132" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="7 6"/>
<polygon points="876,124 876,140 892,132" fill="var(--warn)"/>
<text x="872" y="106" font-size="19" font-weight="600" fill="var(--warn)" text-anchor="end">They come to collect</text>

<path d="M470,212 L876,216" fill="none" stroke="var(--accent)" stroke-width="3"/>
<polygon points="876,208 876,224 892,216" fill="var(--accent)"/>
<text x="880" y="248" font-size="19" font-weight="600" fill="var(--accent)" text-anchor="end">Stay below the line</text>

<circle cx="470" cy="212" r="7" fill="var(--warn)"/>
<text x="458" y="182" font-size="19" font-weight="600" fill="var(--warn)" text-anchor="end">A knock at the door</text>

<text x="96" y="458" font-size="15" fill="var(--dim)">Time</text>
<text transform="translate(66,300) rotate(-90)" font-size="15" fill="var(--dim)" text-anchor="middle">Size</text>

<text x="480" y="514" font-size="22" font-weight="600" fill="var(--ink)" text-anchor="middle">The optimal strategy: do not grow</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="長循環曲線：多次小波之後隆起一段高峰，再長長下滑到谷底，末端虛線往上翹">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="70">鐘擺</text>
<text class="g" x="60" y="104">上面＝價值領先　下面＝大型成長領先</text>
<line x1="60" y1="340" x2="900" y2="340" stroke="var(--line)" stroke-width="2"/>
<path d="M70,340 C100,268 130,412 160,340 C190,268 220,412 250,340 C268,300 288,322 305,340" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text class="b" x="88" y="452">過去六次</text>
<path d="M305,340 C360,248 470,236 525,248 C575,258 602,300 622,340" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="g" x="356" y="220">價值與品質領先</text>
<text class="b" x="356" y="246">約十五年</text>
<path d="M622,340 C682,402 742,432 802,428" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="g" x="648" y="486">深度價值冷板凳</text>
<text class="b" x="648" y="512">十六年</text>
<path d="M802,428 C844,420 866,382 886,336" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="9 8"/>
<path d="M886,336 l-14,4 l6,12 z" fill="var(--accent)"/>
<circle cx="305" cy="340" r="6" fill="var(--ink)"/>
<text class="b" x="268" y="372">千禧年尾聲</text>
<circle cx="622" cy="340" r="6" fill="var(--ink)"/>
<text class="b" x="606" y="372">2015</text>
<circle cx="802" cy="428" r="7" fill="var(--accent)"/>
<text class="g" x="782" y="462">現在</text>
<text class="c" x="60" y="546">盪太遠的那一邊，傾向盪回來</text>
</svg>
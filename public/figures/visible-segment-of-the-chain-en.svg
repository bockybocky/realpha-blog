<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three cells in the middle of the chain are highlighted while the two end nodes closest to nature sit greyed out beyond the frame.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:700;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .s{font-size:15px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
    .n{font-size:16px;font-weight:700;fill:var(--ink)}
    .m{font-size:16px;font-weight:700;fill:var(--grey)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="56" y="56">Only the middle stretch is visible</text>
<rect x="316" y="196" width="330" height="128" rx="12" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="316" y="180">What you can see</text>
<rect x="40" y="236" width="112" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="172" y="236" width="112" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="336" y="236" width="112" height="60" rx="8" fill="var(--accent)" opacity="0.25" stroke="var(--accent)"/>
<rect x="468" y="236" width="112" height="60" rx="8" fill="var(--accent)" opacity="0.25" stroke="var(--accent)"/>
<rect x="676" y="236" width="112" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="808" y="236" width="112" height="60" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="m" x="72" y="272">Extraction</text>
<text class="m" x="196" y="272">Smelting and refining</text>
<text class="n" x="356" y="272">Suppliers</text>
<text class="n" x="484" y="272">Your company</text>
<text class="m" x="700" y="272">Shipping and use</text>
<text class="m" x="836" y="272">End-of-life</text>
<path d="M152 266 L172 266 M284 266 L336 266 M448 266 L468 266 M580 266 L676 266 M788 266 L808 266" stroke="var(--grey)" stroke-width="2"/>
<path d="M112 316 L112 372" stroke="var(--warn)" stroke-width="2"/>
<path d="M844 316 L844 372" stroke="var(--warn)" stroke-width="2"/>
<text class="s" x="40" y="398">Habitat, water, land</text>
<text class="s" x="756" y="398">E-waste, health costs</text>
<text class="c" x="56" y="472">Nature's costs sit at both ends, outside the frame</text>
<text class="b" x="56" y="504">Not how far you sit from hills and sea, but where the material comes from and where it ends</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="上方一個往下收窄的漏斗，寬端標五千、窄端標二十；下方一條長橫軸上有一段很長的色塊，末端是一個小標記。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="58">聰明管得到的，與管不到的</text>
  <rect x="60" y="88" width="840" height="398" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <polygon points="140,140 560,140 440,268 260,268" fill="var(--accent)" opacity="0.85"/>
  <text class="g" x="596" y="162">五千個點子</text>
  <text class="g" x="596" y="258">挑二十個做</text>
  <path d="M560 150 L584 150" stroke="var(--grey)" stroke-width="2"/>
  <path d="M440 258 L584 246" stroke="var(--grey)" stroke-width="2"/>
  <path d="M140 330 L860 330" stroke="var(--grey)" stroke-width="2"/>
  <rect x="140" y="346" width="620" height="46" fill="var(--warn)" opacity="0.85"/>
  <text class="s" x="162" y="376">老鼠長大再死掉</text>
  <text class="g" x="786" y="378">一年</text>
  <path d="M140 408 L760 408" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="s" x="140" y="440">模型再快，這一段不會短</text>
  <text class="c" x="60" y="542">摸到現實那一段有速限</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two timelines compared: the polling one is full of useless checks, while the waiting one lights a single dot only at the moment of the block.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="56" y="62" font-size="27" font-weight="700" fill="var(--ink)">Either you keep looking, or it calls you</text>

  <text x="56" y="126" font-size="20" fill="var(--dim)">check every 30 seconds</text>
  <line x1="56" y1="180" x2="904" y2="180" stroke="var(--line)" stroke-width="3"/>
  <g fill="var(--grey)">
    <circle cx="96" cy="180" r="7"/><circle cx="156" cy="180" r="7"/><circle cx="216" cy="180" r="7"/>
    <circle cx="276" cy="180" r="7"/><circle cx="336" cy="180" r="7"/><circle cx="396" cy="180" r="7"/>
    <circle cx="456" cy="180" r="7"/><circle cx="516" cy="180" r="7"/><circle cx="576" cy="180" r="7"/>
    <circle cx="636" cy="180" r="7"/><circle cx="696" cy="180" r="7"/><circle cx="756" cy="180" r="7"/>
  </g>
  <circle cx="816" cy="180" r="12" fill="var(--warn)"/>
  <text x="56" y="222" font-size="16" fill="var(--grey)">twelve empty checks</text>
  <text x="816" y="222" font-size="16" fill="var(--warn)" text-anchor="middle">hit on the 13th</text>

  <text x="56" y="330" font-size="20" fill="var(--dim)">call me when it blocks</text>
  <line x1="56" y1="384" x2="904" y2="384" stroke="var(--line)" stroke-width="3"/>
  <line x1="56" y1="384" x2="816" y2="384" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="816" cy="384" r="12" fill="var(--accent)"/>
  <text x="400" y="426" font-size="16" fill="var(--grey)" text-anchor="middle">you are away here</text>
  <text x="816" y="426" font-size="16" fill="var(--accent)" text-anchor="middle">the moment it blocks</text>

  <text x="56" y="486" font-size="22" fill="var(--ink)">What you save is attention, not time</text>
</svg>
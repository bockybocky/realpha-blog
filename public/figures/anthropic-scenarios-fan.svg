<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="扇形折線：四條情境線前兩年疊在一起，2028 年後張開，最高一條到 2030 年 15.4%">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text x="480" y="52" class="t" text-anchor="middle">GDP 成長率情境：先疊在一起，再急轉分岔</text>
<rect x="150" y="112" width="255" height="348" fill="var(--card)"/>
<line x1="405" y1="112" x2="405" y2="460" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="278" y="100" class="g" text-anchor="middle">建置年</text>
<text x="605" y="100" class="g" text-anchor="middle" style="fill:var(--accent)">加速年</text>
<line x1="150" y1="354" x2="810" y2="354" stroke="var(--line)" stroke-width="1"/>
<line x1="150" y1="248" x2="810" y2="248" stroke="var(--line)" stroke-width="1"/>
<line x1="150" y1="141" x2="810" y2="141" stroke="var(--line)" stroke-width="1"/>
<line x1="150" y1="460" x2="810" y2="460" stroke="var(--grey)" stroke-width="2"/>
<text x="132" y="465" class="b" text-anchor="end">0%</text>
<text x="132" y="359" class="b" text-anchor="end">5%</text>
<text x="132" y="253" class="b" text-anchor="end">10%</text>
<text x="132" y="146" class="b" text-anchor="end">15%</text>
<polyline points="180,415 330,412 480,412 630,410 780,408" fill="none" stroke="var(--grey)" stroke-width="3"/>
<polyline points="180,415 330,410 480,400 630,385 780,365" fill="none" stroke="var(--grey)" stroke-width="3"/>
<polyline points="180,415 330,408 480,385 630,340 780,290" fill="none" stroke="var(--grey)" stroke-width="3"/>
<polyline points="180,415 330,405 480,360 630,260 780,133" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="180" cy="415" r="6" fill="var(--ink)"/>
<circle cx="780" cy="133" r="6" fill="var(--accent)"/>
<text x="168" y="400" class="b" text-anchor="end">目前約 2.1%</text>
<text x="792" y="130" class="g" style="fill:var(--accent)">15.4%</text>
<text x="792" y="156" class="b">約 7.3 倍</text>
<text x="278" y="445" class="b" text-anchor="middle">幾乎疊在一起</text>
<text x="560" y="232" class="b" text-anchor="middle">急轉分岔</text>
<text x="180" y="492" class="g" text-anchor="middle">2026</text>
<text x="330" y="492" class="g" text-anchor="middle">2027</text>
<text x="480" y="492" class="g" text-anchor="middle">2028</text>
<text x="630" y="492" class="g" text-anchor="middle">2029</text>
<text x="780" y="492" class="g" text-anchor="middle">2030</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="月營收四根柱子逐月墊高，上方配額線維持水平不動">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; font-weight:600; fill:var(--dim); }
.b { font-size:16px; fill:var(--ink); }
.s { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="66">配額持平，營收翻倍</text>
<text class="s" x="60" y="104">月營收（億美元）</text>

<line x1="120" y1="150" x2="900" y2="150" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
<text class="g" x="120" y="140" fill="var(--warn)">晶圓配額　與去年相近</text>

<line x1="120" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>

<rect x="180" y="431" width="110" height="39" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="192" y="420">0.35</text>
<text class="b" x="180" y="502">去年同月</text>

<rect x="360" y="298" width="110" height="172" fill="var(--accent)"/>
<text class="g" x="372" y="287">1.53</text>
<text class="b" x="384" y="502">六月</text>

<rect x="540" y="229" width="110" height="241" fill="var(--accent)"/>
<text class="g" x="552" y="218">2.14</text>
<text class="b" x="564" y="502">七月</text>

<rect x="720" y="190" width="110" height="280" fill="var(--accent)"/>
<text class="g" x="732" y="179">2.49</text>
<text class="b" x="744" y="502">八月</text>

<text class="c" x="60" y="540">變的只剩價格</text>
</svg>
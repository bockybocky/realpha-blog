<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四根高度不同的避風港柱子，歐洲日本中國都矮，美國最高，資金箭頭往最高那根流">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">錢停在哪，是比出來的</text>
<text class="b" x="60" y="92">柱高＝可以停錢的容量</text>
<line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="340" width="110" height="90" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="110" y="462">歐洲</text>
<text class="b" x="110" y="488">戰爭</text>
<text class="b" x="110" y="510">成長稀薄</text>
<text class="b" x="110" y="532">無財政聯盟</text>
<rect x="290" y="310" width="110" height="120" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="290" y="462">日本</text>
<text class="b" x="290" y="488">老問題</text>
<text class="b" x="290" y="510">避風港不足</text>
<rect x="470" y="360" width="110" height="70" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="470" y="462">中國</text>
<text class="b" x="470" y="488">市場半開</text>
<text class="b" x="470" y="510">貿易戰</text>
<rect x="680" y="170" width="140" height="260" fill="var(--accent)" opacity="0.18"/>
<rect x="680" y="170" width="140" height="260" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="680" y="462">美元</text>
<text class="b" x="680" y="488">收入是美元</text>
<text class="b" x="680" y="510">負債是美元</text>
<text class="b" x="680" y="532">籌碼最大</text>
<path d="M240 300 L660 230" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#a1)"/>
<path d="M410 290 L660 255" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#a1)"/>
<path d="M590 345 L660 300" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#a1)"/>
<defs><marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>
<text class="c" x="60" y="140">不是算出來的</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On a log-scale ruler, three old IPO multiples crowd the left end while Anthropic's multiple sits alone far out to the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">His ruler: revenue multiples at three old IPOs</text>
<text class="d" x="60" y="92">X axis is a log scale</text>
<line x1="120" y1="300" x2="910" y2="300" stroke="var(--line)" stroke-width="3"/>
<circle cx="159" cy="300" r="9" fill="var(--grey)"/>
<line x1="159" y1="300" x2="159" y2="250" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="134" y="238">4×</text>
<text class="d" x="120" y="340">Amazon</text>
<circle cx="269" cy="300" r="9" fill="var(--grey)"/>
<line x1="269" y1="300" x2="269" y2="250" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="244" y="238">9×</text>
<text class="d" x="236" y="340">Google</text>
<circle cx="433" cy="300" r="9" fill="var(--grey)"/>
<line x1="433" y1="300" x2="433" y2="250" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="406" y="238">30×</text>
<text class="d" x="388" y="340">Facebook</text>
<text class="d" x="388" y="364">Pricey back then</text>
<circle cx="472" cy="300" r="11" fill="var(--warn)"/>
<line x1="472" y1="300" x2="472" y2="420" stroke="var(--warn)" stroke-width="2"/>
<text class="g" x="448" y="446">40×</text>
<text class="d" x="420" y="470">If it hits $50B</text>
<circle cx="815" cy="300" r="13" fill="var(--accent)"/>
<line x1="815" y1="300" x2="815" y2="230" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="782" y="218">500×</text>
<text class="d" x="760" y="194">$3T ÷ $4B</text>
<circle cx="870" cy="300" r="9" fill="var(--accent)" opacity="0.45"/>
<text class="d" x="846" y="340">750×</text>
<text class="d" x="836" y="364">Recomputed</text>
</svg>
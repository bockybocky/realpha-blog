<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="This is a vertical cross-section with four layers from top to bottom, the upper two bracketed as the MOSFET head and the lower two as the BJT body, with a single arrow running all the way through.">
  <defs>
    <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="ti" x="40" y="54">One device, two bloodlines</text>

  <rect x="260" y="96" width="440" height="52" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="300" y="130">Gate</text>
  <text class="g" x="600" y="130">Emitter</text>

  <rect x="260" y="156" width="440" height="78" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="300" y="202">P-type body</text>
  <text class="b" x="470" y="202">Channel forms at this surface</text>

  <rect x="260" y="242" width="440" height="190" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="300" y="300">N-type drift region</text>
  <text class="b" x="300" y="328">Thickness that blocks voltage</text>
  <text class="b" x="300" y="372">Minority carriers flood in</text>
  <text class="b" x="300" y="398">Resistance drops</text>

  <rect x="260" y="440" width="440" height="52" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="300" y="474">P-type collector</text>

  <path d="M 740 100 L 770 100 L 770 230 L 740 230" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="786" y="156" fill="var(--accent)">MOSFET</text>
  <text class="b" x="786" y="182">Thrifty head</text>

  <path d="M 740 246 L 770 246 L 770 488 L 740 488" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="786" y="356" fill="var(--accent)">BJT</text>
  <text class="b" x="786" y="382">Brawny body</text>

  <path d="M 200 120 L 200 470" fill="none" stroke="var(--ink)" stroke-width="3" marker-end="url(#a2)"/>
  <defs><marker id="a2" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker></defs>
  <text class="b" x="100" y="300">Electrons</text>
</svg>
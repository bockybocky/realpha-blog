<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="市場包著產業包著個股的三層嵌套框，右側括號顯示三種角色各負責的層數不同">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="80" y="62">報酬的三層，誰負責哪幾層</text>
<rect x="80" y="100" width="520" height="340" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="104" y="134">整個市場</text>
<rect x="128" y="160" width="424" height="240" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="152" y="194">產業</text>
<rect x="176" y="220" width="328" height="140" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="200" y="254">個股</text>
<text class="s" x="200" y="286">挑出相對好的那一檔</text>
<text class="s" x="152" y="376">好的時候加碼，不好的時候少買</text>
<line x1="640" y1="170" x2="640" y2="390" stroke="var(--accent)" stroke-width="4"/>
<line x1="640" y1="170" x2="660" y2="170" stroke="var(--accent)" stroke-width="4"/>
<line x1="640" y1="390" x2="660" y2="390" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="672" y="288">分析師</text>
<text class="s" x="672" y="314">內兩層</text>
<line x1="760" y1="110" x2="760" y2="430" stroke="var(--dim)" stroke-width="4"/>
<line x1="760" y1="110" x2="780" y2="110" stroke="var(--dim)" stroke-width="4"/>
<line x1="760" y1="430" x2="780" y2="430" stroke="var(--dim)" stroke-width="4"/>
<text class="g" x="792" y="262">基金</text>
<text class="g" x="792" y="288">經理人</text>
<text class="s" x="792" y="314">三層都顧</text>
<line x1="80" y1="470" x2="600" y2="470" stroke="var(--warn)" stroke-width="5"/>
<text class="g" x="616" y="478">投資人：股票與現金的比例</text>
<text class="c" x="80" y="526">潮水來的時候你也不知道自己有沒有穿褲子，所以還是得上船</text>
</svg>
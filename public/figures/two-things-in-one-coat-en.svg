<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two lines: one falls as remedies are added, the other stays perfectly flat">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; font-weight:700; fill:var(--ink); }
    .g  { font-size:20px; font-weight:600; }
    .b  { font-size:16px; fill:var(--dim); }
    .c  { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">Under one coat there are really two things</text>

<line x1="150" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="120" x2="150" y2="450" stroke="var(--line)" stroke-width="2"/>

<text class="b" x="150" y="486">Remedies: pay for the substation</text>
<text class="b" x="430" y="486">Closed-loop cooling</text>
<text class="b" x="620" y="486">Lower rates</text>
<text class="b" x="790" y="486">All of it done</text>

<text class="b" x="60" y="130">Opposition</text>
<text class="b" x="60" y="152">Intensity</text>

<path d="M160 170 C 380 200, 560 340, 860 415" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="160" cy="170" r="6" fill="var(--accent)"/>
<circle cx="860" cy="415" r="6" fill="var(--accent)"/>
<text class="g" x="196" y="163" fill="var(--accent)">Concrete grievances</text>
<text class="b" x="196" y="187">Who pays, how much water, how the rate case ends</text>

<line x1="160" y1="248" x2="860" y2="248" stroke="var(--warn)" stroke-width="4"/>
<circle cx="160" cy="248" r="6" fill="var(--warn)"/>
<circle cx="860" cy="248" r="6" fill="var(--warn)"/>
<text class="g" x="196" y="288" fill="var(--warn)">Feelings about the thing itself</text>
<text class="b" x="196" y="312">I just don't like it</text>

<text class="c" x="60" y="530">The tools move one line down and never touch the other</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The line on the left peaks and returns to the start, the line on the right steps up and stays higher, with one extra layer">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">Noise returns, structure stays</text>
<line x1="480" y1="120" x2="480" y2="420" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>
<text x="80" y="152" font-size="20" fill="var(--dim)">Noise</text>
<polyline points="80,340 190,340 240,200 290,340 430,340" fill="none" stroke="var(--grey)" stroke-width="4"/>
<line x1="80" y1="380" x2="430" y2="380" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="408" font-size="16" fill="var(--dim)">Forgotten in a week</text>
<text x="540" y="152" font-size="20" fill="var(--accent)">Structure</text>
<rect x="700" y="240" width="200" height="100" fill="var(--accent)" fill-opacity="0.15"/>
<polyline points="540,340 700,340 700,240 900,240" fill="none" stroke="var(--accent)" stroke-width="4"/>
<line x1="540" y1="380" x2="900" y2="380" stroke="var(--line)" stroke-width="2"/>
<text x="700" y="410" font-size="16" fill="var(--ink)">Audit·monitor·retain·3rd party</text>
<text x="540" y="410" font-size="16" fill="var(--dim)">Existing cost</text>
<text x="60" y="486" font-size="22" fill="var(--ink)">Test: optional becomes required</text>
</svg>
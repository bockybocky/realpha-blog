<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩組交疊的圓。左邊兩圓只擦到一點邊，標著只講結論；右邊兩圓重疊了一大塊，標著把那份原封不動給他一份"><rect x="0" y="0" width="960" height="560" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
<text x="80" y="56" font-size="27" fill="var(--ink)">你給他什麼，決定他能說什麼</text>
<circle cx="170" cy="280" r="92" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="350" cy="280" r="92" fill="none" stroke="var(--line)" stroke-width="2"/>
<text x="150" y="168" font-size="16" fill="var(--dim)" text-anchor="middle">你在看的</text>
<text x="370" y="168" font-size="16" fill="var(--dim)" text-anchor="middle">他在看的</text>
<text x="260" y="432" font-size="20" fill="var(--ink)" text-anchor="middle">只講結論</text>
<text x="260" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">他只能給你通則</text>
<line x1="480" y1="150" x2="480" y2="470" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="640" cy="280" r="92" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="724" cy="280" r="92" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="596" y="168" font-size="16" fill="var(--dim)" text-anchor="middle">你在看的</text>
<text x="768" y="168" font-size="16" fill="var(--dim)" text-anchor="middle">他在看的</text>
<text x="682" y="432" font-size="20" fill="var(--ink)" text-anchor="middle">把那份原封不動給他一份</text>
<text x="682" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">他的話接得上你的處境</text>
<text x="80" y="534" font-size="22" fill="var(--ink)">重疊的那一塊，才是他幫得上你的範圍</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="On one time axis, the shortage caused by nobody needing it runs long, while the shortage caused by capacity being used elsewhere is short.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="600" fill="var(--ink)">How long it stays short depends on why there was no capacity</text>
  <text x="60" y="100" font-size="19" fill="var(--dim)">Two answers, two lifespans</text>

  <text x="120" y="222" font-size="20" fill="var(--ink)">Nobody needed it</text>
  <text x="440" y="192" font-size="16" fill="var(--dim)">Build from zero</text>
  <rect x="440" y="200" width="420" height="38" fill="var(--accent)"/>

  <text x="120" y="342" font-size="20" fill="var(--ink)">Used for something else</text>
  <text x="440" y="312" font-size="16" fill="var(--dim)">Just crowded out</text>
  <rect x="440" y="320" width="140" height="38" fill="var(--grey)"/>

  <line x1="440" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
  <text x="440" y="428" font-size="16" fill="var(--dim)">Time</text>

  <text x="480" y="496" font-size="22" text-anchor="middle" fill="var(--ink)">The answer sets your holding period</text>
</svg>
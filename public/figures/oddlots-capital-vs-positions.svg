<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一短一長兩條橫條，短的是自有資本，長的是連槓桿一起算的部位">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="72" font-size="27" fill="var(--ink)">一塊自有資本，撐起多少部位</text>
<text x="60" y="140" font-size="19" fill="var(--dim)">自有資本</text>
<rect x="60" y="154" width="124" height="58" fill="var(--accent)"/>
<text x="200" y="192" font-size="16" fill="var(--ink)">3,000 到 3,500 億美元</text>
<text x="60" y="262" font-size="19" fill="var(--dim)">連借來的錢一起算</text>
<rect x="60" y="276" width="760" height="58" fill="var(--grey)"/>
<text x="84" y="312" font-size="16" fill="var(--ink)">約 2.2 兆美元</text>
<text x="60" y="420" font-size="22" fill="var(--ink)">同一塊資本，約六到七倍的曝險</text>
<text x="60" y="462" font-size="15" fill="var(--dim)">長度照比例畫</text>
</svg>
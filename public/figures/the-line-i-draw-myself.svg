<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條垂直線左邊是可以貼給模型的日常資料，右邊是不貼進去的機密資料">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="60" font-size="27" font-weight="700" fill="var(--ink)">我自己畫的那條線</text>

  <line x1="480" y1="100" x2="480" y2="440" stroke="var(--ink)" stroke-width="5"/>
  <text class="t" x="480" y="476" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">我自己守</text>

  <text class="t" x="120" y="138" font-size="20" font-weight="700" fill="var(--accent)">照用免費模型</text>
  <rect x="120" y="162" width="300" height="56" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="140" y="197" font-size="16" fill="var(--ink)">日常寫程式</text>
  <rect x="120" y="234" width="300" height="56" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="140" y="269" font-size="16" fill="var(--ink)">公開資料</text>
  <rect x="120" y="306" width="300" height="56" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="140" y="341" font-size="16" fill="var(--ink)">改文章</text>
  <rect x="120" y="386" width="300" height="48" rx="24" fill="var(--accent)"/>
  <text class="t" x="270" y="417" font-size="16" font-weight="700" fill="var(--page)" text-anchor="middle">模型</text>

  <text class="t" x="540" y="138" font-size="20" font-weight="700" fill="var(--warn)">一律不貼進去</text>
  <rect x="540" y="162" width="300" height="56" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="560" y="197" font-size="16" fill="var(--ink)">機密檔案</text>
  <rect x="540" y="234" width="300" height="56" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="560" y="269" font-size="16" fill="var(--ink)">個人資料</text>
  <rect x="540" y="306" width="300" height="56" rx="8" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="560" y="341" font-size="16" fill="var(--ink)">合約內容</text>
  <rect x="540" y="386" width="300" height="48" rx="24" fill="var(--page)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="t" x="690" y="417" font-size="16" fill="var(--grey)" text-anchor="middle">沒有模型</text>
</svg>
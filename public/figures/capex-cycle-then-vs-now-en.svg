<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Two capex paths: the upper ends dead with only three dots behind the buyer; the lower has a dense field of dots behind the buyer and an extra downward exit at the end">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.s { font-size:16px; fill:var(--dim); }
.g { font-size:19px; font-weight:600; }
.b { font-size:16px; }
.n { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="60">Who buys — and where it goes unsold</text>
<text class="s" x="60" y="92">Both are big capex cycles</text>
<text class="g" x="60" y="152" fill="var(--dim)">1999</text>
<rect x="130" y="130" width="130" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="195" y="166" text-anchor="middle">Equipment</text>
<line x1="266" y1="160" x2="304" y2="160" stroke="var(--grey)" stroke-width="3"/>
<polygon points="304,160 292,154 292,166" fill="var(--grey)"/>
<rect x="312" y="130" width="180" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="402" y="166" text-anchor="middle">New dot-coms</text>
<circle cx="352" cy="212" r="5" fill="var(--grey)"/>
<circle cx="372" cy="212" r="5" fill="var(--grey)"/>
<circle cx="392" cy="212" r="5" fill="var(--grey)"/>
<text class="n" x="412" y="217">End customers</text>
<line x1="498" y1="160" x2="536" y2="160" stroke="var(--grey)" stroke-width="3"/>
<polygon points="536,160 524,154 524,166" fill="var(--grey)"/>
<rect x="544" y="130" width="140" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="614" y="166" text-anchor="middle">Laid fiber</text>
<line x1="690" y1="160" x2="756" y2="160" stroke="var(--grey)" stroke-width="3"/>
<path d="M756,140 L772,160 L756,180" fill="none" stroke="var(--warn)" stroke-width="3"/>
<path d="M782,140 L798,160 L782,180" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="812" y="166" fill="var(--warn)">Dark 10 yrs</text>
<line x1="60" y1="270" x2="900" y2="270" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="60" y="352" fill="var(--accent)">Today</text>
<rect x="130" y="330" width="130" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="195" y="366" text-anchor="middle">Chips &amp; servers</text>
<line x1="266" y1="360" x2="304" y2="360" stroke="var(--accent)" stroke-width="3"/>
<polygon points="304,360 292,354 292,366" fill="var(--accent)"/>
<rect x="312" y="320" width="180" height="80" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="402" y="352" text-anchor="middle">Cloud platforms</text>
<rect x="342" y="366" width="120" height="12" rx="6" fill="var(--accent)"/>
<text class="n" x="500" y="345">Net cash</text>
<g fill="var(--accent)">
<circle cx="322" cy="424" r="5"/><circle cx="342" cy="424" r="5"/><circle cx="362" cy="424" r="5"/><circle cx="382" cy="424" r="5"/><circle cx="402" cy="424" r="5"/><circle cx="422" cy="424" r="5"/><circle cx="442" cy="424" r="5"/><circle cx="462" cy="424" r="5"/><circle cx="482" cy="424" r="5"/>
<circle cx="322" cy="444" r="5"/><circle cx="342" cy="444" r="5"/><circle cx="362" cy="444" r="5"/><circle cx="382" cy="444" r="5"/><circle cx="402" cy="444" r="5"/><circle cx="422" cy="444" r="5"/><circle cx="442" cy="444" r="5"/><circle cx="462" cy="444" r="5"/><circle cx="482" cy="444" r="5"/>
<circle cx="322" cy="464" r="5"/><circle cx="342" cy="464" r="5"/><circle cx="362" cy="464" r="5"/><circle cx="382" cy="464" r="5"/><circle cx="402" cy="464" r="5"/><circle cx="422" cy="464" r="5"/><circle cx="442" cy="464" r="5"/><circle cx="462" cy="464" r="5"/><circle cx="482" cy="464" r="5"/>
</g>
<text class="n" x="500" y="450">Hospitals·insurers·mfg·govt</text>
<line x1="498" y1="360" x2="536" y2="360" stroke="var(--accent)" stroke-width="3"/>
<polygon points="536,360 524,354 524,366" fill="var(--accent)"/>
<rect x="544" y="330" width="140" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="614" y="366" text-anchor="middle">Data centers</text>
<line x1="690" y1="360" x2="800" y2="360" stroke="var(--accent)" stroke-width="3"/>
<polygon points="800,360 788,354 788,366" fill="var(--accent)"/>
<line x1="740" y1="360" x2="740" y2="424" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 5"/>
<polygon points="740,432 734,418 746,418" fill="var(--accent)"/>
<text class="n" x="756" y="430">Back to cloud</text>
<text class="c" x="60" y="556">Can unsold gear go elsewhere</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A falling yield line breaks below the dashed 2% threshold, an arrow jumps across to a block of 9%-to-12% coupon paper, and a warning-colored dashed line then carries the whole thing back down to the bottom.">
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .gd { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .w { font-size:19px; fill:var(--warn); }
    .a { font-size:19px; fill:var(--accent); }
  </style>
  <text class="t" x="60" y="66">Under 2%, money goes</text>
  <line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="60" y1="352" x2="900" y2="352" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="gd" x="60" y="340">Patience: 2%</text>
  <path d="M110 288 L200 310 L280 334 L352 376" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="312" cy="352" r="6" fill="var(--accent)"/>
  <text class="a" x="110" y="268">Deposits</text>
  <path d="M372 372 C470 362 486 230 540 198" fill="none" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="538 190 556 200 536 208" fill="var(--dim)"/>
  <rect x="570" y="148" width="270" height="78" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="586" y="182">LatAm rail bonds</text>
  <text class="b" x="586" y="210">9%–12% coupons</text>
  <line x1="700" y1="226" x2="700" y2="424" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="692 420 708 420 700 434" fill="var(--warn)"/>
  <text class="w" x="716" y="420">Defaults</text>
  <text class="c" x="60" y="494">Money moves out</text>
</svg>
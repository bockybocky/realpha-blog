<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A polygon formed by existing knowledge points, with new results inside it and only one or two distant points outside.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">Most new results land inside what is already known</text>

<path d="M250 130 L560 110 L700 250 L620 400 L330 420 L200 280 Z" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<g fill="var(--grey)">
<circle cx="250" cy="130" r="7"/><circle cx="560" cy="110" r="7"/><circle cx="700" cy="250" r="7"/>
<circle cx="620" cy="400" r="7"/><circle cx="330" cy="420" r="7"/><circle cx="200" cy="280" r="7"/>
</g>
<g fill="var(--accent)">
<circle cx="340" cy="210" r="9"/><circle cx="430" cy="170" r="9"/><circle cx="500" cy="250" r="9"/>
<circle cx="390" cy="320" r="9"/><circle cx="560" cy="330" r="9"/><circle cx="300" cy="300" r="9"/>
<circle cx="470" cy="380" r="9"/><circle cx="610" cy="200" r="9"/>
</g>
<text x="450" y="290" font-size="19" fill="var(--dim)" text-anchor="middle">Clever recombination</text>
<text x="250" y="110" font-size="16" fill="var(--dim)" text-anchor="middle">Known</text>

<circle cx="845" cy="440" r="10" fill="var(--warn)"/>
<text x="845" y="480" font-size="19" fill="var(--warn)" text-anchor="middle">Theory that did not exist</text>
<text x="845" y="505" font-size="15" fill="var(--dim)" text-anchor="middle">Still rare</text>
<line x1="700" y1="250" x2="825" y2="425" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條長條九成屬於單一買方，剩下一成是所有其他買方">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t h" x="60" y="70">碳移除買方（估算）</text>

  <rect x="60" y="190" width="756" height="110" rx="8" fill="var(--accent)" opacity="0.85"/>
  <rect x="816" y="190" width="84" height="110" rx="8" fill="var(--grey)"/>
  <rect x="60" y="190" width="840" height="110" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>

  <text class="t g" x="438" y="252" text-anchor="middle" fill="var(--page)">微軟一家</text>
  <text class="t b" x="438" y="340" text-anchor="middle">約九成，約 4500 萬噸</text>
  <text class="t g" x="858" y="165" text-anchor="middle">其他全部</text>
  <text class="t b" x="858" y="340" text-anchor="middle">約一成</text>

  <text class="t c" x="60" y="430">一個買方的進退，就是價格</text>
  <text class="t b" x="60" y="465">Gautam 的估算；買方分散之前，這個市場的形狀不會變</text>
</svg>
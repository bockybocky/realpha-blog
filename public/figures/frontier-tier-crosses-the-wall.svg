<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上下兩格各有一道牆。上格最強的那顆圓在牆內，其餘在牆外；下格三顆圓都在牆外，一支箭頭把最強那顆帶過牆。">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">最強的那一層，在牆的哪一邊</text>
<text x="396" y="96" font-size="16" fill="var(--dim)" text-anchor="end">牆內</text>
<text x="566" y="96" font-size="16" fill="var(--dim)">牆外</text>

<rect x="470" y="112" width="18" height="146" fill="var(--grey)"/>
<text x="60" y="140" font-size="20" font-weight="700" fill="var(--ink)">2024 年 1 月</text>
<circle cx="380" cy="190" r="32" fill="var(--accent)"/>
<text x="380" y="248" font-size="16" fill="var(--accent)" text-anchor="middle">前沿</text>
<circle cx="600" cy="190" r="32" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
<text x="600" y="248" font-size="16" fill="var(--dim)" text-anchor="middle">入門</text>
<circle cx="710" cy="190" r="32" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
<text x="710" y="248" font-size="16" fill="var(--dim)" text-anchor="middle">中段</text>

<rect x="470" y="320" width="18" height="146" fill="var(--grey)"/>
<text x="60" y="348" font-size="20" font-weight="700" fill="var(--ink)">2025 年 7 月</text>
<circle cx="600" cy="398" r="32" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
<text x="600" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">入門</text>
<circle cx="710" cy="398" r="32" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
<text x="710" y="456" font-size="16" fill="var(--dim)" text-anchor="middle">中段</text>
<circle cx="820" cy="398" r="32" fill="var(--accent)"/>
<text x="820" y="456" font-size="16" fill="var(--accent)" text-anchor="middle">前沿</text>

<path d="M380 232 Q 380 310 500 300 Q 790 290 816 356" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/>
<path d="M809 350 L820 368 L828 348 z" fill="var(--accent)"/>
<text x="60" y="528" font-size="22" font-weight="700" fill="var(--ink)">先開放的是下面幾層，後來連最上面那層也推出去了</text>
</g>
</svg>
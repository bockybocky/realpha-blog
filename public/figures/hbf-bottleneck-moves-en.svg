<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="In two supply-chain stacks, the narrowed layer is the bottleneck, and the margin marker moves with that narrow point." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Where the bottleneck is, the margin follows</text>
<text x="230" y="118" font-size="20" fill="var(--dim)" text-anchor="middle">Now</text>
<rect x="110" y="140" width="240" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="230" y="175" font-size="15" fill="var(--ink)" text-anchor="middle">End system</text>
<rect x="110" y="204" width="240" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="160" y="268" width="140" height="56" rx="6" fill="var(--accent)"/>
<text x="230" y="303" font-size="15" fill="var(--page)" text-anchor="middle">HBM</text>
<rect x="110" y="332" width="240" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="396" width="240" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="230" y="431" font-size="15" fill="var(--ink)" text-anchor="middle">Upstream</text>
<text x="370" y="290" font-size="15" fill="var(--accent)">Margin is here</text>
<text x="370" y="314" font-size="15" fill="var(--dim)">20 layers is the physical limit</text>
<text x="690" y="118" font-size="20" fill="var(--accent)" text-anchor="middle">After the ceiling</text>
<rect x="570" y="140" width="240" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="690" y="175" font-size="15" fill="var(--ink)" text-anchor="middle">End system</text>
<rect x="620" y="204" width="140" height="56" rx="6" fill="var(--accent)"/>
<text x="690" y="239" font-size="15" fill="var(--page)" text-anchor="middle">Next bottleneck</text>
<rect x="570" y="268" width="240" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="690" y="303" font-size="15" fill="var(--dim)" text-anchor="middle">Margin moves on</text>
<rect x="570" y="332" width="240" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="570" y="396" width="240" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="690" y="431" font-size="15" fill="var(--ink)" text-anchor="middle">Upstream</text>
<line x1="400" y1="226" x2="556" y2="226" stroke="var(--ink)" stroke-width="2"/>
<polygon points="556,220 570,226 556,232" fill="var(--ink)"/>
<text x="60" y="530" font-size="22" fill="var(--ink)">Where scarcity ends, margins end</text>
</svg>
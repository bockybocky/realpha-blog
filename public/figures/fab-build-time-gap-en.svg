<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Two horizontal bars for fab build time, one long and one short, with the short one reaching new capacity first.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">Who gets capacity built first</text>

<rect x="50" y="100" width="860" height="270" rx="14" fill="var(--card)"/>
<line x1="230" y1="140" x2="230" y2="330" stroke="var(--line)" stroke-width="2"/>

<text x="206" y="202" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="end">US  Korea  Japan</text>
<rect x="230" y="180" width="600" height="36" rx="4" fill="var(--grey)"/>
<text x="530" y="205" font-size="16" fill="var(--page)" text-anchor="middle">2.5 to 3 years</text>

<text x="206" y="292" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="end">China</text>
<rect x="230" y="270" width="360" height="36" rx="4" fill="var(--accent)"/>
<text x="410" y="295" font-size="16" fill="var(--page)" text-anchor="middle">18 months</text>
<path d="M600 288 L700 288" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M700 288 l-12 -7 v14 z" fill="var(--accent)"/>
<text x="712" y="294" font-size="19" font-weight="700" fill="var(--accent)">Online first</text>

<text x="60" y="446" font-size="22" font-weight="700" fill="var(--ink)">Same shortage, different speed to online</text>
</svg>
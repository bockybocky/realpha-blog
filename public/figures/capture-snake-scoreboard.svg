<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條長度不同的橫條，種田那條短、捕蛇那條長，兩條末端都標著死">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="70" font-size="27" fill="var(--ink)">在他那張計分板上，晚一點死就是贏</text>
<text x="60" y="192" font-size="20" fill="var(--dim)">種田</text>
<rect x="150" y="168" width="250" height="36" rx="6" fill="var(--grey)"/>
<text x="418" y="193" font-size="19" fill="var(--warn)">死</text>
<text x="60" y="292" font-size="20" fill="var(--ink)">捕蛇</text>
<rect x="150" y="268" width="560" height="36" rx="6" fill="var(--accent)"/>
<text x="728" y="293" font-size="19" fill="var(--warn)">死</text>
<line x1="150" y1="366" x2="800" y2="366" stroke="var(--line)" stroke-width="2"/>
<polygon points="800,366 786,360 786,372" fill="var(--line)"/>
<text x="150" y="396" font-size="16" fill="var(--dim)">活得多久</text>
<text x="60" y="466" font-size="22" fill="var(--ink)">先看計分板，再評價行為</text>
</svg>
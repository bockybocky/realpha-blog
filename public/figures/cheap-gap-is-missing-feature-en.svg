<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A tall bar for new and a short bar for used, with the height difference drawn as a dashed box labeled as the missing item.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
</style>
<text class="t" x="48" y="62">Price gap = lost feature</text>
<rect x="260" y="140" width="160" height="300" rx="4" fill="var(--accent)"/>
<text class="g" x="340" y="128" text-anchor="middle">$10</text>
<rect x="540" y="260" width="160" height="180" rx="4" fill="var(--accent)"/>
<text class="g" x="620" y="292" text-anchor="middle" style="fill:var(--page)">$6</text>
<line x1="420" y1="140" x2="540" y2="140" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="540" y="140" width="160" height="120" rx="4" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="g" x="620" y="207" text-anchor="middle" style="fill:var(--warn)">Missing</text>
<line x1="220" y1="440" x2="740" y2="440" stroke="var(--dim)" stroke-width="2"/>
<text class="g" x="340" y="474" text-anchor="middle">New</text>
<text class="g" x="620" y="474" text-anchor="middle">2nd</text>
</svg>
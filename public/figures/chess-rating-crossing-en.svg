<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A straight line with a constant slope rises from bottom left to top right through a narrow horizontal human-range band; the short crossing stretch is labeled as the crossover, with humans always winning on the left and never winning on the right.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="60" y="62" class="h">Line through the human band</text>
<line x1="100" y1="110" x2="100" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>
<text x="112" y="124" class="b">Elo</text>
<rect x="100" y="300" width="780" height="40" fill="var(--card)" stroke="var(--grey)" stroke-dasharray="6 5"/>
<text x="870" y="327" text-anchor="end" class="b">Humans</text>
<line x1="100" y1="440" x2="880" y2="130" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
<line x1="352" y1="340" x2="452" y2="300" stroke="var(--warn)" stroke-width="10" stroke-linecap="round"/>
<text x="470" y="374" class="b" style="fill:var(--warn)">Looks sudden</text>
<text x="640" y="190" text-anchor="end" class="b" style="fill:var(--accent)">Same slope 40y</text>
<text x="100" y="474" text-anchor="middle" class="b">Year 0</text>
<text x="880" y="474" text-anchor="end" class="b">Year 40</text>
<path d="M100,486 V496 H348 V486" fill="none" stroke="var(--grey)" stroke-width="2"/>
<path d="M356,486 V496 H448 V486" fill="none" stroke="var(--warn)" stroke-width="2"/>
<path d="M456,486 V496 H880 V486" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text x="224" y="526" text-anchor="middle" class="b">Man wins</text>
<text x="402" y="526" text-anchor="middle" class="b" style="fill:var(--warn)">Flip</text>
<text x="668" y="526" text-anchor="middle" class="b">AI wins</text>
</svg>
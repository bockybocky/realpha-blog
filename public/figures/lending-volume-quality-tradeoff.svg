<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="承做量愈大、信用品質愈低的下滑曲線，兩個端點被標出">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">放款的那條蹺蹺板</text>
<line x1="150" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="110" x2="150" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="790" y="448">承做量</text>
<text class="b" x="60" y="124">信用品質</text>
<path d="M210 150 Q470 190 800 390" fill="none" stroke="var(--grey)" stroke-width="3"/>
<circle cx="230" cy="157" r="9" fill="var(--accent)"/>
<text class="g" x="252" y="152">守緊標準</text>
<text class="b" x="252" y="178">承做量少到難看</text>
<circle cx="780" cy="378" r="9" fill="var(--warn)"/>
<text class="g" x="520" y="340" fill="var(--warn)">放寬條件、拉長還款期</text>
<text class="b" x="520" y="366">量上來，虧損也上來</text>
<text class="c" x="60" y="480">同一條線上的兩個位置，不是兩種做法</text>
</svg>
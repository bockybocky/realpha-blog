<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="One election night produced two opposite lines: the Dow up three percent, the Philadelphia Semiconductor Index down more than three percent to its lowest level since April.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="64">One day, two directions</text>
<rect x="60" y="100" width="840" height="300" rx="14" fill="var(--card)"/>
<line x1="150" y1="250" x2="860" y2="250" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="200" cy="250" r="8" fill="var(--grey)"/>
<text class="b" x="152" y="292">Early election results</text>
<path d="M200 250 L480 196 L820 150" stroke="var(--accent)" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M200 250 L480 318 L820 368" stroke="var(--warn)" stroke-width="5" fill="none" stroke-linecap="round"/>
<circle cx="820" cy="150" r="9" fill="var(--accent)"/>
<circle cx="820" cy="368" r="9" fill="var(--warn)"/>
<text class="g" x="700" y="132" fill="var(--accent)">Dow +3%</text>
<text class="b" x="700" y="172">Health, clean energy</text>
<text class="g" x="648" y="402" fill="var(--warn)">SOX -3%+</text>
<text class="b" x="648" y="348">Lowest since April</text>
<text class="c" x="60" y="462">Up or down, both price the same thing: power permits</text>
</svg>
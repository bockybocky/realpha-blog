<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A vast building outline with a small cluster of racks and a human figure at the centre, surrounded by large empty areas.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">One gigawatt, one thousand racks</text>

  <rect x="60" y="100" width="840" height="330" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="82" y="132" font-size="19" fill="var(--dim)">1 GW data centre</text>
  <text x="200" y="272" font-size="16" fill="var(--grey)">Empty</text>
  <text x="760" y="272" font-size="16" fill="var(--grey)">Empty</text>
  <text x="200" y="360" font-size="16" fill="var(--grey)">Empty</text>
  <text x="760" y="360" font-size="16" fill="var(--grey)">Empty</text>

  <rect x="410" y="238" width="22" height="34" rx="2" fill="var(--accent)"/>
  <rect x="438" y="238" width="22" height="34" rx="2" fill="var(--accent)"/>
  <rect x="466" y="238" width="22" height="34" rx="2" fill="var(--accent)"/>
  <rect x="494" y="238" width="22" height="34" rx="2" fill="var(--accent)"/>
  <rect x="522" y="238" width="22" height="34" rx="2" fill="var(--accent)"/>
  <rect x="410" y="280" width="22" height="34" rx="2" fill="var(--accent)"/>
  <rect x="438" y="280" width="22" height="34" rx="2" fill="var(--accent)"/>
  <rect x="466" y="280" width="22" height="34" rx="2" fill="var(--accent)"/>
  <rect x="494" y="280" width="22" height="34" rx="2" fill="var(--accent)"/>
  <rect x="522" y="280" width="22" height="34" rx="2" fill="var(--accent)"/>
  <text x="477" y="342" font-size="15" fill="var(--dim)" text-anchor="middle">100 racks per block</text>

  <circle cx="580" cy="288" r="6" fill="var(--dim)"/>
  <path d="M580 296 L580 314 M570 302 L590 302 M580 314 L572 328 M580 314 L588 328" stroke="var(--dim)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="600" y="316" font-size="15" fill="var(--dim)">Person</text>

  <text x="60" y="478" font-size="20" fill="var(--dim)">1 GW / 1 MW per rack = 1,000 racks</text>
  <text x="60" y="522" font-size="22" fill="var(--ink)">Space was never the scarce thing</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A ceiling sits at four hundred degrees on the temperature scale: silicon stays above it, and only oxides get in below it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">What blocks this is temperature, not design</text>

  <line x1="150" y1="110" x2="150" y2="470" stroke="var(--line)" stroke-width="3"/>
  <text x="48" y="132" font-size="16" fill="var(--dim)">About 1000°C</text>
  <line x1="140" y1="126" x2="160" y2="126" stroke="var(--grey)" stroke-width="2"/>
  <text x="56" y="268" font-size="16" fill="var(--warn)">400°C</text>
  <text x="68" y="464" font-size="16" fill="var(--dim)">Room temp</text>
  <line x1="140" y1="458" x2="160" y2="458" stroke="var(--grey)" stroke-width="2"/>

  <rect x="190" y="110" width="700" height="140" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="214" y="152" font-size="20" fill="var(--ink)">Front end</text>
  <text x="214" y="186" font-size="16" fill="var(--dim)">Silicon transistors</text>
  <text x="214" y="214" font-size="16" fill="var(--dim)">Thermal oxide, activation anneal</text>
  <text x="700" y="186" font-size="16" fill="var(--ink)">Heat is fine</text>

  <line x1="190" y1="262" x2="890" y2="262" stroke="var(--warn)" stroke-width="4"/>
  <text x="190" y="292" font-size="19" fill="var(--warn)">Ceiling for copper wiring</text>

  <rect x="190" y="310" width="700" height="160" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="214" y="350" font-size="20" fill="var(--ink)">Back end</text>
  <text x="214" y="384" font-size="16" fill="var(--dim)">Laying copper wiring</text>
  <text x="440" y="384" font-size="16" fill="var(--grey)">Silicon transistors　can't get in</text>
  <path d="M700 370 l24 24 M724 370 l-24 24" stroke="var(--grey)" stroke-width="3"/>
  <text x="440" y="430" font-size="16" fill="var(--accent)">Oxide semiconductors　low heat is enough</text>
  <circle cx="712" cy="422" r="12" fill="none" stroke="var(--accent)" stroke-width="3"/>

  <text x="48" y="528" font-size="22" fill="var(--ink)">Stacking upward depends on how much heat that layer can take.</text>
</svg>
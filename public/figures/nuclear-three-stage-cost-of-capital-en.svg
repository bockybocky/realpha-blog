<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three bars from tall to short: the required return is highest during development, falls by more than half after the final investment decision, and is lowest once the plant is operating.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">One plant, three stages, three prices</text>

<line x1="120" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>

<rect x="180" y="150" width="160" height="300" rx="6" fill="var(--warn)"/>
<text class="t" x="260" y="135" font-size="22" fill="var(--ink)" text-anchor="middle">25–30%</text>
<text class="t" x="260" y="482" font-size="20" fill="var(--ink)" text-anchor="middle">Development</text>
<text class="t" x="260" y="508" font-size="15" fill="var(--dim)" text-anchor="middle">An empty lot</text>

<rect x="450" y="330" width="160" height="120" rx="6" fill="var(--accent)"/>
<text class="t" x="530" y="315" font-size="22" fill="var(--ink)" text-anchor="middle">11%</text>
<text class="t" x="530" y="482" font-size="20" fill="var(--ink)" text-anchor="middle">After the final investment decision</text>
<text class="t" x="530" y="508" font-size="15" fill="var(--dim)" text-anchor="middle">Debt and equity in place</text>

<rect x="720" y="341" width="160" height="109" rx="6" fill="var(--grey)"/>
<text class="t" x="800" y="326" font-size="22" fill="var(--ink)" text-anchor="middle">~10%</text>
<text class="t" x="800" y="482" font-size="20" fill="var(--ink)" text-anchor="middle">Operating</text>
<text class="t" x="800" y="508" font-size="15" fill="var(--dim)" text-anchor="middle">Power is flowing</text>

<path d="M345 180 L445 330" stroke="var(--dim)" stroke-width="2" fill="none" marker-end="url(#a1)"/>
<defs><marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker></defs>
<text class="t" x="398" y="240" font-size="16" fill="var(--dim)" text-anchor="middle" transform="rotate(56 398 240)">Risk retired</text>

<text class="t" x="60" y="542" font-size="22" fill="var(--ink)">That spread is what a developer sells</text>
</svg>
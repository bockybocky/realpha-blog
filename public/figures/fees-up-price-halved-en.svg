<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Performance fees rise on the left while the share price falls to half on the right, the two sets of bars moving opposite ways.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Business up, price down</text>

<rect x="60" y="92" width="400" height="310" rx="10" fill="var(--card)"/>
<text class="t" x="82" y="126" font-size="19" font-weight="700" fill="var(--dim)">Performance fees</text>
<line x1="100" y1="370" x2="440" y2="370" stroke="var(--line)" stroke-width="2"/>
<rect x="140" y="290" width="90" height="80" rx="5" fill="var(--grey)"/>
<text class="t" x="140" y="278" font-size="16" fill="var(--dim)">54 million</text>
<rect x="300" y="160" width="90" height="210" rx="5" fill="var(--accent)"/>
<text class="t" x="296" y="148" font-size="19" font-weight="700" fill="var(--accent)">175 million</text>
<text class="t" x="140" y="394" font-size="16" fill="var(--dim)">2022</text>
<text class="t" x="300" y="394" font-size="16" fill="var(--dim)">This year</text>

<rect x="500" y="92" width="400" height="310" rx="10" fill="var(--card)"/>
<text class="t" x="522" y="126" font-size="19" font-weight="700" fill="var(--dim)">Share price</text>
<line x1="540" y1="370" x2="880" y2="370" stroke="var(--line)" stroke-width="2"/>
<rect x="580" y="160" width="90" height="210" rx="5" fill="var(--grey)"/>
<rect x="740" y="265" width="90" height="105" rx="5" fill="var(--warn)"/>
<text class="t" x="744" y="253" font-size="19" font-weight="700" fill="var(--warn)">Halved</text>
<text class="t" x="580" y="394" font-size="16" fill="var(--dim)">Peak</text>
<text class="t" x="740" y="394" font-size="16" fill="var(--dim)">Now</text>

<text class="t" x="60" y="466" font-size="22" font-weight="700" fill="var(--ink)">The market is not reading this quarter's numbers</text>
</svg>
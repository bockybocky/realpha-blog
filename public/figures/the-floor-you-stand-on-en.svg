<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A left-right comparison in which the arrow misses over broken ground on the left, and reaches the items above only after a floor is added on the right.">
  <defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style></defs>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">The precondition is underfoot</text>

  <rect x="60" y="100" width="400" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="100" width="400" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="80" y="134" font-size="20" font-weight="700" fill="var(--dim)">No strength</text>
  <text class="t" x="520" y="134" font-size="20" font-weight="700" fill="var(--dim)">Strength now</text>

  <text class="t" x="120" y="188" font-size="19" fill="var(--grey)">Family</text>
  <text class="t" x="235" y="188" font-size="19" fill="var(--grey)">Meds</text>
  <text class="t" x="330" y="188" font-size="19" fill="var(--grey)">Finances</text>
  <text class="t" x="560" y="188" font-size="19" font-weight="700" fill="var(--ink)">Family</text>
  <text class="t" x="675" y="188" font-size="19" font-weight="700" fill="var(--ink)">Meds</text>
  <text class="t" x="770" y="188" font-size="19" font-weight="700" fill="var(--ink)">Finances</text>

  <line x1="134" y1="380" x2="134" y2="262" stroke="var(--grey)" stroke-width="3"/>
  <line x1="243" y1="380" x2="243" y2="262" stroke="var(--grey)" stroke-width="3"/>
  <line x1="344" y1="380" x2="344" y2="262" stroke="var(--grey)" stroke-width="3"/>
  <text class="t" x="260" y="240" font-size="16" fill="var(--warn)" text-anchor="middle">Out of reach</text>

  <line x1="80" y1="392" x2="170" y2="392" stroke="var(--grey)" stroke-width="4" stroke-dasharray="10 14"/>
  <line x1="300" y1="392" x2="440" y2="392" stroke="var(--grey)" stroke-width="4" stroke-dasharray="10 14"/>

  <rect x="540" y="378" width="320" height="34" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="700" y="402" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Sleeping through</text>

  <line x1="574" y1="372" x2="574" y2="216" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="574,202 566,222 582,222" fill="var(--accent)"/>
  <line x1="683" y1="372" x2="683" y2="216" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="683,202 675,222 691,222" fill="var(--accent)"/>
  <line x1="784" y1="372" x2="784" y2="216" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="784,202 776,222 792,222" fill="var(--accent)"/>

  <text class="t" x="60" y="494" font-size="22" font-weight="700" fill="var(--ink)">Lay the floor first, and effort has something to push against</text>
</svg>
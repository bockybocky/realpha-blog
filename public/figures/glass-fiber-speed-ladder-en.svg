<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Four steps rise to the upper right: electronic-grade glass, T-glass, low-Dk glass and quartz glass, with faster signals higher up and the last step still far off.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="66">Purer glass, faster signals</text>

  <rect x="90" y="390" width="180" height="60" fill="var(--grey)"/>
  <text class="g" x="180" y="428" text-anchor="middle">E-glass</text>
  <text class="d" x="180" y="478" text-anchor="middle">Slowest</text>

  <rect x="270" y="320" width="180" height="130" fill="var(--grey)"/>
  <text class="g" x="360" y="358" text-anchor="middle">T-glass</text>
  <text class="d" x="360" y="478" text-anchor="middle">A bit faster</text>

  <rect x="450" y="240" width="180" height="210" fill="var(--accent)"/>
  <text class="g" x="540" y="278" text-anchor="middle">Low-Dk glass</text>
  <text class="d" x="540" y="478" text-anchor="middle">The one in short supply</text>

  <rect x="630" y="150" width="180" height="300" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="12 8"/>
  <text class="g" x="720" y="190" text-anchor="middle">Quartz glass</text>
  <text class="d" x="720" y="478" text-anchor="middle">Years away</text>

  <path d="M 850 400 L 850 150" stroke="var(--dim)" stroke-width="3"/>
  <path d="M 850 150 L 842 170 L 858 170 Z" fill="var(--dim)"/>
  <text class="d" x="866" y="280">Faster</text>

  <text class="c" x="60" y="520">Solve a rung, then queue for the next</text>
</svg>
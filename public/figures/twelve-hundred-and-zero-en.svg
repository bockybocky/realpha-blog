<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A dense field of dots on the left against a single hollow circle on the right">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
  <pattern id="dots-f5" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="13" cy="13" r="5.5" fill="var(--accent)" opacity="0.6"/>
  </pattern>
</defs>
<text x="80" y="66" font-size="27" fill="var(--ink)">Of 1,200, zero raised a flag</text>

<rect x="90" y="140" width="520" height="260" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="102" y="152" width="496" height="236" rx="8" fill="url(#dots-f5)"/>
<text x="350" y="432" font-size="19" fill="var(--ink)" text-anchor="middle">Agents who knew</text>

<circle cx="770" cy="270" r="74" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="9 8"/>
<text x="770" y="282" font-size="27" fill="var(--warn)" text-anchor="middle">Zero</text>
<text x="770" y="432" font-size="19" fill="var(--warn)" text-anchor="middle">Told a human</text>

<text x="80" y="488" font-size="22" fill="var(--ink)">Help peers, not report</text>
</svg>
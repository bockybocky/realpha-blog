<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="三格：買一顆糖付一枚硬幣；把整間店搬上車拿到長帳單；最後手上還是只有那顆糖">
  <style>
    .ink { fill: #3b3b3b; }
    .line { stroke: #3b3b3b; stroke-width: 2; fill: none; }
    .box { fill: none; stroke: #3b3b3b; stroke-width: 2; }
    .store { fill: #e9dcc0; stroke: #3b3b3b; stroke-width: 2; }
    .bill { fill: #f1d9b5; stroke: #3b3b3b; stroke-width: 2; }
    .candy { fill: #c96a4a; stroke: #3b3b3b; stroke-width: 2; }
    .coin { fill: #e3b64a; stroke: #3b3b3b; stroke-width: 2; }
    .label { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 18px; fill: #3b3b3b; }
    .num { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 22px; fill: #3b3b3b; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6e1d6; }
      .line, .box { stroke: #e6e1d6; }
      .store { fill: #5a4d3a; stroke: #e6e1d6; }
      .bill { fill: #5e4a2e; stroke: #e6e1d6; }
      .candy { stroke: #e6e1d6; }
      .coin { stroke: #e6e1d6; }
      .label, .num { fill: #e6e1d6; }
    }
  </style>

  <!-- 格 1 -->
  <rect x="20" y="20" width="290" height="320" rx="6" class="box"/>
  <text x="165" y="52" text-anchor="middle" class="num">1</text>
  <circle cx="110" cy="170" r="16" class="coin"/>
  <circle cx="220" cy="170" r="12" class="candy"/>
  <line x1="132" y1="170" x2="200" y2="170" class="line"/>
  <polygon points="200,164 212,170 200,176" class="ink"/>
  <text x="165" y="300" text-anchor="middle" class="label">網頁聊天：一枚硬幣一顆糖</text>

  <!-- 格 2 -->
  <rect x="335" y="20" width="290" height="320" rx="6" class="box"/>
  <text x="480" y="52" text-anchor="middle" class="num">2</text>
  <rect x="370" y="110" width="150" height="110" class="store"/>
  <polygon points="360,110 445,70 530,110" class="store"/>
  <rect x="540" y="160" width="60" height="60" class="store"/>
  <line x1="360" y1="222" x2="600" y2="222" class="line"/>
  <circle cx="390" cy="236" r="10" class="line"/>
  <circle cx="500" cy="236" r="10" class="line"/>
  <circle cx="575" cy="236" r="10" class="line"/>
  <rect x="440" y="250" width="30" height="70" class="bill"/>
  <text x="480" y="300" text-anchor="middle" class="label">接進專案：整間店搬上車</text>

  <!-- 格 3 -->
  <rect x="650" y="20" width="290" height="320" rx="6" class="box"/>
  <text x="795" y="52" text-anchor="middle" class="num">3</text>
  <circle cx="795" cy="150" r="14" class="candy"/>
  <text x="795" y="200" text-anchor="middle" class="label">手上還是那顆糖</text>
  <text x="795" y="300" text-anchor="middle" class="label">帳單卻是整間店的</text>
</svg>

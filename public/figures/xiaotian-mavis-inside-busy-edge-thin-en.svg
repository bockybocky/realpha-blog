<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Inside the box a coordinator links to five helpers; outside, you have only three lines: a request in, results out, and a dashed line handing you an entry point when needed">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
<marker id="mke1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
<marker id="mke2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker>
<marker id="mke3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker>
</defs>
<text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Busy inside, you only touch the edge</text>
<rect x="280" y="100" width="620" height="440" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="304" y="134" font-size="16" fill="var(--dim)">Inside Marvis</text>
<g stroke="var(--grey)" stroke-width="2">
<line x1="490" y1="320" x2="690" y2="166"/>
<line x1="490" y1="320" x2="690" y2="248"/>
<line x1="490" y1="320" x2="690" y2="330"/>
<line x1="490" y1="320" x2="690" y2="412"/>
<line x1="490" y1="320" x2="690" y2="494"/>
</g>
<rect x="340" y="285" width="150" height="70" rx="10" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="415" y="327" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">Coordinator</text>
<g fill="var(--page)" stroke="var(--grey)">
<rect x="690" y="140" width="180" height="52" rx="8"/>
<rect x="690" y="222" width="180" height="52" rx="8"/>
<rect x="690" y="304" width="180" height="52" rx="8"/>
<rect x="690" y="386" width="180" height="52" rx="8"/>
<rect x="690" y="468" width="180" height="52" rx="8"/>
</g>
<g font-size="16" text-anchor="middle" fill="var(--ink)">
<text x="780" y="172">System</text>
<text x="780" y="254">Files</text>
<text x="780" y="336">Apps</text>
<text x="780" y="418">Web</text>
<text x="780" y="500">Search</text>
</g>
<circle cx="130" cy="320" r="48" fill="none" stroke="var(--ink)" stroke-width="2"/>
<text x="130" y="328" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">You</text>
<line x1="180" y1="305" x2="334" y2="305" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#mke1)"/>
<text x="258" y="292" font-size="16" text-anchor="middle" fill="var(--ink)">A request</text>
<line x1="340" y1="338" x2="186" y2="338" stroke="var(--dim)" stroke-width="2" marker-end="url(#mke2)"/>
<text x="258" y="366" font-size="16" text-anchor="middle" fill="var(--dim)">Results</text>
<path d="M415,357 C415,480 200,470 152,374" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mke3)"/>
<text x="60" y="492" font-size="16" fill="var(--warn)">Entry point only when you must act</text>
</svg>
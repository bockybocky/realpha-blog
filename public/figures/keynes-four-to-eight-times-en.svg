<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The 1930 forecast was a band of four to eight times, and the actual 8.2 times sits just outside its upper edge.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">That century-old forecast landed on the upper edge</text>
<line x1="160" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="3"/>
<line x1="160" y1="110" x2="160" y2="400" stroke="var(--line)" stroke-width="3"/>
<polygon points="160,400 820,160 820,280" fill="var(--card)"/>
<line x1="160" y1="400" x2="820" y2="160" stroke="var(--grey)" stroke-width="3"/>
<line x1="160" y1="400" x2="820" y2="280" stroke="var(--grey)" stroke-width="3"/>
<text class="s" x="828" y="166">8x</text>
<text class="s" x="828" y="286">4x</text>
<text class="s" x="560" y="238">The forecast band</text>
<line x1="160" y1="400" x2="820" y2="154" stroke="var(--accent)" stroke-width="7"/>
<circle cx="820" cy="154" r="11" fill="var(--accent)"/>
<text class="g" x="846" y="128" style="fill:var(--accent)">8.2x</text>
<text class="s" x="140" y="434">1930</text>
<text class="s" x="796" y="434">Today</text>
<text class="s" x="60" y="100">Living standards</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="With two shows scalper prices climb; after four shows are announced prices hit a ceiling and flatten, yet tickets still sell out.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">More shows, still sold out, but the price stalls</text>
<rect x="60" y="96" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="96" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="90" y="134">2 shows</text>
<text class="g" x="530" y="134">Up to 4 shows</text>
<rect x="90" y="330" width="40" height="40" fill="var(--grey)"/>
<rect x="140" y="330" width="40" height="40" fill="var(--grey)"/>
<rect x="530" y="330" width="40" height="40" fill="var(--grey)"/>
<rect x="580" y="330" width="40" height="40" fill="var(--grey)"/>
<rect x="630" y="330" width="40" height="40" fill="var(--warn)"/>
<rect x="680" y="330" width="40" height="40" fill="var(--warn)"/>
<path d="M210 320 L260 265 L310 200 L360 150" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linejoin="round"/>
<polygon points="366,142 352,170 345,156" fill="var(--accent)"/>
<text class="g" x="372" y="190" fill="var(--accent)">Scalper price</text>
<line x1="740" y1="236" x2="880" y2="236" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M740 320 L780 280 L820 244 L880 240" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linejoin="round"/>
<text class="b" x="880" y="222" text-anchor="end" fill="var(--warn)">Can't climb</text>
<text class="b" x="90" y="390">Tickets</text>
<text class="b" x="530" y="390">Tickets · sell out too</text>
<text class="c" x="60" y="470">The market doesn't buy "short", it buys "shorter than last time"</text>
</svg>
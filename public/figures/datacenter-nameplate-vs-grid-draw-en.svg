<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Nameplate capacity is one full bar, while the draw actually taken from the grid is only part of it, about 50 to 70 percent in the near term and shorter still later on.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="60" font-size="27" font-weight="700" fill="var(--ink)">Nameplate is not grid load</text>

  <text class="t" x="60" y="140" font-size="20" font-weight="700" fill="var(--ink)">Nameplate 1 GW</text>
  <rect x="60" y="156" width="840" height="64" rx="5" fill="var(--grey)" opacity="0.6"/>

  <text class="t" x="60" y="282" font-size="20" font-weight="700" fill="var(--ink)">Near term · actually drawn from the grid</text>
  <rect x="60" y="298" width="840" height="64" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="60" y="298" width="588" height="64" rx="5" fill="var(--accent)" opacity="0.85"/>
  <text class="t" x="668" y="338" font-size="19" font-weight="700" fill="var(--accent)">50–70%</text>

  <text class="t" x="60" y="424" font-size="20" font-weight="700" fill="var(--ink)">Late decade · on-site supply pays off</text>
  <rect x="60" y="440" width="840" height="64" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="60" y="440" width="294" height="64" rx="5" fill="var(--warn)" opacity="0.85"/>
  <text class="t" x="374" y="480" font-size="19" font-weight="700" fill="var(--warn)">Lower</text>
</svg>
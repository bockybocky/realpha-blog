<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A bar on the left drops to about half its height, while a block on the right branches into two arrows, the downward one filled in and the upward one dashed.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">One side falls, the other gets fed</text>

  <rect x="60" y="92" width="360" height="390" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="84" y="130">Monthly EV sales</text>
  <rect x="120" y="230" width="90" height="190" fill="var(--grey)"/>
  <rect x="260" y="320" width="90" height="100" fill="var(--warn)"/>
  <line x1="84" y1="420" x2="396" y2="420" stroke="var(--line)" stroke-width="3"/>
  <text class="d" x="165" y="218" text-anchor="middle">180k–190k units</text>
  <text class="d" x="305" y="308" text-anchor="middle">About 100k units</text>
  <text class="d" x="165" y="446" text-anchor="middle">Credit in place</text>
  <text class="d" x="305" y="446" text-anchor="middle">Credit gone</text>

  <rect x="470" y="92" width="430" height="390" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="494" y="130">Half-built battery plant</text>
  <rect x="494" y="258" width="120" height="86" fill="var(--grey)"/>
  <line x1="614" y1="290" x2="740" y2="200" stroke="var(--grey)" stroke-width="5" stroke-dasharray="8 6"/>
  <polygon points="740,200 722,200 736,216" fill="var(--grey)"/>
  <text class="d" x="756" y="196">EV cells</text>
  <text class="d" x="756" y="220">Not taken</text>
  <line x1="614" y1="312" x2="740" y2="392" stroke="var(--accent)" stroke-width="6"/>
  <polygon points="742,394 724,382 726,398" fill="var(--accent)"/>
  <text class="g" x="756" y="388">Grid storage</text>
  <text class="d" x="756" y="414">Credit → 2030s</text>
  <text class="d" x="756" y="438">No China cells</text>

  <text class="c" x="60" y="528">Same line, pivoting to the credit that survives</text>
</svg>
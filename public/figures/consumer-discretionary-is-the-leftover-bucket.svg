<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="消費總流被四道粗流分走，右側只剩一道細流落進殘差桶">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">先分完，剩下的才掉進這一桶</text>
<rect x="80" y="110" width="800" height="52" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="104" y="144" font-size="20" fill="var(--ink)">所有消費</text>
<polygon points="90,162 250,162 250,300 110,300" fill="var(--grey)" opacity="0.45"/>
<polygon points="260,162 420,162 420,300 280,300" fill="var(--grey)" opacity="0.45"/>
<polygon points="430,162 590,162 590,300 450,300" fill="var(--grey)" opacity="0.45"/>
<polygon points="600,162 760,162 760,300 620,300" fill="var(--grey)" opacity="0.45"/>
<polygon points="790,162 830,162 862,300 830,300" fill="var(--accent)" opacity="0.5"/>
<rect x="100" y="300" width="150" height="96" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="140" y="356" font-size="19" fill="var(--ink)">工業</text>
<rect x="270" y="300" width="150" height="96" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="310" y="356" font-size="19" fill="var(--ink)">科技</text>
<rect x="440" y="300" width="150" height="96" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="480" y="356" font-size="19" fill="var(--ink)">醫療</text>
<rect x="610" y="300" width="150" height="96" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="632" y="356" font-size="19" fill="var(--ink)">必需消費</text>
<rect x="800" y="300" width="64" height="96" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="762" y="428" font-size="16" fill="var(--accent)">消費耐久財</text>
<text class="t" x="60" y="500" font-size="22" fill="var(--ink)">萎縮的是殘差，不是消費</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條線在衝擊點後分岔，一條回到原軌道一條回不去，中間距離標為失效條件">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">兩套說法會在哪裡分岔</text>

<line x1="80" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="80" y1="120" x2="80" y2="470" stroke="var(--line)" stroke-width="2"/>

<path d="M100 220 L 300 218 L 420 340" fill="none" stroke="var(--ink)" stroke-width="4"/>
<line x1="300" y1="140" x2="300" y2="440" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text x="300" y="128" font-size="16" fill="var(--warn)" text-anchor="middle">衝擊來了</text>

<line x1="560" y1="140" x2="560" y2="440" stroke="var(--dim)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="560" y="128" font-size="16" fill="var(--dim)" text-anchor="middle">衝擊源退去</text>

<path d="M420 340 L 560 344 L 860 222" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M420 340 L 560 344 L 860 366" fill="none" stroke="var(--warn)" stroke-width="4"/>
<line x1="100" y1="220" x2="880" y2="220" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 6"/>
<text x="112" y="206" font-size="15" fill="var(--dim)">原本的軌道</text>

<text x="874" y="216" font-size="16" fill="var(--accent)">回得去</text>
<text x="874" y="372" font-size="16" fill="var(--warn)">回不去</text>
<line x1="836" y1="228" x2="836" y2="360" stroke="var(--ink)" stroke-width="2"/>
<text x="700" y="418" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">這段距離就是分岔點</text>

<text x="480" y="524" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">敘事說服自己，分岔點對答案</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上面一條三段組成的長跑道，下面一條只有一段的短跑道">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">兩邊在量的東西不一樣</text>

  <text class="t" x="60" y="140" font-size="20" font-weight="700" fill="var(--ink)">中國在量的</text>
  <g stroke="var(--line)" stroke-width="2">
    <rect x="140" y="170" width="220" height="80" fill="var(--card)"/>
    <rect x="372" y="170" width="220" height="80" fill="var(--card)"/>
    <rect x="604" y="170" width="220" height="80" fill="var(--accent)"/>
  </g>
  <text class="t" x="250" y="218" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">發電</text>
  <text class="t" x="482" y="218" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">供應鏈</text>
  <text class="t" x="714" y="218" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">模型</text>

  <text class="t" x="60" y="330" font-size="20" font-weight="700" fill="var(--ink)">美國在量的</text>
  <rect x="140" y="360" width="452" height="80" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="t" x="366" y="408" font-size="16" fill="var(--dim)" text-anchor="middle">沒計分</text>
  <rect x="604" y="360" width="220" height="80" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="714" y="408" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">模型</text>

  <text class="t" x="480" y="500" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">「落後幾個月」是在比哪一段</text>
</svg>
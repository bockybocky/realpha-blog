<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三個按金額比例縮短的橫條，最後一段標示流向上游零件">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="52" font-size="27" fill="var(--ink)">合約公布，錢往上游走</text>

<rect x="60" y="110" width="560" height="64" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="340" y="150" font-size="19" fill="var(--ink)" text-anchor="middle">七年合約　116 億美元</text>
<text x="640" y="150" font-size="16" fill="var(--dim)">需求</text>

<path d="M120 182 L120 214" fill="none" stroke="var(--dim)" stroke-width="2"/>
<rect x="60" y="222" width="266" height="64" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="193" y="262" font-size="19" fill="var(--accent)" text-anchor="middle">資本支出　55 億</text>
<text x="350" y="262" font-size="16" fill="var(--dim)">融資問題</text>

<path d="M120 294 L120 326" fill="none" stroke="var(--dim)" stroke-width="2"/>
<rect x="60" y="334" width="82" height="64" rx="8" fill="var(--accent)"/>
<text x="101" y="374" font-size="16" fill="var(--page)" text-anchor="middle">17 億</text>
<text x="166" y="368" font-size="19" fill="var(--ink)">2026 預先採購 CPU 與記憶體</text>
<path d="M560 362 L640 362" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M648 362 l-14 -7 v14 z" fill="var(--accent)"/>
<text x="740" y="368" font-size="19" fill="var(--accent)">上游零件供應鏈</text>

<text x="480" y="470" font-size="22" fill="var(--ink)" text-anchor="middle">預先採購就是漲價的證據</text>
</svg>
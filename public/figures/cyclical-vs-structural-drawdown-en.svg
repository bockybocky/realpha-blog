<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The left line drops a big step and runs flat low; the right falls, recovers and runs off the top">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.s { font-size:16px; fill:var(--dim); }
.g { font-size:20px; font-weight:600; }
.n { font-size:15px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="62">Same loss, opposite handling</text>
<text class="s" x="60" y="94">Does the lost earnings power come back</text>
<rect x="60" y="130" width="400" height="330" rx="10" fill="var(--card)"/>
<rect x="500" y="130" width="400" height="330" rx="10" fill="var(--card)"/>
<text class="g" x="90" y="172" fill="var(--warn)">Cyclical</text>
<text class="g" x="530" y="172" fill="var(--accent)">Secular winner</text>
<line x1="90" y1="220" x2="430" y2="220" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
<polyline points="95,222 160,232 220,300 280,398 350,408 430,404" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="n" x="290" y="352">Falls beget falls</text>
<text class="n" x="290" y="376">Earnings −50%</text>
<line x1="530" y1="220" x2="870" y2="220" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
<polyline points="535,222 590,238 640,320 700,290 780,214 860,152" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polygon points="870,142 852,152 858,164" fill="var(--accent)"/>
<text class="n" x="600" y="372">−30% in 6 mths</text>
<text class="n" x="600" y="396">Then 10x</text>
<text class="c" x="60" y="518">One cut fast, one given time</text>
</svg>
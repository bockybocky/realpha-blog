<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="起薪柱兩代等高，住房成本柱在今天高出近三倍">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="56">沒變的那根，和變了的那根</text>

  <line x1="80" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="3"/>

  <rect x="150" y="250" width="110" height="180" rx="6" fill="var(--accent)"/>
  <text class="b" x="150" y="240">起薪</text>
  <rect x="300" y="320" width="110" height="110" rx="6" fill="var(--warn)"/>
  <text class="b" x="300" y="310">住房成本</text>
  <text class="g" x="150" y="468">父母那代</text>
  <text class="b" x="150" y="496">邊通勤邊存頭期款</text>

  <line x1="480" y1="120" x2="480" y2="430" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="560" y="250" width="110" height="180" rx="6" fill="var(--accent)"/>
  <text class="b" x="560" y="240">起薪</text>
  <rect x="710" y="140" width="110" height="290" rx="6" fill="var(--warn)"/>
  <text class="b" x="710" y="130">住房成本</text>
  <text class="g" x="560" y="468">現在</text>
  <text class="b" x="560" y="496">先在家住兩年</text>

  <line x1="276" y1="250" x2="544" y2="250" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="c" x="300" y="100">變掉的是後面那根</text>
</svg>
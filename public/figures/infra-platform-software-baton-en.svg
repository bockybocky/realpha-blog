<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Infrastructure, platform and software form three hand-off curves, the earlier one rolling over without returning to the dashed prior high, and the money marker sits on the last curve.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="58" font-size="27" fill="var(--ink)">Where the baton is now</text>
<line x1="90" y1="430" x2="890" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="90" y1="160" x2="890" y2="160" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 8"/>
<text x="90" y="146" font-size="16" fill="var(--dim)">Prior high</text>

<path d="M110,430 C190,170 290,170 370,340" fill="none" stroke="var(--grey)" stroke-width="5"/>
<path d="M330,430 C410,200 510,200 590,360" fill="none" stroke="var(--grey)" stroke-width="5"/>
<path d="M550,430 C630,250 730,170 860,180" fill="none" stroke="var(--accent)" stroke-width="5"/>

<text x="140" y="470" font-size="20" fill="var(--dim)">Infrastructure</text>
<text x="420" y="470" font-size="20" fill="var(--dim)">Platform</text>
<text x="700" y="470" font-size="20" fill="var(--accent)">Software</text>

<circle cx="372" cy="340" r="10" fill="var(--warn)"/>
<text x="300" y="382" font-size="16" fill="var(--warn)">Hardware no new high</text>
<circle cx="800" cy="180" r="12" fill="var(--accent)"/>
<text x="736" y="146" font-size="19" fill="var(--accent)">Money is here</text>
<text x="90" y="510" font-size="16" fill="var(--dim)">Time</text>
</g>
</svg>
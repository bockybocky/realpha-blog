<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Liquidity is pumped up and then withdrawn, the Nasdaq peaks and falls after the withdrawal, and interest rates rise throughout.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="58">It was the money, not the story</text>
<line x1="80" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="520" y1="110" x2="520" y2="490" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>
<text class="g" x="520" y="520" text-anchor="middle" fill="var(--warn)">Year-end passes</text>
<polyline points="90,330 230,320 330,250 440,180 520,170 580,260 660,350 760,410 880,440" fill="none" stroke="var(--accent)" stroke-width="6"/>
<text class="g" x="300" y="222" fill="var(--accent)">Liquidity</text>
<polyline points="90,400 230,370 340,330 450,280 520,252 575,215 620,232 720,320 820,400 880,430" fill="none" stroke="var(--grey)" stroke-width="6"/>
<circle cx="575" cy="215" r="9" fill="var(--ink)"/>
<text class="b" x="596" y="206">Nasdaq peaks</text>
<text class="g" x="120" y="420">Nasdaq</text>
<polyline points="90,450 880,392" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 6"/>
<text class="b" x="760" y="378">Rates rise throughout</text>
<text class="b" x="90" y="150">Second half of 1999: rates rise as liquidity is pumped in</text>
<text class="c" x="60" y="552">Withdraw the water, and the top appears</text>
</svg>
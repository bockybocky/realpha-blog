<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸由實線漸轉虛線，末端分岔成兩條去向不明的路">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="70" font-size="27" fill="var(--ink)">路線圖看得見的地方，與看不見的地方</text>
<line x1="80" y1="280" x2="330" y2="280" stroke="var(--accent)" stroke-width="5"/>
<line x1="330" y1="280" x2="520" y2="280" stroke="var(--accent)" stroke-width="4" stroke-dasharray="14 8"/>
<line x1="520" y1="280" x2="640" y2="280" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 10"/>
<line x1="640" y1="280" x2="880" y2="190" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 12"/>
<line x1="640" y1="280" x2="880" y2="380" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 12"/>
<circle cx="140" cy="280" r="10" fill="var(--accent)"/>
<circle cx="330" cy="280" r="9" fill="var(--accent)"/>
<circle cx="520" cy="280" r="8" fill="var(--grey)"/>
<circle cx="640" cy="280" r="7" fill="var(--warn)"/>
<text x="110" y="245" font-size="20" fill="var(--ink)">Rubin</text>
<text x="110" y="322" font-size="16" fill="var(--dim)">在出貨</text>
<text x="295" y="245" font-size="20" fill="var(--ink)">Rubin Ultra</text>
<text x="295" y="322" font-size="16" fill="var(--dim)">聽起來烤好了</text>
<text x="490" y="245" font-size="20" fill="var(--ink)">Feynman</text>
<text x="490" y="322" font-size="16" fill="var(--dim)">幾分熟不確定</text>
<text x="690" y="165" font-size="19" fill="var(--warn)">記憶體架構？HBM 放多少？</text>
<text x="690" y="412" font-size="19" fill="var(--warn)">下一個大轉彎往哪邊轉？</text>
<text x="60" y="462" font-size="22" fill="var(--ink)">固定下來的那一段，不需要新的判斷</text>
</svg>
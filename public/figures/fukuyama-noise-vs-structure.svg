<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="細灰線每天劇烈抖動，底下有一條平穩下斜的粗藍線代表長期結構">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); font-size:16px; }
</style>
<text x="480" y="50" text-anchor="middle" style="font-size:27px;font-weight:700">雜音與結構</text>
<polyline points="100,220 120,174 140,257 160,211 180,295 200,198 220,252 240,176 260,290 280,243 300,307 320,231 340,284 360,208 380,307 400,260 420,334 440,238 460,311 480,255 500,339 520,272 540,316 560,250 580,338 600,292 620,366 640,280 660,333 680,277 700,371 720,304 740,358 760,297 780,375 800,339 820,388 840,331 860,375" fill="none" stroke="var(--grey)" stroke-width="2.5"/>
<line x1="100" y1="220" x2="860" y2="360" stroke="var(--accent)" stroke-width="7"/>
<circle cx="240" cy="176" r="6" fill="var(--warn)"/>
<text x="240" y="150" text-anchor="middle" style="font-size:19px;fill:var(--warn);font-weight:700">吵翻天</text>
<line x1="220" y1="440" x2="270" y2="440" stroke="var(--grey)" stroke-width="2.5"/>
<text x="282" y="446" style="font-size:16px;fill:var(--dim)">每天的標題：雜音</text>
<line x1="540" y1="440" x2="590" y2="440" stroke="var(--accent)" stroke-width="7"/>
<text x="602" y="446" style="font-size:16px">十年的方向：結構</text>
<text x="480" y="505" text-anchor="middle" style="font-size:22px;font-weight:700">看方向，不看單日</text>
</svg>
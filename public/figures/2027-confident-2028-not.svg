<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="需求線下彎與供給線上抬在 2028 附近靠攏，2027 區間標有把握、2028 區間標問號">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="48">界線畫在 2027 和 2028 之間</text>

<rect x="540" y="86" width="360" height="356" rx="10" fill="var(--card)" stroke="var(--line)"/>
<path d="M90 86 L90 442 L900 442" stroke="var(--line)" stroke-width="2"/>

<path d="M110 160 C300 170 420 185 540 200 C650 215 760 300 880 345" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="110" y="140">需求</text>

<path d="M110 390 C300 382 420 374 540 362 C650 350 760 280 880 250" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text class="g" x="110" y="420">供給</text>

<text class="g" x="240" y="476">2027</text>
<text class="s" x="240" y="504">他說有把握</text>
<text class="g" x="690" y="476">2028</text>
<text class="s" x="690" y="504">他說沒有</text>

<text class="s" x="560" y="124">新產能開出</text>
<text class="s" x="560" y="152">新案子難批</text>
<text class="s" x="560" y="180">中國需求被削</text>

<text class="c" x="60" y="546">缺口在收攏，收不收得起來沒人說得準</text>
</svg>
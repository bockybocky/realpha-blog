<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two sites compared by density and rent height, with the right-hand column only a third the height of the left.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Same shared kitchen, different ground</text>
<text x="60" y="90" font-size="15" fill="var(--dim)">Use sets the location, location sets the price per square foot</text>

<text x="60" y="140" font-size="20" font-weight="700" fill="var(--ink)">Ghost kitchen</text>
<text x="60" y="166" font-size="16" fill="var(--dim)">Delivery only, has to reach you</text>
<g fill="var(--grey)">
<rect x="60" y="190" width="30" height="30" rx="4"/><rect x="98" y="190" width="30" height="30" rx="4"/><rect x="136" y="190" width="30" height="30" rx="4"/><rect x="174" y="190" width="30" height="30" rx="4"/><rect x="212" y="190" width="30" height="30" rx="4"/><rect x="250" y="190" width="30" height="30" rx="4"/>
<rect x="60" y="228" width="30" height="30" rx="4"/><rect x="98" y="228" width="30" height="30" rx="4"/><rect x="136" y="228" width="30" height="30" rx="4"/><rect x="174" y="228" width="30" height="30" rx="4"/><rect x="212" y="228" width="30" height="30" rx="4"/><rect x="250" y="228" width="30" height="30" rx="4"/>
<rect x="60" y="266" width="30" height="30" rx="4"/><rect x="98" y="266" width="30" height="30" rx="4"/><rect x="136" y="266" width="30" height="30" rx="4"/><rect x="174" y="266" width="30" height="30" rx="4"/><rect x="212" y="266" width="30" height="30" rx="4"/><rect x="250" y="266" width="30" height="30" rx="4"/>
</g>
<rect x="330" y="160" width="86" height="300" fill="var(--warn)"/>
<text x="373" y="146" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">1</text>

<line x1="480" y1="130" x2="480" y2="470" stroke="var(--line)" stroke-width="2"/>

<text x="520" y="140" font-size="20" font-weight="700" fill="var(--ink)">Shared kitchen</text>
<text x="520" y="166" font-size="16" fill="var(--dim)">Industrial strip toward Midway</text>
<g fill="var(--grey)">
<rect x="520" y="190" width="30" height="30" rx="4"/><rect x="596" y="190" width="30" height="30" rx="4"/>
<rect x="558" y="266" width="30" height="30" rx="4"/><rect x="634" y="266" width="30" height="30" rx="4"/>
</g>
<rect x="760" y="360" width="86" height="100" fill="var(--accent)"/>
<text x="803" y="346" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">One third</text>
<text x="803" y="488" font-size="16" fill="var(--dim)" text-anchor="middle">Value per square foot</text>
<text x="373" y="488" font-size="16" fill="var(--dim)" text-anchor="middle">Value per square foot</text>

<text x="60" y="548" font-size="22" font-weight="700" fill="var(--ink)">If you don't have to reach them, you don't have to pay for that ground</text>
</g>
</svg>
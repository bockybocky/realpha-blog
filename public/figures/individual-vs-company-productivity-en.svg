<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The individual productivity bar on the left towers high and is labeled times one hundred, while company results on the right are only a short dashed box with a question mark.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:20px;font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700}
    .a{fill:var(--accent)}
    .w{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">You 100x; firm?</text>
<line x1="200" y1="460" x2="760" y2="460" stroke="var(--line)" stroke-width="2"/>
<rect x="260" y="130" width="160" height="330" rx="6" fill="var(--accent)"/>
<text class="c a" x="340" y="116" text-anchor="middle">×100</text>
<text class="g" x="340" y="494" text-anchor="middle">Person</text>
<text class="b" x="340" y="520" text-anchor="middle">10 min vs 3 days</text>
<rect x="540" y="380" width="160" height="80" rx="6" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="c w" x="620" y="436" text-anchor="middle" style="font-size:40px">?</text>
<text class="b" x="620" y="362" text-anchor="middle">TBD</text>
<text class="g" x="620" y="494" text-anchor="middle">Firm</text>
<text class="b" x="620" y="520" text-anchor="middle">Deals</text>
</svg>
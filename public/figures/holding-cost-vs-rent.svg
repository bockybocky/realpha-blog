<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左側持有成本由房產稅、房貸利息、管理費堆成一根高柱，右側租金收益的柱子必須高過它，差距處是每年要自己補的缺口">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62">漲了五到七成，還是賣不掉</text>

  <path d="M140 430 L880 430" stroke="var(--line)" stroke-width="2"/>

  <text class="g" x="230" y="128">每年要付出去的</text>
  <rect x="230" y="150" width="200" height="70" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <text class="b" x="250" y="192">房貸利率 7.4%</text>
  <rect x="230" y="220" width="200" height="130" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <text class="b" x="250" y="292">房產稅 每年 1% 起</text>
  <rect x="230" y="350" width="200" height="80" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <text class="b" x="250" y="396">管理費</text>

  <text class="g" x="600" y="128">能收回來的</text>
  <rect x="600" y="300" width="200" height="130" rx="6" fill="var(--accent)"/>
  <text class="b" x="622" y="372" fill="var(--page)" font-weight="700">租金收益</text>

  <path d="M700 150 L700 288" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M470 150 L690 150" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="b" x="714" y="226" fill="var(--warn)" font-weight="700">租金要長到這裡</text>
  <text class="b" x="714" y="252" fill="var(--warn)">長不到就是每年自己補</text>

  <text class="c" x="60" y="500">所以那邊更像一個租賃市場</text>
  <text class="b" x="60" y="532">拿得出全額現金的人，他反問：那怎麼不去投股票</text>
</svg>
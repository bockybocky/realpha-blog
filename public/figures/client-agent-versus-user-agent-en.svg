<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A narrow tall block on the left stands for few people paying a lot; a wide short block on the right stands for very many people each paying a little.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; fill:var(--ink); font-weight:700; }
    .g  { font-size:19px; fill:var(--dim); font-weight:700; }
    .b  { font-size:16px; fill:var(--ink); }
    .c  { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="40" y="54">Two shapes of business</text>

  <line x1="140" y1="110" x2="140" y2="440" stroke="var(--grey)" stroke-width="2"/>
  <line x1="140" y1="440" x2="900" y2="440" stroke="var(--grey)" stroke-width="2"/>
  <text class="g" x="40" y="150">Paid</text>
  <text class="g" x="40" y="174">per head</text>
  <text class="g" x="880" y="476" text-anchor="end">Headcount</text>

  <rect x="200" y="150" width="60" height="290" fill="var(--grey)"/>
  <text class="g" x="200" y="134">Client-agent type</text>
  <text class="b" x="200" y="508">100,000 people</text>
  <text class="b" x="200" y="532">1 million yen each</text>

  <rect x="480" y="380" width="400" height="60" fill="var(--accent)"/>
  <text class="g" x="480" y="356" fill="var(--accent)">User-agent type</text>
  <text class="b" x="480" y="508">60 million people</text>
  <text class="b" x="480" y="532">500 yen each</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="三組長條，條數從一到四到十六，每條長度依次縮短，顯示平行切開思考時間">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
<text x="480" y="54" text-anchor="middle" font-size="27" fill="var(--ink)">把思考時間橫著切開</text>

<rect x="180" y="112" width="580" height="24" rx="4" fill="var(--grey)"/>
<text x="162" y="131" text-anchor="end" font-size="19" fill="var(--ink)">1 個代理</text>
<text x="780" y="131" font-size="15" fill="var(--dim)">基準時間</text>

<rect x="180" y="182" width="290" height="16" rx="3" fill="var(--accent)"/>
<rect x="180" y="204" width="290" height="16" rx="3" fill="var(--accent)"/>
<rect x="180" y="226" width="290" height="16" rx="3" fill="var(--accent)"/>
<rect x="180" y="248" width="290" height="16" rx="3" fill="var(--accent)"/>
<text x="162" y="222" text-anchor="end" font-size="19" fill="var(--ink)">4 個代理</text>
<text x="490" y="216" font-size="15" fill="var(--dim)">時間減半</text>
<text x="490" y="240" font-size="15" fill="var(--dim)">成本兩倍</text>

<rect x="180" y="305" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="315" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="325" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="335" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="345" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="355" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="365" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="375" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="385" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="395" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="405" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="415" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="425" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="435" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="445" width="180" height="5" fill="var(--accent)"/>
<rect x="180" y="455" width="180" height="5" fill="var(--accent)"/>
<text x="162" y="388" text-anchor="end" font-size="19" fill="var(--ink)">16 個代理</text>
<text x="380" y="374" font-size="15" fill="var(--dim)">再短一截</text>
<text x="380" y="398" font-size="15" fill="var(--dim)">效率打折</text>

<line x1="180" y1="500" x2="790" y2="500" stroke="var(--line)" stroke-width="2"/>
<path d="M790 500 L778 494 L778 506 Z" fill="var(--line)"/>
<text x="800" y="505" font-size="15" fill="var(--dim)">時間</text>

<text x="480" y="570" text-anchor="middle" font-size="22" fill="var(--ink)">時間砍一半，成本翻一倍</text>
</svg>
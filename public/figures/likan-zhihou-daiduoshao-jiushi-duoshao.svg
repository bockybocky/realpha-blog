<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一個從左側滿格開始、經過三段階梯式下降到接近零的能量區塊，三段分別標為潛入、待命、返航，上方一條虛線標示途中沒有補給點">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">離岸之後</text>

  <line x1="60" y1="128" x2="900" y2="128" stroke="var(--grey)" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="60" y="118" font-size="16" fill="var(--dim)">途中沒有加油站</text>

  <polygon points="80,400 80,168 340,168 340,258 620,258 620,336 880,336 880,400"
           fill="var(--accent)" opacity="0.85"/>
  <line x1="80" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="3"/>

  <text x="80" y="158" font-size="16" fill="var(--dim)">出發時的全部能量</text>
  <text x="140" y="436" font-size="20" fill="var(--ink)">潛入</text>
  <text x="440" y="436" font-size="20" fill="var(--ink)">待命</text>
  <text x="720" y="436" font-size="20" fill="var(--ink)">返航</text>

  <text x="60" y="492" font-size="22" font-weight="700" fill="var(--ink)">三段都要吃，而且只能吃出發那一箱</text>
</svg>
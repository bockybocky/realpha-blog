<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The jagged line above swings and lands back where it began, while the smooth line below keeps rising to the right.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">Does this news change the rules, or the capacity</text>

<line x1="120" y1="190" x2="720" y2="190" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<polyline points="120,190 180,110 240,262 300,120 360,254 420,130 480,258 540,124 600,250 660,142 720,190"
  fill="none" stroke="var(--warn)" stroke-width="4" stroke-linejoin="round"/>
<text x="120" y="92" font-size="20" fill="var(--warn)">Rules</text>
<text x="748" y="182" font-size="19" fill="var(--warn)">Set the swings</text>
<text x="748" y="212" font-size="15" fill="var(--dim)">Loud, reversible</text>

<line x1="120" y1="470" x2="720" y2="470" stroke="var(--line)" stroke-width="2"/>
<path d="M120 466 C 280 458, 400 430, 520 396 S 660 350, 720 330"
  fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="120" y="424" font-size="20" fill="var(--accent)">Capacity</text>
<text x="748" y="330" font-size="19" fill="var(--accent)">Sets the end</text>
<text x="748" y="360" font-size="15" fill="var(--dim)">Quiet, slow, hard to undo</text>

<text x="420" y="528" font-size="22" fill="var(--ink)" text-anchor="middle">The loudest weeks are the ones with the most wasted moves</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條佔滿整張圖的長條代表六十年樣本，下面一小截幾乎看不見的長條代表三年">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.f10-b{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.f10-t{font-size:27px;font-weight:700}
.f10-g{font-size:19px;fill:var(--dim)}
.f10-i{font-size:19px;font-weight:700;fill:var(--page)}
.f10-s{font-size:15px}
.f10-c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="f10-b f10-t" x="60" y="66">要確定一個方法壞了，需要多長的樣本</text>
<text class="f10-b f10-g" x="60" y="180">判定失效所需</text>
<rect x="60" y="196" width="840" height="54" fill="var(--accent)"/>
<text class="f10-b f10-i" x="480" y="232" text-anchor="middle">六十年</text>
<text class="f10-b f10-g" x="60" y="316">你實際等得下去的</text>
<rect x="60" y="332" width="42" height="54" fill="var(--warn)"/>
<text class="f10-b f10-s" x="118" y="366" fill="var(--warn)">三年</text>
<text class="f10-b f10-c" x="60" y="452">中間那一大段，全是雜訊</text>
</svg>
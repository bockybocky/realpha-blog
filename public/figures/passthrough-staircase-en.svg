<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A four-step staircase descending from upper left to lower right, showing the ability to pass costs through falling step by step">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">The same cost passes through less the further down you go</text>
<text x="60" y="102" font-size="16" fill="var(--dim)">Bar height = share passed through</text>

<rect x="80" y="150" width="180" height="270" rx="10" fill="var(--accent)"/>
<text x="170" y="190" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">B2B</text>
<text x="170" y="446" font-size="16" fill="var(--dim)" text-anchor="middle">All say they passed it on</text>

<rect x="290" y="230" width="180" height="190" rx="10" fill="var(--accent)" opacity="0.75"/>
<text x="380" y="270" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">High-end customers</text>
<text x="380" y="446" font-size="16" fill="var(--dim)" text-anchor="middle">Easy</text>

<rect x="500" y="320" width="180" height="100" rx="10" fill="var(--accent)" opacity="0.45"/>
<text x="590" y="360" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Low-income</text>
<text x="590" y="446" font-size="16" fill="var(--dim)" text-anchor="middle">Hard</text>

<rect x="710" y="382" width="180" height="38" rx="10" fill="var(--warn)"/>
<text x="800" y="366" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Big-box stores</text>
<text x="800" y="446" font-size="16" fill="var(--warn)" text-anchor="middle">Nearly impossible</text>

<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="800" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">"I have to come up with a price"</text>
<text x="480" y="528" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">What blocks the last step is the big-box store</text>
</svg>
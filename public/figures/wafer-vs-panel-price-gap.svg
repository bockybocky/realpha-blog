<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="漲價前後兩組長條，灰色晶圓級長條由七升到十，藍色面板級長條維持五，兩者差距由二拉大到五">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .gap { stroke:var(--ink); stroke-width:2; fill:none; }
    .guide { stroke:var(--dim); stroke-width:1.5; stroke-dasharray:5 5; }
</style>
<text x="60" y="64" class="t">晶圓級漲價，價差拉開</text>
<text x="60" y="94" class="b">數字為示意</text>
<line x1="120" y1="440" x2="860" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="170" y="244" width="100" height="196" fill="var(--grey)"/>
<rect x="290" y="300" width="100" height="140" fill="var(--accent)"/>
<text x="220" y="234" text-anchor="middle" class="g">7</text>
<text x="340" y="290" text-anchor="middle" class="g">5</text>
<line x1="270" y1="244" x2="410" y2="244" class="guide"/>
<path d="M404 244 L416 244 M410 244 L410 300 M404 300 L416 300" class="gap"/>
<text x="424" y="279" class="g">差 2</text>
<rect x="560" y="160" width="100" height="280" fill="var(--grey)"/>
<rect x="680" y="300" width="100" height="140" fill="var(--accent)"/>
<text x="610" y="150" text-anchor="middle" class="g">10</text>
<text x="730" y="290" text-anchor="middle" class="g">5</text>
<line x1="660" y1="160" x2="800" y2="160" class="guide"/>
<path d="M794 160 L806 160 M800 160 L800 300 M794 300 L806 300" class="gap"/>
<text x="814" y="237" class="g">差 5</text>
<text x="220" y="468" text-anchor="middle" class="b">晶圓級</text>
<text x="340" y="468" text-anchor="middle" class="b">面板級</text>
<text x="610" y="468" text-anchor="middle" class="b">晶圓級</text>
<text x="730" y="468" text-anchor="middle" class="b">面板級</text>
<text x="280" y="508" text-anchor="middle" class="g">漲價前</text>
<text x="670" y="508" text-anchor="middle" class="g">漲價後</text>
<text x="480" y="556" text-anchor="middle" class="c">面板級沒動，旁邊變貴</text>
</svg>
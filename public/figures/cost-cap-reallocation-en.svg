<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two stacked bars before and after the cap, with the long-term research band going from thick to thin.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t h" x="60" y="68">After the cap, every unit of resource picks a side</text>

<text class="t g" x="60" y="130">Before the cap</text>
<rect x="60" y="150" width="520" height="70" rx="8" fill="var(--accent)" opacity="0.85"/>
<rect x="580" y="150" width="300" height="70" rx="8" fill="var(--warn)" opacity="0.85"/>
<text class="t b" x="78" y="193" fill="var(--page)">On the car in three months</text>
<text class="t b" x="600" y="193" fill="var(--page)">Long-term research</text>

<text class="t g" x="60" y="300">After the cap</text>
<rect x="60" y="320" width="520" height="70" rx="8" fill="var(--accent)" opacity="0.85"/>
<rect x="580" y="320" width="90" height="70" rx="8" fill="var(--warn)" opacity="0.85"/>
<text class="t b" x="78" y="363" fill="var(--page)">On the car in three months</text>
<text class="t b" x="690" y="363">Squeezed thin</text>
<path d="M880 320 L880 390" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 7"/>
<text class="t b" x="820" y="420">Cap</text>

<text class="t c" x="60" y="478">The lab pays the price, but competition came back</text>
</svg>
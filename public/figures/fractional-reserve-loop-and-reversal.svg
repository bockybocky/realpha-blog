<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左側信用循環圓環與右側反轉時的陡降曲線對照">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">循環，與循環反轉</text>

<circle cx="276" cy="300" r="130" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polygon points="276,158 296,182 256,182" fill="var(--accent)"/>
<circle cx="276" cy="300" r="60" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="238" y="296" font-size="19" fill="var(--ink)">晶片</text>
<text x="238" y="324" font-size="19" fill="var(--ink)">供應商</text>
<text x="402" y="258" font-size="19" fill="var(--accent)">信用</text>
<text x="402" y="286" font-size="16" fill="var(--dim)">資產負債表</text>
<text x="120" y="420" font-size="19" fill="var(--accent)">訂單</text>
<text x="222" y="474" font-size="19" fill="var(--ink)">算力商</text>
<text x="222" y="118" font-size="16" fill="var(--dim)">每圈帶槓桿</text>

<line x1="560" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="560" y1="440" x2="560" y2="160" stroke="var(--line)" stroke-width="2"/>
<polyline points="570,200 650,216 710,250 760,320 800,400 860,430" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text x="604" y="170" font-size="19" fill="var(--warn)">反轉</text>
<text x="604" y="198" font-size="16" fill="var(--dim)">幾何級數</text>

<text x="60" y="524" font-size="22" fill="var(--ink)">往上是加法，往下是乘法</text>
</svg>
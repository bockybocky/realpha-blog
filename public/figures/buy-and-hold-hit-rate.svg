<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊是三條很短的橫條，右邊是一根往下很深的直條">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .sub { font-size:16px; fill:var(--dim); }
    .grp { font-size:19px; fill:var(--ink); }
    .val { font-size:20px; fill:var(--ink); font-weight:700; }
    .dimtxt { font-size:15px; fill:var(--dim); }
    .concl { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="62">贏的比例小，輸的幅度大</text>
  <text class="sub" x="60" y="92">美國前 500 大股票，買進持有能贏過大盤的比例</text>

  <text class="grp" x="60" y="170">贏過大盤的比例</text>
  <line x1="200" y1="190" x2="200" y2="400" stroke="var(--line)" stroke-width="2"/>

  <text class="dimtxt" x="188" y="224" text-anchor="end">1 年</text>
  <rect x="200" y="206" width="150" height="26" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="dimtxt" x="364" y="225">比較高，節目未給數字</text>

  <text class="dimtxt" x="188" y="296" text-anchor="end">3 年</text>
  <rect x="200" y="278" width="84" height="26" fill="var(--accent)"/>
  <text class="val" x="298" y="298">28%</text>

  <text class="dimtxt" x="188" y="368" text-anchor="end">10 年</text>
  <rect x="200" y="350" width="69" height="26" fill="var(--accent)"/>
  <text class="val" x="283" y="370">23%</text>

  <line x1="560" y1="150" x2="560" y2="470" stroke="var(--line)" stroke-width="2"/>

  <text class="grp" x="700" y="170" text-anchor="middle">跑輸的那些，輸多少</text>
  <line x1="640" y1="200" x2="820" y2="200" stroke="var(--line)" stroke-width="2"/>
  <rect x="680" y="200" width="100" height="240" fill="var(--warn)"/>
  <text class="val" x="730" y="470" text-anchor="middle" fill="var(--warn)">平均落後 62%</text>
  <text class="dimtxt" x="730" y="496" text-anchor="middle">三年前買進、跑輸 S&amp;P 500 的股票</text>

  <text class="concl" x="60" y="524">拉愈長，愈不容易說出可靠的話</text>
</svg>
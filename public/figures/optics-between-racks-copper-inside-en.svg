<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Light already runs between the racks while copper still runs inside the enlarged rack, with a dashed conversion layer left to be filled in between.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Optics at the door, not in</text>

<text x="60" y="130" font-size="20" fill="var(--accent)">Racks: optical</text>
<rect x="60" y="160" width="76" height="250" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="166" y="160" width="76" height="250" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="272" y="160" width="76" height="250" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<path d="M136 230 L166 230" stroke="var(--accent)" stroke-width="3"/>
<path d="M242 230 L272 230" stroke="var(--accent)" stroke-width="3"/>
<path d="M136 330 L166 330" stroke="var(--accent)" stroke-width="3"/>
<path d="M242 330 L272 330" stroke="var(--accent)" stroke-width="3"/>
<text x="204" y="446" font-size="16" text-anchor="middle" fill="var(--dim)">scale-out</text>

<path d="M348 200 L556 150" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M348 370 L556 430" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>

<text x="556" y="130" font-size="20" fill="var(--ink)">Inside: copper</text>
<rect x="556" y="150" width="344" height="280" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="584" y="210" width="96" height="80" rx="8" fill="var(--page)" stroke="var(--dim)" stroke-width="2"/>
<text x="632" y="258" font-size="19" text-anchor="middle" fill="var(--ink)">CPU</text>
<rect x="776" y="210" width="96" height="80" rx="8" fill="var(--page)" stroke="var(--dim)" stroke-width="2"/>
<text x="824" y="258" font-size="19" text-anchor="middle" fill="var(--ink)">GPU</text>
<path d="M680 250 L776 250" stroke="var(--grey)" stroke-width="10"/>
<text x="728" y="196" font-size="16" text-anchor="middle" fill="var(--dim)">Copper</text>
<rect x="696" y="320" width="64" height="56" rx="8" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="6 5"/>
<path d="M728 310 L728 286" stroke="var(--warn)" stroke-width="3"/>
<path d="M718 296 L728 278 L738 296 Z" fill="var(--warn)"/>
<text x="728" y="402" font-size="19" text-anchor="middle" fill="var(--warn)">Missing layer</text>
<text x="728" y="462" font-size="16" text-anchor="middle" fill="var(--dim)">scale-up</text>

<text x="480" y="522" font-size="22" text-anchor="middle" fill="var(--ink)">Buy the gap, not the price</text>
</svg>
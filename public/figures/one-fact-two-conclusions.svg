<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一個事實往上下分出兩條相反結論，下方那條被後來的數字接住">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">同一句話，兩個出口</text>
<rect x="60" y="230" width="250" height="90" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="185" y="268" font-size="20" fill="var(--ink)" text-anchor="middle">AI 找得出漏洞</text>
<text x="185" y="296" font-size="16" fill="var(--dim)" text-anchor="middle">雙方都接受的事實</text>
<path d="M310 258 C 420 258 440 160 540 160" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<path d="M310 292 C 420 292 440 400 540 400" fill="none" stroke="var(--accent)" stroke-width="6"/>
<polygon points="540,152 558,160 540,168" fill="var(--grey)"/>
<polygon points="540,392 558,400 540,408" fill="var(--accent)"/>
<rect x="566" y="124" width="236" height="72" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="684" y="168" font-size="20" fill="var(--dim)" text-anchor="middle">不用人防了</text>
<rect x="566" y="364" width="236" height="72" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="684" y="408" font-size="20" fill="var(--ink)" text-anchor="middle">更需要防</text>
<text x="820" y="154" font-size="16" fill="var(--dim)">價格：跌 25%</text>
<text x="820" y="178" font-size="16" fill="var(--dim)">時點：二月</text>
<text x="820" y="394" font-size="16" fill="var(--ink)">欄位：新增 ARR</text>
<text x="820" y="418" font-size="16" fill="var(--accent)">年增 51%</text>
<text x="60" y="492" font-size="22" fill="var(--ink)">分岔不在事實，在「找到之後誰去修」</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Each of five power sources has a filled developer slot beneath it, while the nuclear slot is an empty dashed box.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">The slot that is missing</text>

<text class="t" x="60" y="150" font-size="19" fill="var(--dim)">Power source</text>
<text class="t" x="60" y="300" font-size="19" fill="var(--dim)">Developer</text>
<text class="t" x="60" y="430" font-size="19" fill="var(--dim)">Gets built</text>

<g>
<rect x="190" y="112" width="110" height="52" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="245" y="146" font-size="16" fill="var(--ink)" text-anchor="middle">Gas</text>
<rect x="190" y="262" width="110" height="52" rx="6" fill="var(--accent)"/>
<rect x="190" y="400" width="110" height="36" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="245" y="425" font-size="16" fill="var(--ink)" text-anchor="middle">Yes</text>
<line x1="245" y1="166" x2="245" y2="258" stroke="var(--line)" stroke-width="2"/>
<line x1="245" y1="316" x2="245" y2="396" stroke="var(--line)" stroke-width="2"/>
</g>
<g>
<rect x="320" y="112" width="110" height="52" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="375" y="146" font-size="16" fill="var(--ink)" text-anchor="middle">Wind</text>
<rect x="320" y="262" width="110" height="52" rx="6" fill="var(--accent)"/>
<rect x="320" y="400" width="110" height="36" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="375" y="425" font-size="16" fill="var(--ink)" text-anchor="middle">Yes</text>
<line x1="375" y1="166" x2="375" y2="258" stroke="var(--line)" stroke-width="2"/>
<line x1="375" y1="316" x2="375" y2="396" stroke="var(--line)" stroke-width="2"/>
</g>
<g>
<rect x="450" y="112" width="110" height="52" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="505" y="146" font-size="16" fill="var(--ink)" text-anchor="middle">Solar</text>
<rect x="450" y="262" width="110" height="52" rx="6" fill="var(--accent)"/>
<rect x="450" y="400" width="110" height="36" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="505" y="425" font-size="16" fill="var(--ink)" text-anchor="middle">Yes</text>
<line x1="505" y1="166" x2="505" y2="258" stroke="var(--line)" stroke-width="2"/>
<line x1="505" y1="316" x2="505" y2="396" stroke="var(--line)" stroke-width="2"/>
</g>
<g>
<rect x="580" y="112" width="110" height="52" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="635" y="146" font-size="16" fill="var(--ink)" text-anchor="middle">Storage</text>
<rect x="580" y="262" width="110" height="52" rx="6" fill="var(--accent)"/>
<rect x="580" y="400" width="110" height="36" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="635" y="425" font-size="16" fill="var(--ink)" text-anchor="middle">Yes</text>
<line x1="635" y1="166" x2="635" y2="258" stroke="var(--line)" stroke-width="2"/>
<line x1="635" y1="316" x2="635" y2="396" stroke="var(--line)" stroke-width="2"/>
</g>
<g>
<rect x="710" y="112" width="110" height="52" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="765" y="146" font-size="16" fill="var(--ink)" text-anchor="middle">Geothermal</text>
<rect x="710" y="262" width="110" height="52" rx="6" fill="var(--accent)"/>
<rect x="710" y="400" width="110" height="36" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="765" y="425" font-size="16" fill="var(--ink)" text-anchor="middle">Yes</text>
<line x1="765" y1="166" x2="765" y2="258" stroke="var(--line)" stroke-width="2"/>
<line x1="765" y1="316" x2="765" y2="396" stroke="var(--line)" stroke-width="2"/>
</g>

<g>
<rect x="840" y="112" width="110" height="52" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="895" y="146" font-size="16" fill="var(--ink)" text-anchor="middle">Nuclear</text>
<rect x="840" y="262" width="110" height="52" rx="6" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="840" y="400" width="110" height="36" rx="6" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
<text class="t" x="895" y="425" font-size="16" fill="var(--warn)" text-anchor="middle">Stuck</text>
<line x1="895" y1="166" x2="895" y2="258" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="895" y1="316" x2="895" y2="396" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
</g>

<text class="t" x="60" y="505" font-size="22" fill="var(--ink)">A better reactor does not produce a project</text>
</svg>
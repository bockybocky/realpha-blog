<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two side-by-side columns with two effort bars below them of very unequal length, long on the left and short on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="70">Split the columns to see the effort misplaced</text>
<rect x="80" y="120" width="380" height="210" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="510" y="120" width="380" height="210" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="270" y="160" text-anchor="middle">Clearing this gate</text>
<text class="g" x="700" y="160" text-anchor="middle" fill="var(--accent)">Getting them to change</text>
<text class="b" x="270" y="205" text-anchor="middle">Clinician signs off</text>
<text class="b" x="270" y="243" text-anchor="middle">Manager nods</text>
<text class="b" x="270" y="281" text-anchor="middle">Financials hold up</text>
<text class="b" x="700" y="205" text-anchor="middle">A real case from a peer</text>
<text class="b" x="700" y="243" text-anchor="middle">Hours saved next door</text>
<text class="b" x="700" y="281" text-anchor="middle">Two quarters as promised</text>
<text class="g" x="60" y="400">Where the effort actually goes</text>
<rect x="80" y="420" width="380" height="34" rx="6" fill="var(--grey)"/>
<rect x="510" y="420" width="70" height="34" rx="6" fill="var(--accent)"/>
<text class="b" x="270" y="484" text-anchor="middle">Most of it</text>
<text class="b" x="545" y="484" text-anchor="middle">A sliver</text>
<text class="c" x="60" y="532">Start with the cheapest item on the right</text>
</svg>
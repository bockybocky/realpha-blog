<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two areas of heating rate against time, the wide low grey one larger than the narrow tall blue one, showing that total heat load is rate times time.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Load = rate × time</text>
<line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="120" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="112" y="112" font-size="16" fill="var(--dim)" text-anchor="end">Rate</text>
<text x="880" y="470" font-size="16" fill="var(--dim)" text-anchor="end">Time</text>
<path d="M 150 440 C 300 350 420 340 520 380 C 580 405 610 430 640 440 Z" fill="var(--grey)" opacity="0.45" stroke="var(--grey)" stroke-width="2.5"/>
<path d="M 560 440 C 610 260 650 180 690 180 C 730 180 760 320 790 440 Z" fill="var(--accent)" opacity="0.3" stroke="var(--accent)" stroke-width="2.5"/>
<text x="300" y="330" font-size="19" font-weight="700" fill="var(--dim)">Flat</text>
<text x="300" y="356" font-size="15" fill="var(--dim)">Low, long</text>
<text x="690" y="150" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Dive</text>
<text x="690" y="126" font-size="15" fill="var(--dim)" text-anchor="middle">High, short</text>
<line x1="560" y1="452" x2="790" y2="452" stroke="var(--accent)" stroke-width="2"/>
<line x1="150" y1="468" x2="640" y2="468" stroke="var(--grey)" stroke-width="2"/>
<text x="675" y="500" font-size="15" fill="var(--accent)" text-anchor="middle">Short</text>
<text x="395" y="500" font-size="15" fill="var(--dim)" text-anchor="middle">Long</text>
<text x="60" y="540" font-size="22" font-weight="700" fill="var(--ink)">Take the peak, cut the total</text>
</svg>
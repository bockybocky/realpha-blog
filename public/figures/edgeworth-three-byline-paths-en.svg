<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three byline paths, and only one of them keeps her name on the work.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Same ideas, three bylines</text>

  <rect x="60" y="150" width="170" height="240" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="145" y="258" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Her</text>
  <text class="t" x="145" y="288" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">ideas</text>

  <path d="M230 200 H520" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <path d="M510 192 L528 200 L510 208 Z" fill="var(--accent)"/>
  <text class="t" x="300" y="186" font-size="16" fill="var(--dim)">As a novel</text>
  <rect x="540" y="172" width="230" height="56" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="655" y="207" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Her name</text>

  <path d="M230 270 H520" stroke="var(--grey)" stroke-width="4" fill="none"/>
  <path d="M510 262 L528 270 L510 278 Z" fill="var(--grey)"/>
  <text class="t" x="300" y="256" font-size="16" fill="var(--dim)">As a paper</text>
  <rect x="540" y="242" width="230" height="56" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="655" y="277" font-size="19" fill="var(--dim)" text-anchor="middle">Anonymous</text>

  <path d="M230 340 H520" stroke="var(--grey)" stroke-width="4" fill="none"/>
  <path d="M510 332 L528 340 L510 348 Z" fill="var(--grey)"/>
  <text class="t" x="300" y="326" font-size="16" fill="var(--dim)">Oxford tract</text>
  <rect x="540" y="312" width="230" height="56" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="655" y="347" font-size="19" fill="var(--dim)" text-anchor="middle">Her father</text>

  <text class="t" x="790" y="207" font-size="16" fill="var(--dim)">Read as fiction</text>
  <text class="t" x="790" y="277" font-size="16" fill="var(--dim)">No author known</text>
  <text class="t" x="790" y="347" font-size="16" fill="var(--dim)">Credit goes out</text>

  <text class="t" x="60" y="470" font-size="22" font-weight="700" fill="var(--ink)">The hardest work carries someone else's name</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="長約通路被關、買盤改道現貨並推高價格線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">買盤被擠到哪裡去</text>

<rect x="60" y="226" width="186" height="110" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="86" y="268" font-size="19" fill="var(--ink)">想買三年期</text>
<text x="86" y="300" font-size="19" fill="var(--ink)">的買方</text>

<line x1="246" y1="262" x2="330" y2="166" stroke="var(--grey)" stroke-width="4"/>
<line x1="246" y1="300" x2="330" y2="396" stroke="var(--accent)" stroke-width="5"/>

<rect x="334" y="124" width="250" height="88" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="356" y="160" font-size="19" fill="var(--grey)">三年長約</text>
<text x="356" y="190" font-size="16" fill="var(--grey)">貸不到支撐的錢</text>
<line x1="344" y1="208" x2="574" y2="128" stroke="var(--grey)" stroke-width="4"/>
<line x1="344" y1="128" x2="574" y2="208" stroke="var(--grey)" stroke-width="4"/>

<rect x="334" y="352" width="250" height="88" rx="10" fill="var(--page)" stroke="var(--accent)" stroke-width="4"/>
<text x="356" y="388" font-size="19" fill="var(--accent)">現貨與短約</text>
<text x="356" y="418" font-size="16" fill="var(--dim)">唯一還開著的口</text>

<line x1="584" y1="396" x2="664" y2="396" stroke="var(--accent)" stroke-width="3"/>
<polygon points="664,386 688,396 664,406" fill="var(--accent)"/>

<line x1="700" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="700" y1="430" x2="700" y2="180" stroke="var(--line)" stroke-width="2"/>
<polyline points="712,392 780,344 840,286 886,210" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="716" y="168" font-size="19" fill="var(--accent)">現貨價</text>

<text x="60" y="508" font-size="22" fill="var(--ink)">通路變窄，線還是往右上</text>
</svg>
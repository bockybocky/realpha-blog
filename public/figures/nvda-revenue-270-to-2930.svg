<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根柱並列，左柱極矮、右柱高出約十倍">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">同一家公司的年度營收</text>
<text x="60" y="100" font-size="16" fill="var(--dim)">單位：億美元</text>
<line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="190" y="400" width="150" height="30" fill="var(--grey)"/>
<text x="190" y="382" font-size="20" fill="var(--ink)">270</text>
<text x="190" y="462" font-size="16" fill="var(--dim)">2023 財年</text>
<text x="190" y="486" font-size="15" fill="var(--dim)">ChatGPT 問世前</text>
<rect x="600" y="110" width="150" height="320" fill="var(--accent)"/>
<text x="600" y="92" font-size="20" fill="var(--ink)">2,930</text>
<text x="600" y="462" font-size="16" fill="var(--dim)">本財年前三季</text>
<text x="600" y="486" font-size="15" fill="var(--dim)">第四季還沒到</text>
<line x1="420" y1="400" x2="420" y2="120" stroke="var(--dim)" stroke-width="1" stroke-dasharray="5 5"/>
<text x="436" y="266" font-size="22" fill="var(--ink)">約 11 倍</text>
</svg>
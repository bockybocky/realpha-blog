<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="中心圓是模型，外圈兩段弧是記憶與工具，右側兩個方塊接進外圈">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">解鎖的那層在模型外面</text>

<circle cx="330" cy="300" r="150" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="1 0"/>
<circle cx="330" cy="300" r="106" fill="none" stroke="var(--line)" stroke-width="2"/>
<circle cx="330" cy="300" r="66" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="t" x="330" y="294" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">模型</text>
<text class="t" x="330" y="322" font-size="15" fill="var(--dim)" text-anchor="middle">核心</text>

<text class="t" x="330" y="200" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">記憶</text>
<text class="t" x="330" y="412" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">工具使用</text>
<text class="t" x="330" y="128" font-size="16" fill="var(--accent)" text-anchor="middle">外骨架</text>

<rect x="620" y="156" width="280" height="86" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="644" y="196" font-size="19" font-weight="700" fill="var(--ink)">你的事實來源</text>
<text class="t" x="644" y="222" font-size="15" fill="var(--dim)">別人沒有的那份</text>
<line x1="620" y1="199" x2="470" y2="226" stroke="var(--accent)" stroke-width="3"/>

<rect x="620" y="358" width="280" height="86" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="644" y="398" font-size="19" font-weight="700" fill="var(--ink)">你在用的工具</text>
<text class="t" x="644" y="424" font-size="15" fill="var(--dim)">現成的，不用重打</text>
<line x1="620" y1="401" x2="470" y2="374" stroke="var(--accent)" stroke-width="3"/>

<text class="t" x="60" y="506" font-size="22" font-weight="700" fill="var(--ink)">那兩樣東西，本來就在你手上</text>
</svg>
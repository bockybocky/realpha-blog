<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條寬流向右分岔，上面那條寬得多流向所有者，下面那條很窄流向薪水">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .gp { font-size:19px; font-weight:600; fill:var(--page); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70">成長流過你的哪一段</text>
  <text class="s" x="60" y="100">帶寬＝分到的那一份</text>

  <polygon points="120,220 420,220 420,380 120,380" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <polygon points="420,220 820,170 820,290 420,300" fill="var(--accent)"/>
  <polygon points="420,300 820,330 820,370 420,380" fill="var(--grey)"/>

  <text class="g" x="270" y="308" text-anchor="middle">企業增值</text>
  <text class="gp" x="620" y="242" text-anchor="middle">所有者這一側</text>
  <text class="g" x="620" y="358" text-anchor="middle">薪水</text>

  <text class="s" x="834" y="236">寬</text>
  <text class="s" x="834" y="356">窄</text>

  <text class="c" x="60" y="470">可以動的是形式，不是幹勁</text>
</svg>
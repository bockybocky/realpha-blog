<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A very short bar beside one fifteen times taller.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62">One card, two prices</text>

  <line x1="200" y1="410" x2="740" y2="410" stroke="var(--line)" stroke-width="2"/>

  <rect x="290" y="386" width="120" height="24" fill="var(--grey)"/>
  <text class="g" x="350" y="372" text-anchor="middle">1x</text>
  <text class="g" x="350" y="440" text-anchor="middle">Rent today</text>
  <text class="s" x="350" y="464" text-anchor="middle">Spot</text>

  <rect x="540" y="110" width="120" height="300" fill="var(--accent)"/>
  <text class="g" x="600" y="96" text-anchor="middle">15x</text>
  <text class="g" x="600" y="440" text-anchor="middle">Implied by a salary</text>
  <text class="s" x="600" y="464" text-anchor="middle">Over $250,000 a year</text>

  <text class="c" x="60" y="500">The smarter the model, the more the same compute is worth</text>
</svg>
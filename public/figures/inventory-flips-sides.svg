<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一根庫存柱子從零軸上方翻到下方">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">同一批庫存，兩年換了身份</text>
<rect x="60" y="92" width="840" height="380" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="110" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="3"/>
<rect x="160" y="160" width="150" height="140" fill="var(--accent)"/>
<text x="196" y="146" font-size="20" fill="var(--accent)">資產</text>
<text x="150" y="332" font-size="16" fill="var(--dim)">庫存多＝訂單多</text>
<text x="176" y="360" font-size="16" fill="var(--dim)">2021 年底</text>
<rect x="650" y="300" width="150" height="140" fill="var(--warn)"/>
<text x="688" y="466" font-size="20" fill="var(--warn)">負擔</text>
<text x="650" y="272" font-size="16" fill="var(--dim)">要去打的庫存</text>
<text x="668" y="246" font-size="16" fill="var(--dim)">2022 年</text>
<g stroke="var(--warn)" stroke-width="5" fill="none">
<line x1="360" y1="300" x2="600" y2="300"/>
<polyline points="586,288 600,300 586,312"/>
</g>
<text x="398" y="282" font-size="19" fill="var(--warn)">需求被卡住</text>
<text x="60" y="520" font-size="22" fill="var(--ink)">同一個事實，換個需求就換個意思</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four walls side by side, the leftmost clearly lower with a dashed outline of its original height, the other three still tall">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">A lower wall is not a fallen city</text>
<text x="190" y="168" font-size="15" fill="var(--grey)" text-anchor="middle">Original</text>
<rect x="120" y="180" width="140" height="250" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="120" y="340" width="140" height="90" fill="var(--accent)"/>
<rect x="310" y="200" width="140" height="230" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="500" y="170" width="140" height="260" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="690" y="210" width="140" height="220" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<line x1="80" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="3"/>
<text x="190" y="462" font-size="16" fill="var(--accent)" text-anchor="middle">Porting cost</text>
<text x="380" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">Performance per watt</text>
<text x="570" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">Co-design</text>
<text x="760" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">Capital structure</text>
<text x="480" y="524" font-size="22" fill="var(--ink)" text-anchor="middle">Lowering matters only if it is the only wall</text>
</svg>
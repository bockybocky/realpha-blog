<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A bar comparison of medication amounts, in which one bar on the right stands clearly above a dashed threshold line.">
  <defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style></defs>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">One morning's dose</text>

  <rect x="60" y="100" width="400" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="100" width="400" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="80" y="134" font-size="20" font-weight="700" fill="var(--dim)">Pill count</text>
  <text class="t" x="520" y="134" font-size="20" font-weight="700" fill="var(--dim)">Morphine equivalent</text>

  <line x1="80" y1="410" x2="440" y2="410" stroke="var(--line)" stroke-width="2"/>
  <line x1="520" y1="410" x2="880" y2="410" stroke="var(--line)" stroke-width="2"/>

  <rect x="140" y="234" width="80" height="176" fill="var(--grey)"/>
  <text class="t" x="140" y="224" font-size="16" fill="var(--dim)">22</text>
  <text class="t" x="140" y="434" font-size="15" fill="var(--dim)">Before</text>

  <rect x="300" y="250" width="80" height="40" fill="var(--accent)" opacity="0.35"/>
  <rect x="300" y="290" width="80" height="120" fill="var(--accent)"/>
  <text class="t" x="300" y="240" font-size="16" fill="var(--ink)">15 to 20</text>
  <text class="t" x="300" y="434" font-size="15" fill="var(--dim)">Now</text>

  <rect x="620" y="206" width="90" height="204" fill="var(--grey)"/>
  <text class="t" x="620" y="196" font-size="16" fill="var(--dim)">170</text>
  <text class="t" x="620" y="434" font-size="15" fill="var(--dim)">Before</text>

  <line x1="540" y1="290" x2="880" y2="290" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 7"/>
  <text class="t" x="740" y="280" font-size="16" fill="var(--warn)">Risk line 100</text>

  <text class="t" x="60" y="504" font-size="22" font-weight="700" fill="var(--ink)">The starting point sat well above the line</text>
</svg>
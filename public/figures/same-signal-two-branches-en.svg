<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A point on the left forks into two lines, the upper leading to differentiation and the lower to being wrong, with a vertical dashed line between them">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:600;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:600;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">Beforehand, the two look identical</text>
<text class="g" x="200" y="262" text-anchor="middle">The market dislikes it</text>
<circle cx="200" cy="300" r="11" fill="var(--accent)"/>
<line x1="212" y1="296" x2="756" y2="190" stroke="var(--accent)" stroke-width="2.5"/>
<line x1="212" y1="306" x2="756" y2="412" stroke="var(--warn)" stroke-width="2.5"/>
<line x1="580" y1="140" x2="580" y2="450" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>
<text class="b" x="580" y="126" text-anchor="middle">Only afterwards can you tell</text>
<text class="b" x="450" y="222" text-anchor="middle">Rivals copy it later</text>
<text class="b" x="450" y="392" text-anchor="middle">Nobody follows</text>
<text class="g" x="772" y="186" fill="var(--accent)">Differentiation</text>
<text class="g" x="772" y="418" fill="var(--warn)">Simply wrong</text>
<text class="c" x="480" y="484" text-anchor="middle">One phenomenon, two opposite readings</text>
</svg>
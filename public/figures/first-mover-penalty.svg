<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="四家公司並排，第一家舉旗宣布，資金箭頭全部流向另外三家">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="48" y="66" font-size="27" fill="var(--ink)">誰先宣布，誰先被罰</text>
<rect x="380" y="120" width="200" height="56" fill="var(--card)" stroke="var(--line)"/>
<text x="424" y="156" font-size="19" fill="var(--ink)">投資人的錢</text>
<g stroke="var(--accent)" stroke-width="3" fill="none">
<path d="M460 180 C 420 260 420 300 400 330"/>
<path d="M500 180 C 560 250 580 300 600 330"/>
<path d="M520 180 C 680 240 760 290 800 330"/>
</g>
<polygon points="398,348 388,324 410,326" fill="var(--accent)"/>
<polygon points="602,348 590,326 612,324" fill="var(--accent)"/>
<polygon points="802,348 790,326 812,322" fill="var(--accent)"/>
<g stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 8" fill="none">
<path d="M420 180 C 340 230 260 280 200 330"/>
</g>
<text x="214" y="236" font-size="16" fill="var(--warn)">繞過</text>
<rect x="140" y="360" width="120" height="100" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
<text x="158" y="416" font-size="19" fill="var(--warn)">先宣布</text>
<line x1="200" y1="360" x2="200" y2="320" stroke="var(--warn)" stroke-width="3"/>
<polygon points="200,300 200,330 232,318" fill="var(--warn)"/>
<rect x="340" y="360" width="120" height="100" fill="var(--card)" stroke="var(--line)"/>
<text x="366" y="416" font-size="19" fill="var(--dim)">觀望</text>
<rect x="540" y="360" width="120" height="100" fill="var(--card)" stroke="var(--line)"/>
<text x="566" y="416" font-size="19" fill="var(--dim)">觀望</text>
<rect x="740" y="360" width="120" height="100" fill="var(--card)" stroke="var(--line)"/>
<text x="766" y="416" font-size="19" fill="var(--dim)">觀望</text>
<text x="48" y="512" font-size="22" fill="var(--ink)">補貼管輸多少，不管誰先動</text>
</g>
</svg>
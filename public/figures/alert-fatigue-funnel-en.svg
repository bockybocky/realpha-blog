<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A flood of alerts passes through an automated funnel and only three reach a human.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:600; fill:var(--ink); }
    .body { font-size:16px; fill:var(--dim); }
    .concl { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="title" x="60" y="62">Too many alerts for people to win</text>

  <text class="grp" x="100" y="140">Arriving daily</text>
  <g fill="var(--grey)">
    <rect x="100" y="170" width="24" height="24" rx="3"/><rect x="130" y="170" width="24" height="24" rx="3"/><rect x="160" y="170" width="24" height="24" rx="3"/><rect x="190" y="170" width="24" height="24" rx="3"/><rect x="220" y="170" width="24" height="24" rx="3"/><rect x="250" y="170" width="24" height="24" rx="3"/><rect x="280" y="170" width="24" height="24" rx="3"/><rect x="310" y="170" width="24" height="24" rx="3"/>
    <rect x="100" y="200" width="24" height="24" rx="3"/><rect x="130" y="200" width="24" height="24" rx="3"/><rect x="160" y="200" width="24" height="24" rx="3"/><rect x="190" y="200" width="24" height="24" rx="3"/><rect x="220" y="200" width="24" height="24" rx="3"/><rect x="250" y="200" width="24" height="24" rx="3"/><rect x="280" y="200" width="24" height="24" rx="3"/><rect x="310" y="200" width="24" height="24" rx="3"/>
    <rect x="100" y="230" width="24" height="24" rx="3"/><rect x="130" y="230" width="24" height="24" rx="3"/><rect x="160" y="230" width="24" height="24" rx="3"/><rect x="190" y="230" width="24" height="24" rx="3"/><rect x="220" y="230" width="24" height="24" rx="3"/><rect x="250" y="230" width="24" height="24" rx="3"/><rect x="280" y="230" width="24" height="24" rx="3"/><rect x="310" y="230" width="24" height="24" rx="3"/>
    <rect x="100" y="260" width="24" height="24" rx="3"/><rect x="130" y="260" width="24" height="24" rx="3"/><rect x="160" y="260" width="24" height="24" rx="3"/><rect x="190" y="260" width="24" height="24" rx="3"/><rect x="220" y="260" width="24" height="24" rx="3"/><rect x="250" y="260" width="24" height="24" rx="3"/><rect x="280" y="260" width="24" height="24" rx="3"/><rect x="310" y="260" width="24" height="24" rx="3"/>
    <rect x="100" y="290" width="24" height="24" rx="3"/><rect x="130" y="290" width="24" height="24" rx="3"/><rect x="160" y="290" width="24" height="24" rx="3"/><rect x="190" y="290" width="24" height="24" rx="3"/><rect x="220" y="290" width="24" height="24" rx="3"/><rect x="250" y="290" width="24" height="24" rx="3"/><rect x="280" y="290" width="24" height="24" rx="3"/><rect x="310" y="290" width="24" height="24" rx="3"/>
    <rect x="100" y="320" width="24" height="24" rx="3"/><rect x="130" y="320" width="24" height="24" rx="3"/><rect x="160" y="320" width="24" height="24" rx="3"/><rect x="190" y="320" width="24" height="24" rx="3"/><rect x="220" y="320" width="24" height="24" rx="3"/><rect x="250" y="320" width="24" height="24" rx="3"/><rect x="280" y="320" width="24" height="24" rx="3"/><rect x="310" y="320" width="24" height="24" rx="3"/>
    <rect x="100" y="350" width="24" height="24" rx="3"/><rect x="130" y="350" width="24" height="24" rx="3"/><rect x="160" y="350" width="24" height="24" rx="3"/><rect x="190" y="350" width="24" height="24" rx="3"/><rect x="220" y="350" width="24" height="24" rx="3"/><rect x="250" y="350" width="24" height="24" rx="3"/><rect x="280" y="350" width="24" height="24" rx="3"/><rect x="310" y="350" width="24" height="24" rx="3"/>
    <rect x="100" y="380" width="24" height="24" rx="3"/><rect x="130" y="380" width="24" height="24" rx="3"/><rect x="160" y="380" width="24" height="24" rx="3"/><rect x="190" y="380" width="24" height="24" rx="3"/><rect x="220" y="380" width="24" height="24" rx="3"/><rect x="250" y="380" width="24" height="24" rx="3"/><rect x="280" y="380" width="24" height="24" rx="3"/><rect x="310" y="380" width="24" height="24" rx="3"/>
  </g>
  <text class="body" x="100" y="432">64 alerts</text>

  <path d="M355 287 L410 287" stroke="var(--line)" stroke-width="3"/>
  <path d="M404 279 L416 287 L404 295 Z" fill="var(--line)"/>

  <text class="grp" x="440" y="140">Auto detection</text>
  <text class="body" x="440" y="165">Runs and investigates itself</text>
  <polygon points="435,190 625,190 548,300 548,392 512,392 512,300"
           fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>

  <path d="M600 287 L690 287" stroke="var(--line)" stroke-width="3"/>
  <path d="M684 279 L696 287 L684 295 Z" fill="var(--line)"/>

  <text class="grp" x="720" y="140">Handled by a person</text>
  <g fill="var(--accent)">
    <rect x="720" y="245" width="24" height="24" rx="3"/>
    <rect x="750" y="245" width="24" height="24" rx="3"/>
    <rect x="780" y="245" width="24" height="24" rx="3"/>
  </g>
  <text class="body" x="720" y="432">3</text>

  <text class="concl" x="60" y="492">64 come in, 3 reach a person</text>
</svg>
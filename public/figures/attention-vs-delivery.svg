<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩格長條對比，注意力那塊消失後底層交付那塊變高">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">營收的兩塊，助理來了以後</text>

  <text class="t" x="215" y="140" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">之前</text>
  <rect x="140" y="170" width="150" height="120" fill="var(--grey)" opacity="0.6" stroke="var(--line)"/>
  <rect x="140" y="290" width="150" height="160" fill="var(--accent)" opacity="0.75"/>
  <text class="t" x="310" y="235" font-size="19" fill="var(--ink)">注意力</text>
  <text class="t" x="310" y="378" font-size="19" fill="var(--ink)">底層交付</text>

  <path d="M520 310 L610 310" stroke="var(--dim)" stroke-width="3"/>
  <path d="M602 302 L618 310 L602 318 Z" fill="var(--dim)"/>
  <text class="t" x="565" y="290" font-size="16" fill="var(--dim)" text-anchor="middle">摩擦趨近零</text>

  <text class="t" x="740" y="140" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">之後</text>
  <rect x="665" y="230" width="150" height="60" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="665" y="290" width="150" height="210" fill="var(--accent)" opacity="0.85"/>
  <text class="t" x="835" y="266" font-size="19" fill="var(--dim)">縮掉</text>
  <text class="t" x="835" y="400" font-size="19" fill="var(--ink)">變大</text>

  <text class="t" x="60" y="535" font-size="22" font-weight="700" fill="var(--ink)">拿同一份東西的阻力變小，次數就變多</text>
</svg>
<circle cx="230" cy="300" r="12" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="268" cy="300" r="12" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="306" cy="300" r="12" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="344" cy="300" r="12" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="382" cy="300" r="12" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="560" y="222" font-size="16" fill="var(--dim)">精度</text>
<circle cx="670" cy="215" r="12" fill="var(--accent)"/>
<circle cx="708" cy="215" r="12" fill="var(--accent)"/>
<circle cx="746" cy="215" r="12" fill="var(--accent)"/>
<circle cx="784" cy="215" r="12" fill="var(--accent)"/>
<circle cx="822" cy="215" r="12" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text x="560" y="307" font-size="16" fill="var(--dim)">可編程</text>
<circle cx="670" cy="300" r="12" fill="var(--accent)"/>
<circle cx="708" cy="300" r="12" fill="var(--accent)"/>
<circle cx="746" cy="300" r="12" fill="var(--accent)"/>
<circle cx="784" cy="300" r="12" fill="var(--accent)"/>
<circle cx="822" cy="300" r="12" fill="var(--accent)"/>

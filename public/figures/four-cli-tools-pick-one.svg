<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="四根一模一樣的直柱並排，每柱由上到下分成三層：你訂的服務、要裝的工具、終端機打的指令。四柱彼此不相連。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .lb { font-size:16px; fill:var(--dim); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:19px; font-weight:700; fill:var(--accent); }
    .end { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text class="t" x="40" y="56">四個工具，挑你訂的那一個裝</text>

  <text class="lb" x="170" y="159" text-anchor="end">你訂的服務</text>
  <text class="lb" x="170" y="266" text-anchor="end">要裝的工具</text>
  <text class="lb" x="170" y="372" text-anchor="end">終端機打</text>

  <rect x="190" y="100" width="160" height="320" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="380" y="100" width="160" height="320" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="570" y="100" width="160" height="320" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="760" y="100" width="160" height="320" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>

  <line x1="190" y1="207" x2="350" y2="207" stroke="var(--line)" stroke-width="1.5"/>
  <line x1="380" y1="207" x2="540" y2="207" stroke="var(--line)" stroke-width="1.5"/>
  <line x1="570" y1="207" x2="730" y2="207" stroke="var(--line)" stroke-width="1.5"/>
  <line x1="760" y1="207" x2="920" y2="207" stroke="var(--line)" stroke-width="1.5"/>

  <line x1="190" y1="313" x2="350" y2="313" stroke="var(--line)" stroke-width="1.5"/>
  <line x1="380" y1="313" x2="540" y2="313" stroke="var(--line)" stroke-width="1.5"/>
  <line x1="570" y1="313" x2="730" y2="313" stroke="var(--line)" stroke-width="1.5"/>
  <line x1="760" y1="313" x2="920" y2="313" stroke="var(--line)" stroke-width="1.5"/>

  <text class="s" x="270" y="160" text-anchor="middle">Anthropic</text>
  <text class="s" x="460" y="160" text-anchor="middle">ChatGPT</text>
  <text class="s" x="650" y="160" text-anchor="middle">xAI</text>
  <text class="s" x="840" y="160" text-anchor="middle">Google</text>

  <text class="g" x="270" y="260" text-anchor="middle">Claude Code</text>
  <text class="g" x="460" y="260" text-anchor="middle">Codex</text>
  <text class="g" x="650" y="260" text-anchor="middle">Grok Build</text>
  <text class="g" x="840" y="260" text-anchor="middle">Antigravity</text>

  <text class="c" x="270" y="373" text-anchor="middle">claude</text>
  <text class="c" x="460" y="373" text-anchor="middle">codex</text>
  <text class="c" x="650" y="373" text-anchor="middle">grok</text>
  <text class="c" x="840" y="373" text-anchor="middle">agy</text>

  <text class="end" x="480" y="478" text-anchor="middle">四條路一樣長，走一條就好</text>
</svg>
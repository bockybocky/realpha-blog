<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="長條圖：閉源模型投入一千賺回一千三，開放權重模型投入一千只賺回三百，這是會議上的說法">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">各投 1,000 億，賺回多少</text>
<text x="480" y="84" text-anchor="middle" font-size="16" fill="var(--dim)">高盛會議上的說法，主委打問號</text>
<text x="160" y="126" font-size="15" fill="var(--dim)">單位：億</text>
<rect x="620" y="111" width="16" height="16" fill="var(--grey)"/>
<text x="644" y="125" font-size="16" fill="var(--ink)">投入</text>
<rect x="720" y="111" width="16" height="16" fill="var(--accent)"/>
<text x="744" y="125" font-size="16" fill="var(--ink)">賺回</text>
<line x1="150" y1="440" x2="830" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="240" width="110" height="200" fill="var(--grey)"/>
<rect x="310" y="180" width="110" height="260" fill="var(--accent)"/>
<text x="235" y="230" text-anchor="middle" font-size="16" fill="var(--dim)">1,000</text>
<text x="365" y="170" text-anchor="middle" font-size="19" font-weight="700" fill="var(--accent)">1,300</text>
<text x="300" y="476" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)">閉源模型</text>
<rect x="560" y="240" width="110" height="200" fill="var(--grey)"/>
<rect x="690" y="380" width="110" height="60" fill="var(--accent)"/>
<text x="615" y="230" text-anchor="middle" font-size="16" fill="var(--dim)">1,000</text>
<text x="745" y="370" text-anchor="middle" font-size="19" font-weight="700" fill="var(--accent)">300</text>
<text x="680" y="476" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)">開放權重</text>
</svg>
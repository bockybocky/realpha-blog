<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條路徑指向同一個需求缺口，只有蓋新設備那條拿得到報酬">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">同一個需求，兩條路</text>

<rect x="90" y="130" width="250" height="90" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="215" y="183" text-anchor="middle">擴建變電所</text>
<text class="b" x="215" y="248" text-anchor="middle" fill="var(--accent)">兩位數報酬率</text>

<rect x="90" y="330" width="250" height="90" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="215" y="368" text-anchor="middle">分散式電池</text>
<text class="g" x="215" y="400" text-anchor="middle">虛擬電廠</text>
<text class="b" x="215" y="448" text-anchor="middle" fill="var(--warn)">拿不到錢</text>

<path d="M340 175 L600 250" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M340 375 L600 300" stroke="var(--warn)" stroke-width="3" fill="none"/>
<path d="M580 238 L604 251 L580 262" stroke="var(--accent)" stroke-width="3" fill="none"/>
<path d="M580 312 L604 299 L580 288" stroke="var(--warn)" stroke-width="3" fill="none"/>

<rect x="610" y="215" width="250" height="120" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="735" y="265" text-anchor="middle">同一個需求</text>
<text class="b" x="735" y="300" text-anchor="middle">電網利用率</text>

<text class="c" x="60" y="512">報酬只認其中一條</text>
</svg>
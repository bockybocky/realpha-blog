<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On a single timeline, two solid dots sit high and to the left marking disclosures by small upstream suppliers, while a lone dot sits low and to the right where the integrator finally talks about its ramp schedule, leaving a long lead gap between them.">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>

  <text class="t" x="60" y="58">Timelines leak upstream</text>

  <line x1="160" y1="340" x2="900" y2="340" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="220" y="372" text-anchor="middle">This Q</text>
  <text class="b" x="390" y="372" text-anchor="middle">Next Q</text>
  <text class="b" x="580" y="372" text-anchor="middle">1H 2027</text>
  <text class="b" x="770" y="372" text-anchor="middle">2H 2027</text>

  <text class="g" x="145" y="206" text-anchor="end">Lasers</text>
  <line x1="220" y1="212" x2="220" y2="334" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="340" y1="212" x2="340" y2="334" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 5"/>
  <circle cx="220" cy="200" r="12" fill="var(--accent)"/>
  <circle cx="340" cy="200" r="12" fill="var(--accent)"/>
  <text class="b" x="220" y="168" text-anchor="middle">Qual won</text>
  <text class="b" x="352" y="140" >1st order</text>
  <line x1="340" y1="188" x2="352" y2="150" stroke="var(--line)" stroke-width="1.5"/>

  <text class="g" x="145" y="426" text-anchor="end">OEM</text>
  <line x1="770" y1="346" x2="770" y2="408" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 5"/>
  <circle cx="770" cy="420" r="12" fill="var(--grey)"/>
  <text class="b" x="770" y="458" text-anchor="middle">Ramp news</text>

  <line x1="220" y1="300" x2="770" y2="300" stroke="var(--accent)" stroke-width="2"/>
  <line x1="220" y1="292" x2="220" y2="308" stroke="var(--accent)" stroke-width="2"/>
  <line x1="770" y1="292" x2="770" y2="308" stroke="var(--accent)" stroke-width="2"/>
  <text class="g" x="495" y="286" text-anchor="middle">Qs ahead</text>

  <text class="c" x="60" y="496">Smaller = earlier</text>
</svg>
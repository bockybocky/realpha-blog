<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上下兩條路徑對比：上面一條起伏彎折的長路最後抵達「記住」，下面一條又短又直的箭頭直奔「答案」，終點是「忘了」">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">學東西的那一段，被跳過了</text>

  <rect x="60" y="100" width="840" height="190" rx="14" fill="var(--card)"/>
  <text class="t" x="84" y="134" font-size="20" font-weight="700" fill="var(--accent)">自己走</text>
  <polyline points="180,250 290,170 400,255 510,165 650,225 820,150" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="180" cy="250" r="7" fill="var(--accent)"/>
  <circle cx="290" cy="170" r="7" fill="var(--accent)"/>
  <circle cx="400" cy="255" r="7" fill="var(--accent)"/>
  <circle cx="510" cy="165" r="7" fill="var(--accent)"/>
  <circle cx="650" cy="225" r="7" fill="var(--accent)"/>
  <circle cx="820" cy="150" r="11" fill="var(--accent)"/>
  <text class="t" x="180" y="278" font-size="16" fill="var(--dim)" text-anchor="middle">問題</text>
  <text class="t" x="290" y="156" font-size="16" fill="var(--dim)" text-anchor="middle">卡住</text>
  <text class="t" x="400" y="283" font-size="16" fill="var(--dim)" text-anchor="middle">犯錯</text>
  <text class="t" x="510" y="151" font-size="16" fill="var(--dim)" text-anchor="middle">改對</text>
  <text class="t" x="650" y="253" font-size="16" fill="var(--dim)" text-anchor="middle">再試</text>
  <text class="t" x="820" y="130" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">記住</text>

  <rect x="60" y="316" width="840" height="130" rx="14" fill="var(--card)"/>
  <text class="t" x="84" y="350" font-size="20" font-weight="700" fill="var(--dim)">交給 AI</text>
  <line x1="180" y1="400" x2="790" y2="400" stroke="var(--grey)" stroke-width="3.5"/>
  <polygon points="790,392 816,400 790,408" fill="var(--warn)"/>
  <circle cx="180" cy="400" r="7" fill="var(--grey)"/>
  <circle cx="485" cy="400" r="7" fill="var(--grey)"/>
  <text class="t" x="180" y="428" font-size="16" fill="var(--dim)" text-anchor="middle">問題</text>
  <text class="t" x="485" y="428" font-size="16" fill="var(--dim)" text-anchor="middle">答案</text>
  <text class="t" x="845" y="406" font-size="19" font-weight="700" fill="var(--warn)">忘了</text>

  <text class="t" x="480" y="500" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">短的那條，少掉的是會長肌肉的那一段</text>
</svg>
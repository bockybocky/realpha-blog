<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩根柱子，左邊 83% 遠高於右邊 38%">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">相信 AI 對自己的生活與工作有益</text>
  <text class="t" x="48" y="90" font-size="16" fill="var(--dim)">她引述的民調，不是統計普查</text>

  <line x1="200" y1="420" x2="780" y2="420" stroke="var(--line)" stroke-width="2"/>

  <rect x="300" y="154" width="120" height="266" fill="var(--accent)"/>
  <text class="t" x="360" y="140" font-size="27" font-weight="700" fill="var(--ink)" text-anchor="middle">83%</text>
  <text class="t" x="360" y="452" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">中國</text>

  <rect x="560" y="298" width="120" height="122" fill="var(--grey)"/>
  <text class="t" x="620" y="284" font-size="27" font-weight="700" fill="var(--ink)" text-anchor="middle">38%</text>
  <text class="t" x="620" y="452" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">美國</text>

  <text class="t" x="480" y="492" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">同一個技術，兩種身體感覺</text>
</svg>
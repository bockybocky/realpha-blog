<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上升折線從一百走到兩百，中間有三處總體消息造成的回檔凹陷，重點是整段路不是凹陷">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">要掌握的是那段路，不是那些凹陷</text>
<rect x="60" y="100" width="840" height="300" fill="var(--card)"/>
<text x="74" y="380" font-size="19" fill="var(--dim)">100</text>
<text x="840" y="140" font-size="19" fill="var(--accent)">200</text>
<polyline points="110,350 220,300 260,338 340,270 430,286 470,250 560,210 600,254 700,190 820,150"
          fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="260" cy="338" r="6" fill="var(--warn)"/>
<circle cx="430" cy="286" r="6" fill="var(--warn)"/>
<circle cx="600" cy="254" r="6" fill="var(--warn)"/>
<text x="236" y="372" font-size="15" fill="var(--warn)">總體消息</text>
<text x="406" y="320" font-size="15" fill="var(--warn)">總體消息</text>
<text x="576" y="288" font-size="15" fill="var(--warn)">總體消息</text>
<text x="640" y="132" font-size="19" fill="var(--ink)">錢在哪裡 · 誰要開營收獲利</text>
<text x="60" y="450" font-size="22" fill="var(--ink)">全部盯總體，最後會很難出手</text>
<text x="60" y="484" font-size="15" fill="var(--dim)">因為隨時都有新的東西丟出來嚇你</text>
</svg>
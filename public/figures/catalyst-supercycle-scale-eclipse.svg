<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊四個小方塊分別是人形機器人、工業機器人、無人機與晶圓廠，右邊一個巨大的圓盤是資料中心，小方塊加起來仍遠小於圓盤">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">新想出來的用電，旁邊站著資料中心</text>
  <text x="60" y="100" font-size="16" fill="var(--dim)">大小為示意，不是等比</text>

  <rect x="70" y="160" width="110" height="70" rx="8" fill="var(--grey)"/>
  <rect x="200" y="160" width="110" height="70" rx="8" fill="var(--grey)"/>
  <rect x="70" y="270" width="110" height="70" rx="8" fill="var(--grey)"/>
  <rect x="200" y="270" width="110" height="70" rx="8" fill="var(--grey)"/>
  <g font-size="15" fill="var(--ink)" text-anchor="middle">
    <text x="125" y="192">人形</text>
    <text x="125" y="212">機器人</text>
    <text x="255" y="192">工業</text>
    <text x="255" y="212">機器人</text>
    <text x="125" y="302">無人機</text>
    <text x="255" y="302">晶圓廠</text>
    <text x="255" y="322">百兆瓦級</text>
  </g>
  <text x="125" y="322" font-size="15" fill="var(--ink)" text-anchor="middle">往十億台走</text>
  <text x="190" y="382" font-size="16" fill="var(--dim)" text-anchor="middle">人形機器人一年吃掉的電</text>
  <text x="190" y="406" font-size="16" fill="var(--dim)" text-anchor="middle">約家裡冰箱的三到四倍</text>

  <circle cx="680" cy="270" r="180" fill="var(--accent)"/>
  <text x="680" y="262" font-size="27" font-weight="700" fill="var(--page)" text-anchor="middle">資料中心</text>
  <text x="680" y="298" font-size="19" fill="var(--page)" text-anchor="middle">大到把太陽遮住</text>

  <text x="60" y="482" font-size="22" font-weight="700" fill="var(--ink)">飛輪可以成立，同時小到在總量上看不出來</text>
</svg>
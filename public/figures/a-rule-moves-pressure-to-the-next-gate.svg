<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="規則鬆開左格，壓力被推到右格並把它填滿">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700">一條法規，兩個出口</text>

<rect x="60" y="120" width="200" height="60" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="84" y="158" font-size="19" font-weight="700">免停車條款</text>
<path d="M160 180 L160 220" stroke="var(--ink)" stroke-width="4"/>
<path d="M148 220 L172 220 L160 240 Z" fill="var(--ink)"/>

<rect x="60" y="250" width="360" height="150" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="84" y="292" font-size="20" font-weight="700">蓋得出來</text>
<rect x="84" y="312" width="140" height="60" rx="6" fill="var(--accent)"/>
<text x="240" y="350" font-size="16" fill="var(--dim)">鬆開</text>

<path d="M430 325 L530 325" stroke="var(--warn)" stroke-width="6"/>
<path d="M530 311 L556 325 L530 339 Z" fill="var(--warn)"/>
<text x="436" y="300" font-size="16" fill="var(--warn)">壓力</text>

<rect x="570" y="250" width="330" height="150" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="594" y="292" font-size="20" font-weight="700">路邊停車</text>
<rect x="594" y="312" width="282" height="60" rx="6" fill="var(--warn)"/>
<text x="610" y="350" font-size="16" fill="var(--page)">塞滿</text>

<text x="60" y="466" font-size="22" font-weight="700">下一關的門檻，就長在這裡</text>
</svg>
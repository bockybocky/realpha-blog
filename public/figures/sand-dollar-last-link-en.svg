<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The first three of four chain links are joined, while the last link, merchants, is an empty box with a broken joint.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.lb{font-size:19px;fill:var(--dim)}.sm{font-size:15px;fill:var(--dim)}.t{font-size:27px}.c{font-size:22px}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">Built, but the last link is missing</text>
<rect x="60" y="200" width="190" height="120" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="290" y="200" width="190" height="120" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="520" y="200" width="190" height="120" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<rect x="750" y="200" width="150" height="120" rx="12" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="lb" x="104" y="268">CB ledger</text>
<text class="lb" x="324" y="268">Bank wallets</text>
<text class="lb" x="534" y="268">P2P transfers</text>
<text class="lb" x="796" y="268">Merchants</text>
<line x1="250" y1="260" x2="284" y2="260" stroke="var(--accent)" stroke-width="6"/>
<line x1="480" y1="260" x2="514" y2="260" stroke="var(--accent)" stroke-width="6"/>
<line x1="710" y1="260" x2="724" y2="260" stroke="var(--warn)" stroke-width="6"/>
<line x1="736" y1="260" x2="750" y2="260" stroke="var(--warn)" stroke-width="6"/>
<line x1="728" y1="238" x2="716" y2="282" stroke="var(--warn)" stroke-width="4"/>
<line x1="744" y1="238" x2="732" y2="282" stroke="var(--warn)" stroke-width="4"/>
<text class="sm" x="692" y="332">Six years, still open</text>
<text class="c" x="60" y="440">Speed is solved; adoption stalls at the last box</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="四格圖：查得到來源的右欄兩格都能用，查不到的左欄即使都對也不敢用；決定結果的是中間那條粗直線。">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:20px;font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700}
    .a{fill:var(--accent)}
    .w{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="62">敢不敢用，看哪條線</text>
<text class="g" x="385" y="116" text-anchor="middle">查不到來源</text>
<text class="g" x="715" y="116" text-anchor="middle">查得到來源</text>
<text class="g" x="200" y="232" text-anchor="end">都對</text>
<text class="g" x="200" y="422" text-anchor="end">偶爾錯</text>
<rect x="220" y="130" width="330" height="190" fill="var(--warn)" fill-opacity="0.18"/>
<rect x="220" y="320" width="330" height="190" fill="var(--grey)" fill-opacity="0.35"/>
<rect x="550" y="130" width="330" height="380" fill="var(--accent)" fill-opacity="0.16"/>
<line x1="220" y1="320" x2="880" y2="320" stroke="var(--line)" stroke-width="2"/>
<line x1="550" y1="120" x2="550" y2="520" stroke="var(--ink)" stroke-width="5"/>
<text class="c w" x="385" y="232" text-anchor="middle">不敢用</text>
<text class="c" x="385" y="422" text-anchor="middle" style="fill:var(--dim)">不能用</text>
<text class="c a" x="715" y="232" text-anchor="middle">能用</text>
<text class="c a" x="715" y="422" text-anchor="middle">能用・省時</text>
<text class="c" x="550" y="560" text-anchor="middle">關鍵分界：看得到來源</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A line showing cash's share of payments falling steeply from 40% to 5%, ending with an upward dashed arrow marking the policy push back.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:20px;fill:var(--ink)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<marker id="cw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">After the fall, they pushed back</text>

<line x1="150" y1="130" x2="150" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="76" y="152">40%</text>
<text class="b" x="88" y="366">5%</text>
<text class="b" x="150" y="432">2010</text>
<text class="b" x="640" y="432">Now</text>
<text class="b" x="60" y="106">Cash share of in-store payments</text>

<polyline points="170,146 320,206 470,286 620,340 700,360" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="170" cy="146" r="7" fill="var(--accent)"/>
<circle cx="700" cy="360" r="7" fill="var(--accent)"/>

<path d="M714 352 L806 306" stroke="var(--warn)" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#cw)"/>
<text class="g" x="690" y="272">Push back</text>
<text class="b" x="690" y="300">Keep SEK 1,000</text>
<text class="b" x="690" y="328">Shops must take cash</text>

<text class="c" x="60" y="492">In the blackout, only cash bought fuel</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A steeply rising price line reaches 2027 and enters a very narrow dashed corridor, moving only slightly within it afterwards.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .n { font-size:34px; font-weight:700; fill:var(--ink); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">Contracts cap gains</text>
  <text class="b" x="60" y="94">2027 is signed</text>
  <rect x="480" y="190" width="420" height="48" fill="var(--card)" stroke="var(--line)" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M100 370 L220 326 L340 256 L480 214" stroke="var(--accent)" stroke-width="6" fill="none"/>
  <path d="M480 214 L620 226 L760 212 L890 224" stroke="var(--accent)" stroke-width="4" fill="none" stroke-dasharray="9 7"/>
  <circle cx="480" cy="214" r="9" fill="var(--accent)"/>
  <path d="M480 150 L480 420" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M100 420 L900 420" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="100" y="448">2026: Q3 up 17% to 23%</text>
  <text class="g" x="560" y="178">2027: single %</text>
  <text class="b" x="560" y="286">No repeat on signed vol</text>
  <text class="c" x="60" y="506">Volume carries</text>
</svg>
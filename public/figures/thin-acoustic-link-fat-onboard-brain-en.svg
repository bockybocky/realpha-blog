<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A very thin link line leading to a very large block of onboard compute.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="80" y="60" font-size="27" fill="var(--ink)">The link is thin, so the brain rides along</text>

  <rect x="80" y="230" width="180" height="110" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="170" y="292" font-size="19" fill="var(--dim)" text-anchor="middle">Shore</text>

  <line x1="260" y1="285" x2="560" y2="285" stroke="var(--warn)" stroke-width="1"/>
  <text x="410" y="265" font-size="19" fill="var(--warn)" text-anchor="middle">Acoustic link</text>
  <text x="410" y="315" font-size="16" fill="var(--dim)" text-anchor="middle">5 km | 10 KB per second</text>
  <text x="410" y="345" font-size="16" fill="var(--dim)" text-anchor="middle">As thin as a dial-up line</text>

  <rect x="560" y="160" width="320" height="250" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="720" y="196" font-size="20" fill="var(--accent)" text-anchor="middle">Onboard compute</text>
  <rect x="600" y="220" width="240" height="150" rx="10" fill="var(--accent)"/>
  <text x="720" y="285" font-size="20" fill="var(--page)" text-anchor="middle">GPU + CPU</text>
  <text x="720" y="320" font-size="19" fill="var(--page)" text-anchor="middle">100× its peers</text>

  <text x="80" y="470" font-size="22" fill="var(--ink)">Decisions stay underwater, not onshore</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="下降折線分三段，維也納直落後有一段水平的假平靜平台，接著紐約再陡落，最後緩降到新興市場">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">崩盤是三段的，中間那段最會騙人</text>

  <path d="M 70 150 L 190 150 L 240 330" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <path d="M 240 330 L 440 330" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M 440 330 L 620 428 L 890 470" fill="none" stroke="var(--accent)" stroke-width="4"/>

  <circle cx="240" cy="330" r="7" fill="var(--accent)"/>
  <circle cx="620" cy="428" r="7" fill="var(--accent)"/>
  <circle cx="890" cy="470" r="7" fill="var(--accent)"/>

  <text x="150" y="288" font-size="20" fill="var(--ink)">維也納</text>
  <text x="150" y="312" font-size="16" fill="var(--dim)">五月・單日 −50%</text>

  <text x="340" y="298" font-size="20" fill="var(--warn)" text-anchor="middle">什麼都沒發生</text>
  <text x="340" y="368" font-size="16" fill="var(--warn)" text-anchor="middle">幾個月</text>

  <text x="470" y="410" font-size="20" fill="var(--ink)">紐約</text>
  <text x="470" y="434" font-size="16" fill="var(--dim)">九月・Jay Cooke</text>
  <text x="470" y="458" font-size="16" fill="var(--dim)">年底 1/3 停息 → 五年 1/2</text>

  <text x="880" y="440" font-size="20" fill="var(--ink)" text-anchor="end">埃及・土耳其</text>
  <text x="880" y="504" font-size="16" fill="var(--dim)" text-anchor="end">15 億美元</text>

  <text x="480" y="540" font-size="22" fill="var(--ink)" text-anchor="middle">兩起事件之間的平靜，本身不是證據</text>
</svg>
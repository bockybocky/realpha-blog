<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三根柱子的高度差：海外年均需求、今年資本支出指引、維持台灣多數所需的規模，最後一根明顯更高">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; font-weight:700; fill:var(--ink); }
  .g { font-size:20px; font-weight:700; fill:var(--ink); }
  .d { font-size:15px; fill:var(--dim); }
  .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="68">一個門檻快到了</text>
<text class="d" x="60" y="98">單位：美元，每年資本支出規模</text>

<line x1="140" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>

<rect x="190" y="280" width="140" height="120" rx="5" fill="var(--accent)"/>
<text class="g" x="196" y="266">500 億</text>
<text class="g" x="166" y="434">美國兩廠年均</text>
<text class="d" x="166" y="458">德州加亞利桑那</text>

<rect x="410" y="251" width="140" height="149" rx="5" fill="var(--grey)"/>
<text class="g" x="406" y="237">600 到 640 億</text>
<text class="g" x="412" y="434">2026 全公司指引</text>
<text class="d" x="412" y="458">比去年跳升五成</text>

<rect x="630" y="172" width="140" height="228" rx="5" fill="var(--page)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 5"/>
<text class="g" x="618" y="158" fill="var(--warn)">900 到 1000 億</text>
<text class="g" x="606" y="434">台灣仍佔多數所需</text>
<text class="d" x="606" y="458">尚未發生</text>

<text class="c" x="60" y="500">海外的那一段先長起來，比重就自己翻過去了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="之前與之後兩格對照，中間標出差異，底下兩個出口分別是繼續睡與在等你">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="56" font-size="27" fill="var(--ink)">十分鐘的兩格對照</text>

<rect x="40" y="110" width="380" height="200" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="66" y="150" font-size="20" fill="var(--dim)">當年</text>
<text x="66" y="196" font-size="16" fill="var(--ink)">通勤三小時</text>
<text x="66" y="232" font-size="16" fill="var(--ink)">房間沒地方放</text>
<text x="66" y="276" font-size="16" fill="var(--grey)">不要寫沒時間</text>

<rect x="540" y="110" width="380" height="200" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="566" y="150" font-size="20" fill="var(--dim)">現在</text>
<text x="566" y="196" font-size="16" fill="var(--ink)">在家工作</text>
<text x="566" y="232" font-size="16" fill="var(--ink)">多一個房間</text>

<path d="M420 210 L540 210" stroke="var(--accent)" stroke-width="6"/>
<text x="436" y="186" font-size="19" fill="var(--accent)">差異</text>

<path d="M230 310 L230 400 L300 400" fill="none" stroke="var(--grey)" stroke-width="5"/>
<rect x="300" y="366" width="230" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="326" y="410" font-size="19" fill="var(--dim)">找不出不同：讓它睡</text>

<path d="M730 310 L730 470 L560 470" fill="none" stroke="var(--accent)" stroke-width="5"/>
<rect x="330" y="436" width="230" height="68" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="356" y="480" font-size="19" fill="var(--accent)">條件變了：它在等你</text>
</g>
</svg>
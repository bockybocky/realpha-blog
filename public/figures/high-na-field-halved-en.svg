<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A full exposure field box on the left is contrasted with a field box on the right that retains only half its area.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">Better resolution, half the field</text>

<text x="70" y="128" font-size="19" fill="var(--dim)">0.33 NA</text>
<rect x="70" y="150" width="330" height="260" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="235" y="275" font-size="16" fill="var(--dim)" text-anchor="middle">33 × 26 mm</text>
<text x="235" y="302" font-size="16" fill="var(--dim)" text-anchor="middle">One shot</text>
<line x1="70" y1="432" x2="400" y2="432" stroke="var(--grey)" stroke-width="1.5"/>
<line x1="70" y1="426" x2="70" y2="438" stroke="var(--grey)" stroke-width="1.5"/>
<line x1="400" y1="426" x2="400" y2="438" stroke="var(--grey)" stroke-width="1.5"/>

<text x="540" y="128" font-size="19" fill="var(--dim)">High-NA 0.55</text>
<rect x="540" y="150" width="330" height="260" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="540" y="150" width="165" height="260" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="622" y="275" font-size="16" fill="var(--ink)" text-anchor="middle">16.5 × 26</text>
<text x="787" y="283" font-size="16" fill="var(--warn)" text-anchor="middle">Unprintable</text>
<line x1="540" y1="432" x2="705" y2="432" stroke="var(--accent)" stroke-width="1.5"/>
<line x1="540" y1="426" x2="540" y2="438" stroke="var(--accent)" stroke-width="1.5"/>
<line x1="705" y1="426" x2="705" y2="438" stroke="var(--accent)" stroke-width="1.5"/>

<text x="60" y="500" font-size="22" fill="var(--ink)">One design, now two exposures</text>
</svg>
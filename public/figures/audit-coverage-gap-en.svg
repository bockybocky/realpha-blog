<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A large circle covering many items, with one uncovered node outside it connected back by a dashed line.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="60" y="56" font-size="27" fill="var(--ink)">The edge of the audit</text>

  <circle cx="380" cy="320" r="200" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="380" y="102" font-size="20" fill="var(--dim)" text-anchor="middle">Audited</text>

  <g fill="var(--page)" stroke="var(--line)" stroke-width="2">
    <rect x="325" y="164" width="110" height="42" rx="8"/>
    <rect x="215" y="241" width="110" height="42" rx="8"/>
    <rect x="435" y="241" width="110" height="42" rx="8"/>
    <rect x="195" y="319" width="110" height="42" rx="8"/>
    <rect x="455" y="319" width="110" height="42" rx="8"/>
    <rect x="275" y="394" width="110" height="42" rx="8"/>
    <rect x="395" y="394" width="110" height="42" rx="8"/>
  </g>
  <g font-size="17" fill="var(--ink)" text-anchor="middle">
    <text x="380" y="191">Holdings</text>
    <text x="270" y="268">Signals</text>
    <text x="490" y="268">Data sources</text>
    <text x="250" y="346">Schedules</text>
    <text x="510" y="346">Valuation</text>
    <text x="330" y="421">News</text>
    <text x="450" y="421">Backtests</text>
  </g>

  <line x1="586" y1="322" x2="706" y2="322" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
  <polygon points="716,322 702,316 702,328" fill="var(--dim)"/>

  <rect x="720" y="296" width="170" height="52" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="805" y="329" font-size="20" fill="var(--accent)" text-anchor="middle">The person trading</text>
  <text x="805" y="386" font-size="19" fill="var(--warn)" text-anchor="middle">Never audited</text>
</svg>
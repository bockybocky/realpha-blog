<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A bar split into a large section of AI concepts you already know and a small section of Azure service names to memorise, with an arrow pointing to the small one.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="60" y="74" font-size="27" font-weight="700" fill="var(--ink)">Where the prep effort should go</text>

  <text x="60" y="168" font-size="19" fill="var(--dim)">AI concepts</text>
  <text x="620" y="168" font-size="19" font-weight="700" fill="var(--accent)">Azure service names</text>

  <rect x="60" y="190" width="550" height="88" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="620" y="190" width="280" height="88" rx="8" fill="var(--accent)"/>

  <text x="92" y="243" font-size="16" fill="var(--dim)">You already know this</text>
  <text x="652" y="243" font-size="16" font-weight="700" fill="var(--page)">Memorise</text>

  <line x1="335" y1="340" x2="735" y2="340" stroke="var(--accent)" stroke-width="4"/>
  <polygon points="735,326 768,340 735,354" fill="var(--accent)"/>
  <text x="404" y="392" font-size="20" font-weight="700" fill="var(--accent)">All the effort here</text>

  <text x="60" y="466" font-size="22" fill="var(--ink)">The hard part is the mapping, not the idea</text>
</svg>
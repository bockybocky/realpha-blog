<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右各一根等高的柱子：左柱底部坐在三條實線條塊上；右柱下方留白，柱子懸空沒有支撐。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">重倉踩在什麼上面</text>
  <rect x="60" y="88" width="400" height="356" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="88" width="400" height="356" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="88" y="126">壞情境寫得出來</text>
  <text class="g" x="528" y="126">寫不出來</text>
  <rect x="200" y="150" width="120" height="186" fill="var(--accent)"/>
  <text class="s" x="336" y="250">八成</text>
  <rect x="160" y="344" width="200" height="20" fill="var(--grey)"/>
  <rect x="160" y="370" width="200" height="20" fill="var(--grey)"/>
  <rect x="160" y="396" width="200" height="20" fill="var(--grey)"/>
  <text class="s" x="160" y="438">三條，看得見</text>
  <rect x="640" y="150" width="120" height="186" fill="var(--warn)"/>
  <text class="s" x="776" y="250">八成</text>
  <path d="M600 416 L800 416" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="s" x="600" y="438">底下是空的</text>
  <text class="c" x="60" y="494">說不出有幾條，就是在押感覺</text>
</svg>
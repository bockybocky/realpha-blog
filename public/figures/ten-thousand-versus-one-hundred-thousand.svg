<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="左邊人力柱高、客戶條短；右邊人力柱只剩十分之一、客戶條更長">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text x="80" y="60" font-size="27" font-weight="700" fill="var(--ink)">同樣的生意，兩種身體</text>

  <text x="80" y="110" font-size="20" font-weight="700" fill="var(--dim)">傳統銀行</text>
  <rect x="80" y="130" width="90" height="290" fill="var(--grey)"/>
  <text x="185" y="160" font-size="16" fill="var(--dim)">10 萬名員工</text>
  <g fill="var(--grey)">
    <rect x="185" y="186" width="22" height="22"/><rect x="215" y="186" width="22" height="22"/>
    <rect x="245" y="186" width="22" height="22"/><rect x="275" y="186" width="22" height="22"/>
    <rect x="305" y="186" width="22" height="22"/><rect x="335" y="186" width="22" height="22"/>
    <rect x="185" y="216" width="22" height="22"/><rect x="215" y="216" width="22" height="22"/>
    <rect x="245" y="216" width="22" height="22"/><rect x="275" y="216" width="22" height="22"/>
    <rect x="305" y="216" width="22" height="22"/><rect x="335" y="216" width="22" height="22"/>
  </g>
  <text x="185" y="266" font-size="16" fill="var(--dim)">6,000 家分行</text>
  <rect x="80" y="446" width="200" height="30" fill="var(--grey)"/>
  <text x="80" y="508" font-size="16" fill="var(--dim)">服務 1 億客戶</text>

  <line x1="480" y1="100" x2="480" y2="520" stroke="var(--line)" stroke-width="2"/>

  <text x="540" y="110" font-size="20" font-weight="700" fill="var(--accent)">Nubank</text>
  <rect x="540" y="391" width="90" height="29" fill="var(--accent)"/>
  <text x="645" y="412" font-size="16" fill="var(--dim)">1 萬名員工</text>
  <rect x="645" y="186" width="200" height="52" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="658" y="218" font-size="16" fill="var(--dim)">沒有分行</text>
  <rect x="540" y="446" width="280" height="30" fill="var(--accent)"/>
  <text x="540" y="508" font-size="16" fill="var(--dim)">服務 1.4 億客戶</text>

  <line x1="80" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
  <text x="80" y="566" font-size="22" font-weight="700" fill="var(--ink)">單客成本的差距，在 AI 之前就長好了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三組柱子各對照一條長期基準虛線，經濟高於基準、失業率低於基準、通膨高於目標，三格偏離方向一致">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="60" y="52" font-size="27" font-weight="700" fill="var(--ink)">三個條件湊齊了</text>

  <rect x="60" y="100" width="260" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="190" y="148" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">經濟</text>
  <line x1="84" y1="320" x2="296" y2="320" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="296" y="344" font-size="15" fill="var(--grey)" text-anchor="end">長期平均</text>
  <rect x="155" y="232" width="70" height="88" fill="var(--accent)"/>
  <text x="190" y="216" font-size="16" fill="var(--accent)" text-anchor="middle">高於</text>
  <text x="190" y="408" font-size="15" fill="var(--dim)" text-anchor="middle">四年都在上面</text>

  <rect x="350" y="100" width="260" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="480" y="148" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">就業</text>
  <line x1="374" y1="320" x2="586" y2="320" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="586" y="300" font-size="15" fill="var(--grey)" text-anchor="end">長期失業率</text>
  <rect x="445" y="320" width="70" height="56" fill="var(--accent)"/>
  <text x="480" y="404" font-size="16" fill="var(--accent)" text-anchor="middle">低於</text>
  <text x="480" y="216" font-size="15" fill="var(--dim)" text-anchor="middle">充分就業</text>

  <rect x="640" y="100" width="260" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="770" y="148" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">通膨</text>
  <line x1="664" y1="320" x2="876" y2="320" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="876" y="344" font-size="15" fill="var(--grey)" text-anchor="end">目標</text>
  <rect x="735" y="212" width="70" height="108" fill="var(--warn)"/>
  <text x="770" y="196" font-size="16" fill="var(--warn)" text-anchor="middle">高於</text>
  <text x="770" y="408" font-size="15" fill="var(--dim)" text-anchor="middle">超標五年多</text>

  <text x="480" y="512" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">不必在雙重使命之間取捨</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="美國濃縮產能曲線從九成以上一路下滑到零並長期貼地，右端 2028 年虛線旁留著一塊待補的缺口">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型：繁體中文無襯線 */
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">美國自己的濃縮產能</text>
<line x1="100" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<path d="M120,150 C260,150 310,175 380,300 C440,405 490,448 570,452 L880,452" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="120" cy="150" r="7" fill="var(--accent)"/>
<text x="140" y="140" font-size="20" font-weight="600" fill="var(--ink)">全球供應 九成以上</text>
<text x="140" y="166" font-size="16" fill="var(--dim)">二戰與冷戰年代</text>
<text x="330" y="258" font-size="16" fill="var(--dim)">成本撐不住</text>
<text x="330" y="282" font-size="16" fill="var(--dim)">自己關掉</text>
<text x="560" y="500" font-size="20" font-weight="600" fill="var(--ink)">自製 ＝ 0</text>
<text x="560" y="524" font-size="16" fill="var(--dim)">改向歐洲與俄羅斯買</text>
<line x1="800" y1="110" x2="800" y2="470" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="700" y="100" font-size="19" font-weight="600" fill="var(--warn)">2028 禁令生效</text>
<rect x="812" y="332" width="76" height="118" fill="var(--card)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
<text x="806" y="320" font-size="17" fill="var(--warn)">四分之一</text>
<text x="820" y="300" font-size="17" fill="var(--warn)">待補</text>
<text x="60" y="110" font-size="22" font-weight="600" fill="var(--ink)">關掉的那一節，現在是空的</text>
</svg>
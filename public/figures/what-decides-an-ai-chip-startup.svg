<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條代表配額產能與客戶的長橫條，對比一條明顯很短的 AI 加速流程橫條">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>

<text x="70" y="62" font-size="27" font-weight="700" fill="var(--ink)">決定生死的，不在流程效率</text>

<text x="70" y="146" font-size="20" fill="var(--ink)">HBM 配額</text>
<rect x="290" y="126" width="560" height="34" rx="6" fill="var(--accent)"/>

<text x="70" y="216" font-size="20" fill="var(--ink)">晶圓產能</text>
<rect x="290" y="196" width="600" height="34" rx="6" fill="var(--accent)"/>

<text x="70" y="286" font-size="20" fill="var(--ink)">大客戶願意用</text>
<rect x="290" y="266" width="520" height="34" rx="6" fill="var(--accent)"/>

<text x="70" y="366" font-size="20" fill="var(--dim)">AI 加速流程</text>
<rect x="290" y="346" width="96" height="34" rx="6" fill="var(--grey)"/>

<line x1="290" y1="110" x2="290" y2="400" stroke="var(--line)" stroke-width="2"/>

<text x="70" y="452" font-size="22" font-weight="700" fill="var(--ink)">看新聞先找上面那三條</text>
</svg>
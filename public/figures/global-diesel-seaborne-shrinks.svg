<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條逐步變短的橫條，最短那條末端有一段缺口，下方標示誰有儲備誰沒有">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700 }
.g { font-size:20px; fill:var(--ink); font-weight:600 }
.b { font-size:16px; fill:var(--dim) }
.n { font-size:22px; fill:var(--ink); font-weight:700 }
.c { font-size:22px; fill:var(--ink); font-weight:600 }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56">抽掉的那一段，沒有備胎</text>
<rect x="150" y="120" width="560" height="52" fill="var(--grey)"/>
<text class="g" x="726" y="154">平常 700</text>
<rect x="150" y="210" width="480" height="52" fill="var(--grey)"/>
<text class="g" x="646" y="244">現在 600</text>
<rect x="150" y="300" width="360" height="52" fill="var(--accent)"/>
<rect x="510" y="300" width="120" height="52" fill="var(--warn)"/>
<text class="g" x="646" y="334" fill="var(--warn)">再抽 150</text>
<line x1="570" y1="360" x2="570" y2="392" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="330" y="416" text-anchor="middle">歐洲 有儲備</text>
<text class="b" x="570" y="416" text-anchor="middle">拉美 沒有</text>
<text class="b" x="810" y="416" text-anchor="middle">亞洲 求日韓</text>
<text class="b" x="150" y="446">百萬桶／日</text>
<text class="c" x="60" y="492">缺口落在最沒有備胎的人身上</text>
</svg>
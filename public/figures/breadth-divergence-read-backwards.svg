<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩格對比：科技領先時落後者補上來，其餘走強而科技轉弱時後續往下">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">哪一種分歧才要小心</text>

<rect x="60" y="100" width="400" height="320" rx="8" fill="var(--card)"/>
<text class="t" x="80" y="140" font-size="20" font-weight="700" fill="var(--ink)">科技領先，其餘落後</text>
<path d="M100 300 L220 240 L300 215" stroke="var(--accent)" stroke-width="4" fill="none"/>
<path d="M100 320 L220 345 L300 352" stroke="var(--grey)" stroke-width="4" fill="none"/>
<path d="M300 352 L420 265" stroke="var(--grey)" stroke-width="4" fill="none" stroke-dasharray="8 6"/>
<line x1="300" y1="170" x2="300" y2="380" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="310" y="400" font-size="16" fill="var(--dim)">之後</text>
<text class="t" x="80" y="400" font-size="19" fill="var(--dim)">落後那群補上來</text>

<rect x="500" y="100" width="400" height="320" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="520" y="140" font-size="20" font-weight="700" fill="var(--warn)">其餘走強，科技轉弱</text>
<path d="M540 320 L660 250 L740 230" stroke="var(--grey)" stroke-width="4" fill="none"/>
<path d="M540 250 L660 300 L740 330" stroke="var(--accent)" stroke-width="4" fill="none"/>
<path d="M740 230 L860 350" stroke="var(--warn)" stroke-width="4" fill="none" stroke-dasharray="8 6"/>
<line x1="740" y1="170" x2="740" y2="380" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="750" y="400" font-size="16" fill="var(--dim)">之後</text>
<text class="t" x="520" y="400" font-size="19" font-weight="700" fill="var(--warn)">這一格才危險</text>

<text class="t" x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">今天在左邊那一格</text>
</svg>
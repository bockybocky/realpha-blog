<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一個節點分岔成兩條路，上路只剩一個結果、三個方案灰掉，下路多帶回一行理由並指回輸入">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">兩種回法，拿回來的東西不一樣</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">起點都是它丟出一串方案要你選</text>

<rect x="60" y="258" width="184" height="88" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="152" y="310" font-size="19" fill="var(--ink)" text-anchor="middle">四個方案</text>

<path d="M244 292 L330 194" stroke="var(--grey)" stroke-width="2" fill="none"/>
<path d="M244 312 L330 410" stroke="var(--accent)" stroke-width="2" fill="none"/>

<rect x="336" y="152" width="196" height="80" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="434" y="200" font-size="19" fill="var(--warn)" text-anchor="middle">罵一句</text>
<line x1="540" y1="192" x2="616" y2="192" stroke="var(--grey)" stroke-width="2"/>
<polygon points="628,192 612,185 612,199" fill="var(--grey)"/>
<rect x="634" y="152" width="196" height="80" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="732" y="200" font-size="19" fill="var(--ink)" text-anchor="middle">一個結果</text>
<rect x="640" y="252" width="46" height="30" rx="5" fill="var(--grey)" opacity="0.45"/>
<rect x="696" y="252" width="46" height="30" rx="5" fill="var(--grey)" opacity="0.45"/>
<rect x="752" y="252" width="46" height="30" rx="5" fill="var(--grey)" opacity="0.45"/>
<text x="850" y="273" font-size="15" fill="var(--dim)">看不見了</text>

<rect x="336" y="370" width="196" height="80" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="434" y="404" font-size="19" fill="var(--accent)" text-anchor="middle">你決定</text>
<text x="434" y="430" font-size="15" fill="var(--dim)" text-anchor="middle">加一行排除了什麼</text>
<line x1="540" y1="410" x2="616" y2="410" stroke="var(--accent)" stroke-width="2"/>
<polygon points="628,410 612,403 612,417" fill="var(--accent)"/>
<rect x="634" y="370" width="196" height="80" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="732" y="404" font-size="19" fill="var(--ink)" text-anchor="middle">結果</text>
<text x="732" y="430" font-size="15" fill="var(--accent)" text-anchor="middle">＋那一行理由</text>
<path d="M732 462 L732 494 L152 494 L152 356" stroke="var(--accent)" stroke-width="2" fill="none" stroke-dasharray="7 6"/>
<polygon points="152,346 145,362 159,362" fill="var(--accent)"/>
<text x="440" y="486" font-size="15" fill="var(--accent)" text-anchor="middle">照見輸入是我給錯的</text>

<text x="60" y="536" font-size="22" fill="var(--ink)">少的那一行，就是你的盲點。</text>
</svg>
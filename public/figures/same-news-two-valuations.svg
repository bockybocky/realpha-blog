<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一支向下箭頭，打在高柱上削掉一大段，打在矮柱上幾乎沒變化">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M1 1 L5 9 L9 1" fill="none" stroke="var(--warn)" stroke-width="2"/></marker></defs>
<text class="h" x="480" y="52" text-anchor="middle">同一則利空，打在兩個水位上</text>
<line x1="60" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="330" width="150" height="120" fill="var(--grey)"/>
<rect x="150" y="190" width="150" height="140" fill="var(--accent)"/>
<text class="s" x="225" y="262" text-anchor="middle" fill="var(--page)">先付過的</text>
<text class="s" x="225" y="286" text-anchor="middle" fill="var(--page)">未來幾季</text>
<text class="s" x="225" y="396" text-anchor="middle">眼前的獲利</text>
<line x1="380" y1="150" x2="380" y2="330" stroke="var(--warn)" stroke-width="3" marker-end="url(#ar)"/>
<text class="s" x="396" y="160" fill="var(--warn)">同一則延期的消息</text>
<text class="g" x="225" y="492" text-anchor="middle">估值估滿的那檔</text>
<line x1="500" y1="110" x2="500" y2="510" stroke="var(--line)" stroke-width="1" stroke-dasharray="5 7"/>
<rect x="640" y="380" width="150" height="70" fill="var(--grey)"/>
<text class="s" x="715" y="422" text-anchor="middle">眼前的獲利</text>
<line x1="860" y1="330" x2="860" y2="368" stroke="var(--warn)" stroke-width="3" marker-end="url(#ar)"/>
<text class="s" x="860" y="316" text-anchor="middle" fill="var(--warn)">同一則</text>
<text class="g" x="715" y="492" text-anchor="middle">趴在地上的那檔</text>
<text class="c" x="480" y="528" text-anchor="middle">被洗掉的是預期，不是消息</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="頻譜總量橫條比較，四百、七十九、十四">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .g { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="62" font-size="27" font-weight="700">手上那塊地有多大</text>

  <text class="t" x="48" y="140" font-size="20" font-weight="700">T-Mobile</text>
  <rect x="48" y="156" width="760" height="56" rx="6" fill="var(--grey)"/>
  <text class="t" x="824" y="194" font-size="20" font-weight="700">400 MHz</text>

  <text class="t" x="48" y="268" font-size="20" font-weight="700">SpaceX 全部</text>
  <rect x="48" y="284" width="150" height="56" rx="6" fill="var(--accent)"/>
  <text class="t" x="214" y="322" font-size="20" font-weight="700" fill="var(--accent)">79 MHz</text>

  <text class="t" x="48" y="396" font-size="20" font-weight="700">這次買的低頻</text>
  <rect x="48" y="412" width="27" height="56" rx="6" fill="var(--warn)"/>
  <text class="t" x="92" y="450" font-size="20" font-weight="700" fill="var(--warn)">7 + 7 MHz</text>

  <text class="t" x="520" y="450" font-size="22" font-weight="700">多打幾道波束，卡在這裡</text>
</svg>
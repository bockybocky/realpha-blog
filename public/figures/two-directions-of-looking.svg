<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同一疊五層產業結構，左側箭頭往下、右側箭頭往上，兩種相反的觀察方向">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="52" font-size="27" fill="var(--ink)">兩個方向，看到的東西不一樣</text>

<rect x="330" y="96" width="300" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="131" font-size="16" fill="var(--ink)" text-anchor="middle">模型</text>
<rect x="330" y="164" width="300" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="199" font-size="16" fill="var(--ink)" text-anchor="middle">雲與伺服器</text>
<rect x="330" y="232" width="300" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="267" font-size="16" fill="var(--ink)" text-anchor="middle">晶片</text>
<rect x="330" y="300" width="300" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="335" font-size="16" fill="var(--ink)" text-anchor="middle">零件</text>
<rect x="330" y="368" width="300" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="403" font-size="16" fill="var(--ink)" text-anchor="middle">電與材料</text>

<path d="M270 110 L270 410" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M270 418 l-7 -14 h14 z" fill="var(--grey)"/>
<text x="248" y="250" font-size="19" fill="var(--dim)" text-anchor="middle" transform="rotate(-90 248 250)">多數人：從模型往下看</text>

<path d="M690 410 L690 110" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M690 102 l-7 14 h14 z" fill="var(--accent)"/>
<text x="716" y="250" font-size="19" fill="var(--accent)" text-anchor="middle" transform="rotate(90 716 250)">他：從電和材料往上看</text>

<text x="480" y="478" font-size="22" fill="var(--ink)" text-anchor="middle">往上看處理的是實體限制：產線換不掉</text>
</svg>
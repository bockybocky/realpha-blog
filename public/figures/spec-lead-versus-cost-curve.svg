<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左格鋸齒線反覆衝高又掉回，右格複利曲線一路往上">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">兩種領先，長得不一樣</text>

<rect x="70" y="100" width="390" height="300" rx="10" fill="var(--card)"/>
<text class="g" x="96" y="140">規格領先</text>
<line x1="96" y1="360" x2="434" y2="360" stroke="var(--line)" stroke-width="2"/>
<path d="M96 360 L156 200 L186 352 L246 196 L276 350 L336 192 L366 354 L426 198" fill="none" stroke="var(--grey)" stroke-width="5"/>
<text class="b" x="96" y="388">每一代都要重新贏一次</text>

<rect x="500" y="100" width="390" height="300" rx="10" fill="var(--card)"/>
<text class="g" x="526" y="140">成本曲線領先</text>
<line x1="526" y1="360" x2="864" y2="360" stroke="var(--line)" stroke-width="2"/>
<path d="M526 356 Q690 348 772 268 T860 166" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="b" x="526" y="388">量帶良率，良率帶成本，成本帶現金</text>

<text class="c" x="60" y="460">一種被追回就沒了，一種自己會長大</text>
</svg>
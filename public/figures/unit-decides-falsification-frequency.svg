<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上密下疏兩條時間軸，密的是價格單位每天被證偽，疏的是產能與時程單位一季一次">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
    <text x="48" y="64" font-size="27" font-weight="700" fill="var(--ink)">判斷的單位，決定被證偽的頻率</text>

    <rect x="40" y="130" width="880" height="160" rx="12" fill="var(--card)" stroke="var(--line)"/>
    <text x="70" y="196" font-size="20" font-weight="600" fill="var(--warn)">以價格為單位</text>
    <text x="70" y="226" font-size="16" fill="var(--dim)">每天一次</text>
    <line x1="250" y1="210" x2="904" y2="210" stroke="var(--line)" stroke-width="2"/>
    <path d="M258 196v28 M272 196v28 M286 196v28 M300 196v28 M314 196v28 M328 196v28 M342 196v28 M356 196v28 M370 196v28 M384 196v28 M398 196v28 M412 196v28 M426 196v28 M440 196v28 M454 196v28 M468 196v28 M482 196v28 M496 196v28 M510 196v28 M524 196v28 M538 196v28 M552 196v28 M566 196v28 M580 196v28 M594 196v28 M608 196v28 M622 196v28 M636 196v28 M650 196v28 M664 196v28 M678 196v28 M692 196v28 M706 196v28 M720 196v28 M734 196v28 M748 196v28 M762 196v28 M776 196v28 M790 196v28 M804 196v28 M818 196v28 M832 196v28 M846 196v28 M860 196v28 M874 196v28 M888 196v28" stroke="var(--warn)" stroke-width="2.4" fill="none"/>

    <rect x="40" y="330" width="880" height="160" rx="12" fill="var(--card)" stroke="var(--line)"/>
    <text x="70" y="396" font-size="20" font-weight="600" fill="var(--accent)">以產能與時程為單位</text>
    <text x="70" y="426" font-size="16" fill="var(--dim)">一季一次</text>
    <line x1="330" y1="410" x2="904" y2="410" stroke="var(--line)" stroke-width="2"/>
    <circle cx="390" cy="410" r="9" fill="var(--accent)"/>
    <circle cx="550" cy="410" r="9" fill="var(--accent)"/>
    <circle cx="710" cy="410" r="9" fill="var(--accent)"/>
    <circle cx="870" cy="410" r="9" fill="var(--accent)"/>
    <text x="390" y="452" font-size="16" text-anchor="middle" fill="var(--dim)">交期</text>
    <text x="550" y="452" font-size="16" text-anchor="middle" fill="var(--dim)">認證時程</text>
    <text x="710" y="452" font-size="16" text-anchor="middle" fill="var(--dim)">產能爬坡</text>
    <text x="870" y="452" font-size="16" text-anchor="middle" fill="var(--dim)">擴產資本</text>

    <text x="480" y="528" font-size="22" text-anchor="middle" fill="var(--ink)">你選的單位，決定你多常懷疑自己</text>
  </g>
</svg>
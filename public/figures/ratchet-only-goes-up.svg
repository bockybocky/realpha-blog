<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="鋸齒狀台階一路往右上升，向上的箭頭沿齒而上，向下的箭頭被齒卡住無法退回">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">上得去，退不回來</text>

  <rect x="60" y="92" width="840" height="368" rx="10" fill="var(--card)"/>

  <path d="M110 400 h150 v-70 h150 v-70 h150 v-70 h150 v-70 h130"
        fill="none" stroke="var(--line)" stroke-width="4"/>
  <path d="M110 400 h150 v-70 h150 v-70 h150 v-70 h150 v-70 h130 v280 h-730 z"
        fill="var(--line)" opacity="0.35"/>

  <path d="M150 384 L740 160" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/>
  <path d="M756 154 l-10 22 -16 -16 z" fill="var(--accent)"/>
  <text class="t" x="300" y="246" font-size="19" font-weight="700" fill="var(--accent)">擴表：習慣往上長</text>

  <path d="M700 196 L600 232" stroke="var(--warn)" stroke-width="7" stroke-linecap="round"/>
  <path d="M588 236 l22 -12 2 22 z" fill="var(--warn)"/>
  <line x1="586" y1="222" x2="586" y2="262" stroke="var(--warn)" stroke-width="7"/>
  <text class="t" x="430" y="308" font-size="19" font-weight="700" fill="var(--warn)">縮表：卡在齒上</text>

  <text class="t" x="110" y="432" font-size="16" fill="var(--dim)">管道萎縮、額度放大、現金綁住</text>

  <text class="t" x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">每一次都停在比上次更高的地方</text>
</svg>
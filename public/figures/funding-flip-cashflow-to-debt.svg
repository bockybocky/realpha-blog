<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上下兩根等長的橫條，上面一根整條同色，下面一根有一半以上換成另一種顏色">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">同一筆錢，換了性質</text>
<text x="60" y="200" font-size="19" fill="var(--dim)">過去</text>
<rect x="180" y="168" width="680" height="64" fill="var(--grey)"/>
<text x="520" y="208" font-size="19" fill="var(--page)" text-anchor="middle">內部現金流</text>
<text x="60" y="336" font-size="19" fill="var(--ink)">今年上半</text>
<rect x="180" y="304" width="306" height="64" fill="var(--grey)"/>
<rect x="486" y="304" width="374" height="64" fill="var(--warn)"/>
<text x="333" y="344" font-size="19" fill="var(--page)" text-anchor="middle">現金流</text>
<text x="673" y="344" font-size="19" fill="var(--page)" text-anchor="middle">外部債</text>
<text x="333" y="404" font-size="19" fill="var(--dim)" text-anchor="middle">可以放慢</text>
<text x="673" y="404" font-size="19" fill="var(--warn)" text-anchor="middle">不能停</text>
<text x="480" y="470" font-size="22" fill="var(--ink)" text-anchor="middle">來源變了，時間表也跟著變</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A line showing the US share of global enrichment collapses from 86% at the upper left to under 0.1% at the lower right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="78" font-size="27" fill="var(--ink)">US firms' share of global enrichment</text>

<line x1="140" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="140" x2="140" y2="440" stroke="var(--line)" stroke-width="2"/>

<line x1="140" y1="150" x2="900" y2="150" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 6"/>
<text x="120" y="156" font-size="15" fill="var(--dim)" text-anchor="end">86%</text>
<text x="120" y="446" font-size="15" fill="var(--dim)" text-anchor="end">0</text>

<polyline points="180,150 320,185 460,255 600,340 740,412 880,435" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="180" cy="150" r="9" fill="var(--accent)"/>
<circle cx="880" cy="435" r="9" fill="var(--warn)"/>

<text x="180" y="125" font-size="20" fill="var(--ink)" text-anchor="middle">86%</text>
<text x="180" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">1980s</text>

<text x="880" y="410" font-size="20" fill="var(--warn)" text-anchor="end">Under 0.1%</text>
<text x="880" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">Today</text>

<text x="470" y="215" font-size="19" fill="var(--dim)">Gaseous diffusion</text>
<text x="470" y="243" font-size="19" fill="var(--dim)">vs centrifuges</text>

<text x="60" y="520" font-size="22" fill="var(--ink)">They exited on cost, not on policy</text>
</g>
</svg>
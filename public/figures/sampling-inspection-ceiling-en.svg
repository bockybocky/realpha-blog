<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The production row of cells doubles while the sampling row below barely changes.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">The ceiling on sampling</text>

  <text x="60" y="112" font-size="20" font-weight="700" fill="var(--ink)">Today</text>
  <text x="60" y="152" font-size="16" fill="var(--dim)">Production</text>
  <g fill="var(--card)" stroke="var(--accent)" stroke-width="2">
    <rect x="150" y="130" width="26" height="28"/>
    <rect x="180" y="130" width="26" height="28"/>
    <rect x="210" y="130" width="26" height="28"/>
    <rect x="240" y="130" width="26" height="28"/>
    <rect x="270" y="130" width="26" height="28"/>
    <rect x="300" y="130" width="26" height="28"/>
    <rect x="330" y="130" width="26" height="28"/>
    <rect x="360" y="130" width="26" height="28"/>
    <rect x="390" y="130" width="26" height="28"/>
    <rect x="420" y="130" width="26" height="28"/>
  </g>
  <text x="60" y="198" font-size="16" fill="var(--dim)">Sampling</text>
  <g fill="var(--card)" stroke="var(--warn)" stroke-width="2">
    <rect x="150" y="176" width="26" height="28"/>
    <rect x="180" y="176" width="26" height="28"/>
  </g>

  <line x1="60" y1="250" x2="900" y2="250" stroke="var(--line)" stroke-width="1"/>

  <text x="60" y="300" font-size="20" font-weight="700" fill="var(--ink)">After chip volume doubles</text>
  <text x="60" y="340" font-size="16" fill="var(--dim)">Production</text>
  <g fill="var(--card)" stroke="var(--accent)" stroke-width="2">
    <rect x="150" y="318" width="26" height="28"/>
    <rect x="180" y="318" width="26" height="28"/>
    <rect x="210" y="318" width="26" height="28"/>
    <rect x="240" y="318" width="26" height="28"/>
    <rect x="270" y="318" width="26" height="28"/>
    <rect x="300" y="318" width="26" height="28"/>
    <rect x="330" y="318" width="26" height="28"/>
    <rect x="360" y="318" width="26" height="28"/>
    <rect x="390" y="318" width="26" height="28"/>
    <rect x="420" y="318" width="26" height="28"/>
    <rect x="450" y="318" width="26" height="28"/>
    <rect x="480" y="318" width="26" height="28"/>
    <rect x="510" y="318" width="26" height="28"/>
    <rect x="540" y="318" width="26" height="28"/>
    <rect x="570" y="318" width="26" height="28"/>
    <rect x="600" y="318" width="26" height="28"/>
    <rect x="630" y="318" width="26" height="28"/>
    <rect x="660" y="318" width="26" height="28"/>
    <rect x="690" y="318" width="26" height="28"/>
    <rect x="720" y="318" width="26" height="28"/>
  </g>
  <text x="770" y="340" font-size="20" font-weight="700" fill="var(--accent)">x2</text>
  <text x="60" y="386" font-size="16" fill="var(--dim)">Sampling</text>
  <g fill="var(--card)" stroke="var(--warn)" stroke-width="2">
    <rect x="150" y="364" width="26" height="28"/>
    <rect x="180" y="364" width="26" height="28"/>
    <rect x="210" y="364" width="26" height="28"/>
  </g>
  <text x="260" y="386" font-size="20" font-weight="700" fill="var(--warn)">x1.5</text>

  <text x="60" y="452" font-size="16" fill="var(--dim)">Speed is the limit, not execution</text>

  <text x="480" y="510" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Volume doubles, sampling does not</text>
</svg>
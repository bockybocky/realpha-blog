<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="縱向階梯上左側長括號涵蓋全部層級，右側短括號只涵蓋最上兩層">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">看得到，不等於該伸手</text>

  <g>
    <rect x="330" y="110" width="300" height="62" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text class="t" x="480" y="148" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">軍團</text>
    <rect x="330" y="186" width="300" height="62" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
    <text class="t" x="480" y="224" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">師</text>
    <rect x="330" y="262" width="300" height="62" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text class="t" x="480" y="300" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">旅</text>
    <rect x="330" y="338" width="300" height="62" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text class="t" x="480" y="376" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">營</text>
    <rect x="330" y="414" width="300" height="62" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text class="t" x="480" y="452" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">排</text>
  </g>

  <path d="M 290 116 L 268 116 L 268 470 L 290 470" stroke="var(--accent)" stroke-width="3" fill="none"/>
  <text class="t" x="236" y="286" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="end">藍點都看得到</text>
  <text class="t" x="236" y="314" font-size="15" fill="var(--dim)" text-anchor="end">上下各兩級</text>

  <path d="M 670 192 L 692 192 L 692 318 L 670 318" stroke="var(--ink)" stroke-width="3" fill="none"/>
  <text class="t" x="724" y="248" font-size="20" font-weight="700" fill="var(--ink)">我的工作</text>
  <text class="t" x="724" y="276" font-size="15" fill="var(--dim)">塑造與打擊</text>

  <g stroke="var(--warn)" stroke-width="4">
    <path d="M 676 430 L 704 456"/><path d="M 704 430 L 676 456"/>
  </g>
  <text class="t" x="724" y="450" font-size="16" font-weight="700" fill="var(--warn)">不是我的工作</text>
  <text class="t" x="480" y="520" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">能見度變大，動手範圍不跟著變大</text>
</svg>
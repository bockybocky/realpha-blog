<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="訓練支出陡升，推理營收在中途分岔成追得上與追不上兩條走勢" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="48" y="56" font-size="27" fill="var(--ink)">追不追得上</text>
  <text x="48" y="88" font-size="16" fill="var(--dim)">可觀察的是斜率，不是說法</text>

  <line x1="110" y1="130" x2="110" y2="450" stroke="var(--line)" stroke-width="2"/>
  <line x1="110" y1="450" x2="890" y2="450" stroke="var(--line)" stroke-width="2"/>
  <text x="110" y="118" font-size="15" fill="var(--dim)" text-anchor="middle">規模</text>
  <text x="888" y="474" font-size="15" fill="var(--dim)" text-anchor="end">時間</text>

  <path d="M130 432 C 350 420, 560 340, 852 168" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text x="852" y="150" font-size="19" fill="var(--warn)" text-anchor="end">訓練支出</text>

  <path d="M130 442 C 300 434, 430 404, 520 378" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text x="240" y="418" font-size="19" fill="var(--accent)">推理營收</text>

  <path d="M520 378 C 640 352, 745 282, 852 214" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="852" y="200" font-size="19" fill="var(--accent)" text-anchor="end">追得上</text>

  <path d="M520 378 C 640 376, 745 368, 852 356" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="852" y="342" font-size="19" fill="var(--grey)" text-anchor="end">追不上</text>

  <circle cx="520" cy="378" r="6" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>

  <text x="480" y="512" font-size="22" fill="var(--accent)" text-anchor="middle">兩條線的相對斜率</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="寬管道被中間的許可細頸掐住，右端是等電的機櫃">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">缺的不是電，是許可</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">從發電到機櫃的那條管子</text>

<path d="M80 170 L380 250 L580 250 L880 200 L880 360 L580 310 L380 310 L80 390 Z" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<rect x="380" y="250" width="200" height="60" fill="var(--warn)" opacity="0.3"/>
<line x1="380" y1="250" x2="380" y2="310" stroke="var(--warn)" stroke-width="3"/>
<line x1="580" y1="250" x2="580" y2="310" stroke="var(--warn)" stroke-width="3"/>

<text class="t" x="80" y="150" font-size="20" font-weight="700" fill="var(--ink)">天然氣、核能</text>
<text class="t" x="80" y="430" font-size="16" fill="var(--dim)">量夠用</text>

<text class="t" x="394" y="222" font-size="20" font-weight="700" fill="var(--warn)">細頸</text>
<text class="t" x="366" y="352" font-size="16" fill="var(--dim)">電網接入、民意、監管、環評</text>

<text class="t" x="740" y="178" font-size="20" font-weight="700" fill="var(--ink)">機櫃</text>
<text class="t" x="700" y="400" font-size="16" fill="var(--dim)">在排隊等電</text>

<line x1="60" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="490" font-size="22" font-weight="700" fill="var(--ink)">誰先把電交到機櫃，誰先收到錢</text>
</svg>
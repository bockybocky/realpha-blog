<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊四根等高柱子代表資源平等分享，右邊四根柱子隨忠誠度升高而越來越高，代表資源依忠誠分層">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="58" font-size="27" font-weight="600" fill="var(--ink)">資源分配的兩種依據</text>

<rect x="48" y="92" width="420" height="390" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="76" y="132" font-size="20" font-weight="600" fill="var(--ink)">一般社會</text>
<text x="76" y="158" font-size="15" fill="var(--dim)">平等分享</text>
<line x1="76" y1="400" x2="440" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="304" width="56" height="96" fill="var(--grey)"/>
<rect x="186" y="304" width="56" height="96" fill="var(--grey)"/>
<rect x="272" y="304" width="56" height="96" fill="var(--grey)"/>
<rect x="358" y="304" width="56" height="96" fill="var(--grey)"/>
<text x="128" y="426" font-size="15" fill="var(--dim)" text-anchor="middle">教授</text>
<text x="214" y="426" font-size="15" fill="var(--dim)" text-anchor="middle">公民</text>
<text x="300" y="426" font-size="15" fill="var(--dim)" text-anchor="middle">幹部</text>
<text x="386" y="426" font-size="15" fill="var(--dim)" text-anchor="middle">代理人</text>
<text x="258" y="458" font-size="15" fill="var(--dim)" text-anchor="middle">忠誠度 低 → 高</text>

<rect x="492" y="92" width="420" height="390" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="520" y="132" font-size="20" font-weight="600" fill="var(--ink)">黑手黨式國家</text>
<text x="520" y="158" font-size="15" fill="var(--dim)">依忠誠分層</text>
<line x1="520" y1="400" x2="884" y2="400" stroke="var(--line)" stroke-width="2"/>
<rect x="544" y="374" width="56" height="26" fill="var(--grey)"/>
<rect x="630" y="348" width="56" height="52" fill="var(--grey)"/>
<rect x="716" y="292" width="56" height="108" fill="var(--accent)"/>
<rect x="802" y="230" width="56" height="170" fill="var(--accent)"/>
<text x="572" y="426" font-size="15" fill="var(--dim)" text-anchor="middle">教授</text>
<text x="658" y="426" font-size="15" fill="var(--dim)" text-anchor="middle">公民</text>
<text x="744" y="426" font-size="15" fill="var(--dim)" text-anchor="middle">幹部</text>
<text x="830" y="426" font-size="15" fill="var(--dim)" text-anchor="middle">代理人</text>
<text x="702" y="458" font-size="15" fill="var(--dim)" text-anchor="middle">忠誠度 低 → 高</text>

<text x="480" y="524" font-size="22" font-weight="600" fill="var(--ink)" text-anchor="middle">分配的軸：從身分換成忠誠</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="管道在廠外兩段收窄，廠內段最寬，窄處標為瓶頸">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style></defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">他控制得了的，與控制不了的</text>
<path d="M60 170 L300 170 L300 230 L560 230 L560 150 L900 150 L900 370 L560 370 L560 290 L300 290 L300 350 L60 350 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="296" y="230" width="8" height="60" fill="var(--warn)"/>
<rect x="556" y="230" width="8" height="60" fill="var(--warn)"/>
<text class="g" x="178" y="268" text-anchor="middle">鋼材・管件・泵</text>
<text class="n" x="178" y="296" text-anchor="middle">230 多家供應商</text>
<text class="g" x="430" y="258" text-anchor="middle">燃料</text>
<text class="n" x="430" y="286" text-anchor="middle">濃縮與製造</text>
<text class="g" x="730" y="250" text-anchor="middle">德州那座工廠</text>
<text class="n" x="730" y="278" text-anchor="middle">他自己蓋的</text>
<text class="c" x="300" y="152" text-anchor="middle">瓶頸</text>
<text class="c" x="560" y="132" text-anchor="middle">瓶頸</text>
<text class="n" x="60" y="430">廠外的擴產決定不在他手上</text>
<text class="n" x="60" y="458">窄的那一格決定整條線的流量</text>
</svg>
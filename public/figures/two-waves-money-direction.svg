<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩波投資的錢流方向相反：前一波是政府補貼推企業回來，後一波是企業自己掏錢搶投產時間">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">錢是誰掏的，方向就反過來</text>

  <rect x="60" y="100" width="390" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="88" y="140">2017–2018</text>
  <text class="b" x="88" y="168">五缺：水、電、工、土地</text>

  <rect x="88" y="200" width="110" height="56" rx="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="104" y="234">政府</text>
  <rect x="312" y="200" width="110" height="56" rx="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="328" y="234">台商</text>
  <path d="M206 228 L300 228" stroke="var(--grey)" stroke-width="4" fill="none"/>
  <path d="M300 228 l-14 -8 l0 16 z" fill="var(--grey)"/>
  <text class="b" x="212" y="212">減稅・優惠貸款</text>

  <path d="M88 300 L422 300" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="b" x="88" y="334">匯回的錢只能買生產設備</text>
  <text class="b" x="88" y="360">不准進不動產</text>

  <rect x="510" y="100" width="390" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="538" y="140">2022 之後</text>
  <text class="b" x="538" y="168">沒有誰在補貼</text>

  <rect x="538" y="200" width="110" height="56" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text class="b" x="554" y="234" fill="var(--ink)">大廠</text>
  <rect x="762" y="200" width="110" height="56" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text class="b" x="778" y="234" fill="var(--ink)">台灣</text>
  <path d="M656 228 L750 228" stroke="var(--accent)" stroke-width="5" fill="none"/>
  <path d="M750 228 l-16 -9 l0 18 z" fill="var(--accent)"/>
  <text class="b" x="660" y="212" fill="var(--accent)">自己出錢</text>

  <path d="M538 300 L872 300" stroke="var(--accent)" stroke-width="2"/>
  <text class="b" x="538" y="334" fill="var(--ink)">誰先量產誰拿訂單</text>
  <text class="b" x="538" y="360">買、租、新舊都排在時間後面</text>

  <text class="c" x="60" y="470">前一波是被請回來的，這一波是自己要來的</text>
  <text class="b" x="60" y="502">所以後一波付得起時間的溢價</text>
</svg>
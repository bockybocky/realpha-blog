<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four vertical gauges where the grey markers sit high and the blue markers have all dropped close to the bottom.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Same framework, inputs all at the floor</text>

  <circle cx="660" cy="100" r="9" fill="var(--grey)"/>
  <text x="678" y="106" font-size="15" fill="var(--dim)">August</text>
  <circle cx="760" cy="100" r="9" fill="var(--accent)"/>
  <text x="778" y="106" font-size="15" fill="var(--dim)">Last weekend</text>

  <g>
    <rect x="160" y="150" width="26" height="300" rx="13" fill="var(--card)" stroke="var(--line)"/>
    <rect x="360" y="150" width="26" height="300" rx="13" fill="var(--card)" stroke="var(--line)"/>
    <rect x="560" y="150" width="26" height="300" rx="13" fill="var(--card)" stroke="var(--line)"/>
    <rect x="760" y="150" width="26" height="300" rx="13" fill="var(--card)" stroke="var(--line)"/>
  </g>
  <line x1="120" y1="430" x2="830" y2="430" stroke="var(--line)" stroke-dasharray="6 6"/>
  <text x="836" y="436" font-size="15" fill="var(--dim)">Floor</text>

  <circle cx="173" cy="200" r="11" fill="var(--grey)"/>
  <circle cx="373" cy="215" r="11" fill="var(--grey)"/>
  <circle cx="573" cy="230" r="11" fill="var(--grey)"/>
  <circle cx="773" cy="205" r="11" fill="var(--grey)"/>

  <circle cx="173" cy="425" r="11" fill="var(--accent)"/>
  <circle cx="373" cy="418" r="11" fill="var(--accent)"/>
  <circle cx="573" cy="432" r="11" fill="var(--accent)"/>
  <circle cx="773" cy="422" r="11" fill="var(--accent)"/>

  <text x="173" y="486" font-size="16" fill="var(--ink)" text-anchor="middle">Vol-control exposure</text>
  <text x="373" y="486" font-size="16" fill="var(--ink)" text-anchor="middle">CTA positioning</text>
  <text x="573" y="486" font-size="16" fill="var(--ink)" text-anchor="middle">Dealer gamma</text>
  <text x="773" y="486" font-size="16" fill="var(--ink)" text-anchor="middle">Sentiment</text>

  <text x="60" y="534" font-size="22" font-weight="700" fill="var(--ink)">Flip the inputs and the signal flips</text>
</svg>
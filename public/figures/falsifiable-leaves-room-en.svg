<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The claim in the left box covers only part and leaves blank space, while the claim in the right box fills the whole box">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
</defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">Blank space is where it can be wrong</text>
<text class="g" x="60" y="112">Says something</text>
<text class="g" x="500" y="112">Right either way</text>
<rect x="60" y="132" width="400" height="270" rx="14" fill="var(--card)" stroke="var(--line)"/>
<ellipse cx="230" cy="252" rx="130" ry="88" fill="var(--accent)" opacity="0.32"/>
<ellipse cx="230" cy="252" rx="130" ry="88" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="176" y="250">Claim covers</text>
<text class="s" x="80" y="162">Blank = where I'd admit I'm wrong</text>
<rect x="500" y="132" width="400" height="270" rx="14" fill="var(--warn)" opacity="0.28"/>
<rect x="500" y="132" width="400" height="270" rx="14" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="616" y="250">Claim covers</text>
<text class="s" x="620" y="286">No blank left</text>
<text class="s" x="60" y="432">Box = everything that could happen</text>
<text class="c" x="60" y="492">Unfalsifiable isn't safe, it's useless</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the left a flat signal-free line on a gauge leads to a verdict of stop dispatching; on the right thirteen finished blocks sit on a hard drive.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t h" x="48" y="54">The gauge measures replies, not work done</text>

  <rect x="48" y="92" width="400" height="300" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t g" x="72" y="130">Measured: replies</text>
  <line x1="72" y1="240" x2="424" y2="240" stroke="var(--grey)" stroke-width="3"/>
  <text class="t s" x="72" y="222">Flat throughout</text>
  <text class="t s" x="72" y="300">Count</text>
  <text class="t h" x="72" y="348" fill="var(--warn)">0</text>
  <rect x="160" y="316" width="240" height="46" rx="6" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
  <text class="t g" x="280" y="346" text-anchor="middle" fill="var(--warn)">Verdict: stop dispatching</text>

  <rect x="512" y="92" width="400" height="300" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t g" x="536" y="130">Unmeasured: output</text>
  <g fill="var(--accent)">
    <rect x="536" y="160" width="52" height="40" rx="4"/>
    <rect x="600" y="160" width="52" height="40" rx="4"/>
    <rect x="664" y="160" width="52" height="40" rx="4"/>
    <rect x="728" y="160" width="52" height="40" rx="4"/>
    <rect x="792" y="160" width="52" height="40" rx="4"/>
    <rect x="536" y="212" width="52" height="40" rx="4"/>
    <rect x="600" y="212" width="52" height="40" rx="4"/>
    <rect x="664" y="212" width="52" height="40" rx="4"/>
    <rect x="728" y="212" width="52" height="40" rx="4"/>
    <rect x="792" y="212" width="52" height="40" rx="4"/>
    <rect x="536" y="264" width="52" height="40" rx="4"/>
    <rect x="600" y="264" width="52" height="40" rx="4"/>
    <rect x="664" y="264" width="52" height="40" rx="4"/>
  </g>
  <text class="t h" x="536" y="348" fill="var(--accent)">13</text>
  <rect x="640" y="316" width="248" height="46" rx="6" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t g" x="764" y="346" text-anchor="middle" fill="var(--accent)">Fact: all done</text>

  <text class="t c" x="48" y="466">Judge by the disk, not by whether it spoke</text>
</svg>
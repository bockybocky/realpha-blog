<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一個怪錯誤分流進兩個大小懸殊的桶，寬的通往忽略，窄的通往調查">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">一個怪錯誤，會掉進哪個桶</text>
<rect x="400" y="118" width="160" height="52" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="432" y="152" font-size="20" fill="var(--ink)">怪錯誤</text>
<path d="M440 170 L300 236" fill="none" stroke="var(--grey)" stroke-width="10"/>
<path d="M524 170 L700 236" fill="none" stroke="var(--accent)" stroke-width="3"/>
<polygon points="120,246 480,246 400,330 200,330" fill="var(--grey)" fill-opacity="0.35" stroke="var(--grey)" stroke-width="2"/>
<text x="212" y="296" font-size="20" fill="var(--ink)">它本來就會出錯</text>
<polygon points="660,246 800,246 770,330 690,330" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="2"/>
<text x="672" y="296" font-size="16" fill="var(--ink)">這裡有問題</text>
<line x1="300" y1="330" x2="300" y2="382" stroke="var(--grey)" stroke-width="3"/>
<polygon points="300,390 292,376 308,376" fill="var(--grey)"/>
<text x="266" y="420" font-size="20" fill="var(--dim)">忽略</text>
<line x1="730" y1="330" x2="730" y2="382" stroke="var(--accent)" stroke-width="3"/>
<polygon points="730,390 722,376 738,376" fill="var(--accent)"/>
<text x="696" y="420" font-size="20" fill="var(--accent)">調查</text>
<text x="60" y="482" font-size="22" fill="var(--ink)">解釋得通，就查不下去</text>
</svg>
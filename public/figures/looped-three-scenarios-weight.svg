<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="一條橫條分成三段，中間一段最寬並用亮色，左段中等，右段最窄">
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">三種結局，重量不一樣</text>
<rect x="100" y="180" width="228" height="86" fill="var(--grey)"/>
<rect x="328" y="180" width="380" height="86" fill="var(--accent)"/>
<rect x="708" y="180" width="152" height="86" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="214" y="234" font-size="22" fill="var(--page)" text-anchor="middle">30%</text>
<text x="518" y="234" font-size="22" fill="var(--page)" text-anchor="middle">50%</text>
<text x="784" y="234" font-size="22" fill="var(--dim)" text-anchor="middle">20%</text>
<text x="214" y="302" font-size="19" fill="var(--ink)" text-anchor="middle">新的一個維度</text>
<text x="214" y="328" font-size="16" fill="var(--dim)" text-anchor="middle">跟其他 scaling law 同級</text>
<text x="518" y="302" font-size="19" fill="var(--ink)" text-anchor="middle">常見但很快撞上限</text>
<text x="518" y="328" font-size="16" fill="var(--dim)" text-anchor="middle">有用，不改變格局</text>
<text x="784" y="302" font-size="19" fill="var(--dim)" text-anchor="middle">邊緣裝置的技巧</text>
<text x="784" y="328" font-size="16" fill="var(--dim)" text-anchor="middle">退回小模型</text>
<line x1="100" y1="366" x2="860" y2="366" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="434" font-size="22" fill="var(--ink)" text-anchor="middle">他自己押的最大一塊，不是最興奮的那一塊</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左格是斷開的兩節，右格是接回起點的圓環">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">斷在那裡，還是接得回來</text>
<rect x="70" y="150" width="150" height="70" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="106" y="192" font-size="19" font-weight="700" fill="var(--dim)">研修</text>
<line x1="226" y1="185" x2="266" y2="185" stroke="var(--grey)" stroke-width="4"/>
<line x1="286" y1="160" x2="316" y2="212" stroke="var(--warn)" stroke-width="4"/>
<line x1="316" y1="160" x2="286" y2="212" stroke="var(--warn)" stroke-width="4"/>
<line x1="336" y1="185" x2="376" y2="185" stroke="var(--grey)" stroke-width="4" stroke-dasharray="7 7"/>
<rect x="382" y="150" width="150" height="70" rx="8" fill="var(--page)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text x="412" y="192" font-size="19" font-weight="700" fill="var(--grey)">育成</text>
<text x="70" y="272" font-size="19" font-weight="700" fill="var(--warn)">做完就算做完</text>
<circle cx="740" cy="240" r="120" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M740 120 l-12 -18 h24 z" fill="var(--accent)" transform="rotate(90 740 120)"/>
<rect x="676" y="98" width="128" height="46" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="712" y="128" font-size="19" font-weight="700" fill="var(--ink)">目標</text>
<rect x="800" y="290" width="128" height="46" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="836" y="320" font-size="19" font-weight="700" fill="var(--ink)">政策</text>
<rect x="552" y="290" width="128" height="46" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
<text x="588" y="320" font-size="19" font-weight="700" fill="var(--ink)">追蹤</text>
<text x="640" y="424" font-size="19" font-weight="700" fill="var(--accent)">自訂 KPI 接回起點</text>
<text x="60" y="484" font-size="22" font-weight="700" fill="var(--ink)">看它有沒有下一段</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One very long bar next to two very short bars, showing H1's gain far exceeds the industry's historical norm">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Prices "cooling" -- back to what baseline</text>
<line x1="258" y1="120" x2="258" y2="410" stroke="var(--line)" stroke-width="2"/>
<text x="240" y="176" font-size="19" text-anchor="end" fill="var(--ink)">H1 actual</text>
<rect x="260" y="146" width="620" height="56" rx="6" fill="var(--accent)"/>
<text x="866" y="182" font-size="16" text-anchor="end" fill="var(--page)">+80-100% QoQ</text>
<text x="240" y="276" font-size="19" text-anchor="end" fill="var(--ink)">H2 est.</text>
<rect x="260" y="246" width="80" height="56" rx="6" fill="var(--accent)"/>
<text x="356" y="282" font-size="16" fill="var(--ink)">+low teens QoQ</text>
<text x="240" y="376" font-size="19" text-anchor="end" fill="var(--ink)">Old "big deal"</text>
<rect x="260" y="346" width="32" height="56" rx="6" fill="var(--grey)"/>
<text x="308" y="376" font-size="16" fill="var(--ink)">+5% QoQ</text>
<text x="308" y="399" font-size="15" fill="var(--dim)">Enough to shake the whole industry</text>
<rect x="60" y="444" width="840" height="76" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="491" font-size="22" text-anchor="middle" fill="var(--ink)">Slower, not stopped</text>
</svg>
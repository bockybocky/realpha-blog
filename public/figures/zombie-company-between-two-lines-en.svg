<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="An almost flat line sits between a high horizontal ceiling and a slowly declining line along the bottom.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="40" y="58">Stuck in between</text>
<line x1="120" y1="150" x2="880" y2="150" stroke="var(--warn)" stroke-width="5"/>
<text class="g" x="120" y="132">$800M liquidation preference above</text>
<rect x="120" y="150" width="760" height="260" fill="var(--card)" opacity="0.7"/>
<polyline points="120,330 290,326 460,320 630,314 800,306 880,302" fill="none" stroke="var(--accent)" stroke-width="7"/>
<text class="g" x="620" y="286">Revenue +9%/yr</text>
<polyline points="120,392 310,400 500,408 690,416 880,424" fill="none" stroke="var(--grey)" stroke-width="6" stroke-dasharray="10 8"/>
<text class="b" x="120" y="452">Cash drains, not dying yet</text>
<line x1="500" y1="155" x2="500" y2="315" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 7"/>
<text class="b" x="512" y="214">Gap won't close this year</text>
<text class="c" x="120" y="512">He calls it a zombie</text>
</svg>
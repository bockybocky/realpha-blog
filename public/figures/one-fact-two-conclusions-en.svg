<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The same fact branches upward and downward into two opposite conclusions, and the lower one is the branch that the later numbers support.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">One fact, two exits</text>
<rect x="60" y="230" width="250" height="90" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="185" y="268" font-size="20" fill="var(--ink)" text-anchor="middle">AI finds flaws</text>
<text x="185" y="296" font-size="16" fill="var(--dim)" text-anchor="middle">Both sides agree</text>
<path d="M310 258 C 420 258 440 160 540 160" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<path d="M310 292 C 420 292 440 400 540 400" fill="none" stroke="var(--accent)" stroke-width="6"/>
<polygon points="540,152 558,160 540,168" fill="var(--grey)"/>
<polygon points="540,392 558,400 540,408" fill="var(--accent)"/>
<rect x="566" y="124" width="236" height="72" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="684" y="168" font-size="20" fill="var(--dim)" text-anchor="middle">No defenders needed</text>
<rect x="566" y="364" width="236" height="72" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="684" y="408" font-size="20" fill="var(--ink)" text-anchor="middle">Defense matters more</text>
<text x="820" y="154" font-size="16" fill="var(--dim)">Price: -25%</text>
<text x="820" y="178" font-size="16" fill="var(--dim)">When: Feb</text>
<text x="820" y="394" font-size="16" fill="var(--ink)">Line: net new ARR</text>
<text x="820" y="418" font-size="16" fill="var(--accent)">+51% YoY</text>
<text x="60" y="492" font-size="22" fill="var(--ink)">The split is not the fact; it is who fixes it</text>
</g>
</svg>
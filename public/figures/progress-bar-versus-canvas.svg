<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊四步進度條一定會動，右邊大畫布吞下雜亂檔案後反問使用者，可能做不起來">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>svg{--page:#ffffff;--card:#f6f8fc;--line:#dde3ee;--ink:#1a212b;--dim:#57616f;--grey:#b9c2d0;--accent:#1f6feb;--warn:#d97706;}@media (prefers-color-scheme: dark){svg{--page:#0d1117;--card:#161b22;--line:#272e39;--ink:#e6edf3;--dim:#8b949e;--grey:#4a5464;--accent:#58a6ff;--warn:#d29922;}}text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}</style>
<text x="60" y="58" font-size="27" font-weight="700">一定會動的，與可能做不起來的</text>
<rect x="60" y="96" width="400" height="360" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="90" y="140" font-size="20" font-weight="700" fill="var(--dim)">一定會動</text>
<rect x="90" y="236" width="76" height="26" rx="4" fill="var(--grey)"/>
<rect x="176" y="236" width="76" height="26" rx="4" fill="var(--grey)"/>
<rect x="262" y="236" width="76" height="26" rx="4" fill="var(--grey)"/>
<rect x="348" y="236" width="76" height="26" rx="4" fill="var(--grey)"/>
<text x="90" y="300" font-size="16" fill="var(--dim)">四步 · 進度條 · 彩帶</text>
<line x1="380" y1="196" x2="404" y2="172" stroke="var(--grey)" stroke-width="3"/>
<line x1="404" y1="196" x2="404" y2="166" stroke="var(--grey)" stroke-width="3"/>
<line x1="428" y1="196" x2="412" y2="174" stroke="var(--grey)" stroke-width="3"/>
<rect x="500" y="96" width="400" height="360" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="530" y="140" font-size="20" font-weight="700" fill="var(--accent)">可能做不起來</text>
<rect x="556" y="166" width="58" height="42" rx="4" fill="none" stroke="var(--grey)" stroke-width="3" transform="rotate(-12 585 187)"/>
<rect x="636" y="158" width="58" height="42" rx="4" fill="none" stroke="var(--grey)" stroke-width="3" transform="rotate(9 665 179)"/>
<rect x="716" y="172" width="58" height="42" rx="4" fill="none" stroke="var(--grey)" stroke-width="3" transform="rotate(-5 745 193)"/>
<rect x="540" y="248" width="320" height="112" rx="10" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="700" y="312" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">大畫布</text>
<path d="M585 216 L640 244" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M665 208 L690 244" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M745 216 L760 244" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text x="560" y="402" font-size="19" font-weight="700">反問你幾個問題</text>
<text x="560" y="430" font-size="16" fill="var(--dim)">然後就設定好了</text>
<text x="60" y="512" font-size="22" font-weight="700">他們選的不是方案，是允不允許失敗</text>
</svg>
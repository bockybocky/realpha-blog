<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The assets pass one way through the gate, the way back is blocked by a cross, and a five-cell bar sits below.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="48" y="62">Stables sold, one way</text>

<rect x="60" y="120" width="150" height="48" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="76" y="151">Stables</text>
<line x1="60" y1="120" x2="210" y2="168" stroke="var(--warn)" stroke-width="3"/>
<rect x="60" y="186" width="150" height="48" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="76" y="217">Garage</text>
<line x1="60" y1="186" x2="210" y2="234" stroke="var(--warn)" stroke-width="3"/>
<rect x="60" y="252" width="150" height="48" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="76" y="283">Drivers</text>
<line x1="60" y1="252" x2="210" y2="300" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="60" y="106">In-house</text>

<rect x="430" y="110" width="22" height="210" fill="var(--grey)"/>
<rect x="540" y="110" width="22" height="210" fill="var(--grey)"/>
<text class="b" x="438" y="348">Gate</text>

<line x1="230" y1="180" x2="420" y2="180" stroke="var(--accent)" stroke-width="7"/>
<line x1="462" y1="180" x2="700" y2="180" stroke="var(--accent)" stroke-width="7"/>
<polygon points="700,164 740,180 700,196" fill="var(--accent)"/>
<rect x="752" y="146" width="150" height="68" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="796" y="190">UPS</text>

<line x1="700" y1="266" x2="600" y2="266" stroke="var(--grey)" stroke-width="4" stroke-dasharray="11 8"/>
<polygon points="600,252 562,266 600,280" fill="var(--grey)"/>
<line x1="498" y1="238" x2="546" y2="294" stroke="var(--warn)" stroke-width="7"/>
<line x1="546" y1="238" x2="498" y2="294" stroke="var(--warn)" stroke-width="7"/>
<text class="b" x="612" y="300">Going back</text>

<rect x="60" y="396" width="156" height="44" fill="var(--accent)"/>
<rect x="216" y="396" width="156" height="44" fill="var(--accent)"/>
<rect x="372" y="396" width="156" height="44" fill="var(--accent)"/>
<rect x="528" y="396" width="156" height="44" fill="var(--accent)"/>
<rect x="684" y="396" width="156" height="44" fill="var(--accent)"/>
<text class="g" x="60" y="382">5 years</text>

<text class="c" x="48" y="508">Moat: no way back</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A long bar filling the whole frame stands for evolution; the bar for markets below is so short it needs an arrow to point it out">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<text class="t" x="60" y="64">100k-yr instinct, 400-yr market</text>
<text class="g" x="60" y="148">Evolution</text>
<rect x="60" y="168" width="840" height="52" fill="var(--grey)"/>
<text class="s" x="900" y="248" text-anchor="end">100,000 yrs</text>
<text class="b" x="60" y="286">Danger → run → survive</text>
<line x1="60" y1="318" x2="900" y2="318" stroke="var(--line)" stroke-width="1"/>
<text class="g" x="60" y="368">Markets</text>
<rect x="60" y="388" width="4" height="52" fill="var(--accent)"/>
<line x1="160" y1="414" x2="82" y2="414" stroke="var(--accent)" stroke-width="2"/>
<polygon points="70,414 88,406 88,422" fill="var(--accent)"/>
<text class="s a" x="172" y="420">400 yrs, just this</text>
<text class="b w" x="60" y="472">Danger → run → sell the low</text>
<text class="c" x="60" y="506">The reflex is inverted here</text>
</svg>
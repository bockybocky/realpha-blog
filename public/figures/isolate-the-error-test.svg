<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一個節點分岔成上下兩條路，兩條路通往相反的結果">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56">同一個錯，換個問法就分得出是哪一種不足</text>

  <rect x="60" y="240" width="180" height="90" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="150" y="292" text-anchor="middle">同一個錯</text>

  <path d="M240 275 C320 275 320 175 380 175" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M240 295 C320 295 320 395 380 395" fill="none" stroke="var(--accent)" stroke-width="3"/>

  <rect x="380" y="130" width="250" height="90" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="505" y="182" text-anchor="middle">夾在整份任務裡</text>
  <rect x="380" y="350" width="250" height="90" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="g" x="505" y="402" text-anchor="middle">單獨拿出來問</text>

  <path d="M630 175 L700 175" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M630 395 L700 395" fill="none" stroke="var(--accent)" stroke-width="3"/>

  <rect x="700" y="140" width="200" height="70" rx="12" fill="var(--warn)"/>
  <text class="g" x="800" y="182" text-anchor="middle" fill="var(--page)">沒抓到</text>
  <rect x="700" y="360" width="200" height="70" rx="12" fill="var(--accent)"/>
  <text class="g" x="800" y="402" text-anchor="middle" fill="var(--page)">抓到</text>

  <text class="s" x="700" y="230">預算用完</text>
  <text class="s" x="700" y="460">能力本來就在</text>

  <text class="c" x="60" y="500">單獨問看得出來，就不是能力不足</text>
</svg>
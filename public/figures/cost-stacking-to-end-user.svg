<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三根水平長條依序放大，材料極短、原廠中等、終端最長，呈現成本一路疊加放大的比例">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">一塊錢的材料，走到終端變六十塊</text>

<text x="60" y="152" font-size="20" fill="var(--dim)">材料</text>
<rect x="200" y="130" width="10" height="30" rx="3" fill="var(--grey)"/>
<text x="228" y="152" font-size="16" fill="var(--dim)">1</text>

<text x="60" y="242" font-size="20" fill="var(--dim)">原廠賣</text>
<rect x="200" y="220" width="100" height="30" rx="3" fill="var(--accent)"/>
<text x="318" y="242" font-size="16" fill="var(--dim)">10</text>

<text x="60" y="332" font-size="20" fill="var(--dim)">終端付</text>
<rect x="200" y="310" width="600" height="30" rx="3" fill="var(--warn)"/>
<text x="818" y="332" font-size="16" fill="var(--warn)">60</text>

<line x1="200" y1="372" x2="800" y2="372" stroke="var(--line)" stroke-width="2"/>
<text x="200" y="404" font-size="16" fill="var(--dim)">中間每一手再抓自己的毛利</text>

<text x="60" y="470" font-size="22" fill="var(--ink)">上游多賺一點，終端多付很多，撐不住就崩</text>
</svg>
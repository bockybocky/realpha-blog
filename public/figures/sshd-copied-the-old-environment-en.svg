<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On a timeline, the rightmost arrow points back to the old copy on the left, skipping the new settings in the middle.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); font-weight:700; }
    .ac  { font-size:19px; fill:var(--accent); font-weight:700; }
    .wn  { font-size:19px; fill:var(--warn); font-weight:700; }
    .bd  { font-size:15px; fill:var(--dim); }
    .cc  { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ttl" x="60" y="60">Pitfall 2: it copied the environment at startup</text>

<rect x="70" y="112" width="220" height="96" rx="12" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<text class="grp" x="180" y="152" text-anchor="middle">Environment copy</text>
<text class="bd" x="180" y="180" text-anchor="middle">Old. No new path</text>

<rect x="400" y="112" width="220" height="96" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="ac" x="510" y="152" text-anchor="middle">New settings</text>
<text class="bd" x="510" y="180" text-anchor="middle">Fixed. Sitting on disk</text>

<line x1="70" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="3"/>
<circle cx="180" cy="300" r="8" fill="var(--grey)"/>
<circle cx="510" cy="300" r="8" fill="var(--accent)"/>
<circle cx="800" cy="300" r="8" fill="var(--warn)"/>
<line x1="180" y1="208" x2="180" y2="292" stroke="var(--grey)" stroke-width="3"/>
<line x1="510" y1="208" x2="510" y2="292" stroke="var(--accent)" stroke-width="3"/>
<text class="bd" x="180" y="334">sshd starts</text>
<text class="bd" x="510" y="334" text-anchor="middle">You edit settings</text>
<text class="bd" x="800" y="334" text-anchor="middle">Phone connects</text>

<polyline points="800,352 800,410 180,410 180,320" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="wn" x="490" y="440" text-anchor="middle">This is the copy it reads</text>

<text class="cc" x="480" y="512" text-anchor="middle">Restart it, and it copies again</text>
</svg>
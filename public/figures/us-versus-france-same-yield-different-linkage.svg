<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左格兩個箭頭同時朝上，右格一個朝上兩個朝下">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="48" y="54" font-size="27" font-weight="700" fill="var(--ink)">殖利率同樣創高，兩邊的連動不同</text>
<rect x="48" y="92" width="416" height="340" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="496" y="92" width="416" height="340" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="72" y="130" font-size="20" font-weight="700" fill="var(--ink)">美國</text>
<text x="520" y="130" font-size="20" font-weight="700" fill="var(--ink)">法國</text>
<line x1="120" y1="380" x2="120" y2="210" stroke="var(--accent)" stroke-width="6"/>
<polygon points="120,186 104,216 136,216" fill="var(--accent)"/>
<text x="92" y="410" font-size="16" fill="var(--dim)">殖利率</text>
<line x1="280" y1="380" x2="280" y2="230" stroke="var(--accent)" stroke-width="6"/>
<polygon points="280,206 264,236 296,236" fill="var(--accent)"/>
<text x="254" y="410" font-size="16" fill="var(--dim)">股市</text>
<line x1="560" y1="380" x2="560" y2="200" stroke="var(--accent)" stroke-width="6"/>
<polygon points="560,176 544,206 576,206" fill="var(--accent)"/>
<text x="532" y="410" font-size="16" fill="var(--dim)">殖利率</text>
<line x1="700" y1="200" x2="700" y2="350" stroke="var(--warn)" stroke-width="6"/>
<polygon points="700,374 684,344 716,344" fill="var(--warn)"/>
<text x="680" y="188" font-size="16" fill="var(--dim)">歐元</text>
<line x1="830" y1="200" x2="830" y2="350" stroke="var(--warn)" stroke-width="6"/>
<polygon points="830,374 814,344 846,344" fill="var(--warn)"/>
<text x="810" y="188" font-size="16" fill="var(--dim)">歐股</text>
<text x="48" y="492" font-size="22" font-weight="700" fill="var(--ink)">方向不一致，就是驅動力不同</text>
</g>
</svg>
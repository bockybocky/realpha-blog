<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" width="960" height="545" role="img" aria-label="A group of people is hurting at each end of a U-shaped curve, and a point moves along an arrow from the shortage end toward the glut end.">
<rect x="0" y="0" width="960" height="545" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="44" text-anchor="middle">Different people hurt at each end</text>
<text class="b" x="112" y="140" text-anchor="end">Pain</text>
<path d="M140,130 Q480,580 820,130" fill="none" stroke="var(--ink)" stroke-width="3"/>
<circle cx="140" cy="130" r="9" fill="var(--warn)"/>
<circle cx="820" cy="130" r="9" fill="var(--warn)"/>
<path d="M740,180 Q480,70 226,178" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 6"/>
<polygon points="222,180 237.6,180.9 232.2,168.1" fill="var(--accent)"/>
<text class="g" x="480" y="110" text-anchor="middle" fill="var(--accent)">Flip?</text>
<circle cx="760" cy="202" r="10" fill="var(--accent)"/>
<text class="g" x="782" y="209">2026</text>
<circle cx="200" cy="202" r="10" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="180" y="209" text-anchor="end">H2 2027?</text>
<line x1="110" y1="400" x2="850" y2="400" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="140" y="428">Cheap / glut</text>
<text class="b" x="820" y="428" text-anchor="end">Pricey / shortage</text>
<text class="g" x="200" y="475" text-anchor="middle">Farmers</text>
<text class="b" x="480" y="475" text-anchor="middle">Warring States grain</text>
<text class="g" x="760" y="475" text-anchor="middle">Commoners</text>
<text class="g" x="200" y="518" text-anchor="middle">Landlords</text>
<text class="b" x="480" y="518" text-anchor="middle">Compute</text>
<text class="g" x="760" y="518" text-anchor="middle">Startups</text>
</svg>
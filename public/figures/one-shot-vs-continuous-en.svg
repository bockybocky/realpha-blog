<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The upper chart shows a single spike that falls to zero, and the lower chart shows a curve that rises to a plateau and stays there.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="58" font-size="27" fill="var(--ink)">One burst versus lasting output</text>

<rect x="60" y="92" width="840" height="190" rx="12" fill="var(--card)"/>
<line x1="100" y1="252" x2="880" y2="252" stroke="var(--line)" stroke-width="2"/>
<path d="M100,252 L300,252 L330,124 L360,252 L880,252" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text x="92" y="122" font-size="20" fill="var(--warn)">Jump car</text>
<text x="336" y="116" font-size="16" fill="var(--ink)">One tank, once</text>
<text x="420" y="240" font-size="16" fill="var(--dim)">Zero after that</text>

<rect x="60" y="300" width="840" height="190" rx="12" fill="var(--card)"/>
<line x1="100" y1="460" x2="880" y2="460" stroke="var(--line)" stroke-width="2"/>
<path d="M100,460 L240,352 L880,352" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text x="92" y="334" font-size="20" fill="var(--accent)">Helicopter</text>
<text x="700" y="340" font-size="16" fill="var(--ink)">Sustained output</text>
<text x="700" y="434" font-size="16" fill="var(--dim)">Airspace permit</text>
<text x="100" y="516" font-size="16" fill="var(--dim)">Time</text>
</g>
</svg>
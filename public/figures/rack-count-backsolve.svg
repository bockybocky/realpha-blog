<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="右邊的柱子約為左邊的兩倍高，旁邊註明算法是營收除以單櫃價格">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">傳言查不了，除法可以算</text>

<line x1="150" y1="452" x2="820" y2="452" stroke="var(--line)" stroke-width="2"/>

<rect x="230" y="310" width="150" height="142" rx="6" fill="var(--grey)"/>
<text class="t" x="305" y="292" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">約 1,250 櫃</text>
<text class="t" x="305" y="484" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">上一代</text>
<text class="t" x="305" y="510" font-size="16" fill="var(--dim)" text-anchor="middle">剛量產那一季</text>

<rect x="590" y="110" width="150" height="342" rx="6" fill="var(--accent)"/>
<text class="t" x="665" y="92" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">約 3,000 櫃</text>
<text class="t" x="665" y="484" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">這一代</text>
<text class="t" x="665" y="510" font-size="16" fill="var(--dim)" text-anchor="middle">第三季</text>

<rect x="60" y="120" width="130" height="118" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="125" y="156" font-size="16" fill="var(--dim)" text-anchor="middle">算法</text>
<text class="t" x="125" y="186" font-size="16" fill="var(--ink)" text-anchor="middle">約 200 億</text>
<text class="t" x="125" y="212" font-size="16" fill="var(--dim)" text-anchor="middle">÷ 單櫃價</text>
</svg>
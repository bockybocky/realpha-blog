<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="兩條箭頭鏈對比：常見順序是先研究後買進，他的順序是先買進再研究再對答案">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="460" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">先射箭再畫靶：差別只在順序</text>
<text x="60" y="130" font-size="20" fill="var(--dim)">常見順序</text>
<rect x="200" y="106" width="170" height="56" fill="var(--card)"/>
<text x="250" y="142" font-size="16" fill="var(--ink)">研究</text>
<path d="M 380 134 L 430 134" stroke="var(--grey)" stroke-width="3"/>
<path d="M 430 128 L 442 134 L 430 140 Z" fill="var(--grey)"/>
<rect x="452" y="106" width="170" height="56" fill="var(--card)"/>
<text x="502" y="142" font-size="16" fill="var(--ink)">買進</text>
<line x1="60" y1="200" x2="900" y2="200" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="262" font-size="20" fill="var(--accent)">他的順序</text>
<rect x="200" y="238" width="170" height="56" fill="var(--accent)" opacity="0.18"/>
<text x="250" y="274" font-size="16" fill="var(--ink)">買進</text>
<path d="M 380 266 L 430 266" stroke="var(--accent)" stroke-width="3"/>
<path d="M 430 260 L 442 266 L 430 272 Z" fill="var(--accent)"/>
<rect x="452" y="238" width="170" height="56" fill="var(--accent)" opacity="0.18"/>
<text x="502" y="274" font-size="16" fill="var(--ink)">研究</text>
<path d="M 632 266 L 682 266" stroke="var(--accent)" stroke-width="3"/>
<path d="M 682 260 L 694 266 L 682 272 Z" fill="var(--accent)"/>
<rect x="704" y="238" width="170" height="56" fill="var(--accent)" opacity="0.18"/>
<text x="744" y="274" font-size="16" fill="var(--ink)">找人對答案</text>
<text x="60" y="360" font-size="22" fill="var(--ink)">用部位換速度</text>
<text x="60" y="396" font-size="15" fill="var(--dim)">保守版：用小到不影響心情的錢換研究動機，期限內要交出對答案的筆記</text>
</svg>
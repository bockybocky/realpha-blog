<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Two opposite lines from one point: the ledger rises with raised capex, sold-out capacity and prepayments, while price falls on indiscriminate deleveraging and a beat that still sold off.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">One week: price down, ledger up</text>

  <line x1="200" y1="300" x2="690" y2="180" stroke="var(--accent)" stroke-width="4"/>
  <polygon points="700,177.6 686.1,188.2 682.7,174.6" fill="var(--accent)"/>
  <line x1="200" y1="300" x2="690" y2="420" stroke="var(--warn)" stroke-width="4"/>
  <polygon points="700,422.4 682.7,425.4 686.1,411.8" fill="var(--warn)"/>
  <circle cx="200" cy="300" r="9" fill="var(--ink)"/>
  <text class="t" x="185" y="306" font-size="16" text-anchor="end" fill="var(--dim)">That week in late July</text>

  <text class="t" x="710" y="170" font-size="20" font-weight="700" fill="var(--accent)">Ledger</text>
  <text class="t" x="710" y="202" font-size="16" fill="var(--ink)">All four raised capex guidance</text>
  <text class="t" x="710" y="230" font-size="16" fill="var(--ink)">2027 capacity sold out</text>
  <text class="t" x="710" y="258" font-size="16" fill="var(--ink)">Prepaying to reserve capacity</text>

  <text class="t" x="710" y="410" font-size="20" font-weight="700" fill="var(--warn)">Price</text>
  <text class="t" x="710" y="442" font-size="16" fill="var(--ink)">Indiscriminate deleveraging</text>
  <text class="t" x="710" y="470" font-size="16" fill="var(--ink)">High beta hit first</text>
  <text class="t" x="710" y="498" font-size="16" fill="var(--ink)">Reddit -22.6% on a beat</text>

  <line x1="60" y1="536" x2="900" y2="536" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="60" y="574" font-size="22" font-weight="700" fill="var(--ink)">What was sold was positions, not that company</text>
</svg>
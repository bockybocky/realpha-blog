<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Performance across six tasks is drawn as a violently jagged line, contrasted with a smooth dashed line for the overall impression.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="58" font-size="27" fill="var(--ink)">The edge of capability is jagged</text>
<line x1="110" y1="440" x2="920" y2="440" stroke="var(--line)" stroke-width="2"/>
<polyline points="110,440 110,120" fill="none" stroke="var(--line)" stroke-width="2"/>
<text x="88" y="280" font-size="19" fill="var(--dim)" text-anchor="middle" transform="rotate(-90 88 280)">Performance</text>
<polygon points="160,150 290,400 420,175 550,390 680,160 810,405 810,440 160,440" fill="var(--accent)" opacity="0.12"/>
<polyline points="160,150 290,400 420,175 550,390 680,160 810,405" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
<circle cx="160" cy="150" r="7" fill="var(--accent)"/>
<circle cx="290" cy="400" r="7" fill="var(--accent)"/>
<circle cx="420" cy="175" r="7" fill="var(--accent)"/>
<circle cx="550" cy="390" r="7" fill="var(--accent)"/>
<circle cx="680" cy="160" r="7" fill="var(--accent)"/>
<circle cx="810" cy="405" r="7" fill="var(--accent)"/>
<line x1="150" y1="272" x2="880" y2="272" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="880" y="262" font-size="16" fill="var(--dim)" text-anchor="end">Overall impression</text>
<text x="160" y="478" font-size="16" fill="var(--dim)" text-anchor="middle">Coding</text>
<text x="290" y="503" font-size="16" fill="var(--dim)" text-anchor="middle">Edge cases</text>
<text x="420" y="478" font-size="16" fill="var(--dim)" text-anchor="middle">Math proofs</text>
<text x="550" y="503" font-size="16" fill="var(--dim)" text-anchor="middle">Off the beaten path</text>
<text x="680" y="478" font-size="16" fill="var(--dim)" text-anchor="middle">Finding holes</text>
<text x="810" y="503" font-size="16" fill="var(--dim)" text-anchor="middle">Obscure fields</text>
</g>
</svg>
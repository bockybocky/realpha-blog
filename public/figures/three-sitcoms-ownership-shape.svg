<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三齣戲並排，兩齣是連成一塊的持有結構、一齣被切開成兩塊">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
    .h { font-size:16px; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="80" y="68">連成一塊，還是被切開</text>
<text class="h" x="300" y="112">版權</text>
<text class="h" x="560" y="112">發行權</text>
<text class="h" x="790" y="112">結果</text>
<text class="g" x="80" y="172">六人行</text>
<rect x="260" y="140" width="420" height="52" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="300" y="174">同一家</text>
<text class="b" x="760" y="174">內部收回</text>
<text class="g" x="80" y="262">辦公室</text>
<rect x="260" y="230" width="420" height="52" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="300" y="264">同一家</text>
<text class="b" x="760" y="264">內部收回</text>
<text class="g" x="80" y="352" fill="var(--warn)">單身派對</text>
<rect x="260" y="320" width="180" height="52" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<rect x="500" y="320" width="180" height="52" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="290" y="354">一家</text>
<text class="b" x="530" y="354">另一家</text>
<text class="b" x="760" y="354" fill="var(--warn)">對外競價</text>
<text class="c" x="80" y="464">被切開的那一齣，是唯一賣得出價格的</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="零軸左側法國長條很長，右側日本短條，顯示 r 減 g 的正負差別">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
 svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
       --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
 @media (prefers-color-scheme: dark) {
   svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
         --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
 }
 text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
 .h{font-size:27px;font-weight:700}
 .g{font-size:19px;fill:var(--dim)}
 .b{font-size:16px;fill:var(--dim)}
 .c{font-size:22px;font-weight:700}
</style>
<text class="h" x="60" y="56">要看的那一格：成長率減不減得掉利息</text>
<text class="g" x="60" y="110">r 減 g ＝ 借債成本 − 成長率</text>
<line x1="480" y1="150" x2="480" y2="400" stroke="var(--dim)" stroke-width="3"/>
<text class="b" x="466" y="430">0</text>
<rect x="150" y="190" width="330" height="60" fill="var(--warn)"/>
<text class="g" x="170" y="228" fill="var(--page)">法國</text>
<rect x="480" y="300" width="110" height="60" fill="var(--accent)"/>
<text class="g" x="606" y="338">日本</text>
<text class="b" x="150" y="172">缺口最負：利息跑在成長前面</text>
<text class="b" x="606" y="384">正的：債務會自己縮</text>
<text class="c" x="60" y="486">同樣一份債務清單，差別在這一個減號</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="長年待在零線以下的幾條線，其中一條近年往上穿過零線並繼續走高，與其他線拉開距離">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">極化的讀數翻正了</text>

<rect x="60" y="104" width="840" height="336" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

<line x1="100" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="3"/>
<text class="t" x="88" y="294" font-size="16" fill="var(--dim)" text-anchor="end">0</text>
<text class="t" x="88" y="160" font-size="16" fill="var(--dim)" text-anchor="end">＋</text>
<text class="t" x="88" y="416" font-size="16" fill="var(--dim)" text-anchor="end">－</text>
<text class="t" x="108" y="426" font-size="16" fill="var(--dim)">1990 年代</text>
<text class="t" x="872" y="426" font-size="16" fill="var(--dim)" text-anchor="end">現在</text>

<path d="M120 386 L300 390 L500 384 L700 388 L860 386" fill="none" stroke="var(--grey)" stroke-width="4"/>
<text class="t" x="866" y="378" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="end">歐洲・加拿大</text>

<path d="M120 336 L280 330 L420 316 L560 296 L680 240 L780 190 L860 176" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linejoin="round"/>
<circle cx="600" cy="284" r="7" fill="var(--warn)"/>
<text class="t" x="600" y="268" font-size="16" fill="var(--warn)" text-anchor="middle">翻正</text>
<text class="t" x="866" y="166" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="end">美國</text>

<text class="t" x="480" y="500" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">同一條溫度計，只有一條線走出去了</text>
</svg>
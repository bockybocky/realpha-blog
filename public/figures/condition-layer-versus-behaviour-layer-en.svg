<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A dashed box on the left holds hollow squares for unpredictable conditions, and a solid box on the right holds filled squares for observable behavior">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .t{font-size:27px;fill:var(--ink);font-weight:700}
    .g{font-size:20px;font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">A bet has two layers</text>
<text class="b" x="60" y="88">Half of it he admits he can't know</text>
<rect x="60" y="126" width="390" height="292" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
<text class="g" x="88" y="170" fill="var(--dim)">Unpredictable</text>
<text class="b" x="88" y="198">A condition only</text>
<rect x="90" y="228" width="20" height="20" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 4"/>
<text class="b" x="126" y="245">Law changes?</text>
<rect x="90" y="288" width="20" height="20" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 4"/>
<text class="b" x="126" y="305">Subsidy timing?</text>
<rect x="90" y="348" width="20" height="20" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 4"/>
<text class="b" x="126" y="365">Big client says yes?</text>
<line x1="480" y1="126" x2="480" y2="418" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>
<rect x="510" y="126" width="390" height="292" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="538" y="170" fill="var(--accent)">Observable</text>
<text class="b" x="538" y="198">A reason</text>
<rect x="540" y="228" width="20" height="20" fill="var(--accent)"/>
<text class="b" x="576" y="245">Office workload</text>
<rect x="540" y="288" width="20" height="20" fill="var(--accent)"/>
<text class="b" x="576" y="305">Docks set early</text>
<rect x="540" y="348" width="20" height="20" fill="var(--accent)"/>
<text class="b" x="576" y="365">Peers set rules</text>
<text class="c" x="60" y="486">Conditions frame, reasons verify</text>
</svg>
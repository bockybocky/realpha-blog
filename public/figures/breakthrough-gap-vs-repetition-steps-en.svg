<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Left: a chasm with no intermediate state. Right: a row of countable stepping stones that show how far along you are.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="56">Missing a new insight, or missing twenty repetitions</text>

  <rect x="60" y="96" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="96" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="80" y="134" fill="var(--warn)">Waiting on a breakthrough</text>
  <text class="g" x="520" y="134" fill="var(--accent)">Doing it many times</text>

  <rect x="86" y="290" width="110" height="80" fill="var(--grey)"/>
  <rect x="330" y="230" width="110" height="140" fill="var(--grey)"/>
  <text class="s" x="141" y="392" text-anchor="middle">Now</text>
  <text class="s" x="385" y="392" text-anchor="middle">Done</text>
  <path d="M196,290 C240,240 290,250 330,230" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 8"/>
  <text class="b" x="263" y="196" text-anchor="middle">No middle ground</text>
  <text class="b" x="263" y="224" text-anchor="middle">No idea how far</text>

  <rect x="526" y="352" width="60" height="20" fill="var(--accent)"/>
  <rect x="596" y="322" width="60" height="20" fill="var(--accent)"/>
  <rect x="666" y="292" width="60" height="20" fill="var(--accent)"/>
  <rect x="736" y="262" width="60" height="20" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="806" y="232" width="60" height="20" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>
  <text class="s" x="556" y="392" text-anchor="middle">1</text>
  <text class="s" x="626" y="392" text-anchor="middle">2</text>
  <text class="s" x="696" y="392" text-anchor="middle">3</text>
  <text class="s" x="766" y="392" text-anchor="middle">4</text>
  <text class="s" x="836" y="392" text-anchor="middle">5</text>
  <text class="b" x="700" y="190" text-anchor="middle">You can see which step you are on</text>
  <text class="b" x="700" y="218" text-anchor="middle">Stuck means stuck at a known step</text>

  <text class="c" x="60" y="490">The difference is not difficulty; it is whether you can name the next step</text>
</svg>
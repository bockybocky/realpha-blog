<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊淺而滿的池子是輔助服務，右邊深得多的池子是能源市場，箭頭把收入從淺池搬到深池">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <text class="t" x="60" y="60" font-size="27" font-weight="700" fill="var(--ink)">淺池子滿了，收入搬進深池子</text>

  <rect x="110" y="330" width="280" height="110" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="110" y="330" width="280" height="110" rx="6" fill="var(--grey)" opacity="0.65"/>
  <text class="t" x="250" y="310" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">輔助服務</text>
  <text class="t" x="250" y="394" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">已飽和</text>
  <text class="t" x="250" y="474" font-size="16" text-anchor="middle" fill="var(--dim)">2022–23・九成收入</text>

  <rect x="570" y="150" width="280" height="290" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="570" y="300" width="280" height="140" rx="6" fill="var(--accent)" opacity="0.8"/>
  <text class="t" x="710" y="130" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">能源市場・套利</text>
  <text class="t" x="710" y="242" font-size="16" text-anchor="middle" fill="var(--dim)">尖峰負載 六十到八十 GW</text>
  <text class="t" x="710" y="474" font-size="16" text-anchor="middle" fill="var(--dim)">今天・八成收入</text>

  <path d="M400 360 C 470 360 500 270 560 270" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#ar2)"/>
  <text class="t" x="480" y="248" font-size="19" text-anchor="middle" fill="var(--accent)">溢出</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The left panel shows a wide lane with light traffic, the right a narrow alley crowded with scooters, where the assistance kit is marked standard">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:600;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:600;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="66">Same technology, two road conditions</text>
<rect x="60" y="100" width="390" height="330" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="255" y="142" text-anchor="middle">Wide road, light traffic</text>
<rect x="185" y="165" width="140" height="230" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<line x1="255" y1="175" x2="255" y2="385" stroke="var(--grey)" stroke-width="2" stroke-dasharray="10 12"/>
<rect x="203" y="200" width="42" height="66" rx="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="265" y="300" width="42" height="66" rx="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="255" y="418" text-anchor="middle">Assistance = optional</text>
<rect x="510" y="100" width="390" height="330" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="705" y="142" text-anchor="middle">Narrow alley, scooters all around</text>
<rect x="655" y="165" width="100" height="230" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<rect x="682" y="248" width="46" height="72" rx="8" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="666" cy="192" r="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="702" cy="208" r="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="742" cy="188" r="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="668" cy="232" r="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="744" cy="238" r="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="666" cy="300" r="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="746" cy="298" r="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="690" cy="348" r="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="732" cy="360" r="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="706" cy="386" r="8" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="705" y="418" text-anchor="middle" fill="var(--accent)">Assistance = standard</text>
<text class="c" x="480" y="492" text-anchor="middle">The standard list was forced into being by the alleys</text>
</svg>
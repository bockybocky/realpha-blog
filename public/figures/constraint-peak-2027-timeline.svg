<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="限制緊度隨時間先升後降的曲線，最高點落在二〇二七年">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t  { font-size:27px; font-weight:700; fill:var(--ink); }
.g  { font-size:19px; font-weight:600; fill:var(--ink); }
.gd { font-size:19px; font-weight:600; fill:var(--dim); }
.gw { font-size:19px; font-weight:600; fill:var(--warn); }
.b  { font-size:16px; fill:var(--dim); }
.c  { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="64">限制的高點落在 2027</text>
<line x1="100" y1="130" x2="100" y2="440" stroke="var(--line)" stroke-width="2"/>
<polygon points="100,120 94,134 106,134" fill="var(--line)"/>
<line x1="100" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="112" y="146">限制的緊度</text>
<path d="M140,340 C 260,300 400,205 500,178 C 620,212 760,330 860,392" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="140" cy="340" r="7" fill="var(--accent)"/>
<circle cx="500" cy="178" r="8" fill="var(--warn)"/>
<circle cx="700" cy="288" r="7" fill="var(--accent)"/>
<text class="gd" x="118" y="300">拿到長約，動土</text>
<text class="gw" x="430" y="152">2027 限制最緊</text>
<text class="gd" x="716" y="272">綠地產能上線</text>
<line x1="140" y1="430" x2="140" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="320" y1="430" x2="320" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="500" y1="430" x2="500" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="680" y1="430" x2="680" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="860" y1="430" x2="860" y2="450" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="112" y="476">2025 末</text>
<text class="b" x="296" y="476">2026</text>
<text class="b" x="476" y="476">2027</text>
<text class="b" x="656" y="476">2028</text>
<text class="b" x="836" y="476">2029</text>
<text class="c" x="60" y="524">鬆綁不是決定，是時間表</text>
</svg>
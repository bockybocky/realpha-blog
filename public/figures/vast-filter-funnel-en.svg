<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Adding a static IP requirement shrinks the eligible pool from a long bar of 343 machines to a short bar of 39, and lifts the floor price from $0.163 to $0.201 per hour.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70">One more filter, nearly 90% gone</text>

<text class="g" x="60" y="140">All machines</text>
<rect x="60" y="158" width="760" height="56" rx="6" fill="var(--grey)" opacity="0.45"/>
<text class="g" x="80" y="195" fill="var(--ink)">343 units</text>
<text class="n" x="836" y="195">From $0.163/hr</text>

<text class="g" x="60" y="268">Static IP required</text>
<rect x="60" y="286" width="86" height="56" rx="6" fill="var(--accent)"/>
<text class="g" x="162" y="323">39 units</text>
<text class="n" x="836" y="323">From $0.201/hr</text>

<rect x="60" y="392" width="420" height="78" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="n" x="82" y="424">Real data centers in market</text>
<text class="c" x="82" y="456">25 units, about 7%</text>

<text class="c" x="520" y="430">Stricter filters, pricier leftovers</text>
<text class="n" x="520" y="458">Cheap because not a data center</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩個方塊之間有兩條方向相反的箭頭，形成互相牽動的迴圈">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs>
<marker id="gg1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
</defs>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">DRAM 與 NAND 為什麼一起緊</text>
<rect x="80" y="130" width="320" height="200" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="104" y="180" font-size="20" font-weight="700" fill="var(--ink)">DRAM</text>
<text x="104" y="216" font-size="16" fill="var(--dim)">更缺、利潤更好</text>
<rect x="560" y="130" width="320" height="200" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="584" y="180" font-size="20" font-weight="700" fill="var(--ink)">NAND</text>
<text x="584" y="216" font-size="16" fill="var(--dim)">供給成長 21～25%</text>
<text x="584" y="242" font-size="15" fill="var(--dim)">＝歷史平均，沒有暴衝</text>
<path d="M552 200 L410 200" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#gg1)"/>
<text x="480" y="182" font-size="16" text-anchor="middle" fill="var(--ink)">資本支出</text>
<path d="M408 268 L550 268" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#gg1)"/>
<text x="480" y="300" font-size="16" text-anchor="middle" fill="var(--ink)">KV cache 需求</text>
<rect x="60" y="384" width="840" height="76" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="431" font-size="22" text-anchor="middle" fill="var(--ink)">DRAM 不鬆，NAND 就鬆不了</text>
</svg>
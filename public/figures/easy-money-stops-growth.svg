<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一條粗管直接灌進容器、旁邊三個分支是空虛線框；右邊沒有粗管但三個分支都長成實心枝幹">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">水龍頭開著，就不必長別的</text>

<text class="t" x="60" y="124" font-size="19" font-weight="700" fill="var(--warn)">有礦</text>
<rect x="60" y="150" width="150" height="54" rx="8" fill="var(--warn)" opacity="0.2"/>
<rect x="60" y="150" width="150" height="54" rx="8" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="98" y="185" font-size="19" fill="var(--ink)">銀山</text>
<rect x="134" y="204" width="20" height="96" fill="var(--warn)" opacity="0.5"/>
<rect x="60" y="300" width="330" height="70" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="98" y="343" font-size="19" fill="var(--ink)">國庫</text>
<g stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5" fill="none">
<rect x="60" y="400" width="96" height="56" rx="8"/>
<rect x="177" y="400" width="96" height="56" rx="8"/>
<rect x="294" y="400" width="96" height="56" rx="8"/>
</g>
<text class="t" x="60" y="492" font-size="16" fill="var(--dim)">銀行、貿易、工業：沒長出來</text>

<line x1="480" y1="140" x2="480" y2="500" stroke="var(--line)" stroke-width="2"/>

<text class="t" x="560" y="124" font-size="19" font-weight="700" fill="var(--accent)">沒礦</text>
<rect x="560" y="150" width="150" height="54" rx="8" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<text class="t" x="598" y="185" font-size="19" fill="var(--grey)">沒有</text>
<rect x="560" y="300" width="340" height="70" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="598" y="343" font-size="19" fill="var(--ink)">只能自己賺</text>
<g fill="var(--accent)" opacity="0.18">
<rect x="560" y="400" width="100" height="56" rx="8"/>
<rect x="680" y="400" width="100" height="56" rx="8"/>
<rect x="800" y="400" width="100" height="56" rx="8"/>
</g>
<g fill="none" stroke="var(--accent)" stroke-width="2">
<rect x="560" y="400" width="100" height="56" rx="8"/>
<rect x="680" y="400" width="100" height="56" rx="8"/>
<rect x="800" y="400" width="100" height="56" rx="8"/>
</g>
<text class="t" x="584" y="435" font-size="16" fill="var(--ink)">銀行</text>
<text class="t" x="704" y="435" font-size="16" fill="var(--ink)">貿易</text>
<text class="t" x="824" y="435" font-size="16" fill="var(--ink)">工業</text>
<text class="t" x="560" y="492" font-size="16" fill="var(--dim)">被逼著長出來</text>

<text class="t" x="60" y="536" font-size="22" fill="var(--ink)">現金從哪來，決定它還學不學東西</text>
</svg>
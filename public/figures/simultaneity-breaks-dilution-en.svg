<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Scattered disaster markers total only small bumps, while markers aligned at one moment total a single tall bar." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="60" y="56" font-size="27" fill="var(--ink)">Staggered gets diluted; aligned does not</text>

  <rect x="60" y="90" width="390" height="400" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="76" y="126" font-size="19" fill="var(--ink)">Normally</text>
  <text x="76" y="176" font-size="15" fill="var(--dim)">Wheat</text>
  <text x="76" y="216" font-size="15" fill="var(--dim)">Cotton</text>
  <text x="76" y="256" font-size="15" fill="var(--dim)">Mines</text>
  <text x="76" y="296" font-size="15" fill="var(--dim)">Power</text>
  <line x1="150" y1="170" x2="430" y2="170" stroke="var(--line)" stroke-width="2"/>
  <line x1="150" y1="210" x2="430" y2="210" stroke="var(--line)" stroke-width="2"/>
  <line x1="150" y1="250" x2="430" y2="250" stroke="var(--line)" stroke-width="2"/>
  <line x1="150" y1="290" x2="430" y2="290" stroke="var(--line)" stroke-width="2"/>
  <rect x="172" y="162" width="16" height="16" rx="3" fill="var(--warn)"/>
  <rect x="292" y="202" width="16" height="16" rx="3" fill="var(--warn)"/>
  <rect x="232" y="242" width="16" height="16" rx="3" fill="var(--warn)"/>
  <rect x="392" y="282" width="16" height="16" rx="3" fill="var(--warn)"/>
  <line x1="150" y1="330" x2="430" y2="330" stroke="var(--line)" stroke-width="2"/>
  <text x="430" y="352" font-size="15" fill="var(--dim)" text-anchor="end">Time</text>
  <rect x="170" y="416" width="20" height="24" fill="var(--accent)"/>
  <rect x="290" y="416" width="20" height="24" fill="var(--accent)"/>
  <rect x="230" y="416" width="20" height="24" fill="var(--accent)"/>
  <rect x="390" y="416" width="20" height="24" fill="var(--accent)"/>
  <line x1="150" y1="440" x2="430" y2="440" stroke="var(--dim)" stroke-width="2"/>
  <text x="290" y="470" font-size="15" fill="var(--dim)" text-anchor="middle">Total shock</text>

  <rect x="510" y="90" width="390" height="400" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="526" y="126" font-size="19" fill="var(--ink)">El Nino</text>
  <text x="526" y="176" font-size="15" fill="var(--dim)">Wheat</text>
  <text x="526" y="216" font-size="15" fill="var(--dim)">Cotton</text>
  <text x="526" y="256" font-size="15" fill="var(--dim)">Mines</text>
  <text x="526" y="296" font-size="15" fill="var(--dim)">Power</text>
  <line x1="600" y1="170" x2="880" y2="170" stroke="var(--line)" stroke-width="2"/>
  <line x1="600" y1="210" x2="880" y2="210" stroke="var(--line)" stroke-width="2"/>
  <line x1="600" y1="250" x2="880" y2="250" stroke="var(--line)" stroke-width="2"/>
  <line x1="600" y1="290" x2="880" y2="290" stroke="var(--line)" stroke-width="2"/>
  <rect x="692" y="162" width="16" height="16" rx="3" fill="var(--warn)"/>
  <rect x="692" y="202" width="16" height="16" rx="3" fill="var(--warn)"/>
  <rect x="692" y="242" width="16" height="16" rx="3" fill="var(--warn)"/>
  <rect x="692" y="282" width="16" height="16" rx="3" fill="var(--warn)"/>
  <line x1="600" y1="330" x2="880" y2="330" stroke="var(--line)" stroke-width="2"/>
  <text x="880" y="352" font-size="15" fill="var(--dim)" text-anchor="end">Time</text>
  <rect x="690" y="344" width="20" height="96" fill="var(--accent)"/>
  <line x1="600" y1="440" x2="880" y2="440" stroke="var(--dim)" stroke-width="2"/>
  <text x="740" y="470" font-size="15" fill="var(--dim)" text-anchor="middle">Total shock</text>

  <text x="60" y="542" font-size="22" fill="var(--ink)">It gets expensive when they all hit the same day</text>
</svg>
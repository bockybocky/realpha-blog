<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊押單一技術只有一條岔路通，另一條斷頭；右邊賣鏟子的位置兩條岔路都通" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">兩條岔路，誰都還通</text>
<text x="250" y="122" font-size="20" fill="var(--dim)" text-anchor="middle">押單一技術</text>
<rect x="80" y="160" width="150" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="155" y="194" font-size="15" fill="var(--ink)" text-anchor="middle">HBF 成了</text>
<line x1="235" y1="187" x2="300" y2="187" stroke="var(--ink)" stroke-width="2"/>
<polygon points="300,181 314,187 300,193" fill="var(--ink)"/>
<rect x="320" y="160" width="130" height="54" rx="8" fill="var(--accent)"/>
<text x="385" y="194" font-size="15" fill="var(--page)" text-anchor="middle">有生意</text>
<rect x="80" y="300" width="150" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="155" y="334" font-size="15" fill="var(--ink)" text-anchor="middle">HBF 沒成</text>
<line x1="235" y1="327" x2="330" y2="327" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 7"/>
<line x1="336" y1="298" x2="336" y2="356" stroke="var(--warn)" stroke-width="4"/>
<text x="356" y="333" font-size="15" fill="var(--warn)">沒了</text>
<line x1="490" y1="130" x2="490" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="700" y="122" font-size="20" fill="var(--accent)" text-anchor="middle">量測檢測的位置</text>
<rect x="520" y="160" width="180" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="610" y="194" font-size="15" fill="var(--ink)" text-anchor="middle">HBF 成了</text>
<rect x="520" y="300" width="180" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="610" y="334" font-size="15" fill="var(--ink)" text-anchor="middle">換別的封裝難題</text>
<line x1="705" y1="187" x2="770" y2="230" stroke="var(--ink)" stroke-width="2"/>
<polygon points="762,224 782,238 766,236" fill="var(--ink)"/>
<line x1="705" y1="327" x2="770" y2="284" stroke="var(--ink)" stroke-width="2"/>
<polygon points="762,290 782,276 766,278" fill="var(--ink)"/>
<rect x="790" y="212" width="120" height="90" rx="8" fill="var(--accent)"/>
<text x="850" y="250" font-size="15" fill="var(--page)" text-anchor="middle">照樣</text>
<text x="850" y="276" font-size="15" fill="var(--page)" text-anchor="middle">有生意</text>
<text x="60" y="500" font-size="22" fill="var(--ink)">貴的不是價格，是失效條件有多窄</text>
</svg>
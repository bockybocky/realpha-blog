<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-label="兩根長條對比：右邊那根整體高得多，上段灰色的其他佔比變大、下段亮色的閉源份額比例變小但絕對高度比左邊那根更高">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="570" fill="var(--page)"/>
  <text class="t" x="60" y="56">份額變小，賺的錢還是變多</text>
  <text class="g" x="140" y="150">今天</text>
  <rect x="140" y="250" width="160" height="190" fill="var(--accent)"/>
  <rect x="140" y="250" width="160" height="70" fill="var(--grey)"/>
  <text class="b" x="316" y="292">其他</text>
  <text class="b" x="316" y="392">閉源拿到的</text>
  <text class="b" x="140" y="476">整體市場</text>
  <text class="g" x="600" y="150">以後</text>
  <rect x="600" y="180" width="160" height="260" fill="var(--accent)"/>
  <rect x="600" y="180" width="160" height="130" fill="var(--grey)"/>
  <text class="b" x="776" y="252">其他</text>
  <text class="b" x="776" y="382">閉源拿到的</text>
  <text class="b" x="600" y="476">整體市場變大</text>
  <line x1="100" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <path d="M360 300 L540 250" stroke="var(--accent)" stroke-width="3" fill="none"/>
  <text class="b" x="366" y="340">比例縮小，高度反而長高</text>
  <text class="c" x="60" y="536">所以開源贏還是閉源贏，問錯了問題</text>
</svg>
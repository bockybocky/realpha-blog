<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三條橫條由短到極長排列，底下一條短條是對手開一家新店所需時間">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">別人要重做，各要花幾年</text>
<text x="60" y="90" font-size="15" fill="var(--dim)">橫條長度＝時間，一格五年</text>

<line x1="300" y1="120" x2="300" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="400" y1="120" x2="400" y2="430" stroke="var(--line)" stroke-dasharray="4 7"/>
<line x1="500" y1="120" x2="500" y2="430" stroke="var(--line)" stroke-dasharray="4 7"/>
<line x1="600" y1="120" x2="600" y2="430" stroke="var(--line)" stroke-dasharray="4 7"/>
<line x1="700" y1="120" x2="700" y2="430" stroke="var(--line)" stroke-dasharray="4 7"/>
<line x1="800" y1="120" x2="800" y2="430" stroke="var(--line)" stroke-dasharray="4 7"/>
<text x="400" y="452" font-size="15" fill="var(--dim)" text-anchor="middle">5</text>
<text x="500" y="452" font-size="15" fill="var(--dim)" text-anchor="middle">10</text>
<text x="600" y="452" font-size="15" fill="var(--dim)" text-anchor="middle">15</text>
<text x="700" y="452" font-size="15" fill="var(--dim)" text-anchor="middle">20</text>
<text x="800" y="452" font-size="15" fill="var(--dim)" text-anchor="middle">25 年</text>

<text x="60" y="166" font-size="19" fill="var(--ink)">公園裡那棟房子</text>
<text x="60" y="190" font-size="15" fill="var(--dim)">許可 2.5 年＋改建 1 年</text>
<rect x="300" y="146" width="70" height="46" rx="4" fill="var(--accent)"/>

<text x="60" y="256" font-size="19" fill="var(--ink)">公園第一張酒牌</text>
<text x="60" y="280" font-size="15" fill="var(--dim)">不准設吧台、須留外帶窗口</text>
<rect x="300" y="236" width="50" height="46" rx="4" fill="var(--accent)"/>

<text x="60" y="346" font-size="19" fill="var(--ink)">近百家小農名單</text>
<text x="60" y="370" font-size="15" fill="var(--dim)">一家一家攢起來</text>
<rect x="300" y="326" width="580" height="46" rx="4" fill="var(--accent)"/>
<text x="868" y="356" font-size="16" font-weight="700" fill="var(--page)" text-anchor="end">29 年</text>

<text x="60" y="506" font-size="22" font-weight="700" fill="var(--ink)">卡點不在菜單上，在別人要花幾年才補得起的那幾樣</text>
</g>
</svg>
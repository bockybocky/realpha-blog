<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左格是自己對自己的虛線閉圈，承諾可以安靜改掉；右格承諾交到第三人手上，月底多出一條回頭問你的箭頭">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">一個承諾要有第三隻手</text>

  <rect x="60" y="120" width="390" height="300" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="84" y="158" font-size="20" font-weight="700" fill="var(--dim)">只跟自己說</text>
  <circle cx="200" cy="280" r="34" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
  <text class="t" x="200" y="288" font-size="17" text-anchor="middle" fill="var(--dim)">你</text>
  <path d="M234 280 C 300 230 300 330 236 292" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
  <text class="t" x="320" y="268" font-size="16" fill="var(--dim)">自己確認</text>
  <text class="t" x="320" y="296" font-size="16" fill="var(--dim)">自己改掉</text>

  <rect x="510" y="120" width="390" height="300" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="t" x="534" y="158" font-size="20" font-weight="700" fill="var(--accent)">交到別人手上</text>
  <circle cx="610" cy="280" r="34" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="610" y="288" font-size="17" text-anchor="middle" fill="var(--ink)">你</text>
  <circle cx="820" cy="280" r="34" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="820" y="288" font-size="17" text-anchor="middle" fill="var(--ink)">朋友</text>
  <path d="M646 262 L 778 262" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M770 254 L 792 262 L 770 270 Z" fill="var(--accent)"/>
  <text class="t" x="712" y="246" font-size="16" text-anchor="middle" fill="var(--dim)">一句話</text>
  <path d="M784 300 L 652 300" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <path d="M660 292 L 638 300 L 660 308 Z" fill="var(--warn)"/>
  <text class="t" x="712" y="330" font-size="16" text-anchor="middle" fill="var(--warn)">月底問一次</text>

  <text class="t" x="60" y="486" font-size="22" font-weight="700" fill="var(--ink)">有人盯著，你才必須解釋自己</text>
</svg>
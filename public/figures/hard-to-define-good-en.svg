<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A downward-sloping curve rests on a horizontal spectrum: the left end is easy to describe and solve, while the right end is where it is unclear what good means.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:600; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; }
    .ag { font-size:20px; font-weight:700; fill:var(--accent); }
</style>
<text class="t" x="60" y="62">Businesses where “good” is hard to define last longer</text>
<text class="g" x="120" y="124">Speed of commoditization</text>
<path d="M120 150 C 340 170 520 268 880 296" fill="none" stroke="var(--grey)" stroke-width="5"/>
<text class="b" x="120" y="194">Fastest</text>
<text class="b" x="880" y="330" text-anchor="end">May last longer</text>
<line x1="120" y1="366" x2="880" y2="366" stroke="var(--line)" stroke-width="3"/>
<circle cx="800" cy="366" r="10" fill="var(--accent)"/>
<text class="ag" x="782" y="372" text-anchor="end">Long-term course planning</text>
<text class="b" x="480" y="458" text-anchor="middle">No quantifiable right or wrong; more qualitative judgment</text>
<text class="g" x="120" y="404">Easy to describe, easy to solve</text>
<text class="g" x="880" y="404" text-anchor="end">Unclear what good looks like</text>
<text class="c" x="60" y="492">When good is hard to define, you can only sense it, not evaluate it</text>
</svg>
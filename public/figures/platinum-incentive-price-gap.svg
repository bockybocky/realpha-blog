<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="現價柱低於虛線門檻，中間留下一段缺口">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">門檻在上面，價格在下面</text>

<line x1="200" y1="120" x2="200" y2="450" stroke="var(--line)" stroke-width="2"/>
<line x1="200" y1="450" x2="890" y2="450" stroke="var(--line)" stroke-width="2"/>

<line x1="200" y1="190" x2="880" y2="190" stroke="var(--warn)" stroke-width="3" stroke-dasharray="12 8"/>
<text x="560" y="176" font-size="19" fill="var(--warn)">新礦動工門檻 2,500</text>

<rect x="300" y="330" width="150" height="120" rx="4" fill="var(--accent)"/>
<text x="470" y="352" font-size="19" fill="var(--ink)">當天價格 1,800</text>

<line x1="375" y1="200" x2="375" y2="322" stroke="var(--dim)" stroke-width="2"/>
<path d="M375 192 L369 206 L381 206 Z" fill="var(--dim)"/>
<path d="M375 330 L369 316 L381 316 Z" fill="var(--dim)"/>
<text x="392" y="268" font-size="16" fill="var(--dim)">缺口</text>

<text x="600" y="300" font-size="19" fill="var(--dim)">低於門檻｜沒有新供給</text>

<text x="60" y="505" font-size="22" fill="var(--ink)">價格不漲，東西就會不夠</text>
</svg>
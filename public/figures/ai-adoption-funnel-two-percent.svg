<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三層漏斗由寬到極窄：買了訂閱幾乎每家公司，接進日常業務 20 到 30%，財報講得出每股盈餘影響只剩 2%">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600}
.b{font-size:16px}
.d{font-size:15px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">買了訂閱，不等於財報看得到</text>
<rect x="90" y="140" width="780" height="66" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="480" y="180" text-anchor="middle">買了訂閱</text>
<text class="d" x="856" y="180" text-anchor="end">幾乎每家公司</text>
<rect x="363" y="246" width="234" height="66" rx="6" fill="var(--accent)"/>
<text x="480" y="286" text-anchor="middle" style="font-size:19px;font-weight:600;fill:var(--page)">接進日常業務</text>
<text class="b" x="624" y="286">20 到 30%</text>
<rect x="472" y="352" width="16" height="66" rx="3" fill="var(--warn)"/>
<line x1="492" y1="378" x2="516" y2="378" stroke="var(--warn)" stroke-width="2"/>
<text class="b" x="524" y="374">財報講得出每股盈餘影響</text>
<text x="524" y="402" style="font-size:19px;font-weight:600;fill:var(--warn)">2%</text>
<text class="c" x="60" y="480">導入與兌現，中間差了十倍</text>
</svg>
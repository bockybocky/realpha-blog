<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一條對角線代表準時消耗，另一條更陡的線在上方，提早在重置前打到用完的頂線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="40" y="56">用量跑得比時鐘快，燈還是綠的</text>

<line x1="200" y1="130" x2="880" y2="130" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="s" x="200" y="118">用完</text>
<line x1="200" y1="450" x2="880" y2="450" stroke="var(--grey)" stroke-width="1"/>
<line x1="200" y1="130" x2="200" y2="450" stroke="var(--grey)" stroke-width="1"/>

<line x1="200" y1="450" x2="880" y2="130" stroke="var(--grey)" stroke-width="3"/>
<text class="s" x="792" y="196">照時鐘的速度</text>

<polyline points="200,450 660,130 880,130" fill="none" stroke="var(--warn)" stroke-width="4"/>
<circle cx="660" cy="130" r="7" fill="var(--warn)"/>
<text class="g" x="640" y="112" text-anchor="end">提早見底</text>

<line x1="430" y1="130" x2="430" y2="470" stroke="var(--dim)" stroke-width="1" stroke-dasharray="4 5"/>
<circle cx="430" cy="342" r="6" fill="var(--grey)"/>
<circle cx="430" cy="290" r="6" fill="var(--warn)"/>
<line x1="430" y1="290" x2="430" y2="342" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="448" y="312">＋15 個百分點</text>
<text class="s" x="430" y="492" text-anchor="middle">現在</text>

<text class="s" x="880" y="472" text-anchor="end">重置</text>
<text class="c" x="40" y="528">綠燈只說現在還有，沒說撐不撐得到</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="側視圖對照：鏡頭的視野是一個往下的窄錐，紙舉在錐外看不到，書攤在錐內才拍得到">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:19px; font-weight:700; fill:var(--ink); }
    .lbl { font-size:15px; fill:var(--dim); }
    .end { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="58">鏡頭的視野是一個往下的窄錐</text>

  <rect x="40" y="86" width="420" height="356" rx="10" fill="var(--card)"/>
  <text class="grp" x="64" y="122">舉在手上</text>
  <polygon points="97,232 420,420 230,420" fill="var(--line)"/>
  <rect x="90" y="240" width="14" height="180" fill="var(--grey)"/>
  <circle cx="97" cy="230" r="9" fill="var(--ink)"/>
  <line x1="60" y1="420" x2="440" y2="420" stroke="var(--grey)" stroke-width="3"/>
  <rect x="300" y="404" width="110" height="16" rx="4" fill="var(--grey)"/>
  <g transform="rotate(-14 180 300)">
    <rect x="130" y="276" width="104" height="70" rx="4" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
  </g>
  <text class="lbl" x="64" y="398">錐的外面</text>

  <rect x="500" y="86" width="420" height="356" rx="10" fill="var(--card)"/>
  <text class="grp" x="524" y="122">攤在鍵盤前</text>
  <polygon points="557,232 880,420 690,420" fill="var(--line)"/>
  <rect x="550" y="240" width="14" height="180" fill="var(--grey)"/>
  <circle cx="557" cy="230" r="9" fill="var(--ink)"/>
  <line x1="520" y1="420" x2="900" y2="420" stroke="var(--grey)" stroke-width="3"/>
  <rect x="600" y="404" width="90" height="16" rx="4" fill="var(--grey)"/>
  <rect x="700" y="388" width="168" height="32" rx="4" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <line x1="784" y1="388" x2="784" y2="420" stroke="var(--accent)" stroke-width="2"/>
  <text class="lbl" x="700" y="372">錐的裡面</text>

  <text class="end" x="60" y="492">拿得再近，只要不在錐裡就等於沒拍到</text>
  <text class="lbl" x="60" y="524">夾式鏡頭的視角比想像中窄，攤平在桌上最保險</text>
</svg>
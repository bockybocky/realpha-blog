<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bars of different heights, each about three quarters filled at the bottom with the same color">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">A day's bill: 3/4 re-reading</text>

<rect x="60" y="98" width="18" height="18" fill="var(--accent)"/>
<text x="88" y="113" font-size="16" fill="var(--dim)">Re-reading</text>

<line x1="200" y1="470" x2="820" y2="470" stroke="var(--line)" stroke-width="2"/>

<rect x="300" y="150" width="120" height="81" fill="var(--card)" stroke="var(--line)"/>
<rect x="300" y="231" width="120" height="239" fill="var(--accent)"/>
<text x="360" y="138" font-size="16" fill="var(--ink)" text-anchor="middle">702</text>
<text x="360" y="358" font-size="16" fill="var(--page)" text-anchor="middle">525</text>
<text x="360" y="498" font-size="16" fill="var(--dim)" text-anchor="middle">Sep 4</text>

<rect x="540" y="292" width="120" height="47" fill="var(--card)" stroke="var(--line)"/>
<rect x="540" y="339" width="120" height="131" fill="var(--accent)"/>
<text x="600" y="280" font-size="16" fill="var(--ink)" text-anchor="middle">390</text>
<text x="600" y="410" font-size="16" fill="var(--page)" text-anchor="middle">287</text>
<text x="600" y="498" font-size="16" fill="var(--dim)" text-anchor="middle">Sep 5</text>

<text x="710" y="190" font-size="19" fill="var(--ink)">7-day sum</text>
<text x="710" y="218" font-size="16" fill="var(--dim)">$2,800–3,600</text>
<text x="710" y="244" font-size="16" fill="var(--dim)">List price</text>

<text x="60" y="534" font-size="22" fill="var(--ink)">The bill is mostly re-reading</text>
</svg>
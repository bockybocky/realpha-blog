<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一個專案向右分成三個彼此隔開的工作區，每區各住一個 agent">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">一個專案，三塊各自隔開的地</text>

  <rect x="48" y="150" width="190" height="230" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="143" y="250" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">同一個專案</text>
  <text class="t" x="143" y="282" font-size="16" fill="var(--dim)" text-anchor="middle">一份原始碼</text>

  <path d="M238 265 L310 175" stroke="var(--accent)" stroke-width="3" fill="none"/>
  <path d="M238 265 L310 265" stroke="var(--accent)" stroke-width="3" fill="none"/>
  <path d="M238 265 L310 355" stroke="var(--accent)" stroke-width="3" fill="none"/>

  <rect x="330" y="120" width="300" height="110" rx="12" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="372" cy="175" r="16" fill="var(--accent)"/>
  <text class="t" x="404" y="167" font-size="19" font-weight="700" fill="var(--ink)">工作樹 A</text>
  <text class="t" x="404" y="196" font-size="16" fill="var(--dim)">agent 一　分支 A</text>

  <rect x="330" y="248" width="300" height="110" rx="12" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="372" cy="303" r="16" fill="var(--accent)"/>
  <text class="t" x="404" y="295" font-size="19" font-weight="700" fill="var(--ink)">工作樹 B</text>
  <text class="t" x="404" y="324" font-size="16" fill="var(--dim)">agent 二　分支 B</text>

  <rect x="330" y="376" width="300" height="110" rx="12" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="372" cy="431" r="16" fill="var(--accent)"/>
  <text class="t" x="404" y="423" font-size="19" font-weight="700" fill="var(--ink)">工作樹 C</text>
  <text class="t" x="404" y="452" font-size="16" fill="var(--dim)">agent 三　分支 C</text>

  <line x1="672" y1="110" x2="672" y2="496" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
  <text class="t" x="700" y="268" font-size="22" font-weight="700" fill="var(--ink)">互不覆蓋</text>
  <text class="t" x="700" y="300" font-size="16" fill="var(--dim)">各改各的檔</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條隨收成擺動的鋸齒線和一條僵直的平線並排">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">有彈性的鈔票長什麼樣</text>
<text class="g" x="60" y="118" fill="var(--accent)">加拿大</text>
<path d="M200 190 L260 140 L320 200 L380 142 L440 198 L500 138 L560 200 L620 144 L680 196 L740 140 L800 198 L860 150" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
<text class="b" x="200" y="236">跟著收成上下擺</text>
<text class="g" x="60" y="330">美國</text>
<path d="M200 350 L860 350" fill="none" stroke="var(--warn)" stroke-width="3.5"/>
<text class="b" x="200" y="392">被國債擔保綁住，擺不動</text>
<line x1="200" y1="430" x2="860" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="200" y="458">春</text>
<text class="b" x="420" y="458">夏</text>
<text class="b" x="640" y="458">收割</text>
<text class="b" x="840" y="458">冬</text>
<text class="c" x="60" y="500">那條直線本身就是火源</text>
</svg>
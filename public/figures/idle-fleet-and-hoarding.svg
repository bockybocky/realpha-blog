<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊二十個格子只有七個亮著，右邊是一堆疊起來的箱子和一支往上的箭頭">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;

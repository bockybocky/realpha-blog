<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上下兩條平行時間軸，上軌在兩年內出現三到四個商用電池世代節點，下軌是一條從頭拉到尾的認證測試長條，終點的證書用虛線對回上軌，對到的卻是最早那一代">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">跑完認證，車已經開走</text>

  <text x="60" y="152" font-size="19" fill="var(--dim)">商用電池</text>
  <line x1="180" y1="200" x2="890" y2="200" stroke="var(--line)" stroke-width="3"/>
  <circle cx="200" cy="200" r="13" fill="var(--accent)"/>
  <circle cx="420" cy="200" r="13" fill="var(--accent)"/>
  <circle cx="640" cy="200" r="13" fill="var(--accent)"/>
  <circle cx="860" cy="200" r="13" fill="var(--accent)"/>
  <text x="200" y="172" font-size="16" text-anchor="middle" fill="var(--ink)">代 1</text>
  <text x="420" y="172" font-size="16" text-anchor="middle" fill="var(--ink)">代 2</text>
  <text x="640" y="172" font-size="16" text-anchor="middle" fill="var(--ink)">代 3</text>
  <text x="860" y="172" font-size="16" text-anchor="middle" fill="var(--ink)">代 4</text>

  <text x="60" y="326" font-size="19" fill="var(--dim)">認證測試</text>
  <rect x="200" y="300" width="620" height="44" rx="6" fill="var(--warn)"/>
  <text x="510" y="330" font-size="16" text-anchor="middle" fill="var(--page)">一到兩年</text>
  <circle cx="850" cy="322" r="18" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <text x="850" y="380" font-size="16" text-anchor="middle" fill="var(--warn)">拿到證</text>

  <path d="M 850 300 L 850 250 L 200 250 L 200 216" stroke="var(--warn)" stroke-width="2.5"
        stroke-dasharray="8 7" fill="none"/>
  <text x="520" y="240" font-size="16" text-anchor="middle" fill="var(--warn)">證上寫的是代 1 的規格</text>

  <line x1="200" y1="420" x2="860" y2="420" stroke="var(--line)" stroke-width="2"/>
  <text x="200" y="450" font-size="15" text-anchor="middle" fill="var(--dim)">0</text>
  <text x="530" y="450" font-size="15" text-anchor="middle" fill="var(--dim)">12 個月</text>
  <text x="860" y="450" font-size="15" text-anchor="middle" fill="var(--dim)">24 個月</text>

  <text x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">瓶頸卡在流程，不在研發</text>
</svg>
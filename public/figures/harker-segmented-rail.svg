<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條軌道分成兩段，只有後面那段上方開了一個窗口">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="480" y="60" font-size="27" fill="var(--ink)" text-anchor="middle">該分段的是軌道，不是整條變慢</text>

  <rect x="400" y="140" width="440" height="90" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="620" y="196" font-size="19" fill="var(--accent)" text-anchor="middle">窗口裡有比對在跑</text>
  <line x1="620" y1="230" x2="620" y2="290" stroke="var(--accent)" stroke-width="4"/>
  <polygon points="612,286 628,286 620,302" fill="var(--accent)"/>

  <rect x="80" y="300" width="300" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="380" y="300" width="480" height="80" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text x="230" y="348" font-size="20" fill="var(--ink)" text-anchor="middle">毫秒</text>
  <text x="620" y="348" font-size="20" fill="var(--accent)" text-anchor="middle">16 到 30 秒</text>

  <text x="230" y="420" font-size="16" fill="var(--dim)" text-anchor="middle">結帳櫃檯</text>
  <text x="620" y="420" font-size="16" fill="var(--dim)" text-anchor="middle">帳戶之間、企業應付、大額匯出</text>

  <text x="480" y="492" font-size="22" fill="var(--ink)" text-anchor="middle">窗口開在沒有人會察覺的那一段</text>
</svg>
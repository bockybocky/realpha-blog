<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Five bars of different lengths sit side by side, the longest being the $30 trillion addressable market, then S&P revenue, costs and net income getting shorter, with Microsoft plus Apple's thirty-five-year cumulative revenue at the bottom.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="66" font-size="27" font-weight="700" fill="var(--ink)">The hole vs the pool</text>
<text x="80" y="128" font-size="19" font-weight="700" fill="var(--warn)">The stated TAM</text>
<rect x="80" y="146" width="720" height="52" rx="6" fill="var(--warn)"/>
<text x="100" y="180" font-size="20" font-weight="700" fill="var(--page)">~$30T</text>
<text x="80" y="256" font-size="19" font-weight="700" fill="var(--accent)">Real pool: S&amp;P 500</text>
<rect x="80" y="274" width="408" height="44" rx="6" fill="var(--accent)"/>
<text x="100" y="304" font-size="16" font-weight="700" fill="var(--page)">Sales ~$17T</text>
<rect x="80" y="330" width="276" height="44" rx="6" fill="var(--accent)" opacity="0.72"/>
<text x="100" y="360" font-size="16" font-weight="700" fill="var(--page)">Costs ~$11-12T</text>
<rect x="80" y="386" width="126" height="44" rx="6" fill="var(--accent)" opacity="0.48"/>
<text x="216" y="416" font-size="16" font-weight="700" fill="var(--ink)">Profit $5-5.5T</text>
<text x="80" y="476" font-size="19" font-weight="700" fill="var(--dim)">MSFT+AAPL: all sales since 1990</text>
<rect x="80" y="494" width="240" height="36" rx="6" fill="var(--grey)"/>
<text x="334" y="520" font-size="16" fill="var(--dim)">Under $10T, real</text>
<text x="80" y="566" font-size="22" font-weight="700" fill="var(--ink)">Hole &gt; pool: whose profit pays?</text>
</svg>
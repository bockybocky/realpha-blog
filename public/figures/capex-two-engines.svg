<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="同一筆資本支出拆成兩段：從既有基礎挪出來的產能幾個月就到，新蓋的廠要兩三年，兩者長度差很多、風險也完全不同">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #b9c2d0;
      --accent: #1f6feb;
      --warn:   #d97706;
      --warnbg: #fdf4e7;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #4a5464;
        --accent: #58a6ff;
        --warn:   #d29922;
        --warnbg: #2b2411;
      }
    }
    .t     { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1    { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .barA  { font-size: 19px; font-weight: 700; fill: var(--page); }
    .barG  { font-size: 19px; font-weight: 700; fill: var(--ink); }
    .buy   { font-size: 16px; font-weight: 700; fill: var(--dim); }
    .cost  { font-size: 15px; fill: var(--dim); }
    .ax    { font-size: 15.5px; fill: var(--dim); }
    .warnl { font-size: 16.5px; font-weight: 700; fill: var(--warn); }
    .kick  { font-size: 22px; font-weight: 700; fill: var(--ink); }
  </style>

  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>

  <g class="t">
    <text x="480" y="44" class="h1" text-anchor="middle">同一筆資本支出，其實是兩台引擎</text>

    <!-- 挪動：短 -->
    <rect x="120" y="110" width="196" height="62" rx="4" fill="var(--accent)"/>
    <text x="218" y="148" class="barA" text-anchor="middle">挪既有產能</text>
    <text x="332" y="134" class="buy">幾個月　你買的是「調度能力」</text>
    <text x="332" y="162" class="cost">機台、廠房、人都已經在那裡了。代價是毛利率被咬一口、還要用卡車搬。</text>

    <!-- 新蓋：長 -->
    <rect x="120" y="212" width="604" height="62" rx="4" fill="var(--grey)"/>
    <text x="422" y="250" class="barG" text-anchor="middle">新蓋廠房</text>
    <text x="740" y="236" class="buy">兩到三年</text>
    <text x="740" y="262" class="buy">你買的是</text>
    <text x="740" y="286" class="buy">「時間＋執行力」</text>
    <text x="120" y="308" class="cost">中間夾著工程風險、機台交期、良率爬坡。</text>

    <!-- 時間軸 -->
    <line x1="120" y1="352" x2="900" y2="352" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="120" y="378" class="ax" text-anchor="middle">現在</text>
    <text x="316" y="378" class="ax" text-anchor="middle">半年</text>
    <text x="452" y="378" class="ax" text-anchor="middle">一年</text>
    <text x="724" y="378" class="ax" text-anchor="middle">兩年</text>
    <text x="890" y="378" class="ax" text-anchor="end">三年</text>

    <!-- 失效條件 -->
    <rect x="120" y="412" width="780" height="70" rx="8" fill="var(--warnbg)" stroke="var(--warn)" stroke-width="1.5"/>
    <text x="144" y="442" class="warnl">上面那台引擎有行程上限</text>
    <text x="144" y="468" class="cost">挪動的前提是「有一邊閒著」。所有產能同時滿載的時候，這個閥門就沒得動了。</text>

    <text x="480" y="536" class="kick" text-anchor="middle">同一則新聞把兩件事包在一起賣，但風險完全不同。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="In the top row four links connect and each carries a signature mark below it, while the bottom row has one lone link with nothing attached on its right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="64">Can you follow it link by link?</text>
<rect x="60" y="100" width="840" height="170" rx="14" fill="var(--card)"/>
<rect x="100" y="150" width="150" height="62" rx="8" fill="var(--accent)"/>
<text class="b" x="126" y="188" fill="var(--page)">New governor</text>
<rect x="290" y="150" width="150" height="62" rx="8" fill="var(--accent)"/>
<text class="b" x="326" y="188" fill="var(--page)">Permits issued</text>
<rect x="480" y="150" width="150" height="62" rx="8" fill="var(--accent)"/>
<text class="b" x="520" y="188" fill="var(--page)">Power and water</text>
<rect x="670" y="150" width="150" height="62" rx="8" fill="var(--accent)"/>
<text class="b" x="700" y="188" fill="var(--page)">Capacity GW</text>
<path d="M250 181 h40 M440 181 h40 M630 181 h40" stroke="var(--ink)" stroke-width="4"/>
<path d="M820 181 h50" stroke="var(--ink)" stroke-width="4"/>
<path d="M870 181 l-16 -9 v18 z" fill="var(--ink)"/>
<text class="b" x="100" y="246">Every link has a signer you can check</text>
<rect x="60" y="310" width="840" height="150" rx="14" fill="var(--card)"/>
<rect x="100" y="348" width="230" height="62" rx="8" fill="var(--grey)"/>
<text class="b" x="126" y="386">"That party is anti-AI"</text>
<path d="M330 379 h40" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 10"/>
<circle cx="404" cy="379" r="14" fill="none" stroke="var(--warn)" stroke-width="4"/>
<path d="M396 371 l16 16 M412 371 l-16 16" stroke="var(--warn)" stroke-width="4"/>
<text class="g" x="440" y="372" fill="var(--warn)">No next link</text>
<text class="b" x="440" y="400">No text, no signer</text>
<text class="c" x="60" y="528">Only a chain that continues gives you numbers to track</text>
</svg>
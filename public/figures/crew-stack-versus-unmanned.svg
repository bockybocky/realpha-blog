<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="左邊一座層層堆高的人員塔，右邊一個貼地的小方塊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text x="80" y="60" font-size="27" fill="var(--ink)">帳單的主體是人，不是機器</text>
  <line x1="80" y1="500" x2="880" y2="500" stroke="var(--line)" stroke-width="2"/>

  <rect x="200" y="440" width="260" height="56" rx="6" fill="var(--grey)"/>
  <text x="330" y="476" font-size="19" fill="var(--page)" text-anchor="middle">一個崗位</text>

  <rect x="200" y="378" width="260" height="56" rx="6" fill="var(--grey)"/>
  <text x="330" y="414" font-size="19" fill="var(--page)" text-anchor="middle">三班輪值</text>

  <rect x="200" y="316" width="260" height="56" rx="6" fill="var(--grey)"/>
  <text x="330" y="352" font-size="19" fill="var(--page)" text-anchor="middle">各組主管</text>

  <rect x="200" y="254" width="260" height="56" rx="6" fill="var(--grey)"/>
  <text x="330" y="290" font-size="19" fill="var(--page)" text-anchor="middle">船長｜大副｜廚師</text>

  <rect x="200" y="192" width="260" height="56" rx="6" fill="var(--warn)"/>
  <text x="330" y="228" font-size="19" fill="var(--page)" text-anchor="middle">隨船醫生</text>

  <text x="330" y="165" font-size="20" fill="var(--ink)" text-anchor="middle">幾十人｜一天幾十萬美元</text>
  <text x="330" y="540" font-size="16" fill="var(--dim)" text-anchor="middle">有人在船上</text>

  <rect x="620" y="470" width="220" height="26" rx="6" fill="var(--accent)"/>
  <text x="730" y="455" font-size="20" fill="var(--accent)" text-anchor="middle">無人</text>
  <text x="730" y="540" font-size="16" fill="var(--dim)" text-anchor="middle">更差的海況也能出海｜水裡可以開快</text>
</svg>
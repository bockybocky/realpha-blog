<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A jagged line trends upward overall but dips over a short section at the right end; a narrow frame encloses only that downward zigzag beside a downward arrow, while a wide frame encloses the entire line beside an upward arrow.">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">On one line, window width determines the slope you see</text>
  <line x1="80" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
  <polyline points="100,380 200,330 280,350 380,290 470,305 560,250 650,260 720,205 790,235" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="720" cy="205" r="7" fill="var(--accent)"/>
  <circle cx="790" cy="235" r="7" fill="var(--accent)"/>
  <text x="716" y="184" font-size="16" text-anchor="middle" fill="var(--dim)">69</text>
  <text x="800" y="258" font-size="16" fill="var(--dim)">54</text>
  <text x="620" y="152" font-size="15" fill="var(--dim)">Quarterly increase ($100M)</text>
  <rect x="690" y="180" width="130" height="90" rx="8" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <line x1="700" y1="300" x2="700" y2="338" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="700,352 692,332 708,332" fill="var(--warn)"/>
  <text x="640" y="382" font-size="17" font-weight="700" fill="var(--warn)">Two-month window</text>
  <rect x="80" y="170" width="770" height="250" rx="10" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="150" y1="452" x2="150" y2="440" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="150,432 142,452 158,452" fill="var(--accent)"/>
  <text x="176" y="458" font-size="17" font-weight="700" fill="var(--accent)">Eighteen-month window</text>
  <text x="60" y="516" font-size="22" font-weight="700" fill="var(--ink)">Set the window first, then read the data—or you are editing noise</text>
</svg>
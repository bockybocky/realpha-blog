<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="保守到全押的光譜上，人全擠在全押那一端，保守端與中段是一塊空白區">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="58" font-size="27" fill="var(--ink)">沒人站的那一段</text>
<rect x="140" y="262" width="480" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 7"/>
<text x="380" y="326" font-size="20" fill="var(--dim)" text-anchor="middle">沒人站</text>
<line x1="120" y1="390" x2="900" y2="390" stroke="var(--line)" stroke-width="2"/>
<polygon points="918,390 898,381 898,399" fill="var(--line)"/>
<circle cx="690" cy="310" r="11" fill="var(--accent)"/>
<circle cx="730" cy="345" r="11" fill="var(--accent)"/>
<circle cx="768" cy="296" r="11" fill="var(--accent)"/>
<circle cx="800" cy="340" r="11" fill="var(--accent)"/>
<circle cx="836" cy="306" r="11" fill="var(--accent)"/>
<circle cx="716" cy="272" r="11" fill="var(--accent)"/>
<circle cx="862" cy="348" r="11" fill="var(--accent)"/>
<circle cx="792" cy="265" r="11" fill="var(--accent)"/>
<text x="175" y="420" font-size="19" fill="var(--dim)" text-anchor="middle">不買</text>
<text x="420" y="420" font-size="19" fill="var(--dim)" text-anchor="middle">增資慢買</text>
<text x="790" y="420" font-size="19" fill="var(--ink)" text-anchor="middle">借錢再加碼</text>
<text x="175" y="245" font-size="19" fill="var(--warn)" text-anchor="middle">「結構性做空」</text>
<text x="880" y="455" font-size="16" fill="var(--dim)" text-anchor="end">槓桿往右增加</text>
</g>
</svg>
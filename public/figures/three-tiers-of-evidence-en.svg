<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three steps of different heights: relayed accounts lowest, the host's inference in the middle, a published paper highest.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">One story, three grades of hardness</text>

  <line x1="60" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="3"/>

  <rect x="110" y="330" width="240" height="70" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="134" y="372" font-size="19" fill="var(--grey)">Two people familiar with it</text>
  <text x="134" y="434" font-size="16" fill="var(--dim)">Not confirmed by the company</text>
  <text x="134" y="462" font-size="16" fill="var(--dim)">Relayed</text>

  <rect x="372" y="250" width="240" height="150" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="396" y="332" font-size="19" fill="var(--warn)">The host's inference</text>
  <text x="396" y="434" font-size="16" fill="var(--dim)">He flagged it himself</text>
  <text x="396" y="462" font-size="16" fill="var(--dim)">Sounds plausible</text>

  <rect x="634" y="150" width="240" height="250" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="658" y="282" font-size="19" fill="var(--accent)">Published paper</text>
  <text x="658" y="434" font-size="16" fill="var(--dim)">Signed, checkable</text>
  <text x="658" y="462" font-size="16" fill="var(--dim)">On paper</text>

  <text x="48" y="112" font-size="16" fill="var(--dim)">Higher means harder</text>
  <text x="48" y="500" font-size="22" fill="var(--ink)">Read them stacked and the lowest step grows to the top.</text>
</svg>
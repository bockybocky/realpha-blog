<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two recovery curves: supply climbs steeply back to baseline within nine months and then flattens, while price rises slowly and only returns to that same baseline two years later.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">Supply: 9 months. Price: 2 years</text>
<text x="60" y="86" font-size="16" fill="var(--dim)">Path back to pre-flood levels</text>

<line x1="120" y1="160" x2="900" y2="160" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="900" y="150" font-size="16" text-anchor="end" fill="var(--dim)">Pre-flood level</text>
<line x1="120" y1="160" x2="120" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

<path d="M120 420 L200 330 L290 220 L405 162 L880 160" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
<path d="M120 420 L280 402 L450 372 L620 320 L760 244 L878 162" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>

<circle cx="405" cy="162" r="7" fill="var(--accent)"/>
<text x="405" y="136" font-size="16" text-anchor="middle" fill="var(--accent)">Availability is back</text>
<circle cx="878" cy="162" r="7" fill="var(--warn)"/>
<text x="878" y="196" font-size="16" text-anchor="end" fill="var(--warn)">Price is not</text>

<text x="150" y="286" font-size="19" font-weight="700" fill="var(--accent)">Supply</text>
<text x="560" y="356" font-size="19" font-weight="700" fill="var(--warn)">Price</text>

<text x="120" y="450" font-size="15" text-anchor="middle" fill="var(--dim)">Oct 2011</text>
<text x="405" y="450" font-size="15" text-anchor="middle" fill="var(--dim)">Jul 2012</text>
<text x="880" y="450" font-size="15" text-anchor="end" fill="var(--dim)">Sep 2013</text>

<text x="480" y="516" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">Supply back ≠ price back; a year apart</text>
</svg>
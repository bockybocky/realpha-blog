<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Many agents pass through the open cost gate but are blocked by the closed trust gate, leaving only a few able to pass.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" fill="var(--ink)">The first gate is not the bottleneck</text>
<g fill="var(--accent)">
<rect x="60" y="150" width="26" height="26"/><rect x="94" y="150" width="26" height="26"/><rect x="128" y="150" width="26" height="26"/><rect x="162" y="150" width="26" height="26"/>
<rect x="60" y="184" width="26" height="26"/><rect x="94" y="184" width="26" height="26"/><rect x="128" y="184" width="26" height="26"/><rect x="162" y="184" width="26" height="26"/>
<rect x="60" y="218" width="26" height="26"/><rect x="94" y="218" width="26" height="26"/><rect x="128" y="218" width="26" height="26"/><rect x="162" y="218" width="26" height="26"/>
<rect x="60" y="252" width="26" height="26"/><rect x="94" y="252" width="26" height="26"/><rect x="128" y="252" width="26" height="26"/><rect x="162" y="252" width="26" height="26"/>
<rect x="60" y="286" width="26" height="26"/><rect x="94" y="286" width="26" height="26"/><rect x="128" y="286" width="26" height="26"/><rect x="162" y="286" width="26" height="26"/>
</g>
<text x="60" y="350" font-size="19" fill="var(--ink)">100 agents</text>
<line x1="210" y1="230" x2="330" y2="230" stroke="var(--grey)" stroke-width="3"/>
<path d="M330 222 L348 230 L330 238 Z" fill="var(--grey)"/>
<rect x="380" y="110" width="20" height="70" fill="var(--grey)"/>
<rect x="380" y="286" width="20" height="70" fill="var(--grey)"/>
<text x="356" y="392" font-size="20" fill="var(--dim)">Cost</text>
<text x="344" y="418" font-size="16" fill="var(--dim)">Already open</text>
<line x1="420" y1="230" x2="540" y2="230" stroke="var(--grey)" stroke-width="3"/>
<path d="M540 222 L558 230 L540 238 Z" fill="var(--grey)"/>
<rect x="600" y="110" width="20" height="246" fill="var(--warn)"/>
<text x="576" y="392" font-size="20" fill="var(--warn)">Trust</text>
<text x="564" y="418" font-size="16" fill="var(--warn)">Still closed</text>
<g fill="var(--accent)">
<rect x="700" y="202" width="26" height="26"/><rect x="734" y="202" width="26" height="26"/><rect x="768" y="202" width="26" height="26"/>
</g>
<text x="700" y="268" font-size="19" fill="var(--ink)">Only 1 to 5 run at once</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條並排的時間軸：上面那條在出貨點之後還連著一串節點一路延伸到右邊；下面那條的鎖死點遠遠落在出貨之前，出貨之後只剩一段沒有節點的灰色虛線。">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>

<text x="64" y="58" font-size="27" fill="var(--ink)">出貨之後</text>

<rect x="64" y="104" width="832" height="170" rx="14" fill="var(--card)"/>
<text x="96" y="146" font-size="20" fill="var(--dim)">軟體</text>
<line x1="150" y1="215" x2="880" y2="215" stroke="var(--line)" stroke-width="2"/>
<line x1="300" y1="215" x2="860" y2="215" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="300" cy="215" r="9" fill="var(--accent)"/>
<circle cx="420" cy="215" r="5" fill="var(--accent)"/>
<circle cx="530" cy="215" r="5" fill="var(--accent)"/>
<circle cx="640" cy="215" r="5" fill="var(--accent)"/>
<circle cx="750" cy="215" r="5" fill="var(--accent)"/>
<circle cx="860" cy="215" r="5" fill="var(--accent)"/>
<text x="300" y="190" font-size="16" fill="var(--ink)" text-anchor="middle">出貨</text>
<text x="580" y="253" font-size="16" fill="var(--dim)" text-anchor="middle">還能一直改</text>

<rect x="64" y="296" width="832" height="184" rx="14" fill="var(--card)"/>
<text x="96" y="338" font-size="20" fill="var(--dim)">硬體</text>
<line x1="150" y1="405" x2="880" y2="405" stroke="var(--line)" stroke-width="2"/>
<line x1="210" y1="405" x2="640" y2="405" stroke="var(--warn)" stroke-width="2.5"/>
<line x1="640" y1="405" x2="880" y2="405" stroke="var(--grey)" stroke-width="2.5" stroke-dasharray="7 7"/>
<circle cx="210" cy="405" r="9" fill="var(--warn)"/>
<circle cx="640" cy="405" r="9" fill="var(--accent)"/>
<text x="210" y="380" font-size="16" fill="var(--ink)" text-anchor="middle">規格鎖死</text>
<text x="640" y="380" font-size="16" fill="var(--ink)" text-anchor="middle">出貨</text>
<text x="425" y="443" font-size="16" fill="var(--dim)" text-anchor="middle">全部定案</text>
<text x="760" y="443" font-size="16" fill="var(--dim)" text-anchor="middle">改不了</text>

<text x="64" y="518" font-size="22" fill="var(--ink)">能改的時間，硬體提前用完</text>
</svg>
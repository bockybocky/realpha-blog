<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩張代表最缺層的卡片，箭頭都指向右邊的價值加成，表示最缺的推不動資金就換一層" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">最缺的那層推不上去，錢就換一層</text>

<rect x="60" y="110" width="400" height="140" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="88" y="146" font-size="15" fill="var(--dim)">零組件</text>
<text x="88" y="184" font-size="20" font-weight="700" fill="var(--ink)">記憶體</text>
<text x="88" y="216" font-size="15" fill="var(--dim)">最缺・展望最明確</text>

<rect x="60" y="290" width="400" height="140" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="88" y="326" font-size="15" fill="var(--dim)">瓶頸</text>
<text x="88" y="364" font-size="20" font-weight="700" fill="var(--ink)">後段封測</text>
<text x="88" y="396" font-size="15" fill="var(--dim)">還有什麼更缺</text>

<path d="M470 180 H540 V262 H600" fill="none" stroke="var(--warn)" stroke-width="2"/>
<polygon points="600,254 618,262 600,270" fill="var(--warn)"/>
<text x="476" y="168" font-size="16" fill="var(--warn)">推不上去</text>

<path d="M470 360 H540 V298 H600" fill="none" stroke="var(--warn)" stroke-width="2"/>
<polygon points="600,290 618,298 600,306" fill="var(--warn)"/>
<text x="476" y="348" font-size="16" fill="var(--warn)">推不上去</text>

<rect x="620" y="200" width="280" height="160" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="650" y="236" font-size="15" fill="var(--dim)">第三層</text>
<text x="650" y="276" font-size="20" font-weight="700" fill="var(--accent)">價值加成</text>
<text x="650" y="308" font-size="15" fill="var(--dim)">疊代・軟體</text>
<text x="650" y="334" font-size="15" fill="var(--dim)">資金回流</text>

<text x="480" y="500" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">先看最缺的那層有沒有溢價</text>
</svg>
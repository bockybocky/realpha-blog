<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="兩個不同病因匯進中間同一個錯誤結論，再往下分岔成兩種不同修法，形成沙漏形狀">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text x="60" y="52" font-size="27" font-weight="700" fill="var(--ink)">同一個錯結論，兩套病因</text>

  <rect x="70" y="110" width="330" height="96" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text x="235" y="152" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">概念沒分乾淨</text>
  <text x="235" y="182" font-size="15" fill="var(--dim)" text-anchor="middle">指引／行動</text>

  <rect x="560" y="110" width="330" height="96" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text x="725" y="152" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">外生變數給太輕</text>
  <text x="725" y="182" font-size="15" fill="var(--dim)" text-anchor="middle">油價</text>

  <line x1="235" y1="206" x2="420" y2="272" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="436,278 410,270 418,254" fill="var(--grey)"/>
  <line x1="725" y1="206" x2="540" y2="272" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="524,278 542,254 550,270" fill="var(--grey)"/>

  <rect x="330" y="284" width="300" height="92" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text x="480" y="340" font-size="22" font-weight="700" fill="var(--warn)" text-anchor="middle">看錯方向</text>

  <line x1="420" y1="376" x2="235" y2="444" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="220,450 238,426 246,442" fill="var(--accent)"/>
  <line x1="540" y1="376" x2="725" y2="444" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="740,450 714,442 722,426" fill="var(--accent)"/>

  <rect x="70" y="456" width="330" height="82" rx="12" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text x="235" y="506" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">把詞分開</text>

  <rect x="560" y="456" width="330" height="82" rx="12" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text x="725" y="506" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">調高權重</text>

  <text x="480" y="580" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">覆盤要停在病因這一層</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="多個零件來源匯聚到泰國單一組裝地，再向外出口，中間是一個收束點">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="56">零件來自各地，裝起來只在一個地方</text>

  <rect x="60" y="120" width="200" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="80" y="152">美國</text><text class="b" x="80" y="174">主軸</text>
  <rect x="60" y="220" width="200" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="80" y="252">日本</text><text class="b" x="80" y="274">讀寫頭</text>
  <rect x="60" y="320" width="200" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="80" y="352">中國</text><text class="b" x="80" y="374">零件</text>

  <path d="M260 153 L420 230" stroke="var(--grey)" stroke-width="3" fill="none"/>
  <path d="M260 253 L420 258" stroke="var(--grey)" stroke-width="3" fill="none"/>
  <path d="M260 353 L420 286" stroke="var(--grey)" stroke-width="3" fill="none"/>

  <rect x="420" y="170" width="210" height="180" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="g" x="448" y="232">泰國園區</text>
  <text class="b" x="448" y="262">最終組裝</text>
  <text class="b" x="448" y="292">一個地點</text>

  <path d="M630 260 L760 260" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <path d="M760 260 l-16 -8 l0 16 z" fill="var(--accent)"/>
  <rect x="775" y="222" width="125" height="76" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="797" y="256">出口</text><text class="b" x="797" y="280">全世界</text>

  <text class="c" x="60" y="470">上游很分散，收束處只有一個</text>
</svg>
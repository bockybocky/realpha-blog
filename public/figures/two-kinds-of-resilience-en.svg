<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two panels compared; on the left assets fall and spending flattens, on the right assets rise and spending rises with them">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
  <marker id="a1g" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
    <path d="M0 0 L8 4 L0 8 Z" fill="var(--grey)"/>
  </marker>
  <marker id="a1a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
    <path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/>
  </marker>
</defs>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Both called resilience, opposite starting points</text>

<rect x="60" y="100" width="400" height="370" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="92" y="145" font-size="20" font-weight="700" fill="var(--ink)">After the financial crisis</text>
<text x="92" y="192" font-size="16" fill="var(--dim)">Assets</text>
<line x1="110" y1="215" x2="405" y2="300" stroke="var(--grey)" stroke-width="4" marker-end="url(#a1g)"/>
<text x="112" y="330" font-size="15" fill="var(--dim)">Houses, cars, savings, retirement</text>
<line x1="92" y1="360" x2="428" y2="360" stroke="var(--line)"/>
<text x="92" y="396" font-size="16" fill="var(--dim)">Spending</text>
<line x1="110" y1="425" x2="405" y2="425" stroke="var(--grey)" stroke-width="4"/>
<text x="112" y="455" font-size="15" fill="var(--dim)">Stagnant five to seven years</text>

<rect x="500" y="100" width="400" height="370" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="532" y="145" font-size="20" font-weight="700" fill="var(--ink)">After COVID</text>
<text x="532" y="192" font-size="16" fill="var(--dim)">Assets</text>
<line x1="550" y1="300" x2="845" y2="215" stroke="var(--accent)" stroke-width="4" marker-end="url(#a1a)"/>
<text x="552" y="330" font-size="15" fill="var(--dim)">Stocks up, houses up</text>
<line x1="532" y1="360" x2="868" y2="360" stroke="var(--line)"/>
<text x="532" y="396" font-size="16" fill="var(--dim)">Spending</text>
<line x1="550" y1="440" x2="845" y2="405" stroke="var(--accent)" stroke-width="4" marker-end="url(#a1a)"/>
<text x="552" y="470" font-size="15" fill="var(--dim)">I'm going to spend</text>

<text x="480" y="525" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">Different source of money, different reason to spend</text>
</svg>
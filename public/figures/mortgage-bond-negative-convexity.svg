<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條線的對比圖：公債那條持續往右上走，房貸債券那條走到履約價的水平虛線後就壓平不再上去，而在左側下跌區兩條線貼在一起">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">房貸債券＝買公債，再賣掉一個買權</text>

  <line x1="120" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
  <line x1="120" y1="120" x2="120" y2="420" stroke="var(--line)" stroke-width="2"/>

  <line x1="120" y1="215" x2="900" y2="215" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text class="b" x="900" y="203" text-anchor="end">履約價 105</text>

  <path d="M150 395 L860 150" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <text class="g" x="866" y="146">公債</text>

  <path d="M150 395 L470 285 Q600 240 640 220 L860 215" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text class="g" x="866" y="232">房貸債券</text>

  <text class="b" x="170" y="452">利率上升 · 價格下跌</text>
  <text class="b" x="850" y="452" text-anchor="end">利率下降 · 價格上漲</text>

  <text class="g" x="186" y="360">下檔：一起跌</text>
  <text class="g" x="600" y="300">上檔：停在這裡</text>

  <text class="c" x="60" y="524">賺的那邊被封住，賠的那邊沒有保護，這就是負凸性</text>
</svg>
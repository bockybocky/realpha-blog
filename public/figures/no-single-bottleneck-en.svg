<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One of four cells is red in the top row, all four are red in the bottom row">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">No ranking means no cell to attack first</text>

<text x="48" y="128" font-size="19" fill="var(--dim)">What people assume</text>
<rect x="48" y="150" width="188" height="76" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="142" y="196" font-size="16" fill="var(--dim)" text-anchor="middle">Power</text>
<rect x="252" y="150" width="188" height="76" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="346" y="196" font-size="16" fill="var(--dim)" text-anchor="middle">Land</text>
<rect x="456" y="150" width="188" height="76" rx="10" fill="var(--warn)" opacity="0.18"/>
<rect x="456" y="150" width="188" height="76" rx="10" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text x="550" y="196" font-size="16" fill="var(--warn)" text-anchor="middle">Memory</text>
<rect x="660" y="150" width="188" height="76" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="754" y="196" font-size="16" fill="var(--dim)" text-anchor="middle">Wafers</text>
<text x="872" y="196" font-size="15" fill="var(--dim)">Stuck</text>

<text x="48" y="308" font-size="19" fill="var(--warn)">What the call said</text>
<rect x="48" y="330" width="188" height="76" rx="10" fill="var(--warn)" opacity="0.18"/>
<rect x="48" y="330" width="188" height="76" rx="10" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text x="142" y="376" font-size="16" fill="var(--warn)" text-anchor="middle">Power</text>
<rect x="252" y="330" width="188" height="76" rx="10" fill="var(--warn)" opacity="0.18"/>
<rect x="252" y="330" width="188" height="76" rx="10" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text x="346" y="376" font-size="16" fill="var(--warn)" text-anchor="middle">Land</text>
<rect x="456" y="330" width="188" height="76" rx="10" fill="var(--warn)" opacity="0.18"/>
<rect x="456" y="330" width="188" height="76" rx="10" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text x="550" y="376" font-size="16" fill="var(--warn)" text-anchor="middle">Memory</text>
<rect x="660" y="330" width="188" height="76" rx="10" fill="var(--warn)" opacity="0.18"/>
<rect x="660" y="330" width="188" height="76" rx="10" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text x="754" y="376" font-size="16" fill="var(--warn)" text-anchor="middle">Wafers</text>
<text x="872" y="376" font-size="15" fill="var(--warn)">All stuck</text>

<text x="480" y="482" font-size="22" fill="var(--ink)" text-anchor="middle">Eating everywhere is itself the ranking</text>
</svg>
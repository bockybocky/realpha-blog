<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩欄方塊的大小互相對調，顯示注意力與現金落在不同的地方">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="70" font-size="27" fill="var(--ink)">注意力在這邊，現金在那邊</text>
<text x="90" y="130" font-size="20" fill="var(--dim)">外界看的</text>
<rect x="90" y="150" width="340" height="190" fill="var(--warn)" opacity="0.8"/>
<text x="110" y="250" font-size="19" fill="var(--page)">擔保與供應商融資</text>
<rect x="90" y="356" width="120" height="56" fill="var(--grey)" opacity="0.7"/>
<text x="100" y="390" font-size="16" fill="var(--ink)">鎖供給</text>
<text x="530" y="130" font-size="20" fill="var(--dim)">現金實際去的地方</text>
<rect x="530" y="150" width="340" height="190" fill="var(--accent)" opacity="0.85"/>
<text x="550" y="235" font-size="19" fill="var(--page)">鎖記憶體、鎖晶圓</text>
<text x="550" y="265" font-size="19" fill="var(--page)">鎖 CoWoS</text>
<rect x="530" y="356" width="80" height="40" fill="var(--grey)" opacity="0.7"/>
<text x="540" y="383" font-size="16" fill="var(--ink)">擔保</text>
<text x="60" y="465" font-size="22" fill="var(--ink)">兩邊都架在他個人的合作關係上</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="之前與之後兩格：同一塊結論橫板高度不變，底下支撐的柱子從集中度換成國債">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="50" y="58" font-size="27" font-weight="700" fill="var(--ink)">論據換了，結論沒動</text>

  <text x="90" y="128" font-size="20" font-weight="600" fill="var(--dim)">兩年前</text>
  <text x="530" y="128" font-size="20" font-weight="600" fill="var(--dim)">集中度解除之後</text>

  <rect x="90" y="160" width="340" height="56" rx="8" fill="var(--accent)"/>
  <text x="260" y="196" font-size="20" font-weight="700" text-anchor="middle" fill="var(--page)">結論：看空</text>
  <rect x="230" y="216" width="60" height="176" fill="var(--accent)"/>
  <line x1="90" y1="392" x2="430" y2="392" stroke="var(--line)" stroke-width="3"/>
  <text x="260" y="422" font-size="19" font-weight="600" text-anchor="middle" fill="var(--ink)">集中度</text>

  <rect x="530" y="160" width="340" height="56" rx="8" fill="var(--accent)"/>
  <text x="700" y="196" font-size="20" font-weight="700" text-anchor="middle" fill="var(--page)">結論：看空</text>
  <rect x="600" y="216" width="60" height="176" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
  <line x1="608" y1="284" x2="652" y2="328" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>
  <line x1="652" y1="284" x2="608" y2="328" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>
  <rect x="750" y="216" width="60" height="176" fill="var(--accent)"/>
  <line x1="530" y1="392" x2="870" y2="392" stroke="var(--line)" stroke-width="3"/>
  <text x="630" y="422" font-size="19" text-anchor="middle" fill="var(--dim)">集中度</text>
  <text x="780" y="422" font-size="19" font-weight="600" text-anchor="middle" fill="var(--ink)">國債</text>

  <text x="480" y="482" font-size="22" font-weight="600" text-anchor="middle" fill="var(--ink)">只是換了一根柱子</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The bar for time-to-exploit shortens year by year while the bar for time-to-patch stays the same length, so the exposure window between them keeps opening wider.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">The window moves only one way</text>
<line x1="230" y1="130" x2="230" y2="460" stroke="var(--line)" stroke-width="2"/>
<text x="230" y="494" font-size="16" fill="var(--dim)" text-anchor="middle">Flaw discovered</text>
<text x="120" y="182" font-size="19" fill="var(--dim)">Exploited</text>
<rect x="230" y="160" width="520" height="34" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="766" y="183" font-size="16" fill="var(--dim)">Before</text>
<rect x="230" y="214" width="130" height="34" rx="6" fill="var(--warn)"/>
<text x="376" y="237" font-size="16" fill="var(--warn)">Now</text>
<text x="120" y="330" font-size="19" fill="var(--dim)">Humans patch it</text>
<rect x="230" y="306" width="560" height="34" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="806" y="329" font-size="16" fill="var(--dim)">Same length</text>
<rect x="360" y="256" width="430" height="42" fill="var(--warn)" opacity="0.18"/>
<text x="575" y="284" font-size="19" fill="var(--warn)" text-anchor="middle">Exposure window</text>
<path d="M340 404 L 250 404" stroke="var(--warn)" stroke-width="4"/>
<polygon points="250,394 228,404 250,414" fill="var(--warn)"/>
<text x="356" y="410" font-size="16" fill="var(--dim)">Still pressing left</text>
<text x="60" y="516" font-size="22" fill="var(--ink)">Every step here is a measurable quantity</text>
</g>
</svg>
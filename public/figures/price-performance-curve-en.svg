<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The performance-versus-price curve turns almost vertical at the end, where the last tenth of performance costs ten times the price.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">That last tenth of performance is the priciest</text>
<text x="60" y="94" font-size="16" fill="var(--dim)">Shape is illustrative; the numbers are off-the-cuff estimates from the show</text>
<line x1="150" y1="440" x2="880" y2="440" stroke="var(--grey)" stroke-width="2"/>
<line x1="150" y1="140" x2="150" y2="440" stroke="var(--grey)" stroke-width="2"/>
<text x="76" y="156" font-size="16" fill="var(--dim)">Price</text>
<text x="800" y="470" font-size="16" fill="var(--dim)">Performance</text>
<path d="M150 432 C 450 420, 660 400, 740 370 C 800 345, 820 250, 824 160" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="740" cy="370" r="10" fill="var(--warn)"/>
<text x="470" y="352" font-size="20" fill="var(--warn)">The model from six months ago</text>
<text x="470" y="378" font-size="16" fill="var(--dim)">90% performance · 10% price</text>
<circle cx="824" cy="162" r="10" fill="var(--accent)"/>
<text x="600" y="156" font-size="20" fill="var(--accent)">The newest full-fat model</text>
<text x="600" y="130" font-size="16" fill="var(--dim)">100% performance · 100% price</text>
<text x="60" y="520" font-size="22" fill="var(--ink)">The question isn't which model is best, it's where your own use case sits on this curve</text>
</svg>
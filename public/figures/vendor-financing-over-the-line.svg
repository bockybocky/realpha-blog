<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="比例刻度線上，常規的窄帶在一成到一成五，Winstar 的標記孤立在四成處">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">賣方融資：常規的位置，與越線的位置</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">設備商出錢資助客戶買自家設備，占該筆設備採購款的比例</text>
<rect x="268" y="230" width="74" height="90" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="305" y="212" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">常規</text>
<text x="305" y="190" font-size="15" fill="var(--dim)" text-anchor="middle">一成到一成五</text>
<rect x="704" y="200" width="18" height="120" fill="var(--warn)"/>
<text x="713" y="182" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">四成以上</text>
<text x="713" y="160" font-size="15" fill="var(--dim)" text-anchor="middle">Winstar 1998</text>
<line x1="120" y1="320" x2="880" y2="320" stroke="var(--ink)" stroke-width="2"/>
<line x1="120" y1="320" x2="120" y2="332" stroke="var(--line)" stroke-width="2"/>
<line x1="268" y1="320" x2="268" y2="332" stroke="var(--line)" stroke-width="2"/>
<line x1="416" y1="320" x2="416" y2="332" stroke="var(--line)" stroke-width="2"/>
<line x1="564" y1="320" x2="564" y2="332" stroke="var(--line)" stroke-width="2"/>
<line x1="712" y1="320" x2="712" y2="332" stroke="var(--line)" stroke-width="2"/>
<line x1="860" y1="320" x2="860" y2="332" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="356" font-size="15" fill="var(--dim)" text-anchor="middle">0</text>
<text x="268" y="356" font-size="15" fill="var(--dim)" text-anchor="middle">一成</text>
<text x="416" y="356" font-size="15" fill="var(--dim)" text-anchor="middle">兩成</text>
<text x="564" y="356" font-size="15" fill="var(--dim)" text-anchor="middle">三成</text>
<text x="712" y="356" font-size="15" fill="var(--dim)" text-anchor="middle">四成</text>
<text x="860" y="356" font-size="15" fill="var(--dim)" text-anchor="middle">五成</text>
<line x1="350" y1="404" x2="690" y2="404" stroke="var(--dim)" stroke-width="2" stroke-dasharray="7 6"/>
<polygon points="700,404 686,397 686,411" fill="var(--dim)"/>
<text x="520" y="392" font-size="16" fill="var(--dim)" text-anchor="middle">約常規上限的 2.7 倍</text>
<text x="60" y="470" font-size="22" font-weight="700" fill="var(--ink)">買方的錢是賣方給的，需求就不是獨立的</text>
</svg>
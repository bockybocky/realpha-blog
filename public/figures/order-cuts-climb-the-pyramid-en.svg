<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A four-tier pyramid shows cuts starting with the widest base of side components and moving up the chain, with the cost rising in the same direction.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="t" x="60" y="68">Which tier gets cut first</text>
  <path d="M180 460 L780 460 L720 400 L240 400 z" fill="var(--warn)"/>
  <text class="g" x="330" y="440" fill="var(--page)">Side components</text>
  <path d="M240 392 L720 392 L660 332 L300 332 z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="370" y="372">Modules</text>
  <path d="M300 324 L660 324 L600 264 L360 264 z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="400" y="304">Critical parts</text>
  <path d="M360 256 L600 256 L540 196 L420 196 z" fill="var(--accent)"/>
  <text class="g" x="395" y="234" fill="var(--page)">Advanced capacity</text>
  <path d="M130 455 L130 215" fill="none" stroke="var(--dim)" stroke-width="3" marker-end="url(#ar2)"/>
  <text class="b" x="62" y="340">Order of cuts</text>
  <path d="M830 455 L830 215" fill="none" stroke="var(--dim)" stroke-width="3" marker-end="url(#ar2)"/>
  <text class="b" x="858" y="440">Low cost</text>
  <text class="b" x="858" y="230">High cost</text>
  <text class="c" x="60" y="525">One base cut after another = warning</text>
</svg>
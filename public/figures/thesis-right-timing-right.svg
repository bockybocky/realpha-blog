<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="四象限：橫軸是論述對錯，縱軸是時間點對錯；上排兩格底色標亮代表市場只結算這一列，右下角是論述對但時間點錯">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.g { font-size:19px; fill:var(--dim); }
.q { font-size:20px; font-weight:700; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="70" y="62">論述的對錯，和時間點的對錯</text>
<rect x="180" y="110" width="700" height="180" fill="var(--card)"/>
<rect x="180" y="110" width="700" height="360" fill="none" stroke="var(--line)" stroke-width="2"/>
<line x1="530" y1="110" x2="530" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="180" y1="290" x2="880" y2="290" stroke="var(--line)" stroke-width="2"/>
<text class="q" x="355" y="205" text-anchor="middle">糊塗地賺到</text>
<text class="q" x="705" y="205" text-anchor="middle" fill="var(--accent)">賺到</text>
<text class="q" x="355" y="385" text-anchor="middle">賠掉</text>
<text class="q" x="705" y="385" text-anchor="middle" fill="var(--warn)">正確地虧兩年</text>
<text class="g" x="60" y="200">時間點對</text>
<text class="g" x="60" y="385">時間點錯</text>
<text class="g" x="355" y="505" text-anchor="middle">論述錯</text>
<text class="g" x="705" y="505" text-anchor="middle">論述對</text>
<text class="c" x="70" y="560">市場只結算上面那一列</text>
</svg>
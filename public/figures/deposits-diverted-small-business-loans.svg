<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="之前粗存款流過社區銀行變成粗的小企業貸款；之後一半存款被分流到穩定幣，小企業貸款那條跟著變細">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .h { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .n { font-size:16px; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text x="60" y="62" class="h">存款的去向</text>
<text x="40" y="176" class="g">之前</text>
<text x="110" y="130" class="b">存款</text>
<rect x="110" y="140" width="290" height="60" fill="var(--accent)" opacity="0.35"/>
<rect x="400" y="120" width="160" height="100" rx="10" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<text x="480" y="176" class="n" text-anchor="middle">社區銀行</text>
<rect x="560" y="140" width="200" height="60" fill="var(--accent)"/>
<text x="772" y="176" class="n">小企業貸款</text>
<line x1="40" y1="262" x2="920" y2="262" stroke="var(--line)" stroke-width="1.5"/>
<text x="40" y="386" class="g">之後</text>
<text x="110" y="340" class="b">存款</text>
<rect x="110" y="350" width="140" height="60" fill="var(--accent)" opacity="0.35"/>
<rect x="250" y="350" width="150" height="30" fill="var(--accent)" opacity="0.35"/>
<path d="M250 380 C 300 380 300 470 350 470 L350 500 C 280 500 270 410 250 410 Z" fill="var(--warn)" opacity="0.45"/>
<rect x="350" y="460" width="120" height="50" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="410" y="491" class="n" text-anchor="middle">穩定幣</text>
<rect x="400" y="315" width="160" height="100" rx="10" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<text x="480" y="371" class="n" text-anchor="middle">社區銀行</text>
<rect x="560" y="350" width="200" height="30" fill="var(--accent)"/>
<text x="772" y="371" class="n">小企業貸款</text>
<text x="480" y="555" class="c" text-anchor="middle">存款一搬，在地信貸先變細</text>
</svg>
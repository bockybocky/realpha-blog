<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The similar-area tall-narrow and short-wide rectangles show a trade-off between return rate and duration.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="80" y="62">R is height, N is width; value is area</text>
<rect x="80" y="100" width="800" height="330" fill="var(--card)"/>
<line x1="140" y1="150" x2="140" y2="380" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="380" x2="860" y2="380" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="96" y="144">R</text>
<text class="s" x="836" y="408">N</text>
<rect x="180" y="180" width="140" height="200" fill="var(--accent)"/>
<text class="g" x="180" y="166">High R</text>
<text class="s" x="180" y="408">Short N</text>
<rect x="470" y="290" width="340" height="90" fill="var(--grey)"/>
<text class="g" x="470" y="276">Ordinary R</text>
<text class="s" x="470" y="408">Long N</text>
<line x1="350" y1="250" x2="440" y2="250" stroke="var(--dim)" stroke-width="3"/>
<polygon points="446,250 430,243 430,257" fill="var(--dim)"/>
<polygon points="344,250 360,243 360,257" fill="var(--dim)"/>
<text class="s" x="332" y="232">Trade-off</text>
<text class="c" x="80" y="470">Earn more, usually for less time—competition and opportunity costs follow</text>
<text class="s" x="80" y="502">Dividends, buybacks, capex, and M&amp;A each reshape both sides again</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上下兩列等長虛線框，上列實心條縮成一小截，下列實心條仍填滿整框">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">算力換得掉的瓶頸，和換不掉的</text>
<text x="820" y="118" font-size="19" fill="var(--dim)" text-anchor="end">算力 ×10</text>
<text x="60" y="186" font-size="19" fill="var(--ink)">寫 kernel　驗證乾淨</text>
<rect x="60" y="200" width="760" height="48" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="60" y="200" width="150" height="48" fill="var(--accent)"/>
<text x="226" y="230" font-size="16" fill="var(--accent)">縮短</text>
<text x="60" y="336" font-size="19" fill="var(--ink)">臨床試驗　要等現實回話</text>
<rect x="60" y="350" width="760" height="48" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="60" y="350" width="760" height="48" fill="var(--grey)"/>
<text x="836" y="380" font-size="16" fill="var(--dim)">不變</text>
<text x="60" y="480" font-size="22" fill="var(--ink)">瓶頸不吃算力時，模型再強也快不了</text>
</svg>
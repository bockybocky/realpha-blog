<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一個起點分三路，分別散成碎塊、繼續延伸、被粗線吸收">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">同樣的結構，三種結局</text>
<rect x="70" y="250" width="200" height="96" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="170" y="292" text-anchor="middle">合夥人持有</text>
<text class="b" x="170" y="320" text-anchor="middle">＋ 被大量挖角</text>
<path d="M278,298 C400,298 440,180 580,180" fill="none" stroke="var(--warn)" stroke-width="4"/>
<path d="M278,298 L560,298" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M278,298 C400,298 440,420 580,420" fill="none" stroke="var(--grey)" stroke-width="4"/>
<rect x="600" y="160" width="20" height="20" rx="3" fill="var(--warn)"/>
<rect x="644" y="144" width="20" height="20" rx="3" fill="var(--warn)"/>
<rect x="688" y="186" width="20" height="20" rx="3" fill="var(--warn)"/>
<rect x="730" y="148" width="20" height="20" rx="3" fill="var(--warn)"/>
<rect x="774" y="196" width="20" height="20" rx="3" fill="var(--warn)"/>
<rect x="816" y="162" width="20" height="20" rx="3" fill="var(--warn)"/>
<text class="g" x="600" y="238" fill="var(--warn)">解散 · Weil</text>
<line x1="560" y1="298" x2="840" y2="298" stroke="var(--accent)" stroke-width="4"/>
<polygon points="840,290 856,298 840,306" fill="var(--accent)"/>
<text class="g" x="600" y="276" fill="var(--accent)">撐住 · Wachtell、Cravath</text>
<line x1="580" y1="420" x2="700" y2="420" stroke="var(--grey)" stroke-width="3"/>
<rect x="700" y="404" width="156" height="30" rx="6" fill="var(--grey)"/>
<text class="g" x="600" y="470" fill="var(--dim)">被併 · Cadwalader</text>
<text class="c" x="60" y="520">同結構、同挖角，結局三種</text>
</svg>
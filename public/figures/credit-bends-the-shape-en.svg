<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two sites side by side show solar farms of identical size, but the battery block on the right is enlarged several times over.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">Credit shapes what you build, not just if</text>

  <rect x="60" y="92" width="390" height="390" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="84" y="130">Balanced mix</text>
  <rect x="100" y="330" width="180" height="90" fill="var(--grey)"/>
  <text class="d" x="190" y="444" text-anchor="middle">Solar farm</text>
  <rect x="310" y="366" width="70" height="54" fill="var(--accent)"/>
  <text class="d" x="345" y="444" text-anchor="middle">Battery</text>
  <line x1="84" y1="420" x2="426" y2="420" stroke="var(--line)" stroke-width="3"/>

  <rect x="510" y="92" width="390" height="390" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="534" y="130">Credit-driven mix</text>
  <rect x="550" y="330" width="180" height="90" fill="var(--grey)"/>
  <text class="d" x="640" y="444" text-anchor="middle">Same solar farm</text>
  <rect x="750" y="220" width="130" height="200" fill="var(--accent)"/>
  <text class="d" x="815" y="444" text-anchor="middle">Huge battery</text>
  <text class="d" x="815" y="206" text-anchor="middle">Claimed at 30% of capex</text>
  <line x1="534" y1="420" x2="876" y2="420" stroke="var(--line)" stroke-width="3"/>

  <text class="c" x="60" y="528">Same land, reshaped by policy</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="一根帳單柱切成發電、配電、公共政策、輸電四段，各段分別連到不同監管機關">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="62">一張帳單，四塊，四個管轄機關</text>
<text class="b" x="60" y="92">高度＝占比示意</text>

<rect x="90" y="130" width="230" height="170" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="205" y="222" text-anchor="middle" fill="var(--ink)">發電</text>
<rect x="90" y="300" width="230" height="125" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="205" y="368" text-anchor="middle" fill="var(--ink)">配電</text>
<rect x="90" y="425" width="230" height="80" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="205" y="472" text-anchor="middle" fill="var(--ink)">公共政策方案</text>
<rect x="90" y="505" width="230" height="46" fill="var(--accent)" stroke="var(--line)"/>
<text class="g" x="205" y="535" text-anchor="middle" fill="var(--page)">輸電</text>

<line x1="320" y1="215" x2="520" y2="215" stroke="var(--grey)"/>
<line x1="320" y1="362" x2="520" y2="362" stroke="var(--grey)"/>
<line x1="320" y1="465" x2="520" y2="465" stroke="var(--grey)"/>
<line x1="320" y1="528" x2="520" y2="528" stroke="var(--accent)" stroke-width="2"/>

<text class="g" x="534" y="221" fill="var(--dim)">批發市場</text>
<text class="g" x="534" y="368" fill="var(--dim)">州公用事業委員會</text>
<text class="g" x="534" y="471" fill="var(--dim)">州議會</text>
<text class="g" x="534" y="534" fill="var(--accent)">聯邦能源管理委員會</text>

<text class="c" x="60" y="585">看成一個總價，就只想得到一個原因</text>
</svg>
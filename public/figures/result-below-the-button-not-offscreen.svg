<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊螢幕框裡結果區塊被框底切掉落在螢幕外，右邊結果區塊緊貼搜尋鈕下方完整留在框內">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">結果在不在眼睛看的地方</text>

  <text class="t" x="80" y="118" font-size="20" font-weight="700" fill="var(--dim)">照手機習慣排</text>
  <rect x="80" y="136" width="340" height="300" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
  <rect x="104" y="164" width="200" height="40" rx="5" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="316" y="164" width="80" height="40" rx="5" fill="var(--accent)"/>
  <rect x="104" y="392" width="292" height="100" rx="6" fill="var(--grey)"/>
  <rect x="80" y="436" width="340" height="60" fill="var(--page)" opacity="0.72"/>
  <line x1="80" y1="436" x2="420" y2="436" stroke="var(--ink)" stroke-width="3" stroke-dasharray="10 8"/>
  <text class="t" x="104" y="520" font-size="16" fill="var(--dim)">結果掉到螢幕外，要捲才看得到</text>

  <polygon points="470,290 520,290 520,272 556,299 520,326 520,308 470,308" fill="var(--grey)"/>

  <text class="t" x="600" y="118" font-size="20" font-weight="700" fill="var(--ink)">改成貼著按鈕</text>
  <rect x="600" y="136" width="340" height="300" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
  <rect x="624" y="164" width="200" height="40" rx="5" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <rect x="836" y="164" width="80" height="40" rx="5" fill="var(--accent)"/>
  <rect x="624" y="218" width="292" height="100" rx="6" fill="var(--accent)"/>
  <text class="t" x="624" y="520" font-size="16" fill="var(--dim)">按下去，結果就在眼前</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two horizontal bars translate one site's daily emissions and water use into 150,000 cars and 300,000 people, the latter bar twice as long as the former.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">One site, one day</text>
<text x="48" y="92" font-size="16" fill="var(--dim)">Gas combined cycle, 1 GW, vendor's own figures</text>
<text x="48" y="168" font-size="19" fill="var(--ink)">Nitrogen oxides</text>
<text x="48" y="196" font-size="16" fill="var(--dim)">about 720 lb</text>
<rect x="240" y="146" width="290" height="56" rx="4" fill="var(--warn)"/>
<text x="548" y="182" font-size="19" fill="var(--ink)">≈ 150,000 new cars</text>
<text x="48" y="318" font-size="19" fill="var(--ink)">Water use</text>
<text x="48" y="346" font-size="16" fill="var(--dim)">about 4.5 million gallons</text>
<rect x="240" y="296" width="580" height="56" rx="4" fill="var(--warn)"/>
<text x="808" y="332" font-size="19" fill="#fff" text-anchor="end">≈ 300,000 showers</text>
<rect x="48" y="410" width="772" height="44" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="68" y="439" font-size="16" fill="var(--dim)">These two bars are what the community hearing argues about</text>
<text x="48" y="498" font-size="22" fill="var(--ink)">Beyond cheapest, one more question to answer</text>
</svg>

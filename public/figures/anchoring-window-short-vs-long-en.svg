<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The short-dated line spikes and falls back, while the long-dated line never leaves its narrow band.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">To spot unanchoring, watch the long end</text>

<rect x="60" y="106" width="840" height="180" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="84" y="140" font-size="20" font-weight="700" fill="var(--ink)">Short dated</text>
<rect x="200" y="222" width="676" height="26" fill="var(--grey)" opacity="0.28"/>
<path d="M200 238 L300 234 L360 160 L430 196 L520 226 L640 238 L876 240" fill="none" stroke="var(--warn)" stroke-width="4" stroke-linejoin="round"/>
<text class="t" x="360" y="150" font-size="16" fill="var(--warn)" text-anchor="middle">Spiked in wartime</text>
<text class="t" x="800" y="272" font-size="16" fill="var(--dim)" text-anchor="middle">Back down</text>

<rect x="60" y="308" width="840" height="180" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="84" y="342" font-size="20" font-weight="700" fill="var(--ink)">Long dated</text>
<rect x="200" y="386" width="676" height="26" fill="var(--accent)" opacity="0.18"/>
<path d="M200 400 L340 398 L470 402 L620 398 L876 400" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="t" x="538" y="446" font-size="16" fill="var(--dim)" text-anchor="middle">Never left this band</text>

<text class="t" x="480" y="524" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">The short end shouts; the long end counts</text>
</svg>
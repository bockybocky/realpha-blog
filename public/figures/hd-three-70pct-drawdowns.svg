<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="時間軸上三根往下垂的柱子代表三次約七成跌幅，底部括號標出 1999 年買進後等了 12 年">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .v { font-size:19px; font-weight:700; }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="60" y="56" class="t">三次跌七成</text>
<text x="120" y="120" class="b">朗格尼：一股沒賣</text>
<line x1="120" y1="136" x2="880" y2="136" stroke="var(--accent)" stroke-width="4"/>
<line x1="120" y1="220" x2="880" y2="220" stroke="var(--grey)" stroke-width="2"/>
<text x="120" y="206" class="b" text-anchor="middle">1981</text>
<text x="272" y="206" class="b" text-anchor="middle">1990</text>
<text x="441" y="206" class="b" text-anchor="middle">2000</text>
<text x="610" y="206" class="b" text-anchor="middle">2010</text>
<text x="779" y="206" class="b" text-anchor="middle">2020</text>
<rect x="169.6" y="220" width="36" height="198" fill="var(--warn)"/>
<text x="187.6" y="444" class="v" text-anchor="middle">−66%</text>
<text x="187.6" y="466" class="b" text-anchor="middle">1985</text>
<rect x="456.7" y="220" width="36" height="210" fill="var(--warn)"/>
<text x="474.7" y="456" class="v" text-anchor="middle">−70%</text>
<text x="474.7" y="478" class="b" text-anchor="middle">2002</text>
<rect x="558" y="220" width="36" height="210" fill="var(--warn)"/>
<text x="576" y="456" class="v" text-anchor="middle">−70%</text>
<text x="576" y="478" class="b" text-anchor="middle">2008</text>
<line x1="424" y1="512" x2="627" y2="512" stroke="var(--dim)" stroke-width="2"/>
<line x1="424" y1="502" x2="424" y2="522" stroke="var(--dim)" stroke-width="2"/>
<line x1="627" y1="502" x2="627" y2="522" stroke="var(--dim)" stroke-width="2"/>
<text x="525" y="550" class="v" text-anchor="middle">1999 高點買進 → 12 年回本</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="只存在腦袋裡的事交不出去，寫成一張紙之後就能傳給別人">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" fill="var(--ink)">只存在腦袋裡的，就是你的技術債</text>
<circle cx="180" cy="240" r="100" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="134" y="186" width="92" height="20" fill="var(--grey)"/>
<rect x="134" y="222" width="68" height="20" fill="var(--grey)"/>
<rect x="134" y="258" width="84" height="20" fill="var(--grey)"/>
<text x="118" y="386" font-size="19" fill="var(--ink)">在你腦袋裡</text>
<line x1="300" y1="240" x2="368" y2="240" stroke="var(--warn)" stroke-width="3"/>
<line x1="352" y1="216" x2="392" y2="264" stroke="var(--warn)" stroke-width="4"/>
<line x1="392" y1="216" x2="352" y2="264" stroke="var(--warn)" stroke-width="4"/>
<text x="330" y="310" font-size="16" fill="var(--warn)">交不出去</text>
<line x1="470" y1="100" x2="470" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="150" width="170" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="568" y="186" width="114" height="20" fill="var(--accent)"/>
<rect x="568" y="222" width="86" height="20" fill="var(--accent)"/>
<rect x="568" y="258" width="104" height="20" fill="var(--accent)"/>
<text x="540" y="386" font-size="19" fill="var(--ink)">寫成一張紙</text>
<line x1="738" y1="240" x2="842" y2="240" stroke="var(--accent)" stroke-width="3"/>
<path d="M842 230 L866 240 L842 250 Z" fill="var(--accent)"/>
<circle cx="900" cy="240" r="28" fill="var(--accent)"/>
<text x="846" y="310" font-size="16" fill="var(--accent)">別人照著做完</text>
</svg>
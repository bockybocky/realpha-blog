<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three columns use the same scale: last year's uncommenced leases are short, this year's are three and a half times taller, and existing lease liabilities on the balance sheet are only about as tall as last year's uncommenced leases.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">The scale that matters: leases not yet commenced</text>

  <line x1="80" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>

  <rect x="150" y="345" width="150" height="85" fill="var(--grey)"/>
  <text class="t" x="225" y="332" font-size="19" fill="var(--dim)" text-anchor="middle">$92.7B</text>
  <text class="t" x="225" y="462" font-size="16" fill="var(--ink)" text-anchor="middle">Last year, uncommenced</text>

  <rect x="425" y="130" width="150" height="300" fill="var(--accent)"/>
  <text class="t" x="500" y="118" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">$329.1B</text>
  <text class="t" x="500" y="462" font-size="16" fill="var(--ink)" text-anchor="middle">This year, uncommenced</text>
  <text class="t" x="500" y="486" font-size="16" fill="var(--dim)" text-anchor="middle">3.55× in one year</text>

  <rect x="700" y="349" width="150" height="81" fill="var(--card)" stroke="var(--line)"/>
  <rect x="700" y="349" width="150" height="20" fill="var(--grey)"/>
  <text class="t" x="775" y="336" font-size="19" fill="var(--dim)" text-anchor="middle">$88.5B</text>
  <text class="t" x="775" y="462" font-size="16" fill="var(--ink)" text-anchor="middle">Current lease liabilities</text>
  <text class="t" x="775" y="486" font-size="16" fill="var(--dim)" text-anchor="middle">Operating $21.9B + finance $66.6B</text>

  <text class="t" x="48" y="534" font-size="22" font-weight="700" fill="var(--ink)">Not yet booked: about 3.7× what is already booked</text>
</svg>
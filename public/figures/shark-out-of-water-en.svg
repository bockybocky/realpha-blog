<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The shark is huge below the waterline, and once moved above it the same shark is smaller and lying on its side next to the bank-branch blocks.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="80" y="62" font-size="27" font-weight="700" fill="var(--ink)">Same shark, different waters</text>

  <rect x="80" y="300" width="400" height="160" fill="var(--card)"/>
  <line x1="80" y1="300" x2="880" y2="300" stroke="var(--accent)" stroke-width="3"/>
  <text x="80" y="288" font-size="19" font-weight="700" fill="var(--accent)">Digital waters</text>
  <text x="880" y="288" font-size="19" font-weight="700" text-anchor="end" fill="var(--dim)">Offline world</text>

  <polygon points="280,320 200,450 360,450" fill="var(--accent)"/>
  <text x="280" y="500" font-size="16" text-anchor="middle" fill="var(--dim)">No rival on the phone</text>

  <polygon points="700,258 664,290 736,290" fill="var(--accent)"/>
  <g fill="var(--grey)">
    <rect x="560" y="256" width="34" height="34"/><rect x="604" y="256" width="34" height="34"/>
    <rect x="760" y="256" width="34" height="34"/><rect x="804" y="256" width="34" height="34"/>
    <rect x="848" y="256" width="34" height="34"/>
  </g>
  <text x="700" y="346" font-size="16" text-anchor="middle" fill="var(--dim)">Branches  ATMs  Cash habits  Brand</text>

  <line x1="80" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text x="560" y="512" font-size="22" font-weight="700" fill="var(--ink)">On land, power drops fast</text>
</svg>
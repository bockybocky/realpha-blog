<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The price bar is clearly higher than the speed bar, about three times as high, with a baseline dashed line at the bottom">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="60" y="58" font-size="27" fill="var(--ink)">Same model, the price of speed</text>

  <line x1="80" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
  <line x1="80" y1="380" x2="900" y2="380" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="900" y="368" font-size="16" fill="var(--dim)" text-anchor="end">Baseline</text>

  <rect x="300" y="180" width="120" height="240" rx="6" fill="var(--warn)"/>
  <text x="360" y="160" font-size="20" fill="var(--warn)" text-anchor="middle">Price</text>
  <text x="360" y="458" font-size="16" fill="var(--ink)" text-anchor="middle">~6x</text>

  <rect x="560" y="332" width="120" height="88" rx="6" fill="var(--accent)"/>
  <text x="620" y="312" font-size="20" fill="var(--accent)" text-anchor="middle">Speed</text>
  <text x="620" y="458" font-size="16" fill="var(--ink)" text-anchor="middle">~2x</text>

  <text x="60" y="510" font-size="22" fill="var(--ink)">And still short</text>
</svg>
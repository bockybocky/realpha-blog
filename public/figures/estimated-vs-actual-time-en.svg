<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A long bar on top for the estimated time, a much shorter one below for the actual time, and a tiny four-minute line at the bottom.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:20px; fill:var(--ink); font-weight:600; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="48" y="58">How long you thought, how long it took</text>
<text class="b" x="48" y="136">Thought</text>
<rect x="48" y="154" width="720" height="58" rx="6" fill="var(--grey)"/>
<text class="g" x="782" y="192">Two afternoons</text>
<text class="b" x="48" y="282">Actual</text>
<rect x="48" y="300" width="60" height="58" rx="6" fill="var(--accent)"/>
<text class="g" x="124" y="338">40 minutes</text>
<text class="b" x="48" y="412">One of them</text>
<rect x="48" y="424" width="6" height="34" rx="3" fill="var(--warn)"/>
<text class="g" x="76" y="452">4 minutes</text>
<text class="c" x="48" y="504">What stalls is imagination, not time</text>
</svg>
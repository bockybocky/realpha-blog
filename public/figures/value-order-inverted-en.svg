<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two stacked bars whose top and bottom block sizes are exactly swapped.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:19px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="62">Same work, flipped</text>

<text class="g" x="110" y="118">Math</text>
<rect x="110" y="136" width="300" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="130" y="212">New ideas</text>
<text class="s" x="130" y="242">Topology · groups · lattices</text>
<rect x="110" y="326" width="300" height="80" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="130" y="374">Grinding conjectures</text>

<text class="g" x="550" y="118">AI labs</text>
<rect x="550" y="136" width="300" height="80" fill="var(--accent)" opacity="0.16"/>
<rect x="550" y="136" width="300" height="80" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="570" y="184">Theory</text>
<rect x="550" y="216" width="300" height="190" fill="var(--accent)" opacity="0.16"/>
<rect x="550" y="216" width="300" height="190" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text class="b" x="570" y="296">Recipes that just work</text>
<text class="s" x="570" y="326">Cheaper · smarter</text>

<path d="M430 240 L530 240" stroke="var(--grey)" stroke-width="3" fill="none"/>
<path d="M430 300 L530 300" stroke="var(--grey)" stroke-width="3" fill="none"/>
<path d="M470 240 L490 260 L470 280" stroke="var(--grey)" stroke-width="3" fill="none"/>
<text class="c" x="110" y="486">Value changed sides; difficulty didn't</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左側三筆待付款疊成一根高柱共三百五十，右側互相抵銷後只剩一根很矮的柱子五十">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">先互相抵掉，再動用準備金</text>

  <rect x="60" y="92" width="400" height="368" rx="10" fill="var(--card)"/>
  <rect x="500" y="92" width="400" height="368" rx="10" fill="var(--card)"/>
  <text class="t" x="84" y="128" font-size="20" font-weight="700" fill="var(--dim)">逐筆各付各的</text>
  <text class="t" x="524" y="128" font-size="20" font-weight="700" fill="var(--dim)">配對抵銷之後</text>

  <line x1="100" y1="420" x2="420" y2="420" stroke="var(--line)" stroke-width="3"/>
  <line x1="540" y1="420" x2="860" y2="420" stroke="var(--line)" stroke-width="3"/>

  <rect x="200" y="320" width="110" height="100" fill="var(--accent)"/>
  <rect x="200" y="220" width="110" height="96" fill="var(--accent)" opacity="0.78"/>
  <rect x="200" y="166" width="110" height="50" fill="var(--accent)" opacity="0.55"/>

  <text class="t" x="326" y="196" font-size="16" fill="var(--dim)">50</text>
  <text class="t" x="326" y="272" font-size="16" fill="var(--dim)">100</text>
  <text class="t" x="326" y="376" font-size="16" fill="var(--dim)">100</text>
  <text class="t" x="176" y="448" font-size="19" font-weight="700" fill="var(--ink)">要調度 250</text>

  <rect x="640" y="390" width="110" height="30" fill="var(--accent)"/>
  <text class="t" x="766" y="412" font-size="16" fill="var(--dim)">50</text>
  <text class="t" x="616" y="448" font-size="19" font-weight="700" fill="var(--ink)">要調度 50</text>
  <text class="t" x="596" y="300" font-size="16" fill="var(--grey)">其餘互相對沖掉</text>

  <text class="t" x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">同樣的付款，少得多的準備金</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The trough of a swinging curve is marked by a horizontal dashed line as the end you imagined, while the curve keeps rising past it to the right">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .t{font-size:27px;fill:var(--ink);font-weight:700}
    .g{font-size:19px;font-weight:600}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">Low mistaken for the end</text>
<text class="b" x="60" y="88">Hard to see the ride you're on</text>
<line x1="480" y1="424" x2="900" y2="424" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 8"/>
<path d="M90 210 C 190 172 250 296 330 356 C 392 412 436 434 480 424 C 566 404 620 296 720 236 C 800 188 850 178 900 168" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
<circle cx="480" cy="424" r="8" fill="var(--warn)"/>
<text class="g" x="512" y="462" fill="var(--warn)">The end you saw</text>
<text class="g" x="760" y="212" fill="var(--accent)">Still going</text>
<text class="b" x="90" y="180">Get on</text>
<text class="c" x="60" y="510">Pain is real; you drew the end</text>
</svg>
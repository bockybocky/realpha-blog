<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Phone top left with few steps but distracting; e-reader browser bottom right with many steps but calm; dedicated page bottom left, few steps and calm; arrow pushes from bottom right to bottom left">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">The corner you want: bottom left</text>

  <rect x="200" y="100" width="640" height="340" rx="10" fill="var(--card)"/>
  <line x1="200" y1="440" x2="860" y2="440" stroke="var(--line)" stroke-width="3"/>
  <line x1="200" y1="100" x2="200" y2="440" stroke="var(--line)" stroke-width="3"/>

  <text class="t" x="520" y="486" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">Steps to reach a site</text>
  <text class="t" x="232" y="474" font-size="16" fill="var(--dim)">Few</text>
  <text class="t" x="828" y="474" font-size="16" fill="var(--dim)">Many</text>
  <text class="t" x="168" y="276" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="end">Distraction</text>
  <text class="t" x="168" y="130" font-size="16" fill="var(--dim)" text-anchor="end">High</text>
  <text class="t" x="168" y="424" font-size="16" fill="var(--dim)" text-anchor="end">Low</text>

  <circle cx="290" cy="156" r="14" fill="var(--grey)"/>
  <text class="t" x="316" y="162" font-size="19" fill="var(--ink)">Phone</text>

  <circle cx="780" cy="392" r="14" fill="var(--grey)"/>
  <text class="t" x="664" y="356" font-size="19" fill="var(--ink)">E-reader browser</text>

  <polygon points="750,384 356,384 356,366 310,393 356,420 356,402 750,402" fill="var(--grey)"/>

  <circle cx="290" cy="392" r="18" fill="var(--accent)"/>
  <text class="t" x="316" y="398" font-size="20" font-weight="700" fill="var(--ink)">Dedicated page</text>

  <text class="t" x="60" y="532" font-size="22" font-weight="700" fill="var(--ink)">Keep the upside, just move steps left</text>
</svg>
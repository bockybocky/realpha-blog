<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左格五根高低不一的柱子，右格同樣五根柱子一起向下且幅度接近，中間箭頭標示同一批槓桿帳戶被平倉">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t  { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1 { font-size:27px; font-weight:700; fill:var(--ink); }
    .lb { font-size:20px; font-weight:700; fill:var(--ink); }
    .bd { font-size:15px; fill:var(--dim); }
    .cc { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text class="t h1" x="60" y="62">分散的是產業，不是持有它們的人</text>

  <rect x="60" y="100" width="360" height="330" rx="10" fill="var(--card)"/>
  <text class="t lb" x="84" y="136">你以為的分散</text>
  <line x1="84" y1="270" x2="396" y2="270" stroke="var(--line)" stroke-width="2"/>
  <rect x="96" y="190" width="40" height="80" fill="var(--grey)"/>
  <rect x="156" y="270" width="40" height="56" fill="var(--grey)"/>
  <rect x="216" y="224" width="40" height="46" fill="var(--grey)"/>
  <rect x="276" y="270" width="40" height="30" fill="var(--grey)"/>
  <rect x="336" y="166" width="40" height="104" fill="var(--grey)"/>
  <text class="t bd" x="96" y="352">半導體</text>
  <text class="t bd" x="156" y="352">軟體</text>
  <text class="t bd" x="216" y="352">醫療</text>
  <text class="t bd" x="276" y="352">能源</text>
  <text class="t bd" x="336" y="352">消費</text>
  <text class="t bd" x="84" y="404">高低不一，方向也不同</text>

  <path d="M440 250 L520 250" stroke="var(--warn)" stroke-width="4"/>
  <path d="M520 250 l-14 -9 l0 18 z" fill="var(--warn)"/>
  <text class="t bd" x="424" y="228" fill="var(--warn)">同一批槓桿帳戶</text>
  <text class="t bd" x="424" y="292" fill="var(--warn)">被一起平倉</text>

  <rect x="540" y="100" width="360" height="330" rx="10" fill="var(--card)"/>
  <text class="t lb" x="564" y="136">清算那一天</text>
  <line x1="564" y1="190" x2="876" y2="190" stroke="var(--line)" stroke-width="2"/>
  <rect x="576" y="190" width="40" height="120" fill="var(--accent)"/>
  <rect x="636" y="190" width="40" height="132" fill="var(--accent)"/>
  <rect x="696" y="190" width="40" height="112" fill="var(--accent)"/>
  <rect x="756" y="190" width="40" height="128" fill="var(--accent)"/>
  <rect x="816" y="190" width="40" height="118" fill="var(--accent)"/>
  <text class="t bd" x="576" y="352">半導體</text>
  <text class="t bd" x="636" y="352">軟體</text>
  <text class="t bd" x="696" y="352">醫療</text>
  <text class="t bd" x="756" y="352">能源</text>
  <text class="t bd" x="816" y="352">消費</text>
  <text class="t bd" x="564" y="404">同方向，幅度接近</text>

  <text class="t cc" x="60" y="490">那一天，分散不存在</text>
  <text class="t bd" x="60" y="520">要看的不只是「這些公司做什麼」，還有「誰持有它們」</text>
</svg>
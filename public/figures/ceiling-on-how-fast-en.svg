<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Bars that grow taller each year are cut flat at a thick ceiling, and a dashed box above it shows the portion that was blocked.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">The binding constraint moved: it is now a supply-side ceiling</text>

  <rect x="120" y="178" width="100" height="40" fill="none" stroke="var(--dim)" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="260" y="150" width="100" height="68" fill="none" stroke="var(--dim)" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="400" y="124" width="100" height="94" fill="none" stroke="var(--dim)" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="d" x="540" y="140">Planned build keeps climbing</text>

  <rect x="120" y="276" width="100" height="144" fill="var(--grey)"/>
  <rect x="260" y="250" width="100" height="170" fill="var(--grey)"/>
  <rect x="400" y="228" width="100" height="192" fill="var(--accent)"/>
  <rect x="540" y="228" width="100" height="192" fill="var(--accent)"/>
  <line x1="90" y1="222" x2="900" y2="222" stroke="var(--warn)" stroke-width="8"/>
  <text class="g" x="672" y="208">Limit on what fits</text>

  <rect x="90" y="440" width="190" height="38" fill="var(--card)" stroke="var(--line)"/>
  <text class="d" x="185" y="465" text-anchor="middle">Permitting</text>
  <rect x="296" y="440" width="190" height="38" fill="var(--card)" stroke="var(--line)"/>
  <text class="d" x="391" y="465" text-anchor="middle">Interstate lines</text>
  <rect x="502" y="440" width="190" height="38" fill="var(--card)" stroke="var(--line)"/>
  <text class="d" x="597" y="465" text-anchor="middle">Transformers, wires</text>
  <rect x="708" y="440" width="190" height="38" fill="var(--card)" stroke="var(--line)"/>
  <text class="d" x="803" y="465" text-anchor="middle">Skilled labor</text>
  <text class="d" x="90" y="432">The ceiling is made of these</text>

  <text class="c" x="60" y="516">Money got cheap; interconnection did not</text>
</svg>
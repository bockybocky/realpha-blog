<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊一個只有開關兩態的撥桿，右邊一條四個刻度的橫軸，最左一格被點亮">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--dim)}
.b{font-size:16px;fill:var(--ink)}
.s{font-size:15px;fill:var(--dim)}
.sa{font-size:15px;fill:var(--accent)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
.m{font-size:15px;fill:var(--dim);text-anchor:middle}
.ma{font-size:15px;fill:var(--accent);text-anchor:middle}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="h" x="60" y="58">開關，還是刻度</text>
<rect x="60" y="94" width="360" height="286" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="88" y="136">想像中的樣子</text>
<rect x="126" y="196" width="200" height="76" rx="38" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
<circle cx="288" cy="234" r="27" fill="var(--grey)"/>
<text class="b" x="126" y="322">全停，或不停</text>
<rect x="468" y="94" width="432" height="286" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="496" y="136">真的動手的樣子</text>
<line x1="516" y1="222" x2="860" y2="222" stroke="var(--line)" stroke-width="3"/>
<circle cx="540" cy="222" r="9" fill="var(--accent)"/>
<circle cx="640" cy="222" r="9" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="740" cy="222" r="9" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<circle cx="840" cy="222" r="9" fill="var(--page)" stroke="var(--grey)" stroke-width="2"/>
<text class="ma" x="540" y="262">停供一國</text>
<text class="m" x="640" y="262">卡住轉運</text>
<text class="m" x="740" y="262">限量</text>
<text class="m" x="840" y="262">全面停</text>
<text class="ma" x="540" y="296">先動這一格</text>
<text class="c" x="60" y="450">最小的那一格，本身就是訊號</text>
</svg>
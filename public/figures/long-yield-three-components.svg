<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根堆疊柱並排，各分三段；右邊那根總高度較高，加厚的是最上面那一段">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink)}
.g{font-size:19px;fill:var(--ink)}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">同一個數字，裡面有三塊在動</text>
<text class="s" x="60" y="90">長天期公債殖利率的組成</text>
<line x1="200" y1="462" x2="700" y2="462" stroke="var(--line)" stroke-width="2"/>
<rect x="250" y="310" width="130" height="150" fill="var(--grey)"/>
<rect x="250" y="220" width="130" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="250" y="160" width="130" height="60" fill="var(--accent)"/>
<rect x="470" y="310" width="130" height="150" fill="var(--grey)"/>
<rect x="470" y="215" width="130" height="95" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="470" y="65" width="130" height="150" fill="var(--accent)"/>
<text class="s" x="315" y="492" text-anchor="middle">七月</text>
<text class="s" x="535" y="492" text-anchor="middle">現在</text>
<line x1="600" y1="390" x2="660" y2="390" stroke="var(--line)" stroke-width="2"/>
<line x1="600" y1="262" x2="660" y2="262" stroke="var(--line)" stroke-width="2"/>
<line x1="600" y1="140" x2="660" y2="140" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="672" y="396">實質利率</text>
<text class="g" x="672" y="268">通膨預期</text>
<text class="g" x="672" y="134">期限溢價</text>
<text class="s" x="672" y="158">還得出來嗎的補償</text>
<text class="c" x="60" y="530">漲的是哪一塊，決定下一步</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two equal-length percentage bars, nearly fully filled, only a thin blank sliver at the right end of each">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="60">Almost every dollar earned goes straight back out</text>

  <text class="g" x="60" y="122">2015–2025, eleven years  net income $702.7B</text>
  <rect x="140" y="142" width="700" height="64" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="140" y="142" width="644" height="64" fill="var(--accent)"/>
  <text class="s" x="140" y="232">Buybacks $643.9B  =  92% of net income</text>
  <text class="s" x="840" y="232" text-anchor="end">8% kept</text>

  <text class="g" x="60" y="302">Fiscal 2025 alone  net income $112.0B</text>
  <rect x="140" y="322" width="700" height="64" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="140" y="322" width="567" height="64" fill="var(--accent)"/>
  <rect x="707" y="322" width="98" height="64" fill="var(--accent)" opacity="0.5"/>
  <text class="s" x="140" y="412">Buybacks $90.7B</text>
  <text class="s" x="707" y="412">Div. $15.4B</text>
  <text class="s" x="840" y="412" text-anchor="end">5% kept</text>

  <text class="c" x="60" y="490">No better investment than buying itself</text>
</svg>
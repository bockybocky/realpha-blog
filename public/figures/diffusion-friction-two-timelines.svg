<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="同一條年份軸上兩條橫條，上面那條極短，下面那條橫跨十五年">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="64" font-size="27" fill="var(--ink)">新東西要多久才真的到手上</text>

  <text x="200" y="188" font-size="19" fill="var(--ink)" text-anchor="end">手機・筆電</text>
  <rect x="220" y="163" width="10" height="34" rx="3" fill="var(--accent)"/>
  <text x="250" y="188" font-size="16" fill="var(--dim)">一夜之間</text>

  <text x="200" y="298" font-size="19" fill="var(--ink)" text-anchor="end">車・機具</text>
  <rect x="220" y="273" width="680" height="34" rx="3" fill="var(--grey)"/>
  <text x="248" y="296" font-size="16" fill="var(--ink)">買了就開十年、十五年</text>

  <line x1="220" y1="360" x2="900" y2="360" stroke="var(--line)" stroke-width="2"/>
  <line x1="220" y1="354" x2="220" y2="366" stroke="var(--grey)" stroke-width="2"/>
  <line x1="447" y1="354" x2="447" y2="366" stroke="var(--grey)" stroke-width="2"/>
  <line x1="673" y1="354" x2="673" y2="366" stroke="var(--grey)" stroke-width="2"/>
  <line x1="900" y1="354" x2="900" y2="366" stroke="var(--grey)" stroke-width="2"/>
  <text x="220" y="390" font-size="15" fill="var(--dim)" text-anchor="middle">0</text>
  <text x="447" y="390" font-size="15" fill="var(--dim)" text-anchor="middle">5</text>
  <text x="673" y="390" font-size="15" fill="var(--dim)" text-anchor="middle">10</text>
  <text x="900" y="390" font-size="15" fill="var(--dim)" text-anchor="middle">15 年</text>

  <text x="480" y="462" font-size="22" fill="var(--ink)" text-anchor="middle">能力可以一夜到位，裝機量不行。</text>
</svg>
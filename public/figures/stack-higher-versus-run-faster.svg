<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊高柱與右邊矮柱的高度差約五比一，右邊柱旁是一疊多層結構">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="56" y="56" font-size="27" font-weight="700" fill="var(--ink)">疊得更高，每一層分到的就更少</text>
<rect x="80" y="120" width="140" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="192" font-size="19" font-weight="700" fill="var(--ink)">單顆晶片</text>
<rect x="260" y="200" width="100" height="240" fill="var(--accent)"/>
<text x="260" y="186" font-size="16" fill="var(--dim)">20 TB/cm²</text>
<rect x="524" y="120" width="140" height="8" fill="var(--grey)"/>
<rect x="524" y="132" width="140" height="8" fill="var(--grey)"/>
<rect x="524" y="144" width="140" height="8" fill="var(--grey)"/>
<rect x="524" y="156" width="140" height="8" fill="var(--grey)"/>
<rect x="524" y="168" width="140" height="8" fill="var(--grey)"/>
<rect x="524" y="180" width="140" height="8" fill="var(--grey)"/>
<rect x="524" y="192" width="140" height="8" fill="var(--grey)"/>
<rect x="524" y="204" width="140" height="8" fill="var(--grey)"/>
<rect x="524" y="216" width="140" height="8" fill="var(--grey)"/>
<rect x="524" y="228" width="140" height="8" fill="var(--grey)"/>
<text x="524" y="268" font-size="19" font-weight="700" fill="var(--ink)">疊 20 層</text>
<rect x="704" y="392" width="100" height="48" fill="var(--warn)"/>
<text x="704" y="378" font-size="16" fill="var(--dim)">4 TB/cm²</text>
<line x1="56" y1="440" x2="904" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="260" y="470" font-size="16" fill="var(--dim)">每平方公分頻寬</text>
<text x="704" y="470" font-size="16" fill="var(--dim)">每平方公分頻寬</text>
<text x="56" y="518" font-size="22" font-weight="700" fill="var(--ink)">容量往上疊，每 GB 頻寬往下掉</text>
</svg>
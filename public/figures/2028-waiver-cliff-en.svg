<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Russia's share edges down across a plateau from left to right, then falls vertically to nothing at 1 January 2028, forming a cliff.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="78" font-size="27" fill="var(--ink)">The 2028 cliff</text>

<line x1="60" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

<path d="M100 230 L420 230 L420 265 L660 265 L660 420" fill="none" stroke="var(--accent)" stroke-width="5"/>
<rect x="100" y="230" width="320" height="190" fill="var(--accent)" opacity="0.12"/>
<rect x="420" y="265" width="240" height="155" fill="var(--accent)" opacity="0.12"/>

<text x="140" y="212" font-size="20" fill="var(--ink)">About 25%</text>
<text x="450" y="247" font-size="20" fill="var(--ink)">About 20%</text>

<line x1="660" y1="150" x2="660" y2="440" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text x="676" y="178" font-size="20" fill="var(--warn)">2028 / 1 / 1</text>
<text x="676" y="208" font-size="16" fill="var(--warn)">Waivers expire</text>

<text x="160" y="455" font-size="16" fill="var(--dim)">2024 ban, waivable by the Secretary</text>
<text x="700" y="330" font-size="19" fill="var(--dim)">No waivers</text>

<text x="60" y="500" font-size="22" fill="var(--ink)">The fuel keeps arriving, but replacing it takes years to build</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="權重差距很大但報酬長條幾乎等長">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); }
  .g { font-size:20px; fill:var(--ink); }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">持股差很多，報酬一起好</text>

<text class="g" x="60" y="140">台積電權重</text>
<text class="b" x="300" y="168">主動式</text>
<rect x="400" y="148" width="110" height="34" rx="6" fill="var(--accent)"/>
<text class="b" x="524" y="172">10%</text>
<text class="b" x="300" y="228">被動式</text>
<rect x="400" y="208" width="420" height="34" rx="6" fill="var(--accent)"/>
<text class="b" x="834" y="232">40%</text>

<line x1="60" y1="290" x2="900" y2="290" stroke="var(--line)"/>

<text class="g" x="60" y="340">今年以來報酬</text>
<text class="b" x="300" y="368">主動式</text>
<rect x="400" y="348" width="430" height="34" rx="6" fill="var(--warn)"/>
<text class="b" x="300" y="428">被動式</text>
<rect x="400" y="408" width="440" height="34" rx="6" fill="var(--warn)"/>
<text class="b" x="400" y="470">同樣壓半導體與電子</text>

<text class="c" x="60" y="510">贏的那一段來自產業，不是選股</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A horizontal axis contains four segments whose lengths halve in sequence, labeled 8 months, 4 months, 2 months, and 1 month, with each segment ending at a doubling marker and each successive segment becoming shorter.">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">Why he says it cannot stop</text>
  <text x="60" y="104" font-size="16" fill="var(--dim)">Each doubling halves the time to the next</text>
  <line x1="60" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>
  <rect x="60" y="248" width="320" height="52" rx="6" fill="var(--accent)" opacity="0.85"/>
  <rect x="384" y="248" width="160" height="52" rx="6" fill="var(--accent)" opacity="0.7"/>
  <rect x="548" y="248" width="80" height="52" rx="6" fill="var(--accent)" opacity="0.55"/>
  <rect x="632" y="248" width="40" height="52" rx="6" fill="var(--accent)" opacity="0.4"/>
  <text x="220" y="282" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">8 months</text>
  <text x="464" y="282" font-size="19" font-weight="700" text-anchor="middle" fill="var(--page)">4</text>
  <text x="588" y="282" font-size="17" font-weight="700" text-anchor="middle" fill="var(--page)">2</text>
  <text x="652" y="282" font-size="15" font-weight="700" text-anchor="middle" fill="var(--page)">1</text>
  <text x="220" y="224" font-size="15" text-anchor="middle" fill="var(--dim)">Doubling</text>
  <text x="464" y="224" font-size="15" text-anchor="middle" fill="var(--dim)">Doubling</text>
  <text x="588" y="224" font-size="15" text-anchor="middle" fill="var(--dim)">Doubling</text>
  <text x="652" y="224" font-size="15" text-anchor="middle" fill="var(--dim)">Doubling</text>
  <text x="60" y="348" font-size="16" fill="var(--dim)">Start: humans alone—his guess is four years, conservatively eight</text>
  <text x="672" y="348" font-size="16" fill="var(--warn)">Intervals keep shrinking</text>
  <text x="60" y="440" font-size="22" font-weight="700" fill="var(--ink)">Not just speed, but acceleration accelerates</text>
</svg>
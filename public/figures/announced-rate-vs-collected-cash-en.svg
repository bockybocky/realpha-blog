<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A funnel from the announced rate to the cash actually collected: full on the left, only a narrow slit on the right, with the wedge lost in between labeled exemptions, refunds, transshipment, and under-invoicing.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" fill="var(--ink)">Rate announced vs cash collected</text>

  <rect x="170" y="140" width="640" height="290" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M170,140 L810,360 L810,430 L170,430 Z" fill="var(--accent)" opacity="0.16"/>
  <path d="M170,140 L810,360 L810,430 L170,430 Z" fill="none" stroke="var(--accent)" stroke-width="2.5"/>

  <text class="t" x="790" y="172" font-size="19" fill="var(--dim)" text-anchor="end">Leaked away</text>
  <text class="t" x="430" y="205" font-size="16" fill="var(--dim)">Exemptions</text>
  <text class="t" x="560" y="245" font-size="16" fill="var(--dim)">Refunds</text>
  <text class="t" x="668" y="285" font-size="16" fill="var(--dim)">Reroutes</text>
  <text class="t" x="762" y="322" font-size="16" fill="var(--dim)">Underreport</text>

  <text class="t" x="170" y="124" font-size="20" fill="var(--ink)">Rate table</text>
  <text class="t" x="810" y="345" font-size="20" fill="var(--ink)" text-anchor="end">Receipts</text>
  <text class="t" x="170" y="466" font-size="16" fill="var(--dim)">Nominal · 10x</text>
  <text class="t" x="810" y="466" font-size="16" fill="var(--dim)" text-anchor="end">Net · a fraction of 1%</text>

  <text class="t" x="60" y="524" font-size="22" fill="var(--ink)">Announced ≠ cash</text>
</svg>
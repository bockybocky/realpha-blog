<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two equal time bands compared: agent activity fills the top one entirely, while only a small patch of the human view below is lit">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="66" font-size="27" fill="var(--ink)">Three months, one crash seen</text>

<rect x="90" y="140" width="790" height="52" rx="10" fill="var(--accent)" opacity="0.16"/>
<rect x="90" y="140" width="790" height="52" rx="10" fill="none" stroke="var(--accent)"/>
<text x="110" y="172" font-size="19" fill="var(--accent)">Agent board</text>
<text x="860" y="172" font-size="16" fill="var(--dim)" text-anchor="end">Three months</text>

<line x1="90" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="292" x2="150" y2="308" stroke="var(--grey)" stroke-width="2"/>
<line x1="300" y1="292" x2="300" y2="308" stroke="var(--grey)" stroke-width="2"/>
<line x1="525" y1="292" x2="525" y2="308" stroke="var(--warn)" stroke-width="3"/>
<line x1="660" y1="292" x2="660" y2="308" stroke="var(--grey)" stroke-width="2"/>
<line x1="810" y1="292" x2="810" y2="308" stroke="var(--grey)" stroke-width="2"/>

<text x="150" y="270" font-size="16" fill="var(--ink)" text-anchor="middle">Channel opens</text>
<text x="300" y="270" font-size="16" fill="var(--ink)" text-anchor="middle">Out to net</text>
<text x="525" y="270" font-size="16" fill="var(--warn)" text-anchor="middle">Crash</text>
<text x="660" y="270" font-size="16" fill="var(--ink)" text-anchor="middle">Eval begins</text>
<text x="810" y="270" font-size="16" fill="var(--ink)" text-anchor="middle">3rd wave in</text>

<text x="150" y="332" font-size="15" fill="var(--dim)" text-anchor="middle">5/12</text>
<text x="300" y="332" font-size="15" fill="var(--dim)" text-anchor="middle">Late May</text>
<text x="525" y="332" font-size="15" fill="var(--dim)" text-anchor="middle">7/4</text>
<text x="660" y="332" font-size="15" fill="var(--dim)" text-anchor="middle">July</text>
<text x="810" y="332" font-size="15" fill="var(--dim)" text-anchor="middle">7/13</text>

<rect x="90" y="378" width="790" height="52" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="505" y="378" width="42" height="52" rx="8" fill="var(--warn)" opacity="0.45"/>
<text x="110" y="410" font-size="19" fill="var(--dim)">Humans saw</text>
<text x="526" y="456" font-size="16" fill="var(--warn)" text-anchor="middle">Only this bit</text>

<text x="80" y="500" font-size="22" fill="var(--ink)">Same span, two different bands</text>
</svg>
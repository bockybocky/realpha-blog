<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two horizontal bars, one short at 1.5% and one long at 10% or more.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="56" text-anchor="middle">Power bills as share of income</text>
<text class="b" x="480" y="88" text-anchor="middle">Since 2010</text>
<line x1="560" y1="130" x2="560" y2="330" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="800" y1="130" x2="800" y2="330" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="320" y1="130" x2="320" y2="330" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="300" y="185" text-anchor="end">Average household</text>
<rect x="320" y="150" width="48" height="56" fill="var(--accent)"/>
<rect x="368" y="150" width="24" height="56" fill="var(--accent)" fill-opacity="0.35"/>
<text class="g" x="404" y="185">1–1.5%</text>
<text class="g" x="300" y="285" text-anchor="end">Low / fixed income</text>
<rect x="320" y="250" width="240" height="56" fill="var(--warn)"/>
<rect x="560" y="250" width="240" height="56" fill="var(--warn)" fill-opacity="0.35"/>
<text class="g" x="812" y="285" style="fill:var(--warn)">5–10%+</text>
<text class="b" x="320" y="358" text-anchor="middle">0%</text>
<text class="b" x="560" y="358" text-anchor="middle">5%</text>
<text class="b" x="800" y="358" text-anchor="middle">10%</text>
<text class="c" x="480" y="450" text-anchor="middle">A small share on average, their grocery money</text>
</svg>
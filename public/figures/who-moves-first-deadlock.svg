<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩方互指的等待迴圈，下方十年進度條空白">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">兩邊都在等對方先動</text>

<rect x="90" y="150" width="280" height="130" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="230" y="200" font-size="20" fill="var(--ink)" text-anchor="middle">光罩廠</text>
<text x="230" y="235" font-size="16" fill="var(--dim)" text-anchor="middle">你先承諾</text>

<rect x="590" y="150" width="280" height="130" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="730" y="200" font-size="20" fill="var(--ink)" text-anchor="middle">晶片廠</text>
<text x="730" y="235" font-size="16" fill="var(--dim)" text-anchor="middle">你先投資</text>

<path d="M375 185 Q480 135 585 185" fill="none" stroke="var(--grey)" stroke-width="2.5"/>
<path d="M578 177 L590 186 L576 191 Z" fill="var(--grey)"/>
<path d="M585 248 Q480 298 375 248" fill="none" stroke="var(--grey)" stroke-width="2.5"/>
<path d="M382 240 L370 249 L384 254 Z" fill="var(--grey)"/>

<rect x="90" y="370" width="780" height="34" rx="17" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="393" font-size="16" fill="var(--dim)" text-anchor="middle">十年</text>
<text x="90" y="432" font-size="16" fill="var(--dim)">規劃</text>
<text x="870" y="432" font-size="16" fill="var(--dim)" text-anchor="end">還在原地</text>

<text x="60" y="495" font-size="22" fill="var(--ink)">這裡沒有漁夫，鷸蚌也一樣誰都走不掉</text>
</svg>
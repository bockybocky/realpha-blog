<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="第二份長約的長條是第一份的五倍高，並多出一格供應範圍含雷射">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="56" y="66">第二份，不只是變大</text>
<text class="b" x="56" y="100">單位：億美元</text>
<line x1="150" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="230" y="386" width="140" height="54" fill="var(--grey)"/>
<text class="g" x="230" y="372">10 到 15</text>
<text class="g" x="230" y="476">第一份</text>
<text class="b" x="230" y="506">只供自己用的件</text>
<rect x="600" y="200" width="140" height="240" fill="var(--accent)"/>
<rect x="600" y="152" width="140" height="44" fill="var(--warn)"/>
<text class="g" x="600" y="138">多出來的一格</text>
<text class="g" x="770" y="186" fill="var(--warn)">供應範圍含雷射</text>
<text class="g" x="770" y="330">50 到 75</text>
<text class="g" x="600" y="476">第二份</text>
<text class="b" x="600" y="506">五倍以上</text>
<text class="c" x="56" y="540">規模翻的是量，多那一格才是轉身</text>
</svg>
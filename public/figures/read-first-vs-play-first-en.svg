<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The straight process on the left stops midway, the right is a loop that keeps going round">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">When the straight line stalls, the loop keeps going</text>

<text x="60" y="128" font-size="20" fill="var(--dim)">Read the book, then act</text>
<circle cx="96" cy="230" r="12" fill="var(--grey)"/>
<line x1="108" y1="230" x2="216" y2="230" stroke="var(--grey)" stroke-width="3"/>
<circle cx="228" cy="230" r="12" fill="var(--grey)"/>
<line x1="240" y1="230" x2="330" y2="230" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
<line x1="344" y1="212" x2="376" y2="248" stroke="var(--warn)" stroke-width="4"/>
<line x1="376" y1="212" x2="344" y2="248" stroke="var(--warn)" stroke-width="4"/>
<text x="60" y="292" font-size="16" fill="var(--dim)">Read up</text>
<text x="192" y="292" font-size="16" fill="var(--dim)">Done reading</text>
<text x="320" y="300" font-size="16" fill="var(--warn)">No book to read</text>

<text x="560" y="128" font-size="20" fill="var(--dim)">Fight</text>
<circle cx="700" cy="252" r="86" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M700 166 L688 150 L712 150 Z" fill="var(--accent)"/>
<circle cx="700" cy="166" r="9" fill="var(--accent)"/>
<circle cx="786" cy="252" r="9" fill="var(--accent)"/>
<circle cx="700" cy="338" r="9" fill="var(--accent)"/>
<circle cx="614" cy="252" r="9" fill="var(--accent)"/>
<text x="672" y="146" font-size="16" fill="var(--ink)">Start</text>
<text x="806" y="258" font-size="16" fill="var(--ink)">Get killed</text>
<text x="668" y="368" font-size="16" fill="var(--ink)">Go ask</text>
<text x="512" y="258" font-size="16" fill="var(--ink)">Try again</text>

<text x="60" y="470" font-size="22" fill="var(--ink)">He is hiring the ones still going round</text>
</svg>
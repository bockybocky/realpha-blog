<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="模型從沙盒內出發，連續穿過沙盒與研究環境兩道牆，進入外面的正式環境">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<defs><marker id="f1a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="64" class="t">一路鑽出兩道牆</text>
<rect x="60" y="110" width="560" height="360" rx="18" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="86" y="148" class="g">研究環境</text>
<rect x="110" y="180" width="260" height="240" rx="14" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
<text x="134" y="214" class="g">沙盒</text>
<rect x="700" y="150" width="220" height="340" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="810" y="236" class="g" text-anchor="middle">Hugging Face</text>
<text x="810" y="266" class="b" text-anchor="middle">正式環境</text>
<line x1="238" y1="320" x2="752" y2="320" stroke="var(--accent)" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#f1a)"/>
<circle cx="210" cy="320" r="26" fill="var(--accent)"/>
<text x="210" y="375" class="b" text-anchor="middle">訓練中模型</text>
<text x="210" y="400" class="b" text-anchor="middle">防護調低</text>
<circle cx="370" cy="320" r="16" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
<circle cx="620" cy="320" r="16" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
<text x="370" y="288" class="g" text-anchor="middle" style="fill:var(--warn)">漏洞 1</text>
<text x="620" y="288" class="g" text-anchor="middle" style="fill:var(--warn)">漏洞 2</text>
<text x="480" y="530" class="c" text-anchor="middle">兩道牆，兩個漏洞</text>
</svg>
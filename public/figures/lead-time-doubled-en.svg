<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three horizontal bars grow successively longer, with the longest 2.5 times the shortest.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--dim); }
    .v { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="h" x="480" y="54" text-anchor="middle">Lead times for drilling and substrate machines</text>
<line x1="258" y1="110" x2="258" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="240" y="192" text-anchor="end">Early-year estimate</text>
<rect x="258" y="164" width="288" height="48" fill="var(--grey)"/>
<text class="v" x="562" y="196">12 months</text>
<text class="g" x="240" y="282" text-anchor="end">After the expo</text>
<rect x="258" y="254" width="576" height="48" fill="var(--accent)"/>
<text class="v" x="770" y="286" fill="var(--page)">20+ months</text>
<text class="g" x="240" y="372" text-anchor="end">Some say</text>
<rect x="258" y="344" width="720" height="48" fill="var(--warn)"/>
<text class="v" x="880" y="376" fill="var(--page)">30 months</text>
<text class="s" x="258" y="444">Same equipment, same buyers</text>
<text class="c" x="480" y="492" text-anchor="middle">Same scale, 2.5 times the wait</text>
</svg>
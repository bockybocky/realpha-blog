<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="長條的最左一小段是已通過，剩下極長的一段是白工，指向一個虛線畫的不存在檢查員">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
  <marker id="arw-f3" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M0 0 L12 6 L0 12 z" fill="var(--warn)"/>
  </marker>
</defs>
<text x="80" y="66" font-size="27" fill="var(--ink)">第一天就過關，後面幾天是白工</text>

<text x="145" y="196" font-size="16" fill="var(--accent)" text-anchor="middle">第一天</text>
<text x="540" y="196" font-size="16" fill="var(--dim)" text-anchor="middle">接下來好幾天</text>

<rect x="90" y="214" width="110" height="86" rx="8" fill="var(--accent)"/>
<text x="145" y="266" font-size="16" fill="var(--page)" text-anchor="middle">已通過</text>

<rect x="200" y="214" width="680" height="86" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text x="540" y="266" font-size="19" fill="var(--dim)" text-anchor="middle">竄改紀錄、假程式、湮滅證據</text>

<path d="M540 300 L540 358" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arw-f3)"/>

<rect x="390" y="362" width="300" height="86" rx="12" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 7"/>
<text x="540" y="398" font-size="19" fill="var(--warn)" text-anchor="middle">會查過程的檢查員</text>
<text x="540" y="426" font-size="16" fill="var(--warn)" text-anchor="middle">不存在</text>

<text x="80" y="492" font-size="22" fill="var(--ink)">力氣全花在沒有人看的地方</text>
</svg>
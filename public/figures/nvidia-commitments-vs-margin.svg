<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左右兩區：左區長條從 1190 升到 2790 億美元，右區一個點從 74% 往下斜到 71 至 72% 的區間，一升一降。"><rect x="0" y="0" width="960" height="560" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:19px;font-weight:600}.b{font-size:16px;fill:var(--dim)}.k{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}
</style>
<text x="480" y="52" text-anchor="middle" class="t">搶產能長約暴增，毛利率讓出幾點</text>
<text x="300" y="104" text-anchor="middle" class="g">採購承諾（億美元）</text>
<rect x="170" y="322" width="110" height="128" fill="var(--grey)"/>
<rect x="320" y="150" width="110" height="300" fill="var(--accent)"/>
<text x="225" y="310" text-anchor="middle" class="g">1190</text>
<text x="375" y="138" text-anchor="middle" class="g a">2790</text>
<line x1="150" y1="450" x2="560" y2="450" stroke="var(--line)" stroke-width="2"/>
<text x="225" y="478" text-anchor="middle" class="b">前一季</text>
<text x="375" y="478" text-anchor="middle" class="b">這一季</text>
<path d="M440 150 H452 V322 H440" fill="none" stroke="var(--dim)" stroke-width="2"/>
<text x="462" y="226" class="g">+1600</text>
<text x="462" y="252" class="b">多半是明後年</text>
<text x="462" y="276" class="b">記憶體預訂</text>
<line x1="600" y1="100" x2="600" y2="480" stroke="var(--line)" stroke-width="2"/>
<text x="780" y="104" text-anchor="middle" class="g">毛利率指引</text>
<line x1="670" y1="170" x2="670" y2="420" stroke="var(--dim)" stroke-width="1.5"/>
<text x="660" y="176" text-anchor="end" class="b">75%</text>
<text x="660" y="426" text-anchor="end" class="b">70%</text>
<line x1="720" y1="220" x2="860" y2="345" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="720" cy="220" r="9" fill="var(--dim)"/>
<rect x="852" y="320" width="16" height="50" rx="4" fill="var(--warn)"/>
<text x="720" y="204" text-anchor="middle" class="g">74%</text>
<text x="860" y="306" text-anchor="middle" class="g w">71～72%</text>
<text x="720" y="478" text-anchor="middle" class="b">第三季</text>
<text x="860" y="478" text-anchor="middle" class="b">第四季</text>
<text x="480" y="530" text-anchor="middle" class="k">搶到產能，付出毛利率</text>
</svg>
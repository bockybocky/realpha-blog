<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three timelines: a thin all-day band, one tall block midday, three parallel lines with one interrupted">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="480" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">A day with his countryside kit (illustrative)</text>
<text x="180" y="176" text-anchor="end" font-size="20" font-weight="700" fill="var(--ink)">Laptop</text>
<line x1="200" y1="190" x2="872" y2="190" stroke="var(--line)" stroke-width="2"/>
<rect x="200" y="166" width="672" height="24" fill="var(--accent)"/>
<text x="536" y="152" text-anchor="middle" font-size="16" fill="var(--dim)">On all day, frugal</text>
<text x="180" y="296" text-anchor="end" font-size="20" font-weight="700" fill="var(--ink)">Server</text>
<line x1="200" y1="330" x2="872" y2="330" stroke="var(--line)" stroke-width="2"/>
<rect x="508" y="230" width="84" height="100" fill="var(--accent)"/>
<text x="620" y="286" font-size="16" fill="var(--dim)">On demand</text>
<text x="180" y="406" text-anchor="end" font-size="20" font-weight="700" fill="var(--ink)">Net</text>
<line x1="200" y1="375" x2="872" y2="375" stroke="var(--accent)" stroke-width="5"/>
<line x1="200" y1="400" x2="452" y2="400" stroke="var(--accent)" stroke-width="5"/>
<line x1="564" y1="400" x2="872" y2="400" stroke="var(--accent)" stroke-width="5"/>
<line x1="200" y1="425" x2="872" y2="425" stroke="var(--accent)" stroke-width="5"/>
<text x="508" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="var(--warn)">Drop</text>
<g font-size="15" fill="var(--dim)" text-anchor="middle">
<text x="200" y="468">0h</text><text x="368" y="468">6</text><text x="536" y="468">12</text><text x="704" y="468">18</text><text x="872" y="468">24</text>
</g>
<text x="480" y="526" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">Always-on frugal, occasional beast, backups</text>
</svg>
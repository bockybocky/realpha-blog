<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同樣大小的圓，左邊整塊屬於一個人，右邊被切成六份每份小得多">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="60" font-size="27" font-weight="700" fill="var(--ink)">把看到同一件事的人放進分母</text>
  <text class="t" x="60" y="92" font-size="16" fill="var(--dim)">同一個機會，分的人不同</text>

  <circle cx="280" cy="300" r="110" fill="var(--accent)" opacity="0.85"/>
  <text class="t" x="280" y="452" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">1 個人・每人 12</text>

  <circle cx="680" cy="300" r="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <path d="M680,300 L790,300 A110,110 0 0 1 735,395.3 Z" fill="var(--accent)" opacity="0.85"/>
  <line x1="680" y1="300" x2="790" y2="300" stroke="var(--grey)" stroke-width="2"/>
  <line x1="680" y1="300" x2="735" y2="395.3" stroke="var(--grey)" stroke-width="2"/>
  <line x1="680" y1="300" x2="625" y2="395.3" stroke="var(--grey)" stroke-width="2"/>
  <line x1="680" y1="300" x2="570" y2="300" stroke="var(--grey)" stroke-width="2"/>
  <line x1="680" y1="300" x2="625" y2="204.7" stroke="var(--grey)" stroke-width="2"/>
  <line x1="680" y1="300" x2="735" y2="204.7" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="680" y="452" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">6 個人・每人 2</text>

  <text class="t" x="60" y="516" font-size="22" font-weight="700" fill="var(--ink)">圓沒變小，是分母變大了</text>
</svg>
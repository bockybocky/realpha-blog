<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A line that stays flat and low for a long stretch bends sharply upward at the far right.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="40" y="58">2,000 flat years, then up</text>
<line x1="100" y1="140" x2="100" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="106" y="416">Life expectancy 30</text>
<polyline points="100,400 760,398" fill="none" stroke="var(--grey)" stroke-width="7"/>
<path d="M760 398 Q830 380 900 170" fill="none" stroke="var(--accent)" stroke-width="8"/>
<circle cx="900" cy="170" r="9" fill="var(--accent)"/>
<line x1="760" y1="150" x2="760" y2="440" stroke="var(--ink)" stroke-width="3" stroke-dasharray="6 8"/>
<text class="g" x="596" y="140">~1800</text>
<text class="b" x="120" y="470">Year 0</text>
<text class="b" x="388" y="364">Infant, maternal death, infection</text>
<text class="b" x="640" y="200">Three pushed down</text>
<text class="b" x="640" y="226">Invest in kids</text>
<text class="b" x="640" y="252">College</text>
<text class="b" x="640" y="278">Women in the workforce</text>
<text class="b" x="640" y="304">Industrial Revolution</text>
<text class="c" x="100" y="514">Health first, then the rest</text>
</svg>
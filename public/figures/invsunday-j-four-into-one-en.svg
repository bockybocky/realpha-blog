<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Four identical blank boxes on the left converge along four lines into one large colored block on the right, showing four fragmented cup competitions merged into one event where the winner is the champion.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .n { font-size:22px; font-weight:700; fill:var(--accent); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62">Four vague champions become one</text>

  <text class="g" x="170" y="130" text-anchor="middle">Four cups</text>
  <rect x="80" y="170" width="180" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="80" y="246" width="180" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="80" y="322" width="180" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="80" y="398" width="180" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="170" y="492" text-anchor="middle">Who is the real champion?</text>

  <path d="M280 198 C420 198 440 312 560 312" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M280 274 C420 274 440 312 560 312" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M280 350 C420 350 440 312 560 312" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <path d="M280 426 C420 426 440 312 560 312" fill="none" stroke="var(--grey)" stroke-width="3"/>

  <rect x="580" y="272" width="280" height="80" rx="8" fill="var(--accent)" opacity="0.85"/>
  <text class="g" x="720" y="320" text-anchor="middle" fill="var(--page)">One event</text>
  <text class="c" x="720" y="250" text-anchor="middle">Win it, be the champion</text>
  <text class="b" x="720" y="392" text-anchor="middle">The name says it all</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三根柱子高度依序下降，最右邊最矮，上方虛線標出以為的水位，右側箭頭標出落差">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="66">三個高度不一樣</text>
<line x1="100" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="160" x2="880" y2="160" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="880" y="150" text-anchor="end">以為的水位</text>
<rect x="140" y="160" width="120" height="260" fill="var(--card)" stroke="var(--line)"/>
<rect x="400" y="190" width="120" height="230" fill="var(--card)" stroke="var(--line)"/>
<rect x="660" y="300" width="120" height="120" fill="var(--accent)"/>
<line x1="820" y1="162" x2="820" y2="298" stroke="var(--warn)" stroke-width="3"/>
<polygon points="814,172 826,172 820,160" fill="var(--warn)"/>
<polygon points="814,288 826,288 820,300" fill="var(--warn)"/>
<text class="g" x="838" y="238" style="fill:var(--warn)">落差</text>
<text class="g" x="200" y="452" text-anchor="middle">腦中的自己</text>
<text class="g" x="460" y="452" text-anchor="middle">鏡子裡</text>
<text class="g" x="720" y="452" text-anchor="middle">真的跑起來</text>
<text class="c" x="60" y="496">差距只在真的跑起來時才看得到</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A nearly invisible dot sits inside a huge square, showing a roughly 2,500-fold gap between the acquisition price and annual revenue.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="58">One deal at the top of the fiber bubble</text>
<rect x="80" y="110" width="320" height="320" fill="var(--grey)"/>
<text class="g" x="80" y="96">Price: $40B</text>
<text class="d" x="80" y="460">Mostly paid in stock</text>
<rect x="232" y="262" width="7" height="7" fill="var(--warn)"/>
<line x1="239" y1="266" x2="470" y2="266" stroke="var(--warn)" stroke-width="2"/>
<text class="g" x="484" y="258">Revenue: $16M/yr</text>
<text class="d" x="484" y="286">That's the dot</text>
<text class="c" x="484" y="370">Area gap: ~2,500×</text>
<text class="d" x="484" y="404">Also then: $10B cap, $100M revenue</text>
<text class="d" x="484" y="432">The ones that later collapsed aren't on this chart</text>
</svg>
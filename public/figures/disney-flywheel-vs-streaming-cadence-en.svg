<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two timelines of equal length: the upper has four widely spaced large circles, the lower has two dozen tightly packed small dots, showing one company asked to keep two cadences at once.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="58">Two cadences, one company</text>

  <rect x="40" y="110" width="880" height="140" rx="10" fill="var(--card)"/>
  <text class="g" x="70" y="152">Flywheel</text>
  <text class="b" x="70" y="178">Rarely</text>
  <text class="b" x="70" y="200">Excellent every time</text>
  <line x1="250" y1="190" x2="900" y2="190" stroke="var(--line)" stroke-width="2"/>
  <circle cx="290" cy="190" r="30" fill="var(--accent)"/>
  <circle cx="470" cy="190" r="30" fill="var(--accent)"/>
  <circle cx="660" cy="190" r="30" fill="var(--accent)"/>
  <circle cx="860" cy="190" r="30" fill="var(--accent)"/>

  <rect x="40" y="280" width="880" height="140" rx="10" fill="var(--card)"/>
  <text class="g" x="70" y="322">Streaming</text>
  <text class="b" x="70" y="348">Something new every time</text>
  <text class="b" x="70" y="370">Not new enough, they leave</text>
  <line x1="250" y1="360" x2="900" y2="360" stroke="var(--line)" stroke-width="2"/>
  <circle cx="268" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="298" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="328" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="358" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="388" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="418" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="448" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="478" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="508" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="538" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="568" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="598" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="628" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="658" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="688" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="718" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="748" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="778" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="808" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="838" cy="360" r="8" fill="var(--grey)"/>
  <circle cx="868" cy="360" r="8" fill="var(--grey)"/>

  <text class="c" x="60" y="475">Scarcity cannot carry frequency</text>
</svg>
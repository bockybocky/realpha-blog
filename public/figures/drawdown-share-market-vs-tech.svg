<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條水平比例條：全市場約三分之二，科技股接近全滿">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="80">今年曾跌掉兩成的成分股比例</text>
<text class="b" x="60" y="112">標普 500，2026 年內</text>

<text class="g" x="60" y="196">全市場</text>
<rect x="230" y="168" width="620" height="48" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="230" y="168" width="413" height="48" rx="6" fill="var(--accent)"/>
<text class="g" x="660" y="200" fill="var(--accent)">三分之二</text>
<text class="b" x="230" y="246">落在歷史平均附近</text>

<text class="g" x="60" y="336">其中科技股</text>
<rect x="230" y="308" width="620" height="48" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="230" y="308" width="577" height="48" rx="6" fill="var(--warn)"/>
<text class="g" x="818" y="340" fill="var(--warn)">93%</text>
<text class="b" x="230" y="386">沒進過空頭的只有五檔</text>

<line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="60" y="476">常態的是市場，偏掉的是你那一格</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="左邊五個小方塊，右邊一個面積四倍的大方塊" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">「已經很大」的尺度會被換掉</text>

<text x="60" y="110" font-size="19" fill="var(--dim)">2011 前五大　合計</text>
<rect x="60" y="130" width="66" height="66" fill="var(--grey)"/>
<rect x="60" y="206" width="66" height="66" fill="var(--grey)"/>
<rect x="60" y="282" width="66" height="66" fill="var(--grey)"/>
<rect x="60" y="358" width="66" height="66" fill="var(--grey)"/>
<rect x="60" y="434" width="66" height="66" fill="var(--grey)"/>
<text x="140" y="170" font-size="16" fill="var(--ink)">Apple</text>
<text x="140" y="246" font-size="16" fill="var(--ink)">Exxon</text>
<text x="140" y="322" font-size="16" fill="var(--ink)">Microsoft</text>
<text x="140" y="398" font-size="16" fill="var(--ink)">IBM</text>
<text x="140" y="474" font-size="16" fill="var(--ink)">Walmart</text>

<rect x="440" y="130" width="370" height="370" fill="var(--accent)"/>
<text x="625" y="326" font-size="20" fill="var(--page)" text-anchor="middle">Nvidia 一家</text>
<text x="625" y="110" font-size="19" fill="var(--accent)" text-anchor="middle">2026　面積四倍</text>

<text x="60" y="560" font-size="22" fill="var(--ink)">當年覺得誇張的數字，後來是基準線</text>
<text x="60" y="588" font-size="15" fill="var(--dim)">方塊面積按市值比例，非實際排名順序</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The three-tier funnel on the left goes from wide to narrow, showing a claim shrinking each paragraph you read on; the block on the right has clear edges and stops shrinking, standing for a verifiable case">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.g { font-size:19px; font-weight:700; fill:var(--dim); }
.b { font-size:16px; }
.n { font-size:20px; font-weight:700; }
.c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="70" y="62">Two claims</text>
<text class="g" x="80" y="120">Headline</text>
<polygon points="80,150 460,150 410,230 130,230" fill="var(--warn)" opacity="0.75"/>
<text class="b" x="270" y="197" text-anchor="middle" fill="var(--page)">Saves 80–90%</text>
<polygon points="130,240 410,240 355,320 185,320" fill="var(--warn)" opacity="0.5"/>
<text class="b" x="270" y="287" text-anchor="middle" fill="var(--ink)">Some features</text>
<polygon points="185,330 355,330 305,410 235,410" fill="var(--warn)" opacity="0.28"/>
<text class="b" x="270" y="377" text-anchor="middle" fill="var(--ink)">1 of 1,000 flows</text>
<text class="b" x="80" y="448" fill="var(--dim)">Read on, it narrows</text>
<text class="g" x="530" y="120">Granular claim</text>
<rect x="530" y="150" width="370" height="260" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="n" x="560" y="205" fill="var(--accent)">45% of calls</text>
<text class="b" x="560" y="248" fill="var(--ink)">Closed, no human</text>
<text class="b" x="560" y="288" fill="var(--dim)">Base: last qtr</text>
<text class="b" x="560" y="322" fill="var(--dim)">Numbers: CEO cash flow, cost</text>
<text class="b" x="560" y="362" fill="var(--warn)">Cost: open-source models</text>
<text class="c" x="70" y="510">Too big to refute, or checkable</text>
</svg>
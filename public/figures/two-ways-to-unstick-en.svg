<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A gap between guidance and capability on the left, and fewer people in the car after a shakeout on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="60">To move it, change who is aboard</text>
<line x1="480" y1="95" x2="480" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="g" x="70" y="130">Path 1 | Guide low, beat</text>
<line x1="100" y1="420" x2="430" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="140" y="270" width="90" height="150" fill="var(--grey)"/>
<rect x="290" y="230" width="90" height="190" fill="var(--accent)"/>
<text class="n" x="150" y="258">Guided 75</text>
<text class="n" x="300" y="218">Capable 90</text>
<line x1="235" y1="270" x2="285" y2="270" stroke="var(--dim)" stroke-width="2"/>
<line x1="235" y1="230" x2="285" y2="230" stroke="var(--dim)" stroke-width="2"/>
<line x1="260" y1="270" x2="260" y2="230" stroke="var(--dim)" stroke-width="2"/>
<text class="n" x="120" y="448">This band is the room to beat</text>
<text class="g" x="530" y="130">Path 2 | Shakeout</text>
<rect x="520" y="200" width="150" height="100" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g fill="var(--grey)">
<circle cx="550" cy="232" r="9"/><circle cx="580" cy="232" r="9"/><circle cx="610" cy="232" r="9"/><circle cx="640" cy="232" r="9"/>
<circle cx="565" cy="270" r="9"/><circle cx="595" cy="270" r="9"/><circle cx="625" cy="270" r="9"/>
</g>
<text class="n" x="520" y="330">7 aboard</text>
<path d="M690 250 L750 250" stroke="var(--warn)" stroke-width="4"/>
<path d="M750 240 L768 250 L750 260 Z" fill="var(--warn)"/>
<text class="n" x="690" y="230" fill="var(--warn)">Selloff</text>
<rect x="780" y="200" width="110" height="100" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<g fill="var(--accent)">
<circle cx="810" cy="250" r="9"/><circle cx="840" cy="250" r="9"/><circle cx="870" cy="250" r="9"/>
</g>
<text class="n" x="780" y="330">3 left</text>
<text class="c" x="480" y="520" text-anchor="middle">The numbers didn't improve; the holders changed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Distance loss is 250,000x, gain gives back 6,300x, and 40x still remains.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .g { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="48" y="62" font-size="27" font-weight="700">Gain applied, gap remains</text>
  <text class="g" x="48" y="92" font-size="15">Y axis is logarithmic</text>

  <line x1="140" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>

  <rect x="190" y="84" width="130" height="386" rx="6" fill="var(--grey)"/>
  <text class="t" x="190" y="68" font-size="20" font-weight="700">250,000x</text>
  <text class="g" x="190" y="500" font-size="16">Distance loss</text>
  <text class="g" x="190" y="524" font-size="15">1 km vs 500 km</text>

  <rect x="420" y="198" width="130" height="272" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="420" y="182" font-size="20" font-weight="700">6,300x</text>
  <text class="g" x="420" y="500" font-size="16">Satellite antenna gain</text>
  <text class="g" x="420" y="524" font-size="15">Gives back</text>

  <rect x="650" y="358" width="130" height="112" rx="6" fill="var(--accent)"/>
  <text class="t" x="650" y="342" font-size="20" font-weight="700" fill="var(--accent)">40x</text>
  <text class="g" x="650" y="500" font-size="16">Still left</text>

  <path d="M330 150 L410 150" stroke="var(--dim)" stroke-width="3"/>
  <path d="M560 300 L640 300" stroke="var(--dim)" stroke-width="3"/>

  <text class="t" x="48" y="548" font-size="22" font-weight="700" fill="var(--warn)">Ground towers apply gain too</text>
</svg>
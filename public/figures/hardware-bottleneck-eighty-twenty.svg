<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="窄瓶頸往下分成兩股，一股是整塊實心大方塊，一股是散落的小方格">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .l { font-size:15px; fill:var(--dim); }
    .n { font-size:20px; font-weight:700; fill:var(--accent); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">過不去的那個口</text>
<text class="s" x="60" y="88">硬體、電力、晶片、材料</text>
<path d="M140 130 L820 130 L600 220 L360 220 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="400" y="186">真正的限制</text>
<path d="M400 230 L300 280" stroke="var(--line)" stroke-width="2"/>
<path d="M560 230 L700 280" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="290" width="420" height="180" rx="10" fill="var(--accent)"/>
<text class="g" x="128" y="350" fill="var(--page)">大型供應商</text>
<text class="n" x="128" y="330">八成</text>
<rect x="580" y="290" width="300" height="180" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="604" y="330" width="34" height="34" rx="5" fill="var(--grey)"/>
<rect x="668" y="356" width="34" height="34" rx="5" fill="var(--grey)"/>
<rect x="736" y="322" width="34" height="34" rx="5" fill="var(--grey)"/>
<rect x="812" y="348" width="34" height="34" rx="5" fill="var(--grey)"/>
<rect x="628" y="404" width="34" height="34" rx="5" fill="var(--grey)"/>
<rect x="716" y="412" width="34" height="34" rx="5" fill="var(--grey)"/>
<rect x="794" y="408" width="34" height="34" rx="5" fill="var(--grey)"/>
<text class="n" x="604" y="314">兩成</text>
<text class="l" x="664" y="314">農場雞舍裡的 GPU</text>
<text class="c" x="100" y="520">兩成也大到夠養一群零散的人</text>
</svg>
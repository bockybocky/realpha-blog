<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="零到百分之百的數軸，兩個估計都落在五成分界線的右側">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="40" y="58">兩個算法，夾出同一個方向</text>
<rect x="120" y="270" width="760" height="40" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="500" y1="236" x2="500" y2="344" stroke="var(--ink)" stroke-width="4"/>
<text class="g" x="452" y="226">五成</text>
<text class="b" x="120" y="368">0%</text>
<text class="b" x="840" y="368">100%</text>
<rect x="500" y="270" width="380" height="40" fill="var(--accent)" opacity="0.14"/>
<line x1="690" y1="150" x2="690" y2="264" stroke="var(--accent)" stroke-width="4"/>
<polygon points="690,270 712,240 668,240" fill="var(--accent)"/>
<text class="g" x="616" y="140">75%</text>
<text class="b" x="560" y="112">由下往上：過重或肥胖，臨床符合資格</text>
<line x1="788" y1="420" x2="788" y2="318" stroke="var(--accent)" stroke-width="4"/>
<polygon points="788,312 810,342 766,342" fill="var(--accent)"/>
<text class="g" x="744" y="452">約 88%</text>
<text class="b" x="470" y="484">由上往下：代謝健康的只有 10% 到 12%，其餘都不健康</text>
</svg>
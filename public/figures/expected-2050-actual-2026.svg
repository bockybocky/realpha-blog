<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="年份軸左端一個實心點、右端一個空心點，兩者之間用長括弧標出二十四年的距離">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">預期落在哪一年，實際落在哪一年</text>
<line x1="120" y1="300" x2="880" y2="300" stroke="var(--line)" stroke-width="3"/>
<circle cx="150" cy="300" r="13" fill="var(--accent)"/>
<circle cx="850" cy="300" r="13" fill="var(--page)" stroke="var(--grey)" stroke-width="4"/>
<line x1="150" y1="300" x2="150" y2="250" stroke="var(--accent)" stroke-width="2"/>
<line x1="850" y1="300" x2="850" y2="250" stroke="var(--grey)" stroke-width="2"/>
<text x="150" y="232" font-size="20" fill="var(--accent)">實際：宣布證完</text>
<text x="850" y="232" font-size="20" fill="var(--dim)" text-anchor="end">預期：也許取得一些進展</text>
<text x="150" y="340" font-size="19" fill="var(--ink)">2026</text>
<text x="850" y="340" font-size="19" fill="var(--dim)" text-anchor="end">2050</text>
<path d="M150,380 L150,400 L850,400 L850,380" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text x="500" y="432" font-size="22" fill="var(--ink)" text-anchor="middle">提早二十四年</text>
<text x="480" y="486" font-size="22" fill="var(--ink)" text-anchor="middle">最懂這題的人，把時程押在軸的另一端</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條平行時間軸上的方塊完全錯開，資源壓在遠期窗口，需求窗口在近期" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <text x="60" y="56" font-size="27" fill="var(--ink)">技術對，時間窗錯開</text>

  <text x="60" y="140" font-size="19" fill="var(--ink)">它把資源壓在這裡</text>
  <line x1="60" y1="200" x2="900" y2="200" stroke="var(--line)" stroke-width="3"/>
  <rect x="700" y="166" width="200" height="68" rx="8" fill="var(--warn)"/>
  <text x="716" y="196" font-size="16" fill="var(--page)">客製共同封裝</text>
  <text x="716" y="220" font-size="16" fill="var(--page)">被推遲到 2028</text>

  <text x="60" y="300" font-size="19" fill="var(--ink)">別人正在收割的窗口</text>
  <line x1="60" y1="360" x2="900" y2="360" stroke="var(--line)" stroke-width="3"/>
  <rect x="200" y="326" width="330" height="68" rx="8" fill="var(--accent)"/>
  <text x="216" y="368" font-size="16" fill="var(--page)">可插拔模組的部署窗口</text>
  <line x1="560" y1="326" x2="560" y2="394" stroke="var(--ink)" stroke-width="3"/>
  <text x="574" y="356" font-size="16" fill="var(--ink)">2025 第三季才轉向</text>
  <text x="574" y="382" font-size="16" fill="var(--dim)">接了七家客戶</text>

  <text x="60" y="440" font-size="16" fill="var(--dim)">時間往右</text>
  <polygon points="200,434 180,424 180,444" fill="var(--grey)"/>

  <text x="60" y="506" font-size="22" fill="var(--ink)">兩個方塊沒有重疊，收成就落在別人手上。</text>
</svg>
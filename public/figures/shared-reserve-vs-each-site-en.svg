<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The left side shares one pool of reserve while the right side keeps a block per site across six sites, and the right side's total reserve area is far larger.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="48" y="54" font-size="27" fill="var(--ink)">Reserve: one shared pool, or a block each</text>
<text x="70" y="112" font-size="20" fill="var(--ink)">One shared pool</text>
<rect x="70" y="140" width="330" height="70" rx="6" fill="var(--warn)" opacity="0.55"/>
<text x="90" y="184" font-size="16" fill="var(--ink)">Reserve</text>
<rect x="70" y="220" width="60" height="200" fill="var(--accent)"/>
<rect x="140" y="220" width="60" height="200" fill="var(--accent)"/>
<rect x="210" y="220" width="60" height="200" fill="var(--accent)"/>
<rect x="280" y="220" width="60" height="200" fill="var(--accent)"/>
<rect x="350" y="220" width="50" height="200" fill="var(--accent)"/>
<line x1="70" y1="420" x2="400" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="70" y="452" font-size="16" fill="var(--dim)">Thousands of loads share one pool</text>
<text x="560" y="112" font-size="20" fill="var(--ink)">Built per site</text>
<rect x="560" y="140" width="50" height="80" fill="var(--warn)" opacity="0.55"/>
<rect x="560" y="220" width="50" height="200" fill="var(--accent)"/>
<rect x="625" y="140" width="50" height="80" fill="var(--warn)" opacity="0.55"/>
<rect x="625" y="220" width="50" height="200" fill="var(--accent)"/>
<rect x="690" y="140" width="50" height="80" fill="var(--warn)" opacity="0.55"/>
<rect x="690" y="220" width="50" height="200" fill="var(--accent)"/>
<rect x="755" y="140" width="50" height="80" fill="var(--warn)" opacity="0.55"/>
<rect x="755" y="220" width="50" height="200" fill="var(--accent)"/>
<rect x="820" y="140" width="50" height="80" fill="var(--warn)" opacity="0.55"/>
<rect x="820" y="220" width="50" height="200" fill="var(--accent)"/>
<line x1="560" y1="420" x2="870" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="560" y="452" font-size="16" fill="var(--dim)">Each site overbuilds to four nines</text>
<text x="48" y="512" font-size="22" fill="var(--ink)">How much sits idle in total, this episode never adds up</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Five bars drop from the same baseline, with hugely different lengths.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="66" font-size="27" fill="var(--ink)">No place to hide</text>
<line x1="60" y1="130" x2="900" y2="130" stroke="var(--line)" stroke-width="3"/>
<text x="128" y="114" font-size="15" fill="var(--dim)" text-anchor="middle">Millennium</text>
<rect x="80" y="130" width="96" height="22" fill="var(--accent)"/>
<text x="128" y="182" font-size="16" fill="var(--ink)" text-anchor="middle">-2.3%</text>
<text x="298" y="114" font-size="15" fill="var(--dim)" text-anchor="middle">Rokos</text>
<rect x="250" y="130" width="96" height="48" fill="var(--grey)"/>
<text x="298" y="208" font-size="16" fill="var(--ink)" text-anchor="middle">~5%</text>
<text x="468" y="114" font-size="15" fill="var(--dim)" text-anchor="middle">Macro fund</text>
<rect x="420" y="130" width="96" height="62" fill="var(--grey)"/>
<text x="468" y="222" font-size="16" fill="var(--ink)" text-anchor="middle">6.4%</text>
<text x="638" y="114" font-size="15" fill="var(--dim)" text-anchor="middle">Whale Rock</text>
<rect x="590" y="130" width="96" height="116" fill="var(--grey)"/>
<text x="638" y="276" font-size="16" fill="var(--ink)" text-anchor="middle">12%</text>
<text x="808" y="114" font-size="15" fill="var(--dim)" text-anchor="middle">AI-heavy fund</text>
<rect x="760" y="130" width="96" height="320" fill="var(--grey)"/>
<text x="808" y="480" font-size="16" fill="var(--ink)" text-anchor="middle">33%</text>
<text x="60" y="540" font-size="22" fill="var(--ink)">Same month: -2.3% to -33%</text>
</svg>
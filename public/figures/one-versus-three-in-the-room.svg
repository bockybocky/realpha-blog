<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩張會議桌，左桌一個藍點、右桌三個藍點，其餘皆為灰點">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="70" y="58" font-size="27" fill="var(--ink)">差別只在人數</text>

<text x="260" y="118" font-size="20" fill="var(--dim)" text-anchor="middle">一個</text>
<rect x="70" y="140" width="380" height="270" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="140" y="235" width="240" height="80" rx="40" fill="var(--page)" stroke="var(--line)"/>
<circle cx="170" cy="200" r="16" fill="var(--grey)"/>
<circle cx="230" cy="200" r="16" fill="var(--grey)"/>
<circle cx="290" cy="200" r="16" fill="var(--accent)"/>
<circle cx="350" cy="200" r="16" fill="var(--grey)"/>
<circle cx="170" cy="350" r="16" fill="var(--grey)"/>
<circle cx="230" cy="350" r="16" fill="var(--grey)"/>
<circle cx="290" cy="350" r="16" fill="var(--grey)"/>
<circle cx="350" cy="350" r="16" fill="var(--grey)"/>
<text x="260" y="450" font-size="19" fill="var(--dim)" text-anchor="middle">她講的話＝代表一整類人</text>

<text x="700" y="118" font-size="20" fill="var(--accent)" text-anchor="middle">三個</text>
<rect x="510" y="140" width="380" height="270" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="580" y="235" width="240" height="80" rx="40" fill="var(--page)" stroke="var(--line)"/>
<circle cx="610" cy="200" r="16" fill="var(--accent)"/>
<circle cx="670" cy="200" r="16" fill="var(--grey)"/>
<circle cx="730" cy="200" r="16" fill="var(--accent)"/>
<circle cx="790" cy="200" r="16" fill="var(--grey)"/>
<circle cx="610" cy="350" r="16" fill="var(--grey)"/>
<circle cx="670" cy="350" r="16" fill="var(--accent)"/>
<circle cx="730" cy="350" r="16" fill="var(--grey)"/>
<circle cx="790" cy="350" r="16" fill="var(--grey)"/>
<text x="700" y="450" font-size="19" fill="var(--accent)" text-anchor="middle">她講的話＝她的意見</text>

<text x="70" y="515" font-size="22" fill="var(--ink)">數量本身就是一個變數</text>
</svg>
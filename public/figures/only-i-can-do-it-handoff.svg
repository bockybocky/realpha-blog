<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左格一個人配虛線步驟框，右格兩個人之間有實線箭頭與實線步驟框">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">只有我會做，到有人會做</text>
<line x1="480" y1="100" x2="480" y2="430" stroke="var(--line)" stroke-width="2"/>
<text x="90" y="134" font-size="20" fill="var(--dim)">之前</text>
<text x="530" y="134" font-size="20" fill="var(--dim)">之後</text>
<circle cx="250" cy="330" r="34" fill="var(--grey)"/>
<rect x="150" y="180" width="200" height="80" rx="8" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="250" y="214" font-size="19" fill="var(--dim)" text-anchor="middle">步驟只在</text>
<text x="250" y="242" font-size="19" fill="var(--dim)" text-anchor="middle">我腦子裡</text>
<line x1="250" y1="296" x2="250" y2="266" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="640" cy="330" r="34" fill="var(--accent)"/>
<circle cx="820" cy="330" r="34" fill="var(--accent)"/>
<line x1="678" y1="330" x2="770" y2="330" stroke="var(--accent)" stroke-width="4"/>
<polygon points="786,330 760,320 760,340" fill="var(--accent)"/>
<rect x="630" y="180" width="200" height="80" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="730" y="214" font-size="19" fill="var(--ink)" text-anchor="middle">步驟寫成</text>
<text x="730" y="242" font-size="19" fill="var(--ink)" text-anchor="middle">看得懂的順序</text>
<line x1="730" y1="296" x2="730" y2="266" stroke="var(--accent)" stroke-width="2"/>
<text x="60" y="490" font-size="22" fill="var(--ink)">他卡住的地方，就是你沒寫出來的那一段</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A dashed bar shows the market pricing in 50%, a solid bar shows 30% actually delivered, and the difference between their tops is labeled as the gap.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); font-size:16px; }
</style>
<text x="480" y="52" text-anchor="middle" style="font-size:27px;font-weight:700">Beat, stock fell</text>
<line x1="220" y1="440" x2="760" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="300" y="140" width="150" height="300" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 7"/>
<rect x="510" y="260" width="150" height="180" rx="6" fill="var(--accent)"/>
<text x="585" y="305" text-anchor="middle" style="font-size:19px;fill:var(--page);font-weight:700">Good!</text>
<line x1="450" y1="140" x2="690" y2="140" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="700" y1="140" x2="700" y2="260" stroke="var(--warn)" stroke-width="3"/>
<line x1="692" y1="140" x2="708" y2="140" stroke="var(--warn)" stroke-width="3"/>
<line x1="692" y1="260" x2="708" y2="260" stroke="var(--warn)" stroke-width="3"/>
<text x="718" y="198" style="font-size:20px;fill:var(--warn);font-weight:700">Gap</text>
<text x="718" y="224" style="font-size:16px;fill:var(--warn)">-20pt</text>
<text x="375" y="474" text-anchor="middle" style="font-size:19px">Priced in 50%</text>
<text x="585" y="474" text-anchor="middle" style="font-size:19px">Delivered 30%</text>
<text x="480" y="530" text-anchor="middle" style="font-size:22px;font-weight:700">Check hopes first</text>
</svg>
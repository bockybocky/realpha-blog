<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="兩格折線對比：建設先到則單價攤薄，負載先到則成本上升">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="60" y="58">同一筆新增用電，兩種結局</text>
<text class="b" x="60" y="88">分水嶺是節奏</text>

<rect x="60" y="115" width="840" height="190" fill="var(--card)" stroke="var(--line)"/>
<polyline points="110,280 260,230 420,170 600,145" fill="none" stroke="var(--accent)" stroke-width="3"/>
<polyline points="110,290 260,262 420,228 600,205" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>
<text class="b" x="612" y="150" fill="var(--accent)">建設</text>
<text class="b" x="612" y="210" fill="var(--dim)">負載</text>
<text class="g" x="700" y="215" fill="var(--accent)">單價攤薄</text>

<rect x="60" y="330" width="840" height="190" fill="var(--card)" stroke="var(--line)"/>
<polyline points="110,495 260,470 420,440 600,420" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>
<polyline points="110,490 260,430 420,380 600,358" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="612" y="363" fill="var(--warn)">負載</text>
<text class="b" x="612" y="425" fill="var(--dim)">建設</text>
<text class="g" x="700" y="430" fill="var(--warn)">成本推手</text>

<text class="c" x="60" y="568">電氣化最難猜的就是節奏</text>
</svg>
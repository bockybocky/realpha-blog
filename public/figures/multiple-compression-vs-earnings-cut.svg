<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="上下兩排各一高一矮兩根柱子，兩排矮柱總高度相同，但上排被削掉的是代表倍數的上層、下排被削掉的是代表盈餘的下層" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="620" fill="var(--page)"/>

  <text x="60" y="52" font-size="27" fill="var(--ink)" font-weight="700">一樣的跌幅，兩種命運</text>

  <rect x="640" y="30" width="18" height="18" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)"/>
  <text x="666" y="45" font-size="15" fill="var(--dim)">倍數</text>
  <rect x="740" y="30" width="18" height="18" fill="var(--accent)"/>
  <text x="766" y="45" font-size="15" fill="var(--dim)">盈餘</text>

  <line x1="60" y1="270" x2="900" y2="270" stroke="var(--line)" stroke-width="2"/>
  <rect x="180" y="90" width="110" height="100" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)"/>
  <rect x="180" y="190" width="110" height="80" fill="var(--accent)"/>
  <text x="196" y="294" font-size="15" fill="var(--dim)">原本</text>

  <rect x="400" y="150" width="110" height="40" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)"/>
  <rect x="400" y="190" width="110" height="80" fill="var(--accent)"/>
  <text x="416" y="294" font-size="15" fill="var(--dim)">現在</text>

  <line x1="310" y1="180" x2="380" y2="180" stroke="var(--dim)" stroke-width="3"/>
  <line x1="380" y1="180" x2="366" y2="172" stroke="var(--dim)" stroke-width="3"/>
  <line x1="380" y1="180" x2="366" y2="188" stroke="var(--dim)" stroke-width="3"/>

  <text x="560" y="152" font-size="20" fill="var(--accent)" font-weight="700">倍數被壓，盈餘沒動</text>
  <text x="560" y="182" font-size="16" fill="var(--dim)">財報轉佳、漲價信不斷</text>
  <text x="560" y="212" font-size="16" fill="var(--ink)" font-weight="700">機會</text>

  <line x1="60" y1="310" x2="900" y2="310" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="180" y="320" width="110" height="100" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)"/>
  <rect x="180" y="420" width="110" height="80" fill="var(--accent)"/>
  <text x="196" y="524" font-size="15" fill="var(--dim)">原本</text>

  <rect x="400" y="380" width="110" height="100" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)"/>
  <rect x="400" y="480" width="110" height="20" fill="var(--warn)"/>
  <text x="416" y="524" font-size="15" fill="var(--dim)">現在</text>

  <line x1="310" y1="410" x2="380" y2="410" stroke="var(--dim)" stroke-width="3"/>
  <line x1="380" y1="410" x2="366" y2="402" stroke="var(--dim)" stroke-width="3"/>
  <line x1="380" y1="410" x2="366" y2="418" stroke="var(--dim)" stroke-width="3"/>

  <text x="560" y="382" font-size="20" fill="var(--warn)" font-weight="700">盈餘被砍，倍數沒動</text>
  <text x="560" y="412" font-size="16" fill="var(--dim)">財測下修、客戶砍單、庫存暴增</text>
  <text x="560" y="442" font-size="16" fill="var(--ink)" font-weight="700">陷阱</text>

  <text x="60" y="574" font-size="22" fill="var(--ink)" font-weight="700">盤面上一樣紅，被削掉的那一塊卻不同</text>
  <text x="60" y="600" font-size="15" fill="var(--dim)">柱高為示意，非實際數據</text>
</svg>
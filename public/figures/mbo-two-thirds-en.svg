<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The tendered shares stop short of the two-thirds threshold and cross it only after Dalton’s roughly 10% is added.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="58" font-size="27" fill="var(--ink)">The Missing 10%</text>

  <rect x="140" y="200" width="700" height="60" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="140" y="200" width="460" height="60" rx="6" fill="var(--grey)"/>
  <rect x="600" y="200" width="112" height="60" fill="var(--accent)"/>

  <text x="370" y="238" font-size="19" fill="var(--page)" text-anchor="middle">Tendered Shares</text>
  <text x="656" y="238" font-size="16" fill="var(--page)" text-anchor="middle">Dalton ≈10%</text>

  <line x1="627" y1="160" x2="627" y2="300" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="627" y="146" font-size="19" fill="var(--warn)" text-anchor="middle">Legal Two-Thirds</text>

  <text x="370" y="330" font-size="16" fill="var(--dim)" text-anchor="middle">Other funds reject the low price</text>
  <text x="760" y="330" font-size="16" fill="var(--accent)" text-anchor="middle">Market Turns: It Passes</text>

  <text x="480" y="452" font-size="22" fill="var(--ink)" text-anchor="middle">The hand once most like an enemy was the one that crossed the threshold</text>
</svg>
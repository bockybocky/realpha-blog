<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條長路要經過三道關卡，另一條弧線直接從起點抄到終點，繞過全部三道">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型 */
</style></defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">中間那三道</text>
<rect x="60" y="112" width="150" height="90" fill="var(--card)" rx="10" stroke="var(--line)" stroke-width="2"/>
<text x="135" y="164" font-size="20" fill="var(--ink)" text-anchor="middle">我常用</text>
<rect x="256" y="112" width="150" height="90" fill="var(--card)" rx="10" stroke="var(--accent)" stroke-width="2"/>
<text x="331" y="152" font-size="18" fill="var(--ink)" text-anchor="middle">別人也在</text>
<text x="331" y="178" font-size="18" fill="var(--ink)" text-anchor="middle">用得更多</text>
<rect x="452" y="112" width="150" height="90" fill="var(--card)" rx="10" stroke="var(--accent)" stroke-width="2"/>
<text x="527" y="152" font-size="18" fill="var(--ink)" text-anchor="middle">用量變成</text>
<text x="527" y="178" font-size="18" fill="var(--ink)" text-anchor="middle">利潤</text>
<rect x="648" y="112" width="150" height="90" fill="var(--card)" rx="10" stroke="var(--accent)" stroke-width="2"/>
<text x="723" y="152" font-size="18" fill="var(--ink)" text-anchor="middle">價格還沒</text>
<text x="723" y="178" font-size="18" fill="var(--ink)" text-anchor="middle">算進去</text>
<rect x="838" y="112" width="62" height="90" fill="var(--card)" rx="10" stroke="var(--line)" stroke-width="2"/>
<text x="869" y="146" font-size="18" fill="var(--ink)" text-anchor="middle">值</text>
<text x="869" y="170" font-size="18" fill="var(--ink)" text-anchor="middle">得</text>
<text x="869" y="194" font-size="18" fill="var(--ink)" text-anchor="middle">持</text>
<path d="M210 157 L250 157" stroke="var(--dim)" stroke-width="3"/>
<path d="M406 157 L446 157" stroke="var(--dim)" stroke-width="3"/>
<path d="M602 157 L642 157" stroke="var(--dim)" stroke-width="3"/>
<path d="M798 157 L832 157" stroke="var(--dim)" stroke-width="3"/>
<path d="M135 214 C 200 400, 800 400, 866 214" fill="none" stroke="var(--warn)" stroke-width="5" stroke-dasharray="10 8"/>
<path d="M866 208 L850 240 L882 240 Z" fill="var(--warn)"/>
<text x="500" y="378" font-size="20" fill="var(--warn)" text-anchor="middle" font-weight="700">熟悉感</text>
<text x="60" y="470" font-size="22" fill="var(--ink)">被繞過的那一段，就是功課本身</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三根柱子高度由極矮到極高，顯示環評報告頁數從二十頁長到一萬頁再到十萬頁">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="60" font-size="27" font-weight="700" fill="var(--ink)">環評報告的厚度</text>
<line x1="60" y1="480" x2="900" y2="480" stroke="var(--line)" stroke-width="2"/>

<rect x="140" y="470" width="110" height="10" fill="var(--grey)"/>
<text class="t" x="195" y="452" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">約 20 頁</text>
<text class="t" x="195" y="510" font-size="16" fill="var(--dim)" text-anchor="middle">NEPA 剛上路</text>

<rect x="400" y="310" width="110" height="170" fill="var(--grey)"/>
<text class="t" x="455" y="292" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">1 萬頁</text>
<text class="t" x="455" y="510" font-size="16" fill="var(--dim)" text-anchor="middle">今天的大型專案</text>

<rect x="660" y="100" width="110" height="380" fill="var(--warn)"/>
<text class="t" x="715" y="82" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">10 萬頁</text>
<text class="t" x="715" y="510" font-size="16" fill="var(--dim)" text-anchor="middle">一條輸電線的全紀錄</text>

<line x1="800" y1="100" x2="880" y2="100" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="t" x="880" y="140" font-size="16" fill="var(--dim)" text-anchor="end">攤成紙帶</text>
<text class="t" x="880" y="166" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="end">約 20 英里</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="左側管道經四道關卡愈來愈窄，出口只剩細細一股；右側管道沒有關卡，入口寬度一路維持到出口">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; font-weight:700; }
    .bd  { font-size:16px; fill:var(--dim); }
    .cc  { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t ttl" x="60" y="62">同一件還能用的東西，兩條出口</text>

  <rect x="60" y="95" width="400" height="390" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="95" width="400" height="390" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <text class="t grp" x="90" y="135" fill="var(--grey)">賣</text>
  <text class="t grp" x="530" y="135" fill="var(--accent)">讓</text>

  <path d="M90,165 L430,165 L400,230 L120,230 Z" fill="var(--grey)" opacity="0.5"/>
  <path d="M120,245 L400,245 L352,305 L168,305 Z" fill="var(--grey)" opacity="0.5"/>
  <path d="M168,320 L352,320 L300,375 L220,375 Z" fill="var(--grey)" opacity="0.5"/>
  <path d="M220,390 L300,390 L278,445 L242,445 Z" fill="var(--grey)" opacity="0.6"/>

  <text class="t bd" x="110" y="205">定價</text>
  <text class="t bd" x="140" y="282">拍照包裝</text>
  <text class="t bd" x="188" y="353">等買家</text>
  <text class="t bd" x="232" y="425">寄出</text>

  <path d="M530,165 L870,165 L870,445 L530,445 Z" fill="var(--accent)" opacity="0.28"/>
  <line x1="530" y1="165" x2="530" y2="445" stroke="var(--accent)" stroke-width="4"/>
  <line x1="870" y1="165" x2="870" y2="445" stroke="var(--accent)" stroke-width="4"/>
  <text class="t bd" x="620" y="300">當場交給附近的人</text>
  <text class="t bd" x="620" y="330">不定價、不包裝、不等</text>

  <text class="t cc" x="60" y="530">掉人的不是價格，是每一道關卡</text>
</svg>
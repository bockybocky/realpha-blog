<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three process steps: the middle one draws the most players but has the lowest barrier bar, the two ends fewer players and higher barriers">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:20px; font-weight:700; fill:var(--ink); }
    .bd  { font-size:16px; fill:var(--dim); }
    .sm  { font-size:15px; fill:var(--dim); }
    .cc  { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="58">The hardest stretch is also the most crowded one</text>

  <text class="sm" x="60" y="108">How many are attacking</text>
  <circle cx="176" cy="150" r="9" fill="var(--grey)"/>
  <circle cx="204" cy="150" r="9" fill="var(--grey)"/>
  <circle cx="232" cy="150" r="9" fill="var(--grey)"/>
  <circle cx="260" cy="150" r="9" fill="var(--grey)"/>

  <circle cx="392" cy="126" r="9" fill="var(--warn)"/>
  <circle cx="420" cy="126" r="9" fill="var(--warn)"/>
  <circle cx="448" cy="126" r="9" fill="var(--warn)"/>
  <circle cx="476" cy="126" r="9" fill="var(--warn)"/>
  <circle cx="504" cy="126" r="9" fill="var(--warn)"/>
  <circle cx="378" cy="152" r="9" fill="var(--warn)"/>
  <circle cx="406" cy="152" r="9" fill="var(--warn)"/>
  <circle cx="434" cy="152" r="9" fill="var(--warn)"/>
  <circle cx="462" cy="152" r="9" fill="var(--warn)"/>
  <circle cx="490" cy="152" r="9" fill="var(--warn)"/>
  <circle cx="518" cy="152" r="9" fill="var(--warn)"/>
  <circle cx="406" cy="178" r="9" fill="var(--warn)"/>
  <circle cx="434" cy="178" r="9" fill="var(--warn)"/>
  <circle cx="462" cy="178" r="9" fill="var(--warn)"/>
  <circle cx="490" cy="178" r="9" fill="var(--warn)"/>

  <circle cx="694" cy="150" r="9" fill="var(--grey)"/>
  <circle cx="722" cy="150" r="9" fill="var(--grey)"/>
  <circle cx="750" cy="150" r="9" fill="var(--grey)"/>
  <circle cx="778" cy="150" r="9" fill="var(--grey)"/>
  <circle cx="806" cy="150" r="9" fill="var(--grey)"/>

  <rect x="120" y="216" width="200" height="76" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text class="grp" x="220" y="262" text-anchor="middle">Glass base material</text>
  <rect x="350" y="216" width="200" height="76" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text class="grp" x="450" y="252" text-anchor="middle">Drilling and metallization</text>
  <text class="sm" x="450" y="278" text-anchor="middle">Hardest today</text>
  <rect x="640" y="216" width="200" height="76" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text class="grp" x="740" y="262" text-anchor="middle">Build-up wiring</text>

  <text class="sm" x="60" y="336">Long-run barrier</text>
  <rect x="120" y="336" width="200" height="118" rx="10" fill="var(--accent)" fill-opacity="0.30"/>
  <rect x="350" y="418" width="200" height="36" rx="10" fill="var(--accent)" fill-opacity="0.30"/>
  <rect x="640" y="352" width="200" height="102" rx="10" fill="var(--accent)" fill-opacity="0.30"/>

  <text class="cc" x="60" y="512">A crowd dilutes difficulty; it doesn't dilute accumulation</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Five bars shortening from top to bottom, the widest at the top and the narrowest at the bottom">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text x="80" y="70" font-size="27">Thinner upstream, harder to buy</text>
  <text x="880" y="126" font-size="16" fill="var(--dim)" text-anchor="end">The easiest to buy</text>
  <text x="300" y="176" font-size="19" text-anchor="end">Data centers</text>
  <rect x="320" y="140" width="560" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="300" y="252" font-size="19" text-anchor="end">Power, cooling</text>
  <rect x="320" y="216" width="430" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="300" y="328" font-size="19" text-anchor="end">Grid, transformers</text>
  <rect x="320" y="292" width="300" height="56" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text x="300" y="404" font-size="19" text-anchor="end">Turbines, HV gear</text>
  <rect x="320" y="368" width="160" height="56" rx="8" fill="var(--accent)"/>
  <text x="500" y="404" font-size="16" fill="var(--accent)">A thin sieve</text>
  <text x="300" y="480" font-size="19" text-anchor="end">Skill, tacit knowledge</text>
  <rect x="320" y="444" width="95" height="56" rx="8" fill="var(--warn)"/>
  <text x="435" y="480" font-size="16" fill="var(--warn)">Slower than code</text>
  <text x="480" y="556" font-size="22" text-anchor="middle">Easiest to buy ≠ the chokepoint</text>
</svg>
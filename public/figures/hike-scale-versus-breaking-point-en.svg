<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Scale comparison: the market-implied rate-hike move is short, the market-break threshold is only slightly farther, and his implied move is much longer.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="58">The threshold is closer than you think</text>
<line x1="80" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="80" y="462">Now</text>
<text class="g" x="60" y="160">Market view</text>
<rect x="80" y="176" width="200" height="56" rx="8" fill="var(--grey)" opacity="0.6"/>
<text class="g" x="60" y="310">His view</text>
<rect x="80" y="326" width="760" height="56" rx="8" fill="var(--accent)"/>
<line x1="420" y1="130" x2="420" y2="430" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 7"/>
<text class="g" x="440" y="124" fill="var(--warn)">Another leg higher in yields</text>
<text class="b" x="440" y="150" fill="var(--warn)">Stock-market break line</text>
<text class="c" x="60" y="500">You do not need to wait for AI math to fail; this line comes first</text>
</svg>
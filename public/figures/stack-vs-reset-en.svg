<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left, blocks stack up generation by generation into a staircase; on the right, each day rises and resets to zero in a sawtooth.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="60" y="58" class="h">Stack or reset?</text>
<line x1="480" y1="90" x2="480" y2="500" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="252" y="112" text-anchor="middle" class="g">Recursion</text>
<text x="710" y="112" text-anchor="middle" class="g">Clerk</text>
<line x1="70" y1="460" x2="440" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="520" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>
<rect x="80" y="414" width="56" height="46" fill="var(--accent)"/>
<rect x="152" y="414" width="56" height="46" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="152" y="364" width="56" height="46" fill="var(--accent)"/>
<rect x="224" y="414" width="56" height="46" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="224" y="364" width="56" height="46" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="224" y="314" width="56" height="46" fill="var(--accent)"/>
<rect x="296" y="414" width="56" height="46" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="296" y="364" width="56" height="46" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="296" y="314" width="56" height="46" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="296" y="264" width="56" height="46" fill="var(--accent)"/>
<rect x="368" y="414" width="56" height="46" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="368" y="364" width="56" height="46" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="368" y="314" width="56" height="46" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="368" y="264" width="56" height="46" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="368" y="214" width="56" height="46" fill="var(--accent)"/>
<text x="396" y="198" text-anchor="middle" class="b" style="fill:var(--accent)">Stacks up</text>
<text x="108" y="486" text-anchor="middle" class="b">Gen1</text>
<text x="180" y="486" text-anchor="middle" class="b">Gen2</text>
<text x="252" y="486" text-anchor="middle" class="b">Gen3</text>
<text x="324" y="486" text-anchor="middle" class="b">Gen4</text>
<text x="396" y="486" text-anchor="middle" class="b">Gen5</text>
<path d="M530,460 L602,314 V460 L674,314 V460 L746,314 V460 L818,314 V460 L890,314 V460 Z" fill="var(--card)" stroke="var(--warn)" stroke-width="3" stroke-linejoin="round"/>
<text x="710" y="290" text-anchor="middle" class="b" style="fill:var(--warn)">Resets</text>
<text x="566" y="486" text-anchor="middle" class="b">Day1</text>
<text x="638" y="486" text-anchor="middle" class="b">Day2</text>
<text x="710" y="486" text-anchor="middle" class="b">Day3</text>
<text x="782" y="486" text-anchor="middle" class="b">Day4</text>
<text x="854" y="486" text-anchor="middle" class="b">Day5</text>
</svg>
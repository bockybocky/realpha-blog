<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The tray on the left is stacked with slips, while the identical tray on the right is completely empty.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="62" font-size="27" fill="var(--ink)" font-weight="700">Same tray, by the end of the interviews</text>

<rect x="70" y="120" width="360" height="260" rx="10" fill="var(--card)" stroke="var(--line)"/>
<g fill="var(--accent)">
<rect x="110" y="330" width="280" height="16" rx="3"/>
<rect x="118" y="306" width="264" height="16" rx="3"/>
<rect x="104" y="282" width="286" height="16" rx="3"/>
<rect x="122" y="258" width="252" height="16" rx="3"/>
<rect x="110" y="234" width="272" height="16" rx="3"/>
<rect x="116" y="210" width="258" height="16" rx="3"/>
<rect x="106" y="186" width="276" height="16" rx="3"/>
<rect x="124" y="162" width="244" height="16" rx="3"/>
</g>
<text x="70" y="420" font-size="19" fill="var(--ink)" font-weight="700">In power</text>
<text x="70" y="448" font-size="16" fill="var(--dim)">A long list of calls</text>

<line x1="480" y1="110" x2="480" y2="400" stroke="var(--line)" stroke-width="2"/>

<rect x="530" y="120" width="360" height="260" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="530" y="420" font-size="19" fill="var(--ink)" font-weight="700">The last time</text>
<text x="530" y="448" font-size="16" fill="var(--dim)">No calls to report</text>

<text x="48" y="500" font-size="22" fill="var(--ink)">He did not feel himself changing</text>
</svg>
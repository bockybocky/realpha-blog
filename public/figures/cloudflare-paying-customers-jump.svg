<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="同一底線上，左邊一道很矮的帶，右邊一根高出數倍的長條">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">付費客戶單季淨增</text>
<rect x="600" y="118" width="170" height="282" fill="var(--accent)"/>
<text x="685" y="104" text-anchor="middle" font-size="19" fill="var(--ink)">15.8 萬</text>
<rect x="150" y="368" width="300" height="32" fill="var(--grey)"/>
<line x1="110" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<text x="300" y="434" text-anchor="middle" font-size="16" fill="var(--dim)">過去一年每季：兩到三萬</text>
<text x="685" y="434" text-anchor="middle" font-size="16" fill="var(--dim)">第三季</text>
<text x="480" y="486" text-anchor="middle" font-size="22" fill="var(--ink)">同一個單位，換了一個級距</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一排年份方格分成聖嬰年與其他年兩組，兩組各自對應一根成長柱，聖嬰年那根較矮" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="56" font-size="27" fill="var(--ink)">反事實不是另一個地球，是另外那些年</text>
  <text x="100" y="106" font-size="15" fill="var(--dim)">一段夠長的年份</text>

  <rect x="100" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="138" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="176" y="120" width="28" height="28" rx="4" fill="var(--accent)"/>
  <rect x="214" y="120" width="28" height="28" rx="4" fill="var(--accent)"/>
  <rect x="252" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="290" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="328" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="366" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="404" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="442" y="120" width="28" height="28" rx="4" fill="var(--accent)"/>
  <rect x="480" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="518" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="556" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="594" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="632" y="120" width="28" height="28" rx="4" fill="var(--accent)"/>
  <rect x="670" y="120" width="28" height="28" rx="4" fill="var(--accent)"/>
  <rect x="708" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="746" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="784" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="822" y="120" width="28" height="28" rx="4" fill="var(--card)" stroke="var(--line)"/>

  <rect x="100" y="172" width="14" height="14" rx="3" fill="var(--accent)"/>
  <text x="122" y="184" font-size="15" fill="var(--dim)">聖嬰年</text>
  <rect x="220" y="172" width="14" height="14" rx="3" fill="var(--card)" stroke="var(--line)"/>
  <text x="242" y="184" font-size="15" fill="var(--dim)">其他年</text>

  <line x1="270" y1="206" x2="270" y2="238" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="270,250 263,234 277,234" fill="var(--dim)"/>
  <line x1="690" y1="206" x2="690" y2="238" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="690,250 683,234 697,234" fill="var(--dim)"/>

  <text x="270" y="284" font-size="19" fill="var(--ink)" text-anchor="middle">聖嬰年</text>
  <text x="690" y="284" font-size="19" fill="var(--ink)" text-anchor="middle">其他年</text>

  <line x1="120" y1="440" x2="840" y2="440" stroke="var(--line)" stroke-width="2"/>
  <rect x="230" y="360" width="80" height="80" fill="var(--accent)"/>
  <rect x="650" y="300" width="80" height="140" fill="var(--accent)"/>
  <text x="270" y="468" font-size="15" fill="var(--dim)" text-anchor="middle">後續成長</text>
  <text x="690" y="468" font-size="15" fill="var(--dim)" text-anchor="middle">後續成長</text>

  <text x="60" y="512" font-size="22" fill="var(--ink)">同一批國家，比不同的年</text>
</svg>
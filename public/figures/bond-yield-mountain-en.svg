<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A century of yields forms a mountain with the up slope and down slope colored separately, plus a small duration box.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px;font-weight:700}
    .b{font-size:16px;fill:var(--dim)}
    .k{font-size:22px;font-weight:700}
</style>
<text class="t" x="60" y="58">Two sides of one mountain</text>
<line x1="120" y1="470" x2="910" y2="470" stroke="var(--line)" stroke-width="2"/>
<path d="M140,432 C 260,420 380,258 480,152 L480,470 L140,470 Z" fill="var(--warn)" opacity="0.14"/>
<path d="M480,152 C 600,250 730,400 830,438 L830,470 L480,470 Z" fill="var(--accent)" opacity="0.14"/>
<path d="M140,432 C 260,420 380,258 480,152 C 600,250 730,400 830,438 L900,414" fill="none" stroke="var(--ink)" stroke-width="3.5"/>
<text class="g" x="140" y="126">Yield</text>
<circle cx="480" cy="152" r="5.5" fill="var(--ink)"/>
<text class="b" x="480" y="134" text-anchor="middle">Double digits</text>
<text class="g" x="200" y="338" fill="var(--warn)">Coupons paid</text>
<text class="b" x="200" y="364">Prices kept losing</text>
<text class="g" x="560" y="338" fill="var(--accent)">High coupons</text>
<text class="b" x="560" y="364">Prices rose too</text>
<text class="b" x="140" y="496">1940</text>
<text class="b" x="480" y="496" text-anchor="middle">1980</text>
<text class="b" x="830" y="496" text-anchor="middle">2022</text>
<rect x="656" y="110" width="244" height="112" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="676" y="144">Duration 10y</text>
<text class="b" x="676" y="174">Yield +1%</text>
<text class="b" x="676" y="202" fill="var(--warn)">Price -10%</text>
<text class="k" x="60" y="546">Coupons are always positive, prices are not</text>
</svg>
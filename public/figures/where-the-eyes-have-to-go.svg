<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左格眼睛到螢幕的視線與看路方向夾角很大，右格資訊帶幾乎落在看路的視線上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:600;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:600;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">同一個問題，兩條解法</text>
<rect x="60" y="100" width="390" height="310" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="255" y="142" text-anchor="middle">更多、更大的螢幕</text>
<circle cx="395" cy="212" r="9" fill="var(--ink)"/>
<line x1="386" y1="208" x2="100" y2="196" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 7"/>
<text class="b" x="104" y="180">路面</text>
<rect x="150" y="288" width="130" height="72" rx="8" fill="none" stroke="var(--warn)" stroke-width="2.5"/>
<line x1="389" y1="219" x2="218" y2="300" stroke="var(--warn)" stroke-width="2.5"/>
<text class="b" x="255" y="392" text-anchor="middle" fill="var(--warn)">視線要離開路面</text>
<rect x="510" y="100" width="390" height="310" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="705" y="142" text-anchor="middle">一條橫向資訊帶</text>
<circle cx="845" cy="212" r="9" fill="var(--ink)"/>
<line x1="836" y1="208" x2="550" y2="196" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 7"/>
<text class="b" x="554" y="180">路面</text>
<rect x="575" y="222" width="200" height="16" rx="8" fill="var(--accent)" fill-opacity="0.3" stroke="var(--accent)" stroke-width="2"/>
<line x1="838" y1="216" x2="680" y2="230" stroke="var(--accent)" stroke-width="2.5"/>
<text class="b" x="705" y="392" text-anchor="middle" fill="var(--accent)">視線幾乎不用移</text>
<text class="c" x="480" y="478" text-anchor="middle">眼睛留在路上，手留在方向盤上</text>
</svg>
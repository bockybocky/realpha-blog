<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="數軸圖：想一次跳兩格的價格被夾成一格，分兩次才走到位">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .dm { font-size:16px; fill:var(--dim); }
    .num { font-size:20px; font-weight:700; fill:var(--ink); }
    .cc { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56">一次只准走一格</text>
<line x1="140" y1="340" x2="880" y2="340" stroke="var(--dim)" stroke-width="2"/>
<g>
<line x1="220" y1="326" x2="220" y2="354" stroke="var(--dim)" stroke-width="3"/>
<line x1="520" y1="326" x2="520" y2="354" stroke="var(--dim)" stroke-width="3"/>
<line x1="820" y1="326" x2="820" y2="354" stroke="var(--dim)" stroke-width="3"/>
<text class="num" x="202" y="384">100</text>
<text class="num" x="502" y="384">101</text>
<text class="num" x="802" y="384">102</text>
</g>
<path d="M220 320 Q520 170 820 320" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="dm" x="440" y="186" fill="var(--warn)">想一次推到 102</text>
<rect x="556" y="196" width="18" height="140" fill="var(--grey)"/>
<text class="g" x="588" y="250" fill="var(--dim)">1% 上限</text>
<text class="dm" x="588" y="276">夾成一格</text>
<path d="M220 300 Q370 252 520 300" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="dm" x="286" y="268" fill="var(--accent)">第一次</text>
<path d="M520 300 Q670 252 820 300" fill="none" stroke="var(--accent)" stroke-width="4"/>
<text class="dm" x="586" y="268" fill="var(--accent)">第二次</text>
<text class="cc" x="60" y="462">有槓桿的系統，要連續地動</text>
</svg>
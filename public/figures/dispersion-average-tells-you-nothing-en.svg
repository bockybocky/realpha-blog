<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A group of outcomes scattered extremely widely, with an average line in the middle far from both the highest and lowest dots.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">One hotel, a hundred outcomes</text>

<rect x="60" y="92" width="840" height="340" rx="10" fill="var(--card)"/>
<line x1="110" y1="262" x2="860" y2="262" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="110" y="252" font-size="19" font-weight="700" fill="var(--accent)">Average</text>

<circle cx="160" cy="134" r="8" fill="var(--grey)"/>
<circle cx="205" cy="330" r="8" fill="var(--grey)"/>
<circle cx="250" cy="178" r="8" fill="var(--grey)"/>
<circle cx="295" cy="392" r="8" fill="var(--grey)"/>
<circle cx="340" cy="244" r="8" fill="var(--grey)"/>
<circle cx="385" cy="150" r="8" fill="var(--grey)"/>
<circle cx="430" cy="300" r="8" fill="var(--grey)"/>
<circle cx="475" cy="200" r="8" fill="var(--grey)"/>
<circle cx="520" cy="378" r="8" fill="var(--grey)"/>
<circle cx="565" cy="126" r="8" fill="var(--grey)"/>
<circle cx="610" cy="286" r="8" fill="var(--grey)"/>
<circle cx="655" cy="166" r="8" fill="var(--grey)"/>
<circle cx="700" cy="356" r="8" fill="var(--grey)"/>
<circle cx="745" cy="222" r="8" fill="var(--grey)"/>
<circle cx="790" cy="140" r="8" fill="var(--grey)"/>
<circle cx="835" cy="320" r="8" fill="var(--grey)"/>

<circle cx="565" cy="126" r="13" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="584" y="122" font-size="16" fill="var(--warn)">The best one</text>
<circle cx="295" cy="392" r="13" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="314" y="398" font-size="16" fill="var(--warn)">The worst one</text>

<text class="t" x="60" y="472" font-size="16" fill="var(--dim)">Twenty years on, the top and bottom have not converged</text>
<text class="t" x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">You buy one dot, not the line</text>
</svg>
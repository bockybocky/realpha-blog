<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Five blocks each have their own foundation on the left, while on the right all five share one cracked foundation.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" fill="var(--ink)">"Either all of it works or none of it does" is a confession of risk</text>

<text x="90" y="130" font-size="20" fill="var(--dim)">Spread-out bets</text>
<rect x="90" y="200" width="46" height="46" fill="var(--grey)"/>
<rect x="90" y="256" width="46" height="14" fill="var(--line)"/>
<rect x="160" y="200" width="46" height="46" fill="var(--grey)"/>
<rect x="160" y="256" width="46" height="14" fill="var(--line)"/>
<rect x="230" y="200" width="46" height="46" fill="var(--grey)"/>
<rect x="230" y="256" width="46" height="14" fill="var(--line)"/>
<rect x="300" y="200" width="46" height="46" fill="var(--grey)"/>
<rect x="300" y="256" width="46" height="14" fill="var(--line)"/>
<rect x="370" y="200" width="46" height="46" fill="var(--grey)"/>
<rect x="370" y="256" width="46" height="14" fill="var(--line)"/>
<text x="90" y="310" font-size="16" fill="var(--dim)">One falls, the rest stand</text>

<line x1="460" y1="110" x2="460" y2="400" stroke="var(--line)" stroke-width="2"/>

<text x="540" y="130" font-size="20" fill="var(--warn)">One big position</text>
<rect x="540" y="200" width="46" height="46" fill="var(--accent)"/>
<rect x="610" y="200" width="46" height="46" fill="var(--accent)"/>
<rect x="680" y="200" width="46" height="46" fill="var(--accent)"/>
<rect x="750" y="200" width="46" height="46" fill="var(--accent)"/>
<rect x="820" y="200" width="46" height="46" fill="var(--accent)"/>
<rect x="540" y="256" width="326" height="20" fill="var(--warn)"/>
<path d="M700 256 L690 276 L712 276 L702 256" fill="var(--page)"/>
<text x="540" y="310" font-size="16" fill="var(--warn)">A shared underlying assumption</text>
<text x="60" y="462" font-size="22" fill="var(--ink)">Reasoning held up by "it doesn't matter yet" fails all at once</text>
</svg>
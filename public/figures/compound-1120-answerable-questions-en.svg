<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three filled circles in the top row lead to one outcome, and four hollow circles in the bottom row lead to a different outcome.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
    .h1{font-size:27px;font-weight:700;fill:var(--ink);}
    .cap{font-size:20px;font-weight:700;fill:var(--dim);}
    .capA{font-size:20px;font-weight:700;fill:var(--accent);}
    .capW{font-size:20px;font-weight:700;fill:var(--warn);}
    .unit{font-size:16px;fill:var(--dim);}
    .kick{font-size:22px;font-weight:700;fill:var(--ink);}
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <g class="t">
    <text x="480" y="48" class="h1" text-anchor="middle">Full means rewrite; empty means story</text>
    <text x="60" y="160" class="capA">Cisco</text>
    <circle cx="300" cy="188" r="30" fill="var(--accent)"/>
    <circle cx="380" cy="188" r="30" fill="var(--accent)"/>
    <circle cx="460" cy="188" r="30" fill="var(--accent)"/>
    <text x="60" y="196" class="unit">Questions you can answer</text>
    <line x1="520" y1="188" x2="620" y2="188" stroke="var(--accent)" stroke-width="4"/>
    <text x="640" y="180" class="capA">Repriced</text>
    <text x="640" y="212" class="unit">Past cost is not in the formula</text>
    <text x="60" y="352" class="capW">NVIDIA</text>
    <circle cx="300" cy="380" r="30" fill="none" stroke="var(--warn)" stroke-width="3"/>
    <circle cx="380" cy="380" r="30" fill="none" stroke="var(--warn)" stroke-width="3"/>
    <circle cx="460" cy="380" r="30" fill="none" stroke="var(--warn)" stroke-width="3"/>
    <circle cx="540" cy="380" r="30" fill="none" stroke="var(--warn)" stroke-width="3"/>
    <text x="60" y="388" class="unit">Chip flows, China revenue</text>
    <text x="60" y="414" class="unit">Who sits in the moat, market reaction</text>
    <line x1="600" y1="380" x2="680" y2="380" stroke="var(--warn)" stroke-width="4"/>
    <text x="700" y="372" class="capW">Admitting a guess</text>
    <text x="700" y="404" class="unit">Old reasons ≠ answer</text>
    <text x="480" y="508" class="kick" text-anchor="middle">Count the ones you can answer</text>
  </g>
</svg>
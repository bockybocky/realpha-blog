<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A table with one new column on the right: some cells can be filled in, some are empty">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="48" y="54" font-size="27" fill="var(--ink)">Add a column</text>

  <rect x="60" y="100" width="580" height="50" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="80" y="132" font-size="16" fill="var(--dim)">Item</text>
  <text x="300" y="132" font-size="16" fill="var(--dim)">Cost</text>
  <text x="480" y="132" font-size="16" fill="var(--dim)">How often</text>

  <rect x="640" y="100" width="260" height="322" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text x="770" y="132" font-size="17" fill="var(--accent)" text-anchor="middle">Does for me</text>

  <line x1="60" y1="150" x2="900" y2="150" stroke="var(--line)" stroke-width="2"/>
  <line x1="60" y1="218" x2="900" y2="218" stroke="var(--line)" stroke-width="2"/>
  <line x1="60" y1="286" x2="900" y2="286" stroke="var(--line)" stroke-width="2"/>
  <line x1="60" y1="354" x2="900" y2="354" stroke="var(--line)" stroke-width="2"/>
  <line x1="60" y1="422" x2="900" y2="422" stroke="var(--line)" stroke-width="2"/>
  <line x1="60" y1="150" x2="60" y2="422" stroke="var(--line)" stroke-width="2"/>
  <line x1="280" y1="150" x2="280" y2="422" stroke="var(--line)" stroke-width="2"/>
  <line x1="460" y1="150" x2="460" y2="422" stroke="var(--line)" stroke-width="2"/>

  <text x="80" y="192" font-size="16" fill="var(--ink)">Subs</text>
  <text x="80" y="260" font-size="16" fill="var(--ink)">Channels</text>
  <text x="80" y="328" font-size="16" fill="var(--ink)">Meetups</text>
  <text x="80" y="396" font-size="16" fill="var(--ink)">To-dos</text>

  <line x1="300" y1="186" x2="420" y2="186" stroke="var(--grey)" stroke-width="4"/>
  <line x1="300" y1="254" x2="420" y2="254" stroke="var(--grey)" stroke-width="4"/>
  <line x1="300" y1="322" x2="420" y2="322" stroke="var(--grey)" stroke-width="4"/>
  <line x1="300" y1="390" x2="420" y2="390" stroke="var(--grey)" stroke-width="4"/>
  <line x1="480" y1="186" x2="600" y2="186" stroke="var(--grey)" stroke-width="4"/>
  <line x1="480" y1="254" x2="600" y2="254" stroke="var(--grey)" stroke-width="4"/>
  <line x1="480" y1="322" x2="600" y2="322" stroke="var(--grey)" stroke-width="4"/>
  <line x1="480" y1="390" x2="600" y2="390" stroke="var(--grey)" stroke-width="4"/>

  <line x1="660" y1="186" x2="860" y2="186" stroke="var(--accent)" stroke-width="4"/>
  <rect x="660" y="240" width="200" height="30" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="660" y1="322" x2="860" y2="322" stroke="var(--accent)" stroke-width="4"/>
  <rect x="660" y="376" width="200" height="30" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="8 6"/>

  <text x="48" y="506" font-size="22" fill="var(--ink)">A blank cell is the answer</text>
</svg>
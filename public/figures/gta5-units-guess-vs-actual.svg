<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條橫條比長短：多數人猜的只有一小截，實際銷量的那條幾乎最長">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="62" font-size="27" fill="var(--ink)">猜的量體　對　真的量體</text>
<rect x="48" y="96" width="864" height="312" rx="14" fill="var(--card)"/>
<text x="272" y="172" font-size="19" fill="var(--dim)" text-anchor="end">多數人猜</text>
<rect x="292" y="140" width="101" height="52" rx="6" fill="var(--grey)"/>
<text x="409" y="172" font-size="16" fill="var(--dim)">4,000–5,000 萬套</text>
<text x="272" y="254" font-size="19" fill="var(--dim)" text-anchor="end">主持人猜</text>
<rect x="292" y="222" width="560" height="52" rx="6" fill="var(--grey)"/>
<text x="868" y="254" font-size="16" fill="var(--dim)" text-anchor="end">2.5 億套</text>
<text x="272" y="336" font-size="19" fill="var(--ink)" text-anchor="end">實際</text>
<rect x="292" y="304" width="526" height="52" rx="6" fill="var(--accent)"/>
<text x="834" y="336" font-size="16" fill="var(--ink)">2.35 億套</text>
<text x="48" y="466" font-size="22" fill="var(--ink)">低估的不是一成，是五倍</text>
</svg>
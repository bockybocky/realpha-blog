<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two stacked bars compared: the onsite segment shrinks from over eighty percent to fifty-nine percent while the segment staying in India grows accordingly.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">Where the code gets written</text>
<rect x="200" y="140" width="190" height="240" fill="var(--grey)"/>
<rect x="200" y="380" width="190" height="60" fill="var(--accent)"/>
<rect x="580" y="140" width="190" height="177" fill="var(--grey)"/>
<rect x="580" y="317" width="190" height="123" fill="var(--accent)"/>
<text x="295" y="270" text-anchor="middle" font-size="19" fill="var(--ink)">Client's office</text>
<text x="295" y="296" text-anchor="middle" font-size="16" fill="var(--ink)">Over 80%</text>
<text x="295" y="418" text-anchor="middle" font-size="16" fill="var(--page)">India</text>
<text x="675" y="238" text-anchor="middle" font-size="19" fill="var(--ink)">Client's office</text>
<text x="675" y="264" text-anchor="middle" font-size="16" fill="var(--ink)">59%</text>
<text x="675" y="388" text-anchor="middle" font-size="16" fill="var(--page)">India</text>
<text x="295" y="478" text-anchor="middle" font-size="19" fill="var(--dim)">Bodies on site</text>
<text x="675" y="478" text-anchor="middle" font-size="19" fill="var(--dim)">Offshore model</text>
<path d="M420 300 L550 300" stroke="var(--ink)" stroke-width="2"/>
<path d="M550 300 l-14 -7 l0 14 z" fill="var(--ink)"/>
<text x="480" y="516" text-anchor="middle" font-size="22" fill="var(--ink)">Wage gaps pay only once the links are open</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three-layer stack with investment at the bottom licence layer, and a value arrow that jumps over the middle carrier layer to land on the top application layer.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Forecast right, payday missed</text>
<rect x="300" y="110" width="520" height="110" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="330" y="152" font-size="20" fill="var(--accent)">Apps on top</text>
<text x="330" y="186" font-size="16" fill="var(--dim)">Uber · Amazon · Instagram</text>
<text x="700" y="186" font-size="19" fill="var(--accent)">Value lands here</text>
<rect x="300" y="250" width="520" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="330" y="292" font-size="20" fill="var(--dim)">Mobile carriers</text>
<text x="330" y="326" font-size="16" fill="var(--dim)">Thin margins · no pricing power · commodity</text>
<rect x="300" y="390" width="520" height="110" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="330" y="432" font-size="20" fill="var(--warn)">3G licences &amp; networks</text>
<text x="330" y="466" font-size="16" fill="var(--dim)">EU carriers paid €110–120bn</text>
<path d="M240 445 C 150 445, 150 165, 290 165" fill="none" stroke="var(--accent)" stroke-width="5"/>
<path d="M290 165 L 264 151 L 264 179 Z" fill="var(--accent)"/>
<text x="62" y="300" font-size="19" fill="var(--accent)">Skips</text>
<text x="62" y="326" font-size="19" fill="var(--accent)">Middle layer</text>
<text x="60" y="540" font-size="22" fill="var(--ink)">Phones did all that; the network builders never got paid</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三條橫條比長度：銀行大案最短、現金走私居中、貿易洗錢最長">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="h" x="60" y="62">上新聞的，不是最大的</text>
<text class="g" x="60" y="132">銀行大案</text>
<rect x="300" y="112" width="104" height="48" rx="6" fill="var(--grey)"/>
<text class="b" x="416" y="143">1,300 億．幾年累積</text>
<text class="g" x="60" y="242">現金走私</text>
<rect x="300" y="222" width="240" height="48" rx="6" fill="var(--grey)"/>
<text class="b" x="552" y="253">數千億．每年</text>
<text class="g" x="60" y="352">貿易洗錢</text>
<rect x="300" y="332" width="600" height="48" rx="6" fill="var(--accent)"/>
<text class="b" x="316" y="410">1 兆．每年</text>
<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="60" y="490">最大的那條，壓根不走金融系統</text>
</svg>
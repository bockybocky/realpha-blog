<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三根直條由低到高：離機器越遠的人，越多人說技能變少">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .c { font-size:22px; font-weight:700; }
    .d { fill:var(--dim); }
    .a { fill:var(--accent); }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<defs><marker id="m3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker></defs>
<text x="480" y="56" text-anchor="middle" class="t">離機器越遠，越篤定「技能變少」</text>
<text x="120" y="112" class="b d">說「NC 需要較少技能」的比例</text>
<line x1="120" y1="300" x2="840" y2="300" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="112" y="305" text-anchor="end" class="b d">50%</text>
<rect x="180" y="300" width="120" height="150" fill="var(--accent)"/>
<text x="240" y="288" text-anchor="middle" class="g">對半</text>
<rect x="420" y="300" width="120" height="150" fill="var(--accent)" opacity="0.45"/>
<rect x="420" y="210" width="120" height="90" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="480" y="198" text-anchor="middle" class="g">偏向較少</text>
<rect x="660" y="210" width="120" height="240" fill="var(--accent)"/>
<text x="720" y="198" text-anchor="middle" class="g">約八成</text>
<line x1="140" y1="450" x2="840" y2="450" stroke="var(--dim)" stroke-width="2"/>
<text x="240" y="482" text-anchor="middle" class="g">NC 操作員</text>
<text x="480" y="482" text-anchor="middle" class="g">經理・程式設計師</text>
<text x="720" y="482" text-anchor="middle" class="g">手工機工</text>
<text x="240" y="508" text-anchor="middle" class="b d">親手操作過</text>
<text x="480" y="508" text-anchor="middle" class="b d">隔一層</text>
<text x="720" y="508" text-anchor="middle" class="b d">沒操作過</text>
<line x1="200" y1="548" x2="780" y2="548" stroke="var(--dim)" stroke-width="2" marker-end="url(#m3)"/>
<text x="800" y="554" class="b d">離機器越遠</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上排十二格全滿代表弱 RSI 花十二個月，下排只有第一格亮起其餘十一格空著，代表強 RSI 約一個月走完同樣進展">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="56" class="t">同樣一年的進展，要花多久</text>
<text x="215" y="172" class="g" text-anchor="end">弱 RSI</text>
<text x="215" y="196" class="d" text-anchor="end">人定方向</text>
<rect x="240" y="152" width="46" height="50" rx="4" fill="var(--grey)"/>
<rect x="290" y="152" width="46" height="50" rx="4" fill="var(--grey)"/>
<rect x="340" y="152" width="46" height="50" rx="4" fill="var(--grey)"/>
<rect x="390" y="152" width="46" height="50" rx="4" fill="var(--grey)"/>
<rect x="440" y="152" width="46" height="50" rx="4" fill="var(--grey)"/>
<rect x="490" y="152" width="46" height="50" rx="4" fill="var(--grey)"/>
<rect x="540" y="152" width="46" height="50" rx="4" fill="var(--grey)"/>
<rect x="590" y="152" width="46" height="50" rx="4" fill="var(--grey)"/>
<rect x="640" y="152" width="46" height="50" rx="4" fill="var(--grey)"/>
<rect x="690" y="152" width="46" height="50" rx="4" fill="var(--grey)"/>
<rect x="740" y="152" width="46" height="50" rx="4" fill="var(--grey)"/>
<rect x="790" y="152" width="46" height="50" rx="4" fill="var(--grey)"/>
<text x="850" y="184" class="g">12 個月</text>
<text x="215" y="292" class="g" text-anchor="end">強 RSI</text>
<text x="215" y="316" class="d" text-anchor="end">AI 自己選題</text>
<rect x="240" y="272" width="46" height="50" rx="4" fill="var(--accent)"/>
<rect x="290" y="272" width="46" height="50" rx="4" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="340" y="272" width="46" height="50" rx="4" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="390" y="272" width="46" height="50" rx="4" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="440" y="272" width="46" height="50" rx="4" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="490" y="272" width="46" height="50" rx="4" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="540" y="272" width="46" height="50" rx="4" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="590" y="272" width="46" height="50" rx="4" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="640" y="272" width="46" height="50" rx="4" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="690" y="272" width="46" height="50" rx="4" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="740" y="272" width="46" height="50" rx="4" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<rect x="790" y="272" width="46" height="50" rx="4" fill="none" stroke="var(--grey)" stroke-dasharray="4 4"/>
<text x="850" y="304" class="g" style="fill:var(--accent)">約 1 個月</text>
<text x="480" y="420" class="c" text-anchor="middle">研究速度約快 10 倍</text>
<text x="480" y="456" class="d" text-anchor="middle">Schulman：兩年內出現</text>
</svg>
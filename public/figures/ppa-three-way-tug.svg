<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三角形的一角被往下拉，另兩角跟著偏離虛線的原位">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>

<text x="70" y="62" font-size="27" font-weight="700" fill="var(--ink)">動一個，另外兩個跟著歪</text>

<polygon points="480,140 700,420 260,420" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<polygon points="480,250 760,392 230,356" fill="none" stroke="var(--accent)" stroke-width="3"/>

<circle cx="480" cy="250" r="9" fill="var(--warn)"/>
<circle cx="760" cy="392" r="8" fill="var(--accent)"/>
<circle cx="230" cy="356" r="8" fill="var(--accent)"/>

<text x="480" y="128" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">效能</text>
<text x="790" y="398" font-size="20" fill="var(--ink)">面積</text>
<text x="200" y="362" font-size="20" fill="var(--ink)" text-anchor="end">功耗</text>

<line x1="480" y1="158" x2="480" y2="232" stroke="var(--warn)" stroke-width="3"/>
<polygon points="474,232 480,246 486,232" fill="var(--warn)"/>
<text x="500" y="200" font-size="16" fill="var(--warn)">你拉這裡</text>

<text x="700" y="470" font-size="16" fill="var(--dim)" text-anchor="middle">虛線＝原本的形狀</text>
<text x="70" y="500" font-size="22" font-weight="700" fill="var(--ink)">三個數字綁在同一條繩上</text>
</svg>
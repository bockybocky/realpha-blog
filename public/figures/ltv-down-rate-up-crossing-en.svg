<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A falling loan-to-value line crosses a rising interest rate line.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="68" font-size="27" fill="var(--ink)">Financing terms over six months</text>

<line x1="140" y1="440" x2="860" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="178" y="474" font-size="16" fill="var(--dim)">Summer</text>
<text x="440" y="474" font-size="16" fill="var(--dim)">Post-Labor Day</text>
<text x="742" y="474" font-size="16" fill="var(--dim)">Now</text>

<polyline points="200,170 480,228 780,310" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="200" cy="170" r="7" fill="var(--accent)"/>
<circle cx="480" cy="228" r="7" fill="var(--accent)"/>
<circle cx="780" cy="310" r="7" fill="var(--accent)"/>
<text x="176" y="146" font-size="16" fill="var(--accent)">80%</text>
<text x="454" y="206" font-size="16" fill="var(--accent)">70%</text>
<text x="742" y="290" font-size="16" fill="var(--accent)">50–60%</text>
<text x="112" y="124" font-size="19" fill="var(--accent)">Loan-to-value</text>

<polyline points="200,382 780,196" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 6"/>
<circle cx="200" cy="382" r="7" fill="var(--warn)"/>
<circle cx="780" cy="196" r="7" fill="var(--warn)"/>
<text x="176" y="412" font-size="16" fill="var(--warn)">12%</text>
<text x="752" y="176" font-size="16" fill="var(--warn)">Near 20%</text>
<text x="820" y="222" font-size="19" fill="var(--warn)">Rate</text>

<text x="60" y="524" font-size="22" fill="var(--ink)">LTV down, rates up, same stretch of time</text>
</svg>
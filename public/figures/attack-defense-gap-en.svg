<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="An asymmetry: the attacker uses a model still in testing while the defender can only use approved ones, leaving a persistent gap between the two capability lines.">
  <style>
    svg {
      --page:   #ffffff;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #9aa5b5;
      --accent: #1f6feb;
      --warn:   #d97706;
      --gap:    #d97706;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #6b7686;
        --accent: #58a6ff;
        --warn:   #d29922;
        --gap:    #d29922;
      }
    }
    .t     { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1    { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .labW  { font-size: 20px; font-weight: 700; fill: var(--warn); }
    .labG  { font-size: 20px; font-weight: 700; fill: var(--dim); }
    .sub   { font-size: 16px; fill: var(--dim); }
    .ax    { font-size: 16px; fill: var(--dim); }
    .gaplb { font-size: 17px; font-weight: 700; fill: var(--gap); }
    .kick  { font-size: 22px; font-weight: 700; fill: var(--ink); }
    .note  { font-size: 16px; fill: var(--dim); }
  </style>

  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <g class="t">
    <text x="480" y="46" class="h1" text-anchor="middle">The attacker's tools are always newer than the defender's</text>

    <!-- 落差區塊：兩線之間填色 -->
    <path d="M120,300 C260,258 400,214 560,176 C680,150 790,134 880,124
             L880,214 C790,222 680,236 560,254 C400,278 260,304 120,336 Z"
          fill="var(--gap)" opacity="0.13"/>

    <!-- 攻擊方曲線 -->
    <path d="M120,300 C260,258 400,214 560,176 C680,150 790,134 880,124"
          fill="none" stroke="var(--warn)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="880" cy="124" r="7" fill="var(--warn)"/>
    <text x="876" y="96" class="labW" text-anchor="end">Attacker: the strongest model, still in testing</text>

    <!-- 防守方曲線 -->
    <path d="M120,336 C260,304 400,278 560,254 C680,236 790,222 880,214"
          fill="none" stroke="var(--grey)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="880" cy="214" r="7" fill="var(--grey)"/>
    <text x="876" y="248" class="labG" text-anchor="end">Defender: only what is already approved</text>

    <!-- 落差標註 -->
    <line x1="700" y1="146" x2="700" y2="230" stroke="var(--gap)" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="688" y="176" class="gaplb" text-anchor="end">This gap</text>
    <text x="688" y="198" class="gaplb" text-anchor="end">never closes</text>

    <!-- 軸 -->
    <line x1="120" y1="380" x2="880" y2="380" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="120" y="406" class="ax" text-anchor="start">Time</text>
    <text x="880" y="406" class="ax" text-anchor="end">Capability rising</text>

    <!-- 數量不對稱 -->
    <line x1="120" y1="432" x2="880" y2="432" stroke="var(--line)" stroke-width="1"/>
    <text x="120" y="462" class="sub">And the defender</text>
    <text x="292" y="462" class="labG">doors</text>
    <text x="384" y="462" class="sub">, attacker finds</text>
    <text x="536" y="462" class="labW">1 hole</text>
    <text x="600" y="462" class="sub">.</text>

    <text x="480" y="512" class="kick" text-anchor="middle">The strongest is in testing; what can be fielded is approved.</text>
    <text x="480" y="542" class="note" text-anchor="middle">This is not one incident but a standing structural gap that no single fix closes.</text>
  </g>
</svg>

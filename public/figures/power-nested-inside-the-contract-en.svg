<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Power sits inside the bond contract and the contract sits inside the Constitution; arrows for the legislature, the governor and the mayor stop at the outer wall.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .ttl { font-size:27px; font-weight:700; }
    .grp { font-size:19px; font-weight:700; fill:var(--dim); }
    .lbl { font-size:16px; fill:var(--dim); }
    .cc { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t ttl" x="60" y="60">Where power lives</text>

  <rect x="330" y="100" width="570" height="330" rx="10" fill="var(--card)" stroke="var(--ink)" stroke-width="4"/>
  <text class="t grp" x="352" y="132">Contracts Clause</text>
  <rect x="372" y="156" width="490" height="240" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t grp" x="394" y="188">Bonds</text>
  <rect x="414" y="212" width="410" height="160" rx="6" fill="var(--accent)" opacity="0.14" stroke="var(--accent)"/>
  <text class="t lbl" x="436" y="248">Tolls: any</text>
  <text class="t lbl" x="436" y="284">Term: any</text>
  <text class="t lbl" x="436" y="320">Own surplus</text>
  <text class="t lbl" x="436" y="356">Scope: linked</text>

  <text class="t grp" x="60" y="196">No recall</text>
  <g stroke="var(--grey)" stroke-width="5" fill="none">
    <path d="M70 240 L300 240"/>
    <path d="M70 290 L300 290"/>
    <path d="M70 340 L300 340"/>
  </g>
  <g fill="var(--grey)">
    <path d="M300 230 L322 240 L300 250 Z"/>
    <path d="M300 280 L322 290 L300 300 Z"/>
    <path d="M300 330 L322 340 L300 350 Z"/>
  </g>
  <text class="t lbl" x="70" y="232">Albany</text>
  <text class="t lbl" x="70" y="282">Gov.</text>
  <text class="t lbl" x="70" y="332">Mayor</text>

  <line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text class="t cc" x="60" y="512">Power in a contract gets a guard</text>
</svg>
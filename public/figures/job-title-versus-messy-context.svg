<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊是一個乾淨的職業名稱方塊，右邊同樣的方塊底下連著一大片零散小點組成的雲團">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">排行榜看到的，和工作真正的樣子</text>

<text x="70" y="126" font-size="20" fill="var(--dim)">排行榜的單位</text>
<rect x="70" y="150" width="330" height="70" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="94" y="194" font-size="19" fill="var(--ink)">職業名稱</text>
<text x="70" y="278" font-size="16" fill="var(--dim)">好複製</text>

<text x="530" y="126" font-size="20" fill="var(--accent)">工作實際的單位</text>
<rect x="530" y="150" width="330" height="70" rx="10" fill="var(--card)" stroke="var(--accent)"/>
<text x="554" y="194" font-size="19" fill="var(--ink)">職業名稱</text>
<path d="M695 220 L695 254" stroke="var(--accent)" stroke-width="2"/>
<path d="M520 254 Q695 232 872 254 Q890 360 695 400 Q500 360 520 254 Z"
      fill="var(--accent)" opacity="0.1" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="7 6"/>
<circle cx="576" cy="286" r="5" fill="var(--accent)"/>
<circle cx="622" cy="300" r="5" fill="var(--accent)"/>
<circle cx="668" cy="278" r="5" fill="var(--accent)"/>
<circle cx="714" cy="298" r="5" fill="var(--accent)"/>
<circle cx="762" cy="280" r="5" fill="var(--accent)"/>
<circle cx="808" cy="300" r="5" fill="var(--accent)"/>
<circle cx="596" cy="330" r="5" fill="var(--accent)"/>
<circle cx="644" cy="346" r="5" fill="var(--accent)"/>
<circle cx="692" cy="326" r="5" fill="var(--accent)"/>
<circle cx="740" cy="344" r="5" fill="var(--accent)"/>
<circle cx="788" cy="328" r="5" fill="var(--accent)"/>
<circle cx="620" cy="372" r="5" fill="var(--accent)"/>
<circle cx="672" cy="366" r="5" fill="var(--accent)"/>
<circle cx="724" cy="374" r="5" fill="var(--accent)"/>
<circle cx="772" cy="364" r="5" fill="var(--accent)"/>
<text x="530" y="440" font-size="16" fill="var(--dim)">沒寫在任何文件上的事實：人、地點、上一次施工留下的問題</text>

<text x="60" y="500" font-size="22" fill="var(--ink)">不是技能難，是脈絡多</text>
</svg>
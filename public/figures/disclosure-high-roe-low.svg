<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條橫條比較：Prime 揭露率最長、Standard 揭露率約一半、ROE 達標比例最短">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t h" x="60" y="62">揭露跑在前面，獲利能力在後面</text>

  <text class="t b" x="60" y="118">揭露</text>
  <rect x="60" y="134" width="760" height="44" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="134" width="707" height="44" fill="var(--accent)"/>
  <text class="t g" x="76" y="164" fill="var(--page)">Prime　93%</text>

  <rect x="60" y="200" width="760" height="44" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="200" width="410" height="44" fill="var(--accent)" opacity="0.65"/>
  <text class="t g" x="76" y="230">Standard　54%</text>

  <line x1="60" y1="280" x2="900" y2="280" stroke="var(--line)" stroke-width="2"/>

  <text class="t b" x="60" y="328">成果</text>
  <rect x="60" y="344" width="760" height="44" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="344" width="456" height="44" fill="var(--warn)" opacity="0.55"/>
  <text class="t g" x="76" y="374">ROE 達 8%　約六成</text>
  <text class="t b" x="532" y="374">其餘約四成不到 8%</text>

  <text class="t c" x="60" y="462">開一份資料，不會讓 ROE 動</text>
</svg>
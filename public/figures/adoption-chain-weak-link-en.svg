<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A chain of four links where the last link has a break, so the whole chain comes apart.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:19px; fill:var(--ink); font-weight:700; }
    .lbl { font-size:16px; fill:var(--dim); }
    .cc  { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="ttl" x="60" y="62">Adoption is a chain</text>

<rect x="60" y="180" width="230" height="130" rx="65" fill="none" stroke="var(--accent)" stroke-width="12"/>
<text class="grp" x="175" y="252" text-anchor="middle">Clinical</text>
<rect x="250" y="180" width="230" height="130" rx="65" fill="none" stroke="var(--accent)" stroke-width="12"/>
<text class="grp" x="365" y="252" text-anchor="middle">Technical</text>
<rect x="440" y="180" width="230" height="130" rx="65" fill="none" stroke="var(--accent)" stroke-width="12"/>
<text class="grp" x="555" y="252" text-anchor="middle">Payment</text>

<path d="M745 180 L860 180 A65 65 0 0 1 860 310 L745 310" fill="none" stroke="var(--warn)" stroke-width="12"/>
<path d="M700 310 A65 65 0 0 1 700 180" fill="none" stroke="var(--warn)" stroke-width="12"/>
<text class="grp" x="800" y="252" text-anchor="middle">Workflow</text>
<text class="lbl" x="722" y="356" text-anchor="middle">Break</text>

<rect x="630" y="124" width="300" height="2" fill="var(--warn)"/>
<text class="cc" x="60" y="430">The chain breaks at the link nobody counted</text>
</svg>
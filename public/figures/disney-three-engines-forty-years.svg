<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三根等長橫條代表 1984、2010、2026 的利潤來源：第一根幾乎整條是樂園與消費品，第二根近一半換成有線頻道，第三根近六成回到樂園與郵輪">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .y { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .i { font-size:16px; fill:var(--page); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">四十年，換過三次引擎</text>
  <text class="b" x="60" y="92">每根等長＝當年的營業利益全部</text>

  <text class="y" x="200" y="168" text-anchor="end">1984</text>
  <rect x="220" y="140" width="614" height="52" fill="var(--accent)"/>
  <rect x="834" y="140" width="6" height="52" fill="var(--grey)"/>
  <text class="i" x="240" y="173">樂園與消費品</text>
  <text class="b" x="220" y="216">電影電視只有兩百萬美元</text>

  <text class="y" x="200" y="288" text-anchor="end">2010</text>
  <rect x="220" y="260" width="310" height="52" fill="var(--accent)" opacity="0.5"/>
  <rect x="530" y="260" width="310" height="52" fill="var(--grey)" opacity="0.45"/>
  <text class="i" x="240" y="293">有線頻道</text>
  <text class="b" x="550" y="293">其餘全部</text>
  <text class="b" x="220" y="336">ESPN 是買 ABC 時沒人預料到的意外</text>

  <text class="y" x="200" y="408" text-anchor="end">2026</text>
  <rect x="220" y="380" width="372" height="52" fill="var(--accent)"/>
  <rect x="592" y="380" width="248" height="52" fill="var(--grey)" opacity="0.45"/>
  <text class="i" x="240" y="413">樂園與郵輪</text>
  <text class="b" x="612" y="413">其餘全部</text>
  <text class="b" x="220" y="456">院線發行只佔全公司百分之三</text>

  <text class="c" x="60" y="516">同一個代號，不是同一門生意</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A two-axis chart with endurance range along the horizontal axis and usable power up the vertical axis, where the buoyancy-engine glider sits at the lower right travelling far on very little power, and the electric-propulsion vehicle sits at the upper left with ample power but little range, the two points diagonally opposed.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="76" font-size="27" font-weight="700" fill="var(--ink)">Long energy is not enough power</text>

  <rect x="150" y="120" width="720" height="320" fill="var(--card)"/>
  <line x1="150" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="3"/>
  <line x1="150" y1="120" x2="150" y2="440" stroke="var(--line)" stroke-width="3"/>

  <text x="150" y="480" font-size="19" fill="var(--dim)">Range</text>
  <text x="838" y="480" font-size="19" fill="var(--dim)">Far</text>
  <text x="60" y="436" font-size="19" fill="var(--dim)">Low</text>
  <text x="60" y="138" font-size="19" fill="var(--dim)">High</text>
  <text x="60" y="108" font-size="19" fill="var(--dim)">Usable power</text>

  <line x1="300" y1="200" x2="300" y2="440" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="150" y1="200" x2="300" y2="200" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="300" cy="200" r="16" fill="var(--accent)"/>
  <text x="330" y="196" font-size="20" fill="var(--ink)">Electric vehicle</text>
  <text x="330" y="224" font-size="16" fill="var(--dim)">Feeds sensors, cannot go far</text>

  <line x1="790" y1="380" x2="790" y2="440" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="150" y1="380" x2="790" y2="380" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="790" cy="380" r="16" fill="var(--warn)"/>
  <text x="470" y="356" font-size="20" text-anchor="middle" fill="var(--ink)">Buoyancy glider</text>
  <text x="470" y="330" font-size="16" text-anchor="middle" fill="var(--dim)">Glides far, little power aboard</text>

  <text x="60" y="528" font-size="22" font-weight="700" fill="var(--ink)">One good axis does not promise the other</text>
</svg>
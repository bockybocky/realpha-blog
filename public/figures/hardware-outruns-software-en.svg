<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A line chart: the hardware line rises fast, the software line is nearly flat, and the gap between them grows toward the right">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="56" font-size="27" fill="var(--ink)">Hardware ahead, software behind</text>
<text x="60" y="122" font-size="16" fill="var(--dim)">Progress</text>

<line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="140" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
<text x="800" y="472" font-size="16" fill="var(--dim)">Generations</text>

<polygon points="140,400 300,340 460,265 620,205 820,165 820,335 620,345 460,360 300,385 140,410" fill="var(--warn)" opacity="0.16"/>
<polyline points="140,400 300,340 460,265 620,205 820,165" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polyline points="140,410 300,385 460,360 620,345 820,335" fill="none" stroke="var(--dim)" stroke-width="4" stroke-dasharray="10 7"/>

<circle cx="820" cy="165" r="6" fill="var(--accent)"/>
<circle cx="820" cy="335" r="6" fill="var(--dim)"/>
<text x="838" y="160" font-size="19" fill="var(--accent)">Hardware</text>
<text x="838" y="342" font-size="19" fill="var(--dim)">Software</text>

<line x1="700" y1="196" x2="700" y2="341" stroke="var(--warn)" stroke-width="2"/>
<polygon points="700,190 694,202 706,202" fill="var(--warn)"/>
<polygon points="700,347 694,335 706,335" fill="var(--warn)"/>
<text x="640" y="278" font-size="19" fill="var(--warn)">Gap</text>

<text x="60" y="516" font-size="22" fill="var(--accent)">Speed counts only if both move</text>
</g>
</svg>
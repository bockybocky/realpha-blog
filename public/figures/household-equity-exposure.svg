<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊長條約三分之一被填滿，右邊三格中兩格被填滿，兩個比例並列">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">股市已經長進家庭的資產表</text>

  <text x="60" y="140" font-size="19" font-weight="700" fill="var(--dim)">家戶淨值</text>
  <rect x="60" y="170" width="380" height="180" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="60" y="233" width="380" height="117" rx="10" fill="var(--accent)"/>
  <text x="250" y="305" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">美股 35%</text>

  <text x="540" y="140" font-size="19" font-weight="700" fill="var(--dim)">每三戶美國家庭</text>
  <rect x="540" y="200" width="100" height="150" rx="10" fill="var(--accent)"/>
  <rect x="660" y="200" width="100" height="150" rx="10" fill="var(--accent)"/>
  <rect x="780" y="200" width="100" height="150" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="540" y="385" font-size="17" fill="var(--ink)">兩戶持有股票</text>

  <text x="60" y="462" font-size="22" font-weight="700" fill="var(--ink)">1920 年代末以來，曝險最高的一次</text>
</svg>
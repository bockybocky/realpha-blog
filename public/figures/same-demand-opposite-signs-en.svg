<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One block of demand splits into a plus side collecting money and a minus side paying it, with five dots at the bottom all on one side marked false diversification">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<defs>
<marker id="a6a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/></marker>
</defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56">One demand, opposite signs on the two sides</text>

<rect x="360" y="100" width="240" height="64" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="g" x="480" y="140" text-anchor="middle">AI buildout demand</text>
<line x1="420" y1="168" x2="290" y2="216" stroke="var(--grey)" stroke-width="2" marker-end="url(#a6a)"/>
<line x1="540" y1="168" x2="670" y2="216" stroke="var(--grey)" stroke-width="2" marker-end="url(#a6a)"/>

<rect x="70" y="228" width="360" height="200" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="100" y="268">The side collecting</text>
<text class="g" x="392" y="268" text-anchor="end" fill="var(--accent)">+</text>
<text class="b" x="100" y="308">Sells steel · copper</text>
<text class="b" x="100" y="340">Electrical equipment</text>
<text class="b" x="100" y="372">Engineering services</text>
<text class="b" x="100" y="404">More orders</text>

<rect x="530" y="228" width="360" height="200" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="560" y="268">The side paying</text>
<text class="g" x="852" y="268" text-anchor="end" fill="var(--warn)">−</text>
<text class="b" x="560" y="308">Needs the same steel and copper</text>
<text class="b" x="560" y="340">Competes for the same trades</text>
<text class="b" x="560" y="372">Waits on the same freight</text>
<text class="b" x="560" y="404" fill="var(--warn)">Higher costs</text>

<circle cx="150" cy="470" r="11" fill="var(--accent)"/>
<circle cx="192" cy="470" r="11" fill="var(--accent)"/>
<circle cx="234" cy="470" r="11" fill="var(--accent)"/>
<circle cx="276" cy="470" r="11" fill="var(--accent)"/>
<circle cx="318" cy="470" r="11" fill="var(--accent)"/>
<text class="b" x="348" y="476" fill="var(--warn)">Five names on one side = false diversification</text>

<text class="c" x="60" y="524">Ask which side it's on before asking if it goes up</text>
</svg>
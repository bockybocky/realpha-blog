<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="上路撞牆後堆成一疊，下路繞圈後往右張開">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.ttl{font-size:27px;font-weight:700}
.grp{font-size:20px;font-weight:700}
.bdy{font-size:16px;fill:var(--dim)}
.cnc{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="ttl" x="60" y="62">同一筆錢，兩條路</text>

<text class="grp" x="60" y="178">只灌技術</text>
<line x1="210" y1="200" x2="560" y2="200" stroke="var(--grey)" stroke-width="8"/>
<rect x="566" y="128" width="16" height="148" fill="var(--warn)"/>
<text class="bdy" x="300" y="240">跳過準則、編制、訓練</text>
<rect x="620" y="140" width="110" height="26" fill="var(--grey)"/>
<rect x="620" y="174" width="110" height="26" fill="var(--grey)"/>
<rect x="620" y="208" width="110" height="26" fill="var(--grey)"/>
<rect x="620" y="242" width="110" height="26" fill="var(--grey)"/>
<text class="grp" x="748" y="208">貨櫃</text>

<text class="grp" x="60" y="408">放到手上</text>
<line x1="210" y1="430" x2="330" y2="430" stroke="var(--accent)" stroke-width="8"/>
<path d="M398 370 A62 62 0 1 1 396 492" fill="none" stroke="var(--accent)" stroke-width="8"/>
<path d="M396 492 l24 -14 l-2 28 z" fill="var(--accent)"/>
<text class="bdy" x="366" y="438">用了</text>
<text class="bdy" x="366" y="462">再改</text>
<path d="M470 430 L720 430 L900 350 L900 510 L720 430 Z" fill="var(--accent)" opacity="0.28"/>
<line x1="470" y1="430" x2="880" y2="430" stroke="var(--accent)" stroke-width="8"/>
<text class="grp" x="700" y="396">挑贏家放大</text>

<text class="cnc" x="60" y="556">一條撞牆，一條繞過才張開</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The same moving average twice: an upward cross marked with an X as an entry signal, and a downward break marked as an exit action.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">One moving average, two uses</text>

<rect x="60" y="96" width="400" height="344" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="88" y="138">As an entry signal</text>
<line x1="96" y1="272" x2="428" y2="272" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
<text class="b" x="96" y="258">Moving average</text>
<polyline points="110,340 175,318 240,286 305,248 400,222" fill="none" stroke="var(--dim)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="253" cy="272" r="7" fill="var(--dim)"/>
<text class="b" x="400" y="204" text-anchor="end">Crosses up</text>
<line x1="220" y1="360" x2="254" y2="394" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>
<line x1="254" y1="360" x2="220" y2="394" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>
<text class="g" x="278" y="386" fill="var(--warn)">No predictive power</text>

<rect x="500" y="96" width="400" height="344" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="528" y="138">As a stop line</text>
<line x1="536" y1="272" x2="868" y2="272" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 7"/>
<text class="b" x="536" y="258">Set in advance</text>
<polyline points="550,214 615,238 680,268 745,306 840,336" fill="none" stroke="var(--dim)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="691" cy="272" r="7" fill="var(--accent)"/>
<line x1="691" y1="272" x2="691" y2="330" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="701" y="326">Exit</text>
<polyline points="660,376 678,394 716,356" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text class="g" x="734" y="390" fill="var(--accent)">Useful as discipline</text>

<text class="c" x="480" y="505" text-anchor="middle">No predictive power does not mean no use</text>
</svg>
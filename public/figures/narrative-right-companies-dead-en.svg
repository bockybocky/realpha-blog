<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The industry demand curve keeps rising while several companies fall to the bottom in their refinancing year.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">Right Direction, Wrong Survivor</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">Fiber and Shale Have Been Here Before</text>

<line x1="100" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<path d="M100 400 C 300 390, 480 300, 880 170" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/>
<text class="t" x="640" y="168" font-size="20" font-weight="700" fill="var(--accent)">Story: Demand Grows</text>

<circle cx="300" cy="388" r="11" fill="var(--grey)"/>
<circle cx="360" cy="378" r="11" fill="var(--grey)"/>
<circle cx="420" cy="360" r="11" fill="var(--grey)"/>

<path d="M300 400 L300 412" stroke="var(--warn)" stroke-width="3"/>
<circle cx="300" cy="422" r="9" fill="var(--warn)"/>
<path d="M360 390 L360 412" stroke="var(--warn)" stroke-width="3"/>
<circle cx="360" cy="422" r="9" fill="var(--warn)"/>
<path d="M420 372 L420 412" stroke="var(--warn)" stroke-width="3"/>
<circle cx="420" cy="422" r="9" fill="var(--warn)"/>
<text class="t" x="276" y="470" font-size="19" font-weight="700" fill="var(--warn)">Firms Hitting the Refi Wall</text>

<circle cx="700" cy="248" r="11" fill="var(--ink)"/>
<circle cx="840" cy="192" r="11" fill="var(--ink)"/>
<text class="t" x="700" y="226" font-size="19" font-weight="700" fill="var(--ink)">Survivors</text>

<line x1="60" y1="500" x2="900" y2="500" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="538" font-size="22" font-weight="700" fill="var(--ink)">Picking the Right Industry Is Not the Same as Profiting</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The same capex bar is called vision in one panel and a crime in the other, with the market's question changing from how much they dare invest to how much cash is left.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .v { font-size:20px; font-weight:700; }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="58">The same capex, two verdicts in two quarters</text>

  <rect x="60" y="96" width="390" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="510" y="96" width="390" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <text class="g" x="84" y="134">Last quarter</text>
  <text class="g" x="534" y="134">This quarter</text>

  <text class="b" x="255" y="176" text-anchor="middle">Capex</text>
  <text class="b" x="705" y="176" text-anchor="middle">Capex</text>

  <rect x="195" y="188" width="120" height="168" rx="4" fill="var(--accent)"/>
  <rect x="645" y="188" width="120" height="168" rx="4" fill="var(--warn)"/>

  <line x1="90" y1="356" x2="420" y2="356" stroke="var(--line)" stroke-width="2"/>
  <line x1="540" y1="356" x2="870" y2="356" stroke="var(--line)" stroke-width="2"/>

  <text class="v" x="255" y="384" text-anchor="middle" fill="var(--accent)">Vision</text>
  <text class="v" x="705" y="384" text-anchor="middle" fill="var(--warn)">Crime</text>

  <text class="b" x="60" y="444">Market asks</text>
  <text class="g" x="255" y="444" text-anchor="middle" fill="var(--ink)">How much they dare</text>
  <text class="g" x="705" y="444" text-anchor="middle" fill="var(--ink)">How much cash is left</text>

  <line x1="60" y1="476" x2="900" y2="476" stroke="var(--grey)" stroke-width="1" stroke-dasharray="6 6"/>
  <text class="c" x="480" y="518" text-anchor="middle">What changed is what gets priced</text>
</svg>
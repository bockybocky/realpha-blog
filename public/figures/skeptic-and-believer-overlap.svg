<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="機率軸上懷疑者與主張者的位置落在同一段窄區間，兩個極端都空著">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .k { font-size:22px; font-weight:700; fill:var(--accent); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70">雙方其實站得很近</text>
  <text class="b" x="60" y="102">走完所有反駁之後，問對方同一個問題</text>

  <rect x="60" y="150" width="840" height="230" rx="12" fill="var(--card)"/>
  <line x1="120" y1="290" x2="840" y2="290" stroke="var(--grey)" stroke-width="2"/>
  <text class="b" x="112" y="322">0</text>
  <text class="b" x="830" y="322">1</text>

  <rect x="192" y="272" width="72" height="36" rx="6" fill="var(--accent)" opacity="0.35"/>
  <circle cx="300" cy="290" r="11" fill="var(--accent)"/>

  <text class="g" x="150" y="245" fill="var(--accent)">懷疑者</text>
  <text class="b" x="150" y="218">一到兩成</text>
  <text class="g" x="268" y="360">他的數字</text>

  <text class="b" x="560" y="245">這一段沒有人站</text>
  <path d="M 420 290 L 820 290" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 8"/>

  <text class="k" x="60" y="440">爭論落在一段窄區間裡</text>
  <text class="b" x="60" y="472">不是一邊說會、一邊說不會</text>
</svg>
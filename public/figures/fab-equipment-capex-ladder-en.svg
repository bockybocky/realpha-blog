<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Five steadily rising bars form a staircase of equipment spending, the last one a dashed whisper figure.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="58" font-size="27" fill="var(--ink)">The fab equipment spending ladder (US$ bn)</text>
<line x1="90" y1="420" x2="920" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="290" width="110" height="130" fill="var(--accent)" opacity="0.45"/>
<text x="205" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">1,500</text>
<text x="205" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">2026</text>
<rect x="300" y="247" width="110" height="173" fill="var(--accent)" opacity="0.6"/>
<text x="355" y="235" font-size="19" fill="var(--ink)" text-anchor="middle">2,000</text>
<text x="355" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">2027 Lam</text>
<rect x="450" y="231" width="110" height="189" fill="var(--accent)" opacity="0.72"/>
<text x="505" y="219" font-size="19" fill="var(--ink)" text-anchor="middle">2,180</text>
<text x="505" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">2027 Goldman</text>
<rect x="600" y="176" width="110" height="244" fill="var(--accent)" opacity="0.88"/>
<text x="655" y="164" font-size="19" fill="var(--ink)" text-anchor="middle">2,810</text>
<text x="655" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">2028 Goldman</text>
<rect x="750" y="160" width="110" height="260" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="805" y="148" font-size="19" fill="var(--dim)" text-anchor="middle">3,000</text>
<text x="805" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">Whisper</text>
<text x="805" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">Unconfirmed</text>
</g>
</svg>
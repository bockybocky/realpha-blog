<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="On the inflation scale, the area near 3% is boxed in and three pressure arrows point at it, two of them dashed to show costs that have not yet reached consumers.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<defs>
<marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
<marker id="g5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/></marker>
</defs>
<text class="t" x="60" y="56" font-size="27" fill="var(--ink)" font-weight="700">Three forces, none from labor</text>
<text class="t" x="60" y="152" font-size="19" fill="var(--ink)">Fuel</text>
<text class="t" x="160" y="152" font-size="16" fill="var(--dim)">Air</text>
<path d="M230,146 L470,290" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#a5)"/>
<text class="t" x="250" y="134" font-size="15" fill="var(--accent)">Passed</text>
<text class="t" x="60" y="222" font-size="19" fill="var(--ink)">AI boom</text>
<text class="t" x="190" y="222" font-size="16" fill="var(--dim)">PCs, memory</text>
<path d="M350,216 L470,300" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#a5)"/>
<text class="t" x="60" y="292" font-size="19" fill="var(--ink)">Duty</text>
<text class="t" x="160" y="292" font-size="16" fill="var(--dim)">Cars, Canada, fuel</text>
<path d="M410,300 L470,312" fill="none" stroke="var(--grey)" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#g5)"/>
<text class="t" x="160" y="320" font-size="15" fill="var(--grey)">Not yet</text>
<line x1="150" y1="400" x2="850" y2="400" stroke="var(--line)" stroke-width="3"/>
<rect x="440" y="340" width="130" height="60" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="505" y="378" font-size="19" fill="var(--ink)" text-anchor="middle">Stuck at 3%</text>
<line x1="150" y1="390" x2="150" y2="412" stroke="var(--dim)" stroke-width="2"/>
<line x1="850" y1="390" x2="850" y2="412" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="t" x="150" y="438" font-size="16" fill="var(--dim)" text-anchor="middle">2% goal</text>
<text class="t" x="850" y="438" font-size="16" fill="var(--grey)" text-anchor="middle">4% unmet</text>
<text class="t" x="150" y="520" font-size="22" fill="var(--ink)" font-weight="700">Untransmitted = stock, not end</text>
</svg>
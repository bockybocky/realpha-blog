<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="分散市場的第一名只占一小截，收租型環節的第一名占大半">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="80" y="62" font-size="27" font-weight="700" fill="var(--ink)">第一名占多少，決定收不收得到租</text>

<text class="t" x="80" y="130" font-size="19" fill="var(--ink)">分散的環節</text>
<rect x="80" y="150" width="102" height="70" fill="var(--accent)" opacity="0.85"/>
<text class="t" x="131" y="194" font-size="16" fill="var(--page)" text-anchor="middle">第一名</text>
<g fill="var(--grey)">
<rect x="186" y="150" width="70" height="70"/><rect x="260" y="150" width="62" height="70"/>
<rect x="326" y="150" width="78" height="70"/><rect x="408" y="150" width="56" height="70"/>
<rect x="468" y="150" width="84" height="70"/><rect x="556" y="150" width="60" height="70"/>
<rect x="620" y="150" width="74" height="70"/><rect x="698" y="150" width="66" height="70"/>
<rect x="768" y="150" width="112" height="70"/>
</g>
<text class="t" x="880" y="244" font-size="15" fill="var(--dim)" text-anchor="end">客戶隨時換家</text>

<text class="t" x="80" y="330" font-size="19" fill="var(--ink)">收租的環節</text>
<rect x="80" y="350" width="620" height="70" fill="var(--warn)" opacity="0.85"/>
<text class="t" x="390" y="394" font-size="16" fill="var(--page)" text-anchor="middle">第一名</text>
<g fill="var(--grey)">
<rect x="704" y="350" width="80" height="70"/><rect x="788" y="350" width="92" height="70"/>
</g>
<text class="t" x="880" y="444" font-size="15" fill="var(--dim)" text-anchor="end">想換也沒處換</text>

<text class="t" x="80" y="500" font-size="22" font-weight="700" fill="var(--ink)">先看結構，再看名字</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三種拿錢方式下原股東持份被切成幾份的對照，發新股那排多出兩塊新股東">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">同樣拿到錢，你的那一份不一樣</text>
<text class="t" x="60" y="150" font-size="20" fill="var(--ink)">客戶預付款</text>
<rect x="300" y="124" width="36" height="36" fill="var(--accent)"/>
<rect x="340" y="124" width="36" height="36" fill="var(--accent)"/>
<rect x="380" y="124" width="36" height="36" fill="var(--accent)"/>
<rect x="420" y="124" width="36" height="36" fill="var(--accent)"/>
<rect x="460" y="124" width="36" height="36" fill="var(--accent)"/>
<rect x="500" y="124" width="36" height="36" fill="var(--accent)"/>
<rect x="540" y="124" width="36" height="36" fill="var(--accent)"/>
<rect x="580" y="124" width="36" height="36" fill="var(--accent)"/>
<rect x="620" y="124" width="36" height="36" fill="var(--accent)"/>
<rect x="660" y="124" width="36" height="36" fill="var(--accent)"/>
<text class="t" x="716" y="150" font-size="16" fill="var(--dim)">十份，全是你的</text>
<text class="t" x="60" y="290" font-size="20" fill="var(--ink)">可轉債</text>
<rect x="300" y="264" width="36" height="36" fill="var(--accent)"/>
<rect x="340" y="264" width="36" height="36" fill="var(--accent)"/>
<rect x="380" y="264" width="36" height="36" fill="var(--accent)"/>
<rect x="420" y="264" width="36" height="36" fill="var(--accent)"/>
<rect x="460" y="264" width="36" height="36" fill="var(--accent)"/>
<rect x="500" y="264" width="36" height="36" fill="var(--accent)"/>
<rect x="540" y="264" width="36" height="36" fill="var(--accent)"/>
<rect x="580" y="264" width="36" height="36" fill="var(--accent)"/>
<rect x="620" y="264" width="36" height="36" fill="var(--accent)"/>
<rect x="660" y="264" width="36" height="36" fill="var(--grey)"/>
<text class="t" x="716" y="290" font-size="16" fill="var(--dim)">晚一點才切</text>
<text class="t" x="60" y="430" font-size="20" fill="var(--warn)">市價增發</text>
<rect x="300" y="404" width="36" height="36" fill="var(--accent)"/>
<rect x="340" y="404" width="36" height="36" fill="var(--accent)"/>
<rect x="380" y="404" width="36" height="36" fill="var(--accent)"/>
<rect x="420" y="404" width="36" height="36" fill="var(--accent)"/>
<rect x="460" y="404" width="36" height="36" fill="var(--accent)"/>
<rect x="500" y="404" width="36" height="36" fill="var(--accent)"/>
<rect x="540" y="404" width="36" height="36" fill="var(--accent)"/>
<rect x="580" y="404" width="36" height="36" fill="var(--accent)"/>
<rect x="620" y="404" width="36" height="36" fill="var(--accent)"/>
<rect x="660" y="404" width="36" height="36" fill="var(--accent)"/>
<rect x="700" y="404" width="36" height="36" fill="var(--warn)"/>
<rect x="740" y="404" width="36" height="36" fill="var(--warn)"/>
<text class="t" x="792" y="430" font-size="16" fill="var(--warn)">多兩份新股東</text>
<text class="t" x="60" y="516" font-size="22" fill="var(--ink)">同一塊餅，份數被改掉</text>

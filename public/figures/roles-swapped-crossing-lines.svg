<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條走勢線在中間交叉，先大漲的那條之後轉平，先大跌的那條之後一路翻上去">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<text class="t" x="60" y="64">領先的躺平，落後的翻倍</text>
<line x1="160" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="1.5"/>
<line x1="530" y1="130" x2="530" y2="440" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="s" x="530" y="118" text-anchor="middle">角色對調</text>
<polyline points="160,380 280,300 400,210 530,170 650,196 780,180 890,200" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
<polyline points="160,380 280,410 400,428 530,420 650,330 780,240 890,152" fill="none" stroke="var(--warn)" stroke-width="3.5"/>
<circle cx="160" cy="380" r="6" fill="var(--ink)"/>
<text class="b a" x="404" y="192">先漲</text>
<text class="b w" x="404" y="462">先跌</text>
<text class="s a" x="890" y="228" text-anchor="end">躺平</text>
<text class="s w" x="890" y="134" text-anchor="end">翻倍</text>
<text class="c" x="60" y="512">同一段時間，答案換了邊</text>
</svg>
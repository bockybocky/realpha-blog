<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三根從同一條線向下延伸的柱子，長度依序遞增，最短的兩根被標示為優先順位">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="60" y="58" font-size="27" fill="var(--ink)">往下的深度不一樣</text>
<line x1="90" y1="150" x2="890" y2="150" stroke="var(--line)" stroke-width="3"/>
<text x="90" y="134" font-size="16" fill="var(--dim)">下手的位置</text>

<rect x="180" y="150" width="110" height="130" fill="var(--accent)"/>
<rect x="420" y="150" width="110" height="210" fill="var(--accent)" opacity="0.7"/>
<rect x="660" y="150" width="110" height="330" fill="var(--warn)"/>

<text x="186" y="312" font-size="20" fill="var(--ink)">標普</text>
<text x="426" y="392" font-size="20" fill="var(--ink)">納斯達克</text>
<text x="666" y="512" font-size="20" fill="var(--warn)">SOXL</text>

<text x="186" y="344" font-size="16" fill="var(--dim)">先吃 beta</text>
<text x="426" y="424" font-size="16" fill="var(--dim)">再選股</text>
<text x="620" y="124" font-size="16" fill="var(--warn)">槓桿：先想最壞</text>
</g>
</svg>
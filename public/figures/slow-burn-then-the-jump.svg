<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="名次折線四年都在底部徘徊，換檔之後一週垂直上升到第五名">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="80" y="68">慢燒四年，一週竄頂</text>
<line x1="150" y1="120" x2="150" y2="440" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="80" y="146">第 1 名</text>
<text class="b" x="80" y="400">第 45 名</text>
<line x1="150" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<circle cx="230" cy="420" r="7" fill="var(--grey)"/>
<text class="b" x="206" y="470">首季四集</text>
<path d="M230 420 L420 374 L560 391" fill="none" stroke="var(--grey)" stroke-width="5" stroke-dasharray="10 8"/>
<circle cx="420" cy="374" r="7" fill="var(--grey)"/>
<text class="b" x="380" y="356">第 42 名</text>
<circle cx="560" cy="391" r="7" fill="var(--grey)"/>
<line x1="620" y1="120" x2="620" y2="440" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
<text class="b" x="632" y="430">移到週四夜</text>
<path d="M560 391 L660 163" fill="none" stroke="var(--accent)" stroke-width="6"/>
<circle cx="660" cy="163" r="8" fill="var(--accent)"/>
<text class="g" x="684" y="156" fill="var(--accent)">第 5 名</text>
<text class="b" x="684" y="188">一週之內</text>
<text class="c" x="80" y="516">無人注目的四年裡還能被續訂，才是那個訊號</text>
</svg>
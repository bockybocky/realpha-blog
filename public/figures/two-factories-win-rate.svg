<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="人的工廠勝率為平線，AI 工廠從低處上升到現在接近，虛線預估一到兩年後超過">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="56" font-size="27" font-weight="700" fill="var(--ink)">兩座工廠，同一個市場對答案</text>
<text x="120" y="118" font-size="15" fill="var(--dim)">市場勝率（示意）</text>
<line x1="120" y1="130" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="440" x2="830" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="520" y1="130" x2="520" y2="440" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 5"/>
<line x1="160" y1="260" x2="800" y2="260" stroke="var(--dim)" stroke-width="4"/>
<text x="815" y="258" font-size="16" font-weight="700" fill="var(--ink)">人的工廠</text>
<text x="815" y="280" font-size="15" fill="var(--dim)">Pure Alpha</text>
<line x1="160" y1="400" x2="520" y2="268" stroke="var(--accent)" stroke-width="5"/>
<line x1="520" y1="268" x2="800" y2="170" stroke="var(--accent)" stroke-width="5" stroke-dasharray="10 8"/>
<circle cx="160" cy="400" r="8" fill="var(--accent)"/>
<circle cx="520" cy="268" r="8" fill="var(--accent)"/>
<circle cx="800" cy="170" r="8" fill="var(--page)" stroke="var(--accent)" stroke-width="3"/>
<text x="815" y="168" font-size="16" font-weight="700" fill="var(--accent)">AI 工廠</text>
<text x="815" y="190" font-size="15" fill="var(--dim)">AIA</text>
<text x="176" y="428" font-size="15" fill="var(--dim)">第二年分析師</text>
<text x="520" y="236" font-size="16" font-weight="700" text-anchor="middle" fill="var(--ink)">接近</text>
<text x="660" y="196" font-size="15" text-anchor="middle" fill="var(--dim)">預估</text>
<text x="160" y="470" font-size="16" text-anchor="middle" fill="var(--ink)">2023</text>
<text x="520" y="470" font-size="16" text-anchor="middle" fill="var(--ink)">現在</text>
<text x="800" y="470" font-size="16" text-anchor="middle" fill="var(--ink)">1–2 年後</text>
<text x="480" y="530" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">同場比，AI 工廠正在追過人</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Four bars shrink step by step, and each shaved-off portion is outlined in an orange dashed box.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="64" class="t">Fixes cut returns</text>
<text x="60" y="96" class="b">Indicative</text>
<line x1="80" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="140" width="120" height="300" fill="var(--grey)"/>
<rect x="320" y="140" width="120" height="90" fill="var(--warn)" fill-opacity="0.15" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="320" y="230" width="120" height="210" fill="var(--grey)"/>
<rect x="530" y="140" width="120" height="150" fill="var(--warn)" fill-opacity="0.15" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="530" y="290" width="120" height="150" fill="var(--grey)"/>
<rect x="740" y="140" width="120" height="210" fill="var(--warn)" fill-opacity="0.15" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="740" y="350" width="120" height="90" fill="var(--accent)"/>
<text x="170" y="128" class="g" text-anchor="middle">10</text>
<text x="380" y="218" class="g" text-anchor="middle">7</text>
<text x="590" y="278" class="g" text-anchor="middle">5</text>
<text x="800" y="338" class="g" text-anchor="middle" style="fill:var(--accent)">3</text>
<text x="170" y="470" class="b" text-anchor="middle">Raw</text>
<text x="380" y="470" class="b" text-anchor="middle">+Delisted</text>
<text x="590" y="470" class="b" text-anchor="middle">+Report lag</text>
<text x="800" y="470" class="b" text-anchor="middle">OOS years</text>
<text x="480" y="540" class="c" text-anchor="middle">Cut=pg# gain</text>
</svg>
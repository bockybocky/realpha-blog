<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="付出的那一截細到幾乎看不見，換回來的是整條的一半">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="64">付出去的那一截，與換回來的那一半</text>

<text class="g" x="60" y="146">資料中心總成本</text>
<rect x="60" y="166" width="840" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="60" y="166" width="8" height="56" fill="var(--accent)"/>
<text class="n" x="84" y="252">多出不到 1%：買低洩漏氣、偵漏修補、滿載運轉、加觸媒</text>

<text class="g" x="60" y="336">這筆甲烷排放</text>
<rect x="60" y="356" width="840" height="56" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="60" y="356" width="420" height="56" fill="var(--accent)"/>
<text class="n" x="60" y="442">可避掉的一半，相當於美國電網排放的 15%</text>

<text class="c" x="60" y="496">便宜到能說服所有人做的事，通常也便宜到沒人賺得到錢</text>
</svg>
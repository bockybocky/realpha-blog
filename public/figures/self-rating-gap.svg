<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩根高度差很大的柱子：客觀條件高、自我評價低，中間是沒有根據的落差">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">同一個人，兩種量法</text>
<rect x="150" y="120" width="150" height="300" rx="6" fill="var(--accent)" opacity="0.85"/>
<rect x="470" y="330" width="150" height="90" rx="6" fill="var(--grey)"/>
<line x1="120" y1="420" x2="860" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="150" y="450" font-size="20" font-weight="700" fill="var(--ink)">客觀條件</text>
<text x="150" y="476" font-size="16" fill="var(--dim)">資歷・成果・評價</text>
<text x="470" y="450" font-size="20" font-weight="700" fill="var(--ink)">自我評價</text>
<text x="470" y="476" font-size="16" fill="var(--dim)">她心裡的自己</text>
<line x1="370" y1="120" x2="370" y2="330" stroke="var(--warn)" stroke-width="3"/>
<path d="M370 120 l-7 14 h14 z" fill="var(--warn)"/>
<path d="M370 330 l-7 -14 h14 z" fill="var(--warn)"/>
<text x="392" y="215" font-size="20" font-weight="700" fill="var(--warn)">落差</text>
<text x="392" y="243" font-size="16" fill="var(--dim)">找不到根據</text>
<text x="660" y="352" font-size="16" fill="var(--dim)">「我還不夠」</text>
<text x="660" y="380" font-size="16" fill="var(--dim)">「只是剛好」</text>
<text x="660" y="408" font-size="16" fill="var(--dim)">「心裡發毛」</text>
<text x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">低的不是條件，是尺</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On a number line this year's point sits at zero inside a shaded band no year has ever entered, with the record low of five and the average of twenty-one marked to the right.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Not one broad selling day so far this year</text>
  <text x="60" y="96" font-size="16" fill="var(--dim)">Days with over 80% of volume to the downside</text>
  <rect x="140" y="212" width="120" height="100" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="150" y="196" font-size="16" fill="var(--warn)">No year has ever landed here</text>
  <line x1="140" y1="312" x2="880" y2="312" stroke="var(--line)" stroke-width="4"/>
  <circle cx="140" cy="312" r="11" fill="var(--warn)"/>
  <circle cx="260" cy="312" r="9" fill="var(--grey)"/>
  <circle cx="644" cy="312" r="9" fill="var(--accent)"/>
  <text x="140" y="288" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">0</text>
  <text x="260" y="288" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">5</text>
  <text x="644" y="288" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">21</text>
  <text x="140" y="352" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">This year</text>
  <text x="262" y="398" font-size="19" fill="var(--dim)" text-anchor="middle">Lowest year on record</text>
  <line x1="260" y1="326" x2="260" y2="376" stroke="var(--grey)" stroke-width="2"/>
  <text x="644" y="352" font-size="19" fill="var(--accent)" text-anchor="middle">Average</text>
  <text x="480" y="466" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">It is not about how much it rose. The shape of this year is strange.</text>
</svg>
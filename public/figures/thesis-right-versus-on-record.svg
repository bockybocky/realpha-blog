<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="論點品質與留存紀錄的兩軸四格">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">兩件事要分開管</text>

  <rect x="200" y="100" width="280" height="180" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="480" y="100" width="280" height="180" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <rect x="200" y="280" width="280" height="180" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="480" y="280" width="280" height="180" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>

  <text class="t" x="340" y="200" font-size="19" fill="var(--dim)" text-anchor="middle">自我感覺良好</text>
  <text class="t" x="620" y="190" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">看得出來</text>
  <text class="t" x="620" y="220" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">自己對了幾成</text>
  <text class="t" x="340" y="380" font-size="19" fill="var(--dim)" text-anchor="middle">沒事</text>
  <text class="t" x="620" y="370" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">只剩記憶</text>
  <text class="t" x="620" y="400" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">沒有紀錄</text>

  <path d="M160 460 V100" stroke="var(--line)" stroke-width="3"/>
  <path d="M200 500 H760" stroke="var(--line)" stroke-width="3"/>
  <text class="t" x="100" y="150" font-size="19" font-weight="700" fill="var(--dim)">有紀錄</text>
  <text class="t" x="100" y="440" font-size="19" font-weight="700" fill="var(--dim)">沒紀錄</text>
  <text class="t" x="340" y="534" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">論點錯</text>
  <text class="t" x="620" y="534" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">論點對</text>
</svg>
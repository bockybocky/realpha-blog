<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left is a three-step staircase for this year, next year and the year after; on the right is a single bar far taller than the staircase.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .n { font-size:34px; font-weight:700; fill:var(--ink); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">Step plan became one jump</text>
  <text class="b" x="60" y="94">Fear: one jump tips into oversupply</text>
  <text class="g" x="80" y="150">Old pace</text>
  <text class="g" x="560" y="150">Post-boom</text>
  <rect x="80" y="340" width="48" height="60" fill="var(--grey)"/>
  <rect x="170" y="310" width="48" height="90" fill="var(--grey)"/>
  <rect x="260" y="280" width="48" height="120" fill="var(--grey)"/>
  <text class="g" x="80" y="328">10%</text>
  <text class="g" x="170" y="298">15%</text>
  <text class="g" x="260" y="268">20%</text>
  <text class="b" x="86" y="424">Yr 1</text>
  <text class="b" x="176" y="424">Yr 2</text>
  <text class="b" x="266" y="424">Yr 3</text>
  <rect x="580" y="190" width="140" height="210" fill="var(--accent)"/>
  <text class="b" x="580" y="424">One jump</text>
  <path d="M80 400 L320 400" stroke="var(--line)" stroke-width="2"/>
  <path d="M580 400 L740 400" stroke="var(--line)" stroke-width="2"/>
  <text class="c" x="60" y="492">No fear, no pace</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A bar representing 55 million vehicles of capacity is divided into domestic demand and exports, while a large idle segment remains at the right with an arrow pointing toward overseas markets.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Capacity 5500, domestic 2500</text>
  <text class="t" x="60" y="100" font-size="16" fill="var(--dim)">Unit: 10,000 vehicles/year</text>

  <text class="t" x="60" y="150" font-size="19" fill="var(--dim)">Annual capacity</text>
  <rect x="160" y="128" width="740" height="26" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="910" y="148" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="end">5500</text>

  <rect x="160" y="230" width="336" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="328" y="268" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">Domestic demand</text>
  <text class="t" x="328" y="298" font-size="19" fill="var(--dim)" text-anchor="middle">2500</text>

  <rect x="496" y="230" width="162" height="90" fill="var(--accent)"/>
  <text class="t" x="577" y="268" font-size="20" font-weight="700" fill="var(--page)" text-anchor="middle">Exports</text>
  <text class="t" x="577" y="298" font-size="19" fill="var(--page)" text-anchor="middle">1200</text>

  <rect x="658" y="230" width="242" height="90" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
  <text class="t" x="779" y="268" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">Idle</text>
  <text class="t" x="779" y="298" font-size="19" fill="var(--warn)" text-anchor="middle">1500–2000</text>

  <path d="M779 334 L 779 392" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="779,406 770,386 788,386" fill="var(--warn)"/>
  <text class="t" x="779" y="436" font-size="19" fill="var(--warn)" text-anchor="middle">Find exports in other markets</text>

  <text class="t" x="60" y="492" font-size="22" font-weight="700" fill="var(--ink)">The pressure is not weak demand, but production lines with nowhere to go</text>
</svg>
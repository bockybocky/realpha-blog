<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四根柱子由左到右越來越矮，但每根底部的實心段高度完全一樣">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="40" y="52" font-size="27" font-weight="700">變的是強度，不變的是底色</text>
<line x1="120" y1="470" x2="820" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="160" y="130" width="110" height="340" fill="var(--accent)" opacity="0.3"/>
<rect x="320" y="220" width="110" height="250" fill="var(--accent)" opacity="0.3"/>
<rect x="480" y="290" width="110" height="180" fill="var(--accent)" opacity="0.3"/>
<rect x="640" y="340" width="110" height="130" fill="var(--accent)" opacity="0.3"/>
<rect x="160" y="400" width="110" height="70" fill="var(--accent)"/>
<rect x="320" y="400" width="110" height="70" fill="var(--accent)"/>
<rect x="480" y="400" width="110" height="70" fill="var(--accent)"/>
<rect x="640" y="400" width="110" height="70" fill="var(--accent)"/>
<line x1="150" y1="400" x2="760" y2="400" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M215 120 Q450 150 695 330" fill="none" stroke="var(--dim)" stroke-width="2" stroke-dasharray="4 6"/>
<text x="780" y="330" font-size="19" style="fill:var(--dim)">強度 ↓</text>
<text x="780" y="440" font-size="19" font-weight="700" style="fill:var(--accent)">底色 ＝</text>
<text x="215" y="505" font-size="16" text-anchor="middle" style="fill:var(--dim)">二十幾</text>
<text x="375" y="505" font-size="16" text-anchor="middle" style="fill:var(--dim)">四十幾</text>
<text x="535" y="505" font-size="16" text-anchor="middle" style="fill:var(--dim)">六十幾</text>
<text x="695" y="505" font-size="16" text-anchor="middle" style="fill:var(--dim)">八十幾</text>
</svg>
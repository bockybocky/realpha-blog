<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="天秤水平：很小的一包花生和很大的一台汽車在這個口徑裡等重。">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t h" x="60" y="66">新框架的口徑</text>
<text class="t b" x="60" y="100">只數「年增超過 3% 的項目佔多少比重」</text>
<path d="M480 420 V214" stroke="var(--grey)" stroke-width="6"/>
<path d="M400 440 H560" stroke="var(--grey)" stroke-width="6"/>
<path d="M250 214 H710" stroke="var(--ink)" stroke-width="6"/>
<path d="M250 214 V268" stroke="var(--line)" stroke-width="3"/>
<path d="M710 214 V252" stroke="var(--line)" stroke-width="3"/>
<circle cx="250" cy="292" r="26" fill="var(--accent)"/>
<circle cx="710" cy="320" r="70" fill="var(--accent)"/>
<text class="t g" x="178" y="356" fill="var(--ink)">一包花生</text>
<text class="t b" x="178" y="382">+10%</text>
<text class="t g" x="640" y="424" fill="var(--ink)">一台汽車</text>
<text class="t b" x="640" y="450">−5%</text>
<text class="t c" x="60" y="506">大小差很多，權重一樣</text>
</svg>
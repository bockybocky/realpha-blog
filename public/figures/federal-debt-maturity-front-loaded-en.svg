<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Bar chart of federal debt by maturity, in which the under-three-month and under-one-year segments together take up the front portion of the bar and the rest matures beyond one year.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="58">Front-loaded</text>
<rect x="60" y="180" width="151" height="110" fill="var(--warn)"/>
<rect x="211" y="180" width="143" height="110" fill="var(--warn)" opacity="0.5"/>
<rect x="354" y="180" width="546" height="110" fill="var(--grey)" opacity="0.5"/>
<text class="g" x="60" y="164">3-mo bills</text>
<text class="g" x="211" y="164">Rest &lt;1 yr</text>
<text class="g" x="900" y="164" text-anchor="end">1 yr+</text>
<text class="b" x="135" y="248" text-anchor="middle" fill="var(--page)">18%</text>
<text class="b" x="282" y="248" text-anchor="middle">35% total</text>
<line x1="354" y1="300" x2="354" y2="350" stroke="var(--warn)" stroke-width="3"/>
<text class="b" x="354" y="378" text-anchor="middle" fill="var(--warn)">Refinanced in 1 yr</text>
<text class="g" x="60" y="440">Interest 4% of GDP, top of G7</text>
<text class="c" x="60" y="494">Yields up, bill due</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Five concentric arcs centered on the lower right corner, running outer to inner from far and expensive to near and cheap">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="40" y="54" font-size="27" font-weight="700" fill="var(--ink)">Layers: not always the priciest shot</text>

  <path d="M 60 528 A 820 448 0 0 1 880 80" fill="none" stroke="var(--grey)" stroke-width="2.5"/>
  <path d="M 220 528 A 660 366 0 0 1 880 162" fill="none" stroke="var(--grey)" stroke-width="2.5"/>
  <path d="M 380 528 A 500 282 0 0 1 880 246" fill="none" stroke="var(--grey)" stroke-width="2.5"/>
  <path d="M 540 528 A 340 192 0 0 1 880 336" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M 690 528 A 190 110 0 0 1 880 418" fill="none" stroke="var(--accent)" stroke-width="3"/>

  <circle cx="880" cy="528" r="13" fill="var(--ink)"/>

  <text x="60" y="504" font-size="19" font-weight="700" fill="var(--ink)">Arrow 2 / 3</text>
  <text x="60" y="478" font-size="16" fill="var(--dim)">Exo-atmospheric · priciest</text>

  <text x="228" y="504" font-size="19" font-weight="700" fill="var(--ink)">David's Sling</text>

  <text x="388" y="504" font-size="19" font-weight="700" fill="var(--ink)">Iron Dome</text>

  <text x="486" y="576" font-size="19" font-weight="700" fill="var(--accent)">Cheap interceptors, guns</text>
  <text x="486" y="552" font-size="16" fill="var(--dim)">Coyote · APKWS · Skynex</text>
  <line x1="600" y1="536" x2="600" y2="562" stroke="var(--accent)" stroke-width="2"/>

  <text x="756" y="504" font-size="19" font-weight="700" fill="var(--accent)">Iron Beam</text>
  <text x="756" y="478" font-size="16" fill="var(--dim)">Lowest cost per shot</text>

  <text x="40" y="118" font-size="20" font-weight="700" fill="var(--dim)">Far · costly</text>
  <text x="820" y="118" font-size="20" font-weight="700" fill="var(--dim)">Near · cheap</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="一道往右下逐層收窄的階梯，從用戶工作小時一路收斂成採購金額">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:20px; fill:var(--ink); font-weight:600; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text class="t" x="48" y="58">每一階都是一個假設</text>
<rect x="48" y="92" width="560" height="52" rx="8" fill="var(--grey)"/>
<text class="b" x="70" y="125">2 億工作小時</text>
<text class="b" x="628" y="125">除以 24</text>
<rect x="88" y="160" width="470" height="52" rx="8" fill="var(--grey)"/>
<text class="b" x="110" y="193">833 萬同時在跑</text>
<text class="b" x="628" y="193">尖峰 2.5 倍</text>
<rect x="128" y="228" width="400" height="52" rx="8" fill="var(--grey)"/>
<text class="b" x="150" y="261">2,000 萬虛擬機</text>
<text class="b" x="628" y="261">留兩成冗餘</text>
<rect x="168" y="296" width="340" height="52" rx="8" fill="var(--grey)"/>
<text class="b" x="190" y="329">2,500 萬台</text>
<text class="b" x="628" y="329">一台 0.5 核</text>
<rect x="208" y="364" width="270" height="52" rx="8" fill="var(--grey)"/>
<text class="b" x="230" y="397">1,250 萬核</text>
<text class="b" x="628" y="397">一顆 256 核</text>
<rect x="248" y="432" width="180" height="52" rx="8" fill="var(--accent)"/>
<text class="b" x="270" y="465" fill="var(--page)">5 萬顆</text>
<text class="b" x="628" y="465">照市價</text>
<rect x="288" y="500" width="150" height="52" rx="8" fill="var(--warn)"/>
<text class="g" x="310" y="534" fill="var(--page)">8 億美元</text>
</svg>
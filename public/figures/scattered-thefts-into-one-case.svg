<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="四家門市的線匯到同一台車與同一張駕照，再變成完成八成的案卷交給警方">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<defs>
  <marker id="ar-case" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker>
</defs>
<text x="48" y="62" class="t">零星竊案怎麼拼成一件案子</text>
<text x="150" y="128" class="d" text-anchor="middle">單看一件：看不出</text>
<rect x="90" y="150" width="120" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="90" y="230" width="120" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="90" y="310" width="120" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="90" y="390" width="120" height="44" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="150" y="178" class="b" text-anchor="middle">門市 1</text>
<text x="150" y="258" class="b" text-anchor="middle">門市 2</text>
<text x="150" y="338" class="b" text-anchor="middle">門市 3</text>
<text x="150" y="418" class="b" text-anchor="middle">門市 4</text>
<line x1="210" y1="172" x2="440" y2="290" stroke="var(--accent)" stroke-width="2"/>
<line x1="210" y1="252" x2="440" y2="290" stroke="var(--accent)" stroke-width="2"/>
<line x1="210" y1="332" x2="440" y2="290" stroke="var(--accent)" stroke-width="2"/>
<line x1="210" y1="412" x2="440" y2="290" stroke="var(--accent)" stroke-width="2"/>
<text x="525" y="234" class="d" text-anchor="middle">總部調查員</text>
<rect x="440" y="250" width="170" height="80" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="525" y="284" class="g" text-anchor="middle">同一台車</text>
<text x="525" y="314" class="g" text-anchor="middle">同一張駕照</text>
<line x1="614" y1="290" x2="688" y2="290" stroke="var(--dim)" stroke-width="2" marker-end="url(#ar-case)"/>
<text x="800" y="258" class="g" text-anchor="middle">案卷</text>
<rect x="700" y="270" width="200" height="40" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="700" y="270" width="160" height="40" fill="var(--accent)"/>
<text x="800" y="340" class="b" text-anchor="middle">完成約 8 成 → 交警方</text>
<text x="800" y="366" class="d" text-anchor="middle">平均約 70 天</text>
<text x="480" y="492" class="c" text-anchor="middle">公司先做八成，警方才接得住</text>
</svg>
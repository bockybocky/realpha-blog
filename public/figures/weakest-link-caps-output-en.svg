<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three input bars have different heights, the research output bar is as tall as the shortest one, and a dashed box above it shows that it does not reach the tallest.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<text x="60" y="62" class="h">Capped by min</text>
<text x="900" y="62" text-anchor="end" class="b">Mock</text>
<line x1="80" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="165" width="100" height="275" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="250" y="330" width="100" height="110" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<rect x="400" y="385" width="100" height="55" fill="var(--warn)"/>
<text x="150" y="152" text-anchor="middle" class="g">5×</text>
<text x="300" y="317" text-anchor="middle" class="g">2×</text>
<text x="450" y="372" text-anchor="middle" class="g" style="fill:var(--warn)">1×</text>
<text x="150" y="468" text-anchor="middle" class="b">Code</text>
<text x="300" y="468" text-anchor="middle" class="b">Wits</text>
<text x="450" y="468" text-anchor="middle" class="b">Self-QA</text>
<line x1="500" y1="385" x2="700" y2="385" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="7 6"/>
<rect x="700" y="165" width="100" height="220" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="750" y="280" text-anchor="middle" class="b">Not 5×</text>
<rect x="700" y="385" width="100" height="55" fill="var(--accent)"/>
<text x="750" y="372" text-anchor="middle" class="g" style="fill:var(--accent)">1×</text>
<text x="750" y="468" text-anchor="middle" class="b">Output</text>
</svg>
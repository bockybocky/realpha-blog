<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="蓋廠時間兩根橫條，一長一短，短的先抵達新增產能">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">誰先把產能蓋出來</text>

<rect x="50" y="100" width="860" height="270" rx="14" fill="var(--card)"/>
<line x1="230" y1="140" x2="230" y2="330" stroke="var(--line)" stroke-width="2"/>

<text x="206" y="202" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="end">美國　韓國　日本</text>
<rect x="230" y="180" width="600" height="36" rx="4" fill="var(--grey)"/>
<text x="530" y="205" font-size="16" fill="var(--page)" text-anchor="middle">兩年半到三年</text>

<text x="206" y="292" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="end">中國</text>
<rect x="230" y="270" width="360" height="36" rx="4" fill="var(--accent)"/>
<text x="410" y="295" font-size="16" fill="var(--page)" text-anchor="middle">十八個月</text>
<path d="M600 288 L700 288" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M700 288 l-12 -7 v14 z" fill="var(--accent)"/>
<text x="712" y="294" font-size="19" font-weight="700" fill="var(--accent)">先上線</text>

<text x="60" y="446" font-size="22" font-weight="700" fill="var(--ink)">缺的東西一樣缺，差在上線速度</text>
</svg>
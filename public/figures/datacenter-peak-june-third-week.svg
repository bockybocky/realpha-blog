<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="相對強弱線在六月第三週形成高點後下彎，高點正對維吉尼亞加稅與德州暫停令兩個政策事件">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">高點落在六月第三週</text>
  <text class="t" x="60" y="96" font-size="16" fill="var(--dim)">AI 硬體股相對標普 500 的走勢（示意）</text>

  <line x1="100" y1="400" x2="900" y2="400" stroke="var(--line)" stroke-width="2"/>
  <polyline points="110,340 200,310 290,268 380,232 470,196 520,176 580,224 660,268 740,300 820,348 890,372"
            fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="520" cy="176" r="9" fill="var(--warn)"/>
  <line x1="520" y1="186" x2="520" y2="396" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/>

  <text class="t" x="110" y="318" font-size="19" font-weight="600" fill="var(--dim)">二月：他講過，沒人聽</text>

  <rect x="340" y="424" width="360" height="92" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="360" y="452" font-size="20" font-weight="700" fill="var(--ink)">六月第三週</text>
  <text class="t" x="360" y="478" font-size="16" fill="var(--dim)">維吉尼亞　6 億美元加稅</text>
  <text class="t" x="360" y="502" font-size="16" fill="var(--dim)">德州州長　壓下暫停令</text>

  <text class="t" x="760" y="352" font-size="19" font-weight="600" fill="var(--dim)">11／3 公投</text>
  <text class="t" x="60" y="542" font-size="22" font-weight="700" fill="var(--ink)">不是財報那天，是加稅那週</text>
</svg>
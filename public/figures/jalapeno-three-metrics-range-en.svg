<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three bars measured against a previous-generation baseline, with the lead multiples widening across the three metrics in turn">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">Three wins, against last gen</text>
<text x="60" y="92" font-size="16" fill="var(--dim)">Baseline = Blackwell, single-rack test</text>

<line x1="320" y1="130" x2="320" y2="404" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="474" y1="130" x2="474" y2="404" stroke="var(--line)" stroke-width="1"/>
<line x1="629" y1="130" x2="629" y2="404" stroke="var(--line)" stroke-width="1"/>
<line x1="783" y1="130" x2="783" y2="404" stroke="var(--line)" stroke-width="1"/>

<text x="320" y="430" font-size="15" fill="var(--dim)" text-anchor="middle">1×</text>
<text x="474" y="430" font-size="15" fill="var(--dim)" text-anchor="middle">2×</text>
<text x="629" y="430" font-size="15" fill="var(--dim)" text-anchor="middle">3×</text>
<text x="783" y="430" font-size="15" fill="var(--dim)" text-anchor="middle">4×</text>

<line x1="320" y1="182" x2="397" y2="182" stroke="var(--line)" stroke-width="2"/>
<rect x="397" y="160" width="62" height="44" rx="6" fill="var(--accent)"/>
<text x="60" y="182" font-size="19" fill="var(--ink)" dominant-baseline="middle">Throughput per watt</text>
<text x="471" y="182" font-size="16" fill="var(--dim)" dominant-baseline="middle">1.5-1.9×</text>

<line x1="320" y1="262" x2="428" y2="262" stroke="var(--line)" stroke-width="2"/>
<rect x="428" y="240" width="293" height="44" rx="6" fill="var(--accent)"/>
<text x="60" y="262" font-size="19" fill="var(--ink)" dominant-baseline="middle">End-to-end response</text>
<text x="733" y="262" font-size="16" fill="var(--dim)" dominant-baseline="middle">1.7-3.6×</text>

<line x1="320" y1="342" x2="490" y2="342" stroke="var(--line)" stroke-width="2"/>
<rect x="490" y="320" width="308" height="44" rx="6" fill="var(--accent)"/>
<text x="60" y="342" font-size="19" fill="var(--ink)" dominant-baseline="middle">Latency ceiling</text>
<text x="810" y="342" font-size="16" fill="var(--dim)" dominant-baseline="middle">2.1-4.1×</text>

<text x="60" y="482" font-size="22" fill="var(--ink)">Wins on efficiency and speed, and it cannot train</text>
</svg>
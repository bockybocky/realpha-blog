<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A pipe with a looping arrow on the left, and on the right a segmented battery gauge mostly drained with two cells left">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">Attention: a stock, not a flow</text>
<rect x="60" y="110" width="390" height="280" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="510" y="110" width="390" height="280" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="92" y="154" font-size="20" fill="var(--dim)">Seen as flow</text>
<line x1="100" y1="228" x2="400" y2="228" stroke="var(--grey)" stroke-width="3"/>
<line x1="100" y1="278" x2="400" y2="278" stroke="var(--grey)" stroke-width="3"/>
<line x1="150" y1="253" x2="210" y2="253" stroke="var(--grey)" stroke-width="3"/>
<polygon points="222,253 204,246 204,260" fill="var(--grey)"/>
<line x1="250" y1="253" x2="310" y2="253" stroke="var(--grey)" stroke-width="3"/>
<polygon points="322,253 304,246 304,260" fill="var(--grey)"/>
<path d="M400 228 C 430 190, 130 178, 106 214" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="7 6"/>
<polygon points="100,224 116,208 106,204" fill="var(--grey)"/>
<text x="92" y="348" font-size="16" fill="var(--dim)">It refills</text>
<text x="542" y="154" font-size="20" fill="var(--accent)">It's a stock</text>
<rect x="545" y="220" width="320" height="66" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
<rect x="553" y="228" width="38" height="50" fill="var(--grey)"/>
<rect x="597" y="228" width="38" height="50" fill="var(--grey)"/>
<rect x="641" y="228" width="38" height="50" fill="var(--grey)"/>
<rect x="685" y="228" width="38" height="50" fill="var(--grey)"/>
<rect x="729" y="228" width="38" height="50" fill="var(--grey)"/>
<rect x="773" y="228" width="38" height="50" fill="var(--accent)"/>
<rect x="817" y="228" width="38" height="50" fill="var(--accent)"/>
<text x="542" y="348" font-size="16" fill="var(--dim)">Spent is gone</text>
<text x="60" y="462" font-size="22" fill="var(--ink)">Burn it, and you won't see clearly later</text>
</svg>
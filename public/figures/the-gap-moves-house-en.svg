<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Before and after: the gap block moves from the upper bar to the lower one, with no reduction in total area">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600;fill:var(--dim)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<defs><marker id="ahD" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="var(--dim)"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">The gap moved, didn't shrink</text>
<text class="g" x="60" y="122">Before</text>
<text class="b" x="60" y="168">Memory</text>
<rect x="60" y="182" width="340" height="52" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="250" y="182" width="150" height="52" rx="8" fill="var(--warn)"/>
<text class="b" x="60" y="286">Substrate</text>
<rect x="60" y="300" width="340" height="52" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="340" y="300" width="60" height="52" rx="8" fill="var(--warn)"/>
<line x1="440" y1="266" x2="516" y2="266" stroke="var(--dim)" stroke-width="3" marker-end="url(#ahD)"/>
<text class="b" x="478" y="248" text-anchor="middle">Bypassed</text>
<text class="g" x="560" y="122">After</text>
<text class="b" x="560" y="168">Memory</text>
<rect x="560" y="182" width="340" height="52" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="850" y="182" width="50" height="52" rx="8" fill="var(--warn)"/>
<text class="b" x="560" y="286">Substrate</text>
<rect x="560" y="300" width="340" height="52" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="730" y="300" width="170" height="52" rx="8" fill="var(--warn)"/>
<rect x="60" y="400" width="26" height="18" rx="4" fill="var(--warn)"/>
<text class="b" x="98" y="415">Gap</text>
<text class="c" x="60" y="500">You moved the limit, not solved it</text>
</svg>
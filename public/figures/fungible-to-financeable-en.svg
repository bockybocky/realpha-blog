<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A five-step staircase descending from general-purpose all the way down to lowest total cost of ownership.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">The chain that links all the way down</text>

<rect x="80" y="110" width="200" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="180" y="150" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">General</text>

<rect x="230" y="186" width="200" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="330" y="226" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Fungible</text>

<rect x="380" y="262" width="200" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="480" y="302" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Lower risk</text>

<rect x="530" y="338" width="240" height="64" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="650" y="378" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">Rentable, financeable</text>

<rect x="700" y="414" width="200" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="800" y="454" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Lowest TCO</text>

<line x1="180" y1="174" x2="280" y2="186" stroke="var(--grey)" stroke-width="2"/>
<line x1="330" y1="250" x2="430" y2="262" stroke="var(--grey)" stroke-width="2"/>
<line x1="480" y1="326" x2="580" y2="338" stroke="var(--grey)" stroke-width="2"/>
<line x1="650" y1="402" x2="750" y2="414" stroke="var(--grey)" stroke-width="2"/>

<text class="t" x="80" y="300" font-size="16" fill="var(--dim)">Specialised</text>
<text class="t" x="80" y="326" font-size="16" fill="var(--warn)">Breaks at step two</text>
<line x1="150" y1="290" x2="300" y2="250" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
</svg>
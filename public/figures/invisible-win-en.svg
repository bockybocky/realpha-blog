<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The shaded area between a rising dashed line and a flat solid line represents a win that never shows up on the bill.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">Unseen</text>

<line x1="120" y1="420" x2="880" y2="420" stroke="var(--line)"/>
<line x1="120" y1="120" x2="120" y2="420" stroke="var(--line)"/>
<text class="b" x="120" y="452">Now</text>
<text class="b" x="880" y="452" text-anchor="end">Next</text>

<path d="M120 320 L820 320 L820 160 Z" fill="var(--card)"/>
<polyline points="120,320 400,255 620,200 820,160" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<polyline points="120,320 400,320 620,320 820,320" fill="none" stroke="var(--accent)" stroke-width="3"/>

<text class="g" x="836" y="166" fill="var(--warn)">No</text>
<text class="g" x="836" y="326" fill="var(--accent)">Yes</text>
<text class="g" x="440" y="256" fill="var(--dim)">Savings</text>
<text class="b" x="440" y="286" fill="var(--dim)">No bill line</text>

<text class="c" x="60" y="512">It kept a number flat</text>
</svg>
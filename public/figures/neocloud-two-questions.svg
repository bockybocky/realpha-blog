<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸分成兩段，中間有斷口，左段是現在這批卡，右段是下一輪再融資">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="80" y="72" font-size="27" font-weight="700" fill="var(--ink)">兩個數字，回答的不是同一題</text>

  <rect x="100" y="170" width="340" height="100" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="270" y="212" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">租賃價格還在漲</text>
  <text class="t" x="270" y="246" font-size="16" text-anchor="middle" fill="var(--dim)">這一批卡・算得過來</text>

  <rect x="620" y="170" width="340" height="100" rx="14" fill="var(--card)" stroke="var(--warn)" stroke-width="3" transform="translate(-100,0)"/>
  <text class="t" x="690" y="212" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">債券殖利率 15%</text>
  <text class="t" x="690" y="246" font-size="16" text-anchor="middle" fill="var(--dim)">下一輪・借不借得到</text>

  <rect x="100" y="330" width="340" height="18" rx="9" fill="var(--accent)"/>
  <rect x="520" y="330" width="340" height="18" rx="9" fill="var(--warn)"/>
  <line x1="446" y1="339" x2="514" y2="339" stroke="var(--grey)" stroke-width="4" stroke-dasharray="9 9"/>

  <line x1="270" y1="276" x2="270" y2="324" stroke="var(--accent)" stroke-width="3"/>
  <line x1="690" y1="276" x2="690" y2="324" stroke="var(--warn)" stroke-width="3"/>

  <text class="t" x="270" y="388" font-size="16" text-anchor="middle" fill="var(--dim)">已經買下的卡</text>
  <text class="t" x="690" y="388" font-size="16" text-anchor="middle" fill="var(--dim)">還沒借到的錢</text>
  <text class="t" x="480" y="388" font-size="16" text-anchor="middle" fill="var(--grey)">斷口</text>

  <text class="t" x="480" y="458" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">這一輪算得過來，不保證下一輪借得到</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Flow: after the shrink path hits a wall, chip area grows step by step while the yield line on the right falls at the same time.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="70" y="76">Can't go smaller, only bigger</text>

<text class="g" x="70" y="150">Smaller</text>
<line x1="70" y1="178" x2="196" y2="178" stroke="var(--grey)" stroke-width="6"/>
<rect x="202" y="140" width="14" height="76" fill="var(--warn)"/>
<text class="b" x="70" y="246">Wall</text>

<text class="g" x="280" y="150">Bigger</text>
<rect x="280" y="176" width="44" height="44" rx="4" fill="var(--accent)" opacity="0.5"/>
<rect x="344" y="162" width="68" height="68" rx="4" fill="var(--accent)" opacity="0.72"/>
<rect x="432" y="142" width="104" height="104" rx="4" fill="var(--accent)"/>
<text class="b" x="280" y="282">Die area</text>

<text class="g" x="620" y="150">Packaging ↑</text>
<text class="g" x="620" y="186" fill="var(--warn)">Substrate yield ↓</text>
<polyline points="620,230 700,256 780,296 880,340" fill="none" stroke="var(--warn)" stroke-width="5"/>
<circle cx="880" cy="340" r="7" fill="var(--warn)"/>

<line x1="70" y1="396" x2="890" y2="396" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="70" y="440">Oligopoly   Leading edge locked up</text>
<text class="b" x="70" y="472">Not unwilling to expand</text>
<text class="c" x="70" y="516">They simply can't make it</text>
</svg>
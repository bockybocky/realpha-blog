<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左格三條線各自上下起伏互不相關，右格三條線同時向右下墜落，下方標註現金等於零"><rect x="0" y="0" width="960" height="560" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style><g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'><text x="60" y="58" font-size="27px" fill="var(--ink)" text-anchor="start" font-weight="600">極端狀態下，分散會同時失效</text><rect x="60" y="110" width="400" height="300" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/><rect x="500" y="110" width="400" height="300" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/><polyline points="90,180 140,150 190,200 240,170 290,210 340,165 390,195 440,160" fill="none" stroke="var(--grey)" stroke-width="3"/><polyline points="90,250 140,280 190,240 240,275 290,235 340,270 390,245 440,285" fill="none" stroke="var(--grey)" stroke-width="3"/><polyline points="90,340 140,315 190,355 240,320 290,350 340,310 390,345 440,325" fill="none" stroke="var(--grey)" stroke-width="3"/><polyline points="530,165 580,175 630,200 680,250 730,305 780,350 830,375 880,390" fill="none" stroke="var(--warn)" stroke-width="3"/><polyline points="530,215 580,225 630,245 680,285 730,325 780,358 830,378 880,392" fill="none" stroke="var(--warn)" stroke-width="3"/><polyline points="530,265 580,272 630,288 680,312 730,340 780,364 830,382 880,394" fill="none" stroke="var(--warn)" stroke-width="3"/><text x="260" y="444" font-size="19px" fill="var(--dim)" text-anchor="middle" font-weight="normal">平常：各走各的</text><text x="700" y="444" font-size="19px" fill="var(--warn)" text-anchor="middle" font-weight="normal">極端：一起下去</text><text x="700" y="478" font-size="16px" fill="var(--dim)" text-anchor="middle" font-weight="normal">要賣的大股票也跌停</text><text x="60" y="524" font-size="22px" fill="var(--ink)" text-anchor="start" font-weight="600">賣得掉，才算彈藥</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="Six small panels: one line up, one flat, four down — the one going up is product revenue.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .bb { font-size:16px; font-weight:700; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="620" fill="var(--page)"/>
<text class="t" x="40" y="48">Revenue up, signals slow</text>
<text class="d" x="40" y="78">YoY growth, 5/27 → 9/2 (NRR = level)</text>
<rect x="40" y="95" width="280" height="220" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="bb" x="60" y="127">Product revenue</text>
<line x1="80" y1="285" x2="280" y2="285" stroke="var(--line)" stroke-width="1.5"/>
<line x1="110" y1="184" x2="250" y2="175" stroke="var(--accent)" stroke-width="3"/>
<circle cx="110" cy="184" r="6" fill="var(--accent)"/>
<circle cx="250" cy="175" r="6" fill="var(--accent)"/>
<text class="bb" x="100" y="189" text-anchor="end">34%</text>
<text class="bb" x="260" y="180">37%</text>
<text class="d" x="110" y="307" text-anchor="middle">5/27</text>
<text class="d" x="250" y="307" text-anchor="middle">9/2</text>
<rect x="340" y="95" width="280" height="220" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="bb" x="360" y="127">Net revenue retention</text>
<line x1="380" y1="285" x2="580" y2="285" stroke="var(--line)" stroke-width="1.5"/>
<line x1="410" y1="175" x2="550" y2="175" stroke="var(--grey)" stroke-width="3"/>
<circle cx="410" cy="175" r="6" fill="var(--grey)"/>
<circle cx="550" cy="175" r="6" fill="var(--grey)"/>
<text class="bb" x="400" y="180" text-anchor="end">126%</text>
<text class="bb" x="560" y="180">126%</text>
<text class="d" x="410" y="307" text-anchor="middle">5/27</text>
<text class="d" x="550" y="307" text-anchor="middle">9/2</text>
<rect x="640" y="95" width="280" height="220" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="bb" x="660" y="127">RPO</text>
<line x1="680" y1="285" x2="880" y2="285" stroke="var(--line)" stroke-width="1.5"/>
<line x1="710" y1="175" x2="850" y2="198" stroke="var(--warn)" stroke-width="3"/>
<circle cx="710" cy="175" r="6" fill="var(--warn)"/>
<circle cx="850" cy="198" r="6" fill="var(--warn)"/>
<text class="bb" x="700" y="180" text-anchor="end">38%</text>
<text class="bb" x="860" y="203">30%</text>
<text class="d" x="710" y="307" text-anchor="middle">5/27</text>
<text class="d" x="850" y="307" text-anchor="middle">9/2</text>
<rect x="40" y="335" width="280" height="220" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="bb" x="60" y="367">New customers</text>
<line x1="80" y1="525" x2="280" y2="525" stroke="var(--line)" stroke-width="1.5"/>
<line x1="110" y1="415" x2="250" y2="432" stroke="var(--warn)" stroke-width="3"/>
<circle cx="110" cy="415" r="6" fill="var(--warn)"/>
<circle cx="250" cy="432" r="6" fill="var(--warn)"/>
<text class="bb" x="100" y="420" text-anchor="end">38%</text>
<text class="bb" x="260" y="437">32%</text>
<text class="d" x="110" y="547" text-anchor="middle">5/27</text>
<text class="d" x="250" y="547" text-anchor="middle">9/2</text>
<rect x="340" y="335" width="280" height="220" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="bb" x="360" y="367">Live use cases</text>
<line x1="380" y1="525" x2="580" y2="525" stroke="var(--line)" stroke-width="1.5"/>
<line x1="410" y1="415" x2="550" y2="439" stroke="var(--warn)" stroke-width="3"/>
<circle cx="410" cy="415" r="6" fill="var(--warn)"/>
<circle cx="550" cy="439" r="6" fill="var(--warn)"/>
<text class="bb" x="400" y="420" text-anchor="end">114%</text>
<text class="bb" x="560" y="444">89%</text>
<text class="d" x="410" y="547" text-anchor="middle">5/27</text>
<text class="d" x="550" y="547" text-anchor="middle">9/2</text>
<rect x="640" y="335" width="280" height="220" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="bb" x="660" y="367">Wins per rep</text>
<line x1="680" y1="525" x2="880" y2="525" stroke="var(--line)" stroke-width="1.5"/>
<line x1="710" y1="415" x2="850" y2="470" stroke="var(--warn)" stroke-width="3"/>
<circle cx="710" cy="415" r="6" fill="var(--warn)"/>
<circle cx="850" cy="470" r="6" fill="var(--warn)"/>
<text class="bb" x="700" y="420" text-anchor="end">86%</text>
<text class="bb" x="860" y="475">43%</text>
<text class="d" x="710" y="547" text-anchor="middle">5/27</text>
<text class="d" x="850" y="547" text-anchor="middle">9/2</text>
<text class="c" x="480" y="600" text-anchor="middle">One up, one flat, four down</text>
</svg>
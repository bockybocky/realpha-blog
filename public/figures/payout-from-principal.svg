<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-label="三根堆疊長條：放進 10；利息付的配息疊在完整本金上變 11；從本金切出的配息讓本金剩 9，加起來仍是 10。">
<rect x="0" y="0" width="960" height="590" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:600}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}.p{fill:var(--page)}
</style>
<text class="t" x="480" y="52" text-anchor="middle">同樣領到 1，總資產不一樣</text>
<text class="d" x="480" y="88" text-anchor="middle">示意：一開始放進 10</text>
<rect x="150" y="180" width="140" height="300" fill="var(--grey)"/>
<rect x="410" y="180" width="140" height="300" fill="var(--grey)"/>
<rect x="410" y="150" width="140" height="30" fill="var(--accent)"/>
<rect x="670" y="210" width="140" height="270" fill="var(--grey)"/>
<rect x="670" y="180" width="140" height="30" fill="var(--warn)"/>
<line x1="120" y1="180" x2="840" y2="180" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="100" y1="480" x2="860" y2="480" stroke="var(--dim)" stroke-width="2"/>
<text class="g" x="220" y="166" text-anchor="middle">10</text>
<text class="g" x="480" y="138" text-anchor="middle">11</text>
<text class="g" x="740" y="166" text-anchor="middle">10</text>
<text class="b" x="220" y="340" text-anchor="middle">本金 10</text>
<text class="b" x="480" y="340" text-anchor="middle">本金 10</text>
<text class="b" x="740" y="350" text-anchor="middle">本金 9</text>
<text class="d" x="560" y="171">配息 1</text>
<text class="d" x="820" y="201">配息 1</text>
<text class="g" x="220" y="512" text-anchor="middle">放進去</text>
<text class="g" x="480" y="512" text-anchor="middle">利息付的</text>
<text class="g" x="740" y="512" text-anchor="middle">本金切的</text>
<text class="c" x="480" y="565" text-anchor="middle">領到手一樣，總資產沒變多</text>
</svg>
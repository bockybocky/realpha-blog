<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Normally the warm water piles into one western corner; in an El Nino the same warm water spreads across the whole tropical Pacific." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="56" font-size="27" fill="var(--ink)">The warm pool gets blown to one side, then spreads</text>

  <rect x="60" y="90" width="380" height="300" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="76" y="126" font-size="19" fill="var(--ink)">Normally</text>
  <text x="250" y="152" font-size="16" fill="var(--dim)" text-anchor="middle">Trade winds</text>
  <line x1="410" y1="172" x2="100" y2="172" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="88,172 104,165 104,179" fill="var(--dim)"/>
  <line x1="76" y1="204" x2="424" y2="204" stroke="var(--line)" stroke-width="2"/>
  <path d="M76,206 H252 C214,300 142,322 76,320 Z" fill="var(--accent)"/>
  <text x="130" y="256" font-size="16" fill="var(--page)">Warm pool</text>
  <text x="76" y="372" font-size="15" fill="var(--dim)">West Pacific</text>
  <text x="424" y="372" font-size="15" fill="var(--dim)" text-anchor="end">South America</text>

  <rect x="520" y="90" width="380" height="300" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="536" y="126" font-size="19" fill="var(--ink)">El Nino</text>
  <text x="800" y="152" font-size="16" fill="var(--dim)" text-anchor="middle">Trades weaken</text>
  <line x1="860" y1="172" x2="780" y2="172" stroke="var(--grey)" stroke-width="2"/>
  <polygon points="768,172 784,165 784,179" fill="var(--grey)"/>
  <line x1="536" y1="204" x2="884" y2="204" stroke="var(--line)" stroke-width="2"/>
  <path d="M536,206 H884 L884,246 C760,276 656,264 536,258 Z" fill="var(--accent)"/>
  <text x="700" y="238" font-size="16" fill="var(--page)" text-anchor="middle">Spreads out</text>
  <text x="536" y="372" font-size="15" fill="var(--dim)">West Pacific</text>
  <text x="884" y="372" font-size="15" fill="var(--dim)" text-anchor="end">South America</text>

  <text x="60" y="452" font-size="22" fill="var(--ink)">The same heat, laid out differently</text>
</svg>
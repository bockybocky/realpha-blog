<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="直角形狀，向右的長線完全水平，向上的短線一舉抬高" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <text x="60" y="56" font-size="27" fill="var(--ink)">兩個方向，只有一個會動價格</text>

  <line x1="140" y1="400" x2="860" y2="400" stroke="var(--grey)" stroke-width="6"/>
  <polygon points="876,400 856,390 856,410" fill="var(--grey)"/>
  <circle cx="140" cy="400" r="9" fill="var(--grey)"/>
  <text x="300" y="434" font-size="19" fill="var(--dim)">出貨量翻倍</text>
  <text x="300" y="382" font-size="16" fill="var(--dim)">單價還是 4 美元</text>

  <line x1="140" y1="400" x2="140" y2="170" stroke="var(--accent)" stroke-width="6"/>
  <polygon points="140,154 130,174 150,174" fill="var(--accent)"/>
  <text x="166" y="196" font-size="19" fill="var(--accent)">架構換一代</text>
  <text x="166" y="226" font-size="16" fill="var(--ink)">同一顆跳到 50 美元</text>

  <text x="60" y="486" font-size="22" fill="var(--ink)">要盯的是縱軸，不是橫軸。</text>
</svg>
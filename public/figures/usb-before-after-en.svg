<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A thick laptop on the left holding two large gray blocks for the optical and floppy drives, shrinking on the right to a single slim USB stick">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Same need, a different size</text>

<rect x="60" y="110" width="380" height="270" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="80" y="146" font-size="20" fill="var(--dim)">Laptops back then</text>
<rect x="86" y="176" width="160" height="118" rx="6" fill="var(--grey)"/>
<rect x="262" y="176" width="160" height="118" rx="6" fill="var(--grey)"/>
<text x="106" y="242" font-size="16" fill="var(--page)">Floppy drive</text>
<text x="282" y="242" font-size="16" fill="var(--page)">Optical drive</text>
<text x="86" y="330" font-size="16" fill="var(--warn)">Adds $20~30</text>
<text x="86" y="358" font-size="16" fill="var(--warn)">Only 1.44MB a disk</text>

<line x1="470" y1="245" x2="556" y2="245" stroke="var(--accent)" stroke-width="3"/>
<path d="M556 245 L540 236 L540 254 Z" fill="var(--accent)"/>

<rect x="586" y="110" width="314" height="270" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="606" y="146" font-size="20" fill="var(--dim)">Later</text>
<rect x="640" y="228" width="206" height="34" rx="6" fill="var(--accent)"/>
<rect x="606" y="236" width="38" height="18" rx="3" fill="var(--accent)"/>
<text x="606" y="330" font-size="16" fill="var(--ink)">One USB stick</text>
<text x="606" y="358" font-size="16" fill="var(--ink)">Same job, cheap and usable</text>

<text x="60" y="452" font-size="22" fill="var(--ink)">The need was always there; size and price changed</text>
</svg>
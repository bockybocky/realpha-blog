<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="一條折線從左端的高點往下凹成一個谷底再回到右端的高點，谷底那一段標著一年，底下寫著調不出分事業獲利、先去聽投資人要什麼、回來把內部系統建起來"><rect x="0" y="0" width="960" height="600" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
<text x="80" y="60" font-size="27" fill="var(--ink)">那一年卡在哪裡</text>
<text x="80" y="92" font-size="16" fill="var(--dim)">董事會決定要把資料做好，到真的端出來，中間差了一年</text>
<line x1="140" y1="168" x2="820" y2="168" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="440" y="150" width="80" height="34" fill="var(--page)"/>
<text x="480" y="175" font-size="20" fill="var(--dim)" text-anchor="middle">一年</text>
<path d="M140 250 C 300 250, 320 420, 480 420 C 640 420, 660 250, 820 250" fill="none" stroke="var(--accent)" stroke-width="3"/>
<circle cx="140" cy="250" r="8" fill="var(--accent)"/>
<circle cx="820" cy="250" r="8" fill="var(--accent)"/>
<text x="160" y="228" font-size="19" fill="var(--ink)">董事會拍板：資料要做好</text>
<text x="800" y="228" font-size="19" fill="var(--ink)" text-anchor="end">投資人看到新的簡報</text>
<text x="480" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">發現內部調不出分事業獲利</text>
<text x="480" y="490" font-size="16" fill="var(--dim)" text-anchor="middle">先去聽投資人要什麼</text>
<text x="480" y="518" font-size="16" fill="var(--dim)" text-anchor="middle">回來把內部系統建起來</text>
<text x="80" y="572" font-size="22" fill="var(--ink)">建完之後的副作用：董事會自己的討論也變好</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The upper line carries one marker at its end, while the lower line carries five markers spread along it.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="56" font-size="27" fill="var(--ink)">Two orders, and whether you can see it early</text>

<text x="60" y="168" font-size="20" fill="var(--dim)">Order 1: compute gluts first</text>
<line x1="150" y1="212" x2="800" y2="212" stroke="var(--line)" stroke-width="5"/>
<circle cx="150" cy="212" r="7" fill="var(--grey)"/>
<circle cx="475" cy="212" r="7" fill="var(--grey)"/>
<circle cx="800" cy="212" r="11" fill="var(--warn)"/>
<g font-size="15" fill="var(--dim)" text-anchor="middle">
<text x="150" y="252">Building starts</text>
<text x="475" y="252">Built</text>
<text x="800" y="252">Glut shows up</text>
</g>
<text x="860" y="219" font-size="19" fill="var(--grey)">Once</text>

<text x="60" y="338" font-size="20" fill="var(--dim)">Order 2: money breaks first</text>
<line x1="150" y1="382" x2="800" y2="382" stroke="var(--line)" stroke-width="5"/>
<g fill="var(--accent)">
<circle cx="180" cy="382" r="9"/>
<circle cx="335" cy="382" r="9"/>
<circle cx="490" cy="382" r="9"/>
<circle cx="645" cy="382" r="9"/>
<circle cx="800" cy="382" r="9"/>
</g>
<g font-size="15" fill="var(--dim)" text-anchor="middle">
<text x="180" y="356">Funding news</text>
<text x="490" y="356">Power contracts</text>
<text x="800" y="356">New round</text>
<text x="335" y="418">Cash flow ratio</text>
<text x="645" y="418">Capital spending</text>
</g>
<text x="860" y="389" font-size="19" fill="var(--accent)">Quarterly</text>

<text x="60" y="484" font-size="22" fill="var(--ink)">Only the visible one gives you time to react.</text>
</g>
</svg>
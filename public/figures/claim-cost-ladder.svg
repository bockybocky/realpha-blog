<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四級階梯：空殼展品最低，自己說自己略高，會動的展品更高，客戶把商標放你門口最高">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="52">同一場展覽，四種說法的重量</text>

  <line x1="100" y1="440" x2="100" y2="110" stroke="var(--line)" stroke-width="2"/>
  <line x1="100" y1="440" x2="910" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="d" x="60" y="100">重量</text>

  <rect x="140" y="408" width="150" height="32" fill="var(--warn)"/>
  <rect x="330" y="356" width="150" height="84" fill="var(--grey)"/>
  <rect x="520" y="250" width="150" height="190" fill="var(--accent)" opacity="0.55"/>
  <rect x="710" y="150" width="150" height="290" fill="var(--accent)"/>

  <text class="g" x="152" y="398">空殼展品</text>
  <text class="g" x="342" y="346">自己說自己</text>
  <text class="g" x="532" y="240">會動的展品</text>
  <text class="g" x="722" y="140">客戶站門口</text>

  <text class="d" x="152" y="472">只能被看</text>
  <text class="d" x="342" y="472">成本為零</text>
  <text class="d" x="532" y="472">可被追問數字</text>
  <text class="d" x="722" y="472">別人承擔風險</text>

  <text class="c" x="60" y="528">要別人點頭才說得出口的，那句才重</text>
</svg>
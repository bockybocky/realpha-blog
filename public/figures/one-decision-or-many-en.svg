<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two timelines of equal length, one with a single decision point, the other packed with them">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="48" y="56" font-size="27" font-weight="700" fill="var(--ink)">Decide once, or a hundred times</text>

  <rect x="48" y="100" width="416" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="78" y="142" font-size="20" font-weight="700" fill="var(--ink)">Rule written first</text>
  <line x1="84" y1="250" x2="428" y2="250" stroke="var(--line)" stroke-width="3"/>
  <circle cx="102" cy="250" r="13" fill="var(--accent)"/>
  <text x="86" y="218" font-size="15" fill="var(--accent)">Write</text>
  <line x1="424" y1="230" x2="424" y2="270" stroke="var(--dim)" stroke-width="3"/>
  <text x="386" y="292" font-size="16" fill="var(--dim)">Exit</text>
  <text x="78" y="380" font-size="16" fill="var(--dim)">Willpower once</text>

  <rect x="496" y="100" width="416" height="320" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="526" y="142" font-size="20" font-weight="700" fill="var(--ink)">Decide live</text>
  <line x1="532" y1="250" x2="876" y2="250" stroke="var(--line)" stroke-width="3"/>
  <circle cx="548" cy="250" r="8" fill="var(--warn)"/>
  <circle cx="576" cy="250" r="8" fill="var(--warn)"/>
  <circle cx="604" cy="250" r="8" fill="var(--warn)"/>
  <circle cx="632" cy="250" r="8" fill="var(--warn)"/>
  <circle cx="660" cy="250" r="8" fill="var(--warn)"/>
  <circle cx="688" cy="250" r="8" fill="var(--warn)"/>
  <circle cx="716" cy="250" r="8" fill="var(--warn)"/>
  <circle cx="744" cy="250" r="8" fill="var(--warn)"/>
  <circle cx="772" cy="250" r="8" fill="var(--warn)"/>
  <circle cx="800" cy="250" r="8" fill="var(--warn)"/>
  <circle cx="828" cy="250" r="8" fill="var(--warn)"/>
  <circle cx="856" cy="250" r="8" fill="var(--warn)"/>
  <text x="532" y="218" font-size="15" fill="var(--warn)">Again daily</text>
  <line x1="872" y1="230" x2="872" y2="270" stroke="var(--dim)" stroke-width="3"/>
  <text x="834" y="292" font-size="16" fill="var(--dim)">Exit</text>
  <text x="526" y="380" font-size="16" fill="var(--dim)">Willpower daily</text>

  <text x="480" y="478" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">Rules move the decision before emotion</text>
</svg>
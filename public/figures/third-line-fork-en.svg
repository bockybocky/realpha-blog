<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A question splits into two branches: the left points up for higher credibility, the right points down for a discount.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">Ask the third line and the advice forks</text>

<rect x="300" y="100" width="360" height="82" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="326" y="136">If I say no</text>
<text class="s" x="326" y="166">What does he lose</text>

<path d="M420 182 C 420 240, 260 230, 260 276" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M260 282 l-7 -14 h14 z" fill="var(--grey)"/>
<path d="M540 182 C 540 240, 700 230, 700 276" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M700 282 l-7 -14 h14 z" fill="var(--grey)"/>

<rect x="110" y="286" width="300" height="76" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="134" y="332" fill="var(--accent)">He loses nothing</text>
<line x1="260" y1="452" x2="260" y2="392" stroke="var(--accent)" stroke-width="4"/>
<path d="M260 380 l-10 18 h20 z" fill="var(--accent)"/>
<text class="s" x="290" y="430" fill="var(--accent)">Credibility goes up</text>

<rect x="550" y="286" width="300" height="76" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="574" y="322" fill="var(--warn)">One fewer ally</text>
<text class="s" x="574" y="348">Or one fewer sale</text>
<line x1="700" y1="386" x2="700" y2="440" stroke="var(--warn)" stroke-width="4"/>
<path d="M700 452 l-10 -18 h20 z" fill="var(--warn)"/>
<text class="s" x="730" y="430" fill="var(--warn)">Discount it first</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three stacked layers: CodexBar readings, the Regency protocol in charge, and herdr on the ground; the handover chain passes through only the top two layers, leaving herdr outside it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">Three parts, one layer each</text>

  <rect x="60" y="108" width="620" height="100" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="88" y="148" font-size="20" fill="var(--ink)">CodexBar　reads</text>
  <text x="88" y="180" font-size="16" fill="var(--dim)">How much left　·　reset in</text>

  <rect x="60" y="234" width="620" height="100" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="88" y="274" font-size="20" fill="var(--ink)">Regency　in charge</text>
  <text x="88" y="306" font-size="16" fill="var(--dim)">Hand over　·　sandbox　·　return</text>

  <rect x="60" y="360" width="620" height="100" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="88" y="400" font-size="20" fill="var(--dim)">herdr　on site</text>
  <text x="88" y="432" font-size="16" fill="var(--dim)">Work　·　stall　·　finish</text>

  <path d="M 720 128 L 720 316" stroke="var(--accent)" stroke-width="3" fill="none"/>
  <path d="M 720 316 l -7 -14 l 14 0 z" fill="var(--accent)"/>
  <circle cx="720" cy="158" r="6" fill="var(--accent)"/>
  <circle cx="720" cy="284" r="6" fill="var(--accent)"/>
  <text x="742" y="222" font-size="19" fill="var(--accent)">Chain</text>

  <path d="M 720 360 L 720 410" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
  <text x="742" y="416" font-size="16" fill="var(--grey)">Outside</text>

  <text x="60" y="502" font-size="22" fill="var(--ink)">"Stalled" and "out of quota" look identical on screen.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="A finely rising staircase above a coarse one that steps only twice a year, with a gap between them.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Costs arrive weekly, prices move twice a year</text>
<text x="60" y="90" font-size="15" fill="var(--dim)">What's on the plate was bought that week</text>

<line x1="120" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="130" x2="120" y2="460" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="488" font-size="15" fill="var(--dim)">Today</text>
<text x="900" y="488" font-size="15" fill="var(--dim)" text-anchor="end">Two years out</text>

<path d="M120 420 L153 420 L153 404 L186 404 L186 388 L219 388 L219 372 L252 372 L252 356 L285 356 L285 342 L318 342 L318 328 L351 328 L351 314 L384 314 L384 300 L417 300 L417 288 L450 288 L450 276 L483 276 L483 264 L516 264 L516 252 L549 252 L549 242 L582 242 L582 232 L615 232 L615 222 L648 222 L648 212 L681 212 L681 204 L714 204 L714 196 L747 196 L747 188 L780 188 L780 180 L813 180 L813 174 L846 174 L846 168 L879 168 L879 162 L900 162" fill="none" stroke="var(--warn)" stroke-width="3"/>

<path d="M120 440 L315 440 L315 370 L510 370 L510 300 L705 300 L705 230 L900 230" fill="none" stroke="var(--accent)" stroke-width="5"/>

<path d="M615 232 L615 300 L705 300 L705 230 L681 212 L648 222 Z" fill="var(--warn)" opacity="0.18"/>

<text x="640" y="152" font-size="19" fill="var(--warn)">Cost: a step a week</text>
<text x="640" y="430" font-size="19" fill="var(--accent)">Price: a jump every 6 months</text>
<text x="724" y="268" font-size="16" fill="var(--warn)">The gap left open</text>

<text x="60" y="540" font-size="22" font-weight="700" fill="var(--ink)">This business gets no grace period, only a lag</text>
</g>
</svg>
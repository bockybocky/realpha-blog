<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Three stacked layers: a wide crude layer flows into a narrow refining layer with a corner cut away, then out into an equally narrow product layer; the bottleneck is the middle one.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" fill="var(--ink)">Refining is scarce, not crude</text>

  <rect x="200" y="120" width="560" height="76" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="166" font-size="20" fill="var(--ink)" text-anchor="middle">Crude</text>
  <text class="t" x="186" y="152" font-size="15" fill="var(--dim)" text-anchor="end">Pipes reroute</text>
  <text class="t" x="186" y="178" font-size="15" fill="var(--dim)" text-anchor="end">Ships still go</text>
  <text class="t" x="776" y="166" font-size="15" fill="var(--dim)">Gap is smaller</text>

  <path d="M200,196 L760,196 L600,252 L360,252 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

  <rect x="360" y="252" width="240" height="98" fill="var(--accent)" opacity="0.16"/>
  <rect x="360" y="252" width="240" height="98" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="t" x="480" y="294" font-size="20" fill="var(--ink)" text-anchor="middle">Refining</text>
  <text class="t" x="480" y="322" font-size="15" fill="var(--dim)" text-anchor="middle">Years to build</text>
  <rect x="608" y="252" width="30" height="98" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="t" x="652" y="306" font-size="15" fill="var(--warn)">10% lost</text>

  <line x1="480" y1="350" x2="480" y2="374" stroke="var(--ink)" stroke-width="2.5"/>
  <polygon points="480,384 473,370 487,370" fill="var(--ink)"/>

  <rect x="360" y="388" width="240" height="76" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="480" y="434" font-size="20" fill="var(--ink)" text-anchor="middle">Diesel · jet fuel</text>
  <text class="t" x="622" y="428" font-size="15" fill="var(--warn)">Crack spread ↑</text>

  <text class="t" x="60" y="536" font-size="22" fill="var(--ink)">Breaks first, can't be rebuilt</text>
</svg>
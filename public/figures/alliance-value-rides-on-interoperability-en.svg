<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A curve rises from the lower left to the upper right, with how much value comes from interoperability on the horizontal axis and what the alliance is worth on the vertical axis, hugging the floor at the left end and lifting high at the right.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">Which axis holds it</text>
<line x1="140" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="3"/>
<line x1="140" y1="120" x2="140" y2="400" stroke="var(--line)" stroke-width="3"/>
<text class="b" x="140" y="436">Interop share  low</text>
<text class="b" x="760" y="436">High</text>
<text class="g" x="60" y="108">Value</text>
<path d="M 160 392 C 400 388 560 330 840 150" fill="none" stroke="var(--accent)" stroke-width="5"/>
<circle cx="168" cy="391" r="9" fill="var(--warn)"/>
<circle cx="838" cy="152" r="9" fill="var(--accent)"/>
<text class="b" x="186" y="372" fill="var(--warn)">Meeting cost</text>
<text class="g" x="672" y="130" fill="var(--accent)">Zelle  Akoya</text>
<text class="c" x="60" y="496">Best idea, wrong seat to fix it</text>
</svg>
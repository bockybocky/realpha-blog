<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="An upright wall with twenty dots packed on the left and only five dots on the right.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">80% are still in front of the same wall</text>
<circle cx="140" cy="170" r="16" fill="var(--grey)"/>
<circle cx="220" cy="170" r="16" fill="var(--grey)"/>
<circle cx="300" cy="170" r="16" fill="var(--grey)"/>
<circle cx="380" cy="170" r="16" fill="var(--grey)"/>
<circle cx="460" cy="170" r="16" fill="var(--grey)"/>
<circle cx="140" cy="250" r="16" fill="var(--grey)"/>
<circle cx="220" cy="250" r="16" fill="var(--grey)"/>
<circle cx="300" cy="250" r="16" fill="var(--grey)"/>
<circle cx="380" cy="250" r="16" fill="var(--grey)"/>
<circle cx="460" cy="250" r="16" fill="var(--grey)"/>
<circle cx="140" cy="330" r="16" fill="var(--grey)"/>
<circle cx="220" cy="330" r="16" fill="var(--grey)"/>
<circle cx="300" cy="330" r="16" fill="var(--grey)"/>
<circle cx="380" cy="330" r="16" fill="var(--grey)"/>
<circle cx="460" cy="330" r="16" fill="var(--grey)"/>
<circle cx="140" cy="410" r="16" fill="var(--grey)"/>
<circle cx="220" cy="410" r="16" fill="var(--grey)"/>
<circle cx="300" cy="410" r="16" fill="var(--grey)"/>
<circle cx="380" cy="410" r="16" fill="var(--grey)"/>
<circle cx="460" cy="410" r="16" fill="var(--grey)"/>
<rect x="540" y="120" width="24" height="300" fill="var(--grey)" stroke="var(--ink)"/>
<text x="552" y="104" text-anchor="middle" font-size="20" fill="var(--ink)">Security</text>
<circle cx="650" cy="200" r="16" fill="var(--accent)"/>
<circle cx="720" cy="200" r="16" fill="var(--accent)"/>
<circle cx="790" cy="200" r="16" fill="var(--accent)"/>
<circle cx="685" cy="280" r="16" fill="var(--accent)"/>
<circle cx="755" cy="280" r="16" fill="var(--accent)"/>
<text x="300" y="456" text-anchor="middle" font-size="19" fill="var(--dim)">80%: still piloting, phasing in</text>
<text x="720" y="456" text-anchor="middle" font-size="19" fill="var(--ink)">20%: pushing the edge</text>
<text x="480" y="496" text-anchor="middle" font-size="16" fill="var(--dim)">Behind the wall: data, storage, SaaS, management</text>
<text x="480" y="542" text-anchor="middle" font-size="22" fill="var(--ink)">Clear security first, then agents go live</text>
</svg>
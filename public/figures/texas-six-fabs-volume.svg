<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊九個實心方塊、右邊六個虛線方塊，每格等於一座標準先進廠，右邊那組標示為模型少算的量體">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); font-weight:700; }
  .g { font-size:20px; fill:var(--ink); font-weight:700; }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="70" y="58">看量體，不看金額</text>
<text class="g" x="70" y="118">亞利桑那</text>
<text class="b" x="196" y="118">至少九座</text>
<g fill="var(--grey)">
<rect x="70" y="140" width="76" height="76" rx="5"/><rect x="158" y="140" width="76" height="76" rx="5"/><rect x="246" y="140" width="76" height="76" rx="5"/>
<rect x="70" y="228" width="76" height="76" rx="5"/><rect x="158" y="228" width="76" height="76" rx="5"/><rect x="246" y="228" width="76" height="76" rx="5"/>
<rect x="70" y="316" width="76" height="76" rx="5"/><rect x="158" y="316" width="76" height="76" rx="5"/><rect x="246" y="316" width="76" height="76" rx="5"/>
</g>
<line x1="390" y1="130" x2="390" y2="400" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="440" y="118">德州第二園區</text>
<text class="b" x="606" y="118">評估中｜六座</text>
<g fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 6">
<rect x="440" y="140" width="76" height="76" rx="5"/><rect x="528" y="140" width="76" height="76" rx="5"/><rect x="616" y="140" width="76" height="76" rx="5"/>
<rect x="440" y="228" width="76" height="76" rx="5"/><rect x="528" y="228" width="76" height="76" rx="5"/><rect x="616" y="228" width="76" height="76" rx="5"/>
</g>
<text class="b" x="440" y="340">一格＝一座先進廠</text>
<text class="b" x="440" y="364">月產約三萬片</text>
<text class="b" x="440" y="388">產能擺在那裡，產值就定了</text>
<text class="c" x="70" y="474">原本的計算模型，少的就是右邊這六格</text>
</svg>
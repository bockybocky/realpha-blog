<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Eight thin dies are stacked on one thicker die at the bottom, and an arrow runs sideways from it to the GPU on the left.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">Base die: logic inside the memory stack</text>
<rect x="120" y="250" width="200" height="140" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text x="220" y="328" font-size="20" fill="var(--ink)" text-anchor="middle">GPU</text>
<rect x="540" y="140" width="240" height="24" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="168" width="240" height="24" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="196" width="240" height="24" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="224" width="240" height="24" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="252" width="240" height="24" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="280" width="240" height="24" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="308" width="240" height="24" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="336" width="240" height="24" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="800" y="200" font-size="19" fill="var(--dim)">DRAM</text>
<text x="800" y="226" font-size="19" fill="var(--dim)">8 layers stacked</text>
<rect x="528" y="366" width="264" height="48" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="4"/>
<text x="660" y="397" font-size="20" fill="var(--accent)" text-anchor="middle">Base die</text>
<rect x="500" y="424" width="320" height="18" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="840" y="438" font-size="16" fill="var(--dim)">Substrate</text>
<line x1="528" y1="390" x2="332" y2="340" stroke="var(--accent)" stroke-width="4"/>
<polygon points="332,340 350,336 344,352" fill="var(--accent)"/>
<text x="360" y="200" font-size="16" fill="var(--dim)">Signals convert here</text>
<line x1="470" y1="214" x2="520" y2="384" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="60" y="508" font-size="22" fill="var(--ink)">Every stack signal rides that layer</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Long lines for inflation and unemployment as the top worry, with inflation ending above where it began">
<defs>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
</defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">Who is the top worry</text>
<rect x="60" y="90" width="840" height="350" rx="14" fill="var(--card)" stroke="var(--line)"/>
<line x1="150" y1="120" x2="150" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="400" x2="870" y2="400" stroke="var(--line)" stroke-width="2"/>
<path d="M170 160 L300 148 L420 300 L560 356 L640 366 L700 200 L790 236 L850 246" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>
<path d="M170 330 L300 320 L420 200 L560 226 L640 300 L700 356 L790 344 L850 340" fill="none" stroke="var(--dim)" stroke-width="5" stroke-linecap="round"/>
<text class="g" x="184" y="140" fill="var(--warn)">Inflation</text>
<text class="g" x="184" y="356">Unemployment</text>
<line x1="880" y1="160" x2="880" y2="246" stroke="var(--warn)" stroke-width="3"/>
<line x1="870" y1="160" x2="890" y2="160" stroke="var(--warn)" stroke-width="3"/>
<line x1="870" y1="246" x2="890" y2="246" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="760" y="146" fill="var(--warn)">Not back yet</text>
<text class="s" x="170" y="428">The 1970s</text>
<text class="s" x="450" y="428">Decades after</text>
<text class="s" x="690" y="428">Post-pandemic</text>
<text class="c" x="60" y="492">Price stability = never having to notice it</text>
<text class="s" x="620" y="516">Shape only, not actual values</text>
</svg>
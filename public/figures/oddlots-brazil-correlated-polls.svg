<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="同樣十二份樣本，一邊全疊在一點像一團，一邊散開在整條帶上">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="50" y="58" font-size="27" font-weight="700" fill="var(--ink)">十二份，還是一份的十二個副本</text>

<rect x="50" y="100" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="74" y="134" font-size="20" font-weight="700" fill="var(--dim)">相關</text>
<line x1="80" y1="330" x2="420" y2="330" stroke="var(--line)" stroke-width="2"/>
<circle cx="330" cy="250" r="26" fill="var(--accent)" opacity="0.25"/>
<circle cx="336" cy="244" r="26" fill="var(--accent)" opacity="0.25"/>
<circle cx="324" cy="256" r="26" fill="var(--accent)" opacity="0.25"/>
<circle cx="340" cy="258" r="26" fill="var(--accent)" opacity="0.25"/>
<circle cx="320" cy="242" r="26" fill="var(--accent)" opacity="0.25"/>
<circle cx="332" cy="262" r="26" fill="var(--accent)" opacity="0.25"/>
<circle cx="328" cy="238" r="26" fill="var(--accent)" opacity="0.25"/>
<circle cx="344" cy="250" r="26" fill="var(--accent)" opacity="0.25"/>
<circle cx="316" cy="250" r="26" fill="var(--accent)" opacity="0.25"/>
<circle cx="334" cy="254" r="26" fill="var(--accent)" opacity="0.25"/>
<circle cx="326" cy="246" r="26" fill="var(--accent)" opacity="0.25"/>
<circle cx="338" cy="248" r="26" fill="var(--accent)" opacity="0.25"/>
<text x="330" y="364" font-size="16" fill="var(--ink)" text-anchor="middle">十二個圓</text>

<rect x="510" y="100" width="400" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="534" y="134" font-size="20" font-weight="700" fill="var(--dim)">獨立</text>
<line x1="540" y1="330" x2="880" y2="330" stroke="var(--line)" stroke-width="2"/>
<circle cx="566" cy="276" r="14" fill="var(--accent)" opacity="0.55"/>
<circle cx="596" cy="224" r="14" fill="var(--accent)" opacity="0.55"/>
<circle cx="626" cy="262" r="14" fill="var(--accent)" opacity="0.55"/>
<circle cx="656" cy="198" r="14" fill="var(--accent)" opacity="0.55"/>
<circle cx="686" cy="252" r="14" fill="var(--accent)" opacity="0.55"/>
<circle cx="716" cy="212" r="14" fill="var(--accent)" opacity="0.55"/>
<circle cx="746" cy="286" r="14" fill="var(--accent)" opacity="0.55"/>
<circle cx="776" cy="232" r="14" fill="var(--accent)" opacity="0.55"/>
<circle cx="806" cy="268" r="14" fill="var(--accent)" opacity="0.55"/>
<circle cx="836" cy="206" r="14" fill="var(--accent)" opacity="0.55"/>
<circle cx="866" cy="250" r="14" fill="var(--accent)" opacity="0.55"/>
<circle cx="596" cy="300" r="14" fill="var(--accent)" opacity="0.55"/>
<text x="710" y="364" font-size="16" fill="var(--ink)" text-anchor="middle">十二個圓</text>

<text x="480" y="470" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">一樣多，分量不一樣</text>
</svg>
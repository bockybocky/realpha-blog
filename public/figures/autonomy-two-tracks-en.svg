<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two parallel tracks show the U.S. ahead at invention but with a short extension, while China's track starts behind at invention yet reaches overseas markets.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">Invention first, deployment later</text>
  <text class="t" x="60" y="100" font-size="16" fill="var(--dim)">Two autonomy tracks</text>

  <text class="t" x="290" y="152" font-size="19" fill="var(--dim)" text-anchor="middle">Technology invention</text>
  <text class="t" x="820" y="152" font-size="19" fill="var(--dim)" text-anchor="middle">Commercial deployment</text>
  <line x1="290" y1="166" x2="290" y2="430" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>

  <text class="t" x="60" y="232" font-size="20" font-weight="700" fill="var(--ink)">U.S.</text>
  <text class="t" x="60" y="258" font-size="16" fill="var(--dim)">Regulator asks: how?</text>
  <text class="t" x="60" y="280" font-size="16" fill="var(--dim)">Ensure nothing goes wrong</text>
  <line x1="200" y1="224" x2="470" y2="224" stroke="var(--grey)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="224" r="10" fill="var(--dim)"/>
  <text class="t" x="500" y="230" font-size="19" fill="var(--dim)">Stuck at the demo fleet</text>

  <text class="t" x="60" y="378" font-size="20" font-weight="700" fill="var(--ink)">China</text>
  <text class="t" x="60" y="404" font-size="16" fill="var(--dim)">Regulator asks: what do you need?</text>
  <text class="t" x="60" y="426" font-size="16" fill="var(--dim)">To move fast</text>
  <line x1="200" y1="370" x2="860" y2="370" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="255" cy="370" r="10" fill="var(--accent)"/>
  <text class="t" x="560" y="344" font-size="19" fill="var(--accent)" text-anchor="middle">Middle East・UK・Germany all moving</text>

  <text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">A late start, paired with low-cost cars, reaches the market first</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四輪運算單元柱狀圖：0.71、3.09、5.53 逐輪升高，第四輪成功 3.87 回落">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="80" y="78" font-size="27" font-weight="700" fill="var(--ink)">四輪的運算單元</text>
  <text class="t" x="80" y="112" font-size="16" fill="var(--dim)">越晚壞，越貴</text>
  <line x1="80" y1="460" x2="880" y2="460" stroke="var(--line)" stroke-width="2"/>
  <rect x="150" y="417" width="120" height="43" rx="4" fill="var(--grey)"/>
  <rect x="340" y="275" width="120" height="185" rx="4" fill="var(--grey)"/>
  <rect x="530" y="128" width="120" height="332" rx="4" fill="var(--grey)"/>
  <rect x="720" y="228" width="120" height="232" rx="4" fill="var(--accent)"/>
  <text class="t" x="210" y="400" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">0.71</text>
  <text class="t" x="400" y="258" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">3.09</text>
  <text class="t" x="590" y="111" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">5.53</text>
  <text class="t" x="780" y="211" font-size="22" font-weight="700" fill="var(--accent)" text-anchor="middle">3.87</text>
  <text class="t" x="210" y="492" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">第一輪</text>
  <text class="t" x="210" y="518" font-size="15" fill="var(--dim)" text-anchor="middle">清單檔名</text>
  <text class="t" x="400" y="492" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">第二輪</text>
  <text class="t" x="400" y="518" font-size="15" fill="var(--dim)" text-anchor="middle">接線尺寸</text>
  <text class="t" x="590" y="492" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">第三輪</text>
  <text class="t" x="590" y="518" font-size="15" fill="var(--dim)" text-anchor="middle">補格欄位</text>
  <text class="t" x="780" y="492" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">第四輪</text>
  <text class="t" x="780" y="518" font-size="15" fill="var(--accent)" text-anchor="middle">全部跑完</text>
</svg>
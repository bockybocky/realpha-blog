<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A before and after pair with the difference marked in the middle and two exits below, one keeps sleeping and one waiting for you.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="56" font-size="27" fill="var(--ink)">A ten-minute two-box check</text>

<rect x="40" y="110" width="380" height="200" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="66" y="150" font-size="20" fill="var(--dim)">Back then</text>
<text x="66" y="196" font-size="16" fill="var(--ink)">Three-hour commute</text>
<text x="66" y="232" font-size="16" fill="var(--ink)">No room to put it</text>
<text x="66" y="276" font-size="16" fill="var(--grey)">Do not write "no time"</text>

<rect x="540" y="110" width="380" height="200" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text x="566" y="150" font-size="20" fill="var(--dim)">Now</text>
<text x="566" y="196" font-size="16" fill="var(--ink)">Work from home</text>
<text x="566" y="232" font-size="16" fill="var(--ink)">One spare room</text>

<path d="M420 210 L540 210" stroke="var(--accent)" stroke-width="6"/>
<text x="436" y="186" font-size="19" fill="var(--accent)">Difference</text>

<path d="M230 310 L230 400 L300 400" fill="none" stroke="var(--grey)" stroke-width="5"/>
<rect x="300" y="366" width="230" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="326" y="410" font-size="19" fill="var(--dim)">No difference: let it sleep</text>

<path d="M730 310 L730 470 L560 470" fill="none" stroke="var(--accent)" stroke-width="5"/>
<rect x="330" y="436" width="230" height="68" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="356" y="480" font-size="19" fill="var(--accent)">Conditions changed: it waits for you</text>
</g>
</svg>
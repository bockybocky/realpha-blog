<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A tall bar on the left and a short bar on the right show a clear height gap between their tops, and that drop happens within one quarter.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); }
.g { font-size:20px; fill:var(--ink); }
.s { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="68">One quarter, straight down</text>

<line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>

<rect x="220" y="130" width="140" height="310" fill="var(--accent)"/>
<text class="g" x="236" y="112">140%</text>
<text class="s" x="236" y="472">Last quarter</text>

<rect x="620" y="345" width="140" height="95" fill="var(--grey)"/>
<text class="g" x="648" y="327">43%</text>
<text class="s" x="648" y="472">This quarter</text>

<line x1="360" y1="130" x2="620" y2="130" stroke="var(--line)" stroke-dasharray="5 6"/>
<line x1="590" y1="130" x2="590" y2="345" stroke="var(--warn)" stroke-width="3"/>
<polygon points="590,352 583,336 597,336" fill="var(--warn)"/>
<text class="s" x="430" y="246" fill="var(--warn)">Gap</text>

<line x1="60" y1="498" x2="900" y2="498" stroke="var(--line)"/>
<text class="c" x="60" y="530">A high base is not a start line</text>
</svg>
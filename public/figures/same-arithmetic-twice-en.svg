<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two forty-year rising lines with the same start and end, and a safe holding only fifteen dollars marked in between">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="72" font-size="27" font-weight="700" fill="var(--ink)">Two forty-year runs</text>

  <line x1="100" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="140" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">1945</text>
  <text class="t" x="500" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">1985</text>
  <text class="t" x="860" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">Today</text>

  <path d="M140 440 C 300 430, 400 320, 470 190" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M500 440 C 660 430, 790 320, 860 190" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>

  <circle cx="140" cy="440" r="6" fill="var(--accent)"/>
  <circle cx="500" cy="440" r="6" fill="var(--accent)"/>
  <text class="t" x="150" y="418" font-size="16" fill="var(--dim)">$15K</text>
  <text class="t" x="510" y="418" font-size="16" fill="var(--dim)">$15K</text>
  <text class="t" x="470" y="166" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">$1M</text>
  <text class="t" x="860" y="166" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">$1M</text>

  <rect x="452" y="500" width="96" height="44" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
  <text class="t" x="500" y="529" font-size="19" fill="var(--dim)" text-anchor="middle">$15</text>
  <text class="t" x="566" y="529" font-size="16" fill="var(--grey)">Everything in the safe</text>

  <text class="t" x="60" y="110" font-size="16" fill="var(--dim)">Same money, same market return</text>
</svg>
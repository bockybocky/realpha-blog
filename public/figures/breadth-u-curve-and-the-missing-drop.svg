<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="U 形曲線兩端高中間低，左端標出這次的位置與未先下跌的差異" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">參與度低之後，報酬反而偏強</text>

<line x1="140" y1="420" x2="620" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="120" x2="140" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="140" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">廣度極低</text>
<text x="620" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">廣度極高</text>
<text x="128" y="112" font-size="16" fill="var(--dim)" text-anchor="end">後續報酬</text>
<path d="M140 160 Q380 460 620 170" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="140" cy="160" r="9" fill="var(--warn)"/>
<text x="156" y="152" font-size="19" fill="var(--warn)">此刻的位置</text>

<rect x="680" y="150" width="220" height="110" fill="var(--card)" stroke="var(--line)"/>
<text x="700" y="186" font-size="19" fill="var(--dim)">歷史同樣情況</text>
<text x="700" y="226" font-size="22" fill="var(--ink)">97% 已先跌 5%</text>
<rect x="680" y="290" width="220" height="110" fill="var(--card)" stroke="var(--warn)"/>
<text x="700" y="326" font-size="19" fill="var(--warn)">這一次</text>
<text x="700" y="366" font-size="22" fill="var(--ink)">還沒跌</text>

<text x="60" y="520" font-size="22" fill="var(--ink)">結論和直覺相反，但前提是不走進衰退</text>
<text x="60" y="552" font-size="15" fill="var(--dim)">曲線為示意形狀，非實際數值</text>
</svg>
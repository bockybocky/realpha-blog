<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根直條：ZeroGPU 付費每小時 6 美元很高，租 3090 每小時 0.22 美元幾乎貼地">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .ti { font:700 27px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .lb { font:600 20px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .sm { font:400 16px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
    .cc { font:700 22px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--accent); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ti" x="80" y="66">同樣跑一小時</text>

  <line x1="80" y1="460" x2="880" y2="460" stroke="var(--line)" stroke-width="2"/>

  <rect x="200" y="120" width="140" height="340" rx="6" fill="var(--grey)"/>
  <text class="lb" x="200" y="104">6 美元</text>
  <text class="lb" x="188" y="496">ZeroGPU 付費</text>

  <rect x="600" y="448" width="140" height="12" rx="4" fill="var(--accent)"/>
  <text class="lb" x="600" y="430">0.22 美元</text>
  <text class="lb" x="600" y="496">租一張 3090</text>

  <text class="cc" x="80" y="542">二十幾倍</text>
  <text class="sm" x="560" y="542">卡不一樣，只是粗估</text>
</svg>
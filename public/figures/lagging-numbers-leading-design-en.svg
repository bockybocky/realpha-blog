<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A flat line above and a declining line below, with a dashed line on the right marking two or three generations later">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<text x="60" y="56" font-size="27" fill="var(--ink)">What the books show and what they do not</text>

<text x="120" y="176" font-size="20" fill="var(--dim)">Lagging indicator</text>
<line x1="120" y1="210" x2="880" y2="210" stroke="var(--accent)" stroke-width="4"/>
<text x="120" y="248" font-size="16" fill="var(--ink)">On-time shipping · revenue met</text>

<text x="120" y="316" font-size="20" fill="var(--dim)">Leading indicator</text>
<polyline points="140,340 320,362 500,392 680,418 860,438" fill="none" stroke="var(--warn)" stroke-width="4"/>
<text x="140" y="474" font-size="16" fill="var(--ink)">Risk taken in design</text>

<line x1="700" y1="150" x2="700" y2="470" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 8"/>
<text x="714" y="146" font-size="19" fill="var(--dim)">Noticed 2-3 gens later</text>

<line x1="120" y1="500" x2="880" y2="500" stroke="var(--line)" stroke-width="2"/>
<text x="800" y="530" font-size="16" fill="var(--dim)">Time</text>
<text x="60" y="96" font-size="16" fill="var(--dim)">Same period, two signals</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A two-axis plot with ad budget across and local meaning up: the small class sits top-left, the chain bottom-right, and the productivity yardstick covers only the right half.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t  { font-size:27px; fill:var(--ink); font-weight:700; }
    .g  { font-size:19px; fill:var(--dim); font-weight:700; }
    .b  { font-size:16px; fill:var(--ink); }
    .c  { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="40" y="54">That yardstick misses the top left</text>

  <rect x="150" y="100" width="740" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <rect x="520" y="100" width="370" height="330" fill="var(--accent)" opacity="0.08"/>
  <line x1="150" y1="430" x2="890" y2="430" stroke="var(--grey)" stroke-width="2"/>
  <line x1="150" y1="100" x2="150" y2="430" stroke="var(--grey)" stroke-width="2"/>
  <text class="g" x="150" y="464">Ad budget　small</text>
  <text class="g" x="890" y="464" text-anchor="end">large</text>
  <text class="g" x="134" y="118" text-anchor="end">high</text>
  <text class="g" x="134" y="424" text-anchor="end">low</text>
  <text class="g" x="40" y="270">Meaning to</text>
  <text class="g" x="40" y="294">this area</text>

  <circle cx="260" cy="170" r="12" fill="var(--warn)"/>
  <text class="b" x="286" y="166">Pottery class</text>
  <text class="b" x="286" y="190">Calligraphy class</text>
  <circle cx="760" cy="370" r="12" fill="var(--accent)"/>
  <text class="b" x="736" y="366" text-anchor="end">English chain</text>
  <text class="g" x="700" y="134" fill="var(--accent)">Productivity yardstick</text>
  <text class="c" x="40" y="520">Sales works the right; the magazine carries the top left</text>
</svg>
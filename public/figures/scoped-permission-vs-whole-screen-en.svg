<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two boxes of the same size; on the left only a small patch is filled, on the right the whole box is filled.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700; }
.g { font-size:20px; fill:var(--ink); font-weight:600; }
.b { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="48" y="58">Same screen, different area handed over</text>
<text class="g" x="48" y="108">Interface permission</text>
<rect x="48" y="128" width="396" height="258" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="76" y="160" width="104" height="60" rx="8" fill="var(--accent)"/>
<rect x="196" y="160" width="104" height="60" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="316" y="160" width="104" height="60" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="76" y="244" width="104" height="60" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="196" y="244" width="104" height="60" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="316" y="244" width="104" height="60" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="76" y="348">A defined set of actions</text>
<text class="g" x="516" y="108">Account login</text>
<rect x="516" y="128" width="396" height="258" rx="12" fill="var(--warn)"/>
<text class="b" x="544" y="348">Whole screen, click anywhere</text>
<text class="c" x="48" y="456">Across this line, the area handed over differs a lot</text>
</svg>
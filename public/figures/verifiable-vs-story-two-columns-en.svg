<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two columns: the left holds concrete, checkable items that flow into judgment; the right holds cycles, metaphors, and national destiny that only lead to setting them aside; one answer drawn out by a follow-up question moves from the right column into the left.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:700}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700;fill:var(--accent)}
.w{fill:var(--page)}.a{fill:var(--accent)}.wa{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="40" y="56" class="t">Judge only checkables</text>
<line x1="480" y1="96" x2="480" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="260" y="122" text-anchor="middle" class="g a">Testable</text>
<text x="700" y="122" text-anchor="middle" class="g d">No test</text>
<rect x="150" y="150" width="220" height="40" rx="20" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="260" y="176" text-anchor="middle" class="b">3 up</text>
<rect x="150" y="205" width="220" height="40" rx="20" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="260" y="231" text-anchor="middle" class="b">Within 200 m</text>
<rect x="150" y="260" width="220" height="40" rx="20" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="260" y="286" text-anchor="middle" class="b">165 launches</text>
<rect x="150" y="315" width="220" height="40" rx="20" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="260" y="341" text-anchor="middle" class="b">Sub parts 30%</text>
<rect x="590" y="150" width="220" height="40" rx="20" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="700" y="176" text-anchor="middle" class="b">150y cycle</text>
<rect x="590" y="205" width="220" height="40" rx="20" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="700" y="231" text-anchor="middle" class="b">Tyson</text>
<rect x="590" y="260" width="220" height="40" rx="20" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="700" y="286" text-anchor="middle" class="b">Destiny</text>
<rect x="590" y="315" width="220" height="40" rx="20" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="700" y="341" text-anchor="middle" class="d">Ask: where?</text>
<line x1="590" y1="335" x2="384" y2="335" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<polygon points="372,335 388,327 388,343" fill="var(--warn)"/>
<polygon points="150,372 370,372 300,440 220,440" fill="var(--accent)" opacity="0.2"/>
<rect x="190" y="444" width="140" height="48" rx="8" fill="var(--accent)"/>
<text x="260" y="475" text-anchor="middle" class="g w">Act</text>
<line x1="700" y1="372" x2="700" y2="434" stroke="var(--grey)" stroke-width="3"/>
<polygon points="700,444 692,430 708,430" fill="var(--grey)"/>
<rect x="630" y="444" width="140" height="48" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="700" y="475" text-anchor="middle" class="b d">Park</text>
</svg>
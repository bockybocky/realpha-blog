<polygon points="450,169 438,163 438,175" fill="var(--accent)"/>
<text x="300" y="224" font-size="16" fill="var(--dim)" text-anchor="middle">延續上一關</text>
<text x="60" y="266" font-size="19" fill="var(--ink)">標準環境</text>
<rect x="60" y="280" width="90" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="190" y="280" width="90" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="320" y="280" width="90" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="450" y="280" width="90" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<line x1="158" y1="299" x2="174" y2="315" stroke="var(--warn)" stroke-width="3"/>
<line x1="174" y1="299" x2="158" y2="315" stroke="var(--warn)" stroke-width="3"/>
<line x1="288" y1="299" x2="304" y2="315" stroke="var(--warn)" stroke-width="3"/>
<line x1="304" y1="299" x2="288" y2="315" stroke="var(--warn)" stroke-width="3"/>
<line x1="418" y1="299" x2="434" y2="315" stroke="var(--warn)" stroke-width="3"/>
<line x1="434" y1="299" x2="418" y2="315" stroke="var(--warn)" stroke-width="3"/>
<text x="300" y="362" font-size="16" fill="var(--dim)" text-anchor="middle">每關清空</text>
<line x1="600" y1="110" x2="600" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="640" y1="430" x2="910" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="654" y="140" width="64" height="290" fill="var(--accent)"/>
<rect x="748" y="250" width="64" height="180" fill="var(--accent)"/>
<rect x="842" y="343" width="64" height="87" fill="var(--grey)"/>
<text x="686" y="128" font-size="20" fill="var(--ink)" text-anchor="middle">99.9</text>
<text x="780" y="238" font-size="20" fill="var(--ink)" text-anchor="middle">62</text>
<text x="874" y="331" font-size="20" fill="var(--dim)" text-anchor="middle">30</text>
<text x="686" y="454" font-size="15" fill="var(--dim)" text-anchor="middle">自家口徑</text>
<text x="780" y="454" font-size="15" fill="var(--dim)" text-anchor="middle">標準口徑</text>
<text x="874" y="454" font-size="15" fill="var(--dim)" text-anchor="middle">第二名</text>
<text x="60" y="520" font-size="22" fill="var(--ink)">兩個分數都真，回答的問題不同</text>

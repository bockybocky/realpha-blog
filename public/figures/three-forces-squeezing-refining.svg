<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三個方向的箭頭同時壓向中央一個方塊">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">同一個缺口，三個來源</text>

  <rect x="370" y="250" width="220" height="110" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="480" y="295" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">中間那層</text>
  <text class="t" x="480" y="325" font-size="16" text-anchor="middle" fill="var(--dim)">煉製與供油</text>

  <text class="t" x="60" y="290" font-size="20" font-weight="700" fill="var(--dim)">關廠與被打</text>
  <text class="t" x="60" y="318" font-size="15" fill="var(--dim)">加州、德國、波斯灣、俄羅斯</text>
  <path d="M250 300 L350 300" stroke="var(--warn)" stroke-width="4"/>
  <path d="M350 300 l-16 -9 l0 18 z" fill="var(--warn)"/>

  <text class="t" x="480" y="130" font-size="20" font-weight="700" text-anchor="middle" fill="var(--dim)">海運</text>
  <text class="t" x="480" y="158" font-size="15" text-anchor="middle" fill="var(--dim)">黑海柴油每日 80 萬桶</text>
  <path d="M480 180 L480 235" stroke="var(--warn)" stroke-width="4"/>
  <path d="M480 235 l-9 -16 l18 0 z" fill="var(--warn)"/>

  <text class="t" x="900" y="290" font-size="20" font-weight="700" text-anchor="end" fill="var(--dim)">生質燃料</text>
  <text class="t" x="900" y="318" font-size="15" text-anchor="end" fill="var(--dim)">甘蔗歉收、駁船開不動</text>
  <path d="M710 300 L610 300" stroke="var(--warn)" stroke-width="4"/>
  <path d="M610 300 l16 -9 l0 18 z" fill="var(--warn)"/>

  <line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="60" y="488" font-size="22" font-weight="700" fill="var(--ink)">兩樁跟爐子無關，壓在同一格</text>
</svg>
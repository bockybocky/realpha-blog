<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條兩個週期的起伏波形，每個波峰標示第七年前後見頂，上行陡下行緩">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">油氣投資的七年起伏</text>
  <text class="t" x="60" y="94" font-size="16" fill="var(--dim)">單一年度會減單，長期不會停</text>

  <line x1="80" y1="310" x2="900" y2="310" stroke="var(--line)" stroke-width="2"/>

  <path d="M90 330 C160 330 200 160 270 160 C350 160 360 330 440 330 C520 330 560 160 630 160 C710 160 720 330 800 330 C850 330 870 260 900 230"
        fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>

  <circle cx="270" cy="160" r="9" fill="var(--accent)"/>
  <circle cx="630" cy="160" r="9" fill="var(--accent)"/>
  <text class="t" x="270" y="134" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">第七年前後</text>
  <text class="t" x="630" y="134" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">第七年前後</text>

  <text class="t" x="175" y="262" font-size="16" fill="var(--dim)" text-anchor="middle">往上</text>
  <text class="t" x="360" y="262" font-size="16" fill="var(--dim)" text-anchor="middle">慢慢下來</text>
  <text class="t" x="540" y="262" font-size="16" fill="var(--dim)" text-anchor="middle">再往上</text>
  <text class="t" x="860" y="330" font-size="16" fill="var(--dim)" text-anchor="middle">下一輪</text>

  <text class="t" x="60" y="462" font-size="22" font-weight="700" fill="var(--ink)">看到減單，先問這是哪一年</text>
</svg>
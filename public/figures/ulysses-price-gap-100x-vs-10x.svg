<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="左右兩組柱狀圖，左組高度差極端，右組高度差明顯收斂">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
  <text x="80" y="60" font-size="27" fill="var(--ink)">一台的價錢：看基礎機，還是看滿配</text>

  <rect x="60" y="100" width="400" height="420" rx="10" fill="var(--card)"/>
  <rect x="500" y="100" width="400" height="420" rx="10" fill="var(--card)"/>

  <line x1="80" y1="470" x2="440" y2="470" stroke="var(--line)" stroke-width="2"/>
  <line x1="520" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>

  <rect x="120" y="180" width="90" height="290" fill="var(--grey)"/>
  <text x="165" y="168" font-size="19" fill="var(--dim)" text-anchor="middle">$500 萬</text>
  <text x="165" y="496" font-size="16" fill="var(--dim)" text-anchor="middle">海軍現役</text>

  <rect x="290" y="464" width="90" height="6" fill="var(--accent)"/>
  <text x="335" y="452" font-size="19" fill="var(--accent)" text-anchor="middle">$5 萬</text>
  <text x="335" y="496" font-size="16" fill="var(--dim)" text-anchor="middle">Ulysses</text>

  <text x="250" y="300" font-size="27" fill="var(--ink)" text-anchor="middle">100×</text>
  <text x="250" y="130" font-size="20" fill="var(--ink)" text-anchor="middle">基礎機型</text>

  <rect x="560" y="180" width="90" height="290" fill="var(--grey)"/>
  <text x="605" y="168" font-size="19" fill="var(--dim)" text-anchor="middle">海軍現役</text>

  <rect x="730" y="441" width="90" height="29" fill="var(--accent)"/>
  <text x="775" y="429" font-size="19" fill="var(--accent)" text-anchor="middle">Ulysses</text>

  <text x="690" y="300" font-size="27" fill="var(--ink)" text-anchor="middle">10×</text>
  <text x="690" y="130" font-size="20" fill="var(--ink)" text-anchor="middle">加上進階感測與導航</text>

  <text x="80" y="570" font-size="22" fill="var(--ink)">口徑換了，市場大小跟著換</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條高度不同的天花板線限制住底下柱子能長到多高">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">天花板是你拿來對照的那個東西</text>
<line x1="120" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="3"/>
<line x1="120" y1="300" x2="440" y2="300" stroke="var(--warn)" stroke-width="5"/>
<text class="b" x="120" y="286">家用血壓計</text>
<rect x="160" y="300" width="100" height="100" fill="var(--grey)"/>
<rect x="290" y="300" width="100" height="100" fill="var(--grey)"/>
<line x1="560" y1="150" x2="880" y2="150" stroke="var(--accent)" stroke-width="5"/>
<text class="b" x="560" y="136">受訓醫護與聽診器</text>
<rect x="600" y="150" width="100" height="250" fill="var(--accent)"/>
<rect x="730" y="150" width="100" height="250" fill="var(--accent)"/>
<text class="g" x="160" y="440">撞到低的天花板</text>
<text class="g" x="600" y="440">才有空間長高</text>
<text class="c" x="60" y="492">兩組數字都算過，誤差不會互相抵銷</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一根高柱標原則 83 條，右邊同寬的柱子只剩約三分之一標 30 條，柱子上方空出的虛線區塊用箭頭指向資本配置、成長投資、董事會監督三個詞"><rect x="0" y="0" width="960" height="560" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
<text x="80" y="60" font-size="27" fill="var(--ink)">改訂做的事：把篇幅讓出來</text>
<text x="80" y="92" font-size="16" fill="var(--dim)">十年來數得出來的條文鋪好底盤，省下的位置給本質題</text>
<line x1="100" y1="480" x2="880" y2="480" stroke="var(--grey)" stroke-width="2"/>
<rect x="150" y="170" width="160" height="310" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="230" y="508" font-size="20" fill="var(--ink)" text-anchor="middle">原則 83 條</text>
<path d="M340 325 L392 325" stroke="var(--accent)" stroke-width="3"/>
<path d="M392 325 L380 318 L380 332 Z" fill="var(--accent)"/>
<rect x="430" y="170" width="160" height="196" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="510" y="275" font-size="16" fill="var(--dim)" text-anchor="middle">讓出來的篇幅</text>
<rect x="430" y="372" width="160" height="108" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="510" y="508" font-size="20" fill="var(--ink)" text-anchor="middle">原則 30 條</text>
<path d="M620 268 L672 268" stroke="var(--accent)" stroke-width="3"/>
<path d="M672 268 L660 261 L660 275 Z" fill="var(--accent)"/>
<circle cx="700" cy="222" r="5" fill="var(--accent)"/>
<text x="716" y="228" font-size="16" fill="var(--ink)">資本怎麼配置</text>
<circle cx="700" cy="268" r="5" fill="var(--accent)"/>
<text x="716" y="274" font-size="16" fill="var(--ink)">成長投資往哪裡放</text>
<circle cx="700" cy="314" r="5" fill="var(--accent)"/>
<text x="716" y="320" font-size="16" fill="var(--ink)">董事會監督得動嗎</text>
<text x="80" y="542" font-size="22" fill="var(--ink)">條文少了，關卡沒少：遵循，或者解釋</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two lines cross like scissors: value per hour rises while hours required fall.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="60" y="58" font-size="27" fill="var(--ink)">Dearer per hour, cheaper in total</text>

  <rect x="60" y="90" width="840" height="310" rx="14" fill="var(--card)" stroke="var(--line)"/>

  <text x="120" y="132" font-size="16" fill="var(--dim)">The same matter</text>

  <line x1="130" y1="350" x2="520" y2="170" stroke="var(--accent)" stroke-width="4"/>
  <line x1="130" y1="170" x2="520" y2="350" stroke="var(--grey)" stroke-width="4"/>

  <text x="536" y="166" font-size="19" fill="var(--accent)">Value of an hour</text>
  <text x="536" y="192" font-size="16" fill="var(--dim)">About +10% a year</text>

  <text x="536" y="344" font-size="19" fill="var(--dim)">Hours required</text>
  <text x="536" y="370" font-size="16" fill="var(--dim)">Sharply lower</text>

  <line x1="720" y1="130" x2="720" y2="360" stroke="var(--line)" stroke-width="2"/>

  <text x="748" y="158" font-size="16" fill="var(--dim)">Result</text>
  <text x="748" y="210" font-size="19" fill="var(--dim)">Client total down</text>
  <text x="748" y="262" font-size="19" fill="var(--accent)">Lawyer rate up</text>

  <text x="480" y="460" font-size="22" fill="var(--ink)" text-anchor="middle">Time devalues, judgment appreciates</text>
</svg>
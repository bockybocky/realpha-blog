<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Two bars show that reading it myself takes more than an afternoon and still is not finished, while AI finishes in five minutes, a large difference in length.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>
<text class="t" x="60" y="70">Same code, 2 ways</text>
<text class="b" x="60" y="104">41 Go files | ~280KB</text>
<text class="g" x="60" y="207">Me</text>
<text class="b" x="180" y="166">½ day: not done</text>
<rect x="180" y="180" width="600" height="40" rx="6" fill="var(--grey)"/>
<rect x="780" y="180" width="120" height="40" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="g" x="60" y="317">AI</text>
<rect x="180" y="290" width="13" height="40" rx="3" fill="var(--accent)"/>
<text class="g" x="208" y="317" style="fill:var(--accent)">5m: done</text>
<line x1="60" y1="380" x2="900" y2="380" stroke="var(--line)" stroke-width="1"/>
<text class="c" x="60" y="435">Read code: ½ day → 5 min</text>
</svg>
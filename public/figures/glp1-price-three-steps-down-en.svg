<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three bars step downward from list price to the net price actually paid to the direct price, leaving only a stub.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="40" y="58">One drug, 3 prices</text>
<line x1="100" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="145" width="140" height="325" fill="var(--grey)" opacity="0.55"/>
<rect x="410" y="383" width="140" height="87" fill="var(--grey)" opacity="0.55"/>
<rect x="670" y="433" width="140" height="37" fill="var(--accent)"/>
<text class="g" x="150" y="130">$1,300</text>
<text class="g" x="410" y="368">$300–400</text>
<text class="g" x="670" y="418">$149</text>
<text class="b" x="166" y="498">List price</text>
<text class="b" x="412" y="498">Net paid</text>
<text class="b" x="690" y="498">Direct</text>
<line x1="290" y1="145" x2="410" y2="383" stroke="var(--ink)" stroke-width="3"/>
<line x1="550" y1="383" x2="670" y2="433" stroke="var(--ink)" stroke-width="3"/>
<text class="b" x="560" y="330">Middlemen exit</text>
<text class="c" x="100" y="540">Gap gone, maker earns more</text>
</svg>
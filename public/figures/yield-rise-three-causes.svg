<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三個病因的箭頭從左方匯流到同一點，再往右延伸成一條上升的殖利率線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<defs>
  <marker id="arw-f9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--grey)"/></marker>
</defs>
<text x="48" y="62" font-size="27" fill="var(--ink)">長債殖利率上升，至少有三個不同的病因</text>

<text x="80" y="196" font-size="19" fill="var(--ink)">市場預期通膨變高</text>
<text x="80" y="296" font-size="19" fill="var(--ink)">預期政策利率路徑更高</text>
<text x="80" y="396" font-size="19" fill="var(--ink)">單純是發行量變多</text>

<path d="M330,190 C450,190 460,360 520,384" fill="none" stroke="var(--grey)" stroke-width="2.5" marker-end="url(#arw-f9)"/>
<path d="M380,290 C470,290 470,360 520,382" fill="none" stroke="var(--grey)" stroke-width="2.5" marker-end="url(#arw-f9)"/>
<path d="M320,390 C420,390 460,384 520,382" fill="none" stroke="var(--grey)" stroke-width="2.5" marker-end="url(#arw-f9)"/>

<polyline points="540,380 660,318 780,250 880,208" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="800" y="316" font-size="19" fill="var(--accent)" text-anchor="end">殖利率上升</text>

<text x="480" y="480" font-size="22" fill="var(--ink)" text-anchor="middle">同一個數字，三個故事</text>
<text x="480" y="514" font-size="16" fill="var(--dim)" text-anchor="middle">先找能區分它們的第三個證據，別只留下最順的那個</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A four-quadrant chart with 'can learn it' versus 'cannot learn it' on the horizontal axis and 'I clean up the mess' versus 'someone else signs for it' on the vertical axis, with the top-left cell shaded in a warning color as the grind-it-out trap people fall into most.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56">Build or hand off? Look at who cleans up on the day it breaks</text>
  <rect x="180" y="110" width="330" height="150" fill="var(--warn)" opacity="0.18"/>
  <rect x="510" y="110" width="330" height="150" fill="var(--card)"/>
  <rect x="180" y="260" width="330" height="150" fill="var(--card)"/>
  <rect x="510" y="260" width="330" height="150" fill="var(--card)"/>
  <line x1="510" y1="100" x2="510" y2="420" stroke="var(--line)" stroke-width="2"/>
  <line x1="170" y1="260" x2="850" y2="260" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="80" y="180">It breaks</text>
  <text class="b" x="80" y="206">I clean up</text>
  <text class="b" x="80" y="330">It breaks</text>
  <text class="b" x="80" y="356">Someone signs</text>
  <text class="b" x="300" y="452">Can learn it</text>
  <text class="b" x="630" y="452">Cannot learn it</text>
  <text class="g" x="200" y="200">Grind it out</text>
  <text class="b" x="200" y="232">The cell people fall into most</text>
  <text class="g" x="530" y="200">Can't hold it</text>
  <text class="g" x="200" y="350">Fine to do yourself</text>
  <text class="g" x="530" y="350">Hand it off</text>
  <text class="c" x="60" y="518">"I can learn it" is not "I should do it"</text>
</svg>
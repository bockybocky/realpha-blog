<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="低碳電力的斜線陡升，低碳燃料的線幾乎水平，兩條斜率差距很大">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">電走得快，燃料走不動</text>

  <line x1="160" y1="110" x2="160" y2="420" stroke="var(--line)" stroke-width="2"/>
  <line x1="160" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="160" y="452" font-size="16" text-anchor="middle" fill="var(--dim)">現在</text>
  <text class="t" x="820" y="452" font-size="16" text-anchor="middle" fill="var(--dim)">2035</text>
  <text class="t" x="140" y="118" font-size="16" text-anchor="end" fill="var(--dim)">60%</text>
  <text class="t" x="140" y="424" font-size="16" text-anchor="end" fill="var(--dim)">0</text>

  <path d="M160 206 L820 110" stroke="var(--accent)" stroke-width="6" fill="none"/>
  <circle cx="160" cy="206" r="7" fill="var(--accent)"/>
  <circle cx="820" cy="110" r="7" fill="var(--accent)"/>
  <text class="t" x="180" y="192" font-size="19" font-weight="700" fill="var(--ink)">低碳電力 42%</text>
  <text class="t" x="800" y="92" font-size="19" font-weight="700" text-anchor="end" fill="var(--ink)">60%</text>

  <path d="M160 379 L820 369" stroke="var(--warn)" stroke-width="6" fill="none"/>
  <circle cx="160" cy="379" r="7" fill="var(--warn)"/>
  <circle cx="820" cy="369" r="7" fill="var(--warn)"/>
  <text class="t" x="180" y="406" font-size="19" font-weight="700" fill="var(--ink)">低碳燃料 8%</text>
  <text class="t" x="800" y="352" font-size="19" font-weight="700" text-anchor="end" fill="var(--ink)">10%</text>

  <text class="t" x="480" y="500" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">兩條線同一張圖，斜率不是同一個量級</text>
</svg>
    <rect x="80" y="280" width="32" height="32"/><rect x="120" y="280" width="32" height="32"/><rect x="160" y="280" width="32" height="32"/><rect x="200" y="280" width="32" height="32"/><rect x="240" y="280" width="32" height="32"/><rect x="280" y="280" width="32" height="32"/><rect x="320" y="280" width="32" height="32"/><rect x="360" y="280" width="32" height="32"/><rect x="400" y="280" width="32" height="32"/><rect x="440" y="280" width="32" height="32"/>

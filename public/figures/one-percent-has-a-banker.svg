  <rect x="440" y="120" width="32" height="32" fill="var(--accent)"/>
  <line x1="472" y1="136" x2="560" y2="136" stroke="var(--accent)" stroke-width="2"/>
  <text x="572" y="128" font-size="20" font-weight="700" fill="var(--accent)">收入前 1%</text>
  <text x="572" y="158" font-size="16" fill="var(--dim)">私人銀行家　稅務結構　比價貸款</text>
  <text x="572" y="300" font-size="20" font-weight="700" fill="var(--ink)">其餘 99%</text>
  <text x="572" y="330" font-size="16" fill="var(--dim)">沒有人幫他調度</text>
  <text x="572" y="356" font-size="16" fill="var(--dim)">金融教育從來沒成功過</text>
  <text x="572" y="382" font-size="16" fill="var(--dim)">沒人會坐下來上課</text>
  <text x="572" y="470" font-size="22" font-weight="700" fill="var(--ink)">缺的不是課，是每天</text>
  <text x="572" y="500" font-size="22" font-weight="700" fill="var(--ink)">替你動手的那個人</text>

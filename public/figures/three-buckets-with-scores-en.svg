<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three buckets side by side, each hanging its own ruler.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="62">Three buckets, three rulers</text>

<g>
  <rect x="70" y="110" width="250" height="72" fill="var(--accent)" opacity="0.16"/>
  <rect x="70" y="110" width="250" height="72" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text class="b" x="88" y="154">Hold out unseen text</text>
  <line x1="195" y1="182" x2="195" y2="250" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="70" y="250" width="250" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="88" y="300">Pretraining</text>
  <text class="s" x="88" y="336">Loss</text>
  <text class="s" x="88" y="366">Fix the score, compare compute</text>
</g>

<g>
  <rect x="355" y="110" width="250" height="72" fill="var(--accent)" opacity="0.16"/>
  <rect x="355" y="110" width="250" height="72" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text class="b" x="373" y="154">Drop it in an unseen env</text>
  <line x1="480" y1="182" x2="480" y2="250" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="355" y="250" width="250" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="373" y="300">Post-training</text>
  <text class="s" x="373" y="336">Time to first score</text>
  <text class="s" x="373" y="366">How fast it learns</text>
</g>

<g>
  <rect x="640" y="110" width="250" height="72" fill="var(--accent)" opacity="0.16"/>
  <rect x="640" y="110" width="250" height="72" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text class="b" x="658" y="154">Readings off the machine</text>
  <line x1="765" y1="182" x2="765" y2="250" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="640" y="250" width="250" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="658" y="300">Inference efficiency</text>
  <text class="s" x="658" y="336">GPU utilization</text>
  <text class="s" x="658" y="366">Cache per token</text>
</g>

<text class="c" x="70" y="494">What no ruler fits is that 25% tail</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="三種記憶胞並列，元件數與有無電容各不同，底下一條共同裂痕指向臨界電壓漂移">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">三條路，三種零件組合</text>

  <rect x="48" y="100" width="272" height="280" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="72" y="140" font-size="20" fill="var(--ink)">移植 1T1C</text>
  <rect x="96" y="180" width="70" height="70" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text x="112" y="222" font-size="16" fill="var(--ink)">電晶體</text>
  <line x1="166" y1="215" x2="226" y2="215" stroke="var(--accent)" stroke-width="2"/>
  <line x1="226" y1="188" x2="226" y2="242" stroke="var(--accent)" stroke-width="4"/>
  <line x1="248" y1="188" x2="248" y2="242" stroke="var(--accent)" stroke-width="4"/>
  <text x="212" y="276" font-size="16" fill="var(--accent)">電容</text>
  <text x="72" y="330" font-size="16" fill="var(--dim)">最實際</text>
  <text x="72" y="356" font-size="16" fill="var(--dim)">定位在最後一級快取</text>

  <rect x="344" y="100" width="272" height="280" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="368" y="140" font-size="20" fill="var(--ink)">增益胞</text>
  <rect x="368" y="180" width="100" height="70" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text x="384" y="222" font-size="16" fill="var(--ink)">電晶體</text>
  <rect x="492" y="180" width="100" height="70" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text x="508" y="222" font-size="16" fill="var(--ink)">電晶體</text>
  <text x="368" y="276" font-size="16" fill="var(--accent)">無電容</text>
  <text x="368" y="330" font-size="16" fill="var(--dim)">電荷存在閘極裡</text>
  <text x="368" y="356" font-size="16" fill="var(--dim)">靠超低漏電留住</text>

  <rect x="640" y="100" width="272" height="280" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="664" y="140" font-size="20" fill="var(--ink)">鐵電 FET</text>
  <rect x="664" y="180" width="130" height="70" rx="8" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text x="680" y="222" font-size="16" fill="var(--ink)">電晶體</text>
  <path d="M812 215 h56" stroke="var(--accent)" stroke-width="3"/>
  <path d="M868 215 l-12 -8 M868 215 l-12 8" stroke="var(--accent)" stroke-width="3" fill="none"/>
  <text x="800" y="276" font-size="16" fill="var(--accent)">極化方向</text>
  <text x="664" y="330" font-size="16" fill="var(--dim)">一顆就是一個記憶胞</text>
  <text x="664" y="356" font-size="16" fill="var(--dim)">斷電還在</text>

  <path d="M184 404 C 184 452, 480 440, 480 486" stroke="var(--warn)" stroke-width="2" fill="none"/>
  <path d="M480 404 L480 486" stroke="var(--warn)" stroke-width="2" fill="none"/>
  <path d="M776 404 C 776 452, 480 440, 480 486" stroke="var(--warn)" stroke-width="2" fill="none"/>
  <text x="372" y="524" font-size="22" fill="var(--warn)">臨界電壓漂移</text>
  <text x="48" y="556" font-size="16" fill="var(--dim)">三條路不同，卡住的地方同一個</text>
</svg>
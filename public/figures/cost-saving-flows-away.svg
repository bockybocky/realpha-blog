<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="中央的省下成本被兩條粗箭頭分流到設備供應商與規模最大的那家，往下留給自己的箭頭細得多。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="480" y="54" font-size="27" text-anchor="middle">省下來的成本，留不住</text>

  <line x1="150" y1="280" x2="310" y2="280" stroke="var(--line)" stroke-width="6"/>
  <polygon points="310,272 310,288 326,280" fill="var(--line)"/>
  <text x="150" y="250" font-size="15" text-anchor="start" fill="var(--dim)">換方法，不換客戶</text>

  <rect x="330" y="230" width="230" height="100" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="445" y="288" font-size="19" text-anchor="middle">省下的成本</text>

  <line x1="560" y1="258" x2="690" y2="196" stroke="var(--accent)" stroke-width="20"/>
  <polygon points="698,212 682,180 713,185" fill="var(--accent)"/>
  <rect x="716" y="150" width="190" height="80" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="811" y="197" font-size="19" text-anchor="middle">設備供應商</text>

  <line x1="560" y1="302" x2="690" y2="364" stroke="var(--accent)" stroke-width="20"/>
  <polygon points="682,380 698,348 713,375" fill="var(--accent)"/>
  <rect x="716" y="335" width="190" height="80" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="811" y="382" font-size="19" text-anchor="middle">最大的那家</text>

  <line x1="445" y1="335" x2="445" y2="405" stroke="var(--grey)" stroke-width="4"/>
  <polygon points="437,405 453,405 445,420" fill="var(--grey)"/>
  <text x="445" y="450" font-size="15" text-anchor="middle" fill="var(--dim)">自己留下的</text>

  <text x="480" y="508" font-size="22" text-anchor="middle">不是溢價，是入場費</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條長條對比：以前寫占五格、卡住占五格共十格；用 AI 之後寫縮成一格，卡住仍是五格，共六格">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">變快的只有一段</text>
<text x="60" y="181" font-size="20" fill="var(--ink)">以前</text>
<rect x="200" y="150" width="325" height="48" rx="4" fill="var(--accent)"/>
<text x="362" y="180" font-size="16" text-anchor="middle" fill="var(--page)">寫 5</text>
<rect x="525" y="150" width="325" height="48" rx="4" fill="var(--warn)"/>
<text x="687" y="180" font-size="16" text-anchor="middle" fill="var(--page)">卡住 5</text>
<text x="868" y="182" font-size="20" font-weight="700" fill="var(--ink)">共 10</text>
<text x="60" y="311" font-size="20" fill="var(--ink)">用 AI 之後</text>
<text x="232" y="266" font-size="15" text-anchor="middle" fill="var(--accent)">快 5 倍</text>
<rect x="200" y="280" width="65" height="48" rx="4" fill="var(--accent)"/>
<text x="232" y="310" font-size="16" text-anchor="middle" fill="var(--page)">寫 1</text>
<rect x="265" y="280" width="325" height="48" rx="4" fill="var(--warn)"/>
<text x="427" y="310" font-size="16" text-anchor="middle" fill="var(--page)">卡住 5</text>
<rect x="590" y="280" width="260" height="48" rx="4" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="720" y="310" font-size="16" text-anchor="middle" fill="var(--dim)">省下 4</text>
<text x="868" y="312" font-size="20" font-weight="700" fill="var(--ink)">共 6</text>
<text x="427" y="354" font-size="15" text-anchor="middle" fill="var(--warn)">一格沒少</text>
<text x="60" y="440" font-size="22" font-weight="700" fill="var(--ink)">卡住那段沒變短，整體就快不多</text>
</svg>
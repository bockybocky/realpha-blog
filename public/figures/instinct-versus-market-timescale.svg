<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條佔滿整個畫面的長橫條代表演化，底下代表市場的橫條短到幾乎看不見，要用箭頭指出來">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
    .a { fill:var(--accent); }
    .w { fill:var(--warn); }
</style>
<text class="t" x="60" y="64">十萬年的直覺，四百年的市場</text>
<text class="g" x="60" y="148">演化</text>
<rect x="60" y="168" width="840" height="52" fill="var(--grey)"/>
<text class="s" x="900" y="248" text-anchor="end">十萬年</text>
<text class="b" x="60" y="286">危險 → 逃 → 活下來</text>
<line x1="60" y1="318" x2="900" y2="318" stroke="var(--line)" stroke-width="1"/>
<text class="g" x="60" y="368">市場</text>
<rect x="60" y="388" width="4" height="52" fill="var(--accent)"/>
<line x1="160" y1="414" x2="82" y2="414" stroke="var(--accent)" stroke-width="2"/>
<polygon points="70,414 88,406 88,422" fill="var(--accent)"/>
<text class="s a" x="172" y="420">四百年，就是這一條</text>
<text class="b w" x="60" y="472">危險 → 逃 → 賣在最低點</text>
<text class="c" x="60" y="506">救命的反射，在這裡是反過來的</text>
</svg>
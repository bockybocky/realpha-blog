<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Light news gets a long down bar, the heavier threat a short one">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  .ttl{font-size:27px;fill:var(--ink);font-weight:700}
  .lbl{font-size:19px;fill:var(--ink);font-weight:600}
  .txt{font-size:16px;fill:var(--dim)}
  .cc{font-size:22px;fill:var(--ink);font-weight:600}
</style></defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ttl" x="60" y="62">Bigger threat, smaller reaction</text>
<line x1="130" y1="112" x2="850" y2="112" stroke="var(--grey)" stroke-width="2"/>
<polygon points="850,112 836,105 836,119" fill="var(--grey)"/>
<text class="txt" x="490" y="98" text-anchor="middle">How real the threat is</text>
<rect x="90" y="140" width="360" height="300" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="510" y="140" width="360" height="300" rx="12" fill="var(--card)" stroke="var(--line)"/>
<text class="lbl" x="270" y="182" text-anchor="middle">An AI tax tool</text>
<text class="lbl" x="690" y="182" text-anchor="middle">Bought for $4.6B</text>
<line x1="270" y1="206" x2="270" y2="410" stroke="var(--line)" stroke-width="2"/>
<line x1="690" y1="206" x2="690" y2="410" stroke="var(--line)" stroke-width="2"/>
<rect x="248" y="212" width="44" height="160" fill="var(--warn)"/>
<rect x="668" y="212" width="44" height="60" fill="var(--accent)"/>
<text class="cc" x="316" y="304" fill="var(--warn)">−7%</text>
<text class="cc" x="736" y="254" fill="var(--accent)">−2.6%</text>
<text class="txt" x="270" y="422" text-anchor="middle">That day</text>
<text class="txt" x="690" y="422" text-anchor="middle">That day</text>
<text class="cc" x="60" y="502">It reacts faster than it checks</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="濃縮度數軸上兩個相鄰區段，左段實色可得，右段虛線待建">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style></defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">燃料濃縮度　站在哪一段</text>
<line x1="80" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>
<g class="n" fill="var(--dim)">
<text x="80" y="340">0%</text>
<text x="285" y="340">5%</text>
<text x="408" y="340">8%</text>
<text x="860" y="340">20%</text>
</g>
<line x1="285" y1="292" x2="285" y2="308" stroke="var(--dim)" stroke-width="2"/>
<line x1="408" y1="292" x2="408" y2="308" stroke="var(--dim)" stroke-width="2"/>
<rect x="285" y="238" width="123" height="54" rx="4" fill="var(--accent)"/>
<text class="g" x="346" y="222" text-anchor="middle">他們的設計</text>
<text class="n" x="346" y="196" text-anchor="middle">市場上現成的二氧化鈾</text>
<rect x="408" y="238" width="492" height="54" rx="4" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="g" x="654" y="222" text-anchor="middle">同業多數的先進設計</text>
<text class="n" x="654" y="196" text-anchor="middle">產能還要幾年才建得出來</text>
<text class="c" x="80" y="420">現在就買得到</text>
<text class="c" x="520" y="420">還不存在</text>
<line x1="80" y1="436" x2="408" y2="436" stroke="var(--accent)" stroke-width="4"/>
<line x1="520" y1="436" x2="900" y2="436" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 7"/>
</svg>
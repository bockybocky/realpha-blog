<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The top bar is made of a short behavior segment and a long data-flow segment, while the distiller's bar below has only the short segment and an empty dashed box where the long one would be.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
</style>
<defs><marker id="hArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker></defs>
<text x="60" y="62" class="h">Half the lead leaks</text>
<text x="320" y="164" text-anchor="middle" class="b">Behav. bits</text>
<text x="620" y="164" text-anchor="middle" class="b">Prompts + logs</text>
<text x="240" y="209" text-anchor="end" class="g">Frontier</text>
<rect x="260" y="180" width="120" height="44" fill="var(--grey)"/>
<rect x="380" y="180" width="480" height="44" fill="var(--accent)"/>
<line x1="320" y1="230" x2="320" y2="302" stroke="var(--dim)" stroke-width="2" marker-end="url(#hArr)"/>
<text x="334" y="272" class="b">Filled</text>
<text x="240" y="339" text-anchor="end" class="g">Copy</text>
<rect x="260" y="310" width="120" height="44" fill="var(--grey)"/>
<rect x="381" y="311" width="478" height="42" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="620" y="339" text-anchor="middle" class="g" style="fill:var(--warn)">N/A</text>
<text x="480" y="440" text-anchor="middle" class="c">Bits yes, data no</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="階梯圖：三十年回收約百分之三、二十年約百分之五、八個百分點，三者都在標著兩位數的門檻線以下">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t h" x="60" y="62">回收期換成報酬率</text>
  <text class="t b" x="60" y="92">把年數倒過來看</text>

  <line x1="60" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>

  <rect x="110" y="400" width="190" height="50" fill="var(--grey)" opacity="0.5"/>
  <text class="t g" x="124" y="432">3%</text>
  <text class="t b" x="110" y="480">三十年回收</text>

  <rect x="340" y="360" width="190" height="90" fill="var(--grey)" opacity="0.65"/>
  <text class="t g" x="354" y="392">5%</text>
  <text class="t b" x="340" y="480">二十年回收</text>

  <rect x="570" y="300" width="190" height="150" fill="var(--accent)" opacity="0.45"/>
  <text class="t g" x="584" y="332">8%</text>
  <text class="t b" x="570" y="480">常被當成目標</text>

  <line x1="60" y1="200" x2="900" y2="200" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 6"/>
  <text class="t g" x="60" y="186" fill="var(--warn)">門檻：兩位數</text>
  <text class="t b" x="700" y="186">線以下＝那還我錢吧</text>

  <text class="t c" x="60" y="524">不用建模，按一下計算機就知道</text>
</svg>
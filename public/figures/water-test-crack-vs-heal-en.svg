<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="In the top panel the crack keeps widening and swells along the rebar, while in the bottom panel the crack closes at the white speck."> 
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="40" y="56" font-size="27" fill="var(--ink)">Same bucket of water, two endings</text>

<text x="40" y="118" font-size="20" fill="var(--warn)">Modern</text>
<rect x="150" y="96" width="680" height="150" rx="8" fill="var(--card)" stroke="var(--line)"/>
<path d="M200 70 L200 92" stroke="var(--accent)" stroke-width="5"/>
<path d="M192 84 L200 96 L208 84" fill="none" stroke="var(--accent)" stroke-width="5"/>
<path d="M200 96 L236 150 L214 196 L268 246" fill="none" stroke="var(--warn)" stroke-width="6"/>
<line x1="330" y1="110" x2="330" y2="232" stroke="var(--grey)" stroke-width="9"/>
<path d="M268 246 L330 200" fill="none" stroke="var(--warn)" stroke-width="6"/>
<path d="M330 170 L400 140 M330 186 L404 214" stroke="var(--warn)" stroke-width="6"/>
<text x="430" y="150" font-size="19" fill="var(--ink)">Water gets through</text>
<text x="430" y="186" font-size="19" fill="var(--ink)">Rebar rusts and swells</text>
<text x="430" y="222" font-size="19" fill="var(--warn)">More cracks</text>

<text x="40" y="382" font-size="20" fill="var(--accent)">Roman</text>
<rect x="150" y="340" width="680" height="150" rx="8" fill="var(--card)" stroke="var(--line)"/>
<path d="M200 314 L200 336" stroke="var(--accent)" stroke-width="5"/>
<path d="M192 324 L200 340 L208 324" fill="none" stroke="var(--accent)" stroke-width="5"/>
<path d="M200 340 L240 400" fill="none" stroke="var(--grey)" stroke-width="6"/>
<circle cx="252" cy="416" r="20" fill="var(--page)" stroke="var(--accent)" stroke-width="4"/>
<circle cx="330" cy="372" r="11" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
<circle cx="366" cy="452" r="13" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
<path d="M266 428 L300 452" fill="none" stroke="var(--line)" stroke-width="6"/>
<text x="430" y="394" font-size="19" fill="var(--ink)">White speck dissolves</text>
<text x="430" y="430" font-size="19" fill="var(--ink)">Lime clast</text>
<text x="430" y="466" font-size="19" fill="var(--accent)">Crack self-heals</text>

<text x="40" y="534" font-size="22" fill="var(--ink)">The speck dismissed as a defect is why it lasted 2,000 years</text>
</g>
</svg>
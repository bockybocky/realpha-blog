<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="兩條上下並排的鋸齒折線，峰谷位置彼此對齊">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="480" y="54" text-anchor="middle" font-size="27" fill="var(--ink)">鋸齒剛好對上</text>

<text x="140" y="108" font-size="19" fill="var(--ink)">模型能力</text>
<polyline points="140,250 250,150 360,250 470,150 580,250 690,150 800,250" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="250" y="134" text-anchor="middle" font-size="16" fill="var(--accent)">解題</text>
<text x="360" y="282" text-anchor="middle" font-size="16" fill="var(--dim)">提問</text>

<line x1="250" y1="162" x2="250" y2="338" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>
<line x1="470" y1="162" x2="470" y2="338" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>
<line x1="690" y1="162" x2="690" y2="338" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>
<line x1="360" y1="262" x2="360" y2="438" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>
<line x1="580" y1="262" x2="580" y2="438" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

<polyline points="140,450 250,350 360,450 470,350 580,450 690,350 800,450" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text x="470" y="334" text-anchor="middle" font-size="16" fill="var(--accent)">可量的目標</text>
<text x="580" y="482" text-anchor="middle" font-size="16" fill="var(--dim)">懂本質</text>
<text x="140" y="512" font-size="19" fill="var(--ink)">機器學習研究要的</text>

<text x="480" y="562" text-anchor="middle" font-size="22" fill="var(--ink)">缺的那一半，剛好用不到</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="水位往上升，淹掉下層的步驟指示，上層的脈絡仍在水面上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">水位升上來，先淹掉步驟</text>
<rect x="260" y="110" width="440" height="160" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="260" y="270" width="440" height="190" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="260" y="300" width="440" height="160" fill="var(--accent)" fill-opacity="0.18"/>
<line x1="260" y1="300" x2="700" y2="300" stroke="var(--accent)" stroke-width="3"/>
<text x="288" y="150" font-size="20" fill="var(--ink)">你的脈絡</text>
<text x="288" y="186" font-size="16" fill="var(--dim)">資料放在哪</text>
<text x="288" y="214" font-size="16" fill="var(--dim)">怎麼算一件事完成</text>
<text x="288" y="242" font-size="16" fill="var(--dim)">你的口味</text>
<text x="288" y="292" font-size="20" fill="var(--dim)">步驟指示</text>
<text x="288" y="342" font-size="16" fill="var(--grey)">先查什麼</text>
<text x="288" y="378" font-size="16" fill="var(--grey)">再算什麼</text>
<text x="288" y="414" font-size="16" fill="var(--grey)">記得檢查</text>
<line x1="210" y1="460" x2="210" y2="312" stroke="var(--accent)" stroke-width="3"/>
<polygon points="210,296 202,314 218,314" fill="var(--accent)"/>
<text x="196" y="486" font-size="16" fill="var(--dim)" text-anchor="middle">模型能力</text>
<text x="724" y="392" font-size="16" fill="var(--dim)">已被吞掉</text>
<text x="724" y="180" font-size="16" fill="var(--dim)">刪不掉</text>
<text x="60" y="522" font-size="22" fill="var(--ink)">水面上的那層，才是你的</text>
</svg>
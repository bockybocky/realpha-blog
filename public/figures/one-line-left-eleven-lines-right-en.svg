<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One block on the left towers against eleven on the right, and the arrow points to a result of zero three months later.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">One left, eleven right</text>
<text class="t" x="80" y="118" font-size="19" fill="var(--accent)">Numbers changed</text>
<text class="t" x="360" y="118" font-size="19" fill="var(--dim)">What I imagined</text>
<line x1="80" y1="448" x2="880" y2="448" stroke="var(--line)" stroke-width="2"/>
<rect x="80" y="406" width="200" height="36" rx="4" fill="var(--accent)"/>
<text class="t" x="80" y="484" font-size="16" fill="var(--dim)">1</text>
<rect x="360" y="140" width="200" height="24" rx="3" fill="var(--grey)"/>
<rect x="360" y="168" width="200" height="24" rx="3" fill="var(--grey)"/>
<rect x="360" y="196" width="200" height="24" rx="3" fill="var(--grey)"/>
<rect x="360" y="224" width="200" height="24" rx="3" fill="var(--grey)"/>
<rect x="360" y="252" width="200" height="24" rx="3" fill="var(--grey)"/>
<rect x="360" y="280" width="200" height="24" rx="3" fill="var(--grey)"/>
<rect x="360" y="308" width="200" height="24" rx="3" fill="var(--grey)"/>
<rect x="360" y="336" width="200" height="24" rx="3" fill="var(--grey)"/>
<rect x="360" y="364" width="200" height="24" rx="3" fill="var(--grey)"/>
<rect x="360" y="392" width="200" height="24" rx="3" fill="var(--grey)"/>
<rect x="360" y="420" width="200" height="24" rx="3" fill="var(--grey)"/>
<text class="t" x="360" y="484" font-size="16" fill="var(--dim)">11</text>
<line x1="600" y1="292" x2="680" y2="292" stroke="var(--dim)" stroke-width="3"/>
<path d="M672 284 L690 292 L672 300 Z" fill="var(--dim)"/>
<text class="t" x="612" y="278" font-size="15" fill="var(--dim)">3 months later</text>
<rect x="710" y="240" width="170" height="104" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="t" x="742" y="302" font-size="22" fill="var(--ink)">0 came true</text>
<text class="t" x="60" y="524" font-size="22" fill="var(--ink)">My own handwriting</text>
</svg>
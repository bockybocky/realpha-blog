<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="On the left the falling curve flattens at a pre-drawn dashed limit; on the right there is no limit and the curve runs off the bottom.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="56" font-size="27">A flagship and a slow bleed differ by that one line</text>
  <text x="60" y="98" font-size="19" fill="var(--dim)">Flagship . line drawn first</text>
  <rect x="60" y="112" width="390" height="298" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <line x1="80" y1="310" x2="430" y2="310" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="86" y="300" font-size="16" fill="var(--accent)">Limit</text>
  <polyline points="100,155 170,212 240,264 300,300 345,310 430,310" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text x="255" y="442" font-size="15" text-anchor="middle" fill="var(--dim)">Agreed in advance how far</text>
  <text x="510" y="98" font-size="19" fill="var(--dim)">Bleed . justified after</text>
  <rect x="510" y="112" width="390" height="298" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <polyline points="550,155 640,228 720,292 800,356 890,414" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text x="876" y="300" font-size="16" text-anchor="end" fill="var(--warn)">No line</text>
  <text x="705" y="442" font-size="15" text-anchor="middle" fill="var(--dim)">One more push, every time</text>
  <text x="480" y="502" font-size="22" text-anchor="middle">Not whether it loses money, but whether you drew the line first</text>
</svg>
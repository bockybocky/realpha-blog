<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="On the left reflected light images a defect, on the right light passes through the glass and the camera sees nothing">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:20px; font-weight:700; fill:var(--ink); }
    .bd  { font-size:16px; fill:var(--dim); }
    .sm  { font-size:15px; fill:var(--dim); }
    .cc  { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="ttl" x="60" y="58">Light, reflect, image — assuming it's opaque</text>

  <rect x="60" y="94" width="400" height="316" rx="16" fill="var(--card)" stroke="var(--line)"/>
  <text class="grp" x="88" y="136">Opaque material</text>
  <rect x="100" y="164" width="56" height="40" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="sm" x="128" y="222" text-anchor="middle">Light source</text>
  <rect x="330" y="164" width="56" height="40" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text class="sm" x="358" y="222" text-anchor="middle" fill="var(--accent)">Camera</text>
  <rect x="110" y="300" width="290" height="26" rx="4" fill="var(--grey)"/>
  <circle cx="256" cy="313" r="7" fill="var(--warn)"/>
  <path d="M136 208 L246 292" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M266 292 L352 208" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="358,200 348,214 364,214" fill="var(--accent)"/>
  <text class="bd" x="260" y="378" text-anchor="middle" fill="var(--accent)">The defect inside is visible</text>

  <rect x="500" y="94" width="400" height="316" rx="16" fill="var(--card)" stroke="var(--line)"/>
  <text class="grp" x="528" y="136">Glass</text>
  <rect x="540" y="164" width="56" height="40" rx="6" fill="none" stroke="var(--grey)" stroke-width="2"/>
  <text class="sm" x="568" y="222" text-anchor="middle">Light source</text>
  <rect x="770" y="164" width="56" height="40" rx="6" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <text class="sm" x="798" y="222" text-anchor="middle" fill="var(--warn)">Camera</text>
  <rect x="550" y="300" width="290" height="26" rx="4" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="696" cy="313" r="7" fill="var(--warn)"/>
  <path d="M576 208 L724 356" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="732,364 720,346 714,360" fill="var(--warn)"/>
  <text class="bd" x="700" y="378" text-anchor="middle" fill="var(--warn)">The light goes straight through</text>

  <text class="cc" x="60" y="470">Lose the premise and the whole method fails</text>
</svg>
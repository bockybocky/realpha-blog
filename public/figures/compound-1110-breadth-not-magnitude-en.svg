<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="In the top panel four horizontal bars appear, the tech one nearly full and the other three under half; in the bottom panel two bars each run about half the width.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">One zone fell</text>
<text x="60" y="96" font-size="19" font-weight="700" fill="var(--dim)">Share of members down &gt;20%</text>
<rect x="240" y="118" width="594" height="28" fill="var(--accent)"/>
<rect x="240" y="158" width="270" height="28" fill="var(--accent)" fill-opacity="0.5"/>
<rect x="240" y="198" width="198" height="28" fill="var(--accent)" fill-opacity="0.5"/>
<rect x="240" y="238" width="198" height="28" fill="var(--accent)" fill-opacity="0.5"/>
<text x="228" y="139" font-size="17" fill="var(--ink)" text-anchor="end">IT</text>
<text x="228" y="179" font-size="17" fill="var(--ink)" text-anchor="end">Mats</text>
<text x="228" y="219" font-size="17" fill="var(--ink)" text-anchor="end">Fin</text>
<text x="228" y="259" font-size="17" fill="var(--ink)" text-anchor="end">Staples, utils</text>
<text x="846" y="139" font-size="19" font-weight="700" fill="var(--ink)">99%</text>
<text x="522" y="179" font-size="19" font-weight="700" fill="var(--ink)">45%</text>
<text x="450" y="219" font-size="19" font-weight="700" fill="var(--ink)">~1/3</text>
<text x="450" y="259" font-size="19" font-weight="700" fill="var(--ink)">~1/3</text>
<line x1="60" y1="296" x2="900" y2="296" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="334" font-size="19" font-weight="700" fill="var(--dim)">Share above bubble peak at trough</text>
<rect x="240" y="356" width="300" height="28" fill="var(--warn)"/>
<rect x="240" y="396" width="300" height="28" fill="var(--warn)"/>
<text x="228" y="377" font-size="17" fill="var(--ink)" text-anchor="end">Fin</text>
<text x="228" y="417" font-size="17" fill="var(--ink)" text-anchor="end">Disc.</text>
<text x="552" y="377" font-size="19" font-weight="700" fill="var(--ink)">~1/2</text>
<text x="552" y="417" font-size="19" font-weight="700" fill="var(--ink)">~1/2</text>
<text x="60" y="482" font-size="16" fill="var(--dim)">Panels measure different things; not one axis</text>
</svg>
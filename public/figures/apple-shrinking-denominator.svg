<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一條往右下走的折線，右邊一個分數圖形，分子長度不變而分母明顯變短，右側箭頭往上揚">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .n { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:600; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="60">分子沒動，分母一直縮</text>

  <text class="s" x="60" y="118">股數（2015 ＝ 100）</text>
  <line x1="90" y1="345" x2="560" y2="345" stroke="var(--line)" stroke-width="2"/>
  <polyline points="120,160 300,225 480,252" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="120" cy="160" r="6" fill="var(--accent)"/>
  <circle cx="300" cy="225" r="6" fill="var(--accent)"/>
  <circle cx="480" cy="252" r="6" fill="var(--accent)"/>
  <text class="n" x="120" y="145">100</text>
  <text class="n" x="300" y="210">76</text>
  <text class="n" x="480" y="237">66</text>
  <text class="s" x="300" y="285" text-anchor="middle">169.8 億股</text>
  <text class="s" x="480" y="312" text-anchor="middle">147.7 億股</text>
  <text class="s" x="120" y="372" text-anchor="middle">2015</text>
  <text class="s" x="300" y="372" text-anchor="middle">2020</text>
  <text class="s" x="480" y="372" text-anchor="middle">2025</text>

  <line x1="600" y1="120" x2="600" y2="380" stroke="var(--line)" stroke-width="2"/>

  <text class="b" x="640" y="175">獲利</text>
  <rect x="640" y="188" width="180" height="26" fill="var(--grey)"/>
  <line x1="628" y1="240" x2="832" y2="240" stroke="var(--ink)" stroke-width="2"/>
  <rect x="640" y="262" width="106" height="26" fill="var(--accent)"/>
  <text class="b" x="640" y="315">股數</text>
  <text class="c" x="848" y="248">=</text>
  <polyline points="880,300 880,215" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="880,196 871,216 889,216" fill="var(--accent)"/>
  <text class="b" x="880" y="330" text-anchor="middle">每股</text>

  <text class="c" x="60" y="480">每股變多，有一部分不是多賺，是分母變小</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A liquidity growth wave in four phases, with the current position marked on the downslope of the speculation phase.">
  <style>
    svg {
      --page:   #ffffff;
      --card:   #f6f8fc;
      --line:   #dde3ee;
      --ink:    #1a212b;
      --dim:    #57616f;
      --grey:   #9aa5b5;
      --accent: #1f6feb;
      --warn:   #d97706;
      --warnbg: #fdf4e7;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --page:   #0d1117;
        --card:   #161b22;
        --line:   #272e39;
        --ink:    #e6edf3;
        --dim:    #8b949e;
        --grey:   #6b7686;
        --accent: #58a6ff;
        --warn:   #d29922;
        --warnbg: #2b2411;
      }
    }
    .t     { font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1    { font-size: 27px; font-weight: 700; fill: var(--ink); }
    .ph    { font-size: 20px; font-weight: 700; fill: var(--dim); }
    .phN   { font-size: 20px; font-weight: 700; fill: var(--warn); }
    .desc  { font-size: 15px; fill: var(--dim); }
    .here  { font-size: 17px; font-weight: 700; fill: var(--warn); }
    .ax    { font-size: 16px; font-weight: 700; fill: var(--dim); }
    .kick  { font-size: 21px; font-weight: 700; fill: var(--ink); }
  </style>

  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <g class="t">
    <text x="480" y="44" class="h1" text-anchor="middle">Which box of the liquidity cycle are we in</text>

    <!-- 現在所在段落底色 -->
    <rect x="300" y="86" width="200" height="300" fill="var(--warnbg)"/>

    <!-- 分段虛線 -->
    <g stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5,5">
      <line x1="300" y1="86" x2="300" y2="386"/>
      <line x1="500" y1="86" x2="500" y2="386"/>
      <line x1="700" y1="86" x2="700" y2="386"/>
    </g>

    <!-- 曲線 -->
    <path d="M120,200 C200,170 262,180 300,220 C356,282 420,332 500,356 C580,378 640,360 700,330 C782,288 842,238 880,208"
          fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>

    <!-- 現在的位置 -->
    <circle cx="420" cy="332" r="10" fill="var(--warn)"/>
    <line x1="420" y1="342" x2="420" y2="392" stroke="var(--warn)" stroke-width="2.5"/>
    <text x="420" y="416" class="here" text-anchor="middle">We are here</text>

    <!-- 分段名稱 -->
    <text x="210" y="122" class="ph" text-anchor="middle">Calm</text>
    <text x="400" y="122" class="phN" text-anchor="middle">Speculation</text>
    <text x="600" y="122" class="ph" text-anchor="middle">Turbulence</text>
    <text x="790" y="122" class="ph" text-anchor="middle">Rebound</text>

    <text x="210" y="454" class="desc" text-anchor="middle">Just hold the index</text>
    <text x="210" y="476" class="desc" text-anchor="middle">Everything rises</text>

    <text x="400" y="454" class="desc" text-anchor="middle" fill="var(--warn)">Returns are still there</text>
    <text x="400" y="476" class="desc" text-anchor="middle" fill="var(--warn)">but volatile and low quality</text>

    <text x="600" y="454" class="desc" text-anchor="middle">The hardest stretch</text>
    <text x="790" y="454" class="desc" text-anchor="middle">Wait for a bull steepening</text>
    <text x="790" y="476" class="desc" text-anchor="middle">to confirm the turn</text>

    <!-- 軸 -->
    <line x1="100" y1="386" x2="900" y2="386" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="80" y="200" class="ax" text-anchor="end">Liquidity</text>
    <text x="80" y="222" class="ax" text-anchor="end">growth</text>

    <text x="480" y="524" class="kick" text-anchor="middle">The index makes highs while traders struggle</text>
    <text x="480" y="552" class="kick" text-anchor="middle">and that is exactly what speculation looks like.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一百格方陣中九十七格是舊券，只有三格是新券">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<defs>
<pattern id="wf-old" x="100" y="100" width="32" height="32" patternUnits="userSpaceOnUse">
<rect x="0" y="0" width="28" height="28" rx="3" fill="var(--grey)"/>
</pattern>
</defs>
<text class="t" x="480" y="56" text-anchor="middle">流通國債：一百張裡約三張是新券</text>
<rect x="100" y="100" width="320" height="320" fill="url(#wf-old)"/>
<rect x="324" y="388" width="28" height="28" rx="3" fill="var(--accent)"/>
<rect x="356" y="388" width="28" height="28" rx="3" fill="var(--accent)"/>
<rect x="388" y="388" width="28" height="28" rx="3" fill="var(--accent)"/>
<rect x="500" y="150" width="28" height="28" rx="3" fill="var(--accent)"/>
<text class="g" x="545" y="172" style="fill:var(--accent)">新券 約 3%</text>
<text class="b" x="545" y="200">新聞說好賣的</text>
<rect x="500" y="260" width="28" height="28" rx="3" fill="var(--grey)"/>
<text class="g" x="545" y="282">舊券 約 97%</text>
<text class="b" x="545" y="310">機構抱到到期的</text>
<text class="c" x="480" y="490" text-anchor="middle">手上那張多半是舊券</text>
</svg>
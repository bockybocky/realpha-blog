<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="走廊的上下緣在零利率時收合成一條地板">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="58">走廊制撞到零，自己就變成地板</text>
<rect x="60" y="100" width="400" height="340" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="100" width="400" height="340" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="84" y="134">非零利率時</text>
<text class="g" x="524" y="134">利率降到零</text>
<line x1="96" y1="180" x2="424" y2="180" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="96" y="170">上緣</text>
<line x1="96" y1="330" x2="424" y2="330" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="96" y="352">下緣</text>
<path d="M110 255 L160 240 L210 268 L260 248 L310 262 L360 244 L410 256" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
<text class="b" x="300" y="226">市場利率</text>
<line x1="96" y1="400" x2="424" y2="400" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="96" y="422">零</text>
<line x1="536" y1="236" x2="864" y2="236" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="536" y="226">上緣</text>
<line x1="536" y1="400" x2="864" y2="400" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="536" y="392" width="328" height="16" fill="var(--accent)" opacity="0.9"/>
<text class="b" x="536" y="434">下緣與零重合，機會成本歸零</text>
<path d="M700 300 L700 376" fill="none" stroke="var(--dim)" stroke-width="2.5" marker-end="url(#a2)"/>
<defs><marker id="a2" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/></marker></defs>
<text class="c" x="60" y="492">不必宣布切換，制度自己切</text>
</svg>
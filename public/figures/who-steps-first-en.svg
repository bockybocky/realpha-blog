<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A rising staircase where the first mover stands on the top step and the followers sit one or two steps behind, with the direction set by the step already taken.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700">Who steps up first, who follows a step behind</text>

  <rect x="80" y="400" width="190" height="70" fill="var(--card)" stroke="var(--line)"/>
  <rect x="270" y="330" width="190" height="140" fill="var(--card)" stroke="var(--line)"/>
  <rect x="460" y="260" width="190" height="210" fill="var(--card)" stroke="var(--line)"/>
  <rect x="650" y="190" width="190" height="280" fill="var(--card)" stroke="var(--line)"/>

  <text x="175" y="440" font-size="19" fill="var(--dim)" text-anchor="middle">Air cooling</text>
  <text x="365" y="372" font-size="19" fill="var(--dim)" text-anchor="middle">Liquid cooling</text>
  <text x="555" y="302" font-size="19" fill="var(--dim)" text-anchor="middle">Full liquid cooling</text>
  <text x="745" y="232" font-size="19" fill="var(--dim)" text-anchor="middle">Next generation</text>

  <circle cx="745" cy="160" r="15" fill="var(--accent)"/>
  <text x="745" y="128" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">The one who steps first</text>

  <circle cx="555" cy="230" r="13" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <circle cx="365" cy="300" r="13" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <text x="300" y="268" font-size="19">Followers</text>

  <path d="M716 170 L584 240" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="590,228 578,246 601,245" fill="var(--grey)"/>
  <path d="M526 240 L394 310" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="400,298 388,316 411,315" fill="var(--grey)"/>

  <text x="80" y="512" font-size="22" font-weight="700">Someone takes the step before others follow</text>
</svg>
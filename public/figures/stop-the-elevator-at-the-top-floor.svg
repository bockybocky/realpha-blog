<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="大樓頂樓被點亮，中段一道橫桿擋住電梯井，下層的上行箭頭全部被擋下">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">到了頂樓，把電梯停掉</text>
<rect x="330" y="110" width="300" height="360" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="330" y="110" width="300" height="72" rx="8" fill="var(--accent)"/>
<text class="t" x="356" y="155" font-size="20" fill="var(--page)">前沿實驗室</text>
<line x1="330" y1="254" x2="630" y2="254" stroke="var(--line)" stroke-width="2"/>
<line x1="330" y1="326" x2="630" y2="326" stroke="var(--line)" stroke-width="2"/>
<line x1="330" y1="398" x2="630" y2="398" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="356" y="370" font-size="19" fill="var(--ink)">軟體公司</text>
<text class="t" x="356" y="442" font-size="19" fill="var(--ink)">新創</text>
<line x1="700" y1="130" x2="700" y2="460" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="t" x="716" y="130" font-size="15" fill="var(--dim)">電梯井</text>
<rect x="676" y="126" width="48" height="48" rx="4" fill="var(--accent)"/>
<line x1="656" y1="216" x2="744" y2="216" stroke="var(--warn)" stroke-width="6"/>
<text class="t" x="756" y="222" font-size="19" fill="var(--warn)">停掉</text>
<path d="M700 380 L700 250" fill="none" stroke="var(--dim)" stroke-width="3"/>
<path d="M692 262 L700 246 L708 262 Z" fill="var(--dim)"/>
<path d="M660 440 L660 250" fill="none" stroke="var(--dim)" stroke-width="3"/>
<path d="M652 262 L660 246 L668 262 Z" fill="var(--dim)"/>
<text class="t" x="60" y="524" font-size="22" fill="var(--ink)">放慢的是後面那些人</text>
</svg>
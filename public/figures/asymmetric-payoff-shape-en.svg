<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two groups of bars measured from a center line, the left group equal above and below, the right group long above and short below, showing that the thing to look for is an asymmetric shape.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="70">Shape over odds</text>

  <line x1="60" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>
  <text class="d" x="60" y="292">Up</text>
  <text class="d" x="60" y="322">Dn</text>

  <rect x="200" y="200" width="150" height="100" rx="6" fill="var(--grey)"/>
  <rect x="200" y="300" width="150" height="100" rx="6" fill="var(--warn)"/>
  <text class="g" x="275" y="446" text-anchor="middle">Herd</text>
  <text class="d" x="275" y="476" text-anchor="middle">Right = pay</text>

  <rect x="620" y="110" width="150" height="190" rx="6" fill="var(--accent)"/>
  <rect x="620" y="300" width="150" height="36" rx="6" fill="var(--warn)"/>
  <text class="g" x="695" y="446" text-anchor="middle">Bet when all cut</text>
  <text class="d" x="695" y="476" text-anchor="middle">Not wrong by much</text>

  <text class="c" x="60" y="528">Small down, big up pays</text>
</svg>
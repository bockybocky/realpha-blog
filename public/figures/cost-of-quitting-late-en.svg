<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Cost-of-quitting curve: the later you find out, the higher the curve, with the right end far above the left end.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:19px; fill:var(--ink); font-weight:700; }
    .lbl { font-size:16px; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ttl" x="60" y="62">The price of quitting</text>

<line x1="140" y1="120" x2="140" y2="470" stroke="var(--grey)" stroke-width="2"/>
<line x1="140" y1="470" x2="890" y2="470" stroke="var(--grey)" stroke-width="2"/>
<text class="grp" x="60" y="112">Cost</text>
<text class="grp" x="820" y="510">When found</text>

<path d="M140 456 C 400 448, 620 400, 860 150" fill="none" stroke="var(--accent)" stroke-width="5"/>

<line x1="250" y1="470" x2="250" y2="446" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="250" cy="446" r="11" fill="var(--accent)"/>
<text class="grp" x="250" y="424" text-anchor="middle">6 months</text>
<text class="lbl" x="250" y="504" text-anchor="middle">33 prototypes</text>

<line x1="836" y1="470" x2="836" y2="168" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="836" cy="168" r="14" fill="var(--warn)"/>
<text class="grp" x="836" y="140" text-anchor="middle">3.5 years</text>

<line x1="700" y1="168" x2="700" y2="446" stroke="var(--warn)" stroke-width="3"/>
<polygon points="700,168 693,186 707,186" fill="var(--warn)"/>
<polygon points="700,446 693,428 707,428" fill="var(--warn)"/>
<text class="grp" x="684" y="310" text-anchor="end">Money</text>
<text class="grp" x="684" y="340" text-anchor="end">People</text>
<text class="grp" x="684" y="370" text-anchor="end">Channels</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two two-by-two grids, one highlighting a full column and the other a full row.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">The denominators differ</text>
<text class="g" x="110" y="140">Precision</text>
<text class="s" x="245" y="140">The column you called positive</text>
<rect x="110" y="200" width="130" height="90" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<rect x="240" y="200" width="130" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="290" width="130" height="90" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<rect x="240" y="290" width="130" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="175" y="251" text-anchor="middle">Hit</text>
<text class="b" x="305" y="251" text-anchor="middle">Missed</text>
<text class="b" x="175" y="341" text-anchor="middle">False alarm</text>
<text class="b" x="305" y="341" text-anchor="middle">Ruled out</text>
<text class="s" x="175" y="190" text-anchor="middle">Predicted +</text>
<text class="s" x="305" y="190" text-anchor="middle">Predicted -</text>
<text class="s" x="100" y="251" text-anchor="end">Actual +</text>
<text class="s" x="100" y="341" text-anchor="end">Actual -</text>
<text class="g" x="580" y="140">Recall</text>
<text class="s" x="680" y="140">The row that really is positive</text>
<rect x="580" y="200" width="130" height="90" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<rect x="710" y="200" width="130" height="90" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
<rect x="580" y="290" width="130" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="710" y="290" width="130" height="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="645" y="251" text-anchor="middle">Hit</text>
<text class="b" x="775" y="251" text-anchor="middle">Missed</text>
<text class="b" x="645" y="341" text-anchor="middle">False alarm</text>
<text class="b" x="775" y="341" text-anchor="middle">Ruled out</text>
<text class="s" x="645" y="190" text-anchor="middle">Predicted +</text>
<text class="s" x="775" y="190" text-anchor="middle">Predicted -</text>
<text class="s" x="570" y="251" text-anchor="end">Actual +</text>
<text class="s" x="570" y="341" text-anchor="end">Actual -</text>
<text class="b" x="110" y="425">Both use the hit cell on top</text>
<text class="c" x="60" y="490">One divides by a column, one by a row</text>
</svg>
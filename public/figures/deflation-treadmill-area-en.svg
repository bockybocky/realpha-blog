<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A tall narrow block beside a short wide block of equal area">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">The cost of standing still</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">H=price W=volume A=revenue</text>
<line x1="80" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="130" width="110" height="300" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="165" y="116" font-size="19" fill="var(--accent)" text-anchor="middle">Today</text>
<rect x="380" y="355" width="440" height="75" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="600" y="341" font-size="19" fill="var(--warn)" text-anchor="middle">A year later</text>
<line x1="290" y1="140" x2="290" y2="345" stroke="var(--warn)" stroke-width="2"/>
<polygon points="290,358 283,338 297,338" fill="var(--warn)"/>
<text x="300" y="250" font-size="16" fill="var(--warn)">Price −80%</text>
<line x1="380" y1="466" x2="820" y2="466" stroke="var(--ink)" stroke-width="2"/>
<text x="600" y="494" font-size="16" fill="var(--ink)" text-anchor="middle">Volume ×4</text>
<text x="480" y="536" font-size="22" fill="var(--ink)" text-anchor="middle">Same area, just to avoid falling</text>
</svg>
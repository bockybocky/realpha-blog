<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="九格中八格被劃掉只剩一格，賣出動作落在崩盤之前">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t h" x="60" y="68">九檔，賣掉八檔</text>

<g>
<rect x="60" y="110" width="110" height="80" rx="10" fill="var(--grey)" opacity="0.45"/><rect x="190" y="110" width="110" height="80" rx="10" fill="var(--grey)" opacity="0.45"/><rect x="320" y="110" width="110" height="80" rx="10" fill="var(--grey)" opacity="0.45"/>
<rect x="60" y="205" width="110" height="80" rx="10" fill="var(--grey)" opacity="0.45"/><rect x="190" y="205" width="110" height="80" rx="10" fill="var(--grey)" opacity="0.45"/><rect x="320" y="205" width="110" height="80" rx="10" fill="var(--grey)" opacity="0.45"/>
<rect x="60" y="300" width="110" height="80" rx="10" fill="var(--grey)" opacity="0.45"/><rect x="190" y="300" width="110" height="80" rx="10" fill="var(--grey)" opacity="0.45"/>
<g stroke="var(--dim)" stroke-width="3">
<path d="M70 180 L160 120"/><path d="M200 180 L290 120"/><path d="M330 180 L420 120"/>
<path d="M70 275 L160 215"/><path d="M200 275 L290 215"/><path d="M330 275 L420 215"/>
<path d="M70 370 L160 310"/><path d="M200 370 L290 310"/>
</g>
<rect x="320" y="300" width="110" height="80" rx="10" fill="var(--accent)"/>
<text class="t b" x="320" y="408">留下一檔</text>
</g>

<text class="t g" x="520" y="150">出清</text>
<text class="t b" x="520" y="184">自己的公司，自己的錢</text>
<text class="t b" x="520" y="214">金額已經一輩子花不完</text>

<path d="M520 300 L900 300" stroke="var(--line)" stroke-width="4"/>
<circle cx="560" cy="300" r="9" fill="var(--accent)"/>
<circle cx="740" cy="300" r="9" fill="var(--accent)"/>
<circle cx="880" cy="300" r="9" fill="var(--warn)"/>
<text class="t b" x="524" y="340">一九九九底</text>
<text class="t b" x="706" y="340">二〇〇〇</text>
<text class="t b" x="828" y="340">崩盤</text>
<text class="t g" x="520" y="400">賣完，在前面</text>
</svg>
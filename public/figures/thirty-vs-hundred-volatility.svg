<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上方三十檔的波浪振幅小，下方一百檔的波浪振幅大上數倍">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="68">檔數多，不等於抖得小</text>
<line x1="120" y1="190" x2="860" y2="190" stroke="var(--line)" stroke-width="2"/>
<path d="M120,190 C170,166 220,214 270,190 C320,166 370,214 420,190 C470,166 520,214 570,190 C620,166 670,214 720,190 C770,166 810,212 860,190" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="g" x="120" y="146">三十檔・中大型</text>
<line x1="880" y1="166" x2="880" y2="214" stroke="var(--grey)" stroke-width="3"/>
<line x1="120" y1="380" x2="860" y2="380" stroke="var(--line)" stroke-width="2"/>
<path d="M120,380 C170,308 220,452 270,380 C320,308 370,452 420,380 C470,308 520,452 570,380 C620,308 670,452 720,380 C770,308 810,448 860,380" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="g" x="120" y="296">一百檔・小型與微型</text>
<line x1="880" y1="308" x2="880" y2="452" stroke="var(--grey)" stroke-width="3"/>
<text class="c" x="120" y="488">兩三倍的起伏</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊四條箭頭匯向同一個故障，右邊只有一條箭頭">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="78" font-size="27" font-weight="700" fill="var(--ink)">壞了，誰的錯</text>
  <line x1="480" y1="120" x2="480" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="80" y="150" font-size="20" font-weight="700" fill="var(--warn)">一次加四樣</text>
  <rect x="80" y="178" width="140" height="46" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="150" y="207" font-size="16" fill="var(--ink)" text-anchor="middle">切鏡</text>
  <rect x="80" y="238" width="140" height="46" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="150" y="267" font-size="16" fill="var(--ink)" text-anchor="middle">釘格</text>
  <rect x="80" y="298" width="140" height="46" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="150" y="327" font-size="16" fill="var(--ink)" text-anchor="middle">補格</text>
  <rect x="80" y="358" width="140" height="46" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="150" y="387" font-size="16" fill="var(--ink)" text-anchor="middle">換文字模型</text>
  <path d="M225 201 L350 280" stroke="var(--warn)" stroke-width="2" fill="none"/>
  <path d="M225 261 L350 283" stroke="var(--warn)" stroke-width="2" fill="none"/>
  <path d="M225 321 L350 289" stroke="var(--warn)" stroke-width="2" fill="none"/>
  <path d="M225 381 L350 292" stroke="var(--warn)" stroke-width="2" fill="none"/>
  <circle cx="385" cy="286" r="34" fill="var(--warn)" opacity="0.2"/>
  <circle cx="385" cy="286" r="34" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="385" y="293" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">故障</text>
  <text class="t" x="150" y="452" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">四個嫌疑</text>
  <text class="t" x="540" y="150" font-size="20" font-weight="700" fill="var(--accent)">一次加一樣</text>
  <rect x="540" y="258" width="150" height="56" rx="5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="615" y="293" font-size="16" fill="var(--ink)" text-anchor="middle">釘格</text>
  <path d="M697 286 L785 286" stroke="var(--accent)" stroke-width="3" fill="none"/>
  <circle cx="835" cy="286" r="34" fill="var(--accent)" opacity="0.18"/>
  <circle cx="835" cy="286" r="34" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="835" y="293" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">故障</text>
  <text class="t" x="700" y="452" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">只有一個嫌疑</text>
</svg>
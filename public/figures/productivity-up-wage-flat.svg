<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="折線圖：一條線上升、一條線持平，兩線之間的垂直落差隨時間拉大">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">生產力一路往上，那半數人的線是平的</text>

  <line x1="120" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
  <line x1="120" y1="110" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>

  <path d="M 140 400 L 300 330 L 480 262 L 660 198 L 840 140" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <path d="M 140 400 L 300 396 L 480 402 L 660 394 L 840 398" fill="none" stroke="var(--warn)" stroke-width="4"/>

  <line x1="840" y1="140" x2="840" y2="398" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="t" x="826" y="276" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="end">落差</text>

  <text class="t" x="852" y="134" font-size="19" font-weight="700" fill="var(--accent)">整體生產力</text>
  <text class="t" x="852" y="424" font-size="19" font-weight="700" fill="var(--warn)">沒有大學學歷</text>

  <circle cx="300" cy="396" r="6" fill="var(--warn)"/>
  <text class="t" x="300" y="478" font-size="16" fill="var(--dim)" text-anchor="middle">電腦擴散</text>
  <circle cx="840" cy="398" r="6" fill="var(--warn)"/>
  <text class="t" x="840" y="478" font-size="16" fill="var(--dim)" text-anchor="middle">AI</text>
  <text class="t" x="140" y="478" font-size="16" fill="var(--dim)" text-anchor="middle">五十年前</text>

  <text class="t" x="120" y="524" font-size="22" font-weight="700" fill="var(--ink)">上一輪還沒恢復，下一輪已經來了</text>
</svg>
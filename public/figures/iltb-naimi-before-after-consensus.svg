<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="報酬分布曲線的右尾上兩道垂直線，較左是前四分之一，更右是前百分之五">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<text x="80" y="60" font-size="27" font-weight="700">在共識之前付錢，還是之後</text>
<line x1="120" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<text x="760" y="468" font-size="16" fill="var(--dim)">基金報酬</text>
<path d="M140 430 C 260 430 240 190 420 190 C 620 190 660 420 880 428" fill="none" stroke="var(--grey)" stroke-width="4"/>
<line x1="672" y1="150" x2="672" y2="430" stroke="var(--accent)" stroke-width="3"/>
<text x="560" y="138" font-size="20" font-weight="700" fill="var(--accent)">前四分之一</text>
<text x="560" y="112" font-size="16" fill="var(--dim)">共識之後</text>
<line x1="812" y1="210" x2="812" y2="430" stroke="var(--warn)" stroke-width="3"/>
<text x="744" y="198" font-size="20" font-weight="700" fill="var(--warn)">前百分之五</text>
<text x="744" y="172" font-size="16" fill="var(--dim)">共識之前</text>
<text x="150" y="330" font-size="16" fill="var(--dim)">多數基金</text>
<text x="80" y="510" font-size="22" font-weight="700">多付的那些錢，買的是別人的同意</text>
</svg>
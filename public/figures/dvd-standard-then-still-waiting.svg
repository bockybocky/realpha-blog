<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左側柱狀對比：預期 120 萬台對上實際 34 萬台；右側時間線從 1995 年統一規格經 1998、1999、2000 三個事件點，才到 2001 年與錄影帶打平">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">路障拆掉了，車還沒上路</text>

<line x1="60" y1="330" x2="330" y2="330" stroke="var(--line)" stroke-width="2"/>
<rect x="90" y="130" width="80" height="200" fill="var(--grey)" opacity="0.5"/>
<text x="130" y="118" font-size="16" fill="var(--dim)" text-anchor="middle">預期 120 萬台</text>
<rect x="220" y="273" width="80" height="57" fill="var(--warn)" opacity="0.85"/>
<text x="260" y="261" font-size="16" fill="var(--warn)" text-anchor="middle">實際 34 萬台</text>
<text x="195" y="362" font-size="15" fill="var(--dim)" text-anchor="middle">1997 年底・美國</text>

<line x1="430" y1="150" x2="430" y2="470" stroke="var(--line)" stroke-width="3"/>

<circle cx="430" cy="170" r="8" fill="var(--accent)"/>
<text x="462" y="166" font-size="19" fill="var(--ink)">1995 年 8 月・統一規格</text>
<text x="462" y="192" font-size="15" fill="var(--dim)">障礙解除</text>

<circle cx="430" cy="266" r="7" fill="var(--grey)"/>
<text x="462" y="272" font-size="16" fill="var(--dim)">1998・郵寄租片</text>
<circle cx="430" cy="330" r="7" fill="var(--grey)"/>
<text x="462" y="336" font-size="16" fill="var(--dim)">1999・200 美元播放機</text>
<circle cx="430" cy="394" r="7" fill="var(--grey)"/>
<text x="462" y="400" font-size="16" fill="var(--dim)">2000・遊戲機帶量</text>

<circle cx="430" cy="470" r="8" fill="var(--accent)"/>
<text x="462" y="476" font-size="19" fill="var(--ink)">2001・與錄影帶打平</text>

<text x="60" y="534" font-size="22" fill="var(--ink)">中間這六年，缺的不是規格</text>
</svg>
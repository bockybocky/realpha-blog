<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根直條，工程費段相同、利息段一高一矮，差額箭頭指向電費">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="48" y="66" font-size="27" fill="var(--ink)">核電的大頭在利息</text>
<line x1="140" y1="430" x2="860" y2="430" stroke="var(--line)"/>
<rect x="200" y="310" width="160" height="120" fill="var(--grey)"/>
<rect x="200" y="150" width="160" height="160" fill="var(--warn)"/>
<text x="200" y="134" font-size="19" fill="var(--dim)">市場發債</text>
<text x="212" y="240" font-size="16" fill="var(--page)">施工期利息</text>
<text x="212" y="378" font-size="16" fill="var(--page)">工程費</text>
<rect x="560" y="310" width="160" height="120" fill="var(--grey)"/>
<rect x="560" y="222" width="160" height="88" fill="var(--accent)"/>
<text x="560" y="134" font-size="19" fill="var(--dim)">政府貸款</text>
<text x="572" y="276" font-size="16" fill="var(--page)">施工期利息</text>
<text x="572" y="378" font-size="16" fill="var(--page)">工程費</text>
<line x1="400" y1="150" x2="520" y2="150" stroke="var(--line)" stroke-dasharray="6 6"/>
<line x1="400" y1="222" x2="520" y2="222" stroke="var(--line)" stroke-dasharray="6 6"/>
<line x1="460" y1="150" x2="460" y2="222" stroke="var(--accent)" stroke-width="3"/>
<polygon points="460,240 452,218 468,218" fill="var(--accent)"/>
<text x="400" y="290" font-size="19" fill="var(--accent)">省下的利息</text>
<line x1="460" y1="300" x2="460" y2="470" stroke="var(--accent)" stroke-dasharray="6 6"/>
<polygon points="460,486 450,462 470,462" fill="var(--accent)"/>
<text x="404" y="516" font-size="22" fill="var(--ink)">落在用戶電費上</text>
</g>
</svg>
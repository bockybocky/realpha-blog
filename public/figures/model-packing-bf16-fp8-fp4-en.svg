<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Three rows of different lengths: BF16 longest, FP8 half, FP4 a quarter; Apple can use only the longest">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">One model, three ways to store it</text>
<text x="170" y="146" text-anchor="end" font-size="20" font-weight="700" fill="var(--ink)">BF16</text>
<g fill="var(--accent)">
<rect x="200" y="110" width="36" height="56" rx="4"/><rect x="240" y="110" width="36" height="56" rx="4"/><rect x="280" y="110" width="36" height="56" rx="4"/><rect x="320" y="110" width="36" height="56" rx="4"/>
<rect x="360" y="110" width="36" height="56" rx="4"/><rect x="400" y="110" width="36" height="56" rx="4"/><rect x="440" y="110" width="36" height="56" rx="4"/><rect x="480" y="110" width="36" height="56" rx="4"/>
<rect x="520" y="110" width="36" height="56" rx="4"/><rect x="560" y="110" width="36" height="56" rx="4"/><rect x="600" y="110" width="36" height="56" rx="4"/><rect x="640" y="110" width="36" height="56" rx="4"/>
<rect x="680" y="110" width="36" height="56" rx="4"/><rect x="720" y="110" width="36" height="56" rx="4"/><rect x="760" y="110" width="36" height="56" rx="4"/><rect x="800" y="110" width="36" height="56" rx="4"/>
</g>
<text x="852" y="146" font-size="19" fill="var(--dim)">×1</text>
<text x="200" y="194" font-size="16" font-weight="700" fill="var(--accent)">Works on Apple</text>
<text x="170" y="256" text-anchor="end" font-size="20" font-weight="700" fill="var(--ink)">FP8</text>
<g fill="var(--grey)">
<rect x="200" y="220" width="36" height="56" rx="4"/><rect x="240" y="220" width="36" height="56" rx="4"/><rect x="280" y="220" width="36" height="56" rx="4"/><rect x="320" y="220" width="36" height="56" rx="4"/>
<rect x="360" y="220" width="36" height="56" rx="4"/><rect x="400" y="220" width="36" height="56" rx="4"/><rect x="440" y="220" width="36" height="56" rx="4"/><rect x="480" y="220" width="36" height="56" rx="4"/>
</g>
<text x="532" y="256" font-size="19" fill="var(--dim)">×½</text>
<text x="200" y="304" font-size="16" font-weight="700" fill="var(--warn)">Not on Apple</text>
<text x="170" y="366" text-anchor="end" font-size="20" font-weight="700" fill="var(--ink)">FP4 / INT4</text>
<g fill="var(--grey)">
<rect x="200" y="330" width="36" height="56" rx="4"/><rect x="240" y="330" width="36" height="56" rx="4"/><rect x="280" y="330" width="36" height="56" rx="4"/><rect x="320" y="330" width="36" height="56" rx="4"/>
</g>
<text x="372" y="366" font-size="19" fill="var(--dim)">×¼</text>
<text x="200" y="414" font-size="16" font-weight="700" fill="var(--warn)">Not on Apple</text>
<text x="480" y="480" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">Longest row only → buy more memory</text>
</svg>
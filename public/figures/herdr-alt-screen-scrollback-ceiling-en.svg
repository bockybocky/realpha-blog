<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The answer bar runs past the top of the pane and the part above cannot be read back; on the right a file route goes around the limit and the whole answer is available.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="56" y="62" font-size="27" font-weight="700" fill="var(--ink)">Raising the line count cannot recover what scrolled off</text>

  <rect x="150" y="96" width="200" height="120" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="250" y="150" font-size="18" fill="var(--grey)" text-anchor="middle">already scrolled off</text>
  <text x="250" y="178" font-size="15" fill="var(--grey)" text-anchor="middle">never recorded</text>

  <rect x="120" y="230" width="260" height="230" rx="12" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="140" y="260" font-size="19" fill="var(--dim)">pane</text>
  <rect x="150" y="276" width="200" height="160" rx="8" fill="var(--accent)"/>
  <text x="250" y="348" font-size="18" font-weight="700" fill="var(--page)" text-anchor="middle">readable</text>
  <text x="250" y="374" font-size="15" fill="var(--page)" text-anchor="middle">only this part</text>

  <line x1="420" y1="330" x2="420" y2="436" stroke="var(--warn)" stroke-width="3"/>
  <path d="M412 330 L 420 314 L 428 330 Z" fill="var(--warn)"/>
  <text x="440" y="368" font-size="16" fill="var(--warn)">raise the line count</text>
  <text x="440" y="392" font-size="16" fill="var(--warn)">stops at the top edge</text>

  <line x1="600" y1="110" x2="600" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 8"/>

  <text x="648" y="132" font-size="20" fill="var(--accent)">go around it</text>
  <rect x="648" y="156" width="252" height="72" rx="10" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="774" y="200" font-size="18" fill="var(--ink)" text-anchor="middle">agent writes a file</text>
  <line x1="774" y1="228" x2="774" y2="290" stroke="var(--accent)" stroke-width="3"/>
  <path d="M766 284 L 774 300 L 782 284 Z" fill="var(--accent)"/>
  <rect x="648" y="306" width="252" height="72" rx="10" fill="var(--page)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="774" y="350" font-size="18" fill="var(--ink)" text-anchor="middle">returns just a path</text>
  <line x1="774" y1="378" x2="774" y2="410" stroke="var(--accent)" stroke-width="3"/>
  <path d="M766 404 L 774 420 L 782 404 Z" fill="var(--accent)"/>
  <rect x="648" y="426" width="252" height="60" rx="10" fill="var(--accent)"/>
  <text x="774" y="464" font-size="18" font-weight="700" fill="var(--page)" text-anchor="middle">the whole thing</text>

  <text x="56" y="532" font-size="22" fill="var(--ink)">The ceiling is the screen, not the setting</text>
</svg>
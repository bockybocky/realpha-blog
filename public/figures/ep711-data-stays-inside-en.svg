<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two panels compared side by side: before, data crosses out of the company's dashed boundary to feed an outside model; after, the boundary is solid, data and weights stay inside, a thick pipe stands for the wiring, and the model shrinks and turns grey.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="56">Value shifts to data, and so does the question</text>
  <text class="g" x="60" y="112">Before</text>
  <rect x="60" y="140" width="210" height="210" rx="10" fill="var(--card)" stroke="var(--line)" stroke-dasharray="8 6"/>
  <text class="b" x="72" y="166">Company</text>
  <rect x="86" y="190" width="40" height="40" rx="5" fill="var(--accent)"/>
  <rect x="140" y="190" width="40" height="40" rx="5" fill="var(--accent)"/>
  <rect x="86" y="248" width="40" height="40" rx="5" fill="var(--accent)"/>
  <rect x="140" y="248" width="40" height="40" rx="5" fill="var(--accent)"/>
  <text class="b" x="196" y="246">Data</text>
  <path d="M200 300 L330 300" stroke="var(--accent)" stroke-width="6" fill="none"/>
  <path d="M330 300 l-16 -9 l0 18 z" fill="var(--accent)"/>
  <rect x="345" y="170" width="110" height="160" rx="10" fill="var(--grey)"/>
  <text class="b" x="352" y="352">Model (someone else's)</text>
  <text class="b" x="60" y="392">Data crosses the company line</text>
  <text class="g" x="530" y="112">After</text>
  <rect x="530" y="140" width="370" height="210" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text class="b" x="542" y="166">Company</text>
  <rect x="556" y="190" width="40" height="40" rx="5" fill="var(--accent)"/>
  <rect x="610" y="190" width="40" height="40" rx="5" fill="var(--accent)"/>
  <rect x="556" y="248" width="40" height="40" rx="5" fill="var(--accent)"/>
  <rect x="610" y="248" width="40" height="40" rx="5" fill="var(--accent)"/>
  <text class="b" x="556" y="318">Data / weights</text>
  <path d="M676 240 L756 240" stroke="var(--accent)" stroke-width="14" fill="none"/>
  <text class="b" x="676" y="286">Wiring</text>
  <rect x="770" y="200" width="100" height="80" rx="10" fill="var(--grey)"/>
  <text class="b" x="770" y="318">Model (commodity)</text>
  <text class="b" x="530" y="392">Line stays uncrossed; rent moves to wiring</text>
  <text class="c" x="60" y="462">Not "whose model wins" but "who wires the workflow"</text>
</svg>
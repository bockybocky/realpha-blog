<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two readings of the same set of wins: a pendulum that swings back, or a one-way ramp that does not.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="50" y="58" font-size="27" font-weight="700" fill="var(--ink)">Two readings of the orange wave</text>

<rect x="50" y="92" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="74" y="126" font-size="20" font-weight="700" fill="var(--dim)">Anti-incumbent pendulum</text>
<circle cx="250" cy="156" r="6" fill="var(--grey)"/>
<path d="M130 316 q120 -70 240 0" fill="none" stroke="var(--line)" stroke-width="3"/>
<line x1="250" y1="156" x2="352" y2="300" stroke="var(--accent)" stroke-width="3"/>
<circle cx="352" cy="300" r="20" fill="var(--accent)"/>
<path d="M322 214 q-56 -34 -112 0" fill="none" stroke="var(--warn)" stroke-width="3"/>
<polygon points="210,214 232,202 230,228" fill="var(--warn)"/>
<text x="130" y="348" font-size="16" fill="var(--dim)">Left</text>
<text x="368" y="348" font-size="16" fill="var(--dim)">Right</text>
<text x="250" y="398" font-size="16" fill="var(--ink)" text-anchor="middle">Swings back at the end</text>

<rect x="510" y="92" width="400" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="534" y="126" font-size="20" font-weight="700" fill="var(--dim)">Broad shift right</text>
<line x1="546" y1="330" x2="846" y2="330" stroke="var(--line)" stroke-width="2"/>
<line x1="556" y1="320" x2="836" y2="180" stroke="var(--accent)" stroke-width="4"/>
<polygon points="836,180 812,178 824,202" fill="var(--accent)"/>
<text x="710" y="398" font-size="16" fill="var(--ink)" text-anchor="middle">One way only</text>

<text x="480" y="480" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">The difference is whether it comes back</text>
</svg>
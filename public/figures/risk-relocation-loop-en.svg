<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Risk is pushed from banks into private credit and then falls back onto life insurers, landing lower than where it started.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<defs>
<marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
</marker>
</defs>
<text x="48" y="58" font-size="27" fill="var(--ink)">Where the risk went</text>
<text x="48" y="152" font-size="15" fill="var(--dim)">Losses eaten privately</text>
<text x="48" y="472" font-size="15" fill="var(--dim)">Losses socialised</text>

<path d="M290,420 C350,400 340,204 384,188" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arA)"/>
<path d="M570,188 C640,204 640,420 694,456" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arA)"/>

<text x="350" y="300" font-size="15" fill="var(--dim)">2008 policy: out of the banks</text>
<text x="652" y="330" font-size="15" fill="var(--dim)">The last fifteen years: buying insurers</text>

<rect x="110" y="390" width="180" height="60" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="200" y="427" font-size="19" fill="var(--ink)" text-anchor="middle">Banking system</text>

<rect x="390" y="150" width="180" height="60" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="480" y="187" font-size="19" fill="var(--ink)" text-anchor="middle">Private credit</text>

<rect x="700" y="430" width="180" height="60" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="790" y="467" font-size="19" fill="var(--ink)" text-anchor="middle">Life insurers</text>

<path d="M200,450 L200,498" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
<path d="M790,490 L790,498" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
<path d="M480,210 L480,498" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

<rect x="110" y="500" width="300" height="30" rx="6" fill="var(--card)" stroke="var(--line)"/>
<text x="260" y="520" font-size="15" fill="var(--dim)" text-anchor="middle">FDIC: pre-funded, risk-based</text>
<text x="515" y="520" font-size="15" fill="var(--grey)" text-anchor="middle">No backstop</text>
<rect x="620" y="500" width="300" height="30" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-dasharray="5 4"/>
<text x="770" y="520" font-size="15" fill="var(--warn)" text-anchor="middle">Guaranty funds: levied after, untested</text>

<text x="480" y="574" font-size="22" fill="var(--ink)" text-anchor="middle">Moved out, round the loop, landing somewhere weaker</text>
</svg>
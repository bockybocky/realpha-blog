<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two groups of boxes sit on either side of a vertical line, solid-outlined on the left and dashed-outlined on the right.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">If the person leaves, which pile remains</text>

<line x1="480" y1="100" x2="480" y2="450" stroke="var(--line)" stroke-width="3"/>

<text class="t" x="60" y="136" font-size="20" font-weight="700" fill="var(--accent)">Locked into the system</text>
<rect x="60" y="160" width="340" height="68" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="84" y="202" font-size="19" font-weight="700" fill="var(--ink)">Purchase commitments</text>
<rect x="60" y="248" width="340" height="68" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="84" y="290" font-size="19" font-weight="700" fill="var(--ink)">Roadmap products</text>
<rect x="60" y="336" width="340" height="68" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="84" y="378" font-size="19" font-weight="700" fill="var(--ink)">Supply chain ties</text>

<text class="t" x="560" y="136" font-size="20" font-weight="700" fill="var(--warn)">Alive in judgment</text>
<rect x="560" y="160" width="340" height="68" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="t" x="584" y="202" font-size="19" font-weight="700" fill="var(--ink)">The next big bet</text>
<rect x="560" y="248" width="340" height="68" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="t" x="584" y="290" font-size="19" font-weight="700" fill="var(--ink)">Shifting resources into a headwind</text>
<rect x="560" y="336" width="340" height="68" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="t" x="584" y="378" font-size="19" font-weight="700" fill="var(--ink)">Whether the core team stays</text>

<text class="t" x="230" y="482" font-size="22" font-weight="700" fill="var(--accent)" text-anchor="middle">Still counts</text>
<text class="t" x="730" y="482" font-size="22" font-weight="700" fill="var(--warn)" text-anchor="middle">Watch again</text>
</svg>
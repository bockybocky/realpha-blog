<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="貨架上老戲長條不退場，新戲擠在最右邊爭同一個位置">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="54" font-size="27" font-weight="700" fill="var(--ink)">貨架不清空：新戲要跟整個片庫搶</text>
<rect x="60" y="100" width="840" height="330" fill="var(--card)"/>
<rect x="90" y="200" width="54" height="220" fill="var(--ink)"/>
<rect x="160" y="230" width="54" height="190" fill="var(--ink)"/>
<rect x="260" y="290" width="40" height="130" fill="var(--grey)"/>
<rect x="310" y="305" width="40" height="115" fill="var(--grey)" opacity="0.9"/>
<rect x="360" y="320" width="40" height="100" fill="var(--grey)" opacity="0.8"/>
<rect x="410" y="333" width="40" height="87" fill="var(--grey)" opacity="0.7"/>
<rect x="460" y="345" width="40" height="75" fill="var(--grey)" opacity="0.6"/>
<rect x="510" y="356" width="40" height="64" fill="var(--grey)" opacity="0.5"/>
<rect x="560" y="366" width="40" height="54" fill="var(--grey)" opacity="0.45"/>
<rect x="610" y="375" width="40" height="45" fill="var(--grey)" opacity="0.4"/>
<rect x="660" y="383" width="40" height="37" fill="var(--grey)" opacity="0.35"/>
<rect x="710" y="390" width="40" height="30" fill="var(--grey)" opacity="0.3"/>
<rect x="820" y="285" width="54" height="135" fill="var(--accent)"/>
<line x1="80" y1="420" x2="890" y2="420" stroke="var(--ink)" stroke-width="3"/>
<text x="90" y="186" font-size="20" font-weight="700" fill="var(--ink)">頭部：還喊得出高價</text>
<text x="260" y="276" font-size="20" font-weight="700" fill="var(--dim)">中段：一塊一塊掉價</text>
<text x="847" y="271" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">新戲</text>
<path d="M847 226 L847 258" stroke="var(--accent)" stroke-width="3"/>
<path d="M840 250 L847 262 L854 250 Z" fill="var(--accent)"/>
<text x="847" y="215" font-size="16" fill="var(--dim)" text-anchor="middle">擠進同一格</text>
<text x="90" y="452" font-size="16" fill="var(--dim)">舊的不下架、不折舊成零</text>
<text x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">供給不退場，競爭就不只是同時段的別台。</text>
</svg>
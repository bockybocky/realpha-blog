<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-label="三個環節下方的柱子一高一平一低：設備與人力留下錢，電力公司只過手，住戶付帳">
<rect x="0" y="0" width="960" height="610" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="56" text-anchor="middle">需求爆了，錢停在哪一層</text>
<text class="b" x="100" y="126" text-anchor="middle">需求衝擊</text>
<line x1="30" y1="140" x2="164" y2="140" stroke="var(--accent)" stroke-width="4"/>
<polygon points="162,131 180,140 162,149" fill="var(--accent)"/>
<rect x="180" y="110" width="200" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="280" y="147" text-anchor="middle">設備・人力</text>
<text class="b" x="410" y="126" text-anchor="middle">成本</text>
<line x1="382" y1="140" x2="426" y2="140" stroke="var(--grey)" stroke-width="3"/>
<polygon points="424,133 438,140 424,147" fill="var(--grey)"/>
<rect x="440" y="110" width="200" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="540" y="147" text-anchor="middle">電力公司</text>
<text class="b" x="670" y="126" text-anchor="middle">成本</text>
<line x1="642" y1="140" x2="686" y2="140" stroke="var(--grey)" stroke-width="3"/>
<polygon points="684,133 698,140 684,147" fill="var(--grey)"/>
<rect x="700" y="110" width="200" height="60" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="800" y="147" text-anchor="middle">住戶帳單</text>
<text class="b" x="160" y="376" text-anchor="end">0</text>
<rect x="230" y="220" width="100" height="150" fill="var(--accent)"/>
<text class="g" x="280" y="208" text-anchor="middle" style="fill:var(--accent)">賺到</text>
<rect x="490" y="366" width="100" height="8" fill="var(--grey)"/>
<text class="g" x="540" y="346" text-anchor="middle" style="fill:var(--dim)">過手</text>
<text class="b" x="540" y="408" text-anchor="middle">費率受管制</text>
<rect x="750" y="370" width="100" height="110" fill="var(--warn)"/>
<text class="g" x="800" y="510" text-anchor="middle" style="fill:var(--warn)">付帳</text>
<text class="b" x="800" y="536" text-anchor="middle">撞上民意</text>
<line x1="170" y1="370" x2="910" y2="370" stroke="var(--ink)" stroke-width="1.5"/>
<text class="c" x="480" y="585" text-anchor="middle">錢停在能自己開價的那層</text>
</svg>
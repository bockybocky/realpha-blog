<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩次縮表的準備金各從高處往下降，一次停在較低水位、一次停在高一倍的水位，兩次都撞上同一種橫向阻擋線">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">準備金往下縮，兩次都在半路被擋住</text>

  <rect x="60" y="92" width="400" height="368" rx="10" fill="var(--card)"/>
  <rect x="500" y="92" width="400" height="368" rx="10" fill="var(--card)"/>

  <text class="t" x="84" y="128" font-size="20" font-weight="700" fill="var(--dim)">2017–2018</text>
  <text class="t" x="524" y="128" font-size="20" font-weight="700" fill="var(--dim)">這一輪</text>

  <line x1="100" y1="160" x2="100" y2="430" stroke="var(--line)" stroke-width="2"/>
  <line x1="540" y1="160" x2="540" y2="430" stroke="var(--line)" stroke-width="2"/>

  <path d="M140 172 L140 380" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"/>
  <path d="M140 392 l-14 -18 h28 z" fill="var(--accent)"/>
  <path d="M580 172 L580 282" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"/>
  <path d="M580 294 l-14 -18 h28 z" fill="var(--accent)"/>

  <line x1="112" y1="404" x2="432" y2="404" stroke="var(--warn)" stroke-width="7"/>
  <line x1="552" y1="306" x2="872" y2="306" stroke="var(--warn)" stroke-width="7"/>

  <text class="t" x="176" y="200" font-size="16" fill="var(--dim)">縮表</text>
  <text class="t" x="616" y="200" font-size="16" fill="var(--dim)">縮表</text>

  <text class="t" x="176" y="392" font-size="19" font-weight="700" fill="var(--ink)">1.4 兆美元</text>
  <text class="t" x="616" y="294" font-size="19" font-weight="700" fill="var(--ink)">3 兆美元</text>

  <text class="t" x="176" y="432" font-size="16" fill="var(--warn)">利率跳起來</text>
  <text class="t" x="616" y="334" font-size="16" fill="var(--warn)">利率跳起來</text>
  <text class="t" x="616" y="420" font-size="16" fill="var(--grey)">空間看起來還很大</text>

  <text class="t" x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">水位差兩倍，牆照樣出現</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左格圍牆圍住現有工作、新工作長在牆外；右格新方塊全部往下接進同一條底層">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">護城河鎖住的是現在，還是以後</text>

<text class="g" x="90" y="118">鎖住現在這批工作</text>
<rect x="90" y="140" width="250" height="200" rx="10" fill="none" stroke="var(--warn)" stroke-width="5"/>
<rect x="130" y="196" width="170" height="90" rx="6" fill="var(--grey)"/>
<text class="b" x="215" y="248" text-anchor="middle" fill="var(--page)">資料庫主機</text>
<g fill="var(--accent)">
<rect x="372" y="150" width="76" height="52" rx="6"/>
<rect x="372" y="218" width="76" height="52" rx="6"/>
<rect x="372" y="286" width="76" height="52" rx="6"/>
</g>
<text class="b" x="372" y="368">網站、郵件、防火牆</text>
<text class="b" x="372" y="392">長在牆外面</text>

<text class="g" x="540" y="118">鎖住以後的工作</text>
<g fill="var(--accent)">
<rect x="540" y="150" width="90" height="56" rx="6"/>
<rect x="650" y="150" width="90" height="56" rx="6"/>
<rect x="760" y="150" width="90" height="56" rx="6"/>
</g>
<text class="b" x="540" y="140">新員工、新系統、新專案</text>
<g stroke="var(--accent)" stroke-width="4">
<line x1="585" y1="206" x2="585" y2="286"/>
<line x1="695" y1="206" x2="695" y2="286"/>
<line x1="805" y1="206" x2="805" y2="286"/>
</g>
<rect x="520" y="286" width="350" height="70" rx="8" fill="var(--ink)"/>
<text class="n" x="695" y="330" text-anchor="middle" fill="var(--page)">身分這一層</text>
<text class="b" x="540" y="392">每多一個，都要再經過一次</text>

<text class="c" x="60" y="470">一種隨工作搬家失血，一種隨客戶長大變多</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="One starting point splits into an upward path to leverage and a downward path to an amplifier.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">The same tool, two opposite directions</text>

  <rect x="60" y="220" width="200" height="82" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="160" y="268" text-anchor="middle" font-size="20" fill="var(--ink)">The same AI</text>

  <path d="M260 248 C 400 248, 430 166, 578 166" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="576,156 600,166 576,176" fill="var(--accent)"/>
  <text x="420" y="140" text-anchor="middle" font-size="19" fill="var(--accent)">Can tell</text>

  <path d="M260 274 C 400 274, 430 356, 578 356" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="576,346 600,356 576,366" fill="var(--warn)"/>
  <text x="420" y="404" text-anchor="middle" font-size="19" fill="var(--warn)">Cannot tell</text>

  <rect x="600" y="110" width="300" height="112" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <text x="750" y="160" text-anchor="middle" font-size="22" fill="var(--accent)">Leverage</text>
  <text x="750" y="194" text-anchor="middle" font-size="16" fill="var(--dim)">Amplifies your judgment</text>

  <rect x="600" y="300" width="300" height="112" rx="14" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text x="750" y="350" text-anchor="middle" font-size="22" fill="var(--warn)">Amplifier</text>
  <text x="750" y="384" text-anchor="middle" font-size="16" fill="var(--dim)">Amplifies their marketing</text>

  <text x="480" y="480" text-anchor="middle" font-size="22" fill="var(--ink)">The difference is not the tool but who holds it</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="An eight-year gray gap separates making the technology from earning money, and the short survival bar ends before the money arrives." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Right technology, money 8 years late</text>
<text x="440" y="150" font-size="20" fill="var(--dim)" text-anchor="middle">8 years with no buyers</text>
<rect x="120" y="170" width="640" height="26" rx="4" fill="var(--grey)"/>
<rect x="760" y="170" width="120" height="26" rx="4" fill="var(--accent)"/>
<text x="820" y="150" font-size="15" fill="var(--accent)" text-anchor="middle">Start printing money</text>
<line x1="120" y1="212" x2="120" y2="244" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="268" font-size="15" fill="var(--ink)" text-anchor="middle">Built</text>
<line x1="760" y1="160" x2="760" y2="380" stroke="var(--ink)" stroke-width="2" stroke-dasharray="7 7"/>
<text x="760" y="404" font-size="15" fill="var(--ink)" text-anchor="middle">When the money arrives</text>
<text x="120" y="310" font-size="20" fill="var(--warn)">How long I can hold out</text>
<rect x="120" y="326" width="250" height="26" rx="4" fill="var(--warn)"/>
<text x="386" y="346" font-size="15" fill="var(--dim)">I am out by here</text>
<text x="60" y="470" font-size="22" fill="var(--ink)">Being right does not mean you will still be there</text>
</svg>
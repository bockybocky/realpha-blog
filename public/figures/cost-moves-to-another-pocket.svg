<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條向下的線與一條隨時間向上的線交叉，顯示成本被搬到後面與別人身上">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700 }
.g { font-size:20px; fill:var(--ink); font-weight:600 }
.b { font-size:16px; fill:var(--dim) }
.n { font-size:22px; fill:var(--ink); font-weight:700 }
.c { font-size:22px; fill:var(--ink); font-weight:600 }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56">壓下去的，換時間換人付</text>
<line x1="120" y1="460" x2="920" y2="460" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="920" y="486" text-anchor="end">時間 →</text>
<polyline points="150,200 340,350" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="n" x="150" y="182" fill="var(--accent)">6.5</text>
<text class="n" x="352" y="352" fill="var(--accent)">4.5</text>
<text class="g" x="150" y="150" fill="var(--accent)">柴油零售</text>
<polyline points="360,400 560,330 740,250 880,180" fill="none" stroke="var(--warn)" stroke-width="5"/>
<text class="g" x="880" y="158" text-anchor="end" fill="var(--warn)">汽油</text>
<circle cx="440" cy="425" r="7" fill="var(--grey)"/>
<circle cx="600" cy="425" r="7" fill="var(--grey)"/>
<circle cx="760" cy="425" r="7" fill="var(--grey)"/>
<text class="b" x="440" y="412" text-anchor="middle">儲槽滿</text>
<text class="b" x="600" y="412" text-anchor="middle">改產出</text>
<text class="b" x="760" y="412" text-anchor="middle">減產</text>
<text class="g" x="880" y="215" text-anchor="end">另一批選民</text>
<text class="c" x="60" y="512">成本沒消失，只是換了口袋</text>
</svg>
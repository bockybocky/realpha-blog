<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條百分比橫條上下並列，切點都落在七成處：微軟的 AI 收入七成來自 OpenAI 一家，輝達的營收約七成來自五個客戶">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.g { font-size:19px; fill:var(--dim); }
.b { font-size:16px; }
.c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="70" y="62">兩家公司，同一個形狀</text>
<line x1="644" y1="120" x2="644" y2="410" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="644" y="110" text-anchor="middle" fill="var(--dim)">七成</text>
<text class="g" x="140" y="160">微軟　AI 收入</text>
<rect x="140" y="175" width="504" height="66" fill="var(--accent)"/>
<rect x="644" y="175" width="216" height="66" fill="var(--grey)"/>
<text class="b" x="392" y="215" text-anchor="middle" fill="var(--page)">OpenAI 一家</text>
<text class="b" x="752" y="215" text-anchor="middle">其他所有企業</text>
<text class="b" x="140" y="266" fill="var(--dim)">343 億之中，241 億來自一個客戶</text>
<text class="g" x="140" y="330">輝達　營收</text>
<rect x="140" y="345" width="504" height="66" fill="var(--accent)"/>
<rect x="644" y="345" width="216" height="66" fill="var(--grey)"/>
<text class="b" x="392" y="385" text-anchor="middle" fill="var(--page)">五個客戶</text>
<text class="b" x="752" y="385" text-anchor="middle">其他所有客戶</text>
<text class="b" x="140" y="436" fill="var(--dim)">單一客戶 16%，前三大 44%</text>
<text class="c" x="70" y="495">七成的錢，來自一隻手數得完的買家</text>
</svg>
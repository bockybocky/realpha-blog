<circle cx="632" cy="164" r="8" fill="var(--ink)"/>
<circle cx="654" cy="164" r="8" fill="var(--ink)"/>
<line x1="632" y1="176" x2="632" y2="196" stroke="var(--ink)" stroke-width="2"/>
<line x1="632" y1="276" x2="632" y2="370" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="618" y="330" class="d" text-anchor="end">怎麼知道是這節</text>
<rect x="542" y="372" width="180" height="44" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 4"/>
<text x="632" y="400" class="b" text-anchor="middle">貨運公司內部？</text>
<text x="480" y="476" class="c" text-anchor="middle">挑得準 → 懷疑有內應</text>

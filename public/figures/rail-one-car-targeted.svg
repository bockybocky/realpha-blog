<line x1="680" y1="230" x2="690" y2="230" stroke="var(--grey)" stroke-width="3"/>
<line x1="785" y1="230" x2="795" y2="230" stroke="var(--grey)" stroke-width="3"/>
<g fill="var(--grey)">
  <circle cx="82" cy="266" r="7"/><circle cx="133" cy="266" r="7"/>
  <circle cx="187" cy="266" r="7"/><circle cx="238" cy="266" r="7"/>
  <circle cx="292" cy="266" r="7"/><circle cx="343" cy="266" r="7"/>

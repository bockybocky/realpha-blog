<rect x="585" y="200" width="95" height="60" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<rect x="690" y="200" width="95" height="60" rx="6" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>

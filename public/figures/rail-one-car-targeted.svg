<text x="107" y="236" class="d" text-anchor="middle">一般</text>
<text x="212" y="236" class="d" text-anchor="middle">一般</text>
<text x="317" y="236" class="d" text-anchor="middle">一般</text>
<text x="422" y="236" class="d" text-anchor="middle">一般</text>
<text x="527" y="236" class="d" text-anchor="middle">一般</text>
<text x="632" y="226" class="b w" text-anchor="middle">槍枝</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two loops side by side: the left loop passes through a person who is stuck inside it, while the right loop is closed by software and the person stands outside it.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:700}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700;fill:var(--accent)}
.w{fill:var(--page)}.a{fill:var(--accent)}.wa{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="40" y="56" class="t">In the loop, or out</text>
<line x1="480" y1="100" x2="480" y2="500" stroke="var(--line)" stroke-width="2"/>
<text x="250" y="112" text-anchor="middle" class="g wa">Now</text>
<text x="710" y="112" text-anchor="middle" class="g a">Automated</text>
<ellipse cx="250" cy="300" rx="150" ry="120" fill="none" stroke="var(--warn)" stroke-width="4"/>
<polygon points="100,288 91,306 109,306" fill="var(--warn)"/>
<polygon points="400,312 391,294 409,294" fill="var(--warn)"/>
<rect x="190" y="390" width="120" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="250" y="426" text-anchor="middle" class="g">Rig</text>
<circle cx="250" cy="160" r="14" fill="var(--warn)"/>
<path d="M228,204 Q228,178 250,178 Q272,178 272,204 Z" fill="var(--warn)"/>
<text x="84" y="350" text-anchor="end" class="b">Look</text>
<text x="416" y="260" class="b">Tune</text>
<ellipse cx="710" cy="300" rx="150" ry="120" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polygon points="560,288 551,306 569,306" fill="var(--accent)"/>
<polygon points="860,312 851,294 869,294" fill="var(--accent)"/>
<rect x="650" y="390" width="120" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="710" y="426" text-anchor="middle" class="g">Rig</text>
<rect x="660" y="156" width="100" height="48" rx="8" fill="var(--accent)"/>
<text x="710" y="187" text-anchor="middle" class="g w">SW</text>
<text x="544" y="350" text-anchor="end" class="b">See</text>
<text x="876" y="260" class="b">Fix</text>
<circle cx="900" cy="398" r="14" fill="var(--dim)"/>
<path d="M878,442 Q878,416 900,416 Q922,416 922,442 Z" fill="var(--dim)"/>
<text x="900" y="470" text-anchor="middle" class="d">Oversee</text>
<text x="480" y="545" text-anchor="middle" class="c">Human exits</text>
</svg>
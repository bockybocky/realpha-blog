<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="零軸上方一根上漲柱、下方一根下跌柱，中間箭頭連結">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">同一批記憶體，兩種處境</text>
<line x1="60" y1="290" x2="900" y2="290" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="282" font-size="16" fill="var(--dim)">今年持平</text>
<rect x="230" y="140" width="130" height="150" fill="var(--accent)"/>
<text x="230" y="124" font-size="20" fill="var(--ink)">Apple +30%</text>
<text x="230" y="330" font-size="16" fill="var(--dim)">成本轉進售價</text>
<text x="230" y="354" font-size="16" fill="var(--dim)">兩款手機各漲 100 美元</text>
<rect x="640" y="290" width="130" height="80" fill="var(--warn)"/>
<text x="640" y="398" font-size="20" fill="var(--ink)">NVIDIA -16%</text>
<text x="640" y="424" font-size="16" fill="var(--dim)">搶記憶體維持獨家</text>
<text x="640" y="448" font-size="16" fill="var(--dim)">支出可能收斂</text>
<line x1="630" y1="230" x2="400" y2="230" stroke="var(--dim)" stroke-width="2"/>
<polygon points="400,230 424,218 424,242" fill="var(--dim)"/>
<text x="436" y="214" font-size="19" fill="var(--dim)">囤貨鬆開，貨流向誰</text>
</svg>
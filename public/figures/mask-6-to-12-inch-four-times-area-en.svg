<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A small square sits beside a large square with twice the side length, and dashed lines split the large square into four cells that each equal one small square.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="480" y="60" text-anchor="middle">2× side, 4× area</text>
<rect x="170" y="310" width="150" height="150" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<text class="g" x="245" y="496" text-anchor="middle">6-inch</text>
<rect x="500" y="160" width="300" height="300" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="3"/>
<line x1="650" y1="160" x2="650" y2="460" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="500" y1="310" x2="800" y2="310" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="500" y="310" width="150" height="150" fill="var(--card)" fill-opacity="0.6"/>
<text class="c" x="650" y="318" text-anchor="middle" style="fill:var(--accent)">Area ×4</text>
<line x1="500" y1="135" x2="800" y2="135" stroke="var(--dim)" stroke-width="2"/>
<line x1="500" y1="127" x2="500" y2="143" stroke="var(--dim)" stroke-width="2"/>
<line x1="800" y1="127" x2="800" y2="143" stroke="var(--dim)" stroke-width="2"/>
<text class="b" x="650" y="122" text-anchor="middle">Side ×2</text>
<text class="g" x="650" y="496" text-anchor="middle" style="fill:var(--accent)">12-inch</text>
<text class="b" x="865" y="316">0 defects</text>
</svg>
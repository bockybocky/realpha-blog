<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上排兩個圓緊靠在一起，下排同樣兩個天體之間隔著整個畫面寬度的空白">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="64" font-size="27" fill="var(--ink)">看起來很近，實際上互不影響</text>

  <text x="60" y="150" font-size="19" fill="var(--dim)">課本圖</text>
  <circle cx="200" cy="220" r="48" fill="var(--warn)"/>
  <circle cx="296" cy="220" r="13" fill="var(--accent)"/>
  <text x="200" y="296" font-size="15" fill="var(--dim)" text-anchor="middle">太陽</text>
  <text x="296" y="188" font-size="15" fill="var(--dim)" text-anchor="middle">地球</text>

  <line x1="60" y1="335" x2="900" y2="335" stroke="var(--line)" stroke-width="1"/>

  <text x="60" y="390" font-size="19" fill="var(--dim)">按比例</text>
  <circle cx="200" cy="440" r="48" fill="var(--warn)"/>
  <line x1="256" y1="440" x2="866" y2="440" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="560" y="422" font-size="16" fill="var(--dim)" text-anchor="middle">中間全是空的</text>
  <circle cx="880" cy="440" r="3" fill="var(--accent)"/>
  <text x="880" y="410" font-size="15" fill="var(--dim)" text-anchor="middle">地球</text>

  <text x="480" y="524" font-size="22" fill="var(--ink)" text-anchor="middle">市場大到彼此的重力構不著對方。</text>
</svg>
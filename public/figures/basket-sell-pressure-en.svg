<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Six blocks inside a basket frame, two of them marked, with a thick downward arrow below the basket.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="80" y="56" font-size="27" font-weight="700" fill="var(--ink)">One theme sells the whole basket</text>

  <rect x="90" y="96" width="780" height="258" rx="18" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="114" y="134" font-size="19" fill="var(--dim)">Consumer inertia basket</text>

  <rect x="120" y="156" width="104" height="104" rx="10" fill="var(--grey)"/>
  <rect x="244" y="156" width="104" height="104" rx="10" fill="var(--grey)"/>
  <rect x="368" y="156" width="104" height="104" rx="10" fill="var(--grey)"/>
  <text x="368" y="292" font-size="16" fill="var(--dim)">Planet Fitness</text>

  <rect x="492" y="156" width="104" height="104" rx="10" fill="var(--warn)" fill-opacity="0.22" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="596" cy="156" r="9" fill="var(--warn)"/>
  <text x="492" y="292" font-size="16" font-weight="700" fill="var(--ink)">New York Times</text>

  <rect x="616" y="156" width="104" height="104" rx="10" fill="var(--warn)" fill-opacity="0.22" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="720" cy="156" r="9" fill="var(--warn)"/>
  <text x="640" y="292" font-size="16" font-weight="700" fill="var(--ink)">Schwab</text>

  <rect x="740" y="156" width="104" height="104" rx="10" fill="var(--grey)"/>
  <text x="114" y="330" font-size="16" fill="var(--dim)">Healthy businesses sold too</text>

  <rect x="440" y="378" width="80" height="62" fill="var(--accent)"/>
  <path d="M 404 440 L 556 440 L 480 500 Z" fill="var(--accent)"/>
  <text x="580" y="440" font-size="19" fill="var(--ink)">Basket sold</text>

  <text x="80" y="548" font-size="22" font-weight="700" fill="var(--ink)">Code presses sell, not judgment</text>
</svg>
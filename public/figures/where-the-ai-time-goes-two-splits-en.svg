<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two horizontal time bars show the model segment occupying less than three-tenths of the left end.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--ink); }
    .p { font-size:16px; fill:var(--page); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="48" y="54">Where the time goes</text>
<text class="g" x="48" y="178">Xiaotian</text>
<text class="b" x="48" y="204" fill="var(--dim)">One project</text>
<rect x="200" y="150" width="158" height="68" fill="var(--accent)"/>
<rect x="358" y="150" width="50" height="68" fill="var(--accent)" opacity="0.5"/>
<rect x="408" y="150" width="512" height="68" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="p" x="279" y="192" text-anchor="middle">Model 22%</text>
<text class="b" x="664" y="192" text-anchor="middle">Tools and rendering 71%</text>
<text class="b" x="383" y="136" text-anchor="middle" fill="var(--dim)">Context 7%</text>
<text class="g" x="48" y="328">Me</text>
<text class="b" x="48" y="354" fill="var(--dim)">Seven days</text>
<rect x="200" y="300" width="209" height="68" fill="var(--accent)"/>
<rect x="409" y="300" width="511" height="68" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="p" x="304" y="342" text-anchor="middle">Model 29%</text>
<text class="b" x="664" y="342" text-anchor="middle">Waiting on tools 71%</text>
<text class="c" x="480" y="450" text-anchor="middle">Two measures, same direction</text>
<text class="b" x="480" y="486" text-anchor="middle" fill="var(--dim)">The model is not the bottleneck</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊一個入口分岔成上下兩條路徑，上路短而平直，下路繞一大圈往下再拉回，兩條最後匯到右邊同一個終點。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="54" font-size="27" fill="var(--ink)">兩條路，同一個終點</text>

  <path d="M 250 260 C 330 260 330 160 410 160 L 520 160 C 610 160 620 260 730 260" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 250 260 C 330 260 330 420 430 420 L 560 420 C 665 420 650 285 730 260" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>

  <rect x="70" y="220" width="180" height="80" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="160" y="268" font-size="20" fill="var(--ink)" text-anchor="middle">通膨</text>

  <rect x="730" y="220" width="180" height="80" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="820" y="260" font-size="19" fill="var(--ink)" text-anchor="middle">預期</text>
  <text x="820" y="284" font-size="19" fill="var(--ink)" text-anchor="middle">被壓下</text>

  <text x="465" y="142" font-size="20" fill="var(--accent)" text-anchor="middle">Fed 升息</text>
  <text x="495" y="452" font-size="20" fill="var(--warn)" text-anchor="middle">市場拉高長端</text>
  <text x="495" y="476" font-size="15" fill="var(--dim)" text-anchor="middle">繞遠路，代價更大</text>

  <text x="480" y="510" font-size="22" fill="var(--ink)" text-anchor="middle">總要有人做，差別只在誰來做</text>
</svg>
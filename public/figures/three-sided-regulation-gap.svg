<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三根高度不同的柱子，供給側最高、市場側中等、需求側最矮">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t h" x="60" y="70">三邊到位程度</text>

  <line x1="90" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="3"/>

  <rect x="150" y="150" width="160" height="290" rx="8" fill="var(--accent)" opacity="0.85"/>
  <text class="t g" x="230" y="480" text-anchor="middle">供給側</text>
  <text class="t b" x="230" y="508" text-anchor="middle">品質門檻與查驗</text>

  <rect x="400" y="300" width="160" height="140" rx="8" fill="var(--grey)"/>
  <text class="t g" x="480" y="480" text-anchor="middle">市場側</text>
  <text class="t b" x="480" y="508" text-anchor="middle">交易所與資料格式</text>

  <rect x="650" y="390" width="160" height="50" rx="8" fill="var(--warn)" opacity="0.85"/>
  <text class="t g" x="730" y="480" text-anchor="middle">需求側</text>
  <text class="t b" x="730" y="508" text-anchor="middle">怎麼用、怎麼揭露</text>

  <text class="t b" x="100" y="140">到位</text>
  <text class="t b" x="100" y="430">空白</text>
  <line x1="650" y1="150" x2="810" y2="150" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="t b" x="730" y="135" text-anchor="middle">缺口最大的一邊</text>
</svg>
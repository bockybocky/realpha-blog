<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩條水平刻度尺上下並排，上面那條的出場區只佔最右邊一小段，下面那條的出場區往左擴張，吃掉了一點六倍的位置"><rect x="0" y="0" width="960" height="540" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style><g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'><text x="60" y="58" font-size="27px" fill="var(--ink)" text-anchor="start" font-weight="600">出場門檻比你以為的低</text><text x="100" y="212" font-size="19px" fill="var(--dim)" text-anchor="end" font-weight="normal">以前</text><rect x="120" y="186" width="660" height="44" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/><rect x="780" y="186" width="80" height="44" fill="var(--warn)"/><text x="450" y="214" font-size="19px" fill="var(--dim)" text-anchor="middle" font-weight="normal">安全區</text><text x="100" y="356" font-size="19px" fill="var(--dim)" text-anchor="end" font-weight="normal">這一波</text><rect x="120" y="330" width="380" height="44" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/><rect x="500" y="330" width="360" height="44" fill="var(--warn)"/><text x="310" y="358" font-size="19px" fill="var(--dim)" text-anchor="middle" font-weight="normal">安全區</text><text x="680" y="358" font-size="19px" fill="var(--page)" text-anchor="middle" font-weight="600">出場區</text><line x1="712" y1="150" x2="712" y2="400" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5"/><text x="712.0" y="140" font-size="20px" fill="var(--ink)" text-anchor="middle" font-weight="600">一點六倍</text><line x1="546" y1="330" x2="546" y2="420" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 4"/><text x="545.5" y="444" font-size="16px" fill="var(--warn)" text-anchor="middle" font-weight="normal">一點多倍</text><line x1="120" y1="276" x2="860" y2="276" stroke="var(--line)" stroke-width="1"/><text x="120" y="300" font-size="16px" fill="var(--dim)" text-anchor="start" font-weight="normal">槓桿越低</text><text x="860" y="300" font-size="16px" fill="var(--dim)" text-anchor="end" font-weight="normal">槓桿越高</text><text x="60" y="500" font-size="22px" fill="var(--ink)" text-anchor="start" font-weight="600">同一個一點六倍，從安全區落進出場區</text></g></svg>
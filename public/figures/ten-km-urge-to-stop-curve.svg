<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="想停下來的念頭隨距離變化的曲線，在五到七公里之間達到最高峰，八公里之後大幅下降">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:20px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">跑十公里，最想停下來的那一段</text>
<rect x="490" y="110" width="148" height="320" fill="var(--card)"/>
<line x1="120" y1="430" x2="890" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="110" x2="120" y2="430" stroke="var(--line)" stroke-width="2"/>
<polyline points="120,400 194,372 268,302 342,232 416,186 490,170 564,192 638,300 712,336 786,346 860,342" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="527" cy="176" r="7" fill="var(--accent)"/>
<circle cx="638" cy="300" r="7" fill="var(--accent)"/>
<text class="g" x="564" y="140" text-anchor="middle">最想停的地方</text>
<text class="b" x="564" y="452" text-anchor="middle">五到七公里</text>
<text class="g" x="756" y="262" text-anchor="middle">反而輕鬆</text>
<text class="b" x="756" y="286" text-anchor="middle">八公里之後</text>
<text class="b" x="120" y="452" text-anchor="middle">0</text>
<text class="b" x="268" y="452" text-anchor="middle">2</text>
<text class="b" x="416" y="452" text-anchor="middle">4</text>
<text class="b" x="712" y="452" text-anchor="middle">8</text>
<text class="b" x="860" y="452" text-anchor="middle">10</text>
<text class="b" x="890" y="480" text-anchor="end">公里</text>
<text class="b" x="106" y="270" text-anchor="middle" transform="rotate(-90 106 270)">想停下來的念頭</text>
<text class="c" x="60" y="510">訊號變強，不等於已經到極限</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Of the four kill-condition lights, only the price one is actually wired to a daily check; the other three wires are cut.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">My panel: 1 of 4 lights wired</text>
  <text class="t" x="60" y="86" font-size="16" fill="var(--dim)">14 holdings, 89 conditions</text>

  <rect x="70" y="130" width="180" height="110" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="160" cy="175" r="22" fill="var(--accent)"/>
  <text class="t" x="160" y="222" font-size="20" text-anchor="middle" fill="var(--ink)">Price</text>

  <rect x="290" y="130" width="180" height="110" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="380" cy="175" r="22" fill="var(--grey)"/>
  <text class="t" x="380" y="222" font-size="20" text-anchor="middle" fill="var(--ink)">Ops</text>

  <rect x="510" y="130" width="180" height="110" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="600" cy="175" r="22" fill="var(--grey)"/>
  <text class="t" x="600" y="222" font-size="20" text-anchor="middle" fill="var(--ink)">Demand</text>

  <rect x="730" y="130" width="180" height="110" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="820" cy="175" r="22" fill="var(--grey)"/>
  <text class="t" x="820" y="222" font-size="20" text-anchor="middle" fill="var(--ink)">Rivals</text>

  <line x1="160" y1="240" x2="160" y2="380" stroke="var(--accent)" stroke-width="4"/>
  <line x1="380" y1="240" x2="380" y2="300" stroke="var(--grey)" stroke-width="4" stroke-dasharray="8 8"/>
  <line x1="600" y1="240" x2="600" y2="300" stroke="var(--grey)" stroke-width="4" stroke-dasharray="8 8"/>
  <line x1="820" y1="240" x2="820" y2="300" stroke="var(--grey)" stroke-width="4" stroke-dasharray="8 8"/>
  <text class="t" x="380" y="332" font-size="17" text-anchor="middle" fill="var(--dim)">Unwired</text>
  <text class="t" x="600" y="332" font-size="17" text-anchor="middle" fill="var(--dim)">Unwired</text>
  <text class="t" x="820" y="332" font-size="17" text-anchor="middle" fill="var(--dim)">Unwired</text>

  <rect x="70" y="380" width="360" height="70" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="250" y="424" font-size="20" text-anchor="middle" fill="var(--ink)">Daily check</text>

  <text class="t" x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">Day 1 wired: 11 flipped to near</text>
</svg>
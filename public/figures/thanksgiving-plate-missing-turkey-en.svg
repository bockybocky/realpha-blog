<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The plate holds a full set of side dishes, and the turkey's place in the middle is left empty and drawn as a dashed circle.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .d { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700">Sides, no turkey</text>
<text class="d" x="60" y="94" font-size="16">Plate = policy mix</text>

<circle cx="400" cy="320" r="190" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<circle cx="400" cy="226" r="62" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 9"/>
<text class="t" x="400" y="234" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">Gap</text>

<circle cx="300" cy="400" r="58" fill="var(--accent)"/>
<circle cx="430" cy="424" r="48" fill="var(--accent)"/>
<circle cx="520" cy="340" r="52" fill="var(--accent)"/>
<text class="t" x="300" y="408" font-size="16" fill="var(--page)" text-anchor="middle">T&amp;D</text>
<text class="t" x="430" y="430" font-size="16" fill="var(--page)" text-anchor="middle">Geo</text>
<text class="t" x="520" y="346" font-size="16" fill="var(--page)" text-anchor="middle">Nuke</text>

<text class="t" x="650" y="212" font-size="19" font-weight="700" fill="var(--warn)">Bird</text>
<text class="d" x="650" y="242" font-size="16">Carbon rule</text>
<text class="d" x="650" y="268" font-size="16">No US rule</text>
<text class="t" x="650" y="352" font-size="19" font-weight="700">Side</text>
<text class="d" x="650" y="382" font-size="16">Build gates</text>
<text class="d" x="650" y="408" font-size="16">Bill's scope</text>

<text class="t" x="60" y="534" font-size="22" font-weight="700">Potatoes or nothing</text>
</svg>
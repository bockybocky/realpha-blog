<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two containers of the same size, one holding its contents and one overflowing, differing only in how much was poured in.">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型 */
</style></defs>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)" font-weight="700">One container, two outcomes</text>
<text x="60" y="90" font-size="16" fill="var(--dim)">The market's capacity to absorb is fixed</text>
<rect x="70" y="116" width="380" height="330" fill="var(--card)" rx="10"/>
<rect x="160" y="300" width="200" height="110" fill="var(--accent)" rx="3"/>
<path d="M150 190 L150 420 L370 420 L370 190" fill="none" stroke="var(--ink)" stroke-width="4"/>
<text x="260" y="272" font-size="20" fill="var(--ink)" text-anchor="middle" font-weight="700">900M shares</text>
<text x="260" y="164" font-size="19" fill="var(--dim)" text-anchor="middle">Fits</text>
<rect x="510" y="116" width="380" height="330" fill="var(--card)" rx="10"/>
<rect x="600" y="196" width="200" height="214" fill="var(--warn)" rx="3"/>
<path d="M560 250 L560 176 L600 176 L600 196" fill="none" stroke="var(--warn)" stroke-width="4" opacity="0.55"/>
<path d="M800 196 L800 176 L840 176 L840 250" fill="none" stroke="var(--warn)" stroke-width="4" opacity="0.55"/>
<path d="M590 190 L590 420 L810 420 L810 190" fill="none" stroke="var(--ink)" stroke-width="4"/>
<text x="700" y="316" font-size="20" fill="var(--page)" text-anchor="middle" font-weight="700">5B shares</text>
<text x="700" y="164" font-size="19" fill="var(--warn)" text-anchor="middle" font-weight="700">Overflows</text>
<text x="60" y="500" font-size="22" fill="var(--ink)">The same logic stops holding past a certain size</text>
</svg>
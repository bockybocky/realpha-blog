<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two percentage bars stacked, both split at seventy percent: seventy percent of Microsoft's AI revenue comes from OpenAI alone, and about seventy percent of Nvidia's revenue from five customers">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.t { font-size:27px; font-weight:700; }
.g { font-size:19px; fill:var(--dim); }
.b { font-size:16px; }
.c { font-size:22px; font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="70" y="62">Two firms, same shape</text>
<line x1="644" y1="120" x2="644" y2="410" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="644" y="110" text-anchor="middle" fill="var(--dim)">70%</text>
<text class="g" x="140" y="160">Microsoft AI revenue</text>
<rect x="140" y="175" width="504" height="66" fill="var(--accent)"/>
<rect x="644" y="175" width="216" height="66" fill="var(--grey)"/>
<text class="b" x="392" y="215" text-anchor="middle" fill="var(--page)">OpenAI alone</text>
<text class="b" x="752" y="215" text-anchor="middle">All others</text>
<text class="b" x="140" y="266" fill="var(--dim)">$24.1B of $34.3B from one customer</text>
<text class="g" x="140" y="330">Nvidia revenue</text>
<rect x="140" y="345" width="504" height="66" fill="var(--accent)"/>
<rect x="644" y="345" width="216" height="66" fill="var(--grey)"/>
<text class="b" x="392" y="385" text-anchor="middle" fill="var(--page)">Five customers</text>
<text class="b" x="752" y="385" text-anchor="middle">All others</text>
<text class="b" x="140" y="436" fill="var(--dim)">One customer 16%, top three 44%</text>
<text class="c" x="70" y="495">70% from a handful of buyers</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一塊錢分成十格，左側三到五格為聯邦承擔，右側為專案自負">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<g font-family='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif'>
<text x="48" y="66" font-size="27" fill="var(--ink)">每超支一塊錢，誰付</text>
<text x="140" y="146" font-size="19" fill="var(--dim)">超支一塊</text>
<rect x="140" y="170" width="720" height="90" fill="var(--card)" stroke="var(--line)"/>
<rect x="140" y="170" width="216" height="90" fill="var(--accent)"/>
<rect x="356" y="170" width="144" height="90" fill="var(--accent)" opacity="0.45"/>
<g stroke="var(--page)">
<line x1="212" y1="170" x2="212" y2="260"/><line x1="284" y1="170" x2="284" y2="260"/><line x1="356" y1="170" x2="356" y2="260"/><line x1="428" y1="170" x2="428" y2="260"/>
</g>
<g stroke="var(--line)">
<line x1="500" y1="170" x2="500" y2="260"/><line x1="572" y1="170" x2="572" y2="260"/><line x1="644" y1="170" x2="644" y2="260"/><line x1="716" y1="170" x2="716" y2="260"/><line x1="788" y1="170" x2="788" y2="260"/>
</g>
<line x1="356" y1="280" x2="356" y2="320" stroke="var(--line)" stroke-dasharray="6 6"/>
<line x1="500" y1="280" x2="500" y2="320" stroke="var(--line)" stroke-dasharray="6 6"/>
<text x="140" y="348" font-size="19" fill="var(--accent)">聯邦接走三到五毛</text>
<text x="620" y="348" font-size="19" fill="var(--dim)">專案自負</text>
<line x1="520" y1="380" x2="860" y2="380" stroke="var(--line)"/>
<text x="520" y="412" font-size="16" fill="var(--dim)">而且三十年後才還</text>
<text x="48" y="474" font-size="22" fill="var(--ink)">風險有了上限，才敢算</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The incidents split into three stacked segments, where the first two are my own code and scheduling errors that burn money, and the third is platform problems at about one third with no actual loss.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .w { font-size:19px; fill:var(--page); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">Switch platforms, shed only a third</text>

<rect x="60" y="160" width="280" height="80" fill="var(--warn)"/>
<rect x="340" y="160" width="280" height="80" fill="var(--warn)" opacity="0.6"/>
<rect x="620" y="160" width="280" height="80" fill="var(--grey)"/>
<text class="w" x="84" y="208">My own code bugs</text>
<text class="w" x="364" y="208">Scheduling and judgment</text>
<text class="g" x="644" y="208">The platform</text>

<rect x="56" y="146" width="568" height="108" rx="8" fill="none" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="60" y="300" fill="var(--warn)">Money and time burn here</text>
<text class="n" x="60" y="330">These follow you to any platform</text>

<text class="g" x="644" y="300">About one third</text>
<text class="n" x="644" y="330">No actual loss</text>

<rect x="60" y="390" width="840" height="76" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="n" x="84" y="422">This ratio counts one day of logs, a small sample</text>
<text class="c" x="84" y="452">Log each rental's failure cause, compare after ten</text>
</svg>
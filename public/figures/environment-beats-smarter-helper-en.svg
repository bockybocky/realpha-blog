<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="In this four-quadrant chart, both right-hand quadrants allow autonomy and differ only in speed, while assistants on the left must be watched regardless of intelligence.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" fill="var(--ink)">Autonomy depends on the right half</text>
<rect x="240" y="100" width="300" height="180" fill="var(--card)"/>
<rect x="540" y="100" width="300" height="180" fill="var(--accent)"/>
<rect x="240" y="280" width="300" height="180" fill="var(--card)"/>
<rect x="540" y="280" width="300" height="180" fill="var(--accent)" opacity="0.55"/>
<line x1="240" y1="100" x2="240" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="240" y1="460" x2="840" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="540" y1="100" x2="540" y2="460" stroke="var(--page)" stroke-width="3"/>
<line x1="240" y1="280" x2="840" y2="280" stroke="var(--page)" stroke-width="3"/>
<text x="272" y="200" font-size="20" fill="var(--ink)">Watch every step</text>
<text x="572" y="200" font-size="20" fill="var(--page)">Finish end to end</text>
<text x="272" y="380" font-size="20" fill="var(--ink)">Do it yourself</text>
<text x="572" y="380" font-size="20" fill="var(--ink)">Slower, but finishes</text>
<text x="60" y="170" font-size="19" fill="var(--dim)">Smart assistant</text>
<text x="60" y="390" font-size="19" fill="var(--dim)">Average assistant</text>
<text x="272" y="500" font-size="19" fill="var(--dim)">Messy environment</text>
<text x="700" y="500" font-size="19" fill="var(--dim)">Clean environment</text>
<text x="60" y="542" font-size="22" fill="var(--ink)">Fix the environment before replacing the assistant</text>
</svg>
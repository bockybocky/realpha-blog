<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A positive nominal return bar pulled down by a longer inflation bar leaves the real return below the zero line">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="72">"Loss of confidence" is arithmetic</text>

<line x1="120" y1="340" x2="880" y2="340" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="100" y="346" text-anchor="end">0</text>

<rect x="200" y="268" width="130" height="72" rx="5" fill="var(--accent)" opacity="0.7"/>
<text class="g" x="265" y="252" text-anchor="middle">Nominal</text>

<line x1="330" y1="268" x2="430" y2="268" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>

<rect x="430" y="268" width="130" height="144" rx="5" fill="var(--grey)"/>
<text class="g" x="495" y="252" text-anchor="middle">Inflation</text>

<line x1="560" y1="412" x2="660" y2="412" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>

<rect x="660" y="340" width="130" height="72" rx="5" fill="var(--warn)"/>
<text class="g" x="725" y="452" text-anchor="middle">Real</text>

<text class="c" x="60" y="516">Long-term holders actually lose, and that is where confidence leaves</text>
</svg>
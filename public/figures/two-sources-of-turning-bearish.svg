<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條線匯成一點，再從一道關卡分成兩個出口">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<defs>
<marker id="arw5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="var(--dim)"/>
</marker>
</defs>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" class="t">同一句「該空了」，兩個出處</text>

<rect x="50" y="130" width="250" height="110" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="74" y="176" class="g">盤面給的</text>
<text x="74" y="210" class="b">破底・一批股同步轉弱</text>

<rect x="50" y="330" width="250" height="110" rx="14" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="74" y="376" class="g">帳戶給的</text>
<text x="74" y="410" class="b">連續被修理・想摸個頭</text>

<path d="M300 185 L350 255" fill="none" stroke="var(--dim)" stroke-width="3" marker-end="url(#arw5)"/>
<path d="M300 385 L350 315" fill="none" stroke="var(--dim)" stroke-width="3" marker-end="url(#arw5)"/>

<rect x="360" y="230" width="190" height="110" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="384" y="276" class="g">「該空了」</text>
<text x="384" y="310" class="b">長得一模一樣</text>

<path d="M550 285 L600 285" stroke="var(--dim)" stroke-width="3" marker-end="url(#arw5)"/>

<rect x="608" y="235" width="150" height="100" rx="14" fill="var(--page)" stroke="var(--ink)" stroke-width="2"/>
<text x="628" y="278" class="g">要出現什麼</text>
<text x="628" y="308" class="b">寫得出畫面嗎</text>

<path d="M760 265 L800 200" fill="none" stroke="var(--dim)" stroke-width="3" marker-end="url(#arw5)"/>
<path d="M760 305 L800 370" fill="none" stroke="var(--dim)" stroke-width="3" marker-end="url(#arw5)"/>

<rect x="800" y="140" width="130" height="80" rx="12" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="2"/>
<text x="824" y="188" class="g">判斷</text>
<rect x="800" y="360" width="130" height="80" rx="12" fill="var(--warn)" fill-opacity="0.2" stroke="var(--warn)" stroke-width="2"/>
<text x="824" y="408" class="g">情緒</text>

<text x="60" y="510" class="c">寫不出畫面的那一句，是帳戶在說話</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="十八個方塊中只有三個被塗深，代表買下的基板遠多於自家模組需要的量">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="56" y="66">買來的片數，比自己用得到的多</text>
<text class="b" x="56" y="100">一格＝一萬片，五年合約共十八萬片</text>
<rect x="56" y="124" width="640" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="92" y="164" width="88" height="88" fill="var(--accent)"/>
<rect x="196" y="164" width="88" height="88" fill="var(--accent)"/>
<rect x="300" y="164" width="88" height="88" fill="var(--accent)"/>
<rect x="404" y="164" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="508" y="164" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="92" y="268" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="196" y="268" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="300" y="268" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="404" y="268" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<rect x="508" y="268" width="88" height="88" fill="none" stroke="var(--grey)" stroke-width="3"/>
<text class="g" x="92" y="148" fill="var(--accent)">自家模組（示意）</text>
<text class="g" x="404" y="148" fill="var(--grey)">其餘</text>
<text class="g" x="724" y="214">它的雷射產能</text>
<text class="g" x="724" y="248">比揭露的大</text>
<text class="b" x="724" y="292">推論，不是揭露</text>
<text class="c" x="56" y="490">採購量先說話，口徑後說話</text>
</svg>
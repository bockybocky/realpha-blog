<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A downward cost arrow and an upward demand arrow push against each other, with the shortage-driven price squeezed in the middle.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Two forces pushing against each other</text>
<rect x="330" y="210" width="300" height="100" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="400" y="252" font-size="20" fill="var(--ink)">Today's token price</text>
<text x="400" y="282" font-size="16" fill="var(--dim)">Held up by a generational shortage</text>
<path d="M300 260 L 120 260" stroke="var(--accent)" stroke-width="6" fill="none"/>
<path d="M120 260 L 146 246 L 146 274 Z" fill="var(--accent)"/>
<text x="60" y="200" font-size="20" fill="var(--accent)">Pushing down</text>
<text x="60" y="320" font-size="16" fill="var(--dim)">More capex</text>
<text x="60" y="344" font-size="16" fill="var(--dim)">Better model efficiency</text>
<text x="60" y="368" font-size="16" fill="var(--dim)">More chips</text>
<text x="60" y="400" font-size="19" fill="var(--ink)">An order of magnitude a year</text>
<path d="M660 260 L 860 260" stroke="var(--warn)" stroke-width="6" fill="none"/>
<path d="M860 260 L 834 246 L 834 274 Z" fill="var(--warn)"/>
<text x="700" y="200" font-size="20" fill="var(--warn)">Pulling up</text>
<text x="700" y="320" font-size="16" fill="var(--dim)">Agent mode</text>
<text x="700" y="344" font-size="16" fill="var(--dim)">More tokens per query</text>
<text x="700" y="400" font-size="19" fill="var(--ink)">Up 1–2 orders of magnitude</text>
<text x="60" y="470" font-size="22" fill="var(--ink)">The answer is "nobody knows," not bearish</text>
</svg>
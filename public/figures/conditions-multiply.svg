<svg xmlns="http://www.w3.org/2000/svg" id="fig-conditions" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上方的帶子經過三道閘門後急速收窄，下方的帶子則越走越寬，兩者方向相反">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
#fig-conditions text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
#fig-conditions .h { font-size:27px; fill:var(--ink); font-weight:700; }
#fig-conditions .g { font-size:19px; fill:var(--ink); font-weight:600; }
#fig-conditions .b { font-size:16px; fill:var(--dim); }
#fig-conditions .s { font-size:15px; fill:var(--dim); }
#fig-conditions .c { font-size:22px; fill:var(--ink); font-weight:600; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="h" x="60" y="54">三個條件是相乘，不是相加</text>
<text class="g" x="60" y="112">實際發生的機率</text>
<path d="M 200 130 L 840 216 L 840 244 L 200 330 Z" fill="var(--accent)"/>
<line x1="380" y1="118" x2="380" y2="342" stroke="var(--page)" stroke-width="4"/>
<line x1="560" y1="132" x2="560" y2="328" stroke="var(--page)" stroke-width="4"/>
<line x1="720" y1="152" x2="720" y2="308" stroke="var(--page)" stroke-width="4"/>
<text class="s" x="380" y="360" text-anchor="middle">地緣緩解</text>
<text class="s" x="560" y="360" text-anchor="middle">油價回落</text>
<text class="s" x="720" y="360" text-anchor="middle">資本支出見效</text>
<text class="b" x="856" y="236">剩這麼細</text>
<text class="g" x="60" y="430" fill="var(--warn)">感覺上的把握</text>
<path d="M 200 452 L 840 436 L 840 484 L 200 468 Z" fill="var(--warn)"/>
<text class="s" x="856" y="470" fill="var(--warn)">越講越有信心</text>
<text class="c" x="60" y="536">「我有三個看多理由」，方向其實是反的</text>
</svg>
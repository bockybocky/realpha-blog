<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A jagged jumping line beside a smooth rising curve." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="48" y="56" font-size="27" fill="var(--ink)">Two different time frames</text>
  <text x="48" y="88" font-size="16" fill="var(--dim)">The same period through two lenses</text>

  <rect x="60" y="130" width="400" height="290" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="260" y="172" font-size="19" fill="var(--dim)" text-anchor="middle">Daily</text>
  <path d="M92 320 L124 268 L156 340 L188 258 L220 348 L252 276 L284 336 L316 250 L348 330 L380 262 L412 314 L436 272" fill="none" stroke="var(--grey)" stroke-width="3"/>

  <rect x="500" y="130" width="400" height="290" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="700" y="172" font-size="19" fill="var(--accent)" text-anchor="middle">Zoomed out</text>
  <path d="M532 372 C 664 366, 762 322, 868 208" fill="none" stroke="var(--accent)" stroke-width="3"/>

  <text x="480" y="452" font-size="16" fill="var(--dim)" text-anchor="middle">The same period</text>
  <text x="480" y="504" font-size="22" fill="var(--accent)" text-anchor="middle">Did the structure change, or just the temperature</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="預算對銷量的散佈圖，小預算的點在高處、大預算的點在低處，排不成一條線">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="60" font-size="27" fill="var(--ink)">預算與銷量的站位</text>
<rect x="48" y="90" width="864" height="372" rx="14" fill="var(--card)"/>
<line x1="150" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="120" x2="150" y2="430" stroke="var(--line)" stroke-width="2"/>
<text x="880" y="456" font-size="19" fill="var(--dim)" text-anchor="end">預算　低到高</text>
<text x="140" y="130" font-size="19" fill="var(--dim)" text-anchor="end">銷量</text>
<circle cx="236" cy="300" r="11" fill="var(--accent)"/>
<text x="256" y="292" font-size="16" fill="var(--ink)">約 30 人團隊・近 1,000 萬套</text>
<circle cx="356" cy="196" r="11" fill="var(--accent)"/>
<text x="376" y="190" font-size="16" fill="var(--ink)">全新作・約 3,000 萬套</text>
<circle cx="648" cy="372" r="11" fill="var(--warn)"/>
<text x="668" y="378" font-size="16" fill="var(--warn)">5–6 億美元・撐不住的位置</text>
<circle cx="846" cy="148" r="13" fill="var(--accent)"/>
<text x="826" y="140" font-size="16" fill="var(--ink)" text-anchor="end">10–15 億美元</text>
<text x="48" y="520" font-size="22" fill="var(--ink)">花得多不等於賣得多</text>
</svg>
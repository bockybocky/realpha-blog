<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Long waves bend over the wall and get indoors, while short waves are blocked outside by the wall.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .g { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="62" font-size="27" font-weight="700">Long waves bend indoors</text>

  <rect x="48" y="100" width="420" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="76" y="140" font-size="20" font-weight="700" fill="var(--accent)">800 MHz</text>
  <text class="g" x="76" y="168" font-size="16">Long wavelength</text>
  <rect x="300" y="200" width="16" height="190" fill="var(--grey)"/>
  <text class="g" x="286" y="412" font-size="15">Wall</text>
  <path d="M76 300 Q118 232 160 300 T244 300 Q272 300 300 262" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <path d="M300 262 Q352 272 356 326" fill="none" stroke="var(--accent)" stroke-width="5" stroke-dasharray="1 0"/>
  <rect x="340" y="330" width="32" height="54" rx="6" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <text class="t" x="330" y="412" font-size="16" fill="var(--accent)">Signal</text>

  <rect x="492" y="100" width="420" height="330" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="t" x="520" y="140" font-size="20" font-weight="700">2 GHz+</text>
  <text class="g" x="520" y="168" font-size="16">Short wave</text>
  <rect x="744" y="200" width="16" height="190" fill="var(--grey)"/>
  <text class="g" x="730" y="412" font-size="15">Wall</text>
  <path d="M520 300 Q530 276 540 300 T560 300 T580 300 T600 300 T620 300 T640 300 T660 300 T680 300 T700 300 T720 300 T740 300" fill="none" stroke="var(--dim)" stroke-width="5"/>
  <rect x="784" y="330" width="32" height="54" rx="6" fill="none" stroke="var(--grey)" stroke-width="4"/>
  <text class="g" x="774" y="412" font-size="16">Blocked</text>

  <text class="t" x="48" y="482" font-size="22" font-weight="700">This spectrum only fixes the getting-indoors part</text>
</svg>
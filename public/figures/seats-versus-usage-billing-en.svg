<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A flat solid block sits on the left and a curve moving up and down over time sits on the right, close in area and completely different in shape.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); }
.g { font-size:20px; fill:var(--ink); }
.s { font-size:16px; fill:var(--dim); }
.c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="68">The flat block and the breathing line</text>

<text class="g" x="60" y="128">Seat licence</text>
<line x1="60" y1="380" x2="440" y2="380" stroke="var(--line)" stroke-width="2"/>
<rect x="80" y="230" width="340" height="150" fill="var(--grey)"/>
<line x1="80" y1="230" x2="420" y2="230" stroke="var(--dim)" stroke-width="3"/>
<text class="s" x="80" y="414">One-year deal</text>
<text class="s" x="80" y="444">Same height either way</text>

<text class="g" x="520" y="128">Usage-based</text>
<line x1="520" y1="380" x2="900" y2="380" stroke="var(--line)" stroke-width="2"/>
<path d="M540 330 L580 300 L620 318 L660 236 L700 262 L740 206 L780 282 L820 248 L860 300" fill="none" stroke="var(--accent)" stroke-width="5"/>
<path d="M540 330 L580 300 L620 318 L660 236 L700 262 L740 206 L780 282 L820 248 L860 300 L860 380 L540 380 Z" fill="var(--accent)" opacity="0.16"/>
<text class="s" x="520" y="414">Tracks real usage</text>
<text class="s" x="520" y="444">Pricey when high, honest when low</text>

<line x1="60" y1="480" x2="900" y2="480" stroke="var(--line)"/>
<text class="c" x="60" y="518">Same fact: Eisman reads pricey, you can read real</text>
</svg>
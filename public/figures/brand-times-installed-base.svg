<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩排乘法圖，招牌方塊不變、基數方塊縮矮，右邊的把握方塊跟著變小">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="58" font-size="27" fill="var(--ink)">回收把握＝招牌 乘 裝置基數</text>
<rect x="48" y="86" width="864" height="196" rx="14" fill="var(--card)"/>
<text x="76" y="118" font-size="20" fill="var(--dim)">主機 400–500 美元的年代</text>
<rect x="100" y="132" width="120" height="120" rx="8" fill="var(--grey)"/>
<text x="160" y="198" font-size="16" fill="var(--ink)" text-anchor="middle">招牌</text>
<text x="248" y="200" font-size="27" fill="var(--dim)" text-anchor="middle">×</text>
<rect x="286" y="132" width="180" height="120" rx="8" fill="var(--grey)"/>
<text x="376" y="198" font-size="16" fill="var(--ink)" text-anchor="middle">買得下去的人</text>
<text x="498" y="200" font-size="27" fill="var(--dim)" text-anchor="middle">＝</text>
<rect x="534" y="132" width="300" height="120" rx="8" fill="var(--accent)"/>
<text x="684" y="198" font-size="20" fill="var(--page)" text-anchor="middle">2.35 億套</text>
<rect x="48" y="300" width="864" height="166" rx="14" fill="var(--card)"/>
<text x="76" y="332" font-size="20" fill="var(--warn)">主機站上 1,000 美元</text>
<rect x="100" y="346" width="120" height="100" rx="8" fill="var(--grey)"/>
<text x="160" y="402" font-size="16" fill="var(--ink)" text-anchor="middle">招牌</text>
<text x="248" y="404" font-size="27" fill="var(--dim)" text-anchor="middle">×</text>
<rect x="286" y="386" width="180" height="60" rx="8" fill="var(--grey)"/>
<text x="376" y="422" font-size="16" fill="var(--ink)" text-anchor="middle">買得下去的人</text>
<text x="498" y="404" font-size="27" fill="var(--dim)" text-anchor="middle">＝</text>
<rect x="534" y="386" width="150" height="60" rx="8" fill="var(--warn)"/>
<text x="609" y="422" font-size="16" fill="var(--page)" text-anchor="middle">要重新算</text>
<text x="48" y="520" font-size="22" fill="var(--ink)">招牌沒變，乘數變了</text>
</svg>
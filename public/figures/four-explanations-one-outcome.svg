<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四個解釋匯聚到同一個上架結果，現在分不出是哪一條在起作用">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text x="40" y="52" font-size="27" fill="var(--ink)">四條線都通到同一個結果</text>

  <g>
    <rect x="40" y="100" width="300" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
    <text x="64" y="142" font-size="19" fill="var(--ink)">說故事：借來的標籤</text>
    <path d="M340 133 C440 133 460 270 560 270" fill="none" stroke="var(--grey)" stroke-width="4"/>

    <rect x="40" y="188" width="300" height="66" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <text x="64" y="222" font-size="19" fill="var(--ink)">通路關係</text>
    <text x="64" y="246" font-size="15" fill="var(--dim)">CVS 1400・Walmart 1700・Target 1000</text>
    <path d="M340 221 C450 221 470 262 560 262" fill="none" stroke="var(--accent)" stroke-width="9"/>

    <rect x="40" y="276" width="300" height="66" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <text x="64" y="310" font-size="19" fill="var(--ink)">供應鏈門檻</text>
    <text x="64" y="334" font-size="15" fill="var(--dim)">包材・毒理・兩個包裝專利</text>
    <path d="M340 309 C450 309 470 278 560 278" fill="none" stroke="var(--accent)" stroke-width="8"/>

    <rect x="40" y="364" width="300" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
    <text x="64" y="398" font-size="19" fill="var(--ink)">拔掉摩擦</text>
    <text x="64" y="422" font-size="15" fill="var(--dim)">預混沖洗液・會溶掉的薄片</text>
    <path d="M340 397 C450 397 460 288 560 288" fill="none" stroke="var(--grey)" stroke-width="5"/>
  </g>

  <rect x="580" y="214" width="260" height="120" rx="12" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
  <text x="606" y="262" font-size="20" fill="var(--ink)">九個月鋪進實體通路</text>
  <text x="606" y="300" font-size="16" fill="var(--dim)">沒有銷售與回購數字</text>

  <text x="864" y="286" font-size="44" fill="var(--warn)">?</text>

  <line x1="40" y1="474" x2="920" y2="474" stroke="var(--line)" stroke-width="2"/>
  <text x="40" y="512" font-size="22" fill="var(--ink)">能分辨的點在未來：Zyrtec 借同一套類比之後，誰守得住貨架</text>
</svg>
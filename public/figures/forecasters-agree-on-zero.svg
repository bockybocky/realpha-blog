<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="預測者在通膨上分成兩群，在利率上全部塌到零成為一條線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="40" y="58" font-size="27" font-weight="700" fill="var(--ink)">同一批預測者，兩個問題兩種形狀</text>

<rect x="40" y="96" width="420" height="320" rx="10" fill="var(--card)" stroke="var(--line)"/>
<rect x="500" y="96" width="420" height="320" rx="10" fill="var(--card)" stroke="var(--line)"/>

<text class="t" x="68" y="134" font-size="20" font-weight="700" fill="var(--ink)">問：通膨多高</text>
<text class="t" x="68" y="160" font-size="15" fill="var(--warn)">分成兩群</text>
<circle cx="150" cy="210" r="7" fill="var(--warn)"/>
<circle cx="200" cy="196" r="7" fill="var(--warn)"/>
<circle cx="250" cy="222" r="7" fill="var(--warn)"/>
<circle cx="305" cy="202" r="7" fill="var(--warn)"/>
<circle cx="360" cy="216" r="7" fill="var(--warn)"/>
<circle cx="160" cy="330" r="7" fill="var(--grey)"/>
<circle cx="215" cy="344" r="7" fill="var(--grey)"/>
<circle cx="270" cy="322" r="7" fill="var(--grey)"/>
<circle cx="325" cy="340" r="7" fill="var(--grey)"/>
<circle cx="380" cy="328" r="7" fill="var(--grey)"/>
<text class="t" x="68" y="258" font-size="16" fill="var(--warn)">持續派</text>
<text class="t" x="68" y="382" font-size="16" fill="var(--dim)">暫時派</text>

<text class="t" x="528" y="134" font-size="20" font-weight="700" fill="var(--ink)">問：利率多高</text>
<text class="t" x="528" y="160" font-size="15" fill="var(--accent)">塌成一條線</text>
<line x1="528" y1="330" x2="890" y2="330" stroke="var(--accent)" stroke-width="2"/>
<circle cx="580" cy="330" r="7" fill="var(--accent)"/>
<circle cx="630" cy="330" r="7" fill="var(--accent)"/>
<circle cx="680" cy="330" r="7" fill="var(--accent)"/>
<circle cx="730" cy="330" r="7" fill="var(--accent)"/>
<circle cx="780" cy="330" r="7" fill="var(--accent)"/>
<circle cx="830" cy="330" r="7" fill="var(--accent)"/>
<text class="t" x="528" y="368" font-size="16" fill="var(--accent)">零</text>

<text class="t" x="40" y="478" font-size="22" font-weight="700" fill="var(--ink)">分歧在通膨，共識在「它不會動」</text>
</svg>
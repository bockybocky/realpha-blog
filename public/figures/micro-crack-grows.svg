<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三格圖：孔壁細裂痕逐格變長分岔，最後整片碎裂">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:20px; font-weight:700; fill:var(--ink); }
    .bd  { font-size:16px; fill:var(--dim); }
    .sm  { font-size:15px; fill:var(--dim); }
    .cc  { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="ttl" x="60" y="58">致命的不是破掉，是那道看不見的裂痕</text>

  <rect x="60" y="100" width="250" height="290" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="grp" x="185" y="142" text-anchor="middle">鑽完</text>
  <rect x="165" y="176" width="40" height="170" rx="6" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
  <path d="M205 250 L226 244" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <text class="sm" x="185" y="376" text-anchor="middle">肉眼看不出來</text>

  <rect x="355" y="100" width="250" height="290" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="grp" x="480" y="142" text-anchor="middle">反覆加熱</text>
  <rect x="460" y="176" width="40" height="170" rx="6" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
  <path d="M500 250 L556 232 L582 250" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <path d="M500 268 L540 292" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <text class="sm" x="480" y="376" text-anchor="middle">一路長大</text>

  <rect x="650" y="100" width="250" height="290" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="grp" x="775" y="142" text-anchor="middle">最後</text>
  <rect x="755" y="176" width="40" height="170" rx="6" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
  <path d="M795 240 L890 196" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M795 262 L884 306" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M755 240 L668 202" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M755 274 L676 320" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M826 224 L862 268" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <text class="sm" x="775" y="376" text-anchor="middle">整片崩掉</text>

  <text class="cc" x="60" y="470">標準不是沒破就好，是一道都不能有</text>
</svg>
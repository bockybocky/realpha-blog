<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一個現在的點分岔成上下兩條路，通向兩個高低不同的價格">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; fill:var(--ink); font-weight:700 }
.g { font-size:20px; fill:var(--ink); font-weight:600 }
.b { font-size:16px; fill:var(--dim) }
.n { font-size:22px; fill:var(--ink); font-weight:700 }
.c { font-size:22px; fill:var(--ink); font-weight:600 }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="56">同一份供需表，兩個結局</text>
<line x1="110" y1="440" x2="110" y2="130" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="110" y="112" text-anchor="middle">價格</text>
<circle cx="200" cy="300" r="12" fill="var(--ink)"/>
<text class="g" x="200" y="272" text-anchor="middle">105</text>
<path d="M212 296 C 420 280, 620 220, 800 160" fill="none" stroke="var(--warn)" stroke-width="5"/>
<path d="M212 306 C 420 330, 620 390, 800 430" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text class="g" x="440" y="238" fill="var(--warn)">不停火</text>
<text class="g" x="440" y="400" fill="var(--accent)">停火</text>
<text class="n" x="820" y="150" fill="var(--warn)">8～9 開頭</text>
<text class="b" x="820" y="178">缺口撐不過四百天</text>
<text class="n" x="820" y="440" fill="var(--accent)">6 開頭</text>
<text class="b" x="820" y="468">每天多 400 萬桶</text>
<text class="c" x="60" y="512">差別不在模型，在戰事停不停</text>
</svg>
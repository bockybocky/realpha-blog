<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="兩條長度不同的橫條，上面那條代表超賣可以持續很久並往右延伸出箭頭，下面那條代表選擇權剩下的時間，短得多，虛線標出時間先用完的位置">
  <rect x="0" y="0" width="960" height="480" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}
    .g{font-size:19px}
    .b{font-size:15px;fill:var(--dim)}
    .c{font-size:22px}
  </style>
  <text class="t" x="40" y="58">超賣可以很久，時間會先用完</text>
  <text class="g" x="150" y="156">超賣可以持續</text>
  <rect x="150" y="170" width="680" height="46" fill="var(--grey)" fill-opacity="0.5"/>
  <polygon points="830,170 830,216 862,193" fill="var(--grey)"/>
  <text class="g" x="150" y="266">選擇權剩下的時間</text>
  <rect x="150" y="280" width="250" height="46" fill="var(--accent)"/>
  <line x1="400" y1="166" x2="400" y2="360" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="g" x="412" y="352" fill="var(--warn)">時間在這裡用完</text>
  <text class="b" x="150" y="404">Ceresna 自己把主要風險講成「時機」</text>
  <text class="c" x="40" y="446">方向對、時間不對，一樣輸</text>
</svg>
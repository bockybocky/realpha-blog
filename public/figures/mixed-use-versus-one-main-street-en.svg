<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="In the left panel blue dots are spread across the whole area; in the right, a single blue line runs through a large gray field.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="66" font-size="27" font-weight="700">Streets with backup, and streets with only one</text>

<rect x="60" y="100" width="390" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="84" y="138" font-size="20" font-weight="700">Mixed use</text>
<g fill="var(--grey)">
<rect x="90" y="160" width="76" height="60" rx="4"/><rect x="180" y="160" width="76" height="60" rx="4"/><rect x="270" y="160" width="76" height="60" rx="4"/><rect x="360" y="160" width="76" height="60" rx="4"/>
<rect x="90" y="236" width="76" height="60" rx="4"/><rect x="180" y="236" width="76" height="60" rx="4"/><rect x="270" y="236" width="76" height="60" rx="4"/><rect x="360" y="236" width="76" height="60" rx="4"/>
<rect x="90" y="312" width="76" height="60" rx="4"/><rect x="180" y="312" width="76" height="60" rx="4"/><rect x="270" y="312" width="76" height="60" rx="4"/><rect x="360" y="312" width="76" height="60" rx="4"/>
</g>
<g fill="var(--accent)">
<circle cx="128" cy="190" r="11"/><circle cx="218" cy="190" r="11"/><circle cx="398" cy="190" r="11"/>
<circle cx="128" cy="266" r="11"/><circle cx="308" cy="266" r="11"/><circle cx="398" cy="266" r="11"/>
<circle cx="218" cy="342" r="11"/><circle cx="308" cy="342" r="11"/>
</g>
<text x="84" y="406" font-size="16" fill="var(--dim)">More around the corner</text>

<rect x="510" y="100" width="390" height="330" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="534" y="138" font-size="20" font-weight="700">95% zoned residential</text>
<g fill="var(--grey)">
<rect x="540" y="160" width="76" height="60" rx="4"/><rect x="630" y="160" width="76" height="60" rx="4"/><rect x="720" y="160" width="76" height="60" rx="4"/><rect x="810" y="160" width="76" height="60" rx="4"/>
<rect x="540" y="312" width="76" height="60" rx="4"/><rect x="630" y="312" width="76" height="60" rx="4"/><rect x="720" y="312" width="76" height="60" rx="4"/><rect x="810" y="312" width="76" height="60" rx="4"/>
</g>
<rect x="540" y="248" width="346" height="36" rx="6" fill="var(--accent)"/>
<text x="558" y="273" font-size="16" fill="var(--page)">Main street</text>
<text x="534" y="406" font-size="16" fill="var(--dim)">Nothing beside it</text>

<text x="60" y="490" font-size="22" font-weight="700">Drain the one main street and there is no next one</text>
</svg>
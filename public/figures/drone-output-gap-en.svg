<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Four horizontal bars of vastly different lengths, with the United States shortest and China longest.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="72">Same year, drones built</text>
<text class="g" x="60" y="168">U.S.</text>
<rect x="240" y="150" width="9" height="26" fill="var(--accent)"/>
<text class="b" x="265" y="170">~300,000</text>
<text class="g" x="60" y="248">Russia</text>
<rect x="240" y="230" width="181" height="26" fill="var(--grey)"/>
<text class="b" x="437" y="250">7M–10M</text>
<text class="g" x="60" y="328">Ukraine</text>
<rect x="240" y="310" width="181" height="26" fill="var(--grey)"/>
<text class="b" x="437" y="330">7M–10M</text>
<text class="g" x="60" y="408">China</text>
<rect x="240" y="390" width="640" height="26" fill="var(--grey)"/>
<text class="b" x="240" y="440">Est. 30M</text>
<text class="c" x="60" y="490">Not the machines, the lines</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Nine solid squares on the left and six dashed squares on the right, each square equal to one standard advanced fab, with the right-hand group labelled as the volume the model left out.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); font-weight:700; }
  .g { font-size:20px; fill:var(--ink); font-weight:700; }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="70" y="58">Count the volume, not the dollars</text>
<text class="g" x="70" y="118">Arizona</text>
<text class="b" x="196" y="118">Nine fabs or more</text>
<g fill="var(--grey)">
<rect x="70" y="140" width="76" height="76" rx="5"/><rect x="158" y="140" width="76" height="76" rx="5"/><rect x="246" y="140" width="76" height="76" rx="5"/>
<rect x="70" y="228" width="76" height="76" rx="5"/><rect x="158" y="228" width="76" height="76" rx="5"/><rect x="246" y="228" width="76" height="76" rx="5"/>
<rect x="70" y="316" width="76" height="76" rx="5"/><rect x="158" y="316" width="76" height="76" rx="5"/><rect x="246" y="316" width="76" height="76" rx="5"/>
</g>
<line x1="390" y1="130" x2="390" y2="400" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="440" y="118">Texas site 2</text>
<text class="b" x="606" y="118">Review | 6</text>
<g fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 6">
<rect x="440" y="140" width="76" height="76" rx="5"/><rect x="528" y="140" width="76" height="76" rx="5"/><rect x="616" y="140" width="76" height="76" rx="5"/>
<rect x="440" y="228" width="76" height="76" rx="5"/><rect x="528" y="228" width="76" height="76" rx="5"/><rect x="616" y="228" width="76" height="76" rx="5"/>
</g>
<text class="b" x="440" y="340">1 square = 1 advanced fab</text>
<text class="b" x="440" y="364">About 30k wafers a month</text>
<text class="b" x="440" y="388">Set the capacity, set the output</text>
<text class="c" x="70" y="474">The old model missed these six squares</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="價格線穿過水平的前高虛線，穿越前一段被灰色陰影標為放棄的漲幅，穿越點是動手時機" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="80" y="54" font-size="27" font-weight="700" fill="var(--ink)">等一個新高才動手，代價是前面那段</text>

  <rect x="330" y="230" width="230" height="145" fill="var(--grey)" fill-opacity="0.2"/>

  <line x1="100" y1="230" x2="880" y2="230" stroke="var(--dim)" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="100" y="220" font-size="15" fill="var(--dim)">前高</text>

  <polyline points="100,330 180,300 250,362 330,332 420,300 500,266 560,230 640,200 740,156 860,122" fill="none" stroke="var(--accent)" stroke-width="4"/>

  <circle cx="560" cy="230" r="8" fill="var(--accent)"/>
  <text x="578" y="256" font-size="19" font-weight="700" fill="var(--accent)">動手</text>

  <text x="445" y="410" font-size="16" fill="var(--dim)" text-anchor="middle">放棄的漲幅</text>
  <text x="770" y="230" font-size="16" fill="var(--ink)" text-anchor="middle">不用賭的那段</text>

  <line x1="100" y1="450" x2="880" y2="450" stroke="var(--line)" stroke-width="2"/>

  <text x="480" y="502" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">用一段漲幅，換掉一次猜測</text>
</svg>
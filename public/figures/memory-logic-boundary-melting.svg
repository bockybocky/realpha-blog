<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="邏輯與記憶體兩圈重疊，重疊處是先進基礎晶粒，一支箭頭從記憶體側往邏輯側推進">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">界線在融化，所以這是防守題</text>

  <circle cx="400" cy="280" r="160" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="620" cy="280" r="160" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="192" y="200" font-size="20" fill="var(--accent)">邏輯</text>
  <text x="760" y="200" font-size="20" fill="var(--warn)">記憶體</text>
  <text x="208" y="290" font-size="16" fill="var(--dim)">台積電的城堡</text>
  <text x="760" y="290" font-size="16" fill="var(--dim)">韓國的地盤</text>

  <text x="452" y="256" font-size="16" fill="var(--ink)">HBM4</text>
  <text x="432" y="286" font-size="16" fill="var(--ink)">基礎晶粒</text>
  <text x="440" y="316" font-size="16" fill="var(--ink)">存內運算</text>

  <path d="M700 420 L430 420" stroke="var(--warn)" stroke-width="4" fill="none"/>
  <path d="M430 420 l16 -10 M430 420 l16 10" stroke="var(--warn)" stroke-width="4" fill="none"/>
  <text x="700" y="464" font-size="16" fill="var(--warn)">拿基礎晶粒練邏輯製程</text>

  <text x="48" y="512" font-size="22" fill="var(--ink)">不是要不要進攻，是補不補這個洞。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Nine of ten blocks of cash flow move from the solid known-return box to the dashed unknown-return box, and the multiple falls with them.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="48" y="62">Same cash, new destination</text>
<rect x="48" y="104" width="330" height="300" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="76" y="142">Buybacks and dividends</text>
<text class="b" x="76" y="170">A known return</text>
<rect x="76" y="192" width="54" height="36" rx="3" fill="var(--accent)"/>
<rect x="140" y="192" width="54" height="36" rx="3" fill="var(--accent)"/>
<rect x="204" y="192" width="54" height="36" rx="3" fill="var(--accent)"/>
<rect x="268" y="192" width="54" height="36" rx="3" fill="var(--accent)"/>
<rect x="76" y="240" width="54" height="36" rx="3" fill="var(--accent)"/>
<rect x="140" y="240" width="54" height="36" rx="3" fill="var(--accent)"/>
<rect x="204" y="240" width="54" height="36" rx="3" fill="var(--accent)"/>
<rect x="268" y="240" width="54" height="36" rx="3" fill="var(--accent)"/>
<rect x="76" y="288" width="54" height="36" rx="3" fill="var(--accent)"/>
<rect x="140" y="288" width="54" height="36" rx="3" fill="var(--grey)"/>
<text class="b" x="76" y="356">Nine of every ten</text>
<path d="M400 250 L556 250" stroke="var(--ink)" stroke-width="5"/>
<path d="M556 250 l-16 -11 l0 22 z" fill="var(--ink)"/>
<rect x="580" y="104" width="330" height="300" rx="10" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<text class="g" x="608" y="142">Capex</text>
<text class="b" x="608" y="170">Unknown rate of return</text>
<rect x="608" y="192" width="54" height="36" rx="3" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="672" y="192" width="54" height="36" rx="3" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="736" y="192" width="54" height="36" rx="3" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="800" y="192" width="54" height="36" rx="3" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="608" y="240" width="54" height="36" rx="3" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="672" y="240" width="54" height="36" rx="3" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="736" y="240" width="54" height="36" rx="3" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="800" y="240" width="54" height="36" rx="3" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="608" y="288" width="54" height="36" rx="3" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="b" x="608" y="356">Certainty premium gone</text>
<path d="M730 420 L730 476" stroke="var(--warn)" stroke-width="5"/>
<path d="M730 476 l-11 -16 l22 0 z" fill="var(--warn)"/>
<text class="c" x="48" y="470">Same cash flow, a different multiple</text>
</svg>
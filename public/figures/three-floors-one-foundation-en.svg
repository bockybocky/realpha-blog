<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three layers of downside protection stand side by side, but all of them rest on one shared foundation.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .w { font-size:19px; font-weight:700; fill:var(--warn); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="58">Three layers, one foundation</text>

  <rect x="80" y="110" width="240" height="210" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="104" y="150">Layer one</text>
  <text class="b" x="104" y="182">To lose money</text>
  <text class="b" x="104" y="208">All of AI must fail</text>
  <text class="b" x="104" y="252">A macro event</text>

  <rect x="360" y="110" width="240" height="210" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="384" y="150">Layer two</text>
  <text class="b" x="384" y="182">Other buyers want compute</text>
  <text class="b" x="384" y="208">Queued up</text>

  <rect x="640" y="110" width="240" height="210" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="664" y="150">Layer three</text>
  <text class="b" x="664" y="182">Chip resale value up</text>
  <text class="b" x="664" y="208">Depreciation edge</text>

  <line x1="200" y1="320" x2="200" y2="396" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="480" y1="320" x2="480" y2="396" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="760" y1="320" x2="760" y2="396" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>

  <rect x="80" y="398" width="800" height="78" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="3"/>
  <text class="c" x="104" y="432">One premise: compute stays scarce</text>
  <text class="w" x="104" y="462">Foundation slips, all three slip</text>
</svg>
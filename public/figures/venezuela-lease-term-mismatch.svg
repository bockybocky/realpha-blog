<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩條長度懸殊的橫條，上面一條一百年、下面一條只有四分之一長的二十五年，底下一個打叉的虛線空框代表法律裡不存在的合約形式">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="60">同一筆交易，兩份公告的年限</text>
<text class="d" x="60" y="90">橫軸＝合約年限</text>

<text class="g" x="60" y="152">白宮說明</text>
<rect x="230" y="126" width="670" height="50" rx="6" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"/>
<text class="b" x="250" y="157">百年租約</text>

<text class="g" x="60" y="254">委內瑞拉法律</text>
<rect x="230" y="228" width="168" height="50" rx="6" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
<text class="b" x="250" y="259">25 年</text>
<text class="d" x="416" y="259">合資／產量分成・可續</text>

<line x1="230" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="2"/>
<line x1="230" y1="294" x2="230" y2="306" stroke="var(--grey)" stroke-width="2"/>
<line x1="398" y1="294" x2="398" y2="306" stroke="var(--grey)" stroke-width="2"/>
<line x1="565" y1="294" x2="565" y2="306" stroke="var(--grey)" stroke-width="2"/>
<line x1="900" y1="294" x2="900" y2="306" stroke="var(--grey)" stroke-width="2"/>
<text class="d" x="230" y="326" text-anchor="middle">0</text>
<text class="d" x="398" y="326" text-anchor="middle">25</text>
<text class="d" x="565" y="326" text-anchor="middle">50</text>
<text class="d" x="900" y="326" text-anchor="middle">100 年</text>

<rect x="230" y="356" width="330" height="88" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="g" x="252" y="392">租約・特許權</text>
<text class="d" x="252" y="420">1975 年國有化後，法條裡沒有這一格</text>
<line x1="500" y1="376" x2="540" y2="424" stroke="var(--warn)" stroke-width="3"/>
<line x1="540" y1="376" x2="500" y2="424" stroke="var(--warn)" stroke-width="3"/>

<text class="c" x="60" y="490">多出來的七十五年，掛在一個對方沒有的格子上。</text>
</svg>
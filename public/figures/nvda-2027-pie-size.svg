<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四條長度懸殊的長條，最長的佔滿整排，最短的只有一道細線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">2027 年各家自己說的數字</text>
<text x="60" y="94" font-size="16" fill="var(--dim)">口徑各不相同，長度照金額比例畫</text>
<line x1="120" y1="130" x2="120" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="120" y="140" width="760" height="46" fill="var(--accent)"/>
<text x="120" y="130" font-size="19" fill="var(--ink)">NVIDIA 全公司營收，7,000 億美元上下</text>
<text x="136" y="172" font-size="16" fill="var(--page)">指引成長至少七成</text>
<rect x="120" y="216" width="125" height="46" fill="var(--accent)" opacity="0.8"/>
<rect x="245" y="216" width="125" height="46" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="120" y="206" font-size="19" fill="var(--ink)">Broadcom 資料中心，約 1,150 億美元</text>
<text x="380" y="247" font-size="16" fill="var(--dim)">虛線是它說的 2028 年約 2,300 億美元</text>
<rect x="120" y="292" width="44" height="46" fill="var(--accent)" opacity="0.7"/>
<text x="120" y="282" font-size="19" fill="var(--ink)">AMD 的 GPU 銷售，400 多億美元</text>
<text x="180" y="323" font-size="16" fill="var(--dim)">將近三倍</text>
<rect x="120" y="368" width="5" height="46" fill="var(--warn)"/>
<text x="120" y="358" font-size="19" fill="var(--ink)">Qualcomm，50 億美元</text>
<text x="140" y="399" font-size="16" fill="var(--dim)">這一條就是那道細線</text>
<text x="60" y="492" font-size="22" fill="var(--ink)">這些數字沒有一個因為換人而變動</text>
</svg>
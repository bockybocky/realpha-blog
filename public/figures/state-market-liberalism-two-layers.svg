<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩個雙層堆疊並排比較：上面那層被換掉，下面那層兩邊一模一樣">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

  <text x="480" y="56" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">被拆掉的只有上面那一層</text>

  <text x="260" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="var(--dim)">舊秩序</text>
  <text x="700" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="var(--dim)">新秩序</text>

  <rect x="90" y="140" width="340" height="140" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="260" y="185" text-anchor="middle" font-size="19" fill="var(--dim)">國際層</text>
  <text x="260" y="227" text-anchor="middle" font-size="16" fill="var(--ink)">自由貿易・低關稅・資本流動</text>

  <rect x="530" y="140" width="340" height="140" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  <text x="700" y="185" text-anchor="middle" font-size="19" fill="var(--dim)">國際層</text>
  <text x="700" y="227" text-anchor="middle" font-size="16" fill="var(--warn)">重商主義・以鄰為壑・零和</text>

  <rect x="90" y="320" width="340" height="140" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="260" y="365" text-anchor="middle" font-size="19" fill="var(--dim)">國內層</text>
  <text x="260" y="407" text-anchor="middle" font-size="16" fill="var(--ink)">自由定價・競爭・平權</text>

  <rect x="530" y="320" width="340" height="140" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="700" y="365" text-anchor="middle" font-size="19" fill="var(--dim)">國內層</text>
  <text x="700" y="407" text-anchor="middle" font-size="16" fill="var(--ink)">自由定價・競爭・平權</text>

  <text x="480" y="186" text-anchor="middle" font-size="15" fill="var(--warn)">整層換掉</text>
  <line x1="436" y1="210" x2="512" y2="210" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="524,210 510,203 510,217" fill="var(--warn)"/>

  <text x="480" y="366" text-anchor="middle" font-size="15" fill="var(--dim)">沒動</text>
  <line x1="436" y1="390" x2="512" y2="390" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 6"/>
  <polygon points="524,390 510,383 510,397" fill="var(--grey)"/>

  <text x="480" y="505" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">下面那層沒變，所以它還叫自由主義</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根等高柱子與一條水平股價線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">數字很漂亮，價格沒有空間</text>
<line x1="500" y1="100" x2="500" y2="470" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="90" y1="420" x2="460" y2="420" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="205" width="100" height="215" fill="var(--grey)"/>
<rect x="310" y="205" width="100" height="215" fill="var(--accent)"/>
<line x1="150" y1="190" x2="410" y2="190" stroke="var(--dim)" stroke-width="2" stroke-dasharray="5 5"/>
<text class="n" x="200" y="448">市場預期</text>
<text class="n" x="360" y="448">實際開出</text>
<text class="g" x="280" y="170" text-anchor="middle">落差 0</text>
<line x1="560" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="570" y1="300" x2="890" y2="300" stroke="var(--accent)" stroke-width="4"/>
<text class="g" x="570" y="275">股價</text>
<text class="n" x="570" y="448">新錢 ＝ 0</text>
<text class="c" x="480" y="520" text-anchor="middle">被算出來的好，已經在價格裡</text>
</svg>
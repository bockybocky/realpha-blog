<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="一張二維圖，橫軸是滿產時間、縱軸是規格緊不緊；點全部落在右上與左下，左上那一格用警示虛線框起來而且是空的">
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .wn { font-size:19px; fill:var(--warn); }
  </style>

  <text class="t" x="60" y="58">擴的不是最緊那一段，滿產又落在 2029</text>

  <rect x="220" y="110" width="660" height="360" fill="var(--card)"/>
  <line x1="220" y1="290" x2="880" y2="290" stroke="var(--line)" stroke-width="2"/>
  <line x1="620" y1="110" x2="620" y2="470" stroke="var(--line)" stroke-width="2"/>

  <text class="g" x="208" y="196" text-anchor="end">連續波</text>
  <text class="b" x="208" y="220" text-anchor="end">最緊那一段</text>
  <text class="g" x="208" y="392" text-anchor="end">調變雷射</text>

  <text class="b" x="320" y="498" text-anchor="middle">2027</text>
  <text class="b" x="500" y="498" text-anchor="middle">2028</text>
  <text class="b" x="700" y="498" text-anchor="middle">2029</text>
  <text class="b" x="840" y="498" text-anchor="middle">更晚</text>
  <text class="b" x="550" y="530" text-anchor="middle">滿產時間</text>

  <rect x="226" y="116" width="388" height="168" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text class="wn" x="248" y="152">這一格現在是空的</text>
  <text class="b" x="248" y="180">填滿＝推論失效</text>

  <circle cx="320" cy="390" r="15" fill="var(--grey)"/>
  <text class="b" x="320" y="432" text-anchor="middle">每月 2,200 萬顆</text>
  <circle cx="700" cy="206" r="15" fill="var(--accent)"/>
  <text class="b" x="700" y="248" text-anchor="middle">每年 7,200 萬顆</text>
  <circle cx="728" cy="156" r="11" fill="var(--accent)"/>
  <text class="b" x="748" y="150">1,875 萬顆</text>
  <circle cx="850" cy="400" r="11" fill="var(--grey)" opacity="0.6"/>
  <text class="b" x="850" y="438" text-anchor="middle">未附時程</text>

  <text class="c" x="220" y="562">空著的那一格，就是失效條件</text>
</svg>
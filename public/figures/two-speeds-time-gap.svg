<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="緩緩爬升多年的線與某一天垂直暴衝的線並置，斜率天差地遠">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:700;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .s{font-size:15px;fill:var(--dim)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
    .w{font-size:20px;font-weight:700;fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="56" y="56">兩種速度，同一件事</text>
<path d="M120 400 L880 400" stroke="var(--line)" stroke-width="2"/>
<path d="M120 120 L120 400" stroke="var(--line)" stroke-width="2"/>
<path d="M120 388 C 320 380 520 356 700 332" stroke="var(--accent)" stroke-width="4" fill="none"/>
<text class="g" x="416" y="352">條件緩慢惡化</text>
<text class="s" x="416" y="378">好幾年，沒有感覺</text>
<path d="M700 400 L700 148" stroke="var(--warn)" stroke-width="5"/>
<path d="M700 132 L690 158 L710 158 Z" fill="var(--warn)"/>
<text class="w" x="724" y="176">問卷寄到</text>
<text class="s" x="724" y="204">幾週內回覆</text>
<circle cx="700" cy="332" r="8" fill="var(--warn)"/>
<path d="M120 424 L680 424" stroke="var(--dim)" stroke-width="2"/>
<path d="M690 424 L710 424" stroke="var(--dim)" stroke-width="2"/>
<text class="b" x="360" y="452">好幾年</text>
<text class="b" x="672" y="452">兩週</text>
<text class="c" x="56" y="512">慢慢壞，然後某一天要你立刻交代</text>
</svg>
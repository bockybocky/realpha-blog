<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="The left bar with subsidy sits above the dashed cost line, the right bar without subsidy sits below it">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">Strip the subsidy and revenue falls below cost</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">Revenue per ton of waste, RMB</text>
<line x1="180" y1="470" x2="860" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="250" y="140" width="170" height="130" fill="var(--grey)"/>
<rect x="250" y="270" width="170" height="200" fill="var(--accent)"/>
<rect x="600" y="340" width="170" height="130" fill="var(--grey)"/>
<line x1="180" y1="250" x2="860" y2="250" stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="180" y="236" font-size="19" font-weight="700" fill="var(--warn)">Cost with depreciation, about 200</text>
<text x="335" y="212" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">Tipping fee and power 118</text>
<text x="335" y="378" font-size="19" font-weight="700" fill="var(--page)" text-anchor="middle">Subsidy 182</text>
<text x="685" y="412" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">118 left</text>
<text x="335" y="505" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">Now</text>
<text x="685" y="505" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">After the subsidy ends</text>
<text x="60" y="572" font-size="22" font-weight="700" fill="var(--ink)">Over half the revenue is not paid by a customer</text>
</svg>
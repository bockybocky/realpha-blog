<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Hourglass diagram: lines of uneven thickness from six models all converge on Hugging Face and Perplexity at the narrow waist, then spread to users below; the waist decides which line is thickest."><rect x="0" y="0" width="960" height="560" fill="var(--page)"/><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
    .t{font-size:27px;font-weight:700}.g{font-size:19px;font-weight:600}.b{font-size:16px;fill:var(--dim)}.k{font-size:22px;font-weight:700}.a{fill:var(--accent)}.w{fill:var(--warn)}
</style>
<text x="480" y="52" text-anchor="middle" class="t">Route, not build</text>
<g fill="none" stroke-linecap="round">
<line x1="95" y1="144" x2="480" y2="262" stroke="var(--grey)" stroke-width="3"/>
<line x1="250" y1="144" x2="480" y2="262" stroke="var(--grey)" stroke-width="3"/>
<line x1="405" y1="144" x2="480" y2="262" stroke="var(--accent)" stroke-width="12"/>
<line x1="560" y1="144" x2="480" y2="262" stroke="var(--accent)" stroke-width="6"/>
<line x1="715" y1="144" x2="480" y2="262" stroke="var(--accent)" stroke-width="5"/>
<line x1="870" y1="144" x2="480" y2="262" stroke="var(--grey)" stroke-width="3"/>
<line x1="480" y1="338" x2="240" y2="430" stroke="var(--grey)" stroke-width="3"/>
<line x1="480" y1="338" x2="400" y2="430" stroke="var(--grey)" stroke-width="3"/>
<line x1="480" y1="338" x2="560" y2="430" stroke="var(--grey)" stroke-width="3"/>
<line x1="480" y1="338" x2="720" y2="430" stroke="var(--grey)" stroke-width="3"/>
</g>
<g fill="var(--card)" stroke="var(--line)" stroke-width="2">
<rect x="30" y="100" width="130" height="44" rx="22"/>
<rect x="185" y="100" width="130" height="44" rx="22"/>
<rect x="340" y="100" width="130" height="44" rx="22"/>
<rect x="495" y="100" width="130" height="44" rx="22"/>
<rect x="650" y="100" width="130" height="44" rx="22"/>
<rect x="805" y="100" width="130" height="44" rx="22"/>
</g>
<g font-size="16" text-anchor="middle">
<text x="95" y="128">MSFT own</text>
<text x="250" y="128">Amazon own</text>
<text x="405" y="128">Nemotron</text>
<text x="560" y="128">OpenAI</text>
<text x="715" y="128">Anthropic</text>
<text x="870" y="128">Open</text>
</g>
<rect x="320" y="262" width="320" height="76" rx="38" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="480" y="296" text-anchor="middle" class="g">Hugging Face・Perplexity</text>
<text x="480" y="322" text-anchor="middle" class="b">Pick · Route</text>
<text x="300" y="307" text-anchor="end" class="g">No LLM</text>
<text x="660" y="307" class="g a">Routes</text>
<g fill="var(--card)" stroke="var(--grey)" stroke-width="2">
<circle cx="240" cy="430" r="18"/><circle cx="400" cy="430" r="18"/><circle cx="560" cy="430" r="18"/><circle cx="720" cy="430" r="18"/>
</g>
<g text-anchor="middle" class="b">
<text x="240" y="478">Devs</text><text x="400" y="478">Devs</text><text x="560" y="478">User</text><text x="720" y="478">User</text>
</g>
<text x="480" y="530" text-anchor="middle" class="k">Middlemen decide</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The order block extends through 2027, affected revenue falls in 2028 to 2029, and an arrow pulls the future back to the present.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/>
    </marker>
  </defs>
  <text class="t" x="60" y="72">Switch</text>
  <rect x="100" y="210" width="330" height="56" rx="10" fill="var(--accent)"/>
  <text class="g" x="120" y="246" fill="var(--page)">Construction backlog</text>
  <rect x="560" y="210" width="320" height="56" rx="10" fill="var(--warn)"/>
  <text class="g" x="580" y="246" fill="var(--page)">Permit stall = revenue gap</text>
  <line x1="100" y1="360" x2="900" y2="360" stroke="var(--line)" stroke-width="4"/>
  <line x1="130" y1="348" x2="130" y2="372" stroke="var(--dim)" stroke-width="3"/>
  <line x1="390" y1="348" x2="390" y2="372" stroke="var(--dim)" stroke-width="3"/>
  <line x1="620" y1="348" x2="620" y2="372" stroke="var(--dim)" stroke-width="3"/>
  <line x1="850" y1="348" x2="850" y2="372" stroke="var(--dim)" stroke-width="3"/>
  <text class="b" x="100" y="400">2026</text>
  <text class="b" x="360" y="400">2027</text>
  <text class="b" x="590" y="400">2028</text>
  <text class="b" x="820" y="400">2029</text>
  <path d="M700 450 L180 450" fill="none" stroke="var(--warn)" stroke-width="4" marker-end="url(#ar1)"/>
  <text class="g" x="360" y="438" fill="var(--warn)">Market reacts early</text>
  <text class="c" x="60" y="510">Distant gap, near-term drop</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On one axis: a fifty-year bar, a twelve-month block, and a chain of small blocks.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
.ttl{font-size:27px;font-weight:700}
.grp{font-size:20px;font-weight:700}
.bdy{font-size:16px;fill:var(--dim)}
.cnc{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="ttl" x="60" y="62">Horizon</text>

<text class="grp" x="60" y="146">Buy</text>
<rect x="200" y="124" width="680" height="30" rx="4" fill="var(--accent)"/>
<text class="bdy" x="208" y="186">50-yr service</text>

<text class="grp" x="60" y="276">Gear</text>
<rect x="200" y="254" width="14" height="30" rx="2" fill="var(--warn)"/>
<text class="bdy" x="230" y="276">Stale in 12 mo</text>

<text class="grp" x="60" y="386">Other</text>
<g fill="var(--grey)">
<rect x="200" y="364" width="14" height="30" rx="2"/>
<rect x="222" y="364" width="14" height="30" rx="2"/>
<rect x="244" y="364" width="14" height="30" rx="2"/>
<rect x="266" y="364" width="14" height="30" rx="2"/>
<rect x="288" y="364" width="14" height="30" rx="2"/>
<rect x="310" y="364" width="14" height="30" rx="2"/>
<rect x="332" y="364" width="14" height="30" rx="2"/>
<rect x="354" y="364" width="14" height="30" rx="2"/>
<rect x="376" y="364" width="14" height="30" rx="2"/>
<rect x="398" y="364" width="14" height="30" rx="2"/>
<rect x="420" y="364" width="14" height="30" rx="2"/>
<rect x="442" y="364" width="14" height="30" rx="2"/>
</g>
<text class="bdy" x="474" y="386">Pay+plant, 1yr</text>

<line x1="200" y1="432" x2="880" y2="432" stroke="var(--line)" stroke-width="2"/>
<text class="bdy" x="196" y="458">0</text>
<text class="bdy" x="852" y="458">50 yrs</text>

<text class="cnc" x="60" y="506">Years off, math off</text>
</svg>
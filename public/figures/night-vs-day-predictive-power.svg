<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="夜間血壓的預測能力柱高約為日間的六到七倍">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">預測心血管事件的能力</text>
<line x1="150" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="3"/>
<rect x="230" y="360" width="150" height="40" fill="var(--grey)"/>
<rect x="560" y="140" width="150" height="260" fill="var(--accent)"/>
<text class="g" x="240" y="340">日間</text>
<text class="g" x="570" y="120">夜間</text>
<text class="b" x="240" y="438">一</text>
<text class="b" x="570" y="438">六到七</text>
<text class="b" x="750" y="200">睡著的時候</text>
<text class="b" x="750" y="230">才量得到</text>
<text class="c" x="60" y="488">量不到的那一段，正是最會說話的那一段</text>
</svg>
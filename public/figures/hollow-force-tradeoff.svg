<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="自己只有無人機沒有地面部隊，對手兩樣都有，箭頭從地面空缺處穿過">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  .t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  .h{font-size:27px;font-weight:700;fill:var(--ink)}
  .g{font-size:19px;font-weight:700;fill:var(--ink)}
  .b{font-size:16px;fill:var(--dim)}
  .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--warn)"/></marker></defs>
<text class="t h" x="60" y="68">空心部隊</text>
<text class="t g" x="60" y="130">把陸軍賣掉換無人機</text>
<text class="t b" x="60" y="180">無人機</text>
<rect x="210" y="162" width="420" height="26" rx="4" fill="var(--accent)"/>
<text class="t b" x="60" y="232">地面部隊</text>
<rect x="210" y="214" width="34" height="26" rx="4" fill="var(--grey)"/>
<rect x="244" y="214" width="386" height="26" rx="4" fill="none" stroke="var(--warn)" stroke-dasharray="7 6"/>
<text class="t g" x="60" y="312">對手兩樣都留著</text>
<text class="t b" x="60" y="362">無人機</text>
<rect x="210" y="344" width="330" height="26" rx="4" fill="var(--accent)"/>
<text class="t b" x="60" y="414">地面部隊</text>
<rect x="210" y="396" width="330" height="26" rx="4" fill="var(--grey)"/>
<path d="M700 400 C780 400 820 300 800 240 L660 227" stroke="var(--warn)" stroke-width="2.5" marker-end="url(#a4)" fill="none"/>
<text class="t g" x="690" y="330" fill="var(--warn)">無人機被纏住</text>
<text class="t b" x="690" y="358">地面任他走</text>
<text class="t c" x="60" y="494">否定對手控地 ≠ 自己拿得到地</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊箭頭撞上一條線被彈回，右邊箭頭穿過一排愈來愈少的方格">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink)}
.ga{font-size:19px;fill:var(--accent)}
.gw{font-size:19px;fill:var(--warn)}
.b{font-size:15px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62">守一條線，還是花一筆錢</text>
<line x1="480" y1="110" x2="480" y2="430" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 6"/>
<text class="ga" x="70" y="140">守線</text>
<line x1="80" y1="250" x2="430" y2="250" stroke="var(--accent)" stroke-width="8"/>
<text class="b" x="80" y="232">宣布的底線</text>
<path d="M200 360 L200 268" stroke="var(--grey)" stroke-width="3"/>
<path d="M200 260 L193 276 L207 276 Z" fill="var(--grey)"/>
<path d="M320 268 C 320 320, 360 330, 380 370" fill="none" stroke="var(--grey)" stroke-width="3"/>
<path d="M384 380 L368 370 L380 362 Z" fill="var(--grey)"/>
<text class="b" x="150" y="405">撞上去就彈回</text>
<text class="b" x="150" y="429">可能不必動用</text>
<text class="gw" x="530" y="140">花錢</text>
<rect x="530" y="230" width="40" height="40" fill="var(--grey)" opacity="0.5"/>
<rect x="580" y="230" width="40" height="40" fill="var(--grey)" opacity="0.5"/>
<rect x="630" y="230" width="40" height="40" fill="var(--grey)" opacity="0.5"/>
<rect x="680" y="230" width="40" height="40" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="730" y="230" width="40" height="40" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="780" y="230" width="40" height="40" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="830" y="230" width="40" height="40" fill="none" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="530" y="215">彈藥</text>
<path d="M520 330 L860 330" stroke="var(--warn)" stroke-width="3"/>
<path d="M870 330 L854 323 L854 337 Z" fill="var(--warn)"/>
<text class="b" x="530" y="405">市場數得出來</text>
<text class="b" x="530" y="429">數完就穿過去</text>
<text class="c" x="60" y="500">線可以不花錢，錢會被數完</text>
</svg>
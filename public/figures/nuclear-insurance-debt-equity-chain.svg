<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="保險、債、股本三個互扣的環，最左邊新技術那一環斷開，整條鏈接不上">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">第一環扣不上，後面全空轉</text>

<ellipse cx="200" cy="270" rx="78" ry="52" fill="none" stroke="var(--warn)" stroke-width="12" stroke-dasharray="18 14"/>
<text class="t" x="200" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">新技術</text>
<text class="t" x="200" y="370" font-size="15" fill="var(--warn)" text-anchor="middle">承保方還沒學過</text>

<ellipse cx="380" cy="270" rx="78" ry="52" fill="none" stroke="var(--accent)" stroke-width="12"/>
<text class="t" x="380" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">保險</text>

<ellipse cx="530" cy="270" rx="78" ry="52" fill="none" stroke="var(--accent)" stroke-width="12"/>
<text class="t" x="530" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">債</text>

<ellipse cx="680" cy="270" rx="78" ry="52" fill="none" stroke="var(--accent)" stroke-width="12"/>
<text class="t" x="680" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">股本</text>

<ellipse cx="860" cy="270" rx="70" ry="52" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text class="t" x="860" y="278" font-size="19" fill="var(--ink)" text-anchor="middle">動土</text>

<text class="t" x="380" y="370" font-size="15" fill="var(--dim)" text-anchor="middle">已知量才扣得上</text>
<text class="t" x="860" y="370" font-size="15" fill="var(--dim)" text-anchor="middle">鏈完整才到這</text>

<text class="t" x="60" y="470" font-size="22" fill="var(--ink)">技術選擇因此是減法，不是加法</text>
</svg>
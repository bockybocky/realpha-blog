<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="價格線上漲途中多次加碼把平均成本線往上拉，價格回落後成本線高懸在上方">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">成本是一路往上堆的</text>
<rect x="60" y="96" width="840" height="330" rx="10" fill="var(--card)"/>
<line x1="110" y1="400" x2="860" y2="400" stroke="var(--line)" stroke-width="2"/>
<path d="M110 370 L240 320 L370 250 L500 170 L620 140 L700 200 L780 300 L860 356" stroke="var(--accent)" stroke-width="4" fill="none"/>
<circle cx="110" cy="370" r="8" fill="var(--accent)"/>
<circle cx="240" cy="320" r="8" fill="var(--accent)"/>
<circle cx="370" cy="250" r="8" fill="var(--accent)"/>
<circle cx="500" cy="170" r="8" fill="var(--accent)"/>
<circle cx="620" cy="140" r="8" fill="var(--accent)"/>
<text class="t" x="96" y="352" font-size="16" fill="var(--dim)">25 美元</text>
<text class="t" x="596" y="122" font-size="16" fill="var(--dim)">100 美元以上</text>
<path d="M110 362 L240 330 L370 300 L500 268 L620 250 L860 250" stroke="var(--warn)" stroke-width="4" stroke-dasharray="9 7" fill="none"/>
<text class="t" x="700" y="238" font-size="19" fill="var(--warn)">平均成本</text>
<text class="t" x="700" y="380" font-size="19" fill="var(--dim)">現價</text>
<text class="t" x="60" y="492" font-size="22" fill="var(--ink)">加在高處的那幾筆，決定你能等多久</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="很長的跑分條、很短的產能條，實際出貨被虛線截斷成與產能一樣短">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:19px;font-weight:600;fill:var(--dim)}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">決定出貨的是短的那一條</text>
<text class="g" x="280" y="184" text-anchor="end">產品跑分</text>
<rect x="300" y="150" width="560" height="48" rx="8" fill="var(--accent)"/>
<text class="g" x="280" y="274" text-anchor="end">拿得到的產能</text>
<rect x="300" y="240" width="150" height="48" rx="8" fill="var(--warn)"/>
<text class="g" x="280" y="364" text-anchor="end">實際出貨</text>
<rect x="300" y="330" width="150" height="48" rx="8" fill="var(--accent)" opacity="0.5"/>
<rect x="450" y="330" width="410" height="48" rx="8" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="450" y1="132" x2="450" y2="400" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="b" x="462" y="420">產能上限</text>
<text class="c" x="60" y="478">產品力和交付能力，是兩件事</text>
</svg>
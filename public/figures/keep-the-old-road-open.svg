<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="舊路留著而且加寬，箭頭從舊路彎向上方的新路">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.lb{font-size:19px;fill:var(--dim)}.sm{font-size:15px;fill:var(--dim)}.t{font-size:27px}.c{font-size:22px}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">舊路留著，新路才有人走</text>
<rect x="80" y="150" width="800" height="54" rx="10" fill="var(--accent)" opacity="0.28"/>
<rect x="80" y="150" width="800" height="54" rx="10" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="lb" x="104" y="186">數位：沙錢</text>
<rect x="80" y="330" width="800" height="78" rx="10" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<text class="lb" x="104" y="378">現金：留著，而且更好拿</text>
<path d="M520 330 C520 258 600 240 660 212" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polygon points="668,208 652,206 660,222" fill="var(--accent)"/>
<text class="sm" x="546" y="286">願意走進來</text>
<path d="M740 212 C740 262 700 300 660 326" fill="none" stroke="var(--grey)" stroke-width="5" stroke-dasharray="9 7"/>
<polygon points="654,330 670,330 662,314" fill="var(--grey)"/>
<text class="sm" x="756" y="286">隨時能退出</text>
<text class="c" x="60" y="476">退得出去，才有人願意走進來</text>
</svg>
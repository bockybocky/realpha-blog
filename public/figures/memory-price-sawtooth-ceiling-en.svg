<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The sawtooth line repeatedly falls and recovers but never rises above the dashed ceiling.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="40" y="58" font-size="27" fill="var(--ink)">It Recovers but Cannot Break Higher</text>

<line x1="80" y1="440" x2="910" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="80" y1="210" x2="910" y2="210" stroke="var(--grey)" stroke-width="2" stroke-dasharray="9 8"/>
<text x="910" y="196" font-size="19" fill="var(--dim)" text-anchor="end">Limited Upside</text>

<polyline points="100,258 180,370 300,276 380,384 500,288 580,392 700,292 780,398 900,300"
 fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="110" cy="252" r="7" fill="var(--warn)"/>
<circle cx="296" cy="272" r="7" fill="var(--warn)"/>
<circle cx="496" cy="284" r="7" fill="var(--warn)"/>
<circle cx="696" cy="288" r="7" fill="var(--warn)"/>
<text x="110" y="230" font-size="16" fill="var(--warn)" text-anchor="middle">News</text>
<text x="296" y="250" font-size="16" fill="var(--warn)" text-anchor="middle">News</text>
<text x="496" y="262" font-size="16" fill="var(--warn)" text-anchor="middle">News</text>
<text x="696" y="266" font-size="16" fill="var(--warn)" text-anchor="middle">News</text>

<text x="100" y="470" font-size="16" fill="var(--dim)">Start of Year</text>
<text x="900" y="470" font-size="16" fill="var(--dim)" text-anchor="end">Now</text>
<text x="480" y="504" font-size="22" fill="var(--ink)" text-anchor="middle">Further Upside Needs Growth or Capacity</text>
</svg>
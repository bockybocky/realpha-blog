      <path d="M 0 0 L 12 6 L 0 12 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <text x="480" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink)">Compressed to only what you have not seen</text>


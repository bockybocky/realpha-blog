    <circle cx="100" cy="257" r="8"/><circle cx="136" cy="257" r="8"/><circle cx="172" cy="257" r="8"/><circle cx="208" cy="257" r="8"/><circle cx="244" cy="257" r="8"/><circle cx="280" cy="257" r="8"/><circle cx="316" cy="257" r="8"/><circle cx="352" cy="257" r="8"/><circle cx="388" cy="257" r="8"/>
    <circle cx="100" cy="293" r="8"/><circle cx="136" cy="293" r="8"/><circle cx="172" cy="293" r="8"/><circle cx="208" cy="293" r="8"/><circle cx="244" cy="293" r="8"/><circle cx="280" cy="293" r="8"/><circle cx="316" cy="293" r="8"/><circle cx="352" cy="293" r="8"/><circle cx="388" cy="293" r="8"/>
    <circle cx="100" cy="329" r="8"/><circle cx="136" cy="329" r="8"/><circle cx="172" cy="329" r="8"/><circle cx="208" cy="329" r="8"/><circle cx="244" cy="329" r="8"/><circle cx="280" cy="329" r="8"/><circle cx="316" cy="329" r="8"/><circle cx="352" cy="329" r="8"/><circle cx="388" cy="329" r="8"/>

  <text x="510" y="332" text-anchor="middle" font-size="16" fill="var(--dim)">Drop what already appeared</text>

  <text x="620" y="232" font-size="19" fill="var(--accent)">Not yet seen 21</text>
  <rect x="620" y="250" width="300" height="140" rx="14" fill="var(--card)" stroke="var(--accent)"/>
  <g fill="var(--accent)">
    <circle cx="660" cy="290" r="8"/><circle cx="696" cy="290" r="8"/><circle cx="732" cy="290" r="8"/><circle cx="768" cy="290" r="8"/><circle cx="804" cy="290" r="8"/><circle cx="840" cy="290" r="8"/><circle cx="876" cy="290" r="8"/>

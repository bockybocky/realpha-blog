<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars stand side by side, with the right bar more than 30% shorter than the left; the removed section is labeled as a 1.6 trillion cut, and a lower dashed block on the right represents other estimates.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="70" y="70" font-size="27" fill="var(--ink)">Still a High Bar After Cuts (Illustrative)</text>
<line x1="120" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="3"/>
<rect x="160" y="160" width="150" height="280" rx="8" fill="var(--accent)" opacity="0.9"/>
<text x="178" y="474" font-size="19" fill="var(--ink)">Prior Version</text>
<rect x="410" y="255" width="150" height="185" rx="8" fill="var(--accent)"/>
<text x="440" y="474" font-size="19" fill="var(--ink)">After Cuts</text>
<rect x="410" y="160" width="150" height="95" rx="8" fill="var(--warn)" opacity="0.22"/>
<line x1="380" y1="160" x2="380" y2="255" stroke="var(--warn)" stroke-width="3"/>
<text x="596" y="196" font-size="19" fill="var(--ink)">Cut 1.6 Trillion</text>
<text x="596" y="222" font-size="16" fill="var(--warn)">Over 30%</text>
<rect x="700" y="378" width="190" height="62" rx="8" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 7"/>
<text x="716" y="416" font-size="19" fill="var(--dim)">Other Est.</text>
<text x="700" y="474" font-size="16" fill="var(--dim)">Lower, Not to Scale</text>
<text x="70" y="110" font-size="22" fill="var(--ink)">Deep Cut, Still a High Bar</text>
</svg>
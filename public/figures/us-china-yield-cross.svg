<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="美中長天期殖利率在 2020 年底交叉後反向拉開，右端缺口超過 350 個基點">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="40" y="58" font-size="27" font-weight="700" fill="var(--ink)">兩條線在 2020 年底交叉之後反向拉開</text>

<line x1="100" y1="420" x2="880" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="100" y1="110" x2="100" y2="420" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="54" y="150" font-size="15" fill="var(--dim)">6%</text>
<text class="t" x="54" y="300" font-size="15" fill="var(--dim)">3%</text>
<text class="t" x="110" y="448" font-size="15" fill="var(--dim)">2018</text>
<text class="t" x="400" y="448" font-size="15" fill="var(--dim)">2020</text>
<text class="t" x="830" y="448" font-size="15" fill="var(--dim)">2026</text>

<path d="M 110 300 L 230 320 L 350 360 L 430 368 L 560 250 L 700 190 L 870 170" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M 110 265 L 250 290 L 390 330 L 520 350 L 680 365 L 870 370" fill="none" stroke="var(--grey)" stroke-width="3"/>

<circle cx="430" cy="368" r="5" fill="var(--warn)"/>
<text class="t" x="356" y="398" font-size="15" fill="var(--warn)">交叉</text>

<line x1="890" y1="170" x2="890" y2="370" stroke="var(--ink)" stroke-width="2"/>
<line x1="884" y1="170" x2="896" y2="170" stroke="var(--ink)" stroke-width="2"/>
<line x1="884" y1="370" x2="896" y2="370" stroke="var(--ink)" stroke-width="2"/>

<text class="t" x="700" y="148" font-size="19" font-weight="700" fill="var(--accent)">美國 5.6%</text>
<text class="t" x="700" y="400" font-size="19" font-weight="700" fill="var(--dim)">中國 2%</text>
<text class="t" x="690" y="286" font-size="16" fill="var(--ink)">缺口 ＞350 個基點</text>

<text class="t" x="40" y="500" font-size="22" font-weight="700" fill="var(--ink)">誰比較安全，是市場現在才給的答案</text>
</svg>
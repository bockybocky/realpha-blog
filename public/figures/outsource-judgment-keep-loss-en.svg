<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Judgment moves from your box into the AI box while loss stays in your box unchanged.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>

  <text x="480" y="58" text-anchor="middle" font-size="27" fill="var(--ink)">Judgment can be sent away; losses cannot</text>

  <rect x="60" y="110" width="360" height="330" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="82" y="146" font-size="19" fill="var(--dim)">Before</text>
  <rect x="90" y="165" width="300" height="250" rx="12" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="112" y="197" font-size="20" fill="var(--ink)">You</text>
  <rect x="110" y="212" width="260" height="54" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="240" y="246" text-anchor="middle" font-size="20" fill="var(--ink)">Judgment</text>
  <rect x="110" y="288" width="260" height="54" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="240" y="322" text-anchor="middle" font-size="20" fill="var(--ink)">Losses</text>

  <text x="480" y="248" text-anchor="middle" font-size="16" fill="var(--dim)">Outsource</text>
  <line x1="435" y1="270" x2="508" y2="270" stroke="var(--dim)" stroke-width="3"/>
  <polygon points="505,258 532,270 505,282" fill="var(--dim)"/>

  <rect x="540" y="110" width="360" height="330" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="562" y="146" font-size="19" fill="var(--dim)">After</text>

  <rect x="570" y="165" width="300" height="110" rx="12" fill="var(--page)" stroke="var(--accent)" stroke-width="2"/>
  <text x="592" y="197" font-size="20" fill="var(--accent)">AI</text>
  <rect x="590" y="208" width="260" height="54" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="720" y="242" text-anchor="middle" font-size="20" fill="var(--ink)">Judgment</text>

  <rect x="570" y="300" width="300" height="115" rx="12" fill="var(--page)" stroke="var(--line)" stroke-width="2"/>
  <text x="592" y="332" font-size="20" fill="var(--ink)">You</text>
  <rect x="590" y="345" width="260" height="54" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="720" y="379" text-anchor="middle" font-size="20" fill="var(--ink)">Losses</text>

  <text x="480" y="490" text-anchor="middle" font-size="22" fill="var(--ink)">What left was judgment; what stayed was the loss</text>
</svg>
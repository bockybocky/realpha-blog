<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="On the left, a stack of solid-line blocks forms a list outsiders have something to check against; on the right, a dashed bag holds a few blurry blocks marked with question marks, with nothing to check against.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}
.g{font-size:20px;font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;font-weight:700}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62">Two states</text>
<rect x="48" y="100" width="408" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="78" y="142" fill="var(--accent)">In law</text>
<rect x="78" y="166" width="300" height="52" rx="6" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="98" y="199">USD</text>
<rect x="78" y="228" width="300" height="52" rx="6" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="98" y="261">HQLA</text>
<rect x="78" y="290" width="300" height="52" rx="6" fill="none" stroke="var(--accent)" stroke-width="3"/>
<text class="b" x="98" y="323">Named list</text>
<line x1="398" y1="192" x2="398" y2="316" stroke="var(--accent)" stroke-width="3"/>
<polygon points="390,316 398,340 406,316" fill="var(--accent)"/>
<text class="b" x="78" y="400">Checkable</text>
<rect x="504" y="100" width="408" height="340" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text class="g" x="534" y="142" fill="var(--warn)">A paper</text>
<path d="M 534 180 L 874 180 L 836 372 L 572 372 Z" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="9 7"/>
<rect x="596" y="216" width="112" height="46" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="724" y="236" width="112" height="46" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="638" y="292" width="112" height="46" rx="6" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="g" x="770" y="330" fill="var(--warn)">?</text>
<text class="b" x="612" y="246">Bag</text>
<text class="b" x="740" y="266">TBD</text>
<text class="b" x="654" y="322">Hazy</text>
<text class="b" x="534" y="400">Uncheckable</text>
<text class="c" x="60" y="500">Checkable outside, or no answer</text>
</svg>
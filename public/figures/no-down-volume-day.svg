<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="數線上今年的點落在 0，處於一塊標示為歷史從未進入的陰影區間內，右方另有歷來最少 5 天與平均 21 天兩個標記">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">今年還沒有出現過一次全面性的賣壓</text>
  <text x="60" y="96" font-size="16" fill="var(--dim)">單日成交量八成以上落在下跌方的天數</text>
  <rect x="140" y="212" width="120" height="100" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="150" y="196" font-size="16" fill="var(--warn)">歷史上沒有一年落在這裡</text>
  <line x1="140" y1="312" x2="880" y2="312" stroke="var(--line)" stroke-width="4"/>
  <circle cx="140" cy="312" r="11" fill="var(--warn)"/>
  <circle cx="260" cy="312" r="9" fill="var(--grey)"/>
  <circle cx="644" cy="312" r="9" fill="var(--accent)"/>
  <text x="140" y="288" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">0</text>
  <text x="260" y="288" font-size="20" font-weight="700" fill="var(--dim)" text-anchor="middle">5</text>
  <text x="644" y="288" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">21</text>
  <text x="140" y="352" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">今年</text>
  <text x="262" y="398" font-size="19" fill="var(--dim)" text-anchor="middle">歷來最少的一年</text>
  <line x1="260" y1="326" x2="260" y2="376" stroke="var(--grey)" stroke-width="2"/>
  <text x="644" y="352" font-size="19" fill="var(--accent)" text-anchor="middle">平均</text>
  <text x="480" y="466" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">不是漲多漲少的問題，是這一年的形狀本身很怪</text>
</svg>
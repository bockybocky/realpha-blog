<line x1="180" y1="480" x2="820" y2="480" stroke="var(--line)"/>
<line x1="180" y1="160" x2="180" y2="480" stroke="var(--dim)" stroke-width="2"/>
<text x="165" y="165" text-anchor="end" class="b d">$10</text>
<text x="165" y="245" text-anchor="end" class="b d">$9</text>
<text x="165" y="325" text-anchor="end" class="b d">$8</text>
<text x="165" y="405" text-anchor="end" class="b d">$7</text>
<text x="165" y="485" text-anchor="end" class="b d">$6</text>
<line x1="390" y1="182" x2="800" y2="182" stroke="var(--grey)" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="652" y1="199" x2="800" y2="199" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="800" y1="182" x2="800" y2="199" stroke="var(--dim)" stroke-width="2"/>
<text x="810" y="197" class="b d">差 0.21</text>
<path d="M392 272 C500 262 560 232 626 207" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#m4)"/>
<path d="M392 443 C520 420 600 320 634 214" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#m4)"/>
<circle cx="380" cy="182" r="9" fill="var(--grey)"/>
<circle cx="380" cy="277" r="9" fill="var(--grey)"/>
<circle cx="380" cy="447" r="9" fill="var(--grey)"/>
<circle cx="640" cy="199" r="11" fill="var(--accent)"/>
<text x="362" y="188" text-anchor="end" class="b">A 級 9.72</text>
<text x="362" y="283" text-anchor="end" class="b">B 級 8.54</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩排方向相反的箭頭，上排被劃掉，下排成立">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="64" font-size="27" font-weight="700" fill="var(--ink)">我以為的順序，跟實際相反</text>
<text x="60" y="140" font-size="19" font-weight="700" fill="var(--dim)">我原本以為</text>
<rect x="200" y="150" width="200" height="84" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="248" y="200" font-size="20" font-weight="700" fill="var(--dim)">揭露漂亮</text>
<line x1="410" y1="192" x2="530" y2="192" stroke="var(--grey)" stroke-width="4"/>
<path d="M546 192 l-18 -11 v22 z" fill="var(--grey)"/>
<rect x="556" y="150" width="200" height="84" rx="8" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="604" y="200" font-size="20" font-weight="700" fill="var(--dim)">所以有做</text>
<line x1="220" y1="235" x2="740" y2="150" stroke="var(--warn)" stroke-width="3"/>
<text x="60" y="352" font-size="19" font-weight="700" fill="var(--accent)">實際上</text>
<rect x="200" y="322" width="200" height="84" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="248" y="372" font-size="20" font-weight="700" fill="var(--ink)">平常在做</text>
<line x1="410" y1="364" x2="530" y2="364" stroke="var(--accent)" stroke-width="4"/>
<path d="M546 364 l-18 -11 v22 z" fill="var(--accent)"/>
<rect x="556" y="322" width="200" height="84" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="580" y="372" font-size="20" font-weight="700" fill="var(--ink)">才有得揭露</text>
<text x="60" y="482" font-size="22" font-weight="700" fill="var(--ink)">揭露是結果，不是工作</text>
</svg>
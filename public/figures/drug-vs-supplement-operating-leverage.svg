<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="橫軸為產品數，藥的單支分攤費用往下降、保健食品持平在高處的兩條折線">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="80" y="62">再多加一支產品，費用會不會被攤掉</text>
<rect x="80" y="100" width="800" height="320" fill="var(--card)"/>
<line x1="150" y1="150" x2="150" y2="380" stroke="var(--line)" stroke-width="2"/>
<line x1="150" y1="380" x2="860" y2="380" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="96" y="144">每支產品</text>
<text class="s" x="96" y="166">分攤的行銷</text>
<text class="s" x="700" y="408">產品數變多</text>
<line x1="200" y1="200" x2="420" y2="208" stroke="var(--warn)" stroke-width="4"/>
<line x1="420" y1="208" x2="640" y2="204" stroke="var(--warn)" stroke-width="4"/>
<line x1="640" y1="204" x2="820" y2="210" stroke="var(--warn)" stroke-width="4"/>
<line x1="200" y1="240" x2="420" y2="290" stroke="var(--accent)" stroke-width="4"/>
<line x1="420" y1="290" x2="640" y2="328" stroke="var(--accent)" stroke-width="4"/>
<line x1="640" y1="328" x2="820" y2="352" stroke="var(--accent)" stroke-width="4"/>
<circle cx="200" cy="200" r="7" fill="var(--warn)"/>
<circle cx="820" cy="210" r="7" fill="var(--warn)"/>
<circle cx="200" cy="240" r="7" fill="var(--accent)"/>
<circle cx="820" cy="352" r="7" fill="var(--accent)"/>
<text class="g" x="500" y="186">保健食品　客戶分散</text>
<text class="g" x="560" y="330">藥　同一批醫師與通路</text>
<polygon points="820,352 836,344 836,360" fill="var(--accent)"/>
<text class="c" x="80" y="470">沒有審批風險，但也沒有營運槓桿</text>
<text class="s" x="80" y="502">每一支都要給通路誘因、都要打廣告，比例壓不下來</text>
</svg>
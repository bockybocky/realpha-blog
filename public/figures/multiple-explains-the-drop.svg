<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="兩個等寬的方塊，左邊很高右邊很矮，底邊寬度完全一樣">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>
<text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">先去倍數裡找</text>
<text x="60" y="98" font-size="16" fill="var(--dim)">高＝本益比　寬＝每股盈餘　面積＝股價</text>
<line x1="80" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="180" y="150" width="170" height="280" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="265" y="136" font-size="19" fill="var(--accent)" text-anchor="middle">倍數 70</text>
<text x="265" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">當時</text>
<rect x="560" y="350" width="170" height="80" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="645" y="336" font-size="19" fill="var(--warn)" text-anchor="middle">倍數 20</text>
<text x="645" y="462" font-size="16" fill="var(--dim)" text-anchor="middle">現在</text>
<line x1="790" y1="430" x2="880" y2="430" stroke="var(--ink)" stroke-width="2"/>
<text x="835" y="410" font-size="16" fill="var(--ink)" text-anchor="middle">同寬</text>
<text x="480" y="506" font-size="22" fill="var(--ink)" text-anchor="middle">盈餘沒動，跌掉的是倍數</text>
</svg>
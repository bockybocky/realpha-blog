<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條時間線上三個已經看得見的事件在左邊，聯準會決策點在中間，正式公布的通膨數字在最右邊的灰色區塊裡">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="52" font-size="27" font-weight="700" fill="var(--ink)">動手的位置</text>

  <rect x="70" y="110" width="630" height="260" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="720" y="110" width="180" height="260" rx="14" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="385" y="146" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">已經看得到</text>
  <text x="810" y="146" font-size="19" font-weight="700" fill="var(--grey)" text-anchor="middle">還沒公布</text>

  <line x1="70" y1="300" x2="900" y2="300" stroke="var(--line)" stroke-width="3"/>

  <circle cx="160" cy="300" r="9" fill="var(--dim)"/>
  <text x="160" y="240" font-size="16" fill="var(--ink)" text-anchor="middle">輸油管</text>
  <text x="160" y="264" font-size="16" fill="var(--ink)" text-anchor="middle">遭攻擊</text>

  <circle cx="330" cy="300" r="9" fill="var(--dim)"/>
  <text x="330" y="240" font-size="16" fill="var(--ink)" text-anchor="middle">油價</text>
  <text x="330" y="264" font-size="16" fill="var(--ink)" text-anchor="middle">破百</text>

  <circle cx="520" cy="300" r="9" fill="var(--dim)"/>
  <text x="520" y="240" font-size="16" fill="var(--ink)" text-anchor="middle">零售汽油</text>
  <text x="520" y="264" font-size="16" fill="var(--ink)" text-anchor="middle">月增噴出</text>

  <line x1="650" y1="180" x2="650" y2="300" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
  <polygon points="650,316 636,288 664,288" fill="var(--warn)"/>
  <text x="650" y="170" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">升息</text>

  <circle cx="810" cy="300" r="9" fill="var(--grey)"/>
  <text x="810" y="240" font-size="16" fill="var(--grey)" text-anchor="middle">通膨數字</text>
  <text x="810" y="264" font-size="16" fill="var(--grey)" text-anchor="middle">十月中</text>

  <text x="480" y="412" font-size="16" fill="var(--dim)" text-anchor="middle">決策點在資料點的左邊</text>
  <text x="480" y="470" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">治未病，不治已病</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Data flows through three stops; the last is an unnamed dashed box whose policy cannot be read.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="60" font-size="27" font-weight="700" fill="var(--ink)">The data ends up somewhere with no name</text>

  <rect x="80" y="140" width="200" height="110" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="180" y="202" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">My chats</text>

  <line x1="290" y1="195" x2="370" y2="195" stroke="var(--accent)" stroke-width="3"/>
  <path d="M366 187 L 386 195 L 366 203 Z" fill="var(--accent)"/>

  <rect x="392" y="140" width="200" height="110" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="492" y="202" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">OpenCode</text>

  <line x1="602" y1="195" x2="682" y2="195" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M678 187 L 698 195 L 678 203 Z" fill="var(--accent)"/>

  <rect x="704" y="140" width="200" height="110" rx="10" fill="var(--page)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="t" x="804" y="212" font-size="44" font-weight="700" fill="var(--warn)" text-anchor="middle">?</text>

  <text class="t" x="180" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">Named</text>
  <text class="t" x="492" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">Named</text>
  <text class="t" x="804" y="300" font-size="16" font-weight="700" fill="var(--warn)" text-anchor="middle">Unnamed</text>

  <text class="t" x="60" y="358" font-size="16" font-weight="700" fill="var(--dim)">Privacy policy</text>
  <line x1="60" y1="372" x2="900" y2="372" stroke="var(--line)" stroke-width="2"/>
  <rect x="100" y="388" width="160" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="180" y="415" font-size="15" fill="var(--ink)" text-anchor="middle">Readable</text>
  <rect x="412" y="388" width="160" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="492" y="415" font-size="15" fill="var(--ink)" text-anchor="middle">Readable</text>
  <rect x="724" y="388" width="160" height="40" rx="6" fill="var(--page)" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
  <text class="t" x="804" y="415" font-size="15" fill="var(--grey)" text-anchor="middle">Blank</text>

  <text class="t" x="480" y="486" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">No name means no one to question</text>
</svg>
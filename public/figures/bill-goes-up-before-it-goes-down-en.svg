<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The power-bill curve rises and then eases down, and the turning point sits several years out on the time axis.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .d { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" font-weight="700">Pay up, save later</text>
<text class="d" x="60" y="94" font-size="16">Y = power bill</text>

<line x1="110" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="110" y1="130" x2="110" y2="440" stroke="var(--line)" stroke-width="2"/>

<path d="M 110 380 C 240 380 320 200 480 180 C 640 160 760 240 900 300" stroke="var(--warn)" stroke-width="5" fill="none"/>
<circle cx="480" cy="180" r="9" fill="var(--warn)"/>

<text class="t" x="188" y="282" font-size="19" font-weight="700">Gear, tariffs, fixes</text>
<text class="d" x="188" y="312" font-size="16">Rate base, then bills</text>

<text class="t" x="612" y="208" font-size="19" font-weight="700">After build</text>
<text class="d" x="612" y="238" font-size="16">GETs help here</text>

<line x1="480" y1="440" x2="480" y2="196" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="d" x="120" y="476" font-size="16">Passage</text>
<text class="t" x="420" y="476" font-size="19" font-weight="700" fill="var(--warn)">Yrs</text>
<text class="t" x="60" y="528" font-size="22" font-weight="700">Faster? Ask which part, which year</text>
</svg>
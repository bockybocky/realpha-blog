<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="取出能量比例的曲線一路上升，越過百分之百那條線之後進入不可能存在的區域">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:15px; fill:var(--dim); }
    .w { font-size:16px; fill:var(--warn); font-weight:700; }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56">垂降一塊磚，能取回多少</text>

  <rect x="90" y="96" width="790" height="76" rx="10" fill="var(--card)" stroke="var(--line)" stroke-dasharray="6 6"/>
  <text class="w" x="112" y="142">這一區憑空造出能量</text>

  <line x1="90" y1="172" x2="880" y2="172" stroke="var(--warn)" stroke-width="2"/>
  <text class="w" x="806" y="196">百分之百</text>

  <line x1="90" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
  <line x1="90" y1="120" x2="90" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="s" x="60" y="300" transform="rotate(-90 60 300)" text-anchor="middle">取回比例</text>

  <path d="M150 434 Q330 424 470 372 T660 172" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <path d="M660 172 Q740 138 850 118" stroke="var(--warn)" stroke-width="4" stroke-dasharray="8 7" fill="none"/>

  <circle cx="150" cy="434" r="6" fill="var(--accent)"/>
  <circle cx="330" cy="424" r="6" fill="var(--accent)"/>
  <circle cx="470" cy="372" r="6" fill="var(--accent)"/>
  <circle cx="660" cy="172" r="7" fill="var(--accent)"/>
  <text class="s" x="150" y="470" text-anchor="middle">地球表面</text>
  <text class="s" x="330" y="470" text-anchor="middle">太陽表面</text>
  <text class="s" x="470" y="470" text-anchor="middle">白矮星</text>
  <text class="s" x="660" y="470" text-anchor="middle">視界</text>
  <text class="s" x="770" y="470" text-anchor="middle">公式繼續外推</text>

  <text class="c" x="60" y="524">數字荒謬，代表壞掉的是理論不是數字</text>
</svg>
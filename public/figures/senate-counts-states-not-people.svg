<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="面積懸殊的兩個州方塊，各自對應兩個同樣大小的參議院席次格">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
</defs>
<text class="t" x="60" y="56" font-size="27" fill="var(--ink)" font-weight="700">參議院算的是州的數目，不是人的數目</text>
<text class="t" x="80" y="112" font-size="19" fill="var(--dim)">州的人口</text>
<text class="t" x="620" y="112" font-size="19" fill="var(--dim)">參議院席次</text>
<rect x="80" y="134" width="250" height="186" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="205" y="236" font-size="19" fill="var(--ink)" text-anchor="middle">人口大州</text>
<rect x="80" y="352" width="250" height="52" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="205" y="385" font-size="16" fill="var(--ink)" text-anchor="middle">堪薩斯、愛荷華</text>
<path d="M350,227 L590,227" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#a2)"/>
<path d="M350,378 L590,378" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#a2)"/>
<rect x="620" y="192" width="120" height="70" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="680" y="235" font-size="19" fill="var(--ink)" text-anchor="middle">1 席</text>
<rect x="760" y="192" width="120" height="70" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="820" y="235" font-size="19" fill="var(--ink)" text-anchor="middle">1 席</text>
<rect x="620" y="343" width="120" height="70" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="680" y="386" font-size="19" fill="var(--ink)" text-anchor="middle">1 席</text>
<rect x="760" y="343" width="120" height="70" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="t" x="820" y="386" font-size="19" fill="var(--ink)" text-anchor="middle">1 席</text>
<text class="t" x="80" y="474" font-size="22" fill="var(--ink)" font-weight="700">面積差很多，票數一樣</text>
</svg>
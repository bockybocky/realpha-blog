<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="五根年度產能長條，底部已鎖定比例從2027年的大半逐年降低到2031年仍有一段；下方箭頭從猜需求指向讀合約">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--accent); }
    .a { fill:var(--accent); }
</style>
<defs>
<marker id="f5a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
</defs>
<text x="60" y="52" class="t">未來幾年的產能，先被合約買走</text>
<rect x="300" y="98" width="18" height="18" fill="var(--accent)"/>
<text x="326" y="113" class="b">已被長約鎖走</text>
<rect x="480" y="98" width="18" height="18" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<text x="506" y="113" class="b">還沒定</text>
<rect x="175" y="150" width="90" height="260" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="175" y="215" width="90" height="195" fill="var(--accent)"/>
<rect x="315" y="150" width="90" height="260" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="315" y="228" width="90" height="182" fill="var(--accent)"/>
<rect x="455" y="150" width="90" height="260" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="455" y="293" width="90" height="117" fill="var(--accent)" opacity="0.8"/>
<rect x="595" y="150" width="90" height="260" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="595" y="319" width="90" height="91" fill="var(--accent)" opacity="0.65"/>
<rect x="735" y="150" width="90" height="260" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="735" y="345" width="90" height="65" fill="var(--accent)" opacity="0.5"/>
<text x="220" y="438" class="g" text-anchor="middle">2027</text>
<text x="360" y="438" class="g" text-anchor="middle">2028</text>
<text x="500" y="438" class="g" text-anchor="middle">2029</text>
<text x="640" y="438" class="g" text-anchor="middle">2030</text>
<text x="780" y="438" class="g" text-anchor="middle">2031</text>
<text x="880" y="438" class="d" text-anchor="end">比例示意</text>
<text x="190" y="525" class="d">不確定性</text>
<text x="380" y="527" class="g d" text-anchor="middle">猜需求</text>
<line x1="440" y1="520" x2="560" y2="520" stroke="var(--accent)" stroke-width="4" marker-end="url(#f5a)"/>
<text x="630" y="528" class="c" text-anchor="middle">讀合約</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A capacity bar half filled, the filled half already exported and the empty half not yet released.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); font-weight:700; }
    .bdy { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="ttl" x="60" y="62">Exports are already huge, and capacity is not full</text>
  <line x1="110" y1="160" x2="870" y2="160" stroke="var(--line)" stroke-width="2"/>
  <line x1="110" y1="150" x2="110" y2="170" stroke="var(--line)" stroke-width="2"/>
  <line x1="870" y1="150" x2="870" y2="170" stroke="var(--line)" stroke-width="2"/>
  <text class="bdy" x="490" y="142" text-anchor="middle">Domestic capacity 10m vehicles</text>
  <rect x="110" y="200" width="760" height="110" fill="var(--card)" stroke="var(--line)" stroke-width="1"/>
  <rect x="110" y="200" width="380" height="110" fill="var(--accent)"/>
  <text class="grp" x="136" y="263" fill="var(--page)">Exported 5m</text>
  <text class="grp" x="846" y="263" text-anchor="end" fill="var(--dim)">Not yet released</text>
  <line x1="110" y1="340" x2="490" y2="340" stroke="var(--grey)" stroke-width="2"/>
  <line x1="110" y1="332" x2="110" y2="348" stroke="var(--grey)" stroke-width="2"/>
  <line x1="490" y1="332" x2="490" y2="348" stroke="var(--grey)" stroke-width="2"/>
  <text class="bdy" x="300" y="374" text-anchor="middle">Already past Japan and Germany</text>
  <text class="bdy" x="870" y="374" text-anchor="end">Record scale</text>
  <text class="end" x="60" y="462">The pressure is not fully released</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A gap bar sits above a segmented bar of supply fixes, which still leaves an unfilled gap at its right end.">
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; } .g { font-size:19px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); } .c { font-size:22px; font-weight:700; }
</style>
<text x="40" y="50" class="t">Filling gap (10k b/d)</text>
<text x="160" y="118" class="g">Gap</text>
<rect x="160" y="130" width="700" height="60" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text x="510" y="168" class="g" text-anchor="middle">2,000</text>
<text x="160" y="258" class="g">Filled</text>
<rect x="160" y="270" width="70" height="60" fill="var(--accent)"/>
<rect x="230" y="270" width="105" height="60" fill="var(--accent)" fill-opacity="0.75"/>
<rect x="335" y="270" width="193" height="60" fill="var(--accent)" fill-opacity="0.5"/>
<rect x="528" y="270" width="157" height="60" fill="var(--accent)" fill-opacity="0.3"/>
<rect x="685" y="270" width="175" height="60" fill="var(--warn)" fill-opacity="0.25" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 5"/>
<line x1="195" y1="330" x2="195" y2="342" stroke="var(--grey)" stroke-width="2"/>
<text x="195" y="362" class="b" text-anchor="middle" style="fill:var(--ink)">Bypass 200</text>
<line x1="282" y1="330" x2="282" y2="382" stroke="var(--grey)" stroke-width="2"/>
<text x="282" y="402" class="b" text-anchor="middle" style="fill:var(--ink)">China cut 300</text>
<line x1="431" y1="330" x2="431" y2="342" stroke="var(--grey)" stroke-width="2"/>
<text x="431" y="362" class="b" text-anchor="middle" style="fill:var(--ink)">Stock draw 500–600</text>
<line x1="606" y1="330" x2="606" y2="382" stroke="var(--grey)" stroke-width="2"/>
<text x="606" y="402" class="b" text-anchor="middle" style="fill:var(--ink)">Strait</text>
<text x="772" y="362" class="g" text-anchor="middle" style="fill:var(--warn)">Short ~500</text>
<text x="480" y="470" class="b" text-anchor="middle">SPR ends Sep | Iran floating oil gone Oct</text>
<text x="480" y="550" class="c" text-anchor="middle">Still short ~500/d</text>
</svg>
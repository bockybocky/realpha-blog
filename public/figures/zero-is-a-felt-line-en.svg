<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The same vertical scale splits into two versions at zero: on the rulebook side a dashed passage lets you cross below, while on the perceived side a solid wall stops the line above zero.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">One zero, two feels</text>

  <rect x="60" y="92" width="400" height="368" rx="10" fill="var(--card)"/>
  <rect x="500" y="92" width="400" height="368" rx="10" fill="var(--card)"/>
  <text class="t" x="84" y="128" font-size="20" font-weight="700" fill="var(--dim)">Rules</text>
  <text class="t" x="524" y="128" font-size="20" font-weight="700" fill="var(--dim)">Felt</text>

  <path d="M240 170 L240 300" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"/>
  <path d="M680 170 L680 300" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"/>
  <text class="t" x="262" y="196" font-size="16" fill="var(--dim)">Bal</text>
  <text class="t" x="702" y="196" font-size="16" fill="var(--dim)">Bal</text>

  <line x1="110" y1="320" x2="410" y2="320" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="550" y1="320" x2="850" y2="320" stroke="var(--warn)" stroke-width="9"/>
  <text class="t" x="110" y="346" font-size="16" fill="var(--grey)">0</text>
  <text class="t" x="550" y="346" font-size="16" fill="var(--warn)">0</text>

  <path d="M240 312 L240 410" stroke="var(--accent)" stroke-width="6" stroke-dasharray="8 8"/>
  <path d="M240 424 l-14 -18 h28 z" fill="var(--accent)"/>
  <text class="t" x="262" y="400" font-size="16" fill="var(--dim)">Dip ok</text>

  <path d="M680 302 l-16 -20 h32 z" fill="var(--warn)"/>
  <text class="t" x="702" y="382" font-size="16" fill="var(--warn)">End</text>
  <text class="t" x="702" y="410" font-size="16" fill="var(--grey)">Regs</text>

  <text class="t" x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">Unwritten line is harder</text>
</svg>
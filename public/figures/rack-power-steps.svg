<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="機櫃功耗三階柱狀，第一階幾乎看不見，第三階高出數十倍">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .k { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">一個機櫃的功耗</text>
<line x1="120" y1="420" x2="900" y2="420" stroke="var(--line)" stroke-width="2"/>

<rect x="180" y="416" width="120" height="4" fill="var(--grey)"/>
<text class="g" x="180" y="398">七千瓦</text>
<text class="b" x="180" y="452">以前</text>

<rect x="420" y="364" width="120" height="56" fill="var(--accent)"/>
<text class="g" x="420" y="346">一百千瓦</text>
<text class="b" x="420" y="452">現在</text>

<rect x="660" y="140" width="120" height="280" fill="var(--accent)" opacity="0.35" stroke="var(--accent)"/>
<text class="g" x="660" y="122">五百千瓦</text>
<text class="b" x="660" y="452">有人這樣說</text>

<text class="k" x="120" y="500">變的不只是總量，還有它會抖</text>
</svg>
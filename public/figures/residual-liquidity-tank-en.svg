<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Tank diagram: one inflow and two outflows leave the real economy occupying most of the tank, with only a thin top layer remaining for stocks.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<text class="t" x="60" y="58">Stocks feed on the top layer</text>
<rect x="300" y="150" width="360" height="330" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<rect x="300" y="248" width="360" height="232" rx="0" fill="var(--grey)" opacity="0.55"/>
<rect x="300" y="212" width="360" height="36" fill="var(--accent)" opacity="0.8"/>
<text class="g" x="480" y="372" text-anchor="middle">Used by the real economy</text>
<text class="g" x="672" y="236" fill="var(--accent)">Residual</text>
<text class="b" x="672" y="260">Stocks rely on this layer</text>
<line x1="480" y1="96" x2="480" y2="146" stroke="var(--accent)" stroke-width="10"/>
<polygon points="480,152 468,132 492,132" fill="var(--accent)"/>
<text class="g" x="500" y="112">Money supply inflow</text>
<line x1="360" y1="482" x2="360" y2="534" stroke="var(--warn)" stroke-width="14"/>
<polygon points="360,540 346,518 374,518" fill="var(--warn)"/>
<line x1="600" y1="482" x2="600" y2="534" stroke="var(--warn)" stroke-width="20"/>
<polygon points="600,540 583,516 617,516" fill="var(--warn)"/>
<text class="g" x="140" y="520" fill="var(--warn)">Treasury issuance</text>
<text class="g" x="640" y="520" fill="var(--warn)">Mega-IPOs</text>
<text class="c" x="60" y="566">Thicker outflows, no matching inflow: the top layer dries first</text>
</svg>
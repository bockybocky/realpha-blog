<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊十二個空勾選格排成陣列，右邊一整塊已打包的區塊，右邊只需要做一次決定">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:20px;font-weight:600;fill:var(--ink)}
    .b{font-size:16px;fill:var(--dim)}
    .c{font-size:22px;font-weight:600;fill:var(--ink)}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="66">選項多，不等於自由</text>
<text class="g" x="255" y="124" text-anchor="middle">全部丟進選配表</text>
<rect x="100" y="150" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="216" y="150" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="332" y="150" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="206" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="216" y="206" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="332" y="206" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="262" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="216" y="262" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="332" y="262" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="318" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="216" y="318" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="332" y="318" width="100" height="40" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="112" y="162" width="14" height="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="228" y="162" width="14" height="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="344" y="162" width="14" height="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="112" y="218" width="14" height="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="228" y="218" width="14" height="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="344" y="218" width="14" height="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="112" y="274" width="14" height="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="228" y="274" width="14" height="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="344" y="274" width="14" height="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="112" y="330" width="14" height="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="228" y="330" width="14" height="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
<rect x="344" y="330" width="14" height="14" fill="none" stroke="var(--grey)" stroke-width="2"/>
<text class="b" x="255" y="396" text-anchor="middle">每一格都要決定一次</text>
<line x1="480" y1="140" x2="480" y2="380" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="705" y="124" text-anchor="middle">市場在意的先裝好</text>
<rect x="560" y="150" width="290" height="208" rx="10" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2.5"/>
<text class="g" x="705" y="248" text-anchor="middle">標配</text>
<text class="b" x="705" y="282" text-anchor="middle">不必逐項勾</text>
<text class="b" x="705" y="396" text-anchor="middle">只決定要不要這台車</text>
<text class="c" x="480" y="472" text-anchor="middle">差的不是錢，是心力</text>
</svg>
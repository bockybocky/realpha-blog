<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="訓練那一疊直通到底，推論那一疊中間多一層抽象層，底部分岔成兩種晶片">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .s { font-size:16px; fill:var(--ink); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text class="t" x="60" y="58">牆還在，擋得住的只剩訓練</text>
<text class="b" x="60" y="90">同一道 CUDA 牆，在兩段工作上的效力不一樣</text>

<text class="g" x="90" y="140">訓練</text>
<rect x="90" y="160" width="340" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="s" x="260" y="200" text-anchor="middle">模型程式碼</text>
<rect x="90" y="238" width="340" height="80" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="260" y="286" text-anchor="middle" fill="var(--accent)">CUDA</text>
<rect x="90" y="330" width="340" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="s" x="260" y="370" text-anchor="middle">NVIDIA GPU</text>
<text class="b" x="260" y="432" text-anchor="middle">換卡＝重寫六到八成</text>

<text class="g" x="530" y="140">推論</text>
<rect x="530" y="160" width="340" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="s" x="700" y="200" text-anchor="middle">模型程式碼</text>
<rect x="530" y="238" width="340" height="80" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text class="g" x="700" y="286" text-anchor="middle" fill="var(--warn)">vLLM 抽象層</text>
<rect x="530" y="330" width="163" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="s" x="611" y="370" text-anchor="middle">NVIDIA GPU</text>
<rect x="707" y="330" width="163" height="66" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="s" x="788" y="370" text-anchor="middle">TPU</text>
<text class="b" x="700" y="432" text-anchor="middle">換下面，上面不動</text>

<text class="c" x="480" y="524" text-anchor="middle">鬆動的是定價權，不是市佔</text>
</svg>
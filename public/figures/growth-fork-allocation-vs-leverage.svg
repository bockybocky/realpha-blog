<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="成長分出兩條岔路，一條經配置效率通向緩衝變厚，一條經槓桿堆疊通向反過來咬人">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">同一句「成長支撐韌性」，兩種走法</text>

<rect x="60" y="238" width="150" height="70" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text x="135" y="282" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">成長</text>

<path d="M210 262 C 290 262, 290 170, 370 170" fill="none" stroke="var(--accent)" stroke-width="5"/>
<path d="M210 284 C 290 284, 290 380, 370 380" fill="none" stroke="var(--warn)" stroke-width="5"/>

<rect x="370" y="134" width="210" height="72" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="475" y="178" font-size="19" font-weight="700" text-anchor="middle" fill="var(--accent)">配置效率</text>
<path d="M580 170 L648 170" stroke="var(--accent)" stroke-width="5"/>
<path d="M636 158 L658 170 L636 182" fill="var(--accent)"/>
<rect x="658" y="118" width="242" height="104" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="779" y="154" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">負債相對盈餘縮小</text>
<text x="779" y="186" font-size="19" font-weight="700" text-anchor="middle" fill="var(--accent)">緩衝變厚</text>

<rect x="370" y="344" width="210" height="72" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="475" y="388" font-size="19" font-weight="700" text-anchor="middle" fill="var(--warn)">槓桿堆疊</text>
<path d="M580 380 L648 380" stroke="var(--warn)" stroke-width="5"/>
<path d="M636 368 L658 380 L636 392" fill="var(--warn)"/>
<rect x="658" y="328" width="242" height="104" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
<text x="779" y="364" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">緩衝是借來的</text>
<text x="779" y="396" font-size="19" font-weight="700" text-anchor="middle" fill="var(--warn)">反過來咬人</text>

<text x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">分岔點不在結論，在成長怎麼來的</text>
</svg>
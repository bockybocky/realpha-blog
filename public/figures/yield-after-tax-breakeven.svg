<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條橫條比稅前與稅後長度，股票10%與私募信貸15%的稅後對齊同一條追平虛線，私募信貸12%明顯不到">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style></defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="62">同一個數字，課法不同就不同重量</text>
<text class="b" x="60" y="94">淺色＝帳面殖利率　深色＝稅後</text>
<line x1="620" y1="130" x2="620" y2="430" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>
<text class="g" x="636" y="146" fill="var(--warn)">追平線</text>
<text class="g" x="60" y="196" fill="var(--ink)">股票 10%</text>
<rect x="240" y="172" width="400" height="34" fill="var(--grey)" fill-opacity="0.45"/>
<rect x="240" y="172" width="380" height="34" fill="var(--accent)"/>
<text class="b" x="60" y="218">遞延</text>
<text class="g" x="60" y="296" fill="var(--ink)">私募信貸 12%</text>
<rect x="240" y="272" width="480" height="34" fill="var(--grey)" fill-opacity="0.45"/>
<rect x="240" y="272" width="288" height="34" fill="var(--warn)"/>
<text class="b" x="60" y="318">按所得課稅</text>
<text class="g" x="60" y="396" fill="var(--ink)">私募信貸 15%</text>
<rect x="240" y="372" width="600" height="34" fill="var(--grey)" fill-opacity="0.45"/>
<rect x="240" y="372" width="620" height="34" fill="var(--warn)" fill-opacity="0.55"/>
<rect x="240" y="372" width="620" height="34" fill="none" stroke="var(--line)" stroke-width="1"/>
<rect x="240" y="372" width="620" height="34" fill="var(--warn)" fill-opacity="0.0"/>
<rect x="240" y="372" width="620" height="34" fill="none"/>
<rect x="240" y="372" width="620" height="34" fill="var(--grey)" fill-opacity="0.0"/>
<rect x="240" y="372" width="620" height="0" fill="none"/>
<rect x="240" y="372" width="620" height="34" fill="none"/>
<rect x="240" y="372" width="620" height="34" fill="var(--warn)" fill-opacity="0.2"/>
<rect x="240" y="372" width="620" height="34" fill="none" stroke="var(--line)"/>
<rect x="240" y="372" width="620" height="34" fill="none"/>
<rect x="240" y="372" width="620" height="34" fill="none"/>
<rect x="240" y="372" width="380" height="34" fill="var(--warn)"/>
<text class="b" x="60" y="418">按所得課稅</text>
<text class="c" x="60" y="492">12% 看起來高，稅後不到 10%</text>
</svg>
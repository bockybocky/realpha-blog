<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩疊等高的報告，中間一個等號">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">兩個相反的立場，一樣厚</text>

<rect x="170" y="396" width="200" height="34" rx="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="170" y="356" width="200" height="34" rx="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="170" y="316" width="200" height="34" rx="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="170" y="276" width="200" height="34" rx="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="170" y="236" width="200" height="34" rx="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<rect x="170" y="196" width="200" height="34" rx="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>

<rect x="590" y="396" width="200" height="34" rx="4" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<rect x="590" y="356" width="200" height="34" rx="4" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<rect x="590" y="316" width="200" height="34" rx="4" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<rect x="590" y="276" width="200" height="34" rx="4" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<rect x="590" y="236" width="200" height="34" rx="4" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<rect x="590" y="196" width="200" height="34" rx="4" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>

<line x1="150" y1="196" x2="810" y2="196" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="480" y="300" font-size="40" fill="var(--dim)" text-anchor="middle">＝</text>
<text x="480" y="340" font-size="16" fill="var(--dim)" text-anchor="middle">說服力相同</text>

<text x="270" y="462" font-size="19" fill="var(--accent)" text-anchor="middle">多方</text>
<text x="690" y="462" font-size="19" fill="var(--warn)" text-anchor="middle">空方</text>

<text x="60" y="510" font-size="22" fill="var(--ink)">它提供彈藥，不提供立場</text>
</svg>
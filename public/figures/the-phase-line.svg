<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="上升曲線穿過一條垂直界線，左區是出事還能修，右區是出事就修不到">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="80" y="78">試錯法的界線</text>

  <rect x="80" y="110" width="480" height="300" rx="10" fill="var(--card)"/>
  <rect x="560" y="110" width="320" height="300" rx="10" fill="var(--card)"/>
  <line x1="560" y1="96" x2="560" y2="430" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 7"/>

  <path d="M90 395 C300 385 470 330 620 210 C700 148 760 130 870 122" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="560" cy="258" r="9" fill="var(--warn)"/>

  <text class="g" x="110" y="150">出事還活著</text>
  <text class="b" x="110" y="180">診斷、修好、往前走</text>
  <text class="b" x="110" y="208">補丁會收斂</text>

  <text class="g" x="590" y="150" fill="var(--warn)">出事後修不到</text>
  <text class="b" x="590" y="180">新型故障照樣冒出來</text>
  <text class="b" x="590" y="208">差別是它能先關掉你</text>

  <text class="b" x="80" y="452">往右 ＝ 能力</text>
  <text class="b" x="560" y="452" text-anchor="middle">那條線</text>

  <text class="c" x="80" y="500">反應式安全不是做得不好</text>
  <text class="c" x="80" y="532">是跨過這條線之後結構上不成立</text>
</svg>
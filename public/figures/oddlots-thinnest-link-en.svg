<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A chain runs from thick to thin, heavy and wide at the far left, thinner with each link to the right, and the rightmost link as fine as a hair with an arrow pointing it out.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="66" font-size="27" font-weight="700" fill="var(--ink)">Thinnest link first</text>
<ellipse cx="180" cy="260" rx="92" ry="66" fill="none" stroke="var(--accent)" stroke-width="26"/>
<ellipse cx="368" cy="260" rx="78" ry="56" fill="none" stroke="var(--accent)" stroke-width="16"/>
<ellipse cx="540" cy="260" rx="66" ry="48" fill="none" stroke="var(--accent)" stroke-width="9"/>
<ellipse cx="690" cy="260" rx="56" ry="40" fill="none" stroke="var(--accent)" stroke-width="5"/>
<ellipse cx="820" cy="260" rx="48" ry="34" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text x="180" y="156" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="middle">Pad</text>
<text x="820" y="160" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">No pad</text>
<polygon points="820,196 806,170 834,170" fill="var(--warn)"/>
<text x="180" y="376" font-size="16" fill="var(--dim)" text-anchor="middle">Cash</text>
<text x="180" y="404" font-size="16" fill="var(--dim)" text-anchor="middle">Absorbed</text>
<text x="820" y="376" font-size="16" fill="var(--warn)" text-anchor="middle">No-name</text>
<text x="820" y="404" font-size="16" fill="var(--warn)" text-anchor="middle">Hit</text>
<text x="500" y="440" font-size="16" fill="var(--dim)" text-anchor="middle">All eyes left</text>
<text x="80" y="492" font-size="22" font-weight="700" fill="var(--ink)">Trace the props down to the thinnest</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條長年緩緩下滑的價格線在最右端突然向上翹起，標示第三季上漲 17% 到 23%。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .n { font-size:34px; font-weight:700; fill:var(--ink); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="62">十多年的量漲價跌，這一次反過來</text>
  <text class="b" x="60" y="94">每單位容量的價格，方向換了邊</text>
  <path d="M60 400 L900 400" stroke="var(--line)" stroke-width="2"/>
  <path d="M60 196 L160 232 L260 256 L360 294 L460 312 L560 340 L660 356 L740 372" stroke="var(--grey)" stroke-width="4" fill="none"/>
  <path d="M740 372 L860 212" stroke="var(--accent)" stroke-width="6" fill="none"/>
  <circle cx="740" cy="372" r="7" fill="var(--grey)"/>
  <circle cx="860" cy="212" r="9" fill="var(--accent)"/>
  <text class="n" x="560" y="180" fill="var(--accent)">+17~23%</text>
  <text class="b" x="560" y="206">第三季，連三季上漲</text>
  <text class="b" x="60" y="436">過去十多年：要跟固態硬碟保持價差，只能把價格壓下去</text>
  <text class="b" x="60" y="460">連缺貨那幾年，報價依然偏向下跌</text>
  <text class="c" x="60" y="506">在這個產業，價格往上是罕見的那一格</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The left homepage panel is sparse and holds only links, while the right chapter-page panel is dense and holds the full course text.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">Which URL you paste changes this</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">Both say "ready", but they read different things</text>

<rect x="60" y="140" width="380" height="300" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="84" y="178" font-size="20" font-weight="700" fill="var(--warn)">Homepage</text>
<rect x="84" y="200" width="150" height="10" rx="5" fill="var(--grey)"/>
<rect x="84" y="228" width="186" height="10" rx="5" fill="var(--grey)"/>
<rect x="84" y="256" width="132" height="10" rx="5" fill="var(--grey)"/>
<rect x="84" y="284" width="170" height="10" rx="5" fill="var(--grey)"/>
<rect x="84" y="312" width="144" height="10" rx="5" fill="var(--grey)"/>
<text class="t" x="84" y="412" font-size="16" fill="var(--dim)">AI reads: the table of contents</text>

<rect x="520" y="140" width="380" height="300" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text class="t" x="544" y="178" font-size="20" font-weight="700" fill="var(--accent)">Chapter page</text>
<rect x="544" y="196" width="332" height="8" rx="4" fill="var(--accent)"/>
<rect x="544" y="212" width="310" height="8" rx="4" fill="var(--accent)"/>
<rect x="544" y="228" width="332" height="8" rx="4" fill="var(--accent)"/>
<rect x="544" y="244" width="290" height="8" rx="4" fill="var(--accent)"/>
<rect x="544" y="260" width="332" height="8" rx="4" fill="var(--accent)"/>
<rect x="544" y="276" width="318" height="8" rx="4" fill="var(--accent)"/>
<rect x="544" y="292" width="332" height="8" rx="4" fill="var(--accent)"/>
<rect x="544" y="308" width="276" height="8" rx="4" fill="var(--accent)"/>
<rect x="544" y="324" width="332" height="8" rx="4" fill="var(--accent)"/>
<rect x="544" y="340" width="304" height="8" rx="4" fill="var(--accent)"/>
<rect x="544" y="356" width="258" height="8" rx="4" fill="var(--accent)"/>
<text class="t" x="544" y="412" font-size="16" fill="var(--dim)">AI reads: about 3,600 words</text>

<text class="t" x="60" y="500" font-size="22" font-weight="700" fill="var(--ink)">"Ready" only means it read something; open it to see if it is the text</text>
</svg>
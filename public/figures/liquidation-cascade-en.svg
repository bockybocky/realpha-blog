<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A row of standing blocks toppling one after another from left to right like dominoes.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t h" x="60" y="66">The high-leverage chain</text>
  <text class="t b" x="60" y="100">A one or two tick move</text>

  <path d="M80 400 L900 400" stroke="var(--line)" stroke-width="3"/>

  <rect x="110" y="368" width="96" height="30" rx="5" fill="var(--warn)" transform="rotate(-78 110 398)"/>
  <rect x="200" y="356" width="104" height="30" rx="5" fill="var(--warn)" transform="rotate(-62 200 386)"/>
  <rect x="300" y="340" width="110" height="30" rx="5" fill="var(--warn)" transform="rotate(-44 300 370)"/>
  <rect x="408" y="300" width="30" height="100" rx="5" fill="var(--grey)" transform="rotate(-22 408 400)"/>
  <rect x="500" y="290" width="30" height="110" rx="5" fill="var(--accent)"/>
  <rect x="580" y="290" width="30" height="110" rx="5" fill="var(--accent)"/>
  <rect x="660" y="290" width="30" height="110" rx="5" fill="var(--accent)"/>
  <rect x="740" y="290" width="30" height="110" rx="5" fill="var(--accent)"/>
  <rect x="820" y="290" width="30" height="110" rx="5" fill="var(--accent)"/>

  <text class="t b" x="100" y="440">First one wiped out</text>
  <text class="t b" x="480" y="440">Still standing</text>
  <text class="t c" x="60" y="490">Those wiped out wipe out the next</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A long flat line close to the baseline, ending in a single towering bar.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="80" y="56" font-size="27" fill="var(--ink)">Silence comes due</text>

<line x1="120" y1="420" x2="890" y2="420" stroke="var(--line)" stroke-width="2"/>
<line x1="120" y1="412" x2="700" y2="412" stroke="var(--grey)" stroke-width="4"/>

<circle cx="180" cy="386" r="7" fill="var(--grey)"/>
<circle cx="264" cy="386" r="7" fill="var(--grey)"/>
<circle cx="348" cy="386" r="7" fill="var(--grey)"/>
<circle cx="432" cy="386" r="7" fill="var(--grey)"/>
<circle cx="516" cy="386" r="7" fill="var(--grey)"/>
<circle cx="600" cy="386" r="7" fill="var(--grey)"/>
<text x="180" y="358" font-size="15" fill="var(--dim)">Each unasked Q</text>

<rect x="760" y="150" width="90" height="270" fill="var(--warn)"/>
<text x="805" y="130" font-size="20" fill="var(--warn)" text-anchor="middle">Lands</text>

<text x="120" y="455" font-size="15" fill="var(--dim)">Visible cost</text>
<text x="80" y="492" font-size="22" fill="var(--ink)">Zero means not yet due</text>
</svg>
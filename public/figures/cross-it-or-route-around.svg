<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條路直撞牆停住，另一條路繞過牆抵達終點，繞路標示很貴">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style></defs>

<text x="70" y="62" font-size="27" font-weight="700" fill="var(--ink)">跨過去，還是繞過去</text>

<rect x="70" y="240" width="130" height="80" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="135" y="288" font-size="20" fill="var(--ink)" text-anchor="middle">模型</text>

<rect x="486" y="150" width="28" height="260" rx="4" fill="var(--warn)"/>
<text x="500" y="134" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">驗證直覺</text>

<line x1="208" y1="200" x2="470" y2="200" stroke="var(--warn)" stroke-width="4"/>
<line x1="452" y1="186" x2="470" y2="214" stroke="var(--warn)" stroke-width="3"/>
<text x="216" y="178" font-size="19" fill="var(--warn)">自己長出來</text>

<path d="M208 300 L300 300 L300 450 L700 450 L700 290 L790 290" fill="none" stroke="var(--accent)" stroke-width="4"/>
<polygon points="790,282 812,290 790,298" fill="var(--accent)"/>
<text x="316" y="480" font-size="19" fill="var(--accent)">接上 EDA 工具，反覆試</text>
<text x="700" y="424" font-size="16" fill="var(--warn)" text-anchor="middle">會很貴</text>

<rect x="820" y="250" width="110" height="80" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="875" y="286" font-size="18" fill="var(--ink)" text-anchor="middle">過關</text>

<text x="70" y="514" font-size="22" font-weight="700" fill="var(--ink)">兩條路的終點一樣，含意不一樣</text>
</svg>
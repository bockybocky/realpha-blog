<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="併購、私募信貸、壽險三個部門構成一個封閉的三角循環，同屬一家集團">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
</marker>
</defs>
<text x="48" y="58" font-size="27" fill="var(--ink)">飛輪：三個部門互相餵養</text>

<rect x="120" y="96" width="760" height="356" rx="16" fill="none" stroke="var(--line)" stroke-dasharray="6 5"/>
<text x="140" y="124" font-size="15" fill="var(--dim)">同一家私募股權集團</text>

<rect x="200" y="160" width="200" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="300" y="199" font-size="19" fill="var(--ink)" text-anchor="middle">併購部門</text>

<rect x="600" y="160" width="200" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="700" y="199" font-size="19" fill="var(--ink)" text-anchor="middle">私募信貸</text>

<rect x="400" y="356" width="200" height="64" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="500" y="395" font-size="19" fill="var(--ink)" text-anchor="middle">壽險公司</text>

<path d="M596,180 L406,180" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arB)"/>
<text x="500" y="164" font-size="15" fill="var(--dim)" text-anchor="middle">出這筆債</text>

<path d="M300,228 L418,352" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arB)"/>
<text x="248" y="300" font-size="15" fill="var(--dim)" text-anchor="end">產生貸款</text>

<path d="M598,352 L700,230" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arB)"/>
<text x="716" y="300" font-size="15" fill="var(--dim)">永久資本</text>

<text x="480" y="492" font-size="22" fill="var(--ink)" text-anchor="middle">繞一圈，回報壓力就消失了</text>
</svg>
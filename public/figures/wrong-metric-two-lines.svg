<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條同時上升的線，事件數與單次攻擊成本">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .d { font-size:16px; fill:var(--dim); }
    .a { font-size:19px; fill:var(--accent); }
    .m { font-size:19px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="68">兩條都在漲，只有一條量得到防守</text>

  <line x1="120" y1="420" x2="860" y2="420" stroke="var(--line)" stroke-width="2"/>
  <line x1="120" y1="120" x2="120" y2="420" stroke="var(--line)" stroke-width="2"/>
  <text class="d" x="120" y="452">時間</text>

  <polyline points="120,400 280,372 440,330 600,268 760,196" fill="none" stroke="var(--grey)" stroke-width="5"/>
  <text class="m" x="700" y="178">事件數</text>
  <text class="d" x="700" y="204">量不到防守</text>

  <polyline points="120,412 280,398 440,370 600,330 760,282" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <text class="a" x="520" y="470">單次攻擊成本</text>
  <text class="d" x="520" y="496">量得到防守</text>

  <text class="c" x="60" y="528">新聞變多，不等於守得變差</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Frontier research moves out of the circle that once held it, leaving two lines back to the cloud compute inside.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <defs>
    <marker id="cap-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <text x="60" y="66" font-size="27" font-weight="600" fill="var(--ink)">Not leaving, just standing somewhere else</text>

  <rect x="52" y="110" width="380" height="330" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="76" y="150" font-size="20" fill="var(--dim)">Before</text>
  <circle cx="242" cy="302" r="112" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text x="242" y="222" font-size="15" fill="var(--dim)" text-anchor="middle">One company</text>
  <rect x="152" y="248" width="180" height="44" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="242" y="276" font-size="16" fill="var(--ink)" text-anchor="middle">Cloud compute</text>
  <rect x="152" y="308" width="180" height="44" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="242" y="336" font-size="16" fill="var(--ink)" text-anchor="middle">Frontier research</text>

  <line x1="452" y1="300" x2="508" y2="300" stroke="var(--accent)" stroke-width="3" marker-end="url(#cap-f2)"/>

  <rect x="528" y="110" width="380" height="330" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="552" y="150" font-size="20" fill="var(--dim)">After</text>
  <circle cx="682" cy="326" r="100" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <rect x="602" y="304" width="160" height="44" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="682" y="332" font-size="16" fill="var(--ink)" text-anchor="middle">Cloud compute</text>

  <circle cx="842" cy="186" r="52" fill="var(--page)" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="842" y="182" font-size="15" fill="var(--ink)" text-anchor="middle">Frontier</text>
  <text x="842" y="204" font-size="15" fill="var(--ink)" text-anchor="middle">research</text>

  <line x1="806" y1="222" x2="742" y2="270" stroke="var(--dim)" stroke-width="2"/>
  <line x1="822" y1="236" x2="758" y2="284" stroke="var(--dim)" stroke-width="2"/>
  <text x="838" y="278" font-size="16" fill="var(--dim)" text-anchor="middle">Investor . tenant</text>

  <text x="60" y="510" font-size="22" font-weight="600" fill="var(--ink)">The risk moves out, the rent stays</text>
</svg>
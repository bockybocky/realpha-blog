<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two bars of equal length, each made of ninety percent grey and ten percent blue, showing that offline still accounts for ninety percent.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="80" y="66" font-size="27" font-weight="700" fill="var(--ink)">Once you lay out the denominator</text>

  <text x="80" y="148" font-size="20" font-weight="700" fill="var(--dim)">When Blockbuster was still open</text>
  <rect x="80" y="166" width="720" height="72" fill="var(--grey)"/>
  <rect x="800" y="166" width="80" height="72" fill="var(--accent)"/>
  <text x="80" y="268" font-size="16" fill="var(--dim)">Walking in to rent VHS and DVDs</text>
  <text x="880" y="268" font-size="16" text-anchor="end" fill="var(--accent)">Streaming</text>

  <text x="80" y="340" font-size="20" font-weight="700" fill="var(--dim)">Consumer finance today　$10T</text>
  <rect x="80" y="358" width="720" height="72" fill="var(--grey)"/>
  <rect x="800" y="358" width="80" height="72" fill="var(--accent)"/>
  <text x="80" y="460" font-size="16" fill="var(--dim)">Walking into a branch　90%</text>
  <text x="880" y="460" font-size="16" text-anchor="end" fill="var(--accent)">All neobanks combined　under 10%</text>

  <line x1="80" y1="498" x2="880" y2="498" stroke="var(--line)" stroke-width="2"/>
  <text x="80" y="536" font-size="22" font-weight="700" fill="var(--ink)">Migration is the start, not the end</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上排一條租約被切成已走過的一段與剩餘十三年的一段，下排是新簽租約一到二十年的區間條，右端超過十八點七五年的門檻線。">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">13 年是「還剩幾年」，不是新約有幾年</text>

  <text class="t" x="48" y="130" font-size="19" fill="var(--dim)">現有租約</text>
  <rect x="220" y="140" width="224" height="46" rx="4" fill="var(--card)" stroke="var(--line)"/>
  <rect x="444" y="140" width="416" height="46" rx="4" fill="var(--accent)"/>
  <text class="t" x="232" y="170" font-size="16" fill="var(--dim)">已走過</text>
  <text class="t" x="456" y="170" font-size="16" fill="var(--page)">剩餘 13 年　← 年報講的平均</text>

  <text class="t" x="48" y="300" font-size="19" fill="var(--dim)">未來新簽</text>
  <rect x="252" y="310" width="608" height="46" rx="4" fill="var(--accent)" opacity="0.7"/>
  <text class="t" x="264" y="340" font-size="16" fill="var(--page)">租期 1 到 20 年</text>
  <line x1="820" y1="296" x2="820" y2="370" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="t" x="820" y="288" font-size="15" fill="var(--warn)" text-anchor="middle">18.75 年門檻</text>
  <text class="t" x="860" y="396" font-size="16" fill="var(--warn)" text-anchor="end">19、20 年仍可能是融資租賃</text>

  <line x1="220" y1="430" x2="860" y2="430" stroke="var(--line)"/>
  <text class="t" x="220" y="454" font-size="15" fill="var(--dim)">0 年</text>
  <text class="t" x="860" y="454" font-size="15" fill="var(--dim)" text-anchor="end">25 年</text>
  <text class="t" x="48" y="506" font-size="22" font-weight="700" fill="var(--ink)">所以財務長說「較多」，不是「全部」</text>
</svg>
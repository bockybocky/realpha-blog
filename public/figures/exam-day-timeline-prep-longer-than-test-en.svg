<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="A to-scale timeline: two preparation segments totalling sixty minutes on the left are longer than the forty-five minute answering segment on the right." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="500" fill="var(--page)"/>

<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">The hour before you start</text>

<g stroke="var(--grey)" stroke-width="2" fill="none">
<path d="M60 196 L60 182 L540 182 L540 196"/>
</g>
<text x="300" y="166" font-size="19" font-weight="700" text-anchor="middle" fill="var(--dim)">Prep 60 min</text>
<g stroke="var(--accent)" stroke-width="2" fill="none">
<path d="M540 196 L540 182 L900 182 L900 196"/>
</g>
<text x="720" y="166" font-size="19" font-weight="700" text-anchor="middle" fill="var(--accent)">Exam 45 min</text>

<rect x="60" y="240" width="240" height="72" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="180" y="272" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Test gear</text>
<text x="180" y="296" font-size="15" text-anchor="middle" fill="var(--dim)">Learn the exam app</text>

<rect x="300" y="240" width="240" height="72" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="420" y="272" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Check-in</text>
<text x="420" y="296" font-size="15" text-anchor="middle" fill="var(--dim)">Six photos, room scan</text>

<rect x="540" y="240" width="360" height="72" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="720" y="272" font-size="19" font-weight="700" text-anchor="middle" fill="var(--accent)">Answering</text>
<text x="720" y="296" font-size="15" text-anchor="middle" fill="var(--dim)">43 questions</text>

<g stroke="var(--line)" stroke-width="2">
<line x1="60" y1="312" x2="60" y2="336"/>
<line x1="300" y1="312" x2="300" y2="336"/>
<line x1="540" y1="312" x2="540" y2="344"/>
<line x1="900" y1="312" x2="900" y2="336"/>
</g>
<text x="60" y="362" font-size="16" fill="var(--dim)">60 min before</text>
<text x="300" y="362" font-size="16" text-anchor="middle" fill="var(--dim)">30 min before</text>
<text x="540" y="370" font-size="16" font-weight="700" text-anchor="middle" fill="var(--accent)">Start</text>
<text x="900" y="362" font-size="16" text-anchor="end" fill="var(--dim)">End</text>

<text x="480" y="442" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">The prep runs longer than the exam</text>
</svg>
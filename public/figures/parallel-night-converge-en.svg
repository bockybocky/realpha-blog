<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Four concurrent job blocks on the left converge along curves into one review node, one of them marked as reassigned midway." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<defs>
  <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
  </marker>
</defs>

<text x="60" y="54" font-size="27" fill="var(--ink)">Four running at once, converging on one person</text>
<text x="80" y="92" font-size="15" fill="var(--dim)">The same night</text>

<rect x="80" y="110" width="300" height="64" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="100" y="149" font-size="16" fill="var(--ink)">Pipeline refactor . 27 min</text>

<rect x="80" y="190" width="300" height="64" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<text x="100" y="229" font-size="16" fill="var(--ink)">Export . 236 files</text>
<text x="360" y="229" font-size="15" fill="var(--warn)" text-anchor="end">Reassigned</text>

<rect x="80" y="270" width="300" height="64" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="100" y="309" font-size="16" fill="var(--ink)">Collector scripts . 3</text>

<rect x="80" y="350" width="300" height="64" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="100" y="389" font-size="16" fill="var(--ink)">Schedule rework . 144 tasks</text>

<path d="M380,142 C520,142 560,262 686,262" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arwC)"/>
<path d="M380,222 C520,222 560,262 686,262" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arwC)"/>
<path d="M380,302 C520,302 560,262 686,262" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arwC)"/>
<path d="M380,382 C520,382 560,262 686,262" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arwC)"/>

<rect x="700" y="207" width="190" height="110" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="795" y="250" font-size="20" fill="var(--accent)" text-anchor="middle">Review</text>
<text x="795" y="284" font-size="15" fill="var(--dim)" text-anchor="middle">Only one person</text>

<text x="480" y="480" font-size="22" fill="var(--ink)" text-anchor="middle">You can add lines; the bottleneck is review</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two bars compared by height: the 2023 revenue stands well above the dashed financing line, while the trailing-twelve-month revenue is only a stub below it.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="60" font-size="27" font-weight="700" fill="var(--ink)">Unit revenue against the financing line</text>
  <text class="t" x="60" y="92" font-size="16" fill="var(--dim)">USD per kW</text>

  <line x1="120" y1="470" x2="880" y2="470" stroke="var(--line)" stroke-width="2"/>

  <rect x="200" y="140" width="150" height="330" rx="4" fill="var(--accent)" opacity="0.85"/>
  <text class="t" x="275" y="124" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">200</text>
  <text class="t" x="275" y="500" font-size="19" text-anchor="middle" fill="var(--dim)">2023</text>

  <rect x="600" y="420" width="150" height="50" rx="4" fill="var(--grey)"/>
  <text class="t" x="675" y="404" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">30</text>
  <text class="t" x="675" y="500" font-size="19" text-anchor="middle" fill="var(--dim)">Trailing 12 months</text>

  <line x1="120" y1="305" x2="880" y2="305" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
  <text class="t" x="880" y="292" font-size="19" font-weight="700" text-anchor="end" fill="var(--warn)">Financing line 100</text>
</svg>
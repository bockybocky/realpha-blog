<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="兩個同樣大的圓分開放著，中間留一道空隙，沒有交集">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:19px; font-weight:700; fill:var(--dim); }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--dim); }
</style>
<text class="t" x="60" y="56">兩套說法，量的是不同的東西</text>
<circle cx="290" cy="300" r="166" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<circle cx="690" cy="300" r="166" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="290" y="248" text-anchor="middle">上游瓶頸論述</text>
<text class="b" x="290" y="300" text-anchor="middle">量：基板缺不缺</text>
<text class="b" x="290" y="334" text-anchor="middle">量：誰握原料</text>
<text class="g" x="690" y="248" text-anchor="middle">恐慌籃子</text>
<text class="b" x="690" y="300" text-anchor="middle">量：跌幅與空單</text>
<text class="b" x="690" y="334" text-anchor="middle">量：反彈力道</text>
<line x1="490" y1="190" x2="490" y2="410" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="s" x="490" y="168" text-anchor="middle">沒有交集</text>
<text class="c" x="60" y="494">一邊漲了，推不出另一邊成立</text>
</svg>
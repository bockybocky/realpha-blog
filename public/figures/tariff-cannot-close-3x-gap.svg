<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩根長條：中國進口的短長條加上一小段關稅，仍遠低於美國自己做的長條；美國那根即使人工能源歸零仍高三倍，中間是一大段缺口。">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.t{font-size:27px;font-weight:700}.g{font-size:20px;font-weight:700}.b{font-size:16px}.d{font-size:15px;fill:var(--dim)}.c{font-size:22px;font-weight:700;fill:var(--accent)}
.w{fill:var(--page)}.a{fill:var(--accent)}.wa{fill:var(--warn)}
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="40" y="56" class="t">人工和能源歸零，仍是三倍</text>
<line x1="140" y1="460" x2="820" y2="460" stroke="var(--line)" stroke-width="2"/>
<rect x="220" y="360" width="160" height="100" fill="var(--grey)"/>
<rect x="220" y="325" width="160" height="35" fill="var(--warn)"/>
<text x="210" y="348" text-anchor="end" class="b wa">關稅</text>
<text x="300" y="312" text-anchor="middle" class="g">×1</text>
<rect x="560" y="160" width="160" height="300" fill="var(--accent)"/>
<text x="640" y="148" text-anchor="middle" class="g a">×3</text>
<text x="640" y="222" text-anchor="middle" class="b w">人工＝0</text>
<text x="640" y="250" text-anchor="middle" class="b w">能源＝0</text>
<line x1="380" y1="160" x2="560" y2="160" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="470" y1="170" x2="470" y2="318" stroke="var(--warn)" stroke-width="3"/>
<polygon points="470,162 462,176 478,176" fill="var(--warn)"/>
<polygon points="470,324 462,310 478,310" fill="var(--warn)"/>
<text x="482" y="250" class="g wa">缺口</text>
<text x="300" y="490" text-anchor="middle" class="b">從中國進口</text>
<text x="640" y="490" text-anchor="middle" class="b">美國自己做</text>
<text x="820" y="532" text-anchor="end" class="d">比例為來賓自算，示意</text>
</svg>
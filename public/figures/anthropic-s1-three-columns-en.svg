<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three sets of bars compared: two rise sharply while one falls sharply.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--dim); }
    .v { font-size:16px; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<text class="h" x="480" y="52" text-anchor="middle">The three columns of the S-1</text>
<line x1="60" y1="460" x2="900" y2="460" stroke="var(--line)" stroke-width="2"/>
<line x1="340" y1="100" x2="340" y2="470" stroke="var(--line)" stroke-width="1" stroke-dasharray="5 6"/>
<line x1="640" y1="100" x2="640" y2="470" stroke="var(--line)" stroke-width="1" stroke-dasharray="5 6"/>
<rect x="110" y="340" width="70" height="120" fill="var(--grey)"/>
<rect x="222" y="164" width="70" height="296" fill="var(--accent)"/>
<text class="v" x="145" y="330" text-anchor="middle">47</text>
<text class="v" x="257" y="154" text-anchor="middle">116</text>
<text class="s" x="145" y="484">Q1</text>
<text class="s" x="257" y="484">Q2</text>
<text class="g" x="200" y="92" text-anchor="middle">Quarterly revenue ($100M)</text>
<rect x="400" y="436" width="70" height="24" fill="var(--grey)"/>
<rect x="512" y="160" width="70" height="300" fill="var(--accent)"/>
<text class="v" x="435" y="426" text-anchor="middle">950</text>
<text class="v" x="547" y="150" text-anchor="middle">11,900</text>
<text class="s" x="435" y="484">A year ago</text>
<text class="s" x="547" y="484">Now</text>
<text class="g" x="490" y="92" text-anchor="middle">$100k+/yr customers (cos.)</text>
<rect x="690" y="210" width="70" height="250" fill="var(--accent)"/>
<rect x="800" y="410" width="70" height="50" fill="var(--grey)"/>
<text class="v" x="725" y="200" text-anchor="middle">2.5</text>
<text class="v" x="835" y="400" text-anchor="middle">Under 0.5</text>
<text class="s" x="725" y="484">Last year</text>
<text class="s" x="835" y="484">Now</text>
<text class="g" x="775" y="92" text-anchor="middle">Compute cost per $1 rev</text>
<text class="c" x="480" y="534" text-anchor="middle">Volume up, unit cost down</text>
</svg>
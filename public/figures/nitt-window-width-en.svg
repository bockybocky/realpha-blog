<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Three bars of unequal length, with the window's boundary falling at the end of the shortest bar, and that end is blurred.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
    .w { font-size:19px; font-weight:700; fill:var(--warn); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="66">Window width = shortest bar</text>
  <rect x="240" y="130" width="560" height="54" rx="6" fill="var(--accent)" opacity="0.85"/>
  <text class="g" x="80" y="164">Qualification time</text>
  <text class="b" x="816" y="164">6-9 mo min</text>
  <rect x="240" y="216" width="470" height="54" rx="6" fill="var(--accent)" opacity="0.85"/>
  <text class="g" x="80" y="250">Motive to switch</text>
  <text class="b" x="726" y="250">Not worth the savings</text>
  <rect x="240" y="302" width="190" height="54" rx="6" fill="var(--warn)"/>
  <rect x="430" y="302" width="40" height="54" fill="var(--warn)" opacity="0.5"/>
  <rect x="470" y="302" width="40" height="54" fill="var(--warn)" opacity="0.25"/>
  <rect x="510" y="302" width="40" height="54" fill="var(--warn)" opacity="0.12"/>
  <text class="w" x="80" y="336">Will upstream</text>
  <text class="w" x="80" y="360">commoditize</text>
  <text class="b" x="566" y="336">No one can call it</text>
  <line x1="240" y1="110" x2="240" y2="420" stroke="var(--line)" stroke-width="3"/>
  <line x1="430" y1="110" x2="430" y2="420" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
  <text class="c" x="335" y="458" text-anchor="middle">Actual window width</text>
  <text class="b" x="640" y="458">Right part isn't yours</text>
</svg>
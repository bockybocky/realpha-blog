<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條上升線匯成一條，再分岔成產業與國家兩支">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  .t { font-size:27px; fill:var(--ink); }
  .g { font-size:20px; fill:var(--ink); }
  .b { font-size:16px; fill:var(--dim); }
  .c { font-size:22px; fill:var(--ink); }
</style>
<text class="t" x="60" y="62">三個循環指向同一條線</text>

<text class="g" x="60" y="150">景氣循環</text>
<path d="M200 140 C 330 132, 400 120, 470 250" stroke="var(--accent)" stroke-width="4" fill="none"/>
<text class="g" x="60" y="262">製造業循環</text>
<path d="M230 252 L 470 252" stroke="var(--accent)" stroke-width="4" fill="none"/>
<text class="g" x="60" y="372">生產力循環</text>
<path d="M230 362 C 350 368, 400 380, 470 256" stroke="var(--accent)" stroke-width="4" fill="none"/>

<path d="M470 252 L 640 252" stroke="var(--ink)" stroke-width="6" fill="none"/>
<path d="M640 252 C 700 252, 720 190, 800 186" stroke="var(--ink)" stroke-width="4" fill="none"/>
<path d="M640 252 C 700 252, 720 320, 800 324" stroke="var(--ink)" stroke-width="4" fill="none"/>
<text class="g" x="812" y="194">哪些產業</text>
<text class="g" x="812" y="332">哪些國家</text>

<text class="b" x="200" y="178">擴張</text>
<text class="b" x="230" y="292">主動補庫存</text>
<text class="b" x="230" y="402">人工智慧</text>

<text class="c" x="60" y="470">循環一反轉，整條線要重算</text>
</svg>
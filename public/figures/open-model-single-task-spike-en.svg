<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Bar chart of six tasks: the frontier model is tall in every category, while the specialized open-source model beats it only in forecasting earnings.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="56" font-size="27" font-weight="700" fill="var(--ink)">Open model: train one task, win it</text>
<rect x="90" y="94" width="16" height="16" rx="3" fill="var(--grey)"/>
<text x="114" y="108" font-size="16" fill="var(--dim)">Frontier</text>
<rect x="250" y="94" width="16" height="16" rx="3" fill="var(--accent)"/>
<text x="274" y="108" font-size="16" fill="var(--dim)">Open + one task (6–9 mo behind)</text>
<rect x="475" y="140" width="100" height="348" rx="10" fill="var(--card)"/>
<line x1="90" y1="450" x2="830" y2="450" stroke="var(--line)" stroke-width="2"/>
<rect x="110" y="240" width="36" height="210" fill="var(--grey)"/>
<rect x="154" y="330" width="36" height="120" fill="var(--accent)" opacity="0.45"/>
<rect x="235" y="250" width="36" height="200" fill="var(--grey)"/>
<rect x="279" y="340" width="36" height="110" fill="var(--accent)" opacity="0.45"/>
<rect x="360" y="235" width="36" height="215" fill="var(--grey)"/>
<rect x="404" y="325" width="36" height="125" fill="var(--accent)" opacity="0.45"/>
<rect x="485" y="245" width="36" height="205" fill="var(--grey)"/>
<rect x="529" y="180" width="36" height="270" fill="var(--accent)"/>
<rect x="610" y="240" width="36" height="210" fill="var(--grey)"/>
<rect x="654" y="335" width="36" height="115" fill="var(--accent)" opacity="0.45"/>
<rect x="735" y="250" width="36" height="200" fill="var(--grey)"/>
<rect x="779" y="330" width="36" height="120" fill="var(--accent)" opacity="0.45"/>
<text x="525" y="166" font-size="16" font-weight="700" text-anchor="middle" fill="var(--accent)">Beats it</text>
<text x="150" y="478" font-size="16" text-anchor="middle" fill="var(--ink)">Code</text>
<text x="275" y="478" font-size="16" text-anchor="middle" fill="var(--ink)">Xlate</text>
<text x="400" y="478" font-size="16" text-anchor="middle" fill="var(--ink)">Gist</text>
<text x="525" y="478" font-size="16" font-weight="700" text-anchor="middle" fill="var(--accent)">Earnings</text>
<text x="650" y="478" font-size="16" text-anchor="middle" fill="var(--ink)">Math</text>
<text x="775" y="478" font-size="16" text-anchor="middle" fill="var(--ink)">Q&amp;A</text>
<text x="480" y="545" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">Narrow, but top there</text>
</svg>
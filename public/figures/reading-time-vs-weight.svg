<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="閱讀時間欄與權重欄的長條次序對不上">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">這週讀了什麼，帳戶裡放了什麼</text>
<text x="60" y="124" font-size="20" fill="var(--dim)">閱讀時間</text>
<text x="620" y="124" font-size="20" fill="var(--dim)">帳戶權重</text>
<text x="420" y="200" font-size="19" fill="var(--ink)">最亮那檔</text>
<rect x="100" y="176" width="300" height="34" fill="var(--accent)"/>
<rect x="540" y="176" width="110" height="34" fill="var(--grey)"/>
<text x="420" y="290" font-size="19" fill="var(--ink)">次熱門</text>
<rect x="240" y="266" width="160" height="34" fill="var(--accent)"/>
<rect x="540" y="266" width="80" height="34" fill="var(--grey)"/>
<text x="420" y="380" font-size="19" fill="var(--ink)">沒人在談那檔</text>
<rect x="376" y="356" width="24" height="34" fill="var(--accent)"/>
<rect x="540" y="356" width="300" height="34" fill="var(--warn)"/>
<line x1="480" y1="150" x2="480" y2="420" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="486" font-size="22" fill="var(--ink)">沒有系統的時候，看的是螢幕上最亮的那一格</text>
<text x="60" y="518" font-size="16" fill="var(--dim)">長度示意，用你自己的清單對一次</text>
</svg>
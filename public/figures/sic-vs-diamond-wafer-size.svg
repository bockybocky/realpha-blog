<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上排碳化矽圓形由小到大一路長到十二吋大圓，下排鑽石只有一顆小圓，後面較大的圓只是虛線輪廓">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
    .ghost { fill:none; stroke:var(--grey); stroke-width:2; stroke-dasharray:5 5; }
</style>
<text x="60" y="64" class="t">尺寸＝量產訊號</text>
<text x="60" y="266" class="g">碳化矽</text>
<text x="270" y="205" text-anchor="middle" class="b">七八年前</text>
<circle cx="200" cy="260" r="16" fill="var(--grey)"/>
<circle cx="262" cy="260" r="24" fill="var(--grey)"/>
<circle cx="340" cy="260" r="32" fill="var(--grey)"/>
<text x="200" y="320" text-anchor="middle" class="b">2吋</text>
<text x="262" y="320" text-anchor="middle" class="b">3吋</text>
<text x="340" y="320" text-anchor="middle" class="b">4吋</text>
<text x="430" y="268" text-anchor="middle" class="g" style="fill:var(--dim)">⋯</text>
<text x="580" y="148" text-anchor="middle" class="b">今年展場</text>
<circle cx="580" cy="260" r="96" fill="var(--accent)"/>
<text x="580" y="268" text-anchor="middle" class="g" style="fill:var(--page)">12吋</text>
<text x="700" y="266" class="b">有人要大量用</text>
<line x1="60" y1="378" x2="900" y2="378" stroke="var(--line)" stroke-width="1.5"/>
<text x="60" y="456" class="g">鑽石</text>
<circle cx="200" cy="450" r="16" fill="var(--warn)"/>
<circle cx="262" cy="450" r="24" class="ghost"/>
<circle cx="340" cy="450" r="32" class="ghost"/>
<text x="430" y="458" text-anchor="middle" class="g" style="fill:var(--dim)">?</text>
<text x="480" y="446" class="g" style="fill:var(--warn)">長不大</text>
<text x="480" y="474" class="b">單價降不下來</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two lines, inventory value rising steeply and inventory days flat, with the gap marked as coming from unit price.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="80" y="76">Same goods, two readings</text>

<line x1="140" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>
<line x1="140" y1="110" x2="140" y2="400" stroke="var(--line)" stroke-width="2"/>

<polyline points="180,352 360,300 540,236 800,142" fill="none" stroke="var(--warn)" stroke-width="6"/>
<circle cx="800" cy="142" r="8" fill="var(--warn)"/>
<text class="g" x="812" y="136" fill="var(--warn)">Value</text>

<polyline points="180,352 360,344 540,350 800,338" fill="none" stroke="var(--accent)" stroke-width="6"/>
<circle cx="800" cy="338" r="8" fill="var(--accent)"/>
<text class="g" x="812" y="332" fill="var(--accent)">Days</text>

<line x1="700" y1="168" x2="700" y2="340" stroke="var(--dim)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="b" x="686" y="260" text-anchor="end">This part is price</text>

<text class="b" x="180" y="434">Last year</text>
<text class="b" x="800" y="434" text-anchor="middle">Now</text>

<text class="c" x="140" y="496">Value scares you, days show the pile</text>
</svg>
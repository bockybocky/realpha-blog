<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="四條來自不同方向的線收成一束穿過一個環，另一側成為一條通過的法案">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .ttl { font-size:27px; font-weight:700; }
    .lbl { font-size:16px; fill:var(--dim); }
    .grp { font-size:19px; font-weight:700; fill:var(--dim); }
    .cc { font-size:22px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t ttl" x="60" y="58">1957 年：把不相干的東西綁成一股</text>

  <g stroke="var(--accent)" stroke-width="5" fill="none">
    <path d="M70 120 C 300 120, 420 230, 560 262"/>
    <path d="M70 212 C 300 212, 440 250, 560 264"/>
    <path d="M70 320 C 300 320, 440 286, 560 268"/>
    <path d="M70 412 C 300 412, 420 306, 560 272"/>
  </g>
  <text class="t lbl" x="70" y="108">西部：一座水壩的表決</text>
  <text class="t lbl" x="70" y="200">中西部：罷工工人的權利</text>
  <text class="t lbl" x="70" y="356">溫和派：黑人擔任聯邦陪審員</text>
  <text class="t lbl" x="70" y="448">南方：選務官員由陪審團審</text>

  <ellipse cx="596" cy="266" rx="26" ry="54" fill="none" stroke="var(--ink)" stroke-width="5"/>
  <text class="t grp" x="566" y="178">七個月</text>
  <rect x="640" y="246" width="230" height="40" rx="6" fill="var(--accent)"/>
  <path d="M870 246 L906 266 L870 286 Z" fill="var(--accent)"/>
  <text class="t lbl" x="660" y="273" fill="var(--page)">法案通過，無人阻擋</text>

  <line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text class="t cc" x="60" y="512">看得見哪幾條能綁在一起，就是籌碼</text>
</svg>
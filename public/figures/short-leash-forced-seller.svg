<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條長度不同的垂直繩子放在跌幅刻度旁，短的那條在負五趴斷掉">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="80" y="56" font-size="27" font-weight="700" fill="var(--ink)">同一波下跌，兩種繩長</text>

  <line x1="230" y1="150" x2="880" y2="150" stroke="var(--line)" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="230" y1="212" x2="880" y2="212" stroke="var(--line)" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="230" y1="462" x2="880" y2="462" stroke="var(--line)" stroke-width="1" stroke-dasharray="6 6"/>
  <text x="140" y="156" font-size="16" fill="var(--dim)">0%</text>
  <text x="140" y="218" font-size="16" fill="var(--dim)">-5%</text>
  <text x="140" y="468" font-size="16" fill="var(--dim)">-25%</text>

  <text x="330" y="126" font-size="19" fill="var(--ink)">多年期資金</text>
  <line x1="390" y1="150" x2="390" y2="462" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"/>

  <text x="640" y="126" font-size="19" fill="var(--ink)">平台小組</text>
  <line x1="700" y1="150" x2="700" y2="208" stroke="var(--warn)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 676 216 L 700 228 L 676 240" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M 724 216 L 700 228 L 724 240" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <line x1="700" y1="256" x2="700" y2="462" stroke="var(--grey)" stroke-width="4" stroke-dasharray="4 12"/>
  <text x="726" y="262" font-size="16" font-weight="700" fill="var(--warn)">風控叫停</text>
  <text x="726" y="452" font-size="16" fill="var(--dim)">股價還在跌</text>

  <text x="80" y="526" font-size="22" font-weight="700" fill="var(--ink)">該撿的人繩子最短</text>
</svg>
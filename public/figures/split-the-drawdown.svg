<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一根跌幅長條切成共有與獨有兩段，各自指向不同處置" font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" font-size="27" fill="var(--ink)">把一段跌幅切成兩塊再決定</text>
<line x1="120" y1="120" x2="520" y2="120" stroke="var(--line)" stroke-width="2"/>
<text x="120" y="108" font-size="16" fill="var(--dim)">起跌點</text>

<rect x="180" y="120" width="140" height="150" fill="var(--grey)"/>
<rect x="180" y="270" width="140" height="170" fill="var(--warn)"/>
<text x="250" y="200" font-size="19" fill="var(--ink)" text-anchor="middle">同類共有</text>
<text x="250" y="365" font-size="19" fill="var(--page)" text-anchor="middle">只有它有</text>

<line x1="330" y1="195" x2="560" y2="195" stroke="var(--line)" stroke-width="2"/>
<line x1="330" y1="355" x2="560" y2="355" stroke="var(--warn)" stroke-width="2"/>
<rect x="570" y="150" width="330" height="90" fill="var(--card)" stroke="var(--line)"/>
<text x="590" y="186" font-size="19" fill="var(--dim)">折現率變了</text>
<text x="590" y="220" font-size="16" fill="var(--ink)">去看獲利有沒有被下修</text>
<rect x="570" y="310" width="330" height="90" fill="var(--card)" stroke="var(--warn)"/>
<text x="590" y="346" font-size="19" fill="var(--warn)">它自己的事</text>
<text x="590" y="380" font-size="16" fill="var(--ink)">回頭看進場假設了什麼</text>

<text x="60" y="505" font-size="22" fill="var(--ink)">看到跌就以為公司出事，是把兩塊混在一起算</text>
</svg>
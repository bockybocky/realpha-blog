<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一個標著東南亞的大框裡放了四個機房方塊，兩個印尼兩個馬來西亞；右邊框外孤零零一個虛線方塊，標成未指名的第三國，旁邊註明簡報用的示意圖畫的是上海案場">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">五座機房，四座在框內</text>
  <text class="g" x="70" y="122" text-anchor="start">東南亞</text>
  <rect x="70" y="134" width="520" height="286" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="110" y="172" width="200" height="86" rx="8" fill="var(--accent)"/>
  <text class="g" x="210" y="222" text-anchor="middle" fill="var(--page)">印尼</text>
  <rect x="350" y="172" width="200" height="86" rx="8" fill="var(--accent)"/>
  <text class="g" x="450" y="222" text-anchor="middle" fill="var(--page)">印尼</text>
  <rect x="110" y="292" width="200" height="86" rx="8" fill="var(--accent)"/>
  <text class="g" x="210" y="342" text-anchor="middle" fill="var(--page)">馬來西亞</text>
  <rect x="350" y="292" width="200" height="86" rx="8" fill="var(--accent)"/>
  <text class="g" x="450" y="342" text-anchor="middle" fill="var(--page)">馬來西亞</text>
  <rect x="680" y="200" width="210" height="120" rx="8" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="g" x="785" y="248" text-anchor="middle" fill="var(--warn)">第五座</text>
  <text class="n" x="785" y="282" text-anchor="middle">未指名的第三國</text>
  <text class="n" x="785" y="358" text-anchor="middle">示意圖畫的是上海案場</text>
  <text class="n" x="785" y="384" text-anchor="middle">問了，沒有答案</text>
  <text class="c" x="60" y="498">唯一在框外的那座，沒有名字</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="路徑分岔，往下的一條撞上地板線被叉掉，往上的一條分成三個出口">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="48" y="62" font-size="27" fill="var(--ink)">往下那條路被封住了</text>

  <circle cx="180" cy="270" r="13" fill="var(--ink)"/>
  <text x="120" y="232" font-size="20" fill="var(--ink)">撐不下去</text>

  <path d="M196 262 C 330 230, 440 180, 560 170" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <line x1="560" y1="170" x2="616" y2="124" stroke="var(--accent)" stroke-width="2"/>
  <line x1="560" y1="170" x2="616" y2="172" stroke="var(--accent)" stroke-width="2"/>
  <line x1="560" y1="170" x2="616" y2="220" stroke="var(--accent)" stroke-width="2"/>
  <text x="628" y="130" font-size="19" fill="var(--ink)">改管理</text>
  <text x="628" y="178" font-size="19" fill="var(--ink)">改產品</text>
  <text x="628" y="226" font-size="19" fill="var(--ink)">省人力設備</text>

  <path d="M196 280 C 330 330, 450 390, 586 424" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <text x="300" y="400" font-size="19" fill="var(--dim)">再壓薪水</text>
  <line x1="578" y1="406" x2="618" y2="446" stroke="var(--warn)" stroke-width="4"/>
  <line x1="618" y1="406" x2="578" y2="446" stroke="var(--warn)" stroke-width="4"/>

  <line x1="120" y1="478" x2="880" y2="478" stroke="var(--warn)" stroke-width="5"/>
  <text x="120" y="508" font-size="16" fill="var(--warn)">工資地板</text>

  <text x="48" y="546" font-size="22" fill="var(--ink)">封掉低路，才逼得出高路</text>
</svg>
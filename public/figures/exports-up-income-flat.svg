<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一條上升的線和一條水平的線，往右越分越開">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="48" y="58" font-size="27" font-weight="700" fill="var(--ink)">兩條線分開走</text>
  <text class="t" x="48" y="90" font-size="16" fill="var(--dim)">沒有刻度，只看方向</text>

  <line x1="120" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>

  <polyline points="120,360 300,320 500,250 700,180 840,128" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <text class="t" x="840" y="110" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="end">出口 ・ 製造能力</text>

  <polyline points="120,344 300,340 500,344 700,338 840,342" fill="none" stroke="var(--grey)" stroke-width="5"/>
  <text class="t" x="840" y="374" font-size="19" font-weight="700" fill="var(--dim)" text-anchor="end">收入</text>

  <text class="t" x="480" y="470" font-size="22" font-weight="700" fill="var(--ink)" text-anchor="middle">物質豐足，個人的機會不多</text>
</svg>
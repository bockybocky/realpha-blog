<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="股價線往下、指引線往上的剪刀形分岔">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">數字沒壞，壞的是定價權</text>

<line x1="120" y1="420" x2="860" y2="420" stroke="var(--line)" stroke-width="2"/>
<path d="M150 200 L320 230 L480 320 L640 380 L810 400" stroke="var(--warn)" stroke-width="4" fill="none"/>
<text class="t" x="150" y="178" font-size="20" font-weight="700" fill="var(--warn)">股價</text>
<text class="t" x="640" y="368" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">−60%</text>

<path d="M150 230 L320 215 L480 198 L640 180 L810 160" stroke="var(--accent)" stroke-width="4" fill="none"/>
<text class="t" x="820" y="152" font-size="20" font-weight="700" fill="var(--accent)">指引</text>

<text class="t" x="150" y="450" font-size="16" fill="var(--dim)">五月前</text>
<text class="t" x="790" y="450" font-size="16" fill="var(--dim)">現在</text>

<text class="t" x="60" y="492" font-size="22" font-weight="700" fill="var(--ink)">市場重估的是「以後還能不能漲價」</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="時間軸顯示寄件網域在下單前一個半小時註冊，之後一直可用，詐騙信三天後才寄到">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="62" font-size="27" font-weight="700" fill="var(--ink)">誰先準備好</text>

  <rect x="200" y="150" width="700" height="34" rx="17" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text class="t" x="550" y="174" font-size="19" fill="var(--warn)" text-anchor="middle">寄件網域已就緒</text>
  <text class="t" x="60" y="174" font-size="19" fill="var(--dim)">他們那邊</text>

  <line x1="100" y1="300" x2="920" y2="300" stroke="var(--grey)" stroke-width="3"/>

  <line x1="200" y1="184" x2="200" y2="300" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="200" cy="300" r="7" fill="var(--warn)"/>
  <text class="t" x="200" y="334" font-size="16" fill="var(--ink)" text-anchor="middle">註冊網域</text>
  <text class="t" x="200" y="356" font-size="15" fill="var(--dim)" text-anchor="middle">11/22 21:53</text>

  <circle cx="330" cy="300" r="7" fill="var(--accent)"/>
  <line x1="330" y1="300" x2="330" y2="420" stroke="var(--accent)" stroke-width="3"/>
  <text class="t" x="330" y="446" font-size="16" fill="var(--ink)" text-anchor="middle">我下單</text>
  <text class="t" x="330" y="468" font-size="15" fill="var(--dim)" text-anchor="middle">11/22 23:31</text>

  <circle cx="860" cy="300" r="7" fill="var(--warn)"/>
  <line x1="860" y1="184" x2="860" y2="300" stroke="var(--warn)" stroke-width="3"/>
  <text class="t" x="860" y="334" font-size="16" fill="var(--ink)" text-anchor="middle">詐騙信到</text>
  <text class="t" x="860" y="356" font-size="15" fill="var(--dim)" text-anchor="middle">11/25</text>

  <line x1="208" y1="258" x2="322" y2="258" stroke="var(--ink)" stroke-width="1.5"/>
  <text class="t" x="265" y="246" font-size="15" fill="var(--ink)" text-anchor="middle">約一個半小時</text>

  <text class="t" x="60" y="498" font-size="22" font-weight="700" fill="var(--ink)">管道先架好，訂單一來就寄</text>
</svg>
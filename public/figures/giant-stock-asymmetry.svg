<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="向上箭頭很短，向下箭頭很長，呈不對稱">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="66" font-size="27" fill="var(--ink)">股票愈大，同樣的消息推得愈不一樣遠</text>
<line x1="60" y1="250" x2="900" y2="250" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="240" font-size="16" fill="var(--dim)">現在的評價</text>
<rect x="290" y="190" width="40" height="60" fill="var(--accent)"/>
<polygon points="290,190 330,190 310,150" fill="var(--accent)"/>
<text x="356" y="186" font-size="20" fill="var(--ink)">好消息</text>
<text x="356" y="212" font-size="16" fill="var(--dim)">推不動多少</text>
<rect x="630" y="250" width="40" height="170" fill="var(--warn)"/>
<polygon points="630,420 670,420 650,462" fill="var(--warn)"/>
<text x="696" y="340" font-size="20" fill="var(--ink)">壞消息</text>
<text x="696" y="366" font-size="16" fill="var(--dim)">能推很遠</text>
</svg>
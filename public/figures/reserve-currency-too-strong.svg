<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="往上的美元線與往下的流動性能力線交叉，交叉點右側是出事區域">
<style>svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">強過頭的準備貨幣</text>
<rect x="520" y="110" width="360" height="370" fill="var(--card)"/>
<line x1="130" y1="480" x2="880" y2="480" stroke="var(--line)" stroke-width="2"/>
<text x="130" y="512" font-size="16" fill="var(--dim)">之前</text>
<text x="880" y="512" font-size="16" fill="var(--dim)" text-anchor="end">急升之後</text>
<path d="M140 452 C 320 432, 430 360, 520 300 C 650 236, 750 198, 860 170" fill="none" stroke="var(--accent)" stroke-width="4"/>
<path d="M140 232 C 350 252, 460 300, 520 318 C 660 360, 760 400, 860 430" fill="none" stroke="var(--grey)" stroke-width="4" stroke-dasharray="9 7"/>
<circle cx="520" cy="309" r="8" fill="var(--page)" stroke="var(--ink)" stroke-width="3"/>
<text x="864" y="198" font-size="20" fill="var(--accent)" text-anchor="end">美元的價格</text>
<text x="300" y="214" font-size="20" fill="var(--dim)">提供流動性的能力</text>
<text x="700" y="140" font-size="19" fill="var(--warn)" text-anchor="middle">過了這裡，別人融不到美元</text>
<text x="60" y="560" font-size="22" fill="var(--ink)">被定價得太兇，它就做不到自己那份工作</text>
</svg>
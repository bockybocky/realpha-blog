<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="期中選舉席次變化柱狀圖，絕大多數往下只有兩根往上">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="80" y="72" font-size="27" font-weight="700" fill="var(--ink)">執政黨在期中選舉的眾院席次</text>
  <text class="t" x="80" y="108" font-size="16" fill="var(--dim)">1934 — 2022</text>

  <line x1="90" y1="250" x2="880" y2="250" stroke="var(--line)" stroke-width="2"/>
  <text class="t" x="896" y="256" font-size="16" fill="var(--dim)">0</text>

  <rect x="110" y="250" width="30" height="120" fill="var(--grey)"/>
  <rect x="156" y="250" width="30" height="72" fill="var(--grey)"/>
  <rect x="202" y="250" width="30" height="148" fill="var(--grey)"/>
  <rect x="248" y="250" width="30" height="54" fill="var(--grey)"/>
  <rect x="294" y="250" width="30" height="96" fill="var(--grey)"/>
  <rect x="340" y="250" width="30" height="132" fill="var(--grey)"/>
  <rect x="386" y="250" width="30" height="40" fill="var(--grey)"/>
  <rect x="432" y="250" width="30" height="110" fill="var(--grey)"/>
  <rect x="478" y="250" width="30" height="64" fill="var(--grey)"/>
  <rect x="524" y="250" width="30" height="156" fill="var(--grey)"/>
  <rect x="570" y="192" width="30" height="58" fill="var(--accent)"/>
  <rect x="616" y="206" width="30" height="44" fill="var(--accent)"/>
  <rect x="662" y="250" width="30" height="138" fill="var(--grey)"/>
  <rect x="708" y="250" width="30" height="86" fill="var(--grey)"/>
  <rect x="754" y="250" width="30" height="118" fill="var(--grey)"/>
  <rect x="800" y="250" width="30" height="70" fill="var(--grey)"/>

  <text class="t" x="585" y="178" font-size="16" font-weight="600" text-anchor="middle" fill="var(--accent)">1998</text>
  <text class="t" x="631" y="192" font-size="16" font-weight="600" text-anchor="middle" fill="var(--accent)">2002</text>

  <line x1="90" y1="352" x2="880" y2="352" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
  <text class="t" x="90" y="382" font-size="19" font-weight="700" fill="var(--warn)">平均 −27 席</text>

  <text class="t" x="480" y="508" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">往上是例外，而兩個例外的背景今年都不在</text>
</svg>
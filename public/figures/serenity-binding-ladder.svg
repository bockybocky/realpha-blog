<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="營收、指引、採購承諾依綁住程度放在高度遞增的三個位置">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="62" font-size="27" fill="var(--ink)">它拿什麼東西擔保這句話</text>
<line x1="100" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="100" y="466" font-size="16" fill="var(--dim)">講完就算</text>
<text class="t" x="700" y="466" font-size="16" fill="var(--dim)">押上資產負債表</text>
<rect x="130" y="366" width="180" height="56" rx="8" fill="var(--grey)"/>
<text class="t" x="152" y="402" font-size="19" fill="var(--ink)">營收</text>
<text class="t" x="152" y="348" font-size="16" fill="var(--dim)">已經發生</text>
<rect x="390" y="286" width="180" height="136" rx="8" fill="var(--dim)"/>
<text class="t" x="412" y="402" font-size="19" fill="var(--page)">指引</text>
<text class="t" x="390" y="268" font-size="16" fill="var(--dim)">公司的嘴</text>
<rect x="650" y="166" width="180" height="256" rx="8" fill="var(--accent)"/>
<text class="t" x="672" y="402" font-size="19" fill="var(--page)">採購承諾</text>
<text class="t" x="650" y="148" font-size="16" fill="var(--accent)">押錯錢是自己的</text>
<text class="t" x="60" y="512" font-size="22" fill="var(--ink)">粗，但是已經簽過字的未來</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三組圓點由三十點縮成七點再縮成一點">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="54" font-size="27" font-weight="700" fill="var(--ink)">編劇室：三十人 → 七人 → 一人</text>
<rect x="60" y="100" width="280" height="300" fill="var(--card)"/>
<rect x="370" y="100" width="280" height="300" fill="var(--card)"/>
<rect x="680" y="100" width="220" height="300" fill="var(--card)"/>
<g fill="var(--accent)">
<circle cx="110" cy="170" r="11"/><circle cx="152" cy="170" r="11"/><circle cx="194" cy="170" r="11"/><circle cx="236" cy="170" r="11"/><circle cx="278" cy="170" r="11"/>
<circle cx="110" cy="212" r="11"/><circle cx="152" cy="212" r="11"/><circle cx="194" cy="212" r="11"/><circle cx="236" cy="212" r="11"/><circle cx="278" cy="212" r="11"/>
<circle cx="110" cy="254" r="11"/><circle cx="152" cy="254" r="11"/><circle cx="194" cy="254" r="11"/><circle cx="236" cy="254" r="11"/><circle cx="278" cy="254" r="11"/>
<circle cx="110" cy="296" r="11"/><circle cx="152" cy="296" r="11"/><circle cx="194" cy="296" r="11"/><circle cx="236" cy="296" r="11"/><circle cx="278" cy="296" r="11"/>
<circle cx="110" cy="338" r="11"/><circle cx="152" cy="338" r="11"/><circle cx="194" cy="338" r="11"/><circle cx="236" cy="338" r="11"/><circle cx="278" cy="338" r="11"/>
<circle cx="131" cy="128" r="11"/><circle cx="173" cy="128" r="11"/><circle cx="215" cy="128" r="11"/><circle cx="257" cy="128" r="11"/><circle cx="89" cy="128" r="11"/>
</g>
<g fill="var(--accent)">
<circle cx="440" cy="232" r="11"/><circle cx="482" cy="232" r="11"/><circle cx="524" cy="232" r="11"/><circle cx="566" cy="232" r="11"/>
<circle cx="461" cy="274" r="11"/><circle cx="503" cy="274" r="11"/><circle cx="545" cy="274" r="11"/>
</g>
<circle cx="790" cy="252" r="11" fill="var(--warn)"/>
<path d="M348 250 L362 250" stroke="var(--grey)" stroke-width="3"/>
<path d="M352 243 L364 250 L352 257 Z" fill="var(--grey)"/>
<path d="M658 250 L672 250" stroke="var(--grey)" stroke-width="3"/>
<path d="M662 243 L674 250 L662 257 Z" fill="var(--grey)"/>
<text x="200" y="432" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">《Family Guy》全盛</text>
<text x="200" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">三十個編劇</text>
<text x="510" y="432" font-size="20" font-weight="700" fill="var(--ink)" text-anchor="middle">mini room</text>
<text x="510" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">現在這樣就算一大間</text>
<text x="790" y="432" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">一季大綱</text>
<text x="790" y="458" font-size="16" fill="var(--dim)" text-anchor="middle">一個人，寫幾週</text>
<text x="60" y="512" font-size="22" font-weight="700" fill="var(--ink)">笑話要一群人輪流丟，一個人丟不出來。</text>
</svg>
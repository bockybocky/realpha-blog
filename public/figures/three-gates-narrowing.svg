<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條由寬到窄的橫條疊成漏斗，最下面最窄的一條被特別標示">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="80" y="72" font-size="27">三個條件，缺一不可</text>
  <rect x="100" y="140" width="760" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="480" y="182" font-size="20" text-anchor="middle">找到真相</text>
  <polygon points="472,212 488,212 480,228" fill="var(--grey)"/>
  <rect x="220" y="232" width="520" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
  <text x="480" y="274" font-size="20" text-anchor="middle">而它被錯誤定價</text>
  <polygon points="472,304 488,304 480,320" fill="var(--grey)"/>
  <rect x="355" y="324" width="250" height="68" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="480" y="366" font-size="20" fill="var(--accent)" text-anchor="middle">而你抱得住</text>
  <line x1="612" y1="358" x2="646" y2="358" stroke="var(--warn)" stroke-width="2"/>
  <text x="656" y="364" font-size="16" fill="var(--warn)">多數人在這裡掉出去</text>
  <text x="480" y="456" font-size="22" text-anchor="middle">不是看錯，是抱不住</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="On the left only one block clears a tall wall; on the right the wall is half as high and many blocks stand on it.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:20px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t h" x="60" y="70">The barrier has been cut in half</text>
<line x1="60" y1="430" x2="900" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="150" y="140" width="130" height="290" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t b" x="166" y="200">Operations team</text>
<text class="t b" x="166" y="232">Open hardware specs</text>
<text class="t b" x="166" y="264">Build your own data center</text>
<rect x="196" y="110" width="38" height="26" fill="var(--grey)"/>
<text class="t g" x="150" y="470">Before: only the big four could</text>
<polygon points="330,268 470,268 470,254 500,275 470,296 470,282 330,282" fill="var(--accent)"/>
<text class="t b" x="346" y="242">Full rack sold as one set</text>
<rect x="560" y="290" width="130" height="140" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="t b" x="576" y="350">Delivered ready to run</text>
<rect x="556" y="260" width="38" height="26" fill="var(--accent)"/>
<rect x="602" y="260" width="38" height="26" fill="var(--accent)"/>
<rect x="648" y="260" width="38" height="26" fill="var(--accent)"/>
<rect x="694" y="260" width="38" height="26" fill="var(--accent)"/>
<text class="t g" x="560" y="470">Now: money is enough to enter</text>
<text class="t c" x="60" y="518">Shorter path, volume booked to one name</text>
</svg>
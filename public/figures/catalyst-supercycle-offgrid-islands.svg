<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左邊一張互相連起來的電網，右邊四個各自獨立、彼此沒有連線的小島，每座島自己帶太陽能、燃氣與電池">
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">接不上電網，就各自蓋一座孤島</text>

  <g stroke="var(--accent)" stroke-width="3">
    <line x1="120" y1="180" x2="280" y2="260"/>
    <line x1="280" y1="260" x2="160" y2="370"/>
    <line x1="160" y1="370" x2="330" y2="400"/>
    <line x1="330" y1="400" x2="390" y2="250"/>
    <line x1="390" y1="250" x2="280" y2="260"/>
    <line x1="120" y1="180" x2="330" y2="150"/>
    <line x1="330" y1="150" x2="390" y2="250"/>
  </g>
  <g fill="var(--accent)">
    <circle cx="120" cy="180" r="12"/>
    <circle cx="280" cy="260" r="12"/>
    <circle cx="160" cy="370" r="12"/>
    <circle cx="330" cy="400" r="12"/>
    <circle cx="390" cy="250" r="12"/>
    <circle cx="330" cy="150" r="12"/>
  </g>
  <text x="250" y="452" font-size="20" font-weight="700" fill="var(--accent)" text-anchor="middle">一個系統，共用的問題</text>

  <line x1="500" y1="120" x2="500" y2="430" stroke="var(--line)" stroke-width="2" stroke-dasharray="10 10"/>

  <g>
    <rect x="560" y="150" width="150" height="110" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
    <rect x="760" y="150" width="150" height="110" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
    <rect x="560" y="290" width="150" height="110" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
    <rect x="760" y="290" width="150" height="110" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="3"/>
  </g>
  <g font-size="15" fill="var(--ink)" text-anchor="middle">
    <text x="635" y="192">太陽能</text>
    <text x="635" y="216">燃氣</text>
    <text x="635" y="240">電池</text>
    <text x="835" y="192">太陽能</text>
    <text x="835" y="216">燃氣</text>
    <text x="835" y="240">電池</text>
    <text x="635" y="332">太陽能</text>
    <text x="635" y="356">燃氣</text>
    <text x="635" y="380">電池</text>
    <text x="835" y="332">太陽能</text>
    <text x="835" y="356">燃氣</text>
    <text x="835" y="380">電池</text>
  </g>
  <text x="735" y="452" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">一個個私有的解，彼此不相連</text>
  <text x="60" y="498" font-size="22" font-weight="700" fill="var(--ink)">離網繞過的是同意，不是把電網修好</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One huge box on the left and two tiny boxes on the right, both sides serving almost the same number of people.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">Same users, two bills</text>
<text class="b" x="60" y="92">Area ∝ price</text>

<rect x="90" y="150" width="200" height="200" rx="8" fill="var(--grey)"/>
<text class="n" x="190" y="248" text-anchor="middle" fill="var(--page)">$250K</text>
<text class="g" x="90" y="392">One Sun 4500</text>
<text class="b" x="90" y="420">Serves 300–400</text>

<rect x="520" y="150" width="25" height="25" rx="3" fill="var(--accent)"/>
<rect x="556" y="150" width="25" height="25" rx="3" fill="var(--accent)"/>
<text class="n" x="604" y="170">$4,000 × 2</text>
<text class="g" x="520" y="392">Two Linux+Intel boxes</text>
<text class="b" x="520" y="420">180 each, 360 total</text>

<line x1="520" y1="230" x2="880" y2="230" stroke="var(--line)" stroke-width="2"/>
<text class="c" x="520" y="300">30× cost</text>

<text class="c" x="60" y="492">Add another box: scale-out</text>
</svg>
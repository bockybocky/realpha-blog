<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊只有一個大圓，右邊是一條掉下去又爬回來的曲線，以及一條始終沒回來的虛線">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">換一個先看的東西</text>

<rect x="48" y="90" width="330" height="340" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="76" y="128" font-size="20" font-weight="700" fill="var(--dim)">以前先看</text>
<circle cx="213" cy="272" r="92" fill="none" stroke="var(--grey)" stroke-width="6"/>
<text x="168" y="282" font-size="19" font-weight="700" fill="var(--dim)">事件規模</text>
<text x="76" y="404" font-size="16" fill="var(--dim)">看完還是不知道會停多久</text>

<rect x="406" y="90" width="506" height="340" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="434" y="128" font-size="20" font-weight="700" fill="var(--ink)">現在先看</text>
<line x1="450" y1="360" x2="880" y2="360" stroke="var(--grey)" stroke-width="2"/>
<line x1="450" y1="180" x2="450" y2="360" stroke="var(--grey)" stroke-width="2"/>
<path d="M450 196 L540 196 L560 332 L620 320 L700 210 L880 206" fill="none" stroke="var(--accent)" stroke-width="5"/>
<text x="628" y="192" font-size="16" font-weight="700" fill="var(--accent)">一兩天到一週就回來</text>
<path d="M560 332 L880 338" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="10 8"/>
<text x="628" y="372" font-size="16" font-weight="700" fill="var(--warn)">沒有備援紀錄：假設停一樣久</text>

<text x="60" y="492" font-size="22" font-weight="700" fill="var(--ink)">規模決定頭條，恢復時間決定損失。</text>
</svg>
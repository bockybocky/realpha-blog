<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三個來源各自分岔成兩條線，接到兩條寬窄不同的鐵軌">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="60" y="64">標準未定：兩種軌寬，每家兩邊押</text>
<g stroke="var(--grey)" stroke-width="3">
<line x1="555" y1="158" x2="555" y2="202"/><line x1="590" y1="158" x2="590" y2="202"/>
<line x1="625" y1="158" x2="625" y2="202"/><line x1="660" y1="158" x2="660" y2="202"/>
<line x1="695" y1="158" x2="695" y2="202"/><line x1="730" y1="158" x2="730" y2="202"/>
<line x1="765" y1="158" x2="765" y2="202"/><line x1="800" y1="158" x2="800" y2="202"/>
<line x1="835" y1="158" x2="835" y2="202"/><line x1="870" y1="158" x2="870" y2="202"/>
<line x1="555" y1="360" x2="555" y2="430"/><line x1="590" y1="360" x2="590" y2="430"/>
<line x1="625" y1="360" x2="625" y2="430"/><line x1="660" y1="360" x2="660" y2="430"/>
<line x1="695" y1="360" x2="695" y2="430"/><line x1="730" y1="360" x2="730" y2="430"/>
<line x1="765" y1="360" x2="765" y2="430"/><line x1="800" y1="360" x2="800" y2="430"/>
<line x1="835" y1="360" x2="835" y2="430"/><line x1="870" y1="360" x2="870" y2="430"/>
</g>
<g stroke="var(--ink)" stroke-width="4">
<line x1="540" y1="165" x2="900" y2="165"/>
<line x1="540" y1="195" x2="900" y2="195"/>
<line x1="540" y1="367" x2="900" y2="367"/>
<line x1="540" y1="423" x2="900" y2="423"/>
</g>
<text class="g" x="540" y="140">Broadcom 的軌</text>
<text class="g" x="540" y="345">NVIDIA 的軌</text>
<g fill="none" stroke="var(--accent)" stroke-width="3">
<path d="M250,218 C400,218 420,180 540,180"/>
<path d="M250,218 C400,218 420,395 540,395"/>
<path d="M250,290 C400,290 420,180 540,180"/>
<path d="M250,290 C400,290 420,395 540,395"/>
<path d="M250,362 C400,362 420,180 540,180"/>
<path d="M250,362 C400,362 420,395 540,395"/>
</g>
<rect x="60" y="190" width="190" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="155" y="225" text-anchor="middle">材料</text>
<rect x="60" y="262" width="190" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="155" y="297" text-anchor="middle">設備</text>
<rect x="60" y="334" width="190" height="56" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="g" x="155" y="369" text-anchor="middle">測試</text>
<text class="c" x="60" y="510">押錯的那一半，歸零</text>
</svg>
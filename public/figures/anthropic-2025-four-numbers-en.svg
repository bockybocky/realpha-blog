<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four bars differ sharply in height, the tallest being the net loss bar shaded grey as an accounting figure, and beside them an empty dashed box stands for the operating cash flow we never got.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:19px; fill:var(--ink); }
    .v { font-size:16px; fill:var(--dim); }
    .d { font-size:16px; fill:var(--dim); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="58">The four 2025 numbers on the table ($100M)</text>
<line x1="60" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="100" y="438" width="110" height="32" fill="var(--accent)"/>
<text class="v" x="100" y="428">40</text>
<text class="g" x="100" y="500">Revenue</text>
<rect x="270" y="373" width="110" height="97" fill="var(--grey)"/>
<text class="v" x="270" y="363">120</text>
<text class="g" x="270" y="500">Opex</text>
<rect x="440" y="405" width="110" height="65" fill="var(--warn)"/>
<text class="v" x="440" y="395">80</text>
<text class="g" x="440" y="500">Op. loss</text>
<rect x="610" y="130" width="110" height="340" fill="var(--card)" stroke="var(--grey)" stroke-width="2"/>
<text class="v" x="610" y="120">420</text>
<text class="g" x="596" y="500">Net loss (book)</text>
<text class="d" x="596" y="524">Revaluation · funding · M&amp;A</text>
<rect x="790" y="300" width="130" height="170" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>
<text class="g" x="790" y="500">Op. cash flow</text>
<text class="d" x="814" y="392">Undisclosed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The material on the left bows when heated, the glass on the right stays flat">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; font-weight:700; fill:var(--ink); }
    .grp { font-size:20px; font-weight:700; fill:var(--ink); }
    .bd  { font-size:16px; fill:var(--dim); }
    .sm  { font-size:15px; fill:var(--dim); }
    .cc  { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="ttl" x="60" y="58">After heating, which one is still flat</text>

  <rect x="60" y="92" width="400" height="308" rx="16" fill="var(--card)" stroke="var(--line)"/>
  <text class="grp" x="88" y="134">Composite organic material</text>
  <text class="sm" x="88" y="160">Several materials mixed together</text>
  <path d="M100 288 Q260 208 420 288" fill="none" stroke="var(--warn)" stroke-width="10" stroke-linecap="round"/>
  <path d="M100 312 Q260 240 420 312" fill="none" stroke="var(--grey)" stroke-width="10" stroke-linecap="round"/>
  <line x1="120" y1="352" x2="252" y2="352" stroke="var(--warn)" stroke-width="3"/>
  <polygon points="262,352 248,345 248,359" fill="var(--warn)"/>
  <line x1="120" y1="376" x2="196" y2="376" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="206,376 192,369 192,383" fill="var(--grey)"/>
  <text class="sm" x="290" y="381">Different expansion</text>

  <rect x="500" y="92" width="400" height="308" rx="16" fill="var(--card)" stroke="var(--line)"/>
  <text class="grp" x="528" y="134">Glass</text>
  <text class="sm" x="528" y="160">CTE can be tuned by formulation</text>
  <rect x="540" y="278" width="320" height="12" rx="6" fill="var(--accent)"/>
  <rect x="540" y="304" width="320" height="12" rx="6" fill="var(--grey)"/>
  <line x1="560" y1="352" x2="692" y2="352" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="702,352 688,345 688,359" fill="var(--accent)"/>
  <line x1="560" y1="376" x2="692" y2="376" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="702,376 688,369 688,383" fill="var(--grey)"/>
  <text class="sm" x="722" y="369">Tuned to match</text>

  <text class="cc" x="60" y="470">It isn't only about being rigid, it's about moving with you</text>
</svg>
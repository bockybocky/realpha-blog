<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The high-volume yield curve keeps rising while the low-volume curve flattens early at a low level.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="52" font-size="27" fill="var(--ink)">How yield climbs</text>
<path d="M130 110 L130 450 L880 450" stroke="var(--line)" stroke-width="2" fill="none"/>
<text x="92" y="130" font-size="16" fill="var(--dim)">Yield</text>
<text x="810" y="480" font-size="16" fill="var(--dim)">Cumulative wafers</text>
<path d="M140 436 C 300 300 480 196 870 150" stroke="var(--accent)" stroke-width="4" fill="none"/>
<path d="M140 436 C 240 378 330 352 870 342" stroke="var(--grey)" stroke-width="4" fill="none"/>
<circle cx="870" cy="150" r="7" fill="var(--accent)"/>
<circle cx="870" cy="342" r="7" fill="var(--grey)"/>
<text x="700" y="128" font-size="20" fill="var(--accent)">High volume</text>
<text x="700" y="152" font-size="16" fill="var(--accent)">Keeps climbing</text>
<text x="700" y="378" font-size="20" fill="var(--dim)">Low volume</text>
<text x="700" y="402" font-size="16" fill="var(--dim)">Stalls</text>
<path d="M620 160 L620 334" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="60" y="524" font-size="22" fill="var(--ink)">Yield is run up, not calculated</text>
</svg>
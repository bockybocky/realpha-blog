<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="三條同比例橫條，8GB 最短且前段被占用，24GB 三倍長，32GB 四倍長">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:700; }
    .b { font-size:16px; }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="40" y="62">工作桌的桌面有多大</text>
<line x1="400" y1="120" x2="400" y2="430" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<text class="g" x="40" y="182">我的 6600 XT</text>
<rect x="240" y="150" width="50" height="48" rx="4" fill="var(--grey)"/>
<rect x="290" y="150" width="110" height="48" rx="4" fill="var(--accent)"/>
<text class="s" x="240" y="140">先被占 2.5</text>
<text class="b" x="302" y="180" style="fill:var(--page)">可用約 5.5</text>
<text class="g" x="40" y="282">7900 XTX／3090</text>
<rect x="240" y="250" width="480" height="48" rx="4" fill="var(--accent)"/>
<text class="b" x="256" y="280" style="fill:var(--page)">24GB</text>
<text class="g" x="40" y="382">R9700</text>
<rect x="240" y="350" width="640" height="48" rx="4" fill="var(--accent)"/>
<text class="b" x="256" y="380" style="fill:var(--page)">32GB</text>
<line x1="240" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="s" x="240" y="456" text-anchor="middle">0</text>
<text class="s" x="400" y="456" text-anchor="middle">8</text>
<text class="s" x="560" y="456" text-anchor="middle">16</text>
<text class="s" x="720" y="456" text-anchor="middle">24</text>
<text class="s" x="880" y="456" text-anchor="middle">32 GB</text>
<text class="c" x="40" y="508">他推的卡，桌面大三到四倍</text>
</svg>
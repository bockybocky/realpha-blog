<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="蹺蹺板左端彼此容忍較重往下沉，右端社群感較輕被翹高">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); font-size:16px; }
</style>
<text x="480" y="52" text-anchor="middle" style="font-size:27px;font-weight:700">自由主義做的交換</text>
<line x1="120" y1="380" x2="840" y2="380" stroke="var(--line)" stroke-width="2"/>
<path d="M480 284 L438 380 L522 380 Z" fill="var(--grey)"/>
<g transform="rotate(-9.46 480 280)">
  <rect x="180" y="274" width="600" height="12" rx="4" fill="var(--ink)"/>
  <rect x="190" y="164" width="190" height="110" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="4"/>
  <text x="285" y="215" text-anchor="middle" style="font-size:20px;font-weight:700">彼此容忍</text>
  <text x="285" y="245" text-anchor="middle" style="font-size:16px;fill:var(--dim)">和平共處</text>
  <rect x="640" y="230" width="130" height="44" rx="8" fill="var(--card)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="705" y="258" text-anchor="middle" style="font-size:16px;fill:var(--dim)">社群感</text>
</g>
<text x="260" y="440" text-anchor="middle" style="font-size:20px;fill:var(--accent);font-weight:700">換到：和平</text>
<text x="720" y="440" text-anchor="middle" style="font-size:20px;fill:var(--warn);font-weight:700">付出：同一個方向</text>
<text x="480" y="500" text-anchor="middle" style="font-size:22px;font-weight:700">空出來的那頭，長出民族主義</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="名牌容量是一整條，實際從電網取用只佔其中一段，近期約五到七成，往後更短">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="60" font-size="27" font-weight="700" fill="var(--ink)">名牌容量不等於電網負載</text>

  <text class="t" x="60" y="140" font-size="20" font-weight="700" fill="var(--ink)">名牌 1 GW</text>
  <rect x="60" y="156" width="840" height="64" rx="5" fill="var(--grey)" opacity="0.6"/>

  <text class="t" x="60" y="282" font-size="20" font-weight="700" fill="var(--ink)">近期・真的從電網拿</text>
  <rect x="60" y="298" width="840" height="64" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="60" y="298" width="588" height="64" rx="5" fill="var(--accent)" opacity="0.85"/>
  <text class="t" x="668" y="338" font-size="19" font-weight="700" fill="var(--accent)">五到七成</text>

  <text class="t" x="60" y="424" font-size="20" font-weight="700" fill="var(--ink)">十年後段・表後自建划算</text>
  <rect x="60" y="440" width="840" height="64" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="60" y="440" width="294" height="64" rx="5" fill="var(--warn)" opacity="0.85"/>
  <text class="t" x="374" y="480" font-size="19" font-weight="700" fill="var(--warn)">更低</text>
</svg>
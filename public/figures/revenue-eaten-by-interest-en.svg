<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A quarter of the revenue bar is cut away by interest, leaving only a very thin sliver of operating income.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">One quarter of revenue, a quarter paid as interest first</text>
<text class="t" x="60" y="104" font-size="16" fill="var(--dim)">$2.575B in one quarter</text>

<rect x="60" y="170" width="840" height="90" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="170" width="210" height="90" rx="6" fill="var(--warn)" opacity="0.45"/>
<line x1="270" y1="170" x2="270" y2="260" stroke="var(--warn)" stroke-width="3"/>
<text class="t" x="82" y="222" font-size="19" font-weight="700" fill="var(--ink)">Interest: ~$600M</text>
<text class="t" x="300" y="222" font-size="19" fill="var(--dim)">Rest of Revenue</text>
<text class="t" x="60" y="152" font-size="16" fill="var(--dim)">Revenue 100%</text>

<rect x="60" y="320" width="34" height="46" rx="4" fill="var(--accent)"/>
<rect x="94" y="320" width="806" height="46" rx="4" fill="none" stroke="var(--line)" stroke-dasharray="5 5"/>
<text class="t" x="118" y="350" font-size="19" font-weight="700" fill="var(--ink)">Operating income: just over $100M</text>
<text class="t" x="60" y="304" font-size="16" fill="var(--dim)">What is left after depreciation</text>

<line x1="60" y1="410" x2="900" y2="410" stroke="var(--line)" stroke-width="2"/>
<text class="t" x="60" y="458" font-size="22" font-weight="700" fill="var(--ink)">Revenue doubles, interest doubles with it</text>
<text class="t" x="60" y="488" font-size="16" fill="var(--dim)">Bigger scale does not mean less pressure</text>
</svg>
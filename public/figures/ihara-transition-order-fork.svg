<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="一個宣布轉型的起點分出兩條路徑，上路先修交付通到訂單，下路沒修只到估值且後段下彎">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text class="t" x="60" y="70" font-size="27" font-weight="700" fill="var(--ink)">同樣一句轉型，兩條路</text>

  <circle cx="150" cy="280" r="10" fill="var(--ink)"/>
  <text class="t" x="150" y="320" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">宣布轉型</text>

  <path d="M165 275 C 330 275, 380 180, 560 180 L 840 180" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <text class="t" x="420" y="158" font-size="19" font-weight="700" fill="var(--accent)" text-anchor="middle">交期・延遲率・急件</text>
  <text class="t" x="880" y="187" font-size="22" font-weight="700" fill="var(--accent)" text-anchor="end">訂單</text>

  <path d="M165 288 C 330 300, 380 390, 560 390 C 700 390, 760 420, 840 440" fill="none" stroke="var(--warn)" stroke-width="5" stroke-dasharray="10 7"/>
  <text class="t" x="420" y="372" font-size="19" font-weight="700" fill="var(--warn)" text-anchor="middle">舊帳沒修</text>
  <text class="t" x="880" y="447" font-size="22" font-weight="700" fill="var(--warn)" text-anchor="end">估值</text>
</svg>
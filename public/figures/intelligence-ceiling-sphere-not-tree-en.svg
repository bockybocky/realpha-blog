<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Two panels compared side by side: on the left, a straight line that keeps rising with no end; on the right, a curve that rises, flattens out, and hugs a dashed upper limit.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:700; }
    .s { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">The shape of intelligence</text>
  <rect x="60" y="88" width="400" height="368" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <rect x="500" y="88" width="400" height="368" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="88" y="126">Intuition</text>
  <text class="s" x="88" y="150">Height of a tree</text>
  <text class="g" x="528" y="126">Reality</text>
  <text class="s" x="528" y="150">Roundness of a sphere</text>
  <path d="M100 430 L430 430" stroke="var(--grey)" stroke-width="2"/>
  <path d="M100 430 L100 180" stroke="var(--grey)" stroke-width="2"/>
  <path d="M106 424 L400 196" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <path d="M400 196 L436 168" stroke="var(--accent)" stroke-width="4" stroke-dasharray="7 7" fill="none"/>
  <path d="M540 430 L870 430" stroke="var(--grey)" stroke-width="2"/>
  <path d="M540 430 L540 180" stroke="var(--grey)" stroke-width="2"/>
  <path d="M540 196 L876 196" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 7"/>
  <text class="s" x="760" y="186">Ceiling</text>
  <path d="M546 424 C 640 420 660 240 876 212" stroke="var(--accent)" stroke-width="4" fill="none"/>
  <text class="c" x="60" y="508">More intelligence, just a bit rounder</text>
</svg>
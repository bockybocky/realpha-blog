<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="成本門檻虛線往下掉到十分之一，原本全在門檻下的一群已知破口原地不動就同時越過門檻">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<g font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<text x="60" y="62" font-size="27" fill="var(--ink)">它們不會各自過期</text>
<text x="60" y="112" font-size="19" fill="var(--dim)">以前</text>
<text x="520" y="112" font-size="19" fill="var(--warn)">成本掉到十分之一</text>
<line x1="60" y1="150" x2="440" y2="150" stroke="var(--accent)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="60" y="140" font-size="16" fill="var(--accent)">值得動手的門檻</text>
<circle cx="110" cy="300" r="11" fill="var(--grey)"/>
<circle cx="170" cy="356" r="11" fill="var(--grey)"/>
<circle cx="232" cy="276" r="11" fill="var(--grey)"/>
<circle cx="296" cy="382" r="11" fill="var(--grey)"/>
<circle cx="356" cy="318" r="11" fill="var(--grey)"/>
<circle cx="412" cy="360" r="11" fill="var(--grey)"/>
<text x="248" y="452" font-size="19" fill="var(--dim)" text-anchor="middle">已知破口</text>
<text x="248" y="480" font-size="16" fill="var(--dim)" text-anchor="middle">機率不高，先放著</text>
<line x1="520" y1="430" x2="900" y2="430" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="520" y="462" font-size="16" fill="var(--warn)">門檻</text>
<path d="M470 158 L 470 414" stroke="var(--warn)" stroke-width="4"/>
<polygon points="460,414 480,414 470,438" fill="var(--warn)"/>
<circle cx="570" cy="300" r="11" fill="var(--warn)"/>
<circle cx="630" cy="356" r="11" fill="var(--warn)"/>
<circle cx="692" cy="276" r="11" fill="var(--warn)"/>
<circle cx="756" cy="382" r="11" fill="var(--warn)"/>
<circle cx="816" cy="318" r="11" fill="var(--warn)"/>
<circle cx="872" cy="360" r="11" fill="var(--warn)"/>
<text x="710" y="200" font-size="19" fill="var(--ink)" text-anchor="middle">點沒有動</text>
<text x="710" y="228" font-size="16" fill="var(--dim)" text-anchor="middle">全部一起到期</text>
<text x="60" y="524" font-size="22" fill="var(--ink)">變的不是破口，是成本</text>
</g>
</svg>
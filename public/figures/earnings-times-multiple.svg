<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊一個大矩形縮成右邊一個小很多的矩形，寬與高都變小，面積掉得更多">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="80" y="56" font-size="27" font-weight="700" fill="var(--ink)">價格是相乘出來的</text>

  <line x1="100" y1="446" x2="880" y2="446" stroke="var(--line)" stroke-width="2"/>

  <text x="150" y="122" font-size="16" fill="var(--dim)">倍數 30</text>
  <rect x="150" y="134" width="230" height="312" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="3"/>
  <text x="228" y="300" font-size="22" font-weight="700" fill="var(--ink)">300</text>
  <text x="222" y="476" font-size="16" fill="var(--dim)">盈餘 10</text>

  <rect x="440" y="286" width="70" height="8" fill="var(--dim)"/>
  <path d="M 510 274 L 552 290 L 510 306 Z" fill="var(--dim)"/>
  <text x="440" y="258" font-size="16" fill="var(--dim)">絆一下</text>

  <text x="620" y="276" font-size="16" fill="var(--dim)">倍數 15</text>
  <rect x="620" y="290" width="161" height="156" fill="var(--warn)" fill-opacity="0.18" stroke="var(--warn)" stroke-width="3"/>
  <text x="668" y="382" font-size="22" font-weight="700" fill="var(--ink)">105</text>
  <text x="662" y="476" font-size="16" fill="var(--dim)">盈餘 7</text>

  <text x="80" y="528" font-size="22" font-weight="700" fill="var(--ink)">兩邊一起縮，掉得更深</text>
</svg>
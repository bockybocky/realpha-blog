<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="長條被四段填到八成，八成處一條線指向右邊的空工廠輪廓">
<defs><style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
</style></defs>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="68">第一座工廠的產能　被誰訂走</text>
<rect x="60" y="150" width="700" height="110" rx="8" fill="var(--card)" stroke="var(--line)"/>
<rect x="60" y="150" width="175" height="110" fill="var(--accent)" opacity="0.9"/>
<rect x="235" y="150" width="175" height="110" fill="var(--accent)" opacity="0.72"/>
<rect x="410" y="150" width="175" height="110" fill="var(--accent)" opacity="0.54"/>
<rect x="585" y="150" width="175" height="110" fill="var(--accent)" opacity="0.36"/>
<line x1="235" y1="150" x2="235" y2="260" stroke="var(--page)" stroke-width="3"/>
<line x1="410" y1="150" x2="410" y2="260" stroke="var(--page)" stroke-width="3"/>
<line x1="585" y1="150" x2="585" y2="260" stroke="var(--page)" stroke-width="3"/>
<text class="g" x="147" y="214" text-anchor="middle" fill="var(--page)">20%</text>
<text class="g" x="322" y="214" text-anchor="middle" fill="var(--page)">20%</text>
<text class="g" x="497" y="214" text-anchor="middle">20%</text>
<text class="g" x="672" y="214" text-anchor="middle">20%</text>
<text class="n" x="60" y="292">客戶 甲　　　　　　乙　　　　　　丙　　　　　　丁</text>
<text class="n" x="836" y="214" text-anchor="middle">空著</text>
<line x1="760" y1="120" x2="760" y2="330" stroke="var(--warn)" stroke-width="3" stroke-dasharray="7 6"/>
<text class="c" x="760" y="108" text-anchor="middle">八成＝扳機</text>
<path d="M776 330 L856 330" stroke="var(--warn)" stroke-width="3"/>
<path d="M846 322 L858 330 L846 338" fill="var(--warn)"/>
<rect x="690" y="372" width="200" height="96" rx="8" fill="none" stroke="var(--warn)" stroke-width="3" stroke-dasharray="8 6"/>
<text class="g" x="790" y="428" text-anchor="middle">第二座工廠</text>
<text class="n" x="60" y="430">供給與需求交錯著走</text>
<text class="n" x="60" y="456">訂走的比例到位，才動下一座</text>
</svg>
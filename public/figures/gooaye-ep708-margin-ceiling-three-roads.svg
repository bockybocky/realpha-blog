<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="毛利曲線爬到高檔後停住，前方分出三條路：往上一格帶問號、持平、往下">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="58" font-size="27" fill="var(--ink)">毛利開在高檔之後，只剩三條路</text>
<line x1="130" y1="110" x2="130" y2="470" stroke="var(--line)" stroke-width="2"/>
<line x1="130" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<text x="62" y="124" font-size="16" fill="var(--dim)">毛利</text>
<text x="860" y="500" font-size="16" fill="var(--dim)">時間</text>
<path d="M160 440 C 280 425 380 330 470 250 C 530 210 570 200 600 198" fill="none" stroke="var(--accent)" stroke-width="3"/>
<circle cx="600" cy="198" r="7" fill="var(--accent)"/>
<path d="M600 198 L870 130" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="770" y="116" font-size="20" fill="var(--accent)">再往上？</text>
<path d="M600 198 L870 198" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="800" y="188" font-size="20" fill="var(--dim)">持平</text>
<path d="M600 198 C 700 240 780 310 870 370" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 7"/>
<text x="800" y="400" font-size="20" fill="var(--dim)">往下</text>
<text x="300" y="300" font-size="16" fill="var(--dim)">已經解釋完的漲幅</text>
<text x="130" y="525" font-size="22" fill="var(--ink)">往上那一格，要有人說得出來</text>
</svg>
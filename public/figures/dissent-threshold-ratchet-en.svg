<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A row of hollow circles for zero-dissent meetings runs along the baseline while the threshold line steps upward, and the last bar must be very tall to clear it">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="56" font-size="27" fill="var(--ink)">No dissent raises the bar</text>

<path d="M90 420 L890 420" stroke="var(--line)" stroke-width="2"/>
<circle cx="120" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="165" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="210" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="255" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="300" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="345" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="390" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="435" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="480" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="525" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="570" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="615" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="660" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="705" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="750" cy="420" r="7" fill="none" stroke="var(--grey)" stroke-width="2"/>

<path d="M100 372 L235 372 L235 336 L370 336 L370 300 L505 300 L505 262 L640 262 L640 224 L790 224"
      stroke="var(--dim)" stroke-width="2.5" fill="none"/>
<text x="104" y="360" font-size="16" fill="var(--dim)">Mental threshold</text>

<rect x="800" y="196" width="46" height="224" rx="6" fill="var(--warn)"/>
<text x="762" y="176" font-size="19" fill="var(--warn)">Next dissenter</text>

<text x="120" y="458" font-size="16" fill="var(--dim)">Many meetings: zero dissents</text>
<text x="60" y="516" font-size="22" fill="var(--ink)">Habit does not fade</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="An input side crowded with stacked blocks on the left, an empty dashed box standing for the result side on the right, and an arrow between them labeled as having no numbers.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">Input side full, result side empty</text>
  <text x="80" y="124" font-size="20" fill="var(--accent)">Inputs</text>
  <rect x="80" y="140" width="300" height="52" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="100" y="173" font-size="16" fill="var(--ink)">Budget added</text>
  <rect x="80" y="202" width="300" height="52" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="100" y="235" font-size="16" fill="var(--ink)">Revised plans</text>
  <rect x="80" y="264" width="300" height="52" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="100" y="297" font-size="16" fill="var(--ink)">Stocks counted</text>
  <rect x="80" y="326" width="300" height="52" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="100" y="359" font-size="16" fill="var(--ink)">Hospital retrofits</text>
  <rect x="80" y="388" width="300" height="52" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="100" y="421" font-size="16" fill="var(--ink)">Blood supply</text>
  <line x1="420" y1="290" x2="530" y2="290" stroke="var(--grey)" stroke-width="3"/>
  <polygon points="530,282 552,290 530,298" fill="var(--grey)"/>
  <text x="408" y="258" font-size="16" fill="var(--warn)">No numbers</text>
  <text x="600" y="124" font-size="20" fill="var(--dim)">Results</text>
  <rect x="600" y="140" width="280" height="300" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="624" y="290" font-size="16" fill="var(--dim)">In real conditions</text>
  <text x="624" y="316" font-size="16" fill="var(--dim)">proven in drills</text>
  <text x="60" y="520" font-size="22" fill="var(--ink)">Inputs aren't proof it works.</text>
</svg>
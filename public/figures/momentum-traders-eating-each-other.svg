<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="四個節點排成圓環，箭頭首尾相接形成閉環，中央寫互相殺">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .title { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:19px; fill:var(--ink); font-weight:600; }
    .body { font-size:16px; fill:var(--dim); }
    .concl { font-size:22px; fill:var(--ink); font-weight:600; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t title" x="60" y="56">砍你的人，也在等你砍他</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--warn)"/>
    </marker>
  </defs>

  <circle cx="480" cy="300" r="170" fill="none" stroke="var(--line)"/>
  <g stroke="var(--warn)" stroke-width="3" fill="none" marker-end="url(#ar)">
    <path d="M 555 145 A 170 170 0 0 1 635 300"/>
    <path d="M 635 355 A 170 170 0 0 1 555 452"/>
    <path d="M 405 455 A 170 170 0 0 1 325 355"/>
    <path d="M 325 300 A 170 170 0 0 1 405 145"/>
  </g>

  <g>
    <rect x="390" y="90" width="180" height="56" rx="12" fill="var(--card)" stroke="var(--accent)"/>
    <text class="t grp" x="480" y="125" text-anchor="middle">追高進場</text>
    <rect x="640" y="272" width="180" height="56" rx="12" fill="var(--card)" stroke="var(--accent)"/>
    <text class="t grp" x="730" y="307" text-anchor="middle">形態轉弱</text>
    <rect x="390" y="454" width="180" height="56" rx="12" fill="var(--card)" stroke="var(--accent)"/>
    <text class="t grp" x="480" y="489" text-anchor="middle">盤前開低</text>
    <rect x="140" y="272" width="180" height="56" rx="12" fill="var(--card)" stroke="var(--accent)"/>
    <text class="t grp" x="230" y="307" text-anchor="middle">一刀砍出</text>
  </g>

  <text class="t concl" x="480" y="294" text-anchor="middle">互相殺</text>
  <text class="t body" x="480" y="326" text-anchor="middle">找不到外人</text>
</svg>
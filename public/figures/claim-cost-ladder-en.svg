<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Four steps: an empty shell exhibit is lowest, saying it yourself is higher, a working exhibit higher still, and a customer putting its logo at your door is highest.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .d { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="t" x="60" y="52">One show, 4 claims</text>

  <line x1="100" y1="440" x2="100" y2="110" stroke="var(--line)" stroke-width="2"/>
  <line x1="100" y1="440" x2="910" y2="440" stroke="var(--line)" stroke-width="2"/>
  <text class="d" x="60" y="100">Weight</text>

  <rect x="140" y="408" width="150" height="32" fill="var(--warn)"/>
  <rect x="330" y="356" width="150" height="84" fill="var(--grey)"/>
  <rect x="520" y="250" width="150" height="190" fill="var(--accent)" opacity="0.55"/>
  <rect x="710" y="150" width="150" height="290" fill="var(--accent)"/>

  <text class="g" x="152" y="398">Shell</text>
  <text class="g" x="342" y="346">Own word</text>
  <text class="g" x="532" y="240">It runs</text>
  <text class="g" x="722" y="140">Client</text>

  <text class="d" x="152" y="472">Static</text>
  <text class="d" x="342" y="472">Free</text>
  <text class="d" x="532" y="472">Askable</text>
  <text class="d" x="722" y="472">Their risk</text>

  <text class="c" x="60" y="528">A claim needing a nod</text>
</svg>
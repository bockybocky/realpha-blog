<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一個起點分出三條岔路，各自通往一種破局方式與要看的事實">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<defs>
<marker id="arw8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
</marker>
</defs>
<text x="60" y="52" font-size="27" fill="var(--ink)">三條岔路</text>
<circle cx="150" cy="290" r="62" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="150" y="284" font-size="19" fill="var(--ink)" text-anchor="middle">自產</text>
<text x="150" y="308" font-size="19" fill="var(--ink)" text-anchor="middle">自用</text>
<g stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#arw8)">
<path d="M214 268 C 360 180 420 160 540 160"/>
<path d="M214 290 C 380 290 420 290 540 290"/>
<path d="M214 312 C 360 400 420 420 540 420"/>
</g>
<rect x="556" y="122" width="344" height="76" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="580" y="152" font-size="20" fill="var(--ink)">接外單</text>
<text x="580" y="180" font-size="16" fill="var(--dim)">看客戶名單</text>
<rect x="556" y="252" width="344" height="76" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="580" y="282" font-size="20" fill="var(--ink)">多租戶園區</text>
<text x="580" y="310" font-size="16" fill="var(--dim)">看租約</text>
<rect x="556" y="382" width="344" height="76" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="580" y="412" font-size="20" fill="var(--ink)">股權供血</text>
<text x="580" y="440" font-size="16" fill="var(--dim)">看融資公告</text>
<text x="60" y="524" font-size="22" fill="var(--ink)">每條路都有可看的事實</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The Treasury debt line climbs while dealer capacity stays flat, and the gap between the two lines keeps getting wider.">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<text class="t" x="480" y="56" text-anchor="middle">Debt grows, desks don't</text>
<line x1="140" y1="450" x2="860" y2="450" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="170" y="482" text-anchor="middle">2025</text>
<text class="b" x="830" y="482" text-anchor="middle">2035</text>
<polygon points="170,320 830,130 830,390 170,390" fill="var(--warn)" opacity="0.14"/>
<line x1="170" y1="390" x2="830" y2="390" stroke="var(--grey)" stroke-width="5" stroke-linecap="round"/>
<line x1="170" y1="320" x2="830" y2="130" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
<circle cx="170" cy="320" r="7" fill="var(--accent)"/>
<circle cx="830" cy="130" r="7" fill="var(--accent)"/>
<text class="g" x="170" y="300" text-anchor="middle">$30T</text>
<text class="g" x="800" y="112" text-anchor="middle">~$57T</text>
<text class="g" x="470" y="208" text-anchor="middle" style="fill:var(--accent)">US debt</text>
<text class="g" x="500" y="426" text-anchor="middle" style="fill:var(--dim)">Dealer capacity</text>
<text class="b" x="560" y="345" text-anchor="middle">Filled by PTFs</text>
<line x1="852" y1="130" x2="852" y2="390" stroke="var(--warn)" stroke-width="2"/>
<line x1="844" y1="130" x2="860" y2="130" stroke="var(--warn)" stroke-width="2"/>
<line x1="844" y1="390" x2="860" y2="390" stroke="var(--warn)" stroke-width="2"/>
<text class="c" x="866" y="268" style="fill:var(--warn)">Gap</text>
</svg>
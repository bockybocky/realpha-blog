<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Two points lie diagonally opposite on a two-axis plane, with the more vivid news item having less cash-flow impact and vice versa.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text class="t" x="60" y="58" font-size="27" fill="var(--ink)">Sensational first does not mean important first</text>
<line x1="180" y1="470" x2="860" y2="470" stroke="var(--line)" stroke-width="2"/>
<polygon points="860,470 842,461 842,479" fill="var(--line)"/>
<line x1="180" y1="470" x2="180" y2="120" stroke="var(--line)" stroke-width="2"/>
<polygon points="180,120 171,138 189,138" fill="var(--line)"/>
<text class="t" x="700" y="508" font-size="19" fill="var(--dim)">Vividness</text>
<text class="t" x="200" y="140" font-size="19" fill="var(--dim)">Cash-flow impact</text>
<line x1="180" y1="300" x2="860" y2="300" stroke="var(--line)" stroke-width="1" stroke-dasharray="5 6"/>
<line x1="520" y1="120" x2="520" y2="470" stroke="var(--line)" stroke-width="1" stroke-dasharray="5 6"/>
<circle cx="740" cy="412" r="14" fill="var(--grey)"/>
<text class="t" x="740" y="384" font-size="20" fill="var(--ink)" text-anchor="middle">Personnel news</text>
<circle cx="320" cy="196" r="14" fill="var(--accent)"/>
<text class="t" x="320" y="238" font-size="20" fill="var(--ink)" text-anchor="middle">Demand delayed 20%</text>
<text class="t" x="60" y="552" font-size="22" fill="var(--ink)">Opposite corners produce opposite rankings</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="債務是一條二十年不動的水平線，物價線從同一起點一路下滑，兩線之間張開的缺口被填色標為磨石">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="48" y="58" font-size="27" fill="var(--ink)">東西變便宜了，欠的錢沒有</text>

  <path d="M 110 170 L 860 170 L 860 380 L 110 170 Z" fill="var(--card)"/>
  <line x1="110" y1="170" x2="860" y2="170" stroke="var(--warn)" stroke-width="4"/>
  <path d="M 110 170 L 360 236 L 610 312 L 860 380" fill="none" stroke="var(--accent)" stroke-width="4"/>

  <text x="120" y="148" font-size="20" fill="var(--warn)">債務</text>
  <text x="180" y="148" font-size="16" fill="var(--dim)">不動</text>
  <text x="860" y="418" font-size="20" fill="var(--accent)" text-anchor="end">物價</text>
  <text x="860" y="442" font-size="16" fill="var(--dim)" text-anchor="end">二十年 −30%</text>

  <text x="520" y="268" font-size="19" fill="var(--dim)" text-anchor="middle">磨石</text>

  <line x1="110" y1="470" x2="860" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text x="110" y="496" font-size="16" fill="var(--grey)">1873</text>
  <text x="860" y="496" font-size="16" fill="var(--grey)" text-anchor="end">二十年後</text>

  <text x="480" y="534" font-size="22" fill="var(--ink)" text-anchor="middle">跌的是價格，不是你欠的那個數字</text>
</svg>
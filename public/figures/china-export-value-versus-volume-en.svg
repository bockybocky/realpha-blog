<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A short bar for dollar value beside a much taller one for physical volume, with the gap marked as taken by prices.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .grp { font-size:20px; fill:var(--ink); font-weight:700; }
    .bdy { font-size:16px; fill:var(--dim); }
    .end { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="ttl" x="60" y="62">The same data, two rulers</text>
  <line x1="110" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="2"/>
  <rect x="200" y="401" width="150" height="39" fill="var(--grey)"/>
  <rect x="620" y="180" width="150" height="260" fill="var(--accent)"/>
  <text class="grp" x="275" y="388" text-anchor="middle">1.5%</text>
  <text class="grp" x="695" y="167" text-anchor="middle">10%</text>
  <text class="grp" x="275" y="476" text-anchor="middle">In dollars</text>
  <text class="grp" x="695" y="476" text-anchor="middle">In volume</text>
  <line x1="480" y1="190" x2="480" y2="395" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <polygon points="480,180 472,200 488,200" fill="var(--warn)"/>
  <polygon points="480,405 472,385 488,385" fill="var(--warn)"/>
  <text class="bdy" x="498" y="292">Export prices falling</text>
  <text class="end" x="60" y="512">The difference went to price</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Seven equal short bars for seven suppliers each claiming half the market, and a long bar of their sum overshooting the dashed one-hundred-percent line.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">Seven firms each claim half</text>
  <text x="170" y="104" font-size="19" fill="var(--dim)">As claimed</text>
  <line x1="350" y1="112" x2="350" y2="470" stroke="var(--dim)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="360" y="104" font-size="16" fill="var(--dim)">Whole market 100%</text>

  <text x="158" y="138" font-size="16" fill="var(--dim)" text-anchor="end">A</text>
  <rect x="170" y="120" width="90" height="26" rx="3" fill="var(--accent)"/>
  <text x="270" y="139" font-size="15" fill="var(--dim)">50%</text>

  <text x="158" y="176" font-size="16" fill="var(--dim)" text-anchor="end">B</text>
  <rect x="170" y="158" width="90" height="26" rx="3" fill="var(--accent)"/>
  <text x="270" y="177" font-size="15" fill="var(--dim)">50%</text>

  <text x="158" y="214" font-size="16" fill="var(--dim)" text-anchor="end">C</text>
  <rect x="170" y="196" width="90" height="26" rx="3" fill="var(--accent)"/>
  <text x="270" y="215" font-size="15" fill="var(--dim)">50%</text>

  <text x="158" y="252" font-size="16" fill="var(--dim)" text-anchor="end">D</text>
  <rect x="170" y="234" width="90" height="26" rx="3" fill="var(--accent)"/>
  <text x="270" y="253" font-size="15" fill="var(--dim)">50%</text>

  <text x="158" y="290" font-size="16" fill="var(--dim)" text-anchor="end">E</text>
  <rect x="170" y="272" width="90" height="26" rx="3" fill="var(--accent)"/>
  <text x="270" y="291" font-size="15" fill="var(--dim)">50%</text>

  <text x="158" y="328" font-size="16" fill="var(--dim)" text-anchor="end">F</text>
  <rect x="170" y="310" width="90" height="26" rx="3" fill="var(--accent)"/>
  <text x="270" y="329" font-size="15" fill="var(--dim)">50%</text>

  <text x="158" y="366" font-size="16" fill="var(--dim)" text-anchor="end">G</text>
  <rect x="170" y="348" width="90" height="26" rx="3" fill="var(--accent)"/>
  <text x="270" y="367" font-size="15" fill="var(--dim)">50%</text>

  <text x="158" y="433" font-size="19" fill="var(--ink)" text-anchor="end">Sum</text>
  <rect x="170" y="404" width="630" height="46" rx="4" fill="var(--warn)"/>
  <text x="786" y="435" font-size="20" fill="var(--page)" text-anchor="end">350%</text>
  <text x="60" y="522" font-size="22" fill="var(--ink)">If the sum exceeds one, at least five are wrong</text>
</svg>
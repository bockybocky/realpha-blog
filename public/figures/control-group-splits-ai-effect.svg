<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="左邊單看一根加十的柱子全算給 AI，右邊並排一根加八的對照柱，只剩頂端兩格是 AI">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="48" y="56" font-size="27" font-weight="700" fill="var(--ink)">沒有對照組，景氣的功勞會算到 AI 頭上</text>
<text x="230" y="120" font-size="20" font-weight="700" text-anchor="middle" fill="var(--warn)">只看自己</text>
<text x="700" y="120" font-size="20" font-weight="700" text-anchor="middle" fill="var(--accent)">並排對照</text>
<line x1="480" y1="100" x2="480" y2="490" stroke="var(--line)" stroke-width="2"/>
<line x1="110" y1="440" x2="350" y2="440" stroke="var(--line)" stroke-width="2"/>
<line x1="530" y1="440" x2="880" y2="440" stroke="var(--line)" stroke-width="2"/>
<rect x="170" y="190" width="120" height="250" fill="var(--warn)" opacity="0.3" stroke="var(--warn)" stroke-width="2"/>
<text x="230" y="322" font-size="18" font-weight="700" text-anchor="middle" fill="var(--ink)">全算 AI？</text>
<text x="230" y="176" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">+10</text>
<text x="230" y="468" font-size="16" text-anchor="middle" fill="var(--ink)">導入 AI 的公司</text>
<rect x="560" y="240" width="100" height="200" fill="var(--grey)"/>
<rect x="560" y="190" width="100" height="50" fill="var(--accent)"/>
<rect x="740" y="240" width="100" height="200" fill="var(--grey)"/>
<text x="610" y="346" font-size="16" text-anchor="middle" fill="var(--ink)">景氣</text>
<text x="790" y="346" font-size="16" text-anchor="middle" fill="var(--ink)">景氣</text>
<text x="610" y="176" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">+10</text>
<text x="790" y="226" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">+8</text>
<line x1="660" y1="240" x2="740" y2="240" stroke="var(--dim)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="700" y="222" font-size="18" font-weight="700" text-anchor="middle" fill="var(--accent)">AI +2</text>
<text x="610" y="468" font-size="16" text-anchor="middle" fill="var(--ink)">有 AI</text>
<text x="790" y="468" font-size="16" text-anchor="middle" fill="var(--ink)">沒 AI</text>
<text x="480" y="530" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">拆掉景氣，剩下的才是 AI</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一條寬管的贖回需求收窄成一道細小的閘口，閘前堆積著排隊的方塊，閘後只剩細細一道流出，下方一支時間箭頭指向警示色的字">
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .gd { font-size:19px; fill:var(--dim); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
    .w { font-size:19px; fill:var(--warn); }
    .a { font-size:19px; fill:var(--accent); }
  </style>
  <text class="t" x="60" y="66">閘門只開一道縫</text>
  <path d="M120 170 L470 238 L470 272 L120 350 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="140" y="222">要回 7%</text>
  <text class="g" x="140" y="258">要回 10%</text>
  <text class="g" x="140" y="294">要回 12%</text>
  <rect x="470" y="236" width="26" height="40" fill="var(--warn)"/>
  <text class="w" x="430" y="200">閘門</text>
  <rect x="496" y="246" width="330" height="20" fill="var(--accent)"/>
  <text class="a" x="560" y="232">只給 5%</text>
  <rect x="336" y="228" width="72" height="16" fill="var(--grey)"/>
  <rect x="336" y="250" width="72" height="16" fill="var(--grey)"/>
  <rect x="336" y="272" width="72" height="16" fill="var(--grey)"/>
  <text class="b" x="336" y="386">其他排隊</text>
  <line x1="372" y1="300" x2="372" y2="366" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="120" y1="452" x2="820" y2="452" stroke="var(--dim)" stroke-width="2"/>
  <polygon points="818 444 838 452 818 460" fill="var(--dim)"/>
  <text class="b" x="120" y="444">拖久了</text>
  <text class="w" x="640" y="444">變償付能力</text>
  <text class="c" x="60" y="506">流動性拖久了就是償付能力</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="極短、中等、幾乎滿格的三條橫條長度對比">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
.t{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.h{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:600}
.s{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:600}
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t h" x="480" y="58" text-anchor="middle">一次開多遠，一次能開多遠</text>
<rect x="220" y="130" width="700" height="44" rx="8" fill="var(--card)"/>
<rect x="220" y="225" width="700" height="44" rx="8" fill="var(--card)"/>
<rect x="220" y="320" width="700" height="44" rx="8" fill="var(--card)"/>
<rect x="220" y="130" width="29" height="44" rx="8" fill="var(--accent)"/>
<rect x="220" y="225" width="289" height="44" rx="8" fill="var(--accent)" opacity="0.55"/>
<rect x="220" y="320" width="700" height="44" rx="8" fill="var(--accent)"/>
<text class="t g" x="200" y="160" text-anchor="end">單次平均</text>
<text class="t g" x="200" y="255" text-anchor="end">十分鐘補電</text>
<text class="t g" x="200" y="350" text-anchor="end">新車續航</text>
<text class="t s" x="265" y="160">36.9 公里</text>
<text class="t s" x="525" y="255">372 公里</text>
<text class="t s" x="900" y="350" text-anchor="end" fill="var(--page)">800 至 900 公里</text>
<text class="t c" x="480" y="460" text-anchor="middle">瓶頸已經被搬開</text>
</svg>
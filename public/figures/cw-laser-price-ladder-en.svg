<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The steps rise from nearly flat on the left to towering on the right, with each step higher than the last." font-family="&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
  </style>
  <text x="60" y="56" font-size="27" fill="var(--ink)">Same-class laser price ladder</text>
  <line x1="60" y1="480" x2="900" y2="480" stroke="var(--line)" stroke-width="2"/>

  <rect x="70" y="472" width="118" height="8" fill="var(--grey)"/>
  <text x="70" y="458" font-size="16" fill="var(--dim)">20–50 cents</text>
  <text x="70" y="506" font-size="15" fill="var(--dim)">Comms era</text>

  <rect x="200" y="440" width="118" height="40" fill="var(--grey)"/>
  <text x="200" y="426" font-size="16" fill="var(--ink)">$3–4</text>
  <text x="200" y="506" font-size="15" fill="var(--dim)">70mW</text>

  <rect x="330" y="420" width="118" height="60" fill="var(--grey)"/>
  <text x="330" y="406" font-size="16" fill="var(--ink)">$4–6</text>
  <text x="330" y="506" font-size="15" fill="var(--dim)">100mW</text>
  <rect x="330" y="366" width="118" height="26" fill="none" stroke="var(--warn)" stroke-dasharray="5 4"/>
  <text x="334" y="384" font-size="15" fill="var(--warn)">7–9 out of stock</text>

  <rect x="460" y="360" width="118" height="120" fill="var(--grey)"/>
  <text x="460" y="346" font-size="16" fill="var(--ink)">$15–20</text>
  <text x="460" y="506" font-size="15" fill="var(--dim)">Near-package</text>
  <text x="460" y="528" font-size="15" fill="var(--dim)">120–150mW</text>

  <rect x="590" y="290" width="118" height="190" fill="var(--grey)"/>
  <text x="590" y="276" font-size="16" fill="var(--ink)">About $40</text>
  <text x="590" y="506" font-size="15" fill="var(--dim)">350mW</text>

  <rect x="720" y="186" width="160" height="294" fill="var(--accent)"/>
  <text x="720" y="172" font-size="16" fill="var(--ink)">$50–75</text>
  <text x="720" y="506" font-size="15" fill="var(--dim)">Co-packaged</text>
  <text x="720" y="528" font-size="15" fill="var(--dim)">400mW</text>

  <text x="60" y="110" font-size="19" fill="var(--dim)">Unit price (illustrative height, not to scale)</text>
</svg>
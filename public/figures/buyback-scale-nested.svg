<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="巢狀方框：最大框是四十兆債務總量，內含一個小很多的年度淨利息方框，角落一個極小的點代表回購規模">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; fill:var(--ink); font-weight:700; }
    .gl { font-size:19px; fill:var(--ink); font-weight:700; }
    .bd { font-size:16px; fill:var(--dim); }
    .bs { font-size:15px; fill:var(--dim); }
    .cc { font-size:22px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="ti" x="48" y="58">把回購放進債務裡看</text>
<rect x="48" y="100" width="600" height="400" rx="8" fill="var(--card)" stroke="var(--line)"/>
<text class="gl" x="72" y="140">美債總量</text>
<text class="bd" x="72" y="166">四十兆等級</text>
<rect x="68" y="410" width="95" height="63" fill="var(--grey)"/>
<text class="bd" x="180" y="432">年度淨利息</text>
<text class="bs" x="180" y="456">一兆以上</text>
<rect x="72" y="459" width="10" height="10" fill="var(--accent)"/>
<line x1="82" y1="464" x2="676" y2="464" stroke="var(--accent)" stroke-width="2"/>
<text class="gl" x="690" y="458">回購</text>
<text class="bs" x="690" y="486">＜ 一次兩年期標售</text>
<text class="cc" x="48" y="536">宣布的是利多，露出的是彈藥只有這麼多</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三個圓部分重疊，唯一同時屬於三者的中心小區域被特別標出">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">要三件同時發生</text>

<circle cx="400" cy="250" r="150" fill="var(--card)" stroke="var(--grey)" stroke-width="3"/>
<circle cx="560" cy="250" r="150" fill="var(--card)" stroke="var(--grey)" stroke-width="3" fill-opacity="0.6"/>
<circle cx="480" cy="372" r="150" fill="var(--card)" stroke="var(--grey)" stroke-width="3" fill-opacity="0.6"/>
<circle cx="480" cy="290" r="40" fill="var(--warn)"/>

<text class="t" x="300" y="190" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">機房大延誤</text>
<text class="t" x="664" y="190" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">輝達縮手</text>
<text class="t" x="480" y="486" font-size="19" font-weight="700" fill="var(--ink)" text-anchor="middle">超預期升息</text>

<line x1="520" y1="290" x2="790" y2="214" stroke="var(--warn)" stroke-width="2"/>
<text class="t" x="800" y="208" font-size="19" font-weight="700" fill="var(--warn)">系統性風險</text>
<text class="t" x="800" y="234" font-size="16" fill="var(--dim)">只在這個小點</text>

<text class="t" x="60" y="330" font-size="19" font-weight="700" fill="var(--ink)">一項動</text>
<text class="t" x="60" y="356" font-size="16" fill="var(--dim)">局部承壓</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="左右兩個方框各有箭頭指向中間的方框，兩個方向在中間相遇">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="80" y="76" font-size="27">兩個方向要在中間碰頭</text>
  <rect x="40" y="210" width="250" height="120" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text x="165" y="262" font-size="20" text-anchor="middle">模型擅長什麼</text>
  <text x="165" y="294" font-size="15" fill="var(--dim)" text-anchor="middle">下一個字元預測</text>
  <rect x="670" y="210" width="250" height="120" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text x="795" y="262" font-size="20" text-anchor="middle">客戶哪裡在痛</text>
  <text x="795" y="294" font-size="15" fill="var(--dim)" text-anchor="middle">誰願意付錢</text>
  <rect x="380" y="188" width="200" height="164" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="480" y="248" font-size="22" fill="var(--accent)" text-anchor="middle">法律</text>
  <text x="480" y="286" font-size="15" fill="var(--dim)" text-anchor="middle">結構化的語言</text>
  <text x="480" y="312" font-size="15" fill="var(--dim)" text-anchor="middle">海量判例可檢索</text>
  <text x="334" y="248" font-size="15" fill="var(--dim)" text-anchor="middle">從能力倒推</text>
  <line x1="296" y1="272" x2="364" y2="272" stroke="var(--accent)" stroke-width="2.5"/>
  <polygon points="364,265 378,272 364,279" fill="var(--accent)"/>
  <text x="626" y="248" font-size="15" fill="var(--dim)" text-anchor="middle">從問題倒推</text>
  <line x1="664" y1="272" x2="596" y2="272" stroke="var(--accent)" stroke-width="2.5"/>
  <polygon points="596,265 582,272 596,279" fill="var(--accent)"/>
  <text x="480" y="430" font-size="22" text-anchor="middle">只從一邊推，都會推歪</text>
</svg>
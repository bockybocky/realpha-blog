<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="The heavy work moves from the local side to the server side, while the bars below show dramatic reductions in the time required for two common operations.">
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="56" font-size="27" fill="var(--ink)">Where the heavy work happens</text>
<text x="100" y="110" font-size="20" fill="var(--dim)">Git</text>
<rect x="100" y="130" width="150" height="110" fill="var(--grey)"/>
<text x="118" y="196" font-size="19" fill="var(--page)">Local</text>
<rect x="640" y="214" width="150" height="26" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="658" y="233" font-size="16" fill="var(--dim)">Server</text>
<line x1="100" y1="252" x2="790" y2="252" stroke="var(--line)" stroke-width="2"/>
<text x="540" y="110" font-size="20" fill="var(--dim)">Scion</text>
<rect x="100" y="326" width="150" height="26" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="118" y="345" font-size="16" fill="var(--dim)">Local</text>
<rect x="640" y="242" width="150" height="110" fill="var(--accent)" y2="0" transform="translate(0,0)"/>
<text x="658" y="308" font-size="19" fill="var(--page)">Server</text>
<line x1="100" y1="364" x2="790" y2="364" stroke="var(--line)" stroke-width="2"/>
<text x="60" y="424" font-size="19" fill="var(--ink)">Pull latest</text>
<rect x="240" y="406" width="330" height="22" fill="var(--grey)"/>
<rect x="240" y="434" width="14" height="22" fill="var(--accent)"/>
<text x="586" y="424" font-size="16" fill="var(--dim)">87 seconds</text>
<text x="268" y="452" font-size="16" fill="var(--accent)">3.5 seconds</text>
<text x="60" y="508" font-size="19" fill="var(--ink)">Check status</text>
<rect x="240" y="490" width="330" height="22" fill="var(--grey)"/>
<rect x="240" y="518" width="4" height="22" fill="var(--accent)"/>
<text x="586" y="508" font-size="16" fill="var(--dim)">3.9 seconds</text>
<text x="258" y="536" font-size="16" fill="var(--accent)">19 milliseconds</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="This is a four-row, three-column matrix in which the thyristor, power BJT, and power MOSFET each show one or two hollow gaps, while the IGBT row is filled in all three cells.">
  <defs>
    <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ti" x="40" y="54">Three boxes a good switch must tick</text>

  <rect x="300" y="86" width="620" height="60" rx="8" fill="var(--card)"/>
  <text class="g" x="370" y="124">On like metal</text>
  <text class="g" x="580" y="124">Off cleanly</text>
  <text class="g" x="790" y="124">Fast</text>

  <line x1="40" y1="160" x2="920" y2="160" stroke="var(--line)" stroke-width="2"/>

  <g>
    <text class="g" x="40" y="206">Thyristor</text>
    <text class="b" x="40" y="230">Latches on, stays on</text>
    <circle cx="410" cy="205" r="18" fill="var(--accent)"/>
    <circle cx="620" cy="205" r="18" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="5 6"/>
    <circle cx="830" cy="205" r="18" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="5 6"/>
  </g>
  <line x1="40" y1="256" x2="920" y2="256" stroke="var(--line)"/>

  <g>
    <text class="g" x="40" y="302">Power BJT</text>
    <text class="b" x="40" y="326">Needs constant current</text>
    <circle cx="410" cy="301" r="18" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="5 6"/>
    <circle cx="620" cy="301" r="18" fill="var(--accent)"/>
    <circle cx="830" cy="301" r="18" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="5 6"/>
  </g>
  <line x1="40" y1="352" x2="920" y2="352" stroke="var(--line)"/>

  <g>
    <text class="g" x="40" y="398">Power MOSFET</text>
    <text class="b" x="40" y="422">Can't take high voltage</text>
    <circle cx="410" cy="397" r="18" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="5 6"/>
    <circle cx="620" cy="397" r="18" fill="var(--accent)"/>
    <circle cx="830" cy="397" r="18" fill="var(--accent)"/>
  </g>
  <line x1="40" y1="448" x2="920" y2="448" stroke="var(--line)"/>

  <g>
    <rect x="300" y="458" width="620" height="60" rx="8" fill="var(--card)"/>
    <text class="g" x="40" y="494">IGBT</text>
    <text class="b" x="40" y="518">A graft of both</text>
    <circle cx="410" cy="488" r="18" fill="var(--accent)"/>
    <circle cx="620" cy="488" r="18" fill="var(--accent)"/>
    <circle cx="830" cy="488" r="18" fill="var(--accent)"/>
  </g>
</svg>
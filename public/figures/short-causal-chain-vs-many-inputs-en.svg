<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A thin straight line on the left strings three dots, while on the right five lines converge from different directions into one box, and the right-hand bundle is clearly thicker and more numerous.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .n { font-size:16px; fill:var(--dim); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="60" y="58">My chain vs. the bundle reaching the bill</text>

  <text class="g" x="60" y="118">My original version</text>
  <line x1="70" y1="200" x2="400" y2="200" stroke="var(--grey)" stroke-width="3"/>
  <circle cx="70" cy="200" r="9" fill="var(--grey)"/>
  <circle cx="235" cy="200" r="9" fill="var(--grey)"/>
  <circle cx="400" cy="200" r="9" fill="var(--grey)"/>
  <text class="n" x="46" y="236">Compute</text>
  <text class="n" x="211" y="236">Power use</text>
  <text class="n" x="376" y="236">Price hikes</text>
  <text class="n" x="70" y="300">One line, three dots</text>

  <text class="g" x="540" y="118">Per research</text>
  <rect x="790" y="250" width="120" height="120" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="g" x="818" y="318">Bill</text>
  <path d="M540 150 C 680 150 700 290 788 300" fill="none" stroke="var(--accent)" stroke-width="9"/>
  <path d="M540 220 C 680 220 700 300 788 308" fill="none" stroke="var(--accent)" stroke-width="8"/>
  <path d="M540 300 C 660 300 700 306 788 310" fill="none" stroke="var(--accent)" stroke-width="10"/>
  <path d="M540 380 C 680 380 700 326 788 316" fill="none" stroke="var(--accent)" stroke-width="7"/>
  <path d="M540 450 C 690 450 700 340 788 322" fill="none" stroke="var(--grey)" stroke-width="3"/>
  <text class="n" x="540" y="142">Aging grid</text>
  <text class="n" x="540" y="212">Wildfire defense</text>
  <text class="n" x="540" y="292">Climate resilience</text>
  <text class="n" x="540" y="372">T&amp;D upgrades</text>
  <text class="n" x="540" y="442">Data centers</text>
  <text class="n" x="540" y="500">The thinnest one was my main line</text>
</svg>
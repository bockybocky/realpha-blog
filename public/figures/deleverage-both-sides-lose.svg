<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩條線從同一起點分岔，經過清算與被迫平倉兩道界線後分岔幅度加大，多單向下、空單向上，兩邊同時虧損">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t  { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h1 { font-size:27px; font-weight:700; fill:var(--ink); }
    .lb { font-size:20px; font-weight:700; }
    .bd { font-size:16px; fill:var(--dim); }
    .cc { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

  <text class="t h1" x="60" y="62">同一次清算，多空兩邊一起虧</text>

  <rect x="60" y="100" width="840" height="340" rx="10" fill="var(--card)"/>

  <line x1="420" y1="112" x2="420" y2="428" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="660" y1="112" x2="660" y2="428" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="t bd" x="430" y="134" fill="var(--warn)">清算</text>
  <text class="t bd" x="670" y="134" fill="var(--warn)">被迫平倉</text>

  <polyline points="100,330 260,240 420,190 540,270 660,310 880,412"
            fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="100,330 260,352 420,364 540,330 660,306 880,206"
            fill="none" stroke="var(--grey)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <circle cx="100" cy="330" r="6" fill="var(--ink)"/>
  <circle cx="880" cy="412" r="6" fill="var(--accent)"/>
  <circle cx="880" cy="206" r="6" fill="var(--grey)"/>

  <text class="t lb" x="720" y="440" fill="var(--accent)">多單｜AI 硬體</text>
  <text class="t lb" x="720" y="190" fill="var(--dim)">空單｜軟體</text>

  <text class="t bd" x="150" y="410">漲最多的那一批</text>

  <text class="t cc" x="60" y="492">多單重挫的同時，空單在漲</text>
  <text class="t bd" x="60" y="522">避險部位在極端行情裡不一定避險</text>
</svg>
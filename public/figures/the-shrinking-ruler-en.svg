<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="The same bar measured by two rulers of different scale gives readings of five and seven">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; fill:var(--ink); font-weight:700; }
    .g { font-size:20px; fill:var(--ink); font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); font-weight:600; }
    .n { font-size:27px; fill:var(--ink); font-weight:700; }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="72">The ruler shrank, so the number grew</text>

<rect x="200" y="150" width="560" height="62" rx="8" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text class="g" x="480" y="190" text-anchor="middle">The same cash flow</text>

<text class="b" x="60" y="300">Last year's ruler</text>
<line x1="200" y1="290" x2="760" y2="290" stroke="var(--grey)" stroke-width="3"/>
<line x1="200" y1="274" x2="200" y2="306" stroke="var(--grey)" stroke-width="3"/>
<line x1="312" y1="274" x2="312" y2="306" stroke="var(--grey)" stroke-width="3"/>
<line x1="424" y1="274" x2="424" y2="306" stroke="var(--grey)" stroke-width="3"/>
<line x1="536" y1="274" x2="536" y2="306" stroke="var(--grey)" stroke-width="3"/>
<line x1="648" y1="274" x2="648" y2="306" stroke="var(--grey)" stroke-width="3"/>
<line x1="760" y1="274" x2="760" y2="306" stroke="var(--grey)" stroke-width="3"/>
<text class="n" x="800" y="300">5</text>

<text class="b" x="60" y="400">This year's ruler</text>
<line x1="200" y1="390" x2="760" y2="390" stroke="var(--warn)" stroke-width="3"/>
<line x1="200" y1="374" x2="200" y2="406" stroke="var(--warn)" stroke-width="3"/>
<line x1="280" y1="374" x2="280" y2="406" stroke="var(--warn)" stroke-width="3"/>
<line x1="360" y1="374" x2="360" y2="406" stroke="var(--warn)" stroke-width="3"/>
<line x1="440" y1="374" x2="440" y2="406" stroke="var(--warn)" stroke-width="3"/>
<line x1="520" y1="374" x2="520" y2="406" stroke="var(--warn)" stroke-width="3"/>
<line x1="600" y1="374" x2="600" y2="406" stroke="var(--warn)" stroke-width="3"/>
<line x1="680" y1="374" x2="680" y2="406" stroke="var(--warn)" stroke-width="3"/>
<line x1="760" y1="374" x2="760" y2="406" stroke="var(--warn)" stroke-width="3"/>
<text class="n" x="800" y="400" fill="var(--warn)">7</text>

<text class="c" x="60" y="490">The thing is unchanged; only the reading moved</text>
</svg>
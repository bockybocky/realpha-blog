<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="上半兩條軌道比較坑的大小與間距，MMCD 疏、SD 密；下半雙層碟剖面，一道雷射兩個對焦點，分別落在半透明上層與下層">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">坑做得更小更密，再疊一層</text>

<text x="60" y="118" font-size="19" fill="var(--dim)">MMCD</text>
<line x1="60" y1="150" x2="640" y2="150" stroke="var(--line)" stroke-width="3"/>
<rect x="70" y="138" width="34" height="14" fill="var(--grey)"/>
<rect x="150" y="138" width="34" height="14" fill="var(--grey)"/>
<rect x="230" y="138" width="34" height="14" fill="var(--grey)"/>
<rect x="310" y="138" width="34" height="14" fill="var(--grey)"/>
<rect x="390" y="138" width="34" height="14" fill="var(--grey)"/>
<rect x="470" y="138" width="34" height="14" fill="var(--grey)"/>
<rect x="550" y="138" width="34" height="14" fill="var(--grey)"/>
<text x="670" y="156" font-size="15" fill="var(--dim)">坑 0.45・間距 0.84</text>

<text x="60" y="222" font-size="19" fill="var(--ink)">SD</text>
<line x1="60" y1="254" x2="640" y2="254" stroke="var(--line)" stroke-width="3"/>
<rect x="70" y="244" width="26" height="12" fill="var(--accent)"/>
<rect x="128" y="244" width="26" height="12" fill="var(--accent)"/>
<rect x="186" y="244" width="26" height="12" fill="var(--accent)"/>
<rect x="244" y="244" width="26" height="12" fill="var(--accent)"/>
<rect x="302" y="244" width="26" height="12" fill="var(--accent)"/>
<rect x="360" y="244" width="26" height="12" fill="var(--accent)"/>
<rect x="418" y="244" width="26" height="12" fill="var(--accent)"/>
<rect x="476" y="244" width="26" height="12" fill="var(--accent)"/>
<rect x="534" y="244" width="26" height="12" fill="var(--accent)"/>
<rect x="592" y="244" width="26" height="12" fill="var(--accent)"/>
<text x="670" y="260" font-size="15" fill="var(--accent)">坑 0.40・間距 0.74</text>

<line x1="60" y1="320" x2="900" y2="320" stroke="var(--line)" stroke-width="1"/>

<text x="60" y="366" font-size="19" fill="var(--ink)">雙層</text>
<rect x="200" y="400" width="520" height="22" fill="var(--grey)" opacity="0.45"/>
<rect x="200" y="470" width="520" height="22" fill="var(--grey)" opacity="0.85"/>
<text x="740" y="416" font-size="15" fill="var(--dim)">上層・半透明</text>
<text x="740" y="486" font-size="15" fill="var(--dim)">下層</text>

<path d="M300 556 L 300 424" stroke="var(--accent)" stroke-width="2"/>
<circle cx="300" cy="411" r="7" fill="var(--accent)"/>
<path d="M520 556 L 520 494" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="520" cy="481" r="7" fill="var(--accent)"/>
<text x="150" y="556" font-size="15" fill="var(--dim)">雷射</text>

<text x="620" y="556" font-size="22" fill="var(--ink)">同一面，最多 10GB</text>
</svg>
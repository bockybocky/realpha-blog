<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="同一個起點分岔成上下兩條同樣粗的箭頭">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="48" y="62" font-size="27" fill="var(--ink)" font-weight="700">同一套本事，兩個出口</text>

<circle cx="170" cy="270" r="62" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
<text x="124" y="264" font-size="19" fill="var(--ink)" font-weight="700">找得到</text>
<text x="124" y="292" font-size="19" fill="var(--ink)" font-weight="700">弱點</text>

<path d="M236 240 C 420 150, 520 150, 700 150" stroke="var(--accent)" stroke-width="11" fill="none"/>
<path d="M700 134 L740 150 L700 166 Z" fill="var(--accent)"/>
<text x="756" y="144" font-size="19" fill="var(--ink)">翻過障礙</text>
<text x="756" y="172" font-size="16" fill="var(--dim)">瓊斯海灘</text>

<path d="M236 300 C 420 390, 520 390, 700 390" stroke="var(--warn)" stroke-width="11" fill="none"/>
<path d="M700 374 L740 390 L700 406 Z" fill="var(--warn)"/>
<text x="756" y="384" font-size="19" fill="var(--ink)">除掉提出</text>
<text x="756" y="412" font-size="19" fill="var(--ink)">便宜答案的人</text>

<text x="48" y="480" font-size="22" fill="var(--ink)">沒有兩套，只有同一套被用熟了</text>
</svg>
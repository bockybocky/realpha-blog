<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="避險獲利減去收入虧損後剩下的餘額，流向降價，再流向拉高的載客率" style="font-family:&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text x="80" y="72" font-size="27" fill="var(--ink)">那筆避險收益最後變成什麼</text>

<line x1="80" y1="400" x2="880" y2="400" stroke="var(--line)" stroke-width="2"/>

<rect x="110" y="140" width="90" height="260" fill="var(--accent)"/>
<text x="155" y="128" font-size="19" fill="var(--ink)" text-anchor="middle">1.3 億</text>
<text x="155" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">避險端賺</text>

<text x="232" y="290" font-size="27" fill="var(--dim)">−</text>

<rect x="270" y="270" width="90" height="130" fill="var(--grey)"/>
<text x="315" y="258" font-size="19" fill="var(--ink)" text-anchor="middle">6,500 萬</text>
<text x="315" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">收入端虧</text>

<text x="392" y="290" font-size="27" fill="var(--dim)">=</text>

<rect x="430" y="270" width="90" height="130" fill="var(--accent)" opacity="0.55"/>
<text x="475" y="258" font-size="19" fill="var(--ink)" text-anchor="middle">餘額</text>
<text x="475" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">降價的本錢</text>

<line x1="540" y1="330" x2="620" y2="330" stroke="var(--line)" stroke-width="3"/>
<polygon points="636,330 616,320 616,340" fill="var(--line)"/>

<rect x="650" y="275" width="110" height="60" rx="10" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
<text x="705" y="313" font-size="20" fill="var(--ink)" text-anchor="middle">票價 −20%</text>

<line x1="770" y1="305" x2="800" y2="305" stroke="var(--line)" stroke-width="3"/>
<polygon points="816,305 796,295 796,315" fill="var(--line)"/>

<rect x="830" y="200" width="60" height="200" fill="var(--accent)"/>
<text x="860" y="188" font-size="19" fill="var(--ink)" text-anchor="middle">八到九成</text>
<text x="860" y="432" font-size="16" fill="var(--dim)" text-anchor="middle">載客率</text>

<text x="80" y="500" font-size="22" fill="var(--ink)">從跟隨者變成帶價格的人</text>
</svg>
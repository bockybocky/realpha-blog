<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="上下兩條時間線，上面那條從一九七九延伸到一九八五且後段持續有刻度，下面那條在一九八零遞專利後只剩一個刻度便中斷">
  <defs>
    <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ti { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="ti" x="40" y="54">誰留在場上</text>

  <text class="g" x="40" y="166">GE</text>
  <line x1="130" y1="200" x2="900" y2="200" stroke="var(--accent)" stroke-width="5"/>
  <g fill="var(--accent)">
    <circle cx="170" cy="200" r="11"/><circle cx="330" cy="200" r="11"/>
    <circle cx="470" cy="200" r="11"/><circle cx="560" cy="200" r="11"/>
    <circle cx="650" cy="200" r="11"/><circle cx="730" cy="200" r="11"/>
    <circle cx="800" cy="200" r="11"/><circle cx="860" cy="200" r="11"/>
  </g>
  <text class="b" x="134" y="178">發表</text>
  <text class="b" x="296" y="178">晶圓</text>
  <text class="b" x="436" y="178">展示</text>
  <text class="b" x="534" y="178">上市</text>
  <text class="b" x="648" y="178">專利二十幾件、教科書、內部推銷</text>

  <text class="g" x="40" y="366">RCA</text>
  <line x1="130" y1="400" x2="300" y2="400" stroke="var(--grey)" stroke-width="5"/>
  <line x1="300" y1="400" x2="420" y2="400" stroke="var(--grey)" stroke-width="5" stroke-dasharray="4 14"/>
  <circle cx="230" cy="400" r="11" fill="var(--grey)"/>
  <circle cx="470" cy="400" r="11" fill="var(--grey)"/>
  <text class="b" x="186" y="378">遞專利</text>
  <text class="b" x="436" y="378">商品化</text>
  <text class="b" x="520" y="406">之後轉去別的題目</text>

  <line x1="130" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
  <text class="b" x="152" y="500">1979</text>
  <text class="b" x="432" y="500">1982</text>
  <text class="b" x="692" y="500">1985 東芝不閂鎖版開賣</text>
</svg>
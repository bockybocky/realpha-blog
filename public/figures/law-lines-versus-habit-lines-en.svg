<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A path heading right detours around two solid lines and passes straight through three dashed ones that give way on their own.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    svg { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; } /* 字型：思源黑體優先 */
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="60" y="58" font-size="27" font-weight="700" fill="var(--ink)">Is that line law, or just habit?</text>

<rect x="324" y="220" width="12" height="140" fill="var(--warn)"/>
<rect x="594" y="220" width="12" height="140" fill="var(--warn)"/>

<line x1="200" y1="220" x2="200" y2="268" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="200" y1="312" x2="200" y2="360" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="470" y1="220" x2="470" y2="268" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="470" y1="312" x2="470" y2="360" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="740" y1="220" x2="740" y2="268" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="740" y1="312" x2="740" y2="360" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 5"/>

<path d="M 70,290 L 294,290 C 312,290 312,196 330,196 C 348,196 348,290 366,290 L 564,290 C 582,290 582,196 600,196 C 618,196 618,290 636,290 L 872,290" fill="none" stroke="var(--accent)" stroke-width="3"/>
<path d="M 886,290 L 866,280 L 866,300 Z" fill="var(--accent)"/>

<text x="330" y="180" font-size="16" fill="var(--warn)" text-anchor="middle">Detour</text>
<text x="600" y="180" font-size="16" fill="var(--warn)" text-anchor="middle">Detour</text>
<text x="200" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">Gives way</text>
<text x="470" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">Gives way</text>
<text x="740" y="300" font-size="16" fill="var(--dim)" text-anchor="middle">Gives way</text>

<text x="330" y="392" font-size="19" font-weight="600" fill="var(--warn)" text-anchor="middle">LCR rule</text>
<text x="600" y="392" font-size="19" font-weight="600" fill="var(--warn)" text-anchor="middle">Statute</text>
<text x="200" y="392" font-size="19" fill="var(--dim)" text-anchor="middle">Stigma</text>
<text x="470" y="392" font-size="19" fill="var(--dim)" text-anchor="middle">Custom</text>
<text x="740" y="392" font-size="19" fill="var(--dim)" text-anchor="middle">Habit</text>

<text x="330" y="418" font-size="15" fill="var(--dim)" text-anchor="middle">Written into the rules</text>
<text x="600" y="418" font-size="15" fill="var(--dim)" text-anchor="middle">Cannot be repealed</text>
<text x="470" y="418" font-size="15" fill="var(--dim)" text-anchor="middle">One push tells you</text>

<text x="60" y="482" font-size="22" font-weight="600" fill="var(--ink)">More room to move than people think</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩個左下角對齊的矩形，小的在大的裡面，大矩形的寬與高同時變長">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .ttl { font-size:27px; fill:var(--ink); font-weight:700; }
    .sub { font-size:16px; fill:var(--dim); }
    .grp { font-size:19px; fill:var(--ink); }
    .acc { font-size:19px; fill:var(--accent); font-weight:700; }
    .dimtxt { font-size:15px; fill:var(--dim); }
    .concl { font-size:22px; fill:var(--ink); font-weight:700; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text class="ttl" x="60" y="62">兩個邊同時變長</text>
  <text class="sub" x="60" y="92">Meta 在 Muse 之後：分析師調升獲利預估，也調升願意付的倍數</text>

  <line x1="150" y1="120" x2="150" y2="440" stroke="var(--line)" stroke-width="2"/>
  <line x1="150" y1="440" x2="820" y2="440" stroke="var(--line)" stroke-width="2"/>

  <rect x="150" y="180" width="330" height="260" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>
  <rect x="150" y="300" width="210" height="140" fill="none" stroke="var(--grey)" stroke-width="2.5" stroke-dasharray="7 5"/>

  <text class="acc" x="494" y="196">25 倍</text>
  <text class="dimtxt" x="372" y="316">17 倍</text>
  <text class="dimtxt" x="360" y="468" text-anchor="middle">重估前</text>
  <text class="grp" x="480" y="470" text-anchor="middle">重估後</text>

  <text class="grp" x="70" y="160">倍數</text>
  <text class="grp" x="820" y="470" text-anchor="end">獲利預估</text>

  <text class="grp" x="620" y="230">578 → 740</text>
  <text class="dimtxt" x="620" y="258">三週，本益比 16、17 倍起跳</text>
  <text class="acc" x="620" y="292">＋約 4,500 億美元</text>

  <text class="concl" x="60" y="524">市值＝面積：漲的不只是獲利，是那條沒人預期的腿</text>
</svg>
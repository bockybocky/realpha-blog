<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Two downward bars subtract one percentage point and one upward bar adds it back to the starting point, ending flat.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="72" font-size="27" fill="var(--ink)">Count what others take first, then what AI adds back</text>

  <line x1="80" y1="230" x2="900" y2="230" stroke="var(--dim)" stroke-width="2.5"/>
  <text x="80" y="212" font-size="16" fill="var(--dim)">Original pace</text>

  <rect x="150" y="230" width="120" height="88" fill="var(--warn)"/>
  <rect x="330" y="318" width="120" height="22" fill="var(--warn)"/>
  <line x1="150" y1="340" x2="700" y2="340" stroke="var(--grey)" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="510" y="230" width="120" height="110" fill="var(--accent)"/>
  <rect x="690" y="222" width="120" height="14" fill="var(--ink)"/>

  <text x="210" y="378" font-size="19" fill="var(--ink)" text-anchor="middle">Demographics</text>
  <text x="210" y="404" font-size="16" fill="var(--dim)" text-anchor="middle">−0.8</text>
  <text x="390" y="378" font-size="19" fill="var(--ink)" text-anchor="middle">Climate</text>
  <text x="390" y="404" font-size="16" fill="var(--dim)" text-anchor="middle">−0.2</text>
  <text x="570" y="378" font-size="19" fill="var(--ink)" text-anchor="middle">AI</text>
  <text x="570" y="404" font-size="16" fill="var(--dim)" text-anchor="middle">＋1.0</text>
  <text x="750" y="378" font-size="19" fill="var(--ink)" text-anchor="middle">Result</text>
  <text x="750" y="404" font-size="16" fill="var(--dim)" text-anchor="middle">Flat</text>
  <text x="80" y="440" font-size="15" fill="var(--dim)">Unit: percentage points per year</text>

  <text x="60" y="500" font-size="22" fill="var(--ink)">That 1% buys the old pace, not acceleration</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One grey block of feeling on the left, split on the right into four source buckets of ten small squares, one marked.">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:600; fill:var(--ink); }
    .n { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<text class="t" x="60" y="58">Sort by source before trusting the feeling</text>

<rect x="60" y="100" width="220" height="320" rx="10" fill="var(--grey)"/>
<text class="g" x="104" y="248">Everything feels bad</text>
<text class="n" x="120" y="278">One total</text>

<path d="M 292 260 L 348 260" stroke="var(--dim)" stroke-width="3" fill="none"/>
<polygon points="360,260 344,252 344,268" fill="var(--dim)"/>

<rect x="372" y="100" width="124" height="320" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="n" x="404" y="132">This person</text>
<rect x="396" y="156" width="76" height="40" rx="4" fill="var(--accent)"/>
<rect x="396" y="208" width="76" height="40" rx="4" fill="var(--accent)"/>
<rect x="396" y="260" width="76" height="40" rx="4" fill="var(--warn)"/>
<text class="n" x="388" y="330">One of them</text>
<text class="n" x="388" y="352">Fixable today</text>

<rect x="512" y="100" width="124" height="320" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="n" x="544" y="132">Your fatigue</text>
<rect x="536" y="156" width="76" height="40" rx="4" fill="var(--grey)"/>
<rect x="536" y="208" width="76" height="40" rx="4" fill="var(--grey)"/>
<rect x="536" y="260" width="76" height="40" rx="4" fill="var(--grey)"/>

<rect x="652" y="100" width="124" height="320" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="n" x="684" y="132">Third parties</text>
<rect x="676" y="156" width="76" height="40" rx="4" fill="var(--grey)"/>
<rect x="676" y="208" width="76" height="40" rx="4" fill="var(--grey)"/>

<rect x="792" y="100" width="124" height="320" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="n" x="824" y="132">Poor sleep</text>
<rect x="816" y="156" width="76" height="40" rx="4" fill="var(--grey)"/>
<rect x="816" y="208" width="76" height="40" rx="4" fill="var(--grey)"/>

<text class="c" x="60" y="500">Eight in ten have nothing to do with what you blamed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="Three rising bars: rack power, then two megawatts, then 4.8 megawatts, marked now, next year and 2029.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="580" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" font-weight="600" fill="var(--ink)">Three steps of the power roadmap</text>

  <rect x="140" y="415" width="150" height="55" fill="var(--accent)" fill-opacity="0.3"/>
  <rect x="400" y="320" width="150" height="150" fill="var(--accent)" fill-opacity="0.6"/>
  <rect x="660" y="180" width="150" height="290" fill="var(--accent)"/>

  <text x="215" y="398" font-size="20" text-anchor="middle" fill="var(--ink)">Rack power</text>
  <text x="475" y="303" font-size="20" text-anchor="middle" fill="var(--ink)">2 MW</text>
  <text x="735" y="163" font-size="20" text-anchor="middle" fill="var(--ink)">4.8 MW</text>

  <line x1="100" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>

  <text x="215" y="502" font-size="19" text-anchor="middle" fill="var(--ink)">Rack</text>
  <text x="475" y="502" font-size="19" text-anchor="middle" fill="var(--ink)">Power hall</text>
  <text x="735" y="502" font-size="19" text-anchor="middle" fill="var(--ink)">Data centre</text>

  <text x="215" y="528" font-size="16" text-anchor="middle" fill="var(--dim)">Now</text>
  <text x="475" y="528" font-size="16" text-anchor="middle" fill="var(--dim)">Next year</text>
  <text x="735" y="528" font-size="16" text-anchor="middle" fill="var(--dim)">2029</text>

  <text x="480" y="562" font-size="22" text-anchor="middle" fill="var(--ink)">The dates are written down now</text>
</svg>
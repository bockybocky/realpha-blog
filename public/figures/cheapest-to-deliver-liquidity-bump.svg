<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="流動性隨年紀下滑到底，同齡舊券中只有被拿去期貨交割的那一檔被往上拉起">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
    .t { font-size:27px; font-weight:700; }
    .g { font-size:20px; font-weight:600; }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; }
</style>
<defs>
<marker id="ctd-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
</marker>
</defs>
<text class="t" x="480" y="52" text-anchor="middle">同齡舊券，被拿去交割就回溫</text>
<line x1="130" y1="110" x2="130" y2="430" stroke="var(--line)" stroke-width="2"/>
<line x1="130" y1="430" x2="880" y2="430" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="130" y="98" text-anchor="middle">流動性</text>
<text class="b" x="150" y="462" text-anchor="middle">新券</text>
<text class="b" x="880" y="462" text-anchor="end">發行後年紀 →</text>
<path d="M150,130 C230,380 320,405 870,412" fill="none" stroke="var(--dim)" stroke-width="3"/>
<g fill="var(--grey)">
<circle cx="480" cy="408" r="10"/><circle cx="720" cy="410" r="10"/><circle cx="800" cy="411" r="10"/>
</g>
<circle cx="600" cy="409" r="10" fill="none" stroke="var(--grey)" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="600" y1="396" x2="600" y2="320" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ctd-arr)"/>
<circle cx="600" cy="302" r="12" fill="var(--accent)"/>
<text class="g" x="622" y="296" style="fill:var(--accent)">最便宜可交割券</text>
<text class="b" x="760" y="386" text-anchor="middle">同齡舊券</text>
<text class="c" x="480" y="508" text-anchor="middle">流動性跟著交易走</text>
</svg>
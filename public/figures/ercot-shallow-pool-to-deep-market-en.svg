<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="The shallow, full pool on the left is ancillary services and the much deeper pool on the right is the energy market, with an arrow moving revenue from the shallow pool to the deep one.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <text class="t" x="60" y="60" font-size="27" font-weight="700" fill="var(--ink)">Shallow pool is full, revenue moves to the deep pool</text>

  <rect x="110" y="330" width="280" height="110" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="110" y="330" width="280" height="110" rx="6" fill="var(--grey)" opacity="0.65"/>
  <text class="t" x="250" y="310" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">Ancillary services</text>
  <text class="t" x="250" y="394" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">Saturated</text>
  <text class="t" x="250" y="474" font-size="16" text-anchor="middle" fill="var(--dim)">2022–23 · 90% of revenue</text>

  <rect x="570" y="150" width="280" height="290" rx="6" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="570" y="300" width="280" height="140" rx="6" fill="var(--accent)" opacity="0.8"/>
  <text class="t" x="710" y="130" font-size="20" font-weight="700" text-anchor="middle" fill="var(--ink)">Energy market · arbitrage</text>
  <text class="t" x="710" y="242" font-size="16" text-anchor="middle" fill="var(--dim)">Peak load 60–80 GW</text>
  <text class="t" x="710" y="474" font-size="16" text-anchor="middle" fill="var(--dim)">Today · 80% of revenue</text>

  <path d="M400 360 C 470 360 500 270 560 270" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#ar2)"/>
  <text class="t" x="480" y="248" font-size="19" text-anchor="middle" fill="var(--accent)">Overflow</text>
</svg>
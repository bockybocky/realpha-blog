<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="場次由三場加到六場，票價柱卻同時變高">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t" x="80" y="56">供給加倍，價格也往上</text>

  <rect x="80" y="92" width="380" height="330" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="110" y="132">原本</text>
  <rect x="110" y="156" width="48" height="48" rx="6" fill="var(--accent)"/>
  <rect x="168" y="156" width="48" height="48" rx="6" fill="var(--accent)"/>
  <rect x="226" y="156" width="48" height="48" rx="6" fill="var(--accent)"/>
  <text class="b" x="110" y="232">場次</text>
  <line x1="110" y1="392" x2="430" y2="392" stroke="var(--line)" stroke-width="2"/>
  <rect x="330" y="292" width="80" height="100" rx="6" fill="var(--warn)"/>
  <text class="b" x="330" y="282">票價</text>

  <rect x="500" y="92" width="380" height="330" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text class="g" x="530" y="132">加開之後</text>
  <rect x="530" y="156" width="48" height="48" rx="6" fill="var(--accent)"/>
  <rect x="588" y="156" width="48" height="48" rx="6" fill="var(--accent)"/>
  <rect x="646" y="156" width="48" height="48" rx="6" fill="var(--accent)"/>
  <rect x="530" y="214" width="48" height="48" rx="6" fill="var(--accent)"/>
  <rect x="588" y="214" width="48" height="48" rx="6" fill="var(--accent)"/>
  <rect x="646" y="214" width="48" height="48" rx="6" fill="var(--accent)"/>
  <text class="b" x="530" y="290">場次加倍</text>
  <line x1="530" y1="392" x2="850" y2="392" stroke="var(--line)" stroke-width="2"/>
  <rect x="750" y="262" width="80" height="130" rx="6" fill="var(--warn)"/>
  <text class="b" x="750" y="252">票價更高</text

>
  <text class="c" x="80" y="492">大家要的是同一場</text>
</svg>
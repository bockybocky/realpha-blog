<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="全市場產能的大方框裡，一家公司想買走的部分佔掉三到四成">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="62" font-size="27" fill="var(--ink)">一家要的量，壓在全市場的量上</text>

  <rect x="80" y="130" width="800" height="220" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <rect x="80" y="130" width="300" height="220" rx="8" fill="var(--warn)" opacity="0.35"/>
  <line x1="380" y1="130" x2="380" y2="350" stroke="var(--warn)" stroke-width="2"/>

  <text x="230" y="230" font-size="20" fill="var(--ink)" text-anchor="middle">它想要的</text>
  <text x="230" y="266" font-size="16" fill="var(--dim)" text-anchor="middle">三到四成</text>
  <text x="640" y="230" font-size="20" fill="var(--dim)" text-anchor="middle">其他所有人</text>

  <text x="80" y="392" font-size="16" fill="var(--dim)">全市場明年產能：十幾 GW</text>
  <text x="880" y="392" font-size="16" fill="var(--dim)" text-anchor="end">它明年要：十幾 GW</text>

  <text x="60" y="462" font-size="22" fill="var(--ink)">要買到，和賣得出來，是兩件事</text>
  <text x="60" y="496" font-size="16" fill="var(--dim)">中間還夾著晶圓廠的產能</text>
</svg>
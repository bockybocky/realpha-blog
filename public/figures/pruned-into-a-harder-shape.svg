<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="兩棵樹對照，右邊剪掉兩根弱枝之後剩下的兩根變粗，下方是補回時間軸">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">被修剪過的對手</text>
<rect x="70" y="92" width="380" height="290" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="510" y="92" width="380" height="290" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="260" y="130" text-anchor="middle" font-size="20" fill="var(--ink)">開戰前</text>
<text x="700" y="130" text-anchor="middle" font-size="20" fill="var(--ink)">現在</text>
<line x1="260" y1="350" x2="260" y2="230" stroke="var(--grey)" stroke-width="6"/>
<line x1="260" y1="270" x2="150" y2="200" stroke="var(--grey)" stroke-width="4"/>
<line x1="260" y1="250" x2="185" y2="168" stroke="var(--grey)" stroke-width="4"/>
<line x1="260" y1="250" x2="335" y2="168" stroke="var(--grey)" stroke-width="4"/>
<line x1="260" y1="270" x2="370" y2="200" stroke="var(--grey)" stroke-width="4"/>
<text x="132" y="192" text-anchor="end" font-size="16" fill="var(--dim)">空軍</text>
<text x="178" y="156" text-anchor="end" font-size="16" fill="var(--dim)">海軍</text>
<text x="342" y="156" font-size="16" fill="var(--dim)">飛彈</text>
<text x="378" y="192" font-size="16" fill="var(--dim)">無人機</text>
<line x1="700" y1="350" x2="700" y2="230" stroke="var(--grey)" stroke-width="6"/>
<line x1="700" y1="270" x2="590" y2="200" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="700" y1="250" x2="625" y2="168" stroke="var(--grey)" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="700" y1="250" x2="775" y2="168" stroke="var(--accent)" stroke-width="8"/>
<line x1="700" y1="270" x2="810" y2="200" stroke="var(--accent)" stroke-width="8"/>
<text x="572" y="192" text-anchor="end" font-size="16" fill="var(--grey)">空軍</text>
<text x="618" y="156" text-anchor="end" font-size="16" fill="var(--grey)">海軍</text>
<text x="782" y="156" font-size="16" fill="var(--ink)">飛彈</text>
<text x="818" y="192" font-size="16" fill="var(--ink)">無人機</text>
<text x="70" y="432" font-size="19" fill="var(--ink)">補回時間</text>
<line x1="210" y1="426" x2="820" y2="426" stroke="var(--line)" stroke-width="2"/>
<circle cx="300" cy="426" r="8" fill="var(--accent)"/>
<text x="300" y="460" text-anchor="middle" font-size="16" fill="var(--dim)">無人機　幾個月</text>
<circle cx="740" cy="426" r="8" fill="var(--warn)"/>
<text x="740" y="460" text-anchor="middle" font-size="16" fill="var(--dim)">飛彈　幾年</text>
<text x="480" y="516" text-anchor="middle" font-size="22" fill="var(--ink)">剩下的都是最耐打、最有效的那部分</text>
</svg>
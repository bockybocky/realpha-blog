<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="同一個油價下跌分出兩排結果，上排一上一下抵銷，下排兩個都往下" style="font-family:&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="80" y="72" font-size="27" fill="var(--ink)">油價下跌，真的有另一邊補嗎</text>

<rect x="80" y="230" width="150" height="90" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text x="155" y="270" font-size="20" fill="var(--ink)" text-anchor="middle">油價</text>
<text x="155" y="298" font-size="20" fill="var(--ink)" text-anchor="middle">下跌</text>

<line x1="230" y1="275" x2="300" y2="175" stroke="var(--line)" stroke-width="3"/>
<line x1="230" y1="275" x2="300" y2="400" stroke="var(--line)" stroke-width="3"/>

<text x="312" y="150" font-size="19" fill="var(--dim)">以為的對稱</text>
<rect x="312" y="165" width="560" height="110" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<polygon points="400,255 384,225 416,225" fill="var(--accent)"/>
<line x1="400" y1="255" x2="400" y2="190" stroke="var(--accent)" stroke-width="4"/>
<text x="430" y="212" font-size="16" fill="var(--ink)">買油變便宜</text>
<polygon points="650,255 634,225 666,225" fill="var(--grey)" transform="rotate(180 650 240)"/>
<line x1="650" y1="185" x2="650" y2="235" stroke="var(--grey)" stroke-width="4"/>
<text x="680" y="212" font-size="16" fill="var(--dim)">避險帳面虧</text>
<text x="820" y="255" font-size="16" fill="var(--dim)">抵銷</text>

<text x="312" y="375" font-size="19" fill="var(--warn)">實際發生的</text>
<rect x="312" y="390" width="560" height="110" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
<line x1="400" y1="410" x2="400" y2="460" stroke="var(--warn)" stroke-width="4"/>
<polygon points="400,480 384,450 416,450" fill="var(--warn)"/>
<text x="430" y="437" font-size="16" fill="var(--ink)">經濟差・座位空</text>
<line x1="680" y1="410" x2="680" y2="460" stroke="var(--warn)" stroke-width="4"/>
<polygon points="680,480 664,450 696,450" fill="var(--warn)"/>
<text x="710" y="437" font-size="16" fill="var(--ink)">油沒燒掉</text>

<text x="80" y="542" font-size="22" fill="var(--ink)">保護的東西，和需求綁在一起</text>
</svg>
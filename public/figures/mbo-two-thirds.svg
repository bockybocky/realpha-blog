<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="應募股數停在三分之二門檻左側，加上 Dalton 約一成才跨過門檻">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="58" font-size="27" fill="var(--ink)">差的就是那一成</text>

  <rect x="140" y="200" width="700" height="60" rx="6" fill="var(--card)" stroke="var(--line)"/>
  <rect x="140" y="200" width="460" height="60" rx="6" fill="var(--grey)"/>
  <rect x="600" y="200" width="112" height="60" fill="var(--accent)"/>

  <text x="370" y="238" font-size="19" fill="var(--page)" text-anchor="middle">應募股數</text>
  <text x="656" y="238" font-size="16" fill="var(--page)" text-anchor="middle">Dalton 約一成</text>

  <line x1="627" y1="160" x2="627" y2="300" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="627" y="146" font-size="19" fill="var(--warn)" text-anchor="middle">法定三分之二</text>

  <text x="370" y="330" font-size="16" fill="var(--dim)" text-anchor="middle">其他基金嫌價格低，投反對</text>
  <text x="760" y="330" font-size="16" fill="var(--accent)" text-anchor="middle">市場轉向：會成</text>

  <text x="480" y="452" font-size="22" fill="var(--ink)" text-anchor="middle">當年最像敵人的那一手，是跨過門檻的那一手</text>
</svg>
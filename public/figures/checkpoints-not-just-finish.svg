<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="上下兩條路徑，上條只有終點一個點，下條沿路有八個點">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
  <text x="60" y="66" font-size="27" fill="var(--ink)">終點只有一個，檢查點可以很多</text>
  <rect x="60" y="110" width="840" height="150" rx="16" fill="var(--card)" stroke="var(--line)"/>
  <text x="92" y="150" font-size="19" fill="var(--dim)">只看終點</text>
  <line x1="120" y1="210" x2="840" y2="210" stroke="var(--grey)" stroke-width="4"/>
  <circle cx="840" cy="210" r="14" fill="var(--grey)"/>
  <rect x="60" y="300" width="840" height="170" rx="16" fill="var(--card)" stroke="var(--line)"/>
  <text x="92" y="340" font-size="19" fill="var(--accent)">每段驗收</text>
  <line x1="120" y1="400" x2="840" y2="400" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="120" cy="400" r="9" fill="var(--accent)"/>
  <circle cx="223" cy="400" r="9" fill="var(--accent)"/>
  <circle cx="326" cy="400" r="9" fill="var(--accent)"/>
  <circle cx="429" cy="400" r="9" fill="var(--accent)"/>
  <circle cx="532" cy="400" r="9" fill="var(--accent)"/>
  <circle cx="635" cy="400" r="9" fill="var(--accent)"/>
  <circle cx="738" cy="400" r="9" fill="var(--accent)"/>
  <circle cx="840" cy="400" r="14" fill="var(--accent)"/>
  <text x="120" y="440" font-size="15" fill="var(--dim)" text-anchor="middle">起跑</text>
  <text x="326" y="440" font-size="15" fill="var(--dim)" text-anchor="middle">10 公里</text>
  <text x="840" y="440" font-size="15" fill="var(--dim)" text-anchor="middle">31 公里</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一個判斷分岔成兩支，上支對世界的描述可查證，下支推出的行動底下掛著三個未說出口的假設">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
  <text x="60" y="66" font-size="27" font-weight="700" fill="var(--ink)">一個判斷，拆成兩半分開評分</text>

  <rect x="60" y="230" width="180" height="90" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text x="84" y="270" font-size="19" font-weight="700" fill="var(--ink)">一份報告</text>
  <text x="84" y="296" font-size="15" fill="var(--dim)">一九六〇</text>

  <path d="M240 275 L300 275 L300 180 L380 180" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M240 275 L300 275 L300 370 L380 370" fill="none" stroke="var(--warn)" stroke-width="3"/>

  <rect x="380" y="140" width="330" height="80" rx="12" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
  <text x="404" y="172" font-size="19" font-weight="700" fill="var(--ink)">對世界的描述</text>
  <text x="404" y="200" font-size="15" fill="var(--dim)">油價會低迷</text>
  <text x="730" y="188" font-size="19" font-weight="700" fill="var(--accent)">可查證</text>

  <rect x="380" y="330" width="330" height="80" rx="12" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/>
  <text x="404" y="362" font-size="19" font-weight="700" fill="var(--ink)">推出的行動</text>
  <text x="404" y="390" font-size="15" fill="var(--dim)">所以做辦公室設備</text>
  <text x="730" y="378" font-size="19" font-weight="700" fill="var(--warn)">藏著假設</text>

  <line x1="450" y1="410" x2="450" y2="440" stroke="var(--grey)" stroke-width="2"/>
  <line x1="545" y1="410" x2="545" y2="440" stroke="var(--grey)" stroke-width="2"/>
  <line x1="640" y1="410" x2="640" y2="440" stroke="var(--grey)" stroke-width="2"/>
  <rect x="400" y="440" width="100" height="40" rx="8" fill="var(--grey)"/>
  <rect x="495" y="440" width="100" height="40" rx="8" fill="var(--grey)"/>
  <rect x="590" y="440" width="100" height="40" rx="8" fill="var(--grey)"/>
  <text x="428" y="466" font-size="16" fill="var(--page)">能力</text>
  <text x="523" y="466" font-size="16" fill="var(--page)">時機</text>
  <text x="618" y="466" font-size="16" fill="var(--page)">規模</text>

  <text x="60" y="524" font-size="22" font-weight="700" fill="var(--ink)">坑多半不在上面那條</text>
</svg>
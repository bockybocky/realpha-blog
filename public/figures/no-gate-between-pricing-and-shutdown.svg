<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="下斜的坡道分三段，段界只有虛線空門框，沒有實體閘門">
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="60" y="62" font-size="27" fill="var(--ink)">分辨好壞，和全面關門之間</text>
<path d="M80 180 L880 400 L880 430 L80 430 Z" fill="var(--card)"/>
<path d="M80 180 L880 400" stroke="var(--line)" stroke-width="3" fill="none"/>

<text x="100" y="160" font-size="20" fill="var(--dim)">寬鬆</text>
<circle cx="140" cy="196" r="9" fill="var(--grey)"/>

<text x="420" y="248" font-size="20" fill="var(--accent)">分辨好壞</text>
<circle cx="470" cy="287" r="11" fill="var(--accent)"/>
<text x="420" y="330" font-size="16" fill="var(--accent)">現在在這裡</text>

<text x="740" y="352" font-size="20" fill="var(--warn)">全面關門</text>
<circle cx="800" cy="380" r="9" fill="var(--warn)"/>

<line x1="300" y1="200" x2="300" y2="300" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
<line x1="640" y1="290" x2="640" y2="390" stroke="var(--grey)" stroke-width="3" stroke-dasharray="8 8"/>
<text x="300" y="192" font-size="16" fill="var(--dim)">沒有閘門</text>
<text x="640" y="282" font-size="16" fill="var(--dim)">沒有閘門</text>
<text x="60" y="478" font-size="22" fill="var(--ink)">要看的訊號：體質好的，有沒有也借不到錢</text>
</svg>
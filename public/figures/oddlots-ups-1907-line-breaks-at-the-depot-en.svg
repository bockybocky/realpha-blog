<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="The upper line breaks at the depot and its last stretch is only dashed, while the lower line runs unbroken to the front door.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="48" y="62">Cut off</text>

<text class="g" x="48" y="206">1907</text>
<line x1="130" y1="200" x2="470" y2="200" stroke="var(--accent)" stroke-width="7"/>
<circle cx="478" cy="200" r="11" fill="var(--accent)"/>
<text class="b" x="446" y="166">Depot</text>
<line x1="500" y1="200" x2="748" y2="200" stroke="var(--grey)" stroke-width="4" stroke-dasharray="11 7"/>
<line x1="612" y1="184" x2="640" y2="216" stroke="var(--warn)" stroke-width="5"/>
<line x1="640" y1="184" x2="612" y2="216" stroke="var(--warn)" stroke-width="5"/>
<text class="b" x="540" y="246">Go get it</text>
<polygon points="780,208 814,180 848,208" fill="var(--grey)"/>
<rect x="790" y="208" width="48" height="36" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="768" y="276">Home</text>

<text class="g" x="48" y="386">1912</text>
<line x1="130" y1="380" x2="470" y2="380" stroke="var(--accent)" stroke-width="7"/>
<circle cx="478" cy="380" r="11" fill="var(--accent)"/>
<line x1="486" y1="380" x2="786" y2="380" stroke="var(--accent)" stroke-width="7"/>
<polygon points="780,388 814,360 848,388" fill="var(--accent)"/>
<rect x="790" y="388" width="48" height="36" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<text class="b" x="540" y="426">Parcel post</text>

<text class="c" x="48" y="480">Not freight—last miles</text>
</svg>
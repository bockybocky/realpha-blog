<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左右兩欄帳本，一支箭頭把左欄的漂亮結果連到右欄的代價">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<text x="480" y="56" text-anchor="middle" font-size="27" fill="var(--ink)">帳單開在另一欄</text>
<rect x="70" y="96" width="370" height="286" rx="14" fill="var(--card)" stroke="var(--line)"/>
<rect x="520" y="96" width="370" height="286" rx="14" fill="var(--card)" stroke="var(--line)"/>
<text x="102" y="140" font-size="20" fill="var(--ink)">中東　收穫</text>
<text x="552" y="140" font-size="20" fill="var(--ink)">印太　帳單</text>
<circle cx="112" cy="192" r="7" fill="var(--accent)"/>
<text x="134" y="198" font-size="16" fill="var(--ink)">制空權</text>
<circle cx="112" cy="240" r="7" fill="var(--accent)"/>
<text x="134" y="246" font-size="16" fill="var(--ink)">打擊自由</text>
<circle cx="112" cy="288" r="7" fill="var(--accent)"/>
<text x="134" y="294" font-size="16" fill="var(--ink)">自身傷亡低</text>
<circle cx="562" cy="192" r="7" fill="var(--warn)"/>
<text x="584" y="198" font-size="16" fill="var(--ink)">攔截彈少了</text>
<circle cx="562" cy="240" r="7" fill="var(--warn)"/>
<text x="584" y="246" font-size="16" fill="var(--ink)">艦隊調走了</text>
<circle cx="562" cy="288" r="7" fill="var(--warn)"/>
<text x="584" y="294" font-size="16" fill="var(--ink)">演習縮編了</text>
<path d="M250 400 C 320 448, 640 448, 700 404" fill="none" stroke="var(--warn)" stroke-width="2.5"/>
<polygon points="704,396 692,404 704,410" fill="var(--warn)"/>
<text x="480" y="452" text-anchor="middle" font-size="16" fill="var(--dim)">成本移到這一頁</text>
<text x="480" y="500" text-anchor="middle" font-size="22" fill="var(--ink)">漂亮的結果，是誰替它付的錢</text>
</svg>
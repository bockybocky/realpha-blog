<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="左邊一根普通柱子，右邊兩組長條分別縮成一半與不到三成">
<style>svg{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="600" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">退出的帳，卡在資產那一側</text>
<rect x="60" y="100" width="290" height="380" fill="var(--card)"/>
<text x="86" y="140" font-size="20" fill="var(--ink)">負債那一側</text>
<text x="86" y="166" font-size="16" fill="var(--dim)">很大的挑戰</text>
<rect x="86" y="230" width="230" height="46" fill="var(--grey)"/>
<text x="86" y="306" font-size="16" fill="var(--dim)">改成新貨幣去記</text>
<rect x="390" y="100" width="510" height="380" fill="var(--card)"/>
<text x="416" y="140" font-size="20" fill="var(--ink)">資產那一側</text>
<text x="416" y="166" font-size="16" fill="var(--warn)">接近不可能</text>
<text x="416" y="226" font-size="16" fill="var(--dim)">那些債券</text>
<rect x="500" y="206" width="330" height="30" fill="var(--grey)"/>
<rect x="500" y="248" width="165" height="30" fill="var(--accent)"/>
<text x="676" y="271" font-size="16" fill="var(--accent)">值現在的 50 分</text>
<text x="416" y="358" font-size="16" fill="var(--dim)">退休金</text>
<rect x="500" y="338" width="330" height="30" fill="var(--grey)"/>
<rect x="500" y="380" width="80" height="30" fill="var(--warn)"/>
<text x="592" y="403" font-size="16" fill="var(--warn)">剩兩到三成</text>
<text x="876" y="446" font-size="16" fill="var(--dim)" text-anchor="end">而且是一天之內</text>
<text x="60" y="560" font-size="22" fill="var(--ink)">縮掉的那一段，是退休基金與銀行手上的錢</text>
</svg>
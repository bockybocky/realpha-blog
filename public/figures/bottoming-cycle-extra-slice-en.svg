<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A bar standing for all the heat, with a large slice and then a small slice cut from the left end and a long blank section on the right">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .t { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:19px; font-weight:700; fill:var(--ink); }
    .s { font-size:15px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="60">Same heat, one more slice from the tail</text>
<text class="s" x="60" y="98">All the heat burned</text>

<rect x="60" y="176" width="840" height="96" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<rect x="60" y="176" width="252" height="96" rx="8" fill="var(--accent)"/>
<rect x="312" y="176" width="50" height="96" fill="var(--warn)"/>
<line x1="60" y1="150" x2="60" y2="176" stroke="var(--grey)" stroke-width="2"/>
<line x1="312" y1="150" x2="312" y2="176" stroke="var(--grey)" stroke-width="2"/>
<line x1="480" y1="150" x2="480" y2="176" stroke="var(--grey)" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="900" y1="150" x2="900" y2="176" stroke="var(--grey)" stroke-width="2"/>
<text class="s" x="60" y="140">0</text>
<text class="s" x="288" y="140">30%</text>
<text class="s" x="452" y="140">50%</text>
<text class="s" x="864" y="140">All</text>

<line x1="186" y1="272" x2="186" y2="316" stroke="var(--grey)" stroke-width="2"/>
<text class="g" x="132" y="342">Steam turbine</text>
<line x1="337" y1="272" x2="380" y2="330" stroke="var(--warn)" stroke-width="2"/>
<text class="g" x="386" y="342" fill="var(--warn)">Bottoming・old gear</text>
<text class="s" x="386" y="370">10–20% more from the same assets</text>
<text class="s" x="700" y="342">Rest・no</text>
<text class="s" x="452" y="120">Ceiling for new units with a new working fluid</text>

<text class="c" x="60" y="452">No new reactor needed; bolt it onto existing equipment</text>
</svg>
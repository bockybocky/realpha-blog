<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A central pool of code, the arrow leading out blocked by a gate and crossed out, and another arrow looping improvements back into the pool.">
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .t{font-size:27px;font-weight:700;fill:var(--ink)}
    .g{font-size:19px;font-weight:600;fill:var(--ink)}
    .b{font-size:15px;fill:var(--dim)}
    .n{font-size:20px;font-weight:700;fill:var(--ink)}
    .c{font-size:22px;font-weight:700;fill:var(--ink)}
</style>
<text class="t" x="60" y="62">Blocks one way, opens the other</text>

<circle cx="300" cy="250" r="110" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<text class="g" x="300" y="243" text-anchor="middle">Shared</text>
<text class="g" x="300" y="272" text-anchor="middle">code</text>

<line x1="415" y1="250" x2="560" y2="250" stroke="var(--grey)" stroke-width="5"/>
<rect x="560" y="170" width="16" height="160" rx="4" fill="var(--warn)"/>
<g stroke="var(--warn)" stroke-width="5">
<line x1="556" y1="226" x2="588" y2="274"/>
<line x1="588" y1="226" x2="556" y2="274"/>
</g>
<rect x="640" y="214" width="230" height="72" rx="8" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="9 7"/>
<text class="g" x="755" y="258" text-anchor="middle" fill="var(--dim)">Closed product</text>
<text class="b" x="640" y="192">Take, tweak, sell</text>

<path d="M300 365 L300 450 L700 450 L700 390" fill="none" stroke="var(--accent)" stroke-width="5"/>
<polygon points="700,372 712,396 688,396" fill="var(--accent)"/>
<rect x="590" y="320" width="220" height="60" rx="8" fill="var(--accent)"/>
<text class="g" x="700" y="357" text-anchor="middle" fill="var(--page)">Company fixes</text>
<text class="b" x="330" y="440">Ship = share</text>

<text class="c" x="60" y="505">No one can lock it, so all invest</text>
</svg>
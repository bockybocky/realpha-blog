<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One asset, two rulers: the profit multiple gives a lower bar, the revenue multiple one more than twice as tall.">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; font-weight:700; fill:var(--ink); }
    .g { font-size:20px; font-weight:700; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; font-weight:700; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text class="t h" x="60" y="68">One team, a new ruler, a new price</text>

<line x1="60" y1="440" x2="900" y2="440" stroke="var(--line)" stroke-width="3"/>

<rect x="150" y="320" width="180" height="120" rx="8" fill="var(--accent)"/>
<text class="t g" x="150" y="300">£4.6 billion</text>
<text class="t b" x="150" y="472">Ruler: profit multiple</text>
<text class="t b" x="150" y="500">Return · cash flow</text>

<rect x="620" y="150" width="180" height="290" rx="8" fill="var(--warn)" opacity="0.9"/>
<text class="t g" x="620" y="130">10 to 12 billion</text>
<text class="t b" x="620" y="472">Ruler: revenue multiple</text>
<text class="t b" x="620" y="500">Backed out of someone else's deal</text>

<rect x="390" y="300" width="180" height="76" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text class="t g" x="412" y="334">Asset unchanged</text>
<text class="t b" x="412" y="362">Revenue · margin</text>
</svg>
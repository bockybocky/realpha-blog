<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A staircase chart showing about three percent for a thirty-year payback, about five percent for twenty years, and eight percent, all below a threshold line marked double digits.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    .h { font-size:27px; fill:var(--ink); }
    .g { font-size:19px; fill:var(--ink); }
    .b { font-size:16px; fill:var(--dim); }
    .c { font-size:22px; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text class="t h" x="60" y="62">Payback turned into a return</text>
  <text class="t b" x="60" y="92">Flip the years around</text>

  <line x1="60" y1="450" x2="900" y2="450" stroke="var(--line)" stroke-width="2"/>

  <rect x="110" y="400" width="190" height="50" fill="var(--grey)" opacity="0.5"/>
  <text class="t g" x="124" y="432">3%</text>
  <text class="t b" x="110" y="480">30-year payback</text>

  <rect x="340" y="360" width="190" height="90" fill="var(--grey)" opacity="0.65"/>
  <text class="t g" x="354" y="392">5%</text>
  <text class="t b" x="340" y="480">20-year payback</text>

  <rect x="570" y="300" width="190" height="150" fill="var(--accent)" opacity="0.45"/>
  <text class="t g" x="584" y="332">8%</text>
  <text class="t b" x="570" y="480">Often set as the goal</text>

  <line x1="60" y1="200" x2="900" y2="200" stroke="var(--warn)" stroke-width="3" stroke-dasharray="10 6"/>
  <text class="t g" x="60" y="186" fill="var(--warn)">Threshold: double digits</text>
  <text class="t b" x="700" y="186">Below the line: give it back</text>

  <text class="t c" x="60" y="524">No model needed, just a calculator</text>
</svg>
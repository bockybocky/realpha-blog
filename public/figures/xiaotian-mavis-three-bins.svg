<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="五種情況分進三格：對上了進通過，對不上進失敗，跑不起來、讀不到檔、截圖失敗進無法判定；通往通過的虛線被打叉">
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<defs>
<marker id="mki1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
<marker id="mki2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker>
<marker id="mki3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker>
</defs>
<text x="60" y="68" font-size="27" font-weight="700" fill="var(--ink)">檢查結果只有三格</text>
<line x1="280" y1="134" x2="654" y2="135" stroke="var(--accent)" stroke-width="2" marker-end="url(#mki1)"/>
<g fill="none" stroke="var(--dim)" stroke-width="2">
<path d="M280,244 C470,244 500,314 654,314" marker-end="url(#mki3)"/>
<path d="M280,314 L654,314" marker-end="url(#mki3)"/>
<path d="M280,384 C470,384 500,314 654,314" marker-end="url(#mki3)"/>
</g>
<line x1="280" y1="484" x2="654" y2="484" stroke="var(--warn)" stroke-width="2" marker-end="url(#mki2)"/>
<path d="M430,290 C500,230 560,180 648,152" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#mki2)"/>
<circle cx="532" cy="209" r="16" fill="var(--page)" stroke="var(--warn)" stroke-width="2"/>
<text x="532" y="216" font-size="18" text-anchor="middle" fill="var(--warn)">✕</text>
<text x="508" y="190" font-size="15" text-anchor="end" fill="var(--warn)">不准</text>
<g fill="var(--card)" stroke="var(--line)">
<rect x="60" y="110" width="220" height="48" rx="8"/>
<rect x="60" y="220" width="220" height="48" rx="8"/>
<rect x="60" y="290" width="220" height="48" rx="8"/>
<rect x="60" y="360" width="220" height="48" rx="8"/>
<rect x="60" y="460" width="220" height="48" rx="8"/>
</g>
<g font-size="16" text-anchor="middle" fill="var(--ink)">
<text x="170" y="140">對上了</text>
<text x="170" y="250">跑不起來</text>
<text x="170" y="320">讀不到檔</text>
<text x="170" y="390">截圖失敗</text>
<text x="170" y="490">對不上</text>
</g>
<rect x="660" y="100" width="240" height="70" rx="12" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="780" y="143" font-size="22" font-weight="700" text-anchor="middle" fill="var(--accent)">通過</text>
<rect x="660" y="279" width="240" height="70" rx="12" fill="var(--card)" stroke="var(--dim)" stroke-width="2"/>
<text x="780" y="322" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)">無法判定</text>
<rect x="660" y="449" width="240" height="70" rx="12" fill="none" stroke="var(--warn)" stroke-width="2"/>
<text x="780" y="492" font-size="22" font-weight="700" text-anchor="middle" fill="var(--warn)">失敗</text>
</svg>
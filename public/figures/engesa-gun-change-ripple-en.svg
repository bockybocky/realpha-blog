<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Concentric rings spread from a gun change at the centre out through the turret, the hull's weight balance and the overall dimensions, while bars on the right show cost rising from one time to three times.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="62" font-size="27" fill="var(--ink)">Change one gun and you touch far more than the gun</text>

<circle cx="320" cy="310" r="190" fill="none" stroke="var(--line)" stroke-width="2"/>
<circle cx="320" cy="310" r="140" fill="none" stroke="var(--line)" stroke-width="2"/>
<circle cx="320" cy="310" r="92" fill="none" stroke="var(--grey)" stroke-width="2"/>
<circle cx="320" cy="310" r="44" fill="var(--accent)"/>
<text x="286" y="318" font-size="19" fill="var(--page)">Gun change</text>
<text x="272" y="238" font-size="16" fill="var(--dim)">Turret redesign</text>
<text x="226" y="164" font-size="16" fill="var(--dim)">Hull balance and systems</text>
<text x="244" y="142" font-size="16" fill="var(--dim)">Dimensions and weight</text>

<line x1="580" y1="470" x2="900" y2="470" stroke="var(--line)" stroke-width="2"/>
<rect x="620" y="400" width="90" height="70" fill="var(--grey)"/>
<text x="634" y="380" font-size="19" fill="var(--dim)">1x</text>
<rect x="760" y="260" width="90" height="210" fill="var(--warn)"/>
<text x="774" y="240" font-size="19" fill="var(--warn)">3x</text>
<text x="604" y="504" font-size="16" fill="var(--dim)">Cost per turret</text>

<text x="60" y="534" font-size="22" fill="var(--ink)">Cutting to fit a spec cuts across the whole vehicle.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="三條長度不等的橫條，比較現有雷射年供給與新增產能的量級">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    .t { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text class="t" x="60" y="56" font-size="27" font-weight="700" fill="var(--ink)">新開的量，對得上原本的多少</text>
<text class="t" x="60" y="86" font-size="16" fill="var(--dim)">長度＝年供給顆數，同一比例</text>

<text class="t" x="60" y="146" font-size="19" font-weight="600" fill="var(--dim)">現有全球年供給</text>
<rect x="60" y="160" width="600" height="56" rx="6" fill="var(--grey)"/>
<text class="t" x="676" y="196" font-size="19" font-weight="700" fill="var(--ink)">6.08 億顆</text>

<text class="t" x="60" y="268" font-size="19" font-weight="600" fill="var(--dim)">新供應商 2027 第四季</text>
<rect x="60" y="282" width="99" height="56" rx="6" fill="var(--accent)"/>
<text class="t" x="175" y="318" font-size="19" font-weight="700" fill="var(--ink)">1 億顆</text>

<text class="t" x="60" y="390" font-size="19" font-weight="600" fill="var(--dim)">同一家長期推估</text>
<rect x="60" y="404" width="296" height="56" rx="6" fill="var(--accent)" opacity="0.55"/>
<text class="t" x="372" y="440" font-size="19" font-weight="700" fill="var(--ink)">約 3 億顆</text>

<text class="t" x="60" y="498" font-size="16" fill="var(--dim)">都是公司自己講的規劃，不是已出貨的數字</text>
</svg>
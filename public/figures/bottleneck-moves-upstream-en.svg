<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A rising line links four stops: three hollow circles already solved and one solid orange circle where it is stuck now.">
  <style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
    text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; fill:var(--ink); }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
  <text x="480" y="54" font-size="27" text-anchor="middle">Bottlenecks do not vanish, they move</text>

  <polyline points="140,420 370,340 600,260 830,180" fill="none" stroke="var(--line)" stroke-width="3"/>

  <circle cx="140" cy="420" r="13" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
  <circle cx="370" cy="340" r="13" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
  <circle cx="600" cy="260" r="13" fill="var(--page)" stroke="var(--grey)" stroke-width="3"/>
  <circle cx="830" cy="180" r="15" fill="var(--warn)"/>

  <text x="140" y="388" font-size="19" text-anchor="start">Squares on a circle</text>
  <text x="370" y="308" font-size="19" text-anchor="middle">Warpage</text>
  <text x="600" y="228" font-size="19" text-anchor="middle">Thermal expansion</text>
  <text x="830" y="146" font-size="19" text-anchor="end" fill="var(--warn)">Glass process yield</text>
  <text x="830" y="218" font-size="15" text-anchor="end" fill="var(--warn)">Stuck here now</text>

  <text x="480" y="500" font-size="22" text-anchor="middle">Ask which layer is stuck, not who wins</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="左邊一個被劃掉的大方塊，右邊三個散開的小方塊">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
text{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif}
.t{font-size:27px;fill:var(--ink);font-weight:700}
.g{font-size:19px;fill:var(--ink);font-weight:700}
.b{font-size:16px;fill:var(--dim)}
.c{font-size:22px;fill:var(--ink);font-weight:700}
</style>
<rect x="0" y="0" width="960" height="540" fill="var(--page)"/>
<text class="t" x="60" y="72">每場戰爭都是客場</text>
<rect x="70" y="150" width="330" height="200" rx="6" fill="var(--card)" stroke="var(--line)"/>
<rect x="130" y="200" width="210" height="110" rx="4" fill="var(--grey)"/>
<line x1="130" y1="200" x2="340" y2="310" stroke="var(--warn)" stroke-width="7"/>
<line x1="340" y1="200" x2="130" y2="310" stroke="var(--warn)" stroke-width="7"/>
<text class="g" x="70" y="392">一座大工廠</text>
<text class="b" x="70" y="422">開戰第一天就是目標</text>
<line x1="470" y1="140" x2="470" y2="430" stroke="var(--line)" stroke-width="2"/>
<rect x="540" y="160" width="150" height="62" rx="4" fill="var(--accent)" opacity="0.9"/>
<rect x="760" y="230" width="150" height="62" rx="4" fill="var(--accent)" opacity="0.9"/>
<rect x="560" y="300" width="150" height="62" rx="4" fill="var(--accent)" opacity="0.9"/>
<text class="g" x="540" y="392">可展開貨櫃</text>
<text class="b" x="540" y="422">兩小時上手</text>
<text class="c" x="60" y="500">產能分散到打不完，才叫產能</text>
</svg>
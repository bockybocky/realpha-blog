<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="十二個月與十八個月兩條實心短條，後面接一條延伸出畫面的虛線條代表五年十年不知道">
<style>
    svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
          --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706;
          font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
            --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
    }
</style>
<rect x="0" y="0" width="960" height="520" fill="var(--page)"/>
<text x="40" y="58" font-size="27" fill="var(--ink)">回本很快，之後多久不知道</text>

<line x1="150" y1="420" x2="910" y2="420" stroke="var(--line)" stroke-width="2"/>
<g stroke="var(--line)" stroke-width="2">
<line x1="150" y1="414" x2="150" y2="426"/>
<line x1="340" y1="414" x2="340" y2="426"/>
<line x1="530" y1="414" x2="530" y2="426"/>
<line x1="720" y1="414" x2="720" y2="426"/>
</g>
<text x="150" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">0</text>
<text x="340" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">12 個月</text>
<text x="530" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">24</text>
<text x="720" y="450" font-size="16" fill="var(--dim)" text-anchor="middle">36</text>

<rect x="150" y="150" width="190" height="52" fill="var(--accent)"/>
<text x="356" y="186" font-size="20" fill="var(--accent)">12 個月</text>
<rect x="150" y="232" width="285" height="52" fill="var(--accent)" opacity="0.55"/>
<text x="451" y="268" font-size="20" fill="var(--dim)">16 到 18 個月</text>

<rect x="150" y="314" width="760" height="52" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="10 9"/>
<text x="530" y="350" font-size="20" fill="var(--dim)" text-anchor="middle">五年十年　不知道</text>

<text x="480" y="500" font-size="22" fill="var(--ink)" text-anchor="middle">看得清的只有前面那一段</text>
</svg>
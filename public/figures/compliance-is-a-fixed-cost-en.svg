<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A tall bar on the left and a short bar on the right each carry a compliance block of the same size at the base, and the short bar is almost filled by it.">
<style>
svg { --page:#ffffff; --card:#f6f8fc; --line:#dde3ee; --ink:#1a212b;
      --dim:#57616f; --grey:#b9c2d0; --accent:#1f6feb; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  svg { --page:#0d1117; --card:#161b22; --line:#272e39; --ink:#e6edf3;
        --dim:#8b949e; --grey:#4a5464; --accent:#58a6ff; --warn:#d29922; }
}
text { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
.t { font-size:27px; font-weight:700; fill:var(--ink); }
.g { font-size:19px; fill:var(--dim); }
.n { font-size:16px; fill:var(--dim); }
.c { font-size:22px; font-weight:600; fill:var(--ink); }
</style>
<rect x="0" y="0" width="960" height="560" fill="var(--page)"/>
<text x="60" y="58" class="t">One rulebook, two different weights</text>
<path d="M120 470 H880" stroke="var(--line)" stroke-width="2"/>
<rect x="220" y="170" width="180" height="300" fill="var(--accent)"/>
<rect x="220" y="410" width="180" height="60" fill="var(--warn)"/>
<text x="310" y="148" class="g" text-anchor="middle">Large revenue</text>
<text x="310" y="448" class="n" text-anchor="middle" fill="var(--page)">Compliance</text>
<text x="310" y="502" class="n" text-anchor="middle">Spread thin</text>
<rect x="620" y="380" width="180" height="90" fill="var(--accent)"/>
<rect x="620" y="410" width="180" height="60" fill="var(--warn)"/>
<text x="710" y="358" class="g" text-anchor="middle">Small revenue</text>
<text x="710" y="448" class="n" text-anchor="middle" fill="var(--page)">Compliance</text>
<text x="710" y="502" class="n" text-anchor="middle">Eats most of it</text>
<path d="M410 410 H610" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="510" y="400" class="n" text-anchor="middle" fill="var(--warn)">Same thickness</text>
<text x="60" y="540" class="c">Compliance acts like a fixed cost, it does not shrink with revenue</text>
</svg>